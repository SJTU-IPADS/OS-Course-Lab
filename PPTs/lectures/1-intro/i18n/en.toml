['process-isolation.slide.1']
src_hash = 'f55a2ccf'
text = '''
Processes 1832 / 1904 / 2077 from the earlier `ps` output each hold:
- an independent **virtual address space**: the same virtual address `0x7fff...` maps to different physical memory in different processes
- an independent **open file table** and register context
- an execution stream the kernel may ==preempt==
'''
# src:
# 
# **前面 `ps` 输出中的 1832 / 1904 / 2077，各自拥有：**
# - 独立的**虚拟地址空间**：同一虚拟地址 `0x7fff...` 在不同进程中映射到不同的物理内存
# - 独立的**打开文件表**与寄存器上下文
# - 可被内核<mark>抢占</mark>的执行流

['process-isolation.sidenote.1.title']
src_hash = '6be535f5'
text = 'Process isolation confines the effect of a fault'
# src: 进程隔离限制故障传播范围

['process-isolation.sidenote.1.text']
src_hash = '2d78fe16'
text = 'When `ollama-runner` terminates on a segmentation fault, `ollama serve` receives notification that the child process has exited and creates a new runner to continue serving. **The primary function of isolation is to confine a fault to a single process; on that basis it also constitutes a security boundary.**'
# src: `ollama-runner` 因段错误退出时，`ollama serve` 收到子进程结束通知，重新创建推理进程即可继续服务。**隔离的首要作用是把故障限制在一个进程之内；在此基础上，它同时构成安全边界。**

['process-isolation.highlight.1']
src_hash = '24f4e2b1'
text = 'A process is the resource and protection boundary the operating system defines around a running program.'
# src: 进程是操作系统为一个运行中的程序划定的资源与保护边界。

['virtual-address-space.title']
src_hash = 'a5b93caf'
text = 'Typical layout of a process virtual address space'
# src: 进程虚拟地址空间的典型布局

['virtual-address-space.slide.1']
src_hash = '9955c651'
text = '''
- **Text**: machine instructions, normally mapped read-only; a write raises a segmentation fault
- **Data / BSS**: global and static variables
- **Heap**: dynamic memory managed by `malloc` / `new`, growing toward higher addresses
- **Stack**: local variables, return addresses and call frames, growing toward lower addresses
- Between them: **shared libraries and memory-mapped regions**
'''
# src:
# 
# - **Text**：机器指令，通常映射为只读，写入将触发段错误
# - **Data / BSS**：全局变量与静态变量
# - **堆**：由 `malloc` / `new` 管理的动态内存，向高地址增长
# - **栈**：局部变量、返回地址与调用现场，向低地址增长
# - 两者之间：**共享库与内存映射区域**

['virtual-address-space.highlight.1']

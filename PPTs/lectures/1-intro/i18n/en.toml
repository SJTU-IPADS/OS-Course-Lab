['loading-problem.slide.1']
src_hash = '9cb8e03b'
text = 'The most direct implementation reads the entire file into a user-space buffer:'
# src: 最直接的实现是将整个文件读入一块用户态缓冲区：

['loading-problem.slide.2']
src_hash = 'cda15878'
text = '''
This implementation has two problems:
- On a machine with 8 GB of physical memory, the allocation request fails
- Even if allocation succeeds, every byte is **copied twice** (disk → kernel buffer → user buffer), giving a significant startup latency
'''
# src:
# 
# **这一实现存在两个问题：**
# - 在物理内存为 8 GB 的机器上，该分配请求将失败
# - 即使分配成功，每个字节需经**两次拷贝**（磁盘 → 内核缓冲区 → 用户缓冲区），启动延迟显著

['loading-problem.highlight.1']
src_hash = '6c4fed7d'
text = 'The actual implementation does not use this approach: repeated executions of `ollama run` start with very low latency.'
# src: 实际实现并未采用这一方式：`ollama run` 的重复执行启动延迟极低。

['model-loading.title']
src_hash = '39b9620a'
text = 'mmap: the operating system performs the transfer on demand'
# src: mmap：由操作系统按需完成数据装入

['model-loading.slide.1']
src_hash = 'c25fcd20'
text = 'The alternative is a **mapping**: a file range corresponds to an address-space range.'
# src:
# 
# 另一种做法是建立**映射**：把文件的一段区间对应到进程地址空间的一段区间。

['model-loading.highlight.1']
src_hash = 'd5b8914b'
text = 'Model loading is one address-space mapping plus demand paging.'
# src: 模型加载的实质是一次地址空间映射与按需的缺页装入。

['model-loading.notes.1']
src_hash = 'cc210543'
text = '''
This page states the qualitative result only; the virtual-memory chapter covers page tables,
fault handling and reclamation. Lecture the three numbered relations in order: 1 establishing
the mapping copies nothing; 2 an access to the mapped range raises a page fault; 3 the kernel
brings in that one page. This answers the question on the previous page: a machine with 8 GB of
physical memory can run a 4.7 GB model because resident memory follows the pages actually accessed.
'''
# src:
# 
# 本页只讲定性结论，虚拟内存一章会展开页表、缺页处理与回收策略。
# 课堂上按三个编号讲：① 映射建立时不发生拷贝；② 访问映射区触发缺页；
# ③ 内核装入所需的那一页。据此回答上一页的问题：物理内存为 8 GB 的机器
# 之所以能运行 4.7 GB 的模型，是因为常驻内存量取决于实际访问到的页。


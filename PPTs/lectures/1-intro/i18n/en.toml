['course-goals.title']
src_hash = '3bb57deb'
text = 'Course objective: a system model of program execution'
# src: 课程目标：建立程序执行的系统模型

['course-goals.slide.1']
src_hash = '8c550f0e'
text = 'Prerequisites: the basic syntax of C++ — `for` loops, functions, classes, pointers and `std::vector` — together with compiling and running a program from a terminal.'
# src:
# 
# 先修基础：C++ 的基本语法——`for` 循环、函数、类、指针与 `std::vector`，
# 以及在终端中编译并运行一个程序。

['course-goals.slide.2']
src_hash = 'e5e710b5'
text = '''
This course examines the execution mechanisms beneath that syntax:
- How is a `for` loop compiled into the machine instructions a processor executes?
- Which layer allocates the memory `malloc` returns, and why is it invisible to other processes?
- When a program is performance-limited, why does the cost of ==data movement== often exceed that of arithmetic?
'''
# src:
# 
# **本课程讨论这些语法之下的执行机制：**
# - `for` 循环如何被编译为处理器执行的机器指令？
# - `malloc` 返回的内存由谁分配？进程之间为何互相不可见？
# - 程序性能受限时，<mark>数据移动</mark>的开销为何常常超过算术运算？


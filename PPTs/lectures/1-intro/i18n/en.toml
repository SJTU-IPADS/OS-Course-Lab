['why-c.title']
src_hash = '5dda8c7c'
text = 'Why this course uses C'
# src: 本课程使用 C 的原因

['why-c.slide.1']
src_hash = '39f3d811'
text = '''
C has a thin abstraction layer, so system-level detail remains ==directly visible== in the source:
- The points at which memory is requested and released are stated explicitly in the code
- A pointer value is an address in the process virtual address space; `%p` prints a value that corresponds to the layout diagram in the previous section
- Structure alignment and padding are directly observable, and `sizeof` reflects the actual object size
- Most operating system interfaces and native libraries expose a C-compatible ABI, which is the common boundary for cross-language interoperation
'''
# src:
# 
# **C 的抽象层较薄，系统细节在源码层面<mark>直接可见</mark>：**
# - 内存的申请与释放时机在代码中显式给出
# - 指针值即进程虚拟地址空间中的地址，可用 `%p` 输出并与上一节的布局图对应
# - 结构体的对齐与填充可直接观察，`sizeof` 反映对象的实际大小
# - 多数操作系统接口与原生库以 C 兼容 ABI 对外，是跨语言互操作的公共边界

['why-c.highlight.1']
src_hash = '8ed0ca44'
text = 'In this course C serves as an instrument for observing system behaviour.'

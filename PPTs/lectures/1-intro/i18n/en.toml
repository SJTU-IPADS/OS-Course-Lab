text = '''
- **Begin from observable behaviour**: output, latency, memory footprint, utilization and failures are all measurable
- **Trace the execution path**: source → compile · link · load → machine instructions → hardware
- **Identify the responsible layer**: runtime, operating system, memory hierarchy or processor
- **Draw conclusions from evidence**: support the conclusion with measurements

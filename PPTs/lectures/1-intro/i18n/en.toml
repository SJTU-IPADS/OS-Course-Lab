['mmap-in-practice.highlight.1']
src_hash = '1e267b81'
text = 'A difference of this magnitude comes from the mechanism chosen.'
# src: 这一量级的差别由所使用的操作系统机制决定。

['mmap-in-practice.notes.1']
src_hash = 'b9c19266'
text = '''
The commit lists three effects: loading is much faster, larger models become loadable, and several
inference processes can share one copy of the page cache. All three follow from the same cause:
the weight pages are supplied directly by the kernel page cache and no longer copied into a user buffer.
ollama uses llama.cpp as its inference backend and inherits this loading path.
'''
# src:
# 
# 该提交同时给出三点效果：加载显著加快、可加载的模型规模提高、多个推理进程可共享同一份页缓存。
# 三点都由同一个原因得到：权重页由内核的页缓存直接提供，不再复制到用户缓冲区。
# ollama 使用 llama.cpp 作为推理后端，沿用了这一加载方式。

['page-cache.title']
src_hash = '1716efb8'
text = 'The page cache: loading cost on repeated startup'
# src: 页缓存：重复启动时的加载开销

['page-cache.slide.1']
src_hash = '330558b7'
text = '''
Weight pages faulted into DRAM are ==not released immediately== when the process exits; while memory is plentiful, the operating system retains them in the **page cache**.
- On the second startup these pages hit directly, requiring no disk I/O
- Under memory pressure, the kernel evicts them according to its replacement policy
'''
# src:
# 
# **因缺页装入 DRAM 的权重页，在进程退出后<mark>并不立即释放</mark>；**
# 在内存充裕时，操作系统将其保留在**页缓存**中。
# - 第二次启动时这些页直接命中，无需磁盘 I/O
# - 内存压力上升时，内核按替换策略将其淘汰

['page-cache.slide.2']
src_hash = 'e8c57649'
text = 'This accounts for the performance difference between cold and warm starts of the same program.'
# src: **这解释了同一程序冷启动与热启动之间的性能差异。**

['page-cache.highlight.1']
src_hash = '2ed0efe4'
text = 'The same data may reside simultaneously in the storage device, the page cache and device memory.'
# src: 同一份数据可能同时存在于存储设备、页缓存与设备内存中。

['page-cache.aside.1']
src_hash = 'a45c19b4'
text = 'Data replication across levels of storage is discussed further in the chapter on the memory hierarchy.'
# src: 多级存储中的数据副本问题，将在后续的存储层次一章继续讨论。

['devices-and-drivers.title']
src_hash = '284c3393'
text = 'Device access: the GPU is also reached through the operating system'
# src: 设备访问：GPU 同样经由操作系统

['devices-and-drivers.slide.1']
src_hash = '16031b11'
text = '''
The runner cannot submit commands to the GPU directly; its access path is:
- open a **device file** (`/dev/nvidia*` on Linux)
- request device memory, submit kernels and await completion through the **driver**
- rely on the kernel to keep device memory inaccessible across processes
'''
# src:
# 
# **推理进程不能直接向 GPU 提交命令，其访问路径为：**
# - 打开**设备文件**（Linux 上为 `/dev/nvidia*`）
# - 经**驱动程序**申请设备内存、提交核函数并等待完成
# - 由内核保证进程之间的设备内存互不可访问

['devices-and-drivers.slide.2']
src_hash = '3311aa2f'
text = 'Transferring a tensor to device memory is therefore a **data movement across three levels of storage**: page cache → process address space → device memory.'
# src:
# 
# 将张量传输至设备内存，是一次**跨越三级存储的数据移动**：
# **页缓存 → 进程地址空间 → 设备内存。**

['devices-and-drivers.highlight.1']
src_hash = '8a7522fe'
text = 'The cost of cross-level data movement is a principal source of first-token latency.'
# src: 跨层数据移动的开销，是首 token 延迟的主要来源之一。

['scheduling.title']
src_hash = 'c770b074'
text = 'Scheduling under concurrent requests'
# src: 并发请求下的调度

['scheduling.slide.1']
src_hash = '91b5e6ca'
text = '''
The server may handle several requests concurrently. Given a limited number of processor cores, the operating system provides two mechanisms:
- **Preemptive scheduling**: bounds the time any execution stream occupies the processor
- **Blocking wait**: a process waiting on disk, GPU or network yields the processor
'''
# src:
# 
# **服务进程可能同时处理多个请求。在处理器核数有限的条件下，操作系统提供两项机制：**
# - **抢占式调度**：限制单个执行流连续占用处理器的时间
# - **阻塞式等待**：等待磁盘、GPU 或网络的进程让出处理器

['scheduling.slide.2']
src_hash = '03d91f8e'
text = 'Above these, the inference server implements its own scheduling policy: request queueing, continuous batching and admission control.'
# src:
# 
# **推理服务在此之上实现自身的调度策略：**
# **请求排队、连续批处理（continuous batching）与准入控制。**

['scheduling.highlight.1']
src_hash = 'ee035da0'
text = 'The operating system provides mechanism; the layer above determines policy. This distinction runs throughout the course.'
# src: 操作系统提供机制，上层服务决定策略，这一特征贯穿本课程。


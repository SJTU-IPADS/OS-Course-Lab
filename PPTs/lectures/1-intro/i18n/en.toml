['stored-program.title']
src_hash = 'eadfe964'
text = 'The stored-program architecture: instructions and data share memory'
# src: 存储程序体系结构：指令与数据同存于内存

['stored-program.slide.1']
src_hash = 'e981b756'
text = '''
Early computers required ==rewiring== to change program. The stored-program model places instructions in memory alongside data.
- Processor execution reduces to a uniform cycle: fetch → decode → execute
- Changing program becomes changing a sequence of bytes in memory, with no change to the hardware
'''
# src:
# 
# **早期计算机更换程序需要<mark>重新接线</mark>。存储程序思想将指令与数据一同存放在内存中。**
# - 处理器的执行过程统一为：取指 → 译码 → 执行
# - 更换程序即更换内存中的一段字节，无需改变硬件连接


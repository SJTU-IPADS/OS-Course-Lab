['four-themes.title']
src_hash = '6dec8725'
text = 'Four themes running through this course'
# src: 贯穿本课程的四个主题

['four-themes.slide.1']
src_hash = 'f11354f5'
text = '''
- **Abstraction**: an interface separates specification from implementation, allowing both sides to evolve independently (ISA, system calls, language libraries)
- **Representation**: integers, floating-point numbers, characters and model weights are all encoded as bits; their meaning is determined by how they are interpreted
- **Resource management**: processor time, memory, bandwidth and energy are finite and must be allocated and scheduled
- **Locality and concurrency**: reduce data movement, overlap waiting, coordinate shared state
'''
# src:
# 
# - **抽象**：接口分离规范与实现，两侧可独立演进（ISA、系统调用、语言库）
# - **表示**：整数、浮点数、字符与模型权重均编码为二进制位，含义由解释方式决定
# - **资源管理**：CPU 时间、内存、带宽与能量均为有限资源，需要分配与调度
# - **局部性与并发**：减少数据移动、重叠等待时间、协调共享状态

['four-themes.aside.1']
src_hash = '40bd7cf7'
text = 'Each subsequent chapter can be placed against these four themes to identify what it addresses.'
# src: 后续每一章都可对照这四个主题，确定其讨论的内容。


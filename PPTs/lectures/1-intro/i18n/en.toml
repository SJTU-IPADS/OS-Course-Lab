['source-is-bytes.slide.1']
src_hash = '24a7ccf2'
text = '''
Before compilation, a source file is likewise data: a byte sequence stored under a character encoding.
- ASCII represents one character in 7 bits: `'A'` is 65, `'0'` is 48, `'\n'` is 10
- The representation of `int main()` on disk is `69 6e 74 20 6d 61 69 6e 28 29`
'''

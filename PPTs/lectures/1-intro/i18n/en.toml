['why-os.title']
src_hash = '55fcdc1c'
text = 'Why an operating system is required'
# src: 操作系统的必要性

['why-os.slide.1']
src_hash = '632e9d36'
text = 'A browser, an editor and ollama request the same set of processor and memory resources; a mechanism is required to allocate them and to enforce protection.'
# src: **浏览器、编辑器与 ollama 同时请求同一组处理器与内存资源，需要有机制完成分配与保护。**

['why-os.slide.2']
src_hash = '60fcdf4c'
text = '''
If applications could access the hardware directly:
- **No isolation**: an out-of-bounds write in one program can corrupt another program's memory
- **No scheduling**: without preemption, a single program can occupy the processor indefinitely
- **No common interface**: replacing a device would require modifying the application
'''
# src:
# 
# **若应用程序可以直接访问硬件：**
# - **缺乏隔离**：一个程序的越界写入可以破坏另一程序的内存
# - **缺乏调度**：没有抢占机制时，单个程序可长期独占处理器
# - **缺乏统一接口**：更换设备需要修改应用程序

['why-os.highlight.1']
src_hash = '998f7edf'
text = 'The operating system multiplexes hardware resources and enforces protection boundaries.'
# src: 操作系统复用硬件资源，并实施保护边界。


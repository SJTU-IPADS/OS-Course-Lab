<text x="450.0" y="76.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">11：rm 是寄存器　00、01、10：另一个操作数在内存中，偏移为 0、1、4 字节</text>
<text x="400.0" y="104.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="15" font-weight="bold" fill="#2e7d4f" text-anchor="start">reg</text>
<text x="450.0" y="104.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">寄存器操作数的编号（m-&gt;reg）；0x81、0x83 这类组指令用它扩展操作码（m-&gt;sub）</text>
<text x="400.0" y="132.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="15" font-weight="bold" fill="#2e7d4f" text-anchor="start">rm</text>
<text x="450.0" y="132.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">mod 11：寄存器编号　其余：基址寄存器的编号，两个例外：</text>
<text x="450.0" y="158.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">rm 100：随后是 SIB 字节，基址与变址由它给出</text>
<text x="450.0" y="182.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">rm 101 且 mod 00：没有基址，随后 4 字节偏移，地址相对于下一条指令（%rip）</text>

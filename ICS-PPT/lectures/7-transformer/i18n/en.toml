['attention-preview.slide.1']
src_hash = '6238c984'
text = 'The sequence of vectors passes through an attention block, in which the vectors pass information to one another and update their values.'
# src: 向量序列经过注意力块，各向量相互传递信息，更新自己的值。

['attention-preview.notes.1']
src_hash = '0a070b73'
text = 'The word model means one thing in machine learning model and another in fashion model. The two instances of model start as the same vector, and attention updates them into different vectors according to the context. The meaning referred to here is encoded entirely in the components of the vectors.'
# src: machine learning model 中的 model 指机器学习模型，fashion model 中的 model 指时装模特。两处 model 开始时是同一个向量，注意力根据上下文把它们更新成不同的向量。这里所说的含义，全部编码在向量的分量中。

['attention-preview.slide.2']
src_hash = 'de706a4a'
text = 'The attention block determines which words in the context are relevant to updating the meanings of which other words, and how those meanings are updated.'

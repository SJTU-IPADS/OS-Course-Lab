['layer-stack.notes.1']
src_hash = '6316f918'
text = 'The goal is for all the meaning in the passage that is relevant to the prediction to be gathered into the last vector of the sequence. One operation on this vector gives, for every token in the vocabulary, the probability that it is the next token.'

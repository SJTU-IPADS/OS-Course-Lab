['parallel-gpu.notes.1']
src_hash = '9ddc21f4'
text = 'Much of the success of attention comes from its high degree of parallelism, which lets GPUs complete a huge amount of computation in a short time, more than from any specific behavior it implements. One important lesson of deep learning over the past decade or so is that scale alone brings large improvements in model performance.'
# src: 注意力的成功，很大程度上不在于它实现的某种具体行为，而在于它高度可并行，能用 GPU 在短时间内完成大量计算。过去十几年深度学习的一个重要经验是：规模本身就能显著提升模型的表现。


text = 'The goal of the attention mechanism'
# src: 注意力机制的目标

['attention-goal.slide.1']
src_hash = 'a54ef722'
text = 'The attention mechanism was introduced in the 2017 paper *Attention Is All You Need*.'
# src: 注意力机制由 2017 年的论文 *Attention Is All You Need* 提出。

['attention-goal.notes.1']
src_hash = '25644d2c'
text = "Directions in the embedding space can correspond to meanings. For example, one direction corresponds to gender. One can imagine many more directions, each corresponding to another aspect of a word's meaning. An initial embedding encodes a single word only, and the goal of a Transformer is to adjust these embeddings step by step so that they carry much richer contextual meaning. The attention mechanism often confuses people, so the following pages first look at several behaviors that attention should achieve, and then at the computation."
# src: 嵌入空间中的方向可以对应语义，例如有一个方向对应性别。可以设想还有许多方向，分别对应词义的其他方面。初始嵌入只编码单个词，Transformer 的目标是逐步调整这些嵌入，使它们带有丰富得多的上下文含义。注意力机制常让人困惑，下面先看几个希望注意力实现的行为，再看计算。

['attention-goal.slide.2']
src_hash = 'bddc6dfe'
text = 'Attention adjusts the embeddings step by step, so that each embedding goes from representing a single word to representing a meaning in context.'
# src: 注意力逐步调整嵌入，使每个嵌入从表示单个词变为表示带有上下文的含义。

['mole.title']
src_hash = 'd8a8cc61'
text = 'Different meanings of the same word'
# src: 同一个词的不同含义

['mole.slide.1']
src_hash = 'f3cdafc7'
text = 'The word mole has a different meaning in each of the three phrases below.'
# src: mole 在下面三个短语中含义各不相同。

['mole.notes.1']
src_hash = '9f3518b9'
text = 'In American shrew mole it is an animal, in One mole of carbon dioxide it is a unit of amount of substance, and in Take a biopsy of the mole it is a spot on the skin. After tokenization and lookup, the three vectors for mole are identical, because the initial embedding is a lookup table that involves no context. Only in the next step do the surrounding embeddings have a chance to pass information to it. One can imagine several distinct directions in the embedding space, each encoding a different meaning of mole.'
# src: American shrew mole 中是鼹鼠，One mole of carbon dioxide 中是摩尔，Take a biopsy of the mole 中是痣。分词并查表之后，三处 mole 的向量完全相同，因为初始嵌入是一张查表，不涉及上下文。到下一步，周围的嵌入才有机会把信息传给它。可以设想嵌入空间中有几个不同的方向，分别编码 mole 的不同含义。

['mole.slide.2']
src_hash = '10d91217'
text = 'Attention computes from the context what to add to the generic embedding, which moves it toward the direction of a specific meaning.'
# src: 注意力根据上下文计算要加到通用嵌入上的量，把它移向具体含义的方向。

['tower-refine.title']
src_hash = 'fb2a8832'
text = 'Meaning made specific step by step'
# src: 逐步具体化的含义

['tower-refine.slide.1']
src_hash = '8f0b0428'
text = 'The embedding of tower is a generic direction, close to many nouns for tall things.'
# src: tower 的嵌入是一个笼统的方向，与许多高大的名词相近。

['tower-refine.notes.1']
src_hash = 'ce2d688b'
text = 'When Eiffel comes before it, attention should update the vector of tower to a direction that more specifically represents the Eiffel Tower, associated with Paris, France and things made of steel. When miniature also appears, the vector should be updated further, so that it is no longer associated with tall things.'
# src: 前面出现 Eiffel 时，希望注意力把 tower 的向量更新到更具体地表示埃菲尔铁塔的方向，与巴黎、法国和钢铁制品相关。再出现 miniature 时，向量应进一步更新，不再与高大的事物相关。

['tower-refine.slide.2']
src_hash = '56e25037'
text = 'Every word in the context can further narrow the meaning of a word.'
# src: 上下文中的每个词都可能进一步限定一个词的含义。

['long-range.title']
src_hash = '25978584'
text = 'Long-range transfer of information'
# src: 远距离的信息传递

['long-range.slide.1']
src_hash = 'e3813800'
text = 'Attention can pass information between embeddings that are far apart, and the information can be much richer than a single word.'
# src: 注意力可以在相距很远的嵌入之间传递信息，内容可以比单个词丰富得多。

['long-range.notes.1']
src_hash = 'e0868ea8'
text = "The input is almost an entire mystery novel, up to a sentence near the end: Therefore, the murderer was. To predict the next word, the murderer's name, the last vector, which starts as just the embedding of was, must be updated by all the attention blocks until it encodes all the information in the context that is relevant to the prediction."
# src: 输入几乎是一整部推理小说，直到接近结尾的一句 Therefore, the murderer was。要预测下一个词，即凶手的名字，最后一个向量最初只是 was 的嵌入，它必须经过所有注意力块的更新，编码上下文中与预测相关的全部信息。

['long-range.slide.2']
src_hash = '1e1ff68f'
text = 'Predicting the next token uses only the last vector, so this vector must gather the information relevant to the prediction from the whole context.'
# src: 预测下一个 token 只用最后一个向量，它必须汇集整个上下文中与预测相关的信息。

['section.qk-section.title']
src_hash = 'c92224a7'
text = 'Queries, keys and the attention pattern'
# src: 查询、键与注意力模式

['fluffy-example.title']
src_hash = '3360df69'
text = 'An example attention head'
# src: 一个注意力头的例子

['fluffy-example.slide.1']
src_hash = '3ed4059a'
text = 'Suppose an attention head does only one kind of update: adjectives adjust the meanings of the nouns that follow them.'
# src: 设想一个注意力头只做一种更新：形容词调整其后名词的含义。

['fluffy-example.notes.1']
src_hash = '96a177e1'
text = 'The example sentence is a fluffy blue creature roamed the verdant forest. What is described here is a single attention head. A full attention block consists of many heads running in parallel. The initial embeddings are written E, and they encode the word itself and its position in the context. The computation is still mostly matrix-vector multiplication, with learnable weights in the matrices. "Adjectives update nouns" is a behavior assumed for illustration. The behavior of a real head is determined by tuning a huge number of parameters during training, and it is hard to interpret.'
# src: 例句是 a fluffy blue creature roamed the verdant forest。这里描述的是一个注意力头，完整的注意力块由许多头并行组成。初始嵌入记为 E，它编码词本身和词在上下文中的位置。计算仍主要是矩阵乘向量，矩阵中是可学习的权重。“形容词更新名词”是为说明而设想的行为。真实的头的行为由训练中大量参数的调整决定，难以解释。

['fluffy-example.slide.2']
src_hash = '34613913'
text = 'The goal is to compute a new set of embeddings in which the embeddings of nouns absorb the meanings of the adjectives that modify them.'
# src: 目标是算出一组新的嵌入，使名词的嵌入吸收修饰它的形容词的含义。

['query.title']
src_hash = 'a64b5e75'
text = 'The query vector'
# src: 查询向量

['query.slide.1']
src_hash = '16efe5e2'
text = 'Imagine creature asking: are there any adjectives in front of me? This question is encoded as a vector, called the query.'
# src: 设想 creature 在问：我前面有形容词吗？这个问题编码为一个向量，称为查询。

['query.notes.1']
src_hash = '00658e1b'
text = 'The query has far fewer dimensions than the embedding, 128 in GPT-3. The entries of W_Q are model parameters, and what the matrix actually does in a head is hard to interpret. Here it is imagined to map the embeddings of nouns to a direction in the query space that means "looking for preceding adjectives". What it does to other embeddings is set aside for now.'
# src: 查询的维数远小于嵌入，GPT-3 中为 128。W_Q 的元素是模型参数，它在一个头中实际做什么很难解释。这里设想它把名词的嵌入映射到查询空间中一个表示“寻找前面的形容词”的方向，它对其他嵌入的作用暂不考虑。

['query.slide.2']
src_hash = '88f2df37'
text = 'The query is $q_i = W_Q E_i$. $W_Q$ multiplies every embedding in the context, giving each token a 128-dimensional query.'
# src: 查询 $q_i = W_Q E_i$。$W_Q$ 乘以上下文中的每个嵌入，每个 token 得到一个 128 维的查询。

['key.title']
src_hash = 'c37f44ed'
text = 'The key vector'
# src: 键向量

['key.slide.1']
src_hash = '19b57d6e'
text = 'A second matrix, $W_K$, also multiplies every embedding, giving the key vectors. A key can be thought of as an answer to a query.'
# src: 第二个矩阵 $W_K$ 同样乘以每个嵌入，得到键向量。键可以看作对查询的回答。

['key.notes.1']
src_hash = 'f00d31a0'
text = "W_K likewise consists of tunable parameters, and it maps embeddings into the same 128-dimensional space as the queries. In this example, W_K maps adjectives such as fluffy and blue to keys that point close to the direction of creature's query."
# src: W_K 同样由可调参数组成，把嵌入映射到与查询相同的 128 维空间。在这个例子中，W_K 把 fluffy、blue 等形容词映射为与 creature 的查询方向接近的键。

['key.slide.2']
src_hash = '5af3c2e2'
text = 'Keys and queries live in the same space. When a key and a query point in similar directions, the two are considered a match.'
# src: 键与查询位于同一个空间。键与查询方向接近时，认为二者匹配。

['attention-scores.title']
src_hash = '630fe94b'
text = 'The grid of key-query dot products'
# src: 键与查询的点积表

['attention-scores.slide.1']
src_hash = 'ff1b2392'
text = 'The dot product of every key-query pair measures how well the two match.'
# src: 每一对键和查询做点积，衡量它们的匹配程度。

['attention-scores.notes.1']
src_hash = '4af170c0'
text = 'A larger circle means a larger dot product. The keys of fluffy and blue give large positive dot products with the query of creature. The dot product of the key of the with the query of creature is small or negative, which means the two are unrelated. The values in this grid can be any real numbers, and they give how relevant each word is to updating the meaning of every other word.'
# src: 圆点越大，点积越大。fluffy、blue 的键与 creature 的查询点积为较大的正数。the 的键与 creature 的查询点积较小或为负，说明两者无关。这张表中的值可以是任意实数，给出每个词与更新其他每个词的含义的相关程度。

['attention-scores.slide.2']
src_hash = 'b362cb44'
text = 'When the dot products are large, the embeddings of fluffy and blue are said to attend to the embedding of creature.'
# src: 点积大时，称 fluffy、blue 的嵌入关注（attend to）creature 的嵌入。

['attention-pattern.title']
src_hash = '2f737402'
text = 'The attention pattern'
# src: 注意力模式

['attention-pattern.slide.1']
src_hash = 'd348aa45'
text = 'These scores will serve as the weights of a weighted sum along each column, so each value should lie between 0 and 1 and each column should sum to 1.'
# src: 这些分数将用作每一列加权求和的权重，因此每个值应在 0 与 1 之间，每列之和为 1。

['attention-pattern.notes.1']
src_hash = '733ca5c0'
text = 'Applying Softmax to each column does this. After normalization, each column gives how relevant each word on the left is to the word at the top.'
# src: 对每一列做 Softmax 即可。归一化之后，每一列给出左侧各词与顶部这个词的相关程度。

['attention-pattern.slide.2']
src_hash = '2a24ace5'
text = 'Applying Softmax to each column gives a grid called the attention pattern.'
# src: 对每一列做 Softmax，得到的表称为注意力模式。

['attention-formula.title']
src_hash = 'dc093bba'
text = 'The attention formula in matrix form'
# src: 注意力的矩阵公式

['attention-formula.slide.1']
src_hash = 'ea8a72f7'
text = 'The original paper writes these computations as one compact expression.'
# src: 原始论文把这些计算写成一个紧凑的式子。

['attention-formula.notes.1']
src_hash = '16e693e3'
text = 'Q and K are the arrays of all query vectors and all key vectors. The numerator is a compact representation of all the dot products between keys and queries. Dividing by √d_k is for numerical stability. V is the array of value vectors, used to update the embeddings. In the paper each token occupies a row, each row of QKᵀ belongs to one query, and Softmax runs along the rows. The grids before have queries as columns, which is the transpose; written that way the formula is V·softmax(KᵀQ/√d_k), where each column of V is a value vector.'
# src: Q、K 分别是全部查询向量与全部键向量组成的数组。分子紧凑地表示所有键与查询的点积。除以 √d_k 是为了数值稳定。V 是值向量组成的数组，用于更新嵌入。论文中每个 token 占一行，QKᵀ 的每一行对应一个查询，Softmax 沿行进行。前面的表以查询为列，是它的转置，对应的写法是 V·softmax(KᵀQ/√d_k)，V 的每一列是一个值向量。

['attention-formula.slide.2']
src_hash = '57aa2664'
text = 'The dot products are divided by the square root of the dimension of the key-query space, $\sqrt{d_k}$, and then Softmax is applied for each query.'
# src: 点积除以键查询空间维数的平方根 $\sqrt{d_k}$，再对每个查询做 Softmax。

['section.mask-section.title']
src_hash = '5b6acd5c'
text = 'Masking and the size of the attention pattern'
# src: 掩码与注意力模式的规模

['training-targets.title']
src_hash = '70b3e7e1'
text = 'Prediction targets at every position'
# src: 每个位置的预测目标

['training-targets.slide.1']
src_hash = 'c82c4e44'
text = 'During training, the model simultaneously predicts the next token after every prefix.'
# src: 训练时，模型同时预测每个前缀之后的下一个 token。

['training-targets.notes.1']
src_hash = '11dc0ac1'
text = 'Training slightly adjusts all the weights according to how high a probability the model gives to the true next word. For the example sentence, the model simultaneously predicts the word after creature, the word after the, and so on.'
# src: 训练根据模型给真实下一个词的概率高低，微调全部权重。对于例句，模型同时预测 creature 之后的词、the 之后的词，等等。

['training-targets.slide.2']
src_hash = '331b068b'
text = 'One training example therefore acts as many examples.'
# src: 一个训练样本因此相当于多个样本。

['causal-mask.title']
src_hash = '66f6d33d'
text = 'Causal masking'
# src: 因果掩码

['causal-mask.slide.1']
src_hash = '3d0684ec'
text = 'Later words must not influence earlier words, or they would give away the answer to be predicted.'
# src: 后面的词不能影响前面的词，否则它们会泄露要预测的答案。

['causal-mask.notes.1']
src_hash = 'ce904630'
text = 'Every entry of the grid where a later token influences an earlier token must be 0. The simplest idea is to set these entries directly to 0, but then the columns no longer sum to 1. GPT always uses masking. Masking matters most during training, and it is applied in the same way when the model runs as a chatbot. Some variants of attention do not use masking.'
# src: 表中后面的 token 影响前面 token 的位置都必须为 0。最简单的想法是直接把它们设为 0，但这样各列之和不再为 1。GPT 总是使用掩码。掩码在训练中最关键，模型作为聊天机器人运行时也同样使用。有些注意力的变体不使用掩码。

['causal-mask.slide.2']
src_hash = 'd8c8598f'
text = 'The red cells are now set to 0, and every column is still normalized. This is called masking.'
# src: 现在红色格子的位置被设定为 0，各列仍归一化。这称为掩码。

['context-cost.title']
src_hash = '6b216009'
text = 'Size of the attention pattern'
# src: 注意力模式的规模

['context-cost.slide.1']
src_hash = '851cb345'
text = 'The number of entries in the attention pattern is the square of the context size.'
# src: 注意力模式的元素个数是上下文长度的平方。

['context-cost.notes.1']
src_hash = '777fa04f'
text = 'Many variants of attention have been developed to support longer contexts, for example Sparse Attention, Blockwise Attention, Linformer, Reformer, Ring Attention, Longformer and Adaptive Attention Span. This part covers only basic attention.'
# src: 为了支持更长的上下文，出现了多种注意力的变体，例如 Sparse Attention、Blockwise Attention、Linformer、Reformer、Ring Attention、Longformer、Adaptive Attention Span。本部分只讨论基本的注意力。

['context-cost.slide.2']
src_hash = '88dcf133'
text = 'Context size is therefore a major bottleneck of large language models, and it is not easy to extend.'
# src: 上下文长度因此是大语言模型的重要瓶颈，扩大它并不容易。

['section.value-section.title']
src_hash = 'fa9eb451'
text = 'Values and the update of embeddings'
# src: 值与嵌入的更新

['value.title']
src_hash = 'd02f72c2'
text = 'The value vector'
# src: 值向量

['value.slide.1']
src_hash = '6dc3b9bf'
text = 'With the attention pattern in hand, the next step is to actually update the embeddings: fluffy should change the embedding of creature.'
# src: 有了注意力模式，下一步是真正更新嵌入：让 fluffy 改变 creature 的嵌入。

['value.notes.1']
src_hash = 'f2b50580'
text = "The value matrix W_V multiplied by the embedding E_2 of fluffy gives the value vector v_2. The most direct approach is presented first, and multi-headed attention modifies it slightly. W_V multiplied by the embedding of a word can be read as follows: if this word is relevant to adjusting the meaning of another word, this is what should be added to that word's embedding."
# src: 值矩阵 W_V 乘以 fluffy 的嵌入 E_2，得到值向量 v_2。先介绍最直接的做法，多头注意力中会略作修改。W_V 乘以一个词的嵌入，可以理解为：如果这个词与调整另一个词的含义相关，应该往那个词的嵌入上加什么。

['value.slide.2']
src_hash = '541593ba'
text = 'The value vector $v_2 = W_V E_2$ is added to the embedding of creature; it lives in the same space as the embeddings.'
# src: 值向量 $v_2 = W_V E_2$ 加到 creature 的嵌入上，它与嵌入位于同一个空间。

['weighted-values.title']
src_hash = '62ae42b0'
text = 'Weighted sum of values'
# src: 值的加权求和

['weighted-values.slide.1']
src_hash = '42fbbbfc'
text = '$W_V$ multiplies every embedding, giving a sequence of value vectors, each corresponding to the key in the same row.'
# src: $W_V$ 乘以每个嵌入，得到一列值向量，每个值向量与同一行的键对应。

['weighted-values.notes.1']
src_hash = '257c3488'
text = 'Once the attention pattern is computed, the queries and keys are no longer needed. In the column of creature, for example, the value vectors of fluffy and blue are added with large weights, and the other value vectors are scaled to almost zero. The resulting change ΔE is added to the original embedding of creature, and the result should encode a richer meaning such as "a fluffy blue creature". Doing the same weighted sum in every column gives a whole sequence of updated embeddings. This whole process is called one attention head.'
# src: 得到注意力模式后，查询和键就不再需要。以 creature 这一列为例，fluffy 和 blue 的值向量以较大比例加入，其余值向量几乎为零。相加得到的变化量 ΔE 加到 creature 的原嵌入上，结果有望编码“毛茸茸的蓝色生物”这样更丰富的含义。对所有列做同样的加权求和，就得到一整列更新后的嵌入。以上全部过程称为一个注意力头。

['weighted-values.slide.2']
src_hash = 'e3eb9c92'
text = "Each column adds up the value vectors with its weights to give $\\Delta E$, which is added to the original embedding: $E' = E + \\Delta E$."
# src: 每列按权重把值向量相加得到 $\Delta E$，再加到原嵌入上：$E' = E + \Delta E$。

['section.head-params-section.title']
src_hash = 'd99dde32'
text = 'The parameters of one attention head'
# src: 一个注意力头的参数

['head-params.title']
src_hash = '1b267b0d'
text = 'Parameter count of the query and key matrices'
# src: 查询矩阵与键矩阵的参数量

['head-params.slide.1']
src_hash = 'f34c5bb7'
text = 'One head is determined by three matrices: query, key and value.'
# src: 一个头由三个矩阵确定：查询、键和值。

['head-params.notes.1']
src_hash = '6dd73a76'
text = 'The number of columns of W_Q and W_K equals the embedding dimension, 12,288, and the number of rows equals the dimension of the key-query space, 128.'
# src: W_Q 与 W_K 的列数等于嵌入维数 12,288，行数等于键查询空间的维数 128。

['head-params.slide.2']
src_hash = '3dd9828e'
text = '$W_Q$ and $W_K$ each have $128 \times 12{,}288 = 1{,}572{,}864$ parameters.'
# src: $W_Q$、$W_K$ 各有 $128 \times 12{,}288 = 1{,}572{,}864$ 个参数。

['value-lowrank.title']
src_hash = 'a2ae80ec'
text = 'Low-rank factorization of the value map'
# src: 值映射的低秩分解

['value-lowrank.slide.1']
src_hash = '7a39cbea'
text = 'The input and output of the value matrix are both in the 12,288-dimensional embedding space. Written as a square matrix, it would have about 150 million parameters.'
# src: 值矩阵的输入与输出都在 12,288 维的嵌入空间，若写成方阵，约有 1.5 亿个参数。

['value-lowrank.notes.1']
src_hash = '84f84190'
text = 'A full square matrix is a workable design, but in practice it is more efficient for the value map to have about as many parameters as the query and key maps, especially when many heads run in parallel. Conceptually the value map can still be viewed as a linear map from the embedding space to the embedding space, for example one that maps the embedding of blue to a "blue" direction that can be added to nouns. The first matrix is called the value-down matrix (Value↓) and the second the value-up matrix (Value↑) here; these are not conventional names. After factoring, the map first goes down to 128 dimensions and then back up to 12,288, so its rank is at most 128. A head has 4 matrices of the same size, with 6,291,456 parameters in total.'
# src: 完整的方阵是可行的设计，但实践中让值映射的参数与查询、键相当效率更高，在多头并行时尤其如此。概念上仍可把它看作嵌入空间到嵌入空间的线性映射，例如把 blue 的嵌入映射到可以加到名词上的“蓝色”方向。第一个矩阵这里称为值降维矩阵 Value↓，第二个称为值升维矩阵 Value↑，这不是通用的名称。分解后先降到 128 维，再升回 12,288 维，秩至多为 128。一个头共有 4 个同样大小的矩阵，6,291,456 个参数。

['value-lowrank.slide.2']
src_hash = '4ffdece8'
text = 'In practice the value map is factored into the product of a value-down and a value-up matrix, so the whole map is a low-rank transformation.'
# src: 实践中把值映射分解为降维与升维两个矩阵之积，整体是低秩变换。

['section.multi-head-section.title']
src_hash = 'd77608a6'
text = 'Cross-attention and multi-headed attention'
# src: 交叉注意力与多头注意力

['cross-attention.title']
src_hash = '29a7bbee'
text = 'Cross-attention'
# src: 交叉注意力

['cross-attention.slide.1']
src_hash = 'e911602e'
text = 'What has been described so far is a self-attention head. A cross-attention head processes two different kinds of data.'
# src: 以上是自注意力头。交叉注意力头处理两种不同的数据。

['cross-attention.notes.1']
src_hash = 'ad0b8d7b'
text = 'In a translation model, the keys come from the source text in one language and the queries from the translation being generated in another language, and the attention pattern describes which words of the two languages correspond to each other. In speech transcription, the keys come from the audio input and the queries from the text being written out. Here the problem of later tokens influencing earlier tokens does not arise, so masking is usually not applied. GPT uses only self-attention.'
# src: 翻译模型中，键来自一种语言的原文，查询来自正在生成的另一种语言的译文，注意力模式描述两种语言中哪些词相互对应。语音转写中，键来自语音输入，查询来自正在写出的文字。这里不存在后面的 token 影响前面的 token 的问题，所以通常不加掩码。GPT 只使用自注意力。

['cross-attention.slide.2']
src_hash = 'fab70d13'
text = 'Cross-attention computes the same way as self-attention, except that keys and queries come from different data, and masking is usually not used.'
# src: 交叉注意力的计算与自注意力相同，只是键和查询来自不同的数据，通常不加掩码。

['context-kinds.title']
src_hash = '6cfc5788'
text = 'Many kinds of contextual relations'
# src: 多种上下文关系

['context-kinds.slide.1']
src_hash = '1bf18e30'
text = 'Context affects the meaning of a word in far more ways than adjectives modifying nouns.'
# src: 上下文影响词义的方式远不止形容词修饰名词。

['context-kinds.notes.1']
src_hash = 'e761467e'
text = "If they crashed the comes before car, it implies that the car's shape and structure have been affected. Many associations have nothing to do with grammar. If wizard appears in the same passage, Harry very likely refers to Harry Potter. If Queen, Sussex and William appear, the embedding of Harry should be updated to point to Prince Harry. Each kind of contextual update needs different query and key parameters to capture its attention pattern, and a different value map to determine what is added to the embeddings. In practice the behavior of these maps is harder to interpret; the weights are trained into whatever best serves predicting the next token."
# src: 若 car 之前出现 they crashed the，说明这辆车的形状和结构受到影响。许多关联与语法无关：同一段文字中出现 wizard，Harry 很可能指 Harry Potter；出现 Queen、Sussex、William，Harry 的嵌入应更新为指向哈里王子。每种上下文更新需要不同的查询、键参数来捕捉注意力模式，也需要不同的值映射决定加到嵌入上的内容。实际中这些映射的行为更难解释，权重被训练成最有利于预测下一个 token 的样子。

['context-kinds.slide.2']
src_hash = '4ac04e6c'
text = 'Each kind of relation needs its own query and key parameters and its own value map.'
# src: 每种关系需要各自的查询、键参数与值映射。

['multi-head.title']
src_hash = 'ede3b996'
text = 'Multi-headed attention'
# src: 多头注意力

['multi-head.slide.1']
src_hash = 'db69015e'
text = 'An attention block consists of many heads running in parallel, each with its own query, key and value maps. GPT-3 has 96 heads in each block.'
# src: 注意力块由多个头并行组成，每个头有自己的查询、键和值映射。GPT-3 每个块有 96 个头。

['multi-head.notes.1']
src_hash = 'db37696a'
text = 'The 96 pairs of query and key matrices produce 96 attention patterns. Each head uses its own value map to produce a sequence of value vectors and sums them with the weights of its own attention pattern. Running many distinct heads in parallel lets the model learn many different ways in which context changes the meaning of a word.'
# src: 96 组查询与键矩阵产生 96 个注意力模式，每个头用自己的值映射产生一列值向量，再按自己的注意力模式加权求和。并行运行许多不同的头，使模型能够学到许多种由上下文改变词义的方式。

['multi-head.slide.2']
src_hash = '264076a5'
text = 'For each position, each head proposes a change. The changes of all heads are added together and then added to the original embedding at that position.'
# src: 对每个位置，每个头提出一个变化量。所有头的变化量相加，再加到该位置的原嵌入上。

['block-params.title']
src_hash = 'ce140d0c'
text = 'Parameter count of a multi-headed attention block'
# src: 多头注意力块的参数量

['block-params.slide.1']
src_hash = 'a7af69cc'
text = 'Each head has four matrices, with 6,291,456 parameters in total.'
# src: 每个头有四个矩阵，共 6,291,456 个参数。

['block-params.notes.1']
src_hash = '53ea9c3c'
text = 'The four matrices of each head are the query, key, value-down and value-up matrices, all of the same size.'
# src: 每个头的四个矩阵是查询、键、值降维和值升维矩阵，大小相同。

['block-params.slide.2']
src_hash = '993d2b4f'
text = 'An attention block of 96 heads has $96 \times 6{,}291{,}456 = 603{,}979{,}776$ parameters, about 600 million.'
# src: 96 个头的注意力块有 $96 \times 6{,}291{,}456 = 603{,}979{,}776$ 个参数，约 6 亿。

['output-matrix.title']
src_hash = '8685c79c'
text = 'The output matrix'
# src: 输出矩阵

['output-matrix.slide.1']
src_hash = '2f44cd00'
text = 'Implementations join the value-up matrices of all heads into one large matrix, called the output matrix $W_O$.'
# src: 实现中把各头的值升维矩阵拼成一个大矩阵，称为输出矩阵 $W_O$。

['output-matrix.notes.1']
src_hash = '43c4328d'
text = 'The output matrix belongs to the whole multi-headed attention block. This is only a difference in notation and implementation, and the parameters are the same. Keeping a pair of value-down and value-up matrices in each head is also a correct implementation. When reading other material, note that the "value matrix" of a head in the papers refers only to the value-down matrix.'
# src: 输出矩阵属于整个多头注意力块。这只是写法与实现上的差别，参数相同。在每个头中保留一对值降维、值升维矩阵也是正确的实现。阅读其他资料时要注意，论文中某个头的“值矩阵”只指值降维矩阵。

['output-matrix.slide.2']
src_hash = '150ebe93'
text = 'Each head first takes its weighted sum in 128 dimensions; concatenating and multiplying by $W_O$ equals mapping each head up separately and adding.'
# src: 各头先在 128 维中加权求和，拼接后乘 $W_O$，等于各头分别升维后求和。

['section.layers-section.title']
src_hash = '2ecdc105'
text = 'Layers and scale'
# src: 多层与规模

['deep-layers.title']
src_hash = 'd49db34a'
text = 'Context across many layers'
# src: 多层中的上下文

['deep-layers.slide.1']
src_hash = '90fac91e'
text = 'The data also passes through an MLP, and then through many more layers of attention blocks and MLPs.'
# src: 数据还经过 MLP，并反复经过许多层注意力块与 MLP。

['deep-layers.notes.1']
src_hash = 'e29662cf'
text = 'After a word absorbs some of its context, its more refined embedding has many more chances to be influenced by surrounding embeddings that are refined as well. Embeddings in deep layers can encode information beyond modifiers and grammatical structure, such as sentiment, tone, whether the text is a poem, and scientific facts relevant to the content. The figure takes the poem The Road Not Taken by Frost as an example. In I took the one less traveled by, the word one gains, layer by layer, meanings such as "one of the two roads", "a symbol of choice" and "the opposite of the familiar road".'
# src: 一个词吸收部分上下文之后，更精细的嵌入还有许多机会受到同样更精细的周围嵌入的影响。深层的嵌入有能力编码超出修饰关系和语法结构的信息，例如情感、语气、这是否是一首诗、与内容相关的科学事实。图中以 Frost 的诗 The Road Not Taken 为例：I took the one less traveled by 中的 one，逐层获得“两条路中的一条”“象征选择”“与熟悉之路相对”等含义。

['deep-layers.slide.2']
src_hash = 'a6e361cc'
text = 'In deeper layers, each embedding absorbs meaning from other embeddings that are more and more refined, and it can encode more abstract information.'
# src: 越往深层，每个嵌入从越来越精细的其他嵌入中吸收含义，能够编码更抽象的信息。


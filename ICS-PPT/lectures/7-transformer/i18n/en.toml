['training-targets.title']
src_hash = '70b3e7e1'
text = 'Prediction targets at every position'
# src: 每个位置的预测目标

['training-targets.slide.1']
src_hash = 'e09ca856'
text = 'During inference, the model predicts the next token from the last vector only. During training it is the other way round: the model predicts the next token after every prefix at once.'
# src: 推理时，模型只用最后一个向量预测下一个 token，训练时反过来，模型同时预测每个前缀之后的下一个 token。

['training-targets.notes.1']
src_hash = 'ca8280b6'
text = 'During inference, only the last vector is used for prediction. During training, every vector in the last layer is multiplied by the unembedding matrix to predict the token that immediately follows it. Training slightly adjusts all the weights according to how high a probability the model gives to the true next word. For the example sentence, the model simultaneously predicts the word after creature, the word after the, and so on.'
# src: 推理时只用最后一个向量做预测。训练时，最后一层的每个向量都乘以解嵌入矩阵，预测紧跟在它后面的 token。训练根据模型给真实下一个词的概率高低，微调全部权重。对于例句，模型同时预测 creature 之后的词、the 之后的词，等等。

['training-targets.slide.2']
src_hash = 'a02ad816'
text = 'During inference, generating a text takes many inference passes, while during training a single training text provides many training data points.'
# src: 推理时，一段文本的生成需要多次推理，而训练时，一段训练文本能提供多个训练数据点。

['full-pattern-training.title']
src_hash = 'b22e3877'
text = 'Answer leakage during training'
# src: 训练中的答案泄露

['full-pattern-training.slide.1']
src_hash = '4747d796'
text = 'In the attention pattern so far, each query applies Softmax over all the keys, so every column can draw information from the whole text.'
# src: 目前的注意力模式中，每个查询对全部键做 Softmax，每一列都能从整段文本获取信息。

['full-pattern-training.notes.1']
src_hash = 'ad989e46'
text = 'The grid in the figure is an attention pattern without any restriction, and the weights of each column are spread over all 8 keys. Only one head is drawn here. After all the layers, the vector at each position goes through the unembedding matrix and Softmax to give a probability distribution over the next token. Training adjusts all the weights according to how high a probability the model gives to the true next token, and the bottom of the figure shows the prediction target of each column.'
# src: 图中的表是没有任何限制的注意力模式，每一列的权重分布在全部 8 个键上。这里只画一个头。经过全部层之后，每个位置的向量经解嵌入矩阵与 Softmax 给出下一个 token 的概率分布。训练按真实下一个 token 的概率高低调整全部权重，图下方是每一列的预测目标。

['full-pattern-training.slide.2']
src_hash = 'cbd721cf'
text = 'During training, the updated embedding of each column is used to predict the token that follows that column.'
# src: 训练时，每一列更新后的嵌入用于预测这一列之后的 token。

['answer-leak.title']
src_hash = 'b22e3877'
text = 'Answer leakage during training'
# src: 训练中的答案泄露

['answer-leak.slide.1']
src_hash = '436ce765'
text = 'The prediction target of the creature column is roamed, and the key of roamed also takes part in the Softmax of this column.'
# src: creature 一列的预测目标是 roamed，而 roamed 的键也参与这一列的 Softmax。

['answer-leak.notes.1']
src_hash = '367dc437'
text = 'When later words can influence earlier words, the information of roamed is added to the embedding of creature through attention. What the creature column has to predict is exactly roamed, so the model gives the correct answer by reading it out. The same holds for the other columns, where the answer of each column is its next token. The right of the figure shows the attention pattern of this approach: the weights of each column concentrate on the next token, and these cells all lie in the red region where the key comes after the query. The token after forest is not in this passage, so this column has no answer to read, and the figure spreads its weight evenly. This approach brings the loss close to 0, so training has no reason to rule it out.'
# src: 后面的词能影响前面的词时，roamed 的信息经注意力加到 creature 的嵌入上。creature 一列要预测的正是 roamed，模型读出它就能给出正确答案。其他列同理，每一列的答案都是它的下一个 token。图右是这种做法对应的注意力模式：每一列的权重集中在下一个 token 上，这些格子都位于键在查询之后的红色区域。forest 之后的 token 不在这段文本中，这一列读不到答案，图中画成权重平均分布。这种做法使损失接近 0，训练没有理由排除它。

['answer-leak.slide.2']
src_hash = '265063f4'
text = 'Each column only needs to attend to the next token to read out the answer, so the training loss is close to 0, yet the model has not learned to predict.'
# src: 每一列只需关注下一个 token 就能读出答案，训练损失接近 0，模型却没有学会预测。

['generation-gap.title']
src_hash = '0fcab6fc'
text = 'Missing following text during inference'
# src: 推理中的下文缺失

['generation-gap.slide.1']
src_hash = '6e322147'
text = 'During inference, the model has only the prefix generated so far, and the token to be predicted does not exist yet.'
# src: 推理时，模型只有已经生成的前缀，要预测的 token 还不存在。

['generation-gap.notes.1']
src_hash = '16a07531'
text = 'What training teaches is to read out the next token. During inference there is no token after the last position, so this approach cannot be used, and the predictions the model gives are meaningless. For what training teaches to work during inference as well, the information each position sees during training must be the same as during inference, that is, only the tokens before it.'
# src: 训练时学到的做法是读出下一个 token。推理时，最后一个位置之后没有 token，这种做法无从使用，模型给出的预测没有意义。要让训练学到的做法在推理时同样可用，训练时每个位置看到的信息就必须与推理时相同，也就是只看它之前的 token。

['generation-gap.highlight.1']
src_hash = 'd27a1a23'
text = 'How can each position be influenced only by the tokens before it?'
# src: 如何让每个位置只受它之前的 token 影响？

['causal-mask.title']
src_hash = '66f6d33d'
text = 'Causal masking'
# src: 因果掩码

['causal-mask.notes.1']
src_hash = 'ce904630'
text = 'Every entry of the grid where a later token influences an earlier token must be 0. The simplest idea is to set these entries directly to 0, but then the columns no longer sum to 1. GPT always uses masking. Masking matters most during training, and it is applied in the same way when the model runs as a chatbot. Some variants of attention do not use masking.'
# src: 表中后面的 token 影响前面 token 的位置都必须为 0。最简单的想法是直接把它们设为 0，但这样各列之和不再为 1。GPT 总是使用掩码。掩码在训练中最关键，模型作为聊天机器人运行时也同样使用。有些注意力的变体不使用掩码。

['causal-mask.slide.1']
src_hash = 'a94eea46'
text = 'Before Softmax is applied, the scores of the red cells are first set to $-\infty$, so after the computation their weights become 0 and the probabilities in each column still sum to 1. This is called causal masking.'
# src: 在做 Softmax 之前先把红色格子的分数设定为 $-\infty$，运算后它们的权重变为 0，此时各列概率之和仍为 1。这称为因果掩码。

['value.title']
src_hash = 'd02f72c2'
text = 'The value vector'
# src: 值向量

['value.slide.1']
src_hash = '602d02a1'
text = 'With the attention pattern in hand, the next step is to update the embeddings, for example to let fluffy change the embedding of creature.'
# src: 有了注意力模式，下一步是更新嵌入，比如让 fluffy 改变 creature 的嵌入。

['value.notes.1']
src_hash = '12686d38'
text = "The value matrix W_V multiplied by the embedding E_2 of fluffy gives the value vector v_2. W_V multiplied by the embedding of a word can be read as follows: if this word is relevant to adjusting the meaning of another word, this is what should be added to that word's embedding."
# src: 值矩阵 W_V 乘以 fluffy 的嵌入 E_2，得到值向量 v_2。W_V 乘以一个词的嵌入，可以理解为：如果这个词与调整另一个词的含义相关，应该往那个词的嵌入上加什么。

['value.slide.2']
src_hash = '16480309'
text = 'The value vector $v_2 = W_V E_2$ is added to the embedding $E_4$ of creature, and it lies in the same space as the embeddings.'
# src: 值向量 $v_2 = W_V E_2$ 加到 creature 的嵌入 $E_4$ 上，它与嵌入位于同一个空间。

['weighted-values.title']
src_hash = '62ae42b0'
text = 'Weighted sum of values'
# src: 值的加权求和

['weighted-values.slide.1']
src_hash = '42fbbbfc'
text = '$W_V$ multiplies every embedding, giving a sequence of value vectors, each corresponding to the key in the same row.'
# src: $W_V$ 乘以每个嵌入，得到一列值向量，每个值向量与同一行的键对应。

['weighted-values.notes.1']
src_hash = '257c3488'
text = 'Once the attention pattern is computed, the queries and keys are no longer needed. In the column of creature, for example, the value vectors of fluffy and blue are added with large weights, and the other value vectors are scaled to almost zero. The resulting change ΔE is added to the original embedding of creature, and the result should encode a richer meaning such as "a fluffy blue creature". Doing the same weighted sum in every column gives a whole sequence of updated embeddings. This whole process is called one attention head.'
# src: 得到注意力模式后，查询和键就不再需要。以 creature 这一列为例，fluffy 和 blue 的值向量以较大比例加入，其余值向量几乎为零。相加得到的变化量 ΔE 加到 creature 的原嵌入上，结果有望编码“毛茸茸的蓝色生物”这样更丰富的含义。对所有列做同样的加权求和，就得到一整列更新后的嵌入。以上全部过程称为一个注意力头。

['weighted-values.slide.2']

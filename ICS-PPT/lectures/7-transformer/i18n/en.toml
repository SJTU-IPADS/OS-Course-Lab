['recompute.title']
src_hash = 'daa03977'
text = 'Repeated computation in step-by-step generation'
# src: 逐步生成中的重复计算

['recompute.slide.1']
src_hash = '9b3217ab'
text = 'During inference, each sampled token is appended to the input. To generate the next token, the earlier tokens have to be fed into the model again and again.'
# src: 推理时，每采样一个 token 就追加到输入。生成下一个 token 时，前面的 token 需要被一次又一次地输入到模型中。

['recompute.notes.1']
src_hash = 'd5e4e860'
text = 'In the figure the model has already processed the five tokens a fluffy blue creature roamed, and the sampled token the is appended to the input. When the whole sequence is run again, the five old positions recompute their queries, keys, values, attention and multilayer perceptron in layer 1, and the same happens in every later layer. Whether these results are still valid has to be determined first.'
# src: 图中模型已经处理了 a fluffy blue creature roamed 五个 token，采样得到 the 之后追加到输入。整段重新运行时，旧的五个位置在第 1 层再次计算查询、键、值、注意力与多层感知机，其后每一层也是如此。需要先判断这些结果是否仍然有效。

['recompute.slide.2']
src_hash = 'f51e91a8'
text = 'The computation of the old tokens is executed again in every layer. Do these results change because of the new token?'
# src: 旧的 token 在每一层的计算都会再次执行。这些结果会因新 token 而改变吗？

['prefix-invariance.title']
src_hash = '600413ee'
text = 'Prefix invariance of causal computation'
# src: 因果计算的前缀不变性

['prefix-invariance.slide.1']
src_hash = '1cedddb0'
text = 'Under a causal mask, every layer of a position depends only on that position and the positions before it.'
# src: 因果掩码下，一个位置的每一层只依赖它自己和它之前的位置。

['prefix-invariance.notes.1']
src_hash = 'fe36a4fa'
text = 'A layer consists of an attention block and a multilayer perceptron. The multilayer perceptron computes on each vector separately, and only attention reads other positions, which is restricted by the causal mask. The proof is by induction over the layers. The input to layer 1 is the embeddings, and those of the old positions are unchanged. If the outputs of the old positions in layer l are unchanged, the causal attention of layer l+1 reads only the old prefix, and the multilayer perceptron does not involve the new position either, so the outputs of the old positions are still unchanged. This assumes that the weights are fixed during inference and that positions are handled the same way. When the prefix is edited, the weights are replaced or the position scheme changes, the affected state must be recomputed.'
# src: 一层由注意力块和多层感知机组成。多层感知机对每个向量单独计算，只有注意力读取其他位置，而它受因果掩码限制。按层归纳：第 1 层的输入是嵌入，旧位置不变；若第 l 层旧位置的输出不变，第 l+1 层的因果注意力只读取旧前缀，多层感知机也不涉及新位置，旧位置的输出仍不变。前提是推理时权重固定、位置的处理方式不变。编辑前缀、更换权重或改变位置规则时，受影响的状态必须重算。

['prefix-invariance.slide.2']
src_hash = 'a7e2fe2c'
text = 'Appending a new token changes no layer of the old positions, so the K and V of the old positions in every layer can be reused.'
# src: 追加新 token 不改变旧位置的任何一层，旧位置各层的 K、V 可以复用。


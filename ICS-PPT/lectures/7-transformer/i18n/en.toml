['generation.notes.1']
src_hash = 'a8a75da0'
text = 'Given a starting text, the model outputs a probability distribution for the next word. A word is sampled at random from the distribution and appended to the end of the text, and the whole text is then the input for the next prediction. The starting text in the figure is Behold, a wild pi creature, foraging in its native. The model gives land a probability of 22%, and this time the sample is woodland, which has only 1%. Sampling is random, so a word of low probability can also be chosen. The percentages in the figure are truncated to whole numbers.'
# src: 给模型一段起始文本，模型输出下一个词的概率分布。从分布中随机采样一个词，追加到文本末尾，再以全部文本为输入做下一次预测。图中的起始文本是 Behold, a wild pi creature, foraging in its native。模型给 land 22% 的概率，这次采样得到的是只有 1% 的 woodland。采样是随机的，低概率的词也可能被选中。图中的百分数取整数部分。

['generation.slide.2']

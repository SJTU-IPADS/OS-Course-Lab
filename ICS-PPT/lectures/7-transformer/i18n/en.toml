['gpt2-gpt3.slide.1']
src_hash = '9df9bd39'
text = 'GPT-2 and GPT-3 are the same kind of model, and GPT-3 is much larger.'
# src: GPT-2 与 GPT-3 是同一种模型，GPT-3 的规模大得多。

['gpt2-gpt3.notes.1']
src_hash = '94e7a443'
text = 'Running GPT-2 on a laptop and repeatedly predicting and sampling gives a story that makes little sense. Calling the GPT-3 API instead gives a sensible story, which even infers that a pi creature lives in a land of math and computation. The word-by-word output seen when chatting with ChatGPT or another large language model is the result of this same repeated prediction and sampling.'
# src: 在笔记本电脑上运行 GPT-2，反复预测和采样，得到的故事不太合理。换成调用 GPT-3 的接口，得到的故事合理，甚至推断出 pi creature 生活在一个关于数学与计算的地方。和 ChatGPT 等大语言模型对话时看到的逐词输出，就是这样反复预测与采样的结果。

['gpt2-gpt3.slide.2']
src_hash = '64159c5f'
text = 'Continuing from the same starting text, GPT-2 writes an incoherent story and GPT-3 a coherent one.'
# src: 从同一段起始文本续写，GPT-2 的故事前后不连贯，GPT-3 的故事连贯。


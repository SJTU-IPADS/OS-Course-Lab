['weights-data.notes.1']
src_hash = 'd1e64116'
text = 'Some nonlinear functions are interspersed between the layers, and they contain no parameters. Weighted sums written out one by one are usually packaged as the product of a matrix and a vector, and the two are the same computation. Writing the parameters as a matrix and the data as a vector is conceptually clearer.'
# src: 层与层之间还穿插一些非线性函数，它们不含参数。逐个写出的加权和通常打包成矩阵与向量的乘积，两者是同一回事。把参数写成矩阵、把数据写成向量，概念上更清楚。

['weights-data.slide.2']
src_hash = '0ca04d97'
text = 'When a matrix multiplies a vector, each component of the output is a weighted sum of the input components, and the weights are one row of the matrix.'

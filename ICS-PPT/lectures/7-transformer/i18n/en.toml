['tensors.notes.1']
src_hash = '72aa6d3a'
text = 'An array can be a one-dimensional list or a two-dimensional table, and is often of higher dimension. All of these are called tensors. The input data is transformed layer by layer, and every layer is an array of real numbers. The last layer of a text model is a list of numbers that represents the probability distribution over all possible next tokens.'
# src: 数组可以是一维的列表、二维的表，也常是更高维的数组，统称张量。输入数据逐层变换，每一层都是实数数组。文本模型的最后一层是一列数，表示所有可能的下一个 token 的概率分布。

['tensors.slide.2']
src_hash = 'fa33648e'
text = 'The data is transformed layer by layer. Every layer is an array of real numbers, and the last layer is the output.'

text = 'Cross-attention and self-attention'
# src: 交叉注意力与自注意力

['cross-vs-self.slide.1']
src_hash = '3c912425'
text = 'The keys and values of cross-attention come from another piece of data, for example the source text in translation. This data is fully visible during both training and inference and contains no token to be predicted, so reading any of its positions gives away no answer.'
# src: 交叉注意力的键和值来自另一段数据，比如翻译中的原文。这段数据在训练和推理时都完整可见，也不包含要预测的 token，读取它的任何位置都不会泄露答案。

['cross-vs-self.notes.1']
src_hash = '0f891121'
text = 'The mask prevents a query from reading the tokens after it. In self-attention, the later tokens are exactly what is to be predicted, and during inference they do not exist yet. Cross-attention reads another input, which is given in full before inference starts. The side that generates the translation still uses self-attention with a causal mask on the part generated so far, and only the cross-attention that reads the source text is unmasked.'
# src: 掩码防止查询读到它之后的 token。自注意力中，后面的 token 正是要预测的内容，推理时也还不存在。交叉注意力读取的是另一段输入，它在推理开始前已经完整给出。生成译文的一侧仍用带因果掩码的自注意力处理已经生成的部分，只有读取原文的交叉注意力不加掩码。


['mlp-preview.notes.1']
src_hash = 'bf1d839d'
text = 'The operation of an MLP can be read as checking a series of features of each vector (written as questions in the figure) and updating the vector according to the results. The computation in attention blocks and in MLPs is mostly matrix multiplication, and understanding these matrices is the main task of this lecture. There is also a normalization step between the two kinds of blocks, omitted here.'
# src: MLP 的运算可以理解为检验每个向量的一系列特征（图中写成问题），再根据结果更新向量。注意力块和 MLP 的计算都主要是矩阵乘法，理解这些矩阵是本讲的主要任务。两种块之间还有归一化步骤，这里略去。

['mlp-preview.slide.2']
src_hash = 'c8775ce4'
text = 'In an MLP, the vectors pass no information to one another. Every vector goes through the same operation in parallel.'
# src: 在 MLP 中，向量之间不传递信息，每个向量并行地经过同一个运算。

['layer-stack.title']
src_hash = '8d1fea89'

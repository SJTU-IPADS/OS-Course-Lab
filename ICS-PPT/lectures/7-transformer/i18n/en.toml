['section.output-section.title']
src_hash = '5fa72c2c'
text = 'Unembedding and Softmax'
# src: 解嵌入与 Softmax

['unembedding.title']
src_hash = '8e6fb15f'
text = 'The unembedding matrix and the prediction of the next token'
# src: 解嵌入矩阵与下一个 token 的预测

['unembedding.slide.1']
src_hash = 'e78600a3'
text = 'The input of the unembedding matrix is the output of the attention block and multilayer perceptron of the last layer. Its output is called the logits, which reflect the relative probabilities of the tokens and, normalized by Softmax, give the probability distribution over the next token.'
# src: 解嵌入矩阵的输入是最后一层注意力块和多层感知机的输出，输出称为 logits，反映各 token 概率的相对高低，经 Softmax 归一化后是下一个 token 的概率分布。

['unembedding.notes.1']
src_hash = '55b062bf'
text = 'The text mentions Harry Potter, the words right before the last one are least favourite teacher, and the last word is Professor. A well-trained network that knows Harry Potter would give Snape a high probability. The computation has two steps. First, the unembedding matrix maps the last vector to a list of numbers, one value per token, and this list is the logits. Then Softmax normalizes the logits into a probability distribution. Like those of the embedding matrix, the entries of W_U start out random and are learned during training.'
# src: 文本中出现了 Harry Potter，紧挨着最后一个词的是 least favourite teacher，最后一个词是 Professor。训练良好、熟悉哈利·波特的网络会给 Snape 很高的概率。计算分两步。先用解嵌入矩阵把最后一个向量映射为一列数，每个 token 一个值，这列数就是 logits。再用 Softmax 把 logits 归一化为概率分布。W_U 的元素与嵌入矩阵一样从随机数开始，在训练中学习。

['unembedding.slide.2']
src_hash = 'e6ba3792'
text = 'For example, the unembedding matrix $W_U$ of GPT-3 maps the last vector to 50,257 values, the same as the number of tokens in the vocabulary, and Softmax then normalizes them into probabilities.'
# src: 比如 GPT-3 的解嵌入矩阵 $W_U$ 把最后一个向量映射为 50,257 个值，与词表中 token 的总数相同，Softmax 再把它们归一化为概率。

['softmax.title']
src_hash = '02fc7694'
text = 'Softmax'
# src: Softmax

['softmax.slide.1']
src_hash = '92f8aab8'
text = 'A probability distribution requires every value to lie between 0 and 1 and all values to sum to 1. The output of a matrix multiplication satisfies neither condition.'
# src: 概率分布要求每个值在 0 与 1 之间，且总和为 1。矩阵乘法的输出不满足这两条。

['softmax.notes.1']
src_hash = 'd047abbb'
text = 'The values from multiplying a matrix by a vector are often negative or much greater than 1, and their sum is almost never 1. Exponentiation makes all the values positive, and dividing by their sum normalizes them into a list that sums to 1. The largest input gives the output closest to 1, and smaller inputs give outputs close to 0.'
# src: 矩阵与向量相乘得到的值常常是负数或远大于 1，总和也几乎不会是 1。取指数后所有值都为正，再除以总和就归一化为和为 1 的一列数。最大的输入对应最接近 1 的输出，较小的输入对应接近 0 的输出。

['softmax.slide.2']
src_hash = '50fa2f76'
text = 'Softmax raises $e$ to the power of each number and divides by the sum of these powers: $p_i = e^{x_i} / \sum_j e^{x_j}$.'
# src: Softmax 先对每个数取 $e$ 的幂，再除以它们的总和：$p_i = e^{x_i} / \sum_j e^{x_j}$。

['softmax-behavior.title']
src_hash = 'a1939df6'
text = 'Behavior of Softmax'
# src: Softmax 的取值特点

['softmax-behavior.slide.1']
src_hash = '0167c9c6'
text = 'Softmax is a "soft" version of taking the maximum. When one input is clearly the largest, it takes almost all the probability. When several inputs are equally large, they share the probability.'
# src: Softmax 是一种“柔和”的取最大值。一个输入明显最大时，它几乎占据全部概率。几个输入同样大时，它们共同分得概率。

['softmax-behavior.notes.1']
src_hash = '624dba93'
text = 'When sampling from this distribution, an input that is clearly the largest is chosen almost every time. Unlike taking the maximum directly, it gives other values a substantial share of the probability when they are equally large. When the inputs vary continuously, the outputs also vary continuously.'
# src: 若从这个分布采样，一个明显最大的输入几乎总会被选中。与直接取最大值不同，其他值同样大时，它们也分得可观的概率。输入连续变化时，输出也连续变化。

['temperature.title']
src_hash = '3732e264'
text = 'Temperature'
# src: 温度

['temperature.slide.1']
src_hash = '25f2ba66'
text = 'The exponents of Softmax can be divided by a constant $T$, called the temperature.'
# src: Softmax 的指数中可以除以一个常数 $T$，称为温度。

['temperature.notes.1']
src_hash = 'dee8f6c2'
text = 'The name comes from its resemblance to the temperature in certain thermodynamics equations. When ChatGPT uses this distribution to generate the next word, the temperature adjusts the randomness. T = 0 is understood as a limit, meaning that the largest value is always chosen. The three marks under the slider are three typical cases: at T = 10 the probabilities are close to each other, at T = 1 the result equals Softmax without a temperature, and at T = 0 all the probability falls on Snape.'
# src: 这个名称来自它与某些热力学公式中温度的相似。ChatGPT 用这个分布生成下一个词时，可以用温度调节随机性。T = 0 按极限理解，即总是选择最大的值。滑动条下的三个刻度是三种典型情形：T = 10 时各个概率相近，T = 1 时结果与不带温度的 Softmax 相同，T = 0 时全部概率落在 Snape 上。

['temperature.slide.2']
src_hash = '46832d7e'
text = 'The larger $T$, the more uniform the distribution. The smaller $T$, the more the largest value dominates. At $T = 0$, all the weight falls on the largest value.'
# src: $T$ 越大，分布越均匀。$T$ 越小，最大值越占优势。$T = 0$ 时全部权重落在最大值上。

['temperature-stories.title']
src_hash = 'bb0b4a0c'
text = 'Temperature and model performance'
# src: 温度与模型的表现

['temperature-stories.slide.1']
src_hash = 'd3ceafc6'
text = 'GPT-3 writes a story starting from Once upon a time, there was a, at different temperatures.'
# src: 让 GPT-3 从 Once upon a time, there was a 开始写故事，取不同的温度。

['temperature-stories.notes.1']
src_hash = '4de1e700'
text = 'At temperature 0, the model always picks the most likely word, and the story is a trite derivative of Goldilocks. A higher temperature gives the model a chance to pick less likely words, and the story begins with a young web artist from South Korea but quickly degenerates into nonsense. The API at the time did not allow temperatures above 2. This is not a mathematical limit, only a way to keep the tool from generating overly absurd content. The high-temperature demo in the video takes the top 20 candidates returned by the API, raises their probabilities to the power 1/5 and renormalizes them, which is equivalent to T = 5 over these 20 candidates.'
# src: 温度为 0 时，模型总是选择最可能的词，故事是 Goldilocks 的老套翻版。较高的温度让模型有机会选择不太可能的词，故事从一位韩国的年轻网络艺术家开始，但很快变得没有意义。当时的 API 不允许温度超过 2，这不是数学上的限制，只是为了避免工具生成过于荒谬的内容。视频中的高温演示取 API 返回的前 20 个候选，把概率取 1/5 次方后重新归一化，相当于在这 20 个候选上取 T = 5。

['temperature-stories.slide.2']
src_hash = '67dc7e26'
text = 'At temperature 0 the story is trite. At a higher temperature the opening is more original, at the risk of losing coherence.'
# src: 温度为 0 时故事老套。温度较高时开头更新颖，但有失去连贯的风险。


['gender-direction.notes.1']
src_hash = 'a7a88616'
text = 'Without knowing the word for a female monarch, one can compute king plus woman minus man and search for the embedding nearest to the result. In this model, the actual position of queen lies some distance from that point, because in the corpus queen is used as more than the feminine form of king. Words for family relations show this direction better: uncle and aunt, brother and sister, nephew and niece, father and mother, son and daughter.'
# src: 若不知道女性君主这个词，可以计算 king 加上 woman 减 man，再找离结果最近的嵌入。在这个模型中，queen 的实际位置与这个点有一段距离，因为语料中 queen 的用法不只是 king 的女性形式。家庭关系的词更好地体现了这个方向：uncle 与 aunt、brother 与 sister、nephew 与 niece、father 与 mother、son 与 daughter。

['gender-direction.slide.2']
src_hash = 'c4916249'
text = 'Training makes one direction in the embedding space encode gender information.'
# src: 训练使嵌入空间中的一个方向编码性别信息。

['analogies.title']
src_hash = 'f36abaeb'
text = 'Analogies between word vectors'
# src: 词向量的类比

['analogies.slide.1']
src_hash = '26d96797'
text = 'Many other directions in the embedding space also carry meaning. Nearest-neighbor search and vector addition and subtraction reveal associations that the model has learned from its corpus.'
# src: 嵌入空间中还有许多方向带有语义。近邻检索和向量的加减揭示了模型从语料中学到的关联。

['analogies.notes.1']
src_hash = '257d510c'
text = 'Italy minus Germany plus Hitler gives a result close to Mussolini, as if the model had learned one direction for Italian-ness and another for Axis leaders of World War II. In some models, adding Germany minus Japan to sushi gives a result close to bratwurst (a German sausage).'
# src: Italy 减 Germany 再加 Hitler，结果接近 Mussolini，好像模型学到了一个表示意大利的方向和一个表示二战轴心国领导人的方向。在一些模型中，Germany 减 Japan 加到 sushi 上，结果接近 bratwurst（德国香肠）。

['analogies.highlight.1']
src_hash = '916d8781'
text = 'How can the relation between word vectors be quantified?'
# src: 如何量化词向量之间的关系？

['dot-product.title']
src_hash = '512d6682'
text = 'The dot product of word vectors'
# src: 词向量的点积

['dot-product.slide.1']
src_hash = '64a4c7f4'
text = 'The dot product of two vectors measures how well their directions align.'
# src: 两个向量的点积衡量它们的方向是否一致。

['dot-product.notes.1']
src_hash = '79e84dd3'
text = 'The dot product multiplies corresponding components and adds the results. The dot product is central to the computation of attention.'
# src: 计算点积就是把对应分量相乘再相加。点积在注意力的计算中起核心作用。

['dot-product.slide.2']
src_hash = '7411a2be'
text = 'The dot product is positive when the directions are similar, zero when they are perpendicular, and negative when they are opposite.'
# src: 方向相近时点积为正，垂直时为零，相反时为负。

['plural-direction.title']
src_hash = 'eb49a599'
text = 'Observation: the plural direction'
# src: 现象：复数方向

['plural-direction.slide.1']
src_hash = '9bb0aa6e'
text = 'Let $\mathrm{plur} = E(\mathrm{cats}) - E(\mathrm{cat})$, and test whether it represents plurality.'
# src: 设 $\mathrm{plur} = E(\mathrm{cats}) - E(\mathrm{cat})$，检验它是否表示复数。

['plural-direction.notes.1']
src_hash = 'df52a3dd'
text = 'Take the dot product of plur with several singular nouns and with the corresponding plural nouns, and compare. The plural nouns consistently give higher values, which shows that they align more with this direction. The dot products of the number words one, two, three and four increase in that order, as if they gave a quantitative measure of how "plural" the model considers a word to be. The values in the figure are those shown in the video.'
# src: 把 plur 与若干单数名词和对应的复数名词分别做点积，再比较。复数名词的值一致地更高，说明它们与这个方向更一致。数词 one、two、three、four 的点积依次增大，好像可以定量地衡量模型认为一个词有多“复数”。图中的数值是视频中显示的值。

['plural-direction.slide.2']
src_hash = '965e7d5d'
text = 'Plural nouns have a higher dot product with plur than singular nouns, and the dot product of number words grows with the quantity.'
# src: 复数名词与 plur 的点积高于单数名词，数词的点积随数量增大。

['context-size.title']
src_hash = '7af57fd1'
text = 'Context size'
# src: 上下文长度

['context-size.slide.1']
src_hash = '558f58cb'
text = 'The network can process only a fixed number of vectors at a time, called the context size, for example 2,048 for GPT-3.'
# src: 网络一次只能处理固定数量的向量，称为上下文长度，比如 GPT-3 的上下文长度为 2,048。

['context-size.notes.1']
src_hash = 'f2cd5190'
text = 'Each vector produced by the first step is taken directly from the embedding matrix and encodes a single word only. The main goal of the network is to let each vector absorb a meaning far richer than a single word. Early versions of ChatGPT appeared to forget earlier parts of a long conversation, and the cause was this limit on length.'
# src: 第一步得到的每个向量都直接取自嵌入矩阵，只编码单个词。网络的主要目标是让每个向量吸收比单个词丰富得多的含义。早期版本的 ChatGPT 在对话很长之后会显得忘记前面的内容，原因就在这个长度限制。

['context-size.highlight.1']
src_hash = '461dcde7'
text = 'How is input that exceeds the context size handled?'
# src: 如何处理上下文超出上限的情况？

['context-overflow.title']
src_hash = '11fc5d44'
text = 'Handling input that exceeds the context size'
# src: 上下文超出上限的处理方法

['context-overflow.slide.1']
src_hash = '751a4ab7'
text = 'When the number of input tokens exceeds the context size, there are three common ways to handle it.'
# src: 输入的 token 数超过上下文长度时，常见的处理方法有三种。

['context-overflow.notes.1']
src_hash = '3aecb3f2'
text = 'The first method keeps only the most recent tokens, and earlier content outside the window no longer takes part in the prediction. The second method rejects the whole request and returns an error, leaving the caller to shorten the input, and the cloud APIs of models work this way by default. The third method, when the context nears its limit, has the model write the conversation so far as a summary, replaces the original conversation with the summary and continues, and agents mostly work this way. The summary keeps the main points of the earlier conversation, and details may be lost.'
# src: 第一种方法只保留最近的 token，窗口之外的早期内容不再参与预测。第二种方法拒绝整个请求并返回错误，由调用方自行缩短输入，模型的云服务接口默认采用这种方式。第三种方法在上下文接近上限时，让模型把此前的会话写成一段摘要，用摘要替换原来的会话再继续，Agent 多采用这种方式。摘要保留此前会话的要点，细节可能丢失。

['context-overflow.slide.2']
src_hash = '3555718c'
text = 'Discarding and returning an error are simple to implement. Summarizing keeps the main points of earlier content, but generating the summary takes an extra inference pass of the model.'
# src: 舍弃与报错实现简单，总结能保留早先内容的要点，但生成摘要需要模型额外推理一次。

['bridge-output-section.title']
src_hash = '5fa72c2c'
text = 'Unembedding and Softmax'
# src: 解嵌入与 Softmax

['bridge-output-section.bridge.1']

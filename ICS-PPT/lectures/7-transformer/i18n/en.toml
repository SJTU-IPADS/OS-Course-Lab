['cross-attention.notes.1']
src_hash = '424cd85e'
text = 'In a translation model, the keys come from the source text in one language and the queries from the translation being generated in another language, and the attention pattern describes which words of the two languages correspond to each other. In speech transcription, the keys come from the audio input and the queries from the text being written out. GPT uses only self-attention.'

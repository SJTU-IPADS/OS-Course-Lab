['dataflow-overview.title']
src_hash = 'ab79a0fa'
text = 'The inside of a Transformer'
# src: Transformer 的内部结构

['dataflow-overview.slide.1']
src_hash = 'e21a150f'
text = 'Inside a Transformer, text passes in turn through the embedding, attention blocks, multilayer perceptrons and the unembedding.'
# src: 文本在 Transformer 中依次经过词嵌入、注意力块、多层感知机和解嵌入。

['dataflow-overview.notes.1']
src_hash = 'c33e754e'
text = 'The left of the figure is the whole model: a text goes into the Transformer, and the completed text comes out. The right is the computation inside the model, where the data flows from bottom to top. The input text is first cut into small pieces, and each piece is called a token. The figure shows only the last four tokens, and aging is the second piece of foraging. The embedding replaces each token with a vector, a column of numbers. The sequence of vectors enters an attention block, where the vectors pass information to one another. It then enters a multilayer perceptron, where each vector goes through the same operation on its own. An attention block and a multilayer perceptron form one layer. Such layers are repeated many times, and the output of one layer is the input of the next. The last vector output by the last layer goes through the unembedding and is then converted into probabilities, giving the probability distribution over all possible next tokens. Sampling from this distribution gives woodland, which is appended to the end of the text: this is the completed text at the top left of the figure.'
# src: 图左侧是整个模型：一段文本输入 Transformer，输出补全后的文本。右侧是模型内部的计算，数据自下而上流动。输入的文本先被切成小段，每一段称为一个 token。图中只画出最后四个 token，其中 aging 是 foraging 切开后的后一段。词嵌入把每个 token 换成一个向量，即一列数。向量序列进入注意力块，各向量之间传递信息。之后进入多层感知机，每个向量各自经过同一个运算。一个注意力块和一个多层感知机组成一层，这样的层重复多次，前一层的输出是后一层的输入。最后一层输出的最后一个向量经过解嵌入，再换算成概率，得到所有可能的下一个 token 的概率分布。从这个分布中采样得到 woodland，追加到文本末尾，就是图左侧上方补全后的文本。

['tokens.title']
src_hash = 'c464628f'
text = 'What is a token'
# src: 什么是 token

['tokens.slide.1']
src_hash = 'b66aa49c'
text = 'A Transformer first breaks its input into small pieces, each called a token.'
# src: Transformer 先把输入切成小段，每一段称为一个 token。

['tokens.notes.1']
src_hash = '1c5d8d70'
text = 'The sentence in the figure is split the way GPT-3 tokenizes it: cleverest becomes three tokens, cle, ve and rest, and the comma is a token of its own. To keep the examples simple, the following pages often treat one word as one token.'
# src: 图中的句子按 GPT-3 的分词结果切分：cleverest 被切成 cle、ve、rest 三个 token，逗号单独是一个 token。为了便于举例，后面常把一个词当作一个 token。

['tokens.slide.2']
src_hash = '434b1b82'
text = 'A token can be a word, a piece of a word or a punctuation mark, and also a small patch of an image or a short clip of sound.'
# src: token 可以是词、词的一部分或标点，也可以是图像的小块、声音的短片段。

['token-vectors.title']
src_hash = 'c464628f'
text = 'What is a token'
# src: 什么是 token

['token-vectors.slide.1']
src_hash = '1d12ed8d'
text = 'Each token corresponds to a vector, a list of numbers that encodes the meaning of that token.'
# src: 每个 token 对应一个向量，即一列数，用来编码这个 token 的含义。

['token-vectors.notes.1']
src_hash = 'cdd5dea3'
text = 'A vector can be viewed as coordinates in a high-dimensional space. In a trained model, words with similar meanings land at nearby positions in the space.'
# src: 把向量看作高维空间中的坐标。在训练好的模型里，含义相近的词落在空间中彼此接近的位置。

['token-vectors.slide.2']
src_hash = '00a8b2c6'
text = 'For words with similar meanings, the distance between the vectors of their tokens is also small.'
# src: 含义相近的词语，对应 token 的向量之间的距离也较小。

['attention-preview.title']
src_hash = 'e0e8d982'
text = 'Attention block: passing information between vectors'
# src: 注意力块：向量之间的信息传递

['attention-preview.slide.1']
src_hash = 'd9e7f246'
text = 'The sequence of vectors passes through an attention block, where the vectors pass information to one another, so that each vector contains part of the information of the other tokens.'
# src: 向量序列经过注意力块，各向量之间传递信息，使每个向量包含其他 token 的一部分信息。

['attention-preview.notes.1']
src_hash = '0a070b73'
text = 'The word model means one thing in machine learning model and another in fashion model. The two instances of model start as the same vector, and attention updates them into different vectors according to the context. The meaning referred to here is encoded entirely in the components of the vectors.'
# src: machine learning model 中的 model 指机器学习模型，fashion model 中的 model 指时装模特。两处 model 开始时是同一个向量，注意力根据上下文把它们更新成不同的向量。这里所说的含义，全部编码在向量的分量中。

['mlp-preview.title']
src_hash = 'b8124f86'
text = 'Multilayer perceptron: a transformation of each vector'
# src: 多层感知机：逐个向量的变换

['mlp-preview.slide.1']
src_hash = 'e61a41ff'
text = 'The output vectors of the attention block then pass through a multilayer perceptron (also called a feed-forward layer), which transforms each vector on its own and adds knowledge the model learned in training.'
# src: 注意力块的输出向量接下来经过多层感知机（也称前馈层），它对每个向量单独变换，加入模型在训练中学到的知识。

['mlp-preview.notes.1']
src_hash = '6357fb8f'
text = 'The multilayer perceptron computes on each vector separately. It first checks which features the vector encodes (written as questions in the figure), then produces an update from the results and adds it to that vector. For example, after the attention block a vector may encode the name Michael Jordan. Even if basketball does not appear in the context, the multilayer perceptron can add a direction related to basketball to this vector. This piece of knowledge is stored in the parameters of the multilayer perceptron and comes from training. About two thirds of the parameters of GPT-3 are in the multilayer perceptrons. The computation in both the attention block and the multilayer perceptron is mostly linear, that is, matrix multiplication, and understanding these matrices is the main task of this lecture. A normalization step also sits between the two kinds of blocks and is omitted here.'
# src: 多层感知机对每个向量单独计算：先检验向量编码了哪些特征（图中写成问题），再根据结果给出一个更新量，加到这个向量上。例如，一个向量经过注意力块后编码了 Michael Jordan 这个名字，上下文中没有出现篮球，多层感知机可以在这个向量上加入与篮球相关的方向。这条知识存在多层感知机的参数中，由训练得到。GPT-3 约三分之二的参数在多层感知机中。注意力块和多层感知机的运算都主要是线性运算，即矩阵乘法，理解这些矩阵是本讲的主要任务。两种块之间还有归一化步骤，这里略去。

['mlp-preview.slide.2']
src_hash = '01f02ffd'
text = 'The attention block takes information from the context. The multilayer perceptron takes information from the model parameters.'
# src: 注意力块从上下文中获取信息，多层感知机从模型参数中获取信息。

['layer-stack.title']
src_hash = 'f91ed0c5'
text = 'Multilayer Transformer'
# src: 多层 Transformer

['layer-stack.slide.1']
src_hash = 'def69f4b'
text = 'Attention blocks and multilayer perceptrons usually alternate and are repeated many times.'
# src: 注意力块与多层感知机往往交替重复多次。

['layer-stack.notes.1']
src_hash = 'f06cfc5a'
text = 'An attention block and a multilayer perceptron form one layer. Within a layer, each vector receives information from the other vectors once and then goes through one transformation on its own. Information that the other vectors receive in this layer reaches it only in the next layer. The more layers there are, the more context each vector can combine and the more specific the meaning it encodes. The last vector output by the last layer is used to predict the next token.'
# src: 一个注意力块和一个多层感知机组成一层。在一层中，每个向量从其他向量获得一次信息，再各自经过一次变换。其他向量在这一层获得的信息，要到下一层才能传给它。层数越多，每个向量能结合的上下文越多，编码的含义也越具体。最后一层输出的最后一个向量用来预测下一个 token。

['layer-stack.slide.2']
src_hash = '4ad72d54'
text = 'With many layers, a vector can repeatedly use the context gathered in earlier layers and encode more complex meanings step by step.'
# src: 重复多层，向量才能多次利用在前面各层已经汇集的上下文，逐步编码更复杂的含义。

['chat.title']

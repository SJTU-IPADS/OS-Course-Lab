['gpt3-matrices.notes.1']
src_hash = '8634f2e6'
text = 'GPT-3 is chosen because the numbers of its architecture are public, and because it was the first large language model to draw wide attention outside the machine learning community. 27,938 = 96 × (96 × 3 + 3) + 2. In each of the 96 layers, each of the 96 heads has three matrices: query, key and value. Each layer also has one output matrix, formed from the value-up parts of all heads, and two MLP matrices; the embedding and unembedding matrices come in addition. Each time a kind of matrix is covered, its parameter count is entered in this table.'
# src: 选 GPT-3 是因为它的结构数字公开，也是第一个在机器学习领域之外引起广泛关注的大语言模型。27,938 = 96 × (96 × 3 + 3) + 2：96 层中每层 96 个头各有查询、键、值三个矩阵，每层还有一个输出矩阵（由各头的值升维部分合成）和两个 MLP 矩阵，另加嵌入与解嵌入矩阵。每讲到一类矩阵，就把它的参数量记入这张表。


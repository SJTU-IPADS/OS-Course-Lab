text = 'Repeated computation in step-by-step generation'
# src: 逐步生成中的重复计算

['recompute.slide.1']
src_hash = '3ceafca0'
text = 'During generation, each sampled token is appended to the input. The most direct approach is to run the whole sequence again.'
# src: 生成时，每采样一个 token 就追加到输入。最直接的做法是把整段重新运行一遍。

['recompute.notes.1']
src_hash = 'aa315c2b'
text = 'In the figure the model has already processed the five tokens a fluffy blue creature roamed, and the sampled token the is appended to the input. When the whole sequence is run again, the five old positions recompute their queries, keys, values, attention and MLP in layer 1, and the same happens in every later layer. Whether these results are still valid has to be determined first.'
# src: 图中模型已经处理了 a fluffy blue creature roamed 五个 token，采样得到 the 之后追加到输入。整段重新运行时，旧的五个位置在第 1 层再次计算查询、键、值、注意力与 MLP，其后每一层也是如此。需要先判断这些结果是否仍然有效。

['recompute.slide.2']
src_hash = '9ce855f8'
text = 'The computation of the old positions is executed again in every layer. Do these results change because of the new token?'
# src: 旧位置在每一层的计算都再次执行。这些结果会因新 token 而改变吗？

['feedforward.title']
src_hash = 'd4d5be49'
text = 'The position-wise feed-forward network'
# src: 逐位置的前馈网络

['feedforward.slide.1']
src_hash = '51553592'
text = 'Attention is followed by the feed-forward network (FFN), the MLP. It transforms the $d$-dimensional vector of each position separately, where $d$ is the embedding dimension.'
# src: 注意力之后是前馈网络（FFN），即 MLP。它对每个位置的 $d$ 维向量分别变换，$d$ 为嵌入维数。

['feedforward.notes.1']
src_hash = '3d45d15f'
text = 'To decide whether the results of the old positions change, look at which positions each operation in a layer reads. Take an FFN with two matrices as an example. W_1 is 4d×d and maps up to 4d dimensions; a nonlinear function (such as GELU) follows; W_2 is d×4d and maps back down to d. All positions share the same parameters, and the positions exchange no information. Variants such as the gated FFN have different numbers of matrices and parameters.'
# src: 判断旧位置的结果是否改变，要看一层中每个运算读取哪些位置。以两矩阵的 FFN 为例：W_1 为 4d×d，先升维到 4d，经过非线性函数（如 GELU），W_2 为 d×4d，再降回 d。各位置共用同一组参数，位置之间不交换信息。门控 FFN 等变体的矩阵个数与参数量不同。

['feedforward.slide.2']
src_hash = 'e6cab769'
text = '$\mathrm{FFN}(x) = W_2\,\phi(W_1 x + b_1) + b_2$ reads the vector of one position only and exchanges no information with other positions.'
# src: $\mathrm{FFN}(x) = W_2\,\phi(W_1 x + b_1) + b_2$ 只读取一个位置的向量，与其他位置之间不交换信息。

['full-block.title']
src_hash = 'c4d3ae30'
text = 'The full decoder layer'
# src: 完整的解码器层

['full-block.slide.1']
src_hash = '708eae70'
text = 'Normalization rescales values along the feature dimension of each token. Together with attention, the FFN and residual connections, it forms one layer.'
# src: 归一化沿每个 token 的特征维调整数值。它与注意力、FFN 和残差连接组成一层。

['full-block.notes.1']
src_hash = '188f1512'
text = 'The figure shows the pre-norm structure common in the GPT series: each sublayer first normalizes its input, then computes an update, and finally adds the update to the input. The original 2017 Transformer placed normalization after the residual addition (post-norm). Normalization operates only within the features of one token and introduces no dependency between positions. Such a layer is repeated L times; in GPT-3, L = 96.'
# src: 图中是 GPT 系列常用的 pre-norm 结构：每个子层先归一化，再计算更新，最后与输入相加。2017 年的原始 Transformer 把归一化放在残差相加之后（post-norm）。归一化只在一个 token 的特征内进行，不引入位置之间的依赖。这样的层重复 L 次，GPT-3 中 L = 96。

['full-block.slide.2']
src_hash = '1f86f6c3'
text = 'Normalization, the FFN and the residual connections all act position by position; within a layer only attention reads other positions.'
# src: 归一化、FFN 与残差都逐位置进行，一层中只有注意力读取其他位置。

['prefix-invariance.title']
src_hash = '600413ee'
text = 'Prefix invariance of causal computation'
# src: 因果计算的前缀不变性

['prefix-invariance.slide.1']
src_hash = '1cedddb0'
text = 'Under a causal mask, every layer of a position depends only on that position and the positions before it.'
# src: 因果掩码下，一个位置的每一层只依赖它自己和它之前的位置。

['prefix-invariance.notes.1']
src_hash = '8b36b534'
text = 'The proof is by induction over the layers. The input to layer 1 is the embeddings, and those of the old positions are unchanged. If the outputs of the old positions in layer l are unchanged, the causal attention of layer l+1 reads only the old prefix, and the position-wise normalization and FFN do not involve the new position, so the outputs of the old positions are still unchanged. This assumes that the weights are fixed during inference and that positions are handled the same way. When the prefix is edited, the weights are replaced or the position scheme changes, the affected state must be recomputed.'
# src: 按层归纳：第 1 层的输入是嵌入，旧位置不变；若第 l 层旧位置的输出不变，第 l+1 层的因果注意力只读取旧前缀，逐位置的归一化与 FFN 不涉及新位置，旧位置的输出仍不变。前提是推理时权重固定、位置的处理方式不变。编辑前缀、更换权重或改变位置规则时，受影响的状态必须重算。

['prefix-invariance.slide.2']
src_hash = 'a7e2fe2c'
text = 'Appending a new token changes no layer of the old positions, so the K and V of the old positions in every layer can be reused.'
# src: 追加新 token 不改变旧位置的任何一层，旧位置各层的 K、V 可以复用。

['section.kv-section.title']
src_hash = 'ede7b6da'
text = 'Building and using the KV cache'
# src: KV cache 的建立与使用

['kv-cache.title']
src_hash = 'c10dbdeb'
text = 'The per-layer KV cache'
# src: 逐层保存的 KV cache

['kv-cache.slide.1']
src_hash = 'a98c3344'
text = 'The query of a new token must be compared with the keys of all past positions, and their values must be aggregated.'
# src: 新 token 的查询要与所有历史位置的键比较，并汇总它们的值。

['kv-cache.notes.1']
src_hash = '27a29cbf'
text = "In every layer, the new token computes its own Q, K and V, reads that layer's cached past K and V to complete attention, and then appends its own K and V to that layer's cache. After it finishes layer l, it uses the updated vector to compute the Q, K and V of layer l+1."
# src: 新 token 在每一层计算自己的 Q、K、V，读取该层缓存的历史 K、V 完成注意力，再把自己的 K、V 追加到该层缓存。它完成第 l 层后，用更新后的向量计算第 l+1 层的 Q、K、V。

['kv-cache.image.1.footnote.1']
src_hash = '10d2bfcd'
text = '[Hugging Face · Caching in Transformers](https://huggingface.co/docs/transformers/main/cache_explanation)'
# src: [Hugging Face · Transformers 的缓存机制](https://huggingface.co/docs/transformers/main/cache_explanation)

['kv-cache.slide.2']
src_hash = '42e4ef79'
text = 'Each layer caches the K and V of past positions. A new token computes only its own Q, K and V, and appends its K and V.'
# src: 每层缓存历史位置的 K、V。新 token 只计算自己的 Q、K、V，并追加 K、V。

['query-lifetime.title']
src_hash = '05ad826b'
text = 'Lifetimes of queries, keys and values'
# src: 查询与键值的使用范围

['query-lifetime.slide.1']
src_hash = '034bc279'
text = 'The query of each step is used only in that step. Keys and values are read by the queries of every later step.'
# src: 每一步的查询只在这一步使用。键和值被之后每一步的查询读取。

['query-lifetime.notes.1']
src_hash = 'f3db7a88'
text = 'The queries of old positions produced their outputs in their own steps, and later steps produce new queries. Only K and V therefore need to be stored.'
# src: 旧位置的查询在它们自己那一步已经完成了输出，之后的步骤会产生新的查询。所以只需要保存 K、V。

['query-lifetime.slide.2']
src_hash = '48b81f95'
text = "The current query determines this step's weights. Past keys are used for matching, and past values for aggregation."
# src: 当前查询决定本步的权重，历史键用于匹配，历史值用于汇总。

['prefill-decode.title']
src_hash = '2c5c3eae'
text = 'Prefill and decode'
# src: prefill 与 decode

['prefill-decode.slide.1']
src_hash = '745a5c41'
text = 'Prefill processes the whole prompt at once and builds the cache. Decode processes only one new token per step.'
# src: prefill 一次处理整个提示词并建立缓存。decode 每步只处理一个新 token。

['prefill-decode.notes.1']
src_hash = '73058777'
text = 'Prefill processes the P tokens of the prompt, and the last position predicts the first generated token. After this token is sampled, decode feeds it into the model, appends its K and V, and predicts the next token. Generating G tokens usually takes one prefill and G−1 decode steps. A token that has just been sampled and not yet fed into the model has no K or V yet.'
# src: prefill 处理 P 个提示词 token，最后一个位置预测第一个生成的 token。采样得到它之后，decode 把它送入模型、追加它的 K、V，并预测下一个。生成 G 个 token 通常需要一次 prefill 和 G−1 次 decode。刚采样得到、尚未送入模型的 token 还没有 K、V。

['prefill-decode.slide.2']
src_hash = '56fa1699'
text = 'Prefill processes the known prefix in parallel. Decode processes one new token per step and reads the growing past K and V.'
# src: prefill 并行处理已知的前缀。decode 每步处理一个新 token，读取不断增长的历史 K、V。


['gpt2-gpt3.notes.1']
src_hash = '94e7a443'
text = 'Running GPT-2 on a laptop and repeatedly predicting and sampling gives a story that makes little sense. Calling the GPT-3 API instead gives a sensible story, which even infers that a pi creature lives in a land of math and computation. The word-by-word output seen when chatting with ChatGPT or another large language model is the result of this same repeated prediction and sampling.'

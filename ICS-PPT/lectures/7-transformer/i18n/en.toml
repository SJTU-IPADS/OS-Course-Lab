text = 'Temperature'
# src: 温度

['temperature.slide.1']
src_hash = '25f2ba66'
text = 'The exponents of Softmax can be divided by a constant $T$, called the temperature.'
# src: Softmax 的指数中可以除以一个常数 $T$，称为温度。

['temperature.notes.1']
src_hash = 'a8a17410'
text = 'The name comes from its resemblance to the temperature in certain thermodynamics equations. When ChatGPT uses this distribution to generate the next word, the temperature adjusts the randomness. T = 0 is understood as a limit, meaning that the largest value is always chosen.'
# src: 这个名称来自它与某些热力学公式中温度的相似。ChatGPT 用这个分布生成下一个词时，可以用温度调节随机性。T = 0 按极限理解，即总是选择最大的值。

['temperature.slide.2']
src_hash = '46832d7e'
text = 'The larger $T$, the more uniform the distribution. The smaller $T$, the more the largest value dominates. At $T = 0$, all the weight falls on the largest value.'
# src: $T$ 越大，分布越均匀。$T$ 越小，最大值越占优势。$T = 0$ 时全部权重落在最大值上。

['temperature-stories.title']

text = "Before ChatGPT appeared, the early demos of GPT-3 continued stories and essays from an opening. The simplest way to build a chatbot is to first write a piece of text that sets up a conversation between a user and a helpful AI assistant. This text is called the system prompt. The user's question is placed as the first line of the conversation, and the model then predicts what the AI assistant would say. Making it behave well requires an additional training step."

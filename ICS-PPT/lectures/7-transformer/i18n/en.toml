['machine-learning.slide.1']
src_hash = 'fb91609b'
text = 'Machine learning uses data to determine the behavior of a model.'
# src: 机器学习用数据确定模型的行为。

['machine-learning.notes.1']
src_hash = 'f0d81d73'
text = 'Image classification and next-word prediction both require intuition and pattern recognition, and their steps are hard to write out directly as code. Machine learning does not define the procedure explicitly. It sets up a flexible structure with tunable parameters and adjusts the parameters with many examples of inputs and desired outputs, so that the model imitates these examples. The simplest example is linear regression: the input is the area of a house, the output is its price, and the line that best fits the data is used to predict prices.'
# src: 图像分类和预测下一个词都需要直觉和模式识别，很难直接用代码写出步骤。机器学习不显式定义做法，而是建立一个带有可调参数的灵活结构，用大量输入与期望输出的样例调整参数，使模型模仿这些样例。最简单的例子是线性回归：输入是房屋面积，输出是价格，找一条最符合数据的直线来预测价格。

['machine-learning.slide.2']
src_hash = '044d3233'
text = 'The line of a linear regression is described by two parameters, the slope and the intercept. Learning means determining these two parameters from the data.'
# src: 线性回归的直线由斜率与截距两个参数描述，学习就是根据数据确定这两个参数。

['scale.title']
src_hash = '5c39c246'
text = 'Parameter scale and backpropagation'
# src: 参数规模与反向传播

['scale.slide.1']
src_hash = 'e4005d5f'
text = 'GPT-3 has about 175 billion parameters.'
# src: GPT-3 有约 1750 亿个参数。

['scale.notes.1']
src_hash = '50a35d2c'
text = 'A model with many parameters is not necessarily usable: it may badly overfit the training data, or it may be impossible to train. Deep learning refers to a class of models that over the past two decades have proven to scale remarkably well. They share one training algorithm, backpropagation. For this algorithm to work well at scale, the model must follow a particular format. Knowing this format explains many of the design choices in how a Transformer processes language.'
# src: 参数很多的模型不一定可用：它可能严重过拟合训练数据，也可能无法训练。深度学习指过去二十年里证明能够很好地扩展的一类模型。它们共用同一个训练算法：反向传播。为了让这个算法在大规模下有效，模型必须遵循特定的格式。了解这个格式，Transformer 处理语言的许多设计就有了理由。

['scale.slide.2']
src_hash = '0b189480'
text = 'Deep learning models are trained with backpropagation, which requires the computation to take a particular form.'
# src: 深度学习模型用反向传播训练，为此计算必须具有特定的形式。

['tensors.title']
src_hash = '4aff9187'

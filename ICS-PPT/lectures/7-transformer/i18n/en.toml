['softmax.title']
src_hash = '02fc7694'
text = 'Softmax'
# src: Softmax

['softmax.slide.1']
src_hash = '92f8aab8'
text = 'A probability distribution requires every value to lie between 0 and 1 and all values to sum to 1. The output of a matrix multiplication satisfies neither condition.'
# src: 概率分布要求每个值在 0 与 1 之间，且总和为 1。矩阵乘法的输出不满足这两条。

['softmax.notes.1']
src_hash = 'd047abbb'
text = 'The values from multiplying a matrix by a vector are often negative or much greater than 1, and their sum is almost never 1. Exponentiation makes all the values positive, and dividing by their sum normalizes them into a list that sums to 1. The largest input gives the output closest to 1, and smaller inputs give outputs close to 0.'
# src: 矩阵与向量相乘得到的值常常是负数或远大于 1，总和也几乎不会是 1。取指数后所有值都为正，再除以总和就归一化为和为 1 的一列数。最大的输入对应最接近 1 的输出，较小的输入对应接近 0 的输出。

['softmax.slide.2']
src_hash = '50fa2f76'
text = 'Softmax raises $e$ to the power of each number and divides by the sum of these powers: $p_i = e^{x_i} / \sum_j e^{x_j}$.'
# src: Softmax 先对每个数取 $e$ 的幂，再除以它们的总和：$p_i = e^{x_i} / \sum_j e^{x_j}$。

['softmax-behavior.title']
src_hash = 'a1939df6'
text = 'Behavior of Softmax'
# src: Softmax 的取值特点

['softmax-behavior.slide.1']
src_hash = 'e8c6cb0c'
text = 'Softmax is a "soft" version of taking the maximum.'
# src: Softmax 是一种“柔和”的取最大值。

['softmax-behavior.notes.1']
src_hash = '624dba93'
text = 'When sampling from this distribution, an input that is clearly the largest is chosen almost every time. Unlike taking the maximum directly, it gives other values a substantial share of the probability when they are equally large. When the inputs vary continuously, the outputs also vary continuously.'
# src: 若从这个分布采样，一个明显最大的输入几乎总会被选中。与直接取最大值不同，其他值同样大时，它们也分得可观的概率。输入连续变化时，输出也连续变化。

['softmax-behavior.slide.2']
src_hash = 'aa4b02b4'
text = 'When one input is clearly the largest, it takes almost all the probability. When several inputs are equally large, they share the probability.'
# src: 一个输入明显最大时，它几乎占据全部概率。几个输入同样大时，它们共同分得概率。

['temperature.title']

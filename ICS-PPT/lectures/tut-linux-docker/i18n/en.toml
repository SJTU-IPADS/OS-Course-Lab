['docker-pull.slide.1']
src_hash = '359a5fb3'
text = '''
- **Image**: the files a container is created from, downloaded from the registry Docker Hub. `ubuntu` is the name of the image and `26.04` its version;
- **`--platform linux/amd64`**: selects the x86-64 image; amd64 is another name of x86-64. The instructions this course teaches and the programs of its labs are x86-64;
- A Mac with an Apple chip pulls the arm64 image by default when no platform is given.
'''
# src:
# 
# - **镜像（image）**：创建容器所用的文件，从镜像仓库 Docker Hub 下载。`ubuntu` 是镜像的名字，`26.04` 是版本；
# - **`--platform linux/amd64`**：选择 x86-64 的镜像，amd64 是 x86-64 的另一个名字。本课程讲解的指令与实验的程序都是 x86-64 的；
# - Apple 芯片的 Mac 在不指定 platform 的情况下默认拉取 arm64 的镜像。

['docker-pull.demo.1.name']
src_hash = 'a3f7cf8a'
text = 'Pull the x86-64 ubuntu image'
# src: 拉取 x86-64 的 ubuntu 镜像

['docker-pull.notes.1']
src_hash = '50264a3d'
text = '''
The first command downloads the image from Docker Hub, and the first six lines of the output belong to it: the image has two layers, one line each, and a layer shows Pull complete once it is downloaded and unpacked; Digest is the SHA-256 digest of the image contents; the last line is the full name of the image. The output is what the terminal showed at the end of the first pull on 2026-10-09; the progress of each layer during the download (Pulling fs layer, Download complete) is not listed.
When the image is already on the machine, the command prints Status: Image is up to date for ubuntu:26.04 and the two layer lines do not appear; the digest changes when the image is updated.
The second command prints the operating system and processor architecture of the image; linux/amd64 says that the image pulled is the x86-64 one.
The image is about 101 MB.
'''
# src:
# 
# 第一条命令从 Docker Hub 下载镜像，输出的前六行属于它：镜像分两层，每层一行，下载并解开后显示 Pull complete；Digest 是镜像内容的 SHA-256 摘要；最后一行是镜像的全名。输出是 2026-10-09 第一次拉取时终端上最后留下的内容，下载过程中每一层的进度（Pulling fs layer、Download complete）没有列出。
# 镜像已经在本机时，这条命令的输出是 Status: Image is up to date for ubuntu:26.04，层的两行不出现；镜像更新之后摘要也随之变化。
# 第二条命令打印镜像的系统与处理器架构，linux/amd64 说明拉取到的是 x86-64 的镜像。
# 镜像约 101 MB。


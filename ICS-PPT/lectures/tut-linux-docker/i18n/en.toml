['docker-exec.demo.2.name']
src_hash = 'bc6f3d3f'
text = 'Start the container, enter it and execute commands'
# src: 启动容器，进入容器执行命令

['docker-exec.slide.1']
src_hash = '9b1408a3'
text = '''
- **`-dt`**: `-d` runs the container in the background; `-t` allocates a terminal, `bash` waits for input, and the container keeps running;
- **`--name ics`**: names the container `ics`. The command has no `--rm`: the container is kept after it stops, and so are its files;
- **`docker start ics`**: starts a stopped container. After the computer restarts, the container is stopped;
- **`docker exec -it ics bash`**: starts another `bash` in the container; after `exit` the container keeps running.
'''
# src:
# 
# - **`-dt`**：`-d` 使容器在后台运行；`-t` 分配终端，`bash` 等待输入，容器保持运行；
# - **`--name ics`**：给容器起名 `ics`。命令不带 `--rm`，容器停止后保留，文件也保留；
# - **`docker start ics`**：启动已停止的容器。计算机重启后容器处于停止状态；
# - **`docker exec -it ics bash`**：在容器中另启动一个 `bash`，`exit` 之后容器继续运行。

['docker-exec.notes.1']
src_hash = '96136c91'
text = '''
The two groups of commands were run in order on 2026-10-09, and the output on the page is that of this run; before the second group, the container was stopped with docker stop ics.
The first group: -d makes docker run return without waiting for the container to end, after printing the 64 hexadecimal digits of the container id; -t allocates a terminal for bash, bash waits for input on it, and the container therefore keeps running. With -d alone, bash reads end of input and exits, and the container stops at once. --name ics sets the name of the container, and the later commands name the container by it; without it docker picks a random name, which docker ps -a shows.
The second group: docker start ics starts the stopped container, and the ics it prints is the name of the container; when the container is already running, the command prints ics as well. docker exec -it ics bash starts another bash in the container ics and gives it the terminal; fbeaf9a5eea5 in the prompt is the first 12 digits of the container id. Two lines were typed: echo hello > /root/a.txt and exit. exit ends this bash; the bash started by docker run is still running, and so is the container.
docker exec ics COMMAND, without -it, executes one command and returns. docker stop ics stops the container, and takes about 10 seconds. Checked on 2026-10-09: after /root/a.txt was written, docker stop ics, docker start ics and docker exec ics cat /root/a.txt were run in order, and the output was hello.
While the container is stopped, docker exec reports container … is not running. After the computer restarts or Docker Desktop quits, the container is stopped; run docker start ics first.
When the name ics is already taken, the docker run of the first group reports Conflict. The container name "/ics" is already in use. docker rm -f ics removes that container together with its files, after which it can be created again.
'''
# src:
# 
# 两段命令在 2026-10-09 依次执行，页面上的输出是这一次的结果；执行第二段之前用 docker stop ics 停止了容器。
# 第一段：-d 使 docker run 不等待容器结束，输出容器的 64 位十六进制编号后返回；-t 为 bash 分配一个终端，bash 在终端上等待输入，容器因此保持运行。只写 -d 时 bash 读到输入结束便退出，容器随即停止。--name ics 指定容器的名字，后面的命令用名字指明容器；不写时 docker 起一个随机的名字，用 docker ps -a 查看。
# 第二段：docker start ics 启动已停止的容器，输出的 ics 是容器的名字；容器已在运行时这条命令同样输出 ics。docker exec -it ics bash 在容器 ics 中再启动一个 bash 并把终端交给它，提示符中的 fbeaf9a5eea5 是容器编号的前 12 位。输入了 echo hello > /root/a.txt 与 exit 两行。exit 结束的是这个 bash，docker run 启动的 bash 仍在运行，容器继续运行。
# docker exec ics 命令 不带 -it，执行一条命令后返回。停止容器用 docker stop ics，这条命令约需 10 秒。2026-10-09 核对过：写入 /root/a.txt 之后依次执行 docker stop ics、docker start ics、docker exec ics cat /root/a.txt，输出 hello。
# 容器处于停止状态时 docker exec 报告 container … is not running。计算机重启或退出 Docker Desktop 之后容器处于停止状态，先执行 docker start ics。
# 名字 ics 已被占用时，第一段的 docker run 报告 Conflict. The container name "/ics" is already in use。docker rm -f ics 删除这个容器，其中的文件一并删除，之后可以再次创建。

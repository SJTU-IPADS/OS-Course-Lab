# src:
# 
# 实验一的 `interp_run` 调用的 `rm_get` 经 `load`、`mem_read` 到达 `frame/cpu/mem.c` 的 `mem_access`，再由它每行调用一次 `cache_read`。

['cache-chain.notes.1']
src_hash = '741ea836'
text = '''
The figure shows the functions one memory access passes through from the interpreter to memory, one band per file from top to bottom. The grey block on the left is the hardware: the files of frame/cpu/ simulate the hardware of the machine, and the interpreter of lab 1 and the cache of lab 2 belong to the hardware as well. The grey block on the right is the software: the code of frame/os/ is software that runs on this machine. The dark capsules are functions you implement, the white boxes functions of the framework.
First band: interp_run of lab 1 executes one instruction per round. It fetches with x86_begin of frame/cpu/x86.c, reads an operand with rm_get and writes memory with store, for example when push writes a register to the stack.
Second band: rm_get calls load when its operand is in memory. x86_begin, store and load call fetch_bytes, mem_write and mem_read of frame/cpu/mem.c respectively, with the address the program uses, va, the virtual address. Memory operands, push, pop, call and ret of the interpreter all go through load and store.
Third band: fetch_bytes, mem_write and mem_read all call mem_access, the memory access unit of the CPU. mem_access calls mmu_translate of frame/cpu/pagemap.c once per page to turn va into the physical address pa, then splits the access within the page at the line boundaries and calls cache_read or cache_write once per line.
Fourth band: cache_read and cache_write of lab 2 act at this level. The bytes of every call lie within one line, for example a read of 8 bytes at line offset 60 is two calls. In the machine of lab 1 this level is frame/cpu/nocache.c, which reads and writes the mapping directly.
Fifth band: on a miss the cache calls dram_line_read of frame/cpu/dram.c to read a line in, and when it replaces a dirty line it calls dram_line_write to write the line back. Each call accesses the memory of the host.
On the right, a system call reads and writes the buffer of the program, with write as the example: sys_dispatch of frame/os/sysbase.c reads the buffer of the program with guest_read of frame/os/copy.c. The buffer can be up to 4096 bytes long, and guest_read cuts it at the line boundaries as the loop of memcpy does, calling mem_read once per piece. From there the path is the same as for an access of an instruction. When a system call writes its result into the buffer of the program, it uses guest_write, which calls mem_write once per piece.
So cache_read and cache_write only ever handle bytes within one line. The next page shows how mem_access splits an access by pages and by lines.
'''
# src:
# 
# 图中是一次访存从解释器到内存经过的函数，从上到下每一条带是一个文件。左边灰色的一块是硬件：frame/cpu/ 中的文件模拟机器的硬件，实验一的解释器与实验二的缓存也属于硬件。右边灰色的一块是软件：frame/os/ 中的代码是在这台机器上运行的软件。深色的胶囊是你实现的函数，白框是框架的函数。
# 第一条带：实验一的 interp_run 每一轮执行一条指令。它调用 frame/cpu/x86.c 的 x86_begin 取指，用 rm_get 读操作数，用 store 写内存，比如 push 把寄存器写到栈上。
# 第二条带：rm_get 的操作数在内存中时调用 load。x86_begin、store 与 load 分别调用 frame/cpu/mem.c 的 fetch_bytes、mem_write 与 mem_read，参数是程序中使用的地址 va，即虚拟地址。解释器读写内存操作数、push、pop、call、ret 都经过 load 与 store。
# 第三条带：fetch_bytes、mem_write 与 mem_read 都调用 mem_access，它是 CPU 的访存单元。mem_access 每页调用一次 frame/cpu/pagemap.c 的 mmu_translate，把 va 换成物理地址 pa，再在这一页之内按行的边界拆开，每一行调用一次 cache_read 或 cache_write。
# 第四条带：实验二的 cache_read 与 cache_write 在这一级起作用。每次调用收到的字节都在一行之内，比如从行内偏移 60 处读 8 个字节是两次调用。实验一的机器中这一级是 frame/cpu/nocache.c，它直接读写映射。
# 第五条带：缓存缺失时调用 frame/cpu/dram.c 的 dram_line_read 读入一行，替换脏行时调用 dram_line_write 写回一行，每一次都访问宿主的内存。
# 右边是系统调用读写程序的缓冲区，以 write 为例：frame/os/sysbase.c 的 sys_dispatch 用 frame/os/copy.c 的 guest_read 读出程序的缓冲区。缓冲区可以长达 4096 字节，guest_read 像 memcpy 的循环一样在行的边界处切分，每一段调用一次 mem_read，之后的路径与指令的访存相同。系统调用把结果写进程序的缓冲区时用 guest_write，每一段调用一次 mem_write。
# 所以 cache_read 与 cache_write 每次只处理一行之内的字节。下一页看 mem_access 怎样按页、按行拆开一次访存。


['cache-path.notes.1']
src_hash = '432f48b5'
text = '''
In lab 2, cache_read and cache_write are replaced by the functions you implement in src/lab2/cache.c. The two files on the left are unchanged: the interpreter still calls mem.c, and mem.c still calls cache_read and cache_write, the bytes of every call lying within one line.
frame/main.c calls the other two functions: cache_init builds the cache and is already written, and cache_flush writes dirty lines back to memory.
The 64 × 4 lines of the cache are in the array cache_lines of cache.c, which is only about 22 KiB, and reading or writing it usually hits in the caches of the host CPU, as the dashed box in the figure shows.
The mapping on the right still exists, and the framework reads and writes it with dram_ptr when it loads a program. cache.c must not use dram_ptr, and the two arrows in the figure are crossed out.
cache.c can read and write memory only by calling dram_line_read and dram_line_write of frame/cpu/dram.c, and each call reads or writes one whole line of 64 bytes. Both functions copy the line within the mapping and take it out of the caches of the host CPU with the clflush instruction. dram_line_read takes it out first and then reads, so it reads the bytes in the memory of the host. dram_line_write writes first and then takes it out, so the bytes written reach the memory of the host. The two red paths in the figure are these two kinds of memory read and write, and each of them accesses physical memory.
With the cache turned off, the framework hands every line access to dram.c, and every line an access touches reads or writes memory once. What follows shows the functions of cache.c and where the framework calls them.
'''

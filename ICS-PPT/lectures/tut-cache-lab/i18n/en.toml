['cache-funcs-miss.notes.1']
src_hash = '2184439e'
text = '''
On a miss cache_lookup returns NULL. cache_access adds 1 to cache_misses and calls cache_victim to select the way to replace in this set: a way whose valid is 0 if there is one, otherwise the way with the smallest last_use, the way accessed longest ago.
cache_fill computes the address of the line in memory from the new tag and the set index with cache_line_address, calls dram_line_read to read in the 64 bytes, then sets valid to 1, dirty to 0 and tag to the new tag. The remaining steps are those of a hit: cache_access updates last_use and returns the line, and cache_read copies from it.
In the figure the way to replace is invalid or was never written, so cache_fill overwrites it directly and dram_line_write is grey. This line access reads or writes memory once.
cache_write takes the same steps on a miss. A write changes only a few bytes of a line, and the other bytes must keep the values in memory, so on a write miss cache_access first reads in the whole line. This is write-allocate. cache_write then writes the bytes into this line and sets dirty to 1. The written contents stay in the cache and are written back to memory only when the line leaves the cache or at cache_flush.
The next page shows the path when the line to replace is dirty.
'''
# src:
# 
# 缺失时 cache_lookup 返回 NULL。cache_access 把 cache_misses 加 1，调用 cache_victim 在这一组中选出被替换的路：有 valid 为 0 的路时选它，否则选 last_use 最小的一路，即最久没有访问的一路。
# cache_fill 用 cache_line_address 由新的 tag 与组号求出这一行在内存中的地址，调用 dram_line_read 读入 64 字节，再把 valid 设为 1、dirty 设为 0、tag 设为新的 tag。之后的步骤与命中相同：cache_access 更新 last_use 并返回这一行，cache_read 从中复制。
# 图中被替换的路无效或没有被写过，cache_fill 直接覆盖它，dram_line_write 是灰色的。这一次行访问读写一次内存。
# cache_write 缺失时经过同样的步骤。写只改行中的几个字节，其余字节必须保持内存中的值，所以写缺失时 cache_access 先读入整行，这就是写分配。之后 cache_write 把字节写入这一行并置 dirty 为 1，写入的内容留在缓存中，行离开缓存或 cache_flush 时才写回内存。
# 下一页是被替换的行是脏行时的路径。


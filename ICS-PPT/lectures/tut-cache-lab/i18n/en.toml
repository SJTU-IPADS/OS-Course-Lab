['cache-walk.slide.1']
src_hash = '7fe1c353'
text = 'In `frame/cpu/mem.c`, `count` is at most `in_line`, the number of bytes up to the end of the line, so every call stays within one line.'
# src:
# 
# `frame/cpu/mem.c` 中 `count` 不超过到行末的字节数 `in_line`，每次调用都在一行之内。

['cache-walk.notes.1']
src_hash = '239b0d8f'
text = '''
The code is the loop of mem_access: the outer loop translates the address once per page, the inner loop calls cache_read or cache_write once per line.
mem_access is a static function of mem.c. fetch_bytes, mem_read and mem_write all call it, with acc MEM_FETCH, MEM_READ and MEM_WRITE respectively. While the program runs, only mem_access calls cache_read and cache_write. The slide leaves out the head of the function, the return 0 after the loop and the check of the length before it: one access is at most LINE_SIZE, 64 bytes, and a longer one is an error of the framework that ends the program with status 4, so one access spans at most two lines.
Each round of the outer while handles the part within one page. chunk is the number of bytes left in the page of va, at most nbytes. mmu_translate turns va into the physical address pa, which in lab 2 is done by frame/cpu/pagemap.c of the framework. Two neighbouring virtual pages may lie far apart in physical memory, so each page is translated alone. The two lines written as ... record the faulting address fault_va and return -1 when the translation fails.
Each round of the inner for handles the part within one line. in_line is the number of bytes left in the line of pa + done, and count is the smaller of in_line and chunk - done, the number of bytes of this access still left in the page. Each round calls cache_read or cache_write once, so the bytes of every call lie within one line, 1 to 64 bytes long, and one call is one line access. One access across two lines is therefore two line accesses and counts two hits or misses, for example a read of 8 bytes at line offset 60 is two calls of cache_read of 4 bytes each. An instruction fetch reads up to 15 bytes, so accesses across two lines are frequent. This is also one of the reasons why there are more line accesses than instructions.
The framework checks every call in frame/memtrace.c: a call that crosses a line makes it print framework error and exit with status 4. With the cache turned off, it hands the two calls to uncached_read and uncached_write of frame/cpu/dram.c, each of which reads or writes memory once.
When the framework loads a program, it writes into dram.img directly with dram_ptr, and these writes bypass mem_access and the cache.
What follows starts from the division of an address and explains the functions of cache.c in the order of the file.
'''
# src:
# 
# 代码是 mem_access 的循环：外层每页翻译一次地址，内层每行调用一次 cache_read 或 cache_write。
# mem_access 是 mem.c 中的静态函数，fetch_bytes、mem_read 与 mem_write 都调用它，acc 分别是 MEM_FETCH、MEM_READ 与 MEM_WRITE。程序运行时，只有 mem_access 调用 cache_read 与 cache_write。页面上略去了函数头、循环之后的 return 0 与循环之前的长度检查：一次访存最多 LINE_SIZE 即 64 个字节，更长的一次访存是框架的错误，程序以状态 4 退出，所以一次访存最多跨两行。
# 外层的 while 每一轮处理一页之内的部分。chunk 是 va 所在的页中剩下的字节数，最多为 nbytes。mmu_translate 把 va 换成物理地址 pa，实验二中这一步由框架的 frame/cpu/pagemap.c 完成。两个相邻的虚拟页在物理内存中可以相距很远，所以每页单独换算。写作 ... 的两行在换算失败时记下出错的地址 fault_va 并返回 -1。
# 内层的 for 每一轮处理一行之内的部分。in_line 是 pa + done 所在的行中剩下的字节数，count 取 in_line 与 chunk - done 中较小的一个，chunk - done 是这次访存在这一页中还剩的字节数。每一轮调用一次 cache_read 或 cache_write，所以每次调用的字节都在一行之内，长度为 1 到 64 字节，一次调用就是一次行访问。跨两行的一次访存因此是两次行访问，计两次命中或缺失，比如从行内偏移 60 处读 8 个字节是两次 cache_read，各读 4 个字节。取指一次读最多 15 个字节，跨两行的情况经常出现，这也是行访问次数多于指令数的原因之一。
# 框架用 frame/memtrace.c 检查每一次调用，收到跨行的调用时打印 framework error 并以状态 4 退出。关闭缓存时，它把这两个调用转给 frame/cpu/dram.c 的 uncached_read 与 uncached_write，每次调用读写一次内存。
# 装载程序时框架用 dram_ptr 直接写入 dram.img，这些写入绕过 mem_access 与缓存。
# 接下来从地址的划分开始，按文件中的顺序说明 cache.c 中的函数。


['cache-grid.notes.1']
src_hash = '08f5d6f0'
text = '''
The default cache has 64 sets of 4 ways each, 256 lines in total, and 16 KiB of data. Each cell on the left of the figure is one cache_line, and its five fields are at the upper right. valid is 1 when the line holds a copy of a line of memory. dirty is 1 when the copy has been written since it was read in, so the contents in memory are older. tag is the tag of the addresses of the copy. last_use is the value of cache_use_clock at the most recent access. data is the 64 bytes of contents.
All lines are in one array cache_lines, and the ways of a set are adjacent: way 1 of set 13 is cache_lines[13 * 4 + 1], that is, cache_lines[53]. cache_init is already written. It allocates cache_set_count × cache_way_count lines with calloc, all zeroed, so every line starts with valid 0.
cache_lookup(set_index, tag) looks only at the 4 ways of this set: the way with valid 1 and an equal tag is the line sought, and when there is none it returns NULL. A way with valid 0 must not match, because after cache_init every way has tag 0, and tag 0 is a tag that really occurs.
cache_lookup is responsible only for the lookup. What happens after a hit or a miss is decided by cache_access. The next page shows which functions a hit calls.
'''
# src:
# 
# 默认的缓存有 64 组，每组 4 路，共 256 行，数据 16 KiB。图左每一格是一个 cache_line，右上是它的五个字段。valid 为 1 表示这一行保存了内存中某一行的副本。dirty 为 1 表示副本读入之后被写过，内存中的内容较旧。tag 是副本所在地址的 tag。last_use 是最近一次访问时 cache_use_clock 的值。data 是 64 字节的内容。
# 全部的行放在一个数组 cache_lines 中，一组的各路相邻：组 13 的 way 1 是 cache_lines[13 * 4 + 1]，即 cache_lines[53]。cache_init 已经写出，它用 calloc 分配 cache_set_count × cache_way_count 行，全部清零，所以每一行开始时 valid 为 0。
# cache_lookup(set_index, tag) 只看这一组的 4 路：valid 为 1 且 tag 相等的一路就是要找的行，找不到返回 NULL。valid 为 0 的路不能匹配，因为 cache_init 之后每一路的 tag 都是 0，而 tag 0 是真实存在的 tag。
# cache_lookup 只负责查找，命中或缺失之后做什么由 cache_access 决定。下一页看命中时调用哪些函数。


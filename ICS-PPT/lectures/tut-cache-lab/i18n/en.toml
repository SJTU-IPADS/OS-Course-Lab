['cache-hit.notes.1']
src_hash = '6cc62a46'
text = '''
All four ways of set 13 are valid, with tags 0x05, 0x12, 0x07 and 0x2a, and way 3 is dirty. This state is set up to illustrate the process.
Step 1: cache_set_index and cache_tag compute set index 13 and tag 0x12, and the lookup takes place only in set 13.
Step 2: cache_lookup(13, 0x12) compares the four ways in turn. Way 1 is valid and its tag is equal, so it returns way 1.
Step 3: hit. cache_access adds 1 to cache_hits, adds 1 to cache_use_clock, which becomes 60, writes 60 into last_use of way 1, and returns way 1. cache_read copies 4 bytes from data[5] on into dst. This line access reads and writes only the line of the cache.
last_use records the order of the most recent accesses: way 1 now has the largest value, and it is the most recently used line of this set. The next page shows which functions a miss calls.
'''
# src:
# 
# 组 13 的四路都有效，tag 分别是 0x05、0x12、0x07、0x2a，way 3 是脏行。这是为说明过程设的状态。
# 第 1 步：cache_set_index 与 cache_tag 求出组号 13 与 tag 0x12，只在组 13 中查找。
# 第 2 步：cache_lookup(13, 0x12) 依次比较四路，way 1 有效且 tag 相等，返回 way 1。
# 第 3 步：命中。cache_access 给 cache_hits 加 1，cache_use_clock 加 1 变为 60，把 60 写入 way 1 的 last_use，返回 way 1。cache_read 从 data[5] 起复制 4 个字节到 dst。这次行访问只读写缓存的行。
# last_use 记录的是最近一次访问的先后：way 1 现在最大，它是这一组中最近使用的行。下一页看缺失时调用哪些函数。


['cache-funcs-evict.notes.1']
src_hash = '45856a7a'
text = '''
After cache_write writes a line, its dirty is 1 and the copy of the line in memory is older. When cache_victim selects such a line, its contents cannot be discarded.
cache_fill first computes the address of this line in memory from its own tag and the set index with cache_line_address, calls dram_line_write to write back the 64 bytes, and adds 1 to cache_writebacks. Then it follows the steps of a miss: it computes the address of the new line and reads it in with dram_line_read. The two addresses have the same set index and different tags.
In the figure cache_fill calls all three functions. This line access reads or writes memory twice, and it is the slowest of the three cases.
cache_flush on the left also calls dram_line_write. It writes back all dirty lines still in the cache, and the framework calls it after the program ends.
The next page continues the example of the hit with another address and walks through a miss that writes back a dirty line step by step.
'''
# src:
# 
# 一行被 cache_write 写过之后 dirty 为 1，内存中这一行的内容较旧。这样的行被 cache_victim 选中时，它的内容不能直接丢弃。
# cache_fill 先用 cache_line_address 由这一行自己的 tag 与组号求出它在内存中的地址，调用 dram_line_write 写回 64 字节，把 cache_writebacks 加 1，再按缺失的步骤求出新行的地址、调用 dram_line_read 读入。两个地址的组号相同，tag 不同。
# 图中 cache_fill 调用了全部三个函数。这一次行访问读写两次内存，是三种情况中最慢的一种。
# 图左的 cache_flush 也调用 dram_line_write，它把仍在缓存中的脏行全部写回，框架在程序结束后调用它。
# 下一页接着命中的例子读另一个地址，逐步走一遍缺失并写回脏行。


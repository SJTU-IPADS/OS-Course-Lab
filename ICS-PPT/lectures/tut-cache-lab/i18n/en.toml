['cache-miss.notes.1']
src_hash = '29516223'
text = '''
Step 1: cache_lookup(13, 0x13) compares the four ways. No way has tag 0x13, so it returns NULL. cache_access adds 1 to cache_misses.
Step 2: cache_victim(13) selects the way to replace. When the set has invalid ways, it selects the invalid way with the smallest number. When all four ways are valid, it selects the way with the smallest last_use, that is, the least recently used line. Here last_use is 41, 60, 50 and 33, so it selects way 3. cache_victim only selects. The counters are changed by cache_access and cache_fill.
Step 3: cache_fill handles the miss. Way 3 is dirty and its contents are newer than memory, so it is first written back with dram_line_write. The line holds only tag 0x2a, and its address is computed by cache_line_address(0x2a, 13): (0x2a × 64 + 13) × 64 = 0x2a340. cache_writebacks grows by 1. This is one memory read or write. A replaced line that is not dirty is discarded directly.
Step 4: cache_fill reads in the whole line from cache_line_address(0x13, 13) = 0x13340 with dram_line_read, then sets valid = 1, dirty = 0 and tag = 0x13. This is the second memory read or write.
Step 5: back in cache_access, cache_use_clock grows by 1 to 61, which is written into last_use of way 3, and way 3 is returned. cache_read copies from data[5] on. This line access read or wrote memory twice in total.
'''
# src:
# 
# 第 1 步：cache_lookup(13, 0x13) 比较四路，没有一路的 tag 是 0x13，返回 NULL。cache_access 给 cache_misses 加 1。
# 第 2 步：cache_victim(13) 选出被替换的路。组中有无效的路时选编号最小的无效路。四路都有效时选 last_use 最小的一路，即最近最少使用的行。这里 last_use 为 41、60、50、33，选 way 3。cache_victim 只负责选择，计数器由 cache_access 与 cache_fill 修改。
# 第 3 步：cache_fill 处理缺失。way 3 是脏行，它的内容比内存新，先用 dram_line_write 写回。行中只有 tag 0x2a，地址由 cache_line_address(0x2a, 13) 求出：(0x2a × 64 + 13) × 64 = 0x2a340。cache_writebacks 加 1，这是一次内存读写。被替换的行不脏时直接丢弃。
# 第 4 步：cache_fill 用 dram_line_read 从 cache_line_address(0x13, 13) = 0x13340 读入整行，再置 valid = 1、dirty = 0、tag = 0x13。这是第二次内存读写。
# 第 5 步：回到 cache_access，cache_use_clock 加 1 变为 61，写入 way 3 的 last_use，返回 way 3。cache_read 从 data[5] 起复制。这次行访问共读写两次内存。

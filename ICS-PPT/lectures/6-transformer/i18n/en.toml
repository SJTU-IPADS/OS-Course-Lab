['gpt.title']
src_hash = '8f0df6ce'
text = 'Generative pretrained Transformer'
# src: 生成式预训练 Transformer

['gpt.slide.1']
src_hash = 'a362178b'
text = 'GPT is short for Generative Pretrained Transformer.'
# src: GPT 是 Generative Pretrained Transformer 的缩写。

['gpt.notes.1']
src_hash = 'fea835cd'
text = 'Generative means that the model generates new text. Pretrained means that all parameters of the model are first trained on a large amount of text, with the objective of predicting the next word. Afterwards the model can be trained further on less data to adjust its parameters for a specific task, and this step is called fine-tuning. A Transformer is a kind of neural network, and it is the core technology of the current wave of AI development. This lecture follows the data as it flows through a Transformer and explains the computation step by step. The examples and numbers in this lecture are mostly taken from GPT-3, a GPT model that OpenAI released in 2020.'
# src: Generative 指模型生成新的文本。Pretrained 指模型先在大量文本上训练全部参数，训练目标是预测下一个词。之后还可以用较少的数据继续训练，针对具体任务调整参数，这一步称为微调。Transformer 是一种神经网络，是当前这一轮人工智能发展的核心技术。本讲沿着数据在 Transformer 中的流动，逐步说明每一步的计算。本讲的例子与数字多取自 GPT-3，它是 OpenAI 在 2020 年发布的 GPT 模型。

['tasks.title']
src_hash = 'fc1584d1'
text = 'Tasks of Transformers'
# src: Transformer 的任务

['tasks.slide.1']
src_hash = '5c45d8c5'
text = 'Transformers can be used to build many kinds of models.'
# src: 用 Transformer 可以构造多种模型。

['tasks.notes.1']
src_hash = 'e3e81272'
text = 'Some models take in speech and output text, and others go the other way and synthesize speech from text. Tools that generate images from text descriptions also use Transformers. The original Transformer, introduced by Google in 2017, was built for machine translation. The model behind ChatGPT takes in a piece of text, possibly accompanied by images or sound, and predicts what comes next. The prediction takes the form of a probability distribution over many possible chunks of text that might follow.'
# src: 有的模型读入语音、输出文字，有的反过来由文字合成语音。由文字描述生成图像的工具也使用 Transformer。2017 年 Google 提出的原始 Transformer 用于机器翻译。ChatGPT 所用的模型读入一段文本，可能还附带图像或声音，预测接下来的内容。预测的形式是对许多可能的后续文本片段给出概率分布。

['tasks.slide.2']
src_hash = 'b944218d'
text = 'This lecture studies text-only models.'
# src: 本讲研究的对象为纯文本模型。

['generation.title']
src_hash = '2204574a'
text = 'Prediction, sampling and appending'
# src: 预测、采样与追加

['generation.slide.1']
src_hash = 'e384f854'
text = 'A model that predicts the next word, used repeatedly, generates long text.'
# src: 把预测下一个词的模型反复使用，就能生成长文本。

['generation.notes.1']
src_hash = 'e689049c'
text = 'Given a starting text, the model predicts a probability distribution for the next word. A word is sampled at random from the distribution, and the higher its predicted probability, the more likely it is to be chosen. The starting text in the figure is Behold, a wild pi creature, foraging in its native. The model gives land a probability of 22%, so land is the most likely to be chosen. Sampling is random, and this time the sample is woodland, which has only 1%, so a word of low probability can also be chosen. The sampled word is appended to the end of the text, and the whole text is then the input for the next prediction. The percentages in the figure are truncated to whole numbers.'
# src: 给模型一段起始文本，模型预测下一个词的概率分布。从分布中随机采样一个词，预测的概率越高，越容易被选中。图中的起始文本是 Behold, a wild pi creature, foraging in its native，模型给 land 22% 的概率，land 最容易被选中。采样是随机的，这次得到的是只有 1% 的 woodland，低概率的词也可能被选中。采样得到的词追加到文本末尾，再以全部文本为输入做下一次预测。图中的百分数取整数部分。

['generation.slide.2']
src_hash = 'aae431bd'
text = 'Predict, sample, append, then predict again from the longer text.'
# src: 预测、采样、追加，再用加长后的文本重新预测。

['chat.title']
src_hash = '714b2a3d'
text = 'Continuation and chat'
# src: 续写与对话

['chat.slide.1']
src_hash = 'ba6fb353'
text = 'What a Transformer can do: given a starting text, repeated prediction, sampling and appending produce a continuation.'
# src: Transformer 能够做到的事情是：给定起始文本，反复预测、采样、追加，就得到续写。

['chat.notes.1']
src_hash = 'f27db35c'
text = "Before ChatGPT appeared, the early demos of GPT-3 continued stories and essays from an opening. The simplest way to build a chatbot is to first write a piece of text that sets up a conversation between a user and a helpful AI assistant. This text is called the system prompt. The user's question is placed as the first line of the conversation, and the model then predicts what the AI assistant would say. Making it behave well requires training the model further after pre-training, and this step is called fine-tuning, for example, ChatGPT was obtained by fine-tuning a model of the GPT-3.5 series. Fine-tuning uses conversations written by people, and people's rankings of the model's answers."
# src: 在 ChatGPT 出现之前，GPT-3 的早期演示就是根据开头续写故事和文章。要得到聊天机器人，最简单的做法是先写一段文字，设定用户与一个乐于助人的 AI 助手对话的场景，这段文字称为系统提示词。用户的问题作为对话的第一句，模型接着预测 AI 助手会说什么。要让它表现良好，还需要在预训练之后继续训练模型，这一步称为微调，比如 ChatGPT 由 GPT-3.5 系列的一个模型微调得到。微调使用人工编写的对话，以及人工对模型回答的排序。

['chat.slide.2']
src_hash = 'cb67dc13'
text = "The conversation mode of an agent is also a continuation: the input text begins with the system prompt and the user's question, and the model continues with the AI assistant's reply."
# src: Agent 的对话模式本质上也是一种续写：输入的文本里，系统提示词和用户的问题放在开头，由模型续写 AI 助手的回答。


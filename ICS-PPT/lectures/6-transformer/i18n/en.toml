text = 'The per-layer KV cache'
# src: 逐层保存的 KV cache

['kv-cache.slide.1']
src_hash = 'a98c3344'
text = 'The query of a new token must be compared with the keys of all past positions, and their values must be aggregated.'
# src: 新 token 的查询要与所有历史位置的键比较，并汇总它们的值。

['kv-cache.notes.1']
src_hash = 'ab2f925f'
text = "In every layer, the new token computes its own Q, K and V, reads that layer's cached past K and V to complete attention, and then appends its own K and V to that layer's cache. After it finishes layer l, it uses the hidden state h_6^(l) output by this layer to compute the Q, K and V of layer l+1."
# src: 新 token 在每一层计算自己的 Q、K、V，读取该层缓存的历史 K、V 完成注意力，再把自己的 K、V 追加到该层缓存。它完成第 l 层后，用这一层输出的隐藏状态 h_6^(l) 计算第 l+1 层的 Q、K、V。

['kv-cache.image.1.footnote.1']
src_hash = '10d2bfcd'
text = '[Hugging Face · Caching in Transformers](https://huggingface.co/docs/transformers/main/cache_explanation)'
# src: [Hugging Face · Transformers 的缓存机制](https://huggingface.co/docs/transformers/main/cache_explanation)

['kv-cache.slide.2']

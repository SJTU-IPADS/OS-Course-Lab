['cache-cost.notes.1']
src_hash = 'e55759b2'
text = "Requesty is a gateway that forwards requests to model APIs. It collected the requests of 9 coding agents that passed through it from May 2025 to April 2026. In April 2026, a request of Claude Code had 84,000 input tokens on average, with a cache hit rate of 92%, so only 8% of the input had to be computed again, about 6,700 tokens per request on average. This part is the new content of each request, including the output of the previous request, tool results and user messages. The report also mentions that a Claude Code session usually involves 50 to 200 calls. OpenRouter's statistics agree with this: in October 2026, the median cache hit rate of agent requests was above 90%. Starting from an empty context, each request adds about 6,700 tokens, and about 45 requests fill 300,000 tokens. The calculation below assumes that exactly 45 requests fill the context, each adding 300,000 / 45 tokens. The prices are taken from Anthropic's pricing page, in US dollars per million tokens. For Claude Fable 5.2, base input is $8, a cache write is $10 (kept for 5 minutes), a cache read is $0.20, and output is $40. Without a KV cache, all the input of every request is billed as base input: the 45 requests total (300,000 / 45) × (1 + 2 + … + 45) = 6,900,000 tokens, at a cost of $55.20. With a hit every time, request i reads from the cache the tokens accumulated by the first i − 1 requests, 6,600,000 tokens in total, at a cost of $1.32. Each request writes its new tokens to the cache, 300,000 tokens in total, at a cost of $3.00. The two add up to $4.32. The output is the same in both cases and is left out of the table. By default the cache is kept for 5 minutes, and every hit restarts the timer. The requests an agent sends in a row are much less than 5 minutes apart, so they keep hitting the cache. Without a KV cache, the server must also compute the K and V of every position again for each request, and the longer the context, the longer the wait before the first token is returned."
# src: Requesty 是转发模型 API 请求的网关，它统计了 2025 年 5 月到 2026 年 4 月经过它的 9 个编码 Agent 的请求。2026 年 4 月 Claude Code 的请求平均输入 84,000 个 token，缓存命中率为 92%，即只有 8% 的输入需要重新计算，平均每个请求约 6,700 个 token。这部分是每个请求新增的内容，包括上一个请求的输出、工具的结果和用户的消息。报告还提到一次 Claude Code 会话通常有 50 到 200 次调用。OpenRouter 的统计与此相符，2026 年 10 月 Agent 请求的缓存命中率中位数超过 90%。从空的上下文开始，每个请求新增约 6,700 个 token，约 45 个请求填满 300,000 个 token。下面按 45 个请求恰好填满计算，每个请求新增 300,000 / 45 个 token。价格取自 Anthropic 的定价页，单位是每百万 token 的美元数，Claude Fable 5.2 的普通输入为 $8，写入缓存为 $10（保留 5 分钟），读取缓存为 $0.20，输出为 $40。没有 KV cache 时，每个请求的全部输入都按普通输入计费，45 个请求共 (300,000 / 45) × (1 + 2 + … + 45) = 6,900,000 个 token，费用为 $55.20。每次都命中时，第 i 个请求读取前 i − 1 个请求累积的 token，共 6,600,000 个，费用为 $1.32。每个请求把新增的 token 写入缓存，共 300,000 个，费用为 $3.00。两项合计 $4.32。输出在两种情况下相同，表中不计入。缓存默认保留 5 分钟，每次命中重新计时，Agent 连续发出的请求间隔远小于 5 分钟，所以能够持续命中。没有 KV cache 时，服务器还要为每个请求重新计算全部位置的 K、V，上下文越长，返回第一个 token 之前的等待越长。


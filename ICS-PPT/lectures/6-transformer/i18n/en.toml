['request-recompute.slide.1']
src_hash = 'a656e02b'
text = 'Users of Claude Code run the same client, and every request begins with the same system prompt.'
# src: Claude Code 的用户运行同一个客户端，每个请求都以同一段系统提示词开头。

['request-recompute.notes.1']
src_hash = '35654777'
text = "Claude Code is Anthropic's command-line coding assistant. Its system prompt describes how it works and how each of its tools is used. The figure shows only the first sentence, and the code is schematic. Many users run the same Claude Code client, and each of them asks a different question. The client joins the system prompt and the user's question into one input and sends it to Anthropic's server as a request. The system prompt also embeds content of each user's own, such as the paths of memory files, so what all users share is the fixed part at its beginning. A request is one input sent to the model, from which the model generates tokens one by one until it finishes. The server releases the KV cache of a request when the request ends. When the next request arrives, the server computes the K and V of the same system prompt in every layer once more, marked by hatching in the figure. The next turn of the same user begins with the whole conversation so far, and that earlier conversation is computed again as well."
# src: Claude Code 是 Anthropic 的命令行编程助手。它的系统提示词说明它的工作方式和各个工具的用法，图中只写出第一句，代码是示意。许多用户运行同一个 Claude Code 客户端，各自提出不同的问题。客户端把系统提示词和用户的问题接成一段输入，作为一个请求发往 Anthropic 的服务器。系统提示词中还嵌有每个用户自己的内容，比如记忆文件的路径，各个用户相同的是它前面固定的部分。一个请求是送给模型的一段输入，模型从它开始逐个生成 token，直到结束。服务器在一个请求结束后释放它的 KV cache，下一个请求到来时，再计算一遍同一段系统提示词在各层的 K、V，图中用斜线标出。同一个用户的下一轮对话以之前的全部对话开头，之前的对话也被再次计算。

['request-recompute.image.1.footnote.1']
src_hash = 'bd16ab64'
text = "[Claude Code's npm package @anthropic-ai/claude-code (2.1.87)](https://unpkg.com/@anthropic-ai/claude-code@2.1.87/cli.js)"
# src: [Claude Code 的 npm 包 @anthropic-ai/claude-code（2.1.87）](https://unpkg.com/@anthropic-ai/claude-code@2.1.87/cli.js)

['request-recompute.highlight.1']
src_hash = '81294b9f'
text = 'Can the K and V of the system prompt that all requests share be computed only once?'
# src: 所有请求共用的系统提示词，K、V 能否只计算一次？

['prefix-tree.title']
src_hash = '8d1f10ee'
text = 'Prefix caching'
# src: 前缀缓存

['prefix-tree.slide.1']
src_hash = 'a6bcb34e'
text = 'Where two requests are identical from the first token on, their K and V in every layer are identical as well and can be kept for reuse.'
# src: 两个请求从第一个 token 起相同的部分，各层的 K、V 也相同，可以保留下来复用。

['prefix-tree.notes.1']
src_hash = '2619f769'
text = 'Under a causal mask, the K and V of a position in every layer depend only on that position and the tokens before it. The server keeps the KV cache of a request after the request ends. A new request finds the longest prefix it shares with a cached sequence, uses the K and V of those positions directly, and computes only the remaining tokens. This is called prefix caching. Reuse stops at the first different token. The positions after it read this different token in attention, so their K and V differ as well. The same token at a different position has a different position embedding and therefore a different K and V, so matching starts from the first token. The cached sequences are merged along their common prefixes into a tree, called a prefix tree. Each node of the tree holds a run of tokens and their K and V in every layer, and the path from the root to a node is a cached prefix. In the figure, all requests share the node of the system prompt, and the two turns of user A share their first segments. In frame 1, a new request is matched down the tree as far as answer 1, reuses the K and V along this path, and gets a new node for question 4. GPU memory is limited, so some nodes must be evicted when the cache is full. An internal node is a prefix of every sequence below it, so only leaves are evicted, and among the leaves the least recently used one is evicted first, which is called LRU. Frame 2 evicts answer 3 of user B. An evicted prefix is computed again when it appears again. Inference systems already organise the cache this way. For example, the RadixAttention of SGLang stores the KV cache in such a tree and evicts leaves in LRU order. vLLM looks up the cache block by block, and the identifier of a block is a hash of the tokens of the block together with the whole prefix before it, so equal identifiers mean that the prefixes are identical from the first token on.'
# src: 因果掩码下，一个位置在每一层的 K、V 只依赖它自己和它之前的 token。服务器在请求结束后保留它的 KV cache，新请求找出与已缓存的序列相同的最长前缀，直接使用这些位置的 K、V，只为其余的 token 计算，这称为前缀缓存（prefix caching）。复用只到第一个不同的 token 为止，之后的位置在注意力中读取了这个不同的 token，K、V 也不同。同一个 token 出现在不同的位置，位置嵌入不同，K、V 也不同，所以匹配从第一个 token 开始。缓存的各个序列按公共前缀合并成一棵树，称为前缀树。树的每个结点保存一段 token 和这些 token 在各层的 K、V，从根到一个结点的路径是一个已缓存的前缀。图中所有请求共用系统提示词这个结点，用户 A 的两轮共用前几段。第 1 帧中新请求沿树向下匹配到回答 1 为止，复用这条路径上的 K、V，为问题 4 新建一个结点。显存有限，缓存放满时要淘汰一部分结点。内部结点是它下面各个序列的前缀，所以只淘汰叶结点，在叶结点中先淘汰最久没有使用的，即 LRU。第 2 帧淘汰了用户 B 的回答 3。被淘汰的前缀再次出现时重新计算。推理系统已经采用这种组织方式，比如 SGLang 的 RadixAttention 用这样的树保存 KV cache，按 LRU 淘汰叶结点。vLLM 按块查找，每一块的标识是这一块的 token 与它之前整个前缀的哈希值，标识相同就表示从第一个 token 起的前缀相同。

['prefix-tree.slide.2']
src_hash = 'e9b1a6b4'
text = 'When GPU memory runs out, the least recently used leaf is evicted first.'
# src: 显存装不下时，先淘汰最久没有使用的叶结点。

['prompt-order.title']
src_hash = '1cdb96d7'
text = 'A fixed prefix'
# src: 固定前缀

['prompt-order.slide.1']
src_hash = '84fbfae8'
text = 'To let the agent know the time, one implementation writes the current time into the system prompt of every request, but then the KV cache of the prompt after the time can no longer be reused at all.'
# src: 为了让 Agent 能够感知时间，一种实现是在每次请求的系统提示词中写入当前时间，但这会导致时间之后的提示词的 KV cache 全部无法复用。

['prompt-order.notes.1']
src_hash = '53a2802f'
text = "An agent harness is the program that calls the model and assembles the prompt of every request, for example the Claude Code client. Some implementations want the model to know the current time, so they write the current time into the system prompt of every request. The time is different every time, so every request differs from the cached prefix from that point on. The rest of the system prompt after the time, the tool descriptions and the conversation so far must all be computed again, and most of the prompt misses the cache. The lower part of the figure shows this implementation. The upper part writes the time into the last message, and everything before the question is reused. The system prompt, the tool descriptions and reference documents are the same every time and go at the beginning. The user's question and the current time differ every time and go at the end. Model providers also offer prefix caching, and input tokens that hit the cache are billed at a lower price. Providers isolate caches between organizations, so requests from different organizations do not share a cache even when their prefixes are identical. Claude Code orders its requests in exactly this way: the system prompt and the tool descriptions first, then the project context, and the conversation last. It uses the prefix caching of the Anthropic API."
# src: Agent harness 是调用模型的程序，它组织每次请求的提示词，比如 Claude Code 的客户端。有的实现希望模型知道当前时间，于是在每次请求的系统提示词中写入当前时间。时间每次都不同，每个请求从这里开始与缓存的前缀不同，时间之后的系统提示词、工具的说明和之前的对话都要重新计算，缓存大量未命中。图中下方是这种实现，上方把时间写在最后一条消息中，问题之前的部分全部复用。系统提示词、工具的说明和作为参考的文档每次都相同，放在前面。用户的问题和当前时间每次不同，放在末尾。模型的服务商也提供前缀缓存，命中缓存的输入 token 按较低的价格计费。服务商按组织隔离缓存，不同组织的请求即使前缀相同，也不共用缓存。Claude Code 的请求就按这个顺序排列：系统提示词与工具的说明在前，然后是项目的上下文，最后是对话，并使用 Anthropic 接口的前缀缓存。

['prompt-order.slide.2']
src_hash = '38b90da4'
text = 'When designing an agent harness, keep the prefix as fixed as possible and put changing content at the end.'
# src: 设计 Agent harness 时应当尽量固定前缀，变化的内容放在末尾。


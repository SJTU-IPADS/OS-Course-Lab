text = 'Repeated computation in step-by-step generation'
# src: 逐步生成中的重复计算

['recompute.slide.1']
src_hash = '9f49d877'
text = 'During inference, each sampled token is appended to the input, and the earlier tokens are fed into the model again and again.'
# src: 推理时，每采样一个 token 就追加到输入，前面的 token 被一次又一次地输入模型。

['recompute.notes.1']
src_hash = '725fbcfa'
text = 'In the figure the model has already processed the five tokens a fluffy blue creature roamed, and the sampled token the is appended to the input. When the whole sequence is run again, the five old positions recompute their queries, keys, values, attention and multilayer perceptron in layer 1, and the same happens in every later layer. In the figure, hatching marks the computation of the old positions that is executed again. Whether these results are still valid has to be determined first.'
# src: 图中模型已经处理了 a fluffy blue creature roamed 五个 token，采样得到 the 之后追加到输入。整段重新运行时，旧的五个位置在第 1 层再次计算查询、键、值、注意力与多层感知机，其后每一层也是如此。图中斜线标出旧位置被重复执行的计算。需要先判断这些结果是否仍然有效。

['recompute.slide.2']
src_hash = '144a2096'
text = 'The computation of the old tokens in every layer is executed again. Do these results change because of the new token?'
# src: 旧的 token 在每一层的计算都会再次执行，这些结果会因新 token 而改变吗？

['prefix-invariance.title']
src_hash = '600413ee'
text = 'Prefix invariance of causal computation'
# src: 因果计算的前缀不变性

['prefix-invariance.slide.1']
src_hash = '1cedddb0'
text = 'Under a causal mask, every layer of a position depends only on that position and the positions before it.'
# src: 因果掩码下，一个位置的每一层只依赖它自己和它之前的位置。

['prefix-invariance.notes.1']
src_hash = 'fe8edc4d'
text = 'A layer consists of an attention block and a multilayer perceptron. The multilayer perceptron computes on each vector separately, and only attention reads other positions, which is restricted by the causal mask. In the figure, the query of creature in every layer reads only the keys and values of positions 1 to 4, and the lines that would read roamed and the are cut by the mask. In the figure, h_4^(l) is the hidden state output by position 4 in layer l. The argument is by induction over the layers. The input to layer 1 is the embeddings, and those of the old positions are unchanged. If the outputs of the old positions in layer l are unchanged, the causal attention of layer l+1 reads only the old prefix, and the multilayer perceptron does not involve the new positions either, so the outputs of the old positions are still unchanged. This assumes that the parameters are fixed during inference and that positions are handled the same way. When the prefix is edited, the parameters are replaced or the position scheme changes, the affected state must be recomputed.'
# src: 一层由注意力块和多层感知机组成。多层感知机对每个向量单独计算，只有注意力读取其他位置，而它受因果掩码限制。图中 creature 在每一层的查询只读取位置 1 到 4 的键和值，读取 roamed 与 the 的连线被掩码切断。图中的 h_4^(l) 是第 4 个位置在第 l 层输出的隐藏状态。按层归纳：第 1 层的输入是嵌入，旧位置不变。若第 l 层旧位置的输出不变，第 l+1 层的因果注意力只读取旧前缀，多层感知机也不涉及新位置，旧位置的输出仍不变。前提是推理时参数固定、位置的处理方式不变。编辑前缀、更换参数或改变位置规则时，受影响的状态必须重算。

['prefix-invariance.slide.2']
src_hash = '6468dfe9'
text = 'Appending a new token changes none of the Q, K, V and outputs of the old positions in any layer, so these results need not be recomputed.'
# src: 追加新 token 不改变旧位置在任何一层的 Q、K、V 与输出，这些结果不必重算。


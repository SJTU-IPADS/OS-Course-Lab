text = "For ease of illustration, tokens are treated here as whole words. GPT-3's vocabulary has 50,257 tokens. W_E is part of the model's parameters. Its values start out random and are learned from data during pre-training, together with the other parameters of the network. The entries of the matrix in the figure are coloured by sign, blue for positive and red for negative. Turning words into vectors was already common practice in machine learning before the Transformer, for example, word2vec and GloVe train a dedicated table of word vectors, which other models then use."

['news-anthropic-blog.aside.1']
src_hash = '3461a760'
text = 'But this approach can be surprisingly fragile. We’ve broken this ordering before for a variety of reasons, including: putting an in-depth timestamp in the static system prompt, shuffling tool order definitions non-deterministically, and updating parameters of tools (e.g., what agents the Agent tool can call).'
# src: But this approach can be surprisingly fragile. We’ve broken this ordering before for a variety of reasons, including: putting an in-depth timestamp in the static system prompt, shuffling tool order definitions non-deterministically, and updating parameters of tools (e.g., what agents the Agent tool can call).

['news-anthropic-blog.notes.1']
src_hash = 'd8d61b4d'
text = "The post was written by Thariq Shihipar and published on 30 April 2026. The figure on the right is the prompt layout of Claude Code from the post. From top to bottom it holds the base system instructions, the tools, CLAUDE.md and memory, the session state, and the messages, which grow with each turn. The lower a layer, the more often it changes. The quotation says that this ordering is fragile, and that Claude Code has broken it for several reasons: a detailed timestamp written into the static system prompt, tool definitions in no fixed order, and changes to the parameters of tools, for example which agents the Agent tool can call. The timestamp is the case of the previous page: the time differs every time, so nothing after it can hit the cache. The post's approach is to put information that goes out of date into the messages of the conversation. Claude Code adds a system-reminder tag to the next user message or tool result and writes the updated information into it. The post also notes that a cache miss rate of a few percentage points already has a marked effect on cost and latency."
# src: 博客的作者是 Thariq Shihipar，2026 年 4 月 30 日发表。右图是博客中 Claude Code 的提示词布局，从上到下依次是基础的系统指令、工具、CLAUDE.md 与记忆、会话状态、每轮增长的消息，越往下变化越多。引文的意思是：这种排列很脆弱，Claude Code 曾经因为几种原因破坏它，包括在静态的系统提示词中写入详细的时间戳、工具定义的顺序不固定、修改工具的参数，比如 Agent 工具可以调用哪些 agent。写入时间戳就是上一页的情形，时间每次不同，之后的内容都不能命中缓存。博客的做法是把会过时的信息放进对话中的消息，Claude Code 在下一条用户消息或工具的结果中加一个 system-reminder 标签，写入更新后的信息。博客还提到，几个百分点的缓存未命中率就会显著影响成本和延迟。


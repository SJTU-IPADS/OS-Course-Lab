['sources.slide.1']
src_hash = '9be1ca28'
text = '''
- [3Blue1Brown · Deep Learning chapter 5](https://www.youtube.com/watch?v=wjZofJX0v4M) · [text version](https://www.3blue1brown.com/lessons/gpt)
- [3Blue1Brown · Deep Learning chapter 6](https://www.youtube.com/watch?v=eMlx5fFNoYc) · [text version](https://www.3blue1brown.com/lessons/attention)
- [Andrej Karpathy · Let's build GPT: from scratch, in code, spelled out](https://www.youtube.com/watch?v=kCc8FmEb1nY)
- [Vivek · What does it mean for computers to understand language?](https://www.youtube.com/watch?v=1il-s4mgNdI)
- [Art of the Problem · 30 Year History of ChatGPT](https://www.youtube.com/watch?v=OFS90-FX6pg)
- [Vaswani et al. · Attention Is All You Need (2017)](https://arxiv.org/abs/1706.03762)
- [Brown et al. · Language Models are Few-Shot Learners (2020)](https://arxiv.org/abs/2005.14165)
- [Hugging Face · Caching in Transformers](https://huggingface.co/docs/transformers/main/cache_explanation)
- [Zheng et al. · SGLang: Efficient Execution of Structured Language Model Programs (2024)](https://arxiv.org/abs/2312.07104)
- [vLLM · Automatic Prefix Caching](https://docs.vllm.ai/en/latest/design/prefix_caching.html)
- [Claude Code · Prompt caching](https://code.claude.com/docs/en/prompt-caching)
- [Anthropic · Lessons from building Claude Code: Prompt caching is everything](https://claude.com/blog/lessons-from-building-claude-code-prompt-caching-is-everything)
'''
# src:
# - [3Blue1Brown · 深度学习第 5 章](https://www.youtube.com/watch?v=wjZofJX0v4M) · [图文版](https://www.3blue1brown.com/lessons/gpt)
# - [3Blue1Brown · 深度学习第 6 章](https://www.youtube.com/watch?v=eMlx5fFNoYc) · [图文版](https://www.3blue1brown.com/lessons/attention)
# - [Andrej Karpathy · Let's build GPT: from scratch, in code, spelled out](https://www.youtube.com/watch?v=kCc8FmEb1nY)
# - [Vivek · What does it mean for computers to understand language?](https://www.youtube.com/watch?v=1il-s4mgNdI)
# - [Art of the Problem · 30 Year History of ChatGPT](https://www.youtube.com/watch?v=OFS90-FX6pg)
# - [Vaswani 等 · Attention Is All You Need（2017）](https://arxiv.org/abs/1706.03762)

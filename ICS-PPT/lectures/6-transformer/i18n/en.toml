text = 'GloVe is a word-vector model proposed in 2014. It learns only a table of word vectors, and its training data are statistics of how often words occur together in a corpus. The figure uses the 50-dimensional GloVe, trained on the Wikipedia and Gigaword news corpora. These pages use it to show that positions and directions in the embedding space can carry meaning. The embedding matrix of GPT is learned during pre-training, together with the other parameters of the network, with the objective of predicting the next token. The dashed box holds the ten words closest to tower, with distance measured as Euclidean distance.'

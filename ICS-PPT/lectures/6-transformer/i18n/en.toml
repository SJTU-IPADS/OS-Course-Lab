text = 'Sidebar: neighbors of word vectors'
# src: sidebar：词向量的近邻

['sidebar-tower-neighbors.slide.1']
src_hash = '96cee8b3'
text = 'In trained embeddings, words with similar meanings lie close to each other, for example, the neighbors of tower in the GloVe word-vector model.'
# src: 训练得到的嵌入中，含义相近的词彼此靠近，比如 GloVe 词向量模型中 tower 的近邻。

['sidebar-tower-neighbors.notes.1']
src_hash = 'c232f5a8'
text = 'GloVe is a word-vector model proposed in 2014. It learns only a table of word vectors, and its training data are statistics of how often words occur together in a corpus. The figure uses the 50-dimensional GloVe, trained on the Wikipedia and Gigaword news corpora. The embedding matrix of GPT is learned during pre-training, together with the other parameters of the network, with the objective of predicting the next token. The dashed box holds the ten words closest to tower, with distance measured as the Euclidean distance between the 50-dimensional vectors. The positions of the points in the figure are schematic: the high-dimensional vectors are drawn in a three-dimensional space, and their components along all other directions are lost.'
# src: GloVe 是 2014 年提出的词向量模型，它只学习一张词向量表，训练数据是语料中词与词共同出现的统计。图中是 50 维的 GloVe，用 Wikipedia 与 Gigaword 新闻语料训练。GPT 的嵌入矩阵在预训练中与网络的其他参数一起学习，训练目标是预测下一个 token。虚线框内是与 tower 距离最近的十个词，距离按 50 维向量之间的欧氏距离计算。图中点的位置是示意，把高维向量画在三维空间中，其余方向上的分量全部丢失。

['sidebar-tower-neighbors.image.1.footnote.1']
src_hash = 'c9a3717f'
text = '[GloVe (glove-wiki-gigaword-50)](https://nlp.stanford.edu/projects/glove/)'
# src: [GloVe（glove-wiki-gigaword-50）](https://nlp.stanford.edu/projects/glove/)

['sidebar-tower-neighbors.slide.2']
src_hash = 'ab8bfa84'
text = 'The words whose embeddings are closest to that of tower are all related to towers and buildings.'
# src: 与 tower 的嵌入距离最近的词，都与塔和建筑相关。

['sidebar-analogies.title']
src_hash = '7c8f970a'
text = 'Sidebar: analogies between word vectors'
# src: sidebar：词向量的类比

['sidebar-analogies.slide.1']
src_hash = '6628caf5'
text = 'Many other directions in the embedding space also carry meaning, and vector addition and subtraction can reveal the associations between words in the training corpus.'
# src: 嵌入空间中还有许多方向带有语义，向量的加减能揭示训练语料中词与词的关联。

['sidebar-analogies.notes.1']
src_hash = '42f29703'
text = 'The examples in the figure are computed with GloVe, and the positions of the points are schematic. Italy minus Germany plus Hitler gives a result close to Mussolini, as if GloVe had learned one direction for Italy and another for Axis leaders of World War II. Adding Germany minus Japan to sushi gives a result close to bratwurst (a German sausage).'
# src: 图中的例子用 GloVe 计算，点的位置是示意。Italy 减 Germany 再加 Hitler，结果接近 Mussolini，好像 GloVe 学到了一个表示意大利的方向和一个表示二战轴心国领导人的方向。Germany 减 Japan 加到 sushi 上，结果接近 bratwurst（德国香肠）。

['sidebar-context-size.title']
src_hash = 'bbe71c99'
text = 'Sidebar: context size'
# src: sidebar：上下文长度

['sidebar-context-size.slide.1']
src_hash = '558f58cb'
text = 'The network can process only a fixed number of vectors at a time, called the context size, for example 2,048 for GPT-3.'
# src: 网络一次只能处理固定数量的向量，称为上下文长度，比如 GPT-3 的上下文长度为 2,048。

['sidebar-context-size.notes.1']
src_hash = '54cf3c4d'
text = 'Each token corresponds to a vector, and the context size limits the number of tokens one prediction can use. Early versions of ChatGPT appeared to forget earlier parts of a long conversation, and the cause was this limit on length.'
# src: 每个 token 对应一个向量，上下文长度限制了一次预测能用到的 token 数。早期版本的 ChatGPT 在对话很长之后会显得忘记前面的内容，原因就在这个长度限制。

['sidebar-context-size.highlight.1']
src_hash = '461dcde7'
text = 'How is input that exceeds the context size handled?'
# src: 如何处理上下文超出上限的情况？

['sidebar-context-overflow.title']
src_hash = '27b9f367'
text = 'Sidebar: handling input that exceeds the context size'
# src: sidebar：上下文超出上限的处理方法

['sidebar-context-overflow.slide.1']
src_hash = '751a4ab7'
text = 'When the number of input tokens exceeds the context size, there are three common ways to handle it.'
# src: 输入的 token 数超过上下文长度时，常见的处理方法有三种。

['sidebar-context-overflow.notes.1']
src_hash = '3aecb3f2'
text = 'The first method keeps only the most recent tokens, and earlier content outside the window no longer takes part in the prediction. The second method rejects the whole request and returns an error, leaving the caller to shorten the input, and the cloud APIs of models work this way by default. The third method, when the context nears its limit, has the model write the conversation so far as a summary, replaces the original conversation with the summary and continues, and agents mostly work this way. The summary keeps the main points of the earlier conversation, and details may be lost.'
# src: 第一种方法只保留最近的 token，窗口之外的早期内容不再参与预测。第二种方法拒绝整个请求并返回错误，由调用方自行缩短输入，模型的云服务接口默认采用这种方式。第三种方法在上下文接近上限时，让模型把此前的会话写成一段摘要，用摘要替换原来的会话再继续，Agent 多采用这种方式。摘要保留此前会话的要点，细节可能丢失。

['sidebar-context-overflow.slide.2']
src_hash = '3555718c'
text = 'Discarding and returning an error are simple to implement. Summarizing keeps the main points of earlier content, but generating the summary takes an extra inference pass of the model.'
# src: 舍弃与报错实现简单，总结能保留早先内容的要点，但生成摘要需要模型额外推理一次。

['sidebar-unembedding.title']
src_hash = '1632ad89'
text = 'Sidebar: the unembedding matrix and logits'
# src: sidebar：解嵌入矩阵与 logits

['sidebar-unembedding.slide.1']
src_hash = 'e78600a3'
text = 'The input of the unembedding matrix is the output of the attention block and multilayer perceptron of the last layer. Its output is called the logits, which reflect the relative probabilities of the tokens and, normalized by Softmax, give the probability distribution over the next token.'
# src: 解嵌入矩阵的输入是最后一层注意力块和多层感知机的输出，输出称为 logits，反映各 token 概率的相对高低，经 Softmax 归一化后是下一个 token 的概率分布。

['sidebar-unembedding.notes.1']
src_hash = 'c2e2d03c'
text = 'The text mentions Harry Potter, the words right before the last one are least favourite teacher, and the last word is Professor. A well-trained network that knows Harry Potter would give Snape a high probability. The computation has two steps. First, the unembedding matrix maps the last vector to a list of numbers, one value per token, and this list is the logits. Then Softmax normalizes the logits into a probability distribution. Like those of the embedding matrix, the entries of W_U start out random and are learned during pre-training. W_U can also be taken directly as the transpose of W_E, so that the two share the same parameters, for example, in GPT-2.'
# src: 文本中出现了 Harry Potter，紧挨着最后一个词的是 least favourite teacher，最后一个词是 Professor。训练良好、熟悉哈利·波特的网络会给 Snape 很高的概率。计算分两步。先用解嵌入矩阵把最后一个向量映射为一列数，每个 token 一个值，这列数就是 logits。再用 Softmax 把 logits 归一化为概率分布。W_U 的元素与嵌入矩阵一样从随机数开始，在预训练中学习。W_U 也可以直接取 W_E 的转置，两者共用同一组参数，比如 GPT-2。

['sidebar-unembedding.slide.2']
src_hash = 'e6ba3792'
text = 'For example, the unembedding matrix $W_U$ of GPT-3 maps the last vector to 50,257 values, the same as the number of tokens in the vocabulary, and Softmax then normalizes them into probabilities.'
# src: 比如 GPT-3 的解嵌入矩阵 $W_U$ 把最后一个向量映射为 50,257 个值，与词表中 token 的总数相同，Softmax 再把它们归一化为概率。

['sidebar-softmax-behavior.title']
src_hash = '0066ee9a'
text = 'Sidebar: behavior of Softmax'
# src: sidebar：Softmax 的取值特点

['sidebar-softmax-behavior.slide.1']
src_hash = '0167c9c6'
text = 'Softmax is a "soft" version of taking the maximum. When one input is clearly the largest, it takes almost all the probability. When several inputs are equally large, they share the probability.'
# src: Softmax 是一种“柔和”的取最大值。一个输入明显最大时，它几乎占据全部概率。几个输入同样大时，它们共同分得概率。

['sidebar-softmax-behavior.notes.1']
src_hash = '28379a0b'
text = 'When sampling from this distribution, an input that is clearly the largest is chosen almost every time. Unlike taking the maximum directly, it gives other values a substantial share of the probability when they are equally large.'
# src: 若从这个分布采样，一个明显最大的输入几乎总会被选中。与直接取最大值不同，其他值同样大时，它们也分得可观的概率。

['sidebar-temperature.title']
src_hash = '86dc3b83'
text = 'Sidebar: the temperature of Softmax'
# src: sidebar：Softmax 的温度

['sidebar-temperature.slide.1']
src_hash = '25f2ba66'
text = 'The exponents of Softmax can be divided by a constant $T$, called the temperature.'
# src: Softmax 的指数中可以除以一个常数 $T$，称为温度。

['sidebar-temperature.notes.1']
src_hash = 'dee8f6c2'
text = 'The name comes from its resemblance to the temperature in certain thermodynamics equations. When ChatGPT uses this distribution to generate the next word, the temperature adjusts the randomness. T = 0 is understood as a limit, meaning that the largest value is always chosen. The three marks under the slider are three typical cases: at T = 10 the probabilities are close to each other, at T = 1 the result equals Softmax without a temperature, and at T = 0 all the probability falls on Snape.'
# src: 这个名称来自它与某些热力学公式中温度的相似。ChatGPT 用这个分布生成下一个词时，可以用温度调节随机性。T = 0 按极限理解，即总是选择最大的值。滑动条下的三个刻度是三种典型情形：T = 10 时各个概率相近，T = 1 时结果与不带温度的 Softmax 相同，T = 0 时全部概率落在 Snape 上。

['sidebar-temperature.slide.2']
src_hash = 'ba63d1fa'
text = 'The larger $T$, the more uniform the distribution. The smaller $T$, the more the largest value dominates. At $T = 0$, all the probability falls on the largest value.'
# src: $T$ 越大，分布越均匀。$T$ 越小，最大值越占优势。$T = 0$ 时全部概率落在最大值上。

['sidebar-temperature-stories.title']
src_hash = 'e944640d'
text = 'Sidebar: the effect of temperature on generated text'
# src: sidebar：温度对生成文本的影响

['sidebar-temperature-stories.slide.1']
src_hash = 'd3ceafc6'
text = 'GPT-3 writes a story starting from Once upon a time, there was a, at different temperatures.'
# src: 让 GPT-3 从 Once upon a time, there was a 开始写故事，取不同的温度。

['sidebar-temperature-stories.notes.1']
src_hash = '4de1e700'
text = 'At temperature 0, the model always picks the most likely word, and the story is a trite derivative of Goldilocks. A higher temperature gives the model a chance to pick less likely words, and the story begins with a young web artist from South Korea but quickly degenerates into nonsense. The API at the time did not allow temperatures above 2. This is not a mathematical limit, only a way to keep the tool from generating overly absurd content. The high-temperature demo in the video takes the top 20 candidates returned by the API, raises their probabilities to the power 1/5 and renormalizes them, which is equivalent to T = 5 over these 20 candidates.'
# src: 温度为 0 时，模型总是选择最可能的词，故事是 Goldilocks 的老套翻版。较高的温度让模型有机会选择不太可能的词，故事从一位韩国的年轻网络艺术家开始，但很快变得没有意义。当时的 API 不允许温度超过 2，这不是数学上的限制，只是为了避免工具生成过于荒谬的内容。视频中的高温演示取 API 返回的前 20 个候选，把概率取 1/5 次方后重新归一化，相当于在这 20 个候选上取 T = 5。

['sidebar-temperature-stories.slide.2']
src_hash = '67dc7e26'
text = 'At temperature 0 the story is trite. At a higher temperature the opening is more original, at the risk of losing coherence.'
# src: 温度为 0 时故事老套。温度较高时开头更新颖，但有失去连贯的风险。


['dataflow-overview.title']
src_hash = '7d2a34db'
text = 'The computation flow of a Transformer'
# src: Transformer 的计算流程

['dataflow-overview.slide.1']
src_hash = '2118d1a2'
text = 'The input tokens pass in turn through the embedding, many layers of attention blocks and multilayer perceptrons, the unembedding and Softmax.'
# src: 输入的 token 依次经过嵌入、多层的注意力块与多层感知机、解嵌入与 Softmax。

['dataflow-overview.notes.1']
src_hash = '3ab85ec0'
text = 'The input text is first cut into tokens. The figure shows only the last four tokens, and aging is the second piece of foraging. The embedding takes the corresponding column of the embedding matrix for each token, giving a vector. The sequence of vectors enters an attention block, where the vectors at the different positions pass information to one another through matrix multiplications, dot products and Softmax. It then enters a multilayer perceptron, where each vector goes through the same set of matrix multiplications on its own. An attention block and a multilayer perceptron form one layer. Such layers are repeated many times, and the output of one layer is the input of the next. The last vector output by the last layer is multiplied by the unembedding matrix, giving a score for each token in the vocabulary, and Softmax turns the scores into a probability distribution. Sampling from the distribution gives woodland, which is appended to the end of the text before the next prediction starts.'
# src: 输入的文本先被切成 token，图中只画出最后四个 token，其中 aging 是 foraging 切开后的后一段。嵌入为每个 token 取出嵌入矩阵中对应的一列，得到一个向量。向量序列进入注意力块，各位置的向量经矩阵乘法、点积与 Softmax 互相传递信息。之后进入多层感知机，每个向量各自经过同一组矩阵乘法。一个注意力块和一个多层感知机组成一层，这样的层重复多次，前一层的输出是后一层的输入。最后一层输出的最后一个向量乘以解嵌入矩阵，为词表中每个 token 得到一个分数，Softmax 把分数变为概率分布。从分布中采样得到 woodland，追加到文本末尾，再开始下一次预测。

['dataflow-overview.slide.2']
src_hash = '85bb79f5'
text = 'After the embedding, every step is mainly matrix multiplication. Only the attention block passes information between positions.'
# src: 嵌入之后的各步主要是矩阵乘法。只有注意力块在位置之间传递信息。

['tokens.title']
src_hash = 'c464628f'
text = 'What is a token'
# src: 什么是 token

['tokens.slide.1']
src_hash = 'b66aa49c'
text = 'A Transformer first breaks its input into small pieces, each called a token.'
# src: Transformer 先把输入切成小段，每一段称为一个 token。

['tokens.notes.1']
src_hash = '1c5d8d70'
text = 'The sentence in the figure is split the way GPT-3 tokenizes it: cleverest becomes three tokens, cle, ve and rest, and the comma is a token of its own. To keep the examples simple, the following pages often treat one word as one token.'
# src: 图中的句子按 GPT-3 的分词结果切分：cleverest 被切成 cle、ve、rest 三个 token，逗号单独是一个 token。为了便于举例，后面常把一个词当作一个 token。

['tokens.slide.2']
src_hash = '434b1b82'
text = 'A token can be a word, a piece of a word or a punctuation mark, and also a small patch of an image or a short clip of sound.'
# src: token 可以是词、词的一部分或标点，也可以是图像的小块、声音的短片段。

['embedding-matrix.title']
src_hash = '4e64a7a9'
text = 'The embedding matrix'
# src: 嵌入矩阵

['embedding-matrix.slide.1']
src_hash = 'fe77363e'
text = 'The model has a predetermined vocabulary. The embedding matrix $W_E$ holds one column for each token in the vocabulary.'
# src: 模型有一个预先确定的词表。嵌入矩阵 $W_E$ 为词表中的每个 token 保存一列。

['embedding-matrix.notes.1']
src_hash = '9ce9f660'
text = "Each token corresponds to a vector, a column of numbers that encodes the meaning of that token. For ease of illustration, tokens are treated here as whole words. GPT-3's vocabulary has 50,257 tokens. W_E is part of the model's parameters. Its values start out random and are learned from data during pre-training, together with the other parameters of the network. The entries of the matrix in the figure are coloured by sign, blue for positive and red for negative. The embedding that enters layer 1 also has the column of the position embedding matrix for its position added to it, so that it encodes both the token and its position in the text. The position embedding matrix is also learned during pre-training, for example, GPT-2 stores one column for each of 1,024 positions. Turning words into vectors was already common practice in machine learning before the Transformer, for example, word2vec and GloVe train a dedicated table of word vectors, which other models then use."
# src: 每个 token 对应一个向量，即一列数，用来编码这个 token 的含义。为了举例方便，这里把 token 当作完整的词。GPT-3 的词表有 50,257 个 token。W_E 是模型参数的一部分，它的值从随机数开始，在预训练中与网络的其他参数一起根据数据学习。图中矩阵的元素按正负着色，蓝色为正，红色为负。输入第 1 层的嵌入还要加上位置嵌入矩阵中这个位置的一列，使它同时编码 token 和它在文本中的位置。位置嵌入矩阵也在预训练中学习，比如 GPT-2 为 1,024 个位置各保存一列。把词变成向量在 Transformer 之前已是机器学习的常用做法，比如 word2vec 与 GloVe 专门训练一张词向量表，再交给其他模型使用。

['embedding-matrix.slide.2']
src_hash = '74c7483d'
text = 'Each input token takes the corresponding column of $W_E$ as its vector.'
# src: 输入的每个 token 取出 $W_E$ 中对应的一列，作为它的向量。

['embedding-direction.title']
src_hash = '009cd9f6'
text = 'Directions and dot products in the embedding space'
# src: 嵌入空间中的方向与点积

['embedding-direction.slide.1']
src_hash = '7b5f6f22'
text = 'Directions in the embedding space can carry meaning, for example, the difference between woman and man is close to the difference between queen and king.'
# src: 嵌入空间中的方向可以带有语义，比如 woman 与 man 之差接近 queen 与 king 之差。

['embedding-direction.notes.1']
src_hash = '828c9ddb'
text = 'An embedding is a point in a high-dimensional space, for example, a GPT-3 embedding is a point in a 12,288-dimensional space, and words with similar meanings lie close to each other. The positions of the points in the figure are schematic. The example on the left is computed with the GloVe word-vector model: the word closest to king plus woman minus man is queen, but the actual position of queen lies some distance from that point. The dot product multiplies the corresponding components of two vectors and adds the results, for example, the dot product of (2, 1, −1, 3) and (1, 3, 0, 2) is 2 + 3 + 0 + 6 = 11. woman − man and queen − king point in similar directions, and their dot product is positive.'
# src: 嵌入是高维空间中的点，比如 GPT-3 的嵌入是 12,288 维空间中的点，含义相近的词彼此靠近。图中点的位置是示意。左边的例子用 GloVe 词向量模型计算：king 加上 woman 减 man，离结果最近的词是 queen，但 queen 的实际位置与这个点有一段距离。点积把两个向量的对应分量相乘再相加，比如 (2, 1, −1, 3) 与 (1, 3, 0, 2) 的点积为 2 + 3 + 0 + 6 = 11。woman − man 与 queen − king 方向接近，它们的点积为正。

['embedding-direction.slide.2']
src_hash = 'a25c80b7'
text = 'The dot product of two vectors measures how well their directions align: it is positive when the directions are similar, zero when they are perpendicular, and negative when they are opposite.'
# src: 两个向量的点积衡量它们的方向是否一致：方向相近时为正，垂直时为零，相反时为负。

['attention-preview.title']
src_hash = 'e0e8d982'
text = 'Attention block: passing information between vectors'
# src: 注意力块：向量之间的信息传递

['attention-preview.slide.1']
src_hash = 'd9e7f246'
text = 'The sequence of vectors passes through an attention block, where the vectors pass information to one another, so that each vector contains part of the information of the other tokens.'
# src: 向量序列经过注意力块，各向量之间传递信息，使每个向量包含其他 token 的一部分信息。

['attention-preview.notes.1']
src_hash = '0a070b73'
text = 'The word model means one thing in machine learning model and another in fashion model. The two instances of model start as the same vector, and attention updates them into different vectors according to the context. The meaning referred to here is encoded entirely in the components of the vectors.'
# src: machine learning model 中的 model 指机器学习模型，fashion model 中的 model 指时装模特。两处 model 开始时是同一个向量，注意力根据上下文把它们更新成不同的向量。这里所说的含义，全部编码在向量的分量中。

['mlp-preview.title']
src_hash = 'b8124f86'
text = 'Multilayer perceptron: a transformation of each vector'
# src: 多层感知机：逐个向量的变换

['mlp-preview.slide.1']
src_hash = 'c8595122'
text = 'The output vectors of the attention block then pass through a multilayer perceptron (also called a feed-forward layer), which transforms each vector on its own and adds knowledge the model learned in pre-training.'
# src: 注意力块的输出向量接下来经过多层感知机（也称前馈层），它对每个向量单独变换，加入模型在预训练中学到的知识。

['mlp-preview.notes.1']
src_hash = '02bc01a7'
text = 'The multilayer perceptron computes on each vector separately. It first checks which features the vector encodes (written as questions in the figure), then produces an update from the results and adds it to that vector, for example: after the attention block a vector may encode the name Michael Jordan. Even if basketball does not appear in the context, the multilayer perceptron can add a direction related to basketball to this vector. This piece of knowledge is stored in the parameters of the multilayer perceptron and comes from pre-training. About two thirds of the parameters of GPT-3 are in the multilayer perceptrons. The computation in both the attention block and the multilayer perceptron is mostly linear, that is, matrix multiplication, and understanding these matrices is the main task of this lecture. A normalization step also sits between the two kinds of blocks and is omitted here.'
# src: 多层感知机对每个向量单独计算：先检验向量编码了哪些特征（图中写成问题），再根据结果给出一个更新量，加到这个向量上，比如一个向量经过注意力块后编码了 Michael Jordan 这个名字，上下文中没有出现篮球，多层感知机可以在这个向量上加入与篮球相关的方向。这条知识存在多层感知机的参数中，由预训练得到。GPT-3 约三分之二的参数在多层感知机中。注意力块和多层感知机的运算都主要是线性运算，即矩阵乘法，理解这些矩阵是本讲的主要任务。两种块之间还有归一化步骤，这里略去。

['mlp-preview.slide.2']
src_hash = '01f02ffd'
text = 'The attention block takes information from the context. The multilayer perceptron takes information from the model parameters.'
# src: 注意力块从上下文中获取信息，多层感知机从模型参数中获取信息。

['layer-stack.title']
src_hash = 'f91ed0c5'
text = 'Multilayer Transformer'
# src: 多层 Transformer

['layer-stack.slide.1']
src_hash = 'def69f4b'
text = 'Attention blocks and multilayer perceptrons usually alternate and are repeated many times.'
# src: 注意力块与多层感知机往往交替重复多次。

['layer-stack.notes.1']
src_hash = 'f06cfc5a'
text = 'An attention block and a multilayer perceptron form one layer. Within a layer, each vector receives information from the other vectors once and then goes through one transformation on its own. Information that the other vectors receive in this layer reaches it only in the next layer. The more layers there are, the more context each vector can combine and the more specific the meaning it encodes. The last vector output by the last layer is used to predict the next token.'
# src: 一个注意力块和一个多层感知机组成一层。在一层中，每个向量从其他向量获得一次信息，再各自经过一次变换。其他向量在这一层获得的信息，要到下一层才能传给它。层数越多，每个向量能结合的上下文越多，编码的含义也越具体。最后一层输出的最后一个向量用来预测下一个 token。

['layer-stack.slide.2']
src_hash = '4ad72d54'
text = 'With many layers, a vector can repeatedly use the context gathered in earlier layers and encode more complex meanings step by step.'
# src: 重复多层，向量才能多次利用在前面各层已经汇集的上下文，逐步编码更复杂的含义。

['softmax.title']
src_hash = '02fc7694'
text = 'Softmax'
# src: Softmax

['softmax.slide.1']
src_hash = '4b0a43e7'
text = 'The last vector is multiplied by the unembedding matrix $W_U$, giving a score for each token in the vocabulary. The scores are not yet a probability distribution.'
# src: 最后一个向量乘以解嵌入矩阵 $W_U$，得到词表中各 token 的分数。分数还不是概率分布。

['softmax.notes.1']
src_hash = '61ea5b05'
text = 'A probability distribution requires every value to lie between 0 and 1 and all values to sum to 1. The scores from a matrix multiplication are often negative or much greater than 1, and their sum is almost never 1. Exponentiation makes all the values positive, and dividing by their sum normalizes them into a list that sums to 1. The largest input gives the output closest to 1, and smaller inputs give outputs close to 0. The figure shows the scores of several candidate tokens after a text that mentions Harry Potter and ends with least favourite teacher, Professor.'
# src: 概率分布要求每个值在 0 与 1 之间，且总和为 1。矩阵乘法得到的分数常常是负数或远大于 1，总和也几乎不会是 1。取指数后所有值都为正，再除以总和就归一化为和为 1 的一列数。最大的输入对应最接近 1 的输出，较小的输入对应接近 0 的输出。图中是一段提到 Harry Potter、以 least favourite teacher, Professor 结尾的文本之后，几个候选 token 的分数。

['softmax.slide.2']
src_hash = '50fa2f76'
text = 'Softmax raises $e$ to the power of each number and divides by the sum of these powers: $p_i = e^{x_i} / \sum_j e^{x_j}$.'
# src: Softmax 先对每个数取 $e$ 的幂，再除以它们的总和：$p_i = e^{x_i} / \sum_j e^{x_j}$。


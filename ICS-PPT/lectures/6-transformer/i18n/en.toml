['dataflow-overview.title']
src_hash = 'ab79a0fa'
text = 'The inside of a Transformer'
# src: Transformer 的内部结构

['dataflow-overview.slide.1']
src_hash = 'e21a150f'
text = 'Inside a Transformer, text passes in turn through the embedding, attention blocks, multilayer perceptrons and the unembedding.'
# src: 文本在 Transformer 中依次经过词嵌入、注意力块、多层感知机和解嵌入。

['dataflow-overview.notes.1']
src_hash = 'c33e754e'
text = 'The left of the figure is the whole model: a text goes into the Transformer, and the completed text comes out. The right is the computation inside the model, where the data flows from bottom to top. The input text is first cut into small pieces, and each piece is called a token. The figure shows only the last four tokens, and aging is the second piece of foraging. The embedding replaces each token with a vector, a column of numbers. The sequence of vectors enters an attention block, where the vectors pass information to one another. It then enters a multilayer perceptron, where each vector goes through the same operation on its own. An attention block and a multilayer perceptron form one layer. Such layers are repeated many times, and the output of one layer is the input of the next. The last vector output by the last layer goes through the unembedding and is then converted into probabilities, giving the probability distribution over all possible next tokens. Sampling from this distribution gives woodland, which is appended to the end of the text: this is the completed text at the top left of the figure.'
# src: 图左侧是整个模型：一段文本输入 Transformer，输出补全后的文本。右侧是模型内部的计算，数据自下而上流动。输入的文本先被切成小段，每一段称为一个 token。图中只画出最后四个 token，其中 aging 是 foraging 切开后的后一段。词嵌入把每个 token 换成一个向量，即一列数。向量序列进入注意力块，各向量之间传递信息。之后进入多层感知机，每个向量各自经过同一个运算。一个注意力块和一个多层感知机组成一层，这样的层重复多次，前一层的输出是后一层的输入。最后一层输出的最后一个向量经过解嵌入，再换算成概率，得到所有可能的下一个 token 的概率分布。从这个分布中采样得到 woodland，追加到文本末尾，就是图左侧上方补全后的文本。

['tokens.title']
src_hash = 'c464628f'
text = 'What is a token'

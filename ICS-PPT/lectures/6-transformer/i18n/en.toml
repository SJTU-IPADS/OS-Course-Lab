['attention-example.title']
src_hash = 'd12c06ae'
text = 'A worked example of attention'
# src: 注意力的计算示例

['attention-example.slide.1']
src_hash = '3046a9df'
text = 'Two tokens have embeddings of dimension 4. Given $W_Q$, $W_K$ and $W_V$, compute the output of one attention head with the attention formula.'
# src: 两个 token 的嵌入维数为 4，给定 $W_Q$、$W_K$、$W_V$，按注意力公式计算一个注意力头的输出。

['attention-example.notes.1']
src_hash = '86c8cb28'
text = 'Here the dimension of queries and keys is d_k = 4, so √d_k = 2. Each column of every matrix corresponds to one token: Q = W_Q E, K = W_K E, V = W_V E. Row i, column j of KᵀQ is the dot product of the i-th key and the j-th query. Dividing by 2 and applying Softmax to each column gives the attention pattern. The scores in the creature column are 3 and 1, which become 0.88 and 0.12 after Softmax. Each column of the output adds the two value vectors with the weights of that column.'
# src: 这里查询与键的维数 d_k = 4，√d_k = 2。各矩阵的每一列对应一个 token：Q = W_Q E，K = W_K E，V = W_V E。KᵀQ 第 i 行第 j 列是第 i 个键与第 j 个查询的点积，除以 2 后对每一列做 Softmax，得到注意力模式。creature 一列的分数为 3 和 1，Softmax 后为 0.88 和 0.12。输出的每一列按这一列的权重把两个值向量相加。

['attention-example.slide.2']
src_hash = 'e0f4d711'
text = 'In the creature column the weight is concentrated on fluffy, so its output comes mainly from the value vector of fluffy.'
# src: creature 一列的权重集中在 fluffy 上，它的输出主要来自 fluffy 的值向量。

['generation-gap.title']
src_hash = '0fcab6fc'
text = 'Missing following text during inference'
# src: 推理中的下文缺失

['generation-gap.slide.1']
src_hash = '553daf6a'
text = 'During training, each position predicts its next token, for example, the creature column predicts roamed, and attention can read roamed. During inference, the token to be predicted does not exist yet.'
# src: 训练时，每个位置预测它的下一个 token，比如 creature 一列预测 roamed，而注意力能读到 roamed。推理时，要预测的 token 还不存在。

['generation-gap.notes.1']
src_hash = '276e0772'
text = 'During training the whole text is input at once, and every vector of the last layer is used to predict the token that immediately follows it. Without a restriction, the query of each column applies Softmax over all keys, and the creature column can read through attention the token roamed that it is to predict. Training adjusts the parameters according to the probability the model gives to the true next token, so the model only needs to read out this token to give it a probability close to 1. During inference there is no token after the last position, so this approach cannot be used, and the predictions the model gives are meaningless. For what training teaches to work during inference as well, the information each position sees during training must be the same as during inference, that is, only the tokens before it.'
# src: 训练时整段文本一次输入，最后一层的每个向量都用于预测紧跟在它后面的 token。没有限制时，每一列的查询对全部键做 Softmax，creature 一列能经注意力读到它要预测的 roamed。训练按模型给真实的下一个 token 的概率高低调整参数，模型只需读出这个 token，就能给它接近 1 的概率。推理时，最后一个位置之后没有 token，这种做法无从使用，模型给出的预测没有意义。要让训练学到的做法在推理时同样可用，训练时每个位置看到的信息就必须与推理时相同，也就是只看它之前的 token。

['generation-gap.highlight.1']
src_hash = 'd27a1a23'
text = 'How can each position be influenced only by the tokens before it?'
# src: 如何让每个位置只受它之前的 token 影响？

['causal-mask.title']
src_hash = '66f6d33d'
text = 'Causal masking'
# src: 因果掩码

['causal-mask.notes.1']
src_hash = '2f316f29'
text = 'Every entry of the grid where a later token influences an earlier token must be 0. The simplest idea is to set these entries directly to 0, but then the columns no longer sum to 1. GPT always uses masking. Masking matters most during training, and it is applied in the same way when the model runs as a chatbot.'
# src: 表中后面的 token 影响前面 token 的位置都必须为 0。最简单的想法是直接把它们设为 0，但这样各列之和不再为 1。GPT 总是使用掩码。掩码在训练中最关键，模型作为聊天机器人运行时也同样使用。

['causal-mask.slide.1']
src_hash = 'a94eea46'
text = 'Before Softmax is applied, the scores of the red cells are first set to $-\infty$, so after the computation their weights become 0 and the probabilities in each column still sum to 1. This is called causal masking.'
# src: 在做 Softmax 之前先把红色格子的分数设定为 $-\infty$，运算后它们的权重变为 0，此时各列概率之和仍为 1。这称为因果掩码。

['value.title']
src_hash = 'd02f72c2'
text = 'The value vector'
# src: 值向量

['value.slide.1']
src_hash = '602d02a1'
text = 'With the attention pattern in hand, the next step is to update the embeddings, for example to let fluffy change the embedding of creature.'
# src: 有了注意力模式，下一步是更新嵌入，比如让 fluffy 改变 creature 的嵌入。

['value.notes.1']
src_hash = '12686d38'
text = "The value matrix W_V multiplied by the embedding E_2 of fluffy gives the value vector v_2. W_V multiplied by the embedding of a word can be read as follows: if this word is relevant to adjusting the meaning of another word, this is what should be added to that word's embedding."
# src: 值矩阵 W_V 乘以 fluffy 的嵌入 E_2，得到值向量 v_2。W_V 乘以一个词的嵌入，可以理解为：如果这个词与调整另一个词的含义相关，应该往那个词的嵌入上加什么。

['value.slide.2']
src_hash = '16480309'
text = 'The value vector $v_2 = W_V E_2$ is added to the embedding $E_4$ of creature, and it lies in the same space as the embeddings.'
# src: 值向量 $v_2 = W_V E_2$ 加到 creature 的嵌入 $E_4$ 上，它与嵌入位于同一个空间。

['weighted-values.title']
src_hash = '62ae42b0'
text = 'Weighted sum of values'
# src: 值的加权求和

['weighted-values.slide.1']
src_hash = '42fbbbfc'
text = '$W_V$ multiplies every embedding, giving a sequence of value vectors, each corresponding to the key in the same row.'
# src: $W_V$ 乘以每个嵌入，得到一列值向量，每个值向量与同一行的键对应。

['weighted-values.notes.1']
src_hash = 'b2a7d748'
text = 'Once the attention pattern is computed, the queries and keys are no longer needed. In the column of creature, for example, the value vectors of fluffy and blue are added with large weights, and the other value vectors are scaled to almost zero. The resulting update ΔE is added to the original embedding of creature, and the result should encode a richer meaning such as "a fluffy blue creature". Doing the same weighted sum in every column gives the updated vectors E′ of all positions. This whole process is called one attention head.'
# src: 得到注意力模式后，查询和键就不再需要。以 creature 这一列为例，fluffy 和 blue 的值向量以较大比例加入，其余值向量几乎为零。相加得到的更新量 ΔE 加到 creature 的原嵌入上，结果有望编码“毛茸茸的蓝色生物”这样更丰富的含义。对所有列做同样的加权求和，就得到全部位置更新后的向量 E′。以上全部过程称为一个注意力头。

['weighted-values.slide.2']
src_hash = 'bdcfed0b'
text = "Each column adds up the value vectors with its weights to give $\\Delta E$, and adding it to the original embedding gives the updated vector: $E' = E + \\Delta E$."
# src: 每列按权重把值向量相加得到 $\Delta E$，加到原嵌入上即为更新后的向量：$E' = E + \Delta E$。


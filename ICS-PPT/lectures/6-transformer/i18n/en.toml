# src: 第二部分：注意力机制

['section.attention-part.title']
src_hash = 'a2b15c9c'
text = 'Part 2: The attention mechanism'
# src: 第二部分：注意力机制

['bridge-attention-goal-section.title']
src_hash = '764dcf3d'
text = 'The problem attention solves'
# src: 注意力要解决的问题

['bridge-attention-goal-section.bridge.1']
src_hash = '764dcf3d'
text = 'The problem attention solves'
# src: 注意力要解决的问题

['section.attention-goal-section.title']
src_hash = '764dcf3d'
text = 'The problem attention solves'
# src: 注意力要解决的问题

['attention-goal.title']
src_hash = 'e6849062'
text = 'The goal of the attention mechanism'
# src: 注意力机制的目标

['attention-goal.slide.1']
src_hash = 'a54ef722'
text = 'The attention mechanism was introduced in the 2017 paper *Attention Is All You Need*.'
# src: 注意力机制由 2017 年的论文 *Attention Is All You Need* 提出。

['attention-goal.notes.1']
src_hash = '564e1b1e'
text = "Directions in the embedding space can correspond to meanings, for example, one direction corresponds to gender. One can imagine many more directions, each corresponding to another aspect of a word's meaning. An initial embedding encodes only a single word, and the goal of a Transformer is to adjust the vector at each position layer by layer, so that it carries much richer contextual meaning. The vector obtained after an embedding is updated by an attention block or a multilayer perceptron is called a hidden state. The attention mechanism often confuses people, so the following pages first look at several behaviors that attention should achieve, and then at the computation."
# src: 嵌入空间中的方向可以对应语义，比如有一个方向对应性别。可以设想还有许多方向，分别对应词义的其他方面。初始嵌入只编码单个词，Transformer 的目标是逐层调整每个位置的向量，使它带有丰富得多的上下文含义。嵌入经过注意力块或多层感知机更新后得到的向量称为隐藏状态（hidden state）。注意力机制常让人困惑，下面先看几个希望注意力实现的行为，再看计算。

['attention-goal.slide.2']
src_hash = '603dd1db'
text = 'Starting from the embeddings, attention adjusts the vector at each position step by step, so that it goes from representing a single word to representing a meaning in context.'
# src: 注意力从嵌入出发逐步调整每个位置的向量，使它从表示单个词变为表示带有上下文的含义。

['mole.title']
src_hash = 'd8a8cc61'
text = 'Different meanings of the same word'
# src: 同一个词的不同含义

['mole.slide.1']
src_hash = 'f3cdafc7'
text = 'The word mole has a different meaning in each of the three phrases below.'
# src: mole 在下面三个短语中含义各不相同。

['mole.notes.1']
src_hash = '9f3518b9'
text = 'In American shrew mole it is an animal, in One mole of carbon dioxide it is a unit of amount of substance, and in Take a biopsy of the mole it is a spot on the skin. After tokenization and lookup, the three vectors for mole are identical, because the initial embedding is a lookup table that involves no context. Only in the next step do the surrounding embeddings have a chance to pass information to it. One can imagine several distinct directions in the embedding space, each encoding a different meaning of mole.'
# src: American shrew mole 中是鼹鼠，One mole of carbon dioxide 中是摩尔，Take a biopsy of the mole 中是痣。分词并查表之后，三处 mole 的向量完全相同，因为初始嵌入是一张查表，不涉及上下文。到下一步，周围的嵌入才有机会把信息传给它。可以设想嵌入空间中有几个不同的方向，分别编码 mole 的不同含义。

['mole.slide.2']
src_hash = 'abe52903'
text = 'Attention computes from the context an update for each word, which is added to the vector of that word.'
# src: 注意力根据上下文为每个词算出一个更新量，叠加到这个词的向量上。

['tower-refine.title']
src_hash = 'e7edbe71'
text = 'Example: refining tower step by step'
# src: 示例：逐步具体化 tower

['tower-refine.slide.1']
src_hash = '8f0b0428'
text = 'The embedding of tower is a generic direction, close to many nouns for tall things.'
# src: tower 的嵌入是一个笼统的方向，与许多高大的名词相近。

['tower-refine.notes.1']
src_hash = 'ce2d688b'
text = 'When Eiffel comes before it, attention should update the vector of tower to a direction that more specifically represents the Eiffel Tower, associated with Paris, France and things made of steel. When miniature also appears, the vector should be updated further, so that it is no longer associated with tall things.'
# src: 前面出现 Eiffel 时，希望注意力把 tower 的向量更新到更具体地表示埃菲尔铁塔的方向，与巴黎、法国和钢铁制品相关。再出现 miniature 时，向量应进一步更新，不再与高大的事物相关。

['tower-refine.slide.2']
src_hash = '56e25037'
text = 'Every word in the context can further narrow the meaning of a word.'
# src: 上下文中的每个词都可能进一步限定一个词的含义。

['bridge-qk-section.title']
src_hash = 'c92224a7'
text = 'Queries, keys and the attention pattern'
# src: 查询、键与注意力模式

['bridge-qk-section.bridge.1']
src_hash = 'c92224a7'
text = 'Queries, keys and the attention pattern'
# src: 查询、键与注意力模式

['section.qk-section.title']
src_hash = 'c92224a7'
text = 'Queries, keys and the attention pattern'
# src: 查询、键与注意力模式

['block-structure.title']
src_hash = 'f8bd2bad'
text = 'The structure of an attention block'
# src: 注意力块的结构

['block-structure.slide.1']
src_hash = '1e0b4503'
text = 'An attention block consists of many attention heads working in parallel, for example, each attention block of GPT-3 has 96 attention heads.'
# src: 注意力块由许多注意力头并行组成，比如 GPT-3 的每个注意力块有 96 个注意力头。

['block-structure.notes.1']
src_hash = 'ae3f630a'
text = 'The figure shows what three hypothetical heads do on the same sentence. The attention block in the figure is in layer 1, and its input is the embeddings E. The first head lets adjectives adjust the meanings of the nouns that follow them, the second lets the determiners a and the adjust the meanings of the nouns that follow them, and the third passes information from the subject creature to the verb roamed. Each head uses its own set of learnable matrices to compute, from the context, an update for the embedding at every position. The updates of all heads are summed and then added to the original embeddings E, giving the updated vectors E′. This structure is called multi-head attention. The relations that real heads learn are determined by training and are often hard to interpret.'
# src: 图中是三个设想的头在同一句话上的作用。图中的注意力块位于第 1 层，输入是嵌入 E。第一个头让形容词调整其后名词的含义，第二个头让限定词 a、the 调整其后名词的含义，第三个头把主语 creature 的信息传给动词 roamed。每个头用自己的一组可学习的矩阵，根据上下文为每个位置的嵌入算出一个更新量。各个头的更新量相加，再叠加到原嵌入 E 上，得到更新后的向量 E′。这种结构称为多头注意力。真实的头学到的关系由训练决定，往往难以解释。

['block-structure.slide.2']
src_hash = 'aa0fd743'
text = 'Each head computes from the context an update for every position, and the updates of all heads are summed and added to the original vector.'
# src: 每个头根据上下文为每个位置算出一个更新量，所有头的更新量相加后叠加到原向量上。

['fluffy-example.title']
src_hash = '3360df69'
text = 'An example attention head'
# src: 一个注意力头的例子

['fluffy-example.slide.1']
src_hash = '3ed4059a'
text = 'Suppose an attention head does only one kind of update: adjectives adjust the meanings of the nouns that follow them.'
# src: 设想一个注意力头只做一种更新：形容词调整其后名词的含义。

['fluffy-example.notes.1']
src_hash = 'a9f363c7'
text = 'The example sentence is a fluffy blue creature roamed the verdant forest. The initial embeddings are written E, and they encode the word itself and its position in the context. The computation is still mostly matrix-vector multiplication, and the matrices hold learnable parameters, also called weights. "Adjectives update nouns" is a behavior assumed for illustration. The behavior of a real head is determined by tuning a huge number of parameters during training, and it is hard to interpret.'
# src: 例句是 a fluffy blue creature roamed the verdant forest。初始嵌入记为 E，它编码词本身和词在上下文中的位置。计算仍主要是矩阵乘向量，矩阵中是可学习的参数，也称权重。“形容词更新名词”是为说明而设想的行为。真实的头的行为由训练中大量参数的调整决定，难以解释。

['fluffy-example.slide.2']
src_hash = '29d0d469'
text = "The goal is to compute from the embeddings $E$ a set of updated vectors $E'$, in which the vectors of nouns absorb the meanings of the adjectives that modify them."
# src: 目标是由嵌入 $E$ 算出一组更新后的向量 $E'$，使名词的向量吸收修饰它的形容词的含义。

['query.title']
src_hash = 'a64b5e75'
text = 'The query vector'
# src: 查询向量

['query.slide.1']
src_hash = '16efe5e2'
text = 'Imagine creature asking: are there any adjectives in front of me? This question is encoded as a vector, called the query.'
# src: 设想 creature 在问：我前面有形容词吗？这个问题编码为一个向量，称为查询。

['query.notes.1']
src_hash = '085dd441'
text = 'The query has far fewer dimensions than the embedding, 128 in GPT-3. The entries of W_Q are model parameters, and what the matrix actually does in a head is hard to interpret. Here it is imagined to map the embeddings of nouns to a direction in the query space that means "looking for preceding adjectives". What it does to other embeddings is set aside for now.'
# src: 查询的维数远小于嵌入的维数，GPT-3 中为 128。W_Q 的元素是模型参数，它在一个头中实际做什么很难解释。这里设想它把名词的嵌入映射到查询空间中一个表示“寻找前面的形容词”的方向，它对其他嵌入的作用暂不考虑。

['query.slide.2']
src_hash = '88f2df37'
text = 'The query is $q_i = W_Q E_i$. $W_Q$ multiplies every embedding in the context, giving each token a 128-dimensional query.'
# src: 查询 $q_i = W_Q E_i$。$W_Q$ 乘以上下文中的每个嵌入，每个 token 得到一个 128 维的查询。

['key.title']
src_hash = 'c37f44ed'
text = 'The key vector'
# src: 键向量

['key.slide.1']
src_hash = '6e9a92bf'
text = 'Imagine fluffy and blue answering: I am an adjective, at this position. This answer is also encoded as a vector, called the key.'
# src: 设想 fluffy 和 blue 回答：我是形容词，在这个位置。这个回答也编码为一个向量，称为键。

['key.notes.1']
src_hash = '65328f74'
text = "W_K likewise consists of learnable parameters, and it maps embeddings into the same 128-dimensional space as the queries. In this example, W_K maps adjectives such as fluffy and blue to keys that point close to the direction of creature's query."
# src: W_K 同样由可学习的参数组成，把嵌入映射到与查询相同的 128 维空间。在这个例子中，W_K 把 fluffy、blue 等形容词映射为与 creature 的查询方向接近的键。

['key.slide.2']
src_hash = '108c5f10'
text = 'The key is $k_i = W_K E_i$, in the same 128-dimensional space as the queries. When a key and a query point in similar directions, the two are considered a match.'
# src: 键 $k_i = W_K E_i$，与查询位于同一个 128 维空间。键与查询方向接近时，认为二者匹配。

['attention-scores.title']
src_hash = '630fe94b'
text = 'The grid of key-query dot products'
# src: 键与查询的点积表

['attention-scores.slide.1']
src_hash = 'ff1b2392'
text = 'The dot product of every key-query pair measures how well the two match.'
# src: 每一对键和查询做点积，衡量它们的匹配程度。

['attention-scores.notes.1']
src_hash = '4af170c0'
text = 'A larger circle means a larger dot product. The keys of fluffy and blue give large positive dot products with the query of creature. The dot product of the key of the with the query of creature is small or negative, which means the two are unrelated. The values in this grid can be any real numbers, and they give how relevant each word is to updating the meaning of every other word.'
# src: 圆点越大，点积越大。fluffy、blue 的键与 creature 的查询点积为较大的正数。the 的键与 creature 的查询点积较小或为负，说明两者无关。这张表中的值可以是任意实数，给出每个词与更新其他每个词的含义的相关程度。

['attention-scores.slide.2']
src_hash = 'f855ab14'
text = 'When the dot products are large, creature is said to attend to fluffy and blue.'
# src: 点积大时，称 creature 关注（attend to）fluffy 和 blue。

['attention-pattern.title']
src_hash = '2f737402'
text = 'The attention pattern'
# src: 注意力模式

['attention-pattern.slide.1']
src_hash = 'd348aa45'
text = 'These scores will serve as the weights of a weighted sum along each column, so each value should lie between 0 and 1 and each column should sum to 1.'
# src: 这些分数将用作每一列加权求和的权重，因此每个值应在 0 与 1 之间，每列之和为 1。

['attention-pattern.notes.1']
src_hash = '733ca5c0'
text = 'Applying Softmax to each column does this. After normalization, each column gives how relevant each word on the left is to the word at the top.'
# src: 对每一列做 Softmax 即可。归一化之后，每一列给出左侧各词与顶部这个词的相关程度。

['attention-pattern.slide.2']
src_hash = '2a24ace5'
text = 'Applying Softmax to each column gives a grid called the attention pattern.'
# src: 对每一列做 Softmax，得到的表称为注意力模式。

['value.title']
src_hash = 'd02f72c2'
text = 'The value vector'
# src: 值向量

['value.slide.1']
src_hash = '602d02a1'
text = 'With the attention pattern in hand, the next step is to update the embeddings, for example to let fluffy change the embedding of creature.'
# src: 有了注意力模式，下一步是更新嵌入，比如让 fluffy 改变 creature 的嵌入。

['value.notes.1']
src_hash = '12686d38'
text = "The value matrix W_V multiplied by the embedding E_2 of fluffy gives the value vector v_2. W_V multiplied by the embedding of a word can be read as follows: if this word is relevant to adjusting the meaning of another word, this is what should be added to that word's embedding."
# src: 值矩阵 W_V 乘以 fluffy 的嵌入 E_2，得到值向量 v_2。W_V 乘以一个词的嵌入，可以理解为：如果这个词与调整另一个词的含义相关，应该往那个词的嵌入上加什么。

['value.slide.2']
src_hash = '16480309'
text = 'The value vector $v_2 = W_V E_2$ is added to the embedding $E_4$ of creature, and it lies in the same space as the embeddings.'
# src: 值向量 $v_2 = W_V E_2$ 加到 creature 的嵌入 $E_4$ 上，它与嵌入位于同一个空间。

['weighted-values.title']
src_hash = '62ae42b0'
text = 'Weighted sum of values'
# src: 值的加权求和

['weighted-values.slide.1']
src_hash = '42fbbbfc'
text = '$W_V$ multiplies every embedding, giving a sequence of value vectors, each corresponding to the key in the same row.'
# src: $W_V$ 乘以每个嵌入，得到一列值向量，每个值向量与同一行的键对应。

['weighted-values.notes.1']
src_hash = 'b2a7d748'
text = 'Once the attention pattern is computed, the queries and keys are no longer needed. In the column of creature, for example, the value vectors of fluffy and blue are added with large weights, and the other value vectors are scaled to almost zero. The resulting update ΔE is added to the original embedding of creature, and the result should encode a richer meaning such as "a fluffy blue creature". Doing the same weighted sum in every column gives the updated vectors E′ of all positions. This whole process is called one attention head.'
# src: 得到注意力模式后，查询和键就不再需要。以 creature 这一列为例，fluffy 和 blue 的值向量以较大比例加入，其余值向量几乎为零。相加得到的更新量 ΔE 加到 creature 的原嵌入上，结果有望编码“毛茸茸的蓝色生物”这样更丰富的含义。对所有列做同样的加权求和，就得到全部位置更新后的向量 E′。以上全部过程称为一个注意力头。

['weighted-values.slide.2']
src_hash = 'bdcfed0b'
text = "Each column adds up the value vectors with its weights to give $\\Delta E$, and adding it to the original embedding gives the updated vector: $E' = E + \\Delta E$."
# src: 每列按权重把值向量相加得到 $\Delta E$，加到原嵌入上即为更新后的向量：$E' = E + \Delta E$。

['attention-formula.title']
src_hash = 'dc093bba'
text = 'The attention formula in matrix form'
# src: 注意力的矩阵公式

['attention-formula.slide.1']
src_hash = '9e786e41'
text = 'The paper Attention Is All You Need writes these computations as one compact formula.'
# src: Attention Is All You Need 论文把这些计算写成一个紧凑的式子。

['attention-formula.notes.1']
src_hash = 'fc392b51'
text = 'Q and K are the arrays of all query vectors and all key vectors. The numerator is a compact representation of all the dot products between keys and queries. Dividing by √d_k is for numerical stability. V is the array of value vectors, used to update the vector at each position. After layer 1, the Q, K and V of each layer are computed in the same way from the hidden states output by the previous layer. In the paper each token occupies a row, each row of QKᵀ belongs to one query, and Softmax runs along the rows. The grids before have queries as columns, which is the transpose. Written that way, the formula is V·softmax(KᵀQ/√d_k), where each column of V is a value vector.'
# src: Q、K 分别是全部查询向量与全部键向量组成的数组。分子紧凑地表示所有键与查询的点积。除以 √d_k 是为了数值稳定。V 是值向量组成的数组，用于更新每个位置的向量。第 1 层之后，各层的 Q、K、V 由上一层输出的隐藏状态算出，计算方法相同。论文中每个 token 占一行，QKᵀ 的每一行对应一个查询，Softmax 沿行进行。前面的表以查询为列，是它的转置，对应的写法是 V·softmax(KᵀQ/√d_k)，V 的每一列是一个值向量。

['attention-formula.slide.2']
src_hash = '57aa2664'
text = 'The dot products are divided by the square root of the dimension of the key-query space, $\sqrt{d_k}$, and then Softmax is applied for each query.'
# src: 点积除以键查询空间维数的平方根 $\sqrt{d_k}$，再对每个查询做 Softmax。

['attention-example.title']
src_hash = 'd12c06ae'
text = 'A worked example of attention'
# src: 注意力的计算示例

['attention-example.slide.1']
src_hash = '3046a9df'
text = 'Two tokens have embeddings of dimension 4. Given $W_Q$, $W_K$ and $W_V$, compute the output of one attention head with the attention formula.'
# src: 两个 token 的嵌入维数为 4，给定 $W_Q$、$W_K$、$W_V$，按注意力公式计算一个注意力头的输出。

['attention-example.notes.1']
src_hash = '86c8cb28'
text = 'Here the dimension of queries and keys is d_k = 4, so √d_k = 2. Each column of every matrix corresponds to one token: Q = W_Q E, K = W_K E, V = W_V E. Row i, column j of KᵀQ is the dot product of the i-th key and the j-th query. Dividing by 2 and applying Softmax to each column gives the attention pattern. The scores in the creature column are 3 and 1, which become 0.88 and 0.12 after Softmax. Each column of the output adds the two value vectors with the weights of that column.'
# src: 这里查询与键的维数 d_k = 4，√d_k = 2。各矩阵的每一列对应一个 token：Q = W_Q E，K = W_K E，V = W_V E。KᵀQ 第 i 行第 j 列是第 i 个键与第 j 个查询的点积，除以 2 后对每一列做 Softmax，得到注意力模式。creature 一列的分数为 3 和 1，Softmax 后为 0.88 和 0.12。输出的每一列按这一列的权重把两个值向量相加。

['attention-example.slide.2']
src_hash = 'e0f4d711'
text = 'In the creature column the weight is concentrated on fluffy, so its output comes mainly from the value vector of fluffy.'
# src: creature 一列的权重集中在 fluffy 上，它的输出主要来自 fluffy 的值向量。


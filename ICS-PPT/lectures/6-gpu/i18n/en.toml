['dot-run.notes.1']
src_hash = 'e7b5570b'
text = '''
The program first computes the dot product on the GPU, which gives `sum`, and then computes it once more with a CPU loop, which gives `check`. The two are equal.
The 65536 thread blocks produce 65536 partial sums, which the host copies back to memory and adds up.
The `GPU` line shows the execution time of `dot_kernel` alone (timed with CUDA events, the mean of 20 launches) and the bandwidth of reading the two arrays `w` and `x`, 128 MB in all: 253.0 GB/s, which is 56% of the peak device memory bandwidth of this GPU, 448 GB/s.
The `CPU` line shows the time of the same dot product computed once by a loop on one CPU core (timed with `clock_gettime`), with a bandwidth of 17.8 GB/s. Both read the same amount of data, and the ratio of the times is 14.2.
The time of the GPU excludes copying the two arrays from memory to device memory and copying the partial sums back and adding them.
'''

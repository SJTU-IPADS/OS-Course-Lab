src_hash = 'eeb19534'
text = 'Photos: Palit GeForce RTX 5090 GameRock (PantheraLeo1359531, CC BY 4.0) and Intel Core Ultra 200V (FritzchensFritz, CC0), from Wikimedia Commons'
# src: 照片：Palit GeForce RTX 5090 GameRock（PantheraLeo1359531，CC BY 4.0）与 Intel Core Ultra 200V（FritzchensFritz，CC0），来自 Wikimedia Commons

['dgpu-igpu.notes.1']
src_hash = '2bf3a736'
text = '''
The photo on the left shows a discrete graphics card, an RTX 5090. The photo on the right shows the chip package of an integrated GPU, an Intel Core Ultra 200V: the compute chip and two memory chips are packaged on the same substrate, and the CPU cores and the GPU cores are on the same compute chip.
The width of each line in the figure is proportional to the bandwidth: PCIe 3.0 x16 is 16 GB/s, dual-channel DDR4-3200 is 51.2 GB/s, and GDDR6 device memory is 448 GB/s.
The left side shows the system structure of a discrete GPU: the GPU has its own memory chips and communicates with the host over the PCIe bus. The right side shows the system structure of an integrated GPU, where the CPU and the GPU share the same system memory.
To run a CUDA program on a discrete GPU, the host program first has to call `cudaMemcpy` to copy the input data over the PCIe bus into the device memory before the kernel on the device can access it directly. The bandwidth of PCIe is far below the bandwidth of device memory, so copying data between the host and device memory becomes a part of the running time of the program.
'''
# src:
# 
# 左侧照片为独立显卡 RTX 5090，右侧照片为集成 GPU 所在的芯片封装 Intel Core Ultra 200V：计算芯片与两颗内存芯片封装在同一块基板上，CPU 核心与 GPU 核心位于同一颗计算芯片内。
# 图中连线的宽度与带宽成正比：PCIe 3.0 x16 为 16 GB/s，双通道 DDR4-3200 为 51.2 GB/s，GDDR6 显存为 448 GB/s。
# 左侧为独立 GPU 的系统结构：GPU 拥有独立的显存颗粒，通过 PCIe 总线与主机通信。右侧为集成 GPU 的系统结构，CPU 与 GPU 共享同一片系统内存。
# 在独立 GPU 上运行 CUDA 程序时，主机端程序需要先调用 `cudaMemcpy` 将输入数据经 PCIe 总线复制到独立显存中，设备端的核函数才能直接访问。PCIe 的带宽远低于显存带宽，数据在主机与显存之间的复制因此成为程序耗时的组成部分。


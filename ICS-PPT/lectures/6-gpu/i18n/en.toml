src_hash = '497b3f6b'
text = '- `TORCH_CHECK` checks the device, the data type, the memory layout and the shapes, and raises an exception in Python when a condition fails. The kernel reads `data_ptr` by a one-dimensional index, so the inputs must be contiguous.'
# src:
# 
# - `TORCH_CHECK` 检查设备、数据类型、内存布局与形状，不满足时在 Python 中抛出异常。核函数按一维下标读取 `data_ptr`，输入必须是 contiguous 的。

['custom-op-cuda.notes.1']
src_hash = 'ef851054'
text = '''
The kernel `add_kernel` is a one-dimensional vector addition and has nothing to do with PyTorch. The wrapper function handles only the interface of tensors: `at::Tensor` is the C++ tensor type of PyTorch, `data_ptr<float>()` returns the pointer to the device memory, and `numel()` returns the number of elements.
`at::empty_like(a)` allocates the output tensor on the device of `a`, with the same shape and data type as `a`. `getCurrentCUDAStream()` returns the CUDA stream of the current thread. Operators of PyTorch are queued on this stream by default, so the launch of the kernel is asynchronous: when the C++ function returns, the kernel may not have finished, and the operators that use the result later are queued behind it on the same stream.
The kernel is queued on the same stream and runs in order with the other operators. `C10_CUDA_KERNEL_LAUNCH_CHECK()` checks whether the launch itself failed and does not wait for the kernel to finish. With several GPUs, `c10::cuda::CUDAGuard` is also needed to switch to the device of the inputs, which is omitted here.
'''
# src:
# 
# 核函数 `add_kernel` 是一维的向量加法，与 PyTorch 无关。封装函数只处理张量的接口：`at::Tensor` 是 PyTorch 的 C++ 张量类型，`data_ptr<float>()` 取出设备内存的指针，`numel()` 取出元素个数。
# `at::empty_like(a)` 在 `a` 所在的设备上分配与 `a` 形状、数据类型相同的输出张量。`getCurrentCUDAStream()` 返回当前线程的 CUDA 流。PyTorch 的算子默认都在这个流上排队，所以核函数的启动是异步的：C++ 函数返回时，核函数可能还没有执行完，之后用到结果的算子在同一个流上排在它后面。
# 核函数在同一个流上排队，与其他算子按顺序执行。`C10_CUDA_KERNEL_LAUNCH_CHECK()` 检查启动本身是否出错，不等待核函数完成。多块 GPU 时还需要用 `c10::cuda::CUDAGuard` 切换到输入所在的设备，这里省略。

['custom-op-register.title']
src_hash = '5ef73d30'
text = 'Declaration, Registration and Call'
# src: 声明、注册与调用

['custom-op-register.slide.1']
src_hash = '05759273'
text = '''
- `m.def` declares the name and the signature of the operator, and `m.impl` registers a function for the dispatch key CUDA. At a call, the Dispatcher selects it by the device the tensors are on.
- `load` compiles the `.cu` file and loads the dynamic library, and the registration code on the left runs at load time.
- After registration the operator is located in `torch.ops.mylib`, and it is called in the same way as a built-in operator.
'''
# src:
# 
# - `m.def` 声明算子的名称与签名，`m.impl` 为 CUDA 这个 dispatch key 登记函数。调用时 Dispatcher 按张量所在的设备选出它。
# - `load` 编译 `.cu` 文件并加载动态库，加载时执行左侧的注册代码。
# - 注册后算子位于 `torch.ops.mylib`，调用写法与内置算子相同。

['custom-op-register.notes.1']
src_hash = '06d07bb2'
text = '''
The left side is the registration code at the end of the `.cu` file, and the right side is the Python script. `TORCH_LIBRARY` creates the namespace and declares the signature, which is written in the schema language of PyTorch: `Tensor` denotes a tensor argument, and what follows `->` is the return value. `TORCH_LIBRARY_IMPL(mylib, CUDA, m)` registers the implementation for the single key CUDA. A call whose key is not registered does not enter this function: a call with CPU tensors raises an error saying that there is no implementation for the CPU backend.
The first argument of `load` is the name of the extension, which is also the name of the build directory. `verbose=True` prints the command line of nvcc. When the dynamic library has been loaded, the constructors of the static objects have executed the code in `TORCH_LIBRARY` and `TORCH_LIBRARY_IMPL`, so the operator appears in the Dispatcher.
An element-wise single-precision addition on the GPU gives the same bits as `a + b`, so the comparison uses `torch.equal`.
'''
# src:
# 
# 左侧是 `.cu` 文件末尾的注册代码，右侧是 Python 脚本。`TORCH_LIBRARY` 创建命名空间并声明签名，签名的写法是 PyTorch 的 schema 语言，`Tensor` 表示张量参数，`->` 之后是返回值。`TORCH_LIBRARY_IMPL(mylib, CUDA, m)` 为 CUDA 这一个 key 登记实现。登记的 key 之外的调用不会进入这个函数：对 CPU 张量调用会报错，指出没有 CPU 后端的实现。
# `load` 的第一个参数是扩展的名称，也是构建目录的名称。`verbose=True` 打印 nvcc 的命令行。动态库加载完成时，静态对象的构造函数执行了 `TORCH_LIBRARY` 与 `TORCH_LIBRARY_IMPL` 中的代码，算子因此出现在 Dispatcher 中。
# 逐元素的单精度加法在 GPU 上的结果与 `a + b` 逐位相同，所以用 `torch.equal` 比较。

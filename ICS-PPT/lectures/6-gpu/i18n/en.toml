# `CPU` 行是同一个内积在一个 CPU 核上用循环计算一遍的时间（`clock_gettime` 计时），带宽 17.8 GB/s。两者读取的数据量相同，耗时之比为 14.2 倍。
# GPU 的时间不含两个数组从内存复制到显存的时间，也不含部分和复制回内存并累加的时间。


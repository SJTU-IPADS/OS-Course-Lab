text = '''
Decide whether each of the following computations suits a GPU, and explain why.

1. Multiplying the brightness of every pixel of a 4K image (3840 × 2160 pixels) by 1.2.
2. Visiting the nodes of a singly linked list one by one and summing the values stored in the nodes.
3. Computing the product of two 4096 × 4096 floating-point matrices.
4. Using `gcc` to compile a C source file into an executable program.
'''
# src:
# 
# 判断下列计算任务是否适合在 GPU 上执行，并说明理由。
# 
# 1. 将一幅 4K 图像（3840 × 2160 像素）中每个像素的亮度值乘以 1.2。
# 2. 沿单向链表依次遍历各个节点，累加节点中保存的数值。
# 3. 计算两个 4096 × 4096 浮点矩阵的乘积。
# 4. 使用 `gcc` 将一个 C 语言源文件编译为可执行程序。

['exercise-structure-2.slide.2']
src_hash = '3cc632cf'
text = '''
Answer:
1. **Suitable**. About 8.3 million pixels all execute the same multiplication, and there is no data dependency between pixels.
2. **Not suitable**. The address of the successor node depends on the result of reading the current node, so the steps of the traversal have a strict sequential dependency.
3. **Suitable**. Each of the more than 16 million elements of the result matrix is the inner product of one row and one column, and the elements can be computed in parallel independently of one another.
4. **Not suitable**. Lexical and syntax analysis process the tokens of the source code in order, the control flow has complex branches, and there is no uniform data-parallel operation.
'''
# src:
# 
# 答案：
# 1. **适合**。约 830 万个像素均执行相同的乘法运算，且各像素之间无数据依赖。
# 2. **不适合**。后继节点的地址依赖当前节点的读取结果，各步访问存在严格的串行依赖。
# 3. **适合**。结果矩阵的 1600 多万个元素各自对应一行与一列的内积，可彼此独立地并行计算。
# 4. **不适合**。词法与语法分析按顺序处理源代码，控制流分支复杂且缺乏统一的数据并行运算。

['exercise-structure-2.notes.1']
src_hash = 'bcc7a769'
text = '''
1. A 4K image has 3840 × 2160 = 8294400 pixels, and each pixel independently executes one floating-point multiplication.
2. Each step of the traversal has to wait until the previous step has read the `next` pointer, so several cores cannot access memory at the same time. If the data is stored contiguously in an array, the summation itself can be done by a parallel reduction.
3. The result matrix has 4096 × 4096 = 16777216 elements, and the inner product computations of the elements are independent of each other.
4. The execution path of a compiler depends strongly on the syntactic structure of the input source code, has dense conditional branches, and has no data-parallel characteristics.
'''
# src:
# 
# 1. 4K 图像共有 3840 × 2160 = 8294400 个像素，每个像素独立执行一次浮点乘法。
# 2. 链表遍历的每一步都必须等待前一步读取出 `next` 指针，多个核心无法同时访存。若将数据连续存放在数组中，求和本身可以通过并行规约完成。
# 3. 结果矩阵共有 4096 × 4096 = 16777216 个元素，各元素的内积计算相互独立。
# 4. 编译器的执行路径高度依赖输入源码的语法结构，条件分支密集，不具备数据并行特征。


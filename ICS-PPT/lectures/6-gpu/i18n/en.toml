src_hash = 'b057661a'
text = '''
Fermi is the GPU architecture released by NVIDIA in 2010. In the figure, two rows of 8 SMs each are arranged above and below, with the L2 cache shared by all SMs in the centre, the DRAM interfaces on both sides, and the host interface (PCIe) and the thread block scheduler (GigaThread) at the top.
GPUs of different generations, and of different models in the same generation, all use this scalable modular design. The difference in scale between models lies mainly in the number of SMs.
'''

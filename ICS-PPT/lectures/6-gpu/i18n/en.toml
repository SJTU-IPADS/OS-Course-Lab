# src: 图：NVIDIA H100 Tensor Core GPU Architecture 白皮书

['tensor-core.slide.1']
src_hash = '489073c3'
text = '''
- Since the Volta architecture (2017), an SM contains, in addition to the ordinary CUDA cores, dedicated matrix arithmetic units called **Tensor Cores**, and a single instruction completes the multiply-add of a small matrix, $D = A \times B + C$.
- In the H100 shown on the right, a single SM is divided into 4 partitions, each with 32 FP32 cores and 1 Tensor Core.
- Tensor Cores use low-precision numeric formats such as FP16 and FP8, and on the H100 they provide a matrix performance an order of magnitude higher than the FP32 CUDA cores.
- The matrix multiplications in modern deep learning frameworks are accelerated mainly by Tensor Cores. The example programs of this lecture use the ordinary CUDA cores.
'''
# src:
# 
# - 自 Volta 架构（2017）起，SM 内部除常规 CUDA 核心外还集成了专用矩阵运算单元 **Tensor Core**，单条指令即可完成一个小规模矩阵的乘加运算 $D = A \times B + C$。
# - 右图 H100 的单个 SM 划分为 4 个处理块，每块配备 32 个 FP32 核心与 1 个 Tensor Core。
# - Tensor Core 使用 FP16、FP8 等低精度数值格式，在 H100 上提供的矩阵算力比 FP32 CUDA 核心高出一个数量级。
# - 现代深度学习框架中的矩阵乘法主要由 Tensor Core 加速。本讲的示例程序使用常规 CUDA 核心。

['tensor-core.notes.1']
src_hash = '9b6b7d8b'
text = '''
The figure on the right is the structure of one SM of the H100 GPU. Below the L1 instruction cache at the top are 4 independent compute partitions. Each contains 1 Warp scheduler, 16384 32-bit registers, 16 INT32 units, 32 FP32 CUDA cores, 16 FP64 units and 1 fourth-generation Tensor Core. At the bottom are 256 KB of L1 data cache and shared memory.
Taking the H100 SXM as an example, the peak throughput of its FP32 CUDA cores is about 67 TFLOP/s, and the dense peak throughput of its FP16 Tensor Core reaches 990 TFLOP/s.
When a Tensor Core instruction executes, the 32 threads of one Warp work together. The registers of each thread hold some of the elements of the sub-matrices, and together they complete one matrix multiply-accumulate. Operator libraries such as cuBLAS and cuDNN call the Tensor Cores automatically when the inputs are in half-precision or mixed-precision formats.
'''
# src:
# 
# 右图为 H100 GPU 的单个 SM 结构图。顶部的 L1 指令缓存下方划分为 4 个独立的计算分区，每个分区包含 1 个 Warp 调度器、16384 个 32 位寄存器、16 个 INT32 单元、32 个 FP32 CUDA 核心、16 个 FP64 单元以及 1 个第四代 Tensor Core。底部为 256 KB 的 L1 数据缓存与共享内存。
# 以 H100 SXM 版本为例，其 FP32 CUDA 核心的峰值算力约为 67 TFLOP/s，而 FP16 Tensor Core 的稠密峰值算力高达 990 TFLOP/s。
# 执行 Tensor Core 指令时，同一 Warp 的 32 个线程协同工作，每个线程寄存器持有子矩阵的部分元素并共同完成一次矩阵乘加。cuBLAS 与 cuDNN 等算子库在输入为半精度或混合精度格式时会自动调用 Tensor Core。


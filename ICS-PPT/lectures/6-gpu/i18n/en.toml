['render-realtime.notes.1']
src_hash = '9aaeafe7'
text = '''
The frames of a game are rendered in real time: 60 or 120 images (frames) are generated per second, and each frame is recomputed from the viewpoint of the player at that moment.
The scene in the picture consists of millions of triangles, and every frame processes all the triangles and all the pixels.
'''
# src:
# 
# 交互式应用与电子游戏要求实时渲染：系统每秒需要生成 60 至 120 帧图像，每一帧都必须根据当前的摄像机视角重新计算整个场景。
# 图中的复杂场景包含数百万个三角形，图形处理器需要在十几个毫秒内完成全部三角形与数百万像素的计算。

['render-steps.title']
src_hash = 'b3ea6b33'
text = 'Rendering Pipeline and Shaders'
# src: 渲染管线与着色器

['render-steps.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['render-steps.slide.1']
src_hash = 'dd1e22bd'
text = '''
- A **shader** is a program executed independently for each primitive in the rendering pipeline:
  - **vertex shader**: performs one coordinate transformation for each vertex;
  - **geometry shader**: performs one geometry processing step for each triangle;
  - **fragment shader**: performs one lighting and colour computation for each fragment.
- A modern 3D scene contains **millions of triangles** per frame. At 120 frames per second, $10^8$ to $10^9$ triangles per second must be processed, which exceeds what a general-purpose CPU can process in real time.
'''
# src:
# 
# - **着色器**（Shader）是在渲染管线中对每个图元独立执行的程序：
#   - **顶点着色器**：对每个顶点执行一次坐标变换；
#   - **几何着色器**：对每个三角形执行一次几何处理；
#   - **片元着色器**：对每个片元执行一次光照与颜色计算。
# - 现代 3D 场景每帧包含**数百万个三角形**，以每秒 120 帧运行时，每秒需处理 $10^8$ 至 $10^9$ 个三角形，超出了通用 CPU 实时处理的能力。

['render-steps.notes.1']
src_hash = '837f6429'
text = '''
The figure shows the main stages of the graphics rendering pipeline. The vertex shader transforms each vertex from 3D world coordinates to screen coordinates by multiplying a 4 × 4 matrix with a vector. The geometry shader processes primitives one triangle at a time. The rasterization stage determines the pixel positions covered by each triangle and generates fragments. The fragment shader computes the colour of each fragment. Finally, depth tests and colour blending (Tests and Blending) produce the output image.
The computation logic of the three shader stages can be defined by the developer with programs.
In each programmable stage, all vertices, triangles or fragments execute the same shader code, and the computations of different elements are independent of each other, which gives a high degree of data parallelism.
'''
# src:
# 
# 图中展示了图形渲染管线的主要阶段。顶点着色器通过 4 × 4 矩阵与向量的乘法，将每个顶点从三维世界坐标变换至屏幕坐标。几何着色器以三角形为单位处理图元。光栅化阶段（Rasterization）确定每个三角形覆盖的像素位置并生成片元（Fragment）。片元着色器计算每个片元的颜色，最后经深度测试与颜色混合（Tests and Blending）输出最终图像。
# 三个着色器阶段可由开发者编写程序定义计算逻辑。
# 在每一个可编程阶段中，所有顶点、三角形或片元均执行同一段着色器代码，且各元素之间的计算相互独立，具备高度的数据并行性。

['gpu-cores.title']
src_hash = '3c922a76'
text = 'CPU and GPU Hardware Organization'
# src: CPU 与 GPU 的硬件结构

['gpu-cores.row.1.footnote.1']
src_hash = '1f370553'
text = 'Figure: NVIDIA CUDA C++ Programming Guide'
# src: 图：NVIDIA CUDA C++ Programming Guide

['gpu-cores.slide.1']
src_hash = 'cd4dc32c'
text = '''
- A CPU spends a large share of its chip area on complex control logic and multi-level caches. A GPU spends its chip area mainly on arithmetic units, and a group of arithmetic logic units (ALUs) shares one set of control logic and cache.
- An instruction is fetched and decoded once and can drive several ALUs at the same time: a CPU vector instruction usually drives 4 to 8 ALUs, whereas a GPU can drive dozens of ALUs, so that the same area holds more arithmetic units.
'''
# src:
# 
# - CPU 将较多芯片面积用于复杂的控制逻辑与多级高速缓存。GPU 将芯片面积主要用于运算单元，一组算术逻辑单元（ALU）共用同一套控制逻辑与缓存。
# - 一条指令经一次取指和译码后，可驱动多个 ALU 同时执行：CPU 的向量指令通常驱动 4 至 8 个 ALU，而 GPU 可驱动数十个 ALU，从而在相同面积内容纳更多运算单元。

['gpu-cores.notes.1']
src_hash = 'a401a9ac'
text = '''
The left figure compares how a CPU and a GPU allocate chip area. Each CPU core has its own control logic (such as branch prediction and out-of-order execution units) and large multi-level caches to reduce the execution latency of a single thread. A GPU concentrates its chip area on a dense array of arithmetic units.
The right figure compares three ways of execution. On the left is a scalar CPU core, where each fetch and decode drives only one ALU. In the middle is a CPU core with vector instructions (SIMD), where one fetch and decode drives several ALUs working on a group of data. On the right is a GPU, where a whole group of ALUs shares the fetch and decode units.
By spreading the hardware cost of fetch and decode over more operations, a GPU can integrate thousands of arithmetic units on a single chip.
'''
# src:
# 
# 左图对比了 CPU 与 GPU 的芯片面积分配：CPU 的每个核心配备独立的控制逻辑（如分支预测与乱序执行部件）和大容量多级缓存，以降低单线程的执行延迟。GPU 则将芯片面积集中用于高密度的运算单元阵列。
# 右图对比了三种执行方式：左侧为标量 CPU 核心，每次取指、译码仅驱动一个 ALU。中间为支持向量指令（SIMD）的 CPU 核心，一次取指、译码驱动多个 ALU 处理一组数据。右侧为 GPU，由一整组 ALU 共用取指与译码部件。
# 通过分摊取指与译码的硬件开销，GPU 得以在单颗芯片上集成数千个运算单元。


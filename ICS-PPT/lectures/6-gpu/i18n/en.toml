['outline.title']
src_hash = '5fd105e3'
text = 'Course Outline'
# src: 课程提纲

['outline.slide.1']
src_hash = 'adb8a12f'
text = '''
1. **Structure of the GPU**: the computational characteristics of 3D rendering, ALUs sharing control logic, the streaming multiprocessor, device memory and the memory hierarchy.
2. **CUDA programming**: host and device, the three-level thread hierarchy, writing and launching kernels, and cooperation within a block.
3. **Execution of thread blocks and Warps**: residency of thread blocks on an SM, Warp scheduling and latency hiding, branch divergence.
4. **Operator calls in a framework**: the layers of PyTorch and the Dispatcher, and the registration and Python call of a custom operator.
'''
# src:
# 
# 1. **GPU 的结构**：3D 渲染的计算特征，ALU 共用控制逻辑，流式多处理器，显存与存储层次。
# 2. **CUDA 编程**：主机与设备，三级线程组织，核函数的编写、启动与块内协作。
# 3. **线程块与 Warp 的执行**：线程块在 SM 上的驻留，Warp 调度与延迟隐藏，分支分化。
# 4. **框架中的算子调用**：PyTorch 的分层与 Dispatcher，自定义算子的登记与 Python 调用。

['outline.notes.1']
src_hash = '821da50d'
text = '''
This lecture consists of four parts. Part 1 describes the hardware structure of the GPU, including the SM and the memory hierarchy. Part 2 introduces the CUDA programming model and its basic syntax, and writes vector addition and the vector inner product. Part 3 analyzes the execution of a kernel on an SM. Part 4 takes PyTorch as an example, explains how one matrix multiplication call is dispatched through the Dispatcher to a CUDA kernel, and then registers a kernel as a custom operator that is called from Python.
Parts 1 to 3 end with exercises. Part 1 adds a sidebar on Tensor Cores before the exercises.
All example programs of this lecture are located under examples/ and can be submitted to the course server to be compiled and run.
'''
# src:
# 
# 本讲分为四个部分。第一部分说明 GPU 的硬件结构，包括 SM 与存储层次。第二部分介绍 CUDA 编程模型与基本语法，并写出向量加法与向量内积。第三部分分析核函数在 SM 上的执行。第四部分以 PyTorch 为例，说明一次矩阵乘法调用怎样经过 Dispatcher 分派到 CUDA 核函数，再把一个核函数登记为自定义算子并在 Python 中调用。
# 第一至第三部分以练习结束。第一部分在练习之前补充介绍 Tensor Core。
# 本讲中的所有示例程序均位于 examples/ 目录下，可提交到课程服务器编译运行。


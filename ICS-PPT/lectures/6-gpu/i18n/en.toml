['diverge-run.demo.1.name']
src_hash = 'aaae79a4'
text = 'The same two branch paths, divided by thread parity and by Warp parity'
# src: 同样的两条分支路径，按线程奇偶与按 Warp 奇偶划分

['diverge-run.notes.1']
src_hash = 'e63d355f'
text = '''
In `diverge.cu`, `branch_by_lane` and `branch_by_warp` call the same two device functions: `branch_one` executes 1024 times `v = v * 0.999f + 0.001f`, and `branch_two` executes 1024 times `v = v * v - 0.25f`. In both kernels, half of the threads take the first path and half take the second path. The difference is the basis of the division.
In the figure, each Warp is one row: above are the branches taken by its 32 threads, blue for the first path and orange for the second, and below are bars drawn to one time scale that show the order in which the Warp executes the paths. In the left figure the two paths run one after the other. In the right figure each Warp executes only its own path, and the two Warps run at the same time.
In the former, among the 32 threads of each Warp, the even-numbered threads take the first path and the odd-numbered threads take the second. The Warp first executes the first path (the odd-numbered threads are masked), and then the second path (the even-numbered threads are masked), so the execution time of each Warp is the sum of the two paths. In the latter, a whole Warp executes only its own path, and the time is the length of one path.
The two kernels have the same launch configuration and the same total number of threads, and the ratio of their times is about 2. In three consecutive runs, the times differ by less than 2%.
'''
# src:
# 
# `diverge.cu` 中 `branch_by_lane` 与 `branch_by_warp` 调用相同的两个设备函数：`branch_one` 执行 1024 次 `v = v * 0.999f + 0.001f`，`branch_two` 执行 1024 次 `v = v * v - 0.25f`。两个核函数都是一半线程走第一条路径、一半线程走第二条路径，区别在于划分的依据。
# 图中每个 Warp 一行，上方是 32 个线程各自所在的分支，蓝色为第一条路径、橙色为第二条路径，下方的条按同一时间尺度画出 Warp 执行路径的先后：左图两条路径依次执行，右图每个 Warp 只执行自己的一条，两个 Warp 同时进行。
# 前者每个 Warp 的 32 个线程中，偶数号走第一条、奇数号走第二条，Warp 先执行第一条路径（奇数号线程被屏蔽），再执行第二条路径（偶数号线程被屏蔽），每个 Warp 的执行时间是两条路径之和。后者整个 Warp 只执行自己的那一条路径，时间是一条路径的长度。
# 两个核函数的启动配置与总线程数相同，耗时之比约为 2。连续运行三次，耗时的差别在 2% 以内。


src_hash = '86aec4b8'
text = '''
This page gives the whole picture of the four steps, and the code of each step is given in the pages on custom operators. The first two steps are in the same `.cu` file, and the last two are in the Python script.
`mylib` is the namespace of the operator, created by `TORCH_LIBRARY(mylib, m)`. The full name of the operator is `mylib::myadd`, and it is accessed in Python as `torch.ops.mylib.myadd`.
Development needs the CUDA Toolkit (which provides nvcc) and PyTorch installed. `load` compiles just in time at run time, so the first call is slow, and the result is cached in the build directory.
'''

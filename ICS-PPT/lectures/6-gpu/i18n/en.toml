['torch-matmul.notes.1']
src_hash = 'a146702c'
text = '''
This part takes PyTorch as an example and explains how a deep learning framework turns an operator call into a kernel on the GPU. Function names and file names are taken from the PyTorch 2.x source and may change between versions. File paths are relative to the root of the source repository.
`x @ w`, `torch.matmul(x, w)` and `x.matmul(w)` call the same ATen operator `matmul`. The two tensors are on the GPU, have data type float32 and both require gradients.
The three questions correspond to three mechanisms in turn: the Python binding, the dispatch of the Dispatcher, and the Autograd kernel.
'''
# src:
# 
# 本部分以 PyTorch 为例，说明深度学习框架怎样把一次算子调用变成 GPU 上的核函数。函数名与文件名取自 PyTorch 2.x 的源码，版本之间可能有变动，文件路径均相对于源码仓库的根目录。
# `x @ w`、`torch.matmul(x, w)` 与 `x.matmul(w)` 调用的是同一个 ATen 算子 `matmul`。两个张量位于 GPU 上，数据类型为 float32，都要求梯度。
# 这三个问题依次对应下面的三类机制：Python 绑定，Dispatcher 的分派，Autograd 核函数。

['torch-layers.title']

['render-task.slide.1']
src_hash = '626acf04'
text = '''
- The input of **3D rendering** is a description of a 3D scene:
  - the geometry of object surfaces (for example a triangle mesh);
  - surface materials, light source positions and viewpoint parameters.
- The output of rendering is the 2D image of the scene. The core computation determines the contribution of each triangle to the colour of each pixel in the image.
'''
# src:
# 
# - **3D 渲染**以三维场景的描述作为输入：
#   - 物体表面的几何形状（如三角网格）；
#   - 表面材质、光源位置与视角参数。
# - 渲染的输出是该场景对应的二维图像，核心计算是确定每个三角形对图像中各个像素颜色的贡献。


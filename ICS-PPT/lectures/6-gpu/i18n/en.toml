A GPU (Graphics Processing Unit) was originally designed for 3D rendering.
A triangle mesh builds the surface of an object out of many small triangles. The teapot on the left is a model commonly used in computer graphics.
The rendered result depends on the position and orientation of each triangle, on the surface materials and on the position of the light sources: the figure on the right is the mesh on the left with materials and lighting applied.
'''

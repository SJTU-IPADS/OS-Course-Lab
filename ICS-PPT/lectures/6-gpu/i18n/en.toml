['sm.slide.1']
src_hash = '129bef12'
text = '''
- Each SM contains:
  - **CUDA cores**: execute integer and floating-point operations;
  - **load/store units** (LD/ST) and **special function units** (SFU);
  - **Warp schedulers**, the register file, and shared memory / L1 cache.
'''
# src:
# 
# - 每个 SM 包含：
#   - **CUDA 核心**：执行整数与浮点运算；
#   - **加载/存储单元**（LD/ST）与**特殊功能单元**（SFU）；
#   - **Warp 调度器**、寄存器堆、共享内存 / L1 高速缓存。

['sm.notes.1']
src_hash = '13f2d5aa'
text = '''
The figure shows the internal structure of a single SM in the Fermi architecture: the instruction cache and two Warp schedulers at the top, a register file of 32768 32-bit registers in the middle, 32 CUDA cores, 16 load/store units and 4 special function units below, and 64 KB of shared memory and L1 cache at the bottom. A single Fermi SM contains 32 CUDA cores, whereas in recent Ampere, Hopper and Blackwell architectures (such as H100 and RTX 5090) a single SM contains 128 FP32 CUDA cores.
The special function unit (SFU) computes transcendental functions, reciprocal square roots, and so on.
Each thread has its own registers (allocated in the register file of the SM), and the threads of one thread block can exchange data through shared memory.
'''
# src:
# 
# 图中展示了 Fermi 架构中单个 SM 的内部结构：顶部为指令缓存与两个 Warp 调度器，中部为容量 32768 个 32 位寄存器的寄存器堆，下方排列 32 个 CUDA 核心、16 个加载/存储单元与 4 个特殊功能单元，底部为 64 KB 的共享内存与 L1 高速缓存。Fermi 架构的单个 SM 含 32 个 CUDA 核心，而近年来的 Ampere、Hopper 与 Blackwell 架构（如 H100 与 RTX 5090）单个 SM 均包含 128 个 FP32 CUDA 核心。
# 特殊功能单元（SFU）计算超越函数与倒数平方根等。
# 每个线程拥有独立的寄存器（分配在 SM 的寄存器堆中），同一线程块的线程可以通过共享内存交换数据。

['simt.title']
src_hash = '0bc02e53'
text = 'Warp and SIMT'
# src: Warp 与 SIMT

['simt.image.1.footnote.1']
src_hash = '43fa4f7a'
text = 'Redrawn from a figure in the NVIDIA Fermi Compute Architecture whitepaper'
# src: 按 NVIDIA Fermi Compute Architecture 白皮书的图重画

['simt.slide.1']
src_hash = '5be23939'
text = '''
- A **kernel** is executed once by each of many threads on the GPU. These threads form a **Grid**. The Grid is divided into **thread blocks**, and each thread block is assigned as a whole to one SM.
- Every 32 consecutive threads of a thread block form a **Warp**, and the threads of one Warp execute the same instruction in every cycle (**SIMT**).
'''
# src:
# 
# - **核函数**（Kernel）由 GPU 上的许多线程各执行一次。这些线程组成 **Grid**，Grid 划分为若干**线程块**，一个线程块整体分配给一个 SM。
# - 线程块中每连续 **32 个**线程组成一个 **Warp**（线程束），同一 Warp 的线程在每个周期执行同一条指令（**SIMT**）。

['simt.notes.1']
src_hash = 'ee5f8e15'
text = '''
The left side of the figure shows the thread hierarchy: one kernel launch produces a Grid, the Grid consists of thread blocks, and each thread block (256 threads in the figure) is divided into 8 Warps of 32 threads each. The right side shows the hardware: the thread block scheduler assigns a whole thread block to one SM, and all threads of the thread block execute on this SM until the block finishes.
A CUDA core itself has no independent fetch and decode unit. The Warp scheduler fetches and decodes one instruction at a time and issues it to a group of CUDA cores at the same time, and each CUDA core processes the data of one thread. This execution mode is single instruction, multiple threads (SIMT).
The SM in the figure is that of Fermi: it has two Warp schedulers, each managing a group of 16 CUDA cores. Each scheduler picks one ready Warp and issues its next instruction to its own group of cores, so at any moment this SM has two Warps each executing one instruction. A Warp has 32 threads but a group has only 16 cores, so the instruction completes in two batches of 16 threads each.
'''
# src:
# 
# 图左侧为线程的层次：一次核函数启动产生一个 Grid，Grid 由若干线程块组成，每个线程块（图中为 256 个线程）划分为 8 个 Warp，每个 Warp 含 32 个线程。图右侧为硬件：线程块调度器把整个线程块分配给一个 SM，线程块的全部线程在这个 SM 上一直执行到结束。
# CUDA 核心本身不包含独立的取指与译码部件。Warp 调度器每次取指、译码一条指令，并发往一组 CUDA 核心同时执行，每个 CUDA 核心处理一个线程的数据，这种执行模式即单指令多线程（SIMT）。
# 图中的 SM 取自 Fermi：有两个 Warp 调度器，各管一组 16 个 CUDA 核心。每个调度器选出一个就绪的 Warp，把它的下一条指令发往自己的那组核心，因此同一时刻这个 SM 上有两个 Warp 各在执行一条指令。一个 Warp 有 32 个线程而一组只有 16 个核心，所以这条指令分两批完成，每批 16 个线程。

['mem-hierarchy.title']
src_hash = '56f8afc4'
text = 'GPU Memory Hierarchy'
# src: GPU 存储层次

['mem-hierarchy.slide.1']
src_hash = '9316549e'
text = '''
- **Registers**: private to each thread, with the fastest access. **Shared memory**: one copy per thread block, located on the SM chip. **Global memory**: located in the off-chip device memory, read and written by all threads of the Grid.
- **Local memory**: logically private to each thread, physically located in the off-chip device memory, holding the local variables or arrays that do not fit in registers. The L1 and L2 caches are managed automatically by the hardware.
'''
# src:
# 
# - **寄存器**（Registers）：每个线程私有，访问速度最快。**共享内存**（Shared Memory）：每个线程块拥有一份，位于 SM 片上。**全局内存**（Global Memory）：位于片外显存，供整个 Grid 的所有线程共享读写。
# - **本地内存**（Local Memory）：逻辑上每个线程私有，物理上位于片外显存，用于存放寄存器容纳不下的局部变量或数组。L1 与 L2 高速缓存由硬件自动管理。

['mem-hierarchy.notes.1']
src_hash = 'cb7ec114'
text = '''
The left side shows the memory space corresponding to each level of the software thread hierarchy (thread, thread block, Grid). The right side shows the physical location of each memory level in hardware: the register file, shared memory and L1 data cache are inside the SM chip area, the L2 cache is shared by all SMs, and global memory (GPU DRAM) is outside the chip.
In modern NVIDIA GPUs, shared memory and the L1 data cache use the same on-chip physical SRAM, and the capacity split between the two can be configured by the program as needed (for example, each SM of the RTX 5090 has 128 KB of on-chip storage, and each SM of the H100 has 256 KB).
'''
# src:
# 
# 左侧为软件线程层次（线程、线程块、Grid）各自对应的存储空间。右侧为各级存储在硬件上的物理位置：寄存器堆、共享内存与 L1 数据缓存位于 SM 芯片内部，L2 高速缓存由所有 SM 共享，而全局显存（GPU DRAM）位于芯片外部。
# 在现代 NVIDIA GPU 中，共享内存与 L1 数据缓存共用同一块片上物理 SRAM，二者的容量配比可由程序按需配置（例如 RTX 5090 每个 SM 配备 128 KB 片上存储，H100 每个 SM 配备 256 KB 片上存储）。


# 
# Fermi 是 NVIDIA 于 2010 年发布的 GPU 架构。图中上下两排各排列 8 个 SM，中央为所有 SM 共用的 L2 高速缓存，两侧为 DRAM 接口，顶部为主机接口（PCIe）与线程块调度器（GigaThread）。
# 不同代际或同代不同型号的 GPU 均采用这种可扩展的模块化设计，型号之间的规模差异主要体现在 SM 的数量上。


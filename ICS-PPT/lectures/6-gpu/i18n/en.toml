['cuda-model.notes.1']
src_hash = '3046c3ca'
text = '''
In CUDA programming, host code and device code are written in the same `.cu` source file.
An ordinary function without a qualifier executes on the host (CPU) by default. A function marked `__global__` is called a kernel and is launched from the host with the `<<<...>>>` execution configuration syntax. Each launch creates a large number of threads on the GPU, and all threads execute the same kernel concurrently.
A function marked `__device__` executes on the GPU, can only be called from a kernel or another `__device__` function, and may have a return value.
'''
# src:
# 
# 在 CUDA 编程中，主机端代码与设备端代码编写在同一个 `.cu` 源文件中。
# 不带修饰符的普通函数默认在主机（CPU）上执行。以 `__global__` 修饰的函数称为核函数（Kernel），由主机端通过 `<<<...>>>` 执行配置语法启动。每次启动会在 GPU 上创建大量线程，所有线程并发执行同一个核函数。
# 以 `__device__` 修饰的函数在 GPU 上执行，仅能由核函数或其他 `__device__` 函数调用，可以有返回值。

['vecadd-kernel.title']
src_hash = 'dd3ef1ad'
text = 'CUDA Kernels'
# src: 核函数

['vecadd-kernel.slide.1']
src_hash = '7dcf87ee'
text = '''
- `add_cpu` on the CPU executes the loop with one thread as `i` runs from `0` to `n - 1`. `add_kernel` on the GPU has no loop, and each thread computes one element `c[i] = a[i] + b[i]`.
- Source file: [vecadd.cu](file:examples/vecadd.cu)
'''
# src:
# 
# - CPU 函数 `add_cpu` 由单个线程顺序执行 `for` 循环，下标 `i` 从 `0` 遍历至 `n - 1`。
# - GPU 核函数 `add_kernel` 按单个线程的视角编写，将循环展开为并行线程，每个线程负责计算一个元素 `c[i] = a[i] + b[i]`。源文件：[vecadd.cu](file:examples/vecadd.cu)

['vecadd-kernel.notes.1']
src_hash = 'a68d5ac9'
text = '''
Take vector addition `c[i] = a[i] + b[i]` as an example to compare the programming of the CPU and the GPU. The CPU version processes `n` elements by loop iteration. The GPU version eliminates the outer loop and launches at least `n` threads, and the kernel body is one iteration of the original loop body.
All threads execute exactly the same kernel code. Each thread computes its own unique global index `i` from the built-in variables `blockIdx`, `blockDim` and `threadIdx`, and then accesses a different element of the arrays. This programming mode is called Single Program, Multiple Data (SPMD).
'''
# src:
# 
# 以向量加法 `c[i] = a[i] + b[i]` 为例对比 CPU 与 GPU 的编程方式。CPU 版本通过循环迭代处理 `n` 个元素。GPU 版本则消除了外层循环，启动至少 `n` 个线程，核函数体即为原循环体的一次迭代。
# 所有线程执行完全相同的核函数代码，通过内置变量 `blockIdx`、`blockDim` 与 `threadIdx` 计算各自唯一的全局下标 `i`，进而访问数组的不同元素。这种编程模式称为单程序多数据（SPMD，Single Program, Multiple Data）。

['thread-index.title']
src_hash = '6ca5989c'
text = 'Thread Hierarchy and Indexing'
# src: 线程组织与下标

['thread-index.slide.1']
src_hash = '30ddde1d'
text = '''
- One kernel launch creates one **Grid**. The Grid contains a number of **thread blocks** (Thread Block) of equal size, each thread block contains a number of **threads** (Thread), and a thread block has at most 1024 threads.
- The global index of a thread is `i = blockIdx.x * blockDim.x + threadIdx.x`. When the array length `n` is not a multiple of the block size, round up and launch `(n + threads - 1) / threads` thread blocks, and filter out the out-of-bounds threads in the kernel with `if (i < n)`.
'''
# src:
# 
# - 一次核函数启动创建一个 **Grid**（网格）。Grid 包含若干个规模相同的**线程块**（Thread Block），每个线程块包含若干个**线程**（Thread），一个线程块至多 1024 个线程。
# - 线程的全局下标为 `i = blockIdx.x * blockDim.x + threadIdx.x`。当数组长度 `n` 非块大小的整数倍时，向上取整启动 `(n + threads - 1) / threads` 个线程块，并在核函数中用 `if (i < n)` 过滤越界线程。

['thread-index.notes.1']
src_hash = '4236b901'
text = '''
Two levels of size are specified when launching a kernel: the number of thread blocks in the Grid (`gridDim.x`) and the number of threads in each thread block (`blockDim.x`).
The figure shows 4 thread blocks of 8 threads each, 32 threads in all. `blockIdx.x` is the number of the current thread block in the Grid (0 to 3), and `threadIdx.x` is the number of the thread within the block (0 to 7). Thread 3 of thread block 2 has the global index `i = 2 × 8 + 3 = 19` and computes `c[19]`.
If the array length is `n = 29`, rounding up requires launching `(29 + 7) / 8 = 4` thread blocks (32 threads in all). The three threads numbered 29, 30 and 31 in the last thread block do not satisfy `i < n`, so they exit right after the condition check and no out-of-bounds access occurs.
A Grid and a thread block can also be organized in two or three dimensions. This page uses only one dimension.
'''
# src:
# 
# 启动核函数时需指定两级尺寸：Grid 中的线程块数量（`gridDim.x`）与每个线程块内的线程数量（`blockDim.x`）。
# 图示包含 4 个线程块、每块 8 个线程，合计 32 个线程。`blockIdx.x` 表示当前线程块在 Grid 中的编号（0 至 3），`threadIdx.x` 表示线程在块内的编号（0 至 7）。第 2 号线程块的第 3 号线程对应的全局下标为 `i = 2 × 8 + 3 = 19`，负责计算 `c[19]`。
# 若数组长度 `n = 29`，向上取整需启动 `(29 + 7) / 8 = 4` 个线程块（共 32 个线程）。最后一个线程块中编号为 29、30、31 的三个线程不满足 `i < n`，因此在条件判断后直接退出，不会发生越界访存。
# Grid 与线程块也可以组织为二维、三维。本页只用一维。

['block-to-sm.title']
src_hash = '7ac75187'
text = 'Thread Block Scheduling'
# src: 线程块的调度

['block-to-sm.image.1.footnote.1']
src_hash = '9bc30de6'
text = 'Redrawn after a figure in the NVIDIA CUDA C++ Programming Guide'
# src: 按 NVIDIA CUDA C++ Programming Guide 的图重画

['block-to-sm.slide.1']
src_hash = '4fe0f23c'
text = '''
- A thread block is assigned as a whole to one SM and does not migrate until it finishes. The threads of one thread block can cooperate through the shared memory of that SM, and there is no means of synchronization between threads of different thread blocks.
- The execution orders of the thread blocks are independent of each other: the hardware scheduler assigns the waiting thread blocks one after another to SMs that have free resources. The same program run on a GPU with more SMs automatically obtains a higher degree of parallelism.
'''
# src:
# 
# - 一个线程块会被整体分配到某一个 SM 上执行，直到执行完毕都不会迁移。同一线程块的线程可以通过该 SM 的共享内存协作，不同线程块的线程之间没有同步手段。
# - 各个线程块之间的执行顺序相互独立：硬件调度器将待执行的线程块依次分配给有空闲资源的 SM。同一程序在拥有更多 SM 的 GPU 上运行时，能够自动获得更高的并行度。

['block-to-sm.notes.1']
src_hash = '0db0578f'
text = '''
The figure shows how a Grid of 8 thread blocks is scheduled on GPUs of different scales: on a GPU with 2 SMs, each SM executes 4 thread blocks one after another. On a GPU with 4 SMs, each SM executes only 2 thread blocks, and the application code does not need any modification.
There is no guarantee on the order in which thread blocks execute, and no synchronization instruction between them: a kernel cannot depend on one thread block executing before another.
'''
# src:
# 
# 图中展示了包含 8 个线程块的 Grid 在不同规模 GPU 上的调度过程：在拥有 2 个 SM 的 GPU 上，每个 SM 先后执行 4 个线程块。在拥有 4 个 SM 的 GPU 上，每个 SM 仅需执行 2 个线程块，应用程序代码无需作任何修改。
# 线程块之间没有执行顺序的保证，也没有同步指令：核函数不能依赖某个线程块先于另一个线程块执行。

['vecadd-host.title']
src_hash = 'b30ea5c5'
text = 'Device Memory and Kernel Launch'
# src: 显存管理与核函数启动

['vecadd-host.slide.1']
src_hash = 'e12e65a0'
text = '''
- Host memory and device memory use separate address spaces: host code cannot dereference the device pointer `da` directly, and a kernel cannot dereference the host pointer `a`.
- `cudaMalloc` and `cudaFree` allocate and free device memory. `cudaMemcpy` copies data synchronously between the host and the device memory, and its last parameter specifies the direction.
- `add_kernel<<<blocks, threads>>>(...)` launches the kernel on the device with the specified grid size and block size.
'''
# src:
# 
# - 主机内存与设备显存采用独立的地址空间：主机代码不能直接解引用显存指针 `da`，核函数也不能解引用主机指针 `a`。
# - `cudaMalloc` 与 `cudaFree` 负责分配和释放显存。`cudaMemcpy` 在主机与显存之间同步复制数据，最后一个参数指明传输方向。
# - `add_kernel<<<blocks, threads>>>(...)` 按指定的网格规模与块大小在设备上启动核函数。

['vecadd-host.notes.1']
src_hash = '14b6cffa'
text = '''
The animation runs the `main` function of `vecadd.cu` step by step. The arrow added in each frame is the data flow of this step, and the arrows of the earlier steps are faded. Initial state: the inputs `a` and `b` are in host memory, the device memory is empty, and `c` holds nothing yet.
(1) `cudaMalloc` allocates `da`, `db` and `dc` in the device memory; the three blocks hold nothing yet. (2) `cudaMemcpy` copies `a` and `b` to `da` and `db` over PCIe. (3) The kernel is launched; the GPU reads `da` and `db` and writes the result to `dc`. The launch is followed immediately by `CHECK(cudaGetLastError())`. (4) `cudaMemcpy` copies `dc` back to `c` in host memory. (5) `cudaFree` releases the three blocks of device memory.
`cudaMalloc` takes the address of a pointer variable (`float **`) and writes the start address of the allocated device memory into `da`, `db` and `dc`. These addresses are in the device memory space and can only be passed to kernels or `cudaMemcpy`. Reading or writing `*da` directly in CPU code triggers a segmentation fault.
`cudaMemcpy` is a synchronous interface and returns to the caller only after the data transfer completes. Its fourth parameter specifies the direction with `cudaMemcpyHostToDevice` or `cudaMemcpyDeviceToHost`.
'''
# src:
# 
# 动画逐步执行 `vecadd.cu` 的 `main` 函数，每一帧新加的箭头是这一步的数据流向，前面各步的箭头变淡。初始状态：输入 `a`、`b` 在主机内存，设备显存是空的，`c` 尚无内容。
# ① `cudaMalloc` 在设备显存中分配 `da`、`db`、`dc`，此时三块显存没有内容。② `cudaMemcpy` 经 PCIe 把 `a`、`b` 复制到 `da`、`db`。③ 启动核函数，GPU 读取 `da`、`db`，把结果写入 `dc`。启动之后紧跟 `CHECK(cudaGetLastError())`。④ `cudaMemcpy` 把 `dc` 复制回主机内存的 `c`。⑤ `cudaFree` 释放三块显存。
# `cudaMalloc` 接收指针变量的地址（`float **`），将分配到的显存起始地址写入 `da`、`db`、`dc`。这些地址位于设备显存空间，只能传递给核函数或 `cudaMemcpy`，若在 CPU 代码中直接读写 `*da`，将触发段错误。
# `cudaMemcpy` 是同步接口，待数据传输全部完成后才向调用方返回，其第四个参数通过 `cudaMemcpyHostToDevice` 或 `cudaMemcpyDeviceToHost` 指明传输方向。

['dot-kernel.title']
src_hash = '6f1c5a76'
text = 'Shared Memory and Block-Level Summation'
# src: 共享内存与块内求和

['dot-kernel.slide.1']
src_hash = 'c4da3f11'
text = '''

- The dot product $\sum_{i=0}^{n-1} w[i] \cdot x[i]$ requires the products computed by the threads to be summed.
- `__shared__ int cache[256]` declares an array shared within the block. Each thread block has its own copy, used jointly by the 256 threads of the block.
- Each thread first stores its product in `cache[tid]`. Through the halving summation, the sum of all the numbers in `cache` finally lands in `cache[0]`, which is the partial sum of the current thread block. Thread 0 writes it to the device array `block_sum[blockIdx.x]`. After the kernel ends, `block_sum` is copied back to memory, and the CPU adds up the partial sums to obtain the final result.
'''
# src:
# 
# - 向量内积 $\sum_{i=0}^{n-1} w[i] \cdot x[i]$ 需将各线程计算的乘积汇总求和。
# - `__shared__ int cache[256]` 声明块内共享数组，每个线程块拥有一份独立副本，由块内 256 个线程共用。
# - 每个线程先把自己的乘积存入 `cache[tid]`。通过折半求和，最终 `cache` 中所有数字的和落在 `cache[0]`，即当前线程块的部分和，由 0 号线程写入显存数组 `block_sum[blockIdx.x]`。核函数结束后，将 `block_sum` 拷贝回内存，由 CPU 对各部分和求和，得到点积最终结果。

['dot-kernel.notes.1']
src_hash = '5adb66d2'
text = '''

In vector addition each thread writes its own `c[i]` independently, and the threads need no communication. The dot product requires accumulating the products `w[idx] * x[idx]` computed by all threads into one scalar.
`dot_kernel` uses a blocked reduction: each thread block first sums the 256 products of its threads in the shared memory `cache`, thread 0 writes the partial sum of the block into the global array `block_sum[blockIdx.x]`, and finally the host adds up the partial sums of the thread blocks.
The summation inside a block is a halving summation (tree reduction): in the first step s = 128, and threads 0 to 127 each add the element 128 positions further on. The number of threads taking part in the addition then halves at every step, and after log₂ 256 = 8 steps `cache[0]` is the sum of all 256 products.
'''
# src:
# 
# 在向量加法中，各线程独立写入各自的 `c[i]`，线程之间无需通信。而向量内积要求将所有线程计算的乘积 `w[idx] * x[idx]` 累加为一个标量。
# `dot_kernel` 采用分块归约策略：每个线程块首先在共享内存 `cache` 中将本块 256 个线程的乘积求和，由 0 号线程将块内部分和写入显存数组 `block_sum[blockIdx.x]`，最后在主机端将各线程块的部分和累加。
# 块内求和采用折半求和（树形规约）：第一步 s = 128，线程 0 至 127 分别累加后 128 个位置的元素，之后参与加法的线程数逐步减半，经过 log₂ 256 = 8 步，`cache[0]` 是全部 256 个乘积之和。

['dot-warp.title']
src_hash = '208c6d1e'
text = 'Thread Blocks of a Single Warp'
# src: 单个 Warp 的线程块

['dot-warp.slide.1']
src_hash = 'b6f1513f'
text = '''

- When a thread block has only 32 threads, the whole block runs on 1 warp and executes the same instruction in every cycle.
- In each step of the halving summation, all threads of the warp execute the read instruction and the write instruction together. The read instruction of the next step is issued after the write instruction of this step, so every value it reads has already been computed, and the result of the kernel is correct.
- When a thread block contains several warps, the warps can advance at different speeds.
'''
# src:
# 
# - 当线程块只有 32 个线程时，整个线程块运行在 1 个 Warp 上，每个周期执行同一条指令。
# - 折半求和的每一步，Warp 的全部线程一起执行读取指令和写入指令。下一步的读取指令在这一步的写入指令之后才发射，读到的都是已经计算好的值，因此核函数的结果正确。
# - 当线程块含多个 Warp 时，各个 Warp 的推进速度可以不同。

['dot-warp.notes.1']
src_hash = '20497c81'
text = '''

The animation takes 8 threads as an example and assumes they form 1 warp. On the left there is only one copy of the loop: the 8 threads share one program counter and execute the same instruction at the same time, and the line on the orange wash is the line the warp is executing. On the right are the rows of cache.
s = 4: the addition is executed by the 8 threads together. Threads 0 to 3 write cache[0] to cache[3], and threads 4 to 7 do not satisfy `tid < s` and do not write. Only after this instruction is complete does the next step start.
s = 2: threads 0 and 1 read cache[2] and cache[3], which are already 6 and 7 by now, and obtain cache[0] = 14 and cache[1] = 17.
s = 1: thread 0 obtains cache[0] = 14 + 17 = 31. The reads of every step come after the writes of the previous step, so the sum is correct.
The premise of the text of the page is a thread block of exactly 32 threads. The loop of `dot_kernel` then starts at s = 16: threads 0 to 15 take part in the addition, and threads 16 to 31 are masked in the same instruction and do not write.
A warp has a single instruction stream, and the write instruction is issued before the read instruction of the next step, so it cannot happen that some threads have already read while others have not yet written.
`dot_kernel` with 256 threads per block contains 8 warps. The scheduler schedules these warps separately and they advance at different speeds.
'''
# src:
# 
# 动画以 8 个线程为例，假定它们组成 1 个 Warp。左侧只有一份循环代码：8 个线程共用一个程序计数器，同一时刻执行同一条指令，橙色底的一行是 Warp 当前执行的行。右侧是 cache 的各行。
# s = 4：加法由 8 个线程一起执行，线程 0 至 3 写入 cache[0] 至 cache[3]，线程 4 至 7 不满足 `tid < s`，不写入。这一条指令完成之后，下一步才开始。
# s = 2：线程 0、1 读取 cache[2]、cache[3]，此时这两个位置已经是 6 和 7，得到 cache[0] = 14，cache[1] = 17。
# s = 1：线程 0 得到 cache[0] = 14 + 17 = 31。每一步的读取都在上一步的写入之后，求和的结果正确。
# 页面文字的前提是线程块恰好 32 个线程。此时 `dot_kernel` 的循环从 s = 16 开始，线程 0 至 15 参与加法，线程 16 至 31 在同一条指令中被屏蔽，不写入。
# 一个 Warp 只有一个指令流，写入指令先于下一步的读取指令发射，所以不会出现“一部分线程已经读取，另一部分线程还没有写入”的情况。
# 每块 256 个线程的 `dot_kernel` 含 8 个 Warp，这些 Warp 由调度器分别调度，推进速度不同。

['dot-race.title']
src_hash = '22f121f0'
text = 'Wrong Sum with Several Warps'
# src: 多个 Warp 的求和错误

['dot-race.notes.1']
src_hash = '0d49827a'
text = '''

The animation takes 8 threads as an example and assumes 2 threads per warp: threads 0 and 1 are warp 0, threads 2 and 3 are warp 1. The block then contains several warps. Below is the loop that each of threads 0 to 3 executes; the line on the orange wash is the line that thread is on, and `s` is the current value of its loop variable. Threads of different warps do not advance in lockstep: threads 0 and 1 of warp 0 finish the addition of s = 4 before threads 2 and 3 of warp 1, and obtain cache[0] = 8 and cache[1] = 10.
Threads 0 and 1 do not wait for threads 2 and 3 and go straight on to s = 2, reading cache[2] and cache[3]. These two positions have not been written by threads 2 and 3 yet and still hold the old values 4 and 1, so cache[0] = 8 + 4 = 12 and cache[1] = 10 + 1 = 11.
Threads 2 and 3 finish s = 4 afterwards and write 6 and 7, but threads 0 and 1 have already used the old values. Finally thread 0 executes s = 1 and obtains cache[0] = 12 + 11 = 23, while the correct sum is 31.
The 256 threads of a block belong to 8 warps, and the warps can advance at different speeds, so the sum of this kernel is unreliable. A warp that arrives early has to wait for a warp that arrives later.
'''
# src:
# 
# 动画以 8 个线程为例，并假定每个 Warp 有 2 个线程：线程 0、1 是 Warp 0，线程 2、3 是 Warp 1。这样线程块含多个 Warp。下方是线程 0 至 3 各自执行的循环，橙色底的一行是该线程当前所在的行，`s` 是该线程循环变量的当前值。不同 Warp 的线程并不同步推进：Warp 0 的线程 0、1 比 Warp 1 的线程 2、3 先完成 s = 4 的加法，得到 cache[0] = 8、cache[1] = 10。
# 线程 0、1 不等待线程 2、3，直接进入 s = 2，读取 cache[2]、cache[3]。这两个位置还没有被线程 2、3 写入，仍是旧值 4 和 1，于是 cache[0] = 8 + 4 = 12，cache[1] = 10 + 1 = 11。
# 线程 2、3 随后才完成 s = 4，写入 6 和 7，但线程 0、1 已经用了旧值。最后线程 0 执行 s = 1，得到 cache[0] = 12 + 11 = 23，正确的和是 31。
# 每块 256 个线程分属 8 个 Warp，各个 Warp 的推进速度可以不同，所以这个核函数的求和结果不可靠。需要让先到达的 Warp 等待后到达的 Warp。

['dot-sync.title']
src_hash = '6ec195e6'
text = 'Block-Level Synchronization Barrier'
# src: 块内同步屏障

['dot-sync.slide.1']
src_hash = '5256926c'
text = '**→**'
# src: **→**

['dot-sync.slide.2']
src_hash = '5256926c'
text = '**→**'
# src: **→**

['dot-sync.slide.3']
src_hash = '4cb3e371'
text = '''

- `__syncthreads()` is the synchronization barrier of a block: all threads of the block must reach this line before any of them continues, and the threads that arrive first wait there.
- A barrier after the addition of every step of the loop makes the reads of the next step come after all writes of this step. The barrier before the loop guarantees that all 256 products are stored in `cache` when the loop starts.
'''
# src:
# 
# - `__syncthreads()` 为块内同步屏障：块内所有线程必须全部到达该行后才能继续向下执行，先到达的线程在该行等待。
# - 循环中每一步加法之后放一个屏障，下一步的读取就在这一步的全部写入完成之后。循环之前的屏障保证进入循环时 256 个乘积都已存入 `cache`。

['dot-sync.notes.1']
src_hash = 'c35aa62b'
text = '''

The error of the previous page comes from the warps not waiting for each other. Adding `__syncthreads()` to the kernel fixes it: the barrier inside the loop ensures that all additions of the current step are complete before the next round of halving summation starts, and the barrier before the loop ensures that all 256 threads of the block have written their products into `cache`.
'''
# src:
# 
# 上一页的错误来自 Warp 之间没有等待。在核函数中加入 `__syncthreads()` 即可：循环体内的屏障确保当前步的所有加法均已完成，再进入下一轮折半累加。循环之前的屏障确保块内 256 个线程均已将乘积写入 `cache`。

['dot-fold.title']
src_hash = '6ec195e6'
text = 'Block-Level Synchronization Barrier'
# src: 块内同步屏障

['dot-fold.notes.1']
src_hash = '408eaba4'
text = '''

The animation is the same as the previous one: 8 threads, 2 threads per warp, and below the loop that each of threads 0 to 3 executes, now with `__syncthreads()` in it. The line on the orange wash is the line that thread is on, and a red wash means the thread is stopped at the barrier and waiting.
s = 4: warp 0 finishes its additions first, reaches the barrier and waits. Warp 1 then finishes its additions and writes 6 and 7. Only when all threads have reached the barrier do they enter the next round together.
s = 2: threads 2 and 3 do not satisfy `tid < s`, do not add, reach the barrier first and wait for warp 0. When warp 0 adds, the cache[2] and cache[3] it reads are already 6 and 7, giving cache[0] = 14 and cache[1] = 17.
s = 1: thread 0 obtains cache[0] = 14 + 17 = 31. Threads 4 to 7 do not add in these steps and are not drawn.
In `dot_kernel` with 256 threads per block, the stride s takes the values 128, 64, 32, 16, 8, 4, 2, 1, and the summation of 256 elements is complete after log₂ 256 = 8 steps.
For a vector of length n = 2²⁴, 65536 thread blocks are launched and produce 65536 partial sums, which the host copies back to memory with cudaMemcpy and adds up.
'''
# src:
# 
# 动画与上一组相同：8 个线程，每个 Warp 2 个线程，下方是线程 0 至 3 各自执行的循环，循环中多了 `__syncthreads()`。橙色底的一行是该线程当前所在的行，红色底表示线程停在屏障上等待。
# s = 4：Warp 0 先完成加法，到达屏障后等待。Warp 1 随后完成加法，写入 6 和 7，全部线程到达屏障，才一起进入下一轮。
# s = 2：线程 2、3 不满足 `tid < s`，不执行加法，先到达屏障并等待 Warp 0。Warp 0 完成加法时读到的 cache[2]、cache[3] 已是 6 和 7，得到 cache[0] = 14，cache[1] = 17。
# s = 1：线程 0 求得 cache[0] = 14 + 17 = 31，与带屏障的折半求和的结果一致。线程 4 至 7 在这些步骤中不执行加法，图中没有画出。
# 在每块 256 个线程的 dot_kernel 中，步长 s 依次取 128、64、32、16、8、4、2、1，经过 log₂ 256 = 8 步即可完成 256 个元素的求和。
# 对于长度 n = 2²⁴ 的向量，共启动 65536 个线程块计算出 65536 个部分和，由主机端通过 cudaMemcpy 复制回内存并完成最终累加。


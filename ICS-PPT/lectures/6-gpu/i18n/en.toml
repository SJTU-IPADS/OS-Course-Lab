['torch-layers.slide.1']
src_hash = 'd957eaba'
text = '''
- **Python API**: `Tensor.__matmul__` receives `x @ w`.
- **Python binding**: parses the Python arguments, releases the GIL and calls ATen's `matmul`.
- **ATen**: the tensor library. Each operator corresponds to a C++ function whose signature is declared in a YAML file.
- **Dispatcher**: selects the kernel of an operator by the dispatch key of the tensors.
- **Kernels**: an operator has one implementation under each key. The CUDA implementation calls libraries such as cuBLAS and cuDNN, or launches a hand-written `.cu` kernel.
'''
# src:
# 
# - **Python API**：`Tensor.__matmul__` 接收 `x @ w`。
# - **Python 绑定**：解析 Python 参数，释放 GIL，调用 ATen 的 `matmul`。
# - **ATen**：张量库。每个算子一个 C++ 函数，签名声明在 YAML 文件中。
# - **Dispatcher**：按张量的 dispatch key 选择算子的核函数。
# - **核函数**：算子在每个 key 下各有一个实现。CUDA 的实现调用 cuBLAS、cuDNN 等库，或启动自写的 `.cu` 核函数。

['torch-layers.notes.1']
src_hash = '5d53eda3'
text = '''
The figure lists, from top to bottom, the layers an operator call passes through. Orange marks the kernels that `x @ w` goes through: Autograd and CUDA, and cuBLAS, which the CUDA kernel calls. The kernels of the Autocast, CPU and other keys are also registered with the Dispatcher, and this call does not use them.
The Python binding is located in `torch/csrc`. It converts Python objects to `at::Tensor` and releases the GIL before calling the C++ function, so that other Python threads can run.
The operators of ATen are declared in `aten/src/ATen/native/native_functions.yaml`, and the source of the kernels is in `aten/src/ATen/native/` and `aten/src/ATen/native/cuda/`. The Dispatcher is implemented in `aten/src/ATen/core/dispatch/`.
cuBLAS and cuDNN are libraries provided by NVIDIA, and PyTorch calls them through the wrappers in `aten/src/ATen/cuda/`. The CUDA runtime submits kernels to the GPU.
'''
# src:
# 
# 图中自上而下是一次算子调用经过的层，橙色标出 `x @ w` 经过的核函数：Autograd 与 CUDA，以及 CUDA 核函数调用的 cuBLAS。Autocast、CPU 等 key 的核函数同样登记在 Dispatcher 中，这次调用不使用它们。
# Python 绑定位于 `torch/csrc`。它把 Python 对象转换为 `at::Tensor`，在调用 C++ 函数之前释放 GIL，使其他 Python 线程可以运行。
# ATen 的算子声明在 `aten/src/ATen/native/native_functions.yaml`，核函数的源码在 `aten/src/ATen/native/` 与 `aten/src/ATen/native/cuda/`。Dispatcher 的实现在 `aten/src/ATen/core/dispatch/`。
# cuBLAS 与 cuDNN 是 NVIDIA 提供的库，PyTorch 通过 `aten/src/ATen/cuda/` 中的封装调用它们。CUDA 运行时负责把核函数提交给 GPU。


['flops-trend.notes.1']
src_hash = '739090fa'
text = '''
The vertical axis shows the theoretical single-precision peak of the processor in GFLOP/s (10⁹ floating-point operations per second), on a logarithmic scale. The orange line is the GeForce flagship GPU of each generation, from the 8800 GTX in 2006 to the RTX 5090 in 2025. The blue line is the Intel Core flagship CPU of each generation on the mainstream desktop platform, from the Core 2 Extreme QX6700 in 2006 to the Core Ultra 9 285K in 2024.
The theoretical peak of a processor is determined by the number of cores × the clock frequency × the floating-point operations per core per cycle. For a GPU it is the number of CUDA cores × 2 operations (one multiply-add) × the boost clock, for the RTX 5090 21760 × 2 × 2.407 GHz = 104.8 TFLOP/s. For a CPU it is the number of cores × the base clock × the single-precision operations per cycle of one core. The operations per cycle widen with the instruction set: 8 with SSE, 16 with AVX, 32 with AVX2 and two FMA units. The Core Ultra 9 285K has 8 P-cores and 16 E-cores, both executing 32 operations per cycle, at base clocks of 3.7 GHz and 3.2 GHz, which gives 2.6 TFLOP/s.
Since 2006 the peak of the GPU has grown about 300 times and that of the CPU about 30 times, so the gap has widened from 4 times to 41 times. The clock frequency of a single CPU core levelled off because of the power limit, and the growth of CPU performance depends mainly on the number of cores and the vector width, while the GPU keeps adding parallel arithmetic units.
After NVIDIA released the CUDA platform in 2007, developers could write general-purpose parallel programs for the GPU directly in C/C++. The matrix multiplications and convolutions in neural networks are likewise the same arithmetic operation repeated over large amounts of data, so they match the hardware characteristics of the GPU closely.
The three icons below are the logos of three projects that use general-purpose GPU computing: OpenCL from the Khronos Group, LeRobot from Hugging Face, and ggml.
'''
# src:
# 
# 图中纵轴表示处理器的理论峰值单精度浮点算力，单位为 GFLOP/s（每秒十亿次浮点运算），采用对数坐标。橙色折线为各代 GeForce 旗舰 GPU，从 2006 年的 8800 GTX 到 2025 年的 RTX 5090。蓝色折线为各代 Intel Core 旗舰 CPU（主流桌面平台），从 2006 年的 Core 2 Extreme QX6700 到 2024 年的 Core Ultra 9 285K。
# 处理器的理论峰值算力由「运算核心数 × 时钟频率 × 单核每周期浮点运算次数」决定。GPU 的数值为 CUDA 核心数 × 2 次运算（一次乘加）× 加速频率，RTX 5090 为 21760 × 2 × 2.407 GHz = 104.8 TFLOP/s。CPU 的数值为核心数 × 基础频率 × 每周期单精度运算次数，数值按基础频率计算。每个核心每周期的运算次数随指令集加宽：SSE 为 8，AVX 为 16，AVX2 与两个 FMA 单元为 32。Core Ultra 9 285K 有 8 个 P 核与 16 个 E 核，P 核与 E 核每周期均为 32 次，基础频率分别为 3.7 GHz 与 3.2 GHz，合计 2.6 TFLOP/s。
# 自 2006 年起，GPU 的峰值算力增长约 300 倍，CPU 约 30 倍，两者的差距由 4 倍扩大到 41 倍。CPU 单核时钟频率受功耗限制趋于平稳，算力增长主要依赖核心数量与向量宽度，而 GPU 持续增加并行运算单元。
# 2007 年 NVIDIA 发布 CUDA 平台后，开发者可以直接使用 C/C++ 在 GPU 上编写通用并行程序。神经网络中的矩阵乘法与卷积等计算同样是对大规模数据重复执行相同的算术运算，因此在硬件特性上高度契合 GPU。
# 页面下方为三个使用 GPU 通用计算的项目的标志：Khronos Group 的 OpenCL、Hugging Face 的 LeRobot 与 ggml。


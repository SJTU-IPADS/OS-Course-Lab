['custom-op-flow.slide.1']
src_hash = 'c374e46c'
text = '''
- Goal: let Python call a CUDA kernel of our own as it calls `torch.add`. Take the vector addition as the example, with the operator named `mylib::myadd`.
- ① A C++ function checks the arguments, allocates the output tensor and launches the kernel on the current CUDA stream.
- ② `TORCH_LIBRARY` declares the operator, and `TORCH_LIBRARY_IMPL` registers this C++ function for CUDA.
- ③ `torch.utils.cpp_extension.load` compiles the `.cu` file and loads the dynamic library, and the operator is registered at load time.
- ④ Calling `torch.ops.mylib.myadd`, the Dispatcher finds the registered function in the table.
'''
# src:
# 
# - 目标：让 Python 像调用 `torch.add` 一样调用自己写的 CUDA 核函数。以向量加法为例，算子名为 `mylib::myadd`。
# - ① C++ 函数检查参数，分配输出张量，在当前 CUDA 流上启动核函数。
# - ② `TORCH_LIBRARY` 声明算子，`TORCH_LIBRARY_IMPL` 为 CUDA 登记这个 C++ 函数。
# - ③ `torch.utils.cpp_extension.load` 编译 `.cu` 文件并加载动态库，加载时注册算子。
# - ④ 调用 `torch.ops.mylib.myadd`，Dispatcher 在表中找到登记的函数。


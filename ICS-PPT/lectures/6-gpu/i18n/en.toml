['dgpu-igpu.columns.1.col.1']
src_hash = '24cb8bb7'
text = '''
**Discrete GPU** (dGPU)
- Used in desktops and servers
- A separate chip with dedicated VRAM
- Connected to the CPU via the PCIe bus
- Higher compute and higher memory bandwidth
'''
# src:
# 
# **独立 GPU**（dGPU）
# - 常见于台式机与计算服务器
# - 独立的处理器芯片与专用高带宽显存（VRAM）
# - 通过 PCIe 总线与 CPU 及主机内存相连
# - 峰值算力与显存带宽更高

['dgpu-igpu.columns.1.col.2']
src_hash = '15100f7c'
text = '''
**Integrated GPU** (iGPU)
- Common in laptops and mobile devices
- Integrated in the same chip package as the CPU cores
- Shares physical system memory with the CPU
- Lower power, data is not copied over PCIe
'''
# src:
# 
# **集成 GPU**（iGPU）
# - 常见于笔记本电脑与移动终端
# - 与 CPU 核心集成在同一颗芯片封装内
# - 与 CPU 共享物理系统内存
# - 功耗更低，数据不经 PCIe 复制


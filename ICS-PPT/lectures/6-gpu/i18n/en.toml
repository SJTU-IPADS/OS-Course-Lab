['block-stages.title']
src_hash = '484baf45'
text = 'Residency and Execution of Thread Blocks'
# src: 线程块的驻留与执行

['block-stages.slide.1']
src_hash = 'e74e6cc9'
text = '''

- A thread block is assigned whole to one SM. **Residency** means that the thread block holds the threads, registers and shared memory of that SM until the thread block ends. An SM can hold several thread blocks at the same time, and the thread blocks that do not fit wait.
- **Execution** means that in every cycle the Warp schedulers of the SM pick some of the resident Warps and each issues one instruction, while the other resident Warps do not issue in this cycle.
'''
# src:
# 
# - 线程块整块分配给一个 SM。**驻留**指线程块占有该 SM 的线程数、寄存器与共享内存，直到线程块结束。一个 SM 可以同时驻留多个线程块，装不下的线程块等待。
# - **执行**指 SM 的 Warp 调度器每个周期从驻留的 Warp 中选出几个，各发射一条指令，其余驻留的 Warp 本周期不发射。

['block-stages.notes.1']
src_hash = '0076f8a6'
text = '''

The animation has 16 thread blocks and 2 SMs. Each thread block has 256 threads, that is 8 Warps, and each SM holds at most 1536 threads, that is 6 thread blocks.
Frame 1: the thread blocks are all waiting and none is assigned to an SM. Frame 2: the hardware assigns thread blocks to the SMs whole, each SM holds 6 thread blocks, its thread count is full, and B12 to B15 keep waiting.
Frames 3 and 4: residency and execution are two different levels. Residency is the occupation of resources: once a thread block is assigned to an SM, its threads, registers and shared memory belong to this thread block until it ends. Execution is the issue of instructions: each SM has 4 Warp schedulers, and in every cycle each of them picks a ready Warp among the resident Warps and issues its next instruction. The orange squares are the 4 Warps issued in this cycle. In every cycle the scheduler chooses again among the Warps whose next instruction is ready, and the policy is decided by the hardware: a Warp whose following instructions are all ready can be picked in several consecutive cycles, and other Warps get their turn only when it stalls, for example while waiting for memory. A resident Warp that is not picked does not advance but keeps its register state in the register file. The 48 resident Warps therefore do not compute at the same time.
Frames 5 to 7: when all threads of B2 have finished, the resources it occupied are released as a whole, SM 0 gets a free place for a thread block, and the hardware scheduler assigns the waiting B12 to it. Thread blocks have no guaranteed order of execution.
'''
# src:
# 
# 动画中有 16 个线程块和 2 个 SM，每个线程块 256 个线程，即 8 个 Warp，每个 SM 最多驻留 1536 个线程，即 6 个线程块。
# 第 1 帧：线程块都在等待，没有分配到 SM。第 2 帧：硬件把线程块整块分配给 SM，每个 SM 驻留 6 个线程块，线程数用满，B12 至 B15 继续等待。
# 第 3、4 帧：驻留与执行是两个层次。驻留是资源的占用：线程块被分配到 SM 后，它的线程数、寄存器和共享内存一直归这个线程块，直到它结束。执行是指令的发射：每个 SM 有 4 个 Warp 调度器，每个周期各从驻留的 Warp 中选出一个就绪的，发射它的下一条指令。图中橙色是本周期发射的 4 个 Warp。每个周期调度器都重新选择，从指令已就绪的 Warp 中挑一个，具体策略由硬件决定：同一个 Warp 的后续指令都就绪时可以连续几个周期被选中，遇到等待显存之类的停顿才轮到其他 Warp。没有被选中的驻留 Warp 不前进，但寄存器状态一直保留在寄存器堆中。因此驻留的 48 个 Warp 不是同时在运算。
# 第 5 至 7 帧：B2 的全部线程结束后，它占用的资源整块释放，SM 0 空出一个线程块的位置，硬件调度器把等待的 B12 分配进来。线程块之间没有执行顺序的保证。

['warp-switch.title']
src_hash = 'fcb85464'
text = 'Warp Scheduling and Latency Hiding'
# src: Warp 调度与延迟隐藏

['warp-switch.slide.1']
src_hash = '082092c5'
text = '''

- When a Warp is blocked waiting for the result of a device memory read, the scheduler immediately switches to another ready Warp. The register state of all resident threads always stays in the register file, so switching has no cost of saving and restoring a context.
'''
# src:
# 
# - 当某个 Warp 因等待显存读取结果而阻塞时，调度器立即切换执行其他就绪的 Warp。所有驻留线程的寄存器状态始终保存在寄存器堆中，切换没有上下文保存与恢复的开销。

['warp-switch.slide.2']
src_hash = '61de72ea'
text = 'Warp scheduling hides the latency of reading device memory and improves the utilization of the SM resources.'
# src:
# 
# 通过 Warp 调度，隐藏了因读取显存而导致的延迟，SM 的资源利用率得到提高。

['warp-switch.notes.1']
src_hash = 'bf824875'
text = '''

The animation shows 4 resident Warps taking turns on one SM. On the left is the SM with one Warp scheduler and 4 Warps, and the block on the right is the device memory. Each Warp first issues two instructions, the second being the load `ld` from device memory. The request is sent to the memory as an arrow, and the Warp then has to wait 8 cycles for the data to come back. The time axis on the right corresponds to the Warps on the left row by row: an orange cell is a cycle in which an instruction was issued, and a dashed cell is waiting.
Cycles 0 to 7: the scheduler picks Warps 0, 1, 2 and 3 in turn, and each Warp enters waiting after it issues its read request. While Warp 0 waits, the scheduler switches seamlessly and issues the instructions of other ready Warps.
Cycles 8 and 9: all 4 Warps are waiting, the scheduler has no instruction to issue, and the cycles stay empty. Covering 8 cycles of waiting takes 4 other Warps issuing two instructions each, and there are only 3 here, so 2 cycles are empty.
From cycle 10: the data returns in turn, and Warps 0, 1, 2 and 3 become ready again and continue to issue.
When a CPU switches threads, the operating system or the hardware has to save the register contents to memory and load the context of the target thread from memory, while a GPU reserves separate physical registers for all resident threads, so switching between Warps can be done in a single cycle at zero cost.
The more ready Warps are resident, the easier it is for the scheduler to find an executable instruction in every cycle, which effectively hides the long latency of device memory.
'''
# src:
# 
# 动画展示单个 SM 上 4 个驻留 Warp 的轮流执行。左边是 SM：一个 Warp 调度器和 4 个 Warp，右边的方块是显存。每个 Warp 先发射两条指令，第二条是读显存的 ld，请求用箭头送往显存，之后需要等待 8 个周期才能获得返回的数据。右边的时间轴与左边的 Warp 一一对应：橙色格是发射了指令的周期，虚线格是等待。
# 周期 0 至 7：调度器依次选中 Warp 0、1、2、3，每个 Warp 发出读请求后进入等待。Warp 0 在等待时，调度器无缝切换并发射其他就绪 Warp 的指令。
# 周期 8、9：4 个 Warp 都在等待，调度器没有指令可发，周期空出。8 个周期的等待需要另外 4 个 Warp 各发射两条指令才能盖住，这里只有 3 个，所以空出 2 个周期。
# 周期 10 起：数据依次返回，Warp 0、1、2、3 重新就绪并继续发射。
# CPU 在切换线程时需要通过操作系统或硬件将寄存器内容保存至内存，再从内存加载目标线程的上下文，而 GPU 为所有驻留线程预留了独立的物理寄存器，因此 Warp 之间的切换可以在单周期内完成，开销为零。
# 驻留的就绪 Warp 数量越多，调度器越容易在每个周期找到可执行的指令，从而有效掩盖显存的长访问延迟。

['divergence.title']
src_hash = '395c5c4e'
text = 'Branch Divergence'
# src: 分支分化

['divergence.slide.1']
src_hash = 'd907d18a'
text = '''
- The threads of a Warp share one instruction stream and execute the same instruction every cycle.
- When the threads take different paths at a branch, the paths are executed one after another. The threads that are off the current path are disabled and wait.
'''
# src:
# 
# - 同一 Warp 内的 32 个线程共用同一个程序计数器，在每个时钟周期执行相同的指令。
# - 当条件分支语句使同一 Warp 内的线程走向不同执行路径时，即发生**分支分化**（Branch Divergence）：硬件依次串行执行各条分支路径，当前路径之外的线程被临时屏蔽。

['divergence.slide.2']
src_hash = '0e7ffff7'
text = '- The disabled cores are idle during these cycles: both paths are executed once each, and the Warp takes twice the cycles.'
# src:
# 
# - 在分支分化期间，被屏蔽线程对应的运算单元处于空闲状态，整个 Warp 完成该条件语句所需的周期数等于各条分支路径的周期数之和。

['divergence.notes.1']
src_hash = 'd4f98d8d'
text = '''
On the left is the code of the conditional branch with its instruction addresses. Each column on the right is one instruction executed by the Warp, and each row is one thread (a solid arrow means executing, a dashed line means masked and waiting).
The instructions at lines 100 and 101 are executed by all 32 threads together. After entering the `if-else`, lines 102 and 103 are executed only by the even-numbered threads, and the odd-numbered threads are masked. Line 104 is then executed only by the odd-numbered threads, and the even-numbered threads are masked. At line 105 the branch reconverges and all threads resume synchronous execution.
If the branch condition depends only on the Warp number (for example `if ((threadIdx.x / 32) % 2 == 0)`), the 32 threads of one Warp always take the same branch and no divergence occurs.
'''
# src:
# 
# 左侧为条件分支代码及其指令地址，右侧每列对应 Warp 执行的一条指令，每行对应一个线程（实心箭头表示执行，虚线表示被屏蔽等待）。
# 第 100、101 行指令由全体 32 个线程共同执行。进入 `if-else` 后，第 102、103 行仅由偶数号线程执行，奇数号线程被屏蔽。随后第 104 行仅由奇数号线程执行，偶数号线程被屏蔽。到达第 105 行时，分支重新汇合，全体线程恢复同步执行。
# 若分支条件仅依赖 Warp 编号（例如 `if ((threadIdx.x / 32) % 2 == 0)`），则同一 Warp 内的 32 个线程始终走向同一分支，不会引发分支分化。


<text x="640.0" y="96.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">R：reg 的第 3 位　　000 + 8 = 8，即 %r8</text>
<text x="640.0" y="122.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">X：index 的第 3 位</text>
<text x="640.0" y="148.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">B：rm 的第 3 位（mod 11），或 base 的第 3 位</text>
<text x="640.0" y="184.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="bold" fill="#0e2841" text-anchor="start">两个例外只看 3 位的字段，先于 REX.B：</text>
<text x="640.0" y="208.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">rm 100 仍然带 SIB 字节；rm 101 且 mod 00 仍然是 %rip 相对</text>
<rect x="20.0" y="232.0" width="1080.0" height="84.0" rx="8" fill="#ffffff" stroke="#9fb5c3" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="36.0" y="258.0" font-family="SFMono-Regular, Menlo, DejaVu Sans Mono, Consolas, monospace" font-size="15" font-weight="normal" fill="#0e2841" text-anchor="start" xml:space="preserve">41 8d 44 24 ff   lea -0x1(%r12),%eax</text>
<text x="400.0" y="258.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#5a6b78" text-anchor="start">guest/block，地址 401135</text>
<text x="36.0" y="284.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">REX 41：B = 1　　ModRM 44 = 01 000 100：rm 100 → 读 SIB　　SIB 24 = 00 100 100：index 100 → 没有变址，base 100 + 8 = 12，即 %r12</text>
<text x="36.0" y="306.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">mod 01 → 1 字节位移 ff，符号扩展为 -1；%r12 作基址需要 SIB 字节，因为 rm 字段 100 已经另有含义</text>

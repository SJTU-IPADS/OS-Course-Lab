<text x="100.0" y="242.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#0e2841" text-anchor="start">地址 = 0x403020 + %rdx × 8；用掉 ModRM、SIB 与位移共 6 字节</text>

['kit-more.notes.1']
src_hash = '769820c7'
text = '''
A block with a ▶ button in the courseware is a real command; the page shows the output recorded in one run. When the courseware is opened with --watch, the terminal does not exit and serves as a local server; clicking ▶ runs the command on your computer, its output appears live in the panel at the bottom of the page, and the top right of the panel shows the exit status and the time taken. The file-name buttons beside a demo block open that source file on the right of the page. Some demos depend on additional programs, such as a C compiler; when one is not installed, the panel reports that the command is not found, and the page already shows the output.
--to pptx exports real text boxes and images that can be edited in PowerPoint or WPS, and needs no browser; --pdf prints with Chrome, and the first page of the PDF is a clickable outline. Both files are under ICS-PPT/build, and the terminal prints the full path.
After the courseware is updated, run git pull in the repository. When git pull reports local changes, files in the courseware directory have been modified; when these changes need not be kept, run git restore . first and then git pull. When view reports an error after an update, run the last two commands of the page "Downloading and installing the courseware" once more.
'''
# src:
# 
# 课件中带 ▶ 按钮的方块是一条真实的命令，页面上印着的是某次运行录得的输出。用 --watch 打开课件时，终端不退出，作为本机的服务器；点 ▶ 后命令在你的电脑上运行，输出实时显示在页面底部的面板中，面板右上角显示退出状态与用时。演示方块旁的文件名按钮在页面右侧打开那个源文件。有些演示依赖额外的程序，例如 C 编译器，没有安装时面板报告找不到命令，页面上已经印着输出。
# --to pptx 导出的是真实的文本框与图片，可以在 PowerPoint 或 WPS 中编辑，不需要浏览器；--pdf 用 Chrome 打印，PDF 的第一页是可以点击的大纲。两者的文件都在 ICS-PPT/build 下，终端打印完整的路径。
# 课件更新后，在仓库中运行 git pull。git pull 报告本地有修改时，说明你改动过课件目录中的文件；不需要保留这些改动时，先运行 git restore . 再 git pull。更新后 view 报错时，重新运行一次「课件的下载与安装」一页的后两条命令。


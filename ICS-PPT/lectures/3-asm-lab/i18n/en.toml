['attack-frame.notes.1']
src_hash = '036f1445'
text = '''
This section demonstrates attack1 of student ID 000000000001 (examples/attack1). Its three protections: no canary (-fno-stack-protector), an executable stack (-Wl,-z,execstack at link time) and no position-independent code (-no-pie); the part students disassemble is also compiled with -O0, so instructions and source correspond one to one.
chat_turn takes no arguments: main calls it in a loop, a return of 1 continues and a return of 0 ends. Its frame holds one local array, char prompt[304] (BUF1 = 304): sub $0x130,%rsp reserves it, lea -0x130(%rbp),%rax is its address, and mov $0x130,%esi passes 304 as the second argument to Gets.
Gets reads one line: the bytes read start at the low-address end of the buffer and go on until a newline or the end of the input, with no length check. On the pipe path 0x00 is stored as it is; the interactive path copies the line isocline read back with strcpy, likewise without a length limit.
The return address is at %rbp+8: the offset 0x130 of the lea plus the 8 bytes of the saved %rbp give 0x138 = 312. Nothing else lies between the buffer and the return address — that is what "no canary" means: the first byte past byte 312 overwrites the return address.
The build of the demonstration ID: a 304-byte buffer, the return address at +312, the key 0x27d6fbbe5c7d230b and report_pass at 0x01528000. These numbers differ per student ID: the offset and the buffer size are read from the offset of the lea, the key is the immediate of the movabs at the start of report_pass, and the address of report_pass comes from nm.
The return address is written as the address of the code in the buffer: that stack address is read with gdb (p/x $rbp-0x130) in the demonstration environment, where ASLR is off, and is 0x00007fffffffd550 on this page and in the animation. The address moves with the environment, and with ASLR on it changes on every run; the reference answer of the lab therefore takes a form that does not depend on it, which this lecture does not go into.
'''
# src:
# 
# 本节演示演示学号 000000000001 的 attack1（examples/attack1）。它的三个保护：没有金丝雀（-fno-stack-protector）、栈可执行（链接时 -Wl,-z,execstack）、不是位置无关的程序（-no-pie）；学生反汇编的这部分还用 -O0 编译，指令与源码一一对应。
# chat_turn 没有参数：main 在一个循环里调用它，返回 1 继续、返回 0 结束。它的这一帧里有一个局部数组 char prompt[304]（BUF1 = 304），sub $0x130,%rsp 为它留出位置，lea -0x130(%rbp),%rax 是它的地址，mov $0x130,%esi 把 304 作为第二个参数传给 Gets。
# Gets 读一行：读到的字节从缓冲区的低地址一端写起，一直写到换行或输入结束，不检查长度。管道路径上 0x00 照存；交互路径用 strcpy 复制 isocline 读回的一行，同样不限长度。
# 返回地址在 %rbp+8：lea 的偏移 0x130 加上保存的 %rbp 的 8 字节，是 0x138 = 312。缓冲区与返回地址之间没有别的东西——这就是「无金丝雀」的意思：写到第 312 个字节之后的第一个字节，改的就是返回地址。
# 演示学号的构建：缓冲区 304 字节、返回地址在 +312、口令 0x27d6fbbe5c7d230b、report_pass 在 0x01528000。各学号的这些数不同：偏移与缓冲区大小从 lea 的偏移读出，口令是 report_pass 开头 movabs 的立即数，report_pass 的地址由 nm 给出。
# 返回地址写成缓冲区里代码的地址：这个栈地址在关掉 ASLR 的演示环境里用 gdb 读出（p/x $rbp-0x130），本页与动画里是 0x00007fffffffd550。栈的地址随环境而变，开着 ASLR 时每次运行都不同；实验室的参考答案因此换成不依赖它的做法，本讲不展开。


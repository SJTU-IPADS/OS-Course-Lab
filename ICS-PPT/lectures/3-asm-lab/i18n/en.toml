['cpu-helpers.slide.1']
src_hash = '0e38b307'
text = 'The helpers are in `frame/x86.c`, and `include/mcpu.h` states the contract of each. They read and write registers and memory by `x.size`; a `case` writes only the semantics of the instruction.'
# src:
# 
# 辅助函数在 `frame/x86.c` 中，`include/mcpu.h` 有每个函数的约定。它们按 `x.size` 读写寄存器与内存，`case` 只写指令的语义。

['cpu-helpers.notes.1']
src_hash = '3c4ba244'
text = '''
Top left are the functions that read the rest of the instruction, each advancing R[RIP]: fetch8, fetch16, fetch32 and fetch64 read a fixed number of bytes, fetch_imm reads an immediate of the operand size and sign-extends it, modrm reads the operand bytes and fills x.reg, x.sub and x.rm.
Top right are the registers and flags: get and set read and write register n by x.size; R[RSP], R[RIP] and R[RFLAGS] are read and written directly; x86_alu dispatches the operation number 0 to 7 to the functions of alu.c and sets the flags.
Bottom left is the rm operand: when rm is a register, rm_get and rm_set use get and set; when it is memory, they read or write x.size bytes at ea; load and store read or write n bytes at any address, and record the page fault and return failure when one occurs.
Bottom right are the vector registers: rm_vget and rm_vset read and write n bytes of vector rm, vset writes a vector register, clearing the high bits when writing a register; Y[x.v] is the first source operand of VEX.
'''
# src:
# 
# 左上是读指令其余字节的函数，每个都让 R[RIP] 前进：fetch8、fetch16、fetch32、fetch64 读定长的字节，fetch_imm 按操作数宽度读立即数并符号扩展，modrm 读操作数字节并填 x.reg、x.sub、x.rm。
# 右上是寄存器与标志位：get 与 set 按 x.size 读写编号为 n 的寄存器；R[RSP]、R[RIP]、R[RFLAGS] 直接读写；x86_alu 把运算编号 0 到 7 分派到 alu.c 的函数并设置标志位。
# 左下是 rm 操作数：rm 是寄存器时 rm_get 与 rm_set 用 get 与 set，是内存时在 ea 处读写 x.size 字节；load 与 store 读写任意地址的 n 字节，缺页时记录并返回失败。
# 右下是向量寄存器：rm_vget 与 rm_vset 读写向量 rm 的 n 字节，vset 写一个向量寄存器，写寄存器时高位清零；Y[x.v] 是 VEX 的第一个源操作数。


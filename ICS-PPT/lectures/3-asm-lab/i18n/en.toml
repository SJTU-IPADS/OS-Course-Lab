['cpu-loop.notes.1']
src_hash = '0b7079c7'
text = '''
One pass of the loop executes one instruction. x86_begin fetches bytes at R[RIP], skips the prefixes, records REX and the operand size, reads the opcode and returns its number op; R[RIP] now points at the first byte after the opcode.
switch enters one case by op: the case reads the bytes after the opcode, computes, and writes registers and memory.
x86_end counts the instruction and writes the commit log; when the instruction faults midway (a page fault, an illegal instruction), it restores the registers to their values before the instruction, returns -1, and the loop ends with a report.
case 0x89 is one form of mov, rm = reg: modrm parses the operands first, then the value of register reg is written to rm.
'''
# src:
# 
# 一次循环执行一条指令。x86_begin 从 R[RIP] 取字节，跳过前缀，记下 REX 与操作数宽度，读出操作码并返回它的编号 op；此时 R[RIP] 指向操作码之后的第一个字节。
# switch 按 op 进入一个 case：case 读操作码之后的字节，计算，写寄存器与内存。
# x86_end 计数并写提交日志；指令中途出错（缺页、非法指令）时它把寄存器恢复到指令开始前的值，返回 -1，循环结束并打印报告。
# case 0x89 是 mov 的一种形式，rm = reg：先 modrm 解析操作数，再把 reg 寄存器的值写到 rm。


Bottom right: after a wrong line, the explosion screen is shown in the middle of the window, phase 1 exploded, then the program exits with status 1. Running bomb again starts from phase 1 and the defused phases must be entered again, so the derived lines are kept in an answer file, one line per phase: ./bomb answers.txt first reads the lines of the file in order, skipping empty lines, and reads from the keyboard once the file is used up.
bomb reports both outcomes to the server: a defused phase is recorded under the student ID, and so is every explosion, each one counted.

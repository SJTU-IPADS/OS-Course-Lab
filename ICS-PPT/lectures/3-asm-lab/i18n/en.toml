['cpu-alu-flags.title']
src_hash = '1858aaac'
text = 'alu.c: ten functions and five flags'
# src: alu.c：十个函数与五个标志位

['cpu-alu-flags.slide.1']
src_hash = '076af282'
text = 'Each function returns a result of `size` bytes and changes only these five bits of `*f`. `x86_add` is the written example; `x86_sub` and `x86_logic` follow it, and `inc`, `dec` and `neg` can be composed from them.'
# src:
# 
# 每个函数返回 `size` 字节的结果，只改 `*f` 的这五位。`x86_add` 是写出的例子，`x86_sub` 与 `x86_logic` 照它写，`inc`、`dec`、`neg` 可以由它们组合。

['cpu-alu-flags.notes.1']
src_hash = '363da1ee'
text = '''
The functions of alu.c do arithmetic and flags only; they read no instruction and access no memory, so mini-unit can check them on their own.
x86_szp sets ZF, SF and PF from the result and the other functions all call it: ZF is the low size bytes being 0, SF the top bit of the result, PF an even number of 1 bits in the low 8 bits.
x86_add is already written and is the model for CF and OF; CF of x86_sub is the borrow, and its OF is a and b of opposite signs with a result of the sign opposite to a; x86_logic clears CF and OF.
x86_inc is already written: it calls x86_add but keeps CF; x86_dec and x86_neg are obtained from x86_sub the same way.
In x86_shift, shl is written and shr and sar are to be written; x86_mul is to be written, x86_div is written.
There are two callers: x86_alu dispatches the operation numbers 0 to 7 to the first four functions; the other six are called by x86_other of the frame, which fetches the operands of inc, dec, neg, the shifts and the multiplications and divisions, and writes the result back.
'''
# src:
# 
# alu.c 的函数只做算术与标志位，不读指令、不访问内存，所以 mini-unit 可以单独检查它们。
# x86_szp 由结果设置 ZF、SF、PF，其余函数都调用它：ZF 是低 size 字节为 0，SF 是结果的最高位，PF 是低 8 位中 1 的个数为偶数。
# x86_add 已经写出，是 CF 与 OF 的样板；x86_sub 的 CF 是借位，OF 是 a 与 b 异号且结果与 a 异号；x86_logic 清零 CF 与 OF。
# x86_inc 已经写出：调用 x86_add 但保留 CF；x86_dec 与 x86_neg 同样由 x86_sub 得到。
# x86_shift 中 shl 已经写出，shr 与 sar 要写；x86_mul 要写，x86_div 已经写出。
# 调用者有两个：x86_alu 把运算编号 0 到 7 分派到前四个函数；其余六个由框架的 x86_other 调用，它取出 inc、dec、neg、移位、乘除法的操作数并写回结果。

['cpu-shift.title']
src_hash = 'd1d7c5a1'
text = 'Shifts, multiplication and division'
# src: 移位、乘法与除法

['cpu-shift.slide.1']
src_hash = 'bbbcc406'
text = 'The **CF** of a shift is the last bit shifted out; `shr` and `sar` differ in whether the top is filled with 0 or with the sign bit. `x86_mul` splits the product of 2 × `size` bytes into `*hi` and `*lo`; CF and OF are 1 when the product exceeds `size` bytes.'
# src:
# 
# 移位的 **CF** 是最后移出的那一位；`shr` 与 `sar` 的差别是高位补 0 还是补符号位。`x86_mul` 把 2 × `size` 字节的乘积分成 `*hi` 与 `*lo`，乘积超出 `size` 字节时 CF 与 OF 为 1。

['cpu-shift.notes.1']
src_hash = 'f4450481'
text = '''
The sub of x86_shift is the reg field of ModRM: 4 is shl, 5 shr, 6 sal, the same as shl, 7 sar.
The count takes its low 5 bits first, the low 6 bits when size is 8; with a count of 0 the flags do not change.
The three rows all shift by 1: shl 0x81 gives 0x02, the top bit 1 shifted out goes into CF, OF is the top bit of the result differing from CF; shr 0x81 gives 0x40, the bottom bit 1 shifted out goes into CF, OF is the top bit of v; sar 0x81 gives 0xc0, the top is filled with the sign bit, OF is 0.
mul of x86_mul is unsigned and imul signed; the product of 2 × size bytes is split into hi and lo, with __int128 when size is 8; CF and OF both mean the product exceeds size bytes. x86_div is already written: it returns -1 for a zero divisor or a quotient that does not fit, and the frame reports a divide error.
'''
# src:
# 
# x86_shift 的 sub 是 ModRM 的 reg 字段：4 是 shl，5 是 shr，6 是 sal 同 shl，7 是 sar。
# 位数先取低 5 位，size 为 8 时取低 6 位；位数为 0 时标志位不变。
# 三行都移动 1 位：shl 0x81 得 0x02，移出的最高位 1 进 CF，OF 是结果最高位与 CF 不同；shr 0x81 得 0x40，移出的最低位 1 进 CF，OF 是 v 的最高位；sar 0x81 得 0xc0，高位补符号位，OF 为 0。
# x86_mul 的 mul 无符号、imul 有符号，乘积 2 × size 字节分成 hi 与 lo，size 为 8 时用 __int128；CF 与 OF 都表示乘积超出 size 字节。x86_div 已经写出，除数为 0 或商放不下时返回 -1，框架报告 divide error。

['cpu-insn-groups.title']
src_hash = '232a75d5'
text = 'The integer instructions of interp.c: five groups by the bytes after the opcode'
# src: interp.c 的整数指令：按操作码之后的字节分五组

['cpu-insn-groups.slide.1']
src_hash = '19f252c7'
text = 'The comment at the head of [`interp.c`](file:/lectures/mini-cpu/src/lab1/interp.c) lists every opcode and its semantics by these five groups; in parentheses is the first guest program that uses it. A `case` reads only the bytes of its own group.'
# src:
# 
# [`interp.c`](file:/lectures/mini-cpu/src/lab1/interp.c) 开头的注释按这五组列出每个操作码的语义，括号中是第一个用到它的客户机程序。

['cpu-insn-groups.notes.1']
src_hash = '7c4acf4a'
text = '''
Opcode only: push, pop, ret. push is written; pop and ret follow it, the register number is in the low 3 bits of the opcode plus REX.B.
Operand bytes: the two forms of mov, lea, the two forms of the eight operations, test. For rm = rm OP reg, the eight opcodes 01, 09, 11, 19, 21, 29, 31 and 39 have the operation number op >> 3; for reg = reg OP rm the eight are 03, 0b to 3b.
Operand bytes then an immediate: c7 is mov; 81 and 83 are written, the operation number is in x.sub.
An immediate: b8 to bf are mov to a register; the immediate is 8 bytes when x.size is 8.
A jump offset: call e8, jmp eb and e9, jcc 70 to 7f and 180 to 18f; once the offset is read, R[RIP] is the next instruction, and rel is added to it.
Write one instruction of each group; the others of the group only change the operation or the width.
'''
# src:
# 
# 只有操作码：push、pop、ret。push 已经写出，pop 与 ret 照它写，寄存器编号在操作码的低 3 位加 REX.B。
# 操作数字节：mov 的两种形式、lea、八种运算的两种形式、test。rm = rm OP reg 的八个操作码01、09、11、19、21、29、31、39 的运算编号是 op >> 3；reg = reg OP rm 的八个是 03、0b 到 3b。
# 操作数字节加立即数：c7 是 mov，81 与 83 已经写出，运算编号在 x.sub。
# 立即数：b8 到 bf 是 mov 到寄存器，x.size 为 8 时立即数 8 字节。
# 跳转的偏移：call e8、jmp eb 与 e9、jcc 70 到 7f 与 180 到 18f；偏移读完后 R[RIP] 是下一条指令，加上 rel。
# 每组写好一条，同组的其余指令只换运算或宽度。

['cpu-cond-jump.title']
src_hash = '8693616e'
text = 'cond and conditional jumps'
# src: cond 与条件跳转

['cpu-cond-jump.slide.1']
src_hash = '34d412c5'
text = '`cond(f, cc)` reads the five flags of `f` and returns 1 or 0 by the low 4 bits of the condition code `cc`; the table of the 16 condition codes is in the comment of [`interp.c`](file:/lectures/mini-cpu/src/lab1/interp.c). The `case` of `jcc` reads the offset first, and `R[RIP] += rel` when `cond` is 1.'
# src:
# 
# `cond(f, cc)` 读 `f` 的五个标志位，按条件码 `cc` 的低 4 位返回 1 或 0；16 个条件码的表在 [`interp.c`](file:/lectures/mini-cpu/src/lab1/interp.c) 的注释中。`jcc` 的 `case` 先读偏移，`cond` 为 1 时 `R[RIP] += rel`。

['cpu-cond-jump.notes.1']
src_hash = 'f26fea86'
text = '''
The condition code is the low 4 bits of the opcode, and the case of jcc passes op to cond directly.
e is ZF, ne is !ZF, l is SF != OF, ge is SF == OF; the other 12 are in the head comment of interp.c and in mcpu.h.
The example is the jge of sum: the condition code d of the opcode 7d is ge, the offset f4 is -12.
Once the offset is read, R[RIP] is 40112c; adding -12 gives 401120, the top of the loop.
x86_other of the frame also calls cond for cmovcc and setcc, so the conditions item of the grading checks all three kinds of instruction at once.
'''
# src:
# 
# 条件码是操作码的低 4 位，jcc 的 case 直接把 op 传给 cond。
# e 是 ZF，ne 是 !ZF，l 是 SF != OF，ge 是 SF == OF；其余 12 个在 interp.c 开头的注释与 mcpu.h 中。
# 例子是 sum 的 jge：操作码 7d 的条件码 d 是 ge，偏移 f4 是 -12。
# 偏移读完后 R[RIP] 是 40112c，加 -12 得 401120，循环的开头。
# 框架的 x86_other 处理 cmovcc 与 setcc 时也调用 cond，所以评测的 conditions 一项同时检查三种指令。

['cpu-vector.title']
src_hash = '130ff0d6'
text = 'Vector instructions: the VEX prefix and the lanes of Y[]'
# src: 向量指令：VEX 前缀与 Y[] 的通道

['cpu-vector.slide.1']
src_hash = '8484f827'
text = '`x86_begin` reads the third operand `x.v` and the width `x.vlen` from the VEX prefix; the `case` computes lane by lane into a local `u256`, and the last step `vset` writes the destination register.'
# src:
# 
# `x86_begin` 从 VEX 前缀读出第三个操作数 `x.v` 与宽度 `x.vlen`；`case` 逐通道算到局部的 `u256`，最后一步 `vset` 写目标寄存器。

['cpu-vector.notes.1']
src_hash = 'e0d46749'
text = '''
The five vector instructions to write are vpxor, vmovdqu, vpaddd, vpmulld and vmovd; vphaddd and vextracti128 are written.
The VEX prefix adds a register operand vvvv, which x86_begin records in x.v; the L bit chooses ymm or xmm, and x.vlen is 32 or 16.
Integer lanes are 32 bits: d[i] of u256, vlen / 4 lanes.
The case of vpaddd: modrm parses rm, rm_vget reads the second source, it is added lane by lane to Y[x.v] into the local r, and vset writes x.reg.
The destination register is also a source, so the result is computed into a local variable and written out in the last step; vset clears the high 128 bits when writing xmm.
The rm of vmovdqu may be memory; the destination of vmovd is rm, written with rm_set, 4 bytes.
'''
# src:
# 
# 五条要写的向量指令是 vpxor、vmovdqu、vpaddd、vpmulld、vmovd，vphaddd 与 vextracti128 已经写出。
# VEX 前缀多出一个寄存器操作数 vvvv，x86_begin 记在 x.v 中；L 位决定 ymm 还是 xmm，x.vlen 是 32 或 16。
# 整数通道是 32 位：u256 的 d[i]，vlen / 4 个通道。
# vpaddd 的 case：modrm 解析 rm，rm_vget 读第二个源，与 Y[x.v] 逐通道相加到局部的 r，vset 写 x.reg。
# 目标寄存器同时是源，所以先算到局部变量，最后一步才写出；写 xmm 时 vset 清零高 128 位。
# vmovdqu 的 rm 可以是内存；vmovd 的目标是 rm，用 rm_set 写 4 字节。

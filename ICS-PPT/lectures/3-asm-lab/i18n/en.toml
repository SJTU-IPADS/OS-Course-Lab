['nq-rest-q4-1.notes.1']
src_hash = '370a732a'
text = '''
Q4_1 differs from Q4_0 by one more fp16 m stored in the block, 20 bytes in all, 5.00 bits per weight. lo and hi are the smallest and the largest weight of the block, d = (hi − lo) / 15, id = d ≠ 0 ? 1/d : 0, m = lo; the code q[i] = min(15, (int)((x[i] − lo) · id + 0.5)) uses the float d and lo before rounding to fp16; the restored value x[i] = d · q[i] + m, with d and m read back from the block. (x[i] − lo) · id is not below 0, so the truncation of (int) equals rounding down, written ⌊ ⌋ on the page. Bytes: blk[0..1] = d, blk[2..3] = m, blk[4 + j] = q[j] | q[j + 16] << 4.
The figure uses the same six weights: lo = −0.40, hi = 1.40, d = 0.12; the grid points d·q + m run from lo to hi, all 16 inside the data range, as in the m ≠ 0 exercise of lecture 2; the codes are 0, 3, 6, 8, 11, 15.
An all-equal block: hi = lo, d = 0, id = 0, every code is 0, every restored value is m.
Check: ./nq-selftest q4_1, two lines q4_1_back and q4_1_bytes, each matches.
'''
# src:
# 
# Q4_1 与 Q4_0 的差别是块里多存一个 fp16 的 m，共 20 字节、5.00 位/权重。lo 与 hi 是块中最小与最大的权重，d = (hi − lo) / 15，id = d ≠ 0 ? 1/d : 0，m = lo；编码 q[i] = min(15, (int)((x[i] − lo) · id + 0.5))，用舍入到 fp16 之前的 float d 与 lo；还原 x[i] = d · q[i] + m，d 与 m 从块中读回。(x[i] − lo) · id 不小于 0，(int) 的截断与向下取整相同，页面上写作 ⌊ ⌋。字节：blk[0..1] = d，blk[2..3] = m，blk[4 + j] = q[j] | q[j + 16] << 4。
# 图用同一组六个权重：lo = −0.40，hi = 1.40，d = 0.12，格点 d·q + m 从 lo 到 hi，16 个全部在数据范围内，与第二讲 m ≠ 0 的练习相同；编码依次为 0、3、6、8、11、15。
# 全相等的块：hi = lo，d = 0，id = 0，每个编码都是 0，还原值都是 m。
# 检查：./nq-selftest q4_1，两行 q4_1_back、q4_1_bytes 各 matches。


['five-labs.notes.1']
src_hash = '99dab1c7'
text = '''
This lecture first explains how to download, install and use the courseware, then explains five labs, one part per lab. The first four labs are after-class exercises and are not scored; every step has a checking program, and output equal to the expected values shows that the step is correct. mini-cpu lab 1 is scored, with a maximum of 100 points.
nano-quant accompanies lecture 2, "Representing data": impl/nano_quant.cpp implements the functions that read bytes and the encoding and decoding of three 4-bit formats; the framework quantizes the language model of Qwen3-VL-2B-Instruct, assembles it into a GGUF file, and ollama loads and runs it.
bomb-lab accompanies lecture 3: each student ID has its own bomb without source code, and the input of each of the 8 phases is derived from its machine code. bomb connects to the course server while it runs; every explosion and every defused phase is recorded under the student ID, and ./bomb -s shows the scoreboard.
attack-elf accompanies lecture 3 as well: it is likewise a program without source code, one build per student ID; you read its machine code and craft one line of input that makes the program call report_pass, a pass function that nothing calls. The three phases wear different protections, and this lecture demonstrates breaking phase 1.
parallel-dot accompanies the two speed-up solutions of part five of lecture 3. Both parts write the same operator, the product of a Q4_0 matrix and a vector: part 1 writes the function matvec_q4_0 with AVX2, part 2 writes its CUDA kernel; without an NVIDIA GPU, make remote submits to the course server. The mini-ollama that both parts run reads q4_0.gguf, which is downloaded from the SJTU cloud drive or produced by nano-quant with the q4_0 recipe.
mini-cpu lab 1 accompanies lecture 3: an x86-64 instruction interpreter is completed in three files, make check gives the score, and the lab1.zip produced by make handin is submitted on the Canvas platform.
For all five labs, programming the old way is encouraged — write the code by hand yourself; discussion with classmates is encouraged, and so is discussion with AI.
'''
# src:
# 
# 本讲先说明课件的下载、安装与使用，再说明五个实验，每个实验一部分。前四个实验是课后练习，不计分，每一步都有检查程序，输出与期望值一致就说明这一步正确；mini-cpu 实验一计分，满分 100 分。
# nano-quant 配合第二讲「数据的表示」：在 impl/nano_quant.cpp 中实现读字节的函数与三种 4 位格式的编解码，框架把 Qwen3-VL-2B-Instruct 的语言模型量化后组装为 GGUF，由 ollama 加载运行。
# bomb-lab 配合第三讲：每个学号一个没有源码的 bomb，阅读它的机器码推出 8 个阶段的输入；bomb 运行时连接课程服务器，每一次爆炸与每一个被拆除的阶段都记在学号下，./bomb -s 显示计分板。
# attack-elf 也配合第三讲：同样是没有源码的程序，每个学号一个构建，读它的机器码构造一行输入，让程序自己调用没有调用点的过关函数 report_pass；三个阶段戴不同的防护，本讲演示第一阶段的攻破。
# parallel-dot 配合第三讲第五部分的两个提速方案，两部分写同一个算子，即 Q4_0 矩阵与向量的乘积：第一部分用 AVX2 写函数 matvec_q4_0，第二部分写它的 CUDA kernel；没有 NVIDIA 显卡时用 make remote 提交到课程服务器。两部分运行的 mini-ollama 读取 q4_0.gguf，这个文件从交大云盘下载，或由 nano-quant 按 q4_0 配方生成。
# mini-cpu 实验一配合第三讲：在三个文件中完成 x86-64 指令解释器，make check 给出得分，make handin 生成的 lab1.zip 提交到 Canvas 平台。
# 做这五个实验时，鼓励「古法编程」，即代码由自己动手写出；鼓励同学之间讨论，也鼓励与 AI 讨论。


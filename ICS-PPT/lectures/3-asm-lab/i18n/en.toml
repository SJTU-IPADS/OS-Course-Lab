# 两个函数的原型在 include/nano_quant.h 中，头文件保持不变。q4_0_quantize 的 x 指向一块的 32 个 float（128 字节），blk 指向这一块输出的 18 个字节；q4_0_dequantize 反过来，blk 指向 18 个字节，x 指向写回的 32 个 float。

['cpu-modrm-byte.title']
src_hash = 'd850d733'
text = 'The ModRM byte: mod, reg and rm'
# src: ModRM 字节：mod、reg、rm

['cpu-modrm-byte.slide.1']
src_hash = '2960eced'
text = 'The first byte after the opcode. **mod** says whether the other operand is a register or memory, **reg** is a register number or an extension of the opcode, and **rm** is a register number or the number of the base register.'
# src:
# 
# 操作码之后的第一个字节。**mod** 说明另一个操作数是寄存器还是内存，**reg** 是寄存器编号或扩展的操作码，**rm** 是寄存器编号或基址寄存器的编号。

['cpu-modrm-byte.notes.1']
src_hash = 'e35767aa'
text = '''
ModRM has three fields: the high 2 bits mod, the middle 3 bits reg, the low 3 bits rm.
With mod 11, rm is a register; with 00, 01 and 10 the other operand is in memory, and mod also decides the width of the displacement: 0, 1 or 4 bytes.
reg is the number of the register operand; the group instructions such as 0x81 and 0x83 have no register operand, and the reg field extends the opcode, called sub in modrm_t.
For a memory operand rm is the number of the base register, with two exceptions: rm 100 means a SIB byte follows, and rm 101 with mod 00 means no base, a 4-byte displacement follows, and the address is relative to the next instruction.
The example is the first instruction of hello: 3c is 00 111 100, a memory operand without displacement, reg is %rdi, rm 100 reads the SIB byte 24.
The opcode 8b makes reg the destination, so %rdi = the 8 bytes in memory.
'''
# src:
# 
# ModRM 分三个字段：高 2 位 mod，中间 3 位 reg，低 3 位 rm。
# mod 为 11 时 rm 是寄存器；00、01、10 时另一个操作数在内存中，mod 同时决定位移的宽度：0、1、4 字节。
# reg 是寄存器操作数的编号；0x81、0x83 这类组指令没有寄存器操作数，reg 字段扩展操作码，modrm_t 中叫 sub。
# rm 在内存操作数的情况下是基址寄存器的编号，有两个例外：rm 100 表示随后有 SIB 字节，rm 101 且 mod 00 表示没有基址，随后 4 字节位移，地址相对于下一条指令。
# 例子是 hello 的第一条指令：3c 是 00 111 100，内存操作数，没有位移，reg 是 %rdi，rm 100 读 SIB 字节 24。
# 操作码 8b 规定 reg 是目标，所以 %rdi = 内存中的 8 字节。

['cpu-sib-byte.title']
src_hash = '8581c038'
text = 'The SIB byte: scale, index and base'
# src: SIB 字节：scale、index、base

['cpu-sib-byte.slide.1']
src_hash = '2fdc5bfd'
text = 'With rm 100 the SIB byte follows ModRM: address = displacement + base + index × scale. An **index** of 4 means no index register; a **base** field of 101 with mod 00 means no base, and a 4-byte displacement follows.'
# src:
# 
# rm 为 100 时 ModRM 之后是 SIB 字节：地址 = 位移 + base + index × scale。**index** 得到 4 表示没有变址；**base** 字段为 101 且 mod 为 00 表示没有基址，随后 4 字节位移。

['cpu-sib-byte.notes.1']
src_hash = '8a88740f'
text = '''
The three fields of SIB are 2, 3 and 3 bits like ModRM: the two bits of scale are the logarithm of the factor, index and base are register numbers.
An index equal to 4 after REX.X is added means no index register, since %rsp cannot be an index; scale is then recorded as 1.
A base field of 101 with mod 00 means no base and a 4-byte displacement follows; the instruction of matmul has this form: address = 0x403020 + %rdx × 8.
(%rsp) of hello is the other common form: %rsp as a base must go through SIB; SIB 24 is 00 100 100, no index, base %rsp.
'''
# src:
# 
# SIB 的三个字段与 ModRM 同样分 2、3、3 位：scale 两位是比例因子的对数，index 与 base 是寄存器编号。
# index 加上 REX.X 之后等于 4 表示没有变址寄存器，因为 %rsp 不能作变址；此时 scale 记为 1。
# base 字段 101 且 mod 00 表示没有基址，随后 4 字节位移，matmul 的这条指令就是这种形式：
# 地址 = 0x403020 + %rdx × 8。
# hello 的 (%rsp) 是另一种常见形式：%rsp 作基址必须经过 SIB，SIB 24 是 00 100 100，没有变址，base 是 %rsp。

['cpu-rex.title']
src_hash = '49b88b8e'
text = 'The REX prefix adds a 4th bit to three fields'
# src: REX 前缀给三个字段加第 4 位

['cpu-rex.slide.1']
src_hash = '3102cf53'
text = '`x86_begin` records REX in `x.rex`, and the parameter `rex` of `modrm_decode` is that value. The two exceptions look at the 3-bit field only; the test comes before REX.B is added.'
# src:
# 
# `x86_begin` 把 REX 记在 `x.rex` 中，`modrm_decode` 的参数 `rex` 就是它。两个例外只看 3 位的字段，判断在加 REX.B 之前。

['cpu-rex.notes.1']
src_hash = '780e03eb'
text = '''
The REX prefix is 0100 W R X B: W set means a 64-bit operand; R, X and B each add a 4th bit to one field, R to reg, X to index, B to rm (with mod 11) or base. Bits 2, 1 and 0 of rex are R, X and B.
The two exceptions look at the 3-bit field only: rm 100 plus REX.B is %r12, which as a base still goes through SIB; rm 101 with mod 00 plus REX.B is still %rip-relative. index is the opposite: it is tested for 4 after REX.X is added, and %r12 can be an index.
lea -0x1(%r12),%eax of block is the example of %r12 as a base: B of REX 41 is 1, rm 100 of ModRM 44 reads SIB 24, base 100 plus 8 gives 12.
'''
# src:
# 
# REX 前缀是 0100 W R X B：W 为 1 时操作数 64 位；R、X、B 各给一个字段加第 4 位，R 给 reg，X 给 index，B 给 rm（mod 11 时）或 base。rex 的位 2、1、0 依次是 R、X、B。
# 两个例外只看 3 位的字段：rm 100 加上 REX.B 是 %r12，它作基址仍然经过 SIB；rm 101 且 mod 00 加上 REX.B 仍然是 %rip 相对。index 相反，在加 REX.X 之后判断是否为 4，%r12 可以作变址。
# block 的 lea -0x1(%r12),%eax 是 %r12 作基址的例子：REX 41 的 B 为 1，ModRM 44 的 rm 100 读 SIB 24，base 100 加 8 得 12。

['cpu-modrm-flow.title']
src_hash = '4b57df6c'
text = 'The order of decisions in modrm_decode'
# src: modrm_decode 的判断顺序

['cpu-modrm-flow.slide.1']
src_hash = 'a6cc3fc7'
text = '`unsigned modrm_decode(const uint8_t *p, unsigned n, uint8_t rex, modrm_t *m)`: `p` points at the ModRM byte, `n` is the number of bytes that may be read, `rex` is the prefix (0 when there is none), and the result goes into `*m`.'
# src:
# 
# `unsigned modrm_decode(const uint8_t *p, unsigned n, uint8_t rex, modrm_t *m)`：`p` 指向 ModRM 字节，`n` 是可读的字节数，`rex` 是前缀（没有时为 0），结果填入 `*m`。

['cpu-modrm-flow.notes.1']
src_hash = 'e05966ba'
text = '''
Frame 1: read the ModRM byte, split out mod, sub and reg, add REX.R to reg. With mod 11, rm is a register, the other fields take their absent values, and the function returns 1.
Frame 2: a memory operand. With rm field 100, read the SIB byte and split out scale, index and base; an index equal to 4 after REX.X means no index, a base field of 101 with mod 00 means no base.
With an rm field other than 100, rm 101 with mod 00 is rip-relative; otherwise base = the rm field plus REX.B.
Frame 3: the width of the displacement is decided by mod; mod 00 has no displacement, except in the two cases without a base, which have 4 bytes; the displacement is read little-endian and sign-extended to 64 bits. Return the number of bytes used, 1 to 6; before reading each byte check that it is within the n bytes, otherwise return 0.
In class, modrm_decode is written from this figure; the body goes into modrm.c, and the table of examples in the head comment is part of the check cases.
'''
# src:
# 
# 第一帧：读 ModRM 字节，拆出 mod、sub 与 reg，reg 加 REX.R。mod 为 11 时 rm 是寄存器，其余字段取没有的值，返回 1。
# 第二帧：内存操作数。rm 字段为 100 时读 SIB 字节，拆出 scale、index 与 base，index 加 REX.X 后等于 4 表示没有变址，base 字段 101 且 mod 00 表示没有基址。
# rm 字段不是 100 时，rm 101 且 mod 00 是 rip 相对，其余 base = rm 字段加 REX.B。
# 第三帧：位移的宽度由 mod 决定，mod 00 没有位移，没有基址的两种情况例外，4 字节；位移按小端读出并符号扩展到 64 位。返回用掉的字节数，1 到 6；读每个字节之前检查它在 n 个字节之内，否则返回 0。
# 课上照这张图写 modrm_decode；函数体写在 modrm.c 中，开头注释的例子表就是检查用例的一部分。

['cpu-modrm-out.title']
src_hash = 'f6771638'
text = 'The fields of modrm_t and how the interpreter uses them'
# src: modrm_t 的字段与解释器对它的使用

['cpu-modrm-out.slide.1']
src_hash = '0a90dff8'
text = '`modrm_decode` only reads bytes and fills fields, without touching the registers; `modrm()` in `frame/x86.c` computes `x.addr` from these fields, and a `case` takes its operands with `get`, `rm_get` and `ea`.'
# src:
# 
# `modrm_decode` 只读字节、填字段，不访问寄存器；`frame/x86.c` 的 `modrm()` 由这些字段算出 `x.addr`，`case` 中用 `get`、`rm_get` 与 `ea` 取操作数。

['cpu-modrm-out.notes.1']
src_hash = '34621f16'
text = '''
modrm_t has ten fields, all filled by modrm_decode: mod, sub, reg, rm, base, index, scale, rip, dsize and disp.
An absent register is recorded as -1 and scale as 1 when there is no index, so that the address formula of modrm() holds for every form: x.addr = disp + R[base] + R[index] * scale, with the absent terms left out.
With rip set, ea adds R[RIP], which by then points at the next instruction, so an immediate must be read before ea.
The same modrm_decode is also called by the disassembler frame/translate.c (./mini-cpu --disasm); the disassembler gives it the bytes of the instruction only, so the function must not read the machine state.
'''
# src:
# 
# modrm_t 有十个字段，全部由 modrm_decode 填写：mod、sub、reg、rm、base、index、scale、rip、dsize、disp。
# 没有的寄存器记 -1，没有变址时 scale 记 1，这样 modrm() 的地址公式对每种形式都成立：
# x.addr = disp + R[base] + R[index] * scale，没有的项不加。
# rip 为 1 时 ea 再把 R[RIP] 加上去，此时 R[RIP] 已经指向下一条指令，所以立即数要在 ea 之前读完。
# 同一个 modrm_decode 还被反汇编器 frame/translate.c 调用（./mini-cpu --disasm），反汇编器只给它指令的字节，因此函数里不能读机器状态。


['attack-get.notes.1']
src_hash = 'a0a509cb'
text = '''
The lab directory contains no source code: Makefile, README.md, tools/ and an empty answers/. make attack ID=... asks the course server for the three programs of your student ID; the Makefile gives an equivalent one-line curl or wget command, to fetch them by hand when there is no network.
The student ID is used only to compute the constants: tools/pick.c hashes the ID with SHA-256, takes the first 8 bytes of the hash as the key (replacing 0x0a with 0x0b), and uses the following bytes to compute the sizes of the three buffers (between 256 and 496, a multiple of 16) and the address of the segment that holds the pass function. The same ID always yields the same constants and the same programs; another ID changes the key, the buffer sizes and the addresses.
The model q4_0.gguf is about 929 MiB, the same file the nano-quant lab produces. It takes no part in the attack, but the program loads it at startup, so it must be in the current directory; a symbolic link will do.
make localN turns the hexadecimal in answers/attackN.txt into bytes, feeds them to ./attackN and checks that the output contains phase N passed; make remoteN sends the same answer to the server for checking and scoring; make score prints the scoreboard. The three commands are implemented in tools/: unhex.c, submit.py and the Makefile, all of them readable.
The answer is written in answers/attackN.txt: a line is hexadecimal bytes followed by a comment after #; unhex ignores comments and whitespace and writes the bytes to the standard input of the program.
'''
# src:
# 
# 实验材料的目录中没有源码：Makefile、README.md、tools/ 与空的 answers/。make attack ID=… 向课程服务器要回本学号的三个程序；Makefile 里给出一行等价的 curl 或 wget 命令，没有网络时按它手动取回。
# 学号只用来算常数：tools/pick.c 对学号做 SHA-256，取散列的前 8 个字节做口令（遇到 0x0a 换成 0x0b），用后续的字节算出三个缓冲区的大小（256 到 496 之间，16 的倍数）与过关函数所在段的地址。同一学号每次算出的常数相同，领回来的程序每次相同；换学号则口令、缓冲区大小与地址都变。
# 模型 q4_0.gguf 约 929 MiB，与 nano-quant 实验生成的是同一个文件。它不参与攻击，但程序启动时会装入它，所以当前目录中要有它，链接也可以。
# make localN 把 answers/attackN.txt 里的十六进制转成字节喂给 ./attackN，再检查输出里有 phase N passed；make remoteN 把同一份答案发到服务器复核并记分；make score 打印计分榜。三个命令的实现在 tools/ 中：unhex.c、submit.py 与 Makefile，都可以读。
# 答案写在 answers/attackN.txt 中：一行是十六进制字节与 # 之后的注释；unhex 忽略注释与空白，写出的字节从标准输入喂给程序。


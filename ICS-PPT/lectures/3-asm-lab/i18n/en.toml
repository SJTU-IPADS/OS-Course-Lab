src_hash = '51d9db9e'
text = 'The main loop: read, decode, execute, again and again'
# src: 主循环：不断读取、解析、执行

['cpu-loop.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['cpu-loop.slide.1']
src_hash = '587b62a5'
text = '`x86_begin` reads up to and including the opcode; the bytes after it are read by the `case`, and the opcode and ModRM decide how many.'
# src:
# 
# `x86_begin` 读到操作码为止，其后的字节由 `case` 读取，读多少由操作码与 ModRM 决定。

['cpu-loop.notes.1']
src_hash = '2777e1bb'
text = '''
One pass of the loop executes one instruction. x86_begin fetches bytes at R[RIP], skips the prefixes, records REX and the operand size, reads the opcode and returns its number op; R[RIP] now points at the first byte after the opcode.
switch enters one case by op: the case reads the bytes after the opcode, computes, and writes registers and memory. An opcode without a case goes to default and is executed by x86_other of the framework. The opcode 0f 05 of syscall has no case: x86_other hands it to sys_dispatch of frame/sysbase.c, which carries out the system call by R[RAX] on the guest's behalf (write calls the host libc's write; exit sets c->halted to 1, after which x86_end returns -1), so interp.c needs no case for syscall.
x86_end counts the instruction and writes the commit log; when the instruction faults midway (a page fault, an illegal instruction), it restores the registers to their values before the instruction, returns -1, and the loop ends with a report.
case 0x89 is one form of mov, rm = reg: modrm parses the operands first, then the value of register reg is written to rm.
'''
# src:
# 
# 一次循环执行一条指令。x86_begin 从 R[RIP] 取字节，跳过前缀，记下 REX 与操作数宽度，读出操作码并返回它的编号 op；此时 R[RIP] 指向操作码之后的第一个字节。
# switch 按 op 进入一个 case：case 读操作码之后的字节，计算，写寄存器与内存。没有 case 的操作码进入 default，由框架的 x86_other 执行。syscall 的操作码 0f 05 就没有 case：x86_other 把它交给 frame/sysbase.c 的 sys_dispatch，sys_dispatch 按 R[RAX] 代为执行系统调用（write 调用本机 libc 的 write，exit 把 c->halted 置 1，x86_end 随后返回 -1），所以 interp.c 不需要为 syscall 写 case。
# x86_end 计数并写提交日志；指令中途出错（缺页、非法指令）时它把寄存器恢复到指令开始前的值，返回 -1，循环结束并打印报告。
# case 0x89 是 mov 的一种形式，rm = reg：先 modrm 解析操作数，再把 reg 寄存器的值写到 rm。

['cpu-insn-format.title']
src_hash = '2b8b307f'
text = 'The segments of an x86-64 instruction and the order they are read in'
# src: x86-64 指令的组成与读取顺序

['cpu-insn-format.code.1']
src_hash = 'c97f273a'
text = '''
b = next byte
while (b is a legacy prefix) { record what it selects; b = next byte }
if (b is a REX prefix 40 .. 4f) { rex = b; b = next byte }
if (b is a VEX prefix c4 or c5) { vex = b and the 2 or 1 bytes after it; op = next byte }
else if (b == 0f) op = 0f and the 1 or 2 bytes after it
else op = b
if (op takes a ModRM) {
    modrm = next byte
    if (a SIB follows modrm) sib = next byte
    disp = the next 0, 1 or 4 bytes, as many as modrm and sib give
}
imm = the next 0, 1, 2, 4 or 8 bytes, as many as op and the operand width give
'''
# src:
# b = 下一个字节
# while (b 是传统前缀) { 记下它的作用; b = 下一个字节 }
# if (b 是 REX 前缀 40 .. 4f) { rex = b; b = 下一个字节 }
# if (b 是 VEX 前缀 c4 或 c5) { vex = b 与其后 2 或 1 个字节; op = 下一个字节 }
# else if (b == 0f) op = 0f 与其后 1 或 2 个字节
# else op = b
# if (op 带 ModRM) {
#     modrm = 下一个字节
#     if (modrm 之后有 SIB) sib = 下一个字节
#     disp = 其后 0、1 或 4 个字节，个数由 modrm 与 sib 决定
# }
# imm = 其后 0、1、2、4 或 8 个字节，个数由 op 与操作数宽度决定

['cpu-insn-format.notes.1']
src_hash = 'a298d4ab'
text = '''
An x86-64 instruction consists of at most the seven segments of the figure, in order from left to right, and is at most 15 bytes long; every segment except the opcode may be absent. The widths of the segments in the figure are not to scale.
66, f2, f3, f0, 67 and the segment prefixes are called legacy prefixes. They fall into four groups, and an instruction uses at most one from each group, so the prefixes take at most 4 bytes: 66 changes the operand width to 2 bytes; f2 and f3 are repeat prefixes and also distinguish some vector instructions; f0 is the lock prefix; 67 changes the address width; 2e, 3e, 26, 36, 64 and 65 are segment prefixes. The REX prefix is one byte from 40 to 4f, directly before the opcode: its W bit changes the operand width to 8 bytes, and its other three bits add a 4th bit to register numbers, covered in the next subsection.
The opcode has 1 to 3 bytes: one byte; two bytes starting with 0f; three bytes starting with 0f 38 or 0f 3a. AVX instructions start with a VEX prefix: the 2 bytes after c4 carry the bits of REX, the table the opcode belongs to (0f, 0f 38 or 0f 3a) and the choice of 66, f2 or f3; the 1 byte after c5 is its short form, with the table fixed to 0f. A VEX instruction therefore has no REX and no 0f, and the VEX prefix is followed by a one-byte opcode.
The pseudocode is written in the order of reading. Whether a segment is present, and how many bytes it has, is decided by the bytes before it: the opcode decides whether there is a ModRM and whether there is an immediate; the ModRM decides whether there is a SIB and how many bytes the displacement has. The fields of ModRM and SIB are covered in the next subsection. The length of the immediate is decided by the opcode, for some opcodes together with the operand width: the immediate of opcode 81 is 2 bytes with a 66 prefix and 4 bytes otherwise, still 4 bytes with REX.W, sign-extended to 8 bytes once read. An 8-byte immediate occurs only in two forms of mov: REX.W with b8 to bf writes an 8-byte constant into a register, and a0 to a3 read or write memory at an 8-byte address; objdump writes both as movabs.
The brackets under the figure show how mini-cpu divides the work. x86_begin reads the prefixes, REX or VEX and the opcode, and returns the number op: it recognises 66, f2, f3, the six segment prefixes, REX and VEX, and on 0f it reads one more byte. The bytes after that are read in the case: modrm(&x) calls your modrm_decode, which reads ModRM, SIB and displacement; the immediate is read by functions such as fetch_imm and fetch8.
The colour of each segment in the figure stands for the same segment of bytes on every later page: grey prefix (REX and VEX included), orange opcode, green ModRM, purple SIB, teal displacement, blue immediate.
'''
# src:
# 
# 一条 x86-64 指令最多由图中的七段组成，按从左到右的顺序排列，最长 15 字节；除操作码外，每一段都可以没有。图中各段的宽度不按比例。
# 66、f2、f3、f0、67 与段前缀称为传统前缀，分四类，一条指令中每一类最多用一个，因此前缀最多 4 个字节：66 把操作数宽度改为 2 字节；f2 与 f3 是重复前缀，也用来区分一部分向量指令；f0 是 lock 前缀；67 改变地址的宽度；2e、3e、26、36、64、65 是段前缀。REX 前缀是 40 到 4f 中的一个字节，紧挨在操作码之前：它的 W 位把操作数宽度改为 8 字节，另外三位给寄存器编号加第 4 位，在下一小节讲。
# 操作码有 1 到 3 个字节：一个字节；0f 开头的两个字节；0f 38、0f 3a 开头的三个字节。AVX 指令以 VEX 前缀开头：c4 之后的 2 个字节带有 REX 的各位、操作码所在的表（0f、0f 38 或 0f 3a）与 66、f2、f3 的选择，c5 之后的 1 个字节是它的简写，表固定为 0f。VEX 指令因此没有 REX 与 0f，VEX 之后是一个字节的操作码。
# 伪代码按读取的顺序写出，每一段有没有、有几个字节，由它之前的字节决定：操作码决定有没有 ModRM、有没有立即数；ModRM 决定有没有 SIB、偏移有几个字节，ModRM 与 SIB 的各个字段在下一小节讲。立即数的字节数由操作码决定，部分操作码再看操作数宽度：操作码 81 的立即数在有 66 前缀时是 2 字节，否则是 4 字节，有 REX.W 时仍是 4 字节，读出后符号扩展为 8 字节。8 字节的立即数只出现在两种 mov 中：REX.W 与 b8 到 bf 的组合把一个 8 字节常数写入寄存器，a0 到 a3 以一个 8 字节的地址读写内存；objdump 把两者都写作 movabs。
# 图下方的括号是 mini-cpu 中的分工。x86_begin 读前缀、REX 或 VEX 与操作码，返回编号 op：它识别 66、f2、f3、六个段前缀、REX 与 VEX，读到 0f 时再读一个字节。其后的字节由 case 读取：modrm(&x) 调用你的 modrm_decode，读 ModRM、SIB 与偏移；立即数由 fetch_imm、fetch8 这些函数读取。
# 图中各段的颜色在后面每一页都表示同一段字节：灰色前缀（包括 REX 与 VEX）、橙色操作码、绿色 ModRM、紫色 SIB、青色偏移、蓝色立即数。


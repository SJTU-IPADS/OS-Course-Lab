['bomb-board.notes.1']
src_hash = '18be42fd'
text = '''
The screenshot is the screen of ./bomb -s, from a local demonstration server with 5 demonstration bombs on it.
Each row gives, in order, the rank, the tag of the bomb, the number of defused phases, the total number of explosions, and the explosions at each of the 8 phases. The count of a defused phase is shown in green; a phase not yet reached is shown as a dot. The bomb in row 2 exploded once at phase 3 and defused it afterwards, so that field is a green 1.
Your own row is marked with > and highlighted; the bottom line gives the number of bombs and the row you are in. Keys: up and down move one row, left and right or PgUp and PgDn turn a page, Home and End go to the first and the last page, r reloads from the server, q leaves.
Ranking: more defused phases first; with the same number, fewer explosions first; still the same, the earlier finish first.
When the output goes to a pipe or a file, the scoreboard is the same table without colours: a defused phase has a * after its count and your own row starts with >; ./bomb -s | grep '^>' picks out your own row.
The scoreboard shows no student IDs: the tag of a bomb is an 8-digit hexadecimal number the server computes from the ID.
'''

['cpu-bytes.notes.1']
src_hash = 'b33f8777'
text = '''
The four instructions are taken from the objdump output of the guest programs.
The first has the REX prefix 4c, the opcode 03, the ModRM 04, the SIB d5 and a 4-byte displacement; op is 0x03.
The second has the ModRM ec and a 4-byte immediate after the opcode 81; op is 0x81.
The number of the two-byte opcode 0f 88 is 0x100 plus the second byte, 0x188; a 4-byte offset follows.
The number of a VEX instruction is 0x1000 | map << 8 | opcode byte: c4 e2 7d is the three-byte VEX prefix, map 2 is 0f 38, the opcode is 40, the number 0x1240.
The same colour stands for the same segment of bytes on every later page: grey prefix, orange opcode, green ModRM, purple SIB, teal displacement, blue immediate.
'''
# src:
# 
# 四条指令都取自客户机程序的 objdump 输出。
# 第一条有 REX 前缀 4c、操作码 03、ModRM 04、SIB d5 与 4 字节位移；op 是 0x03。
# 第二条的操作码 81 之后是 ModRM ec 与 4 字节立即数；op 是 0x81。
# 两字节操作码 0f 88 的编号是 0x100 加第二个字节，即 0x188；之后是 4 字节位移。
# VEX 指令的编号是 0x1000 | map << 8 | 操作码字节：c4 e2 7d 是三字节的 VEX 前缀，map 2 即 0f 38，操作码 40，编号 0x1240。
# 同一种颜色在后面每一页都表示同一段字节：灰色前缀、橙色操作码、绿色 ModRM、紫色 SIB、青色位移、蓝色立即数。


Frame 1: the 18 bytes of the block are in memory and q4_0_scale(blk) reads d; _mm_loadu_si128(blk + 2), one 128-bit load, fetches the 16 code bytes into a 128-bit register (%xmm). Only 16 bytes are read: a block has only 16 code bytes, a 256-bit load of the codes would read 16 bytes too many, mini-ollama-simd maps the model file into memory, there may be no readable memory after the last row, and the extra bytes would cause a segmentation fault. The load is unaligned: the codes start at byte 2 of the block, their address is in general not a multiple of 16, and the aligned load _mm_load_si128 would end the program with a segmentation fault.
Frame 2: a bitwise and with 0x0f (_mm_and_si128) gives the low 4 bits of every byte, the codes lo of weights 0 to 15; shifting every 16 bits right by 4 (_mm_srli_epi16) and then the bitwise and gives the high 4 bits, the codes hi of weights 16 to 31. The shift works on 16-bit units, so bits of the neighbouring byte move in, and the bitwise and is still needed after the shift.
Frame 3: every 8 codes are widened to 8 32-bit integers (_mm256_cvtepu8_epi32, which takes the low 8 bytes of a 128-bit register), decreased by 8 (_mm256_sub_epi32) and converted to 8 floats (_mm256_cvtepi32_ps); for the second 8 of lo and of hi the register is first shifted right by 8 bytes (_mm_srli_si128, as written in embed), into the low 8 bytes. In the figure each of the four groups has its own colour, and the %ymm it becomes is drawn below its 8 codes in the same colour, joined to them by two dashed lines; the two groups of hi are outlined, as in the earlier figures. A %ymm is 32 bytes and the %xmm 16; the figure draws the %ymm longer than the %xmm, not to scale. The four groups are weights 0..7, 8..15, 16..23 and 24..31, corresponding to x[c..c+7], x[c+8..c+15], x[c+16..c+23] and x[c+24..c+31], with c = 32b.
'''

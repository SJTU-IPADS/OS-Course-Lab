['pd-class-plan.slide.1']
src_hash = '733d4135'
text = '''
- **The 32 weights of a block share $d_b$**, so $d_b$ can be taken out of the sum within the block: the scalar version restores the weights first and then multiplies them by $x$, while the AVX2 version multiplies by $x$ first, accumulates into bsum, and multiplies by $d_b$ only at the end.
  $$
  y_r=\sum_{b=0}^{63}\sum_{i=0}^{31} d_b\,(q_{b,i}-8)\,x_{32b+i}=\sum_{b=0}^{63} d_b\sum_{i=0}^{31}(q_{b,i}-8)\,x_{32b+i}
  $$
'''
# src:
# 
# - **一个块的 32 个权重共用 $d_b$**，$d_b$ 可以提到块内的求和之外：在标量版本中，先还原权重，再与 $x$ 相乘，而 AVX2 版本中，先与 $x$ 相乘、累加到 bsum，最后才乘以 $d_b$。
#   $$
#   y_r=\sum_{b=0}^{63}\sum_{i=0}^{31} d_b\,(q_{b,i}-8)\,x_{32b+i}=\sum_{b=0}^{63} d_b\sum_{i=0}^{31}(q_{b,i}-8)\,x_{32b+i}
#   $$

['pd-class-plan.notes.1']
src_hash = '38ad85c0'
text = '''
The AVX2 version keeps, for each row, 8 accumulator lanes acc in one 256-bit register, and each step processes the 32 weights of one block: the 16 bytes of the block are split into 32 codes, decreased by 8 and converted to float; in 4 groups of 8 lanes they are multiplied by the corresponding 32 floats of x, and the products are accumulated into the block's 8 partial sums bsum; bsum is multiplied by the d of this block and accumulated into acc; then the next block. After the 64 blocks of a row (for cols = 2048), hsum8 adds the 8 floats of acc into one float, which is written to y[r].
The formula on the page: b is the number of a block and i the index within it; the scale of block b is d_b, its i-th code is q_{b,i}, and the element of x it is multiplied by is x[32b + i]. The restored weight is d_b · (q_{b,i} − 8), the line under the block figure on the page "The scalar version of matvec_q4_0"; y_r is the sum of the products of the 2048 weights of the row with x, the left side. The scalar version computes the left side: sum += d * lo * x[c + j] multiplies by d once per weight, 32 times per block. The 32 weights of a block are multiplied by the same d_b, multiplication distributes over addition, and d_b can be taken out of the sum within the block, which gives the right side: within the block the products (q_{b,i} − 8) · x[32b + i] are added first, then multiplied by d_b once. The AVX2 version computes the right side: the sum within the block is split over the 8 lanes of bsum, lane k being the sum of the four terms i = k, 8 + k, 16 + k, 24 + k, and the sum of the 8 lanes is the sum within the block on the right side; _mm256_mul_ps multiplies each of the 8 lanes by d_b, one instruction, and adds them to the 8 lanes of acc; hsum8 adds the 8 lanes of acc and gives the sum over all blocks. Restoring the weights first takes 4 8-lane multiplications by d per block; this way takes 1.
The two sides are equal over the reals; in float, multiplications and additions in a different order round differently, and the two ways give results that differ in the last digits. The rule of the lab is "computed in float, in any order of addition": the checker computes the expected value of each row by the definition in double, and the result passes when it is within 10⁻⁵ of Σ |W[r][c] · x[c]| of the row; a different order gives differences of the order of 10⁻⁷.
hsum8 is at the top of simd.c and is given. Each row in the lower part of the figure is the 8 lanes of a %ymm, lane 0 at the right as in lecture 3's figures; the data in the dashed lanes is no longer needed. The first step adds the 4 floats of the high 128 bits to the 4 of the low 128 bits (_mm256_extractf128_ps takes out the high 128 bits, _mm_add_ps adds), and the result is a 128-bit value, so the high 4 lanes are no longer used; then two _mm_hadd_ps(s, s) add neighbouring pairs: after the first, lanes 0 and 1 each hold a sum of 4 and lanes 2 and 3 repeat these two numbers; after the second, lane 0 holds the sum of all 8, and _mm_cvtss_f32 takes out the lowest 32 bits, which are written to y[r]. The first step adds the two halves because AVX's _mm256_hadd_ps adds neighbouring pairs only within each 128 bits; adding the high 128 bits to the low 128 bits takes _mm256_extractf128_ps to take out the high 128 bits and then _mm_add_ps to add lane by lane, one instruction for 4 additions; after the two halves are added the value is 128 bits wide, and _mm_hadd_ps adds neighbouring pairs in one instruction, twice for the sum of all 8. The order in which the numbers are added does not change the sum over the reals; hsum8 takes its order from the instructions available. This step is called a horizontal add, and each row does it once, after all its blocks.
The meaning of the 8 accumulator lanes is the same as on lecture 3's page "one round of the vector loop": s₀ accumulates the products whose index is 0 modulo 8, s₁ those that are 1 modulo 8, and so on; only after they are added is it the dot product. Lecture 3 accumulates 8 ints with vpaddd; this part accumulates 8 floats with _mm256_add_ps.
The given dot in the same file (the float dot product that rmsnorm and attn_scores call) is written exactly this way, 8-lane accumulation and hsum8 at the end; it can be read as an example.
The TODO comment above matvec_q4_0 in simd.c gives one way to write it and the intrinsics each step uses, and the section "The rule of the function" in docs/simd.md lists it as six steps; in class the function is written in this order. Steps 1 and 2 are the same as the given embed in the same file. Step 3 gives q − 8 as floats and does not multiply by d: in this step embed multiplies by d with decode8 and writes the restored weights to memory; matvec_q4_0 multiplies q − 8 by x directly, and d is multiplied once per block in step 5, the right side of the formula. In step 3 the second 8 of lo and of hi are first shifted right by 8 bytes with _mm_srli_si128; step 4 is the float version of lecture 3's vector loop; the hsum8 of step 6 is at the top of the file and is given.
The function body initially has two lines: a (void) line that keeps the unused parameters from producing warnings, and todo("matvec_q4_0"), which prints matvec_q4_0 is not implemented yet and exits the program with status 3; replace these two lines with the implementation.
Two rules: only unaligned loads, _mm_loadu_si128 and _mm256_loadu_ps, because neither the address of w nor that of x is guaranteed to be aligned and an aligned load may end the program with a segmentation fault; and only the 16 code bytes of each block are read, because a 256-bit load of the codes would read 16 bytes too many, mini-ollama-simd maps the model file into memory and there may be no readable memory after the last row.
simd.c is compiled with -mavx2 and without -mfma, so the AVX2 intrinsics of <immintrin.h> can be used in it; the other files are not compiled with -mavx2. The instruction behind each intrinsic and its usage are in the Intel Intrinsics Guide (https://www.intel.com/content/www/us/en/docs/intrinsics-guide/).
'''

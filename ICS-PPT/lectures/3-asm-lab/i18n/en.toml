# - 张量按行存放，每行从头切成 32 个权重一块，每块独立量化
# - 每一块调用一次 `q4_0_quantize(x, blk)`：输入 32 个 float，输出 18 个字节，输出总字节数 = 行数 × 每行块数 × 18

['nq-blocks.notes.1']
src_hash = '81165266'
text = '''
Take blk.0.attn_q.weight: 2048 rows of 2048 weights, stored row by row in the safetensors. The framework reads whole rows as floats; each row is cut from its start into blocks of 32 weights, 64 blocks; for every block it calls q4_0_quantize(x, blk) once, with x pointing at these 32 floats and blk at the 18 bytes of this block in the output buffer. Rows and blocks are independent of each other, so every block depends only on its own input, and processing in chunks gives the same bytes.
The bytes of a tensor in the data area = rows × blocks per row × bytes per block = 2048 × 64 × 18 = 2 359 296, the last column that nano-quant plan prints for this tensor; the sum over the lines of plan is the data-area byte count that quant reports. The row length must be a multiple of the block length; the framework checks this in the plan stage and exits with an error otherwise.
nq-selftest calls your function the same way: it constructs 131072 weights, cuts them into 4096 blocks through nq_quantize, calls q4_0_quantize block by block, then calls q4_0_dequantize block by block to restore them.
'''
# src:
# 
# 以 blk.0.attn_q.weight 为例：2048 行，每行 2048 个权重，safetensors 中按行存放。框架按整行读入 float，每行从头切成 32 个权重一块，共 64 块；对每一块调用一次 q4_0_quantize(x, blk)，x 指向这 32 个 float，blk 指向输出缓冲区中这一块的 18 个字节。行与行、块与块之间没有联系，所以每个块只取决于自己的输入，分段处理得到相同的字节。
# 张量在数据区的字节数 = 行数 × 每行块数 × 每块字节数 = 2048 × 64 × 18 = 2 359 296，与 nano-quant plan 为这个张量输出的最后一列相同；plan 各行的总和就是 quant 报告的数据区字节数。行长必须是块长的倍数，框架在 plan 阶段检查，不满足时报错退出。
# nq-selftest 的调用方式相同：它构造 131072 个权重，经 nq_quantize 切成 4096 个块逐块调用 q4_0_quantize，再逐块调用 q4_0_dequantize 还原。


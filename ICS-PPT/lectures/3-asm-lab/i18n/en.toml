['nq-gguf.notes.1']
src_hash = '03611c7e'
text = '''
A GGUF file has two parts. The header is written by nq2gguf: the magic GGUF, version 3, the number of tensors, the number of key-value pairs, then the key-value pairs and the tensor directory, padded to a multiple of 32. The key-value pairs come from meta.kv: mkmeta.py generates the architecture parameters, the vocabulary, the merge rules and the special tokens from config.json and tokenizer.json, 24 pairs, and nq2gguf adds general.file_type and general.quantization_version. The directory has one entry per tensor: its GGUF name, the number of dimensions, the length of each, the format and its offset inside the data area. The header of the real model is 5 946 976 bytes.
The data area is the bytes of the 310 tensors end to end, in the order of the safetensors header: token_embd.weight first, then the 28 layers with 11 tensors each, and output_norm.weight last; every tensor is aligned to 32. The bytes of a tensor are its blocks end to end, and these bytes are written by your functions; the data area of the .nq and that of the GGUF are identical byte for byte, nq2gguf copies it unchanged.
The figure is drawn for the q4_0 recipe: every two-dimensional tensor is Q4_0, the data area is 968 249 344 bytes and the whole file 974 196 320 bytes; the one-dimensional normalization weights stay F32 and are copied unchanged by the framework. The 11 tensors of a layer are attn_q, attn_k, attn_v and attn_output of the attention, ffn_gate, ffn_up and ffn_down of the feed-forward part, and the four normalization weights attn_norm, ffn_norm (8 192 bytes each), attn_q_norm and attn_k_norm (512 bytes each); the four total 17 KB and are drawn as grey lines, with their names below. Under the q4_k_m recipe, embed_tokens and the v_proj and down_proj of some layers use Q6_K and the other two-dimensional tensors Q4_K; the data area is 1 101 457 408 bytes.
tools/ggufdump.py reads a GGUF and checks three things: every offset of the directory is aligned to general.alignment, adjacent tensors are end to end, and the end of the last tensor equals the file length.
'''
# src:
# 
# GGUF 文件分两段。头由 nq2gguf 写出：魔数 GGUF、版本 3、张量数、键值对数，然后是键值对与张量目录，最后填充到 32 的倍数。键值对来自 meta.kv：mkmeta.py 从 config.json 与 tokenizer.json 生成架构参数、词表、合并规则与特殊词元共 24 个，nq2gguf 再加 general.file_type 与 general.quantization_version 两个。目录中每个张量一项：GGUF 名字、维数、各维长度、格式与它在数据区内的偏移。真实模型的头是 5 946 976 字节。
# 数据区是 310 个张量的字节首尾相接，顺序与 safetensors 的头相同：token_embd.weight 在前，然后是 28 层，每层 11 个张量，最后是 output_norm.weight；每个张量对齐到 32。张量的字节就是它的块首尾相接，这些字节由你的函数写出；.nq 的数据区与 GGUF 的数据区逐字节相同，nq2gguf 原样复制。
# 图按 q4_0 配方画：二维张量全部 Q4_0，数据区 968 249 344 字节，整个文件 974 196 320 字节；一维的归一化系数保持 F32，由框架原样复制。一层的 11 个张量是注意力的 attn_q、attn_k、attn_v、attn_output，前馈的 ffn_gate、ffn_up、ffn_down，以及 4 个归一化系数 attn_norm、ffn_norm（各 8 192 字节）、attn_q_norm、attn_k_norm（各 512 字节）；4 个合计 17 KB，在图中是灰线，名字标在下方。q4_k_m 配方下 embed_tokens 与部分层的 v_proj、down_proj 用 Q6_K，其余二维张量用 Q4_K，数据区 1 101 457 408 字节。
# tools/ggufdump.py 读一个 GGUF 检查三项：目录中的偏移都对齐到 general.alignment、相邻张量首尾相接、最后一个张量的末端与文件长度相符。


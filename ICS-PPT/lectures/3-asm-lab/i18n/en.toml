['pd-class-decode.notes.1']
src_hash = '3d344c6f'
text = '''
This page has three frames: the first three steps of the TODO comment in simd.c. The first two steps are the same as the given embed in the same file. Step 3 gives q − 8 as floats and does not multiply by d: in this step embed multiplies by d and writes the restored weights to memory; matvec_q4_0 multiplies q − 8 by x directly, and d is multiplied once per block in step 5, the right side of the formula on the previous page.
Frame 1: the 18 bytes of the block are in memory and q4_0_scale(blk) reads d; _mm_loadu_si128(blk + 2), one 128-bit load, fetches the 16 code bytes into a 128-bit register (%xmm). Only 16 bytes are read: a block has only 16 code bytes, a 256-bit load of the codes would read 16 bytes too many, mini-ollama-simd maps the model file into memory, there may be no readable memory after the last row, and the extra bytes would cause a segmentation fault. The load is unaligned: the codes start at byte 2 of the block, their address is in general not a multiple of 16, and the aligned load _mm_load_si128 would end the program with a segmentation fault. The box at the top right magnifies qs0: one byte holds two 4-bit codes, the low 4 bits the code q0 of weight 0 and the high 4 bits the code q16 of weight 16, written q0-4 and q16-4; the suffix is the width in bits.
Frame 2: a bitwise and with 0x0f (_mm_and_si128) gives the low 4 bits of every byte, the codes lo of weights 0 to 15; shifting every 16 bits right by 4 (_mm_srli_epi16) and then the bitwise and gives the high 4 bits, the codes hi of weights 16 to 31. The shift works on 16-bit units, so bits of the neighbouring byte move in, and the bitwise and is still needed after the shift.
Frame 3: every 8 codes are widened to 8 32-bit integers (_mm256_cvtepu8_epi32, which takes the low 8 bytes of a 128-bit register), decreased by 8 (_mm256_sub_epi32) and converted to 8 floats (_mm256_cvtepi32_ps); for the second 8 of lo and of hi the register is first shifted right by 8 bytes (_mm_srli_si128, as written in embed), into the low 8 bytes. In the figure each of the four groups has its own colour, and the %ymm it becomes is drawn below its 8 codes in the same colour, joined to them by two dashed lines; the two groups of hi are outlined, as in the earlier figures. A %ymm is 32 bytes and the %xmm 16; the figure draws the %ymm longer than the %xmm, not to scale. The four groups are weights 0..7, 8..15, 16..23 and 24..31, corresponding to x[c..c+7], x[c+8..c+15], x[c+16..c+23] and x[c+24..c+31], with c = 32b. In the third frame the number after a code is again its width in bits: in lo and hi each code takes one byte, written q0-8; in a %ymm each code is a 32-bit float, written q0-32, whose value is q − 8.
'''
# src:
# 
# 这一页三帧，是 simd.c 中 TODO 注释给出的前三步。前两步与同一文件中已给出的 embed 相同。第三步得到的是 q − 8 的 float，不乘 d：embed 在这一步乘以 d，把还原的权重写入内存；matvec_q4_0 把 q − 8 直接与 x 相乘，d 在第五步对整个块乘一次，即上一页公式的右边。
# 第一帧：块的 18 个字节在内存中，q4_0_scale(blk) 读出 d；_mm_loadu_si128(blk + 2) 一条 128 位的加载取出 16 个编码字节，放入一个 128 位寄存器（%xmm）。只读 16 字节：一个块的编码只有 16 字节，用 256 位加载读编码会多读 16 字节，mini-ollama-simd 把模型文件映射到内存，最后一行之后可能没有可读的内存，多读的字节会引起段错误。用非对齐加载：编码从块的第 2 个字节开始，地址一般不是 16 的倍数，对齐加载 _mm_load_si128 会使程序以段错误终止。右上角放大了 qs0：一个字节含两个 4 位编码，低 4 位是第 0 个权重的编码 q0，高 4 位是第 16 个权重的编码 q16，写作 q0-4 与 q16-4，后缀是位数。
# 第二帧：与 0x0f 按位与（_mm_and_si128）得到每个字节的低 4 位，即第 0 到 15 个权重的编码 lo；每个 16 位右移 4 位（_mm_srli_epi16）再按位与得到高 4 位，即第 16 到 31 个权重的编码 hi。右移按 16 位进行，相邻字节的位会移入，所以右移之后仍要按位与。
# 第三帧：每 8 个编码扩展为 8 个 32 位整数（_mm256_cvtepu8_epi32，取 128 位寄存器的低 8 个字节），减 8（_mm256_sub_epi32），转换为 8 个 float（_mm256_cvtepi32_ps）；lo 与 hi 的后 8 个先把寄存器右移 8 个字节（_mm_srli_si128，embed 中的写法），移到低 8 个字节。图中四组各用一种颜色，每组得到的 %ymm 画在这 8 个编码的下方，颜色相同，两条虚线连接两者；hi 的两组与前面的图一样画成空心。一个 %ymm 是 32 字节，%xmm 是 16 字节，图中 %ymm 画得比 %xmm 长，没有按比例。四组依次是权重 0..7、8..15、16..23、24..31，分别与 x[c..c+7]、x[c+8..c+15]、x[c+16..c+23]、x[c+24..c+31] 对应，c = 32b。第三帧中编码后的数字同样是位数：lo 与 hi 中每个编码占一个字节，写作 q0-8；%ymm 中每个编码是一个 32 位 float，写作 q0-32，它的值是 q − 8。


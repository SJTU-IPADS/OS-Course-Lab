['cpu-libc.title']
src_hash = 'aa29f0ed'
text = 'printf, libc and syscall'
# src: printf, libc 和 syscall

['cpu-libc.slide.1']
src_hash = '2da52656'
text = '''

- **`printf` is a function of the C standard library libc**: like the program's own functions it consists of ordinary instructions; it converts the arguments into bytes by the format, then calls libc's `write`.
- **Only the `syscall` instruction enters the operating system**: `write` puts the number and the arguments in registers and executes `syscall`, and the operating system does the output. A guest program is not linked with libc and has no `printf`; its output is done by the `write` of [`guest/mini.h`](file:/lectures/mini-cpu/guest/mini.h), which executes `syscall` directly.
'''
# src:
# 
# - **`printf` 是 C 标准库 libc 中的函数**：它与程序自己的函数一样由普通指令组成，按格式把参数转为字节，再调用 libc 的 `write`。
# - **进入操作系统的只有 `syscall` 指令**：`write` 把编号与参数放入寄存器，执行 `syscall`，由操作系统完成输出。guest 程序不链接 libc，没有 `printf`，输出由 [`guest/mini.h`](file:/lectures/mini-cpu/guest/mini.h) 的 `write` 直接执行 `syscall`。

['cpu-libc.notes.1']
src_hash = '201a5f1e'
text = '''
When an ordinary C program on a PC calls printf, the code of printf comes from the C standard library libc (usually glibc on Linux); it is put together with the program at link time and, at run time, is ordinary instructions executed by the CPU, like the program's own functions. printf converts argc into the character 1 by the format string, giving the 9 bytes "argc = 1\n", and puts them into the buffer of stdout; when they are to be output, it calls the function write of libc.
Operations such as printing to the terminal or ending the program cannot be done by the program's own instructions; the program asks the operating system to do them. The request is the syscall instruction: write puts the number 1 in %rax and the file descriptor, the buffer address and the byte count in %rdi, %rsi, %rdx, executes syscall, and Linux prints these 9 bytes on the terminal. The mechanism of system calls is explained in the lecture on exceptions.
printf does not call write every time: when stdout is a terminal it prints by lines, calling write once at each newline; when redirected to a file, it calls write only when the buffer is full or the program ends. Running a program on the host under strace -e trace=write shows every write it executes.
The programs in guest/ are not linked with libc, and library functions such as printf and malloc cannot be used. guest/mini.h writes out the few functions they need: puts finds the length of a string, putint converts an integer into decimal digits, and write executes syscall directly with inline assembly. Both paths in the figure run on the PC, and the two syscalls are executed by the same operating system, Linux; when a guest program runs on mini-cpu, code in frame/ carries out its syscall instead.
'''
# src:
# 
# PC 上一个普通的 C 程序调用 printf 时，printf 的代码来自 C 标准库 libc（Linux 上通常是 glibc），链接时与程序放在一起，运行时与程序自己的函数一样是 CPU 执行的普通指令。printf 按格式串把 argc 转为字符 1，得到 "argc = 1
# " 这 9 个字节，放入 stdout 的缓冲区；需要输出时，它调用 libc 中的 write 函数。
# 向终端输出、结束程序这类操作，程序自己的指令不能完成，要请求操作系统完成。请求用的是 syscall 指令：write 函数把编号 1 放入 %rax，把文件描述符、缓冲区地址、字节数放入 %rdi、%rsi、%rdx，执行 syscall，由 Linux 把这 9 个字节输出到终端。系统调用的机制在讲异常时说明。
# printf 不一定每次都调用 write：stdout 是终端时按行输出，遇到换行调用一次 write；重定向到文件时，缓冲区满或程序结束时才调用。在本机上用 strace -e trace=write 运行一个程序，可以看到它执行的每一次 write。
# guest/ 中的程序不链接 libc，printf、malloc 这些库函数都不能使用。guest/mini.h 自己写出了用到的几个函数：puts 求出字符串的长度，putint 把整数转为十进制数字，write 用内联汇编直接执行 syscall。图中两条路径都在 PC 上运行，两处 syscall 由同一个操作系统 Linux 执行；guest 程序在 mini-cpu 上运行时，syscall 由 frame/ 中的代码代为完成。

['cpu-hello-syscall.title']
src_hash = 'e3bf385a'
text = "The syscall instruction: mini-cpu executes it on the guest's behalf"
# src: syscall 指令：mini-cpu 代为执行

['cpu-hello-syscall.slide.1']
src_hash = '3c50119d'
text = "The `syscall` of guest/hello is only read by mini-cpu; the PC's CPU does not execute it. When mini-cpu reads it, mini-cpu calls libc's `write`, and the PC's CPU executes the `syscall` in `write`: mini-cpu has executed this system call on the guest's behalf."
# src:
# 
# guest/hello 的 `syscall` 只被 mini-cpu 读取，PC 的 CPU 不执行它。mini-cpu 读到它之后调用 libc 的 `write`，PC 的 CPU 执行 `write` 中的 `syscall`：mini-cpu 代为执行了这次系统调用。

['cpu-hello-syscall.notes.1']
src_hash = '77f2fb96'
text = '''
guest/hello is the smallest guest program in guest/; it prints two lines, hello from the guest and argc = 1. On the left are the instructions that print the first line: %eax is set to 1, the number of write; %esi to 0x402000, the address of the string; %rdi to 1, standard output; %rdx already holds 21, the number of bytes. Then it executes the syscall at 40112a, whose bytes are 0f 05.
When guest/hello runs on mini-cpu, the PC's CPU executes the machine code of mini-cpu; the machine code of guest/hello is data that mini-cpu reads, and the PC's CPU does not execute it. mini-cpu reads the guest's instructions one by one and changes the guest's registers and memory as each instruction specifies. When it reads 0f 05, it learns from the guest's %rax that this is a write, and copies the 21 bytes at 0x402000 in guest memory into an array of its own.
Then mini-cpu calls libc's write: mini-cpu is a C program linked with libc, and write finally executes syscall, with %rax = 1, again the bytes 0f 05. This one is executed by the PC's CPU and enters Linux, which prints the 21 bytes on the terminal. The return value 21 is written back to the guest's %rax, and mini-cpu goes on to read the next instruction at 40112c.
This is execution on the guest's behalf: the syscall of guest/hello is only read, and the write it asks for is done by a syscall in mini-cpu. "argc = " and the "1\n" of putint are printed the same way, three writes in all. Last, guest/hello executes syscall with number 60, exit; when mini-cpu reads it, mini-cpu stops executing the guest program and uses the exit code the guest gives as its own exit code.
'''
# src:
# 
# guest/hello 是 guest/ 中最小的客户机程序，输出 hello from the guest 与 argc = 1 两行。图左是它输出第一行的几条指令：%eax 置 1，即 write 的编号；%esi 置字符串的地址 0x402000；%rdi 置 1，即标准输出；%rdx 此前已经是字节数 21。然后在 40112a 执行 syscall，这条指令的字节是 0f 05。
# guest/hello 在 mini-cpu 上运行时，PC 的 CPU 执行的是 mini-cpu 的机器码；guest/hello 的机器码是 mini-cpu 读取的数据，PC 的 CPU 不执行它。mini-cpu 逐条读取客户机的指令，按指令的规定修改客户机的寄存器与内存。读到 0f 05 时，它从客户机的 %rax 得知这是一次 write，把客户机内存中 0x402000 处的 21 个字节复制到自己的数组中。
# 然后 mini-cpu 调用 libc 的 write：mini-cpu 是链接 libc 的 C 程序，write 最终执行 syscall，%rax = 1，字节同样是 0f 05。这一条由 PC 的 CPU 执行，进入 Linux，Linux 把 21 个字节输出到终端。返回值 21 写回客户机的 %rax，mini-cpu 接着读取 40112c 处的下一条指令。
# 这就是代为执行：guest/hello 的 syscall 只被读取，它要求的 write 由 mini-cpu 中的 syscall 完成。"argc = " 与 putint 输出的 "1\n" 以同样的方式输出，共三次 write。guest/hello 最后以编号 60 执行 syscall，即 exit；mini-cpu 读到它时停止执行客户机程序，把客户机给出的退出码作为自己的退出码。

['cpu-hello-mem.title']
src_hash = 'd1fd00de'
text = 'Memory and registers: mini-cpu simulates them in its own memory'
# src: 内存与寄存器：mini-cpu 在内存中模拟

['cpu-hello-mem.slide.1']
src_hash = 'f94dc66b'
text = '''

[`frame/loader.c`](file:/lectures/mini-cpu/frame/loader.c) writes the instructions and the strings of guest/hello into dram.img, writes argc and argv at the top of the stack, and sets `R[RSP]` and `R[RIP]`. `interp_run` executes one instruction after another from `R[RIP]`.
'''
# src:
# 
# [`frame/loader.c`](file:/lectures/mini-cpu/frame/loader.c) 把 guest/hello 的指令与字符串写入 dram.img，在栈顶写入 argc 与 argv，设置 `R[RSP]` 与 `R[RIP]`。`interp_run` 从 `R[RIP]` 开始逐条执行。

['cpu-hello-mem.notes.1']
src_hash = '1c8bc10a'
text = '''
The mini-cpu started by ./mini-cpu guest/hello is an ordinary process on the host; the memory and the registers of guest/hello are data in this process.
Memory: frame/main.c first opens the file dram.img in the current directory, sets its size to 64 MiB and maps it into mini-cpu's own memory with mmap, as the memory of the guest. The loader loader_exec (frame/loader.c) reads the program headers of guest/hello and copies the two sections .text and .rodata into it; it then prepares a stack of 64 pages and writes, at its top, the argument string "guest/hello", the address of argv[0], and argc.
The addresses in the instructions of guest/hello, such as 0x401000, 0x402000 and 0x7fffffffefc0, are guest addresses. frame/ gives every 4 KiB page a place in dram.img and converts a guest address into an offset in the file on every access: the page at 0x401000 is at offset 0x101000, the page at 0x402000 at 0x102000, and the top of the stack 0x7fffffffefc0 at 0x142fc0. After the run, od -A x -c -j $((0x102000)) -N 32 dram.img shows the two strings in the file. How pages are mapped is explained in the lecture on virtual memory; the interpreter only uses guest addresses, and the helpers such as load and store do the conversion.
Registers: main in frame/main.c has the local variable mcpu cpu, and the registers of the guest are its member R[18]: R[RAX] to R[R15] are the 16 general-purpose registers, R[RFLAGS] the flags register, R[RIP] the rip. The parameter c of interp_run(c) points at cpu, and interp.c defines R as c->R with a macro, so R[RSP] is the guest's %rsp. The loader sets R[RSP] to 0x7fffffffefc0, the address of argc at the top of the stack, R[RIP] to the entry 0x401000, the flags register to 0x2 (bit 1 is always 1), and the rest to 0.
From then on, every pass of interp_run takes one instruction from guest memory at R[RIP], executes it, and changes R[] and guest memory. The first instruction of guest/hello is at 0x401000; its bytes are 48 8b 3c 24, mov (%rsp),%rdi, which reads argc into R[RDI].
'''
# src:
# 
# ./mini-cpu guest/hello 启动的 mini-cpu 是本机上的一个普通进程，guest/hello 的内存与寄存器都是这个进程中的数据。
# 内存：frame/main.c 先打开当前目录下的文件 dram.img，把它的大小设为 64 MiB，用 mmap 映射到 mini-cpu 自己的内存中，作为客户机的内存。装载器 loader_exec（frame/loader.c）读 guest/hello 的程序头，把 .text 与 .rodata 两段复制进去；再准备 64 页的栈，在栈顶依次写入参数字符串 "guest/hello"、argv[0] 的地址与 argc。
# guest/hello 的指令中出现的地址是 0x401000、0x402000、0x7fffffffefc0 这样的客户机地址。frame/ 以 4 KiB 的页为单位，为每一页在 dram.img 中分配一个位置，读写时把客户机地址换算为文件中的偏移：0x401000 一页在偏移 0x101000，0x402000 一页在 0x102000，栈顶 0x7fffffffefc0 在 0x142fc0。运行结束后，od -A x -c -j $((0x102000)) -N 32 dram.img 在文件中显示这两个字符串。按页对应的方式在讲虚拟内存时说明；解释器只使用客户机地址，换算由 load、store 这些辅助函数完成。
# 寄存器：frame/main.c 的 main 中有局部变量 mcpu cpu，客户机的寄存器就是它的成员 R[18]：R[RAX] 到 R[R15] 是 16 个通用寄存器，R[RFLAGS] 是标志寄存器，R[RIP] 是 rip。interp_run(c) 的参数 c 指向 cpu，interp.c 用宏把 R 定义为 c->R，所以 R[RSP] 就是客户机的 %rsp。装载器把 R[RSP] 置为栈顶 argc 所在的地址 0x7fffffffefc0，R[RIP] 置为入口 0x401000，标志寄存器置为 0x2（第 1 位恒为 1），其余为 0。
# 之后 interp_run 每次循环按 R[RIP] 从客户机内存取一条指令，执行它，修改 R[] 与客户机内存。guest/hello 的第一条指令在 0x401000，字节是 48 8b 3c 24，即 mov (%rsp),%rdi，把 argc 读入 R[RDI]。


['cpu-modrm-check.notes.1']
src_hash = '2be2f326'
text = '''
./mini-unit modrm runs no guest program; it calls modrm_decode directly on 338 sets of bytes, covering every form and every truncated length.
The output on the page is the report of one error: the displacement f8 was not sign-extended and gave 248; each line states the input bytes, the REX, the operand as written in assembly, the expected and the actual value, and the function is fixed from it. When everything passes only the last line is printed, 0 failed.
--disasm disassembles the whole program with the same modrm_decode, in the format of objdump -d, so the two can be compared line by line with diff.
Part 1 of the grading is exactly these three items: mini-unit modrm, the disassembly of the guest programs, and the disassembly of randomly generated memory operands.
'''

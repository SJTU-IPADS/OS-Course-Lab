The screenshot on the left is the screen after ./bomb starts (the demonstration bomb, ID 000000000001, a terminal of 80 columns and 20 rows). The program connects to the course server when it starts and takes over the whole terminal window once connected.
From top to bottom: BOMB and the current phase PHASE 1; the 8 squares are the progress, defused phases are green, and to their right is the number of defused phases, 0/8; one line of rules: one line defuses a phase, a wrong line sets the bomb off; the title of the input box is phase 1 of 8, with the student ID this bomb belongs to, ID 000000000001, on the right; check it before starting. Type one line after > in the box and press Enter to send it; Ctrl-C clears the line, Ctrl-D leaves.

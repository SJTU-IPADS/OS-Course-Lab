['nq-q4-check.notes.1']
src_hash = '4214651f'
text = '''
make builds the three programs nano-quant, nq2gguf and nq-selftest. nq-selftest checks by group, the groups being a, scale_min, q4_0, q4_1, q4_k and q6_k; with group names given it runs only those groups, so a group can be run as soon as the functions it involves are done.
The q4_0 group quantizes 512 super-blocks, 131072 weights, that is 4096 Q4_0 blocks: it first encodes all the weights and compares the md5 of the encoded bytes (q4_0_bytes), then restores block by block and compares the md5 of the restored values (q4_0_back); when both md5s equal those in tests/expected-blocks.txt it prints matches, otherwise DIFFERS, exit status 1. One more line on standard error gives the relative rms error and the largest absolute error, 0.08408 and 8 when correct.
The first 8 super-blocks are constructed edge inputs: all zero, all equal, one outlier, all negative, all positive, magnitude 1e-7, symmetric about 0, a single nonzero; the other 504 super-blocks are random numbers with magnitudes from 1e-4 to 1e2, all truncated to BF16 before quantizing, the values weights take in a real model.
Calling a function that is not implemented yet prints nano_quant.cpp: <name> is not implemented yet and exits with status 3. The q4_0 group calls f32_to_fp16 to write d before encoding, so the two fp16 functions of part A come first, then Q4_0.
The q4_0 model is made by your code. The q4_0 recipe quantizes every two-dimensional tensor to Q4_0 and keeps the one-dimensional tensors in F32; it calls only the functions of part A and Q4_0, so the model can be made while the rest of part B is not done. tools/fetch-model.sh downloads the three files, about 4.3 GB, before class; mkmeta.py makes the key-value section of the GGUF; quant writes one line on standard output: the md5 of the data area, the output file and the data bytes, correct when they equal q4_0_nq_md5 (fa4f64a2e2be8d8bdb7dad8c0ed06e27) and q4_0_nq_bytes (968249344) in tests/expected-qwen3vl.txt; nq2gguf writes model/q4_0.gguf, 974196320 bytes.
On the ollama side, start ollama first (ollama serve, or the system service the installer registered), write model/Modelfile as in the README with the FROM line changed to ./q4_0.gguf; ollama create imports it as nq-q4-0. ollama run starts a conversation: type the question in the terminal at the bottom, and /bye or Ctrl-D ends it. Asked "用一句话介绍你自己。" (introduce yourself in one sentence), the model made by an implementation of part A and Q4_0 only answers "我是一个AI助手，没有实体，但可以为你提供知识、解答问题、创作内容等，随时准备协助你。" (I am an AI assistant without a physical form, but I can give you knowledge, answer questions, create content and so on, always ready to help you.) When the check is over, ollama rm nq-q4-0 deletes the model.
'''
# src:
# 
# make 生成 nano-quant、nq2gguf 与 nq-selftest 三个程序。nq-selftest 按组检查，组名 a、scale_min、q4_0、q4_1、q4_k、q6_k；指定组名时只运行这些组，完成一组涉及的函数即可运行这一组。
# q4_0 组在 512 个超块、131072 个权重上量化，即 4096 个 Q4_0 块：先把全部权重编码，比较编码字节的 md5（q4_0_bytes），再逐块还原，比较还原值的 md5（q4_0_back），两个 md5 都与 tests/expected-blocks.txt 一致时输出 matches，否则 DIFFERS，退出码 1。标准错误上另有一行相对均方根误差与最大绝对误差，正确时为 0.08408 与 8。
# 前 8 个超块是专门构造的边界输入：全零、全相等、含一个离群值、全负、全正、量级 1e-7、关于 0 对称、只有一个非零点；其余 504 个超块是随机数，量级从 1e-4 到 1e2，全部先截断为 BF16 再量化，即真实模型中权重的取值。
# 尚未实现的函数被调用时输出 nano_quant.cpp: <函数名> is not implemented yet 并以状态 3 退出。q4_0 组先于编码调用 f32_to_fp16 写出 d，所以要先完成 A 部分的 fp16 两个函数，再写 Q4_0。
# q4_0 模型由你的代码生成。配方 q4_0 把二维张量全部量化为 Q4_0，一维张量保持 F32，只调用 A 部分与 Q4_0 的函数，B 部分的其余函数未完成时也能生成。tools/fetch-model.sh 下载约 4.3 GB 的三个文件，在课前完成；mkmeta.py 生成 GGUF 的键值段；quant 在标准输出写一行：数据区的 md5、输出文件、数据区字节数，与 tests/expected-qwen3vl.txt 中的 q4_0_nq_md5（fa4f64a2e2be8d8bdb7dad8c0ed06e27）与 q4_0_nq_bytes（968249344）相同即正确；nq2gguf 写出 model/q4_0.gguf，974196320 字节。
# ollama 一侧先启动 ollama（ollama serve，或安装时注册的系统服务），model/Modelfile 按 README 写出，FROM 一行改为 ./q4_0.gguf；ollama create 把它导入为 nq-q4-0。ollama run 进入对话，在底部的终端中输入问题，/bye 或 Ctrl-D 结束。问「用一句话介绍你自己。」时，只完成 A 部分与 Q4_0 的实现得到的模型回答「我是一个AI助手，没有实体，但可以为你提供知识、解答问题、创作内容等，随时准备协助你。」检查结束后用 ollama rm nq-q4-0 删除这个模型。


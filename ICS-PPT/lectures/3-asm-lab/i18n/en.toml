['bomb-space.slide.1']
src_hash = 'ab0a70ed'
text = '''
- **Code segment `.text`**: the instructions of the program. `objdump -d` disassembles this segment; `phase_1` starts at `0xab8d`;
- **Read-only data `.rodata`**: string constants and other read-only data; `0xcb030` is in it;
- **Data segment and stack**: the line `read_line` read is in `.bss`; the stack frame of `phase_1` holds its address.

The full mechanism of the address space is explained with virtual memory.
'''
# src:
# 
# - **代码段 `.text`**：程序的指令。`objdump -d` 反汇编的是这一段，`phase_1` 从 `0xab8d` 开始；
# - **只读数据 `.rodata`**：字符串常量等只读的数据，`0xcb030` 在其中；
# - **数据段与栈**：`read_line` 读入的一行在 `.bss` 中，`phase_1` 的栈帧中保存了它的地址。
# 
# 地址空间的完整机制在讲虚拟内存时说明。

['bomb-space.notes.1']
src_hash = '94e75c16'
text = '''
The figure is the address space of the bomb process with high addresses at the top, the same as the figure of the "Run-time stack" page of lecture 3 with the read-only data segment added. The addresses on the left of the segments are addresses in the file, from readelf -S bomb: .text starts at 0xa1c0, .rodata at 0xcb000, .data at 0x103000.
The code segment .text holds the instructions; objdump -d disassembles exactly this segment. phase_1 starts at 0xab8d and the lea is at 0xab99.
The read-only data .rodata holds string constants and other read-only data; it cannot be written at run time. 0xcb030 is past 0xcb000 and belongs to this segment.
The data segments .data and .bss hold the global variables. read_line puts the line it read in a global buffer (.bss) and returns its address; phase_1 keeps that address in its own stack frame (-0x8(%rbp)). The stack is at the high end and grows toward lower addresses.
bomb is a position-independent program: the addresses in the file are offsets from the load address, the run-time address is the load address plus the offset, and the kernel chooses the load address when the program starts, differently on each run. Before the program starts gdb reads the file, so x/s 0xcb030 reads at the address in the file; after it starts, run-time addresses or symbols are needed. The gdb demo of "Preparation for the Assembly Lab" covered this point.
Address translation, page tables and the choice of the load address belong to virtual memory and are explained in a later lecture; this part uses the addresses in the figure as memory addresses.
'''
# src:
# 
# 图是 bomb 进程的地址空间，高地址在上，与第三讲「运行时栈」一页的图相同，加上了只读数据一段。各段左侧的地址是文件中的地址，由 readelf -S bomb 得到：.text 从 0xa1c0 开始，.rodata 从 0xcb000 开始，.data 从 0x103000 开始。
# 代码段 .text 存放指令，objdump -d 反汇编的就是这一段。phase_1 从 0xab8d 开始，lea 在 0xab99。
# 只读数据 .rodata 存放字符串常量等只读的数据，运行时不能写入。0xcb030 在 0xcb000 之后，属于这一段。
# 数据段 .data 与 .bss 存放全局变量。read_line 把读入的一行放在一个全局的缓冲区中（.bss），返回它的地址；phase_1 把这个地址存在自己的栈帧中（-0x8(%rbp)）。栈在高地址一端，向低地址生长。
# bomb 是位置无关的程序：文件中的地址是相对装入位置的偏移，运行时的地址等于装入位置加这个偏移，装入位置在程序启动时由内核决定，每次运行都不同。程序启动之前 gdb 读的是文件，x/s 0xcb030 按文件中的地址读；启动之后要用运行时的地址或符号。「汇编实验准备」的 gdb 演示讲过这一点。
# 地址翻译、页表与装入位置的选择属于虚拟内存，在后面的讲次中说明；本节把图中的地址当作内存地址使用。

['bomb-lea.title']
src_hash = '4f24e380'
text = 'The target of lea: the address of the next instruction plus the displacement, computed by objdump at the end of the line'
# src: lea 的目标：下一条指令的地址加偏移量，objdump 在行尾算出

['bomb-lea.slide.1']
src_hash = 'b38771e2'
text = '''
- **`%rip`-relative addressing**: a position-independent program takes the address of its data as "the address of the next instruction + a displacement"; when the load address changes, both change together and the sum still points at the same byte;
- **`# cb030 <__rseq_flags+0x2c>`**: the file address `objdump` computed, with the nearest symbol plus an offset; a string constant has no symbol of its own.
'''
# src:
# 

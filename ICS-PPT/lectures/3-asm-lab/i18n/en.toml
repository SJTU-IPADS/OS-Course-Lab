# phase_k 认为这一行错误时调用 explode_bomb：它向服务器报告阶段 k 爆炸，显示爆炸的画面，程序以状态 1 退出，不返回。
# 任务是阅读 phase_1 到 phase_8 的机器码，推出每个阶段接受的那一行。每个学号对应一个 bomb，各同学的 bomb 接受的输入不同。

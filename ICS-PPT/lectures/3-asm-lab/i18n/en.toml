['nq-q4-decl.notes.1']
src_hash = '06fbb5a5'
text = '''
The prototypes of the two functions are in include/nano_quant.h, and the header stays unchanged. For q4_0_quantize, x points at the 32 floats of one block (128 bytes) and blk at the 18 output bytes of this block; q4_0_dequantize is the reverse, blk points at 18 bytes and x at the 32 floats written back.
The figure lays the two parameters over the Q4_0 block picture of lecture 2: the first 2 bytes blk[0..1] are d as fp16, low byte first; the other 16 bytes blk[2..17] are qs, where the low 4 bits of code byte j hold the code q[j] of weight j and the high 4 bits hold q[j + 16], the code of weight j + 16. A code q is 0..15, 4 bits.
d is written with f32_to_fp16 and read back with fp16_to_f32; these two functions are part A: the q4_0 group of the checker calls f32_to_fp16 before encoding, so while part A is not done it stops there. bf16_to_f32 and rd_u64le take no part in Q4_0.
'''
# src:
# 
# 两个函数的原型在 include/nano_quant.h 中，头文件保持不变。q4_0_quantize 的 x 指向一块的 32 个 float（128 字节），blk 指向这一块输出的 18 个字节；q4_0_dequantize 反过来，blk 指向 18 个字节，x 指向写回的 32 个 float。
# 图把两个参数放在第二讲的 Q4_0 块图上：块的前 2 个字节 blk[0..1] 是 fp16 的 d，低字节在前；后 16 个字节 blk[2..17] 是 qs，第 j 个编码字节的低 4 位存第 j 个权重的编码 q[j]，高 4 位存第 j + 16 个权重的编码 q[j + 16]。编码 q 取 0..15，4 位。
# d 用 f32_to_fp16 写出、用 fp16_to_f32 读回，这两个函数是 A 部分的：q4_0 组的检查先于编码调用 f32_to_fp16，A 部分未完成时在这里停下。bf16_to_f32 与 rd_u64le 不参与 Q4_0。

['nq-q4-rule.title']
src_hash = 'f6435597'
text = 'The Q4_0 rule: the weight of largest |x| gets code 0'
# src: Q4_0 的量化规则：|x| 最大的权重对应编码 0

['nq-q4-rule.slide.1']
src_hash = '3857a492'
text = '''
- $\mathrm{amax}$: the $x_i$ of largest $|x_i|$, with its sign; the first one on a tie
- $d = \mathrm{amax} / (-8)$, $\mathrm{id} = 1/d$; $\mathrm{id} = 0$ when $d = 0$
- Codes: $q_i = \min\left(15,\ ⌊ x_i \cdot \mathrm{id} + 8.5 ⌋\right)$, $i = 0, 1, \dots, 31$, using $d$ before rounding to fp16
- Restore: $x_i = d \cdot (q_i - 8)$, with $d$ read back from the block
- Packing: `blk[2 + j] = q[j] | q[j + 16] << 4`, $j = 0, 1, \dots, 15$
'''
# src:
# 
# - $\mathrm{amax}$：$|x_i|$ 最大的 $x_i$，带符号，并列时取第一个
# - $d = \mathrm{amax} / (-8)$，$\mathrm{id} = 1/d$；$d = 0$ 时 $\mathrm{id} = 0$
# - 编码：$q_i = \min\left(15,\ ⌊ x_i \cdot \mathrm{id} + 8.5 ⌋\right)$，$i = 0, 1, \dots, 31$，用舍入到 fp16 之前的 $d$
# - 还原：$x_i = d \cdot (q_i - 8)$，$d$ 从块中读回
# - 打包：`blk[2 + j] = q[j] | q[j + 16] << 4`，$j = 0, 1, \dots, 15$

['nq-q4-rule.notes.1']
src_hash = '3b7c7270'
text = '''
The rule is written out step by step as in the header, every rounding is fixed, and one input has exactly one correct output. amax is the one of the 32 weights with the largest magnitude, with its sign, the first one when magnitudes tie; d = amax / −8, so the sign of d is opposite to that of amax; id is the reciprocal of d, 0 when d is 0. Each weight multiplied by id lands in [−8, 8], plus 8.5 lands in [0.5, 16.5], and the cast to int drops the fraction, which rounds x·id + 8 to nearest; the ⌊ ⌋ on the slide is this (int): the number cast is at least 0.5, so truncating equals rounding down; min cuts the only possible 16 down to 15. The codes use the float d before rounding to fp16.
The figure uses the six weights of lecture 2's exercise: amax = 1.40 is positive, d = −0.175, id ≈ −5.71. Code 0 corresponds to amax itself, code 8 to 0; the grid points d·(q − 8) run from 1.40 to −1.225 and move toward negative values as q grows; 11 grid points lie inside the data range [−0.4, 1.4], 5 outside. The codes of the six weights are 10, 8, 6, 5, 3, 0, the restored values −0.35, 0, 0.35, 0.525, 0.875, 1.40.
The m = 0 scheme of lecture 2's exercise takes d = largest magnitude / 7 and codes −8..7; Q4_0 divides by −8 and stores codes 0..15 as unsigned 4 bits, the weight of largest magnitude always lands on code 0, and when the largest value is positive the grid runs from −7|d| to 8|d|.
On restoring, x[i] = d · (float)(q[i] − 8), with d read back from the block, the value after the fp16 round trip.
Packing: code byte blk[2 + j] = q[j] | q[j + 16] << 4 for j = 0..15; the two bytes of d come from f32_to_fp16, the low byte in blk[0] and the high byte in blk[1].
Two global conventions: all floating-point arithmetic is in float, in the order of the header, never through double; -ffp-contract=off and -fno-fast-math in the Makefile stay as they are, they make the same code write the same bytes on different machines.
'''
# src:
# 
# 规则按头文件逐步写出，每一步取整都已固定，一个输入只有一个正确的输出。amax 是 32 个权重中绝对值最大的一个，带符号，绝对值并列时取第一个；d = amax / −8，所以 d 的符号与 amax 相反；id 是 d 的倒数，d 为 0 时取 0。每个权重先乘以 id 落在 [−8, 8]，加 8.5 后落在 [0.5, 16.5]，强制转换为 int 截断小数部分，相当于对 x·id + 8 四舍五入，页面上的 ⌊ ⌋ 写的就是这个 (int)：被转换的数不小于 0.5，截断与向下取整相同；min 把唯一可能的 16 截到 15。编码用的是舍入到 fp16 之前的 float d。
# 图用第二讲练习里的六个权重：amax = 1.40 为正，d = −0.175，id ≈ −5.71。编码 0 对应 amax 本身，编码 8 对应 0，格点 d·(q − 8) 从 1.40 到 −1.225，q 增大时格点向负方向走；数据范围 [−0.4, 1.4] 内有 11 个格点，范围外 5 个。六个权重的编码依次为 10、8、6、5、3、0，还原值 −0.35、0、0.35、0.525、0.875、1.40。
# 第二讲练习中 m = 0 的做法取 d = 最大绝对值 / 7、编码 −8..7；Q4_0 取 / −8、编码 0..15 存为无符号 4 位，绝对值最大的权重总落在编码 0，最大值为正时格点是 −7|d| 到 8|d|。
# 还原时 x[i] = d · (float)(q[i] − 8)，d 从块中读回，是 fp16 往返之后的值。
# 打包：第 j 个编码字节 blk[2 + j] = q[j] | q[j + 16] << 4，j 取 0..15；d 的两个字节由 f32_to_fp16 给出，低字节在 blk[0]、高字节在 blk[1]。
# 两条全局约定：浮点运算全部用 float，按头文件的次序计算，不经过 double；Makefile 中的 -ffp-contract=off 与 -fno-fast-math 保持不变，它们保证同一份代码在不同机器上写出相同的字节。


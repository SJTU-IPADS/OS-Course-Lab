text = '''
- `--watch`: the terminal keeps running and the browser opens `http://localhost:3030`. The demo blocks are then enabled: clicking ▶ runs the command on your machine, and its output appears in the drawer at the bottom of the page
- `--to pptx`: exports an editable PowerPoint deck
- `--pdf`: exports a PDF, which needs Chrome on the machine
- The exported files are under `ICS-PPT/build/`; the terminal prints the full path

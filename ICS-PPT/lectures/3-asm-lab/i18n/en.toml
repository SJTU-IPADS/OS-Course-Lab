src_hash = '39763b9a'
text = '''
make test-simd compiles the three programs and then runs ./ops-selftest-simd, which needs no model file. The program has three groups; every item prints one line, pass or FAIL, the last line is all passed or N failed, and the exit status is the number of failed items. The page shows the table of group 3 and the last line, taken by tail -n 8; the milliseconds and GB/s differ from machine to machine.
Group 1, "operators", checks the given operators: every operator processes the same input as the operator of the same name in scalar.c; this group passes completely before you start. Group 2, "matvec", checks your function: the matrices are 64 × 32, 64 × 96, 1000 × 2048 (two of them, one with x of magnitude 64) and 64 × 6144; 32 and 96 check a row of only one block and a row whose number of blocks is no power of 2; the scales are positive and negative, all 16 code values occur, and there are rows with d equal to 0 and subnormal. The expected value of every row is computed in double from the definition in ops.h, and the row passes when the result differs from it by at most 10⁻⁵ of Σ |W[r][c] · x[c]| for that row; a different order of accumulation gives differences of the order 10⁻⁷, while leaving out one of 2048 weights gives a difference of 1/2048, far above this bound.
Group 3, "speed", compares matvec_q4_0 of simd.c with that of scalar.c on the four matrices of the model: each runs for at least 0.2 seconds, the fastest of 3 runs counts, and it prints the milliseconds per matrix-vector product, the weight bytes read per second and the speed-up. The group passes when the speed-up on the first matrix attn_q (2048 × 2048, 2.4 MB, inside the cache) is at least 4x: an implementation that still processes one weight at a time reaches only 1.6x even under -mavx2, and a 256-bit implementation processing 32 weights per step reaches 6 to 7x. The output on the page is the reference answer on an i9-11900H (2026-10-18), speed-ups of 6.1 to 6.5x on the four matrices.
Before the function is implemented, after group 1 passes completely, the program prints matvec_q4_0 is not implemented yet at the first call of matvec_q4_0 in group 2 and exits with status 3, and make reports Error 3. Part 1 is complete when the last line is all passed.
'''

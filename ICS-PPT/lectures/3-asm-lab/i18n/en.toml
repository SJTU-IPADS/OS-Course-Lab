['pd-frame-args.notes.1']
src_hash = '29c473b0'
text = '''
Both parts write this operator: the product y = W x of a matrix W in the Q4_0 format and a float vector x. The signature of the part 1 function is on the page; the part 2 kernel takes (y, w, x, cols), and the row number comes from the index of the thread block.
The five arguments in the figure: w points to the first byte of rows rows of weights; the matrix is stored row after row, each row of cols weights takes cols / 32 × 18 bytes, and row r starts at w + r × (cols / 32 × 18); x points to cols floats, as long as one row of the matrix; y points to rows floats, as tall as the matrix. cols is a positive multiple of 32 and rows is at least 1.
The rule of the function (ops.h and docs/simd.md): for every row r write y[r] = Σ W[r][c] · x[c], c from 0 to cols − 1, where W[r][c] is weight c of row r, computed in float; the order in which the products are added is free. The scalar version accumulates in the order of c, the vector versions in 8 lanes and block by block; the two results differ only in the last few digits, and the checking program allows this difference. The function writes only the rows floats of y, reads only the rows × cols / 32 blocks of w and the cols floats of x, allocates no memory, prints nothing and does not exit.
Neither the address of w nor that of x is guaranteed to be aligned: the codes of a block start at its byte 2, whose address is in general not a multiple of 16; x is allocated by calloc or malloc, and its address is not guaranteed to be a multiple of 32.
The Q4_0 block is the same as the one written in lecture 2's lab nano-quant: bytes 0 and 1 are the scale d, a half-precision floating-point number (1 sign bit, 5 exponent bits, 10 fraction bits), low byte first; q4_0_scale(blk), given in ops.h, reads the d of block blk and returns a float, and can be called on the CPU and on the GPU. Byte 2 + j (j = 0..15) holds two codes: its low 4 bits are the code of weight j and its high 4 bits the code of weight j + 16, as drawn in the Q4_0 figure of lecture 2. A code q is 0 to 15, and the weight it stands for is d × (q − 8). For cols = 2048 a row is 64 blocks end to end, 1152 bytes in all; block b starts at byte 18b of the row and holds weights 32b to 32b + 31.
The 32 floats of x correspond to the 32 weights of a block: column c is in block c / 32, its code in byte 2 + c % 16 of that block, in the low 4 bits when c % 32 is below 16 and in the high 4 bits otherwise. In the figures of this part, the codes of weights 0 to 15 are drawn as filled blue cells and the codes of weights 16 to 31 as outlined blue cells.
'''
# src:
# 
# 两部分写的都是这个算子：Q4_0 格式的矩阵 W 与一个 float 向量 x 的乘积 y = W x。第一部分的函数签名如页面所示，第二部分的 kernel 以 (y, w, x, cols) 为参数，行号由线程块的编号给出。
# 五个参数在图上的位置：w 指向 rows 行权重的第一个字节，矩阵按行存放，每行 cols 个权重占 cols / 32 × 18 个字节，第 r 行从 w + r × (cols / 32 × 18) 开始；x 指向 cols 个 float，与矩阵的一行一样长；y 指向 rows 个 float，与矩阵一样高。cols 是 32 的正倍数，rows 不小于 1。
# 函数的规则（ops.h 与 docs/simd.md）：对每一行 r 写入 y[r] = Σ W[r][c] · x[c]，c 从 0 到 cols − 1，W[r][c] 是第 r 行第 c 个权重，以 float 计算；乘积相加的次序不限，标量版本按 c 的次序累加，向量版本分 8 路、按块累加，两者的结果只在最后几位有差别，检查程序允许这种差别。函数只写 y 的 rows 个 float，只读 w 的 rows × cols / 32 个块与 x 的 cols 个 float，不分配内存、不输出、不退出。
# w 与 x 的地址都没有对齐的保证：一个块的编码从块的第 2 个字节开始，地址一般不是 16 的倍数；x 由 calloc 或 malloc 分配，地址不保证是 32 的倍数。
# Q4_0 的块与第二讲实验 nano-quant 写出的相同：第 0、1 字节是缩放系数 d，半精度浮点数（1 位符号、5 位指数、10 位尾数），低字节在前；ops.h 给出的 q4_0_scale(blk) 读出块 blk 的 d，返回 float，CPU 与 GPU 上都可以调用。第 2 + j 字节（j = 0..15）是两个编码：低 4 位是第 j 个权重的编码，高 4 位是第 j + 16 个权重的编码，与第二讲 Q4_0 图中的画法相同。编码 q 取 0 到 15，表示的权重是 d × (q − 8)。cols = 2048 时一行是 64 个块首尾相接，共 1152 字节；第 b 个块从行首第 18b 个字节开始，存第 32b 到 32b + 31 个权重。
# x 的 32 个 float 与一个块的 32 个权重对应：第 c 列在第 c / 32 个块中，它的编码在这个块的第 2 + c % 16 个字节，c % 32 小于 16 时是低 4 位，否则是高 4 位。本节的图中，权重 0 到 15 的编码画成实心的蓝色格，权重 16 到 31 的编码画成空心的蓝色格。


['attack-task.notes.1']
src_hash = '1c713295'
text = '''
Lab attack-elf accompanies lecture 3, "machine-level representation of programs". It is not scored and belongs to the same family as bomb-lab: you are given an executable without source code and craft one line of input by reading its machine code.
The three programs are three builds of one chat program, and each turn of the dialogue is independent: the line is read, this turn's function returns, and only then does inference start, so the control-flow attack happens before inference and there is no need to wait for the model's answer.
report_pass is the pass function, and no instruction in the program refers to it. It compares its two arguments: the phase and the key; the key is a 64-bit constant that varies with the student ID, is not shown in the interface and can be read with objdump. When both are right it prints phase N passed and exits with status 0. To pass this lab: put the two numbers into %rdi and %rsi, then make control flow enter the start of report_pass.
The three programs differ in their protections, so they are passed in different ways: attack1 has an executable stack, so the return address can be rewritten to an address in the buffer and the call is made by code you write yourself — this lecture demonstrates breaking it; attack2 puts a canary in front of the return address, and its 8 bytes must first be asked out; attack3 has a non-executable stack, so the arguments and the call can only be assembled from instruction fragments already in the program. The pass function is the same in all three; only the protections differ.
The constants and the buffer sizes in the program are computed from a SHA-256 of the student ID, so they differ per student, and the addresses in the three programs differ with them. The demonstration uses the build of student ID 000000000001, the same as the bomb demonstration.
'''
# src:
# 
# 实验 attack-elf 配合第三讲「程序的机器级表示」，不计分，与 bomb-lab 同类：给出没有源码的可执行文件，阅读它的机器码构造一行输入。
# 三个程序是同一个聊天程序的三个构建，每一轮对话互相独立：读入一行、这一轮的函数返回，然后才做推理，所以控制流攻击发生在推理之前，不必等模型的回答。
# report_pass 是过关函数，程序里没有指令引用它。它比较两个参数：阶段号与口令；口令是随学号变化的 64 位常数，界面上不显示，objdump 读得到。两项都对时它打印 phase N passed，以状态 0 退出。要过这一关：先把两个数放进 %rdi 与 %rsi，再让控制流进入 report_pass 的开头。
# 三个程序的保护不同，过关的方法也不同：attack1 的栈可执行，返回地址可以改写为缓冲区里的地址，由自己写的代码完成调用，本节演示它的攻破；attack2 在返回地址之前放了金丝雀，先要问出它的 8 个字节；attack3 的栈不可执行，参数与调用只能用程序里已有的指令片段拼出来。三个阶段的过关函数相同，差别只在各自的防护。
# 程序里的常数与缓冲区大小由学号的 SHA-256 算出，每个学号不同，三个程序的地址也随之不同。演示用演示学号 000000000001 的构建，与 bomb 的演示相同。


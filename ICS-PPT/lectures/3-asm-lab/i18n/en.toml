['cpu-state.notes.1']
src_hash = '97221f91'
text = '''
The index of a general register equals its number in the machine code, so the number parsed from ModRM is used as the index directly.
flags uses five bits only: CF, PF, ZF, SF and OF, at bits 0, 2, 6, 7 and 11; the other bits stay unchanged.
A vector register is a 256-bit ymm; xmm is its low 128 bits, and writing xmm clears the high 128 bits.
d[i] of u256 is the i-th 32-bit lane, d[0] at the lowest bits, the rightmost cell in the figure.
The guest memory is managed by frame/; the physical memory is the file dram.img in the current directory. This lab accesses it only through load, store, rm_get and rm_set, by virtual address; they record page faults.
'''
# src:
# 
# 通用寄存器的下标与机器码中的寄存器编号相同，所以 ModRM 中解析出的编号直接作下标。
# flags 只用五位：CF、PF、ZF、SF、OF，位号分别是 0、2、6、7、11；其余位保持不变。
# 向量寄存器是 256 位的 ymm；xmm 是它的低 128 位，写 xmm 时高 128 位清零。
# u256 的 d[i] 是第 i 个 32 位通道，d[0] 在最低位，对应图中最右边的一格。
# 客户机内存由 frame/ 管理，物理内存是当前目录下的文件 dram.img；本实验只通过 load、store、rm_get、rm_set 按虚拟地址访问，缺页由它们记录。


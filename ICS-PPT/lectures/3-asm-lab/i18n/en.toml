['pd-rest-grid.notes.1']
src_hash = '214e0bb1'
text = '''
Part 2 writes the body of the kernel matvec_q4_0_kernel in ops/cuda.cu, which initially is one todo() call. The host function matvec_q4_0 that launches it is written: it launches rows thread blocks of THREADS = 256 threads each, with the arguments y, w, x and cols; the host function and the launch configuration are not modified.
In the figure: thread block blockIdx.x computes y[blockIdx.x], the dot product of that row of the matrix with x; the row starts at w + row × (cols / 32 × 18) and is cols / 32 Q4_0 blocks, laid out as in part 1. The rows thread blocks compute one row each and share all rows between them; the output of one block is the single float y[row]. The 256 threads of a thread block form 8 warps, and the 32 threads of a warp execute the same instruction at the same time, as on lecture 3's page "GPU architecture"; a thread's number within the thread block is threadIdx.x.
Compared with part 1: part 1 processes the rows one after another in a loop, within a row with 8 accumulator lanes added at the end by hsum8; here rows thread blocks compute one row each, and within a row 256 threads accumulate separately and are added at the end by halving in shared memory.
Before generating the first token, mini-ollama-cuda copies all weights (974 MB) into device memory with the upload of the operator table and allocates the key-value cache and the vectors in device memory with alloc; from then on the input and output of every computation are in device memory, the kernels read and write only device memory, and for each generated token the CPU fetches from the GPU only the one integer that argmax produces.
'''
# src:
# 
# 第二部分写 ops/cuda.cu 中 kernel matvec_q4_0_kernel 的函数体，它初始时是一个 todo() 调用。启动它的主机端函数 matvec_q4_0 已写好：以 rows 个线程块、每块 THREADS = 256 个线程启动，参数是 y、w、x 与 cols；主机端函数与启动配置不修改。
# 图中：第 blockIdx.x 个线程块计算 y[blockIdx.x]，即矩阵的这一行与 x 的内积；这一行从 w + row × (cols / 32 × 18) 开始，是 cols / 32 个 Q4_0 块，排布与第一部分相同。rows 个线程块各算一行，全部行由它们分担；一个块的输出只有 y[row] 一个 float。一个线程块的 256 个线程分为 8 个 Warp，每个 Warp 32 个线程同时执行同一条指令，与第三讲「GPU 架构」一页相同；线程在线程块内的编号是 threadIdx.x。
# 与第一部分的对照：第一部分用一个循环依次处理每一行，一行之内 8 路累加器、最后由 hsum8 相加；这里 rows 个线程块各算一行，一行之内 256 个线程各自累加、最后在共享内存中折半相加。

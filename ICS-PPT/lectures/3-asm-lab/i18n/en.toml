['attack-fill.notes.1']
src_hash = '0077e754'
text = '''
The animation has six frames, from an empty buffer to report_pass printing phase 1 passed. On the left is the stack frame of chat_turn, high addresses on top; on the right, where control flow is now.
Frame 1: the buffer is empty and the return address is 0x4025bc, the instruction after the call to chat_turn in main; when chat_turn returns, control goes back there.
Frame 2: the first 27 bytes of the input are the code, and they land at the low end of the buffer (offset 0); the return address is at offset 312, and the distance between the two does not depend on what the input holds.
Frame 3: 304 bytes in, the buffer is full, and nothing has been written outside it yet.
Frame 4: 16 more bytes: the 8 bytes of the saved %rbp are overwritten with 41, and the 8 bytes of the return address are rewritten to the address of the code, 0x00007fffffffd550 (the demonstration environment has ASLR off, so the address is fixed). The return address is not used yet — it has to wait for ret.
Frame 5: ret pops that address from %rbp+8 into %rip and %rsp points at %rbp+16; control flow lands on the code in the stack — an executable stack (-Wl,-z,execstack) is what makes that jump possible.
Frame 6: the code puts 1 and the key into %rdi and %rsi, and call *%rax enters report_pass at 0x01528000; it compares the two arguments, prints phase 1 passed and exits with status 0. The model generates no token at all: the ret of chat_turn has already taken control flow away.
'''
# src:
# 
# 动画六帧，从缓冲区为空到 report_pass 打印 phase 1 passed。左侧是 chat_turn 的栈帧，高地址在上；右侧是控制流的当前位置。
# 第一帧：缓冲区为空，返回地址是 main 中调用 chat_turn 的下一条指令 0x4025bc，chat_turn 返回后回到那里。
# 第二帧：输入的开头 27 字节是代码，落在缓冲区的低端（偏移 0）；返回地址在偏移 312，两者之间的距离不受输入内容影响。
# 第三帧：输入 304 字节，缓冲区填满，还没有写到缓冲区之外。
# 第四帧：再写 16 字节：保存的 %rbp 的 8 个字节被 41 覆盖，返回地址的 8 个字节被改写成代码的地址 0x00007fffffffd550（演示环境关掉了 ASLR，这个地址固定）。此时返回地址还没有被使用——它要等 ret 执行。
# 第五帧：ret 从 %rbp+8 弹出这个地址放进 %rip，%rsp 指向 %rbp+16；控制流落到栈上的代码——栈可执行（-Wl,-z,execstack）使这一跳成为可能。
# 第六帧：代码把 1 与口令放进 %rdi、%rsi，call *%rax 进入 0x01528000 的 report_pass；它比较两个参数，打印 phase 1 passed，以状态 0 退出。模型没有生成任何 Token：chat_turn 的 ret 就已经把控制流带走了。


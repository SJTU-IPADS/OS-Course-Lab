['attack-payload.slide.1']
src_hash = '21f1dffa'
text = '''
- **The return address is the address of the code in the buffer**: the 27 bytes of code sit at the low end of the buffer (offset 0), and the return address is their address;
- all 320 bytes: the saved `%rbp` is overwritten with `41`, and it is only used by `leave`; not one byte is written above the return address;
- no byte is `0x0a` (the end of the line); the stack address is read once with `gdb` in the demonstration environment.
'''
# src:
# 
# - **返回地址 = 缓冲区里代码的地址**：代码 27 字节写在缓冲区低端（偏移 0），返回地址就是它的地址；
# - 全部 320 字节：保存的 `%rbp` 被 `41` 覆盖，它在 `leave` 里才用到；返回地址之上一个字节也不写；

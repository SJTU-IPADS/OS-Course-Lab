# src:
# 
# 尝试写出 `modrm_t` 的每个字段与返回值。

['cpu-examples-1.notes.1']
src_hash = '0b9f699a'
text = '''
The first, mov (%rsp),%rdi: ModRM 3c is mod 0, reg 7, rm 100, which reads SIB 24; index 100 means no index, base 4; 2 bytes used.
The second, lea 0x8(%rsp),%rsi: mod of ModRM 74 is 01, a 1-byte displacement 08; the rest as the first; 3 bytes used.
The third, mov %rdi,%r9: B of REX 49 is 1, mod of ModRM f9 is 11, rm is register 001 plus 8, 9; 1 byte used.
None of the three adds REX.R to reg, because REX.R is 0.
'''
# src:
# 
# 第一条 mov (%rsp),%rdi：ModRM 3c 是 mod 0、reg 7、rm 100，读 SIB 24，index 100 没有变址，base 4，用掉 2 字节。
# 第二条 lea 0x8(%rsp),%rsi：ModRM 74 的 mod 是 01，1 字节偏移 08；其余与第一条相同，用掉 3 字节。
# 第三条 mov %rdi,%r9：REX 49 的 B 为 1，ModRM f9 的 mod 11，rm 是寄存器 001 加 8 得 9，用掉 1 字节。
# 三条的 reg 都不加 REX.R，因为 REX.R 为 0。


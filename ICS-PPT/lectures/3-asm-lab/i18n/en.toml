['bomb-lea.slide.1']
src_hash = 'b38771e2'
text = '''
- **`%rip`-relative addressing**: a position-independent program takes the address of its data as "the address of the next instruction + a displacement"; when the load address changes, both change together and the sum still points at the same byte;
- **`# cb030 <__rseq_flags+0x2c>`**: the file address `objdump` computed, with the nearest symbol plus an offset; a string constant has no symbol of its own.
'''
# src:
# 
# - **`%rip` 相对寻址**：位置无关的程序用「下一条指令的地址 + 偏移量」取得数据的地址；装入位置变化时两者同时变化，和仍然指向同一个字节；
# - **`# cb030 <__rseq_flags+0x2c>`**：`objdump` 算出的文件地址，与离它最近的符号加偏移；字符串常量没有自己的符号。

['bomb-lea.notes.1']
src_hash = '81abd1f3'
text = '''
lea 0xc0490(%rip),%rdx: the operand is a memory operand with %rip as the base. When this instruction executes, %rip already points at the next instruction, 0xaba0, so the effective address is 0xaba0 + 0xc0490 = 0xcb030. lea only computes the address, reads no memory, and writes 0xcb030 to %rdx.
The last 4 bytes of the machine code 48 8d 15 90 04 0c 00 are the displacement 0xc0490, stored little-endian.
In a position-independent program the instructions and the data are loaded together and the distance between them does not change with the load address, so the address of the data is taken as "the address of the next instruction + a displacement": when the load address changes, %rip changes with it and the sum still points at the same byte. The page "Implementing call and return with existing instructions" of lecture 3 and the sscanf-arguments page of "Preparation for the Assembly Lab" both showed this form.
objdump writes the sum in the comment at the end of the line: # cb030; the __rseq_flags+0x2c in the angle brackets is the symbol nearest to 0xcb030 plus an offset, unrelated to the string; a string constant has no name in the symbol table.
The bytes from 0xcb030 in .rodata are 54 68 65 20 …, the characters T h e space …, up to a byte of value 0.
'''
# src:
# 
# lea 0xc0490(%rip),%rdx：操作数是以 %rip 为基址的内存操作数。执行这条指令时 %rip 已经指向下一条指令 0xaba0，有效地址是 0xaba0 + 0xc0490 = 0xcb030。lea 只算地址，不读内存，把 0xcb030 写入 %rdx。
# 机器码 48 8d 15 90 04 0c 00 的后 4 个字节是偏移量 0xc0490，小端存放。
# 位置无关的程序中，指令与数据一起装入，两者的距离不随装入位置变化，因此用「下一条指令的地址 + 偏移量」取得数据的地址：装入位置变化时 %rip 随之变化，和仍然指向同一个字节。第三讲的「用已有的指令实现调用与返回」一页与「汇编实验准备」的 sscanf 参数一页都出现过这种写法。
# objdump 在行尾的注释中写出了这个和：# cb030；尖括号中的 __rseq_flags+0x2c 是离 0xcb030 最近的符号加偏移，与字符串无关，字符串常量在符号表中没有名字。
# .rodata 中 0xcb030 起的字节是 54 68 65 20 …，即字符 T h e 空格 …，到值为 0 的字节结束。


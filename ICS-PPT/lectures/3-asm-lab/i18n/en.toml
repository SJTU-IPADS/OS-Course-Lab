['cpu-run-fault.notes.1']
src_hash = '9383d02d'
text = '''
The released code already has the main loop, so the first run reaches the first instruction; its opcode 8b has no case, x86_other reports an illegal instruction and prints every register, with rip 401000.
objdump -d guest/hello shows mov (%rsp),%rdi at that address; add case 0x8b and rebuild.
On the next run the instruction count becomes 1 and rip becomes 401004, the lea. Add the cases in this order until hello prints its two lines; then move to the next guest program.
--max N stops the interpreter after N instructions; with -v every instruction is shown.
'''
# src:
# 
# 发布的代码已经有主循环，所以第一次运行就能到达第一条指令；它的操作码 8b 没有 case，x86_other 报告非法指令，打印全部寄存器，rip 是 401000。
# 用 objdump -d guest/hello 查这个地址，是 mov (%rsp),%rdi，补上 case 0x8b，重新编译。
# 再运行，报告的指令数变成 1，rip 变成 401004，即 lea。按这个顺序逐条补充，直到 hello 打印它的两行输出；然后换下一个客户机程序。
# --max N 让解释器执行 N 条指令后停止，配合 -v 可以看到每条指令。


['pd-frame-ops.notes.1']
src_hash = '46be56b2'
text = '''
parallel-dot follows the two ways of speeding up given in part 5 of lecture 3, "The performance bottleneck and vectorisation": one instruction completing several multiply-adds (SIMD), and using more arithmetic units (the GPU). The lab has two parts, one per approach, done in order; both are after-class exercises and neither is scored. Both parts work on the mini-ollama of lecture 3: it reads the model file q4_0.gguf in the Q4_0 format and generates the answer token by token.
The left of the figure is the framework: model.c loads the GGUF file into memory and finds every tensor by name; main.c is the loop that generates one token after another; selftest.c is the checking program. tokenizer.c, which turns the prompt into token numbers and token numbers into text, is left out of the figure. In the middle is the operator table struct ops of ops.h: each member is a function pointer, ten operators and five memory operations (init, alloc, upload, download, finish); main.c and selftest.c call the operators only through this table, and its matvec entry is the operator both parts write.
On the right are the three implementations of the table, one file each: scalar.c holds the computations of lecture 3's mini_ollama.c, processing one element at a time on one CPU thread, compiled with -fno-tree-vectorize; it is the baseline both parts are timed against and the reference of the checking programs. simd.c uses AVX2 intrinsics, 8 floats at a time; only its matvec_q4_0 is missing, and part 1 writes it. In cuda.cu every operator is a kernel; only the body of matvec_q4_0_kernel is missing, part 2 writes it, and the host function matvec_q4_0 that launches it is given.
make compiles main.c and selftest.c once per operator set, with the macro -DOPS=ops_scalar, ops_simd or ops_cuda naming the table the program uses; the object files go under build/scalar, build/simd and build/cuda. One program holds one operator set: the three mini-ollama programs read the model file, answer the question in prompt.txt and print the generation speed; the two ops-selftest programs check every function of one operator set against scalar.c and then compare the speed of matvec, and they need no model file. The commands of both parts are run in the parallel-dot/ directory.
'''
# src:
# 
# parallel-dot 配合第三讲第五部分「性能瓶颈与向量化」给出的两个提速方案：一条指令完成多次乘加（SIMD），使用更多的运算单元（GPU）。实验分两部分，依次对应两个方案，按顺序完成；两部分都是课后练习，不计分。两部分的程序都是第三讲的 mini-ollama：读取 Q4_0 格式的模型文件 q4_0.gguf，逐个 Token 生成回答。
# 图的左边是框架：model.c 把 GGUF 文件载入内存并按名字找到每个张量；main.c 是逐个 Token 生成的循环；selftest.c 是检查程序。tokenizer.c 把提示词转换为 Token 编号、把编号转换为文字，图中省略。中间是 ops.h 中的算子表 struct ops：每个成员是一个函数指针，十个算子与五项内存操作（init、alloc、upload、download、finish）；main.c 与 selftest.c 只经由这张表调用算子，表的 matvec 一项就是两部分要写的算子。
# 右边是算子表的三种实现，每种一个文件：scalar.c 是第三讲 mini_ollama.c 中的运算，在 CPU 的一个线程上每次处理一个元素，以 -fno-tree-vectorize 编译，是两部分比较速度的基准与检查程序的参照；simd.c 用 AVX2 intrinsics，每次处理 8 个 float，其中只有 matvec_q4_0 没有写，第一部分写它；cuda.cu 中每个算子是一个 kernel，其中只有 matvec_q4_0_kernel 的函数体没有写，第二部分写它，启动它的主机端函数 matvec_q4_0 已给出。
# make 把 main.c 与 selftest.c 按每套算子各编译一次，用宏 -DOPS=ops_scalar、ops_simd、ops_cuda 指明程序使用哪一张表，目标文件放在 build/scalar、build/simd、build/cuda 下。一个程序只含一套算子：三个 mini-ollama 读取模型文件、回答 prompt.txt 中的问题、输出生成速度；两个 ops-selftest 以 scalar.c 为参照检查另一套算子的每个函数，再比较 matvec 的速度，不需要模型文件。两部分的命令都在 parallel-dot/ 目录下执行。


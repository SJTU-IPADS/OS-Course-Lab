['cpu-rex.slide.1']
src_hash = '3102cf53'
text = '`x86_begin` records REX in `x.rex`, and the parameter `rex` of `modrm_decode` is that value. The two exceptions look at the 3-bit field only; the test comes before REX.B is added.'
# src:
# 
# `x86_begin` 把 REX 记在 `x.rex` 中，`modrm_decode` 的参数 `rex` 就是它。两个例外只看 3 位的字段，判断在加 REX.B 之前。

['cpu-rex.notes.1']
src_hash = '780e03eb'
text = '''
The REX prefix is 0100 W R X B: W set means a 64-bit operand; R, X and B each add a 4th bit to one field, R to reg, X to index, B to rm (with mod 11) or base. Bits 2, 1 and 0 of rex are R, X and B.
The two exceptions look at the 3-bit field only: rm 100 plus REX.B is %r12, which as a base still goes through SIB; rm 101 with mod 00 plus REX.B is still %rip-relative. index is the opposite: it is tested for 4 after REX.X is added, and %r12 can be an index.
lea -0x1(%r12),%eax of block is the example of %r12 as a base: B of REX 41 is 1, rm 100 of ModRM 44 reads SIB 24, base 100 plus 8 gives 12.
'''
# src:
# 
# REX 前缀是 0100 W R X B：W 为 1 时操作数 64 位；R、X、B 各给一个字段加第 4 位，R 给 reg，X 给 index，B 给 rm（mod 11 时）或 base。rex 的位 2、1、0 依次是 R、X、B。
# 两个例外只看 3 位的字段：rm 100 加上 REX.B 是 %r12，它作基址仍然经过 SIB；rm 101 且 mod 00 加上 REX.B 仍然是 %rip 相对。index 相反，在加 REX.X 之后判断是否为 4，%r12 可以作变址。
# block 的 lea -0x1(%r12),%eax 是 %r12 作基址的例子：REX 41 的 B 为 1，ModRM 44 的 rm 100 读 SIB 24，base 100 加 8 得 12。

['cpu-modrm-flow.title']

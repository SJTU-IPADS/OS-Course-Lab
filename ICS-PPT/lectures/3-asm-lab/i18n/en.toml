['cpu-handin.notes.1']
src_hash = '3e96a8ac'
text = '''
The code is in the directory ICS-Labs/MiniCPU of the GitHub repository SJTU-IPADS/OS-Course-Lab, obtained with git clone.
make handin lists the files in the archive, only the .c and .h under src/lab1.
Submit on Canvas; the grading unpacks it into a fresh framework and runs make check, so run it once more in a clean framework before submitting.
When the framework is updated, get the update with git pull; your own src/lab1 is not affected.
'''
# src:
# 
# 代码在 GitHub 仓库 SJTU-IPADS/OS-Course-Lab 的 ICS-Labs/MiniCPU 目录中，git clone 取得。
# make handin 列出压缩包中的文件，只有 src/lab1 下的 .c 与 .h。
# 提交到 Canvas；评测解压到一份新的框架中运行 make check，所以提交前在干净的框架里再跑一次。
# 框架有更新时用 git pull 取得，自己的 src/lab1 不受影响。

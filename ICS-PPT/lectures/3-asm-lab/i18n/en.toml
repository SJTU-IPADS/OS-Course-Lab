view renders the lecture as a web page; the last line in the terminal is the path of the page, and the browser then opens the outline. The outline is a tree of sections; the number before each line is the page number of that page in the whole deck.
To read the courseware later: open a terminal, enter the ICS-PPT directory of the courseware and run view; where .venv was created, run source .venv/bin/activate first. ls lectures lists the lectures available.

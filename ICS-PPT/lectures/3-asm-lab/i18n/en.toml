['pd-rest-threads.notes.1']
src_hash = '78a0ac48'
text = '''
This page has two kinds of block: a thread block is 256 threads and computes one row of the matrix; a Q4_0 block is 32 weights, and the 2048 columns of a row are 64 Q4_0 blocks. The 256 threads of a thread block form 8 warps of 32 threads; one round processes 256 columns, that is 8 Q4_0 blocks, each warp reads one of them, and each thread reads one column.
The division of work set by docs/cuda.md: thread t accumulates the products W[row][c] · x[c] of columns t, t + 256, t + 512, … in a register. The figure divides the 2048 columns of a row into 8 rounds of 256 columns, that is 8 Q4_0 blocks each; the first round is opened: thread t reads column t; column c is in Q4_0 block c / 32, its code is in byte 2 + c % 16 of that Q4_0 block, in the low 4 bits when c % 32 is below 16 and in the high 4 bits otherwise, and the weight is q4_0_scale(block) × (code − 8). q4_0_scale can also be called on the GPU; the way embed_kernel takes one code out of a Q4_0 block is needed here too.
In the second round the same 256 threads process columns 256 to 511, and so on; after 8 rounds each thread has accumulated 8 products; for cols = 6144 it is 24 rounds.
The 32 threads of one warp process 32 neighbouring columns, that is one Q4_0 block: they read neighbouring bytes and neighbouring floats, which is the condition for coalesced access to device memory.
Each thread's partial sum is in its own register; the 256 partial sums are added into y[row] by the halving in shared memory.
'''
# src:
# 
# 这一页有两种「块」：线程块是 256 个线程，计算矩阵的一行；Q4_0 块是 32 个权重，一行 2048 列是 64 个 Q4_0 块。一个线程块的 256 个线程分为 8 个 Warp，每个 Warp 32 个线程，一轮处理 256 列，即 8 个 Q4_0 块，每个 Warp 读其中一个，每个线程读一列。
# docs/cuda.md 规定的分工：线程 t 在寄存器中累加第 t、t + 256、t + 512、… 列的乘积 W[row][c] · x[c]。图中把一行的 2048 列分为 8 轮，每轮 256 列，即 8 个 Q4_0 块；第一轮展开：线程 t 读第 t 列，第 c 列在第 c / 32 个 Q4_0 块中，它的编码在这个 Q4_0 块的第 2 + c % 16 个字节，c % 32 小于 16 时是低 4 位，否则是高 4 位，权重是 q4_0_scale(块) × (编码 − 8)。q4_0_scale 在 GPU 上也可以调用；embed_kernel 中从 Q4_0 块中取出一个编码的写法，这里也要用到。
# 第二轮同样的 256 个线程处理列 256 到 511，依此类推，8 轮之后每个线程累加了 8 个乘积；cols = 6144 时是 24 轮。
# 同一个 Warp 的 32 个线程处理相邻的 32 列，即同一个 Q4_0 块：它们读的是相邻的字节与相邻的 float，这是显存访问合并的条件。
# 每个线程的部分和在自己的寄存器中；256 个部分和如何相加为 y[row]，由共享内存中的折半求和完成。

['pd-rest-fold.title']
src_hash = '3308d0d6'
text = 'Halving in a block: 256 partial sums are added into 1 in 8 steps'
# src: 块内折半求和：256 个部分和 8 步相加为 1 个

['pd-rest-fold.notes.1']
src_hash = '60a7be35'
text = '''
Every thread writes its partial sum into element t of the shared array part, and after __syncthreads() the halving starts: in step 1 the threads t < 128 add part[t + 128] to part[t], then __syncthreads(); in step 2 the threads t < 64 add part[t + 64] to part[t]; in every step the first half of the threads add the elements of the second half to their own, the number of elements taking part is 256, 128, …, 2 in turn, 8 steps in all, after which part[0] is the sum of the 256 partial sums and thread 0 writes it to y[row].
__syncthreads() makes every thread of the thread block wait at that line until all threads of the thread block have reached it: the one after the writes to part guarantees that all 256 partial sums are stored, and the one after each step guarantees that the additions of that step are finished and the next step reads the new values.
It is the same as the halving in dot_kernel of lecture 3's dot_cuda.cu; the rmsnorm_kernel given in cuda.cu first lets every thread accumulate the squares of every 256th element and then halves in shared memory, exactly the way this kernel needs, and softmax_kernel halves twice in the same way.
Compared with part 1: the hsum8 of part 1 adds the 8 accumulator lanes into one number, and here the 256 partial sums are added into one number; both add in pairs at every step, halving the number of values.
'''
# src:
# 
# 每个线程把自己的部分和写入共享数组 part 的第 t 个元素，__syncthreads() 之后开始折半：第一步线程 t < 128 把 part[t + 128] 加到 part[t] 上，__syncthreads()；第二步线程 t < 64 把 part[t + 64] 加到 part[t] 上；每一步前一半的线程把后一半的元素加到自己的元素上，参与相加的元素个数依次是 256、128、…、2，共 8 步，之后 part[0] 是 256 个部分和之和，线程 0 把它写入 y[row]。
# __syncthreads() 使线程块内的每个线程在这一行等待，直到线程块内全部线程都到达这一行：写入 part 之后的一次保证 256 个部分和都已存入，每一步之后的一次保证这一步的加法都已完成，下一步读到的是新值。
# 与第三讲 dot_cuda.cu 中 dot_kernel 的折半相加相同；cuda.cu 中已给出的 rmsnorm_kernel 先让每个线程累加每第 256 个元素的平方、再在共享内存中折半求和，正是这个 kernel 要用的写法，softmax_kernel 用同样的写法折半两次。
# 与第一部分的对照：第一部分的 hsum8 把 8 路累加器相加为一个数，这里把 256 个部分和相加为一个数，两者都是每一步两两相加，使数的个数减半。


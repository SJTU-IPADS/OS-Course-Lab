['nq-rest-q4-k.title']
src_hash = 'f35514eb'
text = 'Homework · Q4_K: 256 weights form a super-block, quantized in two levels'
# src: 课后 · Q4_K：256 个权重组成一个超块进行二次量化

['nq-rest-q4-k.slide.1']
src_hash = 'fd0b7161'
text = '- The formulas of the three steps are in the comment of `q4_k_quantize`; check with `./nq-selftest q4_k`'
# src:
# 
# - 三步的公式在 `q4_k_quantize` 的注释，通过 `./nq-selftest q4_k` 检查正确性

['nq-rest-q4-k.notes.1']
src_hash = '6cc97190'
text = '''
Q4_K takes 256 weights as one super-block of 8 sub-blocks of 32. The weights of sub-block j are represented as x ≈ D[j]·q − M[j], the same form as Q4_1; D[j] and M[j] are quantized once more, written as the product of an fp16 coefficient shared by the super-block and a 6-bit integer of the sub-block: D[j] = d·sc[j], M[j] = dmin·m[j]. A super-block is 144 bytes: d and dmin 4 bytes, the scales 12 bytes, the codes 128 bytes, 4.5 bits per weight, the same as Q4_0.
q4_k_quantize has three steps, numbered as in the header. Step 1 calls the framework's nq_q4_k_fit(x + 32·j, &s[j], &o[j]) for each sub-block; it searches 21 candidate steps by weighted least squares and gives s[j] ≥ 0 and o[j] ≥ 0, the formula is in part B of the README, and this step is only a call. Step 2 takes the largest S of the 8 s[j] and the largest O of the 8 o[j], d = S/63, dmin = O/63, is = S > 0 ? 63/S : 0, likewise io, sc[j] = nq_round(is·s[j]), m[j] = nq_round(io·o[j]), all in 0..63; d and dmin are written into blk[0..3] with f32_to_fp16, the 8 pairs (sc, m) into blk[4..15] with put_scale_min. Step 3 recomputes the codes from the values read back on restoring: D = fp16_to_f32(f32_to_fp16(d))·sc[j], likewise M, q[i] = D ≠ 0 ? clamp(nq_round((x[i] + M) / D), 0, 15) : 0.
The code section is in groups of 64 weights, 32 bytes each: in group g, the low 4 bits of byte l hold code l of sub-block 2g and the high 4 bits code l of sub-block 2g + 1, a pairing different from the j, j + 16 of Q4_0. Restoring: x[i] = (d·sc[j])·q[i] − dmin·m[j], computed in the order of the parentheses.
round is always nq_round (to nearest, ties to even); (int)(x + 0.5f) differs from it on negative values and on ties. Check: ./nq-selftest q4_k, which also runs the scale_min group.
The 12 scale bytes hold 8 sc and 8 m of 6 bits each, 96 bits, no bit spare. The first 4 pairs each take the low 6 bits of one byte: bits 5..0 of scales[k] are sc[k], bits 5..0 of scales[k+4] are m[k]. The other 4 pairs are split in two: the high 2 bits go into bits 7..6 of the first 8 bytes, bits 7..6 of scales[k] are bits 5..4 of sc[k+4] and bits 7..6 of scales[k+4] are bits 5..4 of m[k+4]; the low 4 bits go into scales[k+8], bits 3..0 for sc[k+4] and bits 7..4 for m[k+4]. k is 0..3.
get_scale_min, given in impl/nano_quant.cpp, reads pair j by this layout; you implement its inverse put_scale_min: after writing pair j, get_scale_min reads back the values just written for pair j, and the other 7 pairs keep their values. In the check the 12 bytes start with arbitrary values and the 8 pairs are written in a different order each round, 64 × 64 rounds in all, so writing pair j must change only the bits that belong to this pair: clear these bits first, then or the values in.
Check: ./nq-selftest scale_min, one line scale_min ok matches; the q4_k group includes it automatically.
'''
# src:
# 
# Q4_K 以 256 个权重为一个超块，分 8 个子块各 32 个。子块 j 的权重表示为 x ≈ D[j]·q − M[j]，与 Q4_1 的形式相同；D[j] 与 M[j] 再量化一次，写作超块共用的 fp16 系数与子块的 6 位整数之积：D[j] = d·sc[j]，M[j] = dmin·m[j]。一个超块 144 字节：d、dmin 4 字节，缩放段 12 字节，编码 128 字节，4.5 位/权重，与 Q4_0 相同。
# q4_k_quantize 分三步，编号与头文件相同。第 1 步对每个子块调用框架提供的 nq_q4_k_fit(x + 32·j, &s[j], &o[j])，它用加权最小二乘在 21 个候选步长中搜索，求出 s[j] ≥ 0 与 o[j] ≥ 0，公式在 README 的 B 部分，这一步只需调用。第 2 步取 8 个 s[j] 中最大的 S 与 8 个 o[j] 中最大的 O，d = S/63，dmin = O/63，is = S > 0 ? 63/S : 0，io 同理，sc[j] = nq_round(is·s[j])，m[j] = nq_round(io·o[j])，都落在 0..63；d 与 dmin 用 f32_to_fp16 写入 blk[0..3]，8 对 (sc, m) 用 put_scale_min 写入 blk[4..15]。第 3 步按还原时读到的值重新计算编码：D = fp16_to_f32(f32_to_fp16(d))·sc[j]，M 同理，q[i] = D ≠ 0 ? clamp(nq_round((x[i] + M) / D), 0, 15) : 0。
# 编码段以 64 个权重为一组，每组 32 字节：第 g 组的第 l 个字节低 4 位存子块 2g 的第 l 个编码，高 4 位存子块 2g + 1 的第 l 个编码，与 Q4_0 的 j、j + 16 配对不同。还原 x[i] = (d·sc[j])·q[i] − dmin·m[j]，按括号的次序计算。
# round 一律用 nq_round（就近舍入，平局取偶），(int)(x + 0.5f) 在负数与平局处与它不同。检查：./nq-selftest q4_k，同时运行 scale_min 组。
# 缩放段 12 个字节放 8 个 sc 与 8 个 m，各 6 位，共 96 位，没有空位。前 4 对各占一个字节的低 6 位：scales[k] 的位 5..0 是 sc[k]，scales[k+4] 的位 5..0 是 m[k]。后 4 对各拆成两段：高 2 位放在前 8 个字节的位 7..6，scales[k] 的位 7..6 是 sc[k+4] 的位 5..4，scales[k+4] 的位 7..6 是 m[k+4] 的位 5..4；低 4 位放在 scales[k+8]，位 3..0 是 sc[k+4] 的、位 7..4 是 m[k+4] 的。k 取 0..3。
# impl/nano_quant.cpp 中给出的 get_scale_min 按这个排布读出第 j 对；你实现与它互逆的 put_scale_min：写入第 j 对之后，get_scale_min 读出第 j 对得到刚写入的值，其余 7 对保持原值。检查时 12 个字节的初值是任意的，8 对的写入次序每轮不同，共 64 × 64 轮，因此写入第 j 对时只改动属于这一对的位：先清掉这些位，再按位或写入。
# 检查：./nq-selftest scale_min，一行 scale_min ok matches；q4_k 组自动包含它。


['nq-pipeline.notes.1']
src_hash = '9b4c5d50'
text = '''
nano-quant is the lab of lecture 2: the 310 language-model tensors of Qwen3-VL-2B-Instruct's model.safetensors (4.25 GB, 625 BF16 tensors) are quantized to 4 bits, assembled into a GGUF, and loaded and run by ollama; the 315 tensors of the vision tower are all skipped.
Four programs run in turn: nano-quant quant reads the safetensors, quantizes block by block according to the recipe, and writes the .nq (the quantized tensor data area plus a directory); tools/mkmeta.py turns config.json and tokenizer.json into meta.kv, the key-value section of the GGUF, 24 pairs; nq2gguf assembles the two into the GGUF; ollama create and ollama run load it and answer a prompt.
The framework provides the command line, the file I/O, the choice of tensors, the format and GGUF name of every tensor, the row-wise quantization loop, the Q6_K format, the GGUF assembly and all the checkers. What you write is only the functions of impl/nano_quant.cpp that concern the representation of data: combining bytes, converting floating-point formats, encoding and restoring the three quantization formats. All three programs nano-quant, nq2gguf and nq-selftest link this file; nano-quant and nq-selftest are the ones that call its functions.
The lab is homework and is not graded; every part has a checker, and output equal to the expected values shows that the part is correct. The sizes in the figure are those of the q4_k_m recipe: data area 1 101 457 408 bytes, GGUF 1 107 404 384 bytes.
'''
# src:
# 
# nano-quant 是第二讲的配套实验：把 Qwen3-VL-2B-Instruct 的 model.safetensors（4.25 GB，625 个 BF16 张量）中语言模型的 310 个张量量化为 4 位，组装为 GGUF，由 ollama 加载运行；视觉塔的 315 个张量全部跳过。
# 四个程序接力：nano-quant quant 读 safetensors，按配方逐块量化，写出 .nq（量化后的张量数据区加一个目录）；tools/mkmeta.py 从 config.json 与 tokenizer.json 生成 GGUF 的键值段 meta.kv，24 个键值对；nq2gguf 把两者组装为 GGUF；ollama create 与 ollama run 加载它回答提示词。
# 框架给出命令行、文件读写、张量的选择、每个张量的格式与 GGUF 名字、按行量化的循环、Q6_K 格式、GGUF 组装与全部检查程序。你写的只有 impl/nano_quant.cpp 中与数据表示有关的函数：字节的组合、浮点格式的转换、三种量化格式的编码与还原。三个程序 nano-quant、nq2gguf、nq-selftest 都链接这个文件，调用其中函数的是 nano-quant 与 nq-selftest。
# 实验是课后练习，不计分；每一部分配有检查程序，输出与期望值一致说明这一部分正确。图中的大小是 q4_k_m 配方的：数据区 1 101 457 408 字节，GGUF 1 107 404 384 字节。


# - **生成速度由 `matvec_q4_0` 决定**：每次调用读取一个矩阵的全部权重，一个 Token 共 1.7 × 10⁹ 个。实测在 CPU 上运行时，时间占用在 99% 以上、在 GPU 上运行时，kernel 的时间占用也在 94% 左右。

['pd-frame-token.notes.1']
src_hash = '960f42f7'
text = '''
How main.c generates one token: embed takes the row of token_embd for this token and decodes it into 2048 floats, which become x; x passes through the 28 layers in turn, in each layer first the attention part and then the feed-forward part; finally next_token computes a score for every token with the output layer, and argmax takes the one with the highest score as the next token.
The attention part of each layer calls matvec 4 times: attn_q, attn_k and attn_v turn the normalised x into the query, the key and the value, and attn_output turns the result of the heads back into 2048 dimensions; the feed-forward part calls it 3 times: ffn_gate and ffn_up turn 2048 dimensions into 6144, and after swiglu, ffn_down turns them back into 2048. The 28 layers make 196 calls, the output layer 1, 197 in all.
Every matrix in the figure is drawn to one scale: attn_q and attn_output are 2048 × 2048; attn_k and attn_v are 1024 × 2048, the model having 16 query heads and 8 key-value heads of 128 dimensions each; ffn_gate and ffn_up are 6144 × 2048; ffn_down is 2048 × 6144, and the vector it multiplies is 6144 long. The output layer shares token_embd with the embedding, 151936 × 2048, 74 times as tall as attn_q at this scale, cut in the figure.
So the cols that matvec_q4_0 receives in mini-ollama is only ever 2048 or 6144, and rows is one of 1024, 2048, 6144 and 151936. Generating one token computes the dot products of 28 × 20480 + 151936 = 725376 rows; every weight of every matrix takes part in one multiply-add, about 1.7 × 10⁹ of them. The checking program also uses matrices of 32 and 96 columns to check the block boundaries.
The other operators work on vectors: embed, rmsnorm, rope, swiglu and add on 1024 to 6144 floats per call, argmax once per token on 151936 floats; attn_scores and attn_values read the attention caches, 1024 floats per token processed so far, growing with the number of tokens. On 2026-10-19 every entry of the operator table was timed on this machine (reference solutions, prompt.txt: a prompt of 13 tokens and an answer of 16 tokens): matvec takes 99.7% of the running time of both the scalar and the AVX2 version, and 93.9% of the kernel time on the GPU as counted by nsys. With a prompt of 400 tokens the two attention operators grow to 3.4% of the AVX2 running time and 5.8% of the GPU kernel time, and matvec still takes 96.3% and 89.2%.
'''
# src:
# 
# main.c 生成一个 Token 的过程：embed 取 token_embd 中这个 Token 的一行，还原为 2048 个 float，作为 x；x 依次经过 28 层，每层先是注意力部分，再是前馈部分；最后 next_token 用输出层算出每个 Token 的分数，argmax 取分数最高的一个作为下一个 Token。
# 每层的注意力部分调用 4 次 matvec：attn_q、attn_k、attn_v 把归一化后的 x 变为查询、键、值，attn_output 把各头的结果变回 2048 维；前馈部分调用 3 次：ffn_gate 与 ffn_up 把 2048 维变为 6144 维，swiglu 之后 ffn_down 变回 2048 维。28 层共 196 次，输出层 1 次，合计 197 次。
# 图中每个矩阵按同一个比例画出：attn_q 与 attn_output 是 2048 × 2048；attn_k 与 attn_v 是 1024 × 2048，模型有 16 个查询头、8 个键值头，每头 128 维；ffn_gate 与 ffn_up 是 6144 × 2048；ffn_down 是 2048 × 6144，它乘的向量长 6144。输出层与词嵌入共用 token_embd，151936 × 2048，按这个比例高度是 attn_q 的 74 倍，图中截断。
# 因此 mini-ollama 中 matvec_q4_0 收到的 cols 只有 2048 与 6144 两种，rows 有 1024、2048、6144 与 151936 四种。生成一个 Token 要算 28 × 20480 + 151936 = 725376 行的内积，全部矩阵的每个权重各参与一次乘加，约 1.7 × 10⁹ 次。检查程序另用 32 与 96 列的矩阵检查块的边界。
# 其他算子处理的是向量：embed、rmsnorm、rope、swiglu、add 每次 1024 到 6144 个 float，argmax 每个 Token 一次、151936 个 float；attn_scores 与 attn_values 读取注意力的缓存，每个已处理的 Token 1024 个 float，随 Token 数增长。2026-10-19 在本机给算子表的每一项计时（参考答案，prompt.txt：13 个 Token 的提示词，回答 16 个 Token）：matvec 占标量版本与 AVX2 版本运行时间的 99.7%；GPU 上占 nsys 统计的 kernel 时间的 93.9%。提示词为 400 个 Token 时，注意力的两个算子增长到 AVX2 版本运行时间的 3.4%、GPU kernel 时间的 5.8%，matvec 仍占 96.3% 与 89.2%。


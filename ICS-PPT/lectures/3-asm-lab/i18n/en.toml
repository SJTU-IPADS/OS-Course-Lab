['kit-install.notes.1']
src_hash = '1e8d793e'
text = '''
The courseware is in the GitHub repository SJTU-IPADS/OS-Course-Lab. The ICS-PPT directory holds the courseware itself and lecturekit, the tool that renders it as slides. The courseware is a set of Python source files; each subdirectory of lectures is one lecture.
Three tools are needed: Git downloads the courseware and later synchronizes its updates; Python, version 3.12 or later, runs lecturekit; Node.js provides npm, which installs Marp, the tool that compiles the slides into a web page. On Windows and macOS the installers are downloaded from the official sites; on Ubuntu one apt command installs all three. When installing Python on Windows, check Add python.exe to PATH. After the installation, open a new terminal; only a new terminal finds these commands.
The four commands are: download the whole repository, about 900 MB; enter the ICS-PPT directory; install lecturekit and the Python libraries it depends on; install Marp under ICS-PPT/node_modules. The last two run only once.
Ubuntu does not allow libraries to be installed directly into the system Python, and neither does a Python installed with Homebrew on macOS, so a separate Python environment .venv is created in the courseware directory first and lecturekit is installed into it; once it is activated, the prompt starts with (.venv). A Python installed with the python.org installer has no such restriction; the macOS part of the tutorial installs directly without .venv, and either way works.
For slow downloads, git clone with --depth 1 downloads only the latest version without its history; pip install with -i https://pypi.tuna.tsinghua.edu.cn/simple and npm install with --registry=https://registry.npmmirror.com use mirrors in China.
The tutorial has three parts, for Windows, macOS and Ubuntu; every step has screenshots and the output to expect, and a list of common problems closes it; tut-lecturekit.pdf in the same directory is the PDF compiled from it, and the link on the page points to this file.
'''
# src:
# 
# 课件放在 GitHub 仓库 SJTU-IPADS/OS-Course-Lab 中，ICS-PPT 目录是课件本身和把它渲染成幻灯片的工具 lecturekit。课件是一组 Python 源文件，lectures 下每个子目录是一讲。
# 需要三个工具：Git 下载课件并在之后同步更新，Python 运行 lecturekit，版本在 3.12 及以上，Node.js 提供 npm，用来安装把幻灯片编译成网页的 Marp。Windows 与 macOS 从各自的官网下载安装程序，Ubuntu 用 apt 一次装完。Windows 上安装 Python 时要勾选 Add python.exe to PATH。装好之后重新打开终端，新的终端才能找到这些命令。
# 四条命令依次是：下载整个仓库，约 900 MB；进入 ICS-PPT 目录；安装 lecturekit 与它依赖的 Python 库；把 Marp 安装到 ICS-PPT/node_modules 下。后两条只需运行一次。
# Ubuntu 不允许往系统自带的 Python 中直接安装库，macOS 上用 Homebrew 安装的 Python 也是这样，所以先在课件目录中建立一个独立的 Python 环境 .venv，lecturekit 装在这个环境中；启用后提示符前面多出 (.venv)。用 python.org 的安装程序装的 Python 没有这个限制，教程的 macOS 部分直接安装，不建 .venv，两种做法都可以。
# 下载慢时，git clone 加 --depth 1 只下载最新版本，不含历史记录；pip install 加 -i https://pypi.tuna.tsinghua.edu.cn/simple，npm install 加 --registry=https://registry.npmmirror.com，改用国内的镜像源。
# 教程按 Windows、macOS、Ubuntu 分成三部分，每一步有截图与应当看到的输出，最后是常见问题；同一个目录中的 tut-lecturekit.pdf 是它编译出的 PDF，页面上的链接指向这个文件。


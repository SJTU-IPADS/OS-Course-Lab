['pd-class-mac.notes.1']
src_hash = 'c7882cb2'
text = '''
This is step 4 of the TODO comment, the float version of lecture 3's page "One round of the vector loop: 8 lanes multiply at once, add at once". The top two rows are the operands: the 8 floats in a %ymm, that is one group of 8 codes minus 8, written q0-32 as on the page before, the suffix being the width in bits; and the corresponding 8 floats of x, read by _mm256_loadu_ps(x + c + 8g), an unaligned load because the address of x has no alignment guarantee. _mm256_mul_ps completes 8 multiplications in one instruction, the 8 products in one register; _mm256_add_ps adds the 8 products to the 8 partial sums of bsum in one instruction. Lane 0 is at the right, as in the figures of lecture 3.
A block has 4 groups, and these two instructions each run 4 times: every lane of bsum accumulates 4 products, lane k those of weights k, 8 + k, 16 + k and 24 + k, and all 32 weights of the block are counted. bsum is cleared before a block (_mm256_setzero_ps), or the first group initialises it with its products directly.
Then comes step 5: bsum is multiplied by d (_mm256_set1_ps copies d into the 8 lanes, _mm256_mul_ps multiplies) and _mm256_add_ps accumulates it into the row's 8 accumulator lanes acc. Lecture 3's vector loop processes 8 ints per round; here each block processes 32 weights with 4 multiplications and 4 additions, then 1 more multiplication and 1 more addition.
The Makefile compiles simd.c with -O2 -mavx2 and without -mfma: the lectures go as far as AVX2, and fused multiply-add gains very little in these operators.
'''
# src:
# 
# 这是 TODO 注释的第四步，第三讲「一轮向量循环：8 个通道同时乘、同时加」一页的 float 版本。上面两行是操作数：一个 %ymm 中的 8 个 float，即一组 8 个编码减 8 的结果，与上一页相同写作 q0-32，后缀是位数；x 中对应的 8 个 float，由 _mm256_loadu_ps(x + c + 8g) 读入，x 的地址没有对齐的保证，用非对齐加载。_mm256_mul_ps 一条指令完成 8 次乘法，8 个积放在一个寄存器中；_mm256_add_ps 一条指令把 8 个积加到 bsum 的 8 路部分和上。通道 0 在最右边，与第三讲的图相同。
# 一个块有 4 组，这两条指令各做 4 次：bsum 的每一路累加 4 个积，第 k 路累加权重 k、8 + k、16 + k、24 + k 的积，块的 32 个权重全部计入。bsum 在处理一个块之前清零（_mm256_setzero_ps），或者第一组直接用乘积初始化。
# 之后是第五步：bsum 乘以 d（_mm256_set1_ps 把 d 复制到 8 路，_mm256_mul_ps 相乘），_mm256_add_ps 累加到行的 8 路累加器 acc。第三讲的向量循环每轮处理 8 个 int；这里每个块处理 32 个权重，用 4 次乘、4 次加、再 1 次乘、1 次加。
# Makefile 以 -O2 -mavx2 编译 simd.c，不加 -mfma：讲义讲到 AVX2 为止，融合乘加在这些算子中的收益很小。


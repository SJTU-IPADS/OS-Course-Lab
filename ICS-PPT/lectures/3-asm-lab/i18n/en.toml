# - `--watch`：终端保持运行，浏览器打开 `http://localhost:3030`。此时演示方块的演示功能被启用，点击 ▶，命令将在本机运行，输出显示在页面底部 drawer 中
# - `--to pptx`：导出可编辑的 PowerPoint
# - `--pdf`：导出 PDF，需要本机装有 Chrome

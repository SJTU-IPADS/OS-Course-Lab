['nq-rest-a.slide.1']
src_hash = '21328ef7'
text = '''
- `rd_u64le` reads the header length; with the bytes in the wrong order `nano-quant` reports `header length ... is impossible`
- `f32_to_fp16` rounds to nearest, ties to even; the fp16 fields of all three formats are written by it
- Check: `./nq-selftest a`, one line `ok  matches` per item
'''
# src:
# 
# - `rd_u64le` 读头长度，字节顺序写反时 `nano-quant` 报告 `header length ... is impossible`
# - `f32_to_fp16` 就近舍入、平局取偶，三种格式的 fp16 字段都由它写出
# - 检查：`./nq-selftest a`，四项各一行 `ok  matches`

['nq-rest-a.notes.1']
src_hash = '184cddc4'
text = '''
Part A is four functions, and the figure shows where each is called.
rd_u64le combines 8 bytes into a 64-bit integer in little-endian order, p[0] being the lowest byte, with shifts and bitwise or; a uint8_t is promoted to int before a shift, so it must be converted to a 64-bit type before shifting by 32 or more. The framework uses it to read the header length N of the safetensors; for the model file of this lab N = 76240. With the bytes in the wrong order the value read is larger than the file, and nano-quant reports header length ... is impossible with a hint to check the shift direction.
bf16_to_f32 is one shift: the 16 bits of BF16 are the high 16 bits of FP32, the sign and exponent are the same, and the 7 mantissa bits are the high 7 bits of the FP32 mantissa. The framework calls it on every weight it reads.
fp16_to_f32 combines the three fields 1-5-10; its input falls into four classes, normal, subnormal, zero, infinity and NaN. f32_to_fp16 rounds to nearest, ties to even; values out of range become infinity, values too small become subnormal or zero. The fp16 fields of all three quantization formats are written by f32_to_fp16, and one rounding error in it makes the whole quantization differ from the expected values, so the checker compares it with the framework's own implementation value by value: by default every 251st float, with --full all 2^32 floats, about 15 seconds; it also requires that every value exactly representable in half precision survive the round trip unchanged.
Check: ./nq-selftest a, one line ok matches per item, in the order bf16_to_f32, f32_to_fp16, fp16_to_f32, rd_u64le. Item 2 of make test reads the headers of the two sample files with rd_u64le: the little-endian one must be accepted and the big-endian one refused.
'''
# src:
# 
# A 部分是四个函数，它们在图中各有调用的位置。
# rd_u64le 把 8 个字节按小端组合为 64 位整数，p[0] 是最低字节，用移位与按位或；uint8_t 参与移位之前提升为 int，左移 32 位及以上时要先转换为 64 位类型。框架用它读 safetensors 的头长度 N，本实验的模型文件 N = 76240；字节顺序写反时读出的数值大于文件长度，nano-quant 报告 header length ... is impossible 并提示检查移位方向。
# bf16_to_f32 是一次移位：BF16 的 16 位就是 FP32 的高 16 位，符号与阶码相同，7 位尾数是 FP32 尾数的高 7 位。框架读入每个权重时调用它。
# fp16_to_f32 按 1-5-10 三个字段组合，输入分为正规数、次正规数、零、无穷与 NaN 四类。f32_to_fp16 就近舍入、平局取偶，超出范围的值变为无穷，过小的值变为次正规数或零。三种量化格式的 fp16 字段都由 f32_to_fp16 写出，它的一处舍入错误会使整个量化结果与期望值不一致，所以检查程序把它与框架自带的实现逐个对照：默认按步长 251 抽取 float，--full 遍历全部 2^32 个 float，约 15 秒；并要求半精度能精确表示的每个值往返后不变。
# 检查：./nq-selftest a，四项各一行 ok matches，依次是 bf16_to_f32、f32_to_fp16、fp16_to_f32、rd_u64le。make test 的第 2 项用 rd_u64le 读两个样例文件的头：小端写入的必须被接受，大端写入的必须被拒绝。


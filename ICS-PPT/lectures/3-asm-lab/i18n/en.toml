['attack-submit.notes.1']
src_hash = 'fda217ce'
text = '''
make remoteN is implemented by tools/submit.py: it reads the bytes in answers/attackN.txt and sends them to the server together with the student ID and the phase; the server hands them to its checking copy of the program on standard input and sees whether it exits with status 0 having printed phase N passed. If so it records the phase and replies with the line phase N: pass (exit 0); you have cleared K/3; on failure the parentheses hold fail (signal 6) or the like: the result and the way the run ended are both in there.
The program on the server is the build of the same student ID, but phase 2 pins the canary of the server while the local copy pins another fixed value, so a phase 2 passed locally is caught by the canary on the server; phases 1 and 3 have no canary and are the same on both sides. The check runs in a sandbox with no network, and the program does not use the network either, so no further records are made while it runs.
The scoreboard is the same as the bomb one: rank, student (your own row shows the full student ID, others only an anonymous code), the number of phases passed, then one cell per phase: a passed phase is #, an unpassed one is ., and a passed cell carries a * when there is no colour; the meaning of the symbols is given on the line below the table. The end of the table gives the number of students and your own row.
After submitting, look at the scoreboard once to confirm that your row has the phase marked.
'''
# src:
# 
# make remoteN 由 tools/submit.py 实现：读出 answers/attackN.txt 中的字节，连同学号与阶段号发给服务器；服务器把它们交给复核用的那份程序，用标准输入喂进去，看它是否以状态 0 退出并打印了 phase N passed，是则记录这一阶段，回复一行 phase N: pass (exit 0); you have cleared K/3；失败时括号里是 fail (signal 6) 之类，结果与这一跑的结束方式都在里面。
# 服务器上的程序是同一个学号的构建，但阶段 2 钉的是服务器的金丝雀，本机那份钉另一个固定值，所以在本机过掉的阶段 2 到服务器上会被金丝雀拦下；阶段 1 与阶段 3 没有金丝雀，两侧相同。复核在沙箱里进行，没有网络，程序也不联网，所以复核期间不会再有记录。
# 计分榜与 bomb 的相同：名次、学生（自己的一行是完整学号，别人只显示匿名代号）、已过的阶段数，之后每个阶段一格：已过的为 #，未过的为 .，没有颜色时已过的一格带一个 *；符号的含义在表下一行。表的末尾给出学生总数与自己所在的行。
# 提交之后先看一遍计分榜，确认自己的一行已标出这一阶段。


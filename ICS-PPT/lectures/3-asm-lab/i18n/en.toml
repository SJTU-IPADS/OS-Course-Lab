# src: 评测的规则：可改的文件、源文件检查与运行环境

['cpu-rules.slide.1']
src_hash = 'e73e08b5'
text = '''
- **Files that may change**: the three files under `src/lab1/`; changes to `frame/`, `include/` and the `Makefile` have no effect in grading, and new helper functions go into these three files
- **Source check**: only the names listed in `tests/symbols.txt` are used, defined names do not begin with `__`, code is in `.text` only, and there is no `syscall`; when it fails, no item runs
- **Run limits**: 120 seconds per item; `tests/`, `tools/` and `guest/*.txt` are read-only during grading
- **Environment**: x86-64 Linux; on Windows the lab is done in WSL2; on arm64 macOS use an x86-64 Linux container (`docker run --platform linux/amd64`) or the course server
'''
# src:
# 
# - **可改的文件**：`src/lab1/` 下的三个文件；`frame/`、`include/` 与 `Makefile` 的修改在评测时不生效，新的辅助函数写在这三个文件中
# - **源文件检查**：只用 `tests/symbols.txt` 列出的名字，定义的名字不以 `__` 开头，代码只在 `.text` 中，没有 `syscall`；不通过时一项也不运行
# - **运行限制**：每项 120 秒；`tests/`、`tools/` 与 `guest/*.txt` 在评测期间只读
# - **环境**：x86-64 Linux；Windows 在 WSL2 中完成；arm64 macOS 用 x86-64 的 Linux 容器（`docker run --platform linux/amd64`）或课程服务器

['cpu-rules.notes.1']
src_hash = 'a4a80052'
text = '''
The grading unpacks the submitted archive into a fresh copy of the framework and runs make check there, so only the three files under src/lab1 count.
The source check runs before the tests: tests/srccheck.sh checks the names each object file uses and defines, its sections and its instructions, so that the interpreter can reach the machine and the files only through the interfaces of the framework; when it fails the total score is 0 and no item runs.
The time limit per item is 120 seconds; the environment variable LIMIT can raise it on your own machine, the grading uses the default.
mini-cpu depends on x86-64 Linux: the guest programs are x86-64 ELF files, the Makefile uses --wrap of GNU ld, and make check runs the generated programs once on this machine for the expected values. None of this exists on macOS, hence the container or the course server.
'''
# src:
# 
# 评测把提交的压缩包解压到一份新的框架中再运行 make check，因此只有 src/lab1 下的三个文件计入。
# 源文件检查在测试之前：tests/srccheck.sh 检查每个目标文件使用的名字、定义的名字、节与指令，目的是让解释器只能用框架给的接口访问机器与文件；不通过时 total score 为 0，没有一项运行。
# 每项的时间上限 120 秒，环境变量 LIMIT 可以在本机放宽，评测时用默认值。
# mini-cpu 依赖 x86-64 Linux：客户机程序是 x86-64 的 ELF，Makefile 用 GNU ld 的 --wrap，make check 把生成的程序在本机运行一次作为期望值。macOS 上没有这些，所以用容器或课程服务器。


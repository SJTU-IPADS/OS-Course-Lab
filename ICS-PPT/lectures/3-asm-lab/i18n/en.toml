['cpu-make-check.notes.1']
src_hash = '449291ce'
text = '''
make check first checks the source files, then runs the 21 items in four parts, one line each: PASS or FAIL, the score and the value, the name.
The first line is the random seed: the random operands, the randomly generated programs and the random models are all decided by it, and SEED=seed make check repeats the same grading.
An item scores only when it passes completely. Part 1 is the three items of modrm_decode, part 2 the three of alu.c, part 3 ten items of 3 points: cond, the output of the guest programs, page faults, the commit logs, the flags of random operands, the three kinds of conditional instruction, random instructions, two small models; part 4 five items of 2 points, all needing the vector instructions.
The released code scores 0; this is the output after completion, with the middle left out.
The time limit of each item is 120 seconds.
'''
# src:
# 
# make check 先检查源文件，然后按四个部分运行 21 项，每项一行：PASS 或 FAIL、得分与分值、名称。
# 第一行是随机种子：随机的操作数、随机生成的程序与随机的模型都由它决定，SEED=种子 make check 重复同一次评测。
# 一项全部通过才得分。第 1 部分是 modrm_decode 的三项，第 2 部分是 alu.c 的三项，第 3 部分十项各 3 分：cond、客户机程序的输出、缺页、提交日志、随机操作数的标志位、三种条件指令、随机指令、两个小模型；第 4 部分五项各 2 分，都要用向量指令。
# 发布的代码得 0 分；这里是完成后的输出，中间的部分已省略。
# 每项的运行上限是 120 秒。


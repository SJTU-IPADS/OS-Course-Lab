['bomb-objdump.notes.1']
src_hash = 'f3abffee'
text = '''
-d is --disassemble, which disassembles the executable sections; -D is --disassemble-all, which disassembles all sections. Both were used on bomb-light in "Preparation for the Assembly Lab". The demo runs on examples/bomb; the output was recorded on this machine on 2026-10-19 (binutils 2.46).
objdump prints a line Disassembly of section NAME: before each section, and grep -c counts these lines: -d prints 5 sections, -D prints 28. The extra sections of -D are data sections, for example .rodata, .data and .dynsym: their bytes are also decoded as instructions, the machine-code column is the data itself, and the assembly column has no meaning. Data is examined with objdump -s, or with x/s in gdb.
bomb is a statically linked program, so the functions of the C library are in the file as well: bomb.asm has 196847 lines and 10.7 MB, bomb-all.asm has 299932 lines and 15.9 MB (from wc -l and ls -l). phase_1 is at line 935 of bomb.asm; in bomb-all.asm it is at line 17453, because -D also decodes the data sections such as .dynsym that come before .text.
To see one function only, objdump -d --disassemble=phase_1 bomb prints phase_1 alone. Students disassemble their own bomb with the same commands. After the demo, bomb.asm and bomb-all.asm remain in examples/.
'''
# src:
# 
# -d 是 --disassemble，反汇编可执行的节；-D 是 --disassemble-all，反汇编所有的节。两者的用法在「汇编实验准备」中以 bomb-light 讲过。演示在 examples/bomb 上运行，输出 2026-10-19 在本机录得（binutils 2.46）。
# objdump 在每个节之前输出一行 Disassembly of section 节名:，grep -c 数出这样的行：-d 输出 5 个节，-D 输出 28 个节。-D 多出的是数据节，例如 .rodata、.data、.dynsym：它们的字节也按指令译出，机器码一栏是数据本身，汇编指令一栏没有意义。查看数据用 objdump -s，或 gdb 的 x/s。
# bomb 是静态链接的程序，C 库的函数也在文件中，因此 bomb.asm 有 196847 行、10.7 MB，bomb-all.asm 有 299932 行、15.9 MB（wc -l 与 ls -l 的结果）。phase_1 在 bomb.asm 的第 935 行；在 bomb-all.asm 中是第 17453 行，-D 把排在 .text 之前的 .dynsym 等数据节也译了出来。
# 只看一个函数时用 objdump -d --disassemble=phase_1 bomb，它只输出 phase_1。学生自己的 bomb 用同样的命令反汇编。演示之后 examples/ 中留有 bomb.asm 与 bomb-all.asm。


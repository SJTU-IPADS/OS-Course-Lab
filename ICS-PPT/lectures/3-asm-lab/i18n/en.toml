['cpu-trace.notes.1']
src_hash = 'a274ffa9'
text = '''
-v prints to stderr, one line before each instruction executes; --max 4 stops after four.
--commit - writes the commit log to standard output, one line per instruction, listing only the memory written and the registers whose value changed, without rip.
The and at 401009 did not change rsp, so only flags appears; the call at 40100d wrote the return address on the stack and rsp.
A vector register is written in the log as one 256-bit hexadecimal number, the rightmost 8 digits being lane 0.
The three commit-log items of the grading compare this log with the real execution on this machine; one wrong register in one instruction is found.
'''
# src:
# 
# -v 打印到 stderr，每条指令执行之前一行；--max 4 执行四条后停止。
# --commit - 把提交日志写到标准输出，每条指令一行，只列出被写的内存与值变化的寄存器，不含 rip。
# 401009 的 and 没有改变 rsp，所以只有 flags；40100d 的 call 写了栈上的返回地址与 rsp。
# 向量寄存器在日志中写作一个 256 位的十六进制数，最右边 8 位是通道 0。
# 评测的 commit logs 三项用这份日志对照本机的真实执行，一条指令写错一个寄存器就会被发现。


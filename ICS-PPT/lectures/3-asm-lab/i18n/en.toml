['cpu-hello.title']
src_hash = '0bfb3658'
text = 'guest/hello: the output is done by the write system call'
# src: guest/hello：输出由 write 系统调用完成

['cpu-hello.slide.1']
src_hash = 'e92a7ed2'
text = '''

- **The `syscall` instruction asks the operating system to carry out an operation**: `%rax` holds the number (1 is `write`, 60 is `exit`), the arguments are in `%rdi`, `%rsi`, `%rdx` in order, and the result is written back to `%rax`.
- `guest/hello` is not linked with the C library; `puts` and `putint` are defined in `guest/mini.h` and each executes one `write`; after `guest_main` returns, `_start` executes `exit`.

'''
# src:
# 
# - **`syscall` 指令请求操作系统完成一项操作**：`%rax` 是编号（1 是 `write`，60 是 `exit`），参数依次在 `%rdi`、`%rsi`、`%rdx` 中，结果写回 `%rax`。
# - `guest/hello` 不链接 C 库，`puts` 与 `putint` 定义在 `guest/mini.h` 中，各执行一次 `write`；`guest_main` 返回后，`_start` 执行 `exit`。

['cpu-hello.notes.1']
src_hash = '8dfcf663'
text = '''
guest/hello is the smallest guest program in guest/; guest_main prints two lines: hello from the guest and argc = 1. A guest program is not linked with the C library, and the only functions it can call are the few in guest/mini.h: puts first finds the length of the string with a loop, then executes write; putint converts the integer into decimal digits, writes them into an array on the stack, then executes write. The two lines take three writes.
The left of the code block is the statements of guest_main in guest/hello.c, the right the corresponding instructions from objdump -d guest/hello. For the first puts: when the length loop ends, %rdx is 21, the number of bytes of the string; %eax is set to 1, %esi to the address of the string 0x402000, %rdi to 1, standard output; then syscall is executed. 0x402000 is in the read-only data section .rodata; the second string "argc = " follows it, at address 0x402016.
syscall is an instruction that asks the operating system to carry out an operation the program cannot do itself, such as printing to the terminal or ending the program. The number and the arguments are placed in registers by the Linux x86-64 convention: the number in %rax, the arguments in %rdi, %rsi, %rdx, %r10, %r8, %r9 in order, the return value written back to %rax. The mechanism of system calls is explained in the lecture on exceptions; only this convention is used here.
The entry of the program is _start in guest/start.S: it takes argc and argv from the top of the stack and calls guest_main; after guest_main returns, _start puts the return value into %edi as the exit code and executes syscall with number 60, exit.
guest/hello also runs directly on the host: ./guest/hello has Linux execute the same syscalls, with the same output.
'''
# src:
# 
# guest/hello 是 guest/ 中最小的客户机程序，guest_main 输出两行：hello from the guest 与 argc = 1。客户机程序不链接 C 库，能调用的函数只有 guest/mini.h 中的几个：puts 先用循环求出字符串的长度，再执行 write；putint 把整数转为十进制数字，写入栈上的数组，再执行 write。两行输出共三次 write。
# 代码块左边是 guest/hello.c 中 guest_main 的语句，右边是 objdump -d guest/hello 中对应的指令。第一个 puts：求长度的循环结束时 %rdx 是 21，即字符串的字节数；%eax 置 1，%esi 置字符串的地址 0x402000，%rdi 置 1，即标准输出；然后执行 syscall。0x402000 在只读数据段 .rodata 中，第二个字符串 "argc = " 紧随其后，地址是 0x402016。
# syscall 是一条指令，作用是请求操作系统完成程序自己不能完成的操作，例如向终端输出、结束程序。编号与参数按 Linux x86-64 的约定放在寄存器中：编号在 %rax，参数依次在 %rdi、%rsi、%rdx、%r10、%r8、%r9，返回值写回 %rax。系统调用的机制在讲异常时说明，这里只用到这个约定。
# 程序的入口是 guest/start.S 中的 _start：它从栈顶取出 argc 与 argv，调用 guest_main；guest_main 返回后，_start 把返回值放入 %edi 作为退出码，以编号 60 执行 syscall，即 exit。
# guest/hello 也能在本机上直接运行：./guest/hello 由 Linux 执行同样的 syscall，输出相同。

['cpu-hello-mem.title']
src_hash = 'd7563dc6'
text = 'guest/hello after loading: its memory is in dram.img, its registers in cpu.R[]'
# src: guest/hello 装入之后：内存在 dram.img 中，寄存器在 cpu.R[] 中

['cpu-hello-mem.slide.1']
src_hash = 'db91d00e'
text = '''

`frame/loader.c` writes the instructions and the strings of guest/hello into dram.img, writes argc and argv at the top of the stack, and sets `R[RSP]` and `R[RIP]`; `interp_run` executes one instruction after another from `R[RIP]`.

'''
# src:
# 
# `frame/loader.c` 把 guest/hello 的指令与字符串写入 dram.img，在栈顶写入 argc 与 argv，设置 `R[RSP]` 与 `R[RIP]`；`interp_run` 从 `R[RIP]` 开始逐条执行。

['cpu-hello-mem.notes.1']
src_hash = '1c8bc10a'
text = '''
The mini-cpu started by ./mini-cpu guest/hello is an ordinary process on the host; the memory and the registers of guest/hello are data in this process.
Memory: frame/main.c first opens the file dram.img in the current directory, sets its size to 64 MiB and maps it into mini-cpu's own memory with mmap, as the memory of the guest. The loader loader_exec (frame/loader.c) reads the program headers of guest/hello and copies the two sections .text and .rodata into it; it then prepares a stack of 64 pages and writes, at its top, the argument string "guest/hello", the address of argv[0], and argc.
The addresses in the instructions of guest/hello, such as 0x401000, 0x402000 and 0x7fffffffefc0, are guest addresses. frame/ gives every 4 KiB page a place in dram.img and converts a guest address into an offset in the file on every access: the page at 0x401000 is at offset 0x101000, the page at 0x402000 at 0x102000, and the top of the stack 0x7fffffffefc0 at 0x142fc0. After the run, od -A x -c -j $((0x102000)) -N 32 dram.img shows the two strings in the file. How pages are mapped is explained in the lecture on virtual memory; the interpreter only uses guest addresses, and the helpers such as load and store do the conversion.
Registers: main in frame/main.c has the local variable mcpu cpu, and the registers of the guest are its member R[18]: R[RAX] to R[R15] are the 16 general-purpose registers, R[RFLAGS] the flags register, R[RIP] the rip. The parameter c of interp_run(c) points at cpu, and interp.c defines R as c->R with a macro, so R[RSP] is the guest's %rsp. The loader sets R[RSP] to 0x7fffffffefc0, the address of argc at the top of the stack, R[RIP] to the entry 0x401000, the flags register to 0x2 (bit 1 is always 1), and the rest to 0.
From then on, every pass of interp_run takes one instruction from guest memory at R[RIP], executes it, and changes R[] and guest memory. The first instruction of guest/hello is at 0x401000; its bytes are 48 8b 3c 24, mov (%rsp),%rdi, which reads argc into R[RDI].
'''
# src:
# 
# ./mini-cpu guest/hello 启动的 mini-cpu 是本机上的一个普通进程，guest/hello 的内存与寄存器都是这个进程中的数据。
# 内存：frame/main.c 先打开当前目录下的文件 dram.img，把它的大小设为 64 MiB，用 mmap 映射到 mini-cpu 自己的内存中，作为客户机的内存。装载器 loader_exec（frame/loader.c）读 guest/hello 的程序头，把 .text 与 .rodata 两段复制进去；再准备 64 页的栈，在栈顶依次写入参数字符串 "guest/hello"、argv[0] 的地址与 argc。
# guest/hello 的指令中出现的地址是 0x401000、0x402000、0x7fffffffefc0 这样的客户机地址。frame/ 以 4 KiB 的页为单位，为每一页在 dram.img 中分配一个位置，读写时把客户机地址换算为文件中的偏移：0x401000 一页在偏移 0x101000，0x402000 一页在 0x102000，栈顶 0x7fffffffefc0 在 0x142fc0。运行结束后，od -A x -c -j $((0x102000)) -N 32 dram.img 在文件中显示这两个字符串。按页对应的方式在讲虚拟内存时说明；解释器只使用客户机地址，换算由 load、store 这些辅助函数完成。
# 寄存器：frame/main.c 的 main 中有局部变量 mcpu cpu，客户机的寄存器就是它的成员 R[18]：R[RAX] 到 R[R15] 是 16 个通用寄存器，R[RFLAGS] 是标志寄存器，R[RIP] 是 rip。interp_run(c) 的参数 c 指向 cpu，interp.c 用宏把 R 定义为 c->R，所以 R[RSP] 就是客户机的 %rsp。装载器把 R[RSP] 置为栈顶 argc 所在的地址 0x7fffffffefc0，R[RIP] 置为入口 0x401000，标志寄存器置为 0x2（第 1 位恒为 1），其余为 0。
# 之后 interp_run 每次循环按 R[RIP] 从客户机内存取一条指令，执行它，修改 R[] 与客户机内存。guest/hello 的第一条指令在 0x401000，字节是 48 8b 3c 24，即 mov (%rsp),%rdi，把 argc 读入 R[RDI]。

['cpu-hello-syscall.title']
src_hash = '807af01b'
text = 'The syscall instruction: interp_run hands it to sys_dispatch of frame/'
# src: syscall 指令：interp_run 交给 frame/ 的 sys_dispatch 执行

['cpu-hello-syscall.demo.1.name']
src_hash = 'aa4e00c8'
text = 'Run hello once the interpreter is complete'
# src: 解释器完成后运行 hello

['cpu-hello-syscall.notes.1']
src_hash = '5215d3de'
text = '''
When guest/hello reaches the syscall at 40112a, four registers have been set by the instructions before it: R[RAX] = 1 is the number of write, R[RDI] = 1 standard output, R[RSI] = 0x402000 the guest address of the string, R[RDX] = 21 the number of bytes.
The bytes of syscall are 0f 05, and x86_begin returns the number 0x105. The switch of interp.c has no case for it, so execution goes to default and x86_other (frame/x86rest.c) executes it: it calls syscall_enter, which calls sys_dispatch of frame/sysbase.c. interp.c therefore needs no case for syscall.
sys_dispatch chooses the system call by R[RAX]. The string is in guest memory, and the host's write cannot use a guest address, so sys_dispatch first reads 21 bytes from guest address 0x402000 with mem_read into buf, an array of mini-cpu itself, then calls the host's write(1, buf, 21); Linux prints these 21 bytes on the terminal. The return value 21 is written back to R[RAX], and the next instruction continues at 40112c.
"argc = " and the "1\n" of putint are printed the same way, three writes in all. After guest_main returns, _start executes syscall at 401019 with R[RAX] = 60, and sys_dispatch sets c->halted to 1; x86_end returns -1 and the loop of interp_run ends. main uses the low 8 bits of R[RDI] as the exit code of mini-cpu; guest/hello returns 0, so the exit code of mini-cpu is 0.
--stats prints the number of instructions executed, the number of system calls and the exit code at the end: 152 instructions and 4 system calls, three writes and one exit. This is the output once the interpreter is complete.
'''
# src:
# 
# guest/hello 执行到 40112a 的 syscall 时，四个寄存器已经由前面的指令设好：R[RAX] = 1 是 write 的编号，R[RDI] = 1 是标准输出，R[RSI] = 0x402000 是字符串的客户机地址，R[RDX] = 21 是字节数。
# syscall 的字节是 0f 05，x86_begin 返回的编号是 0x105。interp.c 的 switch 中没有这个 case，执行进入 default，由 x86_other（frame/x86rest.c）执行：它调用 syscall_enter，再调用 frame/sysbase.c 的 sys_dispatch。所以 interp.c 不需要为 syscall 写 case。
# sys_dispatch 按 R[RAX] 选择系统调用。字符串在客户机内存中，本机的 write 不能直接使用客户机地址，因此 sys_dispatch 先用 mem_read 从客户机地址 0x402000 读出 21 个字节，放入 mini-cpu 自己的数组 buf，再调用本机的 write(1, buf, 21)，Linux 把这 21 个字节输出到终端。返回值 21 写回 R[RAX]，下一条指令从 40112c 继续。
# "argc = " 与 putint 输出的 "1\n" 以同样的方式输出，共三次 write。guest_main 返回后，_start 在 401019 以 R[RAX] = 60 执行 syscall，sys_dispatch 把 c->halted 置 1；x86_end 返回 -1，interp_run 的循环结束。main 把 R[RDI] 的低 8 位作为 mini-cpu 的退出码，guest/hello 返回 0，mini-cpu 的退出码就是 0。
# --stats 在结束时打印执行的指令数、系统调用数与退出码：152 条指令，4 次系统调用，即三次 write 与一次 exit。这是解释器完成之后的输出。


['bomb-task.notes.1']
src_hash = '2579a8b5'
text = '''
Lab bomb-lab accompanies lecture 3, "Machine-Level Representation and Execution of Programs", and is not scored. The lab hands out an executable file bomb without source.
The figure is the structure of main: for each phase k, read_line reads one line of input and returns its address; phase_k takes that address as its only argument (%rdi) and checks the line; when phase_k returns, main calls phase_defused, which reports phase k as defused to the server, and goes on to the next phase. After all 8 phases return, the program prints All phases are defused. and exits with status 0.
When phase_k finds the line wrong it calls explode_bomb: it reports the explosion of phase k to the server, shows the explosion screen, and the program exits with status 1 without returning.
The task is to read the machine code of phase_1 to phase_8 and derive the line each phase accepts. Each student ID has its own bomb, and the bombs of different students accept different input.
The use of objdump and gdb was covered in the tutorial "Preparation for the Assembly Lab" with the classroom program bomb-light; this part does not repeat it.
'''
# src:
# 
# 实验 bomb-lab 配合第三讲「程序的机器级表示」，不计分。实验给出一个可执行文件 bomb，没有源码。
# 图是 main 的结构：对每个阶段 k，read_line 读一行输入，返回这一行的地址；phase_k 以这个地址为唯一的参数（%rdi），检查这一行；phase_k 返回时 main 调用 phase_defused，向服务器报告阶段 k 已拆除，然后进入下一个阶段。8 个阶段都返回之后程序输出 All phases are defused.，退出状态 0。
# phase_k 认为这一行错误时调用 explode_bomb：它向服务器报告阶段 k 爆炸，显示爆炸的画面，程序以状态 1 退出，不返回。
# 任务是阅读 phase_1 到 phase_8 的机器码，推出每个阶段接受的那一行。每个学号对应一个 bomb，各同学的 bomb 接受的输入不同。
# objdump 与 gdb 的用法在辅导课「汇编实验准备」中以课堂程序 bomb-light 讲过，本节不重复。


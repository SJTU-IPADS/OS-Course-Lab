text = 'The bytes of an instruction and the number op'
# src: 一条指令的字节与 op 的编号

['cpu-bytes.notes.1']
src_hash = '565b659f'
text = '''
Every instruction except the second is taken from the objdump output of the guest programs.
The first has the REX prefix 4c, the opcode 03, the ModRM 04, the SIB d5 and a 4-byte displacement; op is 0x03.
The second, add %rax,%r8, has the same REX prefix and opcode as the first, so op is again 0x03; only the ModRM byte differs. ModRM 04 says that the other operand, rm, is in memory and that a SIB and a 4-byte displacement follow; ModRM c0 says that rm is the register %rax and that the instruction ends here. Both instructions write the sum to %r8: the first adds 8 bytes from memory, the second adds %rax. For instructions with the same opcode, ModRM decides whether the other operand is a register or memory and how many bytes follow; the fields of ModRM are the subject of the next subsection. guest/sum contains the same instruction add %rax,%r8, which the assembler encodes as 49 01 c0, with the opcode 01; the 4c 03 c0 here is what the assembler emits for {load} add %rax,%r8, which makes it use the opcode 03, for comparison with the first.
The third has the ModRM ec and a 4-byte immediate after the opcode 81; op is 0x81.
The number of the two-byte opcode 0f 88 is 0x100 plus the second byte, 0x188; a 4-byte offset follows.
The number of a VEX instruction is 0x1000 | map << 8 | opcode byte: c4 e2 7d is the three-byte VEX prefix, map 2 is 0f 38, the opcode is 40, the number 0x1240.
The lower half lists the functions that one pass of interp_run calls, in order, for the first instruction, the add. x86_begin reads the prefix 4c and the opcode 03, records x.rex = 0x4c and the operand size x.size = 8, and returns op = 0x03; switch enters case 0x03. The opcode 03 is one form of add, reg = reg + rm: reg is a register, rm a register or memory, and the sum is written to reg; in this instruction reg is %r8 and rm is memory, so 8 bytes in memory are added to %r8. modrm calls your modrm_decode, which reads the ModRM, the SIB and the 4-byte displacement and finds x.reg = 8, that is %r8, and the other operand in memory at the address 0x403020 + %rdx × 8; how these bytes are decoded is the subject of the next subsection. get reads %r8 and rm_get reads 8 bytes at that address; the operation number of x86_alu is 0x03 >> 3 = 0, add, and it returns the sum and sets the flags; set writes the sum to %r8. The second, add %rax,%r8, goes through the same calls, except that modrm finds x.rm = 0 and rm_get reads %rax. Last, x86_end returns 0; R[RIP] has already moved past the displacement and points at the next instruction.
'''
# src:
# 
# 除第二条外，各条指令都取自客户机程序的 objdump 输出。
# 第一条有 REX 前缀 4c、操作码 03、ModRM 04、SIB d5 与 4 字节偏移；op 是 0x03。
# 第二条 add %rax,%r8 与第一条的 REX 前缀和操作码都相同，op 也是 0x03，只有 ModRM 字节不同。ModRM 04 表示另一个操作数 rm 在内存中，后面还有 SIB 与 4 字节偏移；ModRM c0 表示 rm 是寄存器 %rax，指令到此结束。两条指令都把和写入 %r8：第一条加的是内存中的 8 字节，第二条加的是 %rax。同一个操作码的指令，另一个操作数是寄存器还是内存、后面还有几个字节，由 ModRM 决定；ModRM 的各个字段在下一小节讲。guest/sum 中有同一条指令 add %rax,%r8，汇编器把它编码为 49 01 c0，用的是操作码 01；这里的 4c 03 c0 是用 {load} add %rax,%r8 让汇编器改用操作码 03 得到的，以便与第一条比较。
# 第三条的操作码 81 之后是 ModRM ec 与 4 字节立即数；op 是 0x81。
# 两字节操作码 0f 88 的编号是 0x100 加第二个字节，即 0x188；之后是 4 字节偏移。
# VEX 指令的编号是 0x1000 | map << 8 | 操作码字节：c4 e2 7d 是三字节的 VEX 前缀，map 2 即 0f 38，操作码 40，编号 0x1240。
# 下半部分是第一条 add 在 interp_run 的一次循环中依次调用的函数。x86_begin 读前缀 4c 与操作码 03，记下 x.rex = 0x4c 与操作数宽度 x.size = 8，返回 op = 0x03；switch 进入 case 0x03。操作码 03 是 add 的一种形式，reg = reg + rm：reg 是寄存器，rm 是寄存器或内存，和写入 reg；这一条的 reg 是 %r8，rm 是内存，即把内存中的 8 字节加到 %r8 上。modrm 调用你的 modrm_decode，读 ModRM、SIB 与 4 字节偏移，得出 x.reg = 8 即 %r8，另一个操作数在内存中，地址是 0x403020 + %rdx × 8；这几个字节怎样解析在下一小节讲。get 读 %r8，rm_get 从这个地址读 8 字节；x86_alu 的运算编号是 0x03 >> 3 = 0，即 add，它返回两数之和并设置标志位；set 把和写入 %r8。第二条 add %rax,%r8 经过同样的调用，只是 modrm 得出 x.rm = 0，rm_get 读的是 %rax。最后 x86_end 返回 0，此时 R[RIP] 已经越过偏移，指向下一条指令。


['cpu-given.slide.1']
src_hash = 'b511f86e'
text = 'Three rules hold for every `case`: a displacement or an immediate is read completely before it is added to `R[RIP]`; `cmp` computes the flags only and writes no operand; `pop` reads the stack first, then moves `R[RSP]`, and writes the register last.'
# src:
# 
# 三条对每个 `case` 都成立的规则：位移与立即数先读完再加到 `R[RIP]` 上；`cmp` 只算标志位，不写操作数；`pop` 先读栈、再移 `R[RSP]`、最后写寄存器。

['cpu-given.notes.1']
src_hash = '8b41aed6'
text = '''
0x81 and 0x83 are the eight operations with an immediate; the operation number is in x.sub. The two differ only in the width of the immediate: that of 0x83 is 1 byte, sign-extended to 64 bits. The case calls modrm first, then reads the immediate, and only then rm_get: a rip-relative address counts from the next instruction, and R[RIP] does not point there until the immediate has been read.
The register of push is in the low 3 bits of the opcode, with REX.B as the 4th bit; the eight opcodes share one case.
jmp 0xeb reads a 1-byte offset and adds it to R[RIP]; 0xe9 is the same with a 4-byte offset.
Write the other cases as these three: read the bytes, compute, write back; a case reads only the bytes of its own group.
'''
# src:
# 
# 0x81 与 0x83 是带立即数的八种运算，运算编号在 x.sub 中；两者只差立即数的宽度，0x83 的立即数是 1 字节，符号扩展到 64 位。它先 modrm，再读立即数，然后才 rm_get：
# rip 相对的地址以下一条指令的地址为基准，立即数读完之前 R[RIP] 还没有指向下一条指令。
# push 的寄存器编号在操作码的低 3 位，REX.B 是第 4 位；八个操作码共用一个 case。
# jmp 0xeb 读 1 字节的位移，加到 R[RIP] 上；0xe9 相同，位移 4 字节。
# 写其余的 case 时照这三段的写法：读字节、计算、写回，每个 case 只读自己这一组的字节。


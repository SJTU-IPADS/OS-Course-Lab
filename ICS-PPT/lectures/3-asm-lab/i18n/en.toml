['attack-payload.notes.1']
src_hash = '5498c1f8'
text = '''
The code sits at the low end of the buffer (offset 0) and the return address is written as its address; ret lands on that code as soon as it runs, with no other springboard. The distance from the code to the return address is a fixed 312 bytes, independent of where the stack is; the whole payload is 320 bytes and stops at the last byte of the return address, with not one byte above it: main's frame is untouched, and the call to report_pass is an ordinary call.
The saved %rbp is overwritten with 41: it is popped by leave (mov %rbp,%rsp; pop %rbp), and control never returns to chat_turn, so it does not matter.
The only thing to know is the address of the buffer. The stack address changes on every run (ASLR), so the demonstration turns it off with setarch -R, which fixes it: read %rbp-0x130 once with gdb, or use the probe in tools/make-attack-demo.sh (it prints the address from the fixed distance between %rsp and the buffer). The 0x00007fffffffd550 on this page and in the animation comes from there.
The 27 bytes of code: bf 01 00 00 00 is mov $1,%edi, 48 be plus 8 bytes is movabs $key,%rsi (a 64-bit immediate takes movabs), 48 b8 plus 8 bytes is movabs $0x01528000,%rax, and ff d0 is call *%rax. It calls report_pass(1, key).
Neither the key nor the address of report_pass contains 0x0a (the tools avoid it byte by byte when they look for an address, and the hash-generated constants avoid it too), so no byte of the payload is 0x0a. 0x00 is allowed: this line comes in through a pipe, and Gets stores it byte by byte.
The hexadecimal of the payload is written in answers/attack1.txt; unhex turns it back into 320 bytes, and the way it is fed to the program does not change.
'''
# src:
# 
# 代码写在缓冲区的低端（偏移 0），返回地址写成它的地址；ret 一执行就落到这段代码上，不需要别的跳板。代码与返回地址的距离是固定的 312 字节，与栈的位置无关；整条载荷 320 字节，只写到返回地址的最后一个字节，返回地址之上一个字节也不写：main 的帧没有被碰，report_pass 的调用与平常的调用一样。
# 保存的 %rbp 被 41 覆盖：它在 leave（mov %rbp,%rsp; pop %rbp）里被弹出，此后不再回到 chat_turn，所以没有影响。
# 要知道的只有缓冲区的地址。栈的地址每次运行都不同（ASLR），演示时用 setarch -R 关掉它，地址就固定下来：用 gdb 读一次 %rbp-0x130，或者用 tools/make-attack-demo.sh 里的探针（它从 %rsp 与缓冲区的固定距离把地址打印出来）。本页与动画里的 0x00007fffffffd550 就是这样得到的。
# 代码 27 字节：bf 01 00 00 00 是 mov $1,%edi，48 be 加 8 个字节是 movabs $口令,%rsi（64 位立即数用 movabs），48 b8 加 8 个字节是 movabs $0x01528000,%rax，ff d0 是 call *%rax。调用 report_pass(1, 口令)。
# 口令与 report_pass 的地址都可以不含 0x0a（工具按字节找地址时避开它，常数由散列生成时也避开了），所以整条载荷没有一个字节是 0x0a。0x00 允许出现：这一行从管道读入，Gets 逐字节地存。
# 载荷的十六进制写在 answers/attack1.txt 中；unhex 把它还原成 320 字节，喂给程序的方式不变。


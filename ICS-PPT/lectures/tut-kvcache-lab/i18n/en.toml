Frame 13: next_token selects t3, the first token of the answer, from the state of t2 after the last layer. t3 is an output of the model, and block 3 is still reserved. k3 and v3 exist only after t3 goes through the model once more as input.
Frame 14: the framework calls compute for t3, k3 and v3 are written to block 3, and n_cached becomes 4, equal to capacity: all reserved blocks are now cached.
Frame 15: next_token outputs t4, the answer reaches 2 tokens and the turn ends. The text has 5 tokens, n_cached is 4 and block 4 is still unused: t4 serves only as output, and its key and value are computed when it serves as input in the next turn.

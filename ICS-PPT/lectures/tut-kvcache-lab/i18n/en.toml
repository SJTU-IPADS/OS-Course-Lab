['kv-layout.title']
src_hash = '0c337e5b'
text = 'The Structure of the KV Cache in Memory'
# src: KV Cache 在内存中的结构

['kv-layout.slide.1']
src_hash = 'ee1b8da4'
text = 'In the lab the Qwen model has 28 layers, and the attention k and v vectors of every layer have 1024 dimensions. The KV Cache has the same structure as the figure below.'
# src:
# 
# 实验中千问模型有 28 层，每层注意力 k、v 向量均为 1024 维，KVCache 结构上与下图相同。

['kv-layout.notes.1']
src_hash = '1e0c7a8e'
text = '''
The KV Cache keeps one row of keys and one row of values for each token of the conversation and each layer. The example has 2 layers and 1 key-value head of length d = 10, so kv_dim = 10 and a row is 10 floats. The real model has 28 layers and 8 key-value heads of 128 numbers each, so a row is 1024 floats and a block is 224 KiB, with the same structure.
On the left is struct kv_cache, which describes the whole KV Cache. The framework sets n_layer, kv_dim, base and n_blocks: base is the address of the first byte of this memory, and n_blocks is the number of blocks in it. n_cached is the number of cached tokens and capacity the number of reserved blocks, and the functions you implement maintain these two fields.
On the right is the memory of the KV Cache. When the program starts, the framework allocates this memory at one time by the memory limit and divides it into blocks of equal size. The number of whole blocks in the limit is n_blocks, 8 in the example. A block holds the key and the value of one token in all layers, and the blocks follow one another in the order of the tokens. So block tok holds token tok and starts tok × 160 bytes after base. The line under the block names gives this start, for example block 2 starts at base + 320.
The figure shows this moment: the message of turn 1 is t0, t1, t2, the turn has reserved blocks 0 to 3 for 4 tokens, t0, t1, t2 are computed, and t3 is not computed yet. All three kinds of block appear. Blocks 0 to n_cached − 1 are cached, that is blocks 0, 1, 2, which hold computed keys and values. Blocks n_cached to capacity − 1 are reserved, that is block 3, whose content has no meaning yet. The blocks from block capacity on are not used yet, that is blocks 4 to 7.
Below, block 2 is enlarged: its 4 rows are the key of layer 0, the value of layer 0, the key of layer 1 and the value of layer 1, in this order, 10 floats each, 40 floats or 160 bytes in total, and the number left of each row is its byte offset in the block. A block holds only floats, and the number of a block is the number of the token it holds.
The address of each row is computed from the number of the token, the layer, and K or V. The next page shows how.
'''
# src:
# 
# KV Cache 要为对话的每个 token、每一层保存一行键与一行值。例子中有 2 层、1 个键值头，这个头的长度 d = 10，所以 kv_dim = 10，一行是 10 个 float。真实模型有 28 层、8 个键值头，每头 128 个数，一行是 1024 个 float，一块是 224 KiB，结构相同。
# 左边是 struct kv_cache，它描述整个 KV Cache。n_layer、kv_dim、base 与 n_blocks 由框架设置：base 是这段内存第一个字节的地址，n_blocks 是其中的块数。n_cached 是已缓存的 token 数，capacity 是已预留的块数，这两个字段由你实现的函数维护。
# 右边是 KV Cache 的内存。框架在程序开始时按内存上限一次分配这段内存，把它分成等大的块，上限中整块的数目就是 n_blocks，例子中是 8 块。一块存放一个 token 在全部层中的键与值，各块按 token 的编号依次相接，所以块 tok 存放第 tok 个 token，从 base 之后 tok × 160 字节处开始。块名下面一行是这个起点，比如块 2 从 base + 320 开始。
# 图中是这样一个时刻：第 1 轮的消息是 t0、t1、t2，这一轮为 4 个 token 预留了块 0 到 3，现在 t0、t1、t2 已算完，t3 还没有算。三种块都在图中。块 0 到 n_cached − 1 已缓存，即块 0、1、2，其中是算好的键与值。块 n_cached 到 capacity − 1 是预留的块，即块 3，内容还没有意义。从块 capacity 起的块还没有使用，即块 4 到 7。
# 下方放大块 2：4 行依次是第 0 层的键、第 0 层的值、第 1 层的键、第 1 层的值，每行 10 个 float，共 40 个 float、160 字节，各行左边的数是它在块内的字节偏移。块内只有 float，块的编号就是它存放的 token 的编号。
# 每一行的地址由 token 的编号、层与 K、V 算出，下一页看怎样计算。


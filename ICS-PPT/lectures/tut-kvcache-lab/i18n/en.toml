['kv-locate.slide.1']
src_hash = '564c1967'
text = 'You need to implement `kv_key` and `kv_value`: first compute the start of the block, then add the offset within the block. [kvcache.c](file:/labs/kvcache/src/kvcache.c)'
# src:
# 
# 你需要实现 `kv_key` 与 `kv_value`：先算出块的起点，再加块内偏移。[kvcache.c](file:/labs/kvcache/src/kvcache.c)

['kv-locate.notes.1']
src_hash = '482a941d'
text = '''
Finding a row takes three items: the layer, K or V, and the token. The figure looks for the value of token 2 in layer 1, and the call is kv_value(cache, 1, 2).
Step 1 finds the block. The blocks follow one another, and blocks 0 and 1 lie before block 2, so block 2 starts 2 × 160 = 320 bytes after base. 160 is the number of bytes of one block, the value of kv_block_bytes(cache): 2 layers × 2 rows × 10 floats × 4 bytes. base is the address of a byte, and what is added to it is a number of bytes.
Step 2 adds the offset within the block. Before layer 1 are the key row and the value row of layer 0, 1 × 2 × 10 = 20 floats. The value of this layer follows the key of this layer, which adds 10 more, 30 floats in total. A float is 4 bytes, so the offset within the block is 120 bytes, and v2 is the 10 floats numbered 30 to 39 in the figure.
Adding the two steps, the address of v2 is base + 320 + 120 = base + 440. kv_key(cache, 1, 2) returns base + 400 in the same block. The two functions only compute addresses and leave the memory and struct kv_cache as they are. The offset within the block depends only on the layer and on K or V, and is the same in all blocks.
The next page starts from an empty KV Cache and shows how turn 1 of the conversation calls these functions and writes into the memory.
'''
# src:
# 
# 找一行需要三项：哪一层、K 或 V、第几个 token。图中要找第 1 层 token 2 的值，调用是 kv_value(cache, 1, 2)。
# 第 1 步找到块。各块依次相接，块 2 之前有块 0 与块 1，所以块 2 从 base 之后 2 × 160 = 320 字节处开始。160 是一块的字节数，即 kv_block_bytes(cache) 的值：2 层 × 2 行 × 10 个 float × 4 字节。base 是一个字节的地址，在它上面加的是字节数。
# 第 2 步加块内偏移。第 1 层之前有第 0 层的一行键与一行值，共 1 × 2 × 10 = 20 个 float。这一层的值又在这一层的键之后，再加 10 个，共 30 个 float。一个 float 是 4 字节，所以块内偏移是 120 字节，v2 是图中编号 30 到 39 的 10 个 float。
# 两步相加，v2 的地址是 base + 320 + 120 = base + 440。kv_key(cache, 1, 2) 返回同一块中的 base + 400。两个函数只计算地址，内存中的内容与 struct kv_cache 都保持原样。块内偏移只取决于层与 K、V，在所有块中相同。
# 下一页从空的 KV Cache 开始，看第 1 轮对话怎样调用这些函数并写入内存。

['kv-first.title']
src_hash = '79a8fa1c'
text = 'The Writes of the First Turn'
# src: 第一轮对话的写入

['kv-first.slide.1']
src_hash = '7abbfc7a'
text = 'The message of turn 1 of the conversation has 3 tokens, at most 2 tokens are generated, and the KV Cache starts empty.'
# src:
# 
# 对话第 1 轮的消息有 3 个 token，最多生成 2 个 token，KV Cache 从空开始。

['kv-first.notes.1']
src_hash = '68b7f058'
text = '''
15 frames. The top line gives the steps in which serve of the framework handles one turn of the conversation, with the current step in an orange frame. The box below it gives the call with its arguments and the values computed and returned in this step. Below that are the tokens of the conversation, each directly above its block. On the left is struct kv_cache, on the right the memory of the KV Cache. Orange is written or changed, green is read, and a dark outline marks a cell located in this step, for example a row whose address is taken. The example draws one head, with d = 10. A line left of the tokens gives the two numbers of the turn: n_prompt is the number of tokens of the text, and max_answer is the largest number of tokens to generate. An address is written as a number of bytes after base.
Frame 1: turn 1 begins. append_message turns the message into t0, t1, t2, so n_prompt = 3. The KV Cache is empty: n_cached and capacity are both 0, and all 8 blocks are unused.
Frame 2: the framework calls kv_reserve(cache, 3, 2), and the two numbers are n_prompt and max_answer: the text has 3 tokens and at most 2 are generated. kv_reserve first counts the tokens that go into the model as input in this turn, and each of them needs one block. In this example they are t0, t1, t2 of the message and t3, the first token of the answer, 4 in total. t3 has to go in as input to produce t4, the second token of the answer. The turn ends once t4 is generated. t4 serves only as output, so the turn needs 4 blocks. capacity is 0, less than 4, so blocks have to be reserved. 4 is not more than n_blocks, so the turn fits. When the blocks needed are more than n_blocks, the turn does not fit: kv_reserve returns 0, every field stays as it was, and the program reports it and stops.
Frame 3: kv_reserve sets capacity to 4 and returns 1. Blocks 0 to 3 become reserved, block n for token n. n_cached is still 0 and the content of the memory is unchanged: blocks 0 to 3 are already in the memory, and kv_reserve changes only the field capacity.
Frame 4: from token n_cached on, the framework calls compute, one token at a time. compute is given. It is a written-out example that you can read to understand how one token is computed: it calls kv_key, kv_value and kv_append, which you implement, and embed, attention and feed_forward of the framework. compute(cache, t0, state) uses n_cached = 0 at the call as pos and first calls embed(t0, state) to get the vector of t0.
Frame 5: layer 0. compute calls kv_key(cache, 0, 0) and kv_value(cache, 0, 0): block 0 starts at base + 0, to which 0 and 40 bytes are added. The two addresses become element 0 of the pointer arrays keys and values. This step only computes addresses.
Frame 6: compute calls attention(0, 0, state, keys, values). attention computes k0 and v0, writes them to the two rows that keys[0] and values[0] point to, then reads the two rows to compute attention. There is only one token, so a0 = 1 and o0 = a0 v0. o0 goes through one linear transformation and is added to state, which feed_forward then updates.
Frame 7: layer 1 is the same. The block is again block 0, and the offsets become 80 and 120 bytes. The keys and values of a token in all layers are in its one block.
Frame 8: after both layers compute calls kv_append(cache) once, n_cached goes from 0 to 1, and block 0 changes from reserved to cached. kv_append modifies only this field. When compute returns, state is the vector of t0 after the last layer.
Frame 9: t1, pos = 1. Layer 0 collects two elements: keys are base + 0 and base + 160, values are base + 40 and base + 200. attention first writes k1 and v1 to block 1, where the last element points.

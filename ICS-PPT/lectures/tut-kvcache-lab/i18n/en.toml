src_hash = '1ae5c69c'
text = 'Suppose a conversation has 5 turns. In each turn the user sends one message, and the message and the answer are appended to the text of the conversation in turn. The answer is generated token by token, at most 8 tokens per turn.'
# src:
# 
# 假如一段对话有 5 轮，用户每轮发来一条消息，消息与回答依次接在对话的文本之后。回答逐 token 生成，每轮最多生成 8 个 token。

['kv-turns.highlight.1']
src_hash = 'd7cd02e8'
text = 'When a token is generated, what data does each layer of the model use?'
# src: 生成一个 token 时，模型的每一层要用到哪些数据？

['kv-turns.notes.1']
src_hash = '5a9f9bb8'
text = '''
The left of the figure lists the 5 turns of this conversation. The number in the circle is the turn, followed by the message the user sends in this turn.
Each turn has three steps. Step 1 appends the message, in the chat format of the model, to the existing text of the conversation. Step 2 computes the tokens of the text that are not yet in the KV Cache. Step 3 generates the answer token by token, each step taking the token with the highest score, until the model gives the end token or the answer reaches 8 tokens. The answer is appended to the text as well, and the next turn continues from there.
Each row on the right of the figure is the text of the conversation at the end of one turn, one token per cell. The light grey bar is the text of the earlier turns, dark grey is the message of this turn, including the tokens of the chat format, for example those that mark the start and the end of what the user says, and white is the answer of this turn. Above the cells is the number of tokens of "message + answer" of this turn, for example turn 1 is a message of 13 tokens and an answer of 8 tokens, and the message of 14 tokens of turn 2 follows these 21 tokens. The numbers in the figure come from the Qwen model of the lab answering this conversation: all 5 answers reached 8 tokens, and at the end of the 5 turns the text has 111 tokens.
Every token of an answer passes through all 28 layers of the model. The next page shows which data a token uses in one layer.
'''
# src:
# 
# 图的左边是这段对话的 5 轮，圆圈中的数字是轮次，后面是用户这一轮的消息。
# 一轮分三步。第一步把消息按模型的对话格式接在对话已有的文本之后。第二步计算文本中还没有进入 KV Cache 的 token。第三步逐个生成回答，每一步取分数最高的 token，直到模型给出结束符或回答达到 8 个 token。回答也接在文本之后，下一轮从这里继续。
# 图的右边每一行是一轮结束时对话的文本，一格是一个 token。浅灰色的条是之前各轮的文本，深灰色是这一轮的消息，包括对话格式的标记，比如标出用户发言开始与结束的 token，白色是这一轮的回答。格的上方是这一轮「消息 + 回答」的 token 数，比如第 1 轮是 13 个 token 的消息与 8 个 token 的回答，第 2 轮 14 个 token 的消息接在这 21 个 token 之后。图中的数是实验所用的千问模型回答这段对话时得到的，5 轮的回答都达到了 8 个 token，5 轮结束时文本共有 111 个 token。
# 回答的每一个 token 都要经过模型的全部 28 层，下一页看一个 token 在一层中用到哪些数据。

['kv-step.title']
src_hash = 'd5cc7838'
text = 'Attention in One Layer'
# src: 一层中的注意力

['kv-step.slide.1']
src_hash = '5850b1ad'
text = '''
In every attention head, token pos computes its own query $q_{\mathrm{pos}}$, key $k_{\mathrm{pos}}$ and value $v_{\mathrm{pos}}$. The weights $a$ and the output $o_{\mathrm{pos}}$ of one attention head are as follows, where $d$ is the dimension of this attention head.

 $$
 \begin{aligned}
 {}[a_0,\ldots,a_{\mathrm{pos}}] &= \mathrm{softmax}\Big(\tfrac{1}{\sqrt{d}}\,[\,\underbrace{q_{\mathrm{pos}}\cdot k_0,\ \ldots,\ q_{\mathrm{pos}}\cdot k_{\mathrm{pos}-1}}_{\text{keys of earlier tokens}},\ q_{\mathrm{pos}}\cdot k_{\mathrm{pos}}\,]\Big)\\
 o_{\mathrm{pos}} &= \underbrace{a_0 v_0+\cdots+a_{\mathrm{pos}-1}v_{\mathrm{pos}-1}}_{\text{values of earlier tokens}}+a_{\mathrm{pos}}v_{\mathrm{pos}}
 \end{aligned}
 $$
'''
# src:
# 
# 第 pos 个 token 在每一个注意力头中算出自己的查询 $q_{\mathrm{pos}}$、键 $k_{\mathrm{pos}}$ 与值 $v_{\mathrm{pos}}$。一个注意力头的权重 $a$ 与输出 $o_{\mathrm{pos}}$ 如下，$d$ 是这个注意力头的维度。
# 
#  $$
#  \begin{aligned}
#  {}[a_0,\ldots,a_{\mathrm{pos}}] &= \mathrm{softmax}\Big(\tfrac{1}{\sqrt{d}}\,[\,\underbrace{q_{\mathrm{pos}}\cdot k_0,\ \ldots,\ q_{\mathrm{pos}}\cdot k_{\mathrm{pos}-1}}_{\text{之前 token 的键}},\ q_{\mathrm{pos}}\cdot k_{\mathrm{pos}}\,]\Big)\\
#  o_{\mathrm{pos}} &= \underbrace{a_0 v_0+\cdots+a_{\mathrm{pos}-1}v_{\mathrm{pos}-1}}_{\text{之前 token 的值}}+a_{\mathrm{pos}}v_{\mathrm{pos}}
#  \end{aligned}
#  $$

['kv-step.highlight.1']
src_hash = '354de8c2'
text = 'Computing the attention of token pos needs the keys and values of tokens 0 to pos−1'
# src: 计算第 pos 个 token 的注意力，需要第 0 到 pos−1 个 token 的键与值

['kv-step.notes.1']
src_hash = '0826377a'
text = '''
When token pos passes through the model, it is first turned into its vector, and this vector passes through the 28 layers in turn, each layer computing attention and then the feed-forward step. The vector after the last layer gives the token with the highest score.
The formula is the attention computation of one head in one layer, with d = 128 in the real model. From its input, a layer computes the query of token pos, 16 heads of 128 floats each, and then its key and value, each 8 heads of 128 floats, that is, 1024 floats each: its row of keys and its row of values in this layer. The row of keys and the row of values of token j in this layer are called row j of this layer, and every token has these two rows in every layer.
The 16 query heads share the key-value heads two by two, in the order of their numbers, for example query heads 0 and 1 both use key-value head 0. In the formula, q_pos is the 128 numbers of one query head, and k_j and v_j are the 128 numbers of the matching key-value head in row j of the keys and in row j of the values.
The first equation computes q_pos · k_j / √d for j = 0 to pos, and softmax normalizes over these pos+1 numbers to give the weights a_0 to a_pos. The denominator of softmax involves all the keys, so every weight depends on the keys of earlier tokens, a_pos included.
The second equation adds up v_0 to v_pos by these weights to give the output o_pos of this head, 128 floats. The outputs of the 16 heads are placed one after another as 2048 floats, go through one linear transformation and are added to the vector of this token.
Rows 0 to pos−1 belong to earlier tokens. The input of a token to a layer depends only on this token and the tokens before it, so its key and value are the same at every later step as when they were first computed.
The next page compares two approaches: recomputing these rows at every step, or saving them and reading them directly.
'''
# src:
# 
# 第 pos 个 token 经过模型时，先换成它的向量，这个向量依次经过 28 层，每一层先做注意力，再做前馈计算。由最后一层之后的向量得到分数最高的 token。
# 公式是一层中一个头的注意力计算，真实模型中 d = 128。一层由它的输入算出第 pos 个 token 的查询，16 个头，每头 128 个 float，再算出它的键与值，各 8 个头、每头 128 个 float，即各 1024 个 float，这是它在这一层的一行键与一行值。第 j 个 token 在这一层的一行键与一行值称为这一层的第 j 行，每个 token 在每一层都有这样两行。
# 16 个查询头按编号顺序每两个共用一个键值头，比如第 0、1 个查询头都使用第 0 个键值头。公式中的 q_pos 是一个查询头的 128 个数，k_j 与 v_j 是第 j 行键与第 j 行值中属于对应键值头的 128 个数。
# 第一个式子对 j = 0 到 pos 计算 q_pos · k_j / √d，softmax 在这 pos+1 个数上归一化，得到权重 a_0 到 a_pos。softmax 的分母涉及全部的键，所以每一个权重都依赖之前 token 的键，包括 a_pos。
# 第二个式子把 v_0 到 v_pos 按权重相加，得到这个头的输出 o_pos，共 128 个 float。16 个头的输出依次排成 2048 个 float，经过一次线性变换之后加到这个 token 的向量上。
# 第 0 到 pos−1 行属于之前的 token。一个 token 在一层的输入只取决于它与它之前的 token，所以它的键与值在之后的每一步都与第一次算出时相同。
# 下一页比较两种做法：每一步重新计算这些行，或者把它们保存下来直接读取。

['kv-reuse.title']
src_hash = 'a62cf78d'
text = 'Keys and Values of Earlier Tokens'
# src: 之前 token 的键与值

['kv-reuse.slide.1']
src_hash = 'b905d1de'
text = '''
Without a KV Cache, every step recomputes the keys and values of all earlier tokens.
The KV Cache keeps them in memory, and every step computes only one row.
'''
# src:
# 
# 不使用 KV Cache 时，每一步重新计算之前全部 token 的键与值。
# KV Cache 把它们保存在内存中，每一步只计算一行。

['kv-reuse.notes.1']
src_hash = '94903a2a'
text = '''
2 frames. In the figure the column numbered j is token j, and the two cells for key and value in this column are its row j of keys and row j of values in this layer. The orange column is the new token being computed, token pos.
Frame 1 uses no KV Cache. The program saves the input vector of every token in every layer. At every step, in every layer, it recomputes the keys and values of tokens 0 to pos−1 from these vectors, and only then computes the attention of the new token. Red marks these repeated computations. At step pos each layer recomputes pos rows, so the longer the conversation, the more each step recomputes.
Frame 2 is the KV Cache. The blue dashed box is what the KV Cache keeps: the keys and values of the earlier tokens in this layer. The box shows only which rows exist. The attention computation writes the key and value of the new token to row pos and then reads rows 0 to pos, where green marks the earlier rows, read directly. After all 28 layers are written, this token enters the cache, and every later step reads its rows directly.
In both approaches each token goes through the same operations in the same order: a row in the cache is exactly the key or the value obtained when this token was first computed. So the answers of the two approaches are identical byte for byte, which is also the criterion of a correct KV Cache.
What follows first shows how these keys and values are kept in memory, then how a turn of the conversation writes and reads them.
'''
# src:
# 
# 共 2 帧，图中编号为 j 的一列是第 j 个 token，这一列中键与值的两格是它在这一层的第 j 行键与第 j 行值。橙色的一列是正在计算的新 token，即第 pos 个。
# 第 1 帧不使用 KV Cache。程序保存每个 token 在每一层的输入向量，每一步在每一层由它们重新计算第 0 到 pos−1 个 token 的键与值，然后才做新 token 的注意力。红色是这些重复的计算。第 pos 步每层重新计算 pos 行，对话越长，每一步重新计算得越多。
# 第 2 帧是 KV Cache。蓝色虚线框是 KV Cache 中保存的、之前 token 在这一层的键与值，框中只表示有哪些行。注意力计算把新 token 的键与值写入第 pos 行，再读取第 0 到 pos 行，绿色是直接读取的之前各行。28 层都写完之后，这个 token 进入缓存，之后的每一步都直接读取它的行。
# 两种做法中每个 token 经过相同的运算，次序也相同：缓存中的一行就是这个 token 第一次计算时得到的键或值。所以两种做法的回答逐字节相同，这也是 KV Cache 是否正确的判据。
# 接下来先看这些键与值怎样保存在内存中，再看一轮对话怎样写入与读取它们。


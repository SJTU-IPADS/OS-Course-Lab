<rect x="48.0" y="18.0" width="434.0" height="184.0" rx="8" fill="#ffffff" stroke="#0e2841" stroke-width="2.0"/>
<text x="66.0" y="44.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="17" font-weight="bold" fill="#0e2841" text-anchor="start">显存中的 KV Cache（容量已满）</text>
<rect x="66.0" y="56.0" width="398.0" height="38.0" rx="5" fill="#eef2f4" stroke="#9fb5c3" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="82.0" y="81.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#5a6b78" text-anchor="start">会话 1（使缓存失效）</text>
<text x="448.0" y="81.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">释放显存 → 放入会话 4</text>
<rect x="66.0" y="102.0" width="398.0" height="38.0" rx="5" fill="#eaf3f7" stroke="#156082" stroke-width="1.6"/>
<text x="82.0" y="127.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#0e2841" text-anchor="start">会话 2</text>
<text x="448.0" y="127.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#5a6b78" text-anchor="end">距上次访问：2 分钟</text>
<rect x="66.0" y="148.0" width="398.0" height="38.0" rx="5" fill="#eaf3f7" stroke="#156082" stroke-width="1.6"/>
<text x="82.0" y="173.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="16" font-weight="bold" fill="#0e2841" text-anchor="start">会话 3</text>
<text x="448.0" y="173.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#5a6b78" text-anchor="end">距上次访问：1 分钟</text>
<line x1="486.0" y1="75.0" x2="542.0" y2="75.0" stroke="#2e7d4f" stroke-width="2.2" marker-end="url(#ah-2e7d4f)"/>
<rect x="548.0" y="66.0" width="356.0" height="96.0" rx="6" fill="#e5f3ea" stroke="#2e7d4f" stroke-width="1.6"/>
<text x="726.0" y="111.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="17" font-weight="bold" fill="#0e2841" text-anchor="middle">直接使会话 1 的缓存失效</text>
<text x="726.0" y="132.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="14" font-weight="normal" fill="#5a6b78" text-anchor="middle">立即释放显存空间，供会话 4 使用</text>
<text x="480.0" y="242.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="19" font-weight="bold" fill="#0e2841" text-anchor="middle">② 显存不足时直接使部分 KV Cache 失效（invalidate），腾出显存空间</text>
<rect x="245.4" y="263.0" width="24.0" height="17.0" rx="3" fill="#eaf3f7" stroke="#156082" stroke-width="1.4"/>
<text x="277.4" y="277.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="15" font-weight="normal" fill="#5a6b78" text-anchor="start">保留的 KV Cache</text>
<rect x="418.6" y="263.0" width="24.0" height="17.0" rx="3" fill="#eef2f4" stroke="#9fb5c3" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="450.6" y="277.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="15" font-weight="normal" fill="#5a6b78" text-anchor="start">直接使失效并释放</text>
<rect x="592.6" y="263.0" width="24.0" height="17.0" rx="3" fill="#e5f3ea" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="624.6" y="277.0" font-family="PingFang SC, Noto Sans CJK SC, Source Han Sans SC, sans-serif" font-size="15" font-weight="normal" fill="#5a6b78" text-anchor="start">回收显存空间</text>
</svg>

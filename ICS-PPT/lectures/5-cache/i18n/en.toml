# 第 2 帧：解码第 2 步只为「出门」计算 $q_6$、$k_6$、$v_6$，缓存增加一行，变为 6 行。
# 与上一页相比，$X$、$Q$、$A$、$O$ 每步只有一行，$K$、$V$ 的旧行从缓存读出，不再重新计算。缓存不改变计算的结果。

text = 'The $k$ and $v$ of existing tokens are the same at every step and can be saved for reuse'
# src: 已有 token 的 $k$、$v$ 每一步都相同，可以保存下来重复使用

['kv-naive.notes.1']
src_hash = '3f70150b'
text = '''
2 frames, with the same layout as the previous page.
Frame 1: the first 4 rows of $X$ are the same as in the previous step, and row 5 is the new token 「适合」 (orange). $Q$, $K$, $V$, $A$ and $O$ are all recomputed from $X$. The red rows were already computed in the previous step and are computed again in this step.
Frame 2: generating the next token 「出门」 uses only the last row of $O$, $o_5$. $o_5$ is computed from the last row of $A$ and all of $V$, and the last row of $A$ is computed from $q_5$ and all of $K$. So $q_1$ to $q_4$ and the first 4 rows of $A$ and $O$ are not needed (grey, dashed). What is needed is $q_5$ together with $k_1$ to $k_5$ and $v_1$ to $v_5$.
$k_1$ to $k_4$ and $v_1$ to $v_4$ are computed from $x_1$ to $x_4$ and the unchanged weights. In the first layer $x_i$ is the vector of a token and does not change. In later layers $x_i$ is row i of the output of the layer before, which the causal mask makes depend only on the first i tokens, so it does not change either. These $k$ and $v$ are therefore exactly the same as in the previous step.
The repetition happens for every generated token. Step t recomputes the k and v of t tokens, so the longer the generation, the more repeated computation.
'''
# src:
# 
# 共 2 帧，布局与上一页相同。
# 第 1 帧：$X$ 的前 4 行与上一步相同，第 5 行是新 token「适合」（橙色）。$Q$、$K$、$V$、$A$、$O$ 全部从 $X$ 重新算出。红色的行在上一步已经算过，这一步又算了一遍。
# 第 2 帧：生成下一个 token「出门」只用 $O$ 的最后一行 $o_5$。$o_5$ 由 $A$ 的最后一行与全部 $V$ 算出，$A$ 的最后一行由 $q_5$ 与全部 $K$ 算出。所以 $q_1$ 到 $q_4$、$A$ 与 $O$ 的前 4 行都不需要（灰色虚线）。需要的是 $q_5$ 与 $k_1$ 到 $k_5$、$v_1$ 到 $v_5$。
# $k_1$ 到 $k_4$、$v_1$ 到 $v_4$ 由 $x_1$ 到 $x_4$ 与不变的权重算出。第一层的 $x_i$ 是 token 的向量，不变。之后各层的 $x_i$ 是上一层第 i 行的输出，因果掩码使它只依赖前 i 个 token，也不变。所以这些 $k$、$v$ 与上一步的结果完全相同。
# 每生成一个 token 都重复一次。第 t 步要重算 t 个 token 的 k、v，生成越长，重复的计算越多。


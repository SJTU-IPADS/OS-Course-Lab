['cache-features.slide.2']
src_hash = 'f3b6c60e'
text = '''
- **Block fetching**: when the data is not cached, even if only one byte is needed, the entire block is fetched, bringing adjacent bytes into the cache in advance.
- **Placement and replacement policies**: the placement policy determines where a newly fetched block should be placed. The replacement policy determines which existing block should be evicted when those positions have no free space.
'''
# src:
# 
# - **按块取入**：数据未缓存时，即使只需要一个字节，也会取入整个块，相邻字节提前取入。
# - **放置与替换策略**：放置策略决定新取入的块应该放在哪些位置，替换策略决定当这些位置无空闲时应该逐出哪个旧块。

['cache-features.notes.2']
src_hash = '7372f184'
text = '''
When the CPU reads a byte that is not cached, the entire block containing it is fetched from main memory into the cache. Adjacent bytes in the same block are fetched with it and can serve subsequent accesses. Fetching entire blocks uses spatial locality.
The placement policy specifies which cache positions can hold a given main-memory block. When a new block is fetched, the cache first looks for an empty position among these candidates. When all candidate positions are occupied, the replacement policy determines which existing block to evict to make room for the new block.
'''
# src:
# 
# CPU 读取一个未缓存的字节时，将其所在的整个块从内存取入缓存，同一块内的相邻字节也随之进入缓存，后续访问可以利用这些数据。这一按块取入的机制利用了空间局部性。
# 放置策略规定一个内存块可以放入缓存中的哪些位置。需要取入新块时，先在这些候选位置中寻找空位。候选位置已满时，替换策略决定逐出其中哪个旧块，为新块腾出位置。


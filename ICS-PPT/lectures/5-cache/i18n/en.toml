['exercise-rowcol-answer.notes.1']
src_hash = '6e3cdb2c'
text = '''
The 48 KiB capacity counts data only, excluding tags and valid bits. S=C/(E×B)=49152/(12×64)=64, and the total number of lines is 64×12=768. Each block holds 64/4=16 int elements. The field widths are b=6, s=6 and t=64−6−6=52. Associativity does not occupy a separate address field. The exercise assumes 64-bit byte addresses.
Each row contains 512 int elements, occupying 512×4=2048 bytes, or exactly 2048/64=32 blocks. The matrix contains 512×32=16384 blocks with 16 int elements per block, giving 512²=262144 reads.
Row-wise traversal reads the 16 int elements in a block consecutively. The first read misses and the remaining 15 hit. There are 16384 misses, giving a miss rate of 16384/262144=1/16=6.25%.
Column-wise traversal advances by 32 blocks from one row to the next. With 64 sets, column 0 therefore accesses sets 0, 32, 0, 32 in turn. The 256 blocks in even-numbered rows map to set 0, and the 256 blocks in odd-numbered rows map to set 32, each of which has only 12 lines. References to a block are separated by 255 other blocks in its set, so LRU has already evicted it. The next column reads the same blocks in the same order and must fetch them again. All 262144 reads therefore miss, giving a miss rate of 100%. Each subsequent group of 16 columns uses a new pair of sets, with the same result.
The 512 blocks in a complete column occupy 32 KiB, less than 48 KiB, so the total cache capacity could hold these blocks. Only 24 lines across two sets are available to the column, and the fixed placement causes conflict misses. The model counts only matrix reads in the specified cache. The opening measurements use a 4096×4096 matrix, while the exercise uses a 512×512 matrix, so the ratio of miss counts cannot be converted directly to the measured running-time ratio.
The animation retains reads 1, 2, 3, 24, 25, 512, 513 and 514 from the complete access stream. Omitted accesses still participate in the LRU simulation. The first three frames read W[0][0], W[1][0] and W[2][0]. After read 24 accesses W[23][0], sets 0 and 32 each hold 12 blocks. Read 25 accesses W[24][0], evicting the block for row 0 from set 0. After read 512 accesses W[511][0], set 0 retains the blocks for even rows 488 through 510, and set 32 retains those for odd rows 489 through 511. Read 513 accesses W[0][1]. Its block has already been evicted, so the read misses and replaces the block for row 488 in set 0. Read 514 accesses W[1][1], which also misses and replaces the block for row 489 in set 32.
'''
# src:
# 
# 48KiB只计数据，不计标记与有效位。S=C/(E×B)=49152/(12×64)=64，总行数为64×12=768。每块包含64/4=16个int。b=6，s=6，t=64−6−6=52，路数不单独占地址位。64位是题设的字节地址宽度。
# 每行512个int，占512×4=2048字节，正好是2048/64=32块。整个矩阵共有512×32=16384块，每块16个int，总读取次数512²=262144。
# 按行顺序连续使用同一块的16个int。第一次读取miss，余下15次读取hit。总miss为16384，miss rate=16384/262144=1/16=6.25%。
# 按列跨过一行时前进32块，缓存有64组，因此第0列依次访问组0、32、0、32。偶数行的256块映射到组0，奇数行的256块映射到组32，每组只有12行。同一块两次引用之间有255个其他同组块，LRU已经将它逐出。下一列仍读取这些块，但要按相同次序重新取入，因此所有262144次读取均miss，miss rate=100%。后续每16列切换为一对新的组，结论相同。
# 完整一列的512块共32KiB，小于48KiB，总容量足够容纳这些块。两组仅有24行可用于这一列，固定放置造成冲突miss。模型分析只统计指定缓存中的矩阵读取。开头实测使用4096×4096矩阵，练习使用512×512矩阵，miss次数比不能直接换算为实测运行时间比。
# 动画保留完整访存流中的第1、2、3、24、25、512、513、514次读取，中间省略的访问仍参与LRU模拟。前3帧分别读W[0][0]、W[1][0]、W[2][0]。第24次读W[23][0]后，组0与组32各有12块。第25次读W[24][0]，组0逐出行0的块。第512次读W[511][0]后，组0保留行488、490至510的块，组32保留行489、491至511的块。第513次读W[0][1]，行0的块已经逐出，miss并替换组0中行488的块。第514次读W[1][1]，同样miss并替换组32中行489的块。


['mountain-image.notes.1']
src_hash = '0f94e3d9'
text = '''
The heat map is the whole table for working sets from 8 KB to 128 MB and strides 1 to 16. The column for stride 1: 50.7 GB/s at 32 KB and 14.1 GB/s at 128 MB, a ratio of 3.6. The row for 128 MB: 14.1 GB/s at stride 1 and 2.1 GB/s at stride 8, a ratio of 6.7.
The vertical axis of the heat map is the working set size and the horizontal axis is the stride; the color and the number in each cell are the read throughput (GB/s).
From bottom left to top right the throughput decreases gradually: going up means a larger working set, with the data in a slower level. Going right means a larger stride, with less of each block used.
The orange dashed lines mark the capacity of each level: L1 data cache 48 KB (between 32 KB and 64 KB), L2 1280 KB (between 1 MB and 2 MB), L3 24 MB (between 16 MB and 32 MB). The throughput changes abruptly at the L1 and L2 boundaries. At the L3 boundary, the throughput decreases gradually from 8 MB to 32 MB to the level of main memory, and does not drop suddenly at the capacity.
For strides 11 to 15, the 64 KB row reaches about 40 GB/s, because every access falls in a different block and the total number of accessed blocks is below the L1 capacity (about 750 blocks, about 47 KB), so the data stays in L1 when it is read repeatedly.
The column for stride 16 is low overall, and the cause has not been investigated further.
'''
# src:
# 
# 热力图是工作集 8 KB 至 128 MB、步长 1 至 16 的整张表。步长 1 的一列：32 KB 为 50.7 GB/s，128 MB 为 14.1 GB/s，比值 3.6。128 MB 的一行：步长 1 为 14.1 GB/s，步长 8 为 2.1 GB/s，比值 6.7。
# 热力图的纵轴是工作集大小，横轴是步长，颜色与格中的数是读吞吐率（GB/s）。
# 左下到右上，吞吐率逐渐降低：向上是工作集变大，数据落在更慢的层。向右是步长增大，一个块被使用得更少。
# 橙色虚线标出各层的容量：L1 数据缓存 48 KB（32 KB 与 64 KB 之间）、L2 1280 KB（1 MB 与 2 MB 之间）、L3 24 MB（16 MB 与 32 MB 之间）。L1 与 L2 的边界处吞吐率突变。L3 的边界处，吞吐率在 8 MB 到 32 MB 之间逐步降到内存的水平，没有在容量处突然下降。
# 步长 11 至 15 在 64 KB 一行的值高达约 40 GB/s，是因为这时每次访问都落在不同的块中，被访问的块总数少于 L1 的容量（约 750 块，约 47 KB），所以重复读取时仍留在 L1 中。
# 步长 16 的一列整体偏低，原因没有进一步查明。


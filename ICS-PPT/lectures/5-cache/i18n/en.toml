['kv-cache.notes.1']
src_hash = 'adf26c13'
text = '''
2 frames, with the same layout as the previous two pages. The blue dashed box is the KV Cache. Light blue rows are read from the cache, and orange rows are computed in this step.
Frame 1: prefill has already stored $k_1$ to $k_4$ and $v_1$ to $v_4$ in the cache. Decode step 1 uses only $x_5$ of the new token 「适合」 to compute $q_5$, $k_5$, $v_5$, and appends $k_5$, $v_5$ to the cache. $q_5$ and the 5 $k$ in the cache give one row of $A$ (1 × (N+1)), and with the 5 $v$ this gives $o_5$, which generates 「出门」.
Frame 2: decode step 2 computes $q_6$, $k_6$, $v_6$ only for 「出门」, and the cache gains a row, growing to 6 rows.
Compared with the previous page, $X$, $Q$, $A$ and $O$ have only one row per step, and the old rows of $K$ and $V$ are read from the cache instead of being recomputed. The cache does not change the result of the computation.
Every layer and every head has its own KV Cache.
'''
# src:
# 
# 共 2 帧，布局与前两页相同。蓝色虚线框内是 KV Cache，浅蓝色的行从缓存读出，橙色的行是本步新算的。

['cache-line-use.notes.1']
src_hash = '18c8a5e9'
text = '''
Both caches have 4 lines, each holding 2 bytes, and have the same capacity. The access sequence is 0, 8, 0, 8. These addresses belong to block 0 (addresses 0–1) and block 4 (addresses 8–9).
The direct-mapped cache has 4 sets with one line per set. Blocks 0 and 4 both map to set 0. Alternating accesses replace the existing block in set 0 repeatedly, while the other 3 lines remain empty. The first two accesses are the first reference to each block. The last two accesses miss because the fixed mapping forces replacement, making them conflict misses.
The fully associative cache treats all lines as one set and allows a block to occupy any line. Block 4 can use another empty line, so blocks 0 and 4 can remain in the cache together. Any empty line can hold a newly fetched block, and an existing block does not need to be evicted while an empty line remains.
'''
# src:
# 
# 两种缓存均有 4 行，每行保存 2 字节，容量相同。依次读取地址 0、8、0、8，它们属于块 0（地址 0–1）与块 4（地址 8–9）。
# 直接映射缓存有 4 个组，每组只有一行。块 0 与块 4 都映射到组 0，交替读取这两个地址时，组 0 不断替换已有块，而另外 3 行仍然空闲。前两次是各块的首次访问，后两次因固定映射造成的替换而 miss，属于冲突 miss。
# 全相联缓存把所有行作为一个组，块可以放入任意一行。块 4 可以使用另一条空闲行，块 0 与块 4 能够同时保留。所有空闲行都可用于取入新块，缓存有空闲行时无需逐出已有块。


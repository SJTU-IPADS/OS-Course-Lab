text = 'Cache-Friendly Code'
# src: 缓存友好的代码

['friendly-rules.slide.1']
src_hash = 'a8a0ec91'
text = '''
Cache-friendly code gives the access sequence locality and follows three rules:
1. **Inner loop**: its body executes the most times, so whether its accesses hit has the greatest effect.
2. **Reference the same variable repeatedly** (temporal locality): local variables are kept in registers, and the other variables stay in the cache after their first reference.
3. **Reference data in storage order with stride 1** (spatial locality): the elements within a block are used one after another, and only the first reference to each block misses.
'''
# src:
# 
# 缓存友好的代码使访问序列有局部性，遵循三条规则：
# 1. **内层循环**：它的循环体执行的次数最多，它的访问是否 hit 影响最大。
# 2. **重复引用同一变量**（时间局部性）：局部变量放在寄存器中，其余变量在第一次引用之后留在缓存中。
# 3. **以步长 1 按存放顺序引用数据**（空间局部性）：一个块内的元素依次被使用，每个块只有第一次引用 miss。

['friendly-rules.columns.1.col.1']
src_hash = '427f5a5c'
text = '''
```c
int sum_rows(int W[M][N]) {
    int sum = 0;
    for (int i = 0; i < M; i++)
        for (int j = 0; j < N; j++)
            sum += W[i][j];
    return sum;
}
```
'''

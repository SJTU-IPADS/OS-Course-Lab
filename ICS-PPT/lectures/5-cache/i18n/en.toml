['kv-attention.notes.1']
src_hash = '8fcd6105'
text = '''
3 frames, one for each step of attention. In the figure, one row of each matrix corresponds to one token, and purple marks the model parameters.
Frame 1: row i of $X$, $x_i$, is the vector of token i. Multiplying by $W_Q$, $W_K$, $W_V$ (each d × d) gives $Q = XW_Q$, $K = XW_K$, $V = XW_V$, all N × d. Row i is written $q_i$, $k_i$, $v_i$, called the query, the key and the value.
Frame 2: $QK^\top$ is an N × N matrix whose row i, column j is the inner product of $q_i$ and $k_j$. The causal mask removes the positions with j > i (the dashed cells). After division by $\sqrt d$ and a row-wise softmax, this gives the weight matrix $A$. The weights of each row are non-negative and sum to 1.
Frame 3: $O = AV$. Row i, $o_i$, is the sum of $v_1$ to $v_i$ weighted by row i. The last row of $O$ goes through the following layers and is used to generate the next token 「适合」.
The causal mask makes token i depend only on the first i tokens, so the result of row i does not depend on tokens at positions after i. This property is used on the next two pages. In the figure N = 4, and the vector length is d.
A real model has many heads and many layers, and each head has its own $W_Q$, $W_K$, $W_V$. The $X$ of the first layer comes from the table of token vectors, and the $X$ of each later layer is the output of the layer before. The analysis of one head in one layer applies to all of them.
'''
# src:
# 
# 共 3 帧，对应注意力的三步。图中每个矩阵的一行对应一个 token，紫色是模型参数。
# 第 1 帧：$X$ 的第 i 行 $x_i$ 是第 i 个 token 的向量，乘以 $W_Q$、$W_K$、$W_V$（都是 d × d）得到 $Q = XW_Q$、$K = XW_K$、$V = XW_V$，三者都是 N × d。第 i 行记作 $q_i$、$k_i$、$v_i$，分别称为查询、键与值。
# 第 2 帧：$QK^\top$ 是 N × N 的矩阵，第 i 行第 j 列是 $q_i$ 与 $k_j$ 的内积。因果掩码把 j > i 的位置去掉（虚线格），再除以 $\sqrt d$，按行作 softmax，得到权重矩阵 $A$。每行的权重非负且和为 1。
# 第 3 帧：$O = AV$，第 i 行 $o_i$ 是 $v_1$ 到 $v_i$ 按第 i 行的权重相加。$O$ 的最后一行经过后续的层，用于生成下一个 token「适合」。
# 因果掩码（mask）使第 i 个 token 只依赖前 i 个 token，第 i 行的结果与位置大于 i 的 token 无关。这个性质在下面两页用到。图中 N = 4，向量长度为 d。
# 实际的模型有多个头与多个层，每个头各有一组 $W_Q$、$W_K$、$W_V$。第一层的 $X$ 来自 token 的向量表，之后各层的 $X$ 是上一层的输出。一个头一层的分析适用于全部。


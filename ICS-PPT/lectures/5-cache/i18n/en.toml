['stride-1.notes.1']
src_hash = '6b146dc5'
text = '''
There are 8 frames, and each frame reads one more element. The top left is the two-dimensional array as the program sees it, with each row corresponding to one block in memory. The top right is the cache. Below is the arrangement of the same 16 elements in memory, where every 4 adjacent elements form a block. The number at the top right corner of a cell is the order of reading, green means hit, and red means miss.
The cache here is simplified: a block can go in any position of the cache, and a free position is used when there is one (placement policy); when the cache is full, the block that has gone unused for the longest is evicted (replacement policy). A frame with a miss marks below the figure the policy used in that step.
Frame 1: read W[0][0]. The cache is empty and block 0 is not in the cache, so it is a miss, and the whole block 0 is fetched into the cache, using the placement policy: it goes into a free position. Frames 2 to 4: read W[0][1], W[0][2] and W[0][3]. They are in the same block as W[0][0], the block is already in the cache, and all are hits.
Frame 5: read W[1][0], which enters block 1. It is a miss, and block 1 is put into the other free position of the cache (placement policy). Row traversal uses only 2 blocks and no block is evicted, so the replacement policy is not used. Frames 6 to 8: read the other three elements of block 1, and all are hits.
The stride-1 reference pattern is the case with the best spatial locality: after each block is fetched into the cache, all its elements are used in turn, and only the first read of each block is a miss.
'''
# src:
# 
# 共 8 帧，每帧多读一个元素。左上是程序看到的二维数组，每一行对应内存中的一个块，右上是缓存，下方是同样 16 个元素在内存中的排列，每 4 个相邻的元素是一个块。格子右上角的数字是读取的先后，绿色表示 hit，红色表示 miss。
# 这里的缓存是简化的：块可以放在缓存的任一个位置，有空位时放入空位（放置策略）；缓存已满时逐出最久没有被使用的块（替换策略）。miss 的帧在图下方标出这一步用到的策略。
# 第 1 帧：读 W[0][0]，缓存为空，块 0 不在缓存中，miss，整个块 0 被取入缓存，用到放置策略：放入空位。第 2 到第 4 帧：读 W[0][1]、W[0][2]、W[0][3]，它们与 W[0][0] 在同一个块里，块已在缓存中，都 hit。
# 第 5 帧：读 W[1][0]，进入块 1，miss，块 1 放入缓存的另一个空位（放置策略）。按行遍历只用到 2 个块，没有块被逐出，替换策略没有用到。第 6 到第 8 帧：读块 1 的其余三个元素，都 hit。
# 步长为 1 的引用模式是空间局部性最好的情形：每个块取入缓存之后，它的所有元素都被依次用到，每个块只有第一次读取 miss。


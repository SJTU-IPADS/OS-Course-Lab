['matmul-run.notes.1']
src_hash = 'a17b2a60'
text = '''
`matmul_order.c` writes the six orders as six functions, each computing the same product; for n = 768 each of the three matrices is 4.5 MB, which exceeds L2. The program times each function and divides the total time by the cube of n to obtain the time per inner iteration.
Measured: the ijk class 1.46 ns, the kij class 0.48 ns, the jki class 3.19 ns. The ratio of the miss counts 0.25 : 1.125 : 2.0 is 1 : 4.5 : 8. The ratio of the times is close to the ratio of the miss counts but not equal to it: the processor executes several memory instructions at the same time and fetches later blocks ahead of time, so part of the miss time overlaps with other work; this is only stated here and not developed.
The two orders of the same class have the same inner loop and similar times, which is a direct test of the statement that the inner loop determines the misses.
'''
# src:
# 
# `matmul_order.c` 把六种顺序写成六个函数，每个函数计算同一个乘积，n = 768 时三个矩阵各 4.5 MB，超过 L2。程序对每个函数计时，把总时间除以 n 的三次方，得到每次内层迭代的时间。
# 实测：ijk 类 1.46 ns，kij 类 0.48 ns，jki 类 3.19 ns。miss 次数之比 0.25 : 1.125 : 2.0 即 1 : 4.5 : 8。时间之比与 miss 次数之比数值接近但不相等：处理器同时执行多条访存指令，并提前取入后续的块，使一部分 miss 的时间与其他工作重叠，这里只陈述这一点，不展开。
# 同一类的两种顺序内层循环相同，时间接近，是对“内层循环决定 miss”的直接检验。

['mountain-def.title']
src_hash = '99e24344'
text = 'The Memory Mountain'
# src: 存储器山

['mountain-def.slide.1']
src_hash = 'cde66cbd'
text = '''
The **memory mountain** is the read throughput as a function $f(\text{size}, \text{stride})$ of two parameters: read the first size bytes of an array (the working set), one element in every stride elements; the throughput is the number of bytes read per second.
- size determines the level at which the data stays when it is read repeatedly: temporal locality.
- stride determines the number of elements read in a block: spatial locality.
'''
# src:
# 
# **存储器山**（memory mountain）是读吞吐率关于两个参数的函数 $f(\text{size}, \text{stride})$：读数组的前 size 个字节（工作集），每隔 stride 个元素读一个，吞吐率是每秒读取的字节数。
# - size 决定重复读取时数据留在哪一层：时间局部性。
# - stride 决定一个块中被读取的元素个数：空间局部性。

['mountain-def.notes.1']
src_hash = 'bafdf9a9'
text = '''
The memory mountain puts the rules of this part onto one function. The two arguments correspond to the two kinds of locality: the working set size changes whether the data can stay in a higher level, and the stride changes how much of a block is used.
The array in the figure consists of 8-byte longs, and the thick lines are 64-byte blocks, with 8 longs per block. Orange marks the elements that are read. With stride 1 every element is read and all 8 elements of a block are used. With stride 4 only 2 elements of each block are read. The gray part is outside the working set and is not read.
The measurement reads the same working set repeatedly, so from the second pass on, data that fits in a level stays in that level.
'''
# src:
# 
# 存储器山把本部分的规则放到一个函数上。函数的两个自变量对应两种局部性：工作集大小改变数据能否留在较高的层，步长改变一个块被使用的程度。
# 图中的数组由 8 字节的 long 组成，粗线是 64 字节的块，每块 8 个 long。橙色是被读取的元素：步长 1 读每个元素，一个块内 8 个元素都被使用。步长 4 每个块只读 2 个元素。灰色部分在工作集之外，不被读取。
# 测量时对同一个工作集重复读取，所以第二遍起，能放进某一层的数据就留在这一层。


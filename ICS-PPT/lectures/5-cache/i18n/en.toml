['traverse-col.notes.1']
src_hash = 'f27c2a2a'
text = '''
The two traversals read the same 16 elements and differ only in the order of the outer and inner loops. In column traversal the colours of the two-dimensional array go from light to dark down the columns, while memory is stored by rows, so the colours of the 4 elements within each row of the lower part differ greatly: the next reference after each element is 16 bytes later.
Two consecutive references belong to adjacent rows, and their addresses differ by the number of bytes of a whole row, that is, N × 4 bytes, which is 16 bytes in the figure. The larger the stride, the farther apart the addresses of consecutive references.
The last sentence gives the actual matrix size: for N = 4096 the stride is 4096 × 4 = 16384 bytes. The matrix with N = 4096 is 64 MB in total.
'''
# src:
# 
# 两种遍历读取同样的 16 个元素，只有外层循环与内层循环的次序不同。按列遍历时，二维数组中的颜色沿列由浅到深，而内存按行存放，下半部分的颜色在每一行内的 4 个元素之间相差很大：每个元素的下一次引用在 16 字节之后。
# 相邻两次引用分属相邻的两行，地址相差一整行的字节数，即 N × 4 字节，图中是 16 字节。步长越大，相邻两次引用的地址越远。
# 最后一句给出矩阵的实际尺寸：N = 4096 时步长为 4096 × 4 = 16384 字节。N = 4096 的矩阵共 64 MB。

['spatial-cache.title']
src_hash = '662eea81'
text = 'Spatial locality and caches'
# src: 空间局部性与缓存

['spatial-cache.slide.1']
src_hash = 'd4852732'
text = '''
- Programs typically exhibit **spatial locality**: after accessing a memory location, they often access nearby locations soon afterward.
- CPU designers use this property by introducing **caches**, placing the accessed data and nearby data together in smaller, faster storage.
'''
# src:
# 
# - 程序通常具有**空间局部性**：访问一个存储位置后，往往很快访问其邻近位置。
# - CPU 设计据此引入**缓存**，把访问的数据及其邻近数据一起放入较小、较快的存储空间。

['spatial-cache.slide.2']
src_hash = '9d074716'
text = '- A contiguous region of data is fetched into the cache as a **block**. While the block remains cached, subsequent accesses to its adjacent elements can be served directly by the cache.'
# src:
# 
# - 将一段连续数据作为一个**块**取入缓存。块仍在缓存中时，对其中相邻元素的后续访问可以直接由缓存提供。

['spatial-cache.highlight.1']
src_hash = '353707d5'
text = 'Caches use spatial locality to reduce accesses to slower storage.'
# src: 缓存利用空间局部性，减少对较慢存储的访问。

['spatial-cache.notes.1']
src_hash = '14670a8d'
text = '''
Spatial locality describes the relationship between accessed addresses: after an element is accessed, elements at adjacent addresses may also be accessed soon. sum_rows reads the elements of a row consecutively and has good spatial locality.
In the figure, a block contains 4 int elements in the same row. Reading W[i][0] fetches W[i][0] through W[i][3] into the cache together. While this block remains cached, reads of W[i][1], W[i][2] and W[i][3] can obtain their data directly from the cache. The block size in the figure is used to illustrate the principle.
Both hardware and software designs can use spatial locality. Hardware caches fetch data at contiguous addresses together, and software can read and retain a contiguous region of a file in one operation. Keeping adjacent data together allows one slower read to serve multiple accesses.
'''
# src:
# 
# 空间局部性描述访问的地址关系：访问一个元素后，地址相邻的元素也可能很快被访问。sum_rows 连续读取一行中的元素，具有良好的空间局部性。
# 图中一个块含同一行的 4 个 int。读取 W[i][0] 时，把 W[i][0] 至 W[i][3] 一起取入缓存。只要这个块仍在缓存中，读取 W[i][1]、W[i][2]、W[i][3] 时就可以直接从缓存取得数据。图中的块长只用于说明原理。
# 软硬件设计都可以利用空间局部性。硬件缓存把连续地址的数据一起取入，软件也可以一次读取并保留文件中相邻的一段数据。把空间上相邻的数据一起保存，使一次较慢的读取能够服务多次访问。

['cache-between.title']
src_hash = '1ab7bc88'
text = 'The Cache Between the CPU and Main Memory'
# src: CPU 与内存之间的缓存

['cache-between.slide.1']
src_hash = '413eb55a'
text = '''
- **Registers** and **caches** are inside the CPU, while main memory is outside the CPU.
- The cache and main memory transfer data in **blocks**. A block is a contiguous sequence of bytes in main memory with an aligned starting address and a fixed length.
- The cache holds a subset of main-memory blocks for fast CPU access.
'''
# src:
# 
# - **寄存器**与**缓存**都位于 CPU 内部，内存位于 CPU 外部。
# - 缓存与内存之间以**块**为单位传输，块是内存中起始地址对齐、长度固定的一段连续字节。
# - 缓存保存内存的一部分块，供 CPU 快速访问。

['cache-between.notes.1']
src_hash = 'ccaa3321'
text = '''
The CPU requests reads and writes in units of words, each 1 to 8 bytes. The cache and main memory transfer data in blocks, typically 64 bytes each.
The CPU outline contains registers and caches, while main memory is outside the CPU. The two connections in the figure link registers to the cache and the cache to main memory.
Rounded numbers with units above the connecting arrows show the orders of magnitude of the access latencies for the CPU to obtain the requested data: approximately 1–50 ns for the cache and 100 ns for main memory. These values are teaching illustrations; actual latency varies with the hardware and access conditions. The main-memory time includes the complete process of the CPU waiting for the data.
The values refer to Intel’s Memory Performance in a Nutshell and Arm’s About memory latency. The former gives cache-access examples of approximately 1 ns, 4 ns and 40 ns, while the latter gives a main-memory-access example of approximately 100 ns.
The cache has far less capacity than main memory and holds only a subset of its blocks.
'''
# src:
# 
# CPU 的读写请求以字为单位，字长 1 至 8 字节。缓存与内存之间的传输以块为单位，一个块通常是 64 字节。
# CPU 外框内包含寄存器与缓存，内存位于 CPU 外部。图中的两条连接分别位于寄存器与缓存之间、缓存与内存之间。
# 连接箭头上方用取整后的数字与单位标出 CPU 取得所需数据的访问延迟数量级：缓存约为 1–50 ns，内存约为 100 ns。这些数值用于教学示意，具体时延随硬件和访问条件变化。内存的时间包含 CPU 等待取到数据的完整过程。
# 数值参考 Intel 的 Memory Performance in a Nutshell 与 Arm 的 About memory latency。前者给出约 1 ns、4 ns 与 40 ns 的缓存访问示例，后者给出约 100 ns 的内存访问示例。
# 缓存的容量远小于内存，只能保存内存的一部分块。


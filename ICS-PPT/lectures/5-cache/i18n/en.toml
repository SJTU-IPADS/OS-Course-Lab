- A cache consists of $S=2^s$ **sets**, and each set has $E$ lines.
- Each line holds the $B=2^b$ bytes of one block, plus 1 **valid bit** and $t$ **tag** bits.
- A valid bit of 1 means the line holds a block. The tag identifies the position of this block in main memory.

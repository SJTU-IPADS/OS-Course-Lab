['copy-fail.slide.1']
src_hash = 'f16275b7'
text = '''
The Linux kernel vulnerability **Copy Fail (CVE-2026-31431)** was publicly disclosed on April 29, 2026.
- **Page cache**: file contents kept in memory for reuse when files are read or executed.
- **Zero-copy** reduces copying by sharing data pages. An error in kernel cryptographic processing allowed unauthorized writes to these shared file pages.
'''
# src:
# 
# 2026 年 4 月 29 日，Linux 内核漏洞 **Copy Fail（CVE-2026-31431）** 被公开。
# - **page cache（文件页缓存）**：把文件内容保存在内存中，供文件读取与执行复用。
# - **零拷贝**通过共享数据页减少复制。内核加解密处理中的错误使这些共享文件页被越权写入。


['fa-cache.slide.1']
src_hash = '37ef1808'
text = '''
- A cache with $S=1$ and $E=C/B$ is a **fully associative cache**: the whole cache has only one set.
- There is no set index: $s=0$, $t=m-b=3$.
- A block can be placed in any line. An access compares the tags of all lines at the same time, and it hits if some line has valid bit 1 and an equal tag.
'''
# src:
# 
# - $S=1$、$E=C/B$ 的缓存是**全相联缓存**：整个缓存只有一组。
# - 没有组索引：$s=0$，$t=m-b=3$。
# - 块可以放入任意一行。访问时同时比较全部行的标记，任一行的有效位为 1 且标记相等则 hit。

['fa-cache.notes.1']
src_hash = '378ef8ae'
text = '''
The cache in the figure has 8 lines, and the read is of address 9, binary 1001. The address has no set index, the tag is all the high bits after removing the block offset, 100, and the block offset is 1.
Frame 1: the whole cache has only one set, so no set selection is needed.
Frame 2: the 8 tags are compared with the tag 100 of the address at the same time. Two lines are invalid and do not take part in the comparison. The tag of line 6 is equal to 100, and the tags of the other valid lines are not equal to 100, which is a hit.
Frame 3: the block offset 1 extracts byte 1 within the block of line 6, that is, m[9].
A block of a fully associative cache can be placed in any line, so as long as the cache has an empty line, no conflict miss occurs. The cost is that every line needs a comparator: the more lines, the larger the circuit and the slower the comparison. Therefore fully associative caches are built only with very few lines.
'''
# src:
# 
# 图中的缓存有 8 行，读取地址 9，二进制 1001。地址没有组索引，标记是除去块偏移之后的全部高位 100，块偏移是 1。
# 第 1 帧：整个缓存只有一组，不需要选组。
# 第 2 帧：8 个标记同时与地址的标记 100 比较，两行无效不参与比较，第 6 行的标记等于 100，其余有效行的标记都不等于 100，hit。
# 第 3 帧：用块偏移 1 取出第 6 行块内的第 1 个字节，即 m[9]。
# 全相联缓存的块可以放在任何一行，只要缓存有空行就不会发生冲突 miss。代价是每一行都要有比较器，行数越多，电路越大，比较越慢。所以全相联的缓存只做成行数很少的缓存。


Assumptions of the analysis: $n$ is large, the cache cannot hold the $n$ blocks that contain one column, and a block is 64 bytes and holds 8 doubles.

The three loop variables can be nested in any order, which gives six orders, and the six orders fall into three classes by the variable of the inner loop.
'''
# src:
# 
# 分析假设：$n$ 很大，缓存容纳不下一列所在的 $n$ 个块，块为 64 字节，放 8 个 double。

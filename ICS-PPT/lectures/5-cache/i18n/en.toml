['copy-fail.notes.1']
src_hash = 'bc3d1f69'
text = '''
The page cache is the operating system's in-memory copy of file contents. Reading or executing a file can use its cached contents.
Copy Fail is CVE-2026-31431, publicly disclosed on April 29, 2026. The default target in the published example is /usr/bin/su.
Zero-copy avoids copying by sharing pages. An incorrect in-place operation in the kernel cryptographic interface made shared file pages part of a writable destination, allowing a local unprivileged user to modify cached contents that should have been read-only.
This abnormal write path did not mark the file pages for writeback, so the original file on disk remained unchanged. Executing su used the modified cached contents and could lead to privilege escalation.
The root cause was an unauthorized write to shared cached pages. The difference between the cache and disk was a consequence. Normal write-back permits temporary differences while tracking modifications and ensuring that they are written back when required.
This page explains cached copies, shared data pages, unauthorized modifications, and the execution result. It does not give exploitation steps. The hardware write-policy examples use a CPU, one cache, and memory.
Sources: Theori / Xint, https://copy.fail/ and https://xint.io/blog/copy-fail-linux-distributions .
Linux fix: https://github.com/torvalds/linux/commit/a664bf3d603dc3bdcf9ae47cc21e0daec706d7a5 .
'''
# src:
# 
# page cache 是操作系统在内存中保存的文件内容副本。文件被读取或执行时，系统可以使用已缓存的内容。
# Copy Fail 的编号为 CVE-2026-31431，2026 年 4 月 29 日公开。公开示例的默认目标是 /usr/bin/su。
# 零拷贝通过共享页面避免复制。内核加解密接口的原地处理错误让共享文件页进入可写目标，导致普通本地用户越权修改本应只读的缓存内容。
# 这条异常写入路径没有将文件页标为需要写回，磁盘原文件保持不变。执行 su 时使用修改后的缓存内容，可能导致权限提升。
# 漏洞的根因是对共享缓存页的非法写入。缓存与磁盘的内容不同是其后果。正常写回允许副本暂时不同，同时记录修改并保证需要时写回。
# 这里只说明缓存副本、共享数据页、越权修改与执行结果，不给出利用方法。硬件写策略的例子采用 CPU、缓存与内存三者。
# 来源：Theori / Xint，https://copy.fail/ ，https://xint.io/blog/copy-fail-linux-distributions 。
# Linux 修复：https://github.com/torvalds/linux/commit/a664bf3d603dc3bdcf9ae47cc21e0daec706d7a5 。

['write-problem.title']
src_hash = '7adbbfcc'
text = 'Writes: The Consistency Problem'
# src: 写入的一致性问题

['write-problem.slide.1']
src_hash = 'ab1ca461'
text = 'The cache holds copies of some blocks in memory. After the CPU writes `x = 2`, how should the two copies in the cache and memory be updated?'
# src:
# 
# 缓存保存内存中一部分块的副本。CPU 写入 `x = 2` 后，缓存与内存中的两份数据怎样更新？

['write-problem.slide.2']
src_hash = 'da4d40d2'
text = 'Modifications must be preserved and written to memory before the cache line is replaced.'
# src: 写入之后，必须保存修改，并在替换缓存行之前把新值写入内存。

['write-problem.notes.1']
src_hash = 'dd718689'
text = '''
The figure contains only a CPU, one cache, and memory. Registers and the cache are inside the CPU boundary. Orange marks a newly written copy, and a red outline marks the old value.
Frame 1: the cache and memory each hold a copy of x with value 1.
Frame 2: the CPU writes x = 2, and the block is already cached.
Frame 3: only the cache is updated. Memory still holds 1, so the copies differ.
Frame 4 shows an incorrect action: replace the line with another block without saving its modifications to memory. The new value 2 is lost.
Frame 5: reading x again misses, and the value fetched from memory is 1. The program cannot read the 2 it wrote.
A write policy must therefore specify when memory is updated and ensure that replacement does not lose modifications. The incorrect sequence motivates this requirement.
'''
# src:
# 
# 图中只有 CPU、缓存与内存，寄存器和缓存位于 CPU 外框中。橙色是刚写入的副本，红框标出旧值。
# 第一帧：缓存与内存各保存 x 的一份副本，值都是 1。
# 第二帧：CPU 写 x = 2，该块已在缓存中。
# 第三帧：只更新缓存，内存仍是 1，两份数据不同。
# 第四帧演示一种错误处理：直接用其他块替换这一行，未把修改保存到内存，新值 2 丢失。
# 第五帧：再读 x，缓存 miss，从内存取回的值为 1，程序读不到自己写入的 2。
# 因此必须规定何时更新内存，并确保修改不会在替换时丢失。图中的错误过程用于提出问题。

['write-through.title']
src_hash = 'd4566e09'
text = 'Write Hit: Write-Through'
# src: 写 hit：写直达

['write-through.slide.1']
src_hash = 'ae4fc244'
text = '''
A **write hit** occurs when the block containing the CPU's write address is already cached.

**Write-through** updates the cache and writes the same word to memory on every write hit. A replaced cache line can be discarded.
'''
# src:
# 
# CPU 写入的地址所在的块已在缓存中，称为**写 hit**。
# 
# **写直达**（write-through，也称写穿）：每次写 hit，更新缓存，并把这个字写入内存。缓存行被替换时可以直接丢弃。

['write-through.notes.1']
src_hash = 'e51e2ddd'
text = '''
The right-hand column counts writes to the cache and memory. One arrow transfers one word.
The four frames show one write hit and the accumulated result: the CPU issues a write, the cache is updated, and the same word is written to memory. Both copies then agree.
Writing the same word 100 times updates the cache 100 times and sends 100 word writes to memory. The line has no modifications awaiting transmission to memory, so it can be discarded when replaced.
The figures explain data transfers without expanding write buffers. Actual CPUs can use a write buffer to reduce waiting, so write-through does not imply that every CPU write blocks until memory has completed the write.
'''
# src:
# 
# 右侧记录缓存与内存被写入的次数，一个箭头表示传送一个字。
# 四帧展开一次写 hit 的处理与累计结果：CPU 发出写入，缓存更新，并把同一个字写入内存，随后两份数据一致。
# 对同一个字连续写 100 次，缓存更新 100 次，内存也接收 100 次字写入。替换缓存行时没有尚未传往内存的修改，可以直接丢弃。
# 这里用数据传输说明写直达，不展开写缓冲。实际 CPU 可以借助写缓冲减少等待，不能据此断言每次写都阻塞到内存完成。

['write-back.title']
src_hash = 'c08ebc30'
text = 'Write Hit: Write-Back'
# src: 写 hit：写回

['write-back.slide.1']
src_hash = 'd1a28591'
text = '''
**Write-back** updates only the cache on a write hit and postpones the memory update until the line is replaced:
- Each line has a **dirty bit**: D = 1 indicates modifications that have not been written back to memory.
- Before replacement, a line with D = 1 is written back to memory as a whole block. A line with D = 0 can be discarded.
'''
# src:
# 
# **写回**（write-back）在写 hit 时只更新缓存，内存的更新推迟到该行被替换时：
# - 每行增加一位**脏位**（dirty bit）：D = 1 表示有尚未写回内存的修改。
# - 替换前，D = 1 的行先整块写回内存，D = 0 的行直接丢弃。

['write-back.notes.1']
src_hash = 'ec74f74d'
text = '''
The cache line has a dirty bit D. Four parallel arrows transfer a whole block.
Frame 1: the CPU writes x = 2, updating only the cache and setting D to 1. Memory still holds 1.
Frame 2: another 99 writes increase x to 101. Each updates only the cache. The cache has been updated 100 times, and memory has not been written.
Frame 3: when the line must be replaced, first write the entire dirty block to memory. The old line still holds the data being written back.
Frame 4: only after writeback completes is the line used for another block. The 100 cached word writes are combined into one whole-block write to memory.
The example assumes that the block remains cached during all 100 writes. D = 1 means writeback is required; the values need not differ, since the program could write the original value again.
'''
# src:
# 
# 缓存行增加脏位 D，四个并排的箭头表示传送整个块。
# 第一帧：CPU 写 x = 2，只更新缓存，D 置 1，内存仍为 1。
# 第二帧：同一个字再写 99 次，x 增至 101，每次只更新缓存。缓存更新 100 次，内存未被写入。
# 第三帧：需要替换该行时，先将脏块完整写入内存。此时旧行仍保存着待写回的数据。
# 第四帧：写回完成后，该行才用于其他块。缓存中的 100 次字写入合为 1 次内存整块写入。
# 本例假设 100 次写期间没有逐出该块。D = 1 表示需要写回，不要求缓存值一定与内存值不同，例如程序也可能写回原值。

['write-allocate.title']
src_hash = 'd84e8b07'
text = 'Write Miss: Write-Allocate'
# src: 写 miss：写分配

['write-allocate.slide.1']
src_hash = '6f1e05cf'
text = "A **write miss** occurs when the block containing the CPU's write address is absent from the cache. **Write-allocate** first fetches the block from memory into the cache, then handles the write as a write hit."
# src:
# 
# CPU 写入的地址所在的块不在缓存中，称为**写 miss**。**写分配**（write-allocate）先把该块从内存取入缓存，再按写 hit 处理。

['write-allocate.slide.2']
src_hash = '373dc61b'
text = 'Write-back is commonly paired with write-allocate: keep the written block cached for reuse by later reads and writes.'
# src: 写回通常配写分配：把写过的块留在缓存中，供后续读写复用。

['write-allocate.notes.1']
src_hash = 'a45a2a21'
text = '''
Frame 1: the CPU writes x = 2. The cache does not hold the block, so the write misses.
Frame 2: fetch the entire block from memory into the cache. Four green arrows transfer the block. An empty line is available in this example, so no dirty block needs to be evicted.
Frame 3: handle the write as a write hit, using write-back in this example. Update cached x and set D to 1. Memory keeps the old value.
Frame 4: subsequent reads and writes hit while the block remains cached. Reusing written data exploits temporal locality, and accessing neighboring words in the block exploits spatial locality.
'''
# src:
# 
# 第一帧：CPU 写 x = 2，缓存中没有该块，写 miss。
# 第二帧：从内存把整个块取入缓存，四个绿色箭头表示整个块。本例有可用的空行，无需逐出脏块。
# 第三帧：按写 hit 处理，图中搭配写回策略。更新缓存中的 x，D 置 1，内存保持旧值。
# 第四帧：该块仍驻留时，后续对它的读写 hit。重复使用已写入的数据利用时间局部性，访问同块中的邻近字利用空间局部性。

['no-write-allocate.title']
src_hash = '55d04955'
text = 'Write Miss: No-Write-Allocate'
# src: 写 miss：非写分配

['no-write-allocate.slide.1']
src_hash = '33e4c971'
text = '**No-write-allocate** does not fetch a block on a write miss. It writes the word directly to memory and leaves the cache unchanged.'
# src:
# 
# **非写分配**（no-write-allocate）在写 miss 时不取块，直接把这个字写入内存，缓存保持不变。

['no-write-allocate.slide.2']
src_hash = '899d86bb'
text = 'Write-through is commonly paired with no-write-allocate: transfer only the written word and avoid fetching the whole block.'
# src: 写直达常配非写分配：这次写只传输一个字，省去取入整个块。

['no-write-allocate.notes.1']
src_hash = '5212d466'
text = '''
Frame 1: the CPU writes x = 2. The cache does not hold the block, so the write misses.
Frame 2: the word bypasses the cache and is written directly to memory. No block is fetched from memory.
Frame 3: memory now holds 2, while the cache still does not hold the block.
Frame 4: reading x later still misses. The block containing x is then fetched into the cache, yielding the new value 2.
Not fetching the block saves a block read on the current write miss, but a later read can still miss. Write-hit and write-miss policies are independent choices. Write-through with no-write-allocate is one common combination.
'''
# src:
# 
# 第一帧：CPU 写 x = 2，缓存中没有该块，写 miss。
# 第二帧：这个字绕过缓存，直接写入内存，不从内存取块。
# 第三帧：内存已变为 2，缓存仍没有该块。
# 第四帧：之后读 x，仍然读 miss，这时才把含 x 的块取入缓存，得到新值 2。
# 不取块可以省去当前写 miss 的一次块读取，但后续读取仍可能 miss。写 hit 与写 miss 的策略是两个独立选择，写直达加非写分配是一种常见组合。

['metrics.title']
src_hash = 'e82572b4'
text = 'Cache Performance Metrics'
# src: 缓存的性能指标

['metrics.slide.1']
src_hash = '9fa4d6be'
text = '''
- **Miss rate** $m$ = number of accesses that miss / total accesses; **hit rate** = 1 − $m$.
- **Hit time** $t_{hit}$: time to deliver cached data to the CPU, including the hit check.
- **Miss penalty** $t_{pen}$: the additional time beyond a hit to fetch the block from memory, fill the cache, and transfer the data.
'''
# src:
# 
# - **miss 率** $m$ = miss 的访问数 / 全部访问数，**hit 率** = 1 − $m$。
# - **hit 时间** $t_{hit}$：缓存 hit 时把数据送到 CPU 的时间，包括判断是否 hit。
# - **miss 惩罚** $t_{pen}$：miss 比 hit 多出的时间，用于从内存取块、填入缓存并传输数据。

['metrics.slide.2']
src_hash = '79d890b7'
text = '''
Assume serial reads with:
- $t_{hit}=1\ \mathrm{ns}$.
- $t_{pen}=100\ \mathrm{ns}$.
- $m=5\%$.
'''
# src:
# 
# 假设串行读取时：
# - $t_{hit}=1\ \mathrm{ns}$。
# - $t_{pen}=100\ \mathrm{ns}$。
# - $m=5\%$。

['metrics.highlight.1']
src_hash = 'a01a94c8'
text = 'Average memory access time $=t_{hit}+m\times t_{pen}=1+5\%\times100=6\ \mathrm{ns}$'
# src: 平均访存时间 $=t_{hit}+m\times t_{pen}=1+5\%\times100=6\ \mathrm{ns}$

['metrics.notes.1']
src_hash = 'd82a0176'
text = '''
This page uses a CPU, one cache, and memory. It considers serial reads and ignores prefetching, overlapping accesses, and the additional cost of writing back dirty evictions.
Miss and hit rates refer to the same execution interval. Every read first checks the cache and pays the hit time; a fraction m also pays the additional miss penalty.
The 1 ns and 100 ns values are teaching assumptions. The 100 ns represents the additional fetch and transfer time after the cache check. It is not obtained by subtracting two independently measured latencies.
A hit takes 1 ns in total, and a miss takes 1 + 100 = 101 ns. Of 100 reads, 95 hit and 5 miss, taking 95 × 1 + 5 × 101 = 600 ns, or 6 ns per read.
Equivalently, each read pays 1 ns and 5% pay an additional 100 ns, giving 1 + 0.05 × 100 = 6 ns.
The figure shows the hit time and total miss time for this example to scale.
'''
# src:
# 
# 本页沿用 CPU、缓存与内存的模型，只考虑串行读取，忽略预取、访问重叠以及逐出脏块的额外写回代价。
# miss 率与 hit 率针对同一段执行统计。所有读取都先查缓存，耗费 hit 时间，其中比例 m 的读取再付出额外的 miss 惩罚。
# 1 ns 与 100 ns 是用于演算的教学假设。100 ns 表示缓存查找之后额外的取块和传输时间，不从两个独立实测的延迟相减。
# hit 总用时 1 ns，miss 总用时 1 + 100 = 101 ns。100 次读取中，95 次 hit，5 次 miss，总时间 95 × 1 + 5 × 101 = 600 ns，平均 6 ns。
# 也可以按每次读取都支付的 1 ns，加上 5% 的读取多支付的 100 ns，得到 1 + 0.05 × 100 = 6 ns。
# 右图按比例画出同一个例子的 hit 时间与 miss 总时间。


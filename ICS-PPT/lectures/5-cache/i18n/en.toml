['kv-generate.slide.1']
src_hash = '22b7acd6'
text = '''
- An LLM processes text in units of **tokens**. A token is a word or a part of a word.
- **Prefill** processes all tokens of the input at once and outputs the first new token. Each step of **decode** appends the token output by the previous step to the end of the input and outputs the next token, until the end-of-sequence token is output.
- The model is a stack of $L$ structurally identical Transformer layers. In each layer, **attention** makes the vector of a token depend on the tokens before it.
'''

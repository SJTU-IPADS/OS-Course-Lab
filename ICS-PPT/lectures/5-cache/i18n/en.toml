['traverse-row.notes.1']
src_hash = 'fef04bc0'
text = '''
The upper part of the figure is the two-dimensional array W[4][4] as the program sees it. The number in each cell is the element itself, and its colour is the order in which the element is read, with pale yellow the earliest and dark blue the latest. The lower part is the arrangement of the same 16 elements in memory: the array is stored by rows, the 4 elements of row 0 come first, followed by rows 1, 2 and 3. The matrix and its arrangement in memory on the next page are exactly the same, and only the summation loop differs.
In row traversal the order of reading is the same as the arrangement in memory, so the colours in the lower part change evenly from light to dark from left to right. Two references adjacent in time differ by 4 bytes in address, that is, one element. This is the case with the best spatial locality.
'''
# src:
# 
# 图的上半部分是程序看到的二维数组 W[4][4]，每个格子里的数字是元素本身，颜色是这个元素被读取的次序，浅黄最早，深蓝最晚。下半部分是同样 16 个元素在内存中的排列：二维数组按行存放，第 0 行的 4 个元素在最前，其后依次是第 1、2、3 行。下一页的矩阵与内存排列完全相同，只有求和的循环不同。
# 按行遍历时，读取的次序与内存中的排列一致，下半部分的颜色从左到右均匀地由浅变深。时间上相邻的两次引用，地址相差 4 字节，也就是一个元素。这是空间局部性最好的情形。


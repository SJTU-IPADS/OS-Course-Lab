# 
# 在一台 x86-64 的 Linux 机器上，读吞吐率如图：颜色越深越高，虚线是各层缓存的容量。
# - 自下而上（工作集增大）：步长 1 时，32 KB 一行比 128 MB 一行快约 4 倍。

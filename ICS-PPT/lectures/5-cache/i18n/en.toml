# - 直接映射中，每个块只能放入指定的缓存行。发生**冲突 miss** 时，其他行可能仍空闲，缓存行利用率较低。

['cache-line-use.slide.2']
src_hash = '72562234'
text = '- A **fully associative cache** allows a block to occupy any line, so every empty line can be used. A new block can be fetched without replacing an existing block whenever an empty line is available.'
# src:

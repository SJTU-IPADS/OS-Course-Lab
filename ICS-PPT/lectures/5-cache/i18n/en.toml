text = '''
The figure draws only the 8 × 8 elements in the top left corner of each matrix. The 8 doubles of each row are one 64-byte block, and the start of the row is aligned to the block. It is assumed that none of these blocks is in the cache when the inner loop starts (n is large). Orange marks the elements accessed in the current iteration, the colour of the outer ring shows a hit (green) or a miss (red), the light blue rows are blocks already in the cache, and the number in a cell is the sequence number of the iteration that accessed the element. Below each matrix are the result of this iteration and the cumulative number of misses, and the line below the figure describes the accesses of this frame. The three frames draw iterations 1, 2 and 8.
Frame 1 (j = 0): B[k][0] misses, and the block in row k of B is fetched. C[i][0] misses, and the block in row i of C is fetched, and the later write to C[i][0] hits because the block is already in the cache. r is in a register, and A is not accessed.
Frame 2 (j = 1): B[k][1] and C[i][1] are in the blocks fetched in frame 1, and both hit.
Frame 3 (j = 7): j = 2 to 7 behave like j = 1 and hit every time. In the 8 iterations B misses 1 time, C misses 1 time, and A is not accessed, 2 misses in total, 2/8 = 0.25 per iteration. The counts in the figure come from simulating a fully associative LRU cache.
The inner loop j runs from 0 to n-1: r = A[i][k] is read into a register before the inner loop, and the inner loop no longer accesses it. B[k][j] is taken along row k of B with stride 1, 1/8 miss. C[i][j] is taken along row i of C with stride 1, 1/8 miss, and each iteration reads and then writes the same element, with the block already in the cache at the write.
Each iteration of this class has two reads (B and C) and one write (C). It has one more write per iteration than the ijk class, but only 0.25 misses, less than a quarter of the ijk class.
'''

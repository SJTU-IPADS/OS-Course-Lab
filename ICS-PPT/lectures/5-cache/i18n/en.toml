['rowcol-miss-rate.notes.1']
src_hash = '10d60847'
text = '''
Miss rate = number of misses / total number of accesses. In the animation model, only the first of every 4 row-wise reads misses. There are 2 misses in 8 reads, giving a miss rate of 25%. Column-wise access cycles through 4 blocks while the cache holds only 2. A block has been evicted when it is accessed again, so all 8 reads miss, giving a miss rate of 100%. These counts come from the LRU cache simulation used in the animations.
The two functions on slide 5 perform the same number of additions and both have time complexity O(N²). Row-wise summation makes better use of adjacent elements in the same block, reducing misses and the time spent waiting for slower storage.
The rates of 25% and 100% are results from the two animation models. The 64 MB matrix program measures running time without measuring the hardware miss rate, so these model rates are not measured rates for that program. Actual results also depend on the capacity, block size and replacement behavior at each cache level, as well as hardware prefetching.
'''
# src:
# 
# miss rate = miss 次数 / 全部访问次数。动画的模型中，按行访问的每 4 次读取只有第一次 miss，8 次读取共 2 次 miss，miss rate 为 25%。按列访问轮流引用 4 个块，而缓存只能容纳 2 个块，重新访问一个块时它已被逐出，8 次全部 miss，miss rate 为 100%。这些计数由动画中的 LRU 缓存模拟得到。
# 第 5 页两函数执行相同次数的加法，时间复杂度均为 O(N²)。按行求和更好地使用同一个块内的相邻元素，减少 miss，从而减少等待较慢存储的时间。
# 25% 与 100% 是这两个动画的模型结果。64 MB 矩阵程序只测量运行时间，没有测量硬件的 miss rate，不能把模型中的两个比例当成该程序的实测值。真实结果还取决于各级缓存的容量、块长、替换行为和硬件预取。


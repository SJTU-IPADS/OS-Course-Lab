['design-factors.highlight.1']
src_hash = 'f09a36d3'
text = 'The hardware fixes the cache parameters. A program changes the access sequence and thereby the miss rate'
# src: 缓存的参数由硬件确定。程序改变的是访问序列，从而改变 miss 率

['design-factors.notes.1']
src_hash = '39c4ac4d'
text = '''
Each row answers the same question: when this parameter is increased, which metric improves and which becomes worse?
A larger cache retains more data and reduces capacity misses, but takes longer to search and increases hit time. A larger block fetches more neighboring data, reducing cold misses for programs with spatial locality. At a fixed capacity, larger blocks mean fewer lines, more conflict misses, and more transferred bytes per miss. Higher associativity retains more competing blocks in a set but requires more tag comparisons per access.
Write-back can combine multiple writes to one block into a single memory writeback. Its costs are a dirty bit per line and a whole-block transfer before replacing a dirty line. Write-through generates a memory word write for each write.
These parameters are fixed when the processor is designed. On the same processor, different access sequences have different miss rates. The program can change its access sequence.
'''
# src:
# 
# 每一行回答同一个问题：把这个参数调大，哪个指标改善、哪个指标恶化。
# 容量增大使更多的数据留在缓存中，容量 miss 减少，但大缓存查找慢，hit 时间增大。块增大使每次 miss 取入更多相邻数据，空间局部性好的程序冷 miss 减少。容量不变时行数减少，冲突 miss 增加，一次 miss 传输的字节也更多。相联度增大使一个组能容纳更多冲突的块，但每次访问要比较更多的标记。
# 写回可以把同一块的多次写合并为一次内存写回，代价是每行一位脏位与替换脏行前的整块传输。写直达每次写都产生内存字写入。
# 这些参数在处理器设计时确定。同一个处理器上，访问序列不同，miss 率不同，这是编写程序时能够改变的。


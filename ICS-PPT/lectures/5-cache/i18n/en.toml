['kv-generate.notes.1']
src_hash = '7d64cd46'
text = '''
This part discusses LLM inference, that is, using a model to generate text after training is finished. An LLM processes text in tokens. The tokenizer splits the text into tokens, and a token can be a word, a Chinese character or a part of a word.
In the figure the input is the 4 tokens 「今天 天气 很 好」 ("the weather is nice today"). Prefill feeds these 4 tokens into the model at once, and the model outputs the first new token 「适合」 ("good for"). The input of decode step 1 is 5 tokens and the output is 「出门」 ("going out"). The input of step 2 is 6 tokens and the output is 「散步」 ("a walk"). Each output is appended to the end of the input for the next step, until the model outputs the special token that marks the end.
Autoregressive means that each output token becomes part of the input for generating the next token.
Each layer of the model contains attention and a feed-forward network. Attention makes the vector of a token depend on the tokens before it, and the next page gives its computation.
This page establishes one fact: the inputs of two adjacent decode steps differ only in the last token. The following pages discuss whether the intermediate results of the earlier tokens are recomputed at every step.
'''
# src:
# 
# 本部分讨论大模型推理，推理指模型训练完成之后用它生成文本。大模型按 token 处理文本，token 由分词器切分，可以是一个词、一个汉字或词的一部分。

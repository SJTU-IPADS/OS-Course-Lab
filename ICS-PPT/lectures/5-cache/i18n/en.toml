['exercise-rowcol.notes.1']
src_hash = '58b007d2'
text = '''
The exercise uses the loop orders of sum_rows and sum_cols with N=512. Each function starts independently with an empty cache and traverses once. Initialization is excluded from the count. The accumulator sum, loop variables, instructions and other data cause no accesses to the cache being analyzed.
Addresses are byte addresses. The 64-bit address width is part of the exercise model. The data capacity, number of sets, associativity and block size come from the cache-parameter query. LRU is the replacement policy assumed by the model. Only this cache level is analyzed.
One int read counts as one access. A miss also counts only once and fetches the entire 64-byte block containing the element. No additional blocks are speculatively prefetched. The matrix is aligned to 4 KiB, making the base address map to set 0.
'''
# src:
# 
# 题目沿用sum_rows与sum_cols的循环顺序，N=512。每个函数独立从空缓存开始，只遍历一次，初始化不计入统计。sum、循环变量、指令和其他数据不产生本题缓存中的访问。
# 地址按字节编址。64位是题设的地址宽度。缓存的数据容量、组数、路数与块长取自缓存参数查询，LRU是计算模型采用的替换策略。只分析这一层缓存。

['cache-tradeoff.notes.1']
src_hash = '870307f7'
text = '''
Increasing associativity can reduce conflicts caused by fixed placement positions, but requires comparing more tags and maintaining replacement state within each set. A larger block may provide useful adjacent data or fetch bytes that will never be used. Timely, accurate prefetching can complete transfers in advance. Incorrect prefetches consume bandwidth and may evict useful cache blocks. These effects depend on the workload and implementation, so a change does not guarantee better performance.
Cache pollution occurs when fetched data occupies space and prematurely evicts data that still has reuse value. Performance metrics can include miss rate, hit latency, throughput or energy consumption. The optimization objective and constraints such as area, power and bandwidth must be specified.
For the tradeoffs in conventional associative structures, see the abstract of Sanchez and Kozyrakis’s ZCache paper: https://mast.stanford.edu/pubs/the_zcache_decoupling_ways_and_associativity/ . For prefetch bandwidth overhead and the risk of evicting useful blocks, see Intel’s documentation: https://intel.github.io/optimization-zone/hardware/HWPrefetchTuning/ . At a fixed capacity, the number of blocks is C/B, so larger blocks also reduce the number of blocks that can be retained simultaneously.
RUM is a design conjecture about database access methods. Its three dimensions are read overhead, update overhead and additional space overhead. It illustrates a three-way tradeoff in data access methods, and the paper presents it as a conjecture. Source: Athanassoulis et al., Designing Access Methods: The RUM Conjecture, EDBT 2016, https://www.openproceedings.org/2016/conf/edbt/paper-12.pdf .
'''
# src:
# 
# 提高相联度可以缓解固定放置位置造成的冲突，但需要比较更多标记并维护组内替换状态。块变大时，相邻数据可能得到复用，也可能把不会使用的字节一同取入。预取及时且准确时可以提前完成传输，错误预取会消耗带宽，还可能挤出有用的缓存块。这些方向依赖工作负载和实现，不保证每次修改都提高性能。
# 缓存污染指取入的数据挤占空间，导致仍有复用价值的数据被提前逐出。性能指标可以是miss rate、hit时延、吞吐量或能耗，需要说明优化目标和面积、功耗、带宽等约束。
# 传统相联结构的取舍参考Sanchez与Kozyrakis的ZCache论文摘要：https://mast.stanford.edu/pubs/the_zcache_decoupling_ways_and_associativity/ 。预取的带宽开销与有用块被逐出的风险参考Intel文档：https://intel.github.io/optimization-zone/hardware/HWPrefetchTuning/ 。固定容量时块数为C/B，块变大也会减少可同时保留的块数。
# RUM是数据库数据访问方法的设计猜想，三个量是读开销、更新开销和额外空间开销。它提供了“不可能三角”式的三方取舍例子，讨论对象是数据访问方法，论文将其表述为猜想。原文：Athanassoulis et al., Designing Access Methods: The RUM Conjecture, EDBT 2016, https://www.openproceedings.org/2016/conf/edbt/paper-12.pdf 。

['cache-prefetch-applications.title']
src_hash = '35204102'
text = 'Applications of Caching and Prefetching'
# src: 缓存与预取的广泛应用

['cache-prefetch-applications.slide.1']
src_hash = 'eadd8fdd'
text = '''
**Caching**: retain copies for reuse.
- Download lecture materials for local viewing: cache the remote server’s files on disk;
- Ollama loads a model into main memory or GPU memory and keeps it resident for reuse by subsequent requests.
'''
# src:
# 
# **缓存（cache）**：保留副本供复用。
# - 课件下载到本地查阅：在磁盘里缓存远程服务器的文件；
# - Ollama 将模型装入内存或显存并驻留，供后续请求复用。

['cache-prefetch-applications.slide.1.footnote.1']
src_hash = '8d3aea62'
text = 'Official Ollama documentation: [Model loading and residency](https://docs.ollama.com/faq#how-do-i-keep-a-model-loaded-in-memory-or-make-it-unload-immediately).'
# src: Ollama 官方文档：[模型加载与驻留](https://docs.ollama.com/faq#how-do-i-keep-a-model-loaded-in-memory-or-make-it-unload-immediately)。

['cache-prefetch-applications.slide.2']
src_hash = '1dcc1270'
text = '''
**Prefetching**: fetch data before it is needed.
- Linux readahead: when a program requests a file read, use past file-access patterns to read file contents expected to be accessed next;
- PF-LLM analyzes data-access patterns before a program runs and develops a prefetching strategy. At runtime, hardware predicts the data that will be read next and fetches it into the cache in advance, reducing waiting.
'''
# src:
# 
# **预取（prefetch）**：在需求发生前取入数据。
# - Linux readahead：程序请求读取文件时，根据过往的文件访问模式，提前读取预计会访问的文件内容；
# - PF-LLM 在程序运行前分析数据访问方式，制定预取策略。运行时预测未来要读的数据，提前读入缓存，减少等待。

['cache-prefetch-applications.slide.2.footnote.1']
src_hash = '5f8085a3'
text = 'Xu et al., ASPLOS 2026: [PF-LLM](https://doi.org/10.1145/3779212.3790202).'
# src: Xu et al., ASPLOS 2026：[PF-LLM](https://doi.org/10.1145/3779212.3790202)。

['cache-prefetch-applications.notes.1']
src_hash = '789dde65'
text = '''
The left figure follows the storage-level ordering in storage_levels.py and hierarchy.py, redrawn in a compact layout. Access generally becomes slower and capacity generally increases from top to bottom. The figure shows an overall trend, with specific values depending on devices and network conditions.
Linux retains file contents in memory through its file cache. Readahead fetches data expected to be read before the program explicitly requests it. File-system internals are omitted here. Source: https://www.kernel.org/doc/html/latest/core-api/mm-api.html#readahead .
Downloading remote lecture materials locally retains a copy for later reference and applies the same caching idea. Starting a model with Ollama or explicitly preloading it loads its weights into main memory, GPU memory or both. Subsequent requests can reuse the resident model. By default, the model remains loaded for a period after use, and keep_alive adjusts this duration. Starting the Ollama service alone does not automatically load every model. Source: https://docs.ollama.com/faq .
Before a program runs, PF-LLM analyzes how it accesses data and produces a prefetching strategy. During execution, hardware uses the strategy to predict which data the program may read next and fetches it into the cache before it is actually needed. Data fetched in time can be used directly when needed, reducing waiting.
This page presents only four steps: analysis before execution, prediction during execution, fetching in advance and use when needed. The paper addresses data accesses in general programs. Source: Xu et al., PF-LLM: Large Language Model Hinted Hardware Prefetching, ASPLOS 2026, https://doi.org/10.1145/3779212.3790202 .
'''
# src:
# 
# 左图沿用storage_levels.py和hierarchy.py的存储层序并重绘为紧凑版。自上而下访问通常更慢、容量通常更大，图示的是总体趋势，具体设备与网络条件会改变数值。
# Linux的文件缓存将文件内容留在内存中，readahead在程序明确请求前将预计会读的数据取入缓存。这里不展开文件系统的内部结构。来源：https://www.kernel.org/doc/html/latest/core-api/mm-api.html#readahead 。
# 把远程课件下载到本地，保留副本以备后续查阅，是同一种缓存思想。Ollama启动一个模型或显式预加载时，把权重加载到内存、显存或二者中，随后可以复用驻留模型。官方默认在使用后保留一段时间，keep_alive可以调整驻留时间。仅启动Ollama服务不意味着自动加载全部模型。来源：https://docs.ollama.com/faq 。
# PF-LLM在程序运行前分析它的数据访问方式，给出数据预取策略。程序运行时，硬件根据策略预测接下来可能读取的数据，并在真正需要之前将它们取入缓存。及时取入的数据可以在需要时直接使用，减少等待。
# 本页只讲运行前分析、运行时预测、提前读取和需要时使用四步。论文的应用对象是一般程序的数据访问。来源：Xu et al., PF-LLM: Large Language Model Hinted Hardware Prefetching, ASPLOS 2026, https://doi.org/10.1145/3779212.3790202 。


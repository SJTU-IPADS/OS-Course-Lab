['kv-vram.highlight.1']
src_hash = '9ece98e4'
text = 'If the KV Cache stays resident in GPU memory forever, GPU memory will eventually fill up. What should be done?'
# src: 如果 KV Cache 始终驻留在显存中，显存迟早会被占满，怎么办？

['kv-vram.notes.1']
src_hash = '229f93cf'
text = '''
2 frames. Frame 1 shows the layout of GPU memory during LLM inference: the model weights have a fixed size after loading and are shared by all requests. Intermediate results are temporary vectors computed in the current step and take a small space. The rest of GPU memory holds the KV Cache of each session so that the k and v of earlier tokens can be reused directly across turns or decoding steps. The newly arrived session 4 is placed into the remaining GPU memory space.
Frame 2: after users finish or pause their conversations, if the KV Caches of old sessions stay resident in GPU memory forever, GPU memory will eventually fill up as later sessions (session 5, session 6 and so on) keep arriving. The next page introduces the server's standard expiration mechanism for this problem.
'''
# src:
# 
# 共 2 帧。第 1 帧展示大模型推理时显存的组织：模型权重在载入后大小固定，由所有请求共用。中间结果是当前步算出的临时向量，占用的空间较小。其余显存用于存放各会话的 KV Cache，以便用户在多轮对话或继续生成时直接复用前序 token 的 k、v。新到达的会话 4 放入剩余显存空间。
# 第 2 帧：用户结束或暂停对话后，如果旧会话的 KV Cache 始终驻留在显存中，随着后续会话（会话 5、会话 6 等）不断到达，显存迟早会被占满。下一页先给出服务端针对这一问题的常规过期机制。


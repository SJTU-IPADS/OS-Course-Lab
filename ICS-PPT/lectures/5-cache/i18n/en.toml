['exercise-friendly-2.notes.1']
src_hash = 'ddf27271'
text = '''
Question 1: miss rate = min(1, 4k/B). (a) k = 1. (b) Two consecutive accesses are 1024 ints apart, that is, 4096 bytes, so each access falls in a different block, and since the array is much larger than the cache, the same block is not used again before it is evicted. (c) k = 4, 4 × 4 / 64 = 1/4.
Question 2 is analyzed as for double, with 16 elements per block: the inner loop of ijk reads A[i][k] (row, 1/16) and B[k][j] (column, 1). The inner loop of ikj reads B[k][j] and C[i][j] (both rows, 1/16 each), and A[i][k] is in a register.
The answers were checked with a small cache simulator: the program generates the access address sequence for each order and counts misses with a fully associative LRU cache, and the results agree with the formulas above.
'''

['direct-mapped.notes.1']
src_hash = '281c4255'
text = '''
The block number is the address divided by $B$. The block number modulo $S$ gives the set number, and the block number divided by $S$ gives the tag, which correspond to the two fields of the address.
The figure draws main memory on the left as an address space: a block is two adjacent squares, the $B=2$ bytes of the block, the top-left corner of the block holds its start address as a 4-bit binary number, and the block number is written to the left of the block. Main memory has 8 blocks, and the cache has 4 sets with one line each. Blocks 0 to 3 map in turn to sets 0 to 3, all with tag 0. Blocks 4 to 7 map again to sets 0 to 3, all with tag 1.
Blocks 0 and 4 both have set number 0, with tags 0 and 1, so they can only take turns occupying the one line of set 0.
Take block 7 as an example: the start address 1110 splits by $t=1$, $s=2$, $b=1$ into tag 1, set index 11 and block offset 0, so block 7 goes into the line of set 3.
'''
# src:
# 
# 块号等于地址除以 $B$。块号对 $S$ 取余得到组号，块号除以 $S$ 得到 tag，这与地址的两个字段对应。
# 图的左边按地址空间画出内存：一个块是相邻的两个方格，即块内的 $B=2$ 个字节，块左上角是块的起始地址，用 4 位二进制数表示，块号写在块的左边。内存有 8 个块，缓存有 4 个组，每组一行。块 0 至 3 依次映射到组 0 至 3，tag 都是 0。块 4 至 7 再次映射到组 0 至 3，tag 都是 1。
# 块 0 和块 4 的组号都是 0，tag 分别是 0 和 1，它们只能轮流占用组 0 的那一行。
# 以块 7 为例：起始地址 1110 按 $t=1$、$s=2$、$b=1$ 拆成 tag 1、组索引 11、块偏移 0，所以块 7 放入组 3 的那一行。

['dm-access.title']
src_hash = '8ac85f1c'
text = 'Access Steps of a Direct-Mapped Cache'
# src: 直接映射缓存的访问步骤

['dm-access.slide.1']
src_hash = '49375337'
text = '''
Read address 13 (binary 1101), the cache has $t=1$, $s=2$, $b=1$:
1. **Set selection**: the set index selects a set.
2. **Line matching**: if the valid bit of the line is 1 and its tag equals the tag of the address, it is a hit. Otherwise it is a miss.
3. **Word extraction**: on a hit, the block offset extracts the byte within the block.
'''
# src:
# 
# 读取地址 13（二进制 1101），缓存 $t=1$、$s=2$、$b=1$：
# 1. **组选择**：用组索引选出一组。
# 2. **行匹配**：该行的有效位为 1 且标记等于地址的标记，则 hit，否则 miss。
# 3. **字抽取**：hit 时，用块偏移取出块内的字节。

['dm-access.notes.1']
src_hash = '4052fe79'
text = '''
The binary form of address 13 is 1101: the high 1 bit is the tag 1, the middle 2 bits 10 are the set index 2, and the low 1 bit is the block offset 1.
The first frame selects set 2 with set index 2. The second frame compares: the line of set 2 has valid bit 1 and tag 1, equal to the tag of the address, so it is a hit. The third frame extracts byte 1 of the block with block offset 1, that is, m[13].
A valid bit of 0 or an unequal tag is a miss, and the cache must fetch the block from main memory.
'''
# src:
# 
# 地址 13 的二进制是 1101，高 1 位是标记 1，中间 2 位 10 是组索引 2，低 1 位是块偏移 1。
# 第一帧用组索引 2 选出组 2。第二帧比较：组 2 的行有效位为 1，标记为 1，与地址的标记相等，hit。第三帧用块偏移 1 取出块内第 1 个字节，即 m[13]。
# 有效位为 0 或标记不等时都 miss，缓存要从内存取块。


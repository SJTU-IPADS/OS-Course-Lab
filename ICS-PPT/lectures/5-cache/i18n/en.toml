['mountain-slopes.notes.1']
src_hash = '5f0845cf'
text = '''
This shows the change along the stride for two rows of the heat map: the 128 MB working set (data in main memory) and the 256 KB working set (data in L2).
At stride 1 all 8 elements of a block are read and only the first read needs to fetch the block. At stride 2 it is 4 elements, at stride 4 it is 2, and at stride 8 only 1. As the stride goes from 1 to 8, the number of blocks fetched per element read rises from 1/8 to 1 on average, and the throughput falls accordingly.
From stride 8 on, every read needs a new block, and the time to fetch a block does not depend on the stride, so the 128 MB row is about 1.6 to 2.1 GB/s for strides 8 to 15. The 256 KB row falls slowly after stride 8.
The point at stride 16 (1.1 GB/s for 128 MB) is below the values for strides 8 to 15, and the cause has not been found.
'''

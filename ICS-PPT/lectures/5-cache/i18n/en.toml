['index-position-question.notes.1']
src_hash = '75c355da'
text = '''
In the upper figure, the fields from high to low bits are the tag, set index and block offset. The tag distinguishes main-memory blocks within a set, the set index selects a cache set, and the block offset selects a byte within a block.
The lower figure keeps the field widths unchanged, placing the set index in the highest s address bits and the tag in the middle t bits. The lowest b bits remain the block offset. Both schemes can distinguish main-memory blocks using the tag and set index.
The comparison concerns how the two schemes place consecutive main-memory blocks: which sets do S consecutive blocks map to, and can they remain in the cache simultaneously?
'''
# src:
# 
# 上图从高位到低位依次是标记、组索引与块偏移。标记在组内区分内存块，组索引选择缓存中的组，块偏移选择块内字节。
# 下图保持各字段的位数不变，把组索引放在地址的高 s 位，把标记放在中间 t 位，最低 b 位仍作块偏移。两种方案都可以用标记与组索引区分内存块。
# 需要比较两种方案如何分配连续的内存块：连续的 S 个块会映射到哪些组，能否同时留在缓存中？


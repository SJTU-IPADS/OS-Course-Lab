['cache-hit-miss.title']
src_hash = 'f168d1bb'
text = 'Hits and misses'
# src: hit 与 miss

['cache-hit-miss.slide.1']
src_hash = '6bb49def'
text = '''
- Main memory has much greater capacity than the cache and cannot fit in it entirely. The cache therefore fetches data blocks on demand, in response to CPU accesses.
- **Hit**: the block is already cached, and the requested data is returned directly to the CPU.
- **Miss**: the block is absent, so the entire block is fetched from main memory before the requested data is returned to the CPU.
'''
# src:
# 
# - 内存容量远大于缓存，无法全部放入缓存，因此缓存采取按需取入的方式，响应 CPU 的访问请求取入数据块。
# - **hit**：块已在缓存中，直接把所需的数据返回给 CPU。
# - **miss**：块不在缓存中，从内存取入整个块，再把所需的数据返回给 CPU。

['cache-hit-miss.notes.1']
src_hash = 'efc4099c'
text = '''
The figure places registers and caches inside the CPU, with main memory outside the CPU. Main memory has much greater capacity than the cache. All data cannot be cached at once, so the required block is fetched when the CPU accesses it.
The three frames show the following steps. If the block containing the requested word is cached, the word is returned directly: a hit. If the requested block is absent, the cache requests the entire block from main memory: a miss. The returned block is stored in the cache, replacing an existing block when necessary, and the requested word is then returned to the CPU.
Placement and replacement policies determine where the new block is stored and which existing block is evicted. A miss accesses slower main memory and usually takes longer than a hit.
'''
# src:
# 
# 图中寄存器与缓存都位于 CPU 内部，内存位于 CPU 外部。内存容量远大于缓存，所有数据无法同时放入缓存，CPU 访问时才把所需的块取入。
# 三帧依次是：请求的字所在的块已在缓存中，直接返回，称为 hit。请求的块不在缓存中，向内存请求整个块，称为 miss。取回的块放入缓存，必要时替换已有的块，再把所需的字返回 CPU。
# 放置策略与替换策略决定新块保存在哪里、已有的哪个块被逐出。miss 需要访问较慢的内存，通常比 hit 花费更长的时间。


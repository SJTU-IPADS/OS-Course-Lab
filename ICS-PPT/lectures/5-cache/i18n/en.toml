['kv-expire.slide.1']
src_hash = '72422d00'
text = '''
- Compute providers set an **expiration time** (such as 1 hour) for the KV Cache, and once exceeded, the cache is invalidated automatically and frees GPU memory.
- If the user resumes the same session after expiration, the server recomputes the $k$ and $v$ of the earlier tokens.
'''
# src:
# 
# - 算力服务商为 KV Cache 设定**过期时间**（如 1 小时），超期后缓存自动失效并释放显存。
# - 过期后如果用户继续同一会话，服务端重新计算前序 token 的 $k$、$v$。

['kv-expire.highlight.1']
src_hash = '75097916'
text = 'What happens if requests arrive densely at the same time and GPU memory fills up before expiration?'
# src: 若同一时间请求密集到达，未到过期时间显存就已占满，怎么办？

['kv-expire.notes.1']
src_hash = '2d0f0ebe'
text = '''
3 frames.
Frame 1: the server records how long each session has been idle since its last access. Before reaching the expiration time (for example 1 hour), the KV Cache of each session is kept in GPU memory.
Frame 2: session 1 has had no new request for over 1 hour, so its KV Cache is invalidated automatically and frees GPU memory space for new sessions, preventing finished sessions from occupying GPU memory forever.
Frame 3: if session 1 sends a new request after expiration, since the original KV Cache has been freed, the server recomputes the k and v of the earlier tokens of session 1 and generates a new KV Cache before continuing decoding.
The expiration mechanism solves the problem of old sessions occupying GPU memory indefinitely. However, if many requests arrive densely at the same time, the total KV Cache of active sessions exceeds GPU memory capacity within the expiration time. The next page discusses how to handle this case.
'''
# src:
# 
# 共 3 帧。
# 第 1 帧：服务端记录每个会话距离上次访问的闲置时间。未达到过期时间（例如 1 小时）时，各会话的 KV Cache 保留在显存中。
# 第 2 帧：会话 1 超过 1 小时没有新请求，对应的 KV Cache 自动失效并释放显存空间，腾出的显存可供后续新会话使用，从而避免已结束的会话永久占用显存。
# 第 3 帧：如果会话 1 在过期之后再次发来请求，由于原 KV Cache 已释放，服务端重新计算会话 1 前序 token 的 k、v，生成新的 KV Cache 后继续解码。
# 过期机制解决了旧会话长期占用显存的问题。但如果同一时间有大量请求密集到达，在过期时间之内所有活跃会话的 KV Cache 总和就超出了显存容量，下一页讨论此时的处理方式。

['kv-swap.title']
src_hash = '8546df01'
text = 'The Swap-Out and Swap-In Idea When GPU Memory Is Full'
# src: 显存不足时的换入换出设想

['kv-swap.slide.1']
src_hash = '959c0741'
text = '''
- When many requests arrive densely at the same time, none of the KV Caches in GPU memory have expired, and the remaining space is insufficient for new requests.
- **Naive idea**: **swap out** temporarily unused KV Caches from GPU memory to main memory, and **swap** them back **in** to GPU memory when the session resumes.
'''
# src:
# 
# - 同一时间大量请求密集到达时，显存中的 KV Cache 均未到期，剩余空间不足以容纳新请求。
# - **朴素设想**：把暂不使用的 KV Cache 从显存**换出**到内存，待该会话继续时再从内存**换入**显存。

['kv-swap.highlight.1']
src_hash = '3659932d'
text = 'What problem arises from swapping KV Cache between GPU memory and main memory?'
# src: 在显存与内存之间换入换出 KV Cache 会带来什么问题？

['kv-swap.notes.1']
src_hash = '7e036727'
text = '''
3 frames.
Frame 1 (dense requests): many requests arrive within a short time. The last access times of sessions 1, 2 and 3 in GPU memory are all within a few minutes and none have expired, while the newly arrived session 4 no longer fits in GPU memory.
Frame 2 (swap out): a direct naive idea is to use the larger main memory: copy the KV Cache of the temporarily inactive session 1 from GPU memory to main memory to free GPU memory for the newly arrived session 4.
Frame 3 (swap in): when session 1 sends a request again, dynamically copy its KV Cache from main memory back to GPU memory so that the original KV Cache is preserved.
Whether this idea works depends on whether swapping in the KV Cache from main memory is faster than recomputing it directly, which the next page analyzes.
'''
# src:
# 
# 共 3 帧。
# 第 1 帧（请求密集到达）：短时间内大量请求同时到达，显存中会话 1、2、3 的最后访问时间都在几分钟以内，均未达到过期时间，而新到达的会话 4 已无法放入显存。
# 第 2 帧（换出）：一种直接的朴素设想是利用容量更大的主存（内存）：把暂时不活跃的会话 1 的 KV Cache 从显存复制到内存中保存，腾出显存给新到达的会话 4。
# 第 3 帧（换入）：当会话 1 再次发来请求时，动态把它的 KV Cache 从内存复制回显存，使原有的 KV Cache 得以保留。
# 这一设想能否奏效，取决于从内存换入 KV Cache 的速度是否比直接重新计算更快，下一页对此作分析。

['kv-recompute.title']
src_hash = 'da70bd25'
text = 'Memory-Bound Decoding and Cache Invalidation'
# src: 访存受限与缓存失效

['kv-recompute.slide.1']
src_hash = 'ed5ab684'
text = '''
- Every decode step reads the weights and the KV Cache, making it **memory-bound**, so exchanging the cache with main memory is slower than recomputing directly.
- When the KV Cache exceeds GPU memory, part of the cache is **invalidated** directly, and the earlier $k$ and $v$ are recomputed when that session requests again.
'''
# src:
# 
# - 解码每步都要读取权重与 KV Cache，属于**访存受限**计算，从内存交换缓存比直接重算更慢。
# - KV Cache 超出显存时，直接使部分缓存**失效**，会话再次请求时重新计算前序 $k$、$v$。

['kv-recompute.highlight.1']
src_hash = 'db6573d4'
text = 'When GPU memory is full and part of the KV Cache is invalidated directly, which caches should be chosen?'
# src: 显存不足时直接使部分 KV Cache 失效，应当选择哪些缓存？

['kv-recompute.notes.1']
src_hash = '31b9ad95'
text = '''
3 frames. When decoding each token, the GPU reads the model weights and the current session's KV Cache from GPU memory once, while each element participates in only one inner product or weighted sum. The amount of arithmetic is small and most of the time is spent waiting for data to be read in, so decoding is memory-bound. When decoding is already memory-bound, exchanging the KV Cache across main memory is slower than having the GPU recompute it directly.
Frame 1: many requests arrive densely at the same time. None of the KV Caches of sessions 1, 2 and 3 in GPU memory have expired, while the remaining space is insufficient for the newly arrived session 4.
Frame 2: the server directly invalidates the KV Cache of session 1 to immediately free GPU memory space and place session 4.
Frame 3: when session 1 whose cache was invalidated sends a request again later, the server recomputes the k and v of the earlier tokens of session 1 and generates a new KV Cache before continuing decoding. The next step is to decide which caches to invalidate first.
'''
# src:
# 
# 共 3 帧。解码生成每个 token 时，GPU 都要把模型权重和当前会话的 KV Cache 从显存读出一次，而每个元素只参加一次内积或加权求和，计算量很小，大部分时间花在等待数据读入上，即访存受限（memory-bound）。在访存受限下，若再跨内存交换 KV Cache，速度反而不如 GPU 直接重新算一遍快。
# 第 1 帧：同一时间大量请求密集到达，显存中会话 1、2、3 的 KV Cache 均未到过期时间，而剩余空间已不足以容纳新到达的会话 4。
# 第 2 帧：服务端直接使会话 1 的 KV Cache 失效（invalidate），立即腾出显存空间放入会话 4。
# 第 3 帧：当被使失效的会话 1 后续再次发来请求时，服务端重新计算会话 1 前序 token 的 k、v，生成新的 KV Cache 后继续解码。接下来需要决定优先使哪些缓存失效。

['kv-evict.title']
src_hash = '5c031adb'
text = 'Eviction Policies for the KV Cache'
# src: KV Cache 的淘汰策略

['kv-evict.slide.1']
src_hash = '22875639'
text = '''
- **Least Recently Used (LRU)**: the default policy in mainstream inference systems, invalidating the session cache that has not been accessed for the longest time first.
- **Smallest cache first**: invalidate the session with the fewest cached layers or tokens first, minimising the impact on user experience:
  1. Compute services charge less for tokens that hit the cache, so keeping large caches saves users more money.
  2. A session with a small cache needs little extra computation when recomputed after invalidation.
'''
# src:
# 
# - **最近最少使用（LRU）**：主流推理系统的默认策略，优先使最久未访问的会话缓存失效。
# - **最小缓存优先**：优先使已缓存层数或 token 数最少的会话失效，尽量减小对用户体验的影响：
#   1. 算力服务对 hit 缓存的 token 收取更低费用，保留大缓存能为用户节省更多开支。
#   2. 缓存较少的会话即使失效，后续重新计算所需的额外计算量也较少。

['kv-evict.notes.1']
src_hash = 'f2021be1'
text = '''
The left and right panels of the figure compare two eviction policies.
The left panel is Least Recently Used (LRU): record the last access time of each session, and when GPU memory is full, evict the session that has had no new request for the longest time (in the figure, session A has been idle for 45 minutes). This is the default policy for managing idle KV Caches in mainstream inference systems such as vLLM, SGLang and TensorRT-LLM.
The right panel is smallest cache first: compare the amount of KV Cache currently accumulated by each session (such as the number of cached layers or tokens), and evict the session with the smallest cache first (session C in the figure). This approach is used in concurrent request preemption (for example, vLLM evicts the most recently arrived request with the shortest generation progress to reduce recomputation overhead) and billing-aware scenarios: first, compute providers charge a discounted price for earlier tokens that hit the KV Cache, so the more content a session has cached, the more money keeping its cache saves the user. Second, the smaller a session's cache is, the less extra computation is needed to recompute it when the session resumes after invalidation, so the waiting time perceived by the user is short.
'''
# src:
# 
# 图中左右两栏对比两种淘汰策略。
# 左栏是最近最少使用（LRU）：记录每个会话最后一次访问的时间，当显存不足时，淘汰最长时间没有新请求的会话（图中会话 A 已闲置 45 分钟）。这是 vLLM、SGLang、TensorRT-LLM 等主流推理系统管理闲置 KV Cache 的默认策略。
# 右栏是最小缓存优先：比较各会话当前已缓存的 KV Cache 规模（例如缓存的层数或已积累的 token 数量），优先淘汰缓存量最少的会话（图中会话 C）。在并发请求抢占（如 vLLM 淘汰最新到达、已生成进度最短的请求以减少重算开销）与计费感知的场景中采用这一思路：第一，算力厂商对 hit KV Cache 的前序 token 按优惠价格计费，已缓存内容越多的会话，保留其缓存为用户节省的费用越多。第二，缓存量越少的会话，即使缓存被使失效，下次继续时重新计算所需的额外计算量也很小，用户感知的等待时间很短。

# 
# - `int W[M][N]` 按行存放（图中 $M=N=4$），第 $i$ 行的 $N$ 个元素在内存中相邻。**步长**是相邻两次引用的地址之差，以元素为单位。
# - 内层循环改变 `j`，按行访问，依次引用地址 0, 4, 8, ...，步长为 1。


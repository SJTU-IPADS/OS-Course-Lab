['cache-compare.notes.1']
src_hash = 'e49c7ae7'
text = '''
The caches in the figure all have 8 lines: the direct-mapped cache has 8 sets of 1 line each, the 2-way or 4-way set-associative caches lie in between, and the fully associative cache has 1 set of 8 lines. The three models have the same capacity; the number of set index bits in the address decreases in this order, and the number of tags compared per access increases.
Conflict misses decrease as $E$ increases, and the hardware cost (comparators and replacement logic) increases as $E$ increases. Real caches choose a compromise $E$: caches with many lines use 4 to 20 ways.
'''
# src:
# 
# 图中的缓存都是 8 行：直接映射是 8 组每组 1 行，2 路或 4 路组相联居中，全相联是 1 组 8 行。三种模型容量相同，地址的组索引位数依次减少，一次访问需要比较的标记个数依次增加。
# 冲突 miss 随 E 增大而减少，硬件代价（比较器与替换逻辑）随 E 增大而增大。实际的缓存取折中的 E：行数较多的缓存取 4 至 20 路。


['dm-index-bits.notes.1']
src_hash = '8f6b3a05'
text = '''
The numbers 0 through 15 in the figure are byte addresses represented with 4 bits. The block offset occupies the lowest bit, so each block contains two adjacent bytes, giving 8 main-memory blocks. The cache has 4 sets with 1 line per set and can hold 4 blocks simultaneously, totaling 8 bytes.
In the upper row, the fields from high to low bits are a 1-bit tag, a 2-bit set index and a 1-bit block offset. The set index uses address bits 2 and 1. The 4 blocks containing addresses 0–1, 2–3, 4–5 and 6–7 map to sets 0, 1, 2 and 3 respectively and can remain in the cache simultaneously.
In the lower row, the fields from high to low bits are a 2-bit set index, a 1-bit tag and a 1-bit block offset. The set index uses address bits 3 and 2. The two blocks containing addresses 0–1 and 2–3 both map to set 0, while the two blocks containing addresses 4–5 and 6–7 both map to set 1. Each set has only one line, so the two blocks in the same set replace each other. These addresses do not use sets 2 and 3.
Both schemes have the same field widths and cache capacity. Taking the middle bits as the set index distributes the 4 consecutive blocks across all 4 sets, allowing them to remain in the cache simultaneously.
'''
# src:
# 
# 图中的 0 至 15 是字节地址，用 4 位表示。块偏移占最低 1 位，每块包含两个相邻字节，共有 8 个内存块。缓存有 4 个组，每组 1 行，可以同时保存 4 个块，共 8 字节。
# 上排从高位到低位依次为标记 1 位、组索引 2 位、块偏移 1 位。组索引为地址的第 2、1 位。地址 0–1、2–3、4–5、6–7 所在的 4 个块依次映射到组 0、1、2、3，可以同时保留在缓存中。
# 下排从高位到低位依次为组索引 2 位、标记 1 位、块偏移 1 位。组索引为地址的第 3、2 位。地址 0–1 与 2–3 的两个块都映射到组 0，地址 4–5 与 6–7 的两个块都映射到组 1。每组只有一行，同组的两个块会互相替换，组 2 与组 3 没有被这些地址使用。
# 两种方案的字段位数与缓存容量相同。组索引取中间位时，连续的 4 个块分散到全部 4 个组中，能够同时留在缓存中。


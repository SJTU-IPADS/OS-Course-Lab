['kv-run.notes.1']
src_hash = '22b65a23'
text = '''
`kv_decode.c` implements decoding for a single attention head, without multiple heads, layers or feed-forward networks. `decode(T, cached, out)` executes step by step: it computes q for the current token, then calls `compute_kv(t)` once if `cached` is true, or once for each position 0 to t if it is false, and finally `attend` performs attention over positions 0 to t, and the output becomes the input of the next step through tanh. The weights are fixed pseudo-random numbers.
The two modes perform the operations in the same order, so the outputs are identical bit by bit (the last line, yes). The cache only removes repeated computation and does not change the result.
Each time the number of tokens doubles, the time without the cache grows about 4 times: step t recomputes t tokens, so the total number of projections grows as T². With the cache each step computes the k and v of only 1 token, so the time grows more slowly and the speedup increases with the number of tokens.
With the cache each step still performs attention over t positions, and this part grows with the number of tokens, so the growth of the speedup gradually slows down. In a real model each token goes through the computation of all layers, so far more computation is saved than in this single-head program, and the speedup is larger.
Times vary from machine to machine. The numbers on the page are from one run.
'''
# src:
# 
# `kv_decode.c` 实现单个注意力头的解码，没有多头、层与前馈网络。`decode(T, cached, out)` 逐步执行：为当前 token 计算 q，然后 `cached` 为真时只调用一次 `compute_kv(t)`，为假时对位置 0 到 t 各调用一次 `compute_kv`，最后 `attend` 对位置 0 到 t 作注意力，输出经 tanh 成为下一步的输入。权重是固定的伪随机数。
# 两种方式的运算顺序相同，所以输出逐位相同（最后一行 yes）。缓存只省去重复的计算，不改变结果。
# token 数每增加一倍，不用缓存的时间约增为 4 倍：第 t 步重算 t 个 token，总的投影次数随 T² 增长。使用缓存时每步只算 1 个 token 的 k、v，时间增长得慢，所以加速比随 token 数增大。
# 使用缓存时每步仍要对 t 个位置作注意力，这部分随 token 数增长，所以加速比的增长逐渐变慢。实际的模型每个 token 要经过全部层的计算，省去的计算远多于这个单头的程序，加速比更大。
# 时间随机器而异，页面上的数字取一次运行的结果。


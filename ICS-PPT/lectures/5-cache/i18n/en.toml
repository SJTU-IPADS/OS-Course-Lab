['cache-line-use-question.notes.1']
src_hash = '76a3fe38'
text = '''
The cache in the figure has 4 sets with one line per set. Block 0 (addresses 0–1) and block 4 (addresses 8–9) can occupy only the line in set 0.
The lines in sets 1, 2 and 3 have valid bit 0 and are labeled as empty in the figure.
Alternating accesses repeatedly replace these blocks, causing conflict misses on subsequent accesses. Even when other lines are empty, the fixed mapping restricts which line a new block can use.
The question is how to place new blocks so that other empty lines can be used while retaining blocks that will still be accessed.
'''

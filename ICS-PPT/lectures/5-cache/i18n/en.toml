# 
# **KV Cache** 保存已有 token 的 $k$、$v$。解码的每一步只为新 token 计算 $q$、$k$、$v$ 各一行，把 $k$、$v$ 追加到缓存，再用 $q$ 与缓存中的全部 $k$、$v$ 算出 $A$ 与 $O$ 的一行。

['kv-cache.slide.2']
src_hash = '0ebe86d5'

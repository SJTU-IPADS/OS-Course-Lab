['matmul-jki.notes.1']
src_hash = '2fd5e645'
text = '''
The figure draws only the 8 × 8 elements in the top left corner of each matrix. The 8 doubles of each row are one 64-byte block, and the start of the row is aligned to the block. It is assumed that none of these blocks is in the cache when the inner loop starts (n is large). Orange marks the elements accessed in the current iteration, the colour of the outer ring shows a hit (green) or a miss (red), the light blue rows are blocks already in the cache, and the number in a cell is the sequence number of the iteration that accessed the element. Below each matrix are the result of this iteration and the cumulative number of misses, and the line below the figure describes the accesses of this frame. The three frames draw iterations 1, 2 and 8.
Frame 1 (i = 0): A[0][k] misses, and the block in row 0 of A is fetched. C[0][j] misses, and the block in row 0 of C is fetched, and the later write to C[0][j] hits because the block is already in the cache. r is in a register, and B is not accessed.
Frame 2 (i = 1): A[1][k] is in row 1 of A and C[1][j] is in row 1 of C, both new blocks, so both miss. Only one element of each block is used.
Frame 3 (i = 7): i = 2 to 7 behave like i = 1 and miss every time. In the 8 iterations A misses 8 times, C misses 8 times, and B is not accessed, 16 misses in total, 16/8 = 2.0 per iteration. The counts in the figure come from simulating a fully associative LRU cache.
The inner loop i runs from 0 to n-1: r = B[k][j] is read into a register before the inner loop. A[i][k] is taken along column k of A with a stride of n doubles, and every reference misses. C[i][j] is taken along column j of C with a stride of n doubles, and every reference misses, with each iteration reading and then writing the same element and the block already in the cache at the write.
Both arrays of this class are accessed by column, and each iteration misses twice, the most of the three classes.
'''
# src:
# 图只画矩阵左上角的 8 × 8 个元素，每一行的 8 个 double 是一个 64 字节的块，行首与块对齐。假设内层循环开始时这些块都不在缓存中（n 很大）。橙色是当前迭代访问的元素，外圈的颜色表示 hit（绿）或 miss（红），浅蓝的行是已在缓存中的块，格中的数字是访问该元素的迭代序号。每个矩阵下方给出本次迭代的结果和累计的 miss 次数，图下方的一行说明这一帧的访问。三帧依次画第 1、第 2 与第 8 次迭代。
# 第一帧（i = 0）：A[0][k] miss，取入 A 的第 0 行中的块。C[0][j] miss，取入 C 的第 0 行中的块，随后写 C[0][j] 时块已在缓存中，写 hit。r 在寄存器中，B 没有被访问。
# 第二帧（i = 1）：A[1][k] 在 A 的第 1 行，C[1][j] 在 C 的第 1 行，都是新的块，都 miss。每个块只有一个元素被用到。
# 第三帧（i = 7）：i = 2 至 7 与 i = 1 相同，每次都 miss。8 次迭代中 A miss 8 次，C miss 8 次，B 没有访问，共 16 次，每次迭代 16/8 = 2.0 次。图中的次数由模拟一个全相联 LRU 缓存得出。
# 内层循环 i 从 0 到 n-1：r = B[k][j] 在内层循环之前读入寄存器。A[i][k] 沿 A 的第 k 列取，步长 n 个 double，每次 miss。C[i][j] 沿 C 的第 j 列取，步长 n 个 double，每次 miss，读后写同一个元素，写时块已在缓存中。
# 这一类的两个数组都按列访问，每次迭代 miss 两次，是三类中最多的。


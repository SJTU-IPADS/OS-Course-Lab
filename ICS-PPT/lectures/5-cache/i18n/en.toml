['dm-trace.slide.2']
src_hash = '2810464b'
text = 'Of the 5 reads, 1 hits and 4 miss. The block of address 8 replaces the block of address 0, so the read of address 0 afterwards misses.'
# src:
# 
# 5 次读取中 1 次 hit，4 次 miss。地址 8 的块替换了地址 0 的块，再读地址 0 时 miss。

['dm-trace.notes.1']
src_hash = 'c9a96c52'
text = '''
Step by step (the blocks of addresses 0, 13 and 8 are all referenced for the first time, so these three misses are cold misses):
Address 0: the line of set 0 has valid bit 0, so it is a miss. Block 0 (addresses 0 and 1) is fetched and placed in set 0 with tag 0.
Address 1: it is in the same block as address 0, the line of set 0 has valid bit 1 and an equal tag, so it is a hit.
Address 13: set index 2, the line is invalid, so it is a miss. Block 6 (addresses 12 and 13) is fetched.
Address 8: set index 0, the line is valid but tag 1 differs from the tag 0 of the line, so it is a miss. Block 4 replaces block 0.
Address 0: block 0 has been replaced, so it is a miss. At this time sets 1 and 3 are still empty and only 2 of the 4 sets of the cache have been used, so this is a conflict miss.
'''
# src:
# 
# 逐次说明（地址 0、13、8 的块都是第一次被引用，这三次 miss 是冷 miss）：
# 地址 0：组 0 的行有效位为 0，miss。取出块 0（地址 0 和 1）放入组 0，标记 0。
# 地址 1：与地址 0 在同一个块，组 0 的行有效位为 1，标记相等，hit。
# 地址 13：组索引 2，行无效，miss。取出块 6（地址 12 和 13）。
# 地址 8：组索引 0，行有效但标记 1 与行的标记 0 不等，miss。块 4 替换块 0。
# 地址 0：块 0 已被替换，miss。此时组 1 和组 3 仍是空的，缓存的 4 个组只用了 2 个，这是冲突 miss。


- **GPU memory** holds three parts at the same time: the shared **model weights**, the **intermediate results** of the current step, and the **KV Cache** of each session.
- The KV Cache of a single session grows with the number of tokens, and the total size grows with the number of sessions retained in GPU memory.
'''
# src:
# 
# - 显卡的**显存**同时存放三部分数据：共用的**模型权重**、当前步的**中间结果**与各会话的 **KV Cache**。

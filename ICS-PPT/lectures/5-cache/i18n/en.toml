text = 'With the same time complexity, why does access order affect running time?'
# src: 时间复杂度相同，为什么访问顺序会影响运行时间？

['rowcol-run.notes.1']
src_hash = '61a18849'
text = '''
`W` in `rowcol.c` is a global $4096 \times 4096$ array of 64 MB. The inner loop of `sum_rows` varies the column index j, and the inner loop of `sum_cols` varies the row index i. Each function performs $2^{24}$ additions. Both are compiled with `-O1` without vectorization, and their instruction sequences differ only in the address increment.
All matrix elements are initialized to 1, and both functions return 16777216. Timing includes the loops, address calculations and accumulation. The output is the average time per element calculated from a complete traversal.
In this measurement, the ratio of average time per element for column-wise and row-wise summation is 7.44 / 0.41, approximately 18. The values vary with the hardware and execution conditions.
This page raises the question: with the same elements and the same number of additions, why does access order affect running time?
'''

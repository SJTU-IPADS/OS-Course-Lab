text = 'The **KV Cache** stores the $k$ and $v$ of existing tokens. Each decode step computes one row each of $q$, $k$, $v$ for the new token only, appends $k$ and $v$ to the cache, and then uses $q$ and all $k$, $v$ in the cache to compute one row of $A$ and $O$.'

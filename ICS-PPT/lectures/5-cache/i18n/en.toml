On an x86-64 Linux machine the read throughput is as shown: the darker the color, the higher the value, and the dashed lines are the capacities of the cache levels.
- From bottom to top (working set increasing): at stride 1, the 32 KB row is about 4 times faster than the 128 MB row.
- From left to right (stride increasing): in the 128 MB row, stride 1 is about 7 times faster than stride 8.
'''

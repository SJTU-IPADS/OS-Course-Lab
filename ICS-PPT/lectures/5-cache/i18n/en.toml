# 第 2 题与 double 的分析相同，块内元素个数是 16：ijk 的内层循环读 A[i][k]（行，1/16）与 B[k][j]（列，1）。ikj 的内层循环读 B[k][j] 与 C[i][j]（均为行，各 1/16），A[i][k] 在寄存器中。
# 答案由小型缓存模拟程序核对：程序按各顺序生成访问地址序列，用全相联 LRU 缓存统计 miss，结果与上面的算式一致。


# 
# `rowcol.c` 中的 `W` 是 $4096 \times 4096$ 的全局数组，64 MB。`sum_rows` 的内层循环改变列号 j，`sum_cols` 的内层循环改变行号 i。两个函数各执行 $2^{24}$ 次加法，`-O1` 编译，不做向量化，两者的指令序列只在地址的增量上不同。
# 矩阵的所有元素初始化为 1，两函数的返回值均为 16777216。计时包含循环、地址计算和累加，输出是整次遍历折算到每个元素的平均时间。
# 这次测量中，按列求和与按行求和的每元素平均时间之比为 7.44 / 0.41，约为 18。具体数值随硬件与运行状态变化。
# 这一页提出的问题是：访问相同的元素、执行相同次数的加法，为什么访问顺序会影响运行时间？


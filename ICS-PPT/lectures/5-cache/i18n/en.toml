['cache-organization.notes.1']
src_hash = '006c05f4'
text = '''
The cache in the figure has $S=4$, $E=2$ and $B=8$.
A block is $B$ bytes of data, with $B=8$ in the figure. The bytes of a block are a contiguous stretch of main memory.
A line consists of a valid bit, a tag and a block. The valid bit and the tag are extra storage needed to manage the data. The tag is the high part of the address left after removing the set index and the block offset, and it identifies where the block is in main memory.
$E$ lines make up a set, with $E=2$ in the figure. The cache consists of $S$ sets, with $S=4$ in the figure. $S$ and $B$ are powers of 2, so $s$ bits and $b$ bits are enough to express the set number and the byte number within a block.
The capacity counts only data bytes, $4\times2\times8=64$ bytes, and the valid bits and tags are not counted in the capacity.
'''
# src:
# 
# 图中的缓存是 $S=4$、$E=2$、$B=8$。
# 块是 $B$ 字节的数据，图中 $B=8$。块的字节在内存中是连续的一段。
# 一行由有效位、标记和一个块构成。有效位和标记是管理数据所需的额外存储。标记是地址中除去组索引和块偏移之后的高位部分，标识块在内存中的位置。
# $E$ 行构成一组，图中 $E=2$。缓存由 $S$ 个组构成，图中 $S=4$。$S$ 与 $B$ 取 2 的幂，所以用 $s$ 位和 $b$ 位就能表示组号与块内字节号。
# 容量只计数据字节，$4\times2\times8=64$ 字节，有效位和标记不计入容量。

['cache-address.title']
src_hash = '14381722'
text = 'Tag, Set Index and Block Offset of an Address'
# src: 地址的标记、组索引与块偏移

['cache-address.slide.1']
src_hash = '34fef63b'
text = '''
- An $m$-bit address is divided, from the high bits to the low bits, into three fields: $t$ bits of **tag**, $s$ bits of **set index** and $b$ bits of **block offset**.
- The **block offset** selects a byte within the block. The **set index** selects a set in the cache. The **tag** is compared with the tags of the lines in the set to select a line.
- The widths of the fields are determined by the parameters of the cache: $s=\log_2 S$, $b=\log_2 B$, $t=m-s-b$.
'''
# src:
# 
# - $m$ 位的地址从高位到低位分为三个字段：$t$ 位**标记**，$s$ 位**组索引**，$b$ 位**块偏移**。
# - **块偏移**选出块内的字节。**组索引**选出缓存中的组。**标记**在组内与各行的标记比较，选出行。
# - 字段的位数由缓存的参数决定：$s=\log_2 S$，$b=\log_2 B$，$t=m-s-b$。

['cache-address.notes.1']
src_hash = '9fff3a4b'
text = '''
The division of an address depends only on the cache parameters $S$ and $B$. The block offset is the low $b$ bits of the address, and the $B$ addresses within one block have the same tag and set index and differ only in the block offset.
The set index determines the set in which a block is placed, and the tag distinguishes the different blocks that map to the same set. So the position of a block is determined by the set index, and the identity of a block is determined by the tag.
The division on this page holds for the three cache models, direct-mapped, set-associative and fully associative, and the three differ only in the number of lines in each set.
'''
# src:
# 
# 地址的拆分只取决于缓存的参数 $S$ 与 $B$。块偏移是地址的低 $b$ 位，同一个块内的 $B$ 个地址有相同的标记与组索引，只有块偏移不同。
# 组索引决定块放在哪个组，标记区分映射到同一个组的不同块。所以一个块的位置由组索引确定，块的身份由标记确定。

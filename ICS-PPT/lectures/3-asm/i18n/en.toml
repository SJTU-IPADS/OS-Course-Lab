['param-regs.slide.2']
src_hash = '94258a91'
text = '''
**Return value**: placed in `%rax`, using `%rax`, `%eax`, `%ax` or `%al` according to the width of the return value.

**Source of the convention**: the System V AMD64 ABI. An application binary interface (ABI) specifies how separately compiled modules work together; its rules for function calls are called the calling convention.
'''
# src:
# 
# **返回值**：放入 `%rax`，按返回值的宽度使用 `%rax`、`%eax`、`%ax` 或 `%al`。
# 
# **约定的出处**：System V AMD64 ABI。应用二进制接口（ABI）规定分别编译的模块之间如何配合，其中关于函数调用的规定称为调用规约。

['param-regs.notes.1']
src_hash = 'b9634c75'
text = '''
The locations of the arguments and the return value are a convention that both sides of a call follow; the CPU does not check it. The convention prefers registers: reading and writing a register needs no memory access.
The System V AMD64 ABI is the ABI used by Linux on x86-64; ABI stands for Application Binary Interface.
Floating-point arguments use another set of registers, %xmm0 to %xmm7, and a floating-point return value uses %xmm0; the examples of this lecture are all integers and pointers.
The convention of 32-bit x86 puts all arguments on the stack. x86-64 has 16 general-purpose registers and passes the first 6 arguments in registers, which reduces the memory accesses of each call.
'''
# src:
# 
# 参数与返回值的位置是调用双方共同遵守的约定，CPU 不检查。约定优先使用寄存器：读写寄存器不需要访问内存。
# System V AMD64 ABI 是 x86-64 上的 Linux 使用的 ABI，ABI 是 Application Binary Interface 的缩写。
# 浮点参数使用另一组寄存器 %xmm0 到 %xmm7，浮点返回值使用 %xmm0；本讲的例子都是整数与指针。
# 32 位 x86 的约定把全部参数放在栈中。x86-64 有 16 个通用寄存器，改为用寄存器传递前 6 个参数，减少每次调用的访存。


['openmp.slide.1']
src_hash = 'fdd002cb'
text = '''
**Combining multiple cores with vectorization**:
- Vectorization (SIMD) is data-level parallelism inside a single CPU core;
- Modern servers and PCs generally have several physical CPU cores.

**Multicore concurrency with OpenMP**:
'''
# src:
# 
# **多核与向量化结合**：
# - 向量化（SIMD）是单个 CPU 核心内部的数据级并行；
# - 现代服务器与 PC 普遍具备多个物理 CPU 核心。
# 
# **OpenMP 多核并发实现**：

['openmp.slide.2']
src_hash = 'd8586cde'
text = '''
**The "8 cores $\times$ 8 lanes" hardware execution model**:
- The OpenMP runtime divides the iteration range of the loop among threads, which the operating system schedules onto the 8 CPU cores;
- Each core runs 256-bit AVX2 vector instructions (processing 8 data lanes per cycle);
- **Hardware concurrency**: 8 cores $\times$ 8 lanes/core = 64 lanes processing data concurrently.
'''
# src:
# 
# **“8 核 $\times$ 8 通道”硬件执行模型**：
# - OpenMP 运行时将循环的迭代范围切分给各个线程，由操作系统调度到 8 个 CPU 核心上；
# - 每个核心各自运行 256 位 AVX2 向量指令（每周期处理 8 个数据通道）；
# - **硬件并发规模**：8 核心 $\times$ 8 通道/核心 = 64 通道并发处理数据。


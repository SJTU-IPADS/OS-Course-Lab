text = 'Summary of the lecture: the abstraction layers of a computer system and the instruction set contract'
# src: 全节总结：计算机系统的抽象层级与指令集契约

['summary.slide.1']
src_hash = '99a526c2'
text = '''
**The abstraction layers of a computer system**:
1. **High-level language layer (C/C++)**: provides abstractions for expressing algorithms and for structured thinking (loops, functions, arrays), hiding the details of the physical hardware underneath;
2. **Application binary interface (ABI)**: the software contract built on top of the ISA (function calling conventions, responsibilities for preserving registers, run-time stack alignment, sizes of data types); the same ISA has different ABIs on Linux and Windows;
3. **Instruction set architecture (ISA)**: the interface specification between the software and the hardware of a computer (instruction formats and encodings, architectural registers, programmer-visible state, memory addressing modes), which keeps strict backward compatibility across generations;
4. **Microarchitecture and hardware circuit layer**: the physical implementation inside the chip (out-of-order execution pipeline, ALU/AGU arithmetic units, execution ports, physical buses and transistors).
'''
# src:
# 
# **计算机系统的抽象层级划分**：
# 1. **高级语言层（C/C++）**：提供算法表达的抽象与结构化思维（循环、函数、数组），屏蔽底层物理硬件细节；
# 2. **应用二进制接口（ABI）**：建立在 ISA 之上的软件契约规范（函数调用规约、寄存器保护职责、运行时栈对齐、数据类型大小），同一 ISA 在 Linux 与 Windows 下有不同 ABI；
# 3. **指令集体系结构（ISA）**：计算机软硬件之间的接口规范（指令格式与编码、架构寄存器、程序员可见状态、内存寻址模式），在代际演进中保持严格的向后兼容；
# 4. **微架构与硬件电路层（Microarchitecture）**：芯片内部的物理实现（乱序执行流水线、ALU/AGU 算术单元、执行端口、物理总线与晶体管）。


['pc-update.title']
src_hash = '19fa444a'
text = 'The program counter: how the PC is updated during sequential execution'
# src: 程序计数器：顺序执行时 PC 的更新规则

['pc-update.slide.1']
src_hash = 'e6a938b2'
text = '''
**Program counter (PC / `%rip`)**:
- Holds the virtual address of the instruction about to be fetched from the code segment in memory.

**Sequential update rule**:
- When no jump instruction executes, `%rip` increases by the length of the current instruction, **and the hardware does this automatically**:
 $$\%rip \leftarrow \%rip + \text{Instruction\_Length}$$

**Limitation**: instructions are fetched one after another in increasing address order, and execution never returns to an instruction at a lower address.
'''
# src:
# 
# **程序计数器（PC / `%rip`）**：
# - 存放当前即将从内存代码段取出的指令的虚拟地址。
# 
# **顺序更新规则**：
# - 不执行跳转指令时，`%rip` 自动按当前指令长度递增，**该操作由硬件自动完成**：
#  $$\%rip \leftarrow \%rip + \text{Instruction\_Length}$$
# 
# **局限**：按地址递增的顺序依次取指，执行流不会回到地址更小的指令。


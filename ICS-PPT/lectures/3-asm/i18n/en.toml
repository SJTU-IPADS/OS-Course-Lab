The method repeats three steps: read the opcode, decide from the rules whether an operand byte follows, write the operand byte in binary and split it into three groups.
The Intel manual calls the operand byte ModR/M. When mm is 01 or 10 the address also has an offset; when mm is 00 and bbb is 100 or 101 other rules apply, which this exercise does not meet.
'''

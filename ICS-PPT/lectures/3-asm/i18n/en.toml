['vector-naming.slide.1']
src_hash = 'ff7e3d9d'
text = '''
**Naming rules for vector instruction mnemonics**:
- `v` prefix: a vector extension instruction with the VEX encoding; it can take three operands, and the last one is the destination;
- `p` marker: Packed (packed vector integer data);
- Operation name: such as `add` (addition), `mul` (multiplication), `xor` (exclusive or);
- Element width suffix:
  - `b` (byte, 8-bit integer); `w` (word, 16-bit integer);
  - `d` (doubleword, 32-bit integer); `q` (quadword, 64-bit integer).
- Example: `vpmulld` = Vector Packed Multiply Low Doubleword (keeps the low 32 bits of the product).
'''
# src:
# 
# **向量指令助记符命名规律**：
# - `v` 前缀：代表采用 VEX 编码的向量扩展指令，可以写三个操作数，最后一个是目的操作数；
# - `p` 标记：代表 Packed（打包的向量整型数据）；
# - 运算操作名称：如 `add`（加法）、`mul`（乘法）、`xor`（异或）；
# - 元素位宽类型后缀：
#   - `b`（byte，8 位整型）；`w`（word，16 位整型）；
#   - `d`（doubleword，32 位整型）；`q`（quadword，64 位整型）。
# - 实例：`vpmulld` = Vector Packed Multiply Low Doubleword（保留乘积低 32 位）。

['vector-naming.notes.1']
src_hash = 'b480fe5d'
text = '''
A vector instruction mnemonic consists of a prefix, a data class, an operation name and an element width suffix.
An example with three operands: vpmulld (%rsi,%rax), %ymm2, %ymm0 multiplies the 8 integers in memory by the corresponding elements of %ymm2 and writes the result to the last operand, %ymm0; the contents of %ymm2 stay unchanged.
'''
# src:
# 
# 向量指令助记符由前缀、数据类别、运算名称与元素位宽后缀组成。
# 三操作数的例子：vpmulld (%rsi,%rax), %ymm2, %ymm0 把内存中的 8 个整数与 %ymm2 的对应元素相乘，结果写入最后一个操作数 %ymm0，%ymm2 的内容保持不变。

['vector-arith.title']
src_hash = 'ea63f4b7'
text = 'Vector arithmetic: the vmovdqu, vpmulld and vpaddd instructions'
# src: 向量算术：vmovdqu、vpmulld 与 vpaddd 指令

['vector-arith.slide.1']
src_hash = '7eb90485'
text = '''
**Vector load: `vmovdqu (%rdi,%rax), %ymm2`**
- Reads 256 contiguous bits (32 bytes, that is, 8 `int32`) from memory into the register `%ymm2`;
- `vmovdqu` (Unaligned) places no alignment requirement on the memory address; `vmovdqa` (Aligned) requires the address to be a multiple of 32, otherwise the CPU raises an exception and on Linux the process receives the `SIGSEGV` signal.

**Vector multiplication: `vpmulld (%rsi,%rax), %ymm2, %ymm0`**
- Performs 8 multiplications of pairs of 32-bit integers at the same time and writes the low 32 bits of the 8 products to `%ymm0`.

**Vector addition: `vpaddd %ymm0, %ymm1, %ymm1`**
- Adds each of the 8 products in `%ymm0` to the corresponding one of the 8 running sums in `%ymm1`.
'''
# src:
# 
# **向量加载：`vmovdqu (%rdi,%rax), %ymm2`**
# - 从内存连续读取 256 位（32 字节，即 8 个 `int32`）到寄存器 `%ymm2`；
# - `vmovdqu`（Unaligned）对内存地址没有对齐要求；`vmovdqa`（Aligned）要求地址是 32 的倍数，否则 CPU 触发异常，Linux 下进程收到 `SIGSEGV` 信号。
# 
# **向量乘法：`vpmulld (%rsi,%rax), %ymm2, %ymm0`**
# - 同时完成 8 对 32 位整数的乘法，8 个乘积的低 32 位写入 `%ymm0`。
# 
# **向量加法：`vpaddd %ymm0, %ymm1, %ymm1`**
# - `%ymm0` 中的 8 个乘积分别加到 `%ymm1` 中的 8 个累加和上。

['vector-arith.notes.1']
src_hash = '88c59afa'
text = '''
The three AVX2 instructions in the loop body of the vector dot product: load, multiply, add.
vmovdqa raises a general protection exception (#GP) when the address is not aligned. When the 32 bytes that vmovdqu reads span two cache lines, the hardware reads them in two parts.
'''
# src:
# 
# 向量内积循环体中的三条 AVX2 指令：加载、乘法、加法。
# vmovdqa 在地址未对齐时触发通用保护异常（#GP）。vmovdqu 读取的 32 字节跨越两个缓存行时，由硬件分两次读取。


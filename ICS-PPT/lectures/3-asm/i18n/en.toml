['param-clobber.title']
src_hash = '4a4ed7a9'
text = 'Passing arguments: arguments in registers are overwritten by consecutive calls'
# src: 参数传递：连续调用时寄存器中的参数被覆盖

['param-clobber.slide.1']
src_hash = 'a0e8e6bb'
text = '**Example**: `dot_sum` computes the sum of two dot products and calls `dot_product` twice in a row:'
# src:
# 
# **例子**：`dot_sum` 计算两个点积之和，连续两次调用 `dot_product`：

['param-clobber.slide.2']
src_hash = '4346a350'
text = '''
**Arguments are overwritten** (assume for now that `dot_product` does not rewrite `%rdi, %rsi, %rdx, %rcx`):
1. On entry to `dot_sum`, `w, x, y, n` are in `%rdi, %rsi, %rdx, %ecx` in that order;
2. The 3rd argument `n` of the first call must go into `%edx`, which overwrites `y`, still needed by the second call;
3. After the first call returns, `w` and `n` are still in registers but `y` is lost, and the second call is missing an argument.

**The called function rewrites registers**:
- `dot_product` may even rewrite the registers above; then `w` and `n` are lost as well, and all the arguments of the second call are wrong;
- `dot_sum` and `dot_product` are compiled separately, and the former cannot know which registers the latter rewrites;
- The two sides of a call therefore need a calling convention that divides the use of the registers between them.
'''
# src:
# 
# **参数被覆盖**（先假定 `dot_product` 不改写 `%rdi, %rsi, %rdx, %rcx`）：
# 1. 进入 `dot_sum` 时，`w, x, y, n` 依次位于 `%rdi, %rsi, %rdx, %ecx`；
# 2. 第一次调用的第 3 个参数 `n` 须放入 `%edx`，覆盖了第二次调用还要使用的 `y`；
# 3. 第一次调用返回后，`w` 与 `n` 仍在寄存器中，`y` 已丢失，第二次调用缺少参数。
# 
# **被调用函数改写寄存器**：
# - `dot_product` 甚至可能改写上述寄存器，`w` 与 `n` 随之丢失，第二次调用的参数全部错误；
# - `dot_sum` 与 `dot_product` 分别编译，前者无法知道后者改写了哪些寄存器；
# - 因此调用双方需要一套规定寄存器使用分工的调用规范。


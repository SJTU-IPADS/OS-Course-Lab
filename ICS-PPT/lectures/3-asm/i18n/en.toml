['movl-load-2.slide.1']
src_hash = '41eac19b'
text = '''
**Operand constraints of the `mov` instruction**:
1. **No two memory accesses at once**: the source and destination cannot both be memory addresses (`movl (%rsi), (%rdi)` is an illegal instruction);
2. **An immediate cannot be the destination operand**;
3. Moving data from memory to memory must be split into two consecutive instructions, "memory $\to$ register $\to$ memory".
'''
# src:
# 
# **`mov` 指令的操作数约束规则**：
# 1. **不能同时访问两处内存**：源与目的不可同时为内存地址（`movl (%rsi), (%rdi)` 是非法指令）；
# 2. **立即数不能作为目的操作数**；
# 3. 内存到内存的数据搬运，必须拆分为“内存 $\to$ 寄存器 $\to$ 内存”两条连续指令。


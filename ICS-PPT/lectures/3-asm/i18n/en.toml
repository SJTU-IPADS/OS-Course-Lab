['lea-agu.title']
src_hash = 'effaef83'
text = 'Address computation: the lea instruction and the AGU circuit that supports it'
# src: 地址计算：lea 指令与硬件 AGU 的电路支持

['lea-agu.slide.1']
src_hash = 'd693c592'
text = '''
**The hardware address generation unit (AGU)**:
- The CPU contains a separate combinational logic circuit that performs the multiplication (shift) and the three-way addition of an effective address in a single cycle.

**The `lea` (Load Effective Address) instruction**:
- Syntax: `leal Disp(Base, Index, Scale), Dest`
- **Hardware mechanism**: after the AGU computes the effective address, **the computed value is written directly into the destination register, with no memory bus access at all**.

**Quick in-class exercise**:
- Suppose `%rdi = 0x2000` and `%rcx = 3`. Compute the value of `%eax` after the instruction `leal 8(%rdi,%rcx,4), %eax` executes.
'''
# src:
# 
# **硬件地址生成单元（AGU: Address Generation Unit）**：
# - CPU 内部包含独立的组合逻辑电路，在单周期内完成有效地址的乘法移位与三数相加。
# 
# **`lea`（Load Effective Address）指令**：
# - 语法：`leal Disp(Base, Index, Scale), Dest`
# - **硬件机制**：利用 AGU 计算出有效地址后，**直接把计算得到的数值写入目的寄存器，不发生任何内存总线访问**。
# 
# **课堂快速计算练习**：
# - 假设 `%rdi = 0x2000`，`%rcx = 3`，计算指令 `leal 8(%rdi,%rcx,4), %eax` 执行后 `%eax` 的数值。


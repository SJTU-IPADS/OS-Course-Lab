['stack-args.slide.1']
src_hash = '46ebce15'
text = '''
**The caller pushes the 7th and later arguments onto the stack**:
- The pushes happen before `call`, from right to left: the last argument is pushed first and the 7th argument is pushed last;
- Each argument takes 8 bytes; an argument narrower than 8 bytes also takes 8 bytes;
- `call` then pushes the return address. On entry to the callee, `(%rsp)` is the return address, `8(%rsp)` is argument 7, `16(%rsp)` is argument 8, and so on;
- After the call returns, the caller increases `%rsp` to free these arguments.

**Example**: `use8` calls `last2(1, 2, 3, 4, 5, 6, 7, 8)`, and `last2` returns the 7th argument minus the 8th argument. The figure on the left shows the stack on entry to `last2`.
'''
# src:
# 
# **第 7 个及以后的参数由调用者压入栈**：
# - 压栈在 `call` 之前进行，顺序从右向左：最后一个参数最先压入，第 7 个参数最后压入；
# - 每个参数占 8 字节，宽度不足 8 字节的参数也占 8 字节；
# - `call` 再压入返回地址。进入被调用者时，`(%rsp)` 是返回地址，`8(%rsp)` 是参数 7，`16(%rsp)` 是参数 8，依此类推；
# - 调用返回后，调用者增大 `%rsp`，释放这些参数。
# 
# **例子**：`use8` 调用 `last2(1, 2, 3, 4, 5, 6, 7, 8)`，`last2` 返回第 7 个参数减第 8 个参数的差。左图是进入 `last2` 时的栈。

['stack-args.notes.1']
src_hash = 'c3af8b93'
text = '''
Pushing from right to left puts the 7th argument closest to the top of the stack, and the callee reads at fixed offsets: argument 7 is always at 8(%rsp), whatever the total number of arguments.
In the figure on the left, the left side of each row shows how last2 refers to that location, and the right side shows the instruction in use8 that writes it. All three locations belong to the stack frame of use8.
'''
# src:
# 
# 从右向左压栈使第 7 个参数离栈顶最近，被调用者按固定的偏移读取：参数 7 总在 8(%rsp)，与参数的总数无关。
# 左图各行左侧是 last2 访问该位置的写法，右侧是 use8 中写入该位置的指令。三个位置都属于 use8 的栈帧。


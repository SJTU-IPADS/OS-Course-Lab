['loop-forms.title']
src_hash = 'd32e53e4'
text = 'Translating loops: from the jump-to-middle to the guarded-do structure'
# src: 循环翻译：从 jump-to-middle 到 guarded-do 结构

['loop-forms.slide.1']
src_hash = '84cddb42'
text = '''
**C loops and three machine-level structures**: a do-while loop tests its condition at the bottom, and the body executes at least once; a while loop also tests the condition before the first iteration, and the body may not execute at all.
1. **The `do-while` structure (translates do-while loops)**:
   - Executes the body first, then compares and jumps conditionally at the bottom, jumping back to the start of the body when the condition holds.
2. **The `jump-to-middle` structure (translates ordinary while loops; used by `-Og`)**:
   - At the entry, the unconditional jump `jmp` goes to the condition test at the bottom, which jumps back to the start of the body when the condition holds;
   - The condition is tested before the first iteration, so when $n \le 0$ the body does not execute at all.
3. **The `guarded-do` structure (translates ordinary while loops; used by `-O2`)**:
   - The entry first tests the condition once, as a guard, and jumps out directly when the initial condition does not hold;
   - Once past the guard, the loop executes in the do-while structure and tests the condition at the bottom;
   - Compared with jump-to-middle, each call executes one entry `jmp` fewer.
'''
# src:
# 
# **C 循环与三种机器级结构**：do-while 循环在底部判断条件，循环体至少执行一次；while 循环在第一轮之前也判断条件，循环体可能一次也不执行。
# 1. **`do-while` 结构（翻译 do-while 循环）**：
#    - 先执行循环体，底部比较并条件跳转，满足条件时跳回循环体开头。
# 2. **`jump-to-middle` 结构（翻译普通 while 循环，`-Og` 采用）**：
#    - 入口用无条件跳转 `jmp` 跳到底部的条件判断，满足条件时跳回循环体开头；
#    - 第一轮之前即判断条件，$n \le 0$ 时循环体一次也不执行。
# 3. **`guarded-do` 结构（翻译普通 while 循环，`-O2` 采用）**：
#    - 入口先判断一次条件，作为卫语句（Guard），初始条件不成立时直接跳出；
#    - 卫语句通过后，循环按 do-while 结构执行，在底部判断条件；
#    - 与 jump-to-middle 相比，每次调用少执行一条入口 `jmp`。

['loop-forms.notes.1']
src_hash = 'b71d8828'
text = 'The three structures compilers use to translate loops: the do-while structure translates do-while loops, and jump-to-middle (`-Og`) and guarded-do (`-O2`) translate ordinary while loops.'

['cmov.title']
src_hash = 'abbf38a0'
text = 'Branchless selection: the setX instructions and cmov conditional moves'
# src: 无分支选择：setX 指令与 cmov 条件传送

['cmov.slide.1']
src_hash = '94650700'
text = '''
**Conditional set instructions: `setX`**:
- Set a single-byte destination to 0 or 1 according to the flags (for example `setl %al` evaluates the Boolean `a < b`).

**Conditional move instructions: `cmovX` (Conditional Move)**:
- Syntax: `cmovl %edx, %eax` (if less, copies `%edx` to `%eax`; otherwise `%eax` keeps its value);
- The two candidate values are first placed in registers, and `cmovX` selects one of them according to the flags;
- The selection needs no conditional jump, so the instruction sequence lacks the branch instruction and its label.

**Example**: `int max(int a, int b) { int v = a; if (a < b) v = b; return v; }`
- `gcc -Og` implements the selection with the conditional jump `jl`;
- `gcc -O2` uses `cmovge` instead, with one branch instruction fewer.
'''
# src:
# 
# **条件设置指令：`setX`**：
# - 根据标志位状态，将单个字节目标设为 0 或 1（如 `setl %al` 用于布尔求值 `a < b`）。
# 
# **条件传送指令：`cmovX`（Conditional Move）**：
# - 语法：`cmovl %edx, %eax`（若小于则将 `%edx` 拷贝到 `%eax`，否则 `%eax` 保持原值）；
# - 两个候选值先分别放入寄存器，`cmovX` 依据标志位选出其中一个；
# - 选择过程不需要条件跳转，指令序列中少了分支跳转指令与对应的标号。
# 
# **示例**：`int max(int a, int b) { int v = a; if (a < b) v = b; return v; }`
# - `gcc -Og` 用条件跳转 `jl` 实现选择；
# - `gcc -O2` 改用 `cmovge`，少了一条分支跳转指令。


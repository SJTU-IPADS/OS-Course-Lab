src_hash = '376afa29'
text = '''
**Common practical situations that prevent automatic vectorization**:
1. **Pointer aliasing**: the compiler cannot rule out that the pointers overlap, and the C99 `restrict` keyword is needed to declare this explicitly;
2. **Loop-carried data dependence**: successive iterations depend strictly on each other (such as `a[i] = a[i-1] + ...`; the sum reduction `sum += ...` of this lecture, by contrast, is recognized and handled automatically by the compiler);
3. **A function call inside the loop body that cannot be inlined**.
'''
# src:
# 
# **阻止自动向量化的常见工程情形**：
# 1. **指针别名（Pointer Aliasing）**：编译器无法排除指针重叠风险，需使用 C99 `restrict` 关键字显式声明；
# 2. **循环携带数据依赖（Loop-carried Dependency）**：前后迭代存在强因果依赖（如 `a[i] = a[i-1] + ...`，而本节的求和规约 `sum += ...` 能被编译器识别并自动处理）；
# 3. **循环体内部存在不可内联的函数调用**。


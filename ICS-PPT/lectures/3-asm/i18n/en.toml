['shift-ops.title']
src_hash = '2a4abe5a'
text = 'Unary, binary and shift instructions'
# src: 一元、二元与移位运算指令

['shift-ops.slide.1']
src_hash = 'b872d6a3'
text = '''
**Unary and binary operation instructions**:
- **Unary operations**: `incl D` (increment by 1), `decl D` (decrement by 1), `negl D` (negate, $D \leftarrow -D$), `notl D` (bitwise complement);
- **Binary operations**: `addl S, D`, `subl S, D` (subtraction, $D \leftarrow D - S$), `andl S, D`, `orl S, D`, `xorl S, D`.

**Shift instructions**:
- **Left shift**: `sall` / `shll` (shift left, filling the low bits with 0; the two are equivalent);
- **Arithmetic right shift**: `sarl` (copies the sign bit into the top when shifting right, which preserves the meaning of negative signed numbers);
- **Logical right shift**: `shrl` (fills the upper bits strictly with 0 when shifting right; used to divide unsigned numbers by $2^k$).
'''
# src:
# 
# **一元与二元运算指令**：
# - **一元运算**：`incl D`（自增 1），`decl D`（自减 1），`negl D`（取相反数 $D \leftarrow -D$），`notl D`（按位取反）；
# - **二元运算**：`addl S, D`，`subl S, D`（减法 $D \leftarrow D - S$），`andl S, D`，`orl S, D`，`xorl S, D`。
# 
# **移位操作指令**：
# - **左移指令**：`sall` / `shll`（左移，低位补 0，二者等价）；
# - **算术右移**：`sarl`（右移时复制最高符号位，保持有符号负数语义）；
# - **逻辑右移**：`shrl`（右移时高位严格补 0，用于无符号数除以 $2^k$）。


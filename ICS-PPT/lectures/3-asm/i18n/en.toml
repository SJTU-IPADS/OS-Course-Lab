['int-arith.title']
src_hash = '985130c6'
text = 'Integer multiply instruction: imull'
# src: 整数乘法指令：imull

['int-arith.slide.1']
src_hash = '5ff1909d'
text = '''
**Two-operand format `imull S, D`** (the `imull (%rdi), %eax` of the single multiply-add):
- Semantics: $D \leftarrow D \times S$; $S$ can be a register, a memory operand or an immediate, and $D$ can only be a register;
- Only the low 32 bits of the product are kept and written to $D$. The low 32 bits of a signed and of an unsigned multiplication are the same, so multiplications of `int` and of `unsigned` both compile to `imull`;

**Three-operand format `imull $k, S, D`**: $D \leftarrow S \times k$, where $k$ is an immediate; the source and the destination can be different registers.

**One-operand format `imull S`**: $\%edx\!:\!\%eax \leftarrow \%eax \times S$; the complete 64-bit product is kept, with the high 32 bits in `%edx` and the low 32 bits in `%eax`; the unsigned version is `mull S`.

**Suffixes and width**: `imulw` / `imull` / `imulq` perform 16-, 32- and 64-bit multiplication respectively; writing a 32-bit register clears the upper 32 bits of `%rax` and the other 64-bit registers.
'''
# src:
# 
# **二操作数格式 `imull S, D`**（单次乘加中的 `imull (%rdi), %eax`）：
# - 语义：$D \leftarrow D \times S$；$S$ 可以是寄存器、内存操作数或立即数，$D$ 只能是寄存器；
# - 乘积只保留低 32 位写入 $D$。有符号与无符号乘法的低 32 位相同，`int` 与 `unsigned` 的乘法因此都编译为 `imull`；
# 
# **三操作数格式 `imull $k, S, D`**：$D \leftarrow S \times k$，$k$ 是立即数，源与目的可以是不同的寄存器。
# 
# **单操作数格式 `imull S`**：$\%edx\!:\!\%eax \leftarrow \%eax \times S$，保留完整的 64 位乘积，高 32 位在 `%edx`，低 32 位在 `%eax`；无符号版本是 `mull S`。
# 
# **后缀与位宽**：`imulw` / `imull` / `imulq` 分别做 16、32、64 位乘法；写入 32 位寄存器时 `%rax` 等的高 32 位清零。

['int-arith.notes.1']
src_hash = 'e25213ca'
text = '''
The figure shows imull executing in the ALU: D and S enter the multiplier and produce a 64-bit product, and where its two halves go depends on the format. The two-operand and three-operand formats write only the low 32 bits back to D and drop the high 32 bits, consistent with the truncation of int multiplication in C; the one-operand format writes the high 32 bits to %edx and the low 32 bits to %eax, which expressions such as (long)a * b in C code use.
The three-operand format imull $k, S, D is one of the few x86-64 arithmetic instructions whose destination operand can differ from the source.
'''
# src:
# 
# 图中是 imull 在 ALU 中的执行：D 与 S 进入乘法器，得到 64 位乘积，两半的去向由格式决定。二操作数与三操作数格式只把低 32 位写回 D，高 32 位丢弃，与 C 语言 int 乘法的截断一致；单操作数格式把高 32 位写入 %edx、低 32 位写入 %eax，C 代码中 (long)a * b 这类表达式会用到。
# 三操作数格式 imull $k, S, D 是 x86-64 少有的目的操作数可以与源不同的算术指令。

['int-arith-2.title']
src_hash = '563b1bc9'
text = 'Integer add instruction: addl'
# src: 整数加法指令：addl

['int-arith-2.slide.1']
src_hash = '0514d214'
text = '''
**Format `addl S, D`**:
- Semantics: $D \leftarrow D + S$; $S$ can be an immediate, a register or a memory operand, $D$ can be a register or a memory operand, and the two cannot both be memory operands;
- A 32-bit binary addition; the result is written back to $D$, and a carry out of the 32 bits is discarded;
- Signed and unsigned addition perform the same bit operations.

**Three example forms**:
- `addl %edx, %eax`: register plus register; accumulates `sum` in the single multiply-add;
- `addl $1, %eax`: adds an immediate; `i++` compiles to this one instruction;
- `addl %eax, (%rdi)`: the destination is a memory operand; reads `*w`, adds, and writes back, completing `*w += t` in one instruction.
'''
# src:
# 
# **格式 `addl S, D`**：
# - 语义：$D \leftarrow D + S$；$S$ 可以是立即数、寄存器或内存操作数，$D$ 可以是寄存器或内存操作数，二者不能同时是内存操作数；
# - 32 位二进制加法，结果写回 $D$，超出 32 位的进位丢弃；
# - 有符号与无符号加法的位运算相同。
# 
# **三种写法示例**：
# - `addl %edx, %eax`：寄存器加寄存器，单次乘加中累加 `sum`；
# - `addl $1, %eax`：加立即数，`i++` 编译为这一条指令；
# - `addl %eax, (%rdi)`：目的是内存操作数，读出 `*w`、相加、写回，一条指令完成 `*w += t`。


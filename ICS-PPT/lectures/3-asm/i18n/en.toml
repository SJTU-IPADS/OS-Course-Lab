['cuda-build.notes.1']
src_hash = '5037a1d4'
text = '''
nvcc is a compiler driver that calls several tools in turn; nvcc --dryrun lists all the steps: gcc -E preprocesses; cudafe++ separates host code from device code; cicc compiles the device code into PTX (the assembly language of the GPU); ptxas assembles the PTX into GPU machine instructions; fatbinary wraps these instructions as data; gcc compiles the host code and this data into x86-64 object files; and g++ links the CUDA runtime library libcudart.
-arch=native makes ptxas generate instructions for the GPU of this machine (the RTX 5090 is sm_120); without the option, instructions are generated for an earlier architecture, which newer GPUs can execute.
To look at the two intermediate results: nvcc -O2 -ptx dot_cuda.cu -o dot_cuda.ptx gives the PTX, in which mul.lo.s32 is the multiplication and bar.sync is __syncthreads; cuobjdump -sass dot_cuda lists the GPU machine instructions in the executable.
An NVIDIA GPU and the CUDA Toolkit are needed. In the output, 65536 x 256 is the number of thread blocks and the number of threads per block.
'''
# src:
# 
# nvcc 是编译驱动程序，它依次调用几个工具，nvcc --dryrun 列出全部步骤：gcc -E 预处理；cudafe++ 把主机端代码与设备端代码分开；cicc 把设备端代码编译为 PTX（GPU 的汇编语言）；ptxas 把 PTX 汇编为 GPU 的机器指令；fatbinary 把这些指令包装为数据；gcc 把主机端代码与这份数据编译为 x86-64 目标文件；最后由 g++ 链接 CUDA 运行库 libcudart。
# -arch=native 使 ptxas 为本机的 GPU 生成指令（RTX 5090 是 sm_120）；不写这个选项时为较早的架构生成指令，较新的 GPU 可以执行。
# 查看两种中间结果：nvcc -O2 -ptx dot_cuda.cu -o dot_cuda.ptx 得到 PTX，其中 mul.lo.s32 是乘法，bar.sync 是 __syncthreads；cuobjdump -sass dot_cuda 列出可执行文件中的 GPU 机器指令。
# 需要 NVIDIA GPU 与 CUDA Toolkit。输出中 65536 x 256 是线程块个数与每块的线程数。


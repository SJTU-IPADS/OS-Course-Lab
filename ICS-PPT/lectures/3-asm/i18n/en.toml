['cond-jump.title']
src_hash = 'fbaf20d5'
text = 'Conditional branches: the complete set of conditional jump instructions'
# src: 条件分支：完整的条件跳转指令体系

['cond-jump.slide.1']
src_hash = 'f83607a1'
text = '''
**The complete classification of conditional jump instructions**:
1. **Equality and zero tests**: `je` / `jz` (ZF=1), `jne` / `jnz` (ZF=0);
2. **Signed comparison branches**:
   - `jl`: less, condition $\text{SF} \ne \text{OF}$;
   - `jle`: less or equal, condition $(\text{SF} \ne \text{OF}) \lor (\text{ZF}=1)$;
   - `jg`: greater, condition $(\text{SF} = \text{OF}) \land (\text{ZF}=0)$;
   - `jge`: greater or equal, condition $\text{SF} = \text{OF}$;
3. **Unsigned comparison branches**:
   - `jb`: Below, unsigned less, condition $\text{CF}=1$;
   - `jbe`: Below or Equal, unsigned less or equal, condition $\text{CF}=1 \lor \text{ZF}=1$;
   - `ja`: Above, unsigned greater, condition $\text{CF}=0 \land \text{ZF}=0$;
   - `jae`: Above or Equal, unsigned greater or equal, condition $\text{CF}=0$.
'''
# src:
# 
# **完整的条件跳转指令分类**：
# 1. **相等与零值检测**：`je` / `jz` (ZF=1), `jne` / `jnz` (ZF=0)；
# 2. **有符号数值比较分支**：
#    - `jl`：小于，条件为 $\text{SF} \ne \text{OF}$；
#    - `jle`：小于等于，条件为 $(\text{SF} \ne \text{OF}) \lor (\text{ZF}=1)$；
#    - `jg`：大于，条件为 $(\text{SF} = \text{OF}) \land (\text{ZF}=0)$；
#    - `jge`：大于等于，条件为 $\text{SF} = \text{OF}$；
# 3. **无符号数值比较分支**：
#    - `jb`：Below，无符号小于，条件为 $\text{CF}=1$；
#    - `jbe`：Below or Equal，无符号小于等于，条件为 $\text{CF}=1 \lor \text{ZF}=1$；
#    - `ja`：Above，无符号大于，条件为 $\text{CF}=0 \land \text{ZF}=0$；
#    - `jae`：Above or Equal，无符号大于等于，条件为 $\text{CF}=0$。


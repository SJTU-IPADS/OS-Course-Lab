# src:
# 
# - **GPU 为图像渲染设计**：一帧画面的每个顶点、每个像素执行同一段程序，运算以矩阵与向量的乘加为主；神经网络推理的矩阵向量乘是同一类计算。

['gpu-why.notes.1']
src_hash = '807e4a2f'
text = '''
SIMD is one instruction processing several data elements; SIMT is several threads executing the same code. Multi-core parallelism on a CPU is of the second kind: each core runs 1 thread, and each thread processes a part of the data. The i9-11900H has 8 cores with 2 hardware threads each, so at most 16 threads run at the same time; ollama on 8 threads measures 31.4 Token/s, 2.9 times its speed on 1 thread.
The 21760 arithmetic cores of the RTX 5090 are the CUDA Cores of the NVIDIA specification sheet, which equal 170 SMs times the 128 cores of each SM. One CUDA core performs one operation of one thread; fetching, decoding and scheduling are done by one set of logic shared by the 32 cores of a group. Each core of a CPU has a complete set of control logic and caches of its own. The two kinds of core do different things, and the comparison of their numbers is a comparison of how many threads can execute at the same time.
The device memory of the RTX 5090 is 32 GB of GDDR7 on a 512-bit bus at 28 Gbit/s per data line, which gives a peak bandwidth of 28 × 512 ÷ 8 = 1792 GB/s. The memory bandwidth of 51.2 GB/s is the value of the page "Hardware limits".
The reference results of step 2 of the lab parallel-dot were measured on an i9-11900H and an RTX 3060 Laptop (3840 arithmetic cores), for a 32768 × 4096 matrix-vector product: the scalar loop on 1 CPU thread 59.8 ms, 16 CPU threads with vector instructions 4.5 ms, the GPU 0.81 ms; that is 1, 13.4 and 73.5 times.
In image rendering, the coordinate transform of a vertex is a product of a 4 × 4 matrix and a vector, and the colour of every pixel is computed by the same shading program; both apply the same operation to a large amount of data.
'''
# src:
# 
# SIMD 是一条指令处理多个数据，SIMT 是多个线程执行同一段代码。CPU 的多核并行属于后一种：每个核心运行 1 个线程，各自处理数据的一段。i9-11900H 有 8 个核心，每个核心 2 个硬件线程，至多 16 个线程同时运行；ollama 用 8 个线程实测 31.4 Token/s，是 1 个线程的 2.9 倍。
# RTX 5090 的 21760 个运算核心是 NVIDIA 规格表中的 CUDA Cores，等于 170 个 SM 乘以每个 SM 的 128 个。一个 CUDA 核心只完成一个线程的一次运算，取指令、译码与调度由同组的 32 个核心共用一套逻辑；CPU 的每个核心各有一套完整的控制逻辑与缓存。两种核心的功能不同，数量的对比说明的是可以同时执行的线程数。
# RTX 5090 的显存是 32 GB 的 GDDR7，总线宽度 512 位，每条数据线的速率是 28 Gbit/s，峰值带宽为 28 × 512 ÷ 8 = 1792 GB/s；内存带宽 51.2 GB/s 是「硬件上限」一页的数值。
# 实验 parallel-dot 第二步的参考结果在 i9-11900H 与 RTX 3060 Laptop（3840 个运算核心）上测得，32768 × 4096 的矩阵向量乘：CPU 1 个线程的标量循环 59.8 ms，CPU 16 个线程并使用向量指令 4.5 ms，GPU 0.81 ms，依次是 1 倍、13.4 倍、73.5 倍。
# 图像渲染中，顶点的坐标变换是 4 × 4 矩阵与向量的乘法，每个像素的颜色由同一段着色程序计算，两者都是对大量数据执行相同的运算。

['gpu-arch.title']
src_hash = 'c5ace37c'
text = 'GPU architecture: Thread, Thread Block, Grid and Warp'
# src: GPU 架构：Thread、Thread Block、Grid 与 Warp

['gpu-arch.slide.1']
src_hash = '825a42f9'
text = '''
**Hardware** (the RTX 5090 as the example):
- **SM (Streaming Multiprocessor)**: the arithmetic part of the GPU, 170 in total; each SM has 128 arithmetic cores and a block of shared memory.
- **Device memory**: 32 GB, shared by all SMs; data moves between it and the host memory by copies over the PCIe bus.

**The threads a program starts are organized in three levels**:
- **Thread**: the basic unit of execution; every thread executes the same function (called the kernel) once;
- **Thread Block**: a group of threads, placed on 1 SM as a whole; the threads of a block share the shared memory of that SM;
- **Grid**: all the thread blocks of one launch.

**Warp**: the SM groups the threads of a block 32 at a time, and the 32 threads of one warp execute the same instruction at the same time.
'''
# src:
# 
# **硬件**（以 RTX 5090 为例）：
# - **SM（Streaming Multiprocessor，流式多处理器）**：GPU 的运算部件，共 170 个；每个 SM 有 128 个运算核心与一块共享内存。
# - **显存**：32 GB，所有 SM 共用；它与主机内存之间的数据经 PCIe 总线拷贝。
# 
# **程序启动的线程分为三级**：
# - **Thread（线程）**：最基本的执行单元，每个线程把同一个函数（称为 kernel）执行一遍；
# - **Thread Block（线程块）**：一组线程，整块分配给 1 个 SM，块内的线程共用这个 SM 的共享内存；
# - **Grid（网格）**：一次启动的全部线程块。
# 
# **Warp（线程束）**：SM 把线程块中的线程每 32 个编为一组，同一个 Warp 的 32 个线程在同一时刻执行同一条指令。

['gpu-arch.notes.1']
src_hash = '59c9f04c'
text = '''
The hardware of an NVIDIA GPU and the way a CUDA program organizes its threads. The numbers of the RTX 5090 come from the NVIDIA specification sheet: 21760 CUDA cores, that is 170 SMs; 32 GB of device memory; PCIe 5.0. Its compute capability is 12.0, and the CUDA documentation gives the limits of this generation: a warp of 32 threads, at most 1024 threads in one thread block, at most 1536 threads on one SM at the same time (48 warps; 261120 threads on the whole card), 100 KB of shared memory per SM, and at most 99 KB of it for one thread block.
One SM can hold several thread blocks at the same time; when there are more thread blocks than the SMs can hold, the rest wait and are placed when earlier blocks finish. A thread block does not change its SM while it executes, which is why its threads can share the shared memory of that SM.
The SM fetches one instruction and gives it to the 32 threads of one warp to execute at the same time; this is how the hardware implements SIMT. When the threads of one warp take different paths at a branch, the SM executes the paths one after another, and the threads that are not on the current path wait; this is called branch divergence.
'''
# src:
# 
# NVIDIA GPU 的硬件组成与 CUDA 程序的线程组织。RTX 5090 的数值来自 NVIDIA 的规格表：21760 个 CUDA 核心，合 170 个 SM；32 GB 显存；PCIe 5.0。它的计算能力（Compute Capability）是 12.0，CUDA 文档给出这一代的上限：Warp 为 32 个线程，一个线程块至多 1024 个线程，一个 SM 上至多同时有 1536 个线程（48 个 Warp，全卡 261120 个线程），每个 SM 的共享内存 100 KB，一个线程块至多使用 99 KB。
# 一个 SM 可以同时容纳多个线程块；线程块的数量多于 SM 能容纳的数量时，其余线程块等待，前面的线程块结束后再分配。线程块在执行期间不更换 SM，块内线程因此可以共用这个 SM 的共享内存。
# SM 取出一条指令，交给同一个 Warp 的 32 个线程同时执行，这是 SIMT 在硬件上的做法。同一个 Warp 的线程在分支处走向不同路径时，SM 依次执行各条路径，不在当前路径上的线程等待，这种情况称为分支分化（Branch Divergence）。


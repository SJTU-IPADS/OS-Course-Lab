['hw-peak.slide.1']
src_hash = '7231e986'
text = '''
**Where the multiply-adds per cycle come from**:
- One AVX-512 VNNI instruction `vpdpbusd` performs 64 8-bit integer multiplications and accumulates the products, in groups of 4, into 16 32-bit sums; each core executes 1 per cycle;
- The 16 for FP32 come from 2 256-bit FMA (fused multiply-add) instructions per cycle, each performing 8 multiply-adds;
- The i9-11900H has no 4-bit integer multiply instruction: int4 weights are first expanded to 8 bits and then multiplied, so the peak is computed for int8.
'''
# src:
# 
# **每周期乘加次数的来源**：
# - AVX-512 VNNI 指令 `vpdpbusd` 一条完成 64 次 8 位整数乘法，乘积每 4 个一组累加到 16 个 32 位和中；每个核心每周期执行 1 条；
# - FP32 的 16 次来自每周期 2 条 256 位 FMA（乘加融合）指令，每条完成 8 次乘加；
# - i9-11900H 没有 4 位整数乘法指令，int4 权重先展开成 8 位再相乘，峰值按 int8 计算。

['hw-peak.notes.1']
src_hash = '53f224f4'
text = '''
TOPS and TFLOPS count 1 multiply-add as 2 operations, the same convention as in lecture 2.
A single core of the i9-11900H runs at up to 4.9 GHz; when all 8 cores execute vector instructions at once, power limits keep the clock below this value, and this page estimates with 4.0 GHz.
A Willow Cove core combines ports 0 and 1 to execute 512-bit operations: 1 512-bit vpdpbusd per cycle, or 2 256-bit vpdpbusd (which require AVX-512 VL), both 64 8-bit multiply-adds per cycle.
On this machine, a loop of 10 mutually independent vpdpbusd instructions measures about 60 per cycle on a single core.
'''
# src:
# 
# TOPS 与 TFLOPS 按 1 次乘加计 2 次运算换算，与第二讲的约定相同。
# i9-11900H 单核最高 4.9 GHz；8 个核心同时执行向量指令时受功耗限制，主频低于这个值，本页取 4.0 GHz 估算。
# Willow Cove 核心把端口 0 与端口 1 合并执行 512 位运算：每周期 1 条 512 位 vpdpbusd，或 2 条 256 位 vpdpbusd（需要 AVX-512 VL），都是每周期 64 次 8 位乘加。
# 在这台机器上用 10 条互不依赖的 vpdpbusd 组成循环，单核实测约每周期 60 次。


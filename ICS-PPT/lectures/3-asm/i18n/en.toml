['memory-wall-5.title']
src_hash = '88710ff8'
text = 'Measuring the memory wall: the multiply-add rate as the number of threads changes'
# src: 访存墙实测：乘加速率随线程数的变化

['memory-wall-5.slide.1']
src_hash = 'ef0fb9a1'
text = '''
**Conclusions from the measurements**:
- With 4 to 8 threads, the AVX2 version reads at about 33 GB/s; more threads no longer raise the multiply-add rate noticeably, and the program has reached the memory wall;
- The scalar version reads only 2.4 GB/s with 8 threads. With all 8 cores at 4.0 GHz, the scalar version reaches at most $8 \times 2.7 \times 10^9 \approx 2.1 \times 10^{10}$ /s, below the bandwidth limit, so both SIMD and multiple cores are needed.

**Converted to a 7B model**: $7 \times 10^9 \div (6.6 \times 10^{10}) \approx 0.11$ s, about 9 tokens per second; the bandwidth limit corresponds to 14.6 per second.

**After reaching the memory wall**, raising the generation speed requires reducing the bytes read per token (the quantization of lecture 2) or using memory with higher bandwidth, such as the 1792 GB/s GPU memory bandwidth of the RTX 5090 in lecture 2.
'''
# src:
# 
# **实测结论**：
# - AVX2 版本用 4 至 8 个线程时读取速率约 33 GB/s，增加线程不再明显提高乘加速率，程序到达访存墙；
# - 标量版本用 8 个线程只读取 2.4 GB/s。8 个核心都以 4.0 GHz 运行时，标量版本至多 $8 \times 2.7 \times 10^9 \approx 2.1 \times 10^{10}$ 次/s，低于带宽上限，SIMD 与多核两者都需要。
# 
# **折算到 7B 模型**：$7 \times 10^9 \div (6.6 \times 10^{10}) \approx 0.11$ s，每秒约 9 个 Token，带宽上限对应每秒 14.6 个。
# 
# **到达访存墙之后**，提高生成速度需要减少每个 Token 读取的字节数（第二讲的量化），或者使用带宽更高的内存，例如第二讲中 RTX 5090 的显存带宽 1792 GB/s。

['memory-wall-5.notes.1']
src_hash = 'ac479a7f'
text = '51.2 GB/s is the theoretical value for dual-channel DDR4-3200. DRAM refresh, row switching and the scheduling of the memory controller all take time, so the measured read-only bandwidth is lower than the theoretical value.'
# src:
# 
# 51.2 GB/s 是 DDR4-3200 双通道的理论值。DRAM 刷新、行切换与内存控制器的调度都占用时间，只读的实测带宽低于理论值。


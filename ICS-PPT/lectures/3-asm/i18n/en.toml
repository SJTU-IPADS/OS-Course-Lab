['hw-peak.notes.1']
src_hash = '38715a6d'
text = '''
320 GFLOPS is taken from Intel's APP Metrics for Intel Microprocessors (Intel Core Processors, Revision 8, January 6, 2026), a document that lists the GFLOPS of every model for export compliance.
51.2 GB/s is taken from the Max Memory Bandwidth entry for the i9-11900H on Intel's product specifications page; the memory specification is dual-channel, up to 3200 MT/s.
Arithmetic intensity I is the ratio of work to memory traffic (lecture 2); 1 multiply-add counts as 2 operations. A program whose I is below the balance point is in the memory-bound region, where the limit on the rate is B × I; a program above the balance point is in the compute-bound region, where the limit is P.
The GFLOPS of this document counts 64-bit floating-point operations. This lecture follows the convention of lecture 2: a multiply-add of any data type counts as 2 operations.
Balance point is the name used in lecture 2, where the balance point of the RTX 5090 is about 117 FLOP/Byte.
The hollow circle in the figure is the bandwidth limit of the language model of Qwen3-VL-2B: its arithmetic intensity is 3.44 ÷ 0.968 ≈ 3.55 FLOP/Byte, and 51.2 GB/s × 3.55 FLOP/Byte ≈ 182 GFLOPS, that is, 51.2 ÷ 0.968 ≈ 53 tokens/s.
'''
# src:
# 
# 320 GFLOPS 取自 Intel 的 APP Metrics for Intel Microprocessors（Intel Core Processors，Revision 8，2026 年 1 月 6 日），这份文档为出口合规列出每个型号的 GFLOPS。
# 51.2 GB/s 取自 Intel 产品规格页中 i9-11900H 的 Max Memory Bandwidth 一项，内存规格为双通道、最高 3200 MT/s。
# 算术强度 I 是计算量与访存量之比（第二讲），1 次乘加计 2 次运算。I 低于平衡点的程序处于访存受限区，速率上限是 B × I；高于平衡点的程序处于算力受限区，上限是 P。
# 这份文档的 GFLOPS 按 64 位浮点运算计数。本讲沿用第二讲的约定，各种数据类型的乘加都按 1 次乘加 2 次运算计数。
# 平衡点是第二讲的名称，第二讲中 RTX 5090 的平衡点约为 117 FLOP/Byte。
# 图中的空心圆是 Qwen3-VL-2B 语言模型的带宽上限：算术强度 3.44 ÷ 0.968 ≈ 3.55 FLOP/Byte，51.2 GB/s × 3.55 FLOP/Byte ≈ 182 GFLOPS，即 51.2 ÷ 0.968 ≈ 53 Token/s。


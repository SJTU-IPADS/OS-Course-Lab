# src: 异构并行：从 CPU 向量化到 GPU SIMT 执行模型

['simt.slide.1']
src_hash = 'bc3b2a87'
text = '''
**The different microarchitectural design philosophies of CPUs and GPUs**:
- **CPU cores**: most of the chip area goes to complex out-of-order control logic, branch predictors and multi-level caches (SRAM), to reduce the execution latency of a single thread;
- **GPU cores**: most of the chip area goes directly to large numbers of parallel arithmetic logic units (ALUs), for high throughput on large-scale data parallelism.
'''
# src:
# 
# **CPU 与 GPU 的微架构设计哲学分歧**：
# - **CPU 核心**：芯片面积多分配给复杂乱序控制逻辑、分支预测器和多级缓存（SRAM），以降低单线程执行延迟；
# - **GPU 核心**：芯片面积多直接分配给大量并行的算术逻辑单元（ALU），以追求大规模数据并行的高吞吐量。

['simt.notes.1']
src_hash = '62269a52'
text = 'From CPU SIMD to the GPU SIMT (single instruction, multiple threads) architecture and the execution model of heterogeneous computing.'
# src: 从 CPU SIMD 走向 GPU SIMT（单指令多线程）体系结构与异构计算执行模型。

['simt-2.title']
src_hash = '79ce9748'
text = 'Heterogeneous parallelism: from CPU vectorization to the GPU SIMT execution model'
# src: 异构并行：从 CPU 向量化到 GPU SIMT 执行模型

['simt-2.slide.1']
src_hash = '2df0928d'
text = '''
**The GPU SIMT (Single Instruction, Multiple Threads) execution model**:
- **Thread**: the most basic unit of execution;
- **Thread Block**: a group of threads that share on-chip shared memory;
- **Grid**: the whole set of threads of a kernel launch;
- **Warp (32 threads)**: the smallest unit the GPU hardware schedules; its 32 threads execute the same instruction in lockstep.

**Branch divergence**:
- If the 32 threads of one warp take different paths in a branch, the hardware can only execute all the branch paths serially, which lowers performance.
'''
# src:
# 
# **GPU SIMT（Single Instruction, Multiple Threads）执行模型**：
# - **Thread（线程）**：最基本执行单元；
# - **Thread Block（线程块）**：共享片上共享内存的一组线程；
# - **Grid（网格）**：整个 Kernel 启动时的全部线程网格集合；
# - **Warp（线程束，32 个线程）**：GPU 硬件调度的最小单元，32 个线程锁步执行相同指令。
# 
# **分支分化（Branch Divergence）**：
# - 若同一个 Warp 内的 32 个线程在分支结构中走向不同路径，硬件只能串行化执行所有分支路径，导致性能下降。


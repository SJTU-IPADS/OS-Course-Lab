text = '**The core code again**:'
# src:
# 
# **回顾核心代码**：

['loop-need.slide.2']
src_hash = '192bc74d'
text = '''
**Sequential execution**: the program counter (PC, that is `%rip`) holds the address of the next instruction to fetch. The CPU fetches the instruction at that address and executes it, and at the same time adds the length of this instruction to `%rip`, so the next fetch starts at the instruction that immediately follows:
$$\%rip \leftarrow \%rip + \text{instruction length}$$
'''
# src:
# 
# **顺序执行**：程序计数器（PC，即 `%rip`）存放下一条要取出的指令的地址。CPU 从该地址取出指令并执行，同时把 `%rip` 加上这条指令的长度，下一次取指因此从紧接着的那条指令开始：
# $$\%rip \leftarrow \%rip + \text{指令长度}$$

['loop-need.notes.1']
src_hash = 'e82bee73'
text = '''
Part 2 introduces control flow through the loop. First, sequential execution: the CPU increments %rip as it executes each instruction, and the program contains no instruction for this.
The figure shows the positions in memory of the 7 instructions of the loop body of dot_product (gcc -Og); the addresses and lengths come from objdump -d dot.o. Fetching in order of increasing address, the execution flow only advances to higher addresses.
'''
# src:
# 
# 第二部分从循环引入控制流。先说明顺序执行：%rip 的递增由 CPU 在执行每条指令时完成，程序中没有对应的指令。
# 图中是 dot_product（gcc -Og）循环体的 7 条指令在内存中的位置，地址与长度来自 objdump -d dot.o。按地址递增依次取指，执行流只会前进到更高的地址。

['loop-need-2.title']
src_hash = '8aaee2a3'
text = 'The vector dot product and control flow'
# src: 向量内积和控制流

['loop-need-2.slide.1']
src_hash = '3e643934'
text = '''
**With sequential execution only**: three instructions complete one multiply-add, and the execution flow advances to the next instruction and never returns to these three instructions.
- Completing 4096 multiply-adds requires 4096 copies of the same three instructions, placed one after another in memory;
- The code length grows with $n$; a program whose $n$ is determined only at run time cannot be written this way.
'''
# src:
# 
# **只有顺序执行时**：三条指令完成一次乘加，执行流前进到下一条指令，不会回到这三条指令。
# - 完成 4096 次乘加，就要把同样的三条指令写 4096 份，一份接一份地放在内存中；
# - 代码长度随 $n$ 增长；$n$ 在运行时才确定的程序无法这样写出。

['loop-need-2.slide.2']
src_hash = '07958657'
text = '**The ability needed**: after one multiply-add has executed, bring `%rip` back to the start of this instruction sequence to execute it once more, and stop after it has executed $n$ times. An instruction that rewrites `%rip` is called a jump instruction.'
# src:
# 
# **需要的能力**：一次乘加执行完后，让 `%rip` 回到这段指令的开头再执行一次，并在执行了 $n$ 次之后停下来。改写 `%rip` 的指令称为跳转指令。

['loop-need-2.notes.1']
src_hash = '48a66668'
text = '''
The code block at the top of the page is the single multiply-add of Part 1: the C code on the left and its three instructions on the right; %rdi holds w, %rsi holds x and %edx holds sum.
The hidden dimension of one LLM (Qwen3-8B) is 4096, so one vector dot product performs 4096 multiply-adds.
Code unrolled into 4096 copies can be written out, but n is a parameter of dot_product and is known only at the call, so the number of copies cannot be determined at compile time.
'''

**Naming rules for vector instruction mnemonics**:
- `v` prefix: a vector extension instruction with the VEX encoding;
- `p` marker: Packed (packed vector integer data);
- Operation name: such as `add` (addition), `mul` (multiplication), `xor` (exclusive or);
- Element width suffix:
  - `b` (byte, 8-bit integer); `w` (word, 16-bit integer);
  - `d` (doubleword, 32-bit integer); `q` (quadword, 64-bit integer).
- Example: `vpmulld` = Vector Packed Multiply Low Doubleword (keeps the low 32 bits of the product).
'''

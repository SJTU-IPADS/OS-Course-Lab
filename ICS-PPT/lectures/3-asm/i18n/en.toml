['intrinsics.slide.2']
src_hash = '3d727ea5'
text = '''
**Correspondence between intrinsics and assembly instructions**:
- The `__m256i` data type $\longleftrightarrow$ a 256-bit YMM vector register in hardware;
- `_mm256_loadu_si256` $\longleftrightarrow$ the unaligned vector load instruction `vmovdqu`;
- `_mm256_mullo_epi32` $\longleftrightarrow$ the parallel low-doubleword multiply instruction `vpmulld`;
- `_mm256_add_epi32` $\longleftrightarrow$ the parallel doubleword add instruction `vpaddd`.
'''
# src:
# 
# **Intrinsics 与汇编指令的对应关系**：
# - `__m256i` 数据类型 $\longleftrightarrow$ 硬件 256 位 YMM 向量寄存器；
# - `_mm256_loadu_si256` $\longleftrightarrow$ `vmovdqu` 向量非对齐加载指令；
# - `_mm256_mullo_epi32` $\longleftrightarrow$ `vpmulld` 并行低位双字乘法指令；
# - `_mm256_add_epi32` $\longleftrightarrow$ `vpaddd` 并行双字累加指令。

['intrinsics.notes.1']
src_hash = 'e3885fd8'
text = '''
Intrinsics are built-in functions that the compiler provides in <immintrin.h>; they are written like C function calls and usually correspond to specific vector instructions at compile time.
The source is taken from dot_product_avx2 in examples/dot_intrin.c. This function carries __attribute__((target("avx2"))), so only it uses the AVX2 instructions and compiling needs no -mavx2; main selects the version with __builtin_cpu_supports("avx2"), and machines without AVX2 execute the scalar version. To compile and run: cd examples; gcc -O2 dot_intrin.c -o dot_intrin; ./dot_intrin, which prints the two lines avx2 3182690 and check 3182690; the check line is the result of the scalar loop.
The vpxor that _mm256_setzero_si256 corresponds to writes %xmm1: an instruction with a VEX prefix that writes a 128-bit register clears the upper 128 bits of the YMM register of the same name, so all 256 bits of %ymm1 are 0.
The loop condition i <= n - 8 gives every pass 8 complete elements. After the loop, sum_lanes adds up the 8 sums in vsum; when n is not a multiple of 8, the remaining n % 8 elements are handled by scalar_tail.
scalar_tail is an ordinary C loop that processes one element at a time from index n / 8 * 8 on, and compiles to scalar instructions only (movl, imull, addl). It carries the noinline attribute and stays a function of its own; once inlined into dot_product_avx2, gcc would vectorize this loop as well. Both functions are defined in examples/dot_intrin.c, and scalar_tail returns 0 when n is a multiple of 8.
'''
# src:
# 
# Intrinsics 是编译器在 <immintrin.h> 中提供的内建函数，写法与 C 函数调用相同，编译时通常对应特定的向量指令。
# 源码取自 examples/dot_intrin.c 的 dot_product_avx2。这个函数带有 __attribute__((target("avx2")))，只有它使用 AVX2 指令，编译时不需要 -mavx2；main 用 __builtin_cpu_supports("avx2") 选择版本，不支持 AVX2 的机器执行标量版本。编译运行：cd examples; gcc -O2 dot_intrin.c -o dot_intrin; ./dot_intrin，输出 avx2 3182690 与 check 3182690 两行，check 一行是标量循环的结果。
# _mm256_setzero_si256 对应的 vpxor 写的是 %xmm1：带 VEX 前缀的指令写 128 位寄存器时把同名 YMM 寄存器的高 128 位清零，%ymm1 的 256 位因此全部为 0。
# 循环条件 i <= n - 8 使每一轮都有完整的 8 个元素。循环结束后，sum_lanes 把 vsum 中的 8 个累加和相加；n 不是 8 的倍数时，剩余的 n % 8 个元素由 scalar_tail 处理。
# scalar_tail 是一个普通的 C 循环，从下标 n / 8 * 8 起每次处理一个元素，编译后只有标量指令（movl、imull、addl）。它带有 noinline 属性，保持为单独的函数；被内联进 dot_product_avx2 之后，gcc 会把这个循环也向量化。两个函数的定义都在 examples/dot_intrin.c 中，n 是 8 的倍数时 scalar_tail 返回 0。


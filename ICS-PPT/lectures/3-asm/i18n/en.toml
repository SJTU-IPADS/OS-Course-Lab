['cuda-2.title']
src_hash = '8db5ee48'
text = 'GPU programming: a CUDA dot-product operator and reduction in shared memory'
# src: GPU 编程：CUDA 向量内积算子与共享内存规约

['cuda-2.slide.1']
src_hash = 'd38bb704'
text = '''
**Mapping the concepts: one idea**:
- Each CUDA thread computes only one multiplication; there is no scalar loop;
- The halving accumulation in shared memory follows the same idea as the halving horizontal reduction of CPU vectors.

**Data transfer cost in a heterogeneous system**:
- The GPU has high compute throughput, but the data must be copied over the PCIe bus from the host (CPU memory) to the device (GPU memory);
- If every dot product copied data between the host and the device, the copying time would exceed the computation time.
'''
# src:
# 
# **概念映射与思想统一**：
# - 每个 CUDA 线程只算一次乘法，没有标量循环；
# - 共享内存折半累加过程与 CPU 向量水平折半规约思想一致。
# 
# **异构系统数据传输开销**：
# - GPU 算力高，但数据必须经由 PCIe 总线从主机（CPU 内存）拷贝到设备（GPU 显存）；
# - 若每次内积都进行主机与设备间的数据拷贝，拷贝时间将超过计算时间。


['type-neutral.title']
src_hash = 'd0d22365'
text = 'Type neutrality: machine-level instructions carry no types'
# src: 类型中立：机器级指令不携带类型的特征

['type-neutral.slide.1']
src_hash = '5ad231ea'
text = '''
**Type neutrality of the ALU hardware**:
- The CPU contains only one set of plain binary full adders and multipliers;
- Whether a variable is declared `int` (signed two's complement) or `unsigned int` (unsigned binary encoding) in the high-level language, the underlying binary bit operations are the same;
- The compiler generates `addl` and `subl` in both cases, and the instructions themselves do not distinguish signed from unsigned.

**Types take effect later**:
- The hardware does not decide at the moment of the operation whether a variable is signed or unsigned;
- While producing the result, an arithmetic operation sets both the unsigned carry flag (CF) and the signed overflow flag (OF);
- **The real difference between the types lies in which conditional jump instruction is chosen afterwards** (for example `jl`, which jumps on the signed flags, or `jb`, which jumps on the unsigned flag).
'''
# src:
# 
# **ALU 硬件的类型中立性**：
# - CPU 内部只有一套纯粹的二进制全加器与乘法器；
# - 无论高级语言中声明的是 `int`（有符号补码）还是 `unsigned int`（无符号二进制编码），底层的二进制位运算规则相同；
# - 编译器生成的指令都是 `addl` 与 `subl`，指令本身不区分有符号或无符号。
# 
# **类型的延后体现**：
# - 变量究竟是有符号还是无符号，硬件并不在运算这一刻决定；
# - 算术运算在生成结果的同时，同步设置无符号进位标志（CF）与有符号溢出标志（OF）；
# - **类型的真正差异体现在后续选用哪一条条件跳转指令**（例如根据有符号标志跳转 `jl` 还是根据无符号标志跳转 `jb`）。

['type-neutral.notes.1']
src_hash = 'aaafbf0a'
text = 'Assembly language and the hardware are untyped at the level of arithmetic; the difference between types is deferred to the conditional jumps that follow.'

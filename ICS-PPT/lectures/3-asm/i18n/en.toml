['compile-mapping.title']
src_hash = '18d80486'
text = 'Compilation: from C source to binary machine instructions'
# src: 编译：从 C 源码到二进制机器指令

['compile-mapping.slide.1']
src_hash = '3603af5d'
text = '''
**The central operator of this lecture**:
- A mathematical operator of LLM computation: the vector dot product `dot_product`. How can this code be executed by the CPU?

**Three representations of the same code**:
1. **High-level language (C)**: control structures and symbolic variables, an abstraction for the programmer.
2. **Assembly instructions**: disassembled with `objdump -d` or generated directly by `gcc -S`; they correspond to the machine code.
3. **Object code**: the purely binary object file (ELF) produced by `gcc -c`; viewed with `hexdump` / `xxd`, it appears as a stream of hexadecimal machine bytes.
'''
# src:
# 
# **本节主线算子**：
# - 大模型计算的数学算子：向量内积 `dot_product`，这段代码如何才能被 CPU 执行？
# 
# **同一段代码的三种表示**：
# 1. **高级语言（C）**：面向程序员的控制结构与变量符号抽象。
# 2. **汇编指令（Assembly）**：通过 `objdump -d` 反汇编或 `gcc -S` 直接生成，与机器码对应。
# 3. **目标机器码（Object Code）**：经 `gcc -c` 生成的纯二进制目标文件（ELF），通过 `hexdump` / `xxd` 观察，呈现为十六进制机器字节流。


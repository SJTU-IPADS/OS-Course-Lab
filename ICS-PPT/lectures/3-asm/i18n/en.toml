['call-ret.slide.1']
src_hash = '44072f2a'
text = '''
**`call Label`** is equivalent to a `pushq` of the return address followed by `jmp Label`:
1. Subtract 8 from `%rsp` and write the address of the instruction after `call` to where `%rsp` points;
2. Write the address of `Label` into `%rip`.

**`ret`** is equivalent to a `popq` of the top of the stack into `%rip`:
1. Read the 8 bytes `%rsp` points to and add 8 to `%rsp`;
2. Write the address read into `%rip`.

**`call *Operand`** is an indirect call: the target address is read from a register or from memory, for example `call *%rax`.
'''
# src:
# 
# **`call Label`** 相当于 `pushq` 返回地址，再 `jmp Label`：
# 1. `%rsp` 减 8，把 `call` 的下一条指令的地址写入 `%rsp` 所指处；
# 2. 把 `Label` 的地址写入 `%rip`。
# 
# **`ret`** 相当于把栈顶 `popq` 到 `%rip`：
# 1. 读出 `%rsp` 所指的 8 个字节，`%rsp` 加 8；
# 2. 把读出的地址写入 `%rip`。
# 
# **`call *Operand`** 是间接调用：目标地址从寄存器或内存中读出，例如 `call *%rax`。

['call-ret.notes.1']
src_hash = '3647b6b3'
text = '''
The addresses in the figure on the left are taken from the executable linked from main.c and dot.c: the call in main is at 0x401156, the next instruction addq $40, %rsp is at 0x40115b, dot_product starts at 0x401160, and its ret is at 0x401199.
Three moments: ① before call executes; ② after call, the return address 0x40115b occupies the 8 bytes at the top of the stack and %rip points to the entry of dot_product; ③ after ret, the return address has been popped and %rip is back at 0x40115b.
An indirect call is written the same way as an indirect jump. In C, a call through a function pointer compiles to an indirect call.
'''
# src:
# 
# 左图的地址取自 main.c 与 dot.c 链接成的可执行文件：main 中的 call 位于 0x401156，下一条指令 addq $40, %rsp 位于 0x40115b，dot_product 从 0x401160 开始，它的 ret 位于 0x401199。
# 三个时刻：① 执行 call 之前；② call 之后，返回地址 0x40115b 占栈顶的 8 字节，%rip 指向 dot_product 的入口；③ ret 之后，返回地址已弹出，%rip 回到 0x40115b。
# 间接调用的写法与间接跳转相同。C 语言通过函数指针的调用编译为间接调用。


['width-write.slide.1']
src_hash = '60662243'
text = '''
**Hardware rules for writing sub-registers of different widths**:
1. **Writing a 32-bit sub-register (such as `%eax`, `%r8d`)**:
   - **Hardware behavior**: while writing the low 32 bits, the CPU **automatically clears all of the upper 32 bits**.
   - Example: if `%rax` was `0xFFFFFFFFFFFFFFFF`, after `movl $1, %eax` executes, the value of `%rax` becomes `0x0000000000000001`.
2. **Writing an 8-bit or 16-bit sub-register (such as `%al`, `%ax`)**:
   - **Hardware behavior**: the CPU changes only the low 8 or 16 bits of the target, and **all the remaining upper bits keep their original values**.
   - Example: if `%rax` was `0xFFFFFFFFFFFFFFFF`, after `movb $1, %al` executes, the value of `%rax` becomes `0xFFFFFFFFFFFFFF01`.
'''
# src:
# 
# **写入不同子寄存器的硬件行为规则**：
# 1. **写 32 位子寄存器（如 `%eax`, `%r8d`）**：
#    - **硬件行为**：CPU 在写入低 32 位的同时，**自动将高 32 位全部清零**。
#    - 例如：若 `%rax` 原为 `0xFFFFFFFFFFFFFFFF`，执行 `movl $1, %eax` 后，`%rax` 的值变为 `0x0000000000000001`。
# 2. **写 8 位或 16 位子寄存器（如 `%al`, `%ax`）**：
#    - **硬件行为**：CPU 只改变目标所在的低 8 位或低 16 位，**高位剩余的所有比特保留原值不变**。
#    - 例如：若 `%rax` 原为 `0xFFFFFFFFFFFFFFFF`，执行 `movb $1, %al` 后，`%rax` 的值变为 `0xFFFFFFFFFFFFFF01`。


src_hash = 'e54caff8'
text = 'Function calls: how main calls dot_product'
# src: 函数调用：main 如何调用 dot_product

['procedure-need.slide.1']
src_hash = 'bbb9d8b5'
text = '''
**Covered so far**: execution inside one function. Data movement and arithmetic instructions perform one multiply-add, the flags and jump instructions implement a loop, and the loop of `dot_product` consists of these instructions.

**The new problem**: how execution crosses two functions. When `main` reaches `dot_product(w, x, 4)`, the CPU goes on to execute the instructions of `dot_product`; when `dot_product` finishes, the CPU returns to `main` and continues.

**Two terms**: the function that makes the call is the **caller**, and the function that is called is the **callee**. In this call `main` is the caller and `dot_product` is the callee.
'''
# src:
# 
# **已经学过的**：一个函数内部的执行。数据传送与算术指令完成一次乘加，标志位与跳转指令实现循环，`dot_product` 的循环由这些指令组成。
# 
# **新的问题**：执行如何跨越两个函数。`main` 执行到 `dot_product(w, x, 4)` 时，CPU 转去执行 `dot_product` 的指令；`dot_product` 执行完毕后，CPU 回到 `main` 继续执行。
# 
# **两个术语**：发起调用的函数称为**调用者（caller）**，被调用的函数称为**被调用者（callee）**。这次调用中 `main` 是调用者，`dot_product` 是被调用者。

['procedure-need.notes.1']
src_hash = 'fdfd5b21'
text = '''
The example of Part 3 is main calling dot_product. The first two parts cover the instructions inside one function; this part covers how two functions work together.
CS:APP calls a function a procedure and uses the same terms caller and callee.
'''
# src:
# 
# 第三部分的例子是 main 调用 dot_product。前两部分讲的是一个函数内部的指令，这一部分讲两个函数之间的配合。
# CS:APP 把函数称为过程（procedure），调用者与被调用者的说法相同。

['call-vs-jump.title']
src_hash = 'c990cda1'
text = 'Function calls and jumps: similarities and differences'
# src: 函数调用与跳转的相同点与不同点

['call-vs-jump.slide.1']
src_hash = '1aefca85'
text = '''
**Similarity**: a call transfers control from the instructions of `main` to the first instruction of `dot_product`. This is an unconditional jump, and `jmp dot_product` can do it.

**Differences**: a call must also do four things, none of which a jump instruction does:
1. **Return**: when `dot_product` finishes, control returns to the instruction after the call site in `main`;
2. **Passing data**: `main` hands the arguments `w`, `x` and `4` to `dot_product`, and `dot_product` hands the return value to `main`;
3. **Registers**: the two functions use the same set of 16 registers, and a value `main` keeps in a register may be overwritten by `dot_product`;
4. **Local variables**: the arrays `w` and `x` of `main` keep their values during the call, and `sum` and `i` of `dot_product` exist only during this call.
'''
# src:
# 
# **相同点**：调用把执行流从 `main` 的指令转移到 `dot_product` 的第一条指令。这是一次无条件跳转，`jmp dot_product` 就能做到。
# 
# **不同点**：一次调用还要完成四件事，跳转指令都不做：
# 1. **返回**：`dot_product` 执行完毕后，执行流回到 `main` 中调用点的下一条指令；
# 2. **传递数据**：`main` 把参数 `w`、`x`、`4` 交给 `dot_product`，`dot_product` 把返回值交给 `main`；
# 3. **寄存器**：两个函数使用同一组 16 个寄存器，`main` 放在寄存器中的值可能被 `dot_product` 改写；
# 4. **局部变量**：`main` 的数组 `w` 与 `x` 在调用期间保持原值，`dot_product` 的 `sum` 与 `i` 只在这次调用期间存在。


**`dot_product_rec` computes the dot product by recursion**, and `main` calls `dot_product_rec(w, x, 4)`:
1. Counting from this call in `main`, how many times is `dot_product_rec` called in all?
2. While the call with `n` equal to 0 executes, how many return addresses of these calls are on the stack? Which function does each of them return to?
3. After the recursive call returns, `w[n - 1] * x[n - 1]` still has to be computed. During the recursive call, in which class of register should `w`, `x` and `n` be kept? What does each call therefore have to save on the stack?
4. Does implementing recursion need any mechanism beyond `call`, `ret`, the register usage convention and stack frames?
'''

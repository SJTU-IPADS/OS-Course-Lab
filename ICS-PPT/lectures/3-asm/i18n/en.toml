# 
# 页面上方的代码块是第一部分的单次乘加：左边是 C 代码，右边是它对应的三条指令，%rdi 保存 w，%rsi 保存 x，%edx 保存 sum。
# 某大模型（Qwen3-8B）的隐藏层维度是 4096，一次向量内积要做 4096 次乘加。
# 展开 4096 份的代码可以写出，但 n 是 dot_product 的参数，调用时才知道，展开的份数无法在编译时确定。


['disasm-exercise-2.slide.2']
src_hash = 'ce2fd06b'
text = '''
- `8b 06`: `movl B, R`. mm is 00, so B is a memory operand whose address is in register 110, `%rsi`; R is register 000, `%eax`;
- `0f af 07`: `imull B, R`, with a 2-byte opcode. B is `(%rdi)` and R is `%eax`;
- `01 d0`: `addl R, B`. mm is 11, so B is register 000, `%eax`; R is register 010, `%edx`;
- `c3`: `ret`, with no operand byte.
'''

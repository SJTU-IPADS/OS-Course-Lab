['return-address.title']
src_hash = '6e04b99b'
text = 'Function calls: the jmp instruction cannot support a dynamic return'
# src: 函数调用：jmp 指令无法支持动态返回

['return-address.slide.1']
src_hash = '03e3ca59'
text = '''
**Why `jmp` alone is not enough**:
- The target address of `jmp` is fixed in the instruction.
- A function is called by callers at different places in the program (for example call site A at `0x4010` and call site B at `0x4080`).
- When the function finishes, the hardware cannot determine the return address to jump to from a `jmp` whose operand is fixed.

**Hardware mechanism**:
- When a call happens, the address of the instruction after the call site (the return address) must be saved dynamically;
- Each call has its own return address, so the return address is also part of the local state of a function call.
'''
# src:
# 
# **为什么不能只用 `jmp`**：
# - `jmp` 的目标地址在指令中是固定的。
# - 函数会被程序中不同位置的调用者调用（例如调用点 A `0x4010`、调用点 B `0x4080`）。
# - 函数执行完毕时，硬件无法仅凭固定操作数的 `jmp` 确定应跳转的目标返回地址。
# 
# **硬件机制**：
# - 调用发生时必须动态保存调用点下一条指令的地址（返回地址 Return Address）；
# - 返回地址每次调用各有一份，因此也属于一次函数调用的局部状态。


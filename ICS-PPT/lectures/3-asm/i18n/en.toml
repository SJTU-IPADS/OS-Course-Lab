['call-emulate.slide.3']
src_hash = 'b83b8969'
text = '''
- The call takes 3 instructions and 13 bytes, the return takes 2 instructions and 3 bytes, and each occupies one register;
- The return address is the address of the next instruction. The CPU already computes it during sequential execution (`%rip` plus the instruction length), and the program computes it again with `leaq`.

**x86-64 provides one instruction for each of the two**: `call dot_product` takes 5 bytes, `ret` takes 1 byte, and neither occupies a general-purpose register.
'''
# src:
# 
# - 调用用 3 条指令共 13 字节，返回用 2 条指令共 3 字节，各占用一个寄存器；
# - 返回地址是下一条指令的地址，CPU 顺序执行时已经在计算它（`%rip` 加指令长度），程序用 `leaq` 又计算了一遍。
# 
# **x86-64 为这两件事各提供一条指令**：`call dot_product` 占 5 字节，`ret` 占 1 字节，都不占用通用寄存器。

['call-emulate.notes.1']
src_hash = '2e5590bd'
text = '''
.Lnext(%rip) is the PC-relative addressing of Part 1; leaq computes the address of the label .Lnext, that is, the address of the instruction after the jmp.
The byte counts come from the assembler output: leaq 7 bytes, pushq %rax 1 byte, jmp dot_product 5 bytes; popq %rcx 1 byte, jmp *%rcx 2 bytes.
With call and ret the CPU performs these two groups of actions directly. The CPU also predicts the return address from the pairing of call and ret, which Lecture 4 explains.
'''
# src:
# 
# .Lnext(%rip) 是第一部分的 PC 相对寻址，leaq 算出标号 .Lnext 的地址，即 jmp 之后那条指令的地址。
# 字节数来自汇编器的输出：leaq 7 字节，pushq %rax 1 字节，jmp dot_product 5 字节；popq %rcx 1 字节，jmp *%rcx 2 字节。
# call 与 ret 由 CPU 直接完成这两组动作。CPU 还按 call 与 ret 的配对预测返回地址，第四讲说明。


src_hash = '2b6a9918'
text = '''
**Rewriting rule**: `for (init; test; update) body` is equivalent to `init; while (test) { body; update; }` (when the loop body contains no `continue`):
- `init` (`int i = 0`) executes once before the loop is entered;
- `test` (`i < n`) is evaluated before each iteration of the body, including before the first one;
- `update` (`i++`) executes after each iteration of the body.

Machine-level translation therefore only has to handle two kinds of loop, do-while and while; the for loop in dot.c is translated as a while loop.
'''
# src:
# 
# **改写规则**：`for (init; test; update) body` 等价于 `init; while (test) { body; update; }`（循环体不含 `continue` 时成立）：
# - `init`（`int i = 0`）在进入循环前执行一次；
# - `test`（`i < n`）在每轮循环体之前判断，第一轮之前也判断；
# - `update`（`i++`）在每轮循环体之后执行。
# 
# 机器级翻译因此只需处理 do-while 与 while 两种循环；dot.c 中的 for 循环按 while 循环翻译。


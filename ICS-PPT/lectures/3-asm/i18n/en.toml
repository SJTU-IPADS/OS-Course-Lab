- **mini-ollama**: a C program that reads the same model file and restores, multiplies and accumulates each weight on its own;
- On 1 thread each: the operation rate of ollama is close to the compute limit of one core, and that of mini-ollama is 1/15 of this limit.
'''
# src:
# 
# - **mini-ollama**：读取同一个模型文件的 C 程序，每个权重单独还原、相乘、累加；

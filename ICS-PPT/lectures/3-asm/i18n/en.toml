text = '''
- **Measured**: 0.77 Token/s, 70% of this limit;
- **ollama** needs about 0.69 instructions per multiply-add; the counts differ by a factor of 14.5 and the measured speeds by a factor of 14.

**Conclusion**: this limit comes from the clock of the CPU: the clock frequency is the number of cycles per second, and at most 5 instructions start to execute in each cycle, so the number of instructions that can be executed per second has a limit, whatever the instructions do. The difference in speed between the two programs comes mainly from the number of instructions per multiply-add; reducing this number can raise the operation rate.
'''
# src:
# 
# - **实测** 0.77 Token/s，是这个上限的 70%；
# - **ollama** 每次乘加约 0.69 条指令，条数相差 14.5 倍，实测速度相差 14 倍。
# 
# **结论**：这个上限来自 CPU 的时钟：主频是每秒的周期数，每个周期最多有 5 条指令开始执行，每秒能执行的指令条数因此有上限，与指令的功能无关。两个程序的速度差距主要来自每次乘加的指令条数，减少条数可以提高运算速率。

['insn-mix.notes.1']
src_hash = 'e199c81a'
text = '''
The loop in the table is the inner loop of matvec, taken from objdump -d mini-ollama and generated by gcc -O2 -fno-tree-vectorize: 20 instructions, 79 bytes. Each iteration processes 1 byte of weights and completes 2 multiply-adds, an average of 10 instructions per multiply-add.
4 instructions perform the multiplications and the accumulation: 2 mulss each read 1 activation from memory and multiply, and 2 addss accumulate. The other 16 read the weights (1), extract the two 4-bit stored values (6), convert them to float and multiply them by the scale factor d (6), and control the loop (3).
At most 5 instructions start to execute in a core per cycle. An instruction takes 1 or several cycles from the start of its execution to its result (mulss takes 4 cycles), and the executions of several instructions overlap. A core contains several sets of arithmetic units and can process several mutually independent instructions at the same time; the page "Superscalar" in part 6 of lecture 4 covers this.
With 5 instructions per cycle and 10 instructions per multiply-add, at most 0.5 multiply-adds complete per cycle, that is, each iteration needs at least 4 cycles. cmp and jne are fused into 1 inside the core; counted as 19 instructions, each iteration needs at least 3.8 cycles, and the page estimates with 20.
The clock frequency of about 3.8 GHz was read from scaling_cur_freq under /sys while mini-ollama was running. 1.9 × 10⁹ multiply-adds per second is 3.8 GFLOPS; divided by the 1.72 × 10⁹ multiply-adds of one token it gives 1.1 Token/s.
A clock cycle is the unit of time in which the circuits inside a CPU work in step; at 3.8 GHz one cycle is about 0.26 nanoseconds. A core executes at most 5 × 3.8 × 10⁹ = 1.9 × 10¹⁰ instructions per second, and this number does not depend on what the instructions do: the shr and and that extract a 4-bit weight count as 1 each, as does the mulss that multiplies. Of the 10 instructions mini-ollama spends on one multiply-add, 8 read the weights, restore the float weights and control the loop.
Raising the clock frequency is limited by circuit delay and power, so raising the operation rate relies on fewer instructions per multiply-add and on more cores.
This estimate counts instructions only and gives an upper limit. The dependences between instructions (the addss that accumulates sum takes 4 cycles, and the accumulation of the next iteration can start only when it has finished), the number of arithmetic units and the latency of reading memory all make the actual speed lower; on this microarchitecture cvtsi2ss is split into 2 micro-operations, so the actual count is also more than 20. The measured 0.77 Token/s (matvec rate 2.64 GFLOPS) is 70% of the limit; the share of each cause was not measured one by one.
The main loop of ggml_vec_dot_q4_0_q8_0 in ollama (icelake build) executes 22 instructions for 32 multiply-adds per iteration, an average of 22 ÷ 32 ≈ 0.69 instructions per multiply-add. 10 ÷ 0.69 ≈ 14.5, and the measured generation speeds give 10.7 ÷ 0.77 ≈ 14.
'''
# src:
# 
# 表中的循环取自 objdump -d mini-ollama 中 matvec 的内层循环，由 gcc -O2 -fno-tree-vectorize 生成，共 20 条指令、79 字节，每轮处理 1 字节权重，完成 2 次乘加，平均每次乘加 10 条。
# 完成乘法与累加的是 4 条：2 条 mulss 各从内存读取 1 个激活值并相乘，2 条 addss 累加。其余 16 条读取权重（1 条）、拆出两个 4 位存储值（6 条）、把它们转换为 float 并乘以缩放因子 d（6 条）、控制循环（3 条）。
# 核心每个周期最多有 5 条指令开始执行。一条指令从开始执行到得出结果需要 1 个或几个周期（mulss 需要 4 个周期），多条指令的执行过程相互重叠。核心内部有多套运算部件，可以同时处理多条互不依赖的指令，由第四讲第六部分的「超标量」一页讲解。
# 每个周期 5 条、每次乘加 10 条，每个周期至多完成 0.5 次乘加，即每轮循环至少 4 个周期。cmp 与 jne 在核心内部合并为 1 条，按 19 条计算每轮至少 3.8 个周期，页面按 20 条估算。
# 主频约 3.8 GHz 是运行 mini-ollama 时读取 /sys 下的 scaling_cur_freq 得到的。每秒 1.9 × 10⁹ 次乘加即 3.8 GFLOPS，除以每个 Token 的 1.72 × 10⁹ 次乘加得到 1.1 Token/s。
# 时钟周期是 CPU 内部电路同步工作的时间单位，主频 3.8 GHz 时一个周期约 0.26 纳秒。一个核心每秒至多执行 5 × 3.8 × 10⁹ = 1.9 × 10¹⁰ 条指令，这个数与指令的功能无关：拆出 4 位权重的 shr、and 与完成乘法的 mulss 各计 1 条。mini-ollama 每次乘加的 10 条指令中，8 条用于读取权重、还原为 float 权重与控制循环。
# 主频的提高受电路延迟与功耗限制，提高运算速率因此依靠减少每次乘加的指令条数与增加核心数。
# 这个估算只计指令条数，给出的是上限。指令之间的先后依赖（累加 sum 的 addss 需要 4 个周期，下一轮的累加在它完成后才能开始）、运算单元的数量、读取内存的延迟都会使实际速度低于它；cvtsi2ss 在这个微架构上分为 2 个微操作，实际计入的条数也多于 20。实测 0.77 Token/s（matvec rate 2.64 GFLOPS）是上限的 70%，各项原因所占的比例没有逐项测量。
# ollama 的 ggml_vec_dot_q4_0_q8_0（icelake 版本）主循环每轮 22 条指令完成 32 次乘加，平均每次乘加 22 ÷ 32 ≈ 0.69 条。10 ÷ 0.69 ≈ 14.5，实测生成速度 10.7 ÷ 0.77 ≈ 14。


# - 生成一个 Token 时，输入向量与每个权重矩阵各做一次矩阵向量乘 $y = Wx$，$y$ 的每个元素是 $W$ 的一行与 $x$ 的内积；
# - 每个权重参与 **1 次乘加**，并从内存读取 **1 次**。


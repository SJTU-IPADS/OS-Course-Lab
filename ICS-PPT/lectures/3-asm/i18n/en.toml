['return-address.title']
src_hash = '7c6b315c'
text = 'The return address: the address of the instruction after the call site'
# src: 返回地址：调用点下一条指令的地址

['return-address.slide.1']
src_hash = '90cbdf1f'
text = '''
**Returning to the caller**: when `dot_product` finishes, it jumps to the instruction after the call site.
- `dot_product` can be called from several places in a program, and the instruction after each call site has a different address;
- The target of `jmp` is written in the instruction and can be only one of them;
- The address of the instruction after the call site is therefore saved when the call happens, and the return jumps to the saved address. This address is called the **return address**.
'''
# src:
# 
# **回到调用者**：`dot_product` 执行完毕后跳到调用点的下一条指令。
# - `dot_product` 可以在程序的多处被调用，各个调用点的下一条指令地址不同；
# - `jmp` 的目标写在指令中，只能是其中一个；
# - 调用发生时因此要把调用点下一条指令的地址保存起来，返回时跳到保存的地址。这个地址称为**返回地址（Return Address）**。

['return-address.slide.2']
src_hash = '472dd0de'
text = '**Question**: where is the return address saved?'
# src:
# 
# **问题**：返回地址保存在哪里？

['return-address.notes.1']
src_hash = '346d3962'
text = '''
Entering dot_product can be done with an existing instruction: jmp dot_product writes the address of its first instruction into %rip. Returning to the caller is the new problem.
Call site A is in main and call site B is in another function; both call dot_product. Where dot_product returns to when it ends depends on who made this call and cannot be determined when dot_product is compiled.
The target of the jump on return is an address saved at run time; this is the indirect jump covered in Part 2.
'''
# src:
# 
# 进入 dot_product 用已有的指令就能做到：jmp dot_product 把它第一条指令的地址写入 %rip。回到调用者是新的问题。
# 调用点 A 在 main 中，调用点 B 在另一个函数中，两处都调用 dot_product。dot_product 结束时回到哪里由这一次是谁调用决定，编译 dot_product 时无法确定。
# 返回时跳转的目标是运行时保存下来的一个地址，这是第二部分讲过的间接跳转。

['runtime-stack.title']
src_hash = '25bca585'
text = 'The run-time stack: saving return addresses in last-in, first-out order'
# src: 运行时栈：按后进先出的顺序保存返回地址

['runtime-stack.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['runtime-stack.slide.1']
src_hash = '96417634'
text = '''
**Calls can nest**: `main` calls function `f`, and `f` in turn calls function `g`.
- Two return addresses must be kept at the same time: the address for returning to `main` is saved first, and the address for returning to `f` is saved second;
- `g` returns first and uses the address saved second. The order of saving and retrieving is last in, first out (LIFO).

**Run-time stack**: a region of memory in which data is stored and retrieved in last-in, first-out order.
- **Location**: at the high-address end of the process address space;
- **Stack pointer `%rsp`**: holds the address of the top of the stack, that is, the address of the data stored last on the stack;
- **Growth toward low addresses**: storing 8 bytes subtracts 8 from `%rsp`, and retrieving 8 bytes adds 8 to `%rsp`;
- The part at addresses not lower than `%rsp` is in use, and the part at addresses lower than `%rsp` is not yet in use.
'''
# src:
# 
# **调用可以嵌套**：`main` 调用函数 `f`，`f` 又调用函数 `g`。
# - 两个返回地址同时需要保存：回到 `main` 的地址先保存，回到 `f` 的地址后保存；
# - `g` 最先返回，用到的是后保存的那个地址。保存与取出的顺序是后进先出（LIFO）。
# 
# **运行时栈（Stack）**：按后进先出的顺序存取数据的一段内存。
# - **位置**：在进程地址空间的高地址一端；
# - **栈顶指针 `%rsp`**：保存栈顶的地址，即栈中最后存入的数据的地址；
# - **向低地址生长**：存入 8 字节时 `%rsp` 减 8，取出 8 字节时 `%rsp` 加 8；
# - 地址不低于 `%rsp` 的部分正在使用，地址低于 `%rsp` 的部分尚未使用。

['runtime-stack.notes.1']
src_hash = '600f5578'
text = '''
Return addresses are saved and retrieved in last-in, first-out order, so they are kept on a stack. The stack is a region of memory; %rsp is one of the 16 general-purpose registers and holds the address of the top of the stack.
The figure on the right is the address space of a process: the code segment holds instructions, the data segment holds global variables, the heap is allocated by malloc, and the stack is at the high-address end. The heap grows toward high addresses and the stack grows toward low addresses; the space between them is used by whichever of the two reaches it first.
This lecture uses the addresses in the figure as memory addresses; address translation is covered in a later lecture.
'''
# src:
# 
# 返回地址的保存与取出是后进先出的，因此放在栈中。栈是内存中的一段区域，%rsp 是 16 个通用寄存器之一，用来保存栈顶的地址。
# 右图是进程的地址空间：代码段存放指令，数据段存放全局变量，堆由 malloc 分配，栈在高地址一端。堆向高地址生长，栈向低地址生长，两者之间的空间由先用到的一方使用。
# 本讲把图中的地址当作内存地址使用，地址的翻译在后面的讲次说明。

['push-pop.title']
src_hash = '8c60d78b'
text = 'Stack instructions: pushq and popq'
# src: 栈操作指令：pushq 与 popq

['push-pop.slide.1']
src_hash = '2ce4b0cf'
text = '''
**`pushq S`**: stores the 8-byte `S` at the top of the stack.
1. Subtract 8 from `%rsp`;
2. Write `S` into the 8 bytes `%rsp` points to.

**`popq D`**: retrieves 8 bytes from the top of the stack and writes them to `D`.
1. Read the 8 bytes `%rsp` points to and write them to `D`;
2. Add 8 to `%rsp`.

**Operands, flags and equivalent instructions**:
- `S` can be a register, a memory operand or an immediate (32 bits, sign-extended to 64 bits); `D` can be a register or a memory operand;
- `pushq` and `popq` do not change the flags;
- Taking `%rbx` as the example: in its effect on `%rsp` and the stack, `pushq %rbx` is the same as the two instructions `subq $8, %rsp` and `movq %rbx, (%rsp)`, and `popq %rbx` is the same as the two instructions `movq (%rsp), %rbx` and `addq $8, %rsp`; `pushq %rbx` takes 1 byte, and the two equivalent instructions take 8 bytes in total.
'''
# src:
# 
# **`pushq S`**：把 8 字节的 `S` 存入栈顶。
# 1. `%rsp` 减 8；
# 2. 把 `S` 写入 `%rsp` 所指的 8 个字节。
# 
# **`popq D`**：从栈顶取出 8 字节，写入 `D`。
# 1. 读出 `%rsp` 所指的 8 个字节，写入 `D`；
# 2. `%rsp` 加 8。
# 
# **操作数、标志位与等效的指令**：
# - `S` 可以是寄存器、内存操作数或立即数（32 位，符号扩展为 64 位），`D` 可以是寄存器或内存操作数；
# - `pushq` 与 `popq` 不改变标志位；
# - 以 `%rbx` 为例：对 `%rsp` 与栈的效果，`pushq %rbx` 与 `subq $8, %rsp`、`movq %rbx, (%rsp)` 两条指令相同，`popq %rbx` 与 `movq (%rsp), %rbx`、`addq $8, %rsp` 两条指令相同；`pushq %rbx` 占 1 字节，等效的两条指令共 8 字节。

['push-pop.notes.1']
src_hash = 'f98910be'
text = '''
pushq and popq each perform two steps in one instruction: updating %rsp, and reading or writing the top of the stack. The x86-64 stack works in units of 8 bytes, and the operands of both instructions are 64 bits.
In the equivalent pairs of instructions, subq and addq set the flags; pushq and popq do not. For a memory operand there is no such pair of instructions: movq cannot have two memory operands.
When the operand is %rsp, pushq %rsp pushes the value %rsp had before 8 was subtracted.
The byte counts come from the assembler output: pushq %rbx is 53 and popq %rbx is 5b; subq $8, %rsp is 48 83 ec 08 and movq %rbx, (%rsp) is 48 89 1c 24.
'''
# src:
# 
# pushq 与 popq 各用一条指令完成两步：改写 %rsp，读写栈顶。x86-64 的栈以 8 字节为单位，两条指令的操作数都是 64 位。
# 等效的两条指令中 subq 与 addq 会设置标志位，pushq 与 popq 不会。操作数是内存操作数时没有这样的两条指令：movq 不能有两个内存操作数。
# 操作数是 %rsp 时，pushq %rsp 压入的是减 8 之前的值。
# 字节数来自汇编器的输出：pushq %rbx 是 53，popq %rbx 是 5b；subq $8, %rsp 是 48 83 ec 08，movq %rbx, (%rsp) 是 48 89 1c 24。

['push-pop-fig.title']
src_hash = '8c60d78b'
text = 'Stack instructions: pushq and popq'
# src: 栈操作指令：pushq 与 popq

['push-pop-fig.notes.1']
src_hash = '2be402a0'
text = '''
The left half shows the two steps of pushq: 8 is first subtracted from %rsp, then Src is written to the new top of the stack. The right half shows the two steps of popq: the 8 bytes at the top of the stack are read first, then 8 is added to %rsp.
After popq the original 8 bytes are still in memory; %rsp has moved past them, and these 8 bytes no longer belong to the part of the stack in use.
'''
# src:
# 
# 左半是 pushq 的两步：%rsp 先减 8，再把 Src 写入新的栈顶。右半是 popq 的两步：先读出栈顶的 8 个字节，%rsp 再加 8。
# popq 之后原来的 8 个字节仍在内存中，%rsp 已经越过它，这 8 个字节不再属于栈中正在使用的部分。


text = '**The vector operation of each loop pass**: $(s_7, \dots, s_1, s_0) \leftarrow (s_7, \dots, s_1, s_0) + (w_{i+7}\,x_{i+7}, \dots, w_{i+1}\,x_{i+1}, w_i\,x_i)$'
# src:
# 
# **每轮循环的向量运算**：$(s_7, \dots, s_1, s_0) \leftarrow (s_7, \dots, s_1, s_0) + (w_{i+7}\,x_{i+7}, \dots, w_{i+1}\,x_{i+1}, w_i\,x_i)$

['vector-arith-fig.notes.1']
src_hash = 'b30fb73f'
text = '''
The 8 components of the formula are computed at the same time: vpmulld produces 8 products, vpaddd adds them to the 8 running sums, and i grows by 8 each pass.
After the last pass the 8 running sums are added to give the dot product: s₀ + s₁ + … + s₇.
'''
# src:
# 
# 公式中的 8 个分量同时计算：vpmulld 得到 8 个乘积，vpaddd 把它们加到 8 个累加和上，i 每轮增加 8。
# 全部循环结束后，8 个累加和相加得到内积：s₀ + s₁ + … + s₇。


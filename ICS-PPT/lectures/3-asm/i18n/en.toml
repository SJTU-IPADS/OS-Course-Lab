- **The caller `main`**: before `call` it writes the address of `w` into `%rdi`, the address of `x` into `%rsi`, and `4` into `%edx`;
- **The callee `dot_product`**: reads its arguments from these three registers and puts `sum` in `%eax` before returning;
- The address of the array `w` is `%rsp` plus 16 and the address of `x` is `%rsp`, as the section "Local variables" explains.
'''

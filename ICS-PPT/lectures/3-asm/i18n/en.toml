['isa-contract.title']
src_hash = '48cfadfd'
text = 'Instruction set architecture'
# src: 指令集架构

['isa-contract.slide.1']
src_hash = '2dea0e24'
text = '''
Compiling a program yields binary machine code. To execute it, the CPU must recognize the instructions this binary represents, so a convention between binary encodings and CPU instructions is essential.

**Definition of the instruction set architecture (ISA)**:
- The ISA is the interface contract agreed between software and hardware circuits; it keeps strict backward compatibility over its long evolution.
- **The ISA includes the following**:
  - **Programmer-visible state**: the program counter (PC / `%rip`), 16 general-purpose registers, the condition code register (RFLAGS), and a contiguous virtual memory space;
  - **Instruction encoding and format**: the binary opcode of each machine instruction, the rules for encoding operands, and the instruction length;
  - **Supported data types and addressing modes**.
  - ...
'''
# src:
# 
# 程序编译之后得到的是二进制机器码。但 CPU 执行需要能够认识这段二进制所代表的指令，因此二进制编码与 CPU 指令之间的约定必不可少。
# 
# **指令集架构（ISA: Instruction Set Architecture）的定义**：
# - ISA 是软件与硬件电路之间达成的接口契约规范，在长期演进中保持严格的向后兼容性。
# - **ISA包括如下**：
#   - **程序员可见状态**：程序计数器（PC / `%rip`）、16 个通用寄存器、条件码寄存器（RFLAGS）、连续虚拟内存空间；
#   - **指令编码与格式**：每条机器指令的二进制操作码、操作数编码规则与指令长度；
#   - **支持的数据类型与寻址模式**。
#   - ...


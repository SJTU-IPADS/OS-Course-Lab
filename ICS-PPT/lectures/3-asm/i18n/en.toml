1. **The assembly-level detection instruction `cpuid`**:
   - A dedicated instruction the CPU provides for querying hardware information: write a function number to `%eax` and execute `cpuid`; specific bits of the returned registers (`%ebx, %ecx, %edx`) indicate whether features such as AVX, AVX2 and AVX512F are supported;
2. **Built-in interfaces at the C/C++ language level**:
'''

['visible-state-2.slide.1']
src_hash = 'e5fe73d9'
text = '''
**Why there are only 16 general-purpose registers**:
- **Limits of the instruction encoding fields**: the register field of an instruction has a limited number of bits. To name one register in a fixed-length field, 16 registers need only 4 bits ($2^4 = 16$); with thousands of registers, the instruction encoding would grow sharply;
- **Wiring and latency bottleneck in hardware**: too many registers increase the internal wiring and the multiplexer delay, which lowers the maximum operating frequency.
'''
# src:
# 
# **通用寄存器数量为什么只有 16 个**：
# - **指令编码字段限制**：指令中寄存器字段的位数有限，在定长字段中指定一个寄存器，16 个寄存器只需 4 位二进制（$2^4 = 16$），若扩展到上千个，指令编码将急剧膨胀；
# - **硬件布线与延迟瓶颈**：寄存器数量过多会导致内部走线与多路选择器延迟增大，降低最高工作频率。


text = '**The local variables of `main` in `main.c`**:'
# src:
# 
# **`main.c` 中 `main` 的局部变量**：

['local-state.slide.2']
src_hash = 'bdcaa030'
text = '''
**Storage requirements of local variables**:
- Array elements are accessed by address (`w[i]` is `*(w + i)`); registers have no addresses, so arrays can only be placed in memory;
- A local variable exists only during one call: it is allocated when the call starts and released when the call returns;
- Several calls of the same function can be active at the same time (for example in recursion), and each call needs its own copy of the local variables, so local variables cannot be allocated at fixed addresses.
'''
# src:
# 
# **局部变量的存储需求**：
# - 数组元素按地址访问（`w[i]` 即 `*(w + i)`），寄存器没有地址，数组只能放在内存中；
# - 局部变量只在一次调用期间存在：调用开始时分配，调用返回时释放；
# - 同一函数的多次调用可以同时处于活动状态（例如递归），每次调用需要各自的一份局部变量，因此局部变量不能分配在固定地址。

['local-state.notes.1']
src_hash = '266aa22d'
text = '''
Introduces the run-time stack and stack frames from the question of where local variables are stored.
A global variable is allocated at a fixed address in the data segment, and there is only one copy of it for the whole run of the program; each call has its own copy of the local variables.
'''
# src:
# 
# 从局部变量的存放位置引入运行时栈与栈帧。
# 全局变量分配在数据段的固定地址，整个程序运行期间只有一份；局部变量每次调用各有一份。

['local-state-2.title']
src_hash = '4e5793c2'
text = 'Local state: local variables and stack frames'
# src: 局部状态：局部变量与栈帧

['local-state-2.slide.1']
src_hash = 'b28a558a'
text = '''
**Managing local state with a stack**:
- Calls return in last-in, first-out (LIFO) order: the call that started last returns first;
- Local state is allocated when a call starts and released when the call returns, so allocation and release are also last-in, first-out, and a stack manages them;
- Each call occupies a contiguous region of the stack that holds the local state of that call; this region is called the call's **stack frame**;
- A stack frame is allocated at the top of the stack when a call starts and released when the call returns; the frame at the top of the stack belongs to the call that is executing.
'''
# src:
# 
# **用栈管理局部状态**：
# - 调用按后进先出（LIFO）的顺序返回：最后开始的调用最先返回；
# - 局部状态随调用开始而分配、随调用返回而释放，分配与释放的顺序同样是后进先出，因此用栈管理；
# - 每次调用在栈上占用一段连续区域，存放本次调用的局部状态，这段区域称为该调用的**栈帧（Stack Frame）**；
# - 调用开始时在栈顶分配栈帧，调用返回时释放栈帧；栈顶的栈帧属于正在执行的调用。

['runtime-stack.title']
src_hash = '943bfc50'
text = 'The run-time stack: process memory layout and growth toward lower addresses'
# src: 运行时栈：进程内存结构与向低地址生长

['runtime-stack.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['runtime-stack.slide.1']
src_hash = 'c9a429f2'
text = '''
**Typical virtual memory layout of a process (from low to high addresses)**:
1. **Code segment (.text)**: holds the machine instructions; read-only and executable;
2. **Data segment (.data / .bss)**: holds initialized / uninitialized global variables;
3. **Heap**: allocated dynamically by `malloc` / `new`; grows toward higher addresses;
4. **Run-time stack**: holds the stack frames of the calls; **grows toward lower addresses**.

**Stack pointer `%rsp`**:
- `%rsp` holds the address of the top of the stack, the lowest address of the used part of the stack;
- Allocating a stack frame decreases `%rsp`, and releasing one increases `%rsp`.

**Why the stack grows toward lower addresses**:
- Historical design: the heap and the stack are placed at the two ends of the virtual address space and grow toward each other, making the most of the limited address space without fixing a boundary in advance.
'''
# src:
# 
# **进程典型虚拟内存布局（从低地址到高地址）**：
# 1. **代码段（.text）**：存放机器指令，只读且可执行；
# 2. **数据段（.data / .bss）**：存放已初始化/未初始化全局变量；
# 3. **堆（Heap）**：由 `malloc` / `new` 动态分配，向高地址生长；
# 4. **运行时栈（Stack）**：存放各次调用的栈帧，**向低地址生长**。
# 
# **栈顶指针 `%rsp`**：
# - `%rsp` 保存栈顶地址，即栈中已使用部分的最低地址；
# - 分配栈帧时减小 `%rsp`，释放栈帧时增大 `%rsp`。
# 
# **为什么栈要向低地址生长**：

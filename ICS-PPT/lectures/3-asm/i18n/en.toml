['gpu-why.slide.2']
src_hash = 'cdfce23a'
text = '- **The GPU is designed for image rendering**: every vertex and every pixel of a frame executes the same program, and the operations are mostly multiply-adds of matrices and vectors; the matrix-vector products of neural-network inference are the same kind of computation.'
# src:
# 
# - **GPU 为图像渲染设计**：一帧画面的每个顶点、每个像素执行同一段程序，运算以矩阵与向量的乘加为主；神经网络推理的矩阵向量乘是同一类计算。

['gpu-why.notes.1']
src_hash = '807e4a2f'
text = '''
SIMD is one instruction processing several data elements; SIMT is several threads executing the same code. Multi-core parallelism on a CPU is of the second kind: each core runs 1 thread, and each thread processes a part of the data. The i9-11900H has 8 cores with 2 hardware threads each, so at most 16 threads run at the same time; ollama on 8 threads measures 31.4 Token/s, 2.9 times its speed on 1 thread.
The 21760 arithmetic cores of the RTX 5090 are the CUDA Cores of the NVIDIA specification sheet, which equal 170 SMs times the 128 cores of each SM. One CUDA core performs one operation of one thread; fetching, decoding and scheduling are done by one set of logic shared by the 32 cores of a group. Each core of a CPU has a complete set of control logic and caches of its own. The two kinds of core do different things, and the comparison of their numbers is a comparison of how many threads can execute at the same time.
The device memory of the RTX 5090 is 32 GB of GDDR7 on a 512-bit bus at 28 Gbit/s per data line, which gives a peak bandwidth of 28 × 512 ÷ 8 = 1792 GB/s. The memory bandwidth of 51.2 GB/s is the value of the page "Hardware limits".
The reference results of step 2 of the lab parallel-dot were measured on an i9-11900H and an RTX 3060 Laptop (3840 arithmetic cores), for a 32768 × 4096 matrix-vector product: the scalar loop on 1 CPU thread 59.8 ms, 16 CPU threads with vector instructions 4.5 ms, the GPU 0.81 ms; that is 1, 13.4 and 73.5 times.
In image rendering, the coordinate transform of a vertex is a product of a 4 × 4 matrix and a vector, and the colour of every pixel is computed by the same shading program; both apply the same operation to a large amount of data.
'''
# src:
# 
# SIMD 是一条指令处理多个数据，SIMT 是多个线程执行同一段代码。CPU 的多核并行属于后一种：每个核心运行 1 个线程，各自处理数据的一段。i9-11900H 有 8 个核心，每个核心 2 个硬件线程，至多 16 个线程同时运行；ollama 用 8 个线程实测 31.4 Token/s，是 1 个线程的 2.9 倍。
# RTX 5090 的 21760 个运算核心是 NVIDIA 规格表中的 CUDA Cores，等于 170 个 SM 乘以每个 SM 的 128 个。一个 CUDA 核心只完成一个线程的一次运算，取指令、译码与调度由同组的 32 个核心共用一套逻辑；CPU 的每个核心各有一套完整的控制逻辑与缓存。两种核心的功能不同，数量的对比说明的是可以同时执行的线程数。
# RTX 5090 的显存是 32 GB 的 GDDR7，总线宽度 512 位，每条数据线的速率是 28 Gbit/s，峰值带宽为 28 × 512 ÷ 8 = 1792 GB/s；内存带宽 51.2 GB/s 是「硬件上限」一页的数值。
# 实验 parallel-dot 第二步的参考结果在 i9-11900H 与 RTX 3060 Laptop（3840 个运算核心）上测得，32768 × 4096 的矩阵向量乘：CPU 1 个线程的标量循环 59.8 ms，CPU 16 个线程并使用向量指令 4.5 ms，GPU 0.81 ms，依次是 1 倍、13.4 倍、73.5 倍。
# 图像渲染中，顶点的坐标变换是 4 × 4 矩阵与向量的乘法，每个像素的颜色由同一段着色程序计算，两者都是对大量数据执行相同的运算。

['gpu-arch.title']
src_hash = 'c5ace37c'
text = 'GPU architecture: Thread, Thread Block, Grid and Warp'
# src: GPU 架构：Thread、Thread Block、Grid 与 Warp

['gpu-arch.slide.1']
src_hash = '825a42f9'
text = '''
**Hardware** (the RTX 5090 as the example):
- **SM (Streaming Multiprocessor)**: the arithmetic part of the GPU, 170 in total; each SM has 128 arithmetic cores and a block of shared memory.
- **Device memory**: 32 GB, shared by all SMs; data moves between it and the host memory by copies over the PCIe bus.

**The threads a program starts are organized in three levels**:
- **Thread**: the basic unit of execution; every thread executes the same function (called the kernel) once;
- **Thread Block**: a group of threads, placed on 1 SM as a whole; the threads of a block share the shared memory of that SM;
- **Grid**: all the thread blocks of one launch.

**Warp**: the SM groups the threads of a block 32 at a time, and the 32 threads of one warp execute the same instruction at the same time.
'''
# src:
# 
# **硬件**（以 RTX 5090 为例）：
# - **SM（Streaming Multiprocessor，流式多处理器）**：GPU 的运算部件，共 170 个；每个 SM 有 128 个运算核心与一块共享内存。
# - **显存**：32 GB，所有 SM 共用；它与主机内存之间的数据经 PCIe 总线拷贝。
# 
# **程序启动的线程分为三级**：
# - **Thread（线程）**：最基本的执行单元，每个线程把同一个函数（称为 kernel）执行一遍；
# - **Thread Block（线程块）**：一组线程，整块分配给 1 个 SM，块内的线程共用这个 SM 的共享内存；
# - **Grid（网格）**：一次启动的全部线程块。
# 
# **Warp（线程束）**：SM 把线程块中的线程每 32 个编为一组，同一个 Warp 的 32 个线程在同一时刻执行同一条指令。

['gpu-arch.notes.1']
src_hash = '59c9f04c'
text = '''
The hardware of an NVIDIA GPU and the way a CUDA program organizes its threads. The numbers of the RTX 5090 come from the NVIDIA specification sheet: 21760 CUDA cores, that is 170 SMs; 32 GB of device memory; PCIe 5.0. Its compute capability is 12.0, and the CUDA documentation gives the limits of this generation: a warp of 32 threads, at most 1024 threads in one thread block, at most 1536 threads on one SM at the same time (48 warps; 261120 threads on the whole card), 100 KB of shared memory per SM, and at most 99 KB of it for one thread block.
One SM can hold several thread blocks at the same time; when there are more thread blocks than the SMs can hold, the rest wait and are placed when earlier blocks finish. A thread block does not change its SM while it executes, which is why its threads can share the shared memory of that SM.
The SM fetches one instruction and gives it to the 32 threads of one warp to execute at the same time; this is how the hardware implements SIMT. When the threads of one warp take different paths at a branch, the SM executes the paths one after another, and the threads that are not on the current path wait; this is called branch divergence.
'''
# src:
# 
# NVIDIA GPU 的硬件组成与 CUDA 程序的线程组织。RTX 5090 的数值来自 NVIDIA 的规格表：21760 个 CUDA 核心，合 170 个 SM；32 GB 显存；PCIe 5.0。它的计算能力（Compute Capability）是 12.0，CUDA 文档给出这一代的上限：Warp 为 32 个线程，一个线程块至多 1024 个线程，一个 SM 上至多同时有 1536 个线程（48 个 Warp，全卡 261120 个线程），每个 SM 的共享内存 100 KB，一个线程块至多使用 99 KB。
# 一个 SM 可以同时容纳多个线程块；线程块的数量多于 SM 能容纳的数量时，其余线程块等待，前面的线程块结束后再分配。线程块在执行期间不更换 SM，块内线程因此可以共用这个 SM 的共享内存。
# SM 取出一条指令，交给同一个 Warp 的 32 个线程同时执行，这是 SIMT 在硬件上的做法。同一个 Warp 的线程在分支处走向不同路径时，SM 依次执行各条路径，不在当前路径上的线程等待，这种情况称为分支分化（Branch Divergence）。

['gpu-arch-fig.title']
src_hash = 'c5ace37c'
text = 'GPU architecture: Thread, Thread Block, Grid and Warp'
# src: GPU 架构：Thread、Thread Block、Grid 与 Warp

['gpu-arch-fig.slide.1']
src_hash = '803500e8'
text = '**The three levels of threads and the GPU hardware they map to**:'
# src:
# 
# **线程的三级组织与 GPU 硬件的对应**：

['gpu-arch-fig.notes.1']
src_hash = '1a1c6253'
text = '''
The left half is the threads a program starts: the grid consists of thread blocks; the figure opens Block 0, whose 256 threads form 8 warps, and each small square is 1 thread. The right half is the hardware: 170 SMs; the figure opens SM 0, which has a block of shared memory and 128 arithmetic cores; the device memory is shared by all SMs and exchanges data with the host memory over the PCIe bus.
The two arrows are two rules: a thread block is placed on 1 SM as a whole; the 32 threads of one warp execute the same instruction at the same time. The 256 threads per block in the figure are the value used by the program on the next page; the number of threads of a block is given by the program at launch.
A thread block can have more threads than the SM has arithmetic cores: the block in the figure has 256 threads, that is 8 warps, and the 128 arithmetic cores of the SM execute 4 warps at the same time. All 8 warps of the block reside on this SM, and the registers of every thread are kept in the register file of the SM; the 128 arithmetic cores of the SM form 4 groups, each of 32 cores with one scheduler, and in every clock cycle a scheduler picks 1 ready warp among the resident ones and issues its next instruction. The 8 warps therefore take turns on the arithmetic cores; while one warp waits for the result of a memory access, the scheduler executes other warps, and a switch needs no saving or restoring of registers.
One SM holds at most 48 resident warps (1536 threads), which is 6 thread blocks of 256 threads. When the program reaches __syncthreads(), the warps that arrive first wait for the other warps of the same thread block. The structure of 4 groups with one scheduler each comes from the SM structure NVIDIA published for the generations from Volta to Ampere; each SM of the RTX 5090 likewise has 128 arithmetic cores and 64 K registers.
'''
# src:
# 
# 左半是程序启动的线程：Grid 由线程块组成，图中展开了 Block 0，它的 256 个线程分为 8 个 Warp，每个小方格是 1 个线程。右半是硬件：170 个 SM，图中展开了 SM 0，它有一块共享内存与 128 个运算核心；显存由所有 SM 共用，经 PCIe 总线与主机内存交换数据。
# 两个箭头是两条规则：一个线程块整块分配给 1 个 SM；同一个 Warp 的 32 个线程同时执行同一条指令。图中每块 256 个线程是下一页程序的取值，一个线程块的线程数由程序在启动时指定。
# 一个线程块的线程数可以多于 SM 的运算核心数：图中的线程块有 256 个线程，即 8 个 Warp，SM 的 128 个运算核心在同一时刻执行 4 个 Warp。线程块的 8 个 Warp 都驻留在这个 SM 上，每个线程的寄存器保存在 SM 的寄存器堆中；SM 的 128 个运算核心分为 4 组，每组 32 个核心配一个调度器，调度器每个时钟周期从驻留的 Warp 中选出 1 个已就绪的，发出它的下一条指令。8 个 Warp 因此轮流使用运算核心；一个 Warp 等待访存结果时，调度器执行其他 Warp，切换时不需要保存和恢复寄存器。
# 一个 SM 至多驻留 48 个 Warp（1536 个线程），每块 256 个线程时是 6 个线程块。程序执行到 __syncthreads() 时，先到达的 Warp 等待同一个线程块的其余 Warp。4 组、每组一个调度器的结构来自 NVIDIA 公布的 Volta 至 Ampere 各代的 SM 结构；RTX 5090 的每个 SM 同样有 128 个运算核心与 64 K 个寄存器。

['cuda-kernel.title']
src_hash = '12e03a16'
text = 'CUDA programs: the kernel function every thread executes'
# src: CUDA 程序：每个线程执行的 kernel 函数

['cuda-kernel.slide.1']
src_hash = '4fe86c9f'
text = '''
- `__global__` marks this function as a kernel; every thread executes the function body once.
- The function has no loop over the `n` elements: thread `idx` computes the single product `w[idx] * x[idx]`.
- The 256 products of each thread block are added by halving in the shared-memory array `cache`; 8 steps give 1 sum.
'''
# src:
# 
# - `__global__` 标明这个函数是 kernel，函数体由每个线程各执行一遍。
# - 函数中没有遍历 `n` 个元素的循环：线程 `idx` 只计算 `w[idx] * x[idx]` 一个乘积。
# - 每个线程块的 256 个乘积在共享内存 `cache` 中折半相加，8 步得到 1 个和。

['cuda-kernel.notes.1']
src_hash = 'ef1c32a3'
text = '''
The kernel of the dot product, taken from examples/dot_cuda.cu. A CUDA program is written in C++; __global__, __shared__, threadIdx, blockIdx, blockDim and __syncthreads are what CUDA adds.
blockIdx.x is the index of the thread block in the grid, blockDim.x is the number of threads of each block (256 here), and threadIdx.x is the index of the thread in its block; the three give idx, the index of the thread in the grid. The total number of threads is a multiple of 256 and can exceed n; threads whose idx is not less than n store 0.
__syncthreads makes every thread of the block wait at this line until all threads of the block have reached it. The first one guarantees that all 256 products have been stored in cache; the one in the loop guarantees that the additions of this step are complete.
Each step of the halving adds the second half of cache to the first half: s is 128, 64, ..., 1 in turn, and the number of elements taking part is 256, 128, ..., 2, 8 steps in total. cache[0] is the sum of this thread block, and the thread with index 0 in the block writes it to block_sum. The host program adds up the sums of the blocks.
'''
# src:
# 
# 内积的 kernel，取自 examples/dot_cuda.cu。CUDA 程序用 C++ 书写，__global__、__shared__、threadIdx、blockIdx、blockDim、__syncthreads 是 CUDA 增加的写法。
# blockIdx.x 是线程块在 Grid 中的编号，blockDim.x 是每个线程块的线程数（这里是 256），threadIdx.x 是线程在块内的编号，三者算出线程在 Grid 中的编号 idx。线程总数是 256 的倍数，可以多于 n，idx 不小于 n 的线程存入 0。
# __syncthreads 使块内的每个线程在这一行等待，直到块内全部线程都到达这一行。第一处保证 256 个乘积都已存入 cache，循环内的一处保证这一步的加法都已完成。
# 折半相加的每一步把 cache 的后一半加到前一半上：s 依次是 128、64、…、1，参与相加的元素个数依次是 256、128、…、2，共 8 步，cache[0] 是这个线程块的和，由块内编号为 0 的线程写入 block_sum。各线程块的和由主机端程序相加。

['cuda-host.title']
src_hash = 'ba64fd48'
text = 'CUDA programs: allocation, copies and the launch on the host'
# src: CUDA 程序：主机端的分配、拷贝与启动

['cuda-host.slide.1']
src_hash = '40846c1f'
text = '''
- `main` executes on the CPU, and a kernel can read and write device memory only: the data is first copied into device memory, and the result is copied back to host memory.
- `<<<blocks, threads>>>` gives the number of thread blocks and the number of threads per block: 65536 blocks of 256 threads each.
- Copying the data into device memory takes longer than the kernel: when one dot product is computed, most of the time goes to copying.
'''
# src:
# 
# - `main` 函数在 CPU 上执行，kernel 只能读写显存：数据先拷入显存，结果再拷回内存。
# - `<<<blocks, threads>>>` 指定线程块个数与每块线程数：65536 块，每块 256 个线程。
# - 数据拷入显存的用时比 kernel 的用时长：只计算一次内积时，时间主要用在拷贝上。

['cuda-host.notes.1']
src_hash = '6ceb155b'
text = '''
The part of main in dot_cuda.cu that calls CUDA; CHECK is a macro defined in the file that checks the return value of each call, and on an error prints the reason and exits.
cudaMalloc allocates space in device memory. The pointers it returns, dw, dx and dpart, point into device memory; they can only be passed to a kernel or to cudaMemcpy, and host code cannot read or write through them. The last argument of cudaMemcpy gives the direction of the copy.
A kernel is launched as name<<<number of thread blocks, threads per block>>>(arguments). After the launch main goes on, and the cudaMemcpy of step 3 waits for the kernel to finish before it copies.
The measured values of the two times are reference results of step 2 of the lab parallel-dot (RTX 3060 Laptop, the same 2²⁴ elements): copying w and x, 128 MiB in total, into device memory takes 24.4 ms (5.5 GB/s, the copy rate of ordinary malloc memory over PCIe), and the kernel takes 0.66 ms, so the copy takes 37 times as long as the kernel. The weights of a matrix-vector product stay in device memory, and each token copies only the input and output vectors, so copying takes a small share of the time.
'''
# src:
# 
# dot_cuda.cu 的 main 函数中调用 CUDA 的部分；CHECK 是文件中定义的宏，检查每次调用的返回值，出错时打印原因并退出。
# cudaMalloc 在显存中分配空间，返回的指针 dw、dx、dpart 指向显存，只能传给 kernel 或 cudaMemcpy，主机端代码不能直接读写。cudaMemcpy 的最后一个参数给出拷贝方向。
# kernel 的启动写成 函数名<<<线程块个数, 每块线程数>>>(参数)。启动之后 main 继续执行，第 3 步的 cudaMemcpy 等待 kernel 结束后再拷贝。
# 两个用时的实测值取自实验 parallel-dot 第二步的参考结果（RTX 3060 Laptop，元素个数同为 2²⁴）：把 w、x 共 128 MiB 拷入显存 24.4 ms（5.5 GB/s，普通 malloc 内存经 PCIe 的拷贝速率），kernel 0.66 ms，拷贝是 kernel 的 37 倍。矩阵向量乘的权重留在显存中，每个 Token 只拷贝输入与输出向量，拷贝所占的比例很小。


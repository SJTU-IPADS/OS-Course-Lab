src_hash = 'b65f315b'
text = '''
The listing has four parts: line 2 allocates the stack frame, lines 3 to 10 write the 8 elements of the two arrays, lines 11 to 14 set up the arguments and call dot_product, and line 15 frees the stack frame.
-fno-stack-protector turns off stack protection, so the stack frame holds only the local arrays; the stack protection of a default compilation is explained in the section "Buffer overflow and stack protection" of this part.
The main.c button opens the source on the right, for comparison with the stack frame on the left.
'''
# src:
# 
# 清单分四段：第 2 行分配栈帧，第 3 到 10 行写入两个数组的 8 个元素，第 11 到 14 行准备参数并调用 dot_product，第 15 行释放栈帧。
# -fno-stack-protector 关闭栈保护，栈帧中只有局部数组；默认编译时的栈保护在本部分「缓冲区溢出与栈保护」一节说明。

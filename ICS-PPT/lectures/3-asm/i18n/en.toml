src_hash = '58ad07e7'
text = '- **How it works**: `testl %edx, %edx` ANDs the dimension $n$ with itself. If $n = 0$, ZF is set; if $n < 0$, SF is set. Together with `jle`, one instruction is enough to detect and intercept the non-positive boundary case $n \le 0$ and jump directly to the exit `.L4`, which returns 0.'

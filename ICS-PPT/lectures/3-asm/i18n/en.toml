['insn-bytes.slide.2']
src_hash = 'f7a39809'
text = '**Conclusion**: an instruction begins with its opcode. The CPU identifies which instruction it is from the opcode and, based on that, reads the variable-length operand fields that follow.'
# src:
# 
# **结论**：指令的开头是操作码。CPU 由操作码识别这是哪一条指令，并据此读取其后长度可变的操作数字段。

['insn-bytes.notes.1']
src_hash = '8b4e0e67'
text = '''
In the first three x86-64 instructions the field boundaries coincide with byte boundaries: `ret` has only an opcode; the opcode `b8` of `movl $0, %eax` contains the register number and is followed by a 4-byte immediate; the second byte of `xorl %eax, %eax` describes the two register operands.
`c0` is `11 000 000` in binary: the first 2 bits say that both operands are registers, and each of the two 3-bit groups after them is the number of `%eax`. x86-64 puts the low 3 bits of the 4-bit number in this byte and the top bit in a prefix byte (the `48` of the fourth instruction); the first three instructions have no prefix byte, and the top bit of the number is 0.
In x86-64 prefix bytes may precede the opcode, and the `48` of the fourth instruction is such a prefix; every Y86-64 instruction begins with its opcode.
The fourth, `movq 8(%rdi), %rcx`, reads 8 bytes from address `%rdi + 8` into `%rcx` and is encoded as `48 8b 4f 08`: `4f` is `01 001 111` in binary, and the three groups stand for a 1-byte offset, `%rcx` and `%rdi` in turn. The complete encoding rules are in volume 2, chapter 2 of the Intel manual.
Y86-64 is the instruction set designed for teaching in chapter 4 of the textbook CS:APP. Its instructions do much the same as those of x86-64, and its encoding rules are simpler: byte 1 is the opcode, the two hex digits of byte 2 are two register numbers, and an 8-byte constant follows. `mrmovq 8(%rdi), %rcx` is the same operation as the fourth instruction. The register numbers are the same as in x86-64: `%rax` is 0, `%rcx` is 1, `%rdi` is 7.
The x86-64 bytes can be obtained with `echo 'ret; movl $0, %eax; xorl %eax, %eax; movq 8(%rdi), %rcx' | gcc -c -x assembler - -o t.o && objdump -d t.o`.
'''
# src:
# 
# x86-64 的前三条指令，字段的边界与字节的边界重合：`ret` 只有操作码；`movl $0, %eax` 的操作码 `b8` 含寄存器编号，其后是 4 字节立即数；`xorl %eax, %eax` 的第二个字节描述两个寄存器操作数。
# `c0` 的二进制是 `11 000 000`：前 2 位表示两个操作数都是寄存器，后两段各 3 位，是两个 `%eax` 的编号。x86-64 把 4 位编号的低 3 位放在这个字节中，最高位放在前缀字节中（第四条的 `48`）；前三条指令没有前缀字节，编号的最高位是 0。
# x86-64 的操作码之前可以有前缀字节，第四条的 `48` 就是前缀；Y86-64 的指令都以操作码开头。
# 第四条 `movq 8(%rdi), %rcx` 从地址 `%rdi + 8` 读取 8 字节到 `%rcx`，编码是 `48 8b 4f 08`：`4f` 的二进制是 `01 001 111`，三段依次表示 1 字节偏移、`%rcx`、`%rdi`。完整的编码规则见 Intel 手册第 2 卷第 2 章。
# Y86-64 是教材 CS:APP 第 4 章为教学设计的指令集，指令的功能与 x86-64 相近，编码规则更简单：第 1 字节是操作码，第 2 字节的两个十六进制位是两个寄存器编号，其后是 8 字节常数。`mrmovq 8(%rdi), %rcx` 与第四条是同一操作。寄存器编号与 x86-64 相同：`%rax` 为 0，`%rcx` 为 1，`%rdi` 为 7。
# x86-64 的字节可用 `echo 'ret; movl $0, %eax; xorl %eax, %eax; movq 8(%rdi), %rcx' | gcc -c -x assembler - -o t.o && objdump -d t.o` 得到。


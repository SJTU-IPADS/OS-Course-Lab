['insn-bytes.slide.1']
src_hash = '63e0a7d1'
text = '**The byte representation of an instruction**: a machine instruction is a run of consecutive bytes in memory, made up of an opcode and operand fields.'
# src:
# 
# **指令的字节表示**：一条机器指令是内存中一段连续的字节，由操作码与操作数字段组成。

['insn-bytes.slide.2']
src_hash = '3ddcd38c'
text = 'An x86-64 instruction generally begins with its opcode. The CPU identifies which instruction it is from the opcode and, based on that, reads the variable-length operand fields that follow.'
# src:
# 
# x86-64 指令的开头一般是操作码。CPU 由操作码识别这是哪一条指令，并据此读取其后长度可变的操作数字段。

['insn-bytes.notes.1']
src_hash = 'a7d1e99b'
text = '''
In the three x86-64 instructions the field boundaries coincide with byte boundaries: `ret` has only an opcode; the opcode `b8` of `movl $0, %eax` contains the register number and is followed by a 4-byte immediate; the second byte of `xorl %eax, %eax` describes the two register operands.
`c0` is `11 000 000` in binary: the first 2 bits say that both operands are registers, and each of the two 3-bit groups after them is the number of `%eax`. An instruction with a memory operand encodes the register number together with the addressing mode in the operand bytes; the rules are in volume 2, chapter 2 of the Intel manual, and this lecture does not go into them.
Y86-64 is the instruction set designed for teaching in chapter 4 of the textbook CS:APP. Its instructions do much the same as those of x86-64, and its encoding rules are simpler: byte 1 is the opcode, the two hex digits of byte 2 are two register numbers (F means no register), and an 8-byte constant follows. `irmovq $0, %rax` is the same operation as `movl $0, %eax`: it writes the constant 0 into the register `%rax`. Y86-64 has only 64-bit operations and the constant takes 8 bytes, so the whole instruction is 10 bytes; the 5-byte x86-64 encoding is more compact. The register numbers are the same as in x86-64: `%rax` is 0.
The x86-64 bytes can be obtained with `echo 'ret; movl $0, %eax; xorl %eax, %eax' | gcc -c -x assembler - -o t.o && objdump -d t.o`.
'''
# src:
# 
# x86-64 的三条指令，字段的边界与字节的边界重合：`ret` 只有操作码；`movl $0, %eax` 的操作码 `b8` 含寄存器编号，其后是 4 字节立即数；`xorl %eax, %eax` 的第二个字节描述两个寄存器操作数。
# `c0` 的二进制是 `11 000 000`：前 2 位表示两个操作数都是寄存器，后两段各 3 位，是两个 `%eax` 的编号。带内存操作数的指令把寄存器编号与寻址方式合并编码在操作数字节中，规则见 Intel 手册第 2 卷第 2 章，本讲不展开。
# Y86-64 是教材 CS:APP 第 4 章为教学设计的指令集，指令的功能与 x86-64 相近，编码规则更简单：第 1 字节是操作码，第 2 字节的两个十六进制位是两个寄存器编号（F 表示没有寄存器），其后是 8 字节常数。`irmovq $0, %rax` 与 `movl $0, %eax` 是同一操作：把常数 0 写入寄存器 `%rax`。Y86-64 只有 64 位运算，常数占 8 字节，所以整条指令 10 字节，x86-64 的 5 字节编码更紧凑。寄存器编号与 x86-64 相同：`%rax` 为 0。
# x86-64 的字节可用 `echo 'ret; movl $0, %eax; xorl %eax, %eax' | gcc -c -x assembler - -o t.o && objdump -d t.o` 得到。


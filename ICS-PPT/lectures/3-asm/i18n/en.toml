['call-ret-2.notes.1']
src_hash = '924fb30b'
text = '''
-no-pie makes the addresses in the executable the same as the addresses after loading into memory. objdump -d disassembles, --no-show-raw-insn omits the machine-code bytes, and grep -A1 extracts the call line and the line after it.
The three -ex options of gdb run three commands in order: set a breakpoint at the first instruction of dot_product (*dot_product is the address of this instruction), run the program, and print the 8 bytes %rsp points to in hexadecimal (x/gx); tail -1 keeps only the last line.
In the last line, the part before the colon is the address of the top of the stack, which varies with the run-time environment; the return address after the colon does not change. With another compiler version the three addresses change, and the address of the instruction after call still equals the 8 bytes at the top of the stack.
'''
# src:
# 
# -no-pie 使可执行文件中的地址就是装入内存后的地址。objdump -d 反汇编，--no-show-raw-insn 不打印机器码字节，grep -A1 取出 call 一行与它的下一行。
# gdb 的三个 -ex 依次执行三条命令：在 dot_product 的第一条指令处设置断点（*dot_product 是这条指令的地址），运行程序，以十六进制打印 %rsp 所指的 8 个字节（x/gx）；tail -1 只保留最后一行。
# 最后一行冒号之前是栈顶的地址，随运行环境变化；冒号之后的返回地址不变。换用其他版本的编译器，三个地址会变化，call 的下一条指令的地址与栈顶的 8 个字节仍然相同。

['stack-frames.title']
src_hash = '10e5f7bf'
text = 'The stack frame: the region one call occupies on the stack'
# src: 栈帧：一次调用在栈上占用的区域

['stack-frames.slide.1']
src_hash = '846dae5b'
text = '''
**Stack frame**: a contiguous region of the stack occupied by one call, holding the data of that call.
- The return address pushed by `call` is the last item of the caller's stack frame, and the callee's stack frame starts below it;
- A stack frame is created at the top of the stack when a call starts and freed when the call returns; `%rsp` points to the end of the most recently created stack frame, which belongs to the function that is executing;
- Calls return in last-in, first-out order, and stack frames are created and freed in last-in, first-out order as well.
'''
# src:
# 
# **栈帧（Stack Frame）**：一次调用在栈上占用的一段连续区域，存放这次调用自己的数据。
# - `call` 压入的返回地址是调用者栈帧的最后一项，被调用者的栈帧从它之下开始；
# - 调用开始时在栈顶建立栈帧，调用返回时释放；`%rsp` 指向最后建立的栈帧的末端，这个栈帧属于正在执行的函数；
# - 调用按后进先出的顺序返回，栈帧的建立与释放也按后进先出的顺序进行。

['stack-frames.slide.2']
src_hash = '9d9ff84b'
text = '**Other data in a stack frame**: besides the return address, a stack frame holds arguments passed on the stack, saved register values and local variables, as determined by the solutions to the remaining three problems.'
# src:
# 
# **栈帧中的其他数据**：除返回地址外，栈帧还存放经栈传递的参数、保存的寄存器值与局部变量，由后面三个问题的解决方式决定。

['stack-frames.notes.1']
src_hash = '6b94d852'
text = '''
In the figure main calls f, and f calls g and then h. Each column is the stack at one moment, with the bottom of the stack drawn at the top; the lowest stack frame belongs to the function that is executing.
After g returns its stack frame is freed; when f then calls h, the stack frame of h uses the same memory.
'''
# src:
# 
# 图中 main 调用 f，f 先后调用 g 与 h。每一列是一个时刻的栈，栈底在上，最下面的栈帧属于正在执行的函数。
# g 返回后它的栈帧释放，f 再调用 h 时，h 的栈帧使用同一段内存。


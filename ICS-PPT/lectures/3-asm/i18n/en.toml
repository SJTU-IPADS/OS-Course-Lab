# 
# - 模型推理过程中有大量计算是矩阵乘法，例如需要计算 $w$ 和 $x$ 的内积，由推理程序 `ollama` 负责组织完成这些计算。如果在 CPU 上进行推理，内积可以由一个简单的 `for` 循环累积来完成。CPU不认识for、不认识内积，是怎么完成执行的？


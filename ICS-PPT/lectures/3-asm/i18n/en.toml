['memory-operand-2.slide.1']
src_hash = 'ca55436f'
text = '**Architecture comparison (CISC vs RISC)**: `return w[0] + x[0];` compiled to x86-64 and to ARM64 assembly:'
# src:
# 
# **架构对比（CISC vs RISC）**：`return w[0] + x[0];` 分别编译为 x86-64 与 ARM64 汇编：

['memory-operand-2.slide.2']
src_hash = 'e034a8ca'
text = '''
- The pointers `w` and `x` are in `%rdi` and `%rsi` on x86-64, and in `x0` and `x1` on ARM64; the return value is written to `%eax` and to `w0` (the low 32 bits of `x0`) respectively;
- x86-64: the source operand of `addl (%rdi), %eax` is a memory operand, so one instruction both reads `w[0]` and adds;
- ARM64: two `ldr` instructions first load `w[0]` and `x[0]` into `w2` and `w0`, then `add` adds them (in ARM64 assembly the destination operand is written first);
- In ARM64 only the load and store instructions (`ldr` / `str`) access memory, and arithmetic instructions can use only registers, so the same computation takes one more instruction.
'''
# src:
# 
# - 指针 `w` 与 `x` 在 x86-64 中位于 `%rdi` 与 `%rsi`，在 ARM64 中位于 `x0` 与 `x1`；返回值分别写入 `%eax` 与 `w0`（`x0` 的低 32 位）；
# - x86-64：`addl (%rdi), %eax` 的源操作数是内存操作数，一条指令完成读取 `w[0]` 与相加；
# - ARM64：两条 `ldr` 先将 `w[0]` 与 `x[0]` 读入 `w2` 与 `w0`，再由 `add` 相加（ARM64 汇编的目的操作数写在最前面）；
# - ARM64 只有加载与存储指令（`ldr` / `str`）访问内存，算术指令只能使用寄存器，同一计算因此多用一条指令。

['recap-part1.title']
src_hash = '872fe523'
text = 'Recap: how one line of C code runs on the CPU'
# src: 前情回顾：一行 C 代码如何运行在 CPU 上

['recap-part1.demo.1.name']
src_hash = 'a2237c72'
text = 'Compile and disassemble'
# src: 编译并反汇编

['recap-part1.notes.1']
src_hash = '948b5292'
text = '''
This page wraps up Part 1. Look only at the code and the disassembly first: y = a + b becomes two movl instructions that read a and b, one addl that adds them, and one movl that writes the result back to y; nop is a no-op left by -O0, and ret returns to main.
Each line of the objdump output has three columns: the memory address of the instruction, the machine-code bytes, and the assembly mnemonic; the # 404028 <a> at the end of a line is the actual address of a(%rip), computed by objdump.
Compiler options: -O0 keeps the two reads and the addition apart as three instructions; -fomit-frame-pointer removes push/pop %rbp (Part 3 covers the stack frame); -no-pie makes the addresses in the file the same as the addresses after loading into memory; -fcf-protection=none removes endbr64.
The next page uses a diagram to connect the executable file, memory and the CPU.
'''
# src:
# 
# 第一部分收尾。先只看代码与反汇编：y = a + b 变成两条 movl 读 a、b，一条 addl 相加，一条 movl 写回 y；nop 是 -O0 留下的空操作，ret 返回 main。
# objdump 每行三栏：指令的内存地址、机器码字节、汇编助记符；行尾的 # 404028 <a> 是 objdump 算出的 a(%rip) 实际地址。
# 编译选项：-O0 让两次读取与加法分开成三条指令；-fomit-frame-pointer 去掉 push/pop %rbp（第三部分再讲栈帧）；-no-pie 让文件中的地址就是装入内存后的地址；-fcf-protection=none 去掉 endbr64。
# 下一页用示意图把可执行文件、内存与 CPU 串起来。

['recap-part1-fig.title']
src_hash = '872fe523'
text = 'Recap: how one line of C code runs on the CPU'
# src: 前情回顾：一行 C 代码如何运行在 CPU 上

['recap-part1-fig.notes.1']
src_hash = '0f406987'
text = '''
This page connects three key points covered so far: compilation produces an executable file (a code segment and a data segment); once loaded into memory, instructions and data are both bytes with addresses (integers in little-endian two's complement encoding, instructions in machine-code encoding); the CPU fetches instructions using the PC, reads a and b into registers, adds them in the ALU, and writes the result back to y.
The snapshot of the CPU in the figure is taken while addl executes: a and b have been read into %edx and %eax, and y has not yet been written back. The addresses and machine code match the objdump output on the previous page; the displacement of a(%rip), 0x2f1c = 0x404028 − 0x40110c, is the target address minus the address of the next instruction.
y is uninitialized and is placed in .bss; at 0x404030 there is a 1-byte flag belonging to libc, so y is at 0x404034 rather than immediately after b.
'''
# src:

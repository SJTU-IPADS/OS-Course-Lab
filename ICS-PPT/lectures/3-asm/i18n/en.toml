['loop-asm.slide.1']
src_hash = 'a0903939'
text = '''
- `%eax` holds `i`, `%r9d` holds `sum`, `%edx` holds `n`, and `%rdi` and `%rsi` hold `w` and `x` (the rules that map parameters to registers are covered in Part 3);
- `.L3:` and `.L2:` are labels: a label is a name for the address of the instruction that follows it, and the assembler converts it to the address;
- The loop body is the 5 instructions after `.L3`: `movslq` extends `i` to 64 bits, `movl` and `imull` read `x[i]` and multiply it by `w[i]`, and the two `addl` accumulate `sum` and perform `i++`;
- After the loop body, `cmpl` compares `i` with `n`, and `jl` decides whether to execute the loop body once more.
'''
# src:
# 
# - `%eax` 保存 `i`，`%r9d` 保存 `sum`，`%edx` 保存 `n`，`%rdi` 与 `%rsi` 保存 `w` 与 `x`（参数与寄存器的对应规则在第三部分讲解）；
# - `.L3:`、`.L2:` 是标号：紧随其后那条指令的地址的名字，汇编器把它换算成地址；
# - 循环体是 `.L3` 之后的 5 条指令：`movslq` 把 `i` 扩展为 64 位，`movl` 与 `imull` 读出 `x[i]` 并乘以 `w[i]`，两条 `addl` 累加 `sum` 并完成 `i++`；
# - 循环体之后，`cmpl` 比较 `i` 与 `n`，`jl` 决定是否再执行一次循环体。

['loop-asm.notes.1']
src_hash = 'ff7b45f4'
text = '''
The listing on the left is the output of this command, with the arrows of the two jump instructions added. The dot.c button above the command opens the source on the right, to be read line by line against the assembly on the left.
The 5 instructions of the loop body: movslq extends i to a 64-bit index, movl reads x[i], imull multiplies by w[i], addl accumulates into sum, and addl $1 performs i++.
Compared with the single multiply-add of Part 1, the array index is determined by i, so movl and imull use indexed memory operands of the form (%rsi,%r8,4).
'''

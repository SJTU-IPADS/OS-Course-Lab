text = '**The function in `examples/matvec_q4.c` that computes the dot product of one row**:'
# src:
# 
# **`examples/matvec_q4.c` 中计算一行内积的函数**：

['test-program.slide.2']
src_hash = '98837334'
text = '''
- $W$ has 4096 columns, 2 KiB per row (`HALF` = 2048). The low 4 bits of byte $j$ are weight $j$, and the high 4 bits are weight $j + 2048$; a stored value $q$ represents the weight $q - 8$;
- $x$ is 4096 int8 activations, 4 KiB in total, which stay in the L1 cache throughout;
- `matvec` calls `dot_q4` once for each row of $W$. $W$ is 512 MiB by default ($2^{30}$ weights, about 1/7 of a 7B model), far larger than the 24 MiB L3 cache, so every matrix-vector multiplication reads the whole of $W$ from memory.
'''
# src:
# 
# - $W$ 有 4096 列，每行 2 KiB（`HALF` = 2048）。第 $j$ 个字节的低 4 位是第 $j$ 个权重，高 4 位是第 $j + 2048$ 个权重；存储值 $q$ 表示权重 $q - 8$；
# - $x$ 是 4096 个 int8 激活值，共 4 KiB，一直留在 L1 缓存中；
# - `matvec` 对 $W$ 的每一行调用一次 `dot_q4`。$W$ 默认 512 MiB（$2^{30}$ 个权重，约为 7B 模型的 1/7），远大于 24 MiB 的 L3 缓存，每做一次矩阵向量乘都要从内存读取整个 $W$。

['test-program.notes.1']
src_hash = '237d723e'
text = '''
The weights are arranged so that the low 4 bits and the high 4 bits each correspond to a contiguous stretch of x, which makes vectorization easy; the Q4_0 format of llama.cpp uses the same arrangement within each block of 32 weights.
Each Q4_0 block also carries a scale factor, which is omitted here, leaving only the multiply-adds.
'''
# src:
# 
# 权重的排列方式让低 4 位与高 4 位各自对应一段连续的 x，便于向量化，llama.cpp 的 Q4_0 格式在每 32 个权重的块内采用同样的排列。
# Q4_0 每块还带一个缩放因子，这里省略，只保留乘加。


['disasm-exercise.notes.1']
src_hash = '44b793b2'
text = '''
In-class exercise. `mac.c` contains only the function `mac`. `objcopy -O binary -j .text` takes the bytes of the code section out of `mac.o`, and `od -An -tx1` prints them one byte at a time in hexadecimal: 8 bytes, 4 instructions.
The rules list only the 4 instructions this exercise uses and two modes of the operand byte: 11 (register) and 00 (memory, with the address in a register).
The method repeats three steps: read the opcode, decide from the rules whether an operand byte follows, write the operand byte in binary and split it into three groups.
The Intel manual calls the operand byte ModR/M. When mm is 01 or 10 the address also has an offset; when mm is 00 and bbb is 100 or 101 other rules apply, which this exercise does not meet.
'''
# src:
# 
# 课堂练习。`mac.c` 中只有函数 `mac`。`objcopy -O binary -j .text` 从 `mac.o` 中取出代码段的字节，`od -An -tx1` 按十六进制逐字节打印，共 8 个字节、4 条指令。
# 规则只列出本题用到的 4 条指令，以及操作数字节的两种模式：11（寄存器）与 00（内存，地址在寄存器中）。
# 做法是重复三步：读取操作码，按规则判断其后有没有操作数字节，把操作数字节写成二进制并分成三段。
# 操作数字节在 Intel 手册中称为 ModR/M。mm 为 01、10 时地址中还有偏移；mm 为 00 且 bbb 为 100 或 101 时另有规则，本题不涉及。


['jump-encoding-2.slide.1']
src_hash = 'da884aca'
text = '''
**PC-relative encoding of jump targets**:
- The machine instruction stores the offset of the target address relative to the address of the next instruction:
 $$\text{Offset} = \text{Target\_Address} - \text{Next\_RIP}$$
- **Advantages**: the instruction is short (usually a 1-byte or 4-byte offset), and the code still executes correctly after being moved and relocated as a whole in memory.
'''
# src:
# 
# **跳转目标的 PC 相对编码（PC-Relative Encoding）**：
# - 机器指令中存储的是目标地址相对于下一条指令地址的偏移：
#  $$\text{Offset} = \text{Target\_Address} - \text{Next\_RIP}$$
# - **优势**：指令长度短（常用 1 字节或 4 字节偏移），且代码在内存中整体搬移重定位后依然正确执行。

['rflags.title']
src_hash = '033e3975'
text = 'Status flags: side effects of arithmetic and the RFLAGS condition codes'
# src: 状态标志：算术运算的副作用与 RFLAGS 条件码

['rflags.slide.1']
src_hash = 'cebd8a0e'
text = '''
**Condition status flags (the RFLAGS register)**:
- The CPU maintains single-bit flags that record properties of the most recent arithmetic or logic operation:
  - **ZF (Zero Flag)**: set to 1 if the result of the most recent operation is 0;
  - **SF (Sign Flag)**: set to 1 if the result of the most recent operation is negative (its sign bit is 1);
  - **CF (Carry Flag)**: set to 1 if the most significant bit overflows as an unsigned number (a carry or a borrow is produced);
  - **OF (Overflow Flag)**: set to 1 if a signed two's-complement integer overflows and its sign flips.
'''
# src:
# 
# **条件状态标志位（RFLAGS 寄存器）**：
# - CPU 维护单比特标志位，记录最近一次算术或逻辑运算的特征：
#   - **ZF（Zero Flag）**：最近一次运算结果为 0 则置 1；
#   - **SF（Sign Flag）**：最近一次运算结果为负数（最高符号位为 1）则置 1；
#   - **CF（Carry Flag）**：最高有效位发生无符号溢出（产生进位或借位）则置 1；
#   - **OF（Overflow Flag）**：补码有符号整数发生正负号反转溢出则置 1。

['rflags.notes.1']
src_hash = 'b3a8be57'
text = 'The condition status bits (ZF, SF, CF, OF) produced as side effects of operations, and the rules for how each instruction affects them.'
# src: 运算副作用产生的条件状态位（ZF, SF, CF, OF）及各指令对其影响规范。

['rflags-2.title']
src_hash = '033e3975'
text = 'Status flags: side effects of arithmetic and the RFLAGS condition codes'
# src: 状态标志：算术运算的副作用与 RFLAGS 条件码

['rflags-2.slide.1']
src_hash = '06817901'
text = '''
**How each kind of instruction affects the flags**:
- Arithmetic and logic instructions (`add`, `sub`, `imul`, `and`, `or`, `xor`) update the flags;
- `lea` and `mov` only move addresses and data, and **change no flags**;
- The `inc` / `dec` instructions update ZF, SF and OF, but **leave CF unchanged**;
- Logic instructions (`and/or/xor/test`) clear CF and OF.

**The difference between CF and OF, with 8-bit binary addition as the example**:
- `0xFF + 0x01 = 0x00`: unsigned $255+1=256$ overflows (CF=1); signed $-1+1=0$ does not overflow (OF=0);
- `0x7F + 0x01 = 0x80`: unsigned $127+1=128$ does not overflow (CF=0); signed $127+1=-128$ overflows with a sign flip (OF=1).
'''
# src:
# 
# **各类指令对标志位的影响规范**：
# - 算术与逻辑指令（`add`, `sub`, `imul`, `and`, `or`, `xor`）会更新标志位；
# - `lea` 与 `mov` 纯地址与数据传送，**不改变任何标志位**；
# - `inc` / `dec` 指令更新 ZF、SF、OF，但**保留 CF 不变**；
# - 逻辑指令（`and/or/xor/test`）执行后将 CF 与 OF 清零。
# 
# **CF 与 OF 的区别，以 8 位二进制加法为例**：
# - `0xFF + 0x01 = 0x00`：无符号 $255+1=256$ 溢出（CF=1）；有符号 $-1+1=0$ 无溢出（OF=0）；
# - `0x7F + 0x01 = 0x80`：无符号 $127+1=128$ 无溢出（CF=0）；有符号 $127+1=-128$ 符号反转溢出（OF=1）。

['cmp-test.title']
src_hash = 'a75f685d'
text = 'Comparisons: how the cmp and test instructions set the status flags'
# src: 状态比较：cmp 与 test 指令的状态设置机制

['cmp-test.slide.1']
src_hash = '25ce1e47'
text = '''
**Compare instruction: `cmp`**:
- Syntax: `cmpl S2, S1`
- **Semantics**: computes the difference $S1 - S2$ and only updates the ZF, SF, CF and OF flags according to it; **the result of the subtraction is discarded, and both operand registers keep their values**.

**Test instruction: `test`**:
- Syntax: `testl S2, S1`
- **Semantics**: computes the bitwise AND $S1 \ \& \ S2$ and only sets ZF and SF according to it (and clears CF and OF); **the result is discarded**.
'''
# src:
# 
# **比较指令：`cmp`**：
# - 语法：`cmpl S2, S1`
# - **语义**：计算 $S1 - S2$ 的差值，仅按差值结果更新 ZF, SF, CF, OF 标志位，**丢弃减法结果，两个操作数寄存器保持原值**。
# 
# **检测指令：`test`**：
# - 语法：`testl S2, S1`
# - **语义**：计算 $S1 \ \& \ S2$ 的按位与，仅按与运算结果设置 ZF 与 SF（并将 CF 和 OF 清零），**丢弃运算结果**。


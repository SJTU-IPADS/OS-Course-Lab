['perf-3.slide.1']
src_hash = '7f9f3115'
text = '''
**Summary of the measurements**:
- **Instruction reduction**: the instruction count drops from 2.46 billion to 310 million, a ratio of 7.91x (the scalar version's 2.46 billion instructions divided by 6 per multiply-add correspond exactly to 410 million multiply-adds);
- **Cycle and time speedup**: the time drops from 0.150s to 0.024s, an end-to-end speedup of 6.25x.

**Alternatives for measuring on other platforms**:
- Windows has no native Linux `perf` tool; two alternatives can be used:
  1. Call `clock_gettime(CLOCK_MONOTONIC)` inside the program, or read the time stamp counter with `__rdtsc()`;
  2. Install WSL2 and run native Linux `perf` in the Ubuntu subsystem.

**Question to think about**: if the array size $n$ grows beyond the capacity of the L3 cache (hundreds of MiB), how do the times and the speedup of the two versions change?
'''

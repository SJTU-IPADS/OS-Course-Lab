['insn-mix.title']
src_hash = 'd51ee3cf'
text = 'Bottleneck analysis: instructions executed per multiply-add'
# src: 瓶颈分析：每次乘加执行的指令条数

['insn-mix.slide.1']
src_hash = 'c2217ea1'
text = '''
**The loop body generated by `gcc -O2 -fno-tree-vectorize` has 16 instructions; each iteration processes 1 byte of weights (2 multiply-adds), an average of 8 instructions per multiply-add**:
- **Multiply-add**: `imul` × 2, `add` × 2, 4 in total;
- **Loads**: `movzbl` reads 1 byte of weights, `movsbl` × 2 read 2 activations, 3 in total;
- **Extracting the 4-bit weights**: `mov`, `shr`, `and`, `movzbl`, `sub` × 2, 6 in total;
- **Loop control**: `add`, `cmp`, `jne`, 3 in total.

**The number of instructions issued per cycle is limited**:
- A core issues at most 5 instructions per cycle (into the out-of-order execution engine); this is the issue width of the Willow Cove microarchitecture of the i9-11900H;
- `cmp` and `jne` are fused and issued as 1, so each iteration takes 15 issue slots and needs at least 3 cycles;
- A single core completes at most $2 \div 3 \approx 0.67$ multiply-adds per cycle, which is $2.7 \times 10^9$ /s at 4.0 GHz.
'''
# src:
# 
# **`gcc -O2 -fno-tree-vectorize` 生成的循环体共 16 条指令，每轮处理 1 字节权重（2 次乘加），平均每次乘加 8 条**：
# - **乘加**：`imul` × 2、`add` × 2，共 4 条；
# - **读取**：`movzbl` 读 1 字节权重，`movsbl` × 2 读 2 个激活值，共 3 条；
# - **拆出 4 位权重**：`mov`、`shr`、`and`、`movzbl`、`sub` × 2，共 6 条；
# - **循环控制**：`add`、`cmp`、`jne`，共 3 条。
# 
# **每个周期发射的指令条数有上限**：
# - 核心每个周期最多发射（送入乱序执行部件）5 条指令，这是 i9-11900H 的 Willow Cove 微架构的发射宽度；
# - `cmp` 与 `jne` 合并为 1 条发射，每轮循环占 15 个发射名额，至少需要 3 个周期；
# - 单核每周期最多完成 $2 \div 3 \approx 0.67$ 次乘加，主频 4.0 GHz 时为 $2.7 \times 10^9$ 次/s。

['insn-mix.notes.1']
src_hash = 'c29d5447'
text = '''
The loop body is taken from objdump -d matvec_scalar. mov %eax,%edx and movzbl %al,%eax are eliminated at the renaming stage and use no execution unit, but they still take issue slots.
Of the 16 instructions per iteration, 4 perform the multiplications and additions; the other 12 handle the loads, extracting the 4-bit weights and loop control.
'''
# src:
# 
# 循环体取自 objdump -d matvec_scalar。mov %eax,%edx 与 movzbl %al,%eax 在重命名阶段消除，不占用执行单元，但仍占用发射名额。
# 每轮 16 条指令中完成乘法与累加的是 4 条，另外 12 条负责读取、拆出 4 位权重与循环控制。

['insn-mix-2.title']
src_hash = 'd51ee3cf'
text = 'Bottleneck analysis: instructions executed per multiply-add'
# src: 瓶颈分析：每次乘加执行的指令条数

['insn-mix-2.slide.1']
src_hash = 'bd50f75a'
text = '''
**The effect of instruction bytes**:
- The loop body is 57 bytes; after the first execution it stays in the core's instruction cache (32 KiB per core), and every later iteration fetches its instructions from the cache;
- The data each iteration reads from memory is 1 byte of weights; it also reads 2 activations from the L1 cache.

**Conclusion**:
- The multiply-add rate of the scalar program is determined by the number of instructions that can be issued per cycle;
- The fewer instructions each multiply-add needs, the more multiply-adds the same issue width completes.
'''
# src:
# 
# **指令字节数的影响**：
# - 循环体共 57 字节，第一次执行后保存在核心的指令缓存（每核 32 KiB）中，此后每轮循环从缓存取指令；
# - 每轮循环从内存读取的数据是 1 字节权重，另外从 L1 缓存读取 2 个激活值。
# 
# **结论**：
# - 标量程序的乘加速率由每个周期能发射的指令条数决定；
# - 每次乘加需要的指令越少，同样的发射宽度完成的乘加越多。


['abi-isa.notes.1']
src_hash = 'a2fb6bf5'
text = '''
The behavior of instructions is written in the ISA manual and carried out by the CPU; the use of registers and the stack is written in the ABI document and followed by the compiler. That pushq and popq use %rsp as the stack pointer is also behavior specified by the ISA.
On x86-64, GCC provides __attribute__((ms_abi)), so a function in the same Linux program can be compiled and called under the Windows convention, which shows that the convention is chosen by the compiler.
The 32 bytes of Windows are called the shadow space; the caller reserves them before call, and the callee may store the 4 register arguments in them.
'''
# src:
# 
# 指令的行为写在 ISA 手册中，由 CPU 执行；寄存器与栈的用法写在 ABI 文档中，由编译器遵守。pushq 与 popq 以 %rsp 为栈顶指针，也是 ISA 规定的行为。
# GCC 在 x86-64 上提供 __attribute__((ms_abi))，同一个 Linux 程序中的函数可以按 Windows 的约定编译与调用，说明约定由编译器选择。
# Windows 的 32 字节称为影子空间（shadow space），调用者在 call 之前预留，被调用者可以把 4 个寄存器参数存入其中。


['local-vars.title']
src_hash = 'df37a868'
text = 'Local variables: kept in registers, or allocated in the stack frame'
# src: 局部变量：放在寄存器中，或在栈帧中分配

['local-vars.slide.1']
src_hash = 'a36ec279'
text = '''
**A local variable that can be kept in a register takes no memory**: the `sum` of `dot_product` is in `%r9d` and `i` in `%eax`, and the function allocates no space on the stack.

**Three cases in which a local variable must be in memory**:
1. Not enough registers: more local variables are in use at the same time than there are registers available;
2. The local variable is an array or a struct: its elements are accessed by address; `w[4]` and `x[4]` of `main` are this case;
3. The program takes the address of the local variable (the `&` operator): a register has no address.

**Allocation in the stack frame**:
- At the start of the function, `%rsp` is decreased by the number of bytes needed, and this space becomes part of the function's stack frame;
- Local variables are accessed at offsets relative to `%rsp`;
- Before returning, `%rsp` is increased by the same number of bytes, which frees the space;
- Each call allocates its own; several calls of the same function (recursion, for example) each have their own copy of the local variables.
'''
# src:
# 
# **能放在寄存器中的局部变量不占用内存**：`dot_product` 的 `sum` 在 `%r9d` 中，`i` 在 `%eax` 中，函数没有在栈上分配空间。
# 
# **局部变量必须放在内存中的三种情况**：
# 1. 寄存器不够用：同时使用的局部变量多于可用的寄存器；
# 2. 局部变量是数组或结构体：元素按地址访问，`main` 的 `w[4]` 与 `x[4]` 属于这种情况；
# 3. 程序对局部变量取地址（`&` 运算符）：寄存器没有地址。
# 
# **在栈帧中分配**：
# - 函数开头把 `%rsp` 减去所需的字节数，这段空间成为函数栈帧的一部分；
# - 局部变量按相对 `%rsp` 的偏移访问；
# - 返回前把 `%rsp` 加上同样的字节数，这段空间随之释放；
# - 每次调用各自分配，同一个函数的多次调用（例如递归）各有一份局部变量。

['local-vars.notes.1']
src_hash = '79390b89'
text = '''
A global variable is allocated at a fixed address in the data segment, and there is only one copy of it for the whole run of the program; a local variable is allocated with the call and freed with the return, so it is placed on the stack.
main passes the addresses of w and x to dot_product as arguments, so the two arrays must have addresses.
'''

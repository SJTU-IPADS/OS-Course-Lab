['effective-address.slide.1']
src_hash = '2e2ddfc3'
text = '''
**High-level language expression**: `w[i]`

**Contiguous memory layout model**:
- The array name `w` stands for the starting address of the first element (the base address).
- The index `i` is the logical offset of the element.
- Each `int` element takes 4 bytes (Scale Factor = 4).

**Formula**:
 $$\text{Address}(w[i]) = \text{Base}(w) + i \times 4$$
'''
# src:
# 
# **高级语言表达**：`w[i]`
# 
# **内存连续排布模型**：
# - 数组名 `w` 代表首元素起始地址（Base Address）。
# - 下标 `i` 为元素逻辑偏移。
# - 每个 `int` 元素占用 4 个字节（Scale Factor = 4）。
# 
# **计算公式**：
#  $$\text{Address}(w[i]) = \text{Base}(w) + i \times 4$$


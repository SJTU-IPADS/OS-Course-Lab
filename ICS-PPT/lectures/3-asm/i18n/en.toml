src_hash = 'be683410'
text = '**Derivation**: the C code corresponding to each instruction is as follows:'
# src:
# 
# **分析推导**：逐条对应的 C 代码如下：

['mac-exercise-2.slide.2']
src_hash = 'a542af26'
text = '''
- `movl (%rsi), %eax`: reads 4 bytes at the address in `%rsi`, giving `x[0]`;
- `imull (%rdi), %eax`: reads `w[0]` at the address in `%rdi`, multiplies it by `%eax`, and writes the low 32 bits of the product back to `%eax`;
- `addl %edx, %eax`: adds `sum`; the result is the return value;
- The corresponding C function body: `return sum + w[0] * x[0];`.
'''
# src:
# 
# - `movl (%rsi), %eax`：以 `%rsi` 中的地址读取 4 字节，得到 `x[0]`；
# - `imull (%rdi), %eax`：以 `%rdi` 中的地址读取 `w[0]`，与 `%eax` 相乘，乘积的低 32 位写回 `%eax`；
# - `addl %edx, %eax`：加上 `sum`，结果即返回值；
# - 对应的 C 函数体：`return sum + w[0] * x[0];`。


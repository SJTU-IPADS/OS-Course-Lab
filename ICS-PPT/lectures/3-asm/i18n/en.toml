['summary-2.slide.1']
src_hash = '275eb761'
text = '''
**Systems thinking from scalars to vectors and concurrency**:
- Performance cannot be improved by raising the clock frequency alone (limited by the power wall and heat dissipation);
- The core of modern system software and high-performance operator development lies in understanding the datapath width, the bandwidth of the memory hierarchy, and the parallelism of instruction throughput;
- The vector dot product `sum += w[i] * x[i]` executes efficiently at the lowest level through instruction encoding, register allocation, pipeline scheduling and vector extensions.
'''
# src:
# 
# **从标量到向量与并发的系统思维**：
# - 性能的提升不能单靠提升时钟频率（受功耗墙与散热限制）；
# - 现代系统软件与高性能算子开发的核心，在于理解数据通路宽度、内存层次带宽以及指令吞吐并行性；
# - 向量内积计算 `sum += w[i] * x[i]`，在底层通过指令编码、寄存器分配、流水线调度与向量化扩展实现高效执行。


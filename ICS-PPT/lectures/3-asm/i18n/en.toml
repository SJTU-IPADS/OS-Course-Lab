text = 'Vector arithmetic: the vmovdqu, vpmulld and vpaddd instructions'
# src: 向量算术：vmovdqu、vpmulld 与 vpaddd 指令

['vector-arith.slide.1']
src_hash = '56bc72b2'
text = '''
**Vector load instruction: `vmovdqu`**:
- Syntax: `vmovdqu (%rdi,%rax), %ymm2`
- Meaning: reads 256 contiguous bits (32 bytes, that is, 8 consecutive `int32`) from the memory address into the register `%ymm2`;
- **The difference in alignment constraints between `vmovdqu` and `vmovdqa`**:
  - `vmovdqa` (Aligned): requires the memory address to be strictly aligned to 32 bytes; if the address is not aligned, the CPU raises a general protection exception (#GP), and on Linux the process receives the `SIGSEGV` signal;
  - `vmovdqu` (Unaligned): allows unaligned memory addresses; the hardware bus automatically splits a load that crosses cache lines, so it is more generally usable.
'''
# src:
# 
# **向量加载指令：`vmovdqu`**：
# - 语法：`vmovdqu (%rdi,%rax), %ymm2`
# - 含义：从内存地址连续读取 256 位（32 字节，即 8 个连续 `int32`）载入寄存器 `%ymm2`；
# - **`vmovdqu` 与 `vmovdqa` 的对齐约束区别**：
#   - `vmovdqa`（Aligned）：要求内存地址必须以 32 字节严格对齐；若地址未对齐，CPU 触发通用保护异常（#GP），Linux 下进程收到 `SIGSEGV` 信号；
#   - `vmovdqu`（Unaligned）：允许内存地址不对齐，硬件总线自动完成跨缓存行拆分加载，通用性更强。


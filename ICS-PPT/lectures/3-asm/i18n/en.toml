text = '''
**The problem of adapting to the hardware instruction set**:
- If a program compiled with `-mavx2` or `-mavx512f` runs on a CPU that does not support that instruction set, it directly triggers **an illegal instruction exception (SIGILL / Illegal Instruction), which crashes the program**.


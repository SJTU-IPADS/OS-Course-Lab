['saved-regs.title']
src_hash = 'b59c3981'
text = 'Protecting registers: caller-saved and callee-saved'
# src: 寄存器保护：调用者保存与被调用者保存

['saved-regs.slide.1']
src_hash = '663d3f9e'
text = '''
**The core conflict**: there are only 16 general-purpose registers; if every function used them freely, the callee would overwrite the caller's data.

**The contract that divides the responsibilities**:
1. **Caller-saved (temporary registers)**:
   - Includes: `%rax`, `%rdi`, `%rsi`, `%rdx`, `%rcx`, `%r8` ~ `%r11`
   - Rule: the callee may modify them freely. If the caller still needs their original values after the call, it **must save them itself** before `call`.
2. **Callee-saved (preserved registers)**:
   - Includes: `%rbx`, `%rbp`, `%r12` ~ `%r15`, `%rsp`
   - Rule: the callee must guarantee that these registers hold their original values when the function returns. If the callee needs to use one, it **must save the original value before using it and restore it before returning**.
'''
# src:
# 
# **核心矛盾**：通用寄存器仅有 16 个，若所有函数都自由使用，调用者的数据会被被调用者改写。
# 
# **职责划分契约**：
# 1. **调用者保存（Caller-saved / 临时寄存器）**：
#    - 包括：`%rax`, `%rdi`, `%rsi`, `%rdx`, `%rcx`, `%r8` ~ `%r11`
#    - 规则：被调用者可以随意修改。如果调用者在调用后还需要其原有数值，必须在 `call` 之前**自己负责保存**。
# 2. **被调用者保存（Callee-saved / 保持寄存器）**：
#    - 包括：`%rbx`, `%rbp`, `%r12` ~ `%r15`, `%rsp`
#    - 规则：被调用者必须保证函数返回时这些寄存器的值原封不动。若被调用者需要使用，**必须在使用前保存原值，返回前恢复**。

['saved-regs.notes.1']

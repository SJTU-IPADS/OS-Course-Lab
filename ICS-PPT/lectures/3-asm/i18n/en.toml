['extension.title']
src_hash = '788c56e1'
text = 'Moves with extension: zero extension, sign extension and the cltq instruction'
# src: 扩展传送：零扩展、符号扩展与 cltq 指令

['extension.slide.1']
src_hash = '1bef3f70'
text = '''
**Two kinds of extending instructions for moves between different widths**:
1. **Zero-extending moves**:
   - `movzbl` (byte to double word), `movzwl` (word to double word);
   - Action: fills all the upper bits with 0; used for unsigned types (`unsigned`).
2. **Sign-extending moves**:
   - `movsbl` (byte to double word), `movswl` (word to double word), `movslq` (double word to quad word);
   - Action: copies the most significant bit (the sign bit) of the source operand into all the upper bits, which keeps the signed two's-complement value unchanged.

**The dedicated sign-extension instruction `cltq` (Convert Long to Quad)**:
- It has no explicit operands and only sign-extends `%eax` to fill the whole 64-bit `%rax`;
- The instruction is shorter, and its effect is the same as that of `movslq %eax, %rax`.
'''
# src:
# 
# **不同位宽传递的两类扩展指令**：
# 1. **零扩展传送（Zero Extension）**：
#    - `movzbl`（字节转双字）, `movzwl`（字转双字）；
#    - 动作：将高位全部填充为 0，适用于无符号类型（`unsigned`）。
# 2. **符号扩展传送（Sign Extension）**：
#    - `movsbl`（字节转双字）, `movswl`（字转双字）, `movslq`（双字转四字）；
#    - 动作：将源操作数的最高位（符号位）复制填充到高位所有比特，从而保持有符号补码数值不变。
# 
# **专用符号扩展指令 `cltq`（Convert Long to Quad）**：
# - 无显式操作数，专门将 `%eax` 符号扩展填充满整个 64 位的 `%rax`；
# - 指令长度更短，实际执行效果与 `movslq %eax, %rax` 相同。


src_hash = '633fa423'
text = 'Instructions and conventions: behavior specified by the ISA, usage specified by the ABI'
# src: 指令与约定：ISA 规定的行为，ABI 规定的用法

['abi-isa.slide.1']
src_hash = 'faf4ecc4'
text = '''
**The ISA specifies the behavior of instructions**: `call` pushes the return address and rewrites `%rip`; `ret` pops the return address into `%rip`. The CPU carries out these actions when it executes the instructions, and the compiler cannot change them.

**The ABI specifies the use of registers and the stack**: where arguments and the return value go, which side saves a register, and that `%rsp` is a multiple of 16 when `call` executes. The compiler follows these rules when it generates instructions, and the CPU does not check them during execution.

**Two sets of conventions on the same CPU**: Linux and Windows use the same instructions with different calling conventions:
'''
# src:
# 
# **ISA 规定指令的行为**：`call` 压入返回地址并改写 `%rip`，`ret` 弹出返回地址写入 `%rip`。这些动作由 CPU 执行指令时完成，编译器不能改变。
# 
# **ABI 规定寄存器与栈的用法**：参数与返回值的位置，寄存器由哪一方保存，执行 `call` 时 `%rsp` 是 16 的倍数。这些规定由编译器生成指令时遵守，CPU 执行时不检查。
# 
# **同一种 CPU 上的两套约定**：Linux 与 Windows 使用相同的指令，调用规约不同：


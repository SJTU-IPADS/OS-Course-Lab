['insn-summary.title']
src_hash = '2d44f69c'
text = 'Instruction overview: a quick reference to the core machine-level instructions of this lecture, by category'
# src: 指令总览：本节核心机器级指令分类速查

['insn-summary.slide.1']
src_hash = 'e26e9b8b'
text = '''
**Quick-reference matrix of machine instructions**:
1. **Data movement and extension**:
   - `movb`, `movw`, `movl`, `movq` (general data movement; not two memory operands);
   - `movzbl`, `movzwl` (zero-extending moves);
   - `movsbl`, `movswl`, `movslq`, `cltq` (sign-extending moves);
   - `pushq`, `popq` (compound stack instructions); `leal`, `leaq` (load effective address / arithmetic).
2. **Arithmetic and logic operations**:
   - `addl`, `addq`, `subl`, `subq`, `imull`, `imulq` (basic integer arithmetic);
   - `incl`, `decl`, `negl`, `notl` (single-operand operations);
   - `andl`, `orl`, `xorl` (bitwise logic; `xorl` is used to clear registers efficiently);
   - `sall`/`shll`, `sarl`, `shrl`, `salq` (arithmetic and logical shifts).
'''
# src:
# 
# **机器指令全景速查矩阵**：
# 1. **数据传送与扩展**：
#    - `movb`, `movw`, `movl`, `movq`（通用数据传送，不可双内存操作数）；
#    - `movzbl`, `movzwl`（零扩展传送）；
#    - `movsbl`, `movswl`, `movslq`, `cltq`（符号扩展传送）；
#    - `pushq`, `popq`（栈操作复合指令）；`leal`, `leaq`（加载有效地址/算术运算）。
# 2. **算术与逻辑运算**：
#    - `addl`, `addq`, `subl`, `subq`, `imull`, `imulq`（基础整数算术）；
#    - `incl`, `decl`, `negl`, `notl`（单操作数运算）；
#    - `andl`, `orl`, `xorl`（位逻辑运算，`xorl` 用于高效寄存器清零）；
#    - `sall`/`shll`, `sarl`, `shrl`, `salq`（算术与逻辑移位）。


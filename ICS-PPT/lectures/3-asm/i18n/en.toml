['soft-hard.title']
src_hash = '850e6932'
text = 'Soft and hard constraints: ABI conventions and ISA semantics'
# src: 软约束与硬约束：ABI 约定与 ISA 语义

['soft-hard.slide.1']
src_hash = '1f25866d'
text = '''
**Soft constraints: the conventions of the ABI**:
- The order of the argument registers, the return value in `%rax`, and the division between caller-saved and callee-saved;
- The compiler follows these rules when it generates instructions, and the CPU does not check them during execution;
- If both sides of a call switch to another convention, arguments and return values are still passed as long as both sides agree.

**Hard constraints: the instruction semantics specified by the ISA**:
- `call` pushes the return address and rewrites `%rip`; `ret` pops the return address from the top of the stack into `%rip`;
- `pushq` and `popq` use `%rsp` as the stack pointer and subtract or add 8 to `%rsp` each time;
- The CPU carries out these behaviors when it executes the instructions, and neither the compiler nor the operating system can change them.

**The same CPU, different soft constraints**:
- Linux and Windows run on the same x86-64 CPU: the hard constraints are the same and the soft constraints differ;
- One side places arguments by its own convention and the other reads them from different registers, so programs of the two cannot call each other.
'''
# src:
# 
# **软约束：ABI 的约定**：
# - 参数寄存器的顺序，返回值放入 `%rax`，调用者保存与被调用者保存的分工；
# - 这些规定由编译器生成指令时遵守，CPU 执行时不检查；
# - 调用双方换用另一套约定，只要双方一致，参数与返回值照常传递。
# 
# **硬约束：ISA 规定的指令语义**：
# - `call` 压入返回地址并改写 `%rip`，`ret` 从栈顶弹出返回地址写入 `%rip`；
# - `pushq` 与 `popq` 以 `%rsp` 为栈顶指针，每次把 `%rsp` 减 8 或加 8；
# - 这些行为由 CPU 执行指令时完成，编译器与操作系统都无法改变。
# 
# **同一块 CPU，不同的软约束**：
# - Linux 与 Windows 运行在同一块 x86-64 CPU 上，硬约束相同，软约束不同；
# - 一方按自己的约定放置参数，另一方到别的寄存器中读取，二者的程序因此无法相互调用。

['soft-hard.notes.1']
src_hash = '668804c0'
text = '''
Soft constraints are written in the ABI document and followed by the compiler; hard constraints are written in the ISA manual and carried out by the CPU.
On x86-64, GCC provides __attribute__((ms_abi)), with which a function in a Linux program can be compiled and called by the Windows convention; this shows that the compiler chooses the convention.
'''
# src:
# 
# 软约束写在 ABI 文档中，由编译器遵守；硬约束写在 ISA 手册中，由 CPU 执行。
# GCC 在 x86-64 上提供 __attribute__((ms_abi))，同一个 Linux 程序中的函数可以按 Windows 的约定编译与调用，说明约定由编译器选择。

['win-abi.title']
src_hash = '2c9d3a66'
text = 'ABIs across platforms: the Linux and Windows x64 calling conventions compared'
# src: 跨平台 ABI：Linux 与 Windows x64 调用约定对比

['win-abi.slide.1']
src_hash = '0b247e3b'
text = '''
**Three core differences between the platform ABIs**:
1. **Different sets of integer argument registers**:
   - Linux (System V): the first 6 use `%rdi, %rsi, %rdx, %rcx, %r8, %r9`;
   - Windows (MS x64): the first 4 use `%rcx, %rdx, %r8, %r9`.
2. **Shadow space (Shadow Store / Home Space)**:
   - The Windows convention requires: before issuing `call`, the caller **must reserve 32 bytes (4 slots of 8 bytes) of free space at the top of the stack**, where the callee can spill the first 4 register arguments to the stack when necessary.
3. **Different responsibilities for preserving registers**:
   - On Linux, `%rsi` and `%rdi` are caller-saved;
   - On Windows, `%rsi` and `%rdi` are **callee-saved**.
'''
# src:
# 
# **跨平台 ABI 的三处核心差异**：
# 1. **整型参数寄存器集合不同**：
#    - Linux (System V)：前 6 个使用 `%rdi, %rsi, %rdx, %rcx, %r8, %r9`；
#    - Windows (MS x64)：前 4 个使用 `%rcx, %rdx, %r8, %r9`。
# 2. **影子空间（Shadow Store / Home Space）**：
#    - Windows 规范要求：调用者在发起 `call` 前，**必须在栈顶预留 32 字节（4 个 8 字节槽）的空闲空间**，供被调用者在必要时将前 4 个寄存器参数溢写存入栈中。
# 3. **寄存器保护职责差异**：
#    - 在 Linux 下，`%rsi` 与 `%rdi` 属于调用者保存（Caller-saved）；
#    - 在 Windows 下，`%rsi` 与 `%rdi` 属于**被调用者保存（Callee-saved）**。

['win-abi.notes.1']
src_hash = '2d68501c'
text = 'The core differences between Linux (System V) and Windows (Microsoft x64) in register assignment, shadow space and the responsibility for preserving registers.'

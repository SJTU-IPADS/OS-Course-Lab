['insn-summary-2.slide.1']
src_hash = '9134e0aa'
text = '''
3. **Comparison and branching**:
   - `cmpl`, `cmpq` (set the flags by subtraction); `testl`, `testq` (set the flags by AND);
   - `jmp` (unconditional jump, direct / indirect);
   - `jX` (conditional jumps: signed `jl/jle/jg/jge`, unsigned `jb/jbe/ja/jae`, zero `je/jne`);
   - `setX` (conditional set byte); `cmovX` (conditional move, removes a branch).
4. **Function calls and run-time safety**:
   - `call`, `ret` (push the return address and jump; pop it and resume);
   - `%fs:40`, `__stack_chk_fail@PLT` (canary protection against stack overflows).
5. **Vector computation (AVX2 extension)**:
   - `vmovdqu`, `vmovdqa` (unaligned / aligned 256-bit vector loads and stores);
   - `vpmulld`, `vpaddd` (parallel multiply and add of 32-bit integers in 8 lanes);
   - `vpxor` (clears a vector register).
'''
# src:
# 
# 3. **状态比较与分支跳转**：
#    - `cmpl`, `cmpq`（减法设置标志位）；`testl`, `testq`（与逻辑设置标志位）；
#    - `jmp`（无条件跳转，直接/间接）；
#    - `jX`（条件跳转：有符号 `jl/jle/jg/jge`，无符号 `jb/jbe/ja/jae`，零值 `je/jne`）；
#    - `setX`（条件设置字节）；`cmovX`（条件传送，消除分支）。
# 4. **函数调用与运行时安全**：
#    - `call`, `ret`（返回地址压栈跳转与出栈恢复）；
#    - `%fs:40`, `__stack_chk_fail@PLT`（金丝雀栈溢出保护）。
# 5. **向量计算（AVX2 扩展）**：
#    - `vmovdqu`, `vmovdqa`（非对齐/对齐 256 位向量加载与存储）；
#    - `vpmulld`, `vpaddd`（8 通道 32 位整数并行乘加）；
#    - `vpxor`（向量寄存器清零）。


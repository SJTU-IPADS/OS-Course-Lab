['canary.title']
src_hash = '6cc09ccc'
text = 'Stack protection: the canary value'
# src: 栈保护机制：金丝雀值

['canary.slide.1']
src_hash = '41cbe4c2'
text = '**On by default**: the overflow experiment above used `-fno-stack-protector`; recompiled without this option, the overflow of the same source program is detected before the return:'
# src:
# 
# **默认编译即开启**：前面的溢出实验使用了 `-fno-stack-protector`；去掉这个选项重新编译，同一份源程序的溢出在返回之前就被发现：

['canary.demo.1.name']
src_hash = '7649125a'
text = 'Recompile with stack protection on'
# src: 开启栈保护后重新编译

['canary.slide.2']
src_hash = '261beb6b'
text = '''
**How the stack canary protects the frame**:
1. **Written at the entry**: `movq %fs:40, %rax` reads a random value, different on every run, from thread-local storage, and `movq %rax, 40(%rsp)` stores it between the local array and the return address;
2. **Checked before returning**: `movq 40(%rsp), %rdx` and `subq %fs:40, %rdx` compare whether the value is still the same;
3. **Terminated if not equal**: when `jne` is taken, `call __stack_chk_fail@PLT` executes, and the process is terminated with exit code 134.
'''
# src:
# 
# **金丝雀值（Stack Canary）的防护机理**：
# 1. **入口写入**：`movq %fs:40, %rax` 从线程局部存储读取每次运行都不同的随机值，`movq %rax, 40(%rsp)` 把它存入局部数组与返回地址之间；
# 2. **返回前检验**：`movq 40(%rsp), %rdx` 与 `subq %fs:40, %rdx` 比较该值是否仍然相同；
# 3. **不相等则终止**：`jne` 成立时执行 `call __stack_chk_fail@PLT`，进程被终止，退出码 134。

['canary.notes.1']
src_hash = '5283b424'
text = '''
With stack protection on, the compiler places the arrays on the low-address side of the stack frame; the canary is at 40(%rsp) and the return address at 56(%rsp),
so an out-of-bounds write must rewrite the canary before it can reach the return address. The canary differs on every run, so getting past it undetected is difficult.
'''
# src:
# 
# 开启栈保护后编译器把数组放在栈帧的低地址一侧，金丝雀值位于 40(%rsp)，返回地址位于 56(%rsp)，
# 因此越界写入先改写金丝雀值，才能到达返回地址。金丝雀值每次运行都不同，越过它而不被发现是困难的。


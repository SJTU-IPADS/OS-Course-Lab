['call-ret.title']
src_hash = 'b0747890'
text = 'Function calls: the call and ret instructions of x86-64'
# src: 函数调用：x86-64 的 call 与 ret 指令

['call-ret.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['call-ret.slide.1']
src_hash = 'b21bdcf2'
text = '''
**Where the return address is kept**:
- The return address is part of the local state of a call; the most direct approach is to save it in the stack frame like local variables, and x86-64 takes this approach.

**Hardware micro-operations of `call Label`**:
1. Subtract 8 from `%rsp` and write the address of the instruction after `call` (the return address) to where `%rsp` points;
2. Jump to `Label`.

**Hardware micro-operations of `ret`**:
1. Read the return address at where `%rsp` points into `%rip`, and add 8 to `%rsp`;
2. Continue execution from the instruction after the call site.
'''
# src:
# 
# **返回地址的存放位置**：
# - 返回地址属于一次调用的局部状态，最直接的做法是与局部变量一样保存在栈帧中，x86-64 采用这种做法。
# 
# **`call Label` 的硬件微操作**：
# 1. `%rsp` 减 8，把 `call` 的下一条指令的地址（返回地址）写到 `%rsp` 所指处；
# 2. 跳转到 `Label`。
# 
# **`ret` 的硬件微操作**：
# 1. 把 `%rsp` 所指处的返回地址读入 `%rip`，`%rsp` 加 8；
# 2. 从调用点的下一条指令继续执行。

['call-ret.notes.1']
src_hash = 'ffa12c34'
text = '''
The return address is local state; the most direct approach is to place it in the stack frame like local variables, and call and ret on x86-64 write and read it.
Step 1 of call is the same as pushq, and step 1 of ret is the same as popq into %rip; push and pop are introduced with register saving.
'''
# src:
# 
# 返回地址是局部状态，最直接的做法是与局部变量一样放在栈帧中，x86-64 的 call 与 ret 负责它的写入与读出。
# call 的第 1 步与 pushq 相同，ret 的第 1 步与 popq 到 %rip 相同；push 与 pop 在寄存器保存时介绍。

['param-state.title']
src_hash = '174a8521'
text = 'Passing arguments: arguments are local state too'
# src: 参数传递：参数也是局部状态

['param-state.slide.1']
src_hash = '5e09b0c2'
text = '''
**Arguments change from call to call**:
- Each call of the same function can pass different actual arguments, for example `dot_product(w, x, 4)` and `dot_product(w, y, 8)`;
- The formal parameters of a C function are its local variables: they take the values of the actual arguments when the call starts and are released when the call returns;
- Arguments are therefore also part of the local state of a function call.

**The most direct approach: all arguments on the stack**:
- Like local variables and the return address, the caller writes the actual arguments onto the stack before `call`, and the callee reads them at offsets relative to `%rsp`.

**Memory access cost and passing arguments in registers**:
- A register is accessed within a single cycle; a memory access goes through address translation and then the cache, with a higher latency than a register;
- The callee almost always reads its arguments; with all arguments on the stack, every call must first write them and then read them back;
- The x86-64 calling convention therefore passes the first few arguments in registers and uses the stack only when there are not enough registers.
'''
# src:
# 
# **参数随调用变化**：
# - 同一函数每次被调用时，传入的实参可以不同，例如 `dot_product(w, x, 4)` 与 `dot_product(w, y, 8)`；
# - C 语言的形参是函数的局部变量：调用开始时取得实参的值，调用返回时释放；
# - 因此参数同样属于一次函数调用的局部状态。
# 
# **最直接的做法：参数全部放在栈中**：
# - 与局部变量和返回地址一样，调用者在 `call` 之前把实参写入栈，被调用者按相对 `%rsp` 的偏移读取。
# 
# **访存开销与寄存器传参**：
# - 寄存器在单周期内完成访问；访存要经过地址转换再访问缓存，延迟高于寄存器；
# - 被调用者几乎一定会读取自己的参数，参数全部放在栈中，每次调用都要先写入再读出；
# - 因此 x86-64 的调用规约用寄存器传递前几个参数，寄存器不够时才使用栈。

['param-state.notes.1']
src_hash = '3fe9540f'
text = '''
Arguments, like local variables and the return address, are allocated and released with each call, and the most direct approach is to put them all on the stack.
The cdecl convention of 32-bit x86 does put all arguments on the stack; x86-64 passes arguments in registers instead, which reduces the memory accesses of each call.
Even on an L1 data cache hit, a memory access has a latency of several cycles.
'''
# src:
# 
# 参数与局部变量、返回地址一样随调用分配与释放，最直接的做法是全部放在栈中。
# 32 位 x86 的 cdecl 约定即把全部参数放在栈中；x86-64 改为寄存器传参，减少每次调用的访存。
# 即使命中 L1 数据缓存，一次访存的延迟也有数个周期。

['sysv-abi.title']
src_hash = 'ab93af75'
text = 'Calling convention: the System V AMD64 ABI'
# src: 调用规约：System V AMD64 ABI 约定

['sysv-abi.slide.1']
src_hash = '4e2134a1'
text = '''
**Application binary interface (ABI)**:
- The complete set of low-level rules that specify how binary modules generated by different compilers work together.

**Passing integer and pointer arguments (the first 6 are assigned registers in order)**:
- The order is fixed: `%rdi, %rsi, %rdx, %rcx, %r8, %r9`.

**Passing the return value**:
- It is placed in the `%rax` family, by width `%al` (char), `%ax` (short), `%eax` (int), `%rax` (long / pointer).

**Passing more than 6 arguments on the stack**:
- If there are more than 6 arguments, the caller pushes argument 7 and later onto the stack in right-to-left order before issuing `call`;
- At the entry of the called function, argument 7 is just above the top of the stack at offset `8(%rsp)`, and argument 8 is at `16(%rsp)` (`0(%rsp)` holds the return address).
'''
# src:
# 
# **应用二进制接口（ABI: Application Binary Interface）**：
# - 规定不同编译器生成的二进制模块之间如何协同工作的全套底层协议。
# 
# **整型与指针参数传递（前 6 个按序分配寄存器）**：
# - 顺序固定为：`%rdi, %rsi, %rdx, %rcx, %r8, %r9`。
# 
# **返回值传递规范**：
# - 存放在 `%rax` 体系中，按宽度取 `%al` (char), `%ax` (short), `%eax` (int), `%rax` (long / 指针)。
# 
# **超过 6 个参数的栈传递规范**：
# - 若参数多于 6 个，参数 7 及以后由调用者在发起 `call` 之前按从右向左顺序压入栈中；
# - 被调用函数入口处，参数 7 位于栈顶偏上偏移 `8(%rsp)`，参数 8 位于 `16(%rsp)`（`0(%rsp)` 存放返回地址）。


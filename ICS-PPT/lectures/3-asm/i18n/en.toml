['extension-example.slide.3']
src_hash = 'ac6652f7'
text = '''
**Instructions chosen by the compiler**: each of the two promotions is carried out by one extending move instruction; whether the sign bit or 0 is filled in is decided by the original type.
- The type of `a` is `signed char`, so the compiler chooses the sign-extending instruction `movsbl`;
- The type of `b` is `unsigned char`, so the compiler chooses the zero-extending instruction `movzbl`;
- When the bytes of both arguments are `0xF0`, `%edi` is $-16$ and `%esi` is $240$, and the comparison reports that they are not equal.
'''

['jump-encoding.title']
src_hash = 'b51ae0b0'
text = 'Jump instructions: direct jumps, indirect jumps and PC-relative encoding'
# src: 跳转指令：直接跳转、间接跳转与 PC 相对编码

['jump-encoding.slide.1']
src_hash = '8ef04d1b'
text = '''
**Changing the direction of execution**: the program flow jumps when the value of the `%rip` register is rewritten.

**Two forms of unconditional jump**:
1. **Direct jump**:
   - Syntax: `jmp Label`;
   - The target address is determined at compile and assembly time and encoded directly as part of the instruction;
2. **Indirect jump**:
   - Syntax: `jmp *%rax` (reads the target address from a register) or `jmp *(%rax)` (reads the target address from memory);
   - Purpose: provides the hardware basis for C function pointers, polymorphic virtual function dispatch, switch jump tables and the `ret` return instruction.
'''
# src:
# 
# **改变执行方向**：通过改写 `%rip` 寄存器的数值实现程序流跳转。
# 
# **无条件跳转的两类形式**：
# 1. **直接跳转（Direct Jump）**：
#    - 语法：`jmp Label`；
#    - 目标地址在编译汇编时已确定，作为指令的一部分直接编码；
# 2. **间接跳转（Indirect Jump）**：
#    - 语法：`jmp *%rax`（从寄存器读取目标地址）或 `jmp *(%rax)`（从内存读取目标地址）；
#    - 作用：为 C 语言函数指针、多态虚函数分发、switch 跳转表及 `ret` 返回指令提供硬件基础。


['memory-wall.slide.1']
src_hash = '516ecd18'
text = '''
**The memory wall**: once the multiply-add rate reaches the bandwidth limit of $1.0 \times 10^{11}$ /s, neither more threads nor fewer instructions raise the rate any further; this limit is called the memory wall.

**The loop of the `#ifdef __AVX2__` branch in `matvec_q4.c`, which processes 32 bytes of weights (64 weights) per iteration**:
'''
# src:
# 
# **访存墙**：乘加速率达到带宽上限 $1.0 \times 10^{11}$ 次/s 之后，增加线程数、减少指令条数都不再提高速率，这个上限称为访存墙。
# 
# **`matvec_q4.c` 中 `#ifdef __AVX2__` 分支的循环，每轮处理 32 字节权重（64 个权重）**：

['memory-wall.notes.1']
src_hash = '0e2f2d6e'
text = 'Each byte of low4 is 15, each 16-bit element of ones is 1, and acc holds 8 32-bit sums, cleared before the loop.'
# src:
# 
# low4 的每个字节是 15，ones 的每个 16 位元素是 1，acc 是 8 个 32 位累加和，循环之前清零。

['memory-wall-2.title']
src_hash = 'c145b19b'
text = 'Measuring the memory wall: the AVX2 version of the matrix-vector multiplication'
# src: 访存墙实测：AVX2 版本的矩阵向量乘

['memory-wall-2.slide.1']
src_hash = 'cfb40eaa'
text = '''
**The vector instructions in the loop**:
- `vpand` and `vpsrlw` (`_mm256_srli_epi16`) extract 32 low 4-bit values and 32 high 4-bit values from the 32 bytes;
- One `vpmaddubsw` (`_mm256_maddubs_epi16`) performs 32 multiplications of an unsigned 8-bit number by a signed 8-bit number and adds adjacent pairs of products, giving 16 16-bit sums;
- `vpmaddwd` (`_mm256_madd_epi16`) multiplies the 16-bit sums by a vector of all ones and adds adjacent pairs, giving 8 32-bit sums.

**Instructions per multiply-add**:
- The compiled loop body has 13 instructions and performs 64 multiply-adds per iteration, an average of about 0.2 instructions per multiply-add; the scalar version needs 8;
- The stored value $q$ takes part in the multiplication directly: $\sum (q - 8)x = \sum qx - 8\sum x$, where $8\sum x$ is subtracted only once per row.

**Multiple threads**: the loop of `matvec` is preceded by `#pragma omp parallel for`, so the rows of $W$ are divided among several threads; the first argument of the program is the number of threads.
'''
# src:
# 
# **循环中的向量指令**：
# - `vpand` 与 `vpsrlw`（`_mm256_srli_epi16`）从 32 字节中拆出 32 个低 4 位与 32 个高 4 位；
# - `vpmaddubsw`（`_mm256_maddubs_epi16`）一条完成 32 次无符号 8 位数与有符号 8 位数的乘法，相邻两个乘积相加，得到 16 个 16 位和；
# - `vpmaddwd`（`_mm256_madd_epi16`）把 16 位和与全 1 向量相乘，相邻两个相加，得到 8 个 32 位和。
# 
# **每次乘加的指令条数**：
# - 编译得到的循环体共 13 条指令，每轮完成 64 次乘加，平均每次乘加约 0.2 条，标量版本是 8 条；
# - 存储值 $q$ 直接参与乘法：$\sum (q - 8)x = \sum qx - 8\sum x$，其中 $8\sum x$ 每行只减一次。
# 
# **多线程**：`matvec` 的循环前有 `#pragma omp parallel for`，$W$ 的各行分给多个线程计算，程序的第一个参数是线程数。

['memory-wall-2.notes.1']
src_hash = '5c90f1b9'
text = '''
The 13 instructions are taken from objdump -d matvec_avx2: vmovdqu, vpsrlw, vpand × 2, vpmaddubsw × 2, vpaddw, vpmaddwd, vpaddd, vmovdqa, add, cmp, jne. The two vpmaddubsw read the activations directly from memory.
q is between 0 and 15 and the activations are between -128 and 127, so the sum of the results of the two vpmaddubsw has an absolute value of at most 4 × 15 × 128 = 7680, and 16 bits do not overflow.
'''
# src:
# 
# 13 条指令取自 objdump -d matvec_avx2：vmovdqu、vpsrlw、vpand × 2、vpmaddubsw × 2、vpaddw、vpmaddwd、vpaddd、vmovdqa、add、cmp、jne。两条 vpmaddubsw 直接从内存读取激活值。
# q 在 0 到 15 之间，激活值在 -128 到 127 之间，两条 vpmaddubsw 的结果相加后绝对值不超过 4 × 15 × 128 = 7680，16 位不会溢出。


['problem.slide.1']
src_hash = 'ce965b48'
text = '- Much of the computation in model inference is matrix multiplication, for example the dot product of $w$ and $x$; the inference program `ollama` organizes and carries out these computations. When inference runs on the CPU, the dot product can be computed by accumulating in a simple `for` loop. The CPU knows neither for nor the dot product: how is the code executed?'

['lea-agu-fig.slide.2']
src_hash = 'c820e52a'
text = '**Answer**: $0x2000 + 3 \times 4 + 8 = 0x2000 + 0xC + 0x8 = 0x2014$ ($12 + 8 = 20 = \text{0x14}$).'
# src:

['switch-table-2.notes.1']
src_hash = '782c1825'
text = '''
The first sed expression keeps the .quad lines, and asm.sed deletes the other assembler directives; sed -n '1,12p' takes only the entry and the jump table, after which come the six blocks of case code, each ending with ret.
-fno-pie makes the jump table hold absolute addresses directly; the default PIE compilation stores relative offsets, the entry has two more instructions, and the indirect jump is written as jmp *%rax.
'''
# src:
# 
# sed 的第一个表达式保留 .quad 行，asm.sed 删去其余伪指令；sed -n '1,12p' 只取入口与跳转表，其后是六段 case 代码，各自以 ret 结束。
# -fno-pie 使跳转表中直接存放绝对地址；默认的 PIE 编译存放的是相对偏移，入口多两条指令，间接跳转写为 jmp *%rax。

['switch-table-3.title']
src_hash = '168a4a29'
text = 'The switch statement: jump table and indirect jump'
# src: switch 语句：跳转表与间接跳转

['switch-table-3.slide.1']
src_hash = 'dd13f0d0'
text = '''
- **Range check**: `cmpl $5, %edi` and `ja .L10`; when `op` is outside 0 to 5, jump to `return 0`. The comparison is unsigned, so a negative number is treated as a very large one, and one comparison rules out both negative and too-large values;
- **Fetching the entry**: `movl %edi, %edi` zero-extends `op` into a 64-bit index, and `jmp *.L4(,%rdi,8)` reads the address from entry `op` and writes it to `%rip`;
- **Why an indirect jump**: the target varies with `op`, which a direct jump cannot express. Compared with comparing one by one (up to 6 `cmpl` and `je`), the jump table does it with one comparison, one memory access and one jump, and the execution time does not depend on the number of cases.
'''
# src:
# 
# - **范围检查**：`cmpl $5, %edi` 与 `ja .L10`，`op` 不在 0 到 5 之间时跳到 `return 0`；按无符号比较，负数被视为很大的数，一次比较同时排除负数与过大的值；
# - **取表项**：`movl %edi, %edi` 把 `op` 零扩展为 64 位下标，`jmp *.L4(,%rdi,8)` 从第 `op` 项读出地址，写入 `%rip`；
# - **为什么是间接跳转**：目标随 `op` 变化，直接跳转表示不了。与逐一比较相比（最多 6 次 `cmpl` 与 `je`），跳转表用一次比较、一次访存与一次跳转完成，执行时间与 case 的个数无关。

['switch-table-3.notes.1']
src_hash = '092c13ea'
text = '''
The 6 entries of the jump table .L4 are written into the read-only data section by the assembler; entry op holds the address of the code of case op. The zero extension by movl %edi, %edi follows the width rule of Part 1.
When the case values are sparse or few, the compiler still compares one by one; for consecutive cases gcc generates a jump table once the number of cases reaches about 5.
'''
# src:
# 
# 跳转表 .L4 的 6 个项由汇编器写入只读数据段，第 op 项存放 case op 的代码的地址；movl %edi, %edi 零扩展的依据是第一部分的位宽规则。
# case 的值稀疏或个数少时，编译器仍用逐一比较；gcc 对连续的 case 在 case 数达到 5 个左右时生成跳转表。

['cmov.title']
src_hash = 'ec6df4ba'
text = 'Sidebar: the conditional move cmov and the set instruction setX'
# src: sidebar：条件传送 cmov 与条件设置 setX

['cmov.slide.1']
src_hash = 'a9d55590'
text = '''
**Two more kinds of instruction besides conditional jumps read the flags**:

**Set instruction `setX D`**: sets the single-byte destination `D` to 0 or 1 according to the flags. In the assembly of `equal` in Part 1, the `sete %al` after `cmpl %esi, %edi` writes "equal" into `%al`, and `movzbl %al, %eax` then extends it into the return value.

**Conditional move instruction `cmovX S, D`** (Conditional Move):
- When the condition holds, copies `S` to `D`; otherwise `D` keeps its value;
- The two candidate values are first placed in registers, and `cmovX` selects one of them according to the flags; the instruction sequence contains no jump instruction and no label.

**Example**: `int max(int a, int b) { int v = a; if (a < b) v = b; return v; }`
- `gcc -Og` implements the selection with the conditional jump `jl`;
- `gcc -O2` uses `cmovge` instead, with one jump instruction fewer.
'''
# src:
# 
# **读取标志位的指令除条件跳转外还有两类**：
# 
# **条件设置指令 `setX D`**：按标志位把单字节目标 `D` 置为 0 或 1。第一部分 `equal` 的汇编中，`cmpl %esi, %edi` 之后的 `sete %al` 把"相等"写入 `%al`，`movzbl %al, %eax` 再扩展为返回值。
# 
# **条件传送指令 `cmovX S, D`**（Conditional Move）：
# - 条件成立时把 `S` 复制到 `D`，否则 `D` 保持原值；
# - 两个候选值先分别放入寄存器，`cmovX` 依据标志位选出其中一个，指令序列中没有跳转指令与标号。
# 
# **示例**：`int max(int a, int b) { int v = a; if (a < b) v = b; return v; }`
# - `gcc -Og` 用条件跳转 `jl` 实现选择；
# - `gcc -O2` 改用 `cmovge`，少了一条跳转指令。

['cmov.notes.1']
src_hash = 'f020ac71'
text = '''
Extension material. The X of setX and cmovX is the same as the X of the conditional jumps: e, ne, l, le, g, ge, b, a and so on.
cmov has the advantage when both candidate values are already computed and the selection itself is simple; Lecture 4 explains the effect of jump instructions on the pipeline.
'''
# src:
# 
# 拓展内容。setX 与 cmovX 的 X 与条件跳转的 X 相同：e、ne、l、le、g、ge、b、a 等。
# cmov 在候选值都已算出、选择本身很简单时有优势；第四讲说明跳转指令对流水线的影响。


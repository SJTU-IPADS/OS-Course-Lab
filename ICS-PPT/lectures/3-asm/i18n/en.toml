['ymm.slide.1']
src_hash = 'ac71452f'
text = '''
**The SIMD (Single Instruction, Multiple Data) execution model**:
- The control unit of the processor executes one vector instruction, and several parallel arithmetic lanes perform the same operation on the independent data elements of the vector at the same time.

**The x86-64 YMM registers**:
- The hardware provides 16 256-bit vector registers: `%ymm0` ~ `%ymm15`;
- **Backward-compatible mapping**: the low 128 bits of each `%ymm` register are mapped to the `%xmm` register of the same name;
- A single 256-bit `%ymm` register can hold at once:
  - **8 32-bit integers (int32)** $\leftarrow$ the `dot_product` of this section;
  - or 8 single-precision floating-point numbers (float32);
  - or 4 64-bit integers / double-precision floating-point numbers;
  - or 32 8-bit integers (int8 / characters).
'''
# src:
# 
# **SIMD（Single Instruction, Multiple Data）执行模型**：
# - 处理器控制单元执行一条向量指令，多个并行算术通道同时对向量中的各个独立数据分量执行相同的操作。
# 
# **x86-64 YMM 寄存器体系**：
# - 硬件提供 16 个 256 位宽度的向量寄存器：`%ymm0` ~ `%ymm15`；
# - **向下兼容映射**：每个 `%ymm` 寄存器的低 128 位映射为同名的 `%xmm` 寄存器；
# - 单个 256 位 `%ymm` 寄存器可同时封装容纳：
#   - **8 个 32 位整数（int32）** $\leftarrow$ 本节的 `dot_product`；
#   - 或 8 个单精度浮点数（float32）；
#   - 或 4 个 64 位整数/双精度浮点数；
#   - 或 32 个 8 位整数（int8 / 字符）。


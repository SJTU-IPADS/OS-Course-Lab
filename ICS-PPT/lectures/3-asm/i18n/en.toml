['cuda-build.slide.1']
src_hash = 'cbf4e551'
text = '''
**`nvcc` divides the code of a `.cu` file into two parts**:
- **Host code** (`main` and the other ordinary functions): compiled by gcc into x86-64 instructions and executed on the CPU;
- **Device code** (the `__global__` functions): compiled into GPU instructions and placed in the executable as data; at run time the CUDA runtime library loads it into the GPU.
'''
# src:
# 
# **`nvcc` 把 `.cu` 文件中的代码分为两部分**：
# - **主机端代码**（`main` 等普通函数）：由 gcc 编译为 x86-64 指令，在 CPU 上执行；
# - **设备端代码**（`__global__` 函数）：编译为 GPU 的指令，作为数据放入可执行文件，运行时由 CUDA 运行库装入 GPU。


['loop-asm-2.slide.1']
src_hash = '1c989262'
text = '''
- **`jl .L3`, conditional jump**: when `i < n`, writes the address of `.L3` into `%rip` in place of `%rip + instruction length`, and the execution flow returns to the start of the loop body; otherwise `%rip` is incremented as usual, the two instructions after `jl` execute, and `sum` is returned;
- **`jmp .L2`, unconditional jump**: jumps to `.L2` before entering the loop, so the comparison comes first and decides whether the loop body executes; when `n` is 0 the loop body does not execute at all.

**Question**: the operand of `jl` is only a label; where does the result of the comparison `i < n` come from?
'''
# src:
# 
# - **`jl .L3`，条件跳转**：`i < n` 时把 `.L3` 的地址写入 `%rip`，代替 `%rip + 指令长度`，执行流回到循环体开头；否则 `%rip` 照常递增，执行 `jl` 之后的两条指令，返回 `sum`；
# - **`jmp .L2`，无条件跳转**：进入循环前跳到 `.L2`，先比较，再决定是否执行循环体；`n` 为 0 时循环体一次也不执行。
# 
# **问题**：`jl` 的操作数只有一个标号，`i < n` 的比较结果从哪里来？

['loop-asm-2.notes.1']
src_hash = 'c7466b74'
text = '''
A jump instruction writes the address of the target label into %rip. After every other instruction %rip is still incremented by the length; only jump instructions rewrite it.
Against dot.c: jl .L3 corresponds to the condition i < n of the for statement, and jmp .L2 to the condition check before the loop is entered for the first time.
jl reads the flags left by cmpl; the next pages explain the flags and the cmp and test instructions, then return to conditional jump instructions such as jl.
'''
# src:
# 
# 跳转指令把目标标号的地址写入 %rip。其余指令执行后 %rip 仍按长度递增，只有跳转指令改写它。
# 对照 dot.c：jl .L3 对应 for 的条件 i < n，jmp .L2 对应第一次进入循环前的条件检查。
# jl 读取的是 cmpl 留下的标志位，下面几页说明标志位、cmp 与 test 指令，再回到 jl 这一类条件跳转指令。

['jump-insn.title']
src_hash = 'f7d09572'
text = 'Jump instructions: how jmp and jl rewrite %rip'
# src: 跳转指令：jmp 与 jl 如何改写 %rip

['jump-insn.slide.1']
src_hash = '7c9fc09a'
text = '''
**Unconditional jump `jmp Label`**:
- On execution, writes the address of `Label` into `%rip`; the next instruction executed is the one at `Label`;
- There is no condition, and the jump is always taken; the instruction itself modifies only the PC register `%rip`.

**Conditional jump `jl Label`** (jump if less):
- When the condition holds, it behaves the same as `jmp Label`; when the condition does not hold, `%rip` is incremented by the instruction length and the next instruction executes;
- The condition comes from the most recent arithmetic or compare instruction: `cmpl %edx, %eax` computes `%eax - %edx` and records the properties of the result in the flags of the CPU; `jl` reads the flags to decide whether `%eax < %edx` holds.

**Question**: which properties of the result do the flags record? How does `cmpl` set them?
'''
# src:
# 
# **无条件跳转 `jmp Label`**：
# - 执行时把 `Label` 的地址写入 `%rip`，下一条执行的指令即 `Label` 处的指令；
# - 没有条件，总是跳转；指令本身仅修改 PC `%rip` 寄存器。
# 
# **条件跳转 `jl Label`**（jump if less）：
# - 条件成立时与 `jmp Label` 相同；条件不成立时 `%rip` 按指令长度递增，执行下一条指令；
# - 条件来自最近的一条算术或比较指令：`cmpl %edx, %eax` 计算 `%eax - %edx`，把结果的特征记录在 CPU 的标志位中，`jl` 读取标志位判断 `%eax < %edx` 是否成立。
# 
# **问题**：标志位记录结果的哪些特征？`cmpl` 如何设置它们？

['jump-insn.notes.1']
src_hash = 'b83812f3'
text = 'A jump instruction is an ordinary instruction, the same as a data-move or arithmetic instruction: fetch, execute, update %rip. The only difference is the way %rip is updated.'
# src:
# 
# 跳转指令与数据传送、算术指令一样是一条普通的指令：取指、执行、更新 %rip。区别只在更新 %rip 的方式。

['rflags.title']
src_hash = 'e3b4a79d'
text = 'Flags: properties of the result recorded in the RFLAGS register'
# src: 标志位：运算结果的特征记录在 RFLAGS 寄存器中

['rflags.slide.1']
src_hash = '6cfe6b73'
text = '''
**Flags (condition codes, single bits in the RFLAGS register)**: record properties of the result of the most recent arithmetic or logic operation:
- **ZF (Zero Flag)**: set to 1 when the result is 0;
- **SF (Sign Flag)**: set to 1 when the result is negative (its most significant bit is 1);
- **CF (Carry Flag)**: set to 1 when the most significant bit produces a carry or a borrow, that is, when the result overflows interpreted as an unsigned number;
- **OF (Overflow Flag)**: set to 1 when the result overflows interpreted as a two's-complement signed number. For addition: the two addends have the same sign (both positive or both negative) and the sign of the sum is the opposite of theirs.

**The flags are set as a side effect of arithmetic instructions**: `addl %ecx, %r9d` sets the four flags while it writes the result back; the program contains no separate instruction that sets the flags.
'''
# src:
# 
# **标志位（条件码，RFLAGS 寄存器中的单个比特）**：记录最近一次算术或逻辑运算结果的特征：
# - **ZF（Zero Flag）**：结果为 0 时置 1；
# - **SF（Sign Flag）**：结果为负数（最高位为 1）时置 1；
# - **CF（Carry Flag）**：最高位产生进位或借位时置 1，即按无符号数解释时溢出；
# - **OF（Overflow Flag）**：按补码有符号数解释时溢出置 1。以加法为例：两个加数同号（同正或同负），和的符号与它们相反。
# 
# **标志位由运算指令顺带设置**：`addl %ecx, %r9d` 在写回结果的同时设置四个标志位，程序中没有单独设置标志位的指令。

['rflags.notes.1']
src_hash = '45b706af'
text = 'The definitions of the flags ZF, SF, CF and OF. Every arithmetic instruction sets them while it writes back its result, and conditional jump instructions read them.'
# src: 标志位 ZF、SF、CF、OF 的定义。每条算术指令在写回结果的同时设置它们，条件跳转指令读取它们。

['rflags-2.title']
src_hash = 'e3b4a79d'
text = 'Flags: properties of the result recorded in the RFLAGS register'
# src: 标志位：运算结果的特征记录在 RFLAGS 寄存器中

['rflags-2.slide.1']
src_hash = '0305e1cd'
text = '''
**How each kind of instruction affects the flags**:
- Arithmetic and logic instructions (`add`, `sub`, `imul`, `and`, `or`, `xor`) update the flags according to the result;
- `lea` and `mov` only move addresses and data, and **change no flags**;
- `inc` / `dec` update ZF, SF and OF, and **leave CF unchanged**;
- Logic instructions (`and` / `or` / `xor` / `test`) clear CF and OF after executing.

**The difference between CF and OF, with 8-bit binary addition as the example**:
- `0xFF + 0x01 = 0x00`: unsigned $255+1=256$ overflows (CF=1); signed $-1+1=0$ does not overflow (OF=0);
- `0x7F + 0x01 = 0x80`: unsigned $127+1=128$ does not overflow (CF=0); signed $127+1=-128$, two positive numbers add up to a negative number, an overflow (OF=1).
'''
# src:
# 
# **各类指令对标志位的影响**：
# - 算术与逻辑指令（`add`、`sub`、`imul`、`and`、`or`、`xor`）按结果更新标志位；
# - `lea` 与 `mov` 只传送地址与数据，**不改变任何标志位**；
# - `inc` / `dec` 更新 ZF、SF、OF，**保留 CF 不变**；
# - 逻辑指令（`and` / `or` / `xor` / `test`）执行后把 CF 与 OF 清零。
# 
# **CF 与 OF 的区别，以 8 位二进制加法为例**：
# - `0xFF + 0x01 = 0x00`：无符号 $255+1=256$ 溢出（CF=1）；有符号 $-1+1=0$ 无溢出（OF=0）；
# - `0x7F + 0x01 = 0x80`：无符号 $127+1=128$ 无溢出（CF=0）；有符号 $127+1=-128$，两个正数相加得到负数，溢出（OF=1）。

['rflags-2.notes.1']
src_hash = '3fd999ad'
text = 'The same addition sets CF and OF at the same time: CF reports overflow under the unsigned interpretation, and OF reports overflow under the signed interpretation. The difference in type shows in which flag the following conditional jump instruction reads.'
# src: 同一次加法同时设置 CF 与 OF：CF 按无符号解释判断溢出，OF 按有符号解释判断溢出。类型的区别由随后的条件跳转指令读取哪一个标志位体现。

['cmp-test.title']
src_hash = 'ba63fdf2'
text = 'Compare instructions: cmp and test only set the flags'
# src: 比较指令：cmp 与 test 只设置标志位

['cmp-test.slide.1']
src_hash = 'c26410d2'
text = '''
**Compare instruction `cmpl S2, S1`**:
- Computes $S1 - S2$ and sets ZF, SF, CF and OF according to the difference; **the difference itself is discarded, and both operands keep their values**;
- `cmpl %edx, %eax` computes `i - n`: SF=1 when the difference is negative, and ZF=1 when the difference is 0.

**Test instruction `testl S2, S1`**:
- Computes the bitwise AND $S1 \ \& \ S2$ and sets ZF and SF according to the result, and clears CF and OF; **the result is discarded**;
- `testl %edx, %edx`: the bitwise AND of `n` with itself is still `n`, so ZF tells whether `n` is 0, and SF tells whether `n` is negative.
'''
# src:
# 
# **比较指令 `cmpl S2, S1`**：
# - 计算 $S1 - S2$，按差设置 ZF、SF、CF、OF；**差本身丢弃，两个操作数保持原值**；
# - `cmpl %edx, %eax` 计算 `i - n`：差为负则 SF=1，差为 0 则 ZF=1。
# 
# **测试指令 `testl S2, S1`**：
# - 计算 $S1 \ \& \ S2$ 的按位与，按结果设置 ZF 与 SF，CF 与 OF 清零；**结果丢弃**；
# - `testl %edx, %edx`：`n` 与自身按位与仍是 `n`，于是 ZF 表示 `n` 是否为 0，SF 表示 `n` 是否为负。

['cmp-test.notes.1']
src_hash = '190a1554'
text = 'cmp and test are a subtraction and a bitwise AND that only set the flags. Comparing two numbers is subtracting them and looking at the sign of the difference and whether it is zero.'
# src: cmp 与 test 是只设置标志位的减法与按位与。比较两个数就是做减法看差的符号与是否为零。


['visible-state.slide.1']
src_hash = '1fd74ef1'
text = '''
**Programmer-visible state**:
- All the hardware entities that the instruction set architecture exposes directly to software and that instructions can read and modify:
  - **Program counter (PC / `%rip`)**: holds the virtual address of the next instruction to fetch and execute;
  - **General-purpose register file**: 16 64-bit high-speed storage units;
  - **Condition flags register (RFLAGS)**: holds the status of the most recent arithmetic or logic operation;
  - **Virtual memory space**: code, global variables and stack memory, accessed over the address bus.
'''
# src:
# 
# **程序员可见状态（Programmer-Visible State）**：
# - 指令集架构直接暴露给软件程序、能够被指令读取和修改的全部硬件实体：
#   - **程序计数器（PC / `%rip`）**：存放下一条取指执行指令的虚拟地址；
#   - **通用寄存器堆（Register File）**：16 个 64 位高速存储单元；
#   - **条件标志位寄存器（RFLAGS）**：存放最近一次算术逻辑运算的状态结果；
#   - **虚拟内存空间**：通过地址总线访问的代码、全局变量与栈内存。


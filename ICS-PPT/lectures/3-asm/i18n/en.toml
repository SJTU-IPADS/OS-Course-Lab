['movl-load.title']
src_hash = '6073ac28'
text = 'Loading data: the memory-read semantics and constraints of the movl instruction'
# src: 数据加载：movl 指令的内存读取语义与约束

['movl-load.slide.1']
src_hash = '499daf68'
text = '''
**Load instruction**: `movl` (Move Longword, 32 bits)

**Semantics in detail**:
- Instruction format: `mov S, D` takes two operands and copies the value of the source operand S to the destination operand D (in AT&T syntax the source comes first and the destination second).
- Each operand is one of three kinds: an immediate (`$Imm`), a register (`r_a`), or a memory operand (such as `(r_a)`, whose effective address is computed by the addressing mode).
- Example `movl (%rsi), %eax`:
  - Source operand: the memory operand `(%rsi)` (reads the first element `x[0]`)
  - Destination operand: the general-purpose register `%eax`

**Execution**:
- The address goes to the memory access unit and, after address translation, accesses the cache or memory.
- The 32 bits of data read are stored in `%eax`, and the upper 32 bits of the 64-bit register that contains it are cleared automatically.
'''
# src:
# 
# **加载指令**：`movl`（Move Longword，32 位）
# 
# **语义解剖**：
# - 指令格式：`mov S, D`，带两个操作数，把源操作数 S 的值复制到目的操作数 D（AT&T 语法中源在前、目的在后）。
# - 每个操作数属于以下三类之一：立即数（`$Imm`）、寄存器（`r_a`）、内存操作数（如 `(r_a)`，按寻址模式计算有效地址）。
# - 例子 `movl (%rsi), %eax`：
#   - 源操作数：内存操作数 `(%rsi)`（读取首元素 `x[0]`）
#   - 目的操作数：通用寄存器 `%eax`
# 
# **执行过程**：
# - 地址送到访存单元，经地址转换后访问缓存或内存。
# - 读取出的 32 位数据存入 `%eax`，其所在 64 位寄存器的高 32 位自动清零。


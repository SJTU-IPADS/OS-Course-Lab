['call-sequence.title']
src_hash = 'ff0484d5'
text = 'Putting it together: the complete steps of one call'
# src: 综合起来：一次调用的完整步骤

['call-sequence.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['call-sequence.slide.1']
src_hash = '9fa98a1e'
text = '''
**The caller, before the call**:
1. Save the caller-saved registers still needed after the call;
2. Push the arguments from the 7th on onto the stack, from right to left;
3. Put the first 6 arguments into registers;
4. `call`: push the return address and jump to the callee.

**The callee**:

5. `pushq`: save the callee-saved registers it will use;
6. `subq`: decrease `%rsp` to allocate the local variables;
7. Execute the function body and put the return value into `%rax`;
8. `addq`: increase `%rsp` to free the local variables;
9. `popq`: restore the callee-saved registers;
10. `ret`: pop the return address and return to the caller.
'''
# src:
# 
# **调用者，在调用之前**：
# 1. 保存调用后还要用的调用者保存寄存器；
# 2. 第 7 个起的参数从右向左压入栈；
# 3. 前 6 个参数放入寄存器；
# 4. `call`：压入返回地址，跳到被调用者。
# 
# **被调用者**：
# 
# 5. `pushq`：保存要用的被调用者保存寄存器；
# 6. `subq`：减小 `%rsp`，分配局部变量；
# 7. 执行函数体，把返回值放入 `%rax`；
# 8. `addq`：增大 `%rsp`，释放局部变量；
# 9. `popq`：恢复被调用者保存寄存器；
# 10. `ret`：弹出返回地址，回到调用者。

['call-sequence.notes.1']
src_hash = '51199e87'
text = '''
The figure on the right is the data this call stores on the stack; the number in each circle is the step that writes that region: step 2 pushes the arguments, step 4 pushes the return address, step 5 saves registers, and step 6 allocates the local variables. Steps 8, 9 and 10 free them in the reverse order.
After the return, the caller increases %rsp to free the arguments pushed in step 2 and restores the values saved in step 1.
A step that is not needed is omitted. dot_product has only steps 7 and 10. dot_bias has no steps 6 and 8; its step 1 moves b to %ebx, and since the three arguments are already in the registers dot_product needs, step 3 has no instructions. main has no steps 5 and 9.
'''
# src:
# 
# 右图是这次调用在栈上存放的数据，圆圈中的数字是写入该区域的步骤：第 2 步压入参数，第 4 步压入返回地址，第 5 步保存寄存器，第 6 步分配局部变量。第 8、9、10 步按相反的顺序释放它们。
# 返回之后，调用者增大 %rsp 释放第 2 步压入的参数，并恢复第 1 步保存的值。
# 不需要的步骤可以省去。dot_product 只有第 7 步与第 10 步。dot_bias 没有第 6 步与第 8 步；它的第 1 步是把 b 移到 %ebx，三个参数已经在 dot_product 需要的寄存器中，第 3 步没有指令。main 没有第 5 步与第 9 步。


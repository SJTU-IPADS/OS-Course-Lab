src_hash = '407bb34c'
text = '''
perf stat writes the counts to standard error; 2>&1 merges it into standard output, and grep -v deletes the blank lines and the two lines seconds user and seconds sys.
perf needs the kernel to let ordinary users read the hardware counters: /proc/sys/kernel/perf_event_paranoid must be at most 1. The Ubuntu default is 4, and perf then reports No supported events found; before class the instructor runs sudo sysctl kernel.perf_event_paranoid=1 once.
The counts and times vary with the CPU model and frequency; the numbers on the page come from an i9-11900H.
dot_avx2 is compiled from dot.c with -mavx2 added; its vector loop is generated by the compiler and has 6 instructions, one vmovdqa fewer than the loop on the "Vector loop" page.
'''

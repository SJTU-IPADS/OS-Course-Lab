['flops-estimate.slide.1']
src_hash = 'a9e3bf43'
text = '''
**Taking the model quantized in the lab `nano-quant` of lecture 2 as the example**:
- The language model of Qwen3-VL-2B-Instruct has 28 layers and 1.72 billion weights;
- The weights use the Q4_0 format of lecture 2: every 32 weights take 18 bytes, an average of 4.5 bits per weight;
- To generate one token, one matrix-vector multiplication $y = Wx$ is done with the input vector and each weight matrix; each element of $y$ is the dot product of one row of $W$ with $x$;
- Each weight takes part in **1 multiply-add** and is read from memory **once**.
'''

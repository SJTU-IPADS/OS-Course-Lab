**Cleaning up microarchitectural state: the `vzeroupper` instruction**:
- After executing AVX instructions and before returning to the caller, the compiler inserts `vzeroupper`;
- **Microarchitectural mechanism**: it clears the upper 128 bits of all YMM registers, which removes the cost of saving and restoring state when AVX state is mixed with legacy 128-bit SSE code (avoiding pipeline stalls of tens of clock cycles).
'''

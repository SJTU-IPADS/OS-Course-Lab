['vector-loop.slide.1']
src_hash = 'b4ebf75d'
text = '''
**The change in throughput of the loop**:
- The loop body runs from `.L9` to `jg` and consists of 7 instructions; each iteration processes **32 bytes (8 int32 elements)**;
- For each dot-product element computed, the average instruction cost drops from 6 in the scalar loop to **$7 / 8 = 0.875\text{ instructions}$**.
'''
# src:
# 
# **单循环吞吐量变化**：
# - 循环体从 `.L9` 到 `jg`，由 7 条指令构成，每轮迭代处理 **32 字节（8 个 int32 元素）**；
# - 每完成 1 个内积元素的计算，平均指令消耗从标量的 6 条降为 **$7 / 8 = 0.875\text{ 条指令}$**。

['vector-loop.notes.1']
src_hash = '6fdd06dd'
text = '''
The output of the demo is the part of dot_product_avx2 from vpxor to jg (gcc 15.2.0): asm.sed deletes the assembler directives, and sed -n '/vpxor/,/jg/p;/jg/q' prints from the first line that contains vpxor to the first line that contains jg and then quits. This part does not include the function entry, so the output is the same with or without -fcf-protection=none, and the command leaves the option out.
vpxor executes once before the loop and clears the 8 sums in %ymm1. Before it come leal -7(%rdx), %edx and xorl %eax, %eax, which make %edx equal to n - 7 and i in %eax equal to 0; further up are a cmpl $7, %edx and a jle, so the loop is not entered when n is less than 8.
Of the 7 instructions of the loop body, vmovdqu, vpmulld and vpaddd correspond to the 4 intrinsics of the source (the load of x is folded into the memory operand of vpmulld), and addq, cmpl and jg control the loop: addq increases i by 8, cmpl computes (n - 7) - i, and jg jumps when the result is greater than 0, the same condition as i <= n - 8 in the source. The operand (%rdi,%rax,4) uses base plus scaled index addressing; i grows by 8 each pass and the address by 32 bytes.
vmovdqa %ymm0, %ymm1 copies 256 bits between two registers and has no corresponding statement in the source: vpaddd writes the new sums to %ymm0, and this instruction copies them to %ymm1, which the next pass uses. A copy between registers has no address alignment requirement.
The register numbers, the label and the number of instructions depend on the compiler version and the optimization options.
'''
# src:
# 
# 演示的输出是 dot_product_avx2 中从 vpxor 到 jg 的一段（gcc 15.2.0）：asm.sed 删去汇编伪指令，sed -n '/vpxor/,/jg/p;/jg/q' 打印从第一个含 vpxor 的行到第一个含 jg 的行，随后退出。这一段不含函数入口，输出与是否使用 -fcf-protection=none 无关，命令中省去了这个选项。
# vpxor 在进入循环之前执行一次，把 %ymm1 中的 8 个累加和清零。它之前还有 leal -7(%rdx), %edx 与 xorl %eax, %eax，使 %edx 等于 n - 7，%eax 中的 i 等于 0；再往前是 cmpl $7, %edx 与 jle，n 小于 8 时不进入循环。
# 循环体的 7 条指令中，vmovdqu、vpmulld、vpaddd 对应源码的 4 个 Intrinsics（x 的加载并入 vpmulld 的内存操作数），addq、cmpl、jg 控制循环：addq 使 i 增加 8，cmpl 计算 (n - 7) - i，jg 在结果大于 0 时跳转，条件与源码的 i <= n - 8 相同。操作数 (%rdi,%rax,4) 是基址比例变址寻址，i 每轮增加 8，地址增加 32 字节。
# vmovdqa %ymm0, %ymm1 在两个寄存器之间拷贝 256 位，源码中没有对应的语句：vpaddd 把新的累加和写入 %ymm0，这一条把它拷贝到下一轮使用的 %ymm1。寄存器之间的拷贝没有地址对齐的要求。
# 寄存器编号、标号与指令条数取决于编译器版本与优化选项。


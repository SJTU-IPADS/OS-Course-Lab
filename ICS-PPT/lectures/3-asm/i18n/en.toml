text = '''
Each row of the figure is what one call pushes onto the stack: the return address pushed by the call that invoked it, and the three registers it saves itself with pushq; each level of recursion adds 32 bytes to the stack. The call with n equal to 0 returns before any pushq, so it has only the return address.

['measured-speed.notes.1']
src_hash = 'f8ec451d'
text = '''
The source of mini-ollama is under examples/mini-ollama/, about 850 lines of C in total: mini_ollama.c holds the main loop and the operations within one layer, model.c brings the GGUF file into memory (mapped with mmap on Linux, read with fread on Windows) and finds the tensors in it, and tokenizer.c is the tokenizer. It reads q4_0.gguf (974 196 320 bytes), which the nano-quant lab of lecture 2 builds with the q4_0 recipe, and generates the answer token by token.
Each pass of the main loop takes one token through the 28 layers; in each layer attention performs 4 matrix-vector products and feed_forward 3, and the output layer performs 1, so generating one token takes 197 matrix-vector products and 1 720 451 072 multiply-adds, which agrees with 1.72 × 10⁹. All these multiply-adds are done in the function matvec, which takes 99.7% of the run time.
make run compiles and runs mini-ollama; one run takes about 40 seconds. The eval rate it prints is the speed of generating the answer, under the name that ollama run --verbose prints; matvec rate is the operation rate of all the matrix-vector products. The Makefile uses -O2 -fno-tree-vectorize: from GCC 12 on, -O2 vectorizes part of this loop automatically, and this option keeps it at one weight at a time.
make run-ollama first runs ollama create nq-q4-0 -f Modelfile and then ollama run nq-q4-0 --verbose; it needs ollama serve to be running. The Modelfile makes ollama load the same q4_0.gguf; num_gpu 0 keeps it on the CPU, num_thread 1 gives it 1 thread, and temperature 0 makes every step take the token with the highest score, as mini-ollama does.
The answer of ollama is 「我是一个虚拟助手，没有实体，但我可以用文字与你交流，为你提供帮助和解答。」 Its first 9 tokens are the same as those of mini-ollama; at the 10th token the two candidates with the highest scores differ by 0.008, and ollama quantizes the activations to 8-bit integers before computing, so the numerical error changes the choice at this step.
The operation rates in the figure are the generation speeds times the 3.44 × 10⁹ FLOP of one token: 10.7 Token/s is about 37 GFLOPS and 0.77 Token/s about 2.6 GFLOPS, a factor of 14 apart.
1 thread runs on 1 core. The peak compute of 320 GFLOPS is the sum over the 8 cores; 1 core has 320 ÷ 8 = 40 GFLOPS, which corresponds to 11.6 Token/s and is the dashed line in the figure. The 37 GFLOPS of ollama is 92% of it, and the 2.6 GFLOPS of mini-ollama is 1/15 of it.
The bandwidth limit of 53 Token/s is the limit of the whole machine. ollama on one thread reads 10.7 × 0.968 ≈ 10.4 GB of weights per second, 1/5 of the memory bandwidth of 51.2 GB/s, and its generation speed is determined by the operation rate of 1 core.
40 GFLOPS is the peak compute, counted in 64-bit floating-point operations, divided by the number of cores. A vector instruction on 8-bit integers processes more elements than one on 64-bit floating-point numbers, so the actual operation rate of one core can exceed 40 GFLOPS; 92% indicates that ollama and the compute limit of one core are of the same order.
All values were measured on 2026-10-05 on an i9-11900H on mains power, with gcc 15.2.0 and ollama 0.33.2. Across runs ollama is between 10.4 and 10.9 Token/s and mini-ollama between 0.75 and 0.79 Token/s.
'''
# src:
# 
# mini-ollama 的源码在 examples/mini-ollama/ 下，共约 850 行 C：mini_ollama.c 是主循环与一层之内的运算，model.c 把 GGUF 文件载入内存（Linux 上用 mmap 映射，Windows 上用 fread 读入）并找到其中的张量，tokenizer.c 是分词器。它读取第二讲实验 nano-quant 按 q4_0 配方得到的 q4_0.gguf（974 196 320 字节），逐个 Token 生成回答。
# 主循环每一轮让一个 Token 经过 28 层，每层 attention 做 4 次矩阵向量乘，feed_forward 做 3 次，输出层 1 次，生成一个 Token 共 197 次矩阵向量乘、1 720 451 072 次乘加，与 1.72 × 10⁹ 一致。这些乘加都在函数 matvec 中完成，它占运行时间的 99.7%。
# make run 编译并运行 mini-ollama，一次约 40 秒。输出的 eval rate 是生成回答的速度，名字与 ollama run --verbose 的输出相同；matvec rate 是全部矩阵向量乘的运算速率。Makefile 使用 -O2 -fno-tree-vectorize：GCC 12 起在 -O2 下会把这个循环的一部分自动向量化，这个选项使它保持每次处理一个权重。
# make run-ollama 先执行 ollama create nq-q4-0 -f Modelfile，再执行 ollama run nq-q4-0 --verbose，需要 ollama serve 已在运行。Modelfile 让 ollama 加载同一个 q4_0.gguf，num_gpu 0 使它只使用 CPU，num_thread 1 使它只用 1 个线程，temperature 0 使每一步取分数最高的 Token，与 mini-ollama 相同。
# ollama 的回答是「我是一个虚拟助手，没有实体，但我可以用文字与你交流，为你提供帮助和解答。」前 9 个 Token 与 mini-ollama 相同；第 10 个 Token 上分数最高的两个候选相差 0.008，ollama 把激活量化为 8 位整数再计算，数值误差改变了这一步的选择。
# 图中的运算速率由生成速度乘以每个 Token 的 3.44 × 10⁹ FLOP 得到：10.7 Token/s 约 37 GFLOPS，0.77 Token/s 约 2.6 GFLOPS，两者相差 14 倍。
# 1 个线程在 1 个核心上运行。峰值算力 320 GFLOPS 是 8 个核心之和，1 个核心是 320 ÷ 8 = 40 GFLOPS，对应 11.6 Token/s，即图中的虚线。ollama 的 37 GFLOPS 是它的 92%，mini-ollama 的 2.6 GFLOPS 是它的 1/15。
# 带宽上限 53 Token/s 是整台机器的上限。单线程的 ollama 每秒读取 10.7 × 0.968 ≈ 10.4 GB 权重，是内存带宽 51.2 GB/s 的 1/5，它的生成速度由 1 个核心的运算速率决定。
# 40 GFLOPS 由按 64 位浮点运算计数的峰值算力除以核心数得到。8 位整数的向量指令每条处理的元素多于 64 位浮点指令，单个核心的实际运算速率可以高于 40 GFLOPS；92% 表示 ollama 与单核算力上限处于同一量级。
# 全部数值于 2026-10-05 在接通电源的 i9-11900H 上测得，gcc 15.2.0，ollama 0.33.2。多次运行中 ollama 在 10.4 ~ 10.9 Token/s 之间，mini-ollama 在 0.75 ~ 0.79 Token/s 之间。


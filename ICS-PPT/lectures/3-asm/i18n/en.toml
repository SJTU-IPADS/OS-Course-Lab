text = '**Encapsulating the running example as a function**:'
# src:
# 
# **主线函数的模块化封装**：

['procedure-need.slide.2']
src_hash = 'aec9891a'
text = '''
**Hardware actions required by a procedure call**:
1. **Control transfer**: execution jumps to the first instruction of `dot_product`;
2. **Data passing**: the caller hands the arguments (`w`, `x`, `n`) to the callee;
3. **State isolation**: the function must not destroy the caller's important local data while it executes;
4. **Local state**: the callee needs space for its own local variables while it executes, and this space is released when the call returns;
5. **Returning the result and resuming**: the callee hands the result to the caller, and execution returns to the point after the call and continues.
'''
# src:
# 
# **过程调用的硬件动作需求**：
# 1. **控制转移**：执行流跳转到 `dot_product` 的第一条指令；
# 2. **数据传递**：调用者把参数（`w`, `x`, `n`）交给被调用者；
# 3. **状态隔离**：函数执行期间不能破坏调用者的关键局部数据；
# 4. **局部状态**：被调用者执行期间需要存放自己的局部变量，调用返回后这些空间随之释放；
# 5. **结果返回与恢复**：被调用者将结果交给调用者，执行流返回到调用点之后继续执行。


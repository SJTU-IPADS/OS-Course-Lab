['insn-table.notes.1']
src_hash = '121edcb7'
text = '''
A unary instruction has only one operand; the destination operand of a binary instruction is also a source. The shift amount k is an immediate or the %cl register.
The difference between sarl and shrl corresponds to the right shift of int and of unsigned in C: a right shift of int fills with the sign bit (division by 2^k rounding down), and a right shift of unsigned fills with 0.
Division has only the one-operand format, and the dividend is fixed in %edx:%eax; cltd sign-extends %eax into %edx, and the 64-bit versions are cqto and idivq.
'''
# src:
# 
# 一元指令只有一个操作数，二元指令的目的操作数同时是一个源。移位量 k 是立即数或 %cl 寄存器。
# sarl 与 shrl 的区别对应 C 语言中 int 与 unsigned 的右移：int 右移补符号位（除以 2^k 向下取整），unsigned 右移补 0。
# 除法只有单操作数格式，被除数固定在 %edx:%eax 中；cltd 把 %eax 符号扩展到 %edx，64 位版本是 cqto 与 idivq。

['xor-strength.title']
src_hash = '6a000779'
text = 'Instruction optimization: clearing a register with xorl'
# src: 指令优化：xorl 寄存器清零

['xor-strength.slide.1']
src_hash = '3c464cd8'
text = '''
**Compiler optimization: clearing a register with `xorl %eax, %eax`**:
- Any number XORed with itself is always 0 ($A \oplus A = 0$);
- **Why not `movl $0, %eax`**:
  - Encoding length: `xorl %eax, %eax` needs only 2 bytes (`31 c0`), while `movl $0, %eax` takes 5 bytes (`b8 00 00 00 00`);
  - Hardware renaming optimization: when the decoder of a modern CPU recognizes a self-XOR, it maps the register directly to the physical zero in the register alias table (RAT); **the execution latency is 0 cycles and no ALU resources are used**.
'''
# src:
# 
# **编译器优化：`xorl %eax, %eax` 寄存器清零**：
# - 任何数异或自身恒为 0（$A \oplus A = 0$）；
# - **为什么不用 `movl $0, %eax`**：
#   - 编码长度：`xorl %eax, %eax` 仅需 2 字节（`31 c0`），而 `movl $0, %eax` 占用 5 字节（`b8 00 00 00 00`）；
#   - 硬件重命名优化：现代 CPU 译码器识别到自异或时，直接在寄存器别名表（RAT）中将其映射至物理零，**执行延迟为 0 周期，不占用 ALU 资源**。

['xor-strength.notes.1']
src_hash = '6697a7bc'
text = 'Machine-level optimization idioms compilers often use in basic arithmetic: clearing with XOR, and strength reduction of multiplication by a constant.'
# src: 编译器在基础算术中常用的机器级优化惯用法：异或清零与乘常数强度削减。

['xor-strength-2.title']
src_hash = '7a5194c2'
text = 'Instruction optimization: optimizing integer multiplication'
# src: 指令优化：整数乘法优化

['xor-strength-2.slide.1']
src_hash = '418bfdc6'
text = '''
**Compiler optimization**:
- An integer multiplication `imull` usually takes 3 clock cycles;
- The compiler automatically breaks a multiplication by a constant into `lea` and shifts with a combined cost of 1 cycle:
  - `x * 5` $\to$ `leal (%rax,%rax,4), %eax` ($x + x \times 4$);
  - `x * 9` $\to$ `leal (%rax,%rax,8), %eax` ($x + x \times 8$);
  - `x * 12` $\to$ `leal (%rax,%rax,2), %eax` followed by `sall $2, %eax`.
'''
# src:
# 
# **编译器优化**：
# - 整数乘法 `imull` 耗时通常需 3 个时钟周期；
# - 编译器会自动将常数乘法拆解为组合开销为 1 周期的 `lea` 与移位：
#   - `x * 5` $\to$ `leal (%rax,%rax,4), %eax`（$x + x \times 4$）；
#   - `x * 9` $\to$ `leal (%rax,%rax,8), %eax`（$x + x \times 8$）；
#   - `x * 12` $\to$ `leal (%rax,%rax,2), %eax` 随后 `sall $2, %eax`。


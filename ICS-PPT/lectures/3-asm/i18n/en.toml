# src: 把 dot_cuda.cu 提交到课程服务器

['cuda-remote.slide.2']
src_hash = '63770961'
text = '''
- `$GPU_SERVER` is the address of the server and `$GPU_TOKEN` is the course token; the lines starting with `# ` come from the server.
- One submission carries 1 source file of at most 64 KiB; compilation and execution together take at most 60 s; the GPU runs 1 job at a time, and the other jobs wait in a queue.
- The program runs in an isolated environment: it cannot read or write files on the server, and it cannot access the network.
'''
# src:
# 
# - `$GPU_SERVER` 是服务器的地址，`$GPU_TOKEN` 是课程口令；`# ` 开头的行由服务器给出。
# - 一次提交 1 个源文件，至多 64 KiB；编译与运行合计至多 60 s；GPU 每次运行 1 个任务，其余任务排队。
# - 程序在隔离环境中运行：不能读写服务器上的文件，不能访问网络。

['cuda-remote.notes.1']
src_hash = '2c13c3ec'
text = '''
The server is lectures/parallel-dot-server, and POST /program accepts one complete CUDA program: a single .cu file that holds a kernel and main.
The server saves the request body as program.cu, executes nvcc -O2 -arch=sm_XY -o program program.cu, and then executes ./program; the program gets no arguments, and its standard input is empty.
The reply arrives line by line: # received gives the number of bytes received; when the GPU is running another job there is a line # queued position=K; # started gives the time limit;
then come the messages of the compiler and the output of the program; the last line is # done status=… elapsed=…, where elapsed is the number of seconds of compilation and execution together.
status takes four values: ok; error, when compilation fails or the program exits with a non-zero status, in which case the preceding line is # program: exit status N;
timeout, when the job is terminated at the time limit; output-limit, when the job is terminated because its output exceeds 1 MiB.
A refused submission gets a one-line reason: 403 for a wrong token, 413 for an empty file or a file over 64 KiB, 429 for submitting too often (at most 6 submissions per address every 600 s), 503 when 8 jobs are already waiting.
The isolated environment is built with bubblewrap: the program sees a read-only /usr (the compilers and the CUDA libraries), the GPU device nodes, and two temporary directories kept in memory, /work and /tmp;
there is no /etc, no /home, and no network interface. At the time limit every process in the isolated environment is terminated, and the GPU goes to the next job.
The curl options: -sS shows error messages only; -N turns off output buffering, so each line is shown as soon as the server returns it; -H adds a request header; --data-binary @file sends the content of the file unchanged as the request body.
On Windows the command runs in Git Bash; curl is installed with Git for Windows.
Step two of the lab parallel-dot uses POST /run of the same server through make remote, and submits two kernel files.
'''
# src:
# 
# 服务器是 lectures/parallel-dot-server，POST /program 接收一个完整的 CUDA 程序：含 kernel 与 main 的一个 .cu 文件。
# 服务器把请求正文保存为 program.cu，执行 nvcc -O2 -arch=sm_XY -o program program.cu，再执行 ./program；程序没有参数，标准输入为空。
# 回复逐行返回：# received 是收到的字节数；GPU 正在运行其他任务时有一行 # queued position=K；# started 给出时间限制；
# 随后是编译器的信息与程序的输出；最后一行是 # done status=… elapsed=…，elapsed 是编译与运行合计的秒数。
# status 有四个取值：ok；error，编译失败或程序以非零状态退出，这时前一行是 # program: exit status N；
# timeout，超过时间限制被终止；output-limit，输出超过 1 MiB 被终止。
# 提交被拒绝时回复一行原因：403 口令错误，413 文件为空或超过 64 KiB，429 提交过于频繁（每个地址每 600 s 至多 6 次），503 等待的任务已有 8 个。
# 隔离环境由 bubblewrap 建立：程序只能看到只读的 /usr（编译器与 CUDA 库）、GPU 设备节点、两个存放在内存中的临时目录 /work 与 /tmp；
# 没有 /etc 与 /home，没有网络接口。到时间限制时，隔离环境中的全部进程被终止，GPU 交给下一个任务。
# curl 的选项：-sS 只显示错误信息；-N 关闭输出缓冲，服务器每返回一行就显示一行；-H 添加请求头；--data-binary @文件 把文件内容原样作为请求正文。
# Windows 上在 Git Bash 中执行，curl 随 Git for Windows 安装。
# 实验 parallel-dot 第二步的 make remote 使用同一个服务器的 POST /run，提交的是两个 kernel 文件。


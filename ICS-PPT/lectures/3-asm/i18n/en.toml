['callee-example.slide.1']
src_hash = '9ec3a4a5'
text = '''
- **`movl %ecx, %ebx`**: `b` is moved to the callee-saved `%ebx`, and its value is unchanged after `dot_product` returns;
- **`pushq %rbx` and `popq %rbx`**: `dot_bias` saves the original value before overwriting `%rbx` and restores it before returning;
- **`dot_product`** overwrites only caller-saved registers and has no save and restore instructions.
'''
# src:
# 
# - **`movl %ecx, %ebx`**：`b` 移到被调用者保存的 `%ebx`，`dot_product` 返回后它的值不变；
# - **`pushq %rbx` 与 `popq %rbx`**：`dot_bias` 改写 `%rbx` 之前保存原值，返回前恢复；
# - **`dot_product`** 只改写调用者保存寄存器，没有保存与恢复的指令。

['callee-example.notes.1']
src_hash = '435b3ca6'
text = '''
The figure on the left is the stack while dot_product executes: the stack frame of dot_bias has two items, the saved %rbx and the return address pushed by call, 16 bytes in all.
gcc chose the second way from the previous page. b stays in a register, so no memory access is needed to read or write b before or after the call; the entry and the exit each gain one instruction, pushq and popq.
The registers dot_product overwrites can be checked in the listing of Part 2: %eax, %ecx, %r8 and %r9d, all caller-saved registers.
examples/asm.sed deletes the assembler directives (.file, .cfi_* and so on) and the .LFB/.LFE labels from the gcc -S output, leaving only the instructions and jump labels.
'''
# src:
# 
# 左图是 dot_product 执行期间的栈：dot_bias 的栈帧有两项，保存的 %rbx 与 call 压入的返回地址，共 16 字节。
# gcc 选用上一页的第二种做法。b 放在寄存器中，调用前后都不需要访存来读写 b；入口与出口各多一条 pushq 与 popq。
# dot_product 改写的寄存器可以在第二部分的清单中核对：%eax、%ecx、%r8、%r9d，都是调用者保存寄存器。

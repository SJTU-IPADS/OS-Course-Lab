['reduction.slide.2']
src_hash = 'a7323b17'
text = '- **How the halving tree reduction works**: extract the upper 128 bits and add them to the lower 128 bits (8 lanes reduced to 4) $\to$ shift right logically by 8 bytes and add (4 lanes reduced to 2) $\to$ shift right logically by 4 bytes and add (2 lanes reduced to 1) $\to$ `vmovd` extracts the final scalar sum into `%ecx` (two instructions in between, `movl %r8d, %eax` and `andl $-8, %eax`, compute the starting point of the tail loop).'
# src:
# 
# - **折半树状规约机理**：高 128 位提取与低 128 位相加（8 通道压缩为 4 通道） $\to$ 逻辑右移 8 字节相加（4 通道压缩为 2 通道） $\to$ 逻辑右移 4 字节相加（2 通道压缩为 1 通道） $\to$ `vmovd` 将最终标量累加和提取装填至 `%ecx`（中间穿插两条指令 `movl %r8d, %eax` 与 `andl $-8, %eax` 计算尾部循环起点）。

['reduction.notes.1']
src_hash = '566ac74f'
text = 'The micro-operations of the horizontal reduction instructions in the real assembly, the handling of the remainder in the tail loop, and why the algebraic reordering is valid.'
# src: 真实汇编中水平规约指令的微操作、尾部余数循环处理及代数重排合法性剖析。

['reduction-2.title']
src_hash = '717c0550'
text = 'Horizontal reduction: converting the vector sum into a scalar return value'
# src: 水平规约：向量累加和向标量返回值的转换

['reduction-2.slide.1']
src_hash = '8abc52db'
text = '''
**Checking the tail remainder and finishing with scalar code**:
- `testb $7, %r8b` + `je .L14`: checks whether $n \pmod 8$ leaves remaining elements that do not fill a vector;
- If there is a remainder, `cltq` extends the index, and the scalar loop `.L7` accumulates the remaining elements;
- Before the function returns, `vzeroupper` is generated to restore the microarchitectural state.

**Why the algebraic reordering is valid**:
- **Integer addition** is strictly associative, $(a+b)+c = a+(b+c)$, so the halving tree reduction and the serial scalar sum give mathematically equal results;
- **Floating-point addition is not associative** (because of rounding errors); without `-ffast-math` (or `-fassociative-math`), GCC does not change the order of floating-point additions, so it does not apply this tree reduction to a floating-point dot product automatically. This is an important reason why this lecture uses an integer dot product as its running example.
'''
# src:
# 
# **尾部余数检查与标量收尾**：
# - `testb $7, %r8b` + `je .L14`：检测 $n \pmod 8$ 是否存在未填满向量的剩余元素；
# - 若有余数，执行 `cltq` 扩展后进入 `.L7` 标量循环累加剩余元素；
# - 函数返回前生成 `vzeroupper` 恢复微架构状态。
# 
# **代数重排合法性剖析**：
# - **整数加法**严格满足结合律 $(a+b)+c = a+(b+c)$，折半树状规约与标量串行求和在数学结果上等价；
# - **浮点加法不满足结合律**（受舍入误差影响），没有 `-ffast-math`（或 `-fassociative-math`）时，GCC 不会改变浮点加法的计算顺序，因此不会对浮点点积自动进行这种树状规约。这是本节以整数内积为主线的重要原因。


['speedup-plan.notes.1']
src_hash = 'b0a27579'
text = '''
The first two columns of the table are those of the page "Bottleneck analysis: instructions executed per multiply-add"; the third column states whether each factor can be changed.
The number of instructions per multiply-add is determined by the instructions the program uses. A 256-bit vector register can hold 8 32-bit integers or 32 8-bit integers, and one vector instruction performs the same operation on each of its elements, so this number falls below 1; the 0.69 of ollama is obtained this way. From "The evolution of vectors: from MMX and SSE to AVX and AVX-512" on, this lecture covers these instructions.
The number of instructions that start to execute per cycle is determined by the hardware; for one core it is 5. Raising it needs more arithmetic units working at the same time. The i9-11900H has 8 cores, and ollama on 8 threads measures 31.4 Token/s, 2.9 times its speed on 1 thread; a GPU has three orders of magnitude more arithmetic cores than a CPU, which the pages from "Thread parallelism: CPU cores and the GPU" on cover.
Raising the clock frequency is limited by circuit delay and power. The number of multiply-adds per token is determined by the number of weights of the model, and an inference program does not change it.
Both solutions raise the operation rate; on the CPU their common limit is the bandwidth limit of 53 Token/s from the page "Hardware limits". A GPU uses its own memory, and its bandwidth limit is determined by the bandwidth of that memory (lecture 2).
The pages on vector instructions keep the integer dot product sum += w[i] * x[i] of part two; the -O2 scalar loop of dot.c executes 6 instructions per multiply-add.
'''
# src:
# 
# 表的前两列与「瓶颈分析：每次乘加执行的指令条数」一页相同，第三列说明每个因素能否改变。
# 每次乘加的指令条数由程序使用的指令决定。256 位向量寄存器可以存放 8 个 32 位整数或 32 个 8 位整数，一条向量指令对其中每个元素执行同一运算，这个条数降到 1 以下，ollama 的 0.69 条即由此得到。本讲接下来从「向量演进：从 MMX、SSE 到 AVX 与 AVX-512」起讲解这类指令。
# 每个周期开始执行的指令条数由硬件决定，一个核心是 5 条。提高它需要更多同时工作的运算单元。i9-11900H 有 8 个核心，ollama 用 8 个线程时实测 31.4 Token/s，是 1 个线程的 2.9 倍；GPU 的运算核心数量比 CPU 多三个数量级，由「线程并行：CPU 多核与 GPU」起的各页讲解。
# 主频的提高受电路延迟与功耗限制。每个 Token 的乘加次数由模型的权重数决定，推理程序不改变它。
# 两个方案提高的都是运算速率，在 CPU 上共同的上限是「硬件上限」一页的带宽上限 53 Token/s。GPU 使用自己的显存，它的带宽上限由显存带宽决定（第二讲）。
# 向量指令各页沿用第二部分的整数内积 sum += w[i] * x[i]；dot.c 的 -O2 标量循环每次乘加执行 6 条指令。


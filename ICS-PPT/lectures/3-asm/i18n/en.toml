text = 'The conflict of registers being overwritten along a chain of calls, and how the two saving mechanisms divide the responsibilities.'
# src: 调用链条中的寄存器覆盖矛盾与两种保存机制的职责划分。

['saved-regs-fig.title']
src_hash = 'b59c3981'
text = 'Protecting registers: caller-saved and callee-saved'
# src: 寄存器保护：调用者保存与被调用者保存

['saved-regs-fig.slide.1']
src_hash = '32335da8'
text = '''
**How do the caller and the callee save the corresponding registers when needed?**
The register values that need saving are local state of the current call; like local variables and the return address, they can be stored in the stack frame:
- **Callee-saved registers: using them is a right**; they are used only when there are not enough registers, so the original value must be pushed onto the stack and restored before returning;
- **Caller-saved registers: saving them is an obligation**; a value that is still needed after the call (such as the first argument in `%rdi`) must be moved before `call`: if a callee-saved register is free, the value can be kept there (because the callee guarantees that its value is unchanged when the function returns, but as a callee the function must also protect that register); otherwise it is stored on the stack.
'''
# src:
# 
# **调用者与被调用者如何在需要时保存对应的寄存器？**
# 需要保存的寄存器值属于本次调用的局部状态，与局部变量、返回地址一样，可以存入栈帧：
# - **被调用者保存寄存器：使用是权利**，寄存器不够时才用，因此原值必须入栈，返回前恢复；
# - **调用者保存寄存器：保存是义务**，调用后仍要使用的值（如 `%rdi` 中的第一个参数）在 `call` 前必须转移：如果有空闲的 callee-saved 寄存器，可以暂存其中（因为 callee 保证其值在函数返回时不变，但作为 callee 也需要保护该寄存器），否则存入栈中。

['saved-regs-fig.notes.1']
src_hash = '775b2ff4'
text = '''
Saved register values, like local variables and the return address, are allocated and released with each call, so they are placed in the stack frame; the instructions that write and read the top of the stack are push and pop, introduced next.
The callee uses callee-saved registers as it needs them; values in caller-saved registers that are still needed after a call must be moved by the caller before every call.
The dot_bias example later shows a value kept in a callee-saved register.
'''
# src:
# 
# 保存下来的寄存器值与局部变量、返回地址一样随调用分配与释放，因此放在栈帧中；写入与读出栈顶的指令即随后介绍的 push 与 pop。
# 被调用者保存寄存器由被调用者按需使用；调用者保存寄存器中调用后仍要使用的值，调用者每次调用前都必须转移。
# 暂存到被调用者保存寄存器的做法见后续 dot_bias 的例子。

['push-pop.title']
src_hash = '5962a6f9'
text = 'Instruction breakdown: the equivalent micro-operations of push and pop'
# src: 指令分解：push 与 pop 的等价微操作

['push-pop.slide.1']
src_hash = '9c228c75'
text = '''
**Dedicated instructions**:
- Saving the value of a register at the top of the stack, and reading a value from the top of the stack back into a register, are common operations when saving and restoring registers;
- x86-64 therefore provides a separate instruction for each of the two: `pushq` and `popq`.

**Equivalent instructions for `pushq Src`**:
1. Move the pointer: `subq $8, %rsp` (the stack pointer extends 8 bytes toward lower addresses, opening a slot);
2. Store the data: `movq Src, (%rsp)` (writes the 64-bit source operand to the new top of the stack).

**Equivalent instructions for `popq Dest`**:
1. Read the data: `movq (%rsp), Dest` (reads 64 bits of data from the current top of the stack into the destination register);
2. Move the pointer back: `addq $8, %rsp` (the stack pointer increases by 8 bytes, releasing the top slot).
'''
# src:
# 
# **专用指令**：
# - 把寄存器的值保存到栈顶、从栈顶读出值写回寄存器，是保存与恢复寄存器时的常见操作；
# - 因此 x86-64 为这两种操作各提供一条单独的指令：`pushq` 与 `popq`。
# 
# **`pushq Src` 的等价指令分解**：
# 1. 步进指针：`subq $8, %rsp`（栈顶指针向低地址延伸 8 个字节，开辟槽位）；
# 2. 数据存入：`movq Src, (%rsp)`（将 64 位源操作数写入新栈顶）。
# 
# **`popq Dest` 的等价指令分解**：
# 1. 数据读出：`movq (%rsp), Dest`（从当前栈顶读取 64 位数据到目标寄存器）；
# 2. 回退指针：`addq $8, %rsp`（栈指针自增 8 字节，收缩释放栈顶槽位）。


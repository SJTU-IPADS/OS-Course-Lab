['datapath-width.title']
src_hash = '2f4b9f9c'
text = 'The approach: fewer instructions per multiply-add, more cores executing'
# src: 解决思路：减少每次乘加的指令条数，增加执行的核心数

['datapath-width.slide.1']
src_hash = '0e53a51b'
text = '''
**Two directions for raising the multiply-add rate**:
1. **One instruction performs several multiply-adds**: a 256-bit vector register can hold 8 32-bit integers or 32 8-bit integers, and one vector instruction performs the same operation on each of its elements (SIMD, single instruction, multiple data);
2. **Several cores execute at the same time**: each of the 8 cores of the i9-11900H executes part of the loop.

**The limit of both directions**:
- The multiply-add rate rises with these two until it reaches the bandwidth limit of $1.0 \times 10^{11}$ /s;
- Once the bandwidth limit is reached, raising the generation speed requires reducing the bytes read per token (the quantization of lecture 2) or raising the memory bandwidth.

**The example used in the explanation**: the part on vector instructions keeps the 32-bit integer dot product `dot.c` of part 2, whose `-O2` scalar loop executes 6 instructions per multiply-add.
'''
# src:
# 
# **提高乘加速率的两个方向**：
# 1. **一条指令完成多次乘加**：256 位向量寄存器可以存放 8 个 32 位整数或 32 个 8 位整数，一条向量指令对其中每个元素执行同一运算（SIMD，单指令多数据）；
# 2. **多个核心同时执行**：i9-11900H 的 8 个核心各自执行循环的一部分。
# 
# **两个方向的上限**：
# - 乘加速率随这两项提高，直到达到带宽上限 $1.0 \times 10^{11}$ 次/s；
# - 达到带宽上限之后，提高生成速度需要减少每个 Token 读取的字节数（第二讲的量化），或者提高内存带宽。
# 
# **讲解使用的例子**：向量指令部分沿用第二部分的 32 位整数内积 `dot.c`，它的 `-O2` 标量循环每次乘加执行 6 条指令。

['datapath-width.notes.1']
src_hash = '3f985483'
text = 'The two directions, SIMD and multiple cores, and their common limit: memory bandwidth.'
# src: SIMD 与多核两个方向，以及它们共同的上限：内存带宽。


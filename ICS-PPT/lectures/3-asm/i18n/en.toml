**What SIMD intrinsics (`<immintrin.h>`) are**:
- Low-level built-in interfaces provided by the compiler that look like C functions and usually correspond to specific CPU vector machine instructions at compile time.

**Core source of a hand-written AVX2 dot product**:
'''
# src:
# 
# **什么是 SIMD Intrinsics（`<immintrin.h>`）**：

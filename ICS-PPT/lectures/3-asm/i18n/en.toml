['memory-operand.title']
src_hash = '94b2aff7'
text = 'Further topic: the single-memory-operand constraint of x86 arithmetic instructions'

['memory-operand.slide.1']
src_hash = 'f2e71fb0'
text = '''
**Observation**:
- In the listing on the previous page, the source operand of `imull (%rdi), %eax` is a memory address.

**Hardware execution**:
- x86-64 is a complex instruction set (CISC), which allows the source operand of a two-operand arithmetic instruction to be a memory address.
- During execution, the memory access unit first reads the data from memory and then sends it directly to the ALU to be multiplied by `%eax`.

**Single-memory-operand constraint**:
- A single x86 instruction **can contain at most one memory operand**.
'''

['memory-operand.notes.1']

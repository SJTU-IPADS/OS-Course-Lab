['cond-jump.title']
src_hash = '4c15051f'
text = 'Conditional jump instructions: reading combinations of the flags'
# src: 条件跳转指令：读取标志位的组合

['cond-jump.slide.1']
src_hash = 'f85ef6b2'
text = '''
**Conditional jump instructions `jX Label`, which read different flags according to X**:
1. **Equality and zero**: `je` / `jz` (ZF=1), `jne` / `jnz` (ZF=0);
2. **Signed comparison** (after `cmpl S2, S1`, comparing $S1$ with $S2$):
   - `jl`: less, condition $\text{SF} \ne \text{OF}$;
   - `jle`: less or equal, condition $(\text{SF} \ne \text{OF}) \lor (\text{ZF}=1)$;
   - `jg`: greater, condition $(\text{SF} = \text{OF}) \land (\text{ZF}=0)$;
   - `jge`: greater or equal, condition $\text{SF} = \text{OF}$;
3. **Unsigned comparison**:
   - `jb`: below, unsigned less, condition $\text{CF}=1$;
   - `jbe`: unsigned less or equal, condition $\text{CF}=1 \lor \text{ZF}=1$;
   - `ja`: above, unsigned greater, condition $\text{CF}=0 \land \text{ZF}=0$;
   - `jae`: unsigned greater or equal, condition $\text{CF}=0$.
'''
# src:
# 
# **条件跳转指令 `jX Label`，按 X 读取不同的标志位**：
# 1. **相等与零值**：`je` / `jz`（ZF=1），`jne` / `jnz`（ZF=0）；
# 2. **有符号比较**（`cmpl S2, S1` 之后，判断 $S1$ 与 $S2$ 的大小）：
#    - `jl`：小于，条件为 $\text{SF} \ne \text{OF}$；
#    - `jle`：小于等于，条件为 $(\text{SF} \ne \text{OF}) \lor (\text{ZF}=1)$；
#    - `jg`：大于，条件为 $(\text{SF} = \text{OF}) \land (\text{ZF}=0)$；
#    - `jge`：大于等于，条件为 $\text{SF} = \text{OF}$；
# 3. **无符号比较**：
#    - `jb`：below，无符号小于，条件为 $\text{CF}=1$；
#    - `jbe`：无符号小于等于，条件为 $\text{CF}=1 \lor \text{ZF}=1$；
#    - `ja`：above，无符号大于，条件为 $\text{CF}=0 \land \text{ZF}=0$；
#    - `jae`：无符号大于等于，条件为 $\text{CF}=0$。

['cond-jump.notes.1']
src_hash = '49f4fe49'
text = '''
The condition for signed less is SF != OF: when the difference does not overflow, OF=0 and SF is the sign of the difference, so SF=1 means less; when the difference overflows, OF=1 and SF is the opposite of the true sign of the difference, so SF=0 means less. The two cases together are SF != OF.
After the same cmpl, the compiler chooses jl or jb according to the type of the operands: jl for int, jb for unsigned.
'''
# src:
# 
# 有符号小于的条件是 SF ≠ OF：差不溢出时 OF=0，SF 即差的符号，SF=1 表示小于；差溢出时 OF=1，SF 与差的真实符号相反，SF=0 表示小于。两种情况合起来就是 SF ≠ OF。
# 同一条 cmpl 之后，编译器按操作数的类型选用 jl 或 jb：int 用 jl，unsigned 用 jb。

['jump-direct.title']
src_hash = '679abfba'
text = 'Direct jumps and indirect jumps'
# src: 直接跳转与间接跳转

['jump-direct.slide.1']
src_hash = 'ecf12510'
text = '''
**Direct jump**: the target of `jmp .L2` and `jl .L3` is a label; the target address is determined at assembly and link time and is encoded in the instruction as part of it. All the jumps in `dot_product` are direct jumps.

**Cases where the target is determined only at run time**:
- Which block of code executes depends on a value known at run time; for example `switch (op)` selects a branch according to the value of `op`, and `op` is a parameter of the function;
- A direct jump has one fixed target and cannot express "select the target according to the value of `op`".

**Indirect jump**: the target address is read from a register or from memory and written into `%rip`:
- `jmp *%rax`: the value in `%rax` is the target address;
- `jmp *(%rax)`: reads 8 bytes at address `%rax` as the target address;
- `jmp *.L4(,%rdi,8)`: reads 8 bytes at address $\text{.L4} + 8 \times \text{\%rdi}$ as the target address; the addressing mode is the same as that of the memory operands of Part 1.
'''
# src:
# 
# **直接跳转（Direct Jump）**：`jmp .L2`、`jl .L3` 的目标是一个标号，目标地址在汇编与链接时确定，作为指令的一部分编码在指令中。`dot_product` 中的跳转都是直接跳转。
# 
# **目标在运行时才确定的情况**：
# - 执行哪一段代码取决于运行时的一个值，例如 `switch (op)` 按 `op` 的值选择分支，`op` 是函数的参数；
# - 一条直接跳转只能写死一个目标，表示不了"按 `op` 的值选择目标"。
# 
# **间接跳转（Indirect Jump）**：目标地址从寄存器或内存中读出，写入 `%rip`：
# - `jmp *%rax`：`%rax` 中的值即目标地址；
# - `jmp *(%rax)`：从地址 `%rax` 处读出 8 字节作为目标地址；
# - `jmp *.L4(,%rdi,8)`：从地址 $\text{.L4} + 8 \times \text{\%rdi}$ 处读出 8 字节作为目标地址，寻址方式与第一部分的内存操作数相同。

['jump-direct.notes.1']
src_hash = 'f803c256'
text = 'The target of an indirect jump is data: a value in a register or 8 bytes in memory. Calls through function pointers in C and virtual function calls in C++ also compile to indirect jumps or indirect calls.'
# src:
# 
# 间接跳转的目标是数据：寄存器中的值或内存中的 8 字节。C 语言的函数指针调用、C++ 的虚函数调用也编译为间接跳转或间接调用。

['switch-table.title']
src_hash = '168a4a29'
text = 'The switch statement: jump tables and indirect jumps'
# src: switch 语句：跳转表与间接跳转

['switch-table.slide.1']
src_hash = '27c9d0d4'
text = '''
**6 `case` branches, 6 blocks of code**: which block executes is decided by the parameter `op`, and the value of `op` is unknown at compile time.
- Comparing one by one: `cmpl` compares `op` with 0, 1, ..., 5 in turn, each followed by a conditional jump; at most 6 comparisons;
- Jump table: the addresses of the 6 blocks of code are arranged in a table, entry `op` of the table is read according to `op`, and the jump goes there.
'''
# src:
# 
# **6 个 `case`，6 段代码**：执行哪一段由参数 `op` 决定，编译时不知道 `op` 的值。
# - 逐一比较：`op` 与 0、1、…、5 依次 `cmpl` 并条件跳转，最多比较 6 次；
# - 跳转表：把 6 段代码的地址排成一张表，按 `op` 取出第 `op` 个地址，跳过去。

['switch-table.notes.1']
src_hash = '20dd8031'
text = 'The switch statement is the most common source of indirect jumps. When the case values are contiguous and numerous enough (about 5 or more for gcc), the compiler generates a jump table; otherwise it compares one by one.'

['system-limits.notes.1']
src_hash = 'ee909658'
text = '''
The skeleton of the figure is the figure of the page "The CPU fetches instructions and data from memory to compute" at the start of this lecture, with the CPU expanded into three parts: a register, the arithmetic units and the execution of instructions.
Red: the memory bandwidth of 51.2 GB/s limits the path that carries the weights from memory to the CPU. For every token generated, 0.968 GB of weights pass along this path once, so the generation speed is at most 53 Token/s.
Blue: the peak compute of 320 GFLOPS is the rate when the arithmetic units of all 8 cores operate at the same time and every instruction uses all 256 bits of the register.
Green: ollama on one thread uses 1 core, and one of its instructions uses all 256 bits of the register. The compute limit of 1 core is 320 ÷ 8 = 40 GFLOPS, and the measured rate is about 37 GFLOPS. In libggml-cpu-icelake.so, the library this machine loads, the main loop of its Q4_0 dot product function ggml_vec_dot_q4_0_q8_0 executes 22 instructions for 32 weights per iteration, and one of them, vpdpbusd, multiplies 32 pairs of 8-bit integers and accumulates the products.
Orange: mini-ollama uses 1 core; one of its instructions processes 1 weight and uses only the low 32 bits of the register. The inner loop of matvec executes 20 instructions for 2 weights per iteration.
Execution of instructions: the number of instructions a CPU can start to execute in one clock cycle has a limit, so the more instructions one multiply-add needs, the fewer multiply-adds are completed per second. A core contains several sets of arithmetic units and can process several mutually independent instructions at the same time; the page "Superscalar" in part 6 of lecture 4 covers this. Instructions per multiply-add: 20 ÷ 2 = 10 for mini-ollama and 22 ÷ 32 ≈ 0.69 for ollama, a factor of 14.5; the measured generation speeds differ by a factor of 14.
The 256-bit register and the vector instructions that process several data items in one instruction are covered by the pages that start with "The vector system: the SIMD idea and the 256-bit YMM registers".
'''
# src:
# 
# 图的骨架是本讲开头「CPU从内存中获取指令与数据进行计算」一页的图，CPU 展开为寄存器、运算单元与指令执行三部分。
# 红色：内存带宽 51.2 GB/s 限制权重从内存到 CPU 的通路。每生成一个 Token，0.968 GB 权重经过这条通路一次，生成速度至多 53 Token/s。
# 蓝色：峰值算力 320 GFLOPS 是 8 个核心的运算单元全部同时运算、每条指令都使用寄存器全部 256 位时的速率。
# 绿色：单线程的 ollama 使用 1 个核心，它的一条指令使用寄存器的全部 256 位。1 个核心的算力上限是 320 ÷ 8 = 40 GFLOPS，实测约 37 GFLOPS。它计算 Q4_0 内积的函数 ggml_vec_dot_q4_0_q8_0 在本机使用的 libggml-cpu-icelake.so 中，主循环每轮 22 条指令处理 32 个权重，其中一条 vpdpbusd 完成 32 对 8 位整数的乘法并把乘积累加。
# 橙色：mini-ollama 使用 1 个核心，它的一条指令处理 1 个权重，只使用寄存器的低 32 位。matvec 的内层循环每轮 20 条指令处理 2 个权重。
# 指令执行：CPU 每个时钟周期能开始执行的指令条数有上限，完成一次乘加需要的指令越多，每秒完成的乘加越少。核心内部有多套运算部件，可以同时处理多条互不依赖的指令，由第四讲第六部分的「超标量」一页讲解。每次乘加的指令条数：mini-ollama 是 20 ÷ 2 = 10 条，ollama 是 22 ÷ 32 ≈ 0.69 条，相差 14.5 倍；实测的生成速度相差 14 倍。
# 256 位的寄存器与一条指令处理多个数据的向量指令，由后面「向量体系：SIMD 思想与 256 位 YMM 寄存器」起的几页讲解。


['stack-frame-2.title']
src_hash = 'a24b1fbf'
text = 'Example: the stack frame of main'
# src: 实例：main 的栈帧

['stack-frame-2.side_image.1.alt']
src_hash = 'dd9245cc'
text = 'contain'
# src: contain

['stack-frame-2.slide.1']
src_hash = 'ec9d0fd9'
text = '''
**Allocating, using and freeing the local arrays**:
1. **Allocation**: `subq $40, %rsp` subtracts 40 from `%rsp`, and the 40 bytes starting at `%rsp` become the stack frame of `main`;
2. **Use**: 8 `movl` instructions write the array elements at offsets relative to `%rsp`: `x[i]` is at offset $4i$ and `w[i]` at offset $16 + 4i$; the addresses of the arrays, `(%rsp)` and `16(%rsp)`, are passed to `dot_product` as arguments;
3. **Freeing**: `addq $40, %rsp` adds 40 back to `%rsp`, which frees the stack frame; its data need not be cleared.
'''
# src:
# 
# **局部数组的分配、使用与释放**：
# 1. **分配**：`subq $40, %rsp` 把 `%rsp` 减 40，从 `%rsp` 开始的 40 字节成为 `main` 的栈帧；
# 2. **使用**：8 条 `movl` 按相对 `%rsp` 的偏移写入数组元素，`x[i]` 位于偏移 $4i$，`w[i]` 位于偏移 $16 + 4i$；数组的地址 `(%rsp)` 与 `16(%rsp)` 作为参数传给 `dot_product`；
# 3. **释放**：`addq $40, %rsp` 把 `%rsp` 加回 40，栈帧随之释放，其中的数据不需要清除。

['stack-frame-2.aside.1']
src_hash = '778586ce'
text = 'Offsets 32 ~ 39 are unused: the calling convention requires `%rsp` to be a multiple of 16 when `call` executes. On entry to `main` the top of the stack is the 8-byte return address, and 40 + 8 = 48 is a multiple of 16.'
# src: 偏移 32 ~ 39 未被使用：调用规约要求执行 `call` 时 `%rsp` 是 16 的倍数。进入 `main` 时栈顶是 8 字节的返回地址，40 + 8 = 48 是 16 的倍数。

['stack-frame-2.notes.1']
src_hash = '022b4948'
text = '''
The offsets are fixed at compile time and %rsp differs from call to call, so the same instructions access the local variables of the current call.
The stack frame of main holds no saved registers: it uses no callee-saved register, and after calling dot_product it no longer uses any value in a caller-saved register.
In use8 on the page "More than 6 arguments", %rsp is a multiple of 16 plus 8 when call executes: last2 and use8 are in the same file, gcc sees that last2 does not depend on stack alignment, and it omits the instruction that adjusts %rsp (option -fipa-stack-alignment, on by default). When the callee is in another file, gcc aligns the stack as the convention requires.
'''
# src:
# 
# 偏移在编译时确定，每次调用的 %rsp 不同，同一段指令因此访问本次调用的局部变量。
# main 的栈帧中没有保存的寄存器：它没有使用被调用者保存寄存器，调用 dot_product 之后也不再使用调用者保存寄存器中的值。
# 「超过 6 个参数」一页的 use8 执行 call 时 %rsp 是 16 的倍数加 8：last2 与 use8 在同一个文件中，gcc 看到 last2 不依赖栈的对齐，省去了调整 %rsp 的指令（选项 -fipa-stack-alignment，默认开启）。被调用者在另一个文件中时，gcc 按规约对齐。


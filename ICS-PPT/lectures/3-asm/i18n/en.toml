['saved-regs.title']
src_hash = '0cb45755'
text = 'Register usage convention: caller-saved and callee-saved'
# src: 寄存器使用惯例：调用者保存与被调用者保存

['saved-regs.slide.1']
src_hash = 'fbfb2902'
text = '''
**Callee-saved registers**: `%rbx`, `%rbp`, `%r12`, `%r13`, `%r14`, `%r15`
- Convention: when a function returns, these registers hold the same values as when the function was called;
- A callee that uses one of them first saves the original value on the stack and restores it before returning.

**Caller-saved registers**: `%rax`, the 6 argument registers, `%r10`, `%r11`
- Convention: the callee may overwrite these registers directly;
- A caller that still needs a value in one of them after the call saves it on the stack before `call`, or moves it to a callee-saved register.

**The stack pointer `%rsp`**: after a function returns, `%rsp` has the same value as before the `call`.
'''
# src:
# 
# **被调用者保存寄存器（Callee-saved）**：`%rbx`、`%rbp`、`%r12`、`%r13`、`%r14`、`%r15`
# - 约定：函数返回时，这些寄存器的值与函数被调用时相同；
# - 被调用者要使用其中一个时，先把原值保存到栈上，返回前恢复。
# 
# **调用者保存寄存器（Caller-saved）**：`%rax`、6 个参数寄存器、`%r10`、`%r11`
# - 约定：被调用者可以直接改写这些寄存器；
# - 调用者在调用之后还要使用其中的值时，在 `call` 之前把它保存到栈上，或者移到一个被调用者保存寄存器中。
# 
# **栈顶指针 `%rsp`**：函数返回后，`%rsp` 的值与执行 `call` 之前相同。

['saved-regs.notes.1']
src_hash = '228d614e'
text = '''
This convention belongs to the System V AMD64 ABI, together with the convention for arguments. The names of the two classes of register say who is responsible for saving the values in them.
The 6 argument registers are %rdi, %rsi, %rdx, %rcx, %r8 and %r9; there are 9 caller-saved registers in all.
A callee-saved register is saved only when the callee uses it; a function that does not use them has no save and restore instructions.
'''
# src:
# 
# 这项约定与参数的约定同属 System V AMD64 ABI。两类寄存器的名称说明由谁负责保存其中的值。
# 6 个参数寄存器是 %rdi、%rsi、%rdx、%rcx、%r8、%r9，调用者保存寄存器共 9 个。
# 被调用者保存寄存器只在被调用者要使用时才保存；一个函数没有用到它们，就没有保存与恢复的指令。

['saved-regs-fig.title']
src_hash = '0cb45755'
text = 'Register usage convention: caller-saved and callee-saved'
# src: 寄存器使用惯例：调用者保存与被调用者保存

['saved-regs-fig.slide.1']
src_hash = '5ebc8d7e'
text = '''
**The `b` of `dot_bias` is in the caller-saved `%ecx` and is still needed after the call; there are two ways to keep it**:
- Push `b` onto the stack before the call and pop it after the call;
- Move `b` to a callee-saved register before the call; by the convention, its value is unchanged when `dot_product` returns. `dot_bias` is itself a callee, so it saves the original value of this register before using it.
'''
# src:
# 
# **`dot_bias` 的 `b` 在调用者保存的 `%ecx` 中，调用之后还要使用，有两种做法**：
# - 调用之前把 `b` 压入栈，调用之后弹出；
# - 调用之前把 `b` 移到一个被调用者保存寄存器中，按约定 `dot_product` 返回时它的值不变。`dot_bias` 自己也是被调用者，使用这个寄存器之前要先保存它的原值。

['saved-regs-fig.notes.1']
src_hash = '4110e37e'
text = '''
The 16 general-purpose registers fall into three groups: 9 caller-saved, 6 callee-saved, plus the stack pointer %rsp.
Both ways access the stack once: the first saves b, the second saves the original value of the callee-saved register.
'''
# src:
# 
# 16 个通用寄存器分为三组：9 个调用者保存，6 个被调用者保存，加上栈顶指针 %rsp。
# 两种做法都要访问一次栈：第一种保存的是 b，第二种保存的是被调用者保存寄存器的原值。


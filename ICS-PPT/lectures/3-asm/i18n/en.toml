# **跨平台测量替代方案**：
# - Windows 原生无 Linux `perf` 工具，可采用两种替代方案：
#   1. 程序内部调用 `clock_gettime(CLOCK_MONOTONIC)` 或通过 `__rdtsc()` 读取时间戳计数器；
#   2. 安装 WSL2，在 Ubuntu 子系统内运行原生 Linux `perf`。
# 
# **思考题**：若将数组规模 $n$ 扩大到超出 L3 缓存容量（数百 MiB），两个版本的耗时与加速比会如何变化？


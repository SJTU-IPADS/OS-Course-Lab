['cmp-test-2.slide.2']
src_hash = '347a7beb'
text = '''
- `testl %edx, %edx` sets the flags according to $n$: ZF=1 when $n = 0$, SF=1 when $n < 0$; `jle` (jump if less or equal) reads these two flags and jumps to `.L4` when $n \le 0$, returning with the return value 0;
- The `for` loop of `dot.c` checks `i < n` before the loop body executes for the first time; `-O2` places this check at the function entry, and the two instructions `testl` and `jle` have the same effect as `if (n <= 0) return 0;`.
'''
# src:
# 
# - `testl %edx, %edx` 按 $n$ 设置标志位：$n = 0$ 时 ZF=1，$n < 0$ 时 SF=1；`jle`（小于等于时跳转）读取这两个标志位，$n \le 0$ 时跳到 `.L4`，以返回值 0 返回；
# - `dot.c` 的 `for` 循环在第一次执行循环体之前检查 `i < n`；`-O2` 把这次检查放在函数入口，`testl` 与 `jle` 两条指令的效果等同于 `if (n <= 0) return 0;`。

['cmp-test-2.notes.1']
src_hash = '64bf08c2'
text = '''
-O2 rewrites the loop so that n is checked once first and then a loop with the test at the bottom is entered; only the two instructions at the entry are looked at here.
The first 4 lines of the output are the function entry and the last 4 lines are the jump target .L4; the loop lies between the two. sed -n '1,4p;/^\.L4:/,$p' prints lines 1 to 4, and the lines from .L4: to the end.
The dot.c button opens the source on the right: the source has no line if (n <= 0); it comes from the first condition check of the for loop.
'''
# src:
# 
# -O2 把循环改为先检查一次 n，再进入底部判断的循环；这里只看入口的两条指令。
# 输出的前 4 行是函数入口，后 4 行是跳转目标 .L4，两段之间是循环。sed -n '1,4p;/^\.L4:/,$p' 打印第 1 到 4 行，以及从 .L4: 到末尾的各行。

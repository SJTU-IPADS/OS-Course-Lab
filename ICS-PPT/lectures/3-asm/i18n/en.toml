['simd-history.slide.1']
src_hash = 'c797985f'
text = '''
**The evolution of the x86 SIMD vector extensions**:
1. **MMX (1996)**: introduced 64-bit vector operations (borrowing the x87 floating-point registers), supporting 8/16-bit integers;
2. **The SSE family (1999–2006)**: introduced 16 separate 128-bit registers `%xmm0` ~ `%xmm15`, with full support for single- and double-precision floating point and integers;
3. **AVX / AVX2 (2011–2013)**: widened the registers to **256 bits** (`%ymm0` ~ `%ymm15`), and introduced AVX2 integer vector arithmetic and FMA fused multiply-add;
4. **AVX-512 (2016 to the present)**: widened further to **512 bits** (`%zmm0` ~ `%zmm31`), increased the registers to 32, and added 8 dedicated mask registers `%k0` ~ `%k7`.

**Across architectures: the evolution of vectors in ARM**:
- **ARM NEON**: a fixed 128-bit SIMD extension, widely used in mobile processors and Apple Silicon;
- **ARM SVE / SVE2**: a scalable, variable-length vector architecture (Scalable Vector Extension; the vector length is determined by the hardware implementation and not fixed in the program).
'''
# src:
# 
# **x86 SIMD 向量扩展指令集演进脉络**：
# 1. **MMX（1996 年）**：引入 64 位宽向量运算（借用 x87 浮点寄存器），支持 8/16 位整型；
# 2. **SSE 系列（1999–2006 年）**：引入 16 个独立的 128 位寄存器 `%xmm0` ~ `%xmm15`，全面支持单双精度浮点与整型；
# 3. **AVX / AVX2（2011–2013 年）**：将寄存器拓宽至 **256 位**（`%ymm0` ~ `%ymm15`），引入 AVX2 整型向量算术与 FMA 乘加融合；
# 4. **AVX-512（2016 年至今）**：进一步拓宽至 **512 位**（`%zmm0` ~ `%zmm31`），寄存器增至 32 个，新增 8 个专用的掩码寄存器 `%k0` ~ `%k7`。
# 
# **跨架构对比：ARM 体系的向量演进**：
# - **ARM NEON**：固定 128 位宽度的 SIMD 扩展，广泛应用于移动端处理器与 Apple Silicon；
# - **ARM SVE / SVE2**：可伸缩可变长向量架构（Scalable Vector Extension，向量长度由硬件实现决定，程序中不写死）。


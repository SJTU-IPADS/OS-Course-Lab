['toolchain.title']
src_hash = '61ead869'
text = 'The compilation process: preprocessing, compilation, assembly and linking'
# src: 编译流程：预处理、编译、汇编与链接四阶段

['toolchain.slide.1']
src_hash = 'ed436ab9'
text = '''
**The four stages of the GNU compilation system**:
1. **Preprocessing**:
   - Command: `gcc -E dot.c -o dot.i`
   - Action: expands the preprocessor directives that begin with `#` (`#include`, `#define`), removes comments, and produces the plain C text file `.i`.
2. **Compilation**:
   - Command: `gcc -S dot.i -o dot.s`
   - Action: performs lexical analysis, syntax analysis and so on, and translates the high-level semantics into the machine-level assembly text `.s`.
3. **Assembly**:
   - Command: `gcc -c dot.s -o dot.o`
   - Action: translates the assembly mnemonics into binary machine instructions and packages them as the ELF relocatable object file `.o`.
'''
# src:
# 
# **GNU 编译系统四阶段**：
# 1. **预处理（Preprocess）**：
#    - 命令：`gcc -E dot.c -o dot.i`
#    - 动作：展开以 `#` 开头的预处理指令（`#include`, `#define`），剔除注释，生成纯 C 文本文件 `.i`。
# 2. **编译（Compile）**：
#    - 命令：`gcc -S dot.i -o dot.s`
#    - 动作：进行词法分析、语法分析等等，将高级语义翻译为机器级汇编文本 `.s`。
# 3. **汇编（Assemble）**：
#    - 命令：`gcc -c dot.s -o dot.o`
#    - 动作：将汇编助记符翻译成二进制机器指令，打包为 ELF 格式可重定位目标文件 `.o`。


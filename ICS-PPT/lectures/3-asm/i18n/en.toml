['int-arith.title']
src_hash = 'aa53b9e8'
text = 'Integer arithmetic: how the imull and addl instructions execute'
# src: 整数算术：imull 与 addl 指令的执行

['int-arith.slide.1']
src_hash = 'df89b6d5'
text = '''
**Multiply instruction: `imull`**:
- Format: `imull (%rdi), %eax` or `imull %ecx, %eax`
- Semantics: `%eax` $\leftarrow$ `%eax` $\times$ source operand
- Hardware execution: the multiplier pipeline computes the product of the two numbers and keeps only its low 32 bits, which are written to `%eax`; by the width rule introduced earlier, writing `%eax` automatically clears the upper 32 bits of `%rax`.

**Add instruction: `addl`**:
- Format: `addl %ecx, %eax`
- Semantics: `%eax` $\leftarrow$ `%eax` $+$ `%ecx`
- Hardware execution: the full adders inside the ALU perform a 32-bit binary addition, and the result is written back to the register.
'''
# src:
# 
# **乘法指令：`imull`**：
# - 格式：`imull (%rdi), %eax` 或 `imull %ecx, %eax`
# - 语义：`%eax` $\leftarrow$ `%eax` $\times$ 源操作数
# - 硬件执行：乘法器流水线计算两数乘积，乘积只保留低 32 位写入 `%eax`；根据前面介绍的位宽规则，写入 `%eax` 会将 `%rax` 的高 32 位自动清零。
# 
# **加法指令：`addl`**：
# - 格式：`addl %ecx, %eax`
# - 语义：`%eax` $\leftarrow$ `%eax` $+$ `%ecx`
# - 硬件执行：ALU 内部全加器执行 32 位二进制加法，结果写回寄存器。


['stack-frame-2.slide.1']
src_hash = 'fe88f8c8'
text = '''
**Allocating, using and releasing a stack frame**:
1. **Allocation**: `subq $40, %rsp` subtracts 40 from `%rsp`, and the 40 bytes starting at `%rsp` become the stack frame of `main`;
2. **Use**: local variables are accessed at offsets relative to `%rsp`: `x[i]` is at offset $4i$ and `w[i]` at offset $16 + 4i$. The offsets are fixed at compile time and `%rsp` differs from call to call, so the same instructions access the local variables of the current call;
3. **Release**: before returning, `addq $40, %rsp` adds 40 back to `%rsp`, which releases the stack frame; its data need not be cleared.
'''
# src:
# 
# **栈帧的分配、使用与释放**：
# 1. **分配**：`subq $40, %rsp` 把 `%rsp` 减 40，从 `%rsp` 开始的 40 字节成为 `main` 的栈帧；
# 2. **使用**：局部变量按相对 `%rsp` 的偏移访问，`x[i]` 位于偏移 $4i$，`w[i]` 位于偏移 $16 + 4i$。偏移在编译时确定，每次调用的 `%rsp` 不同，同一段指令因此访问本次调用的局部变量；
# 3. **释放**：返回前 `addq $40, %rsp` 把 `%rsp` 加回 40，栈帧随之释放，其中的数据不需要清除。


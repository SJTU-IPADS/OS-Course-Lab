['call-checklist-5.slide.1']
src_hash = '11ddf1ac'
text = '''
**The solutions of the five problems fall into three kinds**:
- **Two instructions**: `call` and `ret`, whose behavior is specified by the ISA;
- **Two conventions**: passing data and the use of registers, followed by the compiler when it generates instructions;
- **The run-time stack**: the return address, the arguments passed on the stack, the saved register values and the local variables are all stored in the stack frame.
'''
# src:
# 
# **五个问题的解决方式分为三类**：
# - **两条指令**：`call` 与 `ret`，行为由 ISA 规定；
# - **两项约定**：数据的传递与寄存器的使用，由编译器在生成指令时遵守；
# - **运行时栈**：返回地址、经栈传递的参数、保存的寄存器值与局部变量都存放在栈帧中。


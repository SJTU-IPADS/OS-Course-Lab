The four items of the slide “Can we do it more efficiently and safely?” of the original deck correspond to the live-demo pages of this section: set breakpoints on the critical path, watch registers and memory, single-step, terminate the program if needed. The demo of the original deck is one session: b main, r, layout asm, x/s, ni, ni, x/s $rdi, p/x $rdi, b *ADDR, quit; here it is two sessions, and each demo button starts gdb once.

__stack_chk_fail: at the start of phase_light, mov %fs:0x28,%rax and mov %rax,-0x8(%rbp) store the canary in the stack frame; at the end, sub %fs:0x28,%rax checks it, and __stack_chk_fail is called when it has been overwritten. Every phase of the bomb of the lab has these instructions; they have nothing to do with the answer.
The two questions of the original deck on this slide: scanf, where is the password stored; printf/puts, which instruction prints bomb.

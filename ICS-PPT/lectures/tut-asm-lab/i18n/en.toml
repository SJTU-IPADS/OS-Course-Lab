['bomb-main.slide.1']
src_hash = '9b3c817c'
text = '''
- **`call ac23 <initialize_bomb>`**: the target of the `call` is address `0xac23`; the angle brackets hold the symbol at that address, here the name of a function;
- **`read_line`** reads a line and returns its address in `%rax`. `mov %rax,%rdi` passes it as the first argument to **`phase_light`**;
- **`phase_defused`** is called after `phase_light` returns: the bomb is defused;
- Under what condition does `phase_light` return?
'''
# src:
# 
# - **`call ac23 <initialize_bomb>`**：`call` 的目标是地址 `0xac23`，尖括号中是这个地址上的符号，这里是函数名；
# - **`read_line`** 读入一行，返回值是这一行的地址，在 `%rax` 中。`mov %rax,%rdi` 把它作为第一个参数传给 **`phase_light`**；
# - **`phase_defused`** 在 `phase_light` 返回之后被调用：炸弹被拆除；
# - `phase_light` 在什么条件下返回？

['bomb-main.notes.1']
src_hash = '74eaaa76'
text = '''
The listing is the part of main in the output of objdump -d bomb-light (from line 844 of bomb-light.asm). main has 19 instructions; the page leaves out the first 9 and the last 3, written as ..., and the English comments at the ends of those two lines were added by the lecture. The four calls are marked.
The first 9 instructions set up the stack frame, store the two parameters of main, argc and argv, in the frame, and pass them on to initialize_bomb; the last 3 are mov $0x0,%eax, leave and ret, that is, return 0.
The C code: initialize_bomb(argc, argv); line = read_line(); phase_light(line); phase_defused();. mov %rax,-0x8(%rbp) and mov -0x8(%rbp),%rax store the return value in the local variable line and read it back.
The names of the functions come from the symbol table of the executable (objdump -t bomb-light). bomb-light keeps its symbol table; the output of file says not stripped.
'''
# src:
# 
# 清单取自 objdump -d bomb-light 的输出中 main 的部分（bomb-light.asm 的第 844 行起）。main 共 19 条指令，页面上省略了开头 9 条与结尾 3 条，写成 ...，这两行行尾的英文注释是讲义加的。有底色的是四条 call。
# 开头 9 条建立栈帧，把 main 的两个参数 argc、argv 存入栈帧，再作为参数传给 initialize_bomb；结尾 3 条是 mov $0x0,%eax、leave、ret，即 return 0。
# 对应的 C 代码：initialize_bomb(argc, argv); line = read_line(); phase_light(line); phase_defused();。mov %rax,-0x8(%rbp) 与 mov -0x8(%rbp),%rax 把返回值存入局部变量 line，再读出。
# 函数名来自可执行文件的符号表（objdump -t bomb-light）。bomb-light 保留了符号表，file 的输出中有 not stripped。


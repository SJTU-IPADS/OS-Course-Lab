text = 'A live demo: single-step, examine the return value and the two numbers compared'
# src: 现场演示：单步执行，查看返回值与比较的两个数

['gdb-step.slide.1']
src_hash = '28e9d07b'
text = '''
- **`ni`** at the `call` runs until `sscanf` returns: the return value `%eax` is 1, and `x/dw $rbp-0xc` shows that `x` is 224;
- After three more **`ni`** the program is stopped before the `cmp` at `0xaad1`: `%eax` is 224, and the immediate is 20261013.
'''
# src:
# 
# - **`ni`** 在 `call` 上执行到 `sscanf` 返回：返回值 `%eax` 是 1，`x/dw $rbp-0xc` 显示 `x` 是 224；
# - 三次 **`ni`** 之后停在 `0xaad1` 处的 `cmp` 之前：`%eax` 是 224，立即数是 20261013。

['gdb-step.notes.1']
src_hash = 'fcacdd4c'
text = '''
The code block continues the session of the previous page and is from the same recording (2026-10-11).
The first ni executes the call at 0xaabf, runs until sscanf returns, and stops at 0xaac4 (run-time address 0x70cf753d6ac4). The $1 in the output of p $eax is the number gdb gives this result. In x/dw, d means decimal and w means 4 bytes.
The next three ni execute cmp $0x1,%eax, je aace and mov -0xc(%rbp),%eax: the je jumps, and the call explode_bomb at 0xaac9 is not executed.
p 0x1352895: gdb converts the hexadecimal number to decimal. 224 and 20261013 are not equal, and execution would go on into explode_bomb.
At this point of the session quit is entered: gdb asks Quit anyway? (y or n) and leaves on the answer y, and bomb-light ends with it.
'''
# src:
# 
# 代码块接着上一页的会话，取自同一次记录（2026-10-11）。
# 第一次 ni 执行 0xaabf 处的 call，到 sscanf 返回，停在 0xaac4 处（运行时的地址 0x70cf753d6ac4）。p $eax 输出中的 $1 是 gdb 给这个结果的编号。x/dw 的 d 表示十进制，w 表示 4 个字节。
# 其后三次 ni 依次执行 cmp $0x1,%eax、je aace、mov -0xc(%rbp),%eax：je 发生跳转，0xaac9 处的 call explode_bomb 没有执行。
# p 0x1352895：gdb 把十六进制数换算成十进制。224 与 20261013 不相等，继续执行将进入 explode_bomb。
# 这次会话到这里执行 quit：gdb 询问 Quit anyway? (y or n)，回答 y 之后退出，bomb-light 随之结束。


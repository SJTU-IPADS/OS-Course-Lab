['objdump.notes.1']
src_hash = 'a201e46f'
text = '''
objdump is part of the GNU binutils package. The rows of the table are the descriptions of these options in objdump --help: -d is --disassemble, which disassembles the executable sections; -D is --disassemble-all, which disassembles all sections; -s is --full-contents; -f is --file-headers; -t is --syms. There is also -h (--section-headers), which shows the name, size and address of every section.
-D decodes the bytes of data sections as instructions too: the machine-code column is the data itself and the instruction column has no meaning. Use -s to look at data.
--disassemble=main prints one function only; the name of the function follows the equals sign.
'''
# src:
# 
# objdump 属于 GNU 的 binutils 软件包。表中各行是 objdump --help 中这些选项的说明：-d 是 --disassemble，反汇编可执行的节；-D 是 --disassemble-all，反汇编所有的节；-s 是 --full-contents；-f 是 --file-headers；-t 是 --syms。另有 -h（--section-headers），显示各节的名字、大小与地址。
# -D 把数据节的字节也当作指令译出：机器码一栏是数据本身，汇编指令一栏没有意义。查看数据用 -s。
# --disassemble=main 只输出一个函数；函数的名字写在等号之后。


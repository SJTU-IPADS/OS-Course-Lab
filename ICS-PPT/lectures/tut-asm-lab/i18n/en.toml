['bomb-args.slide.1']
src_hash = 'ea848fd8'
text = '''
- **`int sscanf(const char *str, const char *format, ...)`**: reads data from the string `str` according to the format string `format` and writes it to the addresses given by the following arguments;
- **`%rdi`**: the value in `-0x18(%rbp)`, that is, the parameter of `phase_light` stored at `0xaa92`: the line that was read;
- **`%rsi`**: the address of the format string, `0xcb02c`. `0xc057c(%rip)` is the address of the next instruction, `0xaab0`, plus `0xc057c`; `objdump` writes the result after the `#`;
- **`%rdx`**: the address `%rbp - 0xc`; `sscanf` writes the data it reads here. What is the format string at `0xcb02c`?
'''
# src:
# 
# - **`int sscanf(const char *str, const char *format, ...)`**：按格式串 `format` 从字符串 `str` 中读出数据，写入其后各个参数给出的地址；
# - **`%rdi`**：`-0x18(%rbp)` 中的值，即 `0xaa92` 处存入的 `phase_light` 的参数，读入的一行；
# - **`%rsi`**：格式串的地址 `0xcb02c`。`0xc057c(%rip)` 是下一条指令的地址 `0xaab0` 加 `0xc057c`，`objdump` 在 `#` 之后写出结果；
# - **`%rdx`**：地址 `%rbp - 0xc`，`sscanf` 把读出的数据写入这里。`0xcb02c` 处的格式串是什么？

['bomb-args.notes.1']
src_hash = '68e4e96f'
text = '''
The listing is the instruction of phase_light at 0xaa92 and the 7 instructions from 0xaaa5 to 0xaabf; the 3 left out in between belong to the canary. The three marked lines write the registers of the three arguments of sscanf: the first argument is in %rdi, the second in %rsi, the third in %rdx.
The mov $0x0,%eax before the call: when a function with a variable number of arguments is called, %al gives the number of vector registers used by the arguments, here 0.
0xc057c(%rip): %rip is the address of the next instruction, 0xaab0, and 0xaab0 + 0xc057c = 0xcb02c. A position-independent program takes the addresses of its data in this way; the format string of every phase of the bomb of the lab is taken like this. The cb02c after the # is the address objdump computed, and <__rseq_flags+0x28> is the nearest symbol plus an offset; the format string has no symbol of its own. This line has 6 spaces fewer before the # than the output of objdump.
lea computes an address without accessing memory. -0xc(%rbp) is in the stack frame of phase_light, 4 of the 32 bytes reserved by sub $0x20,%rsp.
'''
# src:
# 
# 清单是 phase_light 中 0xaa92 处的一条指令与 0xaaa5 到 0xaabf 的 7 条指令，中间省略的 3 条属于金丝雀。有底色的三行写入 sscanf 的三个参数所在的寄存器：第一个参数在 %rdi，第二个在 %rsi，第三个在 %rdx。
# call 之前的 mov $0x0,%eax：调用参数个数可变的函数时，%al 给出用于传递参数的向量寄存器的个数，这里是 0。
# 0xc057c(%rip)：%rip 是下一条指令的地址 0xaab0，0xaab0 + 0xc057c = 0xcb02c。位置无关的程序用这种方式取得数据的地址；实验的 bomb 每个阶段的格式串都这样取得。行尾 # 之后的 cb02c 是 objdump 算出的地址，<__rseq_flags+0x28> 是离这个地址最近的符号加偏移，格式串本身没有符号。这一行 # 之前的空格比 objdump 的输出少 6 个。
# lea 计算地址，不访问内存。-0xc(%rbp) 在 phase_light 的栈帧中，是 sub $0x20,%rsp 留出的 32 字节中的 4 个。


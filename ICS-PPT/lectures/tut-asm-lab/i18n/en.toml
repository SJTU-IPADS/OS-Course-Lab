['link-static.title']
src_hash = 'd0cee135'
text = 'Dynamic Link vs. Static Link'
# src: 静态链接与动态链接

['link-static.demo.1.name']
src_hash = '52fc7151'
text = 'Compare bomb-light and /bin/bash'
# src: 比较 bomb-light 与 /bin/bash

['link-static.slide.1']
src_hash = '6d7cd341'
text = '''
- **`gcc -static`**: static linking; the code of the C library functions is copied into the executable. `bomb-light` contains the code of `sscanf`, at `0x2b880`;
- **Dynamic linking**: the code of the C library functions is in a shared library, loaded when the program starts; the executable does not contain it. `/bin/bash` is dynamically linked;
- **`file`**: `static-pie linked` (or `statically linked`) and `dynamically linked` in its output give the kind of linking;
- **`pie executable`**: a position-independent executable. `objdump` shows addresses in the file, and run-time address = load address + address in the file;
- **The `bomb` of the lab** is like `bomb-light`: statically linked and position-independent.
'''
# src:
# 
# - **`gcc -static`**：静态链接，C 库函数的代码被复制进可执行文件。`bomb-light` 中有 `sscanf` 的代码，在 `0x2b880` 处；
# - **动态链接**：C 库函数的代码在共享库中，程序启动时装入，可执行文件中没有这些代码。`/bin/bash` 是动态链接的；
# - **`file`**：输出中的 `static-pie linked`（或 `statically linked`）与 `dynamically linked` 给出链接的方式；
# - **`pie executable`**：位置无关的可执行文件。`objdump` 显示文件中的地址，运行时的地址 = 装入位置 + 文件中的地址；
# - **实验的 `bomb`** 与 `bomb-light` 相同：静态链接，位置无关。

['link-static.notes.1']
src_hash = '82a9ba7a'
text = '''
Linking is covered in Lecture 5, “How several files become one program”; this page uses only the output of file. The output was recorded on 2026-10-11 in an ubuntu:26.04 container; file is in the package file.
The fields of a line of file output are separated by commas; cut -d, -f1,4 keeps the 1st and the 4th. The full line also has the processor architecture, the BuildID and not stripped (the symbol table is kept).
bomb-light is linked with gcc -static-pie: statically linked and position-independent.
When a dynamically linked program calls a C library function, the target of the call is a short piece of code in the executable named “FUNC@plt”, which goes on to the function in the shared library.
The three items of the original deck on this slide: -static of gcc; the ELF information dynamic/static of file; the PC addresses in objdump are different. The tip of the original deck is that the demo bomb is statically linked and the exercise bomb dynamically linked; in this course bomb-light and the bomb of the lab are both statically linked position-independent programs.
'''
# src:
# 
# 链接在第五讲「多个文件如何合成一个程序」中讲解，这一页只用到 file 的输出。输出记录于 2026-10-11，在 ubuntu:26.04 的容器中；file 在软件包 file 中。
# file 输出的一行中各项以逗号分隔，cut -d, -f1,4 留下第 1 项与第 4 项。完整的一行还有处理器的架构、BuildID 与 not stripped（保留了符号表）等。
# bomb-light 用 gcc -static-pie 链接：静态链接，并且位置无关。
# 动态链接的程序调用 C 库函数时，call 的目标是可执行文件中名为「函数名@plt」的一小段代码，由它转到共享库中的函数。
# 原课件这一页的三项：gcc 的 -static；file 的 ELF 信息 dynamic/static；objdump 中 PC 地址不同。原课件的提示是演示用的炸弹静态链接、练习用的炸弹动态链接；本课程的 bomb-light 与实验的 bomb 都是静态链接的位置无关程序。


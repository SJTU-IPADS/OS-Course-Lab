The output on the page is another session of 2026-10-11 in an ubuntu:26.04 container. The first two ... are as in the previous demo: at the start, the two lines of gdb reading the symbols; after r, Starting program, the warning and the two lines of explanation of bomb-light. At the final ..., gdb prints A debugging session is active., Inferior 1 [process 3067] will be killed. and Quit anyway? (y or n), and leaves on the answer y; phase 1 of 1 exploded does not appear on the terminal.

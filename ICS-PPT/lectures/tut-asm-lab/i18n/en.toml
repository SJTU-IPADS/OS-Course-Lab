['docker-run.demo.1.name']
src_hash = '38ec6f98'
text = 'Run an ubuntu container and execute commands in it'
# src: 运行 ubuntu 容器，在其中执行命令

['docker-run.slide.1']
src_hash = 'a742b6ae'
text = '''
- **`docker run IMAGE COMMAND`**: creates a container from the image and runs the command in it; here the command is `bash`;
- **`-it`**: gives the current terminal to the `bash` in the container; it reads what the keyboard types, and its output appears on the terminal;
- **`--rm`**: removes this container when it stops, together with the files written in it;
- **The prompt `root@b3bcc8442459`**: what follows `@` is the id of this container. `uname -m` prints `x86_64`;
- **`exit`**: ends `bash`, and the container stops with it.
'''
# src:
# 
# - **`docker run 镜像 命令`**：由镜像创建一个容器，在容器中运行命令，这里的命令是 `bash`；
# - **`-it`**：把当前的终端交给容器中的 `bash`，键盘的输入由它读取，它的输出显示在终端上；
# - **`--rm`**：容器停止时删除这个容器，在其中写入的文件一并删除；
# - **提示符 `root@b3bcc8442459`**：`@` 后面是这个容器的编号。`uname -m` 输出 `x86_64`；
# - **`exit`**：结束 `bash`，容器随之停止。

['docker-run.notes.1']
src_hash = 'c55c22e9'
text = '''
The demo button runs this command on a terminal, and every line typed afterwards is executed by the bash in the container; the output on the page is one run on 2026-10-09, in which three lines were typed: uname -m, head -1 /etc/os-release and exit. The id of the container differs from run to run.
-i keeps the standard input of the container open and -t allocates a terminal for it; the two are written together as -it.
Every docker run creates a new container. With --rm, the container is removed once bash ends: docker ps -a does not list it, and the software installed and the files written in it are removed with it.
On a Mac with an Apple chip, Docker Desktop translates the instructions in an x86-64 container into arm64 instructions; uname -m prints x86_64 there as well, and the container runs slower than an arm64 one.
'''
# src:
# 
# 演示按钮在终端中运行这条命令，随后输入的每一行由容器中的 bash 执行；页面上的输出是 2026-10-09 的一次运行：输入了 uname -m、head -1 /etc/os-release、exit 三行。容器的编号每次运行都不同。
# -i 保持容器的标准输入打开，-t 为容器分配一个终端，两者合写为 -it。
# 每执行一次 docker run 就创建一个新的容器。带 --rm 时，bash 结束后这个容器被删除，docker ps -a 的列表中没有它，在其中安装的软件与写入的文件随之删除。
# Apple 芯片的 Mac 上，x86-64 容器中的指令由 Docker Desktop 翻译为 arm64 指令执行，uname -m 同样输出 x86_64，运行速度比 arm64 的容器慢。


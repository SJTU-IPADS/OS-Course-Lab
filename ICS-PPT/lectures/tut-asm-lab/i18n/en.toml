text = '''
The demo button starts gdb in a terminal, and the commands that follow are typed on the keyboard. The output on the page is a session of 2026-10-11 in an ubuntu:26.04 container with bomb-light in /root/examples; -q makes gdb start without printing its version, and BOMB_UI=plain makes bomb-light print text only.
The ... at the start stands for the two lines gdb prints while reading the symbols: Reading symbols from bomb-light... and (No debugging symbols found in bomb-light). bomb-light was compiled without -g and has no debugging information; the names of functions come from the symbol table, and b phase_light still works.
The ... after r stands for 4 lines: Starting program: /root/examples/bomb-light; warning: Error disabling address space randomization: Operation not permitted; the two lines of explanation printed by bomb-light.
The warning line: when it starts the program, gdb tries to turn off address space randomization, and the container does not allow it, so the load address differs on every run; in another session of the same day this breakpoint was at 0x00007ce123c9da92. The line does not appear when gdb runs directly on a Linux host, and the load address is then the same on every run.
The breakpoint of b phase_light is 8 bytes after the start of the function (phase_light+8): gdb skips the three instructions push %rbp, mov %rsp,%rbp and sub $0x20,%rsp. The load address 0x70cf753cc000 is 0x70cf753d6a92 - 0xaa92.
The demo of the original deck runs layout asm after r, which opens the assembly window and shows the code around the current instruction; the output on the page is text and does not include that window.
'''
# src:
# 
# 演示按钮在终端中启动 gdb，之后的命令从键盘输入。页面上的输出是 2026-10-11 在 ubuntu:26.04 的容器中的一次会话，bomb-light 在 /root/examples 中；-q 使 gdb 启动时不输出版本信息，BOMB_UI=plain 使 bomb-light 只输出文字。
# 开头的 ... 处是 gdb 读入符号时输出的两行：Reading symbols from bomb-light... 与 (No debugging symbols found in bomb-light)。bomb-light 没有用 -g 编译，没有调试信息；函数名来自符号表，b phase_light 仍然可用。
# r 之后的 ... 处是 4 行：Starting program: /root/examples/bomb-light；warning: Error disabling address space randomization: Operation not permitted；bomb-light 输出的两行说明。
# warning 一行：gdb 启动程序时要关闭地址空间随机化，容器不允许这项操作，装入位置因此每次运行都不同；同一天的另一次会话中这个断点在 0x00007ce123c9da92。直接在 Linux 主机上运行 gdb 时没有这一行，装入位置每次相同。
# b phase_light 的断点在函数开头之后 8 个字节处（phase_light+8）：gdb 跳过了 push %rbp、mov %rsp,%rbp、sub $0x20,%rsp 三条指令。装入位置 0x70cf753cc000 由 0x70cf753d6a92 - 0xaa92 得到。
# 原课件的演示在 r 之后执行 layout asm，打开汇编窗口，显示当前指令前后的汇编代码；页面上的输出是文字，没有这个窗口。

['gdb-args.title']
src_hash = 'dcb5f337'
text = 'A live demo: stop before call sscanf and examine the arguments'
# src: 现场演示：在 call sscanf 之前停下，查看参数

['gdb-args.slide.1']
src_hash = '26a0d556'
text = '''
- **`x/s $rdi`**: the program is stopped at `0xaa92`, and `%rdi` is the parameter of `phase_light`, the line that was read;
- **`b *phase_light+53`**: `call sscanf` is at `0xaabf`, and `0xaabf - 0xaa8a = 53`. The address of the breakpoint is written as a function name plus an offset, and `gdb` computes the run-time address;
- **`c`**: continues, and the program stops before `call sscanf`. `x/s $rsi` shows the second argument of `sscanf`, the format string `%d`.
'''
# src:
# 
# - **`x/s $rdi`**：程序停在 `0xaa92` 处，`%rdi` 是 `phase_light` 的参数，读入的一行；
# - **`b *phase_light+53`**：`call sscanf` 在 `0xaabf`，`0xaabf - 0xaa8a = 53`。断点的地址写成函数名加偏移，`gdb` 算出运行时的地址；
# - **`c`**：继续运行，停在 `call sscanf` 之前。`x/s $rsi` 显示 `sscanf` 的第二个参数，格式串 `%d`。

['gdb-args.notes.1']
src_hash = 'c1e54b8f'
text = '''
The code block continues the session of the previous page and is from the same recording (2026-10-11).
x/s $rdi: the line in angle brackets is the symbol at this address. In gdb the names of registers start with $: $rdi, $eax, $pc (that is, %rip).
b *phase_light+53: an address follows the asterisk, written here as a function name plus an offset; gdb computes 0x70cf753d6abf from the run-time address, the load address plus 0xaabf. After the program has started, a breakpoint written with an address in the file cannot be inserted: checked on 2026-10-11, after b *0xaad1 and c gdb reports Cannot insert breakpoint 2. Cannot access memory at address 0xaad1.
x/s $rsi: 0x70cf7549702c is the load address plus 0xcb02c.
'''
# src:
# 
# 代码块接着上一页的会话，取自同一次记录（2026-10-11）。
# x/s $rdi：尖括号中的 line 是这个地址上的符号。gdb 中寄存器的名字以 $ 开头：$rdi、$eax、$pc（即 %rip）。
# b *phase_light+53：星号之后是地址，这里写成函数名加偏移，gdb 按运行时的地址算出 0x70cf753d6abf，即装入位置加 0xaabf。程序启动之后，按文件中的地址写的断点插入不了：2026-10-11 核对过，执行 b *0xaad1 与 c 之后，gdb 报告 Cannot insert breakpoint 2. Cannot access memory at address 0xaad1。
# x/s $rsi：0x70cf7549702c 是装入位置加 0xcb02c。


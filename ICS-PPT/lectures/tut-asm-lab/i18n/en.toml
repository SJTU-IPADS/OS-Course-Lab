['lab-solve-bomb.notes.1']
# CHANGED: was 737bb10d
src_hash = '48db1467'
text = '''
The lab solve-bomb is not graded. The lab material is three files in the directory ICS-Labs/BombLab on the main branch of the GitHub repository SJTU-IPADS/OS-Course-Lab; the bomb-light among them is the program this lecture takes apart.
The first two lines of the code block are run on the host: they fetch the repository and copy the directory BombLab into the container ics set up on the page about running a container in the background, where it becomes /root/BombLab. The third line enters the container, and the remaining lines are run in the container.
make bomb ID=<student ID> sends the student ID to the course server, which generates the bomb of that ID and returns it; the same ID gets the same bomb every time. Your own student ID goes after ID=.
On 2026-10-11, in an ubuntu:26.04 container, the four packages were installed with apt, and make bomb with a test ID fetched a bomb. On 2026-10-11 the repository did not have the directory ICS-Labs/BombLab yet, and the first two lines have not been run.
The display of bomb takes over the whole terminal window; what to note when running it under gdb is in the section 在 gdb 中运行时的几件事 of README.md.
'''
# src:
# 
# 实验 solve-bomb 不计分。实验材料是三个文件，在 GitHub 仓库 SJTU-IPADS/OS-Course-Lab 的 main 分支的目录 ICS-Labs/BombLab 中；其中的 bomb-light 就是本讲拆除的程序。
# 代码块的前两行在宿主机上执行：取得仓库，把目录 BombLab 复制进「后台运行容器」一页建立的容器 ics，成为 /root/BombLab。第三行进入容器，其余各行在容器中执行。
# make bomb ID=学号 把学号发给课程服务器，服务器生成这个学号的 bomb 并传回；同一个学号每次得到的 bomb 相同。ID= 之后写自己的学号。
# 2026-10-11 在 ubuntu:26.04 的容器中执行过：用 apt 安装这四个软件包，用测试学号执行 make bomb 并取得 bomb。2026-10-11 仓库中还没有目录 ICS-Labs/BombLab，前两行没有执行过。
# bomb 的画面占据整个终端窗口；在 gdb 中运行时要注意的事项见 README.md「在 gdb 中运行时的几件事」一节。

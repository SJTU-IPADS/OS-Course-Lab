text = '''
bomb-light is an executable in the directory examples/, the same file as the bomb-light in the material of the lab solve-bomb. The output was recorded on 2026-10-11.
The machine-code column: push %rbp is the single byte 55, and mov %rsp,%rbp is the 3 bytes 48 89 e5. The address of the next instruction is the address of this one plus its number of bytes: 0xaa49 + 1 = 0xaa4a, 0xaa4a + 3 = 0xaa4d.
0xaa49 is an address in the file: when bomb-light runs it is loaded somewhere in memory, and the address of main is the load address plus 0xaa49. The live demo of the section “Using GDB” shows the addresses at run time.
Without sed, objdump -d bomb-light prints the assembly code of the whole file, 196119 lines. The +5 in the address range is GNU sed syntax.
'''

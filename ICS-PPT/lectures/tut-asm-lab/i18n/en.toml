['docker-install.notes.1']
src_hash = '3afed4e0'
text = '''
The three addresses are the installation pages of the official Docker documentation; the download buttons of the installers are at the top of each page. All three addresses opened on 2026-10-09.
The two macOS installers are named Docker Desktop for Mac with Apple silicon and Docker Desktop for Mac with Intel chip on the page.
The Windows installer has the option Use WSL 2 instead of Hyper-V on its Configuration page; when it is selected, Docker Desktop runs Linux containers with WSL 2.
On Linux the software to install is Docker Engine, installed with apt by the steps of the installation page; an x86-64 Linux machine can also do without docker and complete the labs of the course directly.
The output of docker --version is the version on this machine; the version number depends on when docker was installed.
'''
# src:
# 
# 三个地址都是 Docker 官方文档的安装页，页面开头是安装包的下载按钮。2026-10-09 三个地址都能打开。
# macOS 的两个安装包在页面上的名字是 Docker Desktop for Mac with Apple silicon 与 Docker Desktop for Mac with Intel chip。
# Windows 的安装程序在 Configuration 页上有选项 Use WSL 2 instead of Hyper-V，选中时 Docker Desktop 用 WSL 2 运行 Linux 容器。
# Linux 上安装的是 Docker Engine，按安装页的步骤用 apt 安装；x86-64 的 Linux 机器也可以不用 docker，直接在本机完成课程的实验。
# docker --version 的输出是本机的版本，版本号随安装的时间不同。


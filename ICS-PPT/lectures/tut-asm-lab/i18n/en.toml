['bomb-strings.slide.1']
src_hash = '4a46c2dd'
text = '''
- **`objdump -s`**: shows the contents of sections. A line holds the address, the bytes in hexadecimal, and the characters the bytes stand for, with `.` for a byte that cannot be displayed;
- **`25 64 00`**: the characters `%` and `d` and the terminating 0. The string at `0xcb02c` is `%d`;
- **`%d`**: read one decimal integer. `sscanf` writes this integer to the 4 bytes from `-0xc(%rbp)`; this local variable is called `x` below;
- **The return value of `sscanf`** is the number of items read successfully, in `%eax`.
'''
# src:
# 
# - **`objdump -s`**：显示节的内容。一行依次是地址、十六进制的字节、这些字节对应的字符，不能显示的字节写成 `.`；
# - **`25 64 00`**：字符 `%`、`d` 与结尾的 0。`0xcb02c` 处的字符串是 `%d`；
# - **`%d`**：读出一个十进制整数。`sscanf` 把这个整数写入 `-0xc(%rbp)` 起的 4 个字节，下面把这个局部变量称为 `x`；
# - **`sscanf` 的返回值**是成功读出的数据的个数，在 `%eax` 中。

['bomb-strings.notes.1']
src_hash = '626e6a02'
text = '''
objdump -s shows the contents of sections, --start-address and --stop-address limit the range of addresses, and tail -1 keeps only the last line of the output; before it come the file name, the section name .rodata and blank lines. The output was recorded on 2026-10-11. 0xcb02c is again an address in the file.
A string ends with a byte of value 0.
The original deck reads these bytes from the output of objdump -D: -D disassembles .rodata as instructions too, the machine-code column is these bytes, and the instruction column has no meaning.
The names of local variables are not in the executable; x is a name given by the lecture. When the line does not start with an integer, the return value of sscanf is not 1.
x/s in gdb shows the string at an address directly; see the section “Using GDB”.
'''
# src:
# 
# objdump -s 显示节的内容，--start-address 与 --stop-address 限定地址的范围，tail -1 只留下输出的最后一行，它之前是文件名、节名 .rodata 与空行。输出记录于 2026-10-11。0xcb02c 同样是文件中的地址。
# 字符串以值为 0 的字节结束。
# 原课件用 objdump -D 的输出读这些字节：-D 把 .rodata 也按指令反汇编，机器码一栏就是这些字节，汇编指令一栏没有意义。
# 局部变量的名字不在可执行文件中，x 是讲义起的名字。输入的一行不以整数开头时，sscanf 的返回值不是 1。
# gdb 的 x/s 直接显示一个地址上的字符串，见「使用 GDB」一节。

['bomb-branch.title']
src_hash = 'd4a746a2'
text = 'Find the key instructions: cmp and je decide whether call explode_bomb runs'
# src: 找出关键的指令：cmp 与 je 决定是否执行 call explode_bomb

['bomb-branch.slide.1']
src_hash = '93331c1f'
text = '''
- **`jmp`, `jXX`** change the control flow; **`cmp`, `test`** set the flags they depend on. `je` jumps when the two compared numbers are equal;
- **`cmp $0x1,%eax`, `je aace`**: `%eax` is the return value of `sscanf`. When it equals 1, the `call explode_bomb` at `0xaac9` is skipped;
- **`cmp $0x1352895,%eax`, `je aadd`**: `%eax` is `x`, read from `-0xc(%rbp)`. When it equals `0x1352895`, the `call explode_bomb` at `0xaad8` is skipped;
- **The right input**: one integer, equal to `0x1352895`, which is 20261013 in decimal.
'''
# src:
# 
# - **`jmp`、`jXX`** 改变控制流，**`cmp`、`test`** 设置它们所依据的标志位。`je` 在比较的两个数相等时跳转；
# - **`cmp $0x1,%eax`、`je aace`**：`%eax` 是 `sscanf` 的返回值。它等于 1 时跳过 `0xaac9` 处的 `call explode_bomb`；
# - **`cmp $0x1352895,%eax`、`je aadd`**：`%eax` 是从 `-0xc(%rbp)` 读出的 `x`。它等于 `0x1352895` 时跳过 `0xaad8` 处的 `call explode_bomb`；
# - **正确的输入**：一个整数，等于 `0x1352895`，十进制是 20261013。

['bomb-branch.notes.1']
src_hash = 'd313cae8'
text = '''
The listing is the 9 instructions of phase_light from 0xaabf to 0xaadd; the two pairs of cmp and je are marked.
cmp $0x1,%eax computes %eax - 1 and sets the flags without keeping the result; je jumps when ZF is 1.
je aace <phase_light+0x44>: the target of the jump is 0xaace; the angle brackets hold the function name plus an offset, 0xaa8a + 0x44 = 0xaace.
0x1352895 = 1×16⁶ + 3×16⁵ + 5×16⁴ + 2×16³ + 8×16² + 9×16 + 5 = 20261013. A calculator does the conversion; p 0x1352895 in gdb also prints 20261013.
After 0xaadd come the check of the canary and leave, ret. When both je jump, phase_light returns and main goes on to call phase_defused.
The conclusion of the original deck on this slide: -0x4(%rbp) == %eax == 0xbeef.
'''
# src:
# 
# 清单是 phase_light 中 0xaabf 到 0xaadd 的 9 条指令，有底色的是两组 cmp 与 je。
# cmp $0x1,%eax 计算 %eax - 1，只设置标志位，不保存结果；je 在 ZF 为 1 时跳转。
# je aace <phase_light+0x44>：跳转的目标是 0xaace，尖括号中是函数名加偏移，0xaa8a + 0x44 = 0xaace。
# 0x1352895 = 1×16⁶ + 3×16⁵ + 5×16⁴ + 2×16³ + 8×16² + 9×16 + 5 = 20261013。换算可以用计算器；gdb 中执行 p 0x1352895 也输出 20261013。
# 0xaadd 之后是金丝雀值的检验与 leave、ret。两条 je 都跳转时 phase_light 返回，main 接着调用 phase_defused。
# 原课件这一页的结论是 -0x4(%rbp) == %eax == 0xbeef。


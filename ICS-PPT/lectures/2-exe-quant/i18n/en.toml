1. Find the weight with the largest absolute value and its sign
2. Determine the step `d` from it, and precompute its reciprocal `id`
3. Round `d` to half precision and write it into the first two bytes
4. Multiply each weight by `id` and round to nearest, giving a code from 0 to 15
5. Combine every two codes into one byte
'''

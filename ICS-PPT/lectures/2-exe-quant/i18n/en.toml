['summary.slide.1']
src_hash = '24d9b287'
text = '''

- The object of the lab is a 4.25 GB file: 625 tensors, 310 of them in the language model, with all compressible bytes in 197 matrices
- The framework reads and writes by segment; the two block functions of this session process 32 `float`s per call
- Of the four conversion functions, `f32_to_fp16` matters most; its ties-to-even handling determines the md5 of the output
- The five steps of Q4_0: find `amax`, determine `d`, write `d`, convert to codes, write with `j` paired with `j + 16`
- Six lines of "matches expected" are the acceptance test of this session; the error line is not compared
'''
# src:
# 
# - 实验对象是一个 4.25 GB 的文件：625 个张量，310 个属于语言模型，可压缩的字节全部位于 197 个矩阵中
# - 框架按段读写，本节实现的两个块函数每次只处理 32 个 `float`
# - 四个转换函数里 `f32_to_fp16` 最关键，平局取偶的处理决定产物的 md5
# - Q4_0 的五步：定 `amax`、定 `d`、写 `d`、换算码字、按 `j` 与 `j + 16` 配对写入
# - 六行「与期望值一致」是本节的验收，误差那一行不参与比对


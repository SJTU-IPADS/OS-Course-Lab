text = '''

Half precision has 1 sign bit, 5 exponent bits and 10 fraction bits, with bias 15; single precision has 1 sign bit, 8 exponent bits and 23 fraction bits, with bias 127. <mark>112 = 127 − 15</mark>, <mark>13 = 23 − 10</mark>.
'''
# src:
# 
# 半精度是 1 位符号、5 位指数、10 位尾数，偏置 15；单精度是 1 位符号、
# 8 位指数、23 位尾数，偏置 127。<mark>112 = 127 − 15</mark>，<mark>13 = 23 − 10</mark>。

['fp16-code.title']

# src:
# 
# `x × (1/d) + 8.5` 再截断成整数，等于把 `x/d + 8` 就近舍入。
# 加 8 把 $[-8, 7]$ 平移到 $[0, 15]$，加 0.5 把截断变成就近舍入。

['q4-0-clamp.title']
src_hash = '67a022af'
text = 'Why the upper bound must be clamped'
# src: 上界必须截断的原因

['q4-0-clamp.slide.1']
src_hash = 'd17e0e88'
text = '''

**`d` is determined by the weight with the largest absolute value, so `x/d + 8` computed over the reals lies in $[0, 15]$.**
- Step 3 rounded `d` to half precision, and `id` is the reciprocal of `d` <mark>after rounding</mark>
- Some weights therefore give 15.0000x, which truncates to 15; slightly larger gives 16
- A nibble cannot represent 16, so take the minimum with 15
'''
# src:
# 
# **`d` 由绝对值最大的那个权重定出，按实数计算 `x/d + 8` 在 $[0, 15]$ 之内。**
# - 第三步把 `d` 舍入成了半精度，`id` 是<mark>舍入后</mark>的 `d` 的倒数
# - 个别权重因此算出 15.0000x，截断后是 15，再大一点就是 16
# - 半字节无法表示 16，因此要与 15 取较小值

['q4-0-clamp.slide.2']
src_hash = 'bb45f28a'
text = '''

The lower bound stays in range: the weight with the largest absolute value maps to 0, and rounding only makes it 0.0000x.
'''
# src:
# 
# 下界不会超出范围：绝对值最大的那个权重对应的是 0，舍入只会让它变成 0.0000x。

['q4-0-dequant.title']
src_hash = '00078b24'
text = '`q4_0_dequantize`: decoding in reverse, eight lines'
# src: `q4_0_dequantize`：逆向解码，八行

['q4-0-dequant.slide.1']
src_hash = 'e5d440eb'
text = '''

`& 0xf` takes the low nibble and `>> 4` the high nibble. The elements of `blk` are `uint8_t`, so the right shift fills with 0. Subtract 8 first, then multiply by `d`, in the same order as the reconstruction formula.
'''
# src:
# 
# `& 0xf` 取低半字节，`>> 4` 取高半字节。`blk` 的元素是 `uint8_t`，
# 右移补 0。先减 8 再乘 `d`，顺序与还原式一致。


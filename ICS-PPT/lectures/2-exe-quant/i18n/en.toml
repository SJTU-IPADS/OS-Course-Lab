['session-goal.slide.1']
src_hash = 'a237cc6e'
text = '''

**The previous lecture parsed the bytes of a model weight file into floating-point numbers, and its last part covered quantization: 16-bit weights are quantized to 4 bits, and one block shares one scale.**
- This session completes the whole Q4_0 implementation, from reading bytes to writing bytes
- Afterwards, all six lines of `./nq-selftest a q4_0` print "matches expected"
'''
# src:
# 
# **上一讲把模型权重文件中的字节逐个解析为浮点数，最后一部分讲了量化：**
# **把 16 位的权重量化为 4 位，一个块共用一个缩放系数。**
# - 本节用一次课完成 Q4_0 从读入字节到写出字节的全部实现
# - 写完之后 `./nq-selftest a q4_0` 的六行全部输出「与期望值一致」

['session-goal.slide.2']
src_hash = 'ac8b2b49'
text = '''

The code to write is <mark>six functions</mark> in `impl/nano_quant.cpp`: four conversion functions, plus quantization and dequantization for Q4_0.
'''
# src:
# 
# 要写的是 `impl/nano_quant.cpp` 里的<mark>六个函数</mark>：四个转换函数，
# 加上 Q4_0 的量化与解量化。

['session-goal.notes.1']
src_hash = '42ab77a3'
text = '''
The commands of this session run on x86-64 Linux, on arm64 macOS and in WSL2 on Windows.
nano-quant is portable C++17, and `-ffp-contract=off` and `-fno-fast-math` in the Makefile keep
floating-point results from varying with the platform, so the six self-check lines agree on all three.
'''
# src:
# 
# 本节的命令在 x86-64 的 Linux、arm64 的 macOS 与 Windows 的 WSL2 上都可以执行。
# nano-quant 是可移植的 C++17 程序，Makefile 中的 `-ffp-contract=off` 与 `-fno-fast-math`
# 使浮点结果不随平台变化，因此自查的六行在三种机器上一致。


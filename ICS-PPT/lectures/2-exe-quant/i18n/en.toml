['rd-u64le.title']
src_hash = '5fc987de'
text = '`rd_u64le`: one integer from eight bytes'
# src: `rd_u64le`：由八个字节组成一个整数

['rd-u64le.slide.1']
src_hash = '00b257e6'
text = '''

Process the bytes from the most significant to the least significant; each step shifts left by 8 bits, then ORs in the next byte. <mark>Combine with explicit shifts</mark>; `memcpy` into a `uint64_t` is forbidden: such a program reads a different number on a big-endian machine, while this format specifies little-endian.
'''
# src:
# 
# 从高位字节向低位字节依次处理，每一步先左移 8 位，再与下一个字节按位或。
# 要求<mark>用显式移位组合</mark>，禁止 `memcpy` 到 `uint64_t`：那样写出来的程序
# 在大端机器上读出的是另一个数，而这个格式规定了小端。

['rd-u64le-trap.title']
src_hash = 'aedcc9c5'
text = 'Another way of writing it gives wrong results on large files'
# src: 另一种写法在大文件上得到错误结果

['rd-u64le-trap.slide.1']
src_hash = '7744ecaa'
text = '''

`p[i]` has type `uint8_t` and is promoted to `int` before the operation; `int` has only 32 bits. For `i >= 4` the shift amount is at least 32, and the <mark>behavior is undefined</mark>.
'''
# src:
# 
# `p[i]` 的类型是 `uint8_t`，参加运算前提升成 `int`，`int` 只有 32 位。
# `i >= 4` 时移位量不小于 32，<mark>行为未定义</mark>。

['rd-u64le-trap.slide.2']
src_hash = 'b3a2d59b'
text = '''

In the version on the previous slide the shifted value is a `uint64_t`, which avoids this problem. The third self-check vector is 4294967296, where only byte 4 is 1; it checks exactly this case.
'''
# src:
# 
# 上一页那种写法里被移的是 `uint64_t`，没有这个问题。
# 自查的第三条向量是 4294967296，只有第 4 字节为 1，专门检查这一处。

['bf16.title']
src_hash = '809146a4'
text = '`bf16_to_f32`: one left shift'
# src: `bf16_to_f32`：一次左移

['bf16.slide.1']
src_hash = 'd76707e8'
text = '''

BF16 and FP32 have the same sign bit and 8-bit exponent field; the BF16 fraction is the top 7 bits of the FP32 fraction. BF16 is therefore FP32 without its low 16 bits, and this step fills the low 16 bits with 0.
'''
# src:
# 
# BF16 与 FP32 的符号位和 8 位指数域完全一致，尾数是 FP32 尾数的高 7 位。
# 因此 BF16 等于 FP32 去掉低 16 位，这一步把低 16 位补为 0。

['bf16.slide.2']
src_hash = '91f4fc13'
text = '''

Zero, infinity, NaN and subnormal numbers <mark>need no special handling</mark>: the fields are in the same positions, and filling with zeros gives the correct result.
'''
# src:
# 
# 零、无穷、NaN、次规格化数四类<mark>都不用单独处理</mark>：字段位置相同，补零之后即为正确结果。

['bf16-memcpy.title']
src_hash = 'e3763bda'
text = 'Why memcpy is used to take a float out of an integer'
# src: 从整数取出浮点为什么用 memcpy

['bf16-memcpy.slide.1']
src_hash = '918d0e8e'
text = '''

Writing `*(float *)&bits` violates the strict aliasing rule of C: the compiler may reorder code on the assumption that the two pointers point to different objects, and with optimization the result is unpredictable.
'''
# src:
# 
# 写成 `*(float *)&bits` 违反 C 的严格别名规则：编译器可以按

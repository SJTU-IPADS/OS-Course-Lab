# 2. 由它确定步长 `d`，并预先算好倒数 `id`
# 3. 把 `d` 舍入为半精度，写入前两个字节
# 4. 每个权重乘 `id` 再就近舍入，得到 0 到 15 的码字
# 5. 每两个码字合并为一个字节


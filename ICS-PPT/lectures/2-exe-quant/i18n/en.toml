# src: `fp16_to_f32` 的次规格化数分支

['fp16-denormal.slide.1']
src_hash = 'ed78635e'
text = '''

A half-precision subnormal number represents $m / 2^{10} \times 2^{-14}$ and has no implicit leading 1; a single-precision normal number has one.
'''
# src:
# 
# 半精度的次规格化数表示 $m / 2^{10} \times 2^{-14}$，它没有隐含的前导 1；
# 单精度的规格化数有。

['fp16-denormal.slide.2']
src_hash = '99e3ed27'
text = '''

So shift the fraction left until a 1 appears at bit 10 (`0x400`); this 1 is the implicit bit of single precision, and it is cleared. A half-precision exponent field of 0 stands for the same exponent as a field of 1, which is 113 in single precision; each left shift decrements the exponent, so after `e + 1` shifts it is `113 − (e + 1)`, that is, <mark>112 − e</mark>.
'''
# src:
# 
# 所以把尾数一直左移到第 10 位（`0x400`）出现 1 为止，这个 1 就是单精度的隐含位，将其清除。
# 半精度指数域为 0 时代表的指数与为 1 时相同，对应单精度的 113；每左移一位指数减一，
# 移了 `e + 1` 位之后是 `113 − (e + 1)`，即 <mark>112 − e</mark>。


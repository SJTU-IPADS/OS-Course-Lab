['attention-shapes.title']
src_hash = '0f31ee51'
text = 'The four matrices of attention'
# src: 注意力的四个矩阵

['attention-shapes.slide.1']
src_hash = '7afbf2e3'
text = '''

**The attention of one layer uses four 2-D tensors, each the weights of one matrix multiplication.**
- `q_proj [2048, 2048]`: maps the 2048-dimensional input to 16 query vectors of 128 dimensions
- `k_proj [1024, 2048]`, `v_proj [1024, 2048]`: map to only <mark>8 groups</mark> of keys and values
- `o_proj [2048, 2048]`: maps the concatenated 16 × 128 dimensions back to 2048
'''
# src:
# 
# **一层的注意力用四个二维张量，每一个都是一次矩阵乘的权重。**
# - `q_proj [2048, 2048]`：把 2048 维的输入映射为 16 个 128 维的查询向量
# - `k_proj [1024, 2048]`、`v_proj [1024, 2048]`：只映射出 <mark>8 组</mark>键与值
# - `o_proj [2048, 2048]`：把拼接后的 16 × 128 维映射回 2048 维

['attention-shapes.slide.2']
src_hash = '37a05ae2'
text = '''

The 16 query heads share 8 groups of keys and values, one group per two query heads. This halves the size of the key-value cache.
'''
# src:
# 
# 16 个查询头共用 8 组键值，每两个查询头共用一组。键值缓存的体积因此减半。

['attention-shapes.aside.1']
src_hash = 'e7a534e3'
text = '`q_norm` and `k_norm` have 128 coefficients each and normalize the 128 dimensions of each head, head by head.'
# src: `q_norm`、`k_norm` 各 128 个系数，在每个头的 128 维上各做一次归一化，逐头进行。

['mlp-shapes.title']
src_hash = 'aa688e0f'
text = 'The three matrices of the feed-forward network'
# src: 前馈的三个矩阵

['mlp-shapes.slide.1']
src_hash = 'd887a64c'
text = '''

**`gate_proj` and `up_proj` each expand 2048 dimensions to 6144, and `down_proj` reduces them back to 2048.**
- The outputs of the two expanding matrices are multiplied element-wise; one of them first passes through an activation function

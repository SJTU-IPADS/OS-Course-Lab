['f32-to-fp16-intro.slide.2']
src_hash = '79b4b7d7'
text = '''

**The rounding rule has two halves: call the discarded low bits `r` and the midpoint `half`.**
- If `r > half`, round up
- If `r == half`, check the lowest kept bit: round up if it is 1, do not round up if it is 0
'''
# src:
# 
# **舍入规则写成两半：被丢掉的低位记作 `r`，中点记作 `half`。**
# - `r > half` 时进位
# - `r == half` 时检查保留部分的最低位，为 1 则进位，为 0 则不进位

['f32-to-fp16-intro.slide.3']

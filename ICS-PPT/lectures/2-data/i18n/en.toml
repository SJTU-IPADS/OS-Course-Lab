['memory-wall.notes.1']
src_hash = '4c0d3c19'
text = '''
Models with similar amounts of work can differ in end-to-end latency by a factor of tens. The measured data show the cause of this clearly: BERT, an encoder architecture, processes the whole sequence in parallel in one forward pass, each weight is reused by every token in the sequence, and the arithmetic intensity exceeds 100 FLOP/Byte; a large language model generating autoregressively token by token processes only one new token per forward pass but must traverse all of its weights, and the arithmetic intensity falls to 2 FLOP/Byte. In such a severely memory-bound setting, reducing the width of the weight data is the most direct and effective way to raise system throughput.

The two models in the table have similar parameter counts and work, their memory traffic differs by about 45 times, and their end-to-end latency by about 28 times. Latency is relative: the paper takes the time BERT-Base needs for a sequence of length 128 as 1. The arithmetic-intensity column is left blank; have students compute it as work divided by memory traffic and compare with the positions of the two models in the left figure: BERT-Base is 1324 ÷ 11.2 ≈ 118 (the paper's figure labels it 117; the difference comes from rounding of the memory traffic), and GPT-2 is 1012 ÷ 507.8 ≈ 2. The "root cause" on the continuation page gives these two values.
'''
# src:
# 
# 计算量相近的模型，端到端延迟却可能存在数十倍的差距。实测数据清晰地揭示了这一现象的根源：
# BERT 作为 Encoder 架构，整段序列在一次前向传播中并行处理，每个权重被序列中的全部 token 复用，算术强度超过 100 FLOP/Byte；
# 而大语言模型在逐 Token 自回归生成时，每次前向传播仅处理一个新 Token，却必须完整遍历全部
# 权重，算术强度骤降至 2 FLOP/Byte。在这种访存严重受限的场景下，缩减权重数据位宽是提升系统
# 吞吐最直接有效的途径。
# 
# 表中二者的参数量与计算量相近，访存量相差约 45 倍，端到端时延相差约 28 倍。时延是相对值，
# 论文以 BERT-Base 处理长度为 128 的序列所用的时间为 1。算术强度一列留空，
# 请学生用计算量除以访存量算出，再对照左图中两者的位置：BERT-Base 为 1324 ÷ 11.2 ≈ 118
# （论文图中标注 117，差在访存量的舍入），GPT-2 为 1012 ÷ 507.8 ≈ 2。续页的「根源剖析」给出这两个值。


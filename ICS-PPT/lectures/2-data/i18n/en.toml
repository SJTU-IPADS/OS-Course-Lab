['four-questions.slide.1']
src_hash = 'c75f8668'
text = '''

- **What a byte is**: bits, hexadecimal, and the byte-addressed model of memory
- **How multi-byte objects are laid out**: byte order, and where it becomes visible in file formats and network traffic
- **How the same bits yield different values**: unsigned, two's complement, and the errors that arise at conversions
- **How real numbers are encoded**: FP32 / BF16 / FP8 and 4-bit quantization, which fix the size of a model
'''

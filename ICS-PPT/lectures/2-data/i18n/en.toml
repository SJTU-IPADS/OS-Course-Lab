# src: 第四部分 · 浮点数与低精度格式

['float-structure.title']
src_hash = '665fe9d7'
text = 'The three fields of a floating-point number'
# src: 浮点数的三段结构

['float-structure.slide.1']
src_hash = 'e755449a'
text = '''

A floating-point number is made of three fields — a **sign** $s$, an **exponent** $e$ and a **fraction** $f$ — with value
$V = (-1)^s \times M \times 2^{E}$.
- The exponent occupies $k$ bits and is read as $E = e - (2^{k-1}-1)$; the constant subtracted is called the **bias**
- The fraction occupies $n$ bits, and when normalized $M = 1.f$, with the leading 1 fixed by the format and costing no bit
- The two share a fixed total: the exponent width sets the ==range==, the fraction width the ==relative precision==
'''
# src:
# 
# 一个浮点数由**符号** $s$、**阶码** $e$、**尾数** $f$ 三段位组成，其值为
# **$V = (-1)^s \times M \times 2^{E}$。**
# - 阶码占 $k$ 位，按 $E = e - (2^{k-1}-1)$ 解释，减去的常数称为**偏置**
# - 尾数占 $n$ 位，规格化时 $M = 1.f$，前导的 1 由格式规定，不占位
# - 两段共用固定的总位数：阶码位数决定<mark>范围</mark>，尾数位数决定<mark>相对精度</mark>

['float-structure.aside.1']
src_hash = 'f55e51d4'
text = 'FP32 has a bias of 127; the 8-bit exponent field spans 0 to 255, which after the bias covers both directions.'
# src: FP32 的偏置为 127，阶码字段的 8 位可以表示 0 到 255，减去偏置后覆盖正负两个方向。

['binary-scientific.title']
src_hash = 'c2c7d269'
text = 'From binary scientific notation to the three fields'
# src: 从二进制的科学计数法到三段位

['binary-scientific.slide.1']
src_hash = 'a4aff951'
text = '''

Decimal scientific notation writes $d.ddd \times 10^{k}$; in binary it is $1.bbb \times 2^{E}$: write the number in binary and move the point past the leading 1.
- The bits after the point are the fraction field $f$; the leading 1 costs no bit
- $E$ plus the bias 127 goes into the exponent field $e$, so $e$ is never negative
- Moving the point does not change the value, only how it is recorded
'''
# src:
# 
# **十进制的科学计数法把数写成 $d.ddd \times 10^{k}$。二进制照此写成 $1.bbb \times 2^{E}$：**
# **先把数写成二进制，再把小数点移到最高位的 1 之后，移动的位数就是 $E$。**
# - 小数点后的位构成尾数字段 $f$，最高位的那个 1 由格式规定，不占位
# - $E$ 加上偏置 127 之后写入阶码字段 $e$，因此 $e$ 始终是非负整数
# - 移动小数点不改变数值，改变的只是记录方式


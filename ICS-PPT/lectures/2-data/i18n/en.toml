# - 这 16 个系数各量化成 6 位，共占 12 字节
# - 还原一个权重按 $\hat{w} = d \cdot sc \cdot q - d_{min} \cdot m$ 计算，$sc$ 与 $m$ 是该子块的两个 6 位系数

['superblock.highlight.1']
src_hash = '30aba1f3'
text = 'Work it out: how many bits per weight does Q4_K average?'
# src: 算一算：Q4_K 布局下平均每权重占用多少位，与 Q4_1 相差多少？

['superblock.notes.1']
src_hash = 'fb72a963'
text = '''

Two-level means this: the superblock stores two fp16 values, one the common scale of the 8 sub-block steps and the other the common scale of the 8 sub-block offsets; a sub-block's step is written as a 6-bit integer times the superblock step, and likewise for the offset. Reconstructing one weight begins by reconstructing the coefficients of the sub-block it belongs to. In llama.cpp this structure is called K-quants, and Q2_K through Q6_K share the same superblock layout, differing only in the number of bits in the code and in how the sub-blocks are divided.
'''

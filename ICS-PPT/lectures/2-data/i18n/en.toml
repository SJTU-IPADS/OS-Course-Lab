# - 符号位 $s$ 决定数的正负
# - $exp$ 字段编码阶码 $E$，$E$ 以 2 的幂对数值加权
# - $frac$ 字段编码尾数 $M$，$M$ 通常是区间 $[1.0, 2.0)$ 内的小数


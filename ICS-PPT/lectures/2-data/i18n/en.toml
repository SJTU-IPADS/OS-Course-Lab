['operator-precedence.notes.1']
src_hash = '742c4ba5'
text = '''

Every form in the last three rows has appeared in real code. The ordering has a historical cause: `&` and `|` predate `&&` and `||`, and at the time carried both the bitwise and the logical role, so their precedence was set where a logical operator belongs; when `&&` and `||` were added, the positions of `&` and `|` were left alone so as not to break existing code. Ritchie himself listed this among C's lingering defects when he looked back on its development. A remembered rule is less reliable than a pair of parentheses.
'''
# src:
# 
# 表中最后三行的写法在实际代码里都出现过。
# 优先级的次序有历史原因：`&` 与 `|` 早于 `&&` 与 `||` 出现，当时它们同时承担
# 按位与逻辑两种用途，优先级按逻辑运算的位置设定；`&&` 与 `||` 加入之后，
# 为了不破坏既有代码，`&` 与 `|` 的位置保留至今。Ritchie 本人在回顾 C 的发展时
# 把这一点列为遗留的缺陷。记忆规则不如括号可靠。


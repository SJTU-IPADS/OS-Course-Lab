['other-formats.slide.1']
src_hash = 'fbc78f5f'
text = '''

- **Magic number**: `47 47 55 46` for GGUF, `50 4b 03 04` for zip; `.pt` is a zip archive since 1.6
- **Self-describing header**: safetensors' first 8 bytes are the header length `3e` (62), then JSON
- **No identifier**: ONNX is protobuf, where `08` tags field 1; an old `.pt` is a pickle stream
'''
# src:
# 
# - **魔数**：GGUF 的 `47 47 55 46`、zip 的 `50 4b 03 04`；`.pt` 自 1.6 起就是 zip 归档
# - **自描述头部**：safetensors 开头 8 字节是头长 `3e`（62），随后即 JSON：`7b 22` 是 `{"`
# - **无标识**：ONNX 是 protobuf，`08` 是字段 1 的标签；旧 `.pt` 是 pickle 流，`80 02` 是协议操作码

['other-formats.highlight.1']
src_hash = '3d9a627b'
text = "A file's type is a convention: magic number, header, or extension."
# src: 文件类型来自约定：魔数、自描述头部或扩展名。

['other-formats.notes.1']
src_hash = '667069f7'
text = '''

The `file` command decides from a table of magic numbers, which is why it recognizes zip but not GGUF or safetensors. The security difference is worth mentioning: pickle executes arbitrary code while deserializing, whereas safetensors reads one stretch of JSON and one contiguous span of data and holds nothing executable — the direct reason it was proposed. The five samples are produced by examples/make_formats.py, each written according to the rules of its own format rather than assembled by hand.
'''
# src:
# 
# `file` 命令的判断依据就是魔数表，因此它认得 zip 而认不出 GGUF 与 safetensors。
# 安全上的差别值得一提：pickle 在反序列化时执行任意代码，safetensors 只读取一段 JSON 与
# 一片连续数据，不含可执行内容，这是它被提出的直接原因。
# 五个样例由 examples/make_formats.py 生成，都按各自格式的规则写出，不是手工拼的字节。

['memory-as-bytes.title']
src_hash = '7dc64c3f'
text = 'The memory model: a byte-addressed array'
# src: 内存模型：以字节为单位编址的数组

['memory-as-bytes.slide.1']
src_hash = '2195cce6'
text = '''

The memory a program sees is an ==array addressed one byte at a time==: every address holds one byte.
- Addresses are numbered consecutively from 0, and the whole set of them forms the **address space**
- A multi-byte object occupies a contiguous run of addresses, and its address is the **smallest** of them
- The virtual address space of last lecture is this model as the operating system realizes it
'''
# src:
# 
# **程序看到的内存是一个<mark>以字节为单位编址的数组</mark>：每个地址对应一个字节。**
# - 地址从 0 开始连续编号，全体地址构成**地址空间**
# - 一个多字节对象占用一段连续地址，其地址取这段地址中的**最小值**
# - 上一讲的虚拟地址空间就是这一模型在操作系统中的实现

['memory-as-bytes.aside.1']
src_hash = 'e83c2a2d'
text = 'The byte is the smallest addressable unit, so anything narrower than a byte has to be packed into one.'
# src: 字节是最小的可寻址单位，因此比字节更小的数据必须打包进一个字节。

['word-size.title']
src_hash = '5cb3fe29'
text = 'Word size: pointer width and the ceiling on the address space'
# src: 字长：指针的宽度与地址空间的上限

['word-size.slide.1']
src_hash = '3bd1f101'
text = '''

**Word size** is the number of bits a pointer occupies. An $n$-bit pointer can name $2^n$ distinct addresses, each holding one byte, so the address space is $2^n$ bytes. Word size is fixed jointly by the hardware and the operating system; it is a system parameter no program can choose.
'''
# src:
# 
# **字长**指一个指针占用的位数。$n$ 位的指针能表示 $2^n$ 个不同的地址，
# 每个地址对应一个字节，地址空间的大小因此就是 $2^n$ 字节。字长由硬件与操作系统共同确定，
# 是一个不能由程序选择的系统参数。


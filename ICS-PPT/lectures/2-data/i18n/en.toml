['bit-operations-readonly.title']
src_hash = '2460f432'
text = 'Bit operations: file permissions'
# src: 位运算：文件权限

['bit-operations-readonly.slide.1']
src_hash = '06edff3f'
text = '''
**Permissions are 9 bits in groups of 3: owner, group, others. Within a group read = 4, write = 2, execute = 1, so `r--` = 4.**
**A new file is `-rw-r--r--` by default. After `chmod 444` it becomes `-r--r--r--`; the write bit is 0, and a further write is refused by the kernel.**
'''
# src:
# 
# **权限是 9 个比特，每 3 位一组：所有者、所属组、其他人。一组之内读 = 4、写 = 2、执行 = 1，`r--` = 4。**
# **新建文件默认是 `-rw-r--r--`。`chmod 444` 后变成 `-r--r--r--`，写位为 0，再写入会被内核拒绝。**


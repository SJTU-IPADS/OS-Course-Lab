['vector-bool.notes.1']
src_hash = '503957b8'
text = '''

The controversy is really about the name: it looks like a `vector` and does not behave like one — `&v[0]` does not yield a `bool*`, and `auto x = v[0]` yields a proxy object rather than a `bool`. Item 18 of Meyers's *Effective STL* is titled "Avoid using vector<bool>". The committee discussed deprecating and replacing it, and neither happened: too much code depends on it, so LWG issue 96 was closed as NAD. When the length is known only at run time, `std::deque<bool>` (one byte per value) or Boost's `dynamic_bitset` will serve.
'''
# src:
# 
# 争议的核心是命名：它看上去是 `vector`，行为却不是——`&v[0]` 得不到 `bool*`，
# `auto x = v[0]` 得到的是代理对象而不是 `bool`。Meyers 的《Effective STL》条款 18
# 直接写作「避免使用 vector<bool>」。委员会讨论过弃用与替换，最后都没有落地：
# 既有代码量太大，LWG issue 96 于是以 NAD 关闭。运行期才知道长度时，
# 可用 `std::deque<bool>`（每个值一个字节）或 Boost 的 `dynamic_bitset`。


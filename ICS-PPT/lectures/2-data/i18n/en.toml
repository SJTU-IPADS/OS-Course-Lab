['zero-point.slide.1']
src_hash = '165a42cb'
text = '''

- The step of symmetric quantization is set by the weight of largest absolute value in the group, so the further a group lies from 0 the larger the step
- Q4_1 stores an fp16 minimum as well, so the step follows the width of the data itself and all 16 levels land on the data
- 20 bytes per block, an average of ==5.0 bits==
'''

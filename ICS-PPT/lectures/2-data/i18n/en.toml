['quant-overview.title']
src_hash = '69086f5c'
text = 'Overview of quantization: mapping floating-point numbers to integers'
# src: 量化概览：把浮点数映射为整数

['quant-overview.slide.1']
src_hash = '190cfe6a'
text = '''
- **Quantization**: map the floating-point numbers of a model (BF16 / FP32) to integers of a few bits, such as 8-bit or 4-bit integers.
- **Storage**: the model file stores the mapped integers, so the number of bits per weight decreases.
- **Computation**: at inference, the integers are mapped back to approximations of the floating-point numbers, which then take part in the computation.
- **Example**: 4 weights are mapped with one common ratio to 4-bit integers in −7 ~ 7.
'''
# src:
# 
# - **量化**：把模型中的浮点数（BF16 / FP32）映射为少量位的整数，例如 8 位或 4 位整数。
# - **存储**：模型文件保存映射后的整数，每个权重占用的位数随之减少。
# - **计算**：推理时把整数映射回浮点数的近似值，再参与计算。
# - **示例**：4 个权重按同一比例映射为 −7 ~ 7 的 4 位整数。


['normalized-exp.slide.1']
src_hash = 'ea2267a8'
text = '''
- Condition: $exp \neq 000\ldots0$ and $exp \neq 111\ldots1$
- The exponent is coded as a biased value: $E = Exp - Bias$
  - $Exp$: the unsigned value of the $exp$ field
  - $Bias$: the bias, in general $2^{m-1}-1$, where $m$ is the number of $exp$ bits
- After the bias, a larger $exp$ field means a larger exponent, so two positive numbers can be compared as unsigned integers by $exp$
'''
# src:
# 
# - 条件：$exp \neq 000\ldots0$ 且 $exp \neq 111\ldots1$
# - 阶码按偏置值编码：$E = Exp - Bias$
#   - $Exp$：$exp$ 字段表示的无符号数
#   - $Bias$：偏置值，一般为 $2^{m-1}-1$，$m$ 为 $exp$ 的位数
# - 偏置之后，阶码字段越大，指数越大，两个正数可以按无符号整数比较 `exp`


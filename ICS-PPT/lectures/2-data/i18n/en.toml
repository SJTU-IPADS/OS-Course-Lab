text = "Instructor's note and transition: \"The Patriot case shows that high precision is the basis of reliability in complex systems. Yet over the last decade of computer-architecture development, a new field, modern deep learning, has challenged this established view and brought about an evolution of formats that trades precision for dynamic range and throughput.\""

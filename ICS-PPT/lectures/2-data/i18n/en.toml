#   - 维持与 FP32 完全相同的 8 位阶码位宽，将尾数压缩至 7 位。
#   - 核心权衡：接受相对精度的降低（十进制有效数字降至约 2.4 位），换取与 FP32 完全等价的动态范围（$\pm 3.4 \times 10^{38}$），彻底消除训练梯度溢出风险。


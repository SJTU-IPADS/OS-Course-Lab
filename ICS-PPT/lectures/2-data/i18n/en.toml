text = 'Short lab: build your own quantization engine'
# src: 小练习：动手打造你自己的量化引擎

['lab-release.slide.1']
src_hash = '197ebe96'
text = '''
- **Subject**: the safetensors files of `Qwen/Qwen3-VL-2B-Instruct`, 625 BF16 tensors, of which 310 belong to the language model.
- **Four parts**:
  - **A Reading bytes (15 points)**: read the header length by composing a little-endian integer with shifts, without `memcpy`; implement the expansion of BF16 and FP16 to FP32 and the rounding of FP32 to FP16.
  - **B Three quantization formats (35 points)**: quantization and dequantization for Q4_0, Q4_1 and Q4_K, with output blocks byte-for-byte identical to the expected values; implement the packing of the 6-bit `sc` and `m`.
  - **C Whole-model quantization and byte accounting (30 points)**: skip the 315 vision tensors; the total bytes predicted by `plan` must equal the size of the output exactly, and the md5 of the output must match the expected value.
  - **D Loading and running (15 points)**: assemble the output into a GGUF, have ollama greedily generate 128 tokens with the student ID as input, and submit the md5 of the generated text.
'''
# src:
# 
# - **实验对象**：`Qwen/Qwen3-VL-2B-Instruct` 的 safetensors 文件，625 个 BF16 张量，其中 310 个属于语言模型。
# - **四个部分**：
#   - **A 读字节（15 分）**：用移位组合小端整数读出头部长度，不得用 `memcpy`；实现 BF16、FP16 到 FP32 的展开与 FP32 到 FP16 的舍入。
#   - **B 三种量化格式（35 分）**：Q4_0、Q4_1、Q4_K 的量化与反量化，输出块与期望值逐字节相同；实现 6 位 `sc`、`m` 的打包。
#   - **C 全模型量化与字节统计（30 分）**：跳过 315 个视觉张量；`plan` 预测的总字节数与产物大小完全相等，产物 md5 与期望值相同。
#   - **D 加载运行（15 分）**：产物组装为 GGUF，由 ollama 以学号为输入贪心生成 128 个 token，提交生成文本的 md5。


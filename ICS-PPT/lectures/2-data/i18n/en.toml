['shifts.title']
src_hash = 'ab09f814'
text = 'Shift operations'
# src: 移位运算

['shifts.slide.1']
src_hash = '0a739465'
text = '''

- **Left shift** `x << k`: every bit moves left by $k$ places, zeros fill in on the right, and bits shifted off the top are discarded
- **Logical right shift** `x >> k`: zeros fill in on the left; used for unsigned values
- **Arithmetic right shift** `x >> k`: the sign bit fills in on the left, so a negative value stays negative
- The C standard leaves the behaviour undefined once the shift count reaches the word size
'''
# src:
# 
# - **左移** `x << k`：各位左移 $k$ 位，右侧补 0，高位移出后丢弃
# - **逻辑右移** `x >> k`：左侧补 0，用于无符号数
# - **算术右移** `x >> k`：左侧补符号位，用于补码，使负数右移后仍为负数
# - 移位位数达到或超过字长时，C 标准未定义其行为

['shifts.notes.1']
src_hash = 'cce94e7e'
text = 'Shifts are often used in place of multiplying or dividing by a power of two, but compilers already perform that optimization; the reason to write bitwise operations is to extract fields.'
# src: 移位常被用来代替乘除 2 的幂，但编译器已经会做这一优化；写位运算的目的应当是提取字段。

['shift-kinds.title']

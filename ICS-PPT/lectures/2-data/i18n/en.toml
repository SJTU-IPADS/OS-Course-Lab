# 
# 接上一页：权重文件在磁盘上，操作系统按需把页装进内存，CPU 并不直接读磁盘。
# 图中每个格子是一位，一行 8 位就是一个带地址的字节。
# 强调两件事：每个字节有唯一地址；地址里存的不是「数」或「字」，而是 8 个 0/1。
# 后面讲位向量、十六进制、数据类型，都是在解释这些 0/1。


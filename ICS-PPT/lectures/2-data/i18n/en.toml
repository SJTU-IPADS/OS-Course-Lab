['zero-point-compute.slide.2.footnote.1']
src_hash = '62778654'
text = 'Sources: Jacob, B. et al. CVPR (2018); Krishnamoorthi, R. *Quantizing deep convolutional networks for efficient inference: A whitepaper* (2018).'
# src: 文献出处：Jacob, B. et al. CVPR (2018); Krishnamoorthi, R. *Quantizing deep convolutional networks for efficient inference: A whitepaper* (2018).

['zero-point-compute.notes.1']
src_hash = '18b99aaf'
text = '''
The most direct approach is to restore each element to floating point and then multiply, but $m$ is a floating-point number that need not be an integer multiple of $d$, so the restored values are no longer integers and every multiply-add must be done in floating point. After the expansion, ① is still a pure 8-bit integer dot product, and the work caused by the offset is concentrated in ②: summing the integer codes of the activations at inference time. This sum is needed only once for a given row of activations and is shared by all output columns of that row. For one 2048 × 2048 projection matrix of Llama-3.2-1B generating 1 token, ① is about 4.19 million multiply-adds and ② is 2048 additions.

GGUF's Q4_1 stores weights as $\hat{w} = d\,q + m$, where $d$ and $m$ are the $d_w$ and $m_w$ here. When llama.cpp quantizes activations to Q8_1, it uses blocks of 32 numbers and stores $d_x \sum a_k$ in each block, so the dot product costs only 1 extra multiply-add per block.
'''
# src:
# 
# 逐项先还原为浮点数再相乘的做法最直接，但 $m$ 是浮点数，不必是 $d$ 的整数倍，还原后的值
# 不再是整数，每次乘加都要用浮点运算完成。展开之后，① 仍是纯 8 位整数点积，偏移带来的工作集中在 ②：推理时对激活的整数码求和。
# 这个和对同一行激活只需求一次，由该行的所有输出列共用。以 Llama-3.2-1B 的一个
# 2048 × 2048 投影矩阵、生成 1 个 token 为例，① 约 419 万次乘加，② 为 2048 次加法。
# 
# GGUF 的 Q4_1 按 $\hat{w} = d\,q + m$ 存储权重，$d$ 与 $m$ 就是这里的 $d_w$ 与 $m_w$。llama.cpp 把激活
# 量化为 Q8_1 时，每 32 个数一块，块内同时存下 $d_x \sum a_k$，点积时每块只多 1 次乘加。

['symmetric-failure.title']
src_hash = '8c11c85b'
text = 'The weakness of symmetric quantization: precision collapse on asymmetrically distributed data'
# src: 对称量化的不足：数据非对称分布下的精度雪崩

['symmetric-failure.slide.1']
src_hash = 'faefd621'
text = '''
- The final RMSNorm of Llama-3.2 (`model.norm.weight`) has 2048 parameters, **all of them positive**, distributed over $[+0.0417, +2.9219]$.
- **The limitation of symmetric quantization** (the steps below are computed over the whole tensor):
  - The number with the largest absolute value corresponds to $q = 7$: $d_{\text{sym}} = \frac{2.9219}{7} \approx \mathbf{0.417}$.
  - The 16 grid points run from $-8d$ to $+7d$, that is $[-3.34, +2.92]$; **the 8 on the negative half-axis plus 0, 9 in all, lie outside the data range**.
- **The correction by asymmetric quantization (Q4_1)**:
  - Record a separate minimum $m = 0.0417$ and divide the range tightly by its spread: $d_{\text{asym}} = \frac{2.9219 - 0.0417}{15} \approx \mathbf{0.192}$.
  - **The step is less than half that of symmetric quantization, and all 16 grid points lie within the data range**.
'''
# src:
# 
# - Llama-3.2 最终 RMSNorm（`model.norm.weight`）共 2048 个参数，**取值全部为正**，分布在 $[+0.0417, +2.9219]$。
# - **对称量化的局限**（以下步长按整个张量计算）：
#   - 绝对值最大的数对应 $q = 7$：$d_{\text{sym}} = \frac{2.9219}{7} \approx \mathbf{0.417}$。
#   - 16 个格点为 $-8d$ 至 $+7d$，即 $[-3.34, +2.92]$，**负半轴 8 个与 0 共 9 个在数据范围外**。
# - **非对称量化（Q4_1）的修正**：
#   - 记录独立最小值 $m = 0.0417$，步长按极差紧密划分：$d_{\text{asym}} = \frac{2.9219 - 0.0417}{15} \approx \mathbf{0.192}$。
#   - **步长不到对称量化的一半，16 个格点全部落在数据范围内**。

['symmetric-failure.notes.1']
src_hash = '2aadeed1'
text = 'We just said that symmetric quantization is hardware-friendly, but look at the real data on the screen: the 2048 weights of the final RMSNorm are all positive, most of them between 2.2 and 2.6. The grid points of symmetric quantization are arranged around 0, and 9 of the 16 (the 8 on the negative half-axis and 0) fall outside the data range. In actual GGUF files, one-dimensional tensors such as normalization layers are kept as F32 and not quantized; here this tensor is used to show the waste of symmetric grid points when all the data are positive.'

For an example: with `sc[0] = 63` and `sc[4] = 62`, byte 0 is `0xff`, whose low 6 bits are 63 and whose high 2 bits `11` are the top two bits of 62; the low 4 bits `e` of byte 8, `0x9e`, are the low four bits of 62. Writing and reading must come in pairs, and `examples/k_scales.c` holds both functions, ready to run if someone asks in class. That the offset is at most 0 follows jointly from llama.cpp's quantizer and this storage format: `make_qkx2_quants` contains the line `if (min > 0) min = 0;`, and the format itself can store only a non-negative `m`.
'''

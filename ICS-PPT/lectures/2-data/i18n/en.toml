# 
# 单精度中 $+\infty$ 的位模式是 `0x7F800000`，$-\infty$ 是 `0xFF800000`。
# NaN 的 $frac$ 可以取任意非零值，因此 NaN 对应的位模式有 $2 \times (2^{23} - 1)$ 个。

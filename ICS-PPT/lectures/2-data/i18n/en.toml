['section.integers.title']
src_hash = 'afaa10b1'
text = 'Part three · Integers'
# src: 第三部分 · 整数

['two-readings.title']
src_hash = '37b564c3'
text = 'Two representations of integers'
# src: 两种整型数的表示

['two-readings.slide.1']
src_hash = 'f7977cf8'
text = 'Every bit of an unsigned number has a positive weight; a signed number changes the weight of the top bit from $+2^{w-1}$ to $-2^{w-1}$ and leaves the weights of the other bits unchanged.'
# src:
# 
# 无符号数各位的权重都为正；有符号数把最高位的权重由 $+2^{w-1}$ 改为 $-2^{w-1}$，其余各位的权重不变。

['two-readings.slide.2']
src_hash = 'a080d9c4'
text = '''

 $$
 B2U(\vec{x}) = \sum_{i=0}^{w-1} x_i 2^i
 \qquad\qquad
 B2T(\vec{x}) = -x_{w-1} 2^{w-1} + \sum_{i=0}^{w-2} x_i 2^i
 $$
'''
# src:
# 
#  $$
#  B2U(\vec{x}) = \sum_{i=0}^{w-1} x_i 2^i
#  \qquad\qquad

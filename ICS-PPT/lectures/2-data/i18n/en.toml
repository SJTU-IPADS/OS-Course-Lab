# src: 格式规范：GGUF 基础 4 位量化块物理排布

['gguf-blocks-cont.slide.1']
src_hash = '27bdb8ce'
text = '''
- **GGUF Q4_0 block structure (the symmetric baseline)**:
  - Every **32 consecutive weights** form 1 quantization block.
  - **`d` field**: 2 bytes (FP16 scale step).
  - **`qs` field**: 16 bytes (32 packed 4-bit codes).
  - **Cost per block**: $2 + 16 = \mathbf{18\text{ bytes}}$ $\implies$ **4.50 bits** per weight on average.
- **GGUF Q4_1 block structure (asymmetric quantization)**:
  - **`d` field**: 2 bytes (FP16 scale step).
  - **`m` field**: 2 bytes (FP16 block minimum).
  - **`qs` field**: 16 bytes (32 4-bit codes).
  - **Cost per block**: $2 + 2 + 16 = \mathbf{20\text{ bytes}}$ $\implies$ **5.00 bits** per weight on average.
'''
# src:
# 
# - **GGUF Q4_0 块结构（对称量化基准）**：
#   - 每 **32 个连续权重**划为 1 个量化块。
#   - **`d` 字段**：2 字节（FP16 缩放步长）。
#   - **`qs` 字段**：16 字节（32 个 4-bit 编码打包存储）。
#   - **单块开销**：$2 + 16 = \mathbf{18\text{ 字节}}$ $\implies$ 平均每个权重占用 **4.50 位**。
# - **GGUF Q4_1 块结构（非对称量化）**：
#   - **`d` 字段**：2 字节（FP16 缩放步长）。
#   - **`m` 字段**：2 字节（FP16 块内最小值）。
#   - **`qs` 字段**：16 字节（32 个 4-bit 编码）。
#   - **单块开销**：$2 + 2 + 16 = \mathbf{20\text{ 字节}}$ $\implies$ 平均每个权重占用 **5.00 位**。


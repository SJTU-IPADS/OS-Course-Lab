['quantization-idea.title']
src_hash = '7671a619'
text = 'Quantization: approximating a set of floats with integer codes'
# src: 量化：用整数编码近似一组浮点值

['quantization-idea.slide.1']
src_hash = '8a852c60'
text = '''

Divide the range of a group of weights into equally spaced levels, and record for each weight ==the index of the level nearest to it==.
- A 4-bit code gives 16 levels, and one group shares a single scale $d$
- Reconstruction computes $w \approx (q - 8) \cdot d$, where $q$ is the code
- Away from the saturating end, a single weight errs by no more than half a step, and the step is proportional to the group's range
'''
# src:
# 
# **把一组权重的取值范围划分为等距的若干级，每个权重记录<mark>离它最近的那一级的编号</mark>。**
# - 4 位编码可表示 16 级，一组共用一个缩放系数 $d$
# - 还原时按 $w \approx (q - 8) \cdot d$ 计算，$q$ 为编码
# - 除去饱和的一端，单个权重的误差不超过半个步长，步长与该组的取值范围成正比

['quantization-idea.notes.1']
src_hash = 'bfa2215c'
text = '''

"Away from the saturating end" is a necessary qualification. Q4_0's 16 codes represent −8 to 7, which is asymmetric: the scale is taken as $d = \max / (-8)$, so the extreme value of the group lands exactly on code 0; a weight of the opposite sign and comparable magnitude computes a code above 15, is clamped to 15, and reconstructs as $7d$ rather than $8d$, an error of up to a full step. This is the same fact as $|TMin| = TMax + 1$ from the section on integers.
'''
# src:
# 
# 「除去饱和的一端」是一句必要的限定。Q4_0 的 16 个编码表示 −8 到 7，两端不对称：
# 缩放系数取 $d = \max / (-8)$，组内的极值恰好落在编码 0 上；与它反号且幅度相近的权重
# 算出的编码超过 15，被截到 15，还原为 $7d$ 而非 $8d$，误差可达一个完整步长。
# 这与整数一节的 $|TMin| = TMax + 1$ 是同一件事。

['quantization-map.title']
src_hash = '39133c84'
text = 'Quantization is an affine map'
# src: 量化是一个仿射映射

['quantization-map.slide.1']
src_hash = '8a423c08'
text = '''

A group of weights shares two floating-point parameters: a step $d$ and an offset $m$. The code $q$ is a 4-bit unsigned integer, and reconstruction computes $\hat{w} = d \cdot q + m$.
'''
# src:
# 
# 一组权重共用两个浮点参数：步长 $d$ 与偏移 $m$。编码 $q$ 是一个 4 位无符号整数，还原时按 $\hat{w} = d \cdot q + m$ 计算。

['quantization-map.slide.2']
src_hash = '6ead2820'
text = '''

- **Group**: how many weights share one pair $d$ and $m$ — the granularity
- **Levels**: how many bits the code occupies; 4 bits give 16 levels
- **Offset**: $m = 0$ is ==symmetric quantization==; $m$ at the group's minimum is ==affine==
'''
# src:
# 
# - **区间**：多少个权重共用同一对 $d$ 与 $m$，即量化的粒度
# - **级数**：编码占几位，4 位给出 16 级
# - **偏移**：$m$ 固定为 0 时称为<mark>对称量化</mark>，$m$ 可取该组的最小值时称为<mark>仿射量化</mark>

['quantization-map.slide.3']
src_hash = '4ed3697a'
text = '''

Once those three are settled, quantization is one division and one rounding, with an error of no more than half a step.
'''
# src:
# 
# 在这三项都定下来之后，量化本身只是一次除法与一次舍入，误差不超过半个步长。

['quantization-map.aside.1']
src_hash = '5f48c6ab'
text = '''

Symmetric quantization needs no separate formula: with $m = -8d$, codes 0 through 15 denote $-8$ through $7$ steps. The difference is only whether $m$ is stored separately and chosen independently.
'''
# src:
# 
# 对称量化并不需要另一套式子：$m$ 取 $-8d$ 时，编码 0 到 15 就表示 $-8$ 到 $7$ 个步长，
# 差别只在 $m$ 是否单独存储、能否独立取值。

['quantization-map.highlight.1']
src_hash = '5ceaa647'
text = 'Every difference between formats lies in those three choices.'
# src: 量化的全部选择都在这三项上，格式之间的差别也在这三项上。

['quantization-map.notes.1']
src_hash = 'b2c66890'
text = '''

Q4_0 is symmetric: $m = 0$, and codes 0 to 15 denote −8 to 7 times the step. Writing $\hat{w} = d(q - 8)$ and writing $\hat{w} = dq + m$ with $m = -8d$ describe the same thing; the difference is whether $m$ is stored separately and can be chosen independently. The exception to "no more than half a step" is the saturating end, covered in the notes of the previous page.
'''
# src:
# 
# Q4_0 是对称的：$m = 0$，编码 0 到 15 表示 −8 到 7 乘以步长。
# 写成 $\hat{w} = d(q - 8)$ 与写成 $\hat{w} = dq + m$（$m = -8d$）是同一件事，
# 区别在于 $m$ 是否单独存储、能否独立取值。
# 「误差不超过半个步长」的例外是饱和的那一端，前一页的备注里讲过。

['q4-block.title']
src_hash = 'b1547cd1'
text = 'The Q4_0 block: 32 weights in 18 bytes'
# src: Q4_0 的块结构：18 字节存放 32 个权重

['q4-block.slide.1']
src_hash = '40ab094f'
text = '''

- Every 32 weights form a group sharing one FP16 scale, occupying 2 bytes
- The 32 four-bit codes pack into 16 bytes, two weights to a byte
- The 16 codes denote $-8$ through $7$, asymmetric at the two ends just like two's complement
- 18 bytes in all, an average of ==4.5 bits== per weight; 3.21 B parameters come to about 1.8 GB
'''
# src:
# 
# - 每 32 个权重为一组，共用一个 FP16 的缩放系数，占 2 字节
# - 32 个 4 位编码打包进 16 字节，每字节存放两个权重
# - 16 个编码表示 $-8$ 到 $7$，与补码一样两端不对称
# - 合计 18 字节，平均每个权重 <mark>4.5 位</mark>；3.21 B 参数据此约为 1.8 GB

['quantize-code.title']
src_hash = 'be495eb5'
text = 'Implementing the quantizer'
# src: 量化的实现

['quantize-code.demo.1.name']
src_hash = 'b88704a7'
text = 'Quantizing a group of weights and reconstructing them'
# src: 量化一组权重并还原

['quantize-code.notes.1']
src_hash = '12db95b1'
text = '''

Two places are easy to get wrong. First, the scale is the weight of largest absolute value in the block, taken with its sign and divided by −8, so that this weight encodes as 0 and all 16 codes are reachable; using absmax/7 instead confines the codes to 1..15. Second, the pairing: the low nibble holds weight $j$ and the high nibble weight $j+16$, so a pair spans the two halves of the block. llama.cpp quantizes with a floating-point d and stores d back as FP16, so the two differ slightly and the actual error can therefore exceed half a step by a little.
'''
# src:
# 
# 两处容易写错。一是缩放系数取块内绝对值最大的那个权重、连同它的符号除以 −8，
# 使该权重编码为 0，16 个码字全部可达；若改用 absmax/7，编码只落在 1..15。
# 二是配对方式：低半字节存第 j 个权重，高半字节存第 j+16 个，配对跨越块的前后两半。
# llama.cpp 用浮点的 d 量化、按 FP16 存回 d，还原时两者略有出入，实际误差因此
# 可以略微超过半个步长。

['nibble-packing.title']
src_hash = '32d267e2'
text = 'Reading and writing 4-bit data: masks and shifts'
# src: 4 位数据的存取：掩码与移位

['nibble-packing.slide.1']
src_hash = '12325d7c'
text = '''

The byte is the smallest addressable unit, so 4-bit data has no address of its own and ==must be packed two to a byte==.
'''
# src:
# 
# 字节是最小的可寻址单位，4 位的数据没有独立地址，必须<mark>两个一组打包进一个字节</mark>。

['nibble-packing.slide.2']
src_hash = '1c3b7177'
text = '''

- Take the low 4 bits with the mask `& 0x0f`, and the high 4 bits with the shift `>> 4`
- To write back, shift the high 4 bits into place first, then or them with the low 4
- Q4_0 pairs weight $j$ with weight $j+16$, so the two halves of a byte come from the two halves of the block
'''
# src:
# 
# - 取低 4 位用掩码 `& 0x0f`，取高 4 位用移位 `>> 4`
# - 写回时先把高 4 位左移到位，再与低 4 位按位或
# - Q4_0 配对的是第 $j$ 与第 $j+16$ 个权重，一个字节里的两半来自块的前后两段

['nibble-add.title']
src_hash = 'd2a61f52'
text = 'Arithmetic after packing: each field needs its own overflow'
# src: 打包之后的运算：每个字段需要独立的溢出

['nibble-add.slide.1']
src_hash = '2fc039a1'
text = '''

The two 4-bit fields in a byte are each a number of their own. Adding directly lets the carry out of the low field cross bit 3 into the high field.
'''
# src:
# 
# 一个字节里的两个 4 位字段各自是一个数。直接相加时，低位字段的进位会越过第 3 位加到高位字段上。

['nibble-add.slide.2']
src_hash = 'd9fe3b78'
text = '''

- `& 0x77` clears each field's top bit, so the carry stops inside the field
- `(a ^ b) & 0x88` restores the two cleared bits with an xor, which produces no carry
- An overflow of the high field's bit 3 is discarded at the byte boundary
'''
# src:
# 
# - `& 0x77` 清掉每个字段的最高位，低三位相加最多进到第 3 位，进位停在字段内
# - `(a ^ b) & 0x88` 把清掉的那两位用异或补回去，异或不产生进位
# - 高位字段的第 3 位若溢出，同样被丢弃，不会越过字节边界

['nibble-add.highlight.1']
src_hash = '7985373d'
text = 'The carry out of the low field must stop at the field boundary.'
# src: 低位字段的进位必须停在字段边界内，不能计入高位字段。

['nibble-add.notes.1']
src_hash = '0c1a59be'
text = '''

This page is where part three's bitwise material lands. Take `0x29 + 0x38` (fields 9+8 and 2+3): adding directly gives `0x61`, where 9+8=17 overflows the low field and carries a 1 into the high one; `add_packed` gives `0x51`, where the low field wraps to 1 and the high field is still 5. `examples/int4.c` checks both forms against all 65536 pairs of inputs: adding directly is wrong on 30720 of them, `add_packed` on none.
'''
# src:
# 
# 这一页是第三部分位运算内容的落点。以 `0x29 + 0x38` 为例（字段 9+8 与 2+3）：
# 直接相加得 `0x61`，低字段 9+8=17 溢出并把 1 带进高字段；`add_packed` 得 `0x51`，
# 低字段回绕成 1，高字段仍是 5。`examples/int4.c` 对全部 65536 组输入验证过这两种写法，
# 直接相加错 30720 组，`add_packed` 错 0 组。

['int4-hardware.title']
src_hash = '4e1d7bc7'
text = 'Aside: hardware support for 4-bit arithmetic'
# src: 拓展：4 位运算在硬件上的支持

['int4-hardware.slide.1']
src_hash = 'efb5b99f'
text = '''

Matrix multiplication has dedicated units: each 4-bit number is taken out separately to be multiplied, and the products are added one by one into a single 32-bit register called the ==accumulator==.
'''
# src:
# 
# 矩阵乘有专门的运算单元：每个 4 位数单独取出来参与乘法，乘积逐个加进同一个 32 位寄存器，这个寄存器称为<mark>累加器</mark>（accumulator）。

['int4-hardware.slide.2']
src_hash = 'e78f6381'
text = '''

- The two 4-bit numbers no longer share a byte; each goes into the multiplier on its own, and a carry has nowhere to cross to
'''
# src:
# 
# - 两个 4 位数不再共用一个字节，各自单独送进乘法器，进位无处可越
# - 4 位数相乘最多得 64，32 个乘积相加不超过 2048，32 位的累加器装得下
# - Turing（2018）起的 Tensor Core 提供这种单元；元素级的 4 位加减仍要用上一页的写法

['int4-hardware.highlight.1']
src_hash = '8677febd'
text = 'Weights are stored in 4 bits; the accumulator is 32 bits wide.'
# src: 4 位是权重的存放格式，运算在 32 位的累加器里完成。

['int4-hardware.notes.1']
src_hash = '48cdf1b5'
text = '''

The accumulator is the register inside a compute unit that holds a running sum: a matrix multiplication adds the 32 products of one row against one column one after another, and wherever they are added is the accumulator. It is much wider than the inputs, the ordinary hardware measure against overflow. The instruction is written `mma.sync…s32.s4.s4.s32`: the two `s4` are the 4-bit inputs and `s32` the 32-bit accumulator; the A100's INT4 peak is 1248 TOPS, four times the same chip's FP16 figure. The difficulty on the previous page arises only when the result must also be stored back into 4 bits: two numbers share one byte and the carry out of the low field has nowhere to go. INT4 Tensor Cores appeared on Turing in 2018, about four years before 4-bit quantization was actually taken up in large-model inference; by the time the usage matured, NVIDIA had marked INT4 deprecated on Hopper. Blackwell's fifth-generation Tensor Cores use FP4 instead, spending some of the 4 bits on an exponent, and NVFP4 adds fine-grained scaling over groups of 16 elements, in the same direction as the group scaling covered in this section. CUDA's `__vadd4` is the lower bound of element-wise SIMD addition: it treats 32 bits as four bytes added separately, and there is no narrower lane.
'''
# src:
# 
# 累加器就是运算单元里存放累加中间结果的那个寄存器，矩阵乘要把一行与一列的 32 对乘积依次加起来，
# 加到哪里，哪里就是累加器。它比输入宽得多，是硬件避开溢出的常规做法。
# 指令写作 `mma.sync…s32.s4.s4.s32`：两个 `s4` 是 4 位输入，`s32` 是 32 位累加器；
# A100 的 INT4 峰值为 1248 TOPS，是同一颗芯片 FP16 的 4 倍。
# 上一页的困难只出现在结果也要存回 4 位这种情形：两个数挤在一个字节里，低位的进位无处可去。
# INT4 的 Tensor Core 出现在 2018 年的 Turing 上，比 4 位量化在大模型推理中被真正用起来
# 早了约四年；等到用法成熟，NVIDIA 已在 Hopper 上把 INT4 标为弃用。
# Blackwell 的第五代 Tensor Core 改用 FP4，4 位中留出阶码，
# NVFP4 再配 16 个元素一组的细粒度缩放，方向与本节讲的分组缩放一致。
# CUDA 的 `__vadd4` 是元素级 SIMD 加法的下限：它把 32 位当作四个字节分别相加，没有更窄的通道。

['granularity.title']
src_hash = 'fee791ae'

# 
# - 对称量化的步长由组内绝对值最大的权重决定，一组权重离 0 越远，步长越大
# - Q4_1 另存一个 fp16 的最小值，步长改由这组数据自身的宽度决定，16 个级全部落在数据上
# - 每块 20 字节，平均 <mark>5.0 位</mark>

['zero-point.highlight.1']
src_hash = '7af696f7'
text = 'Symmetric quantization may leave half its 16 levels unused.'
# src: 对称量化把 16 个级摊在 [−max, max] 上，其中一半可能没有数据。

['zero-point.notes.1']
src_hash = '3d487e37'
text = '''

The 32 weights of the block in the figure lie between 1.539 and 2.625. Q4_0's step is 2.625/8 = 0.328, and only 4 of the 16 levels fall inside that interval; Q4_1's step is (2.625 − 1.539)/15 = 0.0724, and all 16 levels fall inside it. The two differ by a factor of 4.5. This is also one reason GGUF keeps the normalization coefficients in F32: the values of such tensors cluster around 1, where symmetric quantization wastes the most, and their parameter count is small enough that the error is not worth a few saved KB.
'''

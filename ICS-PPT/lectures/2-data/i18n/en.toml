['float-encoding.slide.1']
src_hash = 'c95979b5'
text = '''
- Denormalized values drop the leading 1, so values near zero stay evenly spaced
- $+0$ and $-0$ are distinct bit patterns that compare equal
- NaN is false under `<` `<=` `>` `>=` `==` and true under `!=`, so `x != x` tests it
'''
# src:
# 
# - 非规格化数取消前导的 1，使零附近的可表示值保持均匀间隔，并让下溢逐步发生
# - $+0$ 与 $-0$ 是两个不同的位模式，按浮点比较相等
# - NaN 与任何值的 `<`、`<=`、`>`、`>=`、`==` 均为假，`!=` 为真，`x != x` 因此可用于判断

['float-encoding.highlight.1']
src_hash = '723e2322'
text = 'Reserving all 0s and all 1s leaves exponents −126 to 127.'

['float-spacing-measured.highlight.1']
src_hash = '330bbef4'
text = 'Absolute precision falls as the value grows, while relative precision stays constant.'
# src: 绝对精度随数值增大而下降，相对精度保持不变。

['float-spacing-measured.notes.1']
src_hash = '1f2e46f8'
text = '''

The last column is the step divided by the value, and it is essentially the same on every row — that is what constant relative precision means. Near $10^9$ the step is 64, so a counter kept in a float stops changing when incremented past a billion. The same reasoning explains "above $2^{24}$ adjacent FP32 values differ by 2": the step in the interval containing $2^{24}$ is $2^{24-23} = 2$. The program takes the next representable value with `nextafterf` and performs no bit manipulation.
'''
# src:
# 
# 最后一列是步长与数值之比，各行基本相同，这就是相对精度不变的含义。
# $10^9$ 附近的步长是 64，一个用 float 记录的计数器数到十亿之后，加一不再改变它的值。
# 同样的道理解释了「$2^{24}$ 以上相邻两个 FP32 相差 2」：$2^{24}$ 所在区间的步长是
# $2^{24-23} = 2$。程序用 `nextafterf` 取下一个可表示值，不做任何位运算。

['float-rounding.title']
src_hash = '225a5686'
text = 'Rounding: taking the nearest representable value'
# src: 舍入：取最近的可表示值

['float-rounding.demo.1.name']
src_hash = '68e6b4e8'
text = 'Three integers and one fraction'
# src: 三个整数与一个小数

['float-rounding.slide.1']
src_hash = '6fef9ceb'
text = '''

- Above $2^{24}$ adjacent FP32 values differ by 2, so an odd number falls exactly midway between two representable values
- At the midpoint the value whose last fraction bit is even is chosen, which is called <mark>round to nearest even</mark>, so that error does not accumulate in one direction
- `0.1` is a repeating fraction in binary, and a finite format can only store an approximation
'''
# src:
# 
# - $2^{24}$ 以上相邻两个 FP32 相差 2，奇数正好落在两个可表示值的中点
# - 中点处取尾数末位为偶的那个，称为<mark>舍入到最近的偶数</mark>，使误差不朝一个方向累积
# - `0.1` 在二进制下是无限循环小数，有限位的格式只能存一个近似值

['float-rounding.slide.1.footnote.1']
src_hash = '1a254c1c'
text = 'William Kahan was the principal designer of IEEE 754 and the 1989 Turing Award laureate. Photograph from Wikimedia Commons by George Bergman, CC BY-SA 4.0.'
# src: William Kahan 是 IEEE 754 的主要设计者，1989 年图灵奖得主。照片来自 Wikimedia Commons，摄影 George Bergman，CC BY-SA 4.0。

['float-rounding.notes.1']
src_hash = '78e57ed6'
text = '''

Round to nearest even is the IEEE 754 default; toward zero, up and down are the other three modes. Both rules guarantee that a single rounding errs by no more than half a step, which is the basis of the quantization error bound; the section on quantization shows how that bound fails once the two ends of the coding interval are asymmetric.
'''
# src:
# 
# 舍入到最近的偶数是 IEEE 754 的默认模式，另有向零、向上、向下三种模式。
# 两种规则都保证单次舍入的误差不超过半个步长，这是量化误差上界的依据；
# 量化那一节会说明编码区间两端不对称时这个上界如何失效。


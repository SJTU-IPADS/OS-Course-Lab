['expand-truncate.title']
src_hash = '3d9f867b'
text = 'Widening and truncation'
# src: 扩展与截断

['expand-truncate.slide.1']
src_hash = '2c53409b'
text = '''

Changing the width of an integer goes in two directions, under different rules.
- **Widening**: unsigned values are padded with zeros (zero extension), two's complement with the sign bit (sign extension); the value is unchanged
- **Truncation**: only the low bits are kept and the high bits are simply discarded; the value may change entirely
'''
# src:
# 
# **改变一个整数的宽度有两个方向，规则各不相同。**
# - **扩展**：无符号数补 0（零扩展），补码补符号位（符号扩展），数值不变
# - **截断**：只保留低位，高位直接丢弃，数值可能完全改变


['kquants-superblock-cont2.slide.1']
src_hash = '6f6ffa84'
text = '''
- **Restoring one weight** ($q$ is the 4-bit code, taking values 0 ~ 15):
  - sub-block step = `d` × `sc`, sub-block offset = `dmin` × `m`; weight = sub-block step × $q$ − sub-block offset.
- **Superblock cost**:
  - 256 4-bit weight codes (128 bytes) + two-level quantization parameters (12 bytes) + `d` and `dmin` (4 bytes) = **144 bytes**.
  - **Average width**: $144 \times 8 \div 256 = \mathbf{4.50\text{ bits/weight}}$ (exactly the storage cost of Q4_0).
'''
# src:
# 
# - **还原一个权重**（$q$ 为 4 位编码，取值 0 ~ 15）：
#   - 子块步长 = `d` × `sc`，子块偏移 = `dmin` × `m`；权重 = 子块步长 × $q$ − 子块偏移。
# - **超块开销结算**：
#   - 256 个 4 位权重编码（128 字节）+ 二级量化参数（12 字节）+ `d` 与 `dmin`（4 字节）= **144 字节**。
#   - **平均位宽**：$144 \times 8 \div 256 = \mathbf{4.50\text{ 位/权重}}$（与 Q4_0 的存储开销完全一致）。


src_hash = '1f7f8405'
text = 'Summary of this lecture'
# src: 本节小结

['summary.slide.1']
src_hash = '4eb7c363'
text = '''

- **What a byte is**: 8 two-valued signals, written as two hexadecimal digits, the smallest addressable unit
- **How a multi-byte object is arranged**: settled by byte order; GGUF and x86-64 both use little-endian
- **How the same bits yield different values**: unsigned and two's complement differ in the weight of the top bit, and conversions are where mistakes happen
- **How real numbers are encoded**: bits divided among sign, exponent and fraction; quantization compresses a weight to around 4 bits
'''
# src:
# 
# - **一个字节是什么**：8 个两值信号，写作两位十六进制，是最小的可寻址单位
# - **多字节对象如何排列**：由字节序规定；GGUF 与 x86-64 都采用小端
# - **同一段位如何得到不同的值**：无符号与补码的差别在最高位的权重，转换处最易出错
# - **实数如何编码**：符号、阶码、尾数三段分配位数；量化把一个权重压到 4 位上下

['summary.slide.2']
src_hash = 'cfe0ddaf'
text = '''

Bits carry no meaning of their own; the meaning comes from the rule that interprets them, and the rules are written in format specifications, type systems and hardware conventions. Errors at a type conversion are not reported at compile time and have to be looked for when reading and reviewing code.
'''
# src:
# 
# 位本身没有含义，含义来自解释它的规则；规则写在格式规范、类型系统与硬件约定里。
# 类型转换处的错误不会在编译时报告，需要在阅读与审查代码时主动检查。

['summary.highlight.1']
src_hash = '533bbf8c'
text = 'Before reading a run of bytes, settle which rule to read them by.'
# src: 读一段字节之前，先确定按什么规则读。

['summary.notes.1']
src_hash = '8cc177b2'
text = '''

These four together are all the conventions needed to read 1.9 GB of bytes as a model. One more sentence can connect them to what follows: in machine-level programs immediate values and addresses are likewise stored little-endian; in the memory hierarchy the bit width of the data directly sets the memory traffic per token; and the object files that linking and dynamic loading handle are equally byte sequences with a specification, approached the same way.
'''
# src:
# 
# 这四条合起来就是把 1.9 GB 字节读成一个模型所需的全部约定。
# 还可以补一句与后续内容的连接：机器级程序里立即数与地址同样按小端存放，
# 存储层次一节里数据的位宽直接决定每个 token 的访存量，
# 链接与动态加载处理的目标文件同样是有规范的字节序列，用的是同一套方法。

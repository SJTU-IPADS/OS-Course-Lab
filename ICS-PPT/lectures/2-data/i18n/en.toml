['bool-storage.title']
src_hash = '732470c1'
text = 'Aside: the space a boolean occupies'
# src: 拓展：布尔值占用的空间

['bool-storage.slide.1']
src_hash = '6bf4dc51'
text = '''

C has no built-in boolean type; zero and non-zero integers carry falsity and truth. C99 introduced `_Bool`, and `<stdbool.h>` defines `bool` as an alias for it. In C++ `bool` is built in.
- In both languages `sizeof(bool)` is <mark>one byte</mark>: the byte is the smallest addressable unit
- A boolean needs only 1 bit of information; the other 7 take no part in its value
- On assignment any non-zero value converts to 1, so `bool b = 17;` leaves the byte `0x01`
'''
# src:
# 
# **C 语言没有内置的布尔类型，真假由整数的零与非零表示；C99 引入 `_Bool`，**
# **`<stdbool.h>` 把 `bool` 定义为它的别名。C++ 中 `bool` 是一个内置类型。**
# - 两种语言中 `sizeof(bool)` 都是 <mark>1 个字节</mark>：字节是最小的可寻址单位
# - 一个布尔值只需要 1 位信息，其余 7 位不参与取值
# - 赋值时任何非零值都被转换为 1，`bool b = 17;` 在内存中留下的字节是 `0x01`


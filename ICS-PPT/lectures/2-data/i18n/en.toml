['special-values.slide.1']
src_hash = 'cea2655a'
text = '''
- Condition: $exp = 111\ldots1$
- $frac = 000\ldots0$: represents infinity $\infty$
  - Produced when an operation overflows
  - Comes in $+\infty$ and $-\infty$
  - E.g. $1.0/0.0 = -1.0/{-0.0} = +\infty$, $1.0/{-0.0} = -\infty$
- $frac \neq 000\ldots0$: Not-a-Number (NaN)
  - Represents the result of an operation with no determinable numeric value
  - E.g. $\sqrt{-1}$, $\infty - \infty$, $\infty \times 0$
- `<`, `<=`, `>`, `>=` and `==` between NaN and any value are all false and `!=` is true, so `x != x` can test for NaN
'''
# src:
# 
# - 条件：$exp = 111\ldots1$
# - $frac = 000\ldots0$：表示无穷 $\infty$
#   - 运算溢出时得到
#   - 分为 $+\infty$ 与 $-\infty$
#   - 例：$1.0/0.0 = -1.0/{-0.0} = +\infty$，$1.0/{-0.0} = -\infty$
# - $frac \neq 000\ldots0$：非数（NaN，Not-a-Number）
#   - 表示无法确定数值的运算结果
#   - 例：$\sqrt{-1}$，$\infty - \infty$，$\infty \times 0$
# - NaN 与任何值的 `<`、`<=`、`>`、`>=`、`==` 均为假，`!=` 为真，`x != x` 因此可用于判断 NaN

['special-values.notes.1']
src_hash = '56c436c1'
text = '''

In single precision the bit pattern of $+\infty$ is `0x7F800000` and that of $-\infty$ is `0xFF800000`.
The $frac$ of a NaN can be any nonzero value, so $2 \times (2^{23} - 1)$ bit patterns are NaN.
$1.0/{-0.0} = -\infty$ shows that $+0$ and $-0$ compare equal as floating-point values yet give results of different sign in division.
'''

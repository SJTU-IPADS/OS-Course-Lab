['memory-as-bytes.title']
src_hash = '7dc64c3f'
text = 'The memory model: a byte-addressed array'
# src: 内存模型：以字节为单位编址的数组

['memory-as-bytes.slide.1']
src_hash = '2cf11e4e'
text = '''
**The memory a program sees is an <mark>array addressed in bytes</mark>: each address denotes one byte.**
- Addresses are numbered consecutively from 0; all addresses together form the **address space**
- A multi-byte object occupies a run of consecutive addresses; its address is the **smallest** of them
'''
# src:
# 
# **程序看到的内存是一个<mark>以字节为单位编址的数组</mark>：每个地址对应一个字节。**
# - 地址从 0 开始连续编号，全体地址构成**地址空间**
# - 一个多字节对象占用一段连续地址，其地址取这段地址中的**最小值**

['memory-as-bytes.aside.1']
src_hash = 'e83c2a2d'
text = 'The byte is the smallest addressable unit, so data narrower than a byte must be packed into a byte.'
# src: 字节是最小的可寻址单位，因此比字节更小的数据必须打包进一个字节。

['word-size.title']
src_hash = '5cb3fe29'
text = 'Word size: the width of a pointer and the limit of the address space'
# src: 字长：指针的宽度与地址空间的上限

['word-size.slide.1']
src_hash = '3bd1f101'
text = '''
The **word size** is the number of bits a pointer occupies. An $n$-bit pointer can represent $2^n$ distinct addresses,
each address denotes one byte, and the address space is therefore $2^n$ bytes. The word size is fixed jointly by the hardware and the operating system;
it is a system parameter that a program cannot choose.
'''
# src:
# 
# **字长**指一个指针占用的位数。$n$ 位的指针能表示 $2^n$ 个不同的地址，
# 每个地址对应一个字节，地址空间的大小因此就是 $2^n$ 字节。字长由硬件与操作系统共同确定，
# 是一个不能由程序选择的系统参数。


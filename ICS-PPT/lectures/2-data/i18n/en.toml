['bf16-tradeoff-cont.slide.1']
src_hash = '87059462'
text = '''
- **The design of BF16**:
  - It keeps an 8-bit exponent, exactly as wide as FP32's, and compresses the fraction to 7 bits.
  - The central trade-off: it accepts lower relative precision (about 2.4 significant decimal digits) in exchange for a dynamic range exactly equal to FP32's ($\pm 3.4 \times 10^{38}$), which removes the risk of gradient overflow in training.
'''

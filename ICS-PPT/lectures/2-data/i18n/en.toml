['fp-absorption.title']
src_hash = '6200751f'
text = 'Truncation in exponent alignment and floating-point absorption'
# src: 阶码对齐截断与浮点吸收现象

['fp-absorption.slide.1']
src_hash = '636aea5c'
text = '''
- **Alignment in floating-point addition**:
  - Before a floating-point addition, the exponents must be aligned: the significand of the operand with the smaller exponent is shifted right.
  - The part shifted beyond the physical width of the significand register is not discarded directly; it is kept as the GRS bits, which take part in the rounding decision.
- **Floating-point absorption**:
  - When the exponent difference $\Delta E$ is large enough (on the order of the number of significand bits), the aligned contribution of the smaller operand can be less than half a unit in the last place (0.5 ulp), and the final rounded result is the same as discarding that operand.
  - Mathematically: there exists a nonzero positive number $y > 0$ for which the hardware result satisfies $x \oplus y = x$.
'''
# src:
# 
# - **浮点加法的对齐过程**：
#   - 浮点加法执行前必须先进行阶码对齐：较小阶码的操作数尾数需向右移位。
#   - 移位超出尾数寄存器物理位宽的部分不会被直接丢弃，而是保留为 GRS 位参与舍入判断。
# - **浮点吸收现象**：
#   - 当阶码差 $\Delta E$ 足够大（达到尾数位数量级）时，较小操作数经对齐后的贡献可能小于半个末位精度（0.5 ulp），舍入的最终结果与直接丢弃该操作数等效。
#   - 数学表现：存在非零正数 $y > 0$，使得硬件计算结果满足 $x \oplus y = x$。

['fp-absorption.image.1.alt']
src_hash = 'aeb6458f'
text = '2^24 plus 1.0: in alignment the significand of 1.0 shifts right by 24 bits, and its only 1 leaves the window'
# src: 2^24 加 1.0：对阶时 1.0 的尾数右移 24 位，唯一的 1 被移出窗口

['fp-absorption.notes.1']
src_hash = 'cf5ab9e1'
text = '''
Teaching goal: starting from how floating-point addition executes in the microarchitecture (alignment to the larger exponent, right shift of the smaller operand's significand, GRS rounding decision), explain how small increments are removed by rounding in numerical computation, and state the physical limit of machine precision.

Boundary detail (advanced): when ΔE ≥ p+1 = 25, absorption always occurs regardless of whether the significand is odd or even. In this example ΔE is exactly 24, the tie case of rounding: y = 1.0 is exactly half an ulp, and the last significand bit of 2^24 is even, so the round-to-even rule leaves the result unchanged. If the last significand bit of x is odd (as in 2^24+2), or y is not a power of two, then with the same ΔE = 24 the result usually rounds up, and absorption does not occur.
'''
# src:
# 
# 核心教学目标：从浮点加法的微架构执行过程（阶码对齐至大阶码、小阶码尾数右移、GRS 舍入判断），
# 解释小增量在数值计算中被舍入"抹平"的机理，说明机器精度的物理界限。
# 
# 边界细节（进阶）：ΔE ≥ p+1=25 时，无论尾数奇偶，吸收必然发生；
# 本例 ΔE 恰好等于 24，属于舍入的临界(tie)情况——y=1.0 恰好等于半个 ulp，
# 且 2^24 尾数末位为偶数，"取偶"规则使结果保持不变。
# 若 x 尾数末位为奇数（如 2^24+2），或 y 不是 2 的整数次幂，
# 则同样 ΔE=24 时通常会舍入进位，并不表现为吸收。


['bf16-tradeoff.title']
src_hash = '72b67696'
text = 'Extensions in modern architectures: the trade-off between dynamic range and relative precision'
# src: 现代体系结构扩展：动态范围与相对精度的折衷

['bf16-tradeoff.slide.1']
src_hash = '1e7c6d02'
text = '''
- **The basic design trade-off under a width constraint**:
  - With the total width fixed at 16 bits: the number of exponent bits determines the dynamic range (the upper and lower bounds of the values); the number of fraction bits determines the relative precision.
- **The practical limits of the standard half-precision FP16**:
  - The exponent has only 5 bits, and the largest representable value is limited to $65504$.
  - Gradients computed in back-propagation in deep learning very easily overflow (to infinity) or underflow (to zero), which requires a complex mixed-precision software stack with dynamic scaling.
'''
# src:
# 
# - **位宽约束下的设计权衡公理**：
#   - 在总位宽固定为 16 位的物理约束下：阶码字段位数决定动态范围（数值上下界）；尾数字段位数决定相对精度。
# - **传统标准半精度浮点 FP16 的工业局限**：
#   - 阶码仅 5 位，最大表示值受限于 $65504$。
#   - 深度学习反向传播计算梯度时极易触发数值上溢（溢出为无穷大）与下溢（下溢为零），必须依赖复杂的混合精度动态缩放软件栈支撑。


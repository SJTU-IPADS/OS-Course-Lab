['endianness.title']
src_hash = 'c48ecc42'
text = 'Byte order: the rule for laying out multi-byte objects'
# src: 字节序：多字节对象的排列规则

['endianness.slide.1']
src_hash = '1d60ac3f'
text = '''
**A 4-byte integer uses four consecutive addresses; the <mark>byte order</mark> fixes which byte comes first.**
- **Little-endian**: least significant byte at the lowest address; x86-64 and ARM default
- **Big-endian**: least significant byte at the highest address; TCP/IP headers
- The processor fixes it: how a load assembles bytes into a register is a hardware choice
'''
# src:
# 
# **一个 4 字节的整数占用四个连续地址。哪个字节放在最低地址，由<mark>字节序</mark>规定。**
# - **小端**：最低有效字节位于最低地址。x86-64 与 ARM 的默认配置
# - **大端**：最低有效字节位于最高地址。TCP/IP 首部与部分平台采用
# - 采用哪一种由<mark>处理器</mark>确定：访存指令按哪个次序把内存中的字节组装成寄存器中的值，是硬件的设计选择，程序无法更改

['endianness.image.1.caption']
src_hash = 'f88a2726'
text = 'Same value, same four addresses, bytes in opposite order'
# src: 同一个值在两种排列下占用同样的四个地址，字节的次序相反

['endianness.notes.1']
src_hash = '1f70c9a1'
text = '''

The order of bits within a byte is never observed by a program, so it does not arise; the subject throughout is the order of bytes. x86-64 is little-endian only. ARM, RISC-V and PowerPC are bi-endian processors: both orders can execute, and which one is in force is fixed at boot by a control register, with Linux normally running little-endian on all of them. File formats and network protocols are a separate kind of convention: they fix their own byte order, independent of the processor running them.
'''
# src:
# 
# 字节内部的位序不由程序观察，因此不涉及这一问题；讨论的对象始终是字节的次序。
# x86-64 只有小端一种。ARM、RISC-V、PowerPC 是双端序处理器，两种次序都能执行，
# 实际使用哪一种在启动时由控制寄存器固定，Linux 在这些平台上通常运行于小端
# 文件格式与网络协议是另一类约定：它们自行规定字节序，与运行它们的处理器无关。


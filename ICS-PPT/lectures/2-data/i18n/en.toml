['granularity-spectrum.notes.1']
src_hash = '55e0ba30'
text = '''
The smaller the group, the more closely the grid step fits the local data distribution, and the higher the fitting precision usually is; but the system design must account exactly for the metadata overhead: each group must store its own FP16 scale factor. For groups of 32, this adds 0.5 bits of storage cost per parameter. This overhead is the architectural price paid for local representational precision.
The data in the table are the first 4096 weights of ffn_down in layer 0 of Llama-3.2-1B; the first column has all 4096 sharing 1 step.
'''
# src:
# 
# 分组粒度越小，网格步长越贴合局部数据分布，拟合精度通常越高；但系统设计必须精确核算元数据
# 开销：每个分组都需独立保存一个 FP16 缩放系数。以 32 元素分组为例，分摊到每个参数上会额外
# 产生 0.5 位的存储成本。这部分开销即为换取局部表征精度所付出的体系结构代价。
# 表中数据是 Llama-3.2-1B 第 0 层 ffn_down 的前 4096 个权重，第一列是这 4096 个共用 1 个步长。


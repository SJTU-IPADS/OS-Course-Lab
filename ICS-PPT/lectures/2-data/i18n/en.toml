['float-encoding.slide.1']
src_hash = 'c95979b5'
text = '''

- Denormalized values drop the leading 1, keeping the representable values evenly spaced near zero and letting underflow happen gradually
- $+0$ and $-0$ are two distinct bit patterns that compare equal as floating point
- NaN compares false under `<`, `<=`, `>`, `>=` and `==`, and true under `!=`, so `x != x` is a test
'''
# src:
# 
# - 非规格化数取消前导的 1，使零附近的可表示值保持均匀间隔，并让下溢逐步发生
# - $+0$ 与 $-0$ 是两个不同的位模式，按浮点比较相等
# - NaN 与任何值的 `<`、`<=`、`>`、`>=`、`==` 均为假，`!=` 为真，`x != x` 因此可用于判断

['float-encoding.highlight.1']
src_hash = '723e2322'
text = 'Both reserved codes taken, the 8-bit exponent spans −126 to 127.'
# src: 全 0 与全 1 被保留，8 位阶码的实际指数范围是 −126 到 127。

['float-encoding.notes.1']
src_hash = '8650683b'
text = '''

Denormalized values take $E = -126$ rather than $-127$ so that the largest denormalized value meets the smallest normalized one with no gap between them. The low-precision formats follow the same rules: among the representable values of FP8 E4M3, a substantial share are denormalized.
'''
# src:
# 
# 非规格化数的 $E$ 取 $-126$ 而非 $-127$，是为了让最大的非规格化数与最小的
# 规格化数首尾相接，中间不出现间隙。低精度格式沿用同一套规则：FP8 E4M3 的
# 可表示值里，非规格化数占了相当一部分。

['float-distribution.title']
src_hash = 'c02d1dd6'
text = 'How floating-point values are distributed on the real line'
# src: 浮点数在实数轴上的分布

['float-distribution.slide.1']
src_hash = '9cd2e9f1'
text = '''

- The exponent selects an interval $[2^E, 2^{E+1})$, and the fraction divides that interval into $2^n$ equal parts
- Each time a power of two is crossed the interval doubles, the step doubles with it, and the representable values thin out
- The step is proportional to the value itself, so the relative precision stays essentially constant across the whole range
'''
# src:
# 
# - 阶码选定一个区间 $[2^E, 2^{E+1})$，尾数把这个区间等分为 $2^n$ 份
# - 每跨过一个 2 的幂，区间长度加倍，步长随之加倍，可表示的值随之变稀
# - 步长与数值本身成比例，因此相对精度在整个范围内基本不变

['float-distribution.notes.1']
src_hash = '5ce97198'
text = '''

The figure uses a simplified format with only 3 fraction bits; FP32 divides each interval into $2^{23}$ parts on the same principle. The denormalized values near zero are the one evenly spaced stretch, filling the gap between the smallest normalized value and zero.
'''
# src:
# 
# 图中用的是尾数只有 3 位的简化格式，FP32 的每个区间被等分成 $2^{23}$ 份，道理相同。
# 零附近的非规格化数是唯一一段等距区域，它填补了最小规格化数与零之间的空隙。

['float-spacing-measured.title']

['summary.title']
src_hash = '1f7f8405'
text = 'Summary'
# src: 本节小结

['summary.slide.1']
src_hash = 'b7745a59'
text = '''
- **What a byte is**: 8 two-valued signals, written as two hexadecimal digits, the smallest addressable unit
- **How a multi-byte object is arranged**: settled by byte order; GGUF and x86-64 both use little-endian
- **How the same bits yield different values**: unsigned and signed numbers differ in the weight of the top bit, and conversions are where mistakes happen
- **How real numbers are encoded**: bits divided among sign, exponent and fraction; quantization compresses a weight to around 4 bits
'''
# src:
# 
# - **一个字节是什么**：8 个两值信号，写作两位十六进制，是最小的可寻址单位
# - **多字节对象如何排列**：由字节序规定；GGUF 与 x86-64 都采用小端
# - **同一段位如何得到不同的值**：无符号数与有符号数的差别在最高位的权重，转换处最易出错
# - **实数如何编码**：符号、阶码、尾数三段分配位数；量化把一个权重压到 4 位上下


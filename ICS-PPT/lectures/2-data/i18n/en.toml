['k-scales-layout.notes.1']
src_hash = 'eaa68275'
text = '''

This is the densest use of this lecture's bitwise material in a real format: not a single bit is empty, so no convenient reading gets it right and the bits must be taken by definition. The place that is easy to get wrong is the last four values: their low 4 bits are in bytes 8 through 11 and their high 2 bits in bytes 0 through 7, the two pieces come from different bytes, and reversing the order of the concatenation raises no error, only making every reconstructed weight uniformly too large or too small.
'''

['tiny-float-answer.title']
src_hash = '0d0b0232'
text = 'Exercise: an 8-bit floating-point encoding'
# src: 小练习：8 位浮点编码

['tiny-float-answer.slide.1']
src_hash = 'ec42024f'
text = '''
**8-bit encoding: 1+4+3, $Bias = 7$, $E = Exp - 7$, normalized $M = 1.fff$.**
- `0 0110 100`: $Exp = 6$, $E = -1$, $M = 1.100_2 = 1.5$, value $0.75$
- `2.5`: $10.1_2 = 1.01_2 \times 2^{1}$, $Exp = 8 = 1000$, $frac = 010$, encoding `0 1000 010`
- $0.011_2$: $1.1_2 \times 2^{-2}$, $Exp = 5 = 0101$, $frac = 100$, encoding `0 0101 100`, value $0.375$
'''
# src:
# 
# **8位编码：1+4+3，$Bias = 7$，$E = Exp - 7$，规格化 $M = 1.fff$。**
# - `0 0110 100`：$Exp = 6$，$E = -1$，$M = 1.100_2 = 1.5$，值为 $0.75$
# - `2.5`：$10.1_2 = 1.01_2 \times 2^{1}$，$Exp = 8 = 1000$，$frac = 010$，编码 `0 1000 010`
# - $0.011_2$：$1.1_2 \times 2^{-2}$，$Exp = 5 = 0101$，$frac = 100$，编码 `0 0101 100`，值为 $0.375$


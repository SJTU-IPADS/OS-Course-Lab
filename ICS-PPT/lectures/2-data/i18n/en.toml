src_hash = 'fa818f06'
text = 'Advanced systems: K-quants superblock design and two-level quantization'
# src: 系统进阶：K-quants 超块设计与二级量化

['kquants-superblock-cont.slide.1']
src_hash = 'b1b2864d'
text = '''
- **How Q4_K resolves it: superblocks and two-level quantization**:
  - **Superblock size**: each superblock contains **256 weights**, subdivided into **8 sub-blocks (32 weights each)**.
  - The 8 sub-blocks need 8 steps and 8 offsets (16 parameters in all).
  - **The two-level quantization mechanism**:
    - Each step is quantized in units of `d` to a 6-bit integer `sc`, and each offset in units of `dmin` to a 6-bit integer `m`.
    - `sc` and `m` together take $16 \times 6 = 96\text{ bits} = \mathbf{12\text{ bytes}}$; `d` and `dmin` are FP16, **4 bytes** in all.
'''
# src:
# 
# - **Q4_K 的破局之道：超块与二级量化**：
#   - **超块规模**：每个超块包含 **256 个权重**，细分为 **8 个子块（各 32 个权重）**。
#   - 8 个子块需要 8 个步长与 8 个偏移量（共 16 个参数）。
#   - **二级量化机制**：
#     - 步长以 `d` 为单位量化为 6 位整数 `sc`，偏移以 `dmin` 为单位量化为 6 位整数 `m`。
#     - `sc` 与 `m` 共 $16 \times 6 = 96\text{ bits} = \mathbf{12\text{ 字节}}$；`d` 与 `dmin` 为 FP16，共 **4 字节**。

['kquants-superblock-cont.notes.1']
src_hash = 'fff1cdba'
text = '''
Note the systems-engineering idea of two-level quantization: what gets quantized is not limited to the weight data themselves; the scale and offset parameters produced by quantization can be quantized again as well. The 8 sub-blocks originally need 32 bytes of floating-point metadata, which a second 6-bit quantization compresses to 12 bytes. On approximately symmetric weights, Q4_K achieves at a storage cost of 4.5 bits an error comparable to the 5.0-bit Q4_1; on all-positive weights it still falls short of Q4_1, for the reason given in the notes of the third screen.

`d` is the largest of the 8 sub-block steps divided by 63, and `sc` = round(sub-block step ÷ `d`), so `sc` lies in 0 ~ 63, exactly 6 bits; `dmin` and `m` do the same for the offsets. `d` and `dmin` themselves are not quantized further and are stored as FP16.
'''
# src:
# 
# 请大家体会二级量化的系统工程巧思：量化对象不仅限于权重数据
# 本身，量化产生的缩放与偏移参数同样可以被再次量化。8 个子块原本需要 32 字节的浮点元数据，
# 经过 6 位二次量化后被紧凑压缩为 12 字节。在近似对称的权重上，Q4_K 以 4.5 位的存储开销，
# 取得了与 5.0 位的 Q4_1 相当的误差；全为正的权重上仍不及 Q4_1，原因见第三面的讲稿。
# 
# `d` 取 8 个子块步长中的最大值除以 63，`sc` = round(子块步长 ÷ `d`)，因此 `sc` 落在
# 0 ~ 63，正好 6 位；`dmin` 与 `m` 对偏移做同样的事。`d` 与 `dmin` 本身不再量化，按 FP16 存储。


['bit-identities.notes.1']
src_hash = '48fd63f2'
text = '''

These rules are given as gate circuits in digital electronics; here they hold simultaneously on every bit of an integer: one `&` instruction is 32 or 64 and-gates side by side. Xnor is written ⊙ in digital electronics and as `~(x ^ y)` in C, and comes up when counting how many bits two patterns share. `x & (x - 1)` removes one 1 bit each time, so the number of iterations before reaching 0 is the number of 1 bits — the classic form of popcount. `examples/bit_rules.c` checks all seven against all 65536 values of a two-byte word; it can be run on the spot if a student asks, and takes no slide of its own.
'''
# src:
# 
# 这些规则在数字电子技术中按门电路给出，在这里按整数的每一位同时成立：
# 一条 `&` 指令就是 32 或 64 个与门并列。
# 同或在数电里写作 ⊙，C 里用 `~(x ^ y)` 表示，常见于比较两个位模式有多少位相同。
# `x & (x - 1)` 每次消掉一位 1，循环执行到 0 的次数就是 1 的个数，这是 popcount 的经典写法。
# `examples/bit_rules.c` 把这七条对两个字节的全部 65536 种取值逐一比对过，
# 有学生问起可以当场跑一遍，它不占一页幻灯片。


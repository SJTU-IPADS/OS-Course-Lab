text = 'Non-uniform quantization: the information-theoretic equal-probability partition of NF4'
# src: 非均匀量化：NF4 的信息论等熵分割

['nf4-lut.slide.1']
src_hash = 'ce4d8903'
text = '''
- **The limitation of uniform integer quantization**:
  - After per-block normalization, pretrained weights **approximately follow a zero-mean normal distribution** (the premise of QLoRA).
  - An equally spaced grid allocates as many grid points to the low-probability tails as to the high-probability middle, so the resolution in the middle is relatively insufficient.
- **The quantile-quantization principle**:
  - Make every code equally likely to be taken, so that the information entropy of the 4-bit code is maximal.
- **How NF4 quantization works**:
  - Take quantiles of the standard normal distribution as the 16 grid points and scale them to $[-1, 1]$; so that 0 can be represented exactly, 7 are taken on the negative half-axis and 8 on the positive half-axis, and the intervals are only approximately equiprobable.
  - **Restoring by lookup table**:
    - The 4 bits no longer store a value but **a lookup-table index from 0 to 15**;
    - At run time a table of 16 constants is consulted, and the result is multiplied by the block's scale factor (absmax) before entering the computation.
'''
# src:
# 
# - **均匀整数量化的局限**：
#   - 预训练权重按块归一化后，**近似服从零均值正态分布**（QLoRA 的前提）。
#   - 等距网格在两端低概率区与中间高概率区分配同样多的格点，中间区域分辨率相对不足。
# - **分位数量化原则**：
#   - 让每个编码被取到的概率相等，4 位编码的信息熵达到最大。
# - **NF4 量化实现机制**：
#   - 取标准正态分布的分位数作为 16 个格点，缩放到 $[-1, 1]$；为使 0 能被精确表示，负半轴取 7 个、正半轴取 8 个，各区间只是近似等概率。
#   - **查找表还原**：
#     - 4 位存储的不再是数值，而是 **0 ~ 15 的查找表索引**；
#     - 运行时查一张 16 个常量的表，乘以块的缩放系数（absmax）后送入计算。

['nf4-lut.slide.1.footnote.1']
src_hash = 'aaf611aa'
text = 'Source: Dettmers, T. et al. *QLoRA: Efficient Finetuning of Quantized LLMs*, NeurIPS (2023).'
# src: 文献出处：Dettmers, T. et al. *QLoRA: Efficient Finetuning of Quantized LLMs*, NeurIPS (2023).

['nf4-lut.notes.1']
src_hash = '90e2f897'
text = '''
NF4 does not require hardware support for non-uniform arithmetic: memory holds 4-bit indices, and before computation a table of 16 values is consulted and the result multiplied by the block's scale factor (the maximum absolute value in the block) to restore a floating-point value.
The 16 values are quantiles of the standard normal distribution, on the premise that per-block normalized weights approximately follow a zero-mean normal distribution; so that 0 can be represented exactly, there are 7 on the negative half-axis and 8 on the positive half-axis, and the intervals are therefore only approximately equiprobable. When the weight distribution departs from normal, this set of grid points is no longer the optimal choice.
'''
# src:
# 
# NF4 不要求硬件支持非等距运算：内存里存 4 位索引，计算前查一张 16 个值的表，再乘以该块的
# 缩放系数（块内绝对值的最大值），还原为浮点。
# 16 个值取自标准正态分布的分位数，前提是按块归一化后的权重近似服从零均值正态分布；为了让
# 0 能被精确表示，负半轴 7 个、正半轴 8 个，因此各区间只是近似等概率。权重分布偏离正态时，
# 这组格点不再是最优的选择。


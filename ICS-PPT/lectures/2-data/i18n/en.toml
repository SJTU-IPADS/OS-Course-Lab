['quant-plain-speed.title']
src_hash = 'c9a337ef'
text = 'After shortening: which hop moves fewer bytes'
# src: 变短之后，少搬的是哪一段

['quant-plain-speed.image.1.alt']
src_hash = 'ad97730b'
text = 'Weights load from disk into main memory, then into GPU memory; every token moves them from GPU memory into the compute units, and that hop is the one quantization shortens'
# src: 权重从磁盘装入主存，再拷到显存；每次生成时从显存搬进计算单元，量化少搬的是这一段

['quant-plain-speed.slide.1']
src_hash = '91ebf723'
text = '''
- ① ②: started by the CPU, disk → main memory → GPU memory, each hop once while the model loads
- ③ GPU memory → compute units: this hop happens again for every token, and quantization cuts its bytes to about 1/4
- On the compute units, dequantize first and then do the matrix multiply: that extra arithmetic is traded for the bytes not moved
'''
# src:
# 
# - ① ②：CPU 发起，磁盘 → 主存 → 显存，模型加载时各走一遍
# - ③ 显存 → 计算单元：每生成一个 token 都走一遍，量化把这一段的字节数大约变成 1/4
# - 计算单元上先做反量化，再做矩阵乘：用这一点计算，换少搬的字节

['quant-plain-speed.notes.1']
src_hash = 'a24fa79c'
text = '''
Of the four stores, only the hop from GPU memory to the compute units repeats while generating. The copies through disk and main memory happen once at load time. Quantization cuts the bytes on that repeated hop: 4 bits are about 1/4 of 16 bits. Dequantization is extra work on the compute units, multiplying the integers back by the tick width and usually handing the floats to the floating-point units for the matrix multiply. The dot product moves to the integer units only when the activations are integers too and the hardware has INT8 multiply-add, with the tick width applied after the accumulation. Whether the error is acceptable depends on the model and the task. From the next page on, the same idea is told with the systems accounting and the formulas.
'''
# src:
# 
# 四段存储里，生成时反复走的只有显存到计算单元。磁盘和主存上的拷贝在加载时发生一次。
# 量化减少的是这一段反复搬运的字节数：4 位大约是 16 位的 1/4。
# 反量化是计算单元上的额外工作，把整数乘回格宽，通常再交回浮点单元做矩阵乘。
# 激活也是整数、硬件又有 INT8 乘加时，点积才改走整数单元，格宽留到累加之后再乘。
# 误差是否可接受要看模型和任务。下一页起是同一件事的系统账和公式。


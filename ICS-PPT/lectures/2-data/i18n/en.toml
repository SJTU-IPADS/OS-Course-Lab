['memory-wall-cont.slide.1']
src_hash = 'af1b77e6'
text = '''
- **Root cause** (taking the RTX 5090 balance point of about 117 FLOP/Byte as reference):
  - **BERT (whole sequence in one forward pass)**: arithmetic intensity as high as **117 ~ 266 FLOP/Byte**
    $\implies$ at or above the balance point, in the **compute-bound region**; the performance limit is set by peak compute.
  - **GPT-2 (autoregressive, token by token)**: arithmetic intensity drops to only **2 FLOP/Byte**
    $\implies$ in the **memory-bound region**; the performance limit is set by bandwidth, and the compute units spend most of their time waiting for data.
- **What quantization does**: the model structure is unchanged, and at run time operators with dequantization are used instead; the weight data shrinks to about $1/4$ (BF16 → 4 bits), the operating point moves right on the Roofline, and the arithmetic intensity rises about 4 times.
'''
# src:
# 
# - **根源剖析**（以 RTX 5090 的平衡点约 117 FLOP/Byte 为参照）：
#   - **BERT（整段序列一次前向传播）**：算术强度高达 **117 ~ 266 FLOP/Byte**
#     $\implies$ 达到或超过平衡点，处于**算力受限区**，性能上限由峰值算力决定。
#   - **GPT-2（自回归逐 token 生成）**：算术强度跌落至仅 **2 FLOP/Byte**
#     $\implies$ 处于**访存受限区**，性能上限由带宽决定，计算单元大部分时间在等待数据。
# - **量化的作用**：模型结构不变，运行时换用带反量化的算子；权重数据量降至约 $1/4$（BF16 → 4 位），工作点在 Roofline 上右移，算术强度约提高 4 倍。


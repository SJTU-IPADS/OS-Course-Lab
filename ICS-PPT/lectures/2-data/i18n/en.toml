['bf16-mapping.title']
src_hash = 'b9b3827b'
text = 'Friendliness to microarchitectural implementation: the bit-level mapping from FP32 to BF16'
# src: 微架构实现友好性：FP32 到 BF16 的位级映射

['bf16-mapping.slide.1']
src_hash = '277eb4fa'
text = '''
- **The advantage of aligned bit layouts**:
  - The sign and exponent bits of FP32 and BF16 occupy exactly the same physical positions (bit 31 to bit 16).
  - The simplest conversion needs only a single shift instruction to take the upper 16 bits of FP32, and the reverse widening only fills the low bits with zeros. Compared with FP16 (which requires recomputing the bias and handling denormalized shifts), the logic-gate cost is very low.
'''
# src:
# 
# - **位布局天然对齐优势**：
#   - FP32 与 BF16 的符号位、阶码位在物理位置上严格一致（位 31 至位 16）。
#   - 最精简的转换仅需单条移位指令截取 FP32 的高 16 位，反向扩展仅需低位补零。对比 FP16（需动态重新计算偏置、处理非规格化移位），逻辑门开销极低。

['bf16-mapping.image.1.alt']
src_hash = 'f80cbfaa'
text = 'FP32 to BF16 needs only the upper 16 bits passed through plus one rounding carry; FP32 to FP16 must rewrite field by field'
# src: FP32 转 BF16 只需高 16 位直通加一次进位；FP32 转 FP16 需要逐项改写


['affine-mapping.title']
src_hash = '8ef7b0ec'
text = 'Formalization: uniform affine quantization'
# src: 形式化：均匀仿射量化映射

['affine-mapping.slide.1']
src_hash = '1e179773'
text = '''
- **The mapping task**: project the continuous floating-point interval $[w_{\min}, w_{\max}]$ onto the $b$-bit integer set $[q_{\min}, q_{\max}]$.
- **Quantization (encoding)**:
 $$q = \text{clip}\left(\left\lfloor \frac{w - m}{d} \right\rceil, \; q_{\min}, \; q_{\max}\right)$$
- **Dequantization (reconstruction)**:
 $$\hat{w} = d \times q + m$$
- **Meaning of the parameters**:
  - **Step $d$**: a positive floating-point number, the spacing of the discrete grid: $d = \frac{w_{\max} - w_{\min}}{q_{\max} - q_{\min}}$.
  - **Offset $m$**: the real value that integer code 0 corresponds to, $m = w_{\min} - d\,q_{\min}$, so that $q_{\min}$ dequantizes to $w_{\min}$. $m$ is a floating-point number and need not be an integer multiple of $d$; the real number 0 does not necessarily lie on a grid point.
'''
# src:
# 
# - **映射任务**：将连续浮点区间 $[w_{\min}, w_{\max}]$ 投射至 $b$-bit 整数集合 $[q_{\min}, q_{\max}]$。
# - **量化编码公式**：
#  $$q = \text{clip}\left(\left\lfloor \frac{w - m}{d} \right\rceil, \; q_{\min}, \; q_{\max}\right)$$
# - **反量化重构公式**：
#  $$\hat{w} = d \times q + m$$
# - **参数的物理意义**：
#   - **步长 $d$**：正浮点数，表示离散网格的单位刻度间距：$d = \frac{w_{\max} - w_{\min}}{q_{\max} - q_{\min}}$。
#   - **偏移 $m$**：整数码 0 对应的实数值，$m = w_{\min} - d\,q_{\min}$，使 $q_{\min}$ 反量化得到 $w_{\min}$。$m$ 是浮点数，不必是 $d$ 的整数倍，实数 0 不一定落在格点上。

['affine-mapping.slide.1.footnote.1']
src_hash = '889f6ef5'
text = 'Source: Jacob, B. et al. CVPR (2018).'
# src: 文献出处：Jacob, B. et al. CVPR (2018).

['affine-mapping.notes.1']
src_hash = '0c62462b'
text = '''
These two formulas are the basis of uniform quantization. $d$ determines how fine the ticks of the scale are, and is itself a floating-point number; $m$ is the real value that integer code 0 corresponds to, and determines where the whole scale sits on the real line. As long as $w$ does not exceed the quantization range and $d$ and $m$ themselves are not rounded, the error from rounding is at most half a tick. GGUF's Q4_1 stores $d$ and $m$ directly, both as FP16; its 4-bit codes take 0 ~ 15 and $q_{\min} = 0$, so $m$ equals the minimum of the block.
Asymmetric quantization, grouping and clipping, discussed later, all control the size of this tick $d$; the cost of clipping to reduce $d$ is the clipping error of the values outside the range.
'''
# src:
# 
# 这两个公式是均匀量化的基础。$d$ 决定尺子的刻度有多细，它本身是一个浮点数；$m$ 是
# 整数码 0 对应的实数值，决定整把尺子在实数轴上的位置。只要 $w$ 没有超出量化范围、$d$ 与 $m$ 本身没有舍入，四舍五入带来的
# 误差不超过半个刻度。GGUF 的 Q4_1 直接存储 $d$ 与 $m$，二者都是 FP16；4 位码取 0 ~ 15，
# $q_{\min} = 0$，因此 $m$ 等于块内的最小值。
# 后面讲的非对称量化、分组与截断，都是在控制这个刻度 $d$ 的大小；截断缩小 $d$ 的代价是
# 范围外的值产生截断误差。


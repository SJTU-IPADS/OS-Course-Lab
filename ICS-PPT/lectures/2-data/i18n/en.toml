['summary.notes.1']
src_hash = '8cc177b2'
text = 'These four together are all the conventions needed to read 1.9 GB of bytes as a model. One more sentence can connect them to what follows: in machine-level programs immediate values and addresses are likewise stored little-endian; in the memory hierarchy the bit width of the data directly sets the memory traffic per token; and the object files that linking and dynamic loading handle are equally byte sequences with a specification, approached the same way.'

['shift-kinds.notes.1']
src_hash = '28a7ee42'
text = '''

The C standard leaves a right shift of a signed value to the implementation; actual compilers and platforms all use an arithmetic shift. Treating a right shift of a signed value as division by a power of two is inaccurate: an arithmetic shift rounds toward negative infinity, so `-1 >> 1` gives −1 rather than 0. Another common form converts to unsigned first and then shifts, to extract a high field; this is the same practice as casting an address to `unsigned char *` at the start of this lecture: fix the rule of interpretation first, then take the value. On arm64 the two instructions are `asr` and `lsr`; the command above selects the right one on either instruction set.
'''
# src:
# 
# C 标准把有符号数右移的行为留给实现，实际的编译器与平台一律采用算术右移。
# 把有符号数右移当作除以 2 的幂是不准确的：算术右移向下取整，`-1 >> 1` 得 −1 而不是 0。
# arm64 上这两条指令叫 `asr` 与 `lsr`，上面的命令在两种指令集上都能选出对应的那一条。
# 另一处常见的写法是先转成无符号再右移，用于取出高位字段——这与本讲开头
# 把地址转成 `unsigned char *` 是同一种做法：先选定解释规则，再取值。


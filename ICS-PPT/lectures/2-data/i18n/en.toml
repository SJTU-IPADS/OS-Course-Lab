['ieee-rounding-modes.title']
src_hash = 'af8b1c8b'
text = 'IEEE 754 rounding modes and the mechanism of unbiasedness'
# src: IEEE 754 舍入模式与无偏性机制

['ieee-rounding-modes.slide.1']
src_hash = '43238118'
text = '''
- **The four rounding modes specified by IEEE 754**:
  1. **Round toward zero**: discard the fraction; the direction is always toward the origin.
  2. **Round down**: take the largest floating-point number not greater than the true value.
  3. **Round up**: take the smallest floating-point number not less than the true value.
  4. **Round to nearest even**: the default mode of operation.
- **The systematic defect of conventional round-half-up**:
  - When the true value lies exactly at the midpoint it is always rounded up; continued accumulation over a long sequence of positive numbers then introduces a positive systematic statistical bias.
- **The unbiased design of round-to-even**:
  - It applies only when the true value lies exactly midway between two representable values: the side whose least significant bit is 0 (even) is chosen.
  - Statistically, at midpoints rounding up and rounding down each occur with probability 50%, so the expected value of the accumulated rounding error is 0.
'''
# src:
# 
# - **IEEE 754 标准规定的四种舍入模式**：
#   1. **向零截断**：直接舍弃小数，方向始终朝向原点。
#   2. **向下舍入**：取不大于真值的最大浮点数。
#   3. **向上舍入**：取不小于真值的最小浮点数。
#   4. **向最近偶数舍入**：系统默认工作模式。
# - **传统四舍五入的系统缺陷**：
#   - 当真值恰好落在正中时一律向上取整，在对大规模正数序列进行持续累加时，会引入正向的系统性统计偏差。
# - **向偶数舍入的无偏性设计**：
#   - 仅在真值恰好处于两个可表示值正中时生效：强制选择最低有效位为 0（偶数）的一侧。
#   - 在统计上，中点边界处向上与向下舍入的概率各为 50%，累积舍入误差的数学期望为 0。


['hexadecimal.notes.1']
src_hash = '950d4f4a'
text = '''

The octal leading zero is a genuine source of defects: writing file permissions as `0644` is correct, but writing a decimal constant as `010` by mistake turns it into 8. C2y adds an `0o` prefix, supported as an extension by gcc 15 and invalid in C23 and earlier. C23 also allows `'` as a digit separator, as in `0b1111'1111`. On the output side only `%x` and `%o` exist; there is no conversion specifier for binary.
'''
# src:
# 
# 八进制的前导零是一类真实的缺陷来源：文件权限写 `0644` 是对的，把某个十进制常量
# 误写成 `010` 就会变成 8。C2y 增加了 `0o` 前缀，gcc 15 已作为扩展支持，C23 及以前无效。
# C23 还允许用 `'` 分组数字，如 `0b1111'1111`。输出侧只有 `%x` 与 `%o`，没有二进制的转换说明符。

['other-formats.title']
src_hash = 'eae80161'
text = 'How other model formats identify themselves'
# src: 其他模型格式的标识

['other-formats.demo.1.name']
src_hash = 'efaa8390'
text = 'The first 16 bytes of five files'
# src: 看五个文件的前 16 个字节

['other-formats.slide.1']
src_hash = 'fbc78f5f'
text = '''
- **Magic number**: `47 47 55 46` is GGUF, `50 4b 03 04` is zip; `.pt` is zip since 1.6
- **Self-describing header**: safetensors starts with an 8-byte length `3e` (62), then JSON `7b 22` = `{"`
- **No identifier**: ONNX is protobuf (`08` tags field 1); old `.pt` is pickle (`80 02` is an opcode)
'''
# src:
# 
# - **魔数**：GGUF 的 `47 47 55 46`、zip 的 `50 4b 03 04`；`.pt` 自 1.6 起就是 zip 归档
# - **自描述头部**：safetensors 开头 8 字节是头长 `3e`（62），随后即 JSON：`7b 22` 是 `{"`
# - **无标识**：ONNX 是 protobuf，`08` 是字段 1 的标签；旧 `.pt` 是 pickle 流，`80 02` 是协议操作码

['other-formats.highlight.1']
src_hash = '3d9a627b'
text = 'A file type is a convention: magic number, header, or extension.'
# src: 文件类型来自约定：魔数、自描述头部或扩展名。

['other-formats.notes.1']
src_hash = '667069f7'
text = '''

The `file` command decides from a table of magic numbers, which is why it recognizes zip but not GGUF or safetensors. The security difference is worth mentioning: pickle executes arbitrary code while deserializing, whereas safetensors reads one stretch of JSON and one contiguous span of data and holds nothing executable — the direct reason it was proposed. The five samples are produced by examples/make_formats.py, each written according to the rules of its own format rather than assembled by hand.
'''
# src:
# 
# `file` 命令的判断依据就是魔数表，因此它认得 zip 而认不出 GGUF 与 safetensors。
# 安全上的差别值得一提：pickle 在反序列化时执行任意代码，safetensors 只读取一段 JSON 与
# 一片连续数据，不含可执行内容，这是它被提出的直接原因。

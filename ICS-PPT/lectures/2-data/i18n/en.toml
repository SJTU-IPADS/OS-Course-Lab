text = '''
$0.2 = 1/5$ has a factor of 5 in the denominator, and the bracketed 0011 repeats forever.
Students can work out $0.375$ on the spot: $0.75$ gives 0, $1.5$ gives 1 leaving $0.5$, $1.0$ gives 1 leaving 0, so $0.011_2$.

['casts-ub.title']
src_hash = '311934e6'
text = 'Floating-point conversion rules in C, loss of precision, and undefined behaviour'
# src: C 语言浮点转换规则、精度损失与未定义行为

['casts-ub.slide.1']
src_hash = 'e3339a47'
text = '''
- **Conversion matrix and fidelity of precision**:
  - `int` to `double`: exact. `int` has 31 bits of precision and the `double` significand is 53 bits wide, so it fits exactly.
  - `int` to `float`: lossy. `float` provides only 24 bits of significant precision, and integer values above $2^{24}$ (16,777,216) are rounded.
  - `float` to `double`: an exact, lossless widening; `double` to `float`: subject to overflow or rounding of the low bits.
  - Floating point to integer: always truncates toward zero.
- **Out-of-range undefined behaviour and the underlying hardware**:
  - When a floating-point value exceeds the range of the target integer type (as in `(int)3e9`), the ISO C standard defines the behaviour as undefined.
  - On x86-64, the conversion instruction outputs one fixed special value for every out-of-range or invalid floating-point input: `0x80000000` (that is, $-2147483648$).
'''
# src:
# 
# - **转换矩阵与精度保真度分析**：
#   - `int` 转 `double`：保真。`int` 具有 31 位精度，`double` 尾数位宽为 53 位，可精确容纳。
#   - `int` 转 `float`：有损。`float` 仅提供 24 位有效精度，超过 $2^{24}$（16,777,216）的整型值将发生舍入。
#   - `float` 转 `double`：精确无损扩展；`double` 转 `float`：面临数值溢出或低位舍入。
#   - 浮点数转整数：统一采用向零截断。
# - **越界未定义行为与底层硬件处理**：
#   - 当浮点数数值超出目标整型表示范围（如 `(int)3e9`），ISO C 标准定义其为未定义行为。
#   - x86-64 体系结构下，转换指令对越界或无效浮点数统一输出固定的特殊值：`0x80000000`（即 $-2147483648$）。


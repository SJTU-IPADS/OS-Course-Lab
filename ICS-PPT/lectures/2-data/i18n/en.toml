['casting.slide.1']
src_hash = '363978d0'
text = '''
**C allows a variable of one type to be interpreted as another type; a conversion happens in two ways.**
- **Explicit**: writing `(unsigned short) x`
- **Implicit**: in assignment, argument passing and type promotion within expressions
- A conversion between signed and unsigned <mark>changes no bit</mark>; only the rule of interpretation changes
'''
# src:
# 
# **C 允许把一个类型的变量按另一个类型解释，转换有两种发生方式。**
# - **显式转换**：写出 `(unsigned short) x`
# - **隐式转换**：赋值、函数传参、以及表达式中的类型提升都会发生
# - 有符号与无符号之间的转换<mark>不改变任何一位</mark>，改变的只是解释规则


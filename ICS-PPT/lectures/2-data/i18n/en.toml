# src:
# 
# 讲师点拨与过渡：“向偶数舍入在数学统计上是优雅的。但从微架构与组合逻辑的角度来看，处理器电路是如何在流水线内判定‘精确中点’并执行进位的？”

['round-bits.title']
src_hash = 'f77f921b'
text = 'The microarchitectural view: bit-level rounding decisions on binary fractions'
# src: 微架构视角：二进制小数的位级舍入判决

['round-bits.slide.1']
src_hash = '5b6e5158'
text = '''
- **The physical representation of a bit-level midpoint**:
  - Suppose the retained bits end at some position. If the highest bit of the truncated part is `1` and all following bits are `0` (the bit pattern `1000..._2`), this state is the exact mathematical midpoint.
- **The hardware's three-way decision**:
  - Highest bit of the truncated part is `0` $\to$ below the midpoint; discard it.
  - Truncated part greater than `1000..._2` $\to$ above the midpoint; carry into the least significant bit ($+1$).
  - Truncated part exactly `1000..._2` $\to$ check the last retained bit: if it is `1`, carry so that it becomes even (`0`); if it is already `0`, discard.
- **Carry propagation**:
  - If every bit of the significand is `1`, the rounding carry overflows the significand field and clears it, and at the same time increments the exponent field by 1; the value moves into the next power-of-two interval.
'''
# src:
# 
# - **位级中点的物理表示**：
#   - 设保留位数截止于某一位。若被截断部分的最高位为 `1`，且后续所有位全为 `0`（即位模式 `1000..._2`），该状态即为数学上的精确中点。
# - **硬件的三级裁决状态机**：
#   - 截断部分最高位为 `0` $\to$ 小于中点，直接舍弃。
#   - 截断部分大于 `1000..._2` $\to$ 大于中点，向最低有效位进位（$+1$）。
#   - 截断部分恰好为 `1000..._2` $\to$ 检查保留位末位：若为 `1` 则进位使其变为偶数（`0`）；若已为 `0` 则直接舍弃。
# - **进位传播机制**：
#   - 若尾数各位全为 `1`，舍入进位会导致尾数字段溢出清零，同时触发阶码字段自动加 1，数值跨入下一个 2 的幂次区间。


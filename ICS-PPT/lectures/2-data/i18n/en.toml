['c-data-sizes.notes.1']
src_hash = 'c56f3b67'
text = '''

When a fixed width is required, use int32_t / uint64_t from `<stdint.h>`; those are the same width everywhere. What is worth stressing in class is that long and pointers vary with the platform: code that stores a pointer in an int loses the high half on a 64-bit platform. 64-bit Linux and macOS are LP64, where `long` is 8 bytes; Windows is LLP64, where `long` is 4 bytes and a pointer is still 8, so the `long` row of the 64-bit column reads 4 there. Programs in WSL2 are Linux programs and match the table.
'''
# src:
# 

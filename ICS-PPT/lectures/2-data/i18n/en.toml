# 
# 图中这一块的 32 个权重取值在 1.539 与 2.625 之间。Q4_0 的步长是 2.625/8 = 0.328，
# 16 个级里只有 4 个落在这个区间内；Q4_1 的步长是 (2.625 − 1.539)/15 = 0.0724，
# 16 个级全部落在区间内。两者相差 4.5 倍。
# 这也是 GGUF 把归一化系数保持为 F32 的原因之一：这类张量的值集中在 1 附近，

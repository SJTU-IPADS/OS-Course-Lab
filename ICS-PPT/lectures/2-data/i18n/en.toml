['float-not-real.slide.1']
src_hash = 'd728473c'
text = '''

- An overflowed integer is still an integer; two positive values can multiply to a negative
- Floating-point addition ==is not associative==: the order of the additions changes the result
- A finite decimal fraction may repeat in binary, and `0.1` and `0.2` are both rounded
'''
# src:
# 
# - 整数溢出后仍是一个整数，正数相乘可以得到负数
# - 浮点加法<mark>不满足结合律</mark>：改变加法次序会改变结果
# - 十进制的有限小数在二进制下可能是无限循环，`0.1` 与 `0.2` 都需要舍入

['float-not-real.highlight.1']
src_hash = '3ec56d30'
text = '`int` and `float` are finite approximations of infinite sets.'
# src: `int`/`float` 都是有限位的近似，其运算不满足整数/实数的运算律。

['precision-formats.title']
src_hash = '5b35a562'
text = 'Low-precision floating-point formats'
# src: 低精度浮点格式

['precision-formats.slide.1']
src_hash = '49b7eaaa'
text = '''

The formats differ only in how the three fields divide the bits.
- **BF16** has the same 8-bit exponent as FP32, hence the same range, with 16 fewer fraction bits
- **FP16** has a 5-bit exponent and a maximum of 65504, so larger values overflow
- **FP8** comes in E4M3 and E5M2, the first favouring precision and the second range
'''
# src:
# 
# **每种格式的差别只在三段位如何分配。**
# - **BF16** 与 FP32 的阶码同为 8 位，范围相同，尾数少 16 位
# - **FP16** 阶码 5 位，最大值 65504，数值较大时溢出
# - **FP8** 有 E4M3 与 E5M2 两种分法，前者精度优先，后者范围优先

['precision-formats.slide.2']
src_hash = '731c750a'
text = '''

Low precision discards the last few fraction bits, buying storage and memory traffic that fall in proportion to the bit width, along with higher multiply-add throughput. The premise is that the model's output quality is insensitive to the last fraction bits.
'''
# src:
# 
# 低精度舍弃尾数末尾的若干位，换来存储与访存量按位数同比例下降，以及更高的乘加吞吐。
# 前提是模型的输出质量对尾数末位的变化不敏感。

['precision-formats.notes.1']
src_hash = '038b660c'
text = '''

FP64 divides its bits 1 · 11 · 52 and is used in scientific computing; it rarely appears in deep learning and is not shown. The three gains can be stated separately: the weight file and the memory it occupies shrink in proportion to the bit width; the memory traffic per token shrinks in the same proportion; and low-precision multiply-add units on accelerators have higher throughput than high-precision ones.
'''
# src:
# 
# FP64 的分配为 1 · 11 · 52，用于科学计算，深度学习中很少出现，图中未列。
# 三项收益可以分开说：权重文件与显存占用按位数同比例下降；每个 token 的访存量同比例下降；
# 加速器上低精度乘加单元的吞吐高于高精度单元。

['bf16-truncation.title']

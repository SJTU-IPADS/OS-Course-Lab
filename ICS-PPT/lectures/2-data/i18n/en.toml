['expand-truncate.title']
src_hash = '3d9f867b'
text = 'Widening and truncation'
# src: 扩展与截断

['expand-truncate.slide.1']
src_hash = 'a3af6209'
text = '''
**Changing the width of an integer goes in two directions, under different rules.**
- **Widening**: the goal is to keep the value unchanged, and that goal decides which bits are added
  - Unsigned numbers are padded with 0 (zero extension): high 0 bits contribute nothing
  - Signed numbers are padded with the sign bit (sign extension): a negative value gains a 1; the old top bit's weight changes from $-2^{w-1}$ to $+2^{w-1}$, and adding the new top bit's $-2^{w}$ still gives $-2^{w-1}$; the same holds for each added 1, so padding with N ones leaves the value unchanged
- **Truncation**: only the low bits are kept and the high bits are simply discarded; the value may change entirely
'''
# src:
# 
# **改变一个整数的宽度有两个方向，规则各不相同。**
# - **扩展**：目的是保持数值不变，补入什么位由这个目的决定
#   - 无符号数补 0（零扩展）：高位的 0 不贡献数值
#   - 有符号数补符号位（符号扩展）：负数补一个 1，原最高位的权重由 $-2^{w-1}$ 变为 $+2^{w-1}$，与新最高位的 $-2^{w}$ 相加仍为 $-2^{w-1}$；每补一个 1 都是如此，因此补 N 个 1 不改变数值
# - **截断**：只保留低位，高位直接丢弃，数值可能完全改变


# safetensors 头部，本节后面的实验用的就是这个模型。
# DDR5-5600 双通道：5600 MT/s × 8 字节 × 2 = 89.6 GB/s。
# 批量推理是另一种情形：一次前向服务多个请求时，同一份权重被多次使用，
# 瓶颈会从访存转向算力，量化带来的收益随之下降。


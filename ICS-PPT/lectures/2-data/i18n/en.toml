['why-binary.title']
src_hash = '88fa38d3'
text = 'Information in a modern computer is carried by two-valued signals'
# src: 现代计算机中信息以两值信号表示

['why-binary.slide.1']
src_hash = 'bc3a9112'
text = '''

Information inside a computer is carried by **two-valued signals**: two distinguishable states of a physical quantity.
- A two-valued signal need only separate two levels, so storage, transmission and regeneration stay reliable in the presence of noise
- Multi-valued signals are harder to tell apart under the same noise, and the engineering cost rises sharply
- Boolean algebra supplies a complete set of rules for two-valued signals, realizable directly in logic gates
'''
# src:
# 
# 计算机中的信息由**两值信号**承载：一个物理量的两个可区分状态。
# - 两值信号只需区分两个电平，存储、传输与再生在噪声下仍然可靠
# - 多值信号在同样的噪声条件下更难分辨，工程代价显著上升
# - 布尔代数为两值信号提供完整的运算规则，可直接由逻辑门实现


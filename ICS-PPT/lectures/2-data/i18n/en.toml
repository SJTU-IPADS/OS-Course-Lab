['nibble-packing.slide.2']
src_hash = '1c3b7177'
text = '''

- Take the low 4 bits with the mask `& 0x0f`, and the high 4 bits with the shift `>> 4`
- To write back, shift the high 4 bits into place first, then or them with the low 4
- Q4_0 pairs weight $j$ with weight $j+16$, so the two halves of a byte come from the two halves of the block
'''
# src:
# 
# - 取低 4 位用掩码 `& 0x0f`，取高 4 位用移位 `>> 4`
# - 写回时先把高 4 位左移到位，再与低 4 位按位或
# - Q4_0 配对的是第 $j$ 与第 $j+16$ 个权重，一个字节里的两半来自块的前后两段

['nibble-add.title']
src_hash = 'd2a61f52'
text = 'Arithmetic after packing: each field needs its own overflow'
# src: 打包之后的运算：每个字段需要独立的溢出

['nibble-add.slide.1']
src_hash = '2fc039a1'
text = 'Two 4-bit fields share a byte; direct addition carries from the low field across bit 3 into the high one.'
# src:
# 
# 一个字节里的两个 4 位字段各自是一个数。直接相加时，低位字段的进位会越过第 3 位加到高位字段上。

['nibble-add.slide.2']
src_hash = 'd9fe3b78'
text = '''
- `& 0x77` clears each field's top bit; the low three bits carry at most into bit 3
- `(a ^ b) & 0x88` restores those bits by xor, which does not carry
- Overflow out of the high field's bit 3 is dropped and stays in the byte
'''
# src:
# 
# - `& 0x77` 清掉每个字段的最高位，低三位相加最多进到第 3 位，进位停在字段内
# - `(a ^ b) & 0x88` 把清掉的那两位用异或补回去，异或不产生进位
# - 高位字段的第 3 位若溢出，同样被丢弃，不会越过字节边界

['nibble-add.highlight.1']
src_hash = '7985373d'
text = "The low field's carry must stay out of the high field."
# src: 低位字段的进位必须停在字段边界内，不能计入高位字段。

['nibble-add.notes.1']
src_hash = '0c1a59be'
text = '''

This page is where part three's bitwise material lands. Take `0x29 + 0x38` (fields 9+8 and 2+3): adding directly gives `0x61`, where 9+8=17 overflows the low field and carries a 1 into the high one; `add_packed` gives `0x51`, where the low field wraps to 1 and the high field is still 5. `examples/int4.c` checks both forms against all 65536 pairs of inputs: adding directly is wrong on 30720 of them, `add_packed` on none.
'''

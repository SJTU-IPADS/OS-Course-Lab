['two-readings.slide.1']
src_hash = 'a46d4275'
text = '''

Two's complement, from *Digital Electronics*, is built by inverting and adding one. The same encoding can also be written by giving the top bit the weight $-2^{w-1}$ instead of $+2^{w-1}$.
'''
# src:
# 
# 在《数字电子技术》课程中学过的补码由「取反加一」构造。以下是同一编码的另一种等价写法：把最高位的权重由 $+2^{w-1}$ 改为 $-2^{w-1}$，其余各位的权重不变。

['two-readings.slide.2']
src_hash = 'a080d9c4'
text = '''

 $$
 B2U(\vec{x}) = \sum_{i=0}^{w-1} x_i 2^i
 \qquad\qquad
 B2T(\vec{x}) = -x_{w-1} 2^{w-1} + \sum_{i=0}^{w-2} x_i 2^i
 $$
'''

['topic-cover-cont.slide.1']
src_hash = 'd99e4ba8'
text = '''
- **Core questions**:
  1. Why do current large-model systems deliberately abandon IEEE 754 single-precision floating point?
  2. In autoregressive inference of a large model, how does memory bandwidth cap the generation speed in a linear relation?
  3. How does the industrial GGUF specification (Q4_0 / Q4_1 / Q4_K) lay out quantization blocks in bytes, and how does Q4_K compress its metadata overhead with two-level quantization?
'''
# src:
# 
# - **核心问题**：
#   1. 为什么当代大模型系统要主动“抛弃”IEEE 754 单精度浮点数？
#   2. 大模型自回归推理中，内存带宽是如何以线性关系卡死生成速度的？
#   3. 工业级 GGUF 规范（Q4_0 / Q4_1 / Q4_K）如何在字节中排布量化块？Q4_K 又如何用二级量化压缩元数据开销？

['fp32-myth.title']
src_hash = '7157b11e'
text = 'The end of the high-precision assumption'
# src: 破局：高精度神话的破灭

['fp32-myth.slide.1']
src_hash = '5fc8d9a8'
text = '''
- **The historical role of IEEE 754 FP32**:
  - A 23-bit fraction gives about 7 significant decimal digits: the spacing of the significand $M$ is $2^{-23} \approx 1.2 \times 10^{-7}$.
  - **Design intent**: a unified floating-point format and rounding rules for numerical computing; computations with stricter error requirements usually use FP64.
- **The nature of parameters and representations in large models**:
  - Modern large models are typical **massively over-parameterized systems**, with parameter counts from billions to trillions.
  - **The core logic of self-attention**: the inference result depends mainly on the relative sizes of the attention distribution after Softmax normalization, and on the relative strengths of the activation channels.
  - **Experimental observation**: with a suitable quantization method, the accuracy of many large models drops only slightly after their weights are reduced to 8 or 4 bits, but quantization error still changes the logits and the generated output.
- **System-level conclusion**: keeping the high-energy, wide FP32 of traditional scientific computing in the era of large models not only wastes a great deal of compute and GPU memory, but also multiplies the number of bytes autoregressive inference must move, making the GPU-memory-bandwidth limit worse.
'''
# src:
# 
# - **IEEE 754 FP32 的历史使命**：
#   - 23 位尾数带来约 7 位有效十进制精度：尾数 $M$ 的间隔为 $2^{-23} \approx 1.2 \times 10^{-7}$。
#   - **设计初衷**：为数值计算统一浮点格式与舍入规则；误差要求更严的计算通常用 FP64。
# - **大模型的参数与表征本质**：
#   - 现代大模型是典型的**超大规模过参数化系统**，参数量从十亿级到万亿级。
#   - **自注意力机制的核心逻辑**：推理结果主要取决于 Softmax 归一化后注意力分布的相对大小，以及激活通道之间的相对强弱。
#   - **实验观察**：采用合适的量化方法，许多大模型的权重降到 8 位或 4 位后精度只小幅下降，但量化误差仍会改变 logit 与生成结果。
# - **系统结论**：在大模型时代强行沿用传统科学计算的高能耗、大位宽 FP32，不仅在算力和显存上存在极大浪费，还会成倍增加自回归推理需要搬运的字节数，加剧“显存带宽”的限制。

['fp32-myth.slide.1.footnote.1']
src_hash = 'adc62727'
text = 'Sources: Goldberg, D. *What Every Computer Scientist Should Know About Floating-Point Arithmetic* (1991); Dettmers, T. et al. *LLM.int8()*, NeurIPS (2022); Frantar, E. et al. *GPTQ*, ICLR (2023).'
# src: 文献出处：Goldberg, D. *What Every Computer Scientist Should Know About Floating-Point Arithmetic* (1991)；Dettmers, T. et al. *LLM.int8()*, NeurIPS (2022)；Frantar, E. et al. *GPTQ*, ICLR (2023).

['fp32-myth.notes.1']
src_hash = 'ed48d179'
text = '''
Long-running integration in scientific computing accumulates rounding error, which is why it needs FP32 or even FP64. Large-model inference is a different case: experiments show that with a suitable quantization method, perplexity and task accuracy drop only slightly after the weights are reduced to 8 bits (LLM.int8()) or 4 bits (GPTQ). This is an experimental result, not a general theorem: LLM.int8() found that models above 6.7B develop a few outlier features with very large values, that quantizing them directly to 8 bits reduces accuracy noticeably, and that those dimensions must be kept in 16-bit computation. Whether precision can be reduced, and to how many bits, must therefore be tested on the specific model, layer and task. If inference keeps FP32 weights, each token moves twice as many bytes as with BF16.

The 7 digits are an order-of-magnitude estimate: an FP32 value is $M \times 2^E$, as in scientific notation; the significant digits are set by the significand, and the exponent sets the position of the point. The fraction part of the significand $M = 1.xxx\ldots x_2$ has 23 bits, so adjacent values are $2^{-23} \approx 1.2 \times 10^{-7}$ apart, and the error appears around the 7th decimal digit. Counting the implicit leading 1, there are 24 significant bits, and $\log_{10} 2^{24} \approx 7.2$ gives the same conclusion. The C standard gives two bounds: `FLT_DIG` = 6 (any decimal number with 6 significant digits converted to float and back is unchanged) and `FLT_DECIMAL_DIG` = 9 (9 decimal digits suffice to distinguish any two floats).
'''
# src:
# 
# 科学计算中的长时间积分会累积舍入误差，因此需要 FP32 甚至 FP64。大模型推理的情况不同：
# 实验表明，采用合适的量化方法，权重降到 8 位（LLM.int8()）或 4 位（GPTQ）后，困惑度与
# 任务精度只小幅下降。这是实验结果，不是普遍定理：LLM.int8() 发现 6.7B 以上的模型会出现
# 少数数值很大的离群特征，直接按 8 位量化精度明显下降，需要把这些维度单独留在 16 位计算。
# 因此能否降低精度、降到多少位，要用具体的模型、层与任务检验。推理时若沿用 FP32 权重，
# 每个 token 搬运的字节数是 BF16 的两倍。
# 
# 7 位是量级估算：FP32 的值是 $M \times 2^E$，与科学计数法相同，有效数字由尾数决定，阶码决定小数点的位置。
# 尾数 $M = 1.xxx\ldots x_2$ 的小数部分有 23 位，相邻两个取值的间隔为 $2^{-23} \approx 1.2 \times 10^{-7}$，
# 误差出现在第 7 位十进制数字附近。算上隐含的首位 1，有效位是 24 位，$\log_{10} 2^{24} \approx 7.2$，结论相同。
# C 标准给出的两个界是 `FLT_DIG` = 6（任何 6 位有效数字的十进制数转换为 float 再转回，结果不变）
# 与 `FLT_DECIMAL_DIG` = 9（9 位十进制数字足以区分任意两个 float）。


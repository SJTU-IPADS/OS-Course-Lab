['clipping-tradeoff.title']
src_hash = '3645bd24'
text = 'The outlier dilemma: a zero-sum trade between dynamic range and local precision'
# src: 离群点困境：动态范围与局部精度的零和博弈

['clipping-tradeoff.slide.1']
src_hash = 'c47f69d0'
text = '''
- **The bell-shaped distribution of model weights**: the great majority of values cluster densely around 0, with a small number of extreme outliers in the two tails.
- **Strategy A: the MinMax criterion**
  - Force coverage of the largest extreme: $w_{\max} = \max|W|$.
  - **Drawback**: a single outlier spike enlarges the step $d = w_{\max}/q_{\max}$ drastically, so that the great majority of normal weights in the middle are squeezed into very few discrete buckets near 0, and **the rounding error rises sharply**.
- **Strategy B: the saturating clipping criterion**
  - Set a threshold $T < \max|W|$; data beyond $T$ are clipped to $T$.
  - **Benefit**: the step $d = T / q_{\max}$ shrinks markedly, and the grid over the core region is dense;
  - **Cost**: the tails at both ends bear the **clipping error**.
- **The central trade-off**: choose $T$ to minimize the sum of clipping error and rounding error.
'''
# src:
# 
# - **模型权重的钟形分布特征**：绝大部分数值密集聚集在 0 附近，两翼伴随少量极端离群值。
# - **策略 A：MinMax 准则**
#   - 强制覆盖最大极值：$w_{\max} = \max|W|$。
#   - **弊端**：只要有一个离群尖刺，步长 $d = w_{\max}/q_{\max}$ 就会被暴力拉大，导致处于中间的绝大多数正常权重全被挤压在 0 附近的极少数离散桶中，**舍入误差剧增**。
# - **策略 B：饱和截断准则**
#   - 设定阈值 $T < \max|W|$，超出 $T$ 的数据强行截断为 $T$。
#   - **收益**：步长 $d = T / q_{\max}$ 显著缩小，核心有效区域网格致密；
#   - **代价**：两端尾部承担**截断误差**。
# - **核心权衡**：选取 $T$，使截断误差与舍入误差之和最小。

['clipping-tradeoff.slide.1.footnote.1']
src_hash = 'c7e0d2e4'
text = 'Source: Zhao, R. et al. *Improving Neural Network Quantization without Retraining using Outlier Channel Splitting*, ICML (2019).'
# src: 文献出处：Zhao, R. et al. *Improving Neural Network Quantization without Retraining using Outlier Channel Splitting*, ICML (2019).

['clipping-tradeoff.notes.1']
src_hash = '9e4d6624'
text = 'The choice of clipping threshold is a trade-off between clipping error and rounding error. To accommodate a very few extreme outliers, the MinMax criterion enlarges the tick of the whole quantization grid, and the resolution of the core data, which make up the great majority, drops accordingly; saturating clipping clips the extreme values in the tails to $T$, in exchange for a finer grid step over the dense main interval. The smaller $T$ is, the smaller the rounding error and the larger the clipping error; the optimal $T$ minimizes their sum. Systems engineering does not insist dogmatically on absolute losslessness; it seeks to minimize the expected error over the whole distribution.'
# src:
# 
# 截断阈值的选择是截断误差与舍入误差之间的权衡。MinMax 准则为了迁就极少数极端离群点，不惜
# 拉大整个量化网格刻度，占绝大多数的核心数据分辨率随之下降；饱和截断则把尾部极值截断到 $T$，
# 换取主体密集区间内更细的网格步长。$T$ 越小，舍入误差越小、截断误差越大，最优的 $T$ 使两者
# 之和最小。系统工程从不追求教条式的绝对无损，而是追求全分布期望误差的最小化。


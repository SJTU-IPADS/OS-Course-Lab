# src: 一段中文的 UTF-8 编码

['text-and-tokens.highlight.1']
src_hash = '42e8b7eb'
text = 'A model receives a sequence of token ids; characters are already encoded before they reach the model.'
# src: 模型接收的是 token 编号序列，字符在进入模型之前已经完成编码。

['text-and-tokens.notes.1']
src_hash = 'dfbcc82c'
text = '''

The two levels of encoding are worth naming in class: character to bytes is fixed by UTF-8, text to tokens by the tokenizer's vocabulary. Both are conventions, both can be verified against a table, and neither involves the model itself.
'''

['ulp-distribution.title']
src_hash = 'c8ecf186'
text = 'Non-uniform discrete distribution on the real line and relative precision'
# src: 实数轴上的非均匀离散分布与相对精度

['ulp-distribution.slide.1']
src_hash = '56d2f957'
text = '''
- **Geometry of the distribution**:
  - The exponent $E$ fixes the base interval $[2^E, 2^{E+1})$, and the fraction field (23 bits) divides that interval into $2^{23}$ equal parts.
  - Each time a power of two is crossed, the gap between adjacent representable values doubles, and the density of the grid on the real line decays exponentially.
- **Grid spacing ULP and absolute error**:
  - The grid spacing within $[2^E, 2^{E+1})$ is $\text{ULP} = 2^{E-23}$.
  - The upper bound of the absolute error grows exponentially with the magnitude of the value.
- **Constant relative precision**:
  - The relative precision stays constant: $\frac{\text{step}}{\text{interval start}} = \frac{2^{E-23}}{2^E} = 2^{-23} \approx 1.19 \times 10^{-7}$.
  - This corresponds to about 7 significant decimal digits.
'''
# src:
# 
# - **几何分布特征**：
#   - 阶码 $E$ 确定基准区间 $[2^E, 2^{E+1})$，尾数字段（23 位）将该区间均分为 $2^{23}$ 等份。
#   - 每越过一个 2 的整次幂，相邻可表示值的间距翻倍，实数轴上的网格密度呈指数级衰减。
# - **网格间距 ULP 与绝对误差**：
#   - 区间 $[2^E, 2^{E+1})$ 内的网格间距为 $\text{ULP} = 2^{E-23}$。
#   - 绝对误差上界随数值量级的增大呈指数增长。
# - **相对精度的恒定性**：
#   - 相对精度保持恒定：$\frac{\text{步长}}{\text{区间起点}} = \frac{2^{E-23}}{2^E} = 2^{-23} \approx 1.19 \times 10^{-7}$。
#   - 对应十进制约 7 位有效数字。

['ulp-distribution.notes.1']
src_hash = '4f76257e'
text = '''
Position of this part: it follows the basic IEEE 754 encoding (sign bit $s$, exponent field $\exp$, fraction field $\text{frac}$, and the division into normalized, denormalized and special values), and examines the discreteness of floating-point numbers as implemented in hardware, the logic of rounding decisions, the behavioural pitfalls in high-level programming languages, and how modern computer architectures have evolved and extended the format for deep learning.

Teaching goal: build the geometric intuition that floating-point numbers are distributed on the real line in piecewise uniform segments whose spacing scales geometrically, and distinguish strictly between the mathematical definitions of absolute and relative precision.
'''
# src:
# 
# 章节定位：本讲承接 IEEE 754 标准的基础编码格式（符号位 $s$、阶码字段 $\exp$、尾数字段 $\text{frac}$，以及规格化、非规格化与特殊值的划分），深入探讨浮点数在硬件实现中的离散特性、舍入判决逻辑、高阶编程语言中的行为陷阱，以及现代计算体系结构面向深度学习对该格式的演化与扩展。
# 
# 核心教学目标：建立浮点数在实数轴上呈分段等比缩放分布的几何直觉，严格区分绝对精度与相对精度的数学定义。


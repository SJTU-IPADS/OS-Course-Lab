['text-and-tokens.slide.1']
src_hash = '964b3b78'
text = '''

Text needs one encoding step before it enters a program, mapping symbols to a sequence of integers.
- **Character encoding**: ASCII represents a character in 7 bits, UTF-8 a code point in 1 to 4 bytes
- **Tokenizer**: a passage is split into tokens, each corresponding to one integer id in a vocabulary
- The two have the same shape: agree on a table first, then pass integer sequences through the system
'''
# src:
# 
# **文本进入程序之前需要一次编码，这一步把符号映射为整数序列。**
# - **字符编码**：ASCII 用 7 位表示一个字符，UTF-8 用 1 到 4 个字节表示一个码点
# - **分词器（tokenizer）**：一段文本被切成若干 token，每个 token 对应词表中的一个整数编号
# - 两者的形式一致：先约定一张映射表，再以整数序列在系统中传递


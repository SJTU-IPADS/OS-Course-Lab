['denormalized.notes.1']
src_hash = '5134bf8a'
text = '''
$E$ is $1 - Bias$ rather than $0 - Bias$ so that the largest denormalized number sits right next to the smallest normalized one, with no gap.
In single precision a denormalized number has $E = -126$ and $M < 1$.
The three demo rows: sign bit 1 with everything else 0 is $-0$; with only the top bit of $frac$ set, $M = 0.5$ and the value is $2^{-127}$;
with only the lowest bit of $frac$ set, $M = 2^{-23}$ and the value is $2^{-149}$, the smallest positive number.
'''
# src:
# 
# $E$ 取 $1 - Bias$ 而非 $0 - Bias$，使最大的非规格化数与最小的规格化数相邻，中间不出现间隙。
# 单精度中非规格化数的 $E = -126$，$M < 1$。
# demo 的三行：符号位为 1、其余全 0 是 $-0$；$frac$ 最高位为 1 时 $M = 0.5$，值为 $2^{-127}$；

The three steps are the later formula: divide by the scale, round and clip, multiply the scale back and add the offset. The offset is 0 here, so there is no extra add. The error 0.03 is under half a tick (0.07), which is what rounding does. If the group contains one very large value, it widens every tick and the other numbers pile into a few of them, so the error grows. That is the outlier page later; leave it for then.
'''

['unsigned-bugs.highlight.1']
src_hash = '3a8ea7b6'
text = 'Unsigned subtraction wraps modulo $2^w$ instead of going negative.'
# src: 无符号数的减法在结果为负时回绕到模 $2^w$ 的正数。

['unsigned-bugs.notes.1']
src_hash = 'ffae815c'
text = '''

Leave time for students to find it. Most first check whether `i <= length - 1` is off by one, when the trouble is the expression `length - 1` itself: it is unsigned subtraction, and 0 minus 1 does not produce a negative number. There are two fixes: make `length` signed, or write the loop condition as `i < length`. The second is better because it performs no subtraction at all. Declaring `length` as `unsigned` is reasonable in itself and consistent with interfaces like `sizeof`; the trouble comes from subtracting with it. `strlen` returns `size_t`, and a negative difference wraps to an enormous unsigned value.
'''
# src:
# 
# 留一段时间让学生自己找。多数人会先检查 `i <= length - 1` 的边界是否差一，
# 而问题在于 `length - 1` 这个表达式本身：它是无符号减法，0 减 1 不产生负数。
# 改法有两种：把 `length` 改成有符号，或者把循环条件写成 `i < length`。后者更好，
# 因为它连减法都不做。`length` 用 `unsigned` 本身是合理的，与 `sizeof` 一类的接口一致；
# 出问题的是拿它去做减法。`strlen` 返回 `size_t`，差值为负时回绕成一个极大的无符号数。


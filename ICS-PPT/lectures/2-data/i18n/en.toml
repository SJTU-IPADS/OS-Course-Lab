['quantization-cost.title']
src_hash = 'd845d151'
text = 'The cost and the limits of quantization'
# src: 量化的代价与边界

['quantization-cost.slide.1']
src_hash = '1fb60034'
text = '''

- The error grows as the range within a group widens, and a few outliers raise the scale of the whole group
- The finer the grouping, the more space the scales take and the higher the average bit count
- Weights go to 4 bits, while activations and attention's intermediate results need more precision
- Dequantization itself costs computation; the gain comes from the drop in memory traffic
'''
# src:
# 
# - 误差随组内取值范围的扩大而增大，少数异常值会抬高整组的缩放系数
# - 分组越细，缩放系数占用的空间越多，平均位数随之上升
# - 权重可以量化到 4 位，激活值与注意力的中间结果通常需要更高精度
# - 反量化本身消耗计算，收益来自访存量的下降


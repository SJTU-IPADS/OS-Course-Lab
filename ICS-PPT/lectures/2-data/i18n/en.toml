- Each of the 8 sub-blocks has its own step and offset, 16 coefficients in all, which preserves how closely Q4_1 fits
- Each of those 16 coefficients is quantized to 6 bits, occupying 12 bytes in total
- Reconstruction computes $\hat{w} = d \cdot sc \cdot q - d_{min} \cdot m$, where $sc$ and $m$ are that sub-block's two 6-bit coefficients
'''

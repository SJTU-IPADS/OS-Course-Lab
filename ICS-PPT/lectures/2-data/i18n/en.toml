['patriot.title']
src_hash = 'd24378fc'
text = 'A systems-engineering case: accumulated clock truncation in the Patriot air-defence system'
# src: 系统工程案例：爱国者防空系统时钟截断累积事故

['patriot.slide.1']
src_hash = '13e2196f'
text = '''
- **Background**: in February 1991, during the Gulf War, the Patriot air-defence system deployed by the US Army at Dhahran failed to intercept an incoming Scud missile, and 28 soldiers were killed.
- **Source of the error: binary truncation of the clock base**:
  - The system computed its running time from an integer counter incremented every 0.1 s, converting the count to floating-point seconds by multiplying it by 0.1.
  - $0.1_{10}$ expands to an infinitely repeating binary fraction and was truncated when stored in a 24-bit fixed-point register; the truncation error per clock step is $\Delta t \approx 9.54 \times 10^{-8}\text{ s}$.
- **Derivation of the drift under continuous integration over time**:
  - The system ran continuously for 100 hours without a restart:
  - Total count of pulses: $N = 100 \times 3600 \times 10 = 3,600,000$.
  - Absolute time drift: $\Delta T = 3.6 \times 10^6 \times 9.54 \times 10^{-8}\text{ s} \approx \mathbf{0.3433\text{ s}}$.
'''
# src:
# 
# - **事故背景**：1991 年 2 月海湾战争期间，美军部署于宰赫兰的爱国者防空系统未能拦截来袭的飞毛腿导弹，造成 28 名士兵丧生。
# - **误差根源：时钟基准的二进制截断**：
#   - 系统内部依靠每 0.1 秒递增一次的整型计数器计算运行时间，将计数乘以 0.1 转换为浮点秒数。
#   - $0.1_{10}$ 展开为二进制无限循环小数，存入 24 位定点寄存器时发生截断，单步时钟截断误差 $\Delta t \approx 9.54 \times 10^{-8}\text{ s}$。
# - **连续时间积分下的宏观漂移推导**：
#   - 系统连续无重启运行 100 小时：
#   - 计数器累加脉冲总数：$N = 100 \times 3600 \times 10 = 3,600,000$ 次。
#   - 绝对时间漂移量：$\Delta T = 3.6 \times 10^6 \times 9.54 \times 10^{-8}\text{ s} \approx \mathbf{0.3433\text{ 秒}}$。

['patriot.notes.1']
src_hash = 'fe9ae86f'
text = 'Teaching goal: through a real engineering accident, derive rigorously how a tiny per-step floating-point truncation error, coupled with integration over time and physical speed, causes a fatal systematic failure.'
# src:
# 
# 核心教学目标：通过真实工程事故，严密推导微小的单步浮点截断误差如何在时间积分与物理速度耦合下造成致命的系统性失效。

['patriot-cont.title']
src_hash = 'd24378fc'
text = 'A systems-engineering case: accumulated clock truncation in the Patriot air-defence system'
# src: 系统工程案例：爱国者防空系统时钟截断累积事故

['patriot-cont.slide.1']
src_hash = '550cb1f2'
text = '''
- **How target tracking failed**:
  - The terminal speed of a Scud missile reaches $v \approx 2000\text{ m/s}$.
  - Drift of the predicted position: $\Delta S = v \times \Delta T \approx 2000 \times 0.3433 \approx \mathbf{687\text{ m}}$.
  - The target fell outside the radar's range-tracking window; the radar judged the target to be a false detection and did not guide a launch.
- **The systems-engineering lesson**:
  - Before the accident, the development team had modified the high-precision time-conversion routine in some subroutines but had not updated every calling module, so the residual errors of the modules at mixed precision could no longer cancel each other out.
'''
# src:
# 
# - **目标跟踪测距失效机制**：
#   - 飞毛腿导弹末端飞行速度达 $v \approx 2000\text{ m/s}$。
#   - 空间位置预测漂移：$\Delta S = v \times \Delta T \approx 2000 \times 0.3433 \approx \mathbf{687\text{ 米}}$。
#   - 目标落入雷达测距跟踪窗口之外，雷达判定目标虚标并不予引导发射。
# - **系统工程教训**：
#   - 研发团队在事故前修改了部分子程序的高精度时间转换例程，但未同步更新所有调用模块，导致混合精度模块间残差无法相互抵消。


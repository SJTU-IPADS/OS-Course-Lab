['quantization-methods.title']
src_hash = 'b2a70d7a'
text = 'Extension: linear quantization and what lies beyond it'
# src: 拓展：线性量化以及它之外的做法

['quantization-methods.slide.1']
src_hash = '5a639673'
text = '''

The Q4_0 of this section is the most basic form: the levels are evenly spaced over the range and one group shares a single scale, which is called <mark>linear quantization</mark>. The methods used in practice are more elaborate in four directions.
'''
# src:
# 
# 本节给出的 Q4_0 是最基本的一种：级在取值区间上等距排列，一组权重共用一个缩放系数，这称为<mark>线性量化</mark>。实际使用的方法在四个方向上更复杂。

['quantization-methods.slide.2']
src_hash = 'c39b0bb9'
text = '''

- **Zero point**: Q4_0's levels are symmetric about 0, while Q4_1 stores a minimum as well, so the levels can shift toward the interval the weights actually occupy
- **Grouping**: Q4_K divides every 256 weights into 8 sub-blocks, each with its own scale and minimum, and these coefficients are themselves quantized
- **Calibration**: GPTQ chooses levels by a layer-wise second-order error, and AWQ first scales by activation importance and then quantizes
- **Non-uniform**: NF4 takes its levels at the quantiles of a normal distribution, unevenly spaced, for weights that are close to normal
'''
# src:
# 
# - **零点**：Q4_0 的级关于 0 对称，Q4_1 另存一个最小值，级可以偏向权重实际的分布区间
# - **分组**：Q4_K 每 256 个权重再分 8 个子块，子块各有缩放与最小值，这些系数本身也被量化
# - **校准**：GPTQ 按逐层的二阶误差选级，AWQ 先按激活的重要性缩放再量化
# - **非均匀**：NF4 按正态分布的分位点取级，级不等距，用于权重接近正态的情形

['quantization-methods.highlight.1']
src_hash = '82a989db'
text = 'Linear quantization divides the range evenly with a single scale; the other methods each relax this rule.'
# src: 线性量化只用一个缩放系数把区间等分，其余方法都在放宽这一条。

['quantization-methods.notes.1']
src_hash = 'd42fbe77'
text = '''

The Q4_K_M measured on the previous page is a product of the grouping direction: on top of Q4_K, it raises the tensors where quantization error matters most to 6 bits. NF4 comes from QLoRA and takes its levels at the quantiles of the standard normal, giving a smaller error on weight blocks that have already been normalized. AWQ and GPTQ both need a small batch of calibration data and are forms of post-training quantization; quantization-aware training is a separate route whose cost is retraining, and this section does not cover it.
'''
# src:
# 
# 上一页实测到的 Q4_K_M 正是「分组」这一条的产物：它在 Q4_K 的基础上，
# 把量化误差影响最大的那些张量整体提到 6 位。
# NF4 出自 QLoRA，级取自标准正态的分位点，对已经归一化过的权重块误差更小。
# AWQ 与 GPTQ 都需要一小批校准数据，属于训练后量化；量化感知训练是另一条路线，
# 代价是要重新训练，本节不展开。


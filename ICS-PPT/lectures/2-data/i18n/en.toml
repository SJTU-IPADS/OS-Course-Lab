['zero-point-cost.title']
src_hash = 'b2fd64e4'
text = 'The cross-term penalty caused by the offset $m$'
# src: 偏移 $m$ 引发的交叉项惩罚

['zero-point-cost.slide.1']
src_hash = '7c68060c'
text = '''
- **From the dequantization formula**: $\hat{w} = d\,q + m$. Symmetric quantization sets $m = 0$, and the formula reduces to $\hat{w} = d\,q$.
- **Each output element of the matrix product $Y = XW$ is a dot product**: a row of $X$ and a column of $W$ are multiplied element by element and summed, $y = \sum_{k=1}^{K} x_k w_k$, where $K$ is the vector length.
- **Activations and weights are quantized separately**, each with its own step and offset:
  - Activations: $x_k \approx d_x\,a_k + m_x$; the integer codes $a_k$ change with every input.
  - Weights: $w_k \approx d_w\,b_k + m_w$; the integer codes $b_k$ are fixed once the model has been quantized offline.
- **Substitute into the dot product and expand by the distributive law**:
 $$y \approx \sum_{k=1}^{K} (d_x a_k + m_x)(d_w b_k + m_w) = \underbrace{d_x d_w \sum a_k b_k}_{\text{①}} + \underbrace{d_x m_w \sum a_k}_{\text{②}} + \underbrace{m_x d_w \sum b_k}_{\text{③}} + \underbrace{K m_x m_w}_{\text{④}}$$
- ② and ③ are the offset of one side times the step of the other side and the sum of its integer codes; they are called **cross terms**.
'''
# src:
# 
# - **由反量化公式**：$\hat{w} = d\,q + m$。对称量化令 $m = 0$，公式退化为 $\hat{w} = d\,q$。
# - **矩阵乘法 $Y = XW$ 的每个输出元素是一个点积**：$X$ 的一行与 $W$ 的一列逐项相乘再求和，$y = \sum_{k=1}^{K} x_k w_k$，其中 $K$ 是向量长度。
# - **激活与权重各自量化**，各有一组步长与偏移：
#   - 激活：$x_k \approx d_x\,a_k + m_x$，整数码 $a_k$ 随每次输入变化。
#   - 权重：$w_k \approx d_w\,b_k + m_w$，整数码 $b_k$ 在模型离线量化之后固定不变。
# - **代入点积，按乘法分配律展开**：
#  $$y \approx \sum_{k=1}^{K} (d_x a_k + m_x)(d_w b_k + m_w) = \underbrace{d_x d_w \sum a_k b_k}_{\text{①}} + \underbrace{d_x m_w \sum a_k}_{\text{②}} + \underbrace{m_x d_w \sum b_k}_{\text{③}} + \underbrace{K m_x m_w}_{\text{④}}$$
# - ② 与 ③ 由一侧的偏移乘以另一侧的步长与整数码之和得到，称为**交叉项**。

['zero-point-cost.notes.1']
src_hash = 'd6550893'
text = 'The dequantization formula on the page "Formalization: uniform affine quantization" applies to both activations and weights. Each output element of a matrix product is a dot product; substituting the two dequantization formulas into the dot product and expanding by the distributive law gives four terms: ① is the dot product of the integer codes times the two steps; ② and ③ each contain one offset and are the cross terms; ④ is a constant. Under symmetric quantization both offsets are 0, and the last three terms all vanish.'
# src:
# 
# 「形式化：均匀仿射量化映射」一页的反量化公式同时用于激活和权重。矩阵乘法的每个输出元素都是一个点积，把两个反量化
# 公式代入点积，再用乘法分配律展开，得到四项：① 是整数码的点积乘以两个步长；② 和 ③ 各含一个偏移，
# 是交叉项；④ 是常数。对称量化时两个偏移都是 0，后三项全部消失。

['zero-point-compute.title']
src_hash = 'f9c5e28d'
text = 'The extra computation caused by the offset $m$'
# src: 偏移 $m$ 带来的额外计算量

['zero-point-compute.slide.1']
src_hash = 'aa37fbde'
text = '''
- **When each term of the expansion is computed**:
  - ① $d_x d_w \sum a_k b_k$: $K$ 8-bit integer multiply-adds, needed by symmetric quantization as well.
  - ② $d_x m_w \sum a_k$: $a_k$ changes with the input, so $\sum a_k$ is computed at inference time, $K$ extra additions.
  -   - ③ $m_x d_w \sum b_k$ and ④ $K m_x m_w$: $d_w$ and $\sum b_k$ involve only the weights, and $m_x$ and $m_w$ are usually fixed before inference; both terms can then be computed offline and added as constants at inference time.
'''
# src:
# 
# - **展开式中各项的计算时机**：
#   - ① $d_x d_w \sum a_k b_k$：$K$ 次 8 位整数乘加，对称量化同样需要。
#   - ② $d_x m_w \sum a_k$：$a_k$ 随输入变化，推理时现算 $\sum a_k$，多 $K$ 次加法。
#   -   - ③ $m_x d_w \sum b_k$ 与 ④ $K m_x m_w$：$d_w$ 与 $\sum b_k$ 只含权重，通常情况下 $m_x$ 与 $m_w$ 在推理前确定，此时两项都可以离线算好，推理时作为常数加上。


['truncation-and-endianness.slide.2']
src_hash = 'cb5604da'
text = '''
- On little-endian the first two bytes are the truncated value; on big-endian, the high half
- So `*(short *) &x` equals `(short) x` on little-endian but not on big-endian
'''
# src:
# 
# - 小端下低有效字节在低地址，起始处两个字节正好是截断的结果；大端下得到的是高半部分

['granularity-spectrum.title']
src_hash = '314dcef7'
text = 'Quantization granularity: the spectrum of trade-offs between compression and precision'
# src: 量化粒度：压缩率与精度的光谱权衡

['granularity-spectrum.slide.1']
src_hash = '20898218'
text = '''
- **The granularity spectrum**:
  - **Per-tensor granularity**: tens of millions of parameters in the whole matrix share 1 scale factor. The metadata are minimal, but an isolated outlier distorts the dynamic range of the whole tensor.
  - **Per-channel granularity**: each row of the matrix is assigned its own scale factor ($M$ scale factors for $M$ rows).
  - **Group quantization**: consecutive weights are cut into small blocks of fixed size (group size $G$), each block with its own parameters.
- **Formula for the metadata overhead amortized per weight**:
  $$\text{metadata bits/weight} = \frac{\text{metadata bits per group}}{\text{group size } G}$$
  - [Example] An FP16 scale factor (16 bits) amortized over 32 weights: $16 \div 32 = \mathbf{0.5\text{ bits/weight}}$.
'''
# src:
# 
# - **粒度谱系定义**：
#   - **整张量粒度**：全矩阵数千万参数共用 1 个缩放系数。元数据极小，但若出现孤立异常值将导致全张量动态范围失真。
#   - **按通道粒度**：矩阵每一行独立分配 1 个缩放系数（$M$ 行共 $M$ 个缩放系数）。
#   - **分组量化**：将连续权重切分为若干固定大小小块（分组规模 $G$），各块独享参数。
# - **分摊至单权重的元数据开销公式**：
#   $$\text{元数据位数/权重} = \frac{\text{每组元数据位数}}{\text{分组规模 } G}$$
#   - [例] FP16 缩放系数（16 位）分摊至 32 个权重：$16 \div 32 = \mathbf{0.5\text{ 位/权重}}$。

['granularity-spectrum.slide.1.footnote.1']

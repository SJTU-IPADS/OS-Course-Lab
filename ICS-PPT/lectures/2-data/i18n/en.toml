['bandwidth-ledger-cont.slide.1']
src_hash = '0b69f40f'
text = '''
- **The hardware constraint**:
  - In single-request inference, each weight moved from memory into the chip takes part in only 1 multiply-add, so the arithmetic intensity is very low (BF16 weights: $2\text{ FLOP} \div 2\text{ Byte}$, about $1\text{ FLOP/Byte}$).
  - **Compared with the RTX 5090**: BF16 tensor peak compute 209.5 TFLOPS ÷ memory bandwidth 1792 GB/s ≈ 117 FLOP/Byte; only at that arithmetic intensity are the compute units fully loaded. Single-request inference has 1/117 of that intensity, and the upper limit on compute-unit utilization is below 1%.
  - **The generation-throughput limit of a model is roughly inversely proportional to the physical width of its weights**
'''

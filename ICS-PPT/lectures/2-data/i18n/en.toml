['machine-model.notes.1']
src_hash = '004d3d7e'
text = '''
This follows the previous page: the weight file sits on disk, the OS pages it into memory on demand, and the CPU never reads the disk itself.
Each cell is one bit; eight bits in a row are one addressed byte.
Two points to stress: every byte has a unique address; what lives at that address is not a “number” or a “word”, but eight 0s and 1s.
Bit vectors, hexadecimal, and data types later in the lecture are all readings of those 0s and 1s.
'''

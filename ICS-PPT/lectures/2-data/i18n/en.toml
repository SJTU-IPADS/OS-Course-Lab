['quant-overview.slide.2']
src_hash = '65c94bf8'
text = '''
- **Benefit**: going from BF16 to 4 bits cuts the weight data to about 1/4, and the bandwidth-bound limit on generation speed rises accordingly; when activations are quantized as well, multiply-adds can be done by integer units with lower energy and area.
- **Cost**: the mapped-back values are approximations and differ from the original floating-point numbers.
'''
# src:
# 
# - **收益**：BF16 → 4 位时权重数据量约为 1/4，带宽受限的生成速度上限随之提高；激活也量化时，乘加可以由能耗与面积更小的整数运算单元完成。
# - **代价**：映射回的值是近似值，与原来的浮点数之间有误差。

['quant-overview.notes.1']
src_hash = '0c2d786f'
text = '''
What quantization does is map floating-point numbers to integers. The model file stores the mapped 8-bit or 4-bit integers, and at inference these integers are mapped back to approximations of the floating-point numbers, which take part in the computation.

In the example the 4 weights are mapped with one common ratio to −7 to 7: 0.97, the largest in absolute value, corresponds to 7, and the others are converted with the same ratio and rounded to the nearest integer, so −0.53 corresponds to −4. Mapping −4 back gives −0.554, which differs from the original by 0.024; −0.08 maps back to −0.139, a difference of about 0.059. These differences are the error introduced by quantization.

The fewer bits the integers have, the fewer integers they can represent, the smaller the data, and the larger the error.
'''
# src:
# 
# 量化做的事情是把浮点数映射为整数。模型文件里存的是映射后的 8 位或 4 位整数，
# 推理时再把这些整数映射回浮点数的近似值，参与计算。
# 
# 示例中 4 个权重按同一比例映射到 −7 到 7：绝对值最大的 0.97 对应 7，其余的数按同一比例换算后
# 取最近的整数，−0.53 对应 −4。把 −4 映射回浮点数得到 −0.554，与原值相差 0.024；
# −0.08 映射回 −0.139，相差约 0.059。这些差值就是量化带来的误差。
# 
# 整数的位数越少，能表示的整数个数越少，数据量越小，误差也越大。


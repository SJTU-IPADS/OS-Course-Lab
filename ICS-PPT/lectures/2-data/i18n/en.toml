['memory-wall-cont.image.1.alt']
src_hash = '106aecc7'
text = 'On the RTX 5090 Roofline, the operating point of single-request generation moves from 1 FLOP/Byte at BF16 through 2 at 8 bits to 4 at 4 bits, still in the memory-bound region left of the balance point 117'
# src: RTX 5090 的 Roofline 上，单请求生成的工作点从 BF16 的 1 FLOP/Byte 经 8 位的 2 移到 4 位的 4，仍在平衡点 117 左侧的访存受限区

['memory-wall-cont.notes.1']
src_hash = '2c4dfe2e'
text = '''
Arithmetic intensity determines only the position of the operating point on the Roofline, that is, the upper limit of performance; how much is actually achieved also depends on the kernel implementation and must be measured. The latencies on the previous page were measured by the paper on an Intel Xeon Gold 6242 CPU; here the RTX 5090 Roofline is used to show the difference between the two kinds of workload, and the two are not the same machine.

117 ~ 266 is taken from Figure 3(c) of the paper: the arithmetic intensity of BERT-Base and BERT-Large at sequence lengths 128 to 4096. The minimum 117 is BERT-Base at 4096, and the maximum 266 is BERT-Large at 512.
'''
# src:
# 
# 算术强度只决定工作点在 Roofline 上的位置，也就是性能的上限；实际能达到多少，还取决于内核的
# 实现，要靠实测。上一页的时延是论文在 Intel Xeon Gold 6242 CPU 上测得的，这里借 RTX 5090 的
# Roofline 说明两类负载的区别，两者不是同一台机器。
# 
# 117 ~ 266 取自论文图 3(c)：BERT-Base 与 BERT-Large 在序列长度 128 至 4096 上的算术强度，
# 最小值 117 是 BERT-Base 在 4096 上的值，最大值 266 是 BERT-Large 在 512 上的值。


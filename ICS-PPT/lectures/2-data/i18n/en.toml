In a decimal fraction $d_m \cdots d_1 d_0 . d_{-1} \cdots d_{-n}$, digit $i$ has weight $10^{i}$.
Scientific notation writes it as $d.dd\ldots \times 10^{k}$, e.g. $12.375 = 1.2375 \times 10^{1}$.
Binary fractions follow the same rule with weight $2^{i}$: $12.375 = 1100.011_2 = 1.100011_2 \times 2^{3}$.

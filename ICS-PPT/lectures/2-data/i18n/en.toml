# 看作一段已知长度的字节，`show_bytes` 只是把这一视角显式写出来。

['endianness-visible.title']
src_hash = 'ad8b620f'
text = 'Where byte order becomes visible'
# src: 字节序在什么场合可见

['endianness-visible.slide.1']
src_hash = '4f0390e9'
text = '''

- **File formats**: GGUF, ELF and PNG each fix a byte order, which is what makes cross-machine reads determinate
- **Network transmission**: TCP/IP headers are big-endian, and `htons` / `htonl` convert between host order and network order
- **Casts**: reinterpreting the same bytes as another type exposes the layout
- **Disassembly**: immediates and addresses in instruction encodings are stored little-endian
'''
# src:
# 
# - **文件格式**：GGUF、ELF、PNG 各自规定字节序，跨机器读取才有确定结果
# - **网络传输**：TCP/IP 首部采用大端，`htons` / `htonl` 完成本机序与网络序的转换
# - **强制类型转换**：以另一种类型解释同一段字节时，排列方式随之暴露
# - **反汇编输出**：指令编码中的立即数与地址按小端存放

['endianness-visible.aside.1']
src_hash = '84d9b16e'
text = 'Single-byte sequences are unaffected: ASCII strings and UTF-8 text have the same byte order on every platform.'
# src: 单字节序列不受影响：ASCII 字符串与 UTF-8 文本在任何平台上的字节次序都一致。

['endianness-in-linux.title']
src_hash = '81d1d686'
text = 'Aside: how Linux handles byte order'
# src: 拓展：Linux 中字节序的处理方式

['endianness-in-linux.slide.1']
src_hash = 'e3c28ec2'
text = '''

The handling is confined to the point where data crosses a machine boundary: convert to host order on input, and back to the agreed order on output.
- **Application level**: `le32toh` / `htole32` / `be32toh` / `htobe32` from `<endian.h>`
- **Kernel**: fields are declared `__le32` / `__be32` and must be read through `le32_to_cpu()`; sparse reports the omissions
- **Compile time**: `__BYTE_ORDER__` is defined by the compiler, so the choice between the two implementations is made during preprocessing
'''
# src:
# 
# **处理的位置固定在数据跨越机器边界处：读入时转换为本机序，写出时转换回约定的次序。**
# - **应用层**：`<endian.h>` 的 `le32toh` / `htole32` / `be32toh` / `htobe32`
# - **内核**：字段声明为 `__le32` / `__be32`，取值须经 `le32_to_cpu()`，遗漏由 sparse 报出
# - **编译期**：`__BYTE_ORDER__` 由编译器定义，两种实现的选择在预处理阶段完成

['endianness-in-linux.demo.1.name']
src_hash = '061ba34e'
text = 'Host order, and what each direction of conversion yields'
# src: 本机序，以及两个方向的转换各自得到什么

['endianness-in-linux.notes.1']
src_hash = 'b9562003'
text = '''

`__le32` is just a `__u32` carrying a `__bitwise` annotation; the compiler itself draws no distinction, and the checking is done by sparse (`make C=1`). The network-order `htons` / `htonl` in `<arpa/inet.h>` are another set of names for the same conversions. On a little-endian machine `htole32` is the identity and its output matches the `host` line, while `htobe32` reverses the four bytes.
'''
# src:
# 
# `__le32` 只是加了 `__bitwise` 注记的 `__u32`，编译器本身不区分，检查由 sparse 完成
# （`make C=1`）。网络序的 `htons` / `htonl` 在 `<arpa/inet.h>` 中，是同一组转换的另一套名字。
# 在小端机器上 `htole32` 是恒等变换，输出与 `host` 一行相同；`htobe32` 把四个字节倒过来。

['endianness-conversion-cost.title']
src_hash = '68a216be'
text = 'Aside: what a byte-order conversion compiles to'
# src: 拓展：字节序转换的编译结果

['endianness-conversion-cost.slide.1']
src_hash = '88a212db'
text = '''

The two directions are written as functions of the same shape, and compile to different instructions on x86-64 (little-endian).
'''
# src:
# 
# 两个方向的转换写成同样形式的函数，编译到 x86-64（小端）后的指令并不相同。

['endianness-conversion-cost.demo.1.name']
src_hash = 'bcad693f'
text = 'What each of the two conversion functions compiles to'
# src: 两个转换函数各自编译成什么

['endianness-conversion-cost.highlight.1']
src_hash = '857542a2'
text = 'A conversion matching host order emits no instructions at all.'
# src: 转换与本机序一致时不产生任何指令，因此可以无条件地写上它。

['endianness-conversion-cost.notes.1']
src_hash = 'eab5fd27'
text = '''

On a little-endian machine `htole32` is the identity and the function body is left with nothing but the return; the opposite `htobe32` compiles to a single `bswap`. The cost is fixed and tiny, which is why the kernel's rule is to convert everywhere and never to reason that "this machine is little-endian so it can be skipped" — omissions of that kind are exactly why code stops working on another platform.
'''
# src:
# 
# `htole32` 在小端机器上是恒等变换，函数体里只剩返回；反向的 `htobe32` 编译成一条 `bswap`。
# 代价固定且极小，因此内核的规则是一律转换，不做「本机就是小端所以可以省略」的判断——
# 这类省略正是代码换一个平台就失效的原因。

['text-and-tokens.title']
src_hash = '0b809a24'
text = 'Character encodings and token ids'

['kernel-bug.notes.1']
src_hash = '5db925dd'
text = '''

This code is modelled on a defect that appeared in FreeBSD's getpeername implementation. `maxlen` comes from the caller, and the return value is the number of bytes actually copied. Worth pointing out in class: this class of error produces no diagnostic at compile time and does not necessarily crash at run time, surfacing only on particular inputs. When reviewing generated code, mixing signed and unsigned is one of the first things to check.
'''

text = '''
**Numeric form $V = (-1)^{s} \times M \times 2^{E}$, encoded in three fields $s$, $exp$ and $frac$:**
- The sign bit $s$ determines whether the number is negative or positive
- The $exp$ field encodes the exponent $E$, which weights the value by a power of two
- The $frac$ field encodes the significand $M$, normally a fraction in the interval $[1.0, 2.0)$
'''

['hexadecimal.notes.1']
src_hash = '950d4f4a'
text = '''

The octal leading zero is a genuine source of defects: writing file permissions as `0644` is correct, but writing a decimal constant as `010` by mistake turns it into 8. C2y adds an `0o` prefix, supported as an extension by gcc 15 and invalid in C23 and earlier. C23 also allows `'` as a digit separator, as in `0b1111'1111`. On the output side only `%x` and `%o` exist; there is no conversion specifier for binary.
'''
# src:
# 
# 八进制的前导零是一类真实的缺陷来源：文件权限写 `0644` 是对的，把某个十进制常量
# 误写成 `010` 就会变成 8。C2y 增加了 `0o` 前缀，gcc 15 已作为扩展支持，C23 及以前无效。
# C23 还允许用 `'` 分组数字，如 `0b1111'1111`。输出侧只有 `%x` 与 `%o`，没有二进制的转换说明符。


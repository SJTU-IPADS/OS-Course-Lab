['shifts.title']
src_hash = 'ab09f814'
text = 'Shift operations'
# src: 移位运算

['shifts.slide.1']
src_hash = '42aa7024'
text = '''
- **Left shift** `x << k`: every bit moves left by $k$ places, zeros fill in on the right, and bits shifted off the top are discarded
- **Logical right shift** `x >> k`: zeros fill in on the left; used for unsigned numbers
- **Arithmetic right shift** `x >> k`: the sign bit fills in on the left; used for signed numbers, so that a negative number stays negative after the shift
- The C standard leaves the behaviour undefined once the shift count reaches or exceeds the word size
- Without overflow, `x << k` equals $x \times 2^k$ and `x >> k` equals $\lfloor x / 2^k \rfloor$; shifts are faster than multiplication and division, and are normally used wherever they apply
'''
# src:
# 
# - **左移** `x << k`：各位左移 $k$ 位，右侧补 0，高位移出后丢弃
# - **逻辑右移** `x >> k`：左侧补 0，用于无符号数
# - **算术右移** `x >> k`：左侧补符号位，用于有符号数，使负数右移后仍为负数
# - 移位位数达到或超过字长时，C 标准未定义其行为
# - 不溢出时，`x << k` 等于 $x \times 2^k$，`x >> k` 等于 $\lfloor x / 2^k \rfloor$；移位比乘除法快，能用移位表示时通常使用移位

['shifts.notes.1']
src_hash = 'b14dc7e9'
text = '''
Right shift rounds down, while C integer division rounds toward zero; the two give different results on negative numbers: `-7 >> 1` is −4 and `-7 / 2` is −3.
When a compiler turns `x / 2^k` into a shift, it first adds a bias of $2^k - 1$ to negative values so the result matches division.
'''
# src:
# 
# 右移对应向下取整，C 的整数除法向零取整，两者在负数上结果不同：`-7 >> 1` 为 −4，`-7 / 2` 为 −3。
# 编译器把 `x / 2^k` 换成移位时，会先给负数加上 $2^k - 1$ 的偏置，使结果与除法一致。


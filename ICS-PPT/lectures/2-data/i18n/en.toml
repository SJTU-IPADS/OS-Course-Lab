['casting.slide.1']
src_hash = '363978d0'
text = '''

C allows a variable of one type to be read as another, in two ways.
- **Explicit**: writing `(unsigned short) x`
- **Implicit**: assignment, argument passing and promotion in an expression
- Signed to unsigned ==changes no bit==; only the interpretation changes
'''

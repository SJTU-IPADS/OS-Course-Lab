['show-bytes.slide.1']
src_hash = '62336340'
text = '''
- The four bytes of `12345` are `39 30 00 00`: the least significant byte is at the lowest address, that is, little-endian
- The same value as a `float` is `00 e4 40 46`, a bit pattern entirely unlike the integer's
- A pointer is itself an 8-byte object and can be examined byte by byte in the same way
'''
# src:
# 
# - `12345` 的四个字节为 `39 30 00 00`，最低有效字节在最低地址，即小端
# - 同一数值的 `float` 表示为 `00 e4 40 46`，与整数的位模式完全不同
# - 指针本身也是一个 8 字节的对象，同样可以逐字节观察

['show-bytes.notes.1']
src_hash = '2be781db'
text = '''

Casting an address to `unsigned char *` is the standard way of stepping around the type system: a machine-level program already regards an object as a run of bytes of known length, and `show_bytes` only makes that view explicit.
'''
# src:
# 
# 把地址转换为 `unsigned char *` 是绕过类型系统的标准做法：机器级程序本来就把对象
# 看作一段已知长度的字节，`show_bytes` 只是把这一视角显式写出来。

['endianness-visible.title']
src_hash = 'ad8b620f'
text = 'Where byte order becomes visible'
# src: 字节序在什么场合可见

['endianness-visible.slide.1']
src_hash = '4f0390e9'
text = '''
- **File formats**: GGUF, ELF and PNG each fix a byte order, which is what makes cross-machine reads determinate
- **Network transmission**: TCP/IP headers are big-endian, and `htons` / `htonl` convert between host order and network order
- **Casts**: reinterpreting the same bytes as another type exposes their arrangement
- **Disassembly**: immediates and addresses in instruction encodings are stored little-endian
'''
# src:
# 
# - **文件格式**：GGUF、ELF、PNG 各自规定字节序，跨机器读取才有确定结果
# - **网络传输**：TCP/IP 首部采用大端，`htons` / `htonl` 完成本机序与网络序的转换
# - **强制类型转换**：以另一种类型解释同一段字节时，排列方式随之暴露
# - **反汇编输出**：指令编码中的立即数与地址按小端存放

['endianness-visible.aside.1']
src_hash = '84d9b16e'
text = 'Single-byte sequences are unaffected: ASCII strings and UTF-8 text have the same byte order on every platform.'
# src: 单字节序列不受影响：ASCII 字符串与 UTF-8 文本在任何平台上的字节次序都一致。

['text-and-tokens.title']
src_hash = '0b809a24'
text = 'Character encodings and token ids'
# src: 字符编码与 token 编号

['text-and-tokens.slide.1']
src_hash = '964b3b78'
text = '''

Text needs one encoding step before it enters a program, mapping symbols to a sequence of integers.
- **Character encoding**: ASCII represents a character in 7 bits, UTF-8 a code point in 1 to 4 bytes
- **Tokenizer**: a passage is split into tokens, each corresponding to one integer id in a vocabulary
- The two have the same shape: agree on a table first, then pass integer sequences through the system
'''
# src:
# 
# **文本进入程序之前需要一次编码，这一步把符号映射为整数序列。**
# - **字符编码**：ASCII 用 7 位表示一个字符，UTF-8 用 1 到 4 个字节表示一个码点
# - **分词器（tokenizer）**：一段文本被切成若干 token，每个 token 对应词表中的一个整数编号
# - 两者的形式一致：先约定一张映射表，再以整数序列在系统中传递

['text-and-tokens.demo.1.name']

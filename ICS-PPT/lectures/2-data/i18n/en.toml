This is a good page to have students work two examples. Take $2.5$ first ($10.1_2$, $E=1$, $e=128$, $f = 0100\ldots$), then $0.375$ ($0.011_2$, $E=-2$, $e=125$, $f = 1000\ldots$). The integer part comes from repeated division by two and the fractional part from repeated multiplication by two, both covered in part one. The $0.1$ on the last line repeats forever, and still repeats forever after the point is moved, so only an approximation can be stored.
'''

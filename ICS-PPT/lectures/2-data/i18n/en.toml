['alu-energy.notes.1']
src_hash = '8e1d716d'
text = 'Look at the relative-energy column of the table: the energy of 1 FP32 multiplication is enough for more than 120 8-bit integer additions. This explains why architects designing tensor cores and NPUs integrate thousands of compact fixed-point ALUs on the die. Each bit of width removed yields a large gain in microarchitectural energy efficiency and throughput density.'
# src:
# 
# 请大家看表里的相对能耗倍数：做 1 次 FP32 乘法的电能，足以支撑 120 多次 8 位整数加法！
# 这就解释了为什么当今体系结构设计者在布局张量核心与 NPU 时，会将成千上万个紧凑的定点 ALU
# 集成于硅片之中。每一位位宽的缩减，换来的都是微架构能效比与吞吐密度的飞跃。


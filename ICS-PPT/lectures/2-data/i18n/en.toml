['fp16-classes.slide.1']
src_hash = '24b36d16'
text = '''
- 1 sign bit, 5 exponent bits, 10 fraction bits, bias 15; a normal value is $(-1)^s \times 1.f \times 2^{e-15}$
- An all-zero exponent gives a <mark>subnormal number</mark> with no leading 1: $(-1)^s \times 0.f \times 2^{-14}$, i.e. $f \times 2^{-24}$
- `0x03ff` is $1023 \times 2^{-24}$ and `0x0400` is $1024 \times 2^{-24}$; across the step from subnormal to normal, neighbouring values differ by exactly $2^{-24}$
'''
# src:
# 
# - 1 位符号、5 位阶码、10 位尾数，偏置为 15；规格化数的值为 $(-1)^s \times 1.f \times 2^{e-15}$
# - 阶码全 0 为<mark>次规格化数</mark>，尾数不带前导的 1，值为 $(-1)^s \times 0.f \times 2^{-14}$，即 $f \times 2^{-24}$
# - `0x03ff` 为 $1023 \times 2^{-24}$，`0x0400` 为 $1024 \times 2^{-24}$，从次规格化数到规格化数，相邻两值恰好相差 $2^{-24}$

['fp16-classes.notes.1']
src_hash = '6ca90cab'
text = '''

Subnormal numbers are the denormalized values with an all-zero exponent from the earlier table; the two names refer to the same class. The rules are those of FP32 with narrower fields: with an all-zero exponent $E$ is $1-15=-14$ rather than $-15$, so the last subnormal value meets the first normal value. The subnormal step is a fixed $2^{-24}$, so these values are evenly spaced in $[0, 2^{-14})$. The two classes with an all-one exponent match FP32: a zero fraction means infinity and a non-zero fraction means NaN. The program copies each bit pattern into a GCC `_Float16` variable and prints it as a float, so the decoding is done by the compiler.
'''
# src:
# 
# 次规格化数即前面表格中阶码全 0 的非规格化数，两个名称指同一类值。
# 与 FP32 的规则相同，只是字段宽度不同：阶码全 0 时 $E$ 取 $1-15=-14$ 而非 $-15$，
# 使次规格化数的最后一个值与规格化数的第一个值首尾相接。次规格化数的步长是固定的
# $2^{-24}$，因此它们在 $[0, 2^{-14})$ 内等距分布。
# 阶码全 1 的两类与 FP32 相同：尾数为 0 表示无穷，尾数非 0 表示 NaN。
# 程序把位模式复制进 GCC 的 `_Float16` 变量再按浮点数输出，解码由编译器完成。


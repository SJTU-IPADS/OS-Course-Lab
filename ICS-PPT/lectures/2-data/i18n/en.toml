['two-readings.notes.1']
src_hash = '02f670fb'
text = '''

In digital electronics two's complement is defined as "positives unchanged, negatives inverted and incremented", so that subtraction can be carried out by an adder. The weighted sum given here describes the same encoding and is more convenient when reading a run of bytes: no need to test the sign first and then decide how to compute — just add the weights. The equivalence can be checked on the spot: `1011` inverted is `0100`, plus one is `0101`, that is 5, so the value is −5.
'''
# src:
# 
# 数字电子技术里补码的定义是「正数不变，负数取反加一」，用于让减法由加法电路完成。
# 这里给出的按位权求和是同一套编码的另一种描述，在读一段字节时更好用：
# 不需要先判断符号再决定怎么算，直接按权重相加即可。
# 两者等价可以当场验证：`1011` 取反得 `0100`，加一得 `0101` 即 5，所以原码表示 −5。


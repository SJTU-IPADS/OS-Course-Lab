text = '''
The operand's original type decides between zero extension and sign extension; the target type decides whether the comparison is signed or unsigned. These are two separate matters.
The last row relies on `long long` representing every `unsigned` value, which holds on all three platforms. When the wider signed type cannot represent every value of the narrower unsigned type, both sides convert to the unsigned counterpart of that signed type.
'''

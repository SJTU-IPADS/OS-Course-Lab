# src: 两种右移对应两条不同的机器指令：`sar` 与 `shr`。类型在编译期就选定了其中之一。

['shift-kinds.notes.1']
src_hash = 'cf5784cd'
text = '''

The C standard leaves a right shift on a signed value to the implementation; compilers and platforms all use an arithmetic shift.
Treating a right shift of a signed value as division by a power of two is inaccurate: an arithmetic shift rounds toward negative infinity, so `-1 >> 1` gives −1 rather than 0. Another common form converts to unsigned first and then shifts, to extract a high field — the same move as casting an address to `unsigned char *` at the start of this lecture: fix the rule of interpretation first, then take the value.
'''
# src:
# 
# C 标准把有符号数右移的行为留给实现，实际的编译器与平台一律采用算术右移。
# 把有符号数右移当作除以 2 的幂是不准确的：算术右移向下取整，`-1 >> 1` 得 −1 而不是 0。
# 另一处常见的写法是先转成无符号再右移，用于取出高位字段——这与本讲开头
# 把地址转成 `unsigned char *` 是同一种做法：先选定解释规则，再取值。


['k-scales-layout.title']
src_hash = '38180069'
text = 'Q4_K: the byte representation of the 6-bit coefficients'
# src: Q4_K：6 位量化系数的字节表示

['k-scales-layout.slide.1']
src_hash = 'a2672433'
text = '''

16 × 6 = 96 bits, exactly 12 bytes. The first 8 bytes each hold one complete 6-bit value, and the two bits left over are lent to the upper halves of the last 4 values.
- 6 does not divide 8, so filling 12 bytes requires storing some values across a byte boundary
- The last 4 scales and the last 4 minimums are therefore each split in two, with the upper 2 bits and the lower 4 bits in different bytes
'''
# src:
# 
# **16 × 6 = 96 位，正好是 12 字节。前 8 个字节各放一个完整的 6 位值，剩下的两位借给后 4 个值的高半段。**
# - 6 与 8 不整除，填满 12 字节就必须让一部分值跨字节存放
# - 后 4 个 scale 与后 4 个 min 因此各分成两段，高 2 位与低 4 位存在不同的字节里

['k-scales-layout.highlight.1']
src_hash = 'cb54e519'
text = 'No bit is empty, and no byte-wise reading gets it right.'
# src: 没有一位是空的，也因此没有一种按字节的读法能直接读对。

['k-scales-layout.notes.1']
src_hash = 'eaa68275'
text = '''

This is the densest use of this lecture's bitwise material in a real format: not a single bit is empty, so no convenient reading gets it right and the bits must be taken by definition. The place that is easy to get wrong is the last four values: their low 4 bits are in bytes 8 through 11 and their high 2 bits in bytes 0 through 7, the two pieces come from different bytes, and reversing the order of the concatenation raises no error, only making every reconstructed weight uniformly too large or too small.
'''
# src:
# 
# 这是本讲位运算内容在真实格式里最密的一处：没有任何一位是空的，
# 因此也没有一种「顺手」的读法能读对，必须按定义取位。
# 容易写错的地方是后四个值：它的低 4 位在第 8 到 11 字节，高 2 位在第 0 到 7 字节，
# 两段来自不同的字节，拼接的顺序反了不会报错，只会让还原出的权重整体偏大或偏小。


src_hash = '9a10a8e8'
text = '''
$m = 0$ requires integer code 0 to correspond to the real number 0. A 4-bit integer has 16 codes in all, ranging over −8 ~ 7; here, following the common convention, 1.40, the largest in absolute value, corresponds to 7, $d = 1.40 / 7 = 0.2$, and the 16 codes cover $[-1.6, 1.4]$.
−8 corresponds to −1.6: no weight has an absolute value above 1.40, so with this convention no weight maps to −8, and the codes actually used are only −7 ~ 7. NVIDIA's quantization whitepaper (Wu et al., 2020) and the TFLite quantization specification use the same convention: at 8 bits weights use only −127 ~ 127 and not −128, so the positive and negative sides have the same number of steps.
If all 16 codes are spread over $[-1.4, 1.4]$, then $d = 2.8 / 15 \approx 0.187$ and $m = -1.4 + 8d \approx 0.093$; $m$ is no longer 0.

Computing one by one: 0.31 / 0.2 = 1.55, rounds to 2, restores to 0.4, error 0.09; 0.87 / 0.2 = 4.35, gives 4, restores to 0.8, error 0.07. 0.00 divided by $d$ is still 0, and restores with no error.

The data contain no value below −0.4, so the 6 codes $q = -8 \sim -3$ are unused, and only 10 of the 16 codes are grid points within the data range.
'''
# src:
# 
# $m = 0$ 要求整数码 0 对应实数 0。4 位整数共有 16 个码，范围是 −8 ~ 7；这里按常见的取法，
# 让绝对值最大的 1.40 对应 7，$d = 1.40 / 7 = 0.2$，16 个码覆盖 $[-1.6, 1.4]$。
# −8 对应 −1.6：所有权重的绝对值都不超过 1.40，按这种取法没有权重会映射到 −8，实际用到的码
# 只有 −7 ~ 7。NVIDIA 的量化白皮书（Wu et al., 2020）与 TFLite 的量化规范采用同样的取法，
# 8 位时权重只用 −127 ~ 127，不用 −128，正负两侧的格数相同。
# 若把 16 个码都铺在 $[-1.4, 1.4]$ 上，$d = 2.8 / 15 \approx 0.187$，$m = -1.4 + 8d \approx 0.093$，
# $m$ 不再是 0。
# 
# 逐个计算：0.31 / 0.2 = 1.55，四舍五入得 2，还原为 0.4，误差 0.09；0.87 / 0.2 = 4.35，
# 得 4，还原为 0.8，误差 0.07。0.00 除以 $d$ 仍是 0，还原后没有误差。
# 
# 数据中没有小于 −0.4 的值，$q = -8 \sim -3$ 这 6 个码没有用到，16 个码中落在数据范围内的格点只有 10 个。


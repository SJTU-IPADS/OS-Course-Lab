['fractional-binary.notes.1']
src_hash = 'c0abb442'
text = '''
The header row lists the bits and the row below gives each bit's weight. Left of the point, each place to the left doubles the weight; right of the point, each place to the right halves it.
The integer part of $12.375$ is $12 = 8 + 4$ and the fraction is $0.375 = \frac{1}{4} + \frac{1}{8}$, together $1100.011_2$.
Scientific notation moves the point to just after the leading digit: 1 place in decimal gives $10^{1}$, 3 places in binary give $2^{3}$.
In class, first ask: if only 4 digits may be written on paper, how are 375000000 and 0.000000375 written? Then point to the E on a calculator.
'''
# src:
# 
# 表头是各位，下一行是该位的权重。小数点左侧每向左一位权重乘 2，右侧每向右一位权重除以 2。
# $12.375$ 的整数部分 $12 = 8 + 4$，小数部分 $0.375 = \frac{1}{4} + \frac{1}{8}$，合起来是 $1100.011_2$。
# 科学计数法中小数点移到最高位之后：十进制移动 1 位得到 $10^{1}$，二进制移动 3 位得到 $2^{3}$。
# 课上先问：纸上只准写 4 个数字，375000000 和 0.000000375 怎么写？再指计算器上的 E。


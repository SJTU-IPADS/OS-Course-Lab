# 
# 上一页实测到的 Q4_K_M 正是「分组」这一条的产物：它在 Q4_K 的基础上，
# 把量化误差影响最大的那些张量整体提到 6 位。
# NF4 出自 QLoRA，级取自标准正态的分位点，对已经归一化过的权重块误差更小。
# AWQ 与 GPTQ 都需要一小批校准数据，属于训练后量化；量化感知训练是另一条路线，
# 代价是要重新训练，本节不展开。


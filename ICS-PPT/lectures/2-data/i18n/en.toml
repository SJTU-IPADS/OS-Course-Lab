['cancellation.title']
src_hash = '65c55979'
text = 'Violations of algebraic axioms by floating-point arithmetic, and catastrophic cancellation'
# src: 浮点算术对代数公理的违背与灾难性抵消

['cancellation.slide.1']
src_hash = 'cc1c4411'
text = '''
- **Failure of the associative law of addition**:
  - $(a \oplus b) \oplus c \neq a \oplus (b \oplus c)$. Changing the order of operations changes how much is truncated in exponent alignment for the intermediate results, which breaks the associative and distributive laws.
- **Catastrophic cancellation**:
  - When two nearly equal floating-point numbers are subtracted, the high-order significant digits cancel completely, and the rounding error in the low-order bits, caused by finite precision, is promoted to the leading significant bits; the number of significant digits drops sharply.
'''
# src:
# 
# - **加法结合律的失效**：
#   - $(a \oplus b) \oplus c \neq a \oplus (b \oplus c)$。运算顺序改变了中间结果的阶码对齐截断量，破坏了结合律与分配律。
# - **灾难性抵消**：
#   - 当两个相近的浮点数执行减法时，高位有效数字完全抵消，尾部因有限精度产生的舍入误差被提升为主导有效位，导致有效数字位数断崖式下跌。


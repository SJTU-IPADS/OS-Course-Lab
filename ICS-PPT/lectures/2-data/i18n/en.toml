['symmetric-failure-grid.notes.1']
src_hash = '3497a1ef'
text = '''
The top shows the real distribution of the 2048 weights of the final RMSNorm (`model.norm.weight`): all positive, most of them concentrated between 2.2 and 2.6.
The two rows below draw the 16 grid points of the two 4-bit quantizations on the same real axis, with the step computed over the whole tensor.

The step of symmetric quantization is determined by the largest absolute value; the maximum corresponds to $q = 7$, $d = 2.9219 / 7 \approx 0.417$, and the grid points run from $-8d$ to $7d$.
The 8 grid points on the negative half-axis and the grid point at 0 all lie outside the data range, leaving only 7 grid points within it.
Q4_1 starts from the minimum $m = 0.0417$ and divides $[0.0417, 2.9219]$ into 15 equal segments, $d \approx 0.192$; all 16 grid points lie within the data range, with a spacing less than half that of symmetric quantization.
'''

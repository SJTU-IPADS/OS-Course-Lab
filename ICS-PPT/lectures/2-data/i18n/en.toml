text = 'Floating point reworked: from the general standard to dedicated AI floating-point formats'
# src: 浮点重构：从通用规范到专用 AI 浮点

['ai-float-formats.slide.1']
src_hash = '5d86826d'
text = '''
- **Comparison of the evolving bit fields**:
  - **FP32**: `[1s]` + `[8 exp]` + `[23 mantissa]`
  - **FP16**: `[1s]` + `[5 exp]` + `[10 mantissa]` (smaller dynamic range, overflows easily)
  - **BF16**: `[1s]` + `[8 exp]` + `[ 7 mantissa]` (keeps the 8-bit exponent; dynamic range equal to FP32)
- **1-byte floating point in the NVIDIA Hopper era: the two FP8 specifications**:
  1. **E4M3 (1 sign bit, 4 exponent bits, 3 mantissa bits)**:
     - One more mantissa bit and higher precision; **recommended for weights and activations in forward propagation**.
     - **Departs from IEEE**: drops the encoding of infinity ($\pm\infty$) and frees the reserved codes to represent larger normal numbers (maximum 448).
  2. **E5M2 (1 sign bit, 5 exponent bits, 2 mantissa bits)**:
     - The same exponent as FP16, with a larger dynamic range; **recommended for gradients in back-propagation**.
'''
# src:
# 
# - **位域演变对比**：
#   - **FP32**：`[1s]` + `[8 exp]` + `[23 mantissa]`
#   - **FP16**：`[1s]` + `[5 exp]` + `[10 mantissa]` （动态范围较小，易溢出）
#   - **BF16**：`[1s]` + `[8 exp]` + `[ 7 mantissa]` （保全 8 位阶码，动态范围与 FP32 相同）
# - **NVIDIA Hopper 时代的 1 字节浮点：FP8 双子星规范**：
#   1. **E4M3（1 位符号，4 位阶码，3 位尾数）**：
#      - 尾数多 1 位，精度较高，**被建议用于前向传播的权重与激活值**。
#      - **突破 IEEE 规范**：废除无穷大（$\pm\infty$）编码，将保留码段释放用来表示更大正常数（最大数达 448）。
#   2. **E5M2（1 位符号，5 位阶码，2 位尾数）**：
#      - 阶码与 FP16 一致，动态范围较大；**被建议用于反向传播的梯度**。

['ai-float-formats.slide.1.footnote.1']
src_hash = '0017a887'
text = 'Source: Micikevicius, P. et al. *FP8 Formats for Deep Learning*, arXiv:2209.05433 (2022).'
# src: 文献出处：Micikevicius, P. et al. *FP8 Formats for Deep Learning*, arXiv:2209.05433 (2022).

['ai-float-formats.notes.1']
src_hash = '1ee5098e'
text = '''
The development of architectures shows a pragmatic reshaping of traditional standards. BF16 shortens the mantissa and keeps the same 8-bit exponent as FP32, with the same dynamic range as FP32; in the FP8 era, E4M3 even drops the reserved encoding of infinity and reassigns it to finite values to extend the representable range. The division of labour between E4M3 and E5M2 is the recommendation of the FP8 paper; actual training and inference schemes are not limited to it.
This shows that in domain-specific computing, data representation always serves the concrete requirements of system efficiency and dynamic range.
'''
# src:
# 
# 体系结构的发展展现了对传统规范的务实重塑。BF16 缩减尾数，保留与 FP32 相同的 8 位阶码，
# 动态范围与 FP32 相同；而到了 FP8 时代，E4M3 甚至废除了对无穷大的编码保留，将其重新分配给有限
# 数值以扩展表示范围。E4M3 与 E5M2 的分工是 FP8 论文的建议，实际的训练与推理方案不止这一种。
# 这表明在特定领域计算中，数据表示形式始终服务于具体的系统效能与动态范围需求。


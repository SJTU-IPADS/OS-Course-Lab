['alu-energy-cont.slide.1']
src_hash = 'aa194e41'
text = '''
- **Physical cost at the gate level**:
  - A 32-bit floating-point adder or multiplier must contain large and intricate computation and decision circuits.
  - An 8-bit integer adder needs only one carry chain; its area is about 1/116 of an FP32 adder (36 vs 4184 $\mu m^2$).
  - The area of an 8-bit integer multiplier is about 1/27 of an FP32 multiplier (282 vs 7700 $\mu m^2$).
'''
# src:
# 
# - **门电路级的物理开销**：
#   - 32 位浮点加乘法器需要容纳庞大且繁杂的计算与判定电路。
#   - 8 位整数加法器只需一条进位链，面积约为 FP32 加法器的 1/116（36 vs 4184 $\mu m^2$）。
#   - 8 位整数乘法器的面积约为 FP32 乘法器的 1/27（282 vs 7700 $\mu m^2$）。


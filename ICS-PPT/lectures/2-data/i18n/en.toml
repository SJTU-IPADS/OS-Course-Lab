['shift-kinds.slide.1']
src_hash = '18909697'
text = '''

C has one `>>`; which shift it performs follows the ==type of the left operand==.
- Unsigned left operand: logical right shift, filling with zeros
- Signed left operand: arithmetic right shift, filling the sign bit
'''

['truncation-and-endianness.slide.2']
src_hash = 'cb5604da'
text = '''

- Little-endian puts low bytes first, so the two leading bytes are the truncated result
- `*(short *) &x` matches `(short) x` on little-endian and stops matching on big-endian
'''
# src:
# 
# - 小端下低有效字节在低地址，起始处两个字节正好是截断的结果；大端下得到的是高半部分
# - `*(short *) &x` 一类的写法在小端机器上与 `(short) x` 相同，换到大端机器上不再相同

['truncation-and-endianness.highlight.1']
src_hash = 'a763de5a'
text = 'The language fixes truncation; byte order matters only for bytes.'
# src: 截断由语言规定，按字节读取时字节序才影响结果。

['truncation-and-endianness.notes.1']
src_hash = 'e5aa472c'
text = '''

Code like this can go years without failing in a project that only ever runs little-endian, and surfaces on the first port. The porting guides for Solaris and IA-64 both list it as a form to be checked line by line. Conversely, little-endian unifies "take the low bits" and "take the first few bytes" into one operation: in multiple-precision arithmetic the $i$-th byte is the $i$-th digit, which is where its implementation convenience lies. Conversions written on the value are unaffected, so the rule is simple: change width with a cast, not with a pointer.
'''
# src:

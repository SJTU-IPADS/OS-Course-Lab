['friendly-rules.slide.2']
src_hash = '11b2694b'
text = 'The inner loop of `sum_rows` references `W[i][j]` with stride 1, and the stride of `sum_cols` is $N$ elements.'
# src:
# 
# `sum_rows` 的内层循环以步长 1 引用 `W[i][j]`，`sum_cols` 的步长为 $N$ 个元素。

['friendly-rules.notes.1']
src_hash = 'd2dac44b'
text = '''
The question of this part is: once the cache parameters are fixed, which access sequences have a high hit rate. The three rules are the answer to this question, and the remaining pages test them and give quantitative results.
The reason for the first rule is the count: in a double loop, the body of the inner loop executes N times as often as the outer loop, and the cost of one miss is multiplied by this count.
The second rule: the local variables sum and i are kept in registers, and referencing them does not access memory. Repeated references to array elements rely on the cache, with a miss on the first reference and hits afterwards.
The third rule: arrays are stored in row order, so W[i][j] and W[i][j+1] are adjacent. When the inner loop varies j, the stride is 1 and the elements of a block are used one after another. When the inner loop varies i, two consecutive accesses are N elements apart and each access falls in a different block.
The two functions perform the same number of operations and access the same elements; only the order of the accesses differs.
'''
# src:
# 
# 本部分回答的问题是：缓存的参数固定之后，什么样的访问序列命中率高。三条规则是这个问题的答案，其余的页检验它们并给出定量的结果。
# 第一条规则的理由是次数：一个二重循环中，内层循环体的执行次数是外层的 N 倍，一次不命中的代价乘上这个次数。
# 第二条规则：局部变量 sum 与 i 放在寄存器中，引用它们不访问内存。数组元素的重复引用靠缓存，第一次不命中，之后命中。
# 第三条规则：数组按行存放，W[i][j] 与 W[i][j+1] 相邻。内层循环 j 变化时步长为 1，一个块中的各元素依次被用到。内层循环 i 变化时，相邻两次访问相差 N 个元素，每次访问落在不同的块中。
# 两个函数的运算次数相同，访问的元素相同，只有访问的次序不同。


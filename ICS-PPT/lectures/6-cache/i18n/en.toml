['memory-naive.notes.1']
src_hash = '687f2ab3'
text = '''
This page gives the simplest memory model: main memory is one row of bytes, each read returns only the requested bytes, and each read takes 100 ns, an order of magnitude taken from real main-memory latency. The main memory in the figure holds `w[0]` to `w[3]` and `x[0]` to `x[3]`, 4 bytes per cell, and the time axis is 1 ns per pixel.
Frame 1 is the model. Frame 2: iteration 0 reads `w[0]`, 100 ns. Frame 3: it reads `x[0]`, another 100 ns. Frame 4: the multiply-add takes 0.2 ns, only a thin line on the time axis. Frame 5: 4 iterations take 800.8 ns, of which the multiply-adds take 0.8 ns.
Each iteration takes 200.2 ns. For $n = 10^6$, reading main memory takes 0.2 s and the multiply-adds take 0.2 ms, a factor of 1000. The running time is determined by reading main memory.
'''
# src:
# 
# 这一页给出最简单的内存模型：内存是一整行字节，每次读取只返回请求的字节，每次读取需要 100 ns，数量级取自实际的内存延迟。图中的内存存放 `w[0]` 至 `w[3]` 与 `x[0]` 至 `x[3]`，每个单元 4 字节，时间轴每像素 1 ns。
# 第一帧是模型。第二帧，迭代 0 读 `w[0]`，100 ns。第三帧，读 `x[0]`，又是 100 ns。第四帧，乘加 0.2 ns，在时间轴上只是一条细线。第五帧，4 次迭代共 800.8 ns，其中乘加共 0.8 ns。
# 每次迭代 200.2 ns，$n = 10^6$ 时读内存共 0.2 s，乘加共 0.2 ms，相差 1000 倍。运行时间由读内存决定。

['dram-read.title']
src_hash = '57277bea'
text = 'Organization and reading of DRAM'
# src: DRAM 的组织与读取

['dram-read.slide.1']
src_hash = '3ec4ac93'
text = '''
- The smallest addressable unit of a DRAM chip is called a **supercell**, and each supercell has $w$ bits. In the hardware the supercells are arranged in a two-dimensional array, and a read must bring out a whole row, which is incompatible with the simplest memory model that accesses one byte at a time.
- A $d \times w$ DRAM chip has $d$ supercells, arranged in $r$ rows and $c$ columns, $d = r \times c$, and numbered by (row, column).
'''
# src:
# 
# - DRAM 芯片的最小寻址单位称为**超单元**，每个超单元 $w$ 位。硬件实现把超单元排成二维阵列，并要求一次读取出一整行，与逐个字节存取的最简单的内存模型不兼容。
# - $d \times w$ 的 DRAM 芯片有 $d$ 个超单元，排成 $r$ 行 $c$ 列，$d = r \times c$，用（行，列）编号。

['dram-read.slide.1.footnote.1']
src_hash = '92953a07'
text = 'Supercell is the term of CS:APP. In DRAM datasheets it corresponds to a column selected by the column address. A chip contains several banks, and each bank has one such two-dimensional array.'
# src: 超单元是 CS:APP 的术语，DRAM 手册中对应由列地址选出的一列（column）。一片芯片含多个存储体，每个存储体各有一个这样的二维阵列。

['dram-read.notes.1']
src_hash = '7994a1c3'
text = '''
The chip has only one set of address pins, and the row address and column address are sent one after the other, so reading a supercell takes two steps. The chip in the figure is 16 × 8: 16 supercells of 8 bits each, 128 bits in total, arranged as 4 × 4.
The first frame shows the organization. In the second frame, row address 2 (RAS, row access strobe) copies the 4 supercells of row 2 into the row buffer. In the third frame, column address 1 (CAS, column access strobe) selects supercell 1 in the row buffer, and its 8 bits are sent over the data lines to the memory controller.
Real chips have far more rows and columns. The timing details are in the device manuals and are not expanded here.
'''
# src:
# 
# 芯片内部只有一组地址引脚，行地址与列地址依次送出，因此读一个超单元需要两步。图中的芯片是 16 × 8：16 个超单元，每个 8 位，共 128 位，排成 4 × 4。
# 第一帧是组织。第二帧，行地址 2（RAS，行访问选通）使第 2 行的 4 个超单元整行复制到行缓冲。第三帧，列地址 1（CAS，列访问选通）选出行缓冲中的第 1 个超单元，8 位经数据线送到内存控制器。
# 实际芯片的行、列数大得多，时序细节在器件手册中，这里不展开。

['dram-module.title']
src_hash = 'a84db677'
text = 'Memory module'
# src: 内存模块

['dram-module.slide.1']
src_hash = '90b43b13'
text = '''
- A DRAM chip reads $w = 8$ bits at a time, while the word accessed by the 64-bit processor is 64 bits. Therefore, a memory module is implemented by connecting 8 chips in parallel, and each chip supplies one byte of the 64-bit word.
- The 64 MB module in the figure consists of 8 chips of 8M × 8. Each chip has 8M supercells of 8 bits each.
'''
# src:
# 
# - 一个 DRAM 芯片一次读出 $w = 8$ 位，而 64 位处理器访问的字是 64 位。因此，内存模块实现上把 8 个芯片并联，每个芯片提供 64 位字中的一个字节。
# - 图中的 64 MB 模块由 8 个 8M × 8 的芯片组成，每个芯片有 8M 个超单元，每个 8 位。

['dram-module.notes.1']
src_hash = 'd061ef4f'
text = '''
An 8M × 8 chip has $2^{23}$ supercells of 8 bits each, a capacity of 8 MB. 8 chips total 64 MB. A 64-bit word is split into 8 bytes, with byte 0 in DRAM 0 and byte 7 in DRAM 7.
In the first frame, the controller receives address $A$ and computes (row $i$, column $j$). In the second frame, the controller sends row address $i$ to the 8 chips at the same time, and each chip reads its whole row $i$ into its own row buffer, the light orange row being the row that was read out. In the third frame, the controller sends column address $j$ to the 8 chips at the same time, and each chip selects supercell $j$ of its row buffer, solid orange. In the fourth frame, the 8 chips each send out the 8 selected bits, and the controller puts the 8 bytes together into a 64-bit word: the byte from DRAM 0 is bits 0–7, and the byte from DRAM 7 is bits 56–63. The rows in the figure have only 4 supercells, while the rows of real chips have thousands.
'''
# src:
# 
# 一个 8M × 8 的芯片有 $2^{23}$ 个超单元，每个 8 位，容量 8 MB。8 个芯片共 64 MB。64 位的字被拆成 8 个字节，字节 0 在 DRAM 0 中，字节 7 在 DRAM 7 中。
# 第一帧，控制器收到地址 $A$，算出（行 $i$，列 $j$）。第二帧，控制器把行地址 $i$ 同时送给 8 个芯片，每个芯片把第 $i$ 行整行读入自己的行缓冲，浅橙色的是被读出的一行。第三帧，控制器把列地址 $j$ 同时送给 8 个芯片，每个芯片选出行缓冲中的第 $j$ 个超单元，实心橙色。第四帧，8 个芯片各送出选中的 8 位，控制器把这 8 个字节拼成 64 位字：DRAM 0 的字节是位 0–7，DRAM 7 的字节是位 56–63。图中的行只有 4 个超单元，实际芯片的行有上千个。

['memory-row.title']
src_hash = 'de5f6609'
text = 'Access patterns under the DRAM memory model'
# src: DRAM 内存模型下的访存模式

['memory-row.slide.1']
src_hash = 'ead1e166'
text = '- To read a word, each of the 8 DRAM chips first reads out the whole row that holds it, and the row is latched in the **row buffer** inside the chip.'
# src:
# 
# - 内存读取一个字时，8 个 DRAM 芯片各自先读出所在的整行，锁存在芯片内部的**行缓冲**中。

['memory-row.highlight.1']
src_hash = '54121e83'
text = 'The cost of reading out a whole row is shared by the several reads within the row'
# src: 读出一整行的代价由行内的多次读取分摊

['memory-row.notes.1']
src_hash = '954f4400'
text = '''
A DRAM bit is stored in a capacitor. A read connects the capacitor to the bit line and changes its charge, so the read is destructive. When a row is selected, all cells of the row are connected to their bit lines at the same time, the sense amplifiers amplify and latch each bit, and the latched values are written back to the capacitors at the same time. The latches of this whole row are the row buffer. Reading out a whole row is determined by the structure of DRAM.
Therefore a read always reads out a whole row. Without keeping the row buffer, the row is closed after each read and the next read must select a row again, which is the simplest model. With the row buffer kept, later reads of the same row only fetch data from the row buffer.
A row of the main memory in the figure is 4 words of 8 bytes, each word holds 2 `int`s, the row buffer is the row buffers of the 8 chips together, `w[0]` to `w[7]` are in row 0, and `w[8]` onward are in row 1. 100 ns and 10 ns are illustrative values. In real chips a row-buffer hit takes about ten-odd nanoseconds, and a row change takes tens to a hundred nanoseconds, depending on the chip and the controller.
`w` and `x` lie in different rows. A real chip has several banks, each with its own row buffer, and `w` and `x` can each use one, so the figure draws only the reads of `w`.
Frame 1 shows the rows and the row buffer. Frame 2: reading `w[0]` reads the whole row `w[0]` to `w[7]` into the row buffer, 100 ns. Frame 3: reading `w[1]` is served from the row buffer, 10 ns. Frame 4: `w[2]` to `w[7]` take 10 ns each, so 8 reads take 170 ns. Frame 5: `w[8]` is in the next row, the row buffer is replaced by that row, and another 100 ns is needed.
'''
# src:
# 
# DRAM 的一位由一个电容保存，读出时电容与位线连通，电荷被改变，所以读出是破坏性的。选中一行时，这一行的全部单元同时与各自的位线连通，由读出放大器把每一位放大并锁存，锁存的结果同时写回电容。这一整行的锁存器就是行缓冲。整行读出由 DRAM 的结构决定。
# 因此一次读取总是读出整行。不保留行缓冲时，每次读取之后这一行被关闭，下一次读取需要重新选中一行，这就是最简单的模型。保留行缓冲，对同一行的后续读取只需要从行缓冲取数据。
# 图中内存的一行是 4 个 8 字节的字，每个字存放 2 个 `int`，行缓冲是 8 个芯片的行缓冲合在一起，`w[0]` 至 `w[7]` 在行 0，`w[8]` 起在行 1。100 ns 与 10 ns 是示意值，实际芯片的行缓冲命中约十几纳秒，换行约几十到一百纳秒，随芯片与控制器而异。
# `w` 与 `x` 位于不同的行。实际的芯片有多个存储体，每个存储体各有一个行缓冲，`w` 与 `x` 可以各用一个，所以图中只画 `w` 的读取。
# 第一帧是行与行缓冲。第二帧，读 `w[0]`，整行 `w[0]` 至 `w[7]` 读入行缓冲，100 ns。第三帧，读 `w[1]`，取自行缓冲，10 ns。第四帧，`w[2]` 至 `w[7]` 各 10 ns，8 次读取共 170 ns。第五帧，`w[8]` 在下一行，行缓冲被这一行替换，再用 100 ns。


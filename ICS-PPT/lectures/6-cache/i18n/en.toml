['matmul-ijk.notes.1']
src_hash = '161a66d6'
text = '''
The figure draws only the 8 × 8 elements in the top left corner of each matrix. The 8 doubles of each row are one 64-byte block, and the start of the row is aligned to the block. It is assumed that none of these blocks is in the cache when the inner loop starts (n is large). Orange marks the elements accessed in the current iteration, the colour of the outer ring shows a hit (green) or a miss (red), the light blue rows are blocks already in the cache, and the number in a cell is the sequence number of the iteration that accessed the element. Below each matrix are the result of this iteration and the cumulative number of misses, and the line below the figure describes the accesses of this frame. The three frames draw iterations 1, 2 and 8.
Frame 1 (k = 0): A[i][0] misses, and the block in row i of A is fetched. B[0][j] misses, and the block in row 0 of B is fetched. sum is in a register, and C is not accessed.
Frame 2 (k = 1): A[i][1] is in the same block as A[i][0] and hits. B[1][j] is in row 1 of B, a new block, so it misses, and only one element of the fetched block is used.
Frame 3 (k = 7): k = 2 to 7 behave like k = 1, A[i][k] hits every time and B[k][j] misses every time. In the 8 iterations A misses 1 time, B misses 8 times, and C is not accessed, 9 misses in total, 9/8 = 1.125 per iteration. The counts in the figure come from simulating a fully associative LRU cache.
The inner loop k runs from 0 to n-1: A[i][k] is taken along row i of A with stride 1, 1 miss per 8 references. B[k][j] is taken along column j of B with a stride of n doubles, and every reference misses. sum is in a register, and C[i][j] is written once after the inner loop ends and is not counted in the inner iterations.
ijk and jik differ only in the order of the two outer loops: the order of the selected (i, j) pairs differs, while the accesses of the inner loop are the same, so the number of misses is the same.
Each iteration of this class has two reads and no writes, with accumulation in a register.
'''

['dm-index-bits.slide.1']
src_hash = '0400e369'
text = '''
- When the set index takes the high bits of the address, consecutive blocks have the same set index, all blocks of an array map to the same set, and the other sets of the cache are not used.
- When the set index takes the middle bits of the address (above the block offset), $S$ consecutive blocks map in turn to $S$ different sets, and one array can occupy the whole cache.
'''
# src:
# 
# - 如果组索引取地址的高位，连续的块有相同的组索引，一个数组的块全部映射到同一组，缓存的其他组未被使用。
# - 组索引取地址的中间位时，连续的 $S$ 个块依次映射到 $S$ 个不同的组，一个数组可以占用整个缓存。

['dm-index-bits.notes.1']
src_hash = 'aa5902f6'
text = '''
The figure shows 16 blocks and a cache with 4 sets; the colors indicate the set number. The upper row in the figure uses the high 2 bits of the address as the set index: blocks 0 to 3 all map to set 0, and blocks 4 to 7 all map to set 1. An array of only 4 blocks falls in one set, and the other three sets of the cache cannot be used.
The lower row uses the 2 bits above the block offset as the set index: blocks 0 to 3 map in turn to sets 0 to 3. The array framed in orange in the figure consists of blocks 4 to 7 and is spread over all 4 sets.
Program accesses are mostly sequential, so taking the middle bits as the set index spreads consecutive data over the sets.
'''
# src:
# 
# 图中是 16 个块，缓存有 4 个组，颜色表示组号。图中上排用地址的高 2 位作组索引：块 0 至 3 都映射到组 0，块 4 至 7 都映射到组 1。一个只有 4 个块的数组落在同一个组里，缓存的另外三个组无法使用。

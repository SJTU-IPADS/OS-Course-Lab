text = 'Exercise: Locality and Misses'
# src: 练习：局部性与不命中

['exercise-locality.slide.1']
src_hash = 'a1bdfb6f'
text = '''
1. Two loops over an `int` array `a`: (a) `i++`, (b) `i += 8`; the loop body of both is `sum += a[i];`. Which kind of locality does `sum` have? What is the stride of `a[i]` in each?
2. A cache has 4 blocks, block $b$ is placed at position $b \bmod 4$, and the cache is initially empty. Blocks 0, 1, 2, 3, 4, 0, 8, 0, 1, 5, 1 are referenced in order. Is each reference a hit, a cold miss, a conflict miss or a capacity miss?
'''
# src:
# 
# 1. `int` 数组 `a` 上的两个循环：(a) `i++`，(b) `i += 8`，循环体都是 `sum += a[i];`。`sum` 具有哪种局部性？`a[i]` 的步长各是多少？
# 2. 缓存有 4 个块，块 $b$ 放在位置 $b \bmod 4$，初始为空。依次引用块 0, 1, 2, 3, 4, 0, 8, 0, 1, 5, 1。每次引用是命中、冷不命中、冲突不命中还是容量不命中？


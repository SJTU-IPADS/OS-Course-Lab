['resource-cache.notes.1']
src_hash = '84afff9f'
text = '''
One SSD read takes 10 to 100 µs, and a round trip to the cloud over the internet takes tens of milliseconds, a difference of about 1000 times. After the resource files are written to the SSD, startup and scene changes read only the SSD.
The capacity of an SSD is far larger than that of memory, so resource files can be kept for a long time, and they survive a power loss. When the game is updated, it downloads only the resource files that changed, and the new versions replace the old ones on the SSD.
Every path in the figure passes through the operating system: the download uses the network interface, and the writes and reads use the file interface.
'''
# src:
# 
# 读 SSD 一次需要 10 至 100 µs，经互联网访问云端一次往返约数十毫秒，相差约 1000 倍。资源文件写入 SSD 之后，启动与切换场景时只读 SSD。
# SSD 的容量远大于内存，资源文件可以长期保存，断电后也不丢失。游戏更新时只下载变化的资源文件，SSD 上的旧版本被新版本替换。
# 图中的路径都穿过操作系统：下载用网络接口，写入与读取用文件接口。


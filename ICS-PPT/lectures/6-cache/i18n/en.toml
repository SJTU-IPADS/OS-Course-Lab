['miss-types.notes.1']
src_hash = '3c504365'
text = '''
The three frames demonstrate the three kinds of miss in turn, and each frame gives a reference sequence and the cache before the last reference.
Frame 1: the sequence 0, 1, 2, 3 with an empty cache. All 4 referenced blocks appear for the first time, so all are cold misses. A cold miss depends only on whether the block is referenced for the first time, not on whether the cache is empty: when block 3 is referenced the cache already holds blocks 0, 1 and 2, and it is still a cold miss. In the figure, position 3 is still empty at the last reference, to block 3.
Frame 2: the sequence 0, 8, 0. Blocks 0 and 8 both go to position 0 (0 mod 4 = 8 mod 4 = 0), and the 2nd reference, to 8, evicts 0. At the 3rd reference, to 0, only 1 other block (8) has been referenced since its last reference, and positions 1 to 3 of the cache are still empty, so this is a conflict miss.
Frame 3: the sequence 0, 1, 2, 3, 4, 0. Block 4 goes to position 0 and evicts 0. When 0 is referenced again, the other blocks referenced since its last reference are 1, 2, 3 and 4, 4 blocks in total, so the working set is larger than the cache, and this is a capacity miss.
The three kinds of miss have different causes and different remedies. A cold miss occurs only at the first reference to a block and cannot be avoided. A conflict miss is caused by the placement policy and can be reduced by a different placement. A capacity miss is caused by a working set larger than the cache and can be reduced only by enlarging the cache or shrinking the working set.
To tell a conflict miss from a capacity miss, count how many different other blocks were used since the last reference to this block; whether the cache is full at this moment does not matter. When the number of other blocks is at least the number of blocks in the cache, the working set of this period does not fit by itself, and with any placement the block would have to be pushed out: it is a capacity miss. When the number is less than the number of blocks in the cache, all the blocks used in this period fit, and the block should have stayed in the cache; it is pushed out because the placement policy does not let the new block take another position: it is a conflict miss. For example, with a cache of 4 blocks and the sequence 1, 2, 3, 0, 8, 0, the cache is full with blocks 0 to 3. Block 8 can take only position 0 when it is referenced, so block 0 is evicted, while block 1 has long been unused. When block 0 is referenced again, only block 8 has been used in the meantime. If the cache could put 8 in the position of block 1, block 0 would not have been evicted, so it is a conflict miss.
To classify a miss, check two conditions. If the block has not been referenced before, it is a cold miss. If it has, count the other blocks referenced since its last reference: fewer than the number of blocks in the cache (4) is a conflict miss, and at least that number is a capacity miss.
'''
# src:
# 
# 三帧依次演示三类不命中，每帧给出一个引用序列和最后一次引用之前的缓存。
# 第 1 帧：序列 0, 1, 2, 3，缓存为空，4 次引用的块都是第一次出现，都是冷不命中。冷不命中只取决于块是否第一次被引用，与缓存是否为空无关：引用块 3 时缓存中已有块 0、1、2，它仍是冷不命中。图中最后一次引用块 3，位置 3 空着。
# 第 2 帧：序列 0, 8, 0。块 0 与块 8 都放在位置 0（0 mod 4 = 8 mod 4 = 0），第 2 次引用 8 逐出 0。第 3 次引用 0 时，自上次引用 0 以来只有 1 个其他块（8）被引用，缓存的位置 1 到 3 还空着，这是冲突不命中。
# 第 3 帧：序列 0, 1, 2, 3, 4, 0。4 放在位置 0，逐出 0。再次引用 0 时，自上次引用它以来被引用的其他块有 1、2、3、4 共 4 个，工作集大于缓存，这是容量不命中。
# 三类不命中的原因各不相同，减少它们的办法也不同：冷不命中只出现在块第一次被引用时，无法避免。冲突不命中由放置策略造成，换一种放置方式可以减少。容量不命中由工作集大于缓存造成，增大缓存或缩小工作集才能减少。
# 区分冲突不命中与容量不命中，看的是自上次引用这个块以来用过多少个不同的其他块，与缓存此刻是否已满无关。其他块不少于缓存的块数时，这段时间的工作集本身装不下，换成任何放置方式，这个块都得被挤出，这是容量不命中。其他块少于缓存的块数时，这段时间用到的块全部放得下，这个块本该留在缓存里；它被挤出，是因为放置策略不让新块去占别的位置，这是冲突不命中。例如缓存有 4 个块，序列 1, 2, 3, 0, 8, 0：缓存里放满了 0 至 3，引用 8 时它只能占位置 0，块 0 被逐出，而块 1 早已不用；再引用 0 时，这段时间只用过块 8，缓存若可以把 8 放在块 1 的位置，块 0 就不会被逐出，所以是冲突不命中。
# 判断一次不命中属于哪一类，看两个条件：这个块是否被引用过，没有则是冷不命中。引用过时，自上次引用它以来被引用的其他块有几个，少于缓存的块数（4）是冲突不命中，不少于是容量不命中。


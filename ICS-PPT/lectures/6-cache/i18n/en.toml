src_hash = '44a04875'
text = 'Data Structure of the Cache'
# src: 缓存的数据结构

['kv-layout.slide.1']
src_hash = '057f9943'
text = 'The KV Cache is an array allocated in advance up to the maximum length MAX. Its indices are, in order, layer, K or V, head, position and dimension. Positions are numbered from 0.'
# src:
# 
# KV Cache 是一个预先分配到最大长度 MAX 的数组，下标依次是层、K 或 V、头、位置、维度。位置从 0 编号。

['kv-layout.slide.2']
src_hash = '2e0de0ce'
text = '''
- Step $t$ writes the new $k$ and $v$ at position $t$, and reading takes only positions 0 to $t$. The empty positions from $t+1$ on are reserved for later tokens.
- The position is the second-to-last index. The $d$ elements of a position are stored contiguously, the K of one head is a contiguous region of memory, and adjacent positions are $d \times b$ bytes apart.
'''
# src:
# 
# - 第 $t$ 步把新的 $k$、$v$ 写在位置 $t$，读取时只取位置 0 到 $t$，位置 $t+1$ 起的空位保留给后续的 token。
# - 位置是倒数第二个下标，一个位置的 $d$ 个元素连续存放，同一个头的 K 是一段连续的内存，相邻位置相距 $d \times b$ 字节。

['kv-layout.notes.1']
src_hash = '2cf80d48'
text = '''
The figure zooms in from top to bottom, and each row is the inside of the boxed cell of the previous row. The first row is the L layers, the second row is K and V in one layer, the third row is the n heads in K, the fourth row is the positions in one head, and the fifth row is the d elements of one position. The index names on the left agree with the array indices in the code.
In the fourth row, light blue positions already hold the k of a token, the orange position t is the one appended in the current step, and the white dashed positions are allocated in advance and not yet used.
Address of an element = start address + ((((layer × 2 + kv) × n_kv + head) × MAX + position) × d + dimension) × b, where b is the number of bytes per element. The position comes before the dimension, so the K of one head is a contiguous region of MAX × d elements, and the used part is its first (t+1) × d elements.
The reason for allocating up to MAX in advance is that appending does not need to move existing data: writing position t is one sequential write. The cost of this choice is examined later with block allocation.
'''
# src:
# 
# 图自上而下逐层放大，每一行是上一行中被框出的一格的内部。第一行是 L 层，第二行是某一层中的 K 与 V，第三行是 K 中的 n 个头，第四行是一个头中的各个位置，第五行是一个位置的 d 个元素。左侧的下标名与代码中的数组下标一致。
# 第四行中，浅蓝色的位置已经存放了 token 的 k，橙色的位置 t 是当前步追加的，白色虚线的位置是预分配而尚未使用的空位。
# 元素的地址 = 起始地址 + ((((层 × 2 + kv) × n_kv + 头) × MAX + 位置) × d + 维度) × b，b 是每个元素的字节数。位置在维度之前，所以一个头的 K 是 MAX × d 个元素的连续区域，已用的部分是它的前 (t+1) × d 个元素。
# 预分配到 MAX 的原因是追加时不需要移动已有的数据，写入位置 t 只是一次顺序写。这个选择的代价在后面讨论分块分配时再看。

['kv-code.title']
src_hash = 'f02e944a'
text = 'Append and Read'
# src: 追加与读取

['kv-code.slide.1']
src_hash = '00e10fde'
text = '''
- `kv_append` writes the new $k$ and $v$ at position $t$, so **appending is a sequential write**.
- `attention` reads K and then V for positions 0 to $t$ in order, so **the read stride is 1**, and a block brought into the cache is used completely.
'''
# src:
# 
# - `kv_append` 把新的 $k$、$v$ 写到位置 $t$，**追加是顺序写**。
# - `attention` 对位置 0 到 $t$ 依次读 K，再依次读 V，**读取的步长为 1**，一个块取入缓存后被完整使用。

['kv-code.notes.1']
src_hash = '863047a4'
text = '''
The left side is the declaration of the array and the append. The right side is the attention of one head, where `dot` and `softmax` are helper functions and are omitted. The code illustrates the access sequence and does not show the loops over heads and batches.
`kv_append`: each head writes D elements to cache[layer][0][h][t] (K) and cache[layer][1][h][t] (V). For a fixed head, position t follows position t−1 immediately, so the K of one head grows sequentially during generation.
`attention`: `K[i]` is the D elements of position i. As i increases from 0 to t, the addresses read increase contiguously from the start of K to the (t+1) × D-th element, with a stride of 1 element. V is read in the same way. This is a stride-1 reference pattern with the best spatial locality, and the elements within a block are used one after another.
Each element is used only once in the computation of a token: K[i][d] takes part in one multiply-add, and so does V[i][d]. There is no repeated reference, that is, no temporal locality. The next page gives the amount of data read.
'''
# src:
# 
# 左侧是数组的声明与追加。右侧是一个头的注意力，`dot` 与 `softmax` 是辅助函数，省略。代码用于说明访问序列，没有写出多头的循环与批量。
# `kv_append`：每个头把 D 个元素写到 cache[layer][0][h][t]（K）与 cache[layer][1][h][t]（V）。对固定的头，位置 t 紧接在位置 t−1 之后，所以一个头的 K 在生成过程中是顺序增长的。
# `attention`：`K[i]` 是位置 i 的 D 个元素。i 从 0 增加到 t，读过的地址从 K 的起点连续增加到 (t+1) × D 个元素处，步长为 1 个元素。V 的读取同样。这是步长为 1 的引用模式，空间局部性最好，一个块中的元素依次被用到。
# 每个元素在一个 token 的计算中只用一次：K[i][d] 只参加一个乘加，V[i][d] 同样。没有重复引用，即没有时间局部性。下一页给出读取的数据量。


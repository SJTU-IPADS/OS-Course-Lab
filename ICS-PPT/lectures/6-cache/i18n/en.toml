['locality-dot.notes.1']
src_hash = 'fddf848e'
text = '''
At -O1 and above, `sum` and `i` are kept in registers, and at -O0 on the stack. In both cases they are read and written in every iteration and have temporal locality. `w[i]` and `x[i]` are each referenced once in iteration i, and the next iteration references the element whose address is 4 higher, so for each array the sequence of referenced addresses is 0, 4, 8, ....
The locality of instructions is the same as that of data. The few instructions of the loop body are fetched repeatedly in every iteration, and instruction fetch is also a reference to memory.
'''
# src:
# 
# `sum` 与 `i` 在 -O1 以上保存在寄存器中，在 -O0 下保存在栈上。两种情况下它们都在每次迭代被读写，具有时间局部性。`w[i]` 与 `x[i]` 在迭代 i 被各引用一次，下一次迭代引用地址大 4 的元素，因此对每个数组而言引用的地址序列是 0, 4, 8, ...。
# 指令的局部性与数据相同：循环体的几条指令在每次迭代重复取出，取指也是对内存的引用。


['kv-run.notes.1']
src_hash = '098fb239'
text = '''
`kv_decode.c` implements decoding for a single attention head, without multiple heads, layers or feed-forward networks. `decode(cached, out)` executes step by step: it computes q for the current token, then calls `compute_kv(t)` once if `cached` is true, or once for each position 0 to t if it is false, and finally `attend` performs attention over positions 0 to t, and the output becomes the input of the next step through tanh.
The two modes perform the operations in the same order, so the outputs are identical bit by bit (the last line, yes). The projections are counted by `projections`: T(T+1)/2 = 524800 and T = 1024, a ratio of 512.5.
Time: 766.1 ms without the cache and 32.4 ms with it, a ratio of 23.6. With the cache, the work of each step consists of the three d × d projections of q, k and v, and the attention over t positions (one d-dimensional inner product and one weighted accumulation per position). The cache removes the term of the projections that grows with t. The sum of the attention over t positions remains, so the total time still grows with T², with a cost of d per term, while the projection without the cache costs d². This is why the time ratio is smaller than the ratio of projections.
The time varies from machine to machine, and the numbers on the page are taken from one run.
'''
# src:
# 
# `kv_decode.c` 实现单个注意力头的解码，没有多头、层与前馈网络。`decode(cached, out)` 逐步执行：为当前 token 计算 q，然后 `cached` 为真时只调用一次 `compute_kv(t)`，为假时对位置 0 到 t 各调用一次 `compute_kv`，最后 `attend` 对位置 0 到 t 作注意力，输出经 tanh 成为下一步的输入。
# 两种方式的运算顺序相同，所以输出逐位相同（最后一行 yes）。投影次数由 `projections` 计数：T(T+1)/2 = 524800，T = 1024，之比 512.5。
# 时间：无缓存 766.1 ms，有缓存 32.4 ms，之比 23.6。有缓存时，每步的运算量包括 q 与 k、v 的三次 d × d 投影，以及对 t 个位置的注意力（每个位置一次 d 维内积与一次加权累加）。缓存去掉的是投影随 t 增长的那一项，注意力对 t 个位置的求和仍在，所以总时间仍随 T² 增长，每一项的代价是 d，没有缓存时的投影是 d²。这一点由时间之比小于投影次数之比体现。
# 时间随机器而异，页面上的数字取一次运行的结果。


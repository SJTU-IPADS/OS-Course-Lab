text = '''
- An LLM processes text in units of **tokens**. A token is a word or a part of a word.
- During generation, each step outputs the next token from all existing tokens and appends it to the end of the input for the next step.
- The model is a stack of $L$ structurally identical Transformer layers. In each layer, **attention** makes the vector of a token depend on the tokens before it.
'''

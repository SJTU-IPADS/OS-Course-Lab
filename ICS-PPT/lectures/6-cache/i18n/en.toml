['sram-dram.notes.1']
src_hash = 'b07cd41c'
text = '''
SRAM stores a bit in a bistable circuit of 6 transistors. While powered, the data stays unchanged, and it is insensitive to disturbances such as electrical noise. DRAM stores a bit with one capacitor and one transistor. The charge on the capacitor leaks, so every 10–100 ms each bit must be read out and written back, which is called refresh. DRAM is sensitive to disturbances.
The relative speeds and costs in the table are taken from the textbook: the SRAM access time is taken as 1 and that of DRAM is about 10. The cost of DRAM is taken as 1 and that of SRAM is about 1000. The difference in circuit area per bit determines the difference in cost: the 6 transistors of SRAM occupy far more area than the one transistor and one capacitor of DRAM.
Hence the large main memory uses DRAM, and the small cache that must be fast uses SRAM.
'''
# src:
# 
# SRAM 的一位由 6 个晶体管组成的双稳态电路保存，只要通电，数据就保持不变，对电子噪声等干扰不敏感。DRAM 的一位由一个电容和一个晶体管组成，电容上的电荷会泄漏，因此每 10–100 ms 要把每一位读出再写回，这叫刷新。DRAM 对干扰敏感。
# 表中的相对速度与成本取自教材：SRAM 的访问时间取 1，DRAM 约为 10。成本以 DRAM 为 1，SRAM 约为 1000。每位电路的面积差别决定了成本差别：SRAM 的 6 个晶体管占的面积远大于 DRAM 的一个晶体管与一个电容。
# 由此，容量大的内存用 DRAM，容量小而要求快的缓存用 SRAM。


text = '''
- The colour jumps repeatedly along the arrangement in memory: the addresses of consecutive references are far apart, and the larger the stride, the lower the spatial locality.
- For a $4096 \times 4096$ matrix, the stride of column access is 4096 elements, that is, 16 KB.
'''

['linesize-run.demo.1.name']
src_hash = '521f5561'
text = 'Vary the address distance between two dependent reads and measure the time per node'
# src: 改变两次相依读取的地址间隔，测量每个节点的耗时

['linesize-run.slide.1']
src_hash = '2d6e1243'
text = '''
- `linesize.c` performs two dependent reads inside a 256-byte node; the addresses of the two reads differ by `offset` bytes.
- Row 4 (56) takes about 120 ns and row 5 (64) about 230 ns, about 2 times the former.
- When the start address of the node is aligned to the block size $B$, two reads with `offset` smaller than $B$ fall in the same block and cause one miss. Two reads with `offset` not smaller than $B$ fall in two blocks and cause two misses. The time doubles between 56 and 64, so $B=64$ bytes.
'''
# src:
# 
# - `linesize.c` 在 256 字节的节点内做两次相依读取，两次读取的地址相差 `offset` 字节。
# - 第 4 行（56）约 120 ns，第 5 行（64）约 230 ns，约为前者的 2 倍。
# - 节点首地址对齐于块长 $B$ 时，`offset` 小于 $B$ 的两次读取在同一个块，一次不命中。`offset` 不小于 $B$ 的两次读取落在两个块，两次不命中。耗时在 56 与 64 之间翻倍，所以 $B=64$ 字节。

['linesize-run.notes.1']
src_hash = '4f1c48a9'
text = '''
`linesize.c` divides a 256 MB region into 256-byte nodes and links the nodes into a ring in random order. The random order prevents hardware prefetching from fetching the next node in advance. Each node performs two reads: the value read first is the address of the second read, and the value read second is the address of the next node, so the two reads cannot execute in an overlapped way, and the time is the sum of the two access latencies.
The address of the second read is `offset` bytes after the start address of the node. When `offset` is 8, 32, or 56, both reads fall in the same 64-byte block, and the second read hits after the first read. When `offset` is 64, 128, or 192, the second read falls in another block and requires another fetch from main memory.
The conclusion uses only the relative relation: the time roughly doubles when `offset` grows from 56 to 64, from which the block size of 64 bytes is read.
'''
# src:
# 
# `linesize.c` 把 256 MB 的区域划分为 256 字节的节点，节点按随机顺序连成一个环，随机顺序使硬件预取无法提前取到下一个节点。每个节点内做两次读取：第一次读取到的值是第二次读取的地址，第二次读取到的值是下一个节点的地址，因此两次读取不能重叠执行，耗时是两次访问延迟之和。
# 第二次读取的地址在节点首地址之后 `offset` 字节。`offset` 为 8、32、56 时，两次读取落在同一个 64 字节的块内，第二次读取在第一次读取之后命中。`offset` 为 64、128、192 时，第二次读取落在另一个块，需要再从内存取一次。
# 结论只用相对关系：耗时在 `offset` 由 56 增大到 64 时约翻倍，由此读出块长 64 字节。


['linesize-method.title']
src_hash = 'cc2210fa'
text = 'Measuring the Block Size'
# src: 块长的测量方法

['linesize-method.slide.1']
src_hash = '4d4d76a2'
text = '''
When the block size $B$ is unknown, make two dependent reads in a node that is block-aligned and not in the cache. The addresses of the two reads differ by `offset` bytes.
- Read 1 misses and brings in the block that holds the first address of the node.
- If read 2 is in the same block it hits, and the node costs 1 miss. If it is in another block it misses again, and the time doubles.
'''
# src:
# 
# 块长 $B$ 未知时，在与块对齐、不在缓存中的节点内做两次相依读取，地址相差 `offset` 字节。
# - 读 1 不命中，取入节点首地址所在的块。
# - 读 2 在同一个块内则命中，节点耗时是 1 次不命中。在另一个块则再次不命中，耗时翻倍。

['linesize-method.notes.1']
src_hash = 'e1db06d6'
text = '''
The nodes are visited in random order, so a node is not in the cache before it is read and the hardware prefetcher cannot fetch it. The value read by read 1 is the address of read 2, and the value read by read 2 is the address of the next node. The two reads depend on each other and cannot overlap, so the time per node is the sum of the two access latencies.
Frame by frame:
1. The first address of the node is aligned to a block boundary. Read 1 misses and brings in the block that holds it. This block starts at the first address of the node and its length B is unknown.
2. offset = 8: read 2 reads bytes 8 to 15. The node costs only 1 miss, so read 2 hits, bytes 8 to 15 are in the first block, and B is at least 16.
3. offset = 32: the time is unchanged, bytes 32 to 39 are in the first block, and B is at least 40.
4. offset = 56: the time is unchanged, bytes 56 to 63 are in the first block, and B is at least 64.
5. offset = 64: the time doubles, read 2 also misses, byte 64 is not in the first block, and B is at most 64. The two bounds are equal, so B = 64 bytes.
'''
# src:
# 
# 节点按随机顺序访问，读取前它不在缓存中，硬件预取也取不到它。读 1 读到的值是读 2 的地址，读 2 读到的值是下一个节点的地址，两次读取相互依赖，不能重叠执行，节点耗时是两次访问延迟之和。
# 逐帧说明：
# 1. 节点首地址与块边界对齐，读 1 不命中，取入它所在的块。这个块从节点首地址开始，长度 B 未知。
# 2. offset = 8，读 2 读取字节 8 至 15。节点耗时只含 1 次不命中，所以读 2 命中，字节 8 至 15 在第一个块内，B 不小于 16。
# 3. offset = 32，耗时不变，字节 32 至 39 在第一个块内，B 不小于 40。
# 4. offset = 56，耗时不变，字节 56 至 63 在第一个块内，B 不小于 64。
# 5. offset = 64，耗时翻倍，读 2 也不命中，字节 64 不在第一个块内，B 不大于 64。两个界相等，B = 64 字节。


# 
# - `sum` 与 `i` 是没有地址的局部变量，因此保存在寄存器中，数组 `w` 与 `x` 存放在内存中。
# - 设处理器时钟为 5 GHz，则一个周期 0.2 ns。一次内存读取的时间在 100 ns 量级，相当于数百个周期。
# - 如果每次迭代都从内存读取 `w[i]` 与 `x[i]`，则几乎全部的计算时间都用于读内存。

['dot-memory.highlight.1']
src_hash = 'b1eddaa6'
text = '''
Why is the access speed of registers and main memory so different?
Every iteration accesses main memory. Is there a faster way to access it?
'''
# src:
# 寄存器与内存的访问速度为什么相差这么大？
# 每次迭代都访问内存，是否有更快的访存方式？

['dot-memory.notes.1']
src_hash = '9e8c82f3'
text = '''
`dot_product` is the vector inner product: each iteration of the loop body reads `w[i]` and `x[i]`, multiplies them and accumulates into `sum`. `sum` and `i` are local variables without addresses and are kept in registers, so only these two reads access memory in each iteration. The arrays `w` and `x` reside in main memory and take $4n$ bytes each. For n on the order of $10^6$ they total 8 MB.
The processor clock is assumed to be 5 GHz (an assumption used for the conversion), so one cycle is 0.2 ns. One main-memory read takes about 100 ns, that is, 500 cycles. The multiplication and addition of one iteration need only one cycle, so if every read accesses main memory, almost all of the time is spent reading main memory.
This page raises two questions. Why the access speeds of registers and main memory differ so much is answered by Part 1. Whether there is a faster way to access memory when every iteration accesses main memory is answered by Part 2.
'''
# src:
# 
# `dot_product` 是向量内积：循环体每次读 `w[i]` 与 `x[i]`，乘后累加到 `sum`。`sum` 与 `i` 是没有地址的局部变量，保存在寄存器中，每次迭代只有这两次读取访问内存。数组 `w`、`x` 存放在内存中，各 $4n$ 字节，n 为 $10^6$ 量级时共 8 MB。
# 设处理器时钟为 5 GHz（这是一个假设，用来做换算），一个周期 0.2 ns。一次内存读取约 100 ns，即 500 个周期。一次迭代的乘法与加法只需要一个周期，如果每次读取都访问内存，几乎全部的时间都用于读内存。
# 这一页提出两个问题。寄存器与内存的访问速度为什么相差这么大，由第一部分回答。每次迭代都访问内存时是否有更快的访存方式，由第二部分回答。


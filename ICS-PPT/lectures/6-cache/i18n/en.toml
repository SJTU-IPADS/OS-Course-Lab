['kv-naive.slide.1']
src_hash = '2adf0a5c'
text = 'Without a cache, step $t$ recomputes all $t$ pairs $k_i$, $v_i$ from $x_1, \ldots, x_t$ and then performs attention. Each cell in the figure is one k, v projection, that is, the product of $x_i$ with $W_K$ and $W_V$.'
# src:
# 
# 没有缓存时，第 $t$ 步从 $x_1, \ldots, x_t$ 重新计算全部 $t$ 个 $k_i$、$v_i$，再作注意力。图中每个格子是一次 k、v 投影，即 $x_i$ 与 $W_K$、$W_V$ 的乘积。

['kv-naive.highlight.1']
src_hash = 'f7b18e59'
text = '$T$ steps take $T(T+1)/2$ projections in total, of which only $T$ are necessary: $O(T^2)$'
# src: $T$ 步的投影共 $T(T+1)/2$ 次，必要的只有 $T$ 次，量级 $O(T^2)$

['kv-naive.notes.1']
src_hash = '998dd3e2'
text = '''
There are 6 frames, and each frame adds one step. The row of step s holds all k, v projections of this step: one for each position 1 to s. Orange cells are the k, v of the new token, and red cells were already computed in an earlier step and are computed again in this step. The statistics on the right are accumulated step by step by the script of the figure.
Frame 1: only x1, 1 projection, no repetition.
Frame 2: k1 v1 is recomputed once and k2 v2 is new, so this step has 2 projections, 3 in total, of which 1 is a repetition.
Frame 3: 3 projections in this step, 6 in total, of which 3 are repetitions.
Frames 4 to 6: 4, 5 and 6 projections in this step, 10, 15 and 21 in total, and 6, 10 and 15 repetitions.
Frame 6: 6 steps take 21 projections in total, of which 6 are necessary and 15 are repetitions. In general, T steps take 1 + 2 + ... + T = T(T+1)/2 projections, which is O(T²). The k, v of the i-th token are computed T − i extra times, with the same result each time.
A real context can reach tens of thousands of tokens, and repeated projections account for most of the work.
'''
# src:
# 
# 共 6 帧，每帧多一步。第 s 步的一行是这一步的全部 k、v 投影：位置 1 到 s 各一次。橙色格是新 token 的 k、v，红色格是在上一步已经算过的，这一步又算了一遍。右侧统计由图的脚本逐步累加。
# 第 1 帧：只有 x1，投影 1 次，没有重复。
# 第 2 帧：k1 v1 重算 1 次，k2 v2 新算，本步 2 次，累计 3 次，其中重复 1 次。
# 第 3 帧：本步 3 次，累计 6 次，其中重复 3 次。
# 第 4 至第 6 帧：本步 4、5、6 次，累计 10、15、21 次，重复 6、10、15 次。
# 第 6 帧：6 步共 21 次投影，必要的 6 次，重复的 15 次。一般地，T 步的投影次数为 1 + 2 + ... + T = T(T+1)/2，量级 O(T²)。第 i 个 token 的 k、v 被重复计算 T − i 次，每次结果相同。
# 实际的上下文可达数万个 token，重复的投影占绝大部分。

['kv-cache.title']
src_hash = '320c0270'
text = 'How the KV Cache Works'
# src: KV Cache 的做法

['kv-cache.slide.1']
src_hash = '98dd787b'
text = 'Because of the causal mask, $k_i$ and $v_i$ depend only on tokens at positions up to $i$ and do not change once computed, so they can be stored in the **KV Cache**. Each step computes $q_t$, $k_t$ and $v_t$ only for the new token, appends $k_t$ and $v_t$ to the cache, and then performs attention between $q_t$ and all $K$ and $V$ in the cache.'
# src:
# 
# 因果掩码使 $k_i$、$v_i$ 只依赖位置不超过 $i$ 的 token，算出之后不再改变，可以存入 **KV Cache**。每一步只为新 token 计算 $q_t$、$k_t$、$v_t$，把 $k_t$、$v_t$ 追加到缓存，再用 $q_t$ 与缓存中的全部 $K$、$V$ 作注意力。

['kv-cache.highlight.1']
src_hash = '41388192'
text = 'The projections of $T$ steps drop from $T(T+1)/2$ to $T$, and $O(T^2)$ becomes $O(T)$'
# src: $T$ 步的投影从 $T(T+1)/2$ 次降为 $T$ 次，$O(T^2)$ 变为 $O(T)$

['kv-cache.notes.1']
src_hash = 'aacd3611'
text = '''
There are 6 frames, and the cells are at the same positions as in the previous animation. The row of step s: the cell at position s is orange, the k, v computed in this step. The cells at positions 1 to s−1 are green, read from the cache and not recomputed.
The cache is on the right, with 6 positions allocated in advance. Step s appends k_s, v_s at position s (orange arrow), and then q_s reads positions 1 to s (green box).
Frame 1: the cache is empty, k1 v1 are computed and appended at position 1, and q1 reads position 1.
Frames 2 to 5: each step computes 1 new projection, 2, 3, 4 and 5 in total, and reads 2, 3, 4 and 5 cache positions.
Frame 6: 6 steps take 6 projections in total, compared with 21 in the previous animation. T steps take T projections, which is O(T).
The cache does not change the result of the computation. It only removes the repeated projections. Each step still performs attention over t positions, and the cost of this part is given in the measurement on the next page.
'''
# src:
# 
# 共 6 帧，格子的位置与上一个动画相同。第 s 步的一行：位置 s 的格子是橙色，是这一步新算的 k、v。位置 1 到 s−1 的格子是绿色，是从缓存读出的，没有重新计算。
# 右侧是缓存，预先分配了 6 个位置。第 s 步把 k_s、v_s 追加到位置 s（橙色箭头），然后 q_s 读取位置 1 到 s（绿色框）。
# 第 1 帧：缓存为空，计算 k1 v1，追加到位置 1，q1 读取位置 1。
# 第 2 至第 5 帧：每步新算 1 次，累计 2、3、4、5 次，读取缓存的位置数是 2、3、4、5。
# 第 6 帧：6 步共 6 次投影，上一个动画是 21 次。T 步的投影次数是 T，量级 O(T)。
# 缓存不改变计算的结果，只省去重复的投影。每步仍要对 t 个位置作注意力，这部分的计算量下一页的实测中给出。


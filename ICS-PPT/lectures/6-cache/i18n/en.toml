['cache-examples.slide.1']
src_hash = '85def195'
text = '''
- Registers are allocated by the compiler, and programs use them indirectly through variables. L1, L2 and L3 are managed by hardware, and a program cannot specify which block is placed where.
- The L1 cache is split into an instruction cache and a data cache, which hold the blocks used for instruction fetch and for data reads and writes respectively.
'''
# src:
# 
# - 寄存器由编译器分配，程序员通过变量间接使用。L1、L2、L3 由硬件管理，程序不能指定哪个块放在哪里。
# - L1 缓存分为指令缓存与数据缓存，分别保存取指令与读写数据所用的块。

['cache-examples.notes.1']
src_hash = '5f5b2be2'
text = '''
The latencies in the table are typical orders of magnitude and differ by a few cycles between processors.
The compiler allocates variables to registers. Caches are transparent to the programmer: the program reads and writes the same address, and the hardware decides which level the data comes from. Separate instruction and data caches in L1 let instruction fetch and data access proceed at the same time. L2 and L3 hold both instructions and data.
'''
# src:
# 
# 表中的延迟是典型的数量级，不同的处理器相差几个周期。
# 编译器把变量分配到寄存器。缓存对程序员透明，程序读写同一个地址，硬件决定数据来自哪一级。L1 的指令缓存与数据缓存分开，使取指与读写数据可以同时进行。L2 与 L3 同时保存指令与数据。


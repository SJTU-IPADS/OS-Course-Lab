src_hash = 'b1bf8637'
text = '''
Answers:
1. $2 \times 28 \times 4 \times 128 \times 2 = 57344$ B, that is, 56 KiB. For 32768 tokens it is 1.75 GiB.
2. The bytes read are $(15 + 1.88) \times 10^9$ B, and the upper limit is $10^{12} \div (16.88 \times 10^9) = 59.2$ token/s.
3. $28 / 4 = 7$ times, that is, 12.25 GiB. For Q4_0 it is $1.75 \times 4.5 / 16 = 0.492$ GiB.
4. 4, 19 and 76 blocks are needed respectively, 99 blocks in total, with **33** unfilled positions within the blocks. Preallocation leaves 10737 positions unused.
'''

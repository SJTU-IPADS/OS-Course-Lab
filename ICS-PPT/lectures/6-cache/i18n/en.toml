['rowcol-run.slide.1']
src_hash = '76bb89bc'
text = '''
- `rowcol.c` sums a $4096 \times 4096$ `int` matrix (64 MB) by accessing it by row and by column, and prints the time per element.
- The two functions differ only in the order of the loop indices.
'''
# src:
# 
# - `rowcol.c` 对 $4096 \times 4096$ 的 `int` 矩阵（64 MB）求和，分别按行和按列访问，输出计算每个元素的平均时间。
# - 两个函数只在循环的索引顺序上不同。

['rowcol-run.notes.1']
src_hash = '50a0e897'
text = '''
`W` in `rowcol.c` is a global $4096 \times 4096$ array of 64 MB. The inner loop of `sum_rows` varies the column index j, and the inner loop of `sum_cols` varies the row index i. Each function performs $2^{24}$ additions, compiled with `-O1` and without vectorization, and their instruction sequences differ only in the address increment.
Consecutive reads in `sum_rows` are 4 bytes apart, and in `sum_cols` they are $4096 \times 4 = 16384$ bytes apart. The time per element differs by about 12 times. The conclusion is that accesses with a large stride are much slower, and the text of the page uses only the relative relation.
The question raised by this page is: for the same number of elements, why is the access with addresses 16 KB apart an order of magnitude slower than the access with addresses 4 B apart?
'''
# src:
# 
# `rowcol.c` 中的 `W` 是 $4096 \times 4096$ 的全局数组，64 MB。`sum_rows` 的内层循环改变列号 j，`sum_cols` 的内层循环改变行号 i。两个函数各执行 $2^{24}$ 次加法，`-O1` 编译，不做向量化，两者的指令序列只在地址的增量上不同。
# `sum_rows` 的相邻两次读取相距 4 字节，`sum_cols` 的相邻两次读取相距 $4096 \times 4 = 16384$ 字节。每个元素的时间相差约 12 倍。结论是步长大的访问慢得多，页面文字只用相对关系。
# 这一页提出的问题是：访问同样多的元素，为什么地址相隔 16 KB 的访问比相隔 4 B 的慢一个数量级。

['section.cache-concept-section.title']
src_hash = '00866543'
text = 'The Concept of a Cache'
# src: 缓存的概念

['storage-levels.title']
src_hash = '967372e8'
text = 'Hardware levels of storage'
# src: 存储的硬件层次

['storage-levels.slide.1']
src_hash = '8d6f5227'
text = '- Registers, SRAM, DRAM, SSD and remote storage form the **memory hierarchy** in hardware. From top to bottom, capacity grows and access time grows overall.'
# src:
# 
# - 寄存器、SRAM、DRAM、SSD 与远端存储组成硬件上的**存储器层次结构**。自上而下，容量增大，访问时间总体增大。

['storage-levels.image.1.alt']
src_hash = '8d8a86ad'
text = 'The hardware levels from top to bottom are registers, SRAM, DRAM, SSD and remote storage, each marked with its access time and capacity'
# src: 硬件层次自上而下是寄存器、SRAM、DRAM、SSD 与远端存储，每层标出访问时间与容量

['storage-levels.image.1.footnote.1']
src_hash = '786a6af1'
text = 'RDMA (remote direct memory access): the network card reads and writes the memory of another machine directly, without involving the processor of that machine.'
# src: RDMA（remote direct memory access）：网卡直接读写另一台机器的内存，不经过对方的处理器。

['storage-levels.notes.1']
src_hash = '80248fc0'
text = '''
The access time of a register is one processor cycle, about 0.2 ns at 5 GHz, and its capacity is a few hundred bytes. The access times and capacities of SRAM, DRAM and SSD are orders of magnitude.
Remote storage is the memory, SSD or disk of other machines, accessed over the network. Within one machine room, one RDMA read takes about 2 to 3 µs, shorter than one SSD read. A round trip over the internet to a cloud server takes tens of milliseconds, about 10 to 50 ms within one country and up to 100 to 200 ms across continents. The capacity of remote storage is not limited by a single machine, so it sits at the lowest level.
'''
# src:
# 
# 寄存器的访问时间是一个处理器周期，按 5 GHz 约 0.2 ns，容量数百字节。SRAM、DRAM 与 SSD 的访问时间与容量都是数量级。
# 远端存储是其他机器上的内存、SSD 或磁盘，经网络访问。同一机房内用 RDMA 读一次约 2 至 3 µs，比 SSD 的一次读取短。经互联网访问云端服务器，一次往返约数十毫秒，同一国家内约 10 至 50 ms，跨洲可达 100 至 200 ms。远端存储的容量不受单台机器限制，所以放在最下层。

['cache-concept.title']
src_hash = '4ad5142d'
text = 'The general concept of caching'
# src: 缓存的一般概念

['cache-concept.slide.1']
src_hash = '3db3af7b'
text = '''
- A **cache** is a smaller, faster storage device that holds a subset of the data of a larger, slower device. Level $k$ caches the data of level $k+1$.
- Level $k+1$ is divided into numbered **blocks**, and data is transferred between adjacent levels in units of blocks. The block size varies from level to level.
- Level $k$ is smaller than level $k+1$ and can hold only a few of its blocks. In the figure, level $k$ has 4 positions and holds blocks 3, 8, 9 and 14 of the 16 blocks of level $k+1$.
'''
# src:
# 
# - **缓存**是较小较快的存储设备，保存较大较慢的设备中的一部分数据。第 $k$ 层缓存第 $k+1$ 层的数据。
# - 第 $k+1$ 层划分成编号的**块**，数据以块为单位在相邻两层之间传输。块的大小随层而不同。
# - 第 $k$ 层比第 $k+1$ 层小，只能保存其中的几个块。图中第 $k$ 层有 4 个位置，保存第 $k+1$ 层 16 个块中的 3、8、9 与 14。

['cache-concept.notes.1']
src_hash = 'a1a8a518'
text = '''
The bottom row of the figure is level k+1 with 16 blocks, numbered 0 to 15. The top row is level k with 4 positions, each holding a copy of one block, and the dashed lines point to the source of the copy. Each position of level k holds the data of some block of level k+1.
The block is the unit of transfer: when the processor reads a word and level k does not have it, the whole block containing the word is transferred. The block size varies by level: between registers and L1 the unit is the word, and between the cache and the next level the unit is the block.
Locality makes this structure effective: the data a program uses repeatedly and its neighbouring data stay in the upper levels, most references complete in the upper levels, and only a few access the lower levels. Therefore the speed of the whole hierarchy is close to that of the upper levels, and its capacity and cost per byte are close to those of the lower levels.
'''
# src:
# 
# 图的下排是第 k+1 层，共 16 个块，编号 0 到 15。上排是第 k 层，有 4 个位置，每个位置保存一个块的副本，虚线指向副本的来源。第 k 层的每个位置保存第 k+1 层某个块的数据。
# 块是传输的单位：处理器读一个字，第 k 层中没有这个字时，传输的是它所在的整个块。块的大小因层而异：寄存器与 L1 之间以字为单位，缓存与下一层之间以块为单位。
# 局部性使这个结构有效：程序反复使用的数据与它相邻的数据停留在上层，大部分引用在上层完成，只有少数引用访问下层。因此整个层次结构的速度接近上层、容量接近下层、每字节的成本接近下层。

['software-layers.title']
src_hash = '021b4f54'
text = 'What software can operate'
# src: 软件的操作范围

['software-layers.slide.1']
src_hash = '04ab824a'
text = '''
- The **operating system** runs on the hardware. It can operate the hardware only through device drivers, and it cannot modify the caches inside the hardware that are not exposed to software.
- **Applications** run on the operating system. They can use each kind of hardware only in a limited way, through the interfaces the operating system provides. The caches of an application are built on these interfaces.
'''
# src:
# 
# - **操作系统**运行在硬件上，只能通过驱动程序操作硬件，无法修改硬件内部未暴露的缓存。
# - **应用**运行在操作系统上，只能通过操作系统提供的接口有限制地使用各类硬件。应用的缓存建立在这些接口之上。

['software-layers.image.1.alt']
src_hash = '32a304c9'
text = 'The hardware is ordered by access speed from top to bottom. Applications use the operating system through interfaces, the operating system operates the SSD and the network card through device drivers, and it cannot modify the caches inside the hardware that are not exposed to software'
# src: 硬件按访问速度自上而下排列，应用通过接口使用操作系统，操作系统通过驱动程序操作 SSD 与网卡，无法修改硬件内部未暴露的缓存

['software-layers.notes.1']
src_hash = '0e5a0ee7'
text = '''
The right of the figure shows the hardware ordered by access speed from top to bottom, and the left shows applications and the operating system.
The caches inside the hardware are the L1 to L3 caches of the processor, the row buffer of DRAM and the cache inside the SSD, and the hardware decides which data they keep. Processors provide instructions that flush caches (such as `clflush` and `wbinvd`), and some processors can divide the L3 shares that each program may occupy, but software cannot specify which data is kept. The cache inside an SSD is managed by the firmware of its controller, and the operating system can only ask it to write data back.
Applications cannot operate devices directly. The SSD and the network are read and written through interfaces of the operating system. Memory is requested through an interface, and after that it is read and written directly by load and store instructions. To keep data for later use, an application places it in the memory it requested or writes it to a file on the SSD.
'''
# src:
# 
# 图中右侧是按访问速度自上而下排列的硬件，左侧是应用与操作系统。
# 硬件内部的缓存有处理器的 L1 至 L3 缓存、DRAM 的行缓冲与 SSD 内部的缓存，其中保留哪些数据由硬件决定。处理器提供清除缓存的指令（如 `clflush`、`wbinvd`），部分处理器能划分各程序可占用的 L3 份额，但软件不能指定保留哪些数据。SSD 内部的缓存由控制器的固件管理，操作系统只能要求它把数据写回。
# 应用不能直接操作设备。SSD 与网络通过操作系统提供的接口读写。内存通过接口申请，申请之后由加载与存储指令直接读写。应用要把数据保留下来再次使用，就把它放在申请到的内存中，或写成 SSD 上的文件。

['resource-cache.title']
src_hash = '5cfbc21e'
text = 'Resource cache on the SSD'
# src: SSD 上的资源缓存

['resource-cache.slide.1']
src_hash = '4c7dca72'
text = '''
- The resource files of a mobile game (textures, models, audio) are stored on cloud servers. ① On the first run or when resources are updated, the game downloads the resource files, ② writes them to the local SSD, and ③ on later runs reads them from the SSD without accessing the cloud.
- This is also a kind of **cache**: a faster device keeps part of the data of a slower device.
'''
# src:
# 
# - 手机游戏的资源文件（贴图、模型、音频）存放在云端服务器上。① 第一次运行或资源更新时，游戏下载资源文件，② 写入本地 SSD，③ 之后运行时从 SSD 读取，不再访问云端。
# - 这也是一种**缓存**：较快的设备保存较慢设备中的一部分数据。


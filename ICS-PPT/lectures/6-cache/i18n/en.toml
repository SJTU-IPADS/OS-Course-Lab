text = '''
- `int W[M][N]` is stored in row order (in the figure $M=N=4$), and the $N$ elements of row $i$ are adjacent in memory. The **stride** is the difference in address between consecutive references, measured in elements.
- The inner loop varies `j`, accesses the array by row, and references addresses 0, 4, 8, ... in turn, so the stride is 1.
'''
# src:
# 
# - `int W[M][N]` 按行存放（图中 $M=N=4$），第 $i$ 行的 $N$ 个元素在内存中相邻。**步长**是相邻两次引用的地址之差，以元素为单位。
# - 内层循环改变 `j`，按行访问，依次引用地址 0, 4, 8, ...，步长为 1。

['traverse-row.image.1.alt']
src_hash = '866def8d'
text = 'In row traversal, the colours of the two-dimensional array and of its arrangement in memory both change evenly from light to dark'
# src: 按行遍历时，二维数组与内存中的排列都由浅到深均匀变化

['traverse-row.slide.2']
src_hash = '7d4ee010'
text = '- The colour changes evenly from light to dark along the arrangement in memory: two references adjacent in time are also adjacent in address.'
# src:
# 
# - 颜色沿内存中的排列均匀地由浅变深：时间上相邻的两次引用，地址也相邻。

['traverse-row.notes.1']
src_hash = 'ffb10856'
text = '''
The upper part of the figure is the two-dimensional array W[4][4] as the program sees it. The number in each cell is the element itself, and its colour is the order in which the element is read, with pale yellow the earliest and dark blue the latest. The lower part is the arrangement of the same 16 elements in memory: the array is stored by rows, the 4 elements of row 0 come first, followed by rows 1, 2 and 3, and the number under each cell is the byte address. The matrix and its arrangement in memory on the next page are exactly the same, and only the summation loop differs.
In row traversal the order of reading is the same as the arrangement in memory, so the colours in the lower part change evenly from light to dark from left to right. Two references adjacent in time differ by 4 bytes in address, that is, one element. This is the case with the best spatial locality.
'''
# src:
# 
# 图的上半部分是程序看到的二维数组 W[4][4]，每个格子里的数字是元素本身，颜色是这个元素被读取的次序，浅黄最早，深蓝最晚。下半部分是同样 16 个元素在内存中的排列：二维数组按行存放，第 0 行的 4 个元素在最前，其后依次是第 1、2、3 行，格子下方的数字是字节地址。下一页的矩阵与内存排列完全相同，只有求和的循环不同。
# 按行遍历时，读取的次序与内存中的排列一致，下半部分的颜色从左到右均匀地由浅变深。时间上相邻的两次引用，地址相差 4 字节，也就是一个元素。这是空间局部性最好的情形。


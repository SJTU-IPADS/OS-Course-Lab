# - 工作集不超过某一层的容量时，数据留在这一层，吞吐率由这一层决定。工作集越过容量，吞吐率降到下一个平台。

['mountain-ridges.notes.1']
src_hash = 'ba707bfe'
text = '''
This shows the change along the working set size for the stride 1 and stride 8 columns of the heat map. The dashed lines on the horizontal axis are the capacities of the levels, and the name of each segment is marked above.
Stride 1: the L1 segment (8 KB to 32 KB) is 46.7 to 51.1 GB/s, the L2 segment (64 KB to 1 MB) is 41.7 to 45.0 GB/s, the L3 segment (2 MB to 8 MB) is 34.2 to 37.7 GB/s, and the main memory segment (32 MB to 128 MB) is 13.6 to 14.1 GB/s. When the working set is within the capacity, the reads from the second pass on all hit this level, so the curve forms steps, each corresponding to one level. This is temporal locality: the same data is read repeatedly, and the smaller the working set, the closer to the processor the level that holds it.
At stride 8, each read touches a new block, each step is lower, and the decline is steeper.
The capacity of L3 is 24 MB, and the curve declines gradually from 8 MB to 32 MB without an abrupt change at 24 MB.
'''
# src:
# 
# 这是热力图中步长 1 与步长 8 两列沿工作集大小的变化。横轴的虚线是各层的容量，各段的名字标在上方。
# 步长 1：L1 的段（8 KB 至 32 KB）为 46.7 至 51.1 GB/s，L2 的段（64 KB 至 1 MB）为 41.7 至 45.0 GB/s，L3 的段（2 MB 至 8 MB）为 34.2 至 37.7 GB/s，内存的段（32 MB 至 128 MB）为 13.6 至 14.1 GB/s。工作集在容量以内时，第二遍起的读都命中这一层，所以曲线分成台阶，每个台阶对应一层。这是时间局部性：同一批数据被重复读取，工作集越小，它所在的层越靠近处理器。
# 步长 8 时，每次读取一个新的块，每个台阶更低，下降更陡。
# L3 的容量是 24 MB，曲线在 8 MB 到 32 MB 之间逐步下降，没有在 24 MB 处突变。


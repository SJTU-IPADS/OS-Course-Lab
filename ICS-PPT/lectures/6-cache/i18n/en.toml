['dm-trace.notes.1']
src_hash = '817ccd92'
text = '''
Step by step (the blocks of addresses 0, 13 and 8 are all referenced for the first time, so these three misses are cold misses):
Address 0: the line of set 0 has valid bit 0, so it is a miss. Block 0 (addresses 0 and 1) is fetched and placed in set 0 with tag 0.
Address 1: it is in the same block as address 0, the line of set 0 has valid bit 1 and an equal tag, so it is a hit.
Address 13: set index 2, the line is invalid, so it is a miss. Block 6 (addresses 12 and 13) is fetched.
Address 8: set index 0, the line is valid but tag 1 differs from the tag 0 of the line, so it is a miss. Block 4 replaces block 0.
Address 0: block 0 has been replaced, so it is a miss. At this time sets 1 and 3 are still empty and only 2 of the 4 sets of the cache have been used, so this is a conflict miss.
'''
# src:
# 
# 逐次说明（地址 0、13、8 的块都是第一次被引用，这三次不命中是冷不命中）：
# 地址 0：组 0 的行有效位为 0，不命中。取出块 0（地址 0 和 1）放入组 0，标记 0。
# 地址 1：与地址 0 在同一个块，组 0 的行有效位为 1，标记相等，命中。
# 地址 13：组索引 2，行无效，不命中。取出块 6（地址 12 和 13）。
# 地址 8：组索引 0，行有效但标记 1 与行的标记 0 不等，不命中。块 4 替换块 0。
# 地址 0：块 0 已被替换，不命中。此时组 1 和组 3 仍是空的，缓存的 4 个组只用了 2 个，这是冲突不命中。

['dm-replacement.title']
src_hash = '96a1c3dd'
text = 'Line Replacement in a Direct-Mapped Cache'
# src: 直接映射缓存的行替换

['dm-replacement.slide.1']
src_hash = 'fd46eb24'
text = '''
- On a miss, the cache reads from main memory the whole block containing the address: the start address of the block is the address with the block offset cleared, and its length is $B$ bytes.
- The only line of the set is replaced by the new block: the data of the block is written, the tag is set to the tag of the address, and the valid bit is set to 1.
- Example: the read of address 13 misses; clearing the block offset gives 12, m[12] and m[13] are fetched, and they replace the line with tag 0 in set 2.
'''
# src:
# 
# - 不命中时，缓存从内存读出地址所在的整个块：块的起始地址是把地址的块偏移清零所得的地址，长度为 $B$ 字节。
# - 组中唯一的一行被新块替换：写入块的数据，标记写为地址的标记，有效位置 1。
# - 读地址 13 不命中，块偏移清零得到 12，取出 m[12] 与 m[13]，替换组 2 中标记为 0 的行。

['dm-replacement.notes.1']
src_hash = '6d304d8d'
text = '''
Replacement needs no choice: each set of a direct-mapped cache has only one line, and the replaced line is this line.
Frame 1: read address 13, binary 1101, with tag 1, set index 10 and block offset 1.
Frame 2: set index 2 selects set 2. The line holds block 2 (addresses 4 and 5) with tag 0.
Frame 3: the tag 0 of the line differs from the tag 1 of the address, so it is a miss.
Frame 4: clearing the block offset gives the start address 12 of the block. Main memory reads out block 6, that is, the two bytes at addresses 12 and 13. A fetch always takes a whole aligned block, so after one miss, the other addresses within the same block all hit.
Frame 5: the data of the block is written into this line, the tag is set to 1 and the valid bit to 1. Set 2 originally holds the block with tag 0, and after replacement it holds the block with tag 1.
'''
# src:
# 
# 替换时不需要选择：直接映射缓存每组只有一行，被替换的行就是这一行。
# 第一帧：读地址 13，二进制 1101，标记 1，组索引 10，块偏移 1。
# 第二帧：组索引 2 选出组 2。这一行保存块 2（地址 4 和 5），标记为 0。
# 第三帧：行的标记 0 与地址的标记 1 不等，不命中。
# 第四帧：块偏移清零，得到块的起始地址 12。内存按块读出块 6，即地址 12 和 13 的两个字节。取块总是取对齐的整个块，因此一次不命中之后，同一块内的其他地址都命中。
# 第五帧：块的数据写入这一行，标记写为 1，有效位置 1。组 2 原来保存标记为 0 的块，替换后保存标记为 1 的块。


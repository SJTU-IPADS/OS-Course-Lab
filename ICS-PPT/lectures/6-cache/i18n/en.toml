Question 1: miss rate = min(1, 4k/B). (a) k = 1. (b) Two consecutive accesses are 1024 ints apart, that is, 4096 bytes, so each access falls in a different block, and since the array is much larger than the cache, the same block is not used again before it is evicted. (c) k = 4, 4 × 4 / 64 = 1/4.

['locality.title']
src_hash = 'edbd9387'
text = 'The principle of locality'
# src: 局部性原理

['locality.slide.1']
src_hash = '0d87a656'
text = '''
- Programs tend to reference data that was referenced recently, and data whose addresses are adjacent to it; this property is called **locality**.
- **Temporal locality**: a memory location that has been referenced is likely to be referenced again in the near future.
- **Spatial locality**: after a memory location is referenced, the adjacent locations are likely to be referenced in the near future.
'''
# src:
# 
# - 程序倾向于引用最近引用过的数据，以及与它们地址相邻的数据，这个性质称为**局部性**。
# - **时间局部性**：被引用过的一个存储位置，很可能在不久之后再次被引用。
# - **空间局部性**：一个存储位置被引用之后，与它相邻的存储位置很可能在不久之后被引用。

['locality.slide.2']
src_hash = 'ca077dd9'
text = '- The accumulator `sum` in the loop is referenced in every iteration, which is temporal locality. The elements of array `w` are referenced in address order, which is spatial locality.'
# src:
# 
# - 循环中的累加变量 `sum` 在每次迭代被引用，是时间局部性。数组 `w` 的元素按地址顺序被引用，是空间局部性。

['locality.notes.1']
src_hash = 'c757a91a'
text = '''
Locality is a property of programs. In the left figure the horizontal axis is time and the vertical axis is address, and each point is a reference. The same address referenced eight times is temporal locality. Eight adjacent addresses referenced in turn is spatial locality.
Real programs have both kinds of locality at once: the variables and instructions in a loop body are used repeatedly, and arrays are traversed in index order. A program without locality, for example one that accesses a very large array in random order, has neither kind.
'''
# src:
# 
# 局部性是程序的性质。左图的横轴是时间，纵轴是地址，每个点是一次引用：同一个地址被引用八次，是时间局部性。八个相邻地址依次被引用，是空间局部性。
# 实际程序同时具有两种局部性：循环体里的变量与指令被反复使用，数组按下标顺序遍历。没有局部性的程序，例如按随机顺序访问一个很大的数组，两种局部性都没有。


['exercise-kv.slide.1']
src_hash = 'a8de77ea'
text = '''
1. A model has $L = 28$, $n_{kv} = 4$, $d_{head} = 128$, and the KV Cache is fp16. How many bytes is the KV Cache of one token? How many GiB for a context of 32768 tokens?
2. The weights of the model total 15 GB, the GPU memory bandwidth is 1 TB/s, the batch size is 1, and the context is 32768 tokens. What is the upper limit of the decoding speed in token/s? (1 GB = $10^9$ B)
3. If the number of KV heads is changed to 28, how many times the capacity of Question 1 is it? If the KV Cache is stored as Q4_0 (4.5 bits / element), how many GiB is the capacity of Question 1?
4. The block length is 16 tokens, and 3 requests currently have lengths 50, 300 and 1201. How many blocks does block allocation use in total, and how many unfilled positions are there within the blocks? How many unused positions are there with preallocation at the maximum length 4096?
'''

['metrics.notes.1']
src_hash = 'd453549a'
text = '''
The definitions must be stated exactly. Miss rate and hit rate are counted over an execution or an access sequence. The hit time includes the time to determine a hit, because this determination is needed whether the access hits or not. The miss penalty is the extra time on a miss and does not include the hit time.
The hit time in the table is the access latency of each level. The miss penalty is the difference between the access latencies of two adjacent levels: after an L1 miss, L2 supplies the data, the total time is 3.1 ns, which is 2.0 ns more than an L1 hit. After an L3 miss, main memory supplies the data, which takes 114.5 − 12.0 = 102.5 ns more. The figure on the right draws one L1 hit and one L1 miss to scale.
The average memory access time formula follows directly from these definitions: every access pays the hit time t_hit, and a fraction m of the accesses additionally pays the miss penalty t_pen.
'''
# src:
# 
# 定义要写准。不命中率与命中率针对一段执行或一个访问序列统计。命中时间包含判断命中所用的时间，因为不论命中与否都要先判断。不命中惩罚是不命中时多出的时间，不含命中时间。
# 表中的命中时间取各层的访问延迟。不命中惩罚取相邻两层访问延迟之差：L1 不命中后由 L2 提供数据，总时间是 3.1 ns，比 L1 命中多出 2.0 ns。L3 不命中后由内存提供数据，多出 114.5 − 12.0 = 102.5 ns。右图按比例画出 L1 的一次命中与一次不命中。
# 平均访存时间的公式直接来自这些定义：所有访问都花费命中时间 t_hit，其中比例为 m 的访问再花费不命中惩罚 t_pen。


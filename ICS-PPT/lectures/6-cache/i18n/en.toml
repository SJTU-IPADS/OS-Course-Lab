text = '''
The caches in the figure all have 8 lines: the direct-mapped cache has 8 sets of 1 line each, the 2-way or 4-way set-associative caches lie in between, and the fully associative cache has 1 set of 8 lines. The three models have the same capacity; the number of set index bits in the address decreases in this order, and the number of tags compared per access increases.

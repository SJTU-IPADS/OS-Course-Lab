text = 'Parameters as on the previous page. The GPU memory bandwidth is the published specification of the GeForce RTX 5090 with 32 GB of GDDR7, and the main memory bandwidth is the theoretical value of dual-channel DDR5-6400, 6400 MT/s × 8 B × 2. The unit of the last two columns is token/s.'
# src: 参数同上一页。显存带宽取自带 32 GB GDDR7 的 GeForce RTX 5090 的公布规格，内存带宽是双通道 DDR5-6400 的理论值 6400 MT/s × 8 B × 2。表中最后两列的单位是 token/s。

['kv-bandwidth.slide.2']
src_hash = '95342093'
text = 'K and V are read sequentially with stride 1, and each block is used completely. But the KV Cache is measured in GiB and the cache levels in KB to MB, and each byte is used only once per token. Every token therefore reads the whole KV Cache from GPU memory or main memory, and the read speed equals the bandwidth.'
# src:
# 
# 对 K、V 的读取是步长为 1 的顺序读，每个块被完整使用。但 KV Cache 以 GiB 计，各级缓存以 KB 至 MB 计，每个字节在一个 token 内只用一次，所以每个 token 都从显存或内存读出整个 KV Cache，读取的速度等于带宽。

['kv-bandwidth.notes.1']
src_hash = 'd581c331'
text = '''
Bytes read per token = weights 16.06 GB + context length × KV Cache per token (131072 B). For T = 4096 the KV Cache is 0.54 GB, 16.60 GB in total. For T = 131072 the KV Cache is 17.18 GB, 33.24 GB in total.
The speed limit is the bandwidth divided by the bytes: GPU memory at 1792 GB/s gives 108 and 54 token/s, and main memory at 102.4 GB/s gives 6.2 and 3.1 token/s. The actual speed is below the limit, and the limit is determined only by the bytes read.
Arithmetic intensity is the number of floating-point operations per byte. An fp16 element is 2 bytes, and one multiply-add is 2 floating-point operations, so about 1 FLOP/B. The ratio of the peak compute of a GPU to its memory bandwidth is on the order of a hundred FLOP/B, so the compute units are idle most of the time.
The requests in a batch share one read of the weights and each reads its own KV Cache. The larger the batch, the smaller the share of the weights in the total bytes read, and the more the KV Cache read dominates.
Relation to caches: the access sequence has stride 1 and the best spatial locality. The amount of data is far larger than the cache capacity and there are no repeated references, so the cache has no effect and the speed is determined by the bandwidth. Reducing the bytes read is the direct way to increase the decoding speed.
'''
# src:
# 
# 每个 token 读出的字节数 = 权重 16.06 GB + 上下文长度 × 每个 token 的 KV Cache（131072 B）。T = 4096 时 KV Cache 为 0.54 GB，共 16.60 GB。T = 131072 时 KV Cache 为 17.18 GB，共 33.24 GB。
# 速度上限用带宽除以字节数：显存 1792 GB/s 对应 108 与 54 token/s，内存 102.4 GB/s 对应 6.2 与 3.1 token/s。实际速度低于上限，上限只由读出的字节数决定。
# 算术强度是每字节完成的浮点运算数。fp16 的一个元素 2 字节，参加一次乘加即 2 次浮点运算，约 1 FLOP/B。GPU 的峰值算力与显存带宽之比在百 FLOP/B 量级，所以运算单元大部分时间空闲。
# 批量中的各请求共用一次权重的读取，各自读取自己的 KV Cache。批量越大，权重在总读出量中的占比越小，KV Cache 的读取越成为主要部分。
# 关系：访问序列的步长为 1，空间局部性最好。数据量远大于缓存的容量，且没有重复引用，缓存无从发挥作用，速度由带宽决定。减小读出的字节数，是提高解码速度的直接方法。

['kv-gqa.title']
src_hash = '54e339d6'
text = 'Grouped-Query Attention'
# src: 分组查询注意力

['kv-gqa.slide.1']
src_hash = '3e2d4440'
text = 'Both the capacity and the amount read are proportional to the number of KV heads $n_{kv}$. **Grouped-query attention** (GQA) lets a group of query heads share one K head and one V head.'
# src:
# 
# 容量与读出量都与 KV 头数 $n_{kv}$ 成正比。**分组查询注意力**（GQA）让一组查询头共享同一个 K 头与 V 头。

['kv-gqa.slide.2']
src_hash = 'c0ba7c14'
text = '''
- **MHA** gives every query head its own K and V heads, **MQA** has all query heads share one set, and **GQA** has every $g$ query heads share one set, $n_{kv} = n_q / g$.
- Llama 3.1 8B has 32 query heads and 8 KV heads, $g = 4$: the KV Cache of a 128k context drops from 64 GiB to 16 GiB.
- Cost: fewer KV heads reduce the expressiveness. The structure is fixed at training time.
'''
# src:
# 
# - **MHA** 每个查询头有自己的 K、V 头，**MQA** 全部查询头共享 1 组，**GQA** 每 $g$ 个查询头共享 1 组，$n_{kv} = n_q / g$。
# - Llama 3.1 8B 有 32 个查询头与 8 个 KV 头，$g = 4$：128k 上下文的 KV Cache 由 64 GiB 降到 16 GiB。
# - 代价：KV 头变少，表达能力减弱。结构在训练时确定。

['kv-gqa.notes.1']
src_hash = '39f37105'
text = '''
Each panel in the figure has 8 query heads (orange, the q computed in the current step), and below them are the K and V heads (light blue, kept in the cache). Each query head reads only the K and V heads connected to it.
MHA: 8 query heads correspond to 8 KV heads, and the cache size is the baseline. GQA: every 4 query heads share one KV head, 2 in total, and the cache is 1/4 of MHA. MQA: 8 query heads share 1, and the cache is 1/8 of MHA.
Llama 3.1 8B: 32 query heads, 8 KV heads, g = 4. With MHA, n_kv = 32, each token takes 512 KiB, and a 128k context takes 64 GiB. With GQA it is 16 GiB.
GQA does not change the number of query heads, so the amount of computation is almost the same. What is reduced is the K and V to store and read.
Cost: several query heads see the same K and V, so the difference between heads decreases. The model is trained with this structure from the start, or continues training from an MHA model with a small amount of data.
'''
# src:
# 
# 图中每个面板有 8 个查询头（橙色，当前步算出的 q），下方是 K、V 头（浅蓝，缓存中保存的）。每个查询头只读与它相连的 K、V 头。
# MHA：8 个查询头对应 8 个 KV 头，缓存的大小为基准。GQA：每 4 个查询头共享一个 KV 头，共 2 个，缓存为 MHA 的 1/4。MQA：8 个查询头共享 1 个，缓存为 MHA 的 1/8。
# Llama 3.1 8B：32 个查询头，8 个 KV 头，g = 4。若为 MHA，n_kv = 32，每个 token 为 512 KiB，128k 上下文为 64 GiB。GQA 为 16 GiB。
# GQA 不改变查询头的个数，计算量基本不变，减少的是要存储和读出的 K、V。
# 代价：多个查询头看到同样的 K、V，头与头之间的差异减少。模型在训练时就按这个结构训练，或从 MHA 模型出发用少量数据继续训练。


['exercise-locality-2.notes.1']
src_hash = '084294b7'
text = '''
1. `sum` is referenced in every iteration. In (a) adjacent iterations reference adjacent elements, so the stride is 1, and in (b) each iteration skips 7 elements, so the stride is 8.
2. For each reference: if the block stored at position $b \bmod 4$ is that block, it is a hit. Otherwise, the first appearance of a block is a cold miss; for a block that has appeared before, count the distinct other blocks referenced since its last reference: at least 4 is a capacity miss, and fewer than 4 is a conflict miss. The program simulate_misses computes this reference by reference, and the result is: cold, cold, cold, cold, cold, capacity, cold, conflict, hit, cold, conflict.
Among them, the 6th reference, to 0: the other blocks referenced since its last reference are 1, 2, 3 and 4, 4 blocks in total, so it is a capacity miss. The 8th reference, to 0: the only other block is 8, so it is a conflict miss. The 11th reference, to 1: the only other block is 5, so it is a conflict miss.
'''
# src:
# 
# 1. `sum` 在每次迭代被引用。(a) 相邻迭代引用相邻的元素，步长 1，(b) 每次跳过 7 个元素，步长 8。
# 2. 对每次引用：位置 $b \bmod 4$ 中保存的就是该块则命中。否则，块第一次出现是冷不命中。块出现过，则数自上次引用它以来被引用的其他不同块，不少于 4 个是容量不命中，少于 4 个是冲突不命中。由程序 simulate_misses 逐次计算，结果为 冷、冷、冷、冷、冷、容量、冷、冲突、命中、冷、冲突。
# 其中第 6 次引用 0：自上次引用它以来被引用的其他块是 1、2、3、4，共 4 个，是容量不命中。第 8 次引用 0：其他块只有 8，是冲突不命中。第 11 次引用 1：其他块只有 5，是冲突不命中。


# 
# 这是热力图中两行沿步长的变化：工作集 128 MB（数据在内存中）与 256 KB（数据在 L2 中）。
# 步长 1 时一个块的 8 个元素都被读取，只有第一次读需要取块。步长 2 时 4 个，步长 4 时 2 个，步长 8 时只有 1 个。步长从 1 到 8，每读一个元素平均要取的块数从 1/8 增加到 1，吞吐率随之下降。
# 步长 8 起每次读取都要一个新块，取一个块的时间与步长无关，所以 128 MB 一行在步长 8 至 15 约 1.6 至 2.1 GB/s。256 KB 一行在步长 8 之后下降缓慢。
# 步长 16 的一点（128 MB 为 1.1 GB/s）低于步长 8 至 15 的值，原因没有查明。


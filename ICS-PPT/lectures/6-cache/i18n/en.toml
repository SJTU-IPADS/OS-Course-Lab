['hierarchy-machine.notes.1']
src_hash = '6f413ecc'
text = '''
For each `index*` directory under `/sys/devices/system/cpu/cpu0/cache/`, `cacheinfo.sh` reads the six files `level`, `type`, `size`, `ways_of_associativity`, `coherency_line_size` and `number_of_sets`, and prints one line per cache. The four output lines are, in order, the L1 data cache, the L1 instruction cache, L2 and L3. The L1 data cache and instruction cache are separate; the type of L2 and L3 is Unified, that is, they hold both instructions and data.
The figure draws a cache as a table: each row is a set, each column is a way, and each cell of the table is a line of the cache, which holds one block of main memory. The number of ways is the number of lines in a set, the number of sets is the number of rows of the table, and the line size is the size of a block. `12-way`, `64 sets` and `line 64 B` in the output are these three numbers.
The capacity of a cache is the number of bytes held by all its lines: capacity = number of sets × number of ways × line size. For the L1 data cache it is $64 \times 12 \times 64\ \mathrm{B} = 48\ \mathrm{KB}$, and the parameters of L2 and L3 satisfy the same relation.
'''
# src:
# 
# `cacheinfo.sh` 对 `/sys/devices/system/cpu/cpu0/cache/` 下的每个 `index*` 目录读取 `level`、`type`、`size`、`ways_of_associativity`、`coherency_line_size` 与 `number_of_sets` 六个文件，按一行一个缓存打印。输出的四行依次是 L1 数据缓存、L1 指令缓存、L2 与 L3。L1 的数据缓存和指令缓存分开，L2 与 L3 的类型是 Unified，即同时保存指令与数据。
# 图把缓存画成一张表：每一行是一个组，每一列是一路，表中的每个格子是缓存的一行，一行保存内存中的一个块。路数是每组的行数，组数是表的行数，行长是块的大小。输出中的 `12-way`、`64 sets`、`line 64 B` 分别是这三个数。
# 缓存的容量是所有行保存的字节数：容量 = 组数 × 路数 × 行长。L1 数据缓存是 $64 \times 12 \times 64\ \mathrm{B} = 48\ \mathrm{KB}$，L2、L3 的各项参数同样满足这个关系。


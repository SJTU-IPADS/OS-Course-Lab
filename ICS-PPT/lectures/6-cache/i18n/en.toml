['read-transaction.slide.1']
src_hash = '5211ce21'
text = '''
- A **bus** is a set of parallel wires that carry address, data and control signals.
- The load instruction `movq A, %rax` triggers a **read transaction**: the word $x$ at main memory address $A$ is transferred to register `%rax`.
'''
# src:
# 
# - **总线**是一组并行的导线，携带地址、数据与控制信号。
# - 加载指令 `movq A, %rax` 触发一次**读事务**：把内存地址 $A$ 处的字 $x$ 传送到寄存器 `%rax`。

['read-transaction.slide.2']
src_hash = '6ab0874f'
text = '- At step ②, the processor waits for main memory; the waiting time is the time of one DRAM read.'
# src:
# 
# - 处理器在步骤 ② 等待内存，等待的时间是一次 DRAM 读取的时间。

['read-transaction.notes.1']
src_hash = 'f08be853'
text = '''
The dashed box in the figure is the processor chip, which contains the register file, the ALU and the bus interface. The bus interface connects through the system bus to the I/O bridge, and the I/O bridge connects through the memory bus to main memory.
The three frames are, in order: ① The processor puts address $A$ on the bus. ② Main memory reads $A$ from the bus, fetches word $x$ from DRAM and puts it on the bus. ③ The processor reads $x$ from the bus and copies it into register `%rax`.
Step ② includes the two-step DRAM read of row address and column address and is the slowest of the three steps. During this step the processor has no data to use.
'''
# src:
# 
# 图中虚线框是处理器芯片，里面有寄存器堆、ALU 与总线接口。总线接口经系统总线连到 I/O 桥，I/O 桥经内存总线连到内存。
# 三帧依次是：① 处理器把地址 $A$ 放到总线上。② 内存从总线读出 $A$，在 DRAM 中取出字 $x$，放到总线上。③ 处理器从总线读出 $x$，复制到寄存器 `%rax`。
# 步骤 ② 包含 DRAM 的行地址与列地址两步读取，是三步中最慢的一步，处理器在这一步里没有数据可用。


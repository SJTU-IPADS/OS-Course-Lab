['section.hit-miss-section.title']
src_hash = '7ad27743'
text = 'Hits and Misses'
# src: 命中与不命中

['cache-hit-miss.title']
src_hash = '7ad27743'
text = 'Hits and misses'
# src: 命中与不命中

['cache-hit-miss.slide.1']
src_hash = 'be96b218'
text = '''
- **Hit**: the block to be read is in level $k$ and is read directly from level $k$.
- **Miss**: the block to be read is not in level $k$; it is fetched from level $k+1$ and placed in level $k$.
'''
# src:
# 
# - **命中**：要读的块在第 $k$ 层中，直接从第 $k$ 层读出。
# - **不命中**：要读的块不在第 $k$ 层，从第 $k+1$ 层取出，放入第 $k$ 层。

['cache-hit-miss.slide.2']
src_hash = '64aaa841'
text = '- The **placement policy** decides where in level $k$ a fetched block is placed. When that position is occupied, the **replacement policy** decides which block is evicted.'
# src:
# 
# - **放置策略**决定取出的块放在第 $k$ 层的哪里。位置已被占用时，**替换策略**决定逐出哪个块。

['cache-hit-miss.notes.1']
src_hash = 'a07dd3b1'
text = '''
The three frames are, in order: read block 14, which is in level k, a hit. Read block 12, which is not among blocks 3, 8, 9 and 14 of level k, so it is a miss, and level k requests block 12 from level k+1. Block 12 is placed in level k and replaces block 8.
Here block 12 takes the position that held block 8, which is one outcome of the placement policy and the replacement policy together. Each policy admits many choices, and different caches adopt different ones.
The cost of a miss is fetching a block from level k+1, which is much slower than a hit. The higher the hit rate, the closer the average access time is to the access time of level k.
'''
# src:
# 
# 三帧依次是：读块 14，它在第 k 层，命中。读块 12，第 k 层的 3、8、9、14 中没有它，不命中，第 k 层向第 k+1 层请求块 12。块 12 放入第 k 层，替换了块 8。
# 这里块 12 放在原来保存块 8 的位置，是放置策略与替换策略共同决定的一种结果。两种策略有多种取法，不同的缓存采用不同的取法。
# 不命中的代价是从第 k+1 层取一个块，比命中慢得多。命中率越高，平均访问时间越接近第 k 层的访问时间。

['stride-1.title']
src_hash = 'b1684fa4'
text = 'Hits and Misses with Stride 1'
# src: 步长为 1 的命中与不命中

['stride-1.slide.1']
src_hash = '03f2750b'
text = '''
- In the figure a block is 4 adjacent elements and the cache holds 2 blocks. The **placement policy** decides where a block fetched into the cache is put: it can go in any position, and a free position is used when there is one. When the cache is full, the **replacement policy** decides which block is evicted: the block that has gone unused for the longest. When a step of the animation uses one of the two policies, the figure marks it below.
- The inner loop varies `j` and accesses the array by row, with stride 1. When the element read is not in the cache, the whole block is fetched into the cache.
'''
# src:
# 
# - 图中一个块是 4 个相邻的元素，缓存保存 2 个块。取入缓存的块用**放置策略**决定放在哪里：可以放在任一个位置，有空位时放入空位。缓存已满时用**替换策略**决定逐出哪个块：逐出最久没有被使用的块。动画中某一步用到其中一个策略时，图下方标出。
# - 内层循环改变 `j`，按行访问，步长为 1。读取的元素不在缓存中时，整个块被取入缓存。

['stride-1.slide.2']
src_hash = 'abb016ea'
text = '- Of the 4 reads in each block, only the first is a miss.'
# src:
# 
# - 每个块的 4 次读取中，只有第 1 次不命中。

['stride-1.notes.1']
src_hash = 'de956e96'
text = '''
There are 8 frames, and each frame reads one more element. The top left is the two-dimensional array as the program sees it, with each row corresponding to one block in memory. The top right is the cache. Below is the arrangement of the same 16 elements in memory, where every 4 adjacent elements form a block. The number at the top right corner of a cell is the order of reading, green means hit, and red means miss.
The cache here is simplified: a block can go in any position of the cache, and a free position is used when there is one (placement policy); when the cache is full, the block that has gone unused for the longest is evicted (replacement policy). A frame with a miss marks below the figure the policy used in that step.
Frame 1: read W[0][0]. The cache is empty and block 0 is not in the cache, so it is a miss, and the whole block 0 is fetched into the cache, using the placement policy: it goes into a free position. Frames 2 to 4: read W[0][1], W[0][2] and W[0][3]. They are in the same block as W[0][0], the block is already in the cache, and all are hits.
Frame 5: read W[1][0], which enters block 1. It is a miss, and block 1 is put into the other free position of the cache (placement policy). Row traversal uses only 2 blocks and no block is evicted, so the replacement policy is not used. Frames 6 to 8: read the other three elements of block 1, and all are hits.
The stride-1 reference pattern is the case with the best spatial locality: after each block is fetched into the cache, all its elements are used in turn, and only the first read of each block is a miss.
'''
# src:
# 
# 共 8 帧，每帧多读一个元素。左上是程序看到的二维数组，每一行对应内存中的一个块，右上是缓存，下方是同样 16 个元素在内存中的排列，每 4 个相邻的元素是一个块。格子右上角的数字是读取的先后，绿色表示命中，红色表示不命中。
# 这里的缓存是简化的：块可以放在缓存的任一个位置，有空位时放入空位（放置策略）；缓存已满时逐出最久没有被使用的块（替换策略）。不命中的帧在图下方标出这一步用到的策略。
# 第 1 帧：读 W[0][0]，缓存为空，块 0 不在缓存中，不命中，整个块 0 被取入缓存，用到放置策略：放入空位。第 2 到第 4 帧：读 W[0][1]、W[0][2]、W[0][3]，它们与 W[0][0] 在同一个块里，块已在缓存中，都命中。
# 第 5 帧：读 W[1][0]，进入块 1，不命中，块 1 放入缓存的另一个空位（放置策略）。按行遍历只用到 2 个块，没有块被逐出，替换策略没有用到。第 6 到第 8 帧：读块 1 的其余三个元素，都命中。
# 步长为 1 的引用模式是空间局部性最好的情形：每个块取入缓存之后，它的所有元素都被依次用到，每个块只有第一次读取不命中。


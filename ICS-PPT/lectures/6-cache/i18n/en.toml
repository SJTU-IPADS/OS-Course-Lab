src_hash = 'f941f999'
text = 'The KV Cache of a 128k context is as large as the model weights'
# src: 128k 上下文的 KV Cache 与模型权重一样大

['kv-size.notes.1']
src_hash = 'c3e35440'
text = '''
The 2 in the formula is K and V. Bytes per token = 2 × 32 × 8 × 128 × 2 = 131072 B = 128 KiB.
Context 4096: 4096 × 128 KiB = 512 MiB. Context 131072: 131072 × 128 KiB = 16 GiB.
Weights: 8.03 × 10^9 parameters at 2 bytes each, 16.06 GB in total, that is, 15.0 GiB.
The model is Llama 3.1 8B: 32 layers, 32 query heads, 8 KV heads, head dimension 128, context length 131072. The numbers are taken from the publicly released model configuration. For other models, substitute their numbers into the same formula.
The KV Cache here is for one request. When a server handles several requests at the same time, each request has its own copy, so the total capacity is multiplied by the concurrency and is often much larger than the weights.
'''
# src:
# 
# 公式中的 2 是 K 与 V。每个 token 的字节数 = 2 × 32 × 8 × 128 × 2 = 131072 B = 128 KiB。
# 上下文 4096：4096 × 128 KiB = 512 MiB。上下文 131072：131072 × 128 KiB = 16 GiB。
# 权重：8.03 × 10^9 个参数，每个 2 字节，共 16.06 GB，即 15.0 GiB。
# 模型取 Llama 3.1 8B：32 层，32 个查询头，8 个 KV 头，头维度 128，上下文长度 131072。数字取自公开发布的模型配置。其他模型的数字按同一公式代入。
# 这里的 KV Cache 是一个请求的。服务器同时处理多个请求时，每个请求各有一份，总容量乘以并发数，常常比权重大得多。

['kv-bandwidth.title']
src_hash = '47c80bc0'
text = 'Memory Traffic and Speed Limit of Decoding'
# src: 解码的访存量与速度上限

['kv-bandwidth.slide.1']
src_hash = '6bb76460'
text = '''
- With batch size 1, generating a token reads all the weights and the whole KV Cache once each. Each element takes part in only one multiply-add after it is read, so each byte read yields 1 floating-point operation.
- The number of floating-point operations a GPU completes per second is more than two orders of magnitude larger than the number of bytes it reads per second. The compute units wait for data, so decoding is **memory-bound**.
- Speed limit = GPU memory or main memory bandwidth ÷ bytes read per token.
'''
# src:
# 
# - 批大小为 1 时，生成一个 token 要把全部权重与整个 KV Cache 各读出一次。每个元素读入后只参加一次乘加，每读 1 字节只做 1 次浮点运算。
# - GPU 每秒能完成的浮点运算数比每秒能读入的字节数大两个数量级以上，运算单元在等待数据，解码是**访存受限**的。
# - 速度上限 = 显存或内存的带宽 ÷ 每个 token 读出的字节数。


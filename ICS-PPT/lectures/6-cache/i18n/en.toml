['outline.title']
src_hash = '5fd105e3'
text = 'Course Outline'
# src: 课程提纲

['outline.slide.1']
src_hash = '697a04e2'
text = '''
1. **Storage technology and memory access latency**: SRAM and DRAM, the bus transactions by which the processor reads and writes main memory, the speed gap between the processor and main memory.
2. **Locality and the memory hierarchy**: temporal and spatial locality, stride, the hardware levels and what software can operate, blocks, hits and misses in a cache, parameters and latencies of each cache level.
3. **Cache models and their access**: sets, lines and blocks, the tag, set index and block offset of an address, direct-mapped, set-associative and fully associative caches, replacement policies.
4. **Write policies, multilevel caches and performance metrics**: write-through and write-back, write-allocate and no-write-allocate, multilevel caches, average memory access time.
5. **Cache-friendly code**: accessing data in storage order, the six loop orders of matrix multiplication, the memory mountain.
6. **Caches in LLM inference**: repeated computation during generation, the approach and data structure of the KV Cache, capacity and memory traffic, methods to reduce the KV Cache, block-based allocation.
'''
# src:
# 
# 1. **存储技术与访存延迟**：SRAM 与 DRAM，处理器读写内存的总线事务，处理器与内存的速度差距。
# 2. **局部性与存储器层次结构**：时间局部性与空间局部性，步长，硬件层次与软件的操作范围，缓存中的块、命中与不命中，各级缓存的参数与延迟。
# 3. **缓存模型及其访问**：组、行与块，地址的标记、组索引与块偏移，直接映射、组相联与全相联缓存，替换策略。
# 4. **写策略、多级缓存与性能指标**：写直达与写回，写分配与非写分配，多级缓存，平均访存时间。
# 5. **缓存友好的代码**：按存储顺序访问数据，矩阵乘法的六种循环顺序，存储器山。
# 6. **大模型推理中的缓存**：生成时的重复计算，KV Cache 的做法与数据结构，容量与访存量，减小 KV Cache 的方法，按块分配。

['outline.notes.1']
src_hash = '5269e087'
text = '''
This lecture has six parts. Part 1 starts from the memory demand of `dot_product` and describes the composition of main memory and its speed gap to the processor. Part 2 uses locality and the hierarchy to show how this gap is narrowed. Part 3 explains how a cache decides from an address whether a block is in the cache. Part 4 covers writes, multilevel caches and cache metrics. Part 5 applies these to writing programs. Part 6 uses the KV Cache in LLM inference as an instance of a software cache to explain the capacity, memory traffic and allocation of a cache.
Every part except Part 4 ends with exercises.
All example programs of this lecture are under examples/ and can be compiled with gcc and run on any x86-64 Linux machine.
'''
# src:
# 
# 本讲分为六个部分：第一部分从 `dot_product` 对内存的需求出发，说明内存的构成与它同处理器的速度差距。第二部分用局部性和层次结构回答这个差距怎样被缩小。第三部分说明缓存怎样由地址判断一个块是否在缓存中。第四部分讨论写入、多级缓存和缓存的度量。第五部分把这些用到程序的编写上。第六部分用大模型推理中的 KV Cache 作为软件缓存的一个实例，说明缓存的容量、访存与分配。
# 除第四部分外，每个部分以练习结束。
# 本讲的示例程序均位于 examples/ 目录下，可在任意 x86-64 的 Linux 机器上用 gcc 编译运行。


['write-problem.title']
src_hash = '7adbbfcc'
text = 'Writes: The Consistency Problem'
# src: 写入的一致性问题

['write-problem.slide.1']
src_hash = 'c066101c'
text = 'The cache has several levels, and each level holds copies of some of the blocks of main memory. When a word is written, how are the copies in the levels updated?'
# src:
# 
# 缓存分多级，每一级保存内存中一部分块的副本。写入一个字时，各层的副本怎样更新？

['write-problem.slide.2']
src_hash = '81cc5168'
text = 'After a write, the new value must be propagated to the next level at some point.'
# src: 写入之后，新值必须在某个时刻更新到下一层。

['write-problem.notes.1']
src_hash = 'd0ff70be'
text = '''
From top to bottom the figure shows the processor, L1, L2 and main memory. Orange is a copy just written, and a red frame is an old value.
Frame 1: the block of x has a copy in every level, with the value 1. A read does not change a copy, so the three levels agree.
Frame 2: the processor writes x = 2. The block is in L1.
Frame 3: L1 updates its own copy, x in L2 and in main memory is still 1, and the three copies are inconsistent.
Frame 4: L1 needs to load another block and replaces this line. If the line is simply discarded, the new value 2 no longer exists in any level.
Frame 5: when x is read again, L1 misses and gets 1 from L2, so the program does not read the value it wrote. Hence after a write, the new value must be propagated to the next level at some point.
'''
# src:
# 
# 图中自上而下是处理器、L1、L2 与内存。橙色是刚写入的副本，红框是旧值。
# 第一帧：x 的块在每一层都有一份副本，值是 1。读不会改变副本，三层的值一致。
# 第二帧：处理器写 x = 2。该块在 L1 中。
# 第三帧：L1 更新自己的副本，L2 与内存中的 x 仍是 1，三份副本不一致。
# 第四帧：L1 要装入别的块，把这一行替换出去。如果替换时直接丢弃，新值 2 在任何一层都不存在。
# 第五帧：再读 x，L1 不命中，从 L2 取得的是 1，程序读到的不是它写入的值。因此写入之后，必须在某个时刻把新值更新到下一层。

['write-through.title']
src_hash = '41c058dc'
text = 'Write Hit: Write-Through'
# src: 写命中：写直达

['write-through.slide.1']
src_hash = '71612776'
text = '''
When the block containing the address written by the processor is already in the cache, this is a **write hit**.

The most naive approach is **write-through**: on each write hit, the word is written to the next level at the same time as the cache is updated, so all levels stay consistent, and a replaced line is simply discarded.
'''
# src:
# 
# 处理器写入的地址所在的块已在缓存中，称为**写命中**。
# 
# 最朴素的做法是**写直达**（write-through）：每次写命中，在更新缓存的同时把这个字写到下一层，各层始终一致，被替换的行直接丢弃。

['write-through.notes.1']
src_hash = '40e09617'
text = '''
The column on the right of the figure is the number of writes each level receives. One arrow carries one word.
Frame 1: the processor writes x = 2. The block is in L1, so this is a write hit, and L1 updates x. L2 and main memory still hold the old value.
Frame 2: L1 writes the word to L2 at the same time.
Frame 3: L2 writes the word to main memory at the same time, and the three copies are consistent. A line is consistent with the next level, needs no extra state, and is simply discarded when it is replaced.
Frame 4: the cost is that every write goes all the way to main memory. Writing the same word 100 times writes main memory 100 times, and the processor waits for main memory on every write.
'''
# src:
# 
# 图右侧一列是每一层被写入的次数。一个箭头表示传送一个字。
# 第一帧：处理器写 x = 2，该块在 L1 中，写命中，L1 更新 x。此时 L2 与内存仍是旧值。
# 第二帧：L1 同时把这个字写到 L2。
# 第三帧：L2 同时把这个字写到内存，三份副本一致。行与下一层一致，不需要额外状态，被替换时丢弃即可。
# 第四帧：代价是每次写都要传到内存。同一个字写 100 次，内存被写 100 次，处理器的每次写都要等内存写完。

['write-back.title']
src_hash = '45cf308d'
text = 'Write Hit: Write-Back'
# src: 写命中：写回

['write-back.slide.1']
src_hash = '78170807'
text = '''
**Write-back** updates only the cache, and the update of the next level is postponed until the line is replaced:
- Each line gains one **dirty bit**: D = 1 if the line has been written, meaning that it differs from the copy in the next level.
- When a line is replaced, a line with D = 1 is written to the next level as a whole block, and a line with D = 0 is discarded directly.
'''
# src:
# 
# **写回**（write-back）只更新缓存，下一层的更新推迟到该行被替换时：
# - 每行增加一位**脏位**（dirty bit）：行被写过则 D = 1，表示它与下一层的副本不同。
# - 被替换时，D = 1 的行整块写到下一层，D = 0 的行直接丢弃。

['write-back.notes.1']
src_hash = '12d81969'
text = '''
Each line in the figure has one more column, the dirty bit D. Four parallel arrows carry a whole block.
Frame 1: the processor writes x = 2, a write hit. Only L1 is updated, and the dirty bit D is set to 1. L2 and main memory still hold the old value.
Frame 2: the same word is written another 99 times. Each write updates only L1 and does not write the next level.
Frame 3: L1 replaces this line. D = 1, so the whole block is written to L2, and D of this line in L2 is set to 1.
Frame 4: L2 replaces this line. D = 1, so the whole block is written to main memory. The same word is written 100 times, and main memory is written once.
A line with D = 0 is consistent with the next level and is discarded directly when it is replaced.
'''
# src:
# 
# 图中每行多了一列脏位 D。四个并排的箭头表示传送整个块。
# 第一帧：处理器写 x = 2，写命中。只更新 L1，脏位 D 置 1。L2 与内存仍是旧值。
# 第二帧：同一个字再写 99 次，每次只更新 L1，不写下一层。
# 第三帧：L1 替换这一行。D = 1，把整个块写到 L2，L2 这一行的 D 置 1。
# 第四帧：L2 替换这一行。D = 1，把整个块写到内存。同一个字写 100 次，内存只被写 1 次。
# D = 0 的行与下一层一致，替换时直接丢弃。

['write-allocate.title']
src_hash = '032e4680'
text = 'Write Miss: Write-Allocate'
# src: 写不命中：写分配

['write-allocate.slide.1']
src_hash = '13809c73'
text = 'When the block containing the address written by the processor is not in the cache, this is a **write miss**. **Write-allocate** first brings the block from the next level into the cache and then proceeds as for a write hit.'
# src:
# 
# 处理器写入的地址所在的块不在缓存中，称为**写不命中**。**写分配**（write-allocate）先把该块从下一层取入缓存，再按写命中处理。

['write-allocate.slide.2']
src_hash = 'b3a23f61'
text = 'Write-back is usually paired with write-allocate: a written block stays in the cache, and later reads and writes hit.'
# src: 写回通常配写分配：写过的块留在缓存中，后续的读与写命中。

['write-allocate.notes.1']
src_hash = '4a81ba2f'
text = '''
Frame 1: the processor writes x = 2, this line of L1 is invalid, and the write misses.
Frame 2: the block is brought from L2 into L1. The four green arrows are the whole block.
Frame 3: the write proceeds as a write hit. When the next level is updated is decided by the write-hit policy, which is write-back in the figure: x in L1 is updated and D is set to 1.
Frame 4: later reads and writes of this block hit in L1. Written data is often read soon after, and adjacent elements are often written next, so write-allocate exploits both kinds of locality. Hence write-back is usually paired with write-allocate.
'''
# src:
# 
# 第一帧：处理器写 x = 2，L1 中的这一行无效，写不命中。
# 第二帧：把该块从 L2 取入 L1，四个绿色箭头表示整个块。
# 第三帧：按写命中处理。下一层何时更新由写命中的策略决定，图中是写回：更新 L1 的 x，D 置 1。
# 第四帧：之后对这个块的读写都在 L1 中命中。写过的数据常常随后被读到，相邻的元素常常紧接着被写，写分配利用了这两种局部性，因此写回通常配写分配。

['no-write-allocate.title']
src_hash = '22574177'
text = 'Write Miss: No-Write-Allocate'
# src: 写不命中：非写分配

['no-write-allocate.slide.1']
src_hash = '04ae80dc'
text = '**No-write-allocate** does not fetch the block and writes the word directly to the next level.'
# src:
# 
# **非写分配**（no-write-allocate）不取块，直接把这个字写到下一层。

['no-write-allocate.slide.2']
src_hash = 'aa59a800'
text = 'Write-through is usually paired with no-write-allocate: the write has already reached the next level, so no block is fetched.'
# src: 写直达通常配非写分配：写已到达下一层，无需取块。

['no-write-allocate.notes.1']
src_hash = '655e7323'
text = '''
Frame 1: the same starting point. The processor writes x = 2, this line of L1 is invalid, and the write misses.
Frame 2: no block is fetched. The word bypasses L1 and is written to L2, and L1 does not change.
Frame 3: when the next level is updated is decided by the write-hit policy, which is write-through in the figure: L2 writes the word to main memory at the same time.
Frame 4: a later read of x finds no block in L1 and misses, and only then is the block fetched from L2.
Under write-through every write already reaches the next level, so whether the block is in the cache does not affect correctness, and not fetching it saves one block transfer. Hence write-through is usually paired with no-write-allocate.
The two write-miss approaches and the two write-hit approaches are independent of each other, and in practice they are used in pairs.
'''
# src:
# 
# 第一帧：同样的起点，处理器写 x = 2，L1 中的这一行无效，写不命中。
# 第二帧：不取块，这个字绕过 L1 写到 L2，L1 不变。
# 第三帧：下一层何时更新由写命中的策略决定，图中是写直达：L2 同时把这个字写到内存。
# 第四帧：之后读 x，L1 中没有该块，读不命中，这时才从 L2 取块。
# 写直达每次写都已经到达下一层，缓存里有没有这个块不影响正确性，不取块可以省去一次块的传输，因此写直达通常配非写分配。
# 写不命中的两种做法与写命中的两种做法各自独立，实际使用时成对出现。

['icache-dcache.title']
src_hash = '068b8dba'
text = 'Instruction Cache and Data Cache'
# src: 指令缓存与数据缓存

['icache-dcache.slide.1']
src_hash = 'a126a489'
text = '''
The first-level cache is divided into an **instruction cache** and a **data cache**: instruction fetch reads the instruction cache, and data reads and writes access the data cache. Caches at the second level and below hold both instructions and data and are called **unified caches**.

Why they are separate:
- Instruction fetch and memory access do not wait for each other in the same cycle.
- The instruction cache is only read, so it needs no write policy and no dirty bit.
- Instructions and data never replace each other's blocks.
'''
# src:
# 
# 一级缓存分为**指令缓存**与**数据缓存**：取指令读指令缓存，读写数据访问数据缓存。二级及以下的缓存同时存放指令与数据，称为**统一缓存**。
# 
# 分开的原因：
# - 取指与访存在同一个周期互不等待。
# - 指令缓存只被读，无需写策略与脏位。
# - 指令与数据互相不会替换对方的块。

['icache-dcache.notes.1']
src_hash = 'dada3571'
text = '''
In one cycle, the processor fetches the next instruction and may also execute an instruction that reads or writes memory. With only one first-level cache, the two would have to queue. With separate caches, the fetch unit reads the instruction cache and the memory access unit accesses the data cache, and the two accesses do not wait for each other.
Instructions are only read, so the instruction cache only has blocks read in, with no write hits or write misses, and the arrows on the instruction side of the figure are one-way. Data is written, so the arrows on the data side are two-way.
The access pattern of instructions is sequential execution plus loops, and the access pattern of data depends on the program. Keeping them separate means that accesses of one kind do not replace the blocks of the other.
L2 holds instructions and data together and is called a unified cache, and L2 in the figure holds both instruction blocks and data blocks. The capacities in the figure are the parameters of an x86-64 processor: L1 instruction cache 32 KB, 8-way; L1 data cache 48 KB, 12-way; L2 cache 1280 KB, 20-way.
'''
# src:
# 
# 一个周期内，处理器要取下一条指令，还可能执行一条读写内存的指令。若只有一个一级缓存，两者要排队。分开以后取指部件读指令缓存，访存部件访问数据缓存，两个访问互不等待。
# 指令只被读取，因此指令缓存只有读入块，没有写命中与写不命中的问题，图中指令一侧的箭头是单向的。数据会被写，图中数据一侧的箭头是双向的。
# 指令的访问模式是顺序执行加循环，数据的访问模式取决于程序。分开存放使一方的访问不会把另一方的块替换出去。
# L2 同时存放指令与数据，称为统一缓存，图中 L2 里既有指令块也有数据块。图中的容量是一款 x86-64 处理器的参数：L1 指令缓存 32 KB、8 路，L1 数据缓存 48 KB、12 路，L2 缓存 1280 KB、20 路。

['multilevel.title']
src_hash = '400e8706'
text = 'Multilevel Caches'
# src: 多级缓存

['multilevel.slide.1']
src_hash = '85546cd0'
text = '''
The larger a cache is, the slower its lookup, so processors use multilevel caches:
- L1 is small and fast and serves most accesses.
- On an L1 miss, L2, L3, and main memory are accessed in turn.
- Capacity and latency increase level by level.
- Each core has its own L1 and L2, and all cores share L3.
'''
# src:
# 
# 缓存越大，查找越慢。处理器因此使用多级缓存：
# - L1 小而快，服务大部分访问。
# - L1 不命中时依次访问 L2、L3 与内存。
# - 容量与延迟逐级增大。

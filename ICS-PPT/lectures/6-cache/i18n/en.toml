['storage-compare.notes.1']
src_hash = '4404302d'
text = '''
The numbers in the table indicate orders of magnitude only. The cost per GB of adjacent rows differs by a few times to a few hundred times, and the access time differs by 10 to 1000 times. SRAM is taken as a standalone SRAM chip: an asynchronous SRAM of 8 Mbit (1 MB) with a 10 ns access time, whose retail price is about 17 USD per chip, that is, on the order of $10^4$ USD per GB. DRAM is taken from the October 2026 retail price of DDR5 modules, about 18 USD per GB, with DDR4 at about 8 USD. SSD is taken as NVMe SSDs, about 100 to 180 USD per TB, with 256 GB to 2 TB as the common capacity. Disk is taken as hard disk drives, about 20 to 45 USD per TB, with a capacity on the order of TB. As the cache inside a processor, SRAM costs far less: TSMC's 5 nm process holds about 32 Mb per square millimetre, and a 300 mm wafer is estimated at about 17,000 USD, which gives a silicon cost of about 60 USD per GB, excluding yield and profit, and not a retail price. Since 2025 the prices of DRAM and flash have risen sharply because of data-center demand; the costs in the table move with the market, and the relations of orders of magnitude between the rows stay the same.
The DRAM access time column gives 10–100 ns: the access time of the chip itself is about 20 ns, and the time for the processor to read once from main memory is about 100 ns, which includes the bus and the controller.
SSD and disk are given in the table to show that storage is divided into several tiers by capacity and speed. Each tier is one or two orders of magnitude larger and one or two orders of magnitude slower than the previous one.
'''
# src:
# 
# 表中的数字只表示数量级，相邻两行的每 GB 成本相差几倍至几百倍，访问时间相差 10 至 1000 倍。SRAM 取独立的 SRAM 芯片：容量 8 Mbit（1 MB）、10 ns 的异步 SRAM，单片零售价约 17 美元，即每 GB $10^4$ 量级。DRAM 取 2026 年 10 月 DDR5 内存条的零售价，约每 GB 18 美元，DDR4 约 8 美元。SSD 取 NVMe 固态硬盘，每 TB 约 100 至 180 美元，常见容量为 256 GB 至 2 TB。磁盘取机械硬盘，每 TB 约 20 至 45 美元，容量为 TB 量级。作为处理器内的缓存，SRAM 的成本低得多：台积电 5 nm 工艺每平方毫米约容纳 32 Mb，一片 300 mm 晶圆估价约 1.7 万美元，折合每 GB 约 60 美元的硅片成本，不含良率与利润，不是零售价。2025 年起 DRAM 与闪存的价格因数据中心需求大幅上涨，表中的成本随市场变动，各行之间的数量级关系不变。
# DRAM 的访问时间一栏给出 10–100 ns：芯片本身的访问时间约 20 ns，处理器从内存读取一次所用的时间约 100 ns，后者包含总线与控制器。
# SSD 与磁盘在表中给出，说明存储设备按容量与速度分成若干档，每一档比上一档大一两个数量级，也慢一两个数量级。


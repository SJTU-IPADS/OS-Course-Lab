['dm-conflict.slide.1']
src_hash = '13242948'
text = 'With 16 bytes of padding between `w` and `x`, the address of `x` is 48 and the misses drop to 4. Increasing $E$ to 2 lets one set hold two blocks and likewise removes this conflict.'
# src:
# 
# 在 `w` 与 `x` 之间填充 16 字节，`x` 的地址为 48，不命中降为 4 次。把 $E$ 增大到 2，同一组放得下两个块，同样消除这种冲突。

['dm-conflict.notes.1']
src_hash = '08ccf058'
text = '''
First frame: the block number is the address divided by 16. w occupies blocks 0 and 1, x occupies blocks 2 and 3, and the set number is the block number modulo 2, so w[0..3] and x[0..3] are both in set 0, and w[4..7] and x[4..7] are both in set 1. The loop reads w[0], x[0], w[1], x[1], ... in turn; each time the block to be used has just been replaced by a block of the other array, so all 16 reads miss, although the capacity of the cache is enough to hold the blocks in use of both arrays.
Second frame: the start address of x is changed to 48, that is, 16 bytes of padding are inserted between the two arrays. x[0..3] is in block 3 (set 1), x[4..7] is in block 4 (set 0), w[0..3] is in set 0, and w[4..7] is in set 1. For i from 0 to 3, w is in set 0 and x is in set 1; for i from 4 to 7, w is in set 1 and x is in set 0, so the blocks of the two arrays no longer contend for the same set. The first read of each block misses, 4 misses in total.
Another approach is to increase $E$: one set of a 2-way cache can hold the two blocks of w and x at the same time, and the access sequence likewise has only 4 misses.
'''
# src:
# 
# 第一帧：块号等于地址除以 16。w 占块 0 和块 1，x 占块 2 和块 3，组号是块号对 2 取余，所以 w[0..3] 和 x[0..3] 都在组 0，w[4..7] 和 x[4..7] 都在组 1。循环依次读 w[0]、x[0]、w[1]、x[1]……，每次读取要用的块刚被另一个数组的块替换，16 次读取全部不命中，而缓存的容量足够放下两个数组中正在用的块。
# 第二帧：x 的起始地址改为 48，即在两个数组之间插入 16 字节的填充。x[0..3] 在块 3（组 1），x[4..7] 在块 4（组 0），w[0..3] 在组 0，w[4..7] 在组 1。i 从 0 到 3 时 w 在组 0、x 在组 1，i 从 4 到 7 时 w 在组 1、x 在组 0，两个数组的块不再争用同一组。每个块第一次读取时不命中，共 4 次。
# 另一种做法是增大 $E$：2 路缓存的一个组可以同时放 w 与 x 的两个块，访问序列同样只有 4 次不命中。

['dm-index-bits.title']

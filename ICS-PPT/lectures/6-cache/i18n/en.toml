['design-factors.notes.1']
src_hash = '42994845'
text = '''
Each row answers the same question: when this parameter is increased, which metric improves and which gets worse.
A larger capacity keeps more data in the cache and reduces capacity misses, but a large cache is slow to search, so the hit time increases. A larger block brings more adjacent data in on each miss, so a program with good spatial locality has fewer cold misses. With the capacity fixed, the number of lines decreases, conflict misses increase, and more bytes are transferred per miss. A higher associativity lets one set hold more conflicting blocks, but each access compares more tags.
Write-back reduces writes to the next level, at the cost of a dirty bit per line and a write-back when a line is replaced. Write-through has neither, and every write goes to the next level.
These parameters are fixed when the processor is designed. On the same processor, different access sequences give different miss rates, and the access sequence is what the programmer can change.
'''
# src:
# 
# 每一行回答同一个问题：把这个参数调大，哪个指标改善、哪个指标恶化。
# 容量增大使更多的数据留在缓存中，容量不命中减少，但大缓存查找慢，命中时间增大。块增大使每次不命中取入更多相邻数据，空间局部性好的程序冷不命中减少。容量不变时行数减少，冲突不命中增加，一次不命中传输的字节也更多。相联度增大使一个组能容纳更多冲突的块，但每次访问要比较更多的标记。
# 写回减少对下一层的写，代价是每行一位脏位与行被替换时的写回。写直达没有这些，每次写都到下一层。
# 这些参数在处理器设计时确定。同一个处理器上，访问序列不同，不命中率不同，这是编写程序时能够改变的。


['matmul-def.notes.1']
src_hash = '3a4c67f4'
text = '''
The number of operations in matrix multiplication is the cube of n: the n² elements of C each need n multiply-adds. The three loop variables i, j, k of the triple loop can be nested in any order, 6 in all, and the operations and the result are the same, while the order of the accesses differs.
A[i][k], B[k][j] and C[i][j] are all stored in row order in memory: adjacent elements of a row are adjacent, and adjacent elements of a column are n doubles apart.
In the assumptions of the analysis, a 64-byte block holds 8 doubles. n is large, so the cache cannot hold the n blocks that contain one column: when B is accessed along a column, each access falls in a different block, and by the time the next element of the same column is reached this block has been replaced, so every reference along a column misses. In the figure, orange marks the elements used to compute C[i][j].
The six orders are divided into three classes by the inner-loop variable, and each class has two forms.
'''

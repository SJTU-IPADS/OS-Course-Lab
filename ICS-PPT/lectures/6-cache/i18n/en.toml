['stride-k.notes.1']
src_hash = 'c206c09a'
text = '''
There are 8 frames, and each frame reads one more element. The two traversals access the same elements and differ only in the order of the outer and inner loops.
Frames 1 to 4: read W[0][0], W[1][0], W[2][0] and W[3][0] in turn. They are in blocks 0, 1, 2 and 3 respectively, so each read enters a new block, and all are misses. For the first two reads the cache has free positions and the block goes into a free position (placement policy). The cache holds only 2 blocks. When the 3rd element is read the cache is full, and the block unused for the longest is block 0, which is evicted (replacement policy); when the 4th element is read the block unused for the longest is block 1, which is evicted.
Frames 5 to 8: read W[0][1], W[1][1], W[2][1] and W[3][1]. W[0][1] is in the same block 0 as W[0][0], but block 0 was replaced 3 reads earlier, so it is still a miss, and this step also uses the replacement policy. The next three are the same.
In column access, two consecutive references belong to adjacent rows, and their addresses differ by the number of bytes of a whole row, that is, N × 4 bytes, which is 16 bytes in the figure. The larger the stride, the farther apart the addresses of consecutive references, and the fewer elements of a block are used.
'''
# src:
# 
# 共 8 帧，每帧多读一个元素。两种遍历访问同样的元素，只有外层循环与内层循环的次序不同。
# 第 1 到第 4 帧：依次读 W[0][0]、W[1][0]、W[2][0]、W[3][0]，分别在块 0、1、2、3 中，每次读取都进入一个新的块，都不命中。前两次读取时缓存有空位，块放入空位（放置策略）。缓存只保存 2 个块，读第 3 个元素时缓存已满，最久没有被使用的是块 0，它被逐出（替换策略）；读第 4 个元素时最久没有被使用的是块 1，它被逐出。
# 第 5 到第 8 帧：读 W[0][1]、W[1][1]、W[2][1]、W[3][1]。W[0][1] 与 W[0][0] 在同一个块 0 里，但块 0 在 3 次读取之前已被替换，所以仍然不命中，这一步也用到替换策略。后面三次同样。
# 按列访问时相邻两次引用分属相邻的两行，地址相差一整行的字节数，即 N × 4 字节，图中是 16 字节。步长越大，相邻两次引用的地址越远，一个块里被用到的元素越少。


['sa-cache.slide.1']
src_hash = '56500af6'
text = '''
- A cache with $1<E<C/B$ is a **set-associative cache**: each set has $E$ lines, called $E$-way set-associative.
- Each block of main memory maps to the set determined by the set index, and can be placed in any one of the $E$ lines of this set.
- Example: $S=2$, $E=2$. Blocks 0, 2, 4, 6 all map to set 0, and 2 of them can be in the cache at the same time.
'''
# src:
# 
# - $1<E<C/B$ 的缓存是**组相联缓存**：每组有 $E$ 行，称 $E$ 路组相联。
# - 内存的每个块映射到由组索引确定的组，可以放入这一组 $E$ 行中的任意一行。
# - 例：$S=2$，$E=2$。块 0、2、4、6 都映射到组 0，其中 2 个可以同时在缓存中。

['sa-cache.image.1.alt']
src_hash = '5b09ddea'
text = 'Blocks 0 to 7 of main memory map to 2 sets; blocks 0 and 2 both map to set 0 and take one line each, and block 1 is in set 1'
# src: 内存的块 0 至 7 映射到 2 个组，块 0 与块 2 都映射到组 0，各占组 0 的一行，块 1 在组 1

['sa-cache.notes.1']
src_hash = '7360f8a2'
text = '''
At a fixed capacity, when E grows S shrinks: C = S × E × B. The cache in the figure has 4 lines. Direct mapping needs 4 sets, and 2-way set-associative needs only 2 sets of 2 lines each.
Block $k$ of main memory maps to set $k \bmod 2$, the connecting lines in the figure are this mapping, and the tag is the quotient of the block number divided by 2.
Blocks 0 and 2 both map to set 0, and either line of set 0 can hold them, so the two blocks are in the cache at the same time, while in a direct-mapped cache they would take turns occupying the same line. Block 1 maps to set 1 and is placed in a line of set 1, and the blocks in set 0 are not affected.
When the number of blocks of one set exceeds E, replacement is still needed, but compared with direct mapping, more blocks of the same set can stay in the cache at the same time.
'''
# src:
# 
# 容量不变时，E 增大，S 就减小：C = S × E × B。图中的缓存有 4 行，直接映射需要 4 组，2 路组相联只需要 2 组，每组 2 行。
# 内存的块 $k$ 映射到组 $k \bmod 2$，图中的连线是这一映射，tag 是块号除以 2 的商。
# 块 0 和块 2 都映射到组 0，组 0 的两行都可以放，所以两个块同时在缓存中，直接映射缓存中它们要轮流占用同一行。块 1 映射到组 1，放入组 1 的一行，组 0 中的块不受影响。
# 同一组的块数超过 E 时仍然要替换，但与直接映射相比，同时可以留下的同组块多了。

['sa-access.title']
src_hash = '3112a851'
text = 'Access Steps of a Set-Associative Cache'
# src: 组相联缓存的访问步骤

['sa-access.slide.1']
src_hash = '832c4ad9'
text = '''
Read address 9 (binary 1001), the cache has $t=2$, $s=1$, $b=1$, $E=2$:
1. **Set selection**: the set index selects a set.
2. **Line matching**: all lines in the set are compared at the same time. A line with valid bit 1 and an equal tag is a hit. Otherwise it is a miss.
3. **Word extraction**: on a hit, the block offset extracts the byte within the block of that line.
'''
# src:
# 
# 读取地址 9（二进制 1001），缓存 $t=2$、$s=1$、$b=1$，$E=2$：
# 1. **组选择**：用组索引选出一组。
# 2. **行匹配**：同时比较组内各行，有效位为 1 且标记相等的行命中，否则不命中。
# 3. **字抽取**：命中时，用块偏移取出该行块内的字节。

['sa-access.notes.1']
src_hash = '1008aa20'
text = '''
The binary form of address 9 is 1001: tag 10, set index 0, block offset 1.
Set 0 has two lines, with tags 00 and 10. Both tags are compared with the tag 10 of the address at the same time; the second line has valid bit 1 and an equal tag, so it is a hit. The comparison circuit of this step exists once in every line, so an E-way set-associative cache needs E tag comparators.
Finally the block offset 1 extracts byte 1 of the block of this line, that is, m[9].
'''
# src:
# 
# 地址 9 的二进制是 1001：标记 10，组索引 0，块偏移 1。
# 组 0 有两行，标记分别为 00 和 10。两个标记同时与地址的标记 10 比较，第二行有效位为 1 且标记相等，命中。这一步的比较电路在每一行都有一份，E 路组相联需要 E 个标记比较器。
# 最后用块偏移 1 取出该行块内的第 1 个字节，即 m[9]。

['sa-example.title']
src_hash = '2927ac3b'
text = 'Access Sequence of a Set-Associative Cache'
# src: 组相联缓存的访问序列

['sa-example.slide.1']
src_hash = '3e1f7ae4'
text = '''
- A 2-way set-associative cache with $S=2$, $E=2$, $B=2$ bytes, capacity 8 bytes, address $m=4$ bits, $t=2$, $s=1$, $b=1$.
- Read the sequence 0, 8, 1, 9, 0, 8: the blocks of addresses 0 and 8 have the same set index, and in a 2-way cache they share the two lines of one set.
'''
# src:
# 
# - 2 路组相联缓存 $S=2$、$E=2$、$B=2$ 字节，容量 8 字节，地址 $m=4$ 位，$t=2$、$s=1$、$b=1$。
# - 读取序列 0、8、1、9、0、8：地址 0 与 8 所在的块组索引相同，在 2 路缓存中共用一个组的两行。

['sa-example.notes.1']
src_hash = '21155e03'
text = '''
Frame by frame (the cache is initially empty):
Frame 1, address 0: tag 00, set index 0, block offset 0. Both lines of set 0 are invalid, so it is a miss, and block 0 (addresses 0 and 1) is fetched into line 1.
Frame 2, address 8: tag 10, set index 0. The tag 00 of line 1 differs from 10 and line 2 is invalid, so it is a miss, and block 4 (addresses 8 and 9) is fetched into line 2. These two are cold misses, and both lines of set 0 are now valid.
Frame 3, address 1: it is in the same block as address 0, and the tag of line 1 is equal, so it is a hit.
Frame 4, address 9: it is in the same block as address 8, and the tag of line 2 is equal, so it is a hit.
Of the 6 reads, the first two are cold misses and the other 4 hit: a set has two lines, so block 0 and block 4 stay in the cache at the same time.
'''
# src:
# 
# 逐帧说明（缓存初始为空）：
# 第 1 帧，地址 0：标记 00，组索引 0，块偏移 0。组 0 的两行都无效，不命中，取出块 0（地址 0 和 1）放入第 1 行。
# 第 2 帧，地址 8：标记 10，组索引 0。第 1 行的标记 00 与 10 不等，第 2 行无效，不命中，取出块 4（地址 8 和 9）放入第 2 行。这两次是冷不命中，组 0 的两行都已有效。
# 第 3 帧，地址 1：与地址 0 在同一个块，第 1 行标记相等，命中。
# 第 4 帧，地址 9：与地址 8 在同一个块，第 2 行标记相等，命中。
# 第 5、6 帧，地址 0 与 8：块 0 与块 4 仍在组 0 的两行中，两次都命中。
# 6 次读取中，前两次是冷不命中，其余 4 次命中：组内有两行，块 0 与块 4 同时留在缓存中。

['sa-replacement.title']
src_hash = '50ab24c9'
text = 'Line Replacement in a Set-Associative Cache'
# src: 组相联缓存的行替换

['sa-replacement.slide.1']
src_hash = 'a7774fed'
text = '''
- On a miss, if the set has a line whose valid bit is 0, the new block is stored in that line.
- When all lines in the set are valid, the **replacement policy** selects the line to replace:
  - **Random**: select a line at random;
  - **Least recently used** (LRU): select the line that has gone unaccessed for the longest time;
  - **Least frequently used** (LFU): select the line with the fewest accesses.
'''
# src:
# 
# - 不命中时，组内有有效位为 0 的行，则用这一行存放新块。
# - 组内各行都有效时，由**替换策略**选出被替换的行：
#   - **随机**：随机选一行；
#   - **最近最少使用**（LRU）：选最长时间没有被访问的行；
#   - **最不经常使用**（LFU）：选被访问次数最少的行。

['sa-replacement.notes.1']
src_hash = '32b336c7'
text = '''
The figure shows one set of a 2-way cache, accessed with blocks A, B, A, C, B that map to this set. The number on the right of each line is the order of the most recent access that used this line, and the line with the smaller number is the least recently used.
Frame 1, access A: both lines of the set are invalid, so it is a miss, and A is placed in line 1.
Frame 2, access B: a miss, and B is placed in the invalid line 2. Now A has order 1 and B has order 2, and A is the least recently used.
Frame 3, access A: a hit, the order of A is updated to 3, and B becomes the least recently used.
Frame 4, access C: a miss, both lines are valid, so the least recently used B is replaced, and C has order 4.
Frame 5, access B: a miss, now A has order 3 and C has order 4, so the least recently used is A, and A is replaced.
LFU selects by access count, and the random policy records no information. A direct-mapped cache has one line per set, so the replaced line involves no choice. A hardware implementation of LRU must keep the access order of each set, and its cost grows with the number of ways. These implementation details are not expanded here.
'''
# src:
# 
# 图中是 2 路缓存的一个组，依次访问映射到这个组的块 A、B、A、C、B。每行右侧的数是最近一次使用这一行的访问次序，次序较小的行是最久未用的行。
# 第 1 帧，访问 A：组内两行都无效，不命中，A 放入第 1 行。
# 第 2 帧，访问 B：不命中，B 放入无效的第 2 行。此时 A 的次序为 1，B 的次序为 2，A 最久未用。
# 第 3 帧，访问 A：命中，A 的次序更新为 3，B 变成最久未用。
# 第 4 帧，访问 C：不命中，两行都有效，替换最久未用的 B，C 的次序为 4。
# 第 5 帧，访问 B：不命中，此时 A 的次序为 3，C 为 4，最久未用的是 A，替换 A。
# LFU 按访问次数选择，随机策略不记录任何信息。直接映射缓存每组只有一行，被替换的行没有选择。硬件实现 LRU 需要为每组保存访问顺序，路数较多时代价增大，这些实现细节不在这里展开。


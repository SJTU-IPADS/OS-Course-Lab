['friendly-miss-rate.notes.1']
src_hash = 'c2e2f8d1'
text = '''
Each row of the figure is the elements accessed in the same 64-byte block (16 ints), and the number in a cell is the order of access. Red is the first access within a block, green is another access within a block, and white elements are not accessed. A traversal with stride k accesses W[0], W[k], W[2k], ..., advancing 4k bytes each time.
Stride 1: the 16 elements of the block are accessed in turn, only the first access misses and the other 15 hit, and the miss rate is 1/16.
Stride 2: the block is accessed 8 times, and the miss rate is 1/8.
Stride 4: the block is accessed 4 times, and the miss rate is 1/4.
Stride 8: the block is accessed 2 times, and the miss rate is 1/2.
Stride 16: two adjacent accesses are 64 bytes apart, each block is accessed only once, every access misses, and the miss rate is 1. For k greater than 16 every access still misses, so the miss rate is min(1, 4k/B).
The three assumptions each have a role. Block alignment ensures that a block is counted from its first element. The initially empty cache ensures that the first access to each block misses. The array being much larger than the cache ensures that a block already used is not used again before the traversal ends, so there are no hits from repeated accesses.
'''
# src:
# 图中每行是同一个 64 字节的块（16 个 int）中被访问的元素，格中的数字是访问的次序。红色的是块内的第一次访问，绿色的是块内的其他访问，白色的元素不被访问。步长 k 的遍历访问 W[0]、W[k]、W[2k]……每次前进 4k 字节。
# 步长 1：块内 16 个元素依次被访问，只有第 1 次不命中，其余 15 次命中，不命中率 1/16。
# 步长 2：块内访问 8 次，不命中率 1/8。
# 步长 4：块内访问 4 次，不命中率 1/4。
# 步长 8：块内访问 2 次，不命中率 1/2。
# 步长 16：相邻两次访问相差 64 字节，每个块只访问 1 次，每次访问都不命中，不命中率 1。k 大于 16 时仍然每次访问都不命中，所以不命中率取 min(1, 4k/B)。
# 三条假设各有作用：起点对齐保证一个块从第一个元素算起。缓存起初为空保证每个块的第一次访问不命中。数组远大于缓存保证遍历结束前，已用过的块不会再被用到，也就没有因重复访问产生的命中。


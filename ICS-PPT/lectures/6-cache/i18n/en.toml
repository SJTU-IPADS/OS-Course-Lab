['exercise-kv-2.notes.1']
src_hash = '64921f38'
text = '''
The answers are computed by `_kv_exercise_numbers`.
1. Each token takes 57344 B = 56 KiB, and multiplying by 32768 gives 1879048192 B = 1.75 GiB.
2. Bytes read = weights 15 × 10^9 B + KV Cache 1879048192 B = 16879048192 B. With a bandwidth of 10^12 B/s, each token takes 16.88 ms, and the upper limit is 59.2 token/s.
3. 28 KV heads are 7 times 4, so the capacity is 12.25 GiB. The capacity of Q4_0 is 4.5 / 16 = 0.28125 of fp16, and 1.75 × 0.28125 = 0.492 GiB.
4. 50, 300 and 1201 tokens need ⌈50/16⌉ = 4, ⌈300/16⌉ = 19 and ⌈1201/16⌉ = 76 blocks, 99 blocks = 1584 positions in total, of which 1551 are filled, so 33 positions within blocks are unfilled, namely 14, 4 and 15. Preallocation takes 3 × 4096 = 12288 positions, of which 1551 are filled, and 10737 are unused.
'''
# src:
# 
# 答案由 `_kv_exercise_numbers` 计算。
# 1. 每个 token 57344 B = 56 KiB，乘 32768 得 1879048192 B = 1.75 GiB。
# 2. 读出的字节数 = 权重 15 × 10^9 B + KV Cache 1879048192 B = 16879048192 B，带宽 10^12 B/s，每个 token 需要 16.88 ms，上限 59.2 token/s。
# 3. 28 个 KV 头是 4 个的 7 倍，容量 12.25 GiB。Q4_0 的容量是 fp16 的 4.5 / 16 = 0.28125，1.75 × 0.28125 = 0.492 GiB。
# 4. 50、300、1201 个 token 各需 ⌈50/16⌉ = 4、⌈300/16⌉ = 19、⌈1201/16⌉ = 76 块，共 99 块 = 1584 个位置，已存放 1551 个，块内未填 33 个，分别为 14、4、15。预分配 3 × 4096 = 12288 个位置，已存放 1551 个，未使用 10737 个。

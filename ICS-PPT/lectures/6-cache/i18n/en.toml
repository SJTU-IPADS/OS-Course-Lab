['cache-between.title']
src_hash = '1ab7bc88'
text = 'The Cache Between the CPU and Main Memory'
# src: CPU 与内存之间的缓存

['cache-between.slide.1']
src_hash = '9f0d36d7'
text = '''
- The CPU requests a word (1 to 8 bytes) by **address**.
- The cache and main memory transfer data in units of **blocks**, where a block is a contiguous run of bytes in main memory with an aligned start address and a fixed length.
- The cache holds only part of the blocks of main memory. If the block containing the requested word is in the cache, the cache returns the word directly. If the block is not in the cache, the cache fetches the whole block from main memory.
- On receiving an address, the cache must determine whether the block containing the address is in the cache, and find it there.
'''
# src:
# 
# - CPU 用**地址**请求一个字（1 至 8 字节）。
# - 缓存与内存之间以**块**为单位传输，块是内存中起始地址对齐、长度固定的一段连续字节。
# - 缓存只保存内存的一部分块：请求的字所在的块在缓存中，缓存直接返回该字。块不在缓存中，缓存从内存取出整个块。
# - 缓存接到地址后，必须判断这个地址所在的块是否在缓存中，并在缓存中找到它。

['cache-between.notes.1']
src_hash = '4c3e37e3'
text = '''
CPU read and write requests are in units of words, and a word is 1 to 8 bytes. Transfers between the cache and main memory are in units of blocks, and a block is usually 64 bytes.
The capacity of the cache is far smaller than that of main memory, so it can hold only part of the blocks of main memory. At each request the cache gets only an address, and must answer two questions with it: whether the block containing the address is in the cache, and where in the cache the block is. The hardware answers both questions within one access, and the cache model is designed for this.
Frame 1: the CPU passes address A to the cache.
Frame 2: case one, the block containing A is in the cache, and the cache returns the word at A directly to the CPU without involving main memory.
Frame 3: case two, the block containing A is not in the cache, and the cache sends the address of the block to main memory.
Frame 4: main memory returns the whole block, and the cache stores it in a line.
Frame 5: the cache takes the word at A from this line and returns it to the CPU.
'''
# src:
# 
# CPU 的读写请求以字为单位，字长 1 至 8 字节。缓存与内存之间的传输以块为单位，一个块通常是 64 字节。
# 缓存的容量远小于内存，只能保存内存的一部分块。每次请求时，缓存只拿到一个地址，要用这个地址回答两个问题：它所在的块在不在缓存中，以及块在缓存的哪个位置。这两个问题由硬件在一次访问内完成，缓存模型就是为此设计的。
# 第一帧：CPU 把地址 A 交给缓存。
# 第二帧：情形一，A 所在的块在缓存中，缓存直接把 A 处的字返回给 CPU，内存不参与。
# 第三帧：情形二，A 所在的块不在缓存中，缓存把块的地址发给内存。
# 第四帧：内存返回整个块，缓存把它存入一行。
# 第五帧：缓存从这一行取出 A 处的字，返回给 CPU。

['cache-organization.title']
src_hash = '8430b3d4'
text = 'Sets, Lines and Blocks of a Cache'
# src: 缓存的组、行与块

['cache-organization.slide.1']
src_hash = 'c0c36669'
text = '''
- A cache consists of $S=2^s$ **sets**, and each set has $E$ lines.
- Each line holds the $B=2^b$ bytes of one block, plus 1 **valid bit** and $t$ **tag** bits.
- A valid bit of 1 means the line holds a block. The tag identifies the position of this block in main memory.
'''
# src:
# 
# - 缓存由 $S=2^s$ 个**组**构成，每组有 $E$ 行。
# - 每行保存一个块的 $B=2^b$ 字节，另有 1 位**有效位**和 $t$ 位**标记**。
# - 有效位为 1 表示该行保存着一个块。标记标识这个块在内存中的位置。

['cache-organization.image.1.alt']
src_hash = '09dac9f0'
text = 'A cache consists of S sets, each set has E lines, each line has a valid bit, a tag and a block of B bytes; the capacity C is the product of S, E and B'
# src: 缓存由 S 个组构成，每组 E 行，每行有有效位、标记和 B 字节的块；容量 C 等于 S、E、B 之积

['cache-organization.slide.2']
src_hash = '3994d583'
text = '- The capacity of a cache counts only data bytes: $C=S\times E\times B$.'
# src:
# 
# - 缓存的容量只计数据字节：$C=S\times E\times B$。

['cache-organization.notes.1']
src_hash = '006c05f4'
text = '''
The cache in the figure has $S=4$, $E=2$ and $B=8$.
A block is $B$ bytes of data, with $B=8$ in the figure. The bytes of a block are a contiguous stretch of main memory.
A line consists of a valid bit, a tag and a block. The valid bit and the tag are extra storage needed to manage the data. The tag is the high part of the address left after removing the set index and the block offset, and it identifies where the block is in main memory.
$E$ lines make up a set, with $E=2$ in the figure. The cache consists of $S$ sets, with $S=4$ in the figure. $S$ and $B$ are powers of 2, so $s$ bits and $b$ bits are enough to express the set number and the byte number within a block.
The capacity counts only data bytes, $4\times2\times8=64$ bytes, and the valid bits and tags are not counted in the capacity.
'''
# src:
# 
# 图中的缓存是 $S=4$、$E=2$、$B=8$。
# 块是 $B$ 字节的数据，图中 $B=8$。块的字节在内存中是连续的一段。
# 一行由有效位、标记和一个块构成。有效位和标记是管理数据所需的额外存储。标记是地址中除去组索引和块偏移之后的高位部分，标识块在内存中的位置。
# $E$ 行构成一组，图中 $E=2$。缓存由 $S$ 个组构成，图中 $S=4$。$S$ 与 $B$ 取 2 的幂，所以用 $s$ 位和 $b$ 位就能表示组号与块内字节号。
# 容量只计数据字节，$4\times2\times8=64$ 字节，有效位和标记不计入容量。

['cache-address.title']
src_hash = '14381722'
text = 'Tag, Set Index and Block Offset of an Address'
# src: 地址的标记、组索引与块偏移

['cache-address.slide.1']
src_hash = '34fef63b'
text = '''
- An $m$-bit address is divided, from the high bits to the low bits, into three fields: $t$ bits of **tag**, $s$ bits of **set index** and $b$ bits of **block offset**.
- The **block offset** selects a byte within the block. The **set index** selects a set in the cache. The **tag** is compared with the tags of the lines in the set to select a line.
- The widths of the fields are determined by the parameters of the cache: $s=\log_2 S$, $b=\log_2 B$, $t=m-s-b$.
'''
# src:
# 
# - $m$ 位的地址从高位到低位分为三个字段：$t$ 位**标记**，$s$ 位**组索引**，$b$ 位**块偏移**。
# - **块偏移**选出块内的字节。**组索引**选出缓存中的组。**标记**在组内与各行的标记比较，选出行。
# - 字段的位数由缓存的参数决定：$s=\log_2 S$，$b=\log_2 B$，$t=m-s-b$。

['cache-address.notes.1']
src_hash = '9fff3a4b'
text = '''
The division of an address depends only on the cache parameters $S$ and $B$. The block offset is the low $b$ bits of the address, and the $B$ addresses within one block have the same tag and set index and differ only in the block offset.
The set index determines the set in which a block is placed, and the tag distinguishes the different blocks that map to the same set. So the position of a block is determined by the set index, and the identity of a block is determined by the tag.
The division on this page holds for the three cache models, direct-mapped, set-associative and fully associative, and the three differ only in the number of lines in each set.
'''
# src:
# 
# 地址的拆分只取决于缓存的参数 $S$ 与 $B$。块偏移是地址的低 $b$ 位，同一个块内的 $B$ 个地址有相同的标记与组索引，只有块偏移不同。
# 组索引决定块放在哪个组，标记区分映射到同一个组的不同块。所以一个块的位置由组索引确定，块的身份由标记确定。
# 这一页的拆分对直接映射、组相联与全相联三种缓存模型都成立，三者的差别只是每个组里有几行。


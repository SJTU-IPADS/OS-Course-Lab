['dot-memory.slide.1']
src_hash = 'f5314717'
text = '''
- `sum` and `i` are local variables without addresses, so they are kept in registers, and the arrays `w` and `x` reside in main memory.
- With a 5 GHz processor clock, one cycle is 0.2 ns. One main-memory read takes on the order of 100 ns, equal to hundreds of cycles.
- If every iteration reads `w[i]` and `x[i]` from main memory, almost all of the computation time is spent reading main memory.
'''

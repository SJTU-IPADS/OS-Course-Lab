['multilevel.notes.1']
src_hash = '1ef5043c'
text = '''
The larger a cache is, the longer the paths for selecting the set, comparing tags, and transferring data, so larger caches have higher latency. With the same area and power, designers trade capacity against speed, and the multilevel structure balances the two.
L1 and L2 belong to each core, and L3 is shared by all cores. Only two cores are drawn in the figure, and the other cores are the same.
The animation on the right is one access in which the processor reads x, and x is only in L3.
Frame 1: the processor first accesses the L1 data cache, and it misses.
Frame 2: it accesses L2, and it misses.
Frame 3: it accesses L3, and it hits.
Frame 4: the block containing x is filled from L3 into L2 and then into L1. The closer a level is to the processor, the smaller and faster it is, and the block is filled back level by level.
Frame 5: x is sent from L1 to the processor. Afterwards, reading x again or other words in the same block hits in L1.
'''
# src:
# 
# 缓存越大，选择组、比较标记与传输数据的路径越长，因此大缓存的延迟更高。在同样的面积与功耗下，设计者在容量与速度之间取舍，用多级结构兼顾两者。
# L1 与 L2 属于每个核，L3 由所有核共享。图中只画出两个核，其余核同理。
# 右侧动画是处理器读 x 的一次访问，x 只在 L3 中。
# 第一帧：处理器先访问 L1 数据缓存，不命中。
# 第二帧：访问 L2，不命中。
# 第三帧：访问 L3，命中。
# 第四帧：含 x 的块从 L3 填入 L2，再填入 L1。越靠近处理器的层越小越快，块逐级填回。
# 第五帧：x 从 L1 送到处理器。之后再读 x 或同一块中的其他字，在 L1 中命中。


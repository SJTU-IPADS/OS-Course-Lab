['kv-generate.notes.1']
src_hash = '666ecabb'
text = '''
This part discusses LLM inference, that is, using a model to generate text after training is finished. An LLM processes text in tokens. The tokenizer splits the text into tokens, and a token can be a word, a Chinese character or a part of a word.
Autoregressive means that each output token becomes part of the input for generating the next token. In the figure, 5 tokens are input and the model outputs the 6th, which is appended to the end of the input, so the next step has 6 input tokens.
Each layer of the model contains attention and a feed-forward network. Attention makes the vector of a token depend on the tokens before it, and the next page gives its computation.
This page establishes only one quantity: step t processes the first t tokens. The following pages discuss whether the intermediate results of these t tokens are recomputed at every step.
'''
# src:
# 
# 本部分讨论大模型推理，推理指模型训练完成之后用它生成文本。大模型按 token 处理文本，token 由分词器切分，可以是一个词、一个汉字或词的一部分。
# 自回归的含义是：输出的每个 token 都作为输入的一部分参与下一个 token 的生成。图中输入 5 个 token，模型输出第 6 个，第 6 个接在输入末尾，下一步输入 6 个 token。
# 模型的每一层包含注意力与前馈网络。注意力使一个 token 的向量依赖于它之前的 token，下一页给出它的计算。
# 这一页只建立一个量：第 t 步要处理前 t 个 token。后面各页讨论这 t 个 token 的中间结果是否每步重新计算。

['kv-attention.title']
src_hash = '89e46e52'
text = 'Attention Computation'
# src: 注意力的计算

['kv-attention.slide.1']
src_hash = '24dddccc'
text = '''
An attention head in one layer multiplies the vector $x_i$ of the $i$-th token by three weight matrices to get the **query** $q_i$, **key** $k_i$ and **value** $v_i$, each of length $d$. The output of step $t$ is
 $$o_t = \mathrm{softmax}\!\left(\frac{q_t K^\top}{\sqrt d}\right) V$$
where row $i$ of $K$ and $V$ is $k_i$ and $v_i$ ($i = 1, \ldots, t$), and $o_t$ is a weighted sum of $t$ values.
'''
# src:
# 
# 一层中的一个注意力头把第 $i$ 个 token 的向量 $x_i$ 乘以三个权重矩阵，得到长度为 $d$ 的**查询** $q_i$、**键** $k_i$ 与**值** $v_i$。第 $t$ 步的输出为
#  $$o_t = \mathrm{softmax}\!\left(\frac{q_t K^\top}{\sqrt d}\right) V$$
# 其中 $K$、$V$ 的第 $i$ 行是 $k_i$、$v_i$，$i = 1, \ldots, t$，$o_t$ 是 $t$ 个值的加权和。

['kv-attention.highlight.1']
src_hash = 'c36c6dc5'
text = 'Step $t$ uses $k$ and $v$ of all $t$ positions. Do they have to be recomputed at every step?'
# src: 第 $t$ 步用到全部 $t$ 个位置的 $k$、$v$。它们要在每一步重新计算吗？

['kv-attention.notes.1']
src_hash = 'edb90214'
text = '''
An attention head has three weight matrices $W_Q$, $W_K$ and $W_V$, all of dimension $d_{model} \times d$. The vector $x_i$ of the i-th token is the output of the previous layer, and multiplying it by the three matrices gives $q_i = x_i W_Q$, $k_i = x_i W_K$ and $v_i = x_i W_V$.
The figure reads from left to right: $q_t$ (1 × d) times $K^\top$ (d × t) gives the scores $s$ (1 × t), which are t inner products. After division by $\sqrt d$ and softmax, they become the weights $a$ (1 × t), which are non-negative and sum to 1. $a$ times $V$ (t × d) gives the output $o_t$ (1 × d), that is, t values added with these weights.
Causal mask: when token t is generated, tokens at positions greater than t do not exist, so the sequence has only positions 1 to t. During training the whole sequence is computed in parallel, and the mask ensures that the result at position i does not depend on tokens at positions greater than i. This property is used in the next two pages.
A real model has multiple heads, each with its own $W_Q$, $W_K$ and $W_V$, and the weights differ between layers. The analysis of one head in one layer applies to all of them.
This page raises a question: every step uses k and v of the first t positions. Are these quantities recomputed at every step?
'''
# src:
# 
# 一个注意力头有三个权重矩阵 $W_Q$、$W_K$、$W_V$，维度都是 $d_{model} \times d$。第 i 个 token 的向量 $x_i$ 是上一层的输出，乘以三个矩阵得到 $q_i = x_i W_Q$、$k_i = x_i W_K$、$v_i = x_i W_V$。
# 图自左向右：$q_t$（1 × d）乘 $K^\top$（d × t）得到 t 个内积组成的分数 $s$（1 × t）。除以 $\sqrt d$ 后经 softmax 得到权重 $a$（1 × t），权重非负且和为 1。$a$ 乘 $V$（t × d）得到输出 $o_t$（1 × d），即 t 个值按权重相加。
# 因果掩码：生成 token t 时，序列中位置大于 t 的 token 不存在，所以只有位置 1 到 t。训练时整个序列并行计算，掩码保证位置 i 的结果与位置大于 i 的 token 无关。这个性质在下面两页用到。
# 实际的模型有多个头，每个头各有一组 $W_Q$、$W_K$、$W_V$，各层的权重也各不相同。一个头一层的分析适用于全部。
# 这一页提出问题：每一步都用到前 t 个位置的 k 与 v，这些量是否每一步重新计算。


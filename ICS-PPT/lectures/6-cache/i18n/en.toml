['write-transaction.notes.1']
src_hash = '30f2fc4d'
text = '''
The three frames are, in order: ① The processor puts address $A$ on the bus, and main memory reads $A$ and waits for the data. ② The processor puts word $y$ from `%rax` on the bus. ③ Main memory reads $y$ from the bus and stores it at address $A$.
Read transactions and write transactions both pass through the same buses and main memory, and the processor accesses memory through these two kinds of transactions.
'''
# src:
# 
# 三帧依次是：① 处理器把地址 $A$ 放到总线上，内存读出 $A$ 后等待数据。② 处理器把 `%rax` 中的字 $y$ 放到总线上。③ 内存从总线读出 $y$，存入地址 $A$。
# 读事务与写事务都经过同一组总线与内存，处理器通过这两种事务访问内存。


['kv-quant.slide.2']
src_hash = 'ccce8768'
text = '''
- int8 takes 8 bits per element plus 16/32 bits of scale factor, 8.5 bits in total. Q4_0 takes 4 bits per element plus 0.5 bits, 4.5 bits in total.
- Cost: the quantization error enters the output of attention. Every read has to restore the values, which adds computation, but decoding is memory-bound and the gain from fewer bytes read is larger.
'''
# src:
# 
# - int8 每个元素 8 位加缩放因子的 16/32 位，共 8.5 位。Q4_0 每个元素 4 位加 0.5 位，共 4.5 位。
# - 代价：量化误差进入注意力的输出。每次读出都要还原，增加了运算，而解码受访存限制，读入的字节数减少带来的收益更大。

['kv-quant.notes.1']
src_hash = '37e0714e'
text = '''
Bytes per element b = bits ÷ 8. fp16 is 2 B. For int8, 32 elements take 32 B, plus a 2 B fp16 scale factor, 34 B in total, and 34 × 8 ÷ 32 = 8.5 bits. For Q4_0, 32 elements take 16 B, plus 2 B, 18 B in total, 4.5 bits.
KV Cache of a 128k context: 131072 × 128 KiB times bits ÷ 16. It is 16 GiB for fp16, 8.50 GiB for int8 and 4.50 GiB for Q4_0.
The speed limit still uses the bytes read per token: the weights 16.06 GB plus the KV Cache, divided by the bandwidth 1792 GB/s. After the KV Cache shrinks, the limit rises from 54 to 86 token/s. The weights can also be quantized, but only the KV Cache is changed here.
Quantization is performed once when k and v are appended, and restoring is needed on every read. Attention is computed on the restored floating-point numbers, and the error comes from quantization. The size of the error depends on the distribution of the data, and the page states only the direction.
'''
# src:
# 
# 每个元素的字节数 b = 位数 ÷ 8。fp16 为 2 B。int8 的 32 个元素占 32 B，加 2 B 的 fp16 缩放因子，共 34 B，34 × 8 ÷ 32 = 8.5 位。Q4_0 的 32 个元素占 16 B，加 2 B，共 18 B，4.5 位。
# 128k 上下文的 KV Cache：131072 × 128 KiB 乘 位数 ÷ 16。fp16 为 16 GiB，int8 为 8.50 GiB，Q4_0 为 4.50 GiB。
# 速度上限仍取每个 token 读出的字节数：权重 16.06 GB 加 KV Cache，除以带宽 1792 GB/s。KV Cache 变小后，上限从 54 提高到 86 token/s。权重也可以量化，这里只改 KV Cache。
# 量化在 k、v 追加时执行一次，读出时每次都要还原。注意力在还原后的浮点数上计算，误差来自量化。误差的大小取决于数据的分布，页面只陈述方向。

['kv-evict.title']
src_hash = '1c97264e'
text = 'Evicting Tokens'
# src: 淘汰 token

['kv-evict.slide.1']
src_hash = '249a4644'
text = 'The $T$ in the capacity formula can also be reduced: the cache keeps $k$ and $v$ of only a part of the tokens, so the capacity no longer grows with the context.'
# src:
# 
# 容量公式中的 $T$ 也可以减小：缓存只保留一部分 token 的 $k$、$v$，容量不再随上下文增长。

['kv-evict.slide.2']
src_hash = 'eaa4d5d7'
text = '''
- Which entry to evict when the cache is full is a question of replacement policy. A **sliding window** keeps the most recent $W$ tokens and evicts the earliest, which is first-in first-out.
- The first few tokens of a sequence receive large attention weights from almost all later tokens, and are called **attention sinks**. The output quality drops markedly when the window evicts them, and recovers when they are kept together with the window.
- Cost: the evicted $k$ and $v$ are no longer stored at any level, and later tokens can no longer attend to them.
'''
# src:
# 
# - 缓存满时淘汰哪一项是替换策略的问题。**滑动窗口**保留最近的 $W$ 个 token，淘汰最早的，是先进先出。
# - 序列最前面的几个 token 获得后续几乎所有 token 的较大注意力权重，称为**注意力汇聚点**。窗口淘汰它们后输出质量明显下降，与窗口一起保留则恢复。
# - 代价：被淘汰的 $k$、$v$ 不再存放在任何一层，之后的 token 不能再关注它们。

['kv-evict.slide.2.footnote.1']
src_hash = '83cc920f'
text = 'Xiao et al., Efficient Streaming Language Models with Attention Sinks, ICLR 2024.'
# src: Xiao et al., Efficient Streaming Language Models with Attention Sinks, ICLR 2024。

['kv-evict.notes.1']
src_hash = 'f35a6cfd'
text = '''
In the figure, the k, v of 16 tokens are in the cache, and the 17th (orange) is being generated. A gray dashed position means that its k, v have been evicted.
First row: keep everything, and the cache grows with t. Second row: sliding window W = 6 keeps positions 11 to 16, and positions 1 to 10 are evicted. The cache is fixed at 6 positions, independent of the context length. Third row: keep the first 4 positions as sinks plus the most recent 6, and the cache is fixed at 10 positions.
Correspondence with cache replacement policies: when a hardware cache is full, a policy such as LRU selects the line to replace, and here it selects the k, v of the token to evict. The sliding window evicts by order of position, which corresponds to first-in first-out. The difference is that a replaced line of a hardware cache is still in the next level and can be fetched again. Here the evicted k, v are not kept in any next level.
The sinks come from an observation in the literature: the k, v of the first few tokens receive a large attention weight even when their content is unimportant. With the window alone these tokens are evicted and the distribution of the attention weights is destroyed. Keeping them together with the window allows a very long sequence to be generated continuously with fixed capacity.
The cost is information loss: content outside the window can no longer be referenced. The window size and the number of sinks are parameters to be chosen.
'''
# src:
# 
# 图中 16 个 token 的 k、v 已在缓存中，第 17 个（橙色）正在生成。灰色虚线的位置表示 k、v 已被淘汰。
# 第一行：保留全部，缓存随 t 增长。第二行：滑动窗口 W = 6，保留位置 11 至 16，位置 1 至 10 被淘汰。缓存固定为 6 个位置，与上下文长度无关。第三行：保留最前 4 个位置作为汇聚点，再加最近 6 个，缓存固定为 10 个位置。
# 与缓存的替换策略的对应：硬件缓存满时用 LRU 等策略选出被替换的行，这里选出被淘汰的 token 的 k、v。滑动窗口按位置的先后淘汰，对应先进先出。区别在于硬件缓存的行被替换后仍在下一层，可以再取回。这里被淘汰的 k、v 没有下一层保存。
# 汇聚点来自文献的观察：前几个 token 的 k、v 即使内容无关紧要，也获得大量的注意力权重。仅用窗口时这些 token 被淘汰，注意力的权重分布被破坏。保留它们与窗口，可以在固定的容量下持续生成很长的序列。
# 代价是信息丢失：窗口之外的内容不再能被引用。窗口的大小与汇聚点的个数是需要选择的参数。

['kv-fragment.title']
src_hash = 'bab2c583'
text = 'Preallocation at the Maximum Length'
# src: 按最大长度预分配

['kv-fragment.slide.1']
src_hash = 'f563c5da'
text = 'A server handles many requests at the same time, and the final length of a request is unknown until generation ends. The most direct approach is to preallocate contiguous memory of the maximum length (4096 tokens in the figure) for each request.'
# src:
# 
# 服务器同时处理许多请求，请求的最终长度在生成结束前未知。最直接的做法是为每个请求预分配最大长度（图中 4096 个 token）的连续内存。

['kv-fragment.slide.2']
src_hash = '8a2a9d12'
text = 'Positions that are reserved but unused belong to this request and cannot be used by other requests. This is **internal fragmentation**. The number of requests that the same GPU memory can hold at the same time is reduced as a result.'
# src:
# 
# 预留而未使用的位置属于这个请求，其他请求不能使用，这是**内部碎片**。同一块显存能同时容纳的请求数因此减少。

['kv-fragment.notes.1']
src_hash = '31adb681'
text = '''
In the figure, 4 requests each reserve 4096 positions, and their current lengths are 37, 612, 1500 and 90. Blue is the positions that already hold k, v, and red is the positions that are reserved and unused. In total 16384 positions are reserved, 2239 are used, and the unused share is 86.3%.
The output length of a request is unknown until generation ends, so the only choice is to reserve the maximum allowed length. Otherwise, when the length exceeds the reservation, the whole cache has to be moved to a larger region of memory. Until the request ends, these reserved positions stay occupied.
Each request needs a contiguous region of memory. As requests of different sizes arrive and finish one after another, the free memory is split into small non-contiguous pieces, and a larger request cannot be placed even when the total free amount is enough. This is external fragmentation. The block allocation on the next page solves both kinds of fragmentation.
'''
# src:
# 
# 图中 4 个请求各预留 4096 个位置，当前的长度分别是 37、612、1500 与 90。蓝色是已经存放了 k、v 的位置，红色是预留而未使用的位置。合计预留 16384 个位置，已用 2239 个，未使用的占 86.3%。
# 请求的输出长度在生成结束前不知道，所以只能按允许的最大长度预留，否则长度超过预留时需要把整个缓存搬到更大的一段内存中。请求结束之前，这些预留的位置一直被占用。
# 每个请求要求一段连续的内存，大小不同的请求先后到达和结束，空闲的内存被分割成不连续的小段，较大的请求即使总空闲量足够也放不下，这是外部碎片。下一页的按块分配同时解决这两种碎片。

['kv-paged.title']
src_hash = 'cf0b1b55'
text = 'Block Allocation and the Block Table'
# src: 按块分配与块表

['kv-paged.slide.1']
src_hash = 'abc00a62'
text = 'The KV Cache is divided into fixed-size **blocks**, and each block holds $k$ and $v$ of $B$ tokens ($B = 4$ in the figure, and real systems often use 16). The **block table** records the mapping from the logical block numbers of a request to physical block numbers, and a block is allocated only when the request needs new positions.'
# src:
# 
# 把 KV Cache 划分为固定大小的**块**，每块容纳 $B$ 个 token 的 $k$、$v$（图中 $B = 4$，实际系统常取 16）。**块表**记录一个请求的逻辑块号到物理块号的映射，请求需要新位置时才分配一块。

['kv-paged.slide.2']
src_hash = '33baad07'
text = '$k$ and $v$ of position $i$ are at slot `i % B` of physical block `table[i / B]`. Each request wastes at most $B - 1$ positions.'
# src:
# 
# 位置 $i$ 的 $k$、$v$ 在物理块 `table[i / B]` 的第 `i % B` 个位置。每个请求至多浪费 $B - 1$ 个位置。

['kv-paged.notes.1']
src_hash = '030e721f'
text = '''
There are 6 frames. The right side is 12 physical blocks of 4 positions each, and the letter in a cell is the request. The left side is the block table of each request. Orange marks the block newly allocated or the token newly written in this step. Free blocks are allocated in order of the smallest number first.
Frame 1: A has 5 tokens and occupies 2 blocks, and B has 3 and occupies 1 block. The block table of A is 0→P0, 1→P1, and that of B is 0→P2.
Frame 2: B generates its 4th token and puts it into the last free slot of P2, with no new allocation.
Frame 3: B generates its 5th token. P2 is full, so P3 is allocated and the block table of B gains 1→P3.
Frame 4: C arrives, and its 6 tokens need 2 blocks, which are P4 and P5.
Frame 5: A finishes, and P0 and P1 are released. These two blocks can be used by other requests immediately.
Frame 6: D arrives, and its 9 tokens need 3 blocks. It takes the free blocks with the smallest numbers, P0, P1 and P6. The 3 blocks of D are not physically contiguous, and the block table records them in logical order.
When reading, attention visits the logical blocks in order. The B positions within a block are contiguous, and the blocks are reached through the block table. Within a block the read still has stride 1.
The wasted positions are only in the last block of each request, at most B − 1. The numbers at the lower left of each frame are counted by the script. The block table itself is small, since each block records only one number.
'''
# src:
# 
# 共 6 帧。右侧是 12 个物理块，每块 4 个位置，格中的字母是请求。左侧是各请求的块表。橙色表示这一步新分配的块或新写入的 token。空闲块的分配顺序是编号最小的优先。
# 第 1 帧：A 有 5 个 token，占 2 块，B 有 3 个，占 1 块。A 的块表是 0→P0、1→P1，B 的是 0→P2。
# 第 2 帧：B 生成第 4 个 token，放进 P2 的最后一个空位，没有新分配。
# 第 3 帧：B 生成第 5 个 token，P2 已满，分配 P3，B 的块表增加 1→P3。
# 第 4 帧：C 到达，6 个 token 需要 2 块，取到 P4、P5。
# 第 5 帧：A 结束，P0 与 P1 释放。这两块立即可被其他请求使用。
# 第 6 帧：D 到达，9 个 token 需要 3 块，取空闲块中编号最小的 P0、P1 与 P6。D 的 3 块在物理上不连续，块表按逻辑顺序记录它们。
# 读取时，注意力按逻辑块号依次访问，每块内的 B 个位置是连续的，块与块之间通过块表跳转。块内仍是步长为 1 的读取。
# 浪费的位置只在每个请求的最后一块，至多 B − 1 个。图中各帧左下角的数字由脚本统计。块表本身很小，每块只记录一个编号。

['kv-prefix.title']
src_hash = '98d2cd07'
text = 'sidebar: Prefix Caching'
# src: sidebar：前缀缓存

['kv-prefix.slide.1']
src_hash = '5d946740'
text = 'Many requests start with the same prefix, for example the same system prompt. **Prefill** is the phase that computes $k$ and $v$ of all tokens of the input at once, and the phase that then generates tokens one by one is **decode**.'
# src:
# 
# 许多请求以相同的前缀开头，例如同一个系统提示。**预填充**是一次算出输入中全部 token 的 $k$、$v$ 的阶段，之后逐个生成 token 的阶段是**解码**。

['kv-prefix.slide.2']
src_hash = '498c1647'
text = '''
- If the token sequences of a block and of all the blocks before it are the same, its $k$ and $v$ are the same and can be shared. When a request arrives, the blocks are looked up in order. A **hit** block is written into the block table and skips prefill, and computation restarts from the first block that misses.
- In the figure, request 2 hits 3 blocks and prefills only 11 tokens, 18.6% of all 59.
- Only complete blocks can hit. A shared block records the number of references to it and is released only when the count reaches 0.
'''
# src:
# 
# - 一个块与它之前所有块的 token 序列都相同，它的 $k$、$v$ 就相同，可以共用。请求到达时按块依次查找，**命中**的块写入块表并跳过预填充，从第一个未命中的块起重新计算。
# - 图中请求 2 命中 3 块，只预填充 11 个 token，占全部 59 个的 18.6%。
# - 只有完整的块能命中。共用的块记录被引用的次数，次数为 0 时才释放。

['kv-prefix.notes.1']
src_hash = '67020e3d'
text = '''
In the figure the block length is 16 tokens. The system prompt of request 1 has 48 tokens and occupies P0 to P2, and its input of 20 tokens occupies P3 and P4. Request 2 arrives with the same system prompt. Its first 3 blocks are found in the cache, and the block table is written directly as 0→P0, 1→P1, 2→P2, with green marking hits. Its own 11 tokens are computed again in P5, with orange marking misses.
Shared blocks are identified by the content of the block: the token sequence within the block plus the sequence of all tokens before it determine k, v, and a hash of this content is used as the lookup key. The prefix must be identical from the start of the sequence, and after a different insertion in the middle none of the later blocks hit.
This is similar to a hit in a hardware cache: if the cache already holds the needed data it is a hit, and a hit block is not read from the next level. Here a hit block is not computed again. The hit rate depends on whether the prefixes of requests are the same.
A block is referenced by several requests, so each block records its reference count and can be released only after all the requests end.
Prefill processes the whole input in parallel and is compute-heavy, while decode generates tokens one by one and is memory-traffic-heavy. Prefix caching reduces the computation of prefill, and also lets a request get its first token sooner.
'''
# src:
# 
# 图中块长 16 个 token。请求 1 的系统提示 48 个 token，占 P0 至 P2，输入 20 个 token 占 P3 与 P4。请求 2 到达，它的系统提示相同，前 3 块在缓存中找到，块表直接写入 0→P0、1→P1、2→P2，绿色表示命中。它自己的 11 个 token 在 P5 中重新计算，橙色表示未命中。
# 识别共用的块靠块的内容：块内的 token 序列加上它之前全部 token 的序列决定 k、v，对这些内容取哈希作为查找的键。前缀必须从序列开头起完全一致，中间插入不同的内容后，之后的块都不命中。
# 这与硬件缓存的命中类似：缓存中已有所需的数据则命中，命中的块不再从下一层读取，这里命中的块不再重新计算。命中率取决于请求的前缀是否相同。
# 块被多个请求引用，所以每个块记录被引用的次数，所有请求都结束后才能释放。
# 预填充一次并行处理整个输入，计算量大，解码逐个 token 生成，访存量大。前缀缓存减少的是预填充的计算量，也让请求更快得到第一个 token。


['dm-access.title']
src_hash = '8ac85f1c'
text = 'Access Steps of a Direct-Mapped Cache'
# src: 直接映射缓存的访问步骤

['dm-access.slide.1']
src_hash = '9b09b5d6'
text = '''
Read address 13 (binary 1101), the cache has $t=1$, $s=2$, $b=1$:
1. **Set selection**: the set index selects a set.
2. **Line matching**: if the valid bit of the line is 1 and its tag equals the tag of the address, it is a hit. Otherwise it is a miss.
3. **Word extraction**: on a hit, the block offset extracts the byte within the block.
'''
# src:
# 
# 读取地址 13（二进制 1101），缓存 $t=1$、$s=2$、$b=1$：
# 1. **组选择**：用组索引选出一组。
# 2. **行匹配**：该行的有效位为 1 且标记等于地址的标记，则命中，否则不命中。
# 3. **字抽取**：命中时，用块偏移取出块内的字节。

['dm-access.notes.1']
src_hash = '78863dd9'
text = '''
The binary form of address 13 is 1101: the high 1 bit is the tag 1, the middle 2 bits 10 are the set index 2, and the low 1 bit is the block offset 1.
The first frame selects set 2 with set index 2. The second frame compares: the line of set 2 has valid bit 1 and tag 1, equal to the tag of the address, so it is a hit. The third frame extracts byte 1 of the block with block offset 1, that is, m[13].
A valid bit of 0 or an unequal tag is a miss, and the cache must fetch the block from main memory.
'''
# src:
# 
# 地址 13 的二进制是 1101，高 1 位是标记 1，中间 2 位 10 是组索引 2，低 1 位是块偏移 1。
# 第一帧用组索引 2 选出组 2。第二帧比较：组 2 的行有效位为 1，标记为 1，与地址的标记相等，命中。第三帧用块偏移 1 取出块内第 1 个字节，即 m[13]。
# 有效位为 0 或标记不等时都不命中，缓存要从内存取块。


# 2. 该模型的权重共 15 GB，显存带宽 1 TB/s，批大小为 1，上下文 32768 个 token。解码速度的上限是多少 token/s？（1 GB = $10^9$ B）
# 3. 若 KV 头改为 28 个，第 1 题的容量是它的多少倍？若改存 Q4_0（4.5 位 / 元素），第 1 题的容量是多少 GiB？

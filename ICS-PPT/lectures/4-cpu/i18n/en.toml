['llm-decode-slow.slide.1']
src_hash = '3c4d0427'
text = '''
- Generating each token requires reading all model weights: Qwen3-VL-2B reads 0.968 GB per token, making weight-read frequency the determining factor for generation speed.
- When inputs for multiple tokens are known, weights are read once and applied across multiple vectors simultaneously: measured prompt processing at 1455.8 tokens/s versus token-by-token generation at 190.2 tokens/s.
- Computing multiple token positions in a single weight read reduces the number of weight reads. In autoregressive generation, however, <mark>subsequent tokens have not been produced yet</mark>.
'''
# src:
# 
# - 每生成一个词都要读取全部权重：Qwen3-VL-2B 每个词读取 0.968 GB，读取权重的次数决定生成速度。
# - 多个词的输入都已知时，权重只读取一遍，同时用于多个向量：提示词实测 1455.8 词/秒，逐词生成 190.2 词/秒。
# - 若读取一遍权重就能计算多个位置，即可减少权重的读取次数。但逐词生成时，<mark>后续的词尚未产生</mark>。

['llm-decode-slow.notes.1']
src_hash = '650bbea5'
text = '''
The theoretical lower bound on time to generate a token is total weight bytes divided by GPU memory bandwidth: weights must stream from memory to compute units, so this transfer time sets the minimum generation time per token. In the diagram, left side shows token-by-token generation: one input vector produces one token while streaming all weights once; right side shows prompt processing where all inputs are known: four vectors are processed simultaneously while streaming weights once, producing four tokens. Measured throughput differs by ~8× (examples/llm_stages.py, RTX 3060 Laptop, Qwen3-VL-2B Q4_0: 393 prompt tokens in 270.0 ms vs. 59 generated tokens in 310.1 ms).
Evaluating multiple positions adds negligible delay because streaming weights dominates execution time, leaving compute units waiting for data; passing multiple vectors simultaneously merely engages underutilized compute units in matrix multiplication.
The problem thus becomes: can multiple token positions be evaluated concurrently during generation? The obstacle is that inputs for subsequent positions have not been generated yet.
Question at the end of the page: Since subsequent tokens have not been generated, can they be predicted in advance?
'''
# src:
# 
# 生成一个词的时间下限是权重字节数除以显存带宽：权重必须从显存传到运算单元，传输一遍所需的时间就是生成一个词的最短时间。配图左边是逐词生成：输入一个向量，输出一个词，读取一遍权重；右边是提示词这类输入全部已知的情况：四个向量同时输入，权重仍只读取一遍，同时得到四个词。实测两者相差约 8 倍（examples/llm_stages.py，2026-10-07，RTX 3060 Laptop，Qwen3-VL-2B Q4_0：提示词 393 个词 270.0 ms，生成 59 个词 310.1 ms）。
# 多计算几个位置几乎不增加时间，原因在于读取权重占用了绝大部分时间，运算单元多数时候在等待数据；同时输入多个向量，只是让已读入的权重多参与几次乘法，运算单元有足够的余量。
# 因此问题转化为：逐词生成时能否同时输入多个位置？唯一的障碍是后续位置的输入词尚未产生。
# 页末的问题：后续的词尚未产生，能否先预测？


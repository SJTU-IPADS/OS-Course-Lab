# 
# 周期 4 至 6，`imull` 与 `addl %ecx,%r9d` 在等操作数，取指级与译码级照常工作，访存级在为 `movl` 读 `w[i]`：<mark>执行级连续 3 个周期没有指令可执行</mark>。图下方是周期 5 的五级。

['ooo-idle.notes.1']
src_hash = '09a501ba'
text = '''
The top diagram shows the previous space-time grid with Cycles 4 to 6 outlined in red; below is the hardware diagram for the five stages in Cycle 5, matching the format on the "Waiting for Write-Back: Stalling for 3 Cycles" page. Because instructions are buffered after decode, no pipeline registers stall.
Inspecting Cycle 5 stage by stage: fetch retrieves cmpl, decode processes addl $1,%eax; execute is a bubble; memory is in its second cycle of reading w[i] for movl; write-back is a bubble because memory was busy in Cycle 4 without producing outputs. Decoded imull and addl %ecx,%r9d wait inside the processor for operands. Execute is likewise a bubble in Cycles 4 and 6.
Execute remains idle for 3 consecutive cycles. The "Principles of Pipelining" page in Part 1 pointed out that pipelining aims to keep every hardware unit working on an instruction each cycle; waiting returns execute to an idle state. Longer memory latencies exacerbate this: main memory accesses of tens to hundreds of cycles leave execute idle for equal durations.
In Cycle 6: addl $1,%eax decoded in Cycle 5 with its operand %eax already available, and execute is idle; yet it cannot execute because program order places it behind imull and addl %ecx,%r9d.
Common misconception: assuming execute is idle because the processor lacks instructions. In Cycle 6, three decoded instructions reside in the processor, and operands for addl $1,%eax are ready; execute idles purely due to in-order execution constraints.
Question at the end of the page: During these 3 cycles, is there an instruction independent of w[i] that could execute early in the execute stage?
'''
# src:
# 
# 图上方是上一页的整张时空图，红色虚线框出 imull 等 w[i] 的周期 4 至 6；下方是周期 5 五级中的指令，画法与「等待写回：stall 3 个周期」一页的硬件图相同。本部分的处理器在译码之后保存等待的指令，所以这一周期没有级间寄存器 stall。
# 逐级看周期 5：取指级取 cmpl，译码级译码 addl $1,%eax，两级照常工作；执行级是 bubble；访存级在为 movl 读 w[i]，这是读的第 2 个周期；写回级是 bubble，因为周期 4 结束时访存级还在读，没有指令离开访存级。imull 与 addl %ecx,%r9d 已经译码，保存在处理器内部，在等操作数（图下方红字）。周期 4、6 的执行级同样是 bubble。
# 执行级在周期 4 至 6 连续空闲 3 个周期。第一部分「流水线原理」一页指出，流水线让每组硬件每个周期都为一条指令工作；等待让执行级又回到空闲状态。等待越长，执行级空闲的周期越多：访问主存要几十到上百个周期时，执行级空闲同样多的周期。
# 周期 6 的情况：addl $1,%eax 在周期 5 已经译码，它要的 %eax 早已就绪，执行级也空着，它仍不执行，因为按程序顺序它要排在 imull 与 addl %ecx,%r9d 之后。
# 学生易错：以为执行级空闲是因为处理器里没有指令。周期 6 处理器内部已有三条译码后的指令，其中 addl $1,%eax 的操作数已经就绪；执行级空着是按程序顺序执行的结果。

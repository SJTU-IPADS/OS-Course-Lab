['llm-spec-vs-branch.slide.1']
src_hash = '1caf9348'
text = 'Key commonality: **prediction affects only execution speed**. Verification is performed by the verifier, and mispredicted elements are squashed before results are written, ensuring the final output matches execution without speculation.'
# src:
# 
# 两者的共同点：**预测只影响速度**。判定由验证方完成，预测错误的部分在写入结果之前即被作废，因此结果与不预测时相同。

['llm-spec-vs-branch.notes.1']
src_hash = '2fe6e198'
text = '''
Line-by-line comparison: Row 1 identifies the source of uncertainty: CPU branch direction versus upcoming tokens. Rows 2 and 3 describe prediction mechanisms and speculative actions: branch predictors consult branch history to direct fetch; draft models consult context to propose tokens. Row 4 specifies verification: jl reads flags in execute to determine direction, while the target model verifies 4 token positions in a single weight read. Rows 5 and 6 detail outcomes: correct predictions incur no penalty, while mispredictions squash invalid speculative state. Row 7 confirms correctness: squashed CPU instructions have not committed to registers or memory; squashed draft tokens are replaced by target model choices, preserving the exact output sequence.
Distinction: the CPU predicts a single branch direction followed by instructions; speculative decoding predicts multiple tokens and evaluates multiple positions concurrently, eliminating multiple weight read passes when correct.
Common misconception: assuming speculative decoding delegates response generation to the draft model with occasional target corrections. Every output token is verified by the target model; the draft model merely enables multi-position verification per forward pass.
Question at the end of the page: Drafting takes time on the small model, and mispredictions incur redundant compute; does this achieve a net speedup overall?
'''
# src:
# 
# 逐行说明。第一行是不确定性的来源：CPU 不知道条件跳转的方向，模型不知道下一个词。第二、三行是预测及其后的处理：分支预测器依据这条跳转指令的历史记录预测，并按预测方向取指；小模型依据前文预测，并将预测的词加入输入。第四行是判定：jl 在执行阶段读标志位才能确定方向，大模型读取一遍权重同时判定 4 个位置。第五、六行是两种结果：预测正确时不额外耗时，预测错误时作废。第七行是正确性：CPU 作废的指令尚未写回，寄存器与内存未被修改；投机推理作废的只是候选，由大模型自己的词替换，输出序列不变。
# 不同之处：CPU 每次预测一个跳转方向，其后跟随若干条指令；投机推理一次预测 4 个词、一次判定 4 个位置，一次预测正确可减少多遍权重读取。
# 学生易错：将投机推理理解为小模型生成回答、大模型偶尔纠错。每个输出的词都经过大模型判定，小模型的作用是让大模型一次判定多个位置。
# 页末的问题：预测要花费小模型的时间，预测错误还有额外计算；总体是否有收益？


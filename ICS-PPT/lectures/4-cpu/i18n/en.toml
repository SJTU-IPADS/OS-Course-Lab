['branch.notes.1']
src_hash = '611b626b'
text = '''
The code on the left shows the loop exit with cmpl, jl, and the two instructions following the loop; the code on the right shows the beginning of the loop body at jump target .L3, both taken from the assembly listing in Lecture 3. cmpl computes i − n and sets flags in the execute stage; jl reads flags in its own execute stage (flags set by cmpl arrive via forwarding) and jumps back to .L3 when i < n. There are two candidates for the instruction following jl: when not jumping, it is sequentially followed by movl %r9d,%eax; when jumping, it is movslq %eax,%r8 at .L3.
This page has 4 frames. The space-time diagram shows only two rows: jl and its next instruction; below is the instruction in each of the five stages for the bold cycle, following the same format as the data hazard pages. Frame 1 (Cycle 1) fetches jl. Frame 2 (Cycle 2) decodes jl; the fetch stage must retrieve the next instruction, but because jl has not yet executed, it is unknown which instruction to fetch: shown as a gray dashed "?" cell on the space-time diagram and a "?" in the fetch stage of the hardware diagram. Frame 3 (Cycle 3) executes jl; the fetch stage still does not know; what was fetched in Cycle 2 advances to decode, also marked "?". The orange dashed line marks the end of Cycle 3: jl finishes execution, and only then is the branch direction resolved.
The final frame shows the simplest mitigation: waiting. After jl is fetched, the PC stalls at the clock edges ending Cycles 1 and 2, and the fetch stage retrieves no new instructions in Cycles 2 and 3 (two stall cells for the next instruction in the space-time diagram); registers between fetch and decode latch bubbles at the clock edges ending Cycles 2 and 3, leaving decode with bubbles in Cycles 3 and 4. At the end of Cycle 3, jl resolves, the PC loads the correct address, and the next instruction fetches in Cycle 4. The hardware diagram in the final frame remains Cycle 3: compared with Frame 3, the PC is marked stall, and the "?" in decode is replaced with bubble. The usage of stall and bubble here matches the "Stall and Bubble" page: stall halts the fetch stage, while bubble ensures the subsequent decode stage performs no operation.
Cost: 2 idle cycles follow every jl. In this example, the loop body along with cmpl and jl contains 7 instructions; waiting 2 extra cycles per iteration increases execution time by nearly 30%.
Common misconception: assuming the next instruction can simply be fetched sequentially and sorted out after jl resolves. Fetching sequentially already constitutes predicting "not taken"; the policy on this page fetches nothing and strictly waits for resolution.
Question at the end of the page: Each jl requires waiting 2 cycles. Can the fetch stage fetch an instruction without waiting for jl to resolve?
'''
# src:
# 
# 左边的代码是循环末尾的 cmpl、jl 与循环之后的两条指令，右边是跳转目标 .L3 处循环体的开头，都取自第 3 讲的汇编清单。cmpl 在执行阶段计算 i - n 并设置标志位；jl 在自己的执行阶段读标志位（cmpl 的标志位经转发送到），i < n 时跳回 .L3。jl 之后的「下一条指令」有两个候选：不跳时是顺序紧随其后的 movl %r9d,%eax，跳时是 .L3 处的 movslq %eax,%r8。
# 这一页有 4 帧。时空图只画 jl 与它的下一条两行；下方是周期号加粗的那个周期五个阶段中的指令，画法与 data hazard 各页相同。第 1 帧（周期 1）取进 jl。第 2 帧（周期 2）jl 在译码，取指级要取下一条，但 jl 还没有执行，不知道取哪一条：时空图上是灰色虚线的「?」格，硬件图的取指级也是「?」。第 3 帧（周期 3）jl 在执行，取指级仍不知道；周期 2 取进来的东西到了译码级，同样是「?」。橙色虚线标出周期 3 结束：jl 执行完，这时才知道跳不跳。
# 最后一帧是最简单的办法：等。jl 取进来之后，PC 在周期 1、2 结束的时钟沿 stall，取指级在周期 2、3 不取新指令（时空图中下一条的两个「停」格）；取指与译码之间的寄存器在周期 2、3 结束的时钟沿装入 bubble，译码级在周期 3、4 是 bubble。周期 3 结束时 jl 判定，PC 装入正确的地址，下一条在周期 4 取指。最后一帧的硬件图仍是周期 3：与第 3 帧相比，PC 标 stall，译码级的「?」换成了 bubble。这里 stall 与 bubble 的用法与「stall 与 bubble」一页相同：stall 让取指级停住，bubble 让它后面的译码级不做任何操作。
# 代价：每条 jl 之后都空出 2 个周期。本例循环体连同 cmpl、jl 共 7 条指令，每轮多等 2 个周期，执行时间增加近三成。
# 学生易错：以为下一条可以先按顺序取进来，等 jl 判定后再说。先按顺序取进来已经是在猜「不跳」；本页的做法是什么都不取，只等判定。

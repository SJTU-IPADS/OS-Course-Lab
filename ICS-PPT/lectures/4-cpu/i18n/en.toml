['pipeline-fig.notes.1']
src_hash = 'f2964c26'
text = '''
Throughput denotes the number of instructions completed per unit time, while latency denotes the time an individual instruction spends from entering fetch until completing write-back; pipelining improves overall throughput via overlapping execution without reducing the latency of a single instruction. In lecture phrasing, "one beat" corresponds to one clock cycle.
Common misconception 1: assuming pipelining shortens individual instruction execution time. Because pipeline registers introduce read/write overhead, total execution time for an individual instruction increases slightly; throughput gains arise from temporal overlap across instructions: 5 instructions no longer take 5 long single cycles; once the pipeline fills, an instruction completes every short cycle.
Common misconception 2: conflating the two meanings of "5". A 5-stage pipeline means an instruction passes through 5 hardware stages, ideally completing 1 instruction per cycle once full; the phrase "starting up to 5 instructions per cycle" mentioned in Lecture 3 relies on multiple-issue superscalar hardware, covered under "Superscalar Execution" in Part 3.
The five rows correspond to the five instructions of the loop body in program order; each cell indicates the pipeline stage of that instruction in that clock cycle. In Cycle 5, all five hardware stages are busy: movslq in write-back, movl in memory, imull in execute, addl %ecx,%r9d in decode, and addl $1,%eax in fetch. Starting from Cycle 5, one instruction finishes write-back each cycle (represented by the diagonal of dark write-back cells); the annotation to the right of row 1 indicates that single-instruction execution latency remains 5 cycles.
The diagram only depicts the 5 instructions of the loop body, leaving fetch blank after Cycle 6; in actual execution, the processor immediately fetches following instructions cmpl and jl, as well as movslq of the next iteration.
Time comparison: completing 5 instructions takes 5 long cycles in a single-cycle implementation and 9 short cycles in a 5-stage pipeline; in general, executing n consecutive instructions requires n + 4 short cycles, approaching 1 instruction per cycle as n grows large.
This diagram assumes an ideal hazard-free scenario where source operands are ready when needed during decode. In Cycle 5, when imull enters execute, the preceding movl is still in memory, so operand x[i] has not been loaded from memory yet; in Cycle 4, %r8 required for address calculation in movl was only computed by movslq in Cycle 3. Such data dependencies are addressed in Part 2, "Instruction Hazards in Pipelined Execution": computed results are delivered via forwarding, while load-use hazards require stalls; Part 2 splits memory-operand imull into two instructions, placing the load-use hazard on w[i].
Question at the end of the page: When stage delays are nonuniform (in the diagram on the "One Instruction per Clock Cycle" page, fetch, execute, and memory take longer than decode and write-back), which stage determines the pipeline clock cycle?
'''
# src:
# 
# 吞吐率指单位时间内执行完毕的指令数量，延迟指单条指令从进入取指级到完成写回级所经历的时间；流水线技术通过重叠执行提升整体吞吐率，单条指令的执行延迟并未缩短。讲稿口语中的「一拍」即对应一个时钟周期。
# 学生易错一：误以为流水线缩短了每条指令的执行时间。由于引入了级间寄存器的读写开销，单条指令的完整执行耗时反而略微增加；性能提升源于多条指令在时间上的重叠：5 条指令不再需要 5 个漫长的单周期，流水线填满后每个短周期即可完成一条指令。
# 学生易错二：混淆两个「5」的含义。五级流水线代表一条指令经历 5 个硬件阶段，填满后理想情况下每周期完成 1 条指令；第 3 讲提到的「每周期最多开始执行 5 条指令」则依赖于多发射超标量结构，将在第三部分「现代 CPU」的「超标量」一页展开。
# 图中五行对应循环体的五条指令，自上而下按程序顺序排列；每个格子表示对应指令在该时钟周期所处的流水级。在第 5 周期，五个硬件级同时处于忙碌状态：movslq 处于写回级，movl 处于访存级，imull 处于执行级，addl %ecx,%r9d 处于译码级，addl $1,%eax 处于取指级。从第 5 周期起，每个周期均有一条指令完成写回（对应图中深色写回格构成的斜线）；第一行右侧的标注说明单条指令自身的执行延迟仍为 5 个周期。
# 图中仅展示了循环体内的 5 条指令，因此第 6 周期之后的取指级留空；实际运行中，处理器会紧接着取入循环末尾的 cmpl、jl 以及下一轮迭代的 movslq。
# 耗时对比：完成 5 条指令，单周期实现需要 5 个长周期，五级流水线需要 9 个短周期；一般地，连续执行 n 条指令需要 n + 4 个短周期，当 n 较大时平均每周期完成接近 1 条指令。
# 本图按无冲突的理想情况绘制，假设每条指令所需的源操作数在译码时均已就绪。仔细观察第 5 周期可以发现：imull 进入执行级时，前一条 movl 仍处于访存级，操作数 x[i] 尚未从内存读出；第 4 周期 movl 计算地址所需的 %r8，也是前一条 movslq 在第 3 周期刚刚算出的。这类数据依赖在第二部分「流水线执行的指令冲突」讲：算出的结果靠转发送达，读内存后马上使用要停顿；第二部分把带内存操作数的 imull 拆成两条指令，紧挨着的读内存与使用落在 w[i] 上。
# 页末的问题：各级的用时不相等时（「每个时钟周期执行一条指令」一页的图中，取指、执行、访存比译码、写回长），流水线的时钟周期由哪一级决定？


This sequence comprises 4 frames. The hardware diagram shows instructions in the five stages for the bold cycle. Frame 1 covers Cycles 1–2, with hardware in Cycle 2: jl decodes while fetch speculatively retrieves the first predicted instruction, replacing the question mark from "Control Hazards". Frame 2 shows Cycle 3: jl executes, predicted instruction 1 decodes, and predicted instruction 2 fetches; actual branch direction is determined only at the end of Cycle 3 (orange dashed line). Frame 3 captures the resolution moment: gray dashed boxes in the space-time and hardware diagrams outline the two speculatively fetched instructions. Frame 4 covers Cycles 4–7, with hardware in Cycle 4: the prediction was correct, so both instructions are valid and pipeline registers load normally without stalls or bubbles; predicted instruction 1 enters execute and writes back in Cycle 6, and instruction 2 writes back in Cycle 7, maintaining one write-back per cycle.
Comparison with "Control Hazards": waiting for resolution deferred fetch of the next instruction to Cycle 4; predicting correctly fetched it in Cycle 2, saving 2 cycles.
Common misconception: assuming instructions fetched before resolution are provisional and must be refetched after confirmation. On a correct prediction, instructions have already advanced through the pipeline, and resolution merely validates them.
Question at the end of the page: If the prediction is incorrect, what happens to the two instructions already fetched? Could they have modified registers or memory?
'''

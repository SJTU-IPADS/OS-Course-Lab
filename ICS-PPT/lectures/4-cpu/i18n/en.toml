# 处理器不断重复这三步，一条接一条地执行指令。顺序执行时，下一条指令的地址是 PC + 指令长度。

['insn-flow.notes.1']
src_hash = 'a2a8f225'
text = '''
This page corresponds to page 19 of Lecture 14 in the old ICS1 slides, "SEQ Hardware Structure": read an instruction according to the PC, pass sequentially through all stages, and update the PC, repeating continuously. Here it is formulated using the five-stage model of this lecture: the address of the next instruction is computed in the fetch stage, and the clock edge at the end of the cycle writes it into the PC. Halting conditions on the original page (halt, illegal instruction, illegal address) are Y86 specifications and are not covered here.
The numbers of the three boxes in the diagram correspond to the three steps in the list: Fetch and the subsequent four stages use the stage colors of the space-time diagrams; the clock edge uses a dark bold box, identical to the clock edge on the "Clock Cycle" page; the bottom arrow loops back from the clock edge to Fetch to begin the next instruction.
Each clock cycle completes these three steps once, executing one instruction: on the "Clock Cycle" page, movslq completes in Cycle 1, and movl begins fetching in Cycle 2.
Common misconception: assuming the PC immediately points to the next instruction right after fetch. The fetch stage only computes the next instruction address; the PC is updated only at the clock edge ending the cycle.
Question at the end of the page: What does an arithmetic instruction specifically do in each stage?
'''
# src:
# 
# 本页对应旧讲义 ICS1 第 14 讲第 19 页「SEQ 硬件结构」：按 PC 读出指令、依次经过各阶段、更新 PC，处理器不断重复。这里按本讲的五级模型写：下一条指令的地址在取指阶段算出，周期结束的时钟沿把它写入 PC。原页的停机条件（halt、非法指令、非法地址）是 Y86 的规定，本页不讲。
# 图中三个框的编号与列表的三步对应：取指与四个阶段用时空图的阶段配色，时钟沿用深色粗框，与「时钟周期」一页的时钟沿相同；下方的箭头从时钟沿回到取指，开始下一条指令。
# 每个时钟周期走完一遍这三步，执行一条指令：「时钟周期」一页中，movslq 在周期 1 走完，movl 在周期 2 开始取指。
# 学生易错：以为取指之后 PC 马上指向下一条指令。取指阶段只算出下一条指令的地址，PC 在周期结束的时钟沿才写入。

['branch-fig.notes.1']
src_hash = '491c85aa'
text = '''
This sequence comprises 3 frames, showing hardware states in Cycles 3, 4, and 5. Frame 1 captures the resolution moment at the end of Cycle 3, identical to Frame 3 of the previous slide. Frame 2 shows Cycle 4: a misprediction occurs, squashing the two instructions fetched before resolution (red dashed cells) while fetch redirects to the correct branch path. Frame 3 covers Cycles 4–8 with hardware in Cycle 5, presenting the conclusion.
Squashing is accomplished using bubbles, identical to the mechanism on "Stall and Bubble": at the clock edge ending Cycle 3, registers between fetch/decode and decode/execute latch bubbles instead of predicted instructions 2 and 1; the PC loads the correct target address. In Cycle 4 hardware, fetch receives the first instruction of the correct path, while decode and execute contain bubbles; in Cycle 5, both bubbles advance to execute and memory, eventually exiting after write-back. Because squashed instructions have reached only fetch or decode, they have not entered memory or write-back stages where architectural state is modified; replacing them with bubbles requires no state recovery. Fetch proceeds normally in Cycle 4 along the correct path, requiring only bubbles.
Comparison with "Control Hazards" and "Correct Branch Prediction": a misprediction inserts 2 bubbles, so the first correct instruction fetches in Cycle 4 and writes back in Cycle 8, matching the penalty of waiting for resolution; correct predictions waste zero cycles. Misprediction penalties equal waiting delays, so higher accuracy yields greater net savings.
Connection to Lecture 3: in conditional move cmov benchmarks, when branch conditions a < b were random, jl ran approximately 4× slower than when conditions were consistent; that penalty reflects squashing and refetching described here.
Instruction count generalization: the basic 5-stage pipeline squashes exactly 2 instructions; modern deep superscalar cores with 10+ stages between fetch and resolution squash dozens of instructions upon misprediction, summarized generally as "all instructions fetched along the incorrect path before resolution are squashed."
Summary of Part 2: data forwarding, single-cycle stalls for load-use hazards, and squashing mispredicted branches constitute the three core mechanisms resolving data hazards and control hazards in pipelined execution.
Question at the end of the page: The 5-stage model assumes memory reads take one cycle. In actual processors, memory access takes multiple cycles, lengthening the time imull waits for w[i]; what happens to subsequent instructions?
'''
# src:
# 
# 这一页有 3 帧，硬件图依次是周期 3、4、5。第 1 帧是周期 3 结束、jl 判定的时刻，与上一页第 3 帧相同。第 2 帧是周期 4：猜错了，判定前取进来的两条作废（时空图中的红色虚线格），同时取指级改为从正确的分支路径重新取指。第 3 帧是周期 4–8，硬件图是周期 5，结论在这一帧出现。
# 作废靠的是 bubble，与「stall 与 bubble」一页是同一种操作：周期 3 结束的时钟沿，取指与译码之间、译码与执行之间的两个寄存器装入 bubble，代替本来要装入的猜来的第 2 条、第 1 条；PC 装入正确路径的地址。时空图作废格旁的红字说的就是这件事。所以硬件图的周期 4 中，取指级是正确路径的第 1 条，译码、执行两级是 bubble；周期 5 两个 bubble 前进到执行、访存两级，随后经过写回离开流水线。被作废的指令此时只走到取指或译码阶段，还没有到达会改变寄存器与内存的访存级与写回级，换成 bubble 即可，不需要恢复任何状态。取指级在周期 4 照常取指，取的是正确路径的第 1 条，所以这里只用 bubble。
# 与「control hazard」「分支预测正确」两页对比：猜错时插入 2 个 bubble，正确路径的第 1 条在周期 4 才取指、周期 8 写回，与「control hazard」一页等待判定的结果相同；猜对时一个周期也不浪费。猜错的代价就是等待的代价，猜对的次数越多，省下的周期越多。
# 前后呼应：第 3 讲介绍条件传送指令 cmov 时测得，分支条件 a < b 随机成立时，使用条件跳转 jl 的运行时间约为条件恒成立时的 4 倍；当时所说的「分支预测错误的惩罚」，就是本页的作废与重新取指。
# 本图展示的是基础五级流水线模型。正文中不限定固定的作废指令条数（五级模型中恰好为 2 条；而在现代深流水线且支持多发射的处理器核中，从取指到分支判定往往相隔十几个流水级，一旦预测错误需要作废数十条已进入流水线的指令），统一表述为「判定前已取入的错误路径指令全部作废」。

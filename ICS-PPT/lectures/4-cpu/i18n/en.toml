['hazard.notes.1']
src_hash = '706026fe'
text = '''
In this baseline scenario, the pipeline takes no action: two instructions enter the pipeline one cycle apart, matching the layout on the "Pipeline Space-Time Diagram" page. imull computes its product in execute during Cycle 3, passes through memory in Cycle 4, and writes back in Cycle 5; register updates occur at the clock edge ending Cycle 5, adhering to the "state is written only at clock edges" principle from "One Instruction per Clock Cycle". addl decodes in Cycle 3, reading %ecx from the register file when %ecx still retains its pre-imull value.
Between the two rows, values of %ecx across cycles are shown. Preceding movl (%rsi,%r8,4),%ecx loaded x[i] into %ecx (from the loop in Lecture 3), so Cycles 1 through 5 hold x[i] = 4, changing to 12 at the clock edge ending Cycle 5. The red arrow indicates the stale value 4 read by addl in Cycle 3: addl computes 10 + 4 = 14 in Cycle 4 and writes 14 to %r9d in Cycle 6, whereas the correct result is 10 + 12 = 22. The formula above the diagram defines the intended sum, with w[i] = 3, x[i] = 4, and sum = 10 chosen for illustration; reading stale data occurs regardless of specific numerical values.
A subsequent instruction reading a register that a preceding instruction writes but has not yet written back constitutes a data hazard. Because the product is computed in execute, this page terms it an arithmetic data hazard; hazards resulting from memory loads are discussed under "Load-Use Data Hazard".
Common misconception 1: assuming %ecx is updated to 12 as soon as imull finishes execute in Cycle 3. The product is stored in the pipeline register between execute and memory at the end of Cycle 3; %ecx is written only at the clock edge ending Cycle 5.
Common misconception 2: assuming only immediately adjacent instructions read stale values. If one or two independent instructions separate imull and addl, addl decodes in Cycle 4 or 5, which is still not after the write-back ending Cycle 5, likewise reading stale data; addl reads 12 only when separated by three instructions, decoding in Cycle 6.
Instruction breakdown clarification: memory-operand imull (%rdi,%r8,4),%ecx executes as two instructions in a 5-stage pipeline (first loading w[i], then multiplying in registers), as covered on the "Load-Use Data Hazard" page; the imull row on the first four pages of this section represents the multiplication instruction.
Question at the end of the page: How can addl be made to read %ecx after imull writes it back?
'''
# src:
# 
# 本页的流水线不做任何处理：两条指令相隔一个周期进入流水线，与「流水线时空图」一页的画法相同。imull 在第 3 周期的执行阶段算出乘积，经过第 4 周期的访存级，在第 5 周期写回；写入发生在第 5 周期结束的时钟沿，与「每个时钟周期执行一条指令」一页的「状态只在时钟沿写入」相同。addl 在第 3 周期译码，从寄存器堆读出 %ecx，这时 %ecx 中仍是 imull 之前的值。
# 图中两行之间是 %ecx 在各个周期的值。imull 之前的 movl (%rsi,%r8,4),%ecx 把 x[i] 读入 %ecx（第 3 讲的循环体），所以周期 1 至 5 都是 x[i] = 4，周期 5 结束的时钟沿变为 12。红色箭头是 addl 在周期 3 读到的值 4：addl 在周期 4 执行 10 + 4 = 14，在周期 6 把 14 写入 %r9d，正确的结果是 10 + 12 = 22。图上方的公式是这两条指令要算的和，w[i] = 3、x[i] = 4、sum = 10 只用来算出具体的数，读到旧值与取什么数无关。
# 后一条指令要读的寄存器，正是前一条指令要写、还没有写回的寄存器，这种情况就是本小节标题中的 data hazard。乘积在执行阶段算出，本页称为算术 data hazard；结果从内存读出的情况在本小节的「访存 data hazard」一页讲。
# 学生易错一：以为 imull 在第 3 周期算出乘积之后，%ecx 就已经是 12。乘积在第 3 周期结束时保存在执行级与访存级之间的级间寄存器中，%ecx 要到第 5 周期结束的时钟沿才写入。
# 学生易错二：以为只有紧挨着的两条指令才会读到旧值。imull 与 addl 之间隔一条或两条无关指令时，addl 在第 4 或第 5 周期译码，仍不晚于第 5 周期结束的写入，同样读到旧值；隔三条时 addl 在第 6 周期译码，才读到 12。
# 教学简化说明（供学生追问时解答）：带内存操作数的 imull (%rdi,%r8,4),%ecx 在五级流水线中按两条指令执行（先读出 w[i]，再做寄存器乘法），本小节「访存 data hazard」一页讲这一拆分；本小节前四页图中的 imull 一行是做乘法的那一条。
# 页末的问题：怎样让 addl 读到 imull 写回之后的 %ecx？

['stall-bubble.title']
src_hash = '3401ab6e'
text = 'Stall and Bubble'
# src: stall 与 bubble

['stall-bubble.slide.1']
src_hash = '07d9e2ce'
text = '''
The most direct approach: hold `addl` in the decode stage until `%ecx` is written back before reading. The hardware supports two operations on pipeline registers:

- **stall**: When the clock edge arrives, the register holds its previous contents, keeping the instruction in the subsequent stage unchanged.
- **bubble**: When the clock edge arrives, the register is loaded with a no-op, causing the subsequent stage to perform no operation.

When only stalling, decoded signals of `addl` propagate into the execute stage as usual; therefore, a bubble is inserted into the execute stage simultaneously.
'''
# src:
# 
# 最直接的办法：让 `addl` 停在译码级，等 `%ecx` 写回后再读。硬件对级间寄存器有两种操作：
# 
# - **stall**：时钟沿到来时，寄存器保持原内容，它后面一级的指令不变。
# - **bubble**：时钟沿到来时，寄存器装入一条空指令，它后面一级不做任何操作。
# 
# 只 stall 时，`addl` 的译码结果照常进入执行级，所以执行级同时插入 bubble。

['stall-bubble.notes.1']
src_hash = '3ea97c9a'
text = '''
Motivated by the preceding slide: addl reads the stale value of %ecx when decoding in Cycle 3. To read the updated value, addl must remain in the decode stage until imull writes back.
Holding an instruction in a given stage relies on the pipeline register preceding that stage: at each clock edge, pipeline registers latch outputs from the previous stage, advancing instructions by one stage. Stalling inhibits latching, preserving previous register contents so that the subsequent stage processes the same instruction in the next cycle. In rows 2 and 3 of the figure, the PC and the register between fetch and decode stall: addl remains in decode, and addl $1,%eax remains in fetch to be refetched in the next cycle.
Row 2 illustrates stalling alone. Combinational decode circuitry functions normally in Cycle 3, passing decoded signals of addl (including stale value 4) to the register between decode and execute; because this register latches normally at the clock edge, two copies of addl emerge: one retained in decode, and one advancing into execute with stale data to write an incorrect sum to %r9d. Stalling alone keeps addl in decode while allowing decode outputs to propagate forward.
Row 3 illustrates stalling combined with bubble insertion. A bubble loads a no-op into the register between decode and execute at the clock edge (equivalent in effect to a nop), leaving execute with no instruction to execute in Cycle 4; this bubble subsequently propagates through memory and write-back without altering registers or memory. Stalling retains addl in decode, while the bubble occupies the execute stage that addl would otherwise enter. Registers preceding memory and write-back latch normally, allowing imull to advance to memory.
A single stall delays execution by one cycle. In Cycle 4, addl remains in decode with %ecx still stale, requiring hardware to stall again and insert another bubble until the write-back value becomes available.
Common misconception 1: assuming a stall freezes the entire pipeline. Only the PC and the register between fetch and decode retain contents; execute, memory, and write-back advance normally, allowing imull to finish execution.
Common misconception 2: assuming a bubble is a nop instruction in software. Bubbles are dynamically injected into pipeline registers by hardware at runtime, leaving program code unaltered; their behavior inside the pipeline is equivalent to a nop.
Control logic determining when to stall and insert bubbles (CS:APP Section 4.5.8) is omitted here.
Question at the end of the page: How many cycles must addl stall to read %ecx after imull writes it back?
'''
# src:
# 
# 问题来自上一页：addl 在第 3 周期译码时读到 %ecx 的旧值。要读到新值，addl 必须留在译码级，直到 imull 写回。
# 硬件让指令留在某一级，靠的是这一级前面的级间寄存器：每个时钟沿，级间寄存器装入前一级的输出，指令由此前进一级。stall 是让寄存器在这个时钟沿不装入、保持原内容，它后面那一级在下一个周期处理的仍是同一条指令。图中第二、三行，PC 与取指、译码之间的寄存器 stall：addl 留在译码级，addl $1,%eax 留在取指级，下一个周期再取一遍。
# 第二行是只 stall 的结果。译码级的电路在第 3 周期照常工作，把 addl 的译码结果（包括读到的旧值 4）送到译码与执行之间的寄存器；这个寄存器在时钟沿照常装入，addl 就有了两份：一份留在译码级，一份带着旧值进入执行级，继续向后推进，最后把错误的和写入 %r9d。stall 使 addl 留在译码级，译码级的输出仍然送往下一级。
# 第三行是 stall 与 bubble 同时使用的结果。bubble 让译码与执行之间的寄存器在这个时钟沿装入一条空指令（效果与 nop 相同），执行级在第 4 周期没有指令可做；这条空指令随后经过访存、写回，不改变寄存器与内存。stall 让 addl 留在译码级，bubble 占据 addl 原本要进入的执行级。访存级、写回级前面的寄存器照常装入，imull 照常前进到访存级。
# 一次 stall 只推迟一个周期。addl 在第 4 周期仍在译码级，%ecx 仍是旧值，硬件再 stall 一次、再插入一个 bubble，直到能读到写回后的值。
# 学生易错一：以为 stall 时整条流水线都停下。只有 PC 与取指、译码之间的寄存器保持原内容，执行、访存、写回各级照常前进，imull 照常走完。
# 学生易错二：以为 bubble 是程序里的一条 nop 指令。bubble 由硬件在运行时装入级间寄存器，程序的指令序列不变；它在流水线中的效果与 nop 相同。
# 本讲不讲判断何时 stall、何时插入 bubble 的控制电路（CS:APP 4.5.8 节的流水线控制逻辑）。
# 页末的问题：addl 要 stall 几个周期，才能读到 imull 写回之后的 %ecx？


['pipe-practice-answer.notes.1']
src_hash = '15ae8131'
text = '''
The diagram and problem statement are identical to the previous page; slashes in the table indicate register placement, with the final register following the last stage retained. Rows 1 to 3 correspond to adding 1, 2, and 3 registers respectively, while row 4 answers the minimum stages needed for maximum throughput.
Combinational delay per stage sums the delays of included modules. The optimal 2-stage split is ABC / DEF (170, 130 ps), 3-stage is AB / CD / EF (110, 110, 80 ps), and 4-stage is A / BC / D / EF (80, 90, 50, 80 ps). Clock cycle = slowest stage delay + 20 ps, throughput = 1 / cycle, latency = stages × cycle.
Block A takes 80 ps and cannot be subdivided, bounding the clock cycle to at least 100 ps and throughput to at most 10 GOPS. Partitioning A, B, C, and D into individual stages and combining E and F into one stage achieves this in 5 stages; with 4 stages, B+C takes 90 ps, requiring a 110 ps cycle, making 5 stages the minimal requirement.
Common misconception: dividing evenly by module count, or assuming higher throughput implies lower latency. Latencies in the table are 380, 390, 440, and 500 ps.
Question at the end of the page: If 300 ps combinational logic is partitioned into six stages of 50 ps each, with a 20 ps register added after each, what are the resulting latency and throughput?
'''
# src:
# 
# 题图与问题由同一个函数生成，与上一页的位置相同；表中的斜线表示插入级间寄存器的位置，最后一级之后保留图中已有的寄存器。前 3 行依次对应新增 1、2、3 个寄存器，第 4 行回答达到最大吞吐率所需的最少级数。

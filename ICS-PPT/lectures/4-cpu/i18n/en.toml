# 学生易错一：以为乱序执行让每条指令都变快。每条指令仍要经过五个阶段，imull 与 addl %ecx,%r9d 的执行周期在两种方式下相同（周期 7、8）；乱序执行改变的是执行级在等待时有没有指令可执行。
# 学生易错二：以为乱序执行改变了程序的结果。写回按程序顺序，寄存器与内存的变化顺序与顺序流水线相同。

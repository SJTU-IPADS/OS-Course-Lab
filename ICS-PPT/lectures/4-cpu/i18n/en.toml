text = 'During Cycles 4 through 6, `imull` and `addl %ecx,%r9d` wait for operands, fetch and decode stages operate as usual, and the memory stage loads `w[i]` for `movl`: <mark>the execute stage has no executable instructions for 3 consecutive cycles</mark>. The bottom diagram shows the five stages during Cycle 5.'

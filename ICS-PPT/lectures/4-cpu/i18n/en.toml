['pipeline-summary.slide.1']
src_hash = 'bd6332c6'
text = '''
- Partitioning tasks into fixed steps performed by distinct components with inter-stage buffering allows different tasks to overlap in execution: **throughput increases, while single-task latency is not shortened**.
- Clock cadence is determined by the slowest stage; bubbles arise when subsequent steps depend on preceding results; predictable results can execute speculatively, squashing only uncommitted state upon misprediction.
'''
# src:
# 
# - 将任务分为固定的若干步，每步由不同的部件完成，步与步之间设置缓冲，使不同任务重叠执行：**吞吐提高，单个任务的延迟不缩短**。
# - 节拍由最慢的一级决定；后一步依赖前一步的结果时产生 bubble；可以预测的结果先按预测执行，预测错误时只作废尚未写入结果的部分。

['pipeline-summary.notes.1']
src_hash = 'a1f64fca'
text = '''
This page summarizes the lecture. The last three table columns capture the three essential elements of pipeline design: stage partitioning, inter-stage buffering, and bubble origins. The four rows summarize pipelines explored across the lecture, showing identical design principles from CPUs to factory floors.
The two summary takeaways reflect the two main themes: the first addresses Part 1 (principles, throughput, and latency); the second synthesizes Parts 2 and 3 (slowest-stage pacing, data and control hazards causing stalls, branch prediction and squashing). Part 4 demonstrated these principles beyond CPUs.
Question leading to the next lecture: Pipelining and speculation ensure stages remain fully utilized, but weights must still be read from memory, leaving raw memory access latency unchanged. How can the time required to read data itself be shortened? The next lecture on the memory hierarchy answers this question.
'''

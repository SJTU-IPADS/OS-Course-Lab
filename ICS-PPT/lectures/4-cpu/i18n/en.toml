# 
# 五条指令、读 w[i] 要 3 个周期的假设、处理器在译码后保存等待的指令，都与「读内存要 3 个周期时的五级流水线」一页相同，图的格子位置也相同，可以与那一页逐格对照。图从周期 3 画起。
# 按上一页乱序执行的两条规则：执行部件在每个周期从译码后等待的指令中挑一条操作数已经就绪的执行，有多条就绪时先执行程序顺序靠前的；写回按程序顺序，一条指令不早于它前面的指令写回，可以与前一条在同一个周期写回。
# 这一页有 4 帧：第 1 帧是周期 3 至 5，movl 在读 w[i]，imull 等 w[i]，addl %ecx,%r9d 等乘积，红色的停格表示译码后的指令在等待执行；第 2 帧是周期 6，imull 仍在等，执行部件空闲，addl $1,%eax 在周期 5 译码、操作数 %eax 已就绪，它先执行，橙色虚线框出这一列；第 3 帧是周期 7，w[i] 读出，绿色折线把它送进 imull 的执行阶段，与「stall 一个周期后转发」一页相同；第 4 帧是周期 8 至 12，imull 的乘积经橙色折线送进 addl %ecx,%r9d 的执行阶段（与「data forwarding」一页相同）。addl $1,%eax 的结果从周期 8 起暂存在处理器内部（虚线格「等待写回」），周期 10 与 addl %ecx,%r9d 一起写回；cmpl 要用新的 %eax，周期 7 起已就绪，周期 7、8 执行部件给了程序顺序靠前的 imull 与 addl %ecx,%r9d，它在周期 9 执行、周期 11 写回；新的 %eax 在写回之前存在处理器内部，第二条橙色折线把它从「等待写回」格送进 cmpl 的执行阶段。五条指令的写回周期是 7、9、10、10、11，没有一条早于它前面的指令。
# addl $1,%eax 为什么不在周期 4 或 5 执行：它在周期 4 才取指、周期 5 才译码，周期 6 是它最早能执行的周期。执行级在周期 4、5 仍然空闲；更早取进来的无关指令越多，能用上的空闲周期越多。
# 同一个周期写回两条（周期 10 的 addl %ecx,%r9d 与 addl $1,%eax）要求寄存器堆有两个写端口，两条写的是不同的寄存器（%r9d 与 %eax）。按程序顺序执行时每个周期只有一条指令到达写回级，用不上第二个写端口。正文写明本页的处理器同一个周期可以写回两条：若每个周期只能写回一条，addl $1,%eax 要等到周期 11、cmpl 要等到周期 12，五条指令与按程序顺序执行同时写回完。真实处理器每个周期按程序顺序写回 4 至 8 条（「乱序执行：指令的相关性」一页讲稿）。
# 学生易错一：以为乱序执行会改变程序的结果。写回按程序顺序，寄存器与内存的变化与按程序顺序执行完全相同；哪条指令先算出结果，程序看不到。学生易错二：以为周期 6 执行完 %eax 就是新值。与「data forwarding」一页中的 %ecx 相同，结果在写回前只在处理器内部，%eax 在周期 10 结束的时钟沿才写入；cmpl 在周期 9 用到的新 %eax 来自处理器内部。
# 页末的问题：与按程序顺序执行相比，乱序执行快了多少，程序的结果有没有变化？


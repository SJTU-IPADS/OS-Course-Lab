text = '''
This page corresponds to pages 12–13 of Lecture 17 in the old ICS1 slides, "Limitations: Register Overhead": the diagram redrawn from page 12 shows six 50 ps combinational logic blocks, each followed by a 20 ps register with all six connected to the same clock; lower right shows latency and throughput; the text below matches page 13. The original note contained only: clock cycle 70 ps.
Clock cycle = 50 + 20 = 70 ps; 6-stage latency = 6 × 70 = 420 ps; throughput = 1 / 70 ps = 14.29 GOPS. Total combinational logic across the six blocks is 300 ps, identical to the six blocks on the previous page.
All three percentages assume 300 ps combinational logic and 20 ps registers: with 1 stage, clock cycle is 300 + 20 = 320 ps, 20/320 = 6.25%; with 3 stages of 100 ps each, clock cycle is 120 ps, 20/120 = 16.67%; with 6 stages of 50 ps each, clock cycle is 70 ps, 20/70 = 28.57%, as shown in this figure.
Common misconception: calculating latency and throughput using only 300 ps. Each cycle includes 20 ps register overhead, totaling 120 ps across six stages, so latency of 420 ps exceeds 300 ps.
Common misconception: assuming register delay decreases proportionally as pipeline depth increases. Register overhead of 20 ps remains constant regardless of partitioning, while combinational logic delay is divided across stages, causing register overhead to occupy an increasing proportion of each cycle.
Common misconception: interpreting the final bullet as "more stages are always better." Deeper pipelines shorten clock cycles, but register overhead consumes a larger fraction of cycle time, and single-instruction latency lengthens.
Question at the end of the page: When overlapping instructions, if a subsequent instruction needs an arithmetic result that the preceding instruction has not written back yet, what does the subsequent instruction read if the pipeline takes no action?
'''

['naive-design.notes.1']
src_hash = '3a664130'
text = '''
This page corresponds to page 45 of Lecture 14 in the old ICS1 slides, "Why not a naive design?". A naive design constructs a dedicated set of hardware for each instruction, each with its own fetch, decode, ALU, and write-back circuitry.
An extra copy of code in software consumes only additional memory; an extra logic block in hardware increases chip area and power consumption. Therefore, unifying execution into five stages allows all instructions to share one set of hardware: in the table on the "Stage Computations: Arithmetic and Logical Operations" page, addl, subl, andl, orl, and xorl share the same row of computations, differing only in the ALU operation performed.
Common misconception: assuming that sharing one set of hardware slows down instructions. In a single-cycle implementation, each instruction still completes within one clock cycle; sharing saves hardware area, independent of cycle duration.
Question at the end of the page: Given that all instructions share one set of hardware and execute one instruction per cycle, is there an execution mode that allows multiple instructions to be in flight simultaneously?
'''
# src:
# 
# 本页对应旧讲义 ICS1 第 14 讲第 45 页「为什么不用朴素的设计？」。朴素的设计为每条指令各做一套硬件，每套都有自己的取指、译码、ALU 与写回电路。
# 软件中多一份代码副本只多占一些内存；硬件中多一份逻辑块，芯片面积、功耗都随之增加。所以五个阶段统一划分，所有指令共用一组硬件：「阶段计算」一页的表中，addl、subl、andl、orl、xorl 共用同一行计算，只有 ALU 做的运算不同。
# 学生易错：以为共用一组硬件会让指令变慢。单周期实现中每条指令仍在一个时钟周期内完成；共用节省的是硬件，与周期长短无关。
# 页末的问题：所有指令共用一组硬件、每个周期执行一条指令，有没有让多条指令同时处于处理中的执行方式？


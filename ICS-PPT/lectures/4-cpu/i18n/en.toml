['stall-wait.notes.1']
src_hash = '93beb246'
text = '''
This page resolves the arithmetic data hazard using stall and bubble operations: when addl discovers in decode that %ecx has not been written back, it stalls for one cycle while inserting a bubble into execute; it checks again in the next cycle until the written-back value is available. The product of imull is written to %ecx at the clock edge ending Cycle 5, so addl decodes at the earliest in Cycle 6. Stalls occur at the ends of Cycles 3, 4, and 5, inserting three bubbles into execute across Cycles 4, 5, and 6; execution, memory, and write-back of addl are deferred to Cycles 7, 8, and 9, taking 3 extra cycles compared to unmitigated execution (which wrote back incorrectly in Cycle 6) but producing the correct result.
This sequence comprises 6 frames: the first 5 advance cycle by cycle, and the final frame completes Cycles 7 through 9. Below the space-time diagram is the 5-stage hardware diagram showing instructions in the current bold-numbered cycle; stall and bubble labels above pipeline registers indicate actions taken at the clock edge starting that cycle. Frame 1 (Cycle 2) advances normally. Frame 2 (Cycle 3) shows addl decoding the stale value 4 of %ecx, producing the first stall cell. Frame 3 (Cycle 4) stalls the PC and the fetch/decode register, keeping addl in decode while execute receives a bubble and imull advances to memory. Frame 4 (Cycle 5) stalls a second time; the first bubble enters memory while imull reaches write-back to update %ecx at cycle end. Frame 5 (Cycle 6) stalls a third time; addl reads the new value 12, indicated by the dark arrow from imull write-back to addl decode matching the write-back stage color; execute, memory, and write-back all contain bubbles simultaneously. The final frame shows Cycle 7: registers latch normally, addl enters execute computing 10 + 12 = 22 followed by two bubbles; red brackets mark the 3 stall cycles, accompanied by the question at page bottom.
Stall cells in the space-time diagram differ from hardware stall indicators by one cycle: stall cells mark Cycles 3, 4, and 5 where addl read stale values; register stalls occur at the clock edges ending those cycles, so the hardware diagram marks stalls and bubbles in Cycles 4, 5, and 6. The CS:APP PIPE model illustrates addl with 4 consecutive decode cells alongside 3 rows of bubbles traversing execute, memory, and write-back; the three bubbles in Cycle 6 correspond to those three rows in the same cycle. Instruction addl $1,%eax behind addl stalls in fetch for 3 extra cycles, shown in the hardware diagram fetch stage though omitted from the space-time rows.
Common misconception 1: assuming addl can decode in the same cycle that imull writes back. In this model, registers are written at the clock edge ending the cycle, so decoding within the cycle still reads stale data. Some textbooks allow write-in-first-half and read-in-second-half, reducing stalls to 2 cycles; both models share the conclusion that waiting for write-back incurs multiple wasted cycles.
Common misconception 2: assuming the product is computed only at write-back. The product is already held in the pipeline register between execute and memory at the end of Cycle 3; Cycles 4 and 5 merely route it to the register file.
Question at the end of the page: The product is ready at the end of Cycle 3, yet addl waits until Cycle 6 to read it. Where is the product held after computation, and can addl consume it directly?
'''
# src:
# 
# 本页用上一页的 stall 与 bubble 处理算术 data hazard，这是最简单的做法：addl 在译码级发现 %ecx 还没写回，就 stall 一个周期，同时执行级插入一个 bubble；下一个周期再检查一次，直到能读到写回后的值。imull 的乘积在第 5 周期结束的时钟沿写入 %ecx，addl 最早在第 6 周期译码。第 3、4、5 周期结束时各 stall 一次，执行级在第 4、5、6 周期各有一个 bubble；addl 的执行、访存、写回依次推迟到第 7、8、9 周期，比不做处理时（第 6 周期写回，结果错误）多用 3 个周期，结果正确。
# 这一页有 6 帧：前 5 帧每帧推进一个周期，最后一帧补齐周期 7 至 9。时空图下方是上一页的五级硬件图，画的是周期号加粗的那个周期五个阶段中的指令；级间寄存器上方的 stall、bubble 与上一页相同，是开始这个周期的时钟沿对它做的操作。第 1 帧（周期 2）照常推进。第 2 帧（周期 3）addl 在译码级读到 %ecx 的旧值 4，出现第一个「停」格。第 3 帧（周期 4）PC 与取指、译码之间的寄存器 stall，addl 留在译码级，执行级是 bubble，imull 照常进入访存级。第 4 帧（周期 5）再 stall 一次，第一个 bubble 进入访存级，imull 在写回级，周期结束时把乘积写入 %ecx。第 5 帧（周期 6）第三次 stall，addl 读到新值 12，深色折线箭头从 imull 的写回格指向 addl 的译码格，颜色取数据来源阶段（写回）的颜色；硬件图的执行、访存、写回三级都是 bubble，插入的 3 个 bubble 这时同在流水线中。最后一帧的硬件图是周期 7：寄存器照常装入，addl 进入执行级算出 10 + 12 = 22，后面跟着两个 bubble；红色括号标出 stall 的 3 个周期，页底的问题在这一帧出现。
# 时空图的「停」格与硬件图的 stall 差一个周期：「停」格是 addl 在译码级读到旧值、这一周期的译码作废的周期 3、4、5；stall 发生在这三个周期结束的时钟沿，所以硬件图在周期 4、5、6 标出 stall 与 bubble。CS:APP 的 PIPE 模型把 addl 一行画成连续 4 个译码格，另画 3 行 bubble，每行 bubble 经过执行、访存、写回；硬件图周期 6 的三个 bubble，就是这三行在同一周期所处的位置。排在 addl 后面的 addl $1,%eax 在取指级多停 3 个周期，硬件图的取指级画出了它，时空图没有画出。
# 学生易错一：以为 addl 在 imull 写回的同一周期即可译码。本讲的模型中寄存器在周期结束时的时钟沿写入，同一周期内译码读到的仍是旧值。部分教材让寄存器堆在周期前半写入、后半读出，此时 stall 2 个周期；两种模型的结论相同：等待写回要多用若干个周期。
# 学生易错二：以为乘积要到写回阶段才算出。乘积在第 3 周期结束时已经保存在执行级与访存级之间的级间寄存器中，第 4、5 周期只是把它送往寄存器堆。

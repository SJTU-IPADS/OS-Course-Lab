['assembly-line.slide.1']
src_hash = 'fba2fd9e'
text = '''
- In 1913, Ford Motor Company decomposed automobile assembly into fixed operations: chassis moved along conveyor belts, with each station performing a single operation.
- Stations assemble distinct cars simultaneously: while car 1 receives its body, car 2 receives wheels, and car 3 receives an engine. Chassis assembly time dropped from 12 hours 28 minutes to <mark>1 hour 33 minutes</mark>.
- Each car must still pass through all stations; conveyor cadence is determined by the **slowest station**; when a station lacks parts, subsequent stations idle, which is a bubble.
'''
# src:
# 
# - 1913 年，福特汽车公司将汽车装配分解为固定的工序：车架随传送带移动，每个工位只完成一道工序。
# - 各工位同时装配不同的车：第 1 辆安装车身时，第 2 辆安装车轮，第 3 辆安装发动机。底盘装配时间从 12 小时 28 分缩短到 <mark>1 小时 33 分</mark>。
# - 每辆车仍要经过全部工位；传送带的节拍由**最慢的工位**决定；某道工序缺少零件时，后续工位空闲，即 bubble。

['assembly-line.notes.1']
src_hash = '7fef9bad'
text = '''
The term pipeline in Chinese shares its name with industrial assembly lines, where the concept originated. In 1913, Ford introduced the moving assembly line at the Highland Park plant, reducing Model T chassis assembly time from 12 hours 28 minutes to 1 hour 33 minutes.
Point-by-point analogy: workstations correspond to hardware stages (or GPUs), partially assembled cars on the conveyor correspond to intermediate results in pipeline registers, cars traversing all stations correspond to instructions requiring 5 stages, and finishing one car per conveyor cadence corresponds to retiring one instruction per cycle. Conveyor cadence is bounded by the slowest workstation, matching "Clock Cycle Determined by the Slowest Stage"; missing parts causing downstream stations to wait correspond to stalls and bubbles.
Common misconception: assuming assembly lines shorten the assembly time of an individual car. The time for an individual car from start to finish is not shortened; what decreases is the average time between completed cars.
Question at the end of the page: What pipelines exist in everyday computer software systems?
'''
# src:
# 
# 英文 pipeline 与 assembly line 是两个词，中文都称为流水线；这一名称来自工业装配线。1913 年福特在 Highland Park 工厂引入移动装配线，Model T 底盘的装配时间从 12 小时 28 分缩短到 1 小时 33 分（福特公司的记载）。
# 与本讲逐项对照：工位对应五级硬件（或四块 GPU），传送带上的半成品对应级间寄存器中的中间结果，每辆车经过全部工位对应一条指令仍需 5 个周期，每个节拍下线一辆车对应每周期写回一条指令。节拍由最慢的工位决定，对应「时钟周期由最长的阶段决定」一页；缺少零件导致后续工位等待，对应 stall 与 bubble。
# 学生易错：以为装配线缩短了每辆车的装配时间。单辆车从上线到下线的时间没有缩短，缩短的是平均每辆车占用的时间。
# 页末的问题：日常使用的计算机系统中，有哪些流水线？

['video-pipeline.title']
src_hash = '7cf0839e'
text = 'Video Playback Pipeline'
# src: 视频播放流水线

['video-pipeline.slide.1']
src_hash = '67430f6b'
text = '''
- The video player divides video streams into chunks passing sequentially through: **Download** (fetch compressed data from network) → **Decode** (decompress into frame-by-frame images) → **Display** (refresh screen at 16.7 ms per frame).
- All three stages operate concurrently: while the screen displays chunk 1, the decoder decompresses chunk 2, and the network downloads chunk 3; adjacent stages are separated by buffers. Initial "buffering" before playback represents pipeline fill.
- Display cadence is fixed; when network speed falls below playback speed, the buffer drains empty and playback freezes, creating a <mark>bubble</mark>. Automatically reducing resolution reduces the workload of the <mark>slowest stage</mark>.
'''
# src:
# 
# - 播放器将视频分成若干小段，每段依次经过：**下载**（从网络获取压缩数据）→ **解码**（还原为逐帧画面）→ **显示**（屏幕每 16.7 ms 刷新一帧）。
# - 三级同时工作：屏幕显示第 1 段时，解码器还原第 2 段，网络下载第 3 段；相邻两级之间是缓冲区。播放开始前的「缓冲」过程即流水线的进管。
# - 显示的节拍固定；网络速度低于播放速度时，缓冲区被读空，画面停止，即 <mark>bubble</mark>。播放器自动降低清晰度，减少的是<mark>最慢一级</mark>的工作量。

['video-pipeline.notes.1']
src_hash = '455cb961'
text = '''
Streaming platforms chunk video into segments of several seconds (e.g., HLS, DASH) downloaded sequentially. Compressed data must be decoded into pixel frames; display hardware refreshes at a fixed cadence, such as 16.7 ms per frame for 60 Hz displays. The three stages are executed by network interface, decoder (CPU or dedicated ASIC), and display hardware respectively, separated by memory buffers functioning as pipeline registers: upstream stages write results and downstream stages read them.
Point-by-point analogy: Pipeline fill: initial buffering before playback populates upstream stages, delaying display until several seconds buffer, corresponding to pipeline fill cycles. Cadence: display operates at a fixed clock cadence, while download speed varies with network conditions. Bubbles: when network throughput drops, decoded frame buffers drain empty, freezing playback with a loading spinner, corresponding to bubble slots on space-time diagrams. Dynamic resolution: switching to lower resolution reduces data volume per chunk, allowing the slowest stage (download) to keep pace with display cadence, illustrating "Clock Cycle Determined by the Slowest Stage": reducing slowest-stage delay increases overall throughput.
Comparison with pipeline registers: pipeline registers hold one stage's result for one cycle, whereas video buffers hold several seconds of data, absorbing network jitter; deeper buffering prevents stalls at the cost of longer initial playback latency. This represents a classic throughput versus latency trade-off.
Common misconception: assuming buffering downloads the entire video. Buffers maintain only upcoming seconds of footage, streaming concurrently with playback so multi-hour movies start in seconds.
Question at the end of the page: What common design principles unite the various pipelines examined in this lecture?
'''
# src:
# 
# 视频网站将一部视频分成每段几秒（HLS、DASH 等协议均如此），播放器按段下载。下载的数据是压缩格式，须解码为逐帧画面；屏幕按固定节拍刷新，60 Hz 的屏幕每 16.7 ms 一帧。三级分别由网卡、解码器（CPU 或专用硬件）与显示硬件完成，级间由缓冲区衔接，作用与级间寄存器相同：前一级写入结果，后一级从中读取。
# 与本讲逐项对照。进管：打开视频后先显示加载图标再开始播放，这段时间在填充前两级，缓冲区积累几秒画面后显示才开始，对应流水线最初几个周期后面的级尚未收到数据。节拍：显示一级的节拍固定，作用相当于时钟；下载一级的速度随网络变化。bubble：网络变慢时，「已解码、未显示」的缓冲区被显示读空，下一帧无法显示，画面停止并显示加载图标，对应时空图上的 bubble 格。降低清晰度：播放器检测到反复卡顿后切换到较低清晰度，每段的数据量减小，最慢的一级（下载）能够跟上显示的节拍，对应「时钟周期由最长的阶段决定」一页：缩短最慢一级的时间，整条流水线的吞吐才能提高。
# 与级间寄存器的区别：级间寄存器只保存一级一个周期的结果，视频的缓冲区可保存几秒的数据，能够吸收网络速度的波动；缓冲越多，越不容易卡顿，但打开视频后的等待时间越长（延迟增加）。这同样是吞吐与延迟之间的权衡。
# 学生易错：以为「缓冲」是下载整部视频。缓冲区只保存接下来几秒的数据，下载与播放同时进行，因此几小时的电影也能在几秒内开始播放。
# 页末的问题：本讲出现的几条流水线有哪些共同的设计？


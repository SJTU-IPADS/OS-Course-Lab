['llm-spec-idea.slide.1']
src_hash = '583b9471'
text = '''
- Using a substantially smaller model (with tens of times fewer weights, requiring very little time to read) to predict 4 consecutive tokens ahead of verification by the target model is called **speculative decoding**. This small model is called a **draft model**.
- While lower in accuracy, the draft model is fast; it correctly predicts frequent tokens ("的", "是"), fixed phrases, and syntax brackets in code in most cases.
- Branch prediction in Part 2 follows the same principle: when the outcome of `jl` is unresolved, fetch along the predicted path. Here, when the next token is unknown, <mark>continue generation along predicted tokens</mark>.
'''
# src:
# 
# - 用一个规模小得多的模型（权重少几十倍，读取一遍耗时很短）在前文之后连续预测 4 个词，再由大模型核对，这种生成方法称为**投机推理**。这个小模型称为**草稿模型**。
# - 小模型的准确率较低，但速度快；高频词（「的」「是」）、固定搭配、代码中的括号等，它大多能预测正确。
# - 第二部分的分支预测采用同样的思路：`jl` 的方向尚未确定时，按预测的方向取指。这里下一个词尚未确定时，<mark>按预测的词继续生成</mark>。

['llm-spec-idea.notes.1']
src_hash = 'fe9c165f'
text = '''
A draft model is typically a smaller model from the same family with 1–2 orders of magnitude fewer parameters (e.g., using a 1B model to draft candidates for a 70B model). Streaming its weights requires a fraction of the time, so predicting 4 tokens takes far less time than generating 1 token on the target model.
Predicted tokens are tentative candidates, validated by the target model. Mispredictions by the draft model never compromise output correctness, affecting only execution speed.
Correspondence with branch prediction: in a CPU, fetch does not wait for jl to resolve, continuing along the predicted branch; here, generation does not wait for the target model, continuing along tokens predicted by the draft model. Both substitute waiting with speculation and verification.
Common misconception: assuming the draft model generates output responses independently. The draft model merely proposes candidate tokens, and all preserved tokens are verified by the target model.
Question at the end of the page: How are all 4 draft predictions verified at once?
'''
# src:
# 
# 草稿模型（draft model）通常是同系列中参数量小一到两个数量级的模型，例如以 1B 的模型为 70B 的模型提供候选。它读取一遍权重的时间约为大模型的几十分之一，连续预测 4 个词的时间仍远少于大模型生成 1 个词的时间。
# 预测的词只是候选，是否采用由大模型决定（下一页）。因此小模型预测错误不影响结果的正确性，只影响速度。
# 与分支预测的对应：CPU 不知道 jl 是否跳转，按预测方向取下一条指令，不等待判定结果；这里不知道下一个词，先按小模型的预测继续生成，不等待大模型。两者都以「先预测、后验证」代替等待。
# 学生易错：以为小模型代替大模型生成回答。小模型只提供候选，每个保留下来的词都经过大模型核对。
# 页末的问题：如何一次核对这 4 个预测？


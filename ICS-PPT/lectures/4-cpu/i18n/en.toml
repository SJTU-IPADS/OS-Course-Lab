['smt-vs.highlight.1']
src_hash = 'd2791015'
text = 'Superscalar replicates execution units, hyper-threading replicates thread state, and multi-core replicates entire cores'
# src: 超标量复制执行部件，超线程复制线程的状态，多核复制整个核心

['smt-vs.notes.1']
src_hash = '67adeb7a'
text = '''
The table compares all three techniques; "less than 5% chip area" comes from Intel's first implementation. Superscalar execution (the "Superscalar Execution" page) replicates hardware across the five stages, starting multiple instructions per cycle for a single thread. Hyper-threading adds a replicated PC and register file on top of superscalar out-of-order cores without adding execution units, using idle slots left by the primary thread. Multi-core replicates entire physical cores with private execution units, eliminating core-internal contention across threads.
Hyper-threading relies on superscalar and out-of-order execution: dynamic instruction selection picks ready instructions from either thread, while multiple execution units enable concurrent execution in the same cycle. Fine-grained multithreading architectures with a single execution unit alternating per cycle exist but are not covered here.
Cost and benefit: hyper-threading requires minimal hardware (<5% die area, Marr et al., 2002), with gains depending on available idle slots (21%–30% on server workloads). Multi-core adds complete cores, offering full execution resources per thread; memory bandwidth remains shared, so 8-thread ollama in Lecture 3 scaled to 2.9× single-thread performance due to memory bandwidth limits.
The experimental i9-11900H incorporates all three: 8 physical cores (multi-core); up to 5 micro-operations started per core per cycle (superscalar); 2 threads per core (hyper-threading), exposing 16 logical processors. In Lecture 3, ollama used 8 threads while parallel-dot used 16 threads, with the latter sharing execution units within each core.
Common misconception: assuming 16 threads provide 16 cores' worth of execution units. 16 threads execute across 8 physical cores, sharing execution units within each core; when one thread already saturates execution units, adding a second thread yields little gain.
Question at the end of the page: Superscalar and hyper-threading increase instructions started per cycle, magnifying the penalty of squashed instructions on branch mispredictions. Predictions in the "Control Hazards and Branch Prediction" section were fixed; can hardware predict branch directions dynamically based on past branch outcomes, where are these records stored, and how does fetch consult them?
'''
# src:
# 
# 表逐行对照三者，「不到 5% 的芯片面积」是 Intel 第一个实现的数字（见下）。超标量（「超标量」一页）复制五级的硬件，一个线程每个周期开始执行多条。超线程在超标量、乱序执行的核心上增加一份 PC 与寄存器堆，执行部件的个数不变，第二个线程的指令用第一个线程留下的空格。多核（第 3 讲「线程并行：CPU 多核与 GPU」）复制整个核心，每个核心有自己的执行部件，不同核心上的线程不争用核心内的硬件。
# 超线程以超标量与乱序执行为基础：执行部件挑操作数就绪的指令（乱序执行），另一个线程的指令一旦就绪就能被挑中；执行部件有多个（超标量），两个线程的指令才能在同一个周期执行。只有一个执行部件、按周期轮流执行两个线程的处理器也有（细粒度多线程），本讲不讲。
# 代价与收益：超线程增加的硬件少，Intel 第一个实现增加的芯片面积不到 5%（Marr 等 2002），收益取决于一个线程留下的空格，Intel 报告的服务器负载提高 21% 至 30%。多核增加一个完整的核心，每个线程的执行部件与独占一个核心时相同；各核心仍共用内存，第 3 讲中 8 个线程的 ollama 是 1 个线程的 2.9 倍，受内存带宽的限制。
# i9-11900H 三者都有，三个数是：8 个核心（多核）；每个核心每个周期最多开始执行 5 条（超标量，第 3 讲）；每个核心 2 个线程（超线程），操作系统看到 16 个处理器。第 3 讲 ollama 用 8 个线程，parallel-dot 用 16 个线程，后者每个核心上有两个线程共用执行部件。
# 学生易错：以为 16 个线程有 16 个核心的执行部件。16 个线程在 8 个核心上，同一个核心的两个线程共用这个核心的执行部件；一个线程已能用满执行部件时，两个线程合起来与一个线程相差不多。
# 页末的问题：超标量与超线程让每个周期开始执行的指令更多，分支猜错时作废的指令也更多。「control hazard 与分支预测」一节的猜测是固定的；硬件能否按每条跳转指令以往跳或不跳的记录预测方向，这些记录保存在哪里，取指时怎样用它们决定下一条指令？

['branch-predictor.title']
src_hash = '37d2c469'
text = 'Hardware Branch Predictors'
# src: 硬件分支预测器

['branch-predictor.slide.1']
src_hash = 'f6006279'
text = '''
**Hardware Branch Predictor**: An internal table indexed by branch instruction addresses, recording past taken/not-taken outcomes for each instruction; <mark>the table is consulted using the PC during fetch</mark> to retrieve the next instruction along the predicted direction, and <mark>table entries are updated according to outcomes</mark> after resolution in the execute stage.

In each call to `dot_product`, `jl .L3` falls through only on the final iteration. Table entries can record information in two ways:
- **Last outcome only**: Predict the current outcome based on the previous outcome;
- **2-bit counter**: Increment by 1 on taken, decrement by 1 on not-taken, saturating at 3 and 0; predict taken when the value is 2 or 3.
'''
# src:
# 
# **硬件分支预测器**：处理器内部的一张表，按跳转指令的地址查找，记录这条指令以往跳或不跳的结果；<mark>取指时用 PC 查表</mark>，按预测的方向取下一条指令，执行阶段判定后<mark>按结果更新表项</mark>。
# 
# 每次调用 `dot_product`，`jl .L3` 只有最后一次不跳转。表项记录的内容有两种：
# - **只记上一次的结果**：按上一次的结果预测这一次；
# - **2 位计数器**：跳转时加 1，不跳转时减 1，到 3 或 0 后不再变化；值为 2、3 时预测跳转。

['branch-predictor.notes.1']
src_hash = '07172731'
text = '''
Hardware branch predictors predict direction based on past taken/not-taken history. In the "Control Hazards and Branch Prediction" section, prediction was static, predicting the same direction for all branches; dynamic predictors record and predict each branch individually. Patterson and Hennessy describe this dynamic branch prediction via branch prediction tables and 2-bit counters.
The text outlines table structure, lookup, and updates, followed by two tracking schemes; the figure illustrates the table and counter states, and the footer shows misprediction counts for jl .L3.
Left side shows the prediction table: each branch occupies an entry indexed by address, holding its 2-bit counter. Address 0x34 for jl .L3 is taken from objdump -d dot.o in Lecture 3, from the same output as 0x20 for movslq on the "Hardware Units in the Five Stages" page. Fetch indexes the table using the PC (blue box); after jl executes and resolves (orange box, matching the orange dashed lines at the resolution moments on the "Correct Branch Prediction" and "Branch Misprediction" pages), hardware updates the corresponding counter. Following the timing on the "Correct Branch Prediction" page: jl checks the table in Cycle 1 at fetch; counter value 3 predicts taken, fetching movslq at .L3 (0x20) in Cycle 2; at the end of Cycle 3, jl resolves and updates the counter. Squashing on a misprediction matches the "Branch Misprediction" page. Right side shows counter transitions: taken increments by 1 (saturating at 3), not-taken decrements by 1 (saturating at 0); parentheses indicate predicted direction.
Example: matvec.c in Lecture 3 calls dot_product(W[r], x, 4) on each row of a 3 × 4 matrix. With -Og, code executes jmp .L2 first, so each call executes jl .L3 five times: the first 4 jump to .L3, and the 5th falls through (i = n). Under a last-outcome predictor: the 5th iteration predicts taken and mispredicts, recording not-taken; the 1st iteration of the next call predicts not-taken, mispredicting again; each call incurs 2 mispredictions. Under a 2-bit counter: the counter stays at 3 during the loop; iteration 5 predicts taken, mispredicts, and decrements to 2; iteration 1 of the next call predicts taken (value 2), predicts correctly, and increments back to 3; each call incurs only 1 misprediction. A single not-taken outcome shifts the counter from 3 to 2 while preserving the taken prediction; two consecutive not-taken outcomes are required to flip the prediction. When n = 4096 (hidden dimension in Qwen3-8B), jl .L3 executes 4097 times per call, with 2 vs. 1 mispredictions under the two schemes.
Initial counter state: starting from 0, the first call mispredicts twice (0 → 1 → 2) before predicting taken, after which each call mispredicts only on the final iteration.
Actual processor tables hold thousands of entries indexed by lower PC bits, with aliasing possible between branches. Production processors employ advanced predictors: Lin and Tarsa (Intel, 2019, Branch Prediction Is Not A Solved Problem, arXiv:1906.08170, Table I) evaluated the TAGE-SC-L predictor (winner of CBP-5, 8 KB storage budget) on SPECint 2017, achieving 95.2% average accuracy across nine programs (99.7% for xalancbmk, 88.0% for leela); 95% accuracy means approximately 1 misprediction per 20 branches. TAGE-SC-L incorporates global branch history across recently executed branches.
Common misconception 1: assuming table lookup occurs in execute. Lookup occurs in fetch before the branch executes; execute only updates table entries after resolution.
Common misconception 2: assuming the counter counts total branch executions. Counters range only between 0 and 3, tracking directional bias; after 4096 taken branches, the counter remains 3.
Question at the end of the page: Predictors rely on historical patterns to achieve high accuracy. When branch directions are unpredictable, how accurate are predictors, and how much does execution time increase?
'''
# src:
# 
# 硬件分支预测器按每条跳转指令以往跳或不跳的记录预测方向。「control hazard 与分支预测」一节的猜测是固定的，对所有跳转指令都猜同一个方向；预测器为每条跳转指令分别记录、分别预测。旧讲义 ICS1 第 17 讲只讲固定的猜测（PIPE 总是猜跳转，约 60% 猜对），没有按记录预测的页面；本页按 Patterson 与 Hennessy《计算机组成与设计》流水线一章的动态分支预测（按跳转指令地址查找的预测表、2 位预测）写。
# 正文先说预测器是什么、什么时候查表与更新，再给出表项的两种记录方式；图画表与计数器，页底是 jl .L3 在两种记录下猜错的次数。
# 图的左侧是预测表：每条跳转指令按地址占一行，表项是它的 2 位计数器。jl .L3 的地址 0x34 取自第 3 讲 objdump -d dot.o，与「五个阶段使用的硬件」一页 movslq 的 0x20 是同一份输出。取指（蓝框，取指的配色）用 PC 查表；jl 执行完、知道跳不跳之后（橙框，与「分支预测正确」「分支预测错误」两页判定时刻的橙色虚线同色），按结果更新这一行的计数器。按「分支预测正确」一页的时序：jl 在周期 1 取指时查表，计数器为 3，预测跳转，周期 2 取 .L3 处的 movslq（0x20）；周期 3 结束时 jl 判定，更新计数器。预测错误时的作废与「分支预测错误」一页相同。图的右侧是计数器的四个值：上方的箭头是跳转，加 1；下方的箭头是不跳转，减 1；两端的弧线表示 3 再跳转仍是 3、0 再不跳转仍是 0；括号标出每个值的预测。表中 jl .L3 的格子与右侧的 3 用同样的粗框。
# 例子：第 3 讲 matvec.c 对 3 × 4 矩阵的每一行调用一次 dot_product(W[r], x, 4)。-Og 的代码先 jmp .L2 做比较，所以每次调用 jl .L3 执行 5 次：前 4 次跳转回 .L3，第 5 次 i = n，不跳转。只记上一次结果时：第 5 次按上一次的跳转预测跳转，猜错，记录变为不跳转；下一次调用的第 1 次按记录预测不跳转，实际跳转，又猜错；每次调用猜错 2 次。2 位计数器：循环中计数器保持 3；第 5 次预测跳转，猜错，3 减为 2；下一次调用的第 1 次，2 仍预测跳转，猜对，2 加回 3；每次调用只猜错 1 次。一次不跳转只让计数器从 3 移到 2，预测仍是跳转；从 3 开始要连续两次不跳转，预测才变为不跳转。n 取 4096 时（第 3 讲 Qwen3-8B 的隐藏层维度），每次调用 jl .L3 执行 4097 次，两种记录同样分别猜错 2 次与 1 次。
# 计数器的初值：设 jl .L3 的计数器从 0 开始，第一次调用要先猜错 2 次（0 加到 1、再加到 2）才预测跳转，之后每次调用只在最后一次猜错。
# 真实处理器的预测表有几千项，用跳转指令地址的低位选出一项，两条跳转指令可能用到同一项，本讲不讨论。真实处理器用更复杂的预测器：Intel 的 Lin 与 Tarsa（2019，Branch Prediction Is Not A Solved Problem，arXiv:1906.08170，表 I）用 TAGE-SC-L 预测器（2016 年分支预测竞赛 CBP-5 的冠军设计，按当今处理器常见的 8 KB 存储预算配置）模拟 SPECint 2017，九个程序的平均准确率为 95.2%，最高的 xalancbmk 为 99.7%，最低的 leela 为 88.0%；95% 的含义是平均每 20 次条件跳转猜错 1 次。TAGE-SC-L 除了这条跳转指令自己的记录，还用到最近执行过的其他跳转指令的结果，本讲不展开。
# 学生易错一：以为执行阶段才查表。查表在取指时进行，此时跳转指令还没有执行；执行阶段判定之后只更新表项。
# 学生易错二：以为计数器记的是跳转的次数。计数器只在 0 到 3 之间变化，记录这条指令最近的结果偏向跳转还是不跳转；jl .L3 连续跳转 4096 次后计数器仍是 3。
# 页末的问题：预测器按以往的记录预测，跳转方向有规律时猜得准。跳转方向没有规律时，预测器能猜对多少，程序会慢多少？


['llm-spec-verify.slide.1']
src_hash = '8caf5afb'
text = '''
- The preceding context and 4 predicted tokens are fed into the target model together, producing the target model's choices across all positions in a single forward pass.
- Comparisons proceed from left to right: accept correct predictions, replace the first mispredicted token with the target model's choice, and <mark>squash</mark> subsequent predictions.
- In this round, "吞" and "吐" are accepted, "量" is corrected to "率", and "，" is squashed: obtaining <mark>3 tokens</mark> in a single weight read.
'''
# src:
# 
# - 前文与 4 个预测词一同输入大模型，一次前向计算得到每个位置上大模型选出的词。
# - 从前往后比对：接受正确的预测，首个错误位置换成大模型的词，其后的预测<mark>作废</mark>。
# - 本轮接受「吞」「吐」，将「量」改为「率」，作废「，」：读取一遍权重得到 <mark>3 个词</mark>。

['llm-spec-verify.notes.1']
src_hash = 'e6d19681'
text = '''
Verification requires streaming weights only once, as shown in the right half of the diagram on the "Bottlenecks of Token-by-Token Generation" page. The 4 predicted tokens and context are fed concurrently as known inputs, allowing the target model to evaluate 4 positions in one forward pass: position 1 evaluates the token following context, position 2 evaluates following context plus predicted token 1, and so forth.
Verification rules: at position 1, target outputs "吞", matching predicted token 1, so it is accepted; at position 2, target outputs "吐", matching predicted token 2, so it is accepted; at position 3, target outputs "率" while draft proposed "量", adopting target output "率"; at position 4, predicted "，" assumed incorrect "量" and is squashed. This round advances 3 tokens, which autoregressively would have required streaming weights 3 times. Even if prediction 1 is incorrect, the target model computes the correct token for position 1, guaranteeing at least 1 token advance per round.
Speculative decoding proofs: Leviathan et al. (ICML 2023) and Chen et al. (DeepMind, 2023) proved that under probabilistic sampling with rejection sampling, output distributions match autoregressive target generation identically. Under greedy decoding (selecting highest probability), outputs match verbatim.
Common misconception: assuming squashing wastes target model compute. Only draft candidates are squashed; the target model computation at that position is retained as the corrected token.
Question at the end of the page: Does squashing mispredicted tokens affect output correctness? How does this compare with squashing CPU instructions?
'''
# src:
# 
# 核对只需读取一遍权重，原因见「逐词生成的瓶颈」一页配图的右半部分。预测的 4 个词此时是已知输入，与前文一起送入，与处理提示词的方式相同，大模型在一次前向计算中得到 4 个位置的输出：位置 1 的输出是前文之后应选的词，位置 2 的输出是前文加预测词 1 之后应选的词，依此类推。
# 比对规则：位置 1 大模型选「吞」，与预测词 1 相同，接受；位置 2 选「吐」，接受；位置 3 大模型选「率」，小模型预测的是「量」，采用大模型的「率」；位置 4 的预测「，」以错误的「量」为前提，作废。本轮前进 3 个词，逐词生成需要读取 3 遍权重。即使预测词 1 就错误，大模型也已算出位置 1 的正确词，每轮至少前进 1 个词。
# 投机推理（speculative decoding）：Leviathan 等，ICML 2023；Chen 等（DeepMind），2023。两篇论文证明，按概率抽样时，只要按特定概率接受或拒绝预测词，输出的分布与大模型逐词生成完全相同。课堂上按选取概率最大的词讲解，此时输出逐字相同。
# 学生易错：以为作废浪费了大模型的计算。作废的只是小模型的候选，大模型在该位置算出的词已被采用。
# 页末的问题：作废预测错误的词是否影响结果？与 CPU 作废指令有何异同？


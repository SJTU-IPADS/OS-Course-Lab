text = 'Hardware Units in the Five Stages'
# src: 五个阶段使用的硬件

['stage-units.slide.1']
src_hash = 'e3d4382d'
text = 'Taking the instruction `movslq %eax, %r8` as an example, at address `0x20`, assuming `%eax` = 5:'
# src:
# 
# 以指令 `movslq %eax, %r8` 为例，它的地址是 `0x20`，设 `%eax` = 5：

['stage-units.notes.1']
src_hash = '88dbe2d6'
text = '''
The figure is drawn following the SEQ hardware diagram in CS:APP Section 4.3: five stages arranged from bottom to top, each stage in a horizontal band; vertical lines on the left pass stage outputs upward for later stages to consume. Each frame highlights the hardware used by one stage, matching the stage colors in the space-time diagrams, while the right side describes what that stage does for movslq.
The address and bytes of movslq %eax, %r8 come from objdump -d dot.o (gcc -Og) in Lecture 3: located at 0x20, 3 bytes long, encoded as 4c 63 c0; %eax is the loop index i, here set to 5. Walk through frame by frame: Fetch: the PC is %rip from Lecture 3, instruction memory reads 3 bytes at PC = 0x20, PC + instruction length produces 0x23, the address of the next movl (%rip ← %rip + instruction length from Lecture 3; MIPS instructions are always 4 bytes and add 4); Decode: identifies this as a 32-bit to 64-bit sign extension, read port reads %eax; Execute: the ALU performs sign extension, zero-extending the upper 32 bits for 5; Memory: movslq does not access memory, data memory is inactive, and the execution result passes directly along the left vertical line to write-back; Write-back: the result travels via top and right paths to the write port, written into %r8.
The register file is a single hardware unit with separate read and write ports, so decode and write-back each use their respective ports.
Flags in the execute stage store CF, ZF, SF, and OF; arithmetic and logical instructions update them during execution; movslq does not modify flags and remains gray in the figure.
The target address of a jump instruction is computed in the execute stage; the figure only shows PC + instruction length; jumps are discussed in Part 2 under control hazards.
Common misconception: assuming every instruction must use all hardware units. movslq does not use data memory, and store instructions do not use the register file write port; hardware units are organized by stages, and an instruction uses only a subset of them.
Question at the end of the page: After the five stages complete, when is 0x23 written into the PC, when does %r8 take its new value, and when does the next instruction begin?
'''
# src:
# 
# 图按 CS:APP 4.3 节 SEQ 的硬件图画：五个阶段自下而上排列，每个阶段一条横带；左侧的竖线把各阶段的输出向上传递，后面的阶段从中取用。每一帧点亮一个阶段用到的硬件，颜色与时空图的阶段配色相同，右侧写这一阶段对 movslq 做的事。
# movslq %eax, %r8 的地址与字节取自第 3 讲 objdump -d dot.o（gcc -Og）：位于 0x20，长 3 字节，编码 4c 63 c0；%eax 是循环变量 i，这里取 5。逐帧讲：取指，PC 即第 3 讲的 %rip，指令内存按 PC = 0x20 读出 3 字节，PC + 指令长度得到 0x23，即下一条 movl 的地址（第 3 讲的 %rip ← %rip + 指令长度；MIPS 指令一律 4 字节，加的是 4）；译码，识别出这是 32 位到 64 位的符号扩展，读端口读出 %eax；执行，ALU 做符号扩展，5 的高 32 位补 0；访存，movslq 不访问内存，数据内存不工作，执行的结果沿左侧竖线直接到写回；写回，结果经顶部与右侧的通路送到写端口，写入 %r8。
# 寄存器堆是一块硬件，读端口与写端口分开，所以译码与写回各用一个端口。
# 执行一级的标志位保存 CF、ZF、SF、OF，算术与逻辑运算指令在执行阶段设置它们；movslq 不改变标志位，图中保持灰色。
# 跳转指令的下一条地址由执行阶段算出，图中只画 PC + 指令长度；跳转在第二部分 control hazard 一节讲。
# 学生易错：以为每条指令都要用到全部硬件。movslq 不用数据内存，存储指令不用寄存器堆的写端口；硬件按阶段齐备，一条指令只用其中的一部分。
# 页末的问题：五个阶段做完之后，0x23 什么时候写入 PC、%r8 什么时候变成新值，下一条指令什么时候开始？

['clock.title']
src_hash = '5150cb06'
text = 'Clock Cycle'
# src: 时钟周期

['clock.slide.1']
src_hash = '61841984'
text = '**Clock Cycle**: The time between two adjacent clock edges. The PC, register file, flags, and data memory are written only at clock edges.'
# src:
# 
# **时钟周期**：相邻两个时钟沿之间的时间。PC、寄存器堆、标志位、数据内存只在时钟沿写入。

['clock.notes.1']
src_hash = '70548a7b'
text = '''
The clock is a periodic signal inside the processor; writes occur at its clock edges (rising edges in the diagram), and the time between two adjacent clock edges is one clock cycle. The 3.8 GHz clock frequency measured in Lecture 3 represents 3.8 × 10^9 clock cycles per second, approximately 0.26 nanoseconds per cycle.
The PC, register file, flags, and data memory maintain the processor state and are written only at clock edges; units such as instruction memory read, PC + instruction length, and the ALU do not store state, and their outputs change with their inputs.
First frame, within Cycle 1: The PC remains at 0x20; signals for movslq propagate from fetch to write-back, 0x23 reaches the PC input, and 0x0000000000000005 reaches the register file write port input; the PC and %r8 retain their old values.
Second frame, at the clock edge ending Cycle 1: The PC and %r8 are written simultaneously. Cycle 2 begins, and instruction memory reads the next instruction movl (%rsi,%r8,4), %ecx (4 bytes 42 8b 0c 86) at PC = 0x23, starting at fetch.
Common misconception: assuming %r8 assumes its new value as soon as the write-back stage begins. Within the cycle, the write port input is ready, but %r8 is updated only at the clock edge; reading %r8 before that edge yields the old value.
Question at the end of the page: How does the processor execute instructions one after another?
'''
# src:
# 
# 时钟是处理器内部周期变化的信号，写入发生在它的时钟沿（图中是上升沿），相邻两个时钟沿之间是一个时钟周期。第 3 讲测得的主频 3.8 GHz 即每秒 3.8 × 10^9 个时钟周期，一个周期约 0.26 纳秒。
# PC、寄存器堆、标志位、数据内存保存处理器的状态，只在时钟沿写入；指令内存的读出、PC + 指令长度、ALU 这些部件不保存数据，输出随输入变化。
# 第一帧，周期 1 之内：PC 保持 0x20，movslq 的信号从取指依次传到写回，0x23 到达 PC 的输入，0x0000000000000005 到达写端口的输入；PC 与 %r8 仍是原来的值。
# 第二帧，周期 1 结束的时钟沿：PC 与 %r8 同时写入。周期 2 开始，指令内存按 PC = 0x23 读出下一条指令 movl (%rsi,%r8,4), %ecx（4 字节 42 8b 0c 86），它从取指开始。
# 学生易错：以为写回阶段一开始 %r8 就变成新值。周期之内写端口的输入已经就绪，%r8 到时钟沿才写入；在此之前读 %r8，得到的仍是原来的值。
# 页末的问题：处理器怎样一条接一条地执行指令？


['branch-time.notes.1']
src_hash = '38ae3141'
text = '''
dot_skip adds an if condition to dot_product from Lecture 3: when w[i] is 0, the product is 0, skipping the multiply-accumulate. Compiled with -Og, testl %ecx,%ecx and je .L3 implement this check, skipping imull and addl when w[i] is 0. The loop condition jge jumps on all but the last iteration, predicted accurately across all datasets. Compiling with gcc -O2 retains this je because x[i] is loaded conditionally, preventing the compiler from unconditionally loading x[i] and using cmov.
Three datasets (dot_skip_time.c): w elements are initialized to random values between 1 and 127; front sets the first half to 0; random sets half to 0 and shuffles the array, so front and random contain identical values in different orders, executing identical instruction counts and differing only in branch predictability. The benchmark calls dot_skip 2000 times, takes the fastest run, and divides by element count. Both 256 KB arrays fit in cache.
Explanation via 2-bit counters: in none, je never jumps, counter stays at 0, achieving 100% accuracy. In front, je jumps 32768 consecutive times, then falls through 32768 times, mispredicting only twice at transitions and twice at call starts (4 mispredictions across 65536 branches). In random, direction is random, limiting any predictor to ~50% accuracy (~32768 mispredictions per call), squashing speculatively fetched instructions on each misprediction (the "Branch Misprediction" page).
Quantifying misprediction overhead: random takes ~2.5 ns more per element than front, averaging 0.5 mispredictions per element, or ~5 ns per misprediction. On an i9-11900H (up to 4.9 GHz), this equals >20 cycles, matching the observation in the notes of the "Branch Misprediction" page that modern processors have a dozen stages between fetch and resolution, squashing dozens of instructions on a misprediction.
Comparing none and front: front skips half the multiply-accumulates, saving ~0.15 ns per element. random skips the same number of operations yet runs ~5× slower than none: misprediction penalties far outweigh arithmetic savings. Conditional skipping saves time only when branch directions are predictable.
Measurements on this machine (Core i9-11900H on 2026-10-27): none: 0.55–0.62 ns, front: 0.37–0.44 ns, random: 2.89–3.27 ns.
Running ./dot_skip alternate alternates zeros and non-zeros, taking 0.46–0.50 ns (similar to front). While a 2-bit counter mispredicts every other branch on alternating patterns, modern TAGE predictors exploit global branch history to predict alternating sequences accurately.
Connection to Lecture 3: in cmov benchmarks, random a < b conditions ran ~4× slower than uniform conditions for the same reason. Branch mispredictions can be monitored via perf stat -e branches,branch-misses; because Ubuntu defaults kernel.perf_event_paranoid = 4, this page measures elapsed time directly.
Common misconception 1: assuming random is slower due to extra instructions or memory stalls. Arrays in front and random have identical sizes, values, and cached status, executing identical instructions; the sole difference is branch predictability.
Common misconception 2: assuming skipping unnecessary work always saves time. Skipping computation requires a conditional branch; when branch directions are random, misprediction penalties exceed computational savings.
Question at the end of the page: Do the principles of pipelined overlap, stalling, speculation, and squashing apply to systems outside CPUs, such as LLM inference?
'''
# src:
# 
# dot_skip 是第 3 讲的 dot_product 加一个 if：w[i] 为 0 时乘积为 0，跳过这次乘加。-Og 编译后（dot_skip.c 开头的注释），testl %ecx,%ecx 与 je .L3 就是这个 if：w[i] 为 0 时 je 跳过 imull 与 addl。循环条件的 jge 每次调用只在最后一次跳转，三组数据都猜得准。gcc -O2 同样保留这条 je：只有 w[i] 不为 0 时才读 x[i]，编译器不能改成无条件读 x[i] 再用第 3 讲的 cmov 选择。
# 三组数据（dot_skip_time.c）：w 的元素先取 1 至 127 的随机值；front 把前一半置 0；random 同样置 0 一半，再把整个数组随机打乱，所以 front 与 random 是同一组值的两种顺序，dot_skip 在两组上执行的指令完全相同，只是 je 跳与不跳的顺序不同。程序调用 dot_skip 2000 次，取最快的一次，除以元素个数。两个数组各 256 KB，都在缓存中。
# 用上一页的 2 位计数器解释：none 的 je 从不跳转，计数器停在 0，次次猜对。front 的 je 先连续跳转 32768 次、再连续不跳转 32768 次，计数器只在方向改变后猜错 2 次，下一次调用开头再猜错 2 次，65536 次中猜错 4 次。random 的 je 方向随机，任何预测方法都只能猜对约一半，每次调用约猜错 32768 次，每次猜错作废已经取进来的指令（「分支预测错误」一页）。
# 估算猜错的代价：random 比 front 每个元素多用 2.5 ns，平均每个元素猜错半次，每次猜错多用约 5 ns，i9-11900H 单核最高 4.9 GHz，合二十几个周期，与「分支预测错误」一页讲稿所说现代处理器从取指到判定相隔十几级、猜错作废数十条指令相符。
# none 与 front 对照：front 跳过一半乘加，每个元素少用约 0.15 ns。random 也跳过同样多的乘加，却比 none 慢约 5 倍：猜错多用的时间远超过省下的乘加。加一个 if 跳过计算，只在跳转方向有规律时才省时间。
# 页面上的数字是 2026-10-27 在本机（Core i9-11900H）的一次运行，每次运行略有不同：none 0.55 ~ 0.62 ns，front 0.37 ~ 0.44 ns，random 2.89 ~ 3.27 ns。
# 可以当场再跑 ./dot_skip alternate：w 隔一个为 0，跳与不跳各占一半、交替出现，用时 0.46 ~ 0.50 ns，与 front 相近。上一页的 2 位计数器在交替的序列上每两次猜错一次；真实处理器的预测器还用最近若干次跳转的结果（上一页讲稿中的 TAGE-SC-L），有规律的序列也能猜对。
# 前后呼应：第 3 讲 cmov 一节测得 max 用 jl 时，a < b 随机成立的用时约为每次都成立的 4 倍，原因与本页相同。预测错误的次数可以用 perf stat -e branches,branch-misses 统计；Ubuntu 默认的 kernel.perf_event_paranoid = 4 不允许普通用户使用 perf，本页只测时间。
# 学生易错一：以为 random 慢是因为它执行的指令多或者读内存慢。front 与 random 的数组同样大、值相同，执行的指令相同，都在缓存中，差别只在跳转的方向能否预测。
# 学生易错二：以为跳过不必要的计算总能省时间。跳过计算要加一条条件跳转，方向随机时猜错的代价超过省下的计算。
# 页末的问题：分级重叠、停顿、猜测与作废这一套设计，在 CPU 之外的系统里（例如大模型推理）有没有对应？


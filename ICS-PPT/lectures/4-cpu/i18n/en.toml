['smt-fill.notes.1']
src_hash = 'eed4f719'
text = '''
Top diagram schematic from "Execution Unit Underutilization with a Single Thread"; bottom diagram incorporates Thread B (orange). In this schematic, Thread B occupies idle slots left by Thread A, with Thread A slots unchanged.
Examining the bottom diagram: in Cycle 1, both units are assigned to A, with none starting for B; in Cycles 2 and 3, A has only 1 instruction ready, allowing B to use the second unit; in Cycles 4–6, A waits for memory, allowing both units to execute instructions of B (in Cycle 5, B has only 1 ready instruction, leaving 1 slot idle); in Cycles 7 and 8, B waits for its own memory loads; in Cycles 9 and 10, both units execute one instruction each from A and B. Out of 20 slots, 18 are utilized (9 for A, 9 for B).
Gains arise from staggered memory waits: when A waits for memory, B has ready instructions, and vice versa. Execution units idle only when both threads wait simultaneously.
Single-thread execution may slow down: the processor selects instructions without distinguishing threads (the "Concurrent Execution of Two Threads in One Core" page), so when ready instructions across both threads exceed 2, some wait for subsequent cycles; fetch alternates, so each thread fetches only once every two cycles. While overall throughput (instructions retired per cycle) increases, individual thread latency may lengthen.
Intel benchmark data (Marr et al., 2002): enabling hyper-threading on Xeon processors improved OLTP performance by 21% on single- and dual-processor systems, and common server benchmarks by up to 30%, for less than 5% extra die area.
Common misconception: assuming hyper-threading doubles core performance. The core still has only two execution units, and performance plateaus once idle slots are filled; when a single thread already saturates execution units (e.g., single-thread ollama achieving 92% peak core throughput in Lecture 3), adding a second thread yields negligible benefit.
Question at the end of the page: How do superscalar, hyper-threading, and multi-core architectures differ in the hardware they replicate, and what is their relationship?
'''
# src:
# 
# 上图取自「一个线程用不满超标量的执行部件」一页（示意），下图加上线程 B（橙色）。图中设线程 B 只用 A 留下的空格，A 的格子在两图中相同。
# 逐段看下图：周期 1 两个执行部件都给了 A，B 没有指令开始执行；周期 2、3 A 只有 1 条就绪，另一个执行部件执行 B 的指令；周期 4 至 6 A 在等读内存，两个执行部件执行 B 的指令，其中周期 5 B 也只有 1 条就绪，空 1 格；周期 7、8 B 在等它自己的读内存，周期 8 空 1 格；周期 9、10 各执行 A、B 的一条。20 格用了 18 格，A、B 各 9 条。
# 收益来自两个线程的等待错开：A 等读内存时 B 有就绪的指令，B 等读内存时 A 有。两个线程同时在等的周期，执行部件仍然空着。
# 每个线程单独看可能变慢：处理器挑指令不区分线程（「两个线程在一个核心中同时执行」一页），两个线程就绪的指令合起来超过 2 条时，有的要等下一个周期；取指轮流，每个线程每两个周期才取一次指令。图为简明起见让 A 的格子不动。核心每个周期完成的指令数增加，单个线程的速度可能下降。
# Intel 的数据（Marr 等 2002）：Xeon 处理器上开启超线程，联机事务处理负载的性能在单处理器与双处理器系统上提高 21%，常见服务器应用基准最多提高 30%；增加的芯片面积不到 5%。

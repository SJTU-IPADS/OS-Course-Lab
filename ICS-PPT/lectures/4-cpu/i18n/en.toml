['cycle-start.notes.1']
src_hash = '30eb5099'
text = '''
This page corresponds to page 36 of Lecture 14 in the old ICS1 slides, with the original Y86 program replaced by x86-64; addresses and encodings are from objdump -d: at 0x000, movl $0x100, %ebx (bb 00 01 00 00, 5 bytes); at 0x005, movl $0x200, %edx (ba 00 02 00 00); at 0x00a, addl %edx, %ebx (01 d3, 2 bytes); at 0x00c, je dest (74 xx).
Each cycle executes one instruction: movl in Cycle 1 writes %ebx at the clock edge starting Cycle 2, and movl in Cycle 2 writes %edx and PC = 0x00a at the clock edge starting Cycle 3. Within Cycle 3, combinational logic reads %edx = 0x200 and %ebx = 0x100, the ALU computes 0x300, and the positive nonzero result with no carry or overflow sets all four flags to 0. In Cycle 4, je reads ZF = 0 and does not jump.
Common misconception: assuming %ebx is already 0x300 at the start of Cycle 3. 0x300 is written into %ebx only at the clock edge ending Cycle 3, which simultaneously writes flags and PC = 0x00c.
Question at the end of the page: Since all instructions execute across the same five stages, why not design dedicated hardware for each instruction?
'''
# src:
# 
# 本页对应旧讲义 ICS1 第 14 讲第 36 页，原页的 Y86 程序换成 x86-64，地址与编码取自 objdump -d：0x000 处 movl $0x100, %ebx（bb 00 01 00 00，5 字节），0x005 处 movl $0x200, %edx（ba 00 02 00 00），0x00a 处 addl %edx, %ebx（01 d3，2 字节），0x00c 处 je dest（74 xx）。
# 每个周期执行一条指令：周期 1 的 movl 在周期 2 开始的时钟沿写入 %ebx，周期 2 的 movl 在周期 3 开始的时钟沿写入 %edx 与 PC = 0x00a。周期 3 之内，组合逻辑读出 %edx = 0x200、%ebx = 0x100，ALU 算出 0x300，结果为正、不为 0，无进位、无溢出，四个标志位都是 0。周期 4 的 je 读到 ZF = 0，不跳转。
# 学生易错：以为周期 3 开始时 %ebx 已经是 0x300。0x300 在周期 3 结束的时钟沿才写入 %ebx，同一个时钟沿写入标志位与 PC = 0x00c。
# 页末的问题：所有指令都按同一套五个阶段执行，为什么不为每条指令分别设计硬件？


['pipe-3way.slide.1']
src_hash = '685bc321'
text = '''
**System**:
- Divide combinational logic into 3 blocks of 100 ps each;
- A new operation can begin as soon as the previous one passes stage A;
  - Begin a new operation every 120 ps;
- Total latency increases;
  - 360 ps from start to finish.
'''
# src:
# 
# **系统**：
# - 把组合逻辑分成 3 块，每块 100 ps；
# - 前一个操作一通过 A 级，就可以开始新的操作；
#   - 每 120 ps 开始一个新的操作；
# - 总延迟增加；
#   - 从开始到结束 360 ps。

['pipe-3way.notes.1']
src_hash = '9d6c4ca3'
text = '''
This page corresponds to page 5 of Lecture 17 in the old ICS1 slides, "3-Way Pipelined Version".
Combinational logic is divided into blocks A, B, and C of 100 ps each, each followed by a 20 ps register, with all three registers connected to the same clock. The clock cycle is 120 ps: one combinational logic block plus one register. At the clock edge ending the cycle, the previous operation is latched into the register following A; in the next cycle, B reads from this register while A begins processing a new operation; thus a new operation begins every 120 ps, yielding a throughput of 1 s / 120 ps = 8.33 GOPS, which is 2.67× that of the previous slide. An operation must traverse three logic blocks and three registers, incurring a latency of 360 ps, longer than the 320 ps on the previous page.
Why registers must be added: stage B needs the output of stage A. On the previous page, A and B performed parts of the same operation, so results passed directly over wires; here, in any single cycle, A and B process two distinct operations, and B requires the result computed by A in the previous cycle; that result must be preserved in a register for B, so each block is followed by a register storing intermediate results.
Common misconception: assuming a 3-stage pipeline cuts latency to one-third. Latency actually increases from 320 ps to 360 ps; what is shortened is the interval between starts of consecutive operations, which increases throughput.
Question at the end of the page: In a 3-stage pipeline, how many operations are in flight simultaneously? What does a space-time diagram plotting three operations against time look like?
'''
# src:
# 
# 本页照搬旧讲义 ICS1 第 17 讲第 5 页「3-Way Pipelined Version」，图与文字译成中文。
# 组合逻辑分成 A、B、C 三块，每块 100 ps，每块之后一个 20 ps 的寄存器，三个寄存器接同一个时钟。时钟周期是 120 ps：一块组合逻辑加一个寄存器。前一个操作在周期结束的时钟沿存入 A 之后的寄存器，B 在下一个周期从这个寄存器读入，A 同时开始处理新的操作，所以每 120 ps 开始一个新的操作，吞吐率是 1 s / 120 ps = 8.33 GOPS，上一页的 2.67 倍。一个操作要经过三块逻辑与三个寄存器，延迟 360 ps，比上一页的 320 ps 长。
# 为什么要加寄存器：B 要用 A 的结果。上一页里 A、B 做的是同一个操作，结果直接经导线传过去；现在同一个周期里 A 与 B 做的是两个不同的操作，B 要用的是 A 在上一个周期算出的结果，这个结果要保存下来给 B 用，所以每块之后要加一个寄存器存放中间结果。
# 学生易错：以为三级流水线把延迟缩短为三分之一。延迟由 320 ps 增加到 360 ps，缩短的是相邻两个操作开始的间隔，提高的是吞吐率。
# 页末的问题：三级流水线里同一时刻有几个操作在处理中？以时间为横轴把三个操作画出来是什么样？


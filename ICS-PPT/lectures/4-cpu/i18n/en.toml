# 收益：执行级空闲的周期由 3 个减为 2 个，五条指令全部写回由周期 12 提前到周期 11。本例只有一条无关指令，又只等 3 个周期，省下的是一个周期；真实处理器读内存可能要几十到上百个周期，等待期间可以先执行的指令更多，包括后面几轮循环中读 x[i]、w[i] 的指令，几次读内存的等待因此重叠。

['llm-pp-fill.slide.1']
src_hash = 'ac9de17f'
text = '''
- While transferring the result of Request 1 to GPU 2, GPU 1 begins processing Request 2; in the next cycle, it begins Request 3. Starting in Cycle 4, all 4 GPUs compute simultaneously on distinct requests.
- Each request still requires 4 cycles (**latency** remains unchanged), while requests completed per cycle increase (**throughput** increases). The space-time diagram mirrors the pipeline diagrams of Part 1.
'''
# src:
# 
# - GPU 1 将请求 1 的结果传给 GPU 2 的同时，开始处理请求 2；下一个周期开始处理请求 3。从周期 4 起，4 块 GPU 同时工作，各自处理不同的请求。
# - 每个请求仍需 4 个周期（**延迟**不变），每个周期完成的请求数增加（**吞吐**提高）。时空图的形状与第一部分的流水线时空图相同。

['llm-pp-fill.notes.1']
src_hash = '02544b6c'
text = '''
This sequence has 4 frames: Frame 1 shows Request 1 entering GPU 1; Frame 2 shows Request 1 on GPU 2 while Request 2 enters GPU 1; Frame 3 reaches Cycle 4 where all 4 GPUs process distinct requests simultaneously, highlighted in orange; Frame 4 completes through Cycle 7 with red brackets marking fill and drain bubbles: once the pipeline is full, one request completes per cycle, but bubbles remain at the boundaries.
Point-by-point comparison with the "Pipeline Space-Time Diagram" page: there, Cycle 5 had instructions in all 5 stages, writing back one instruction per cycle thereafter; here, Cycle 4 has requests on all 4 GPUs, completing one request per cycle thereafter. A single instruction still requires 5 cycles, and a single request still requires 4 cycles.
Request sources: online serving handles concurrent independent user requests; offline training divides batches into micro-batches fed sequentially. Both yield identical space-time diagrams.
Common misconception: assuming bubbles vanish entirely once the pipeline fills. In Frame 4, downstream GPUs in Cycles 1–3 have not received work yet, and upstream GPUs in Cycles 5–7 have exhausted inputs; these boundary bubbles cannot be eliminated.
Question at the end of the page: What fraction of execution time do fill and drain bubbles occupy?
'''
# src:
# 
# 本页共 4 帧：第 1 帧只有请求 1 进入 GPU 1；第 2 帧请求 1 进入 GPU 2，请求 2 进入 GPU 1；第 3 帧到周期 4，4 块 GPU 各处理一个请求，橙框标出这一列；第 4 帧补齐到周期 7，红括号标出首尾两端的 bubble：流水线填满后每个周期完成一个请求，首尾两端仍有 bubble。
# 与「流水线时空图」一页逐项对照：那里周期 5 五级都有指令，从周期 5 起每周期写回一条；这里周期 4 四块 GPU 都有请求，从周期 4 起每个周期完成一个请求。一条指令仍需 5 个周期，一个请求仍需 4 个周期。
# 请求的来源：在线服务同时接收许多用户的请求，各请求相互独立；训练时将一批数据分成若干小批依次送入。两种情况在时空图上的画法相同。
# 学生易错：以为流水线填满后就不再有 bubble。第 4 帧中，周期 1–3 后面的 GPU 尚未收到请求，周期 5–7 前面的 GPU 已无新请求，这两处 bubble 无法消除。
# 页末的问题：首尾两端的 bubble 占多大比例？

['llm-pp-ratio.title']
src_hash = '24825bfa'
text = 'Bubble Ratio'
# src: bubble 占比

['llm-pp-ratio.slide.1']
src_hash = '10bbb1af'
text = '''
- Bubbles at both ends arise from pipeline fill (downstream GPUs have not received requests yet) and pipeline drain (upstream GPUs have exhausted new requests).
- 4 GPUs (K = 4) processing 8 consecutive requests (M = 8): 4 × 11 = 44 total slots, with 12 bubble slots, accounting for 27%. In general, <mark>bubble ratio = (K − 1) ÷ (M + K − 1)</mark>.
- Larger numbers of consecutive requests reduce the bubble ratio; higher GPU counts K increase the bubble ratio.
'''

# - 这种依赖即第二部分的 data hazard：后一项计算的输入是前一项计算的输出，两者之间只能插入 <mark>bubble</mark>。

['llm-pp-decode.notes.1']
src_hash = '0497bc5e'
text = '''
This slide plots the autoregressive dependency from "Autoregressive Generation" onto the space-time diagram: input to Token 2 contains Token 1, which emerges only after GPU 4 completes computation. An arrow points from Token 1 on GPU 4 in Cycle 4 to Token 2 on GPU 1 in Cycle 5, leaving GPU 1 with bubbles during the intervening 3 cycles. Compare with "Forwarding After a One-Cycle Stall": imull waited for movl memory access to complete, while Token 2 waits for GPU 4 to output Token 1; that incurred a 1-cycle stall, whereas this incurs a 3-cycle wait (one cycle each on GPUs 2, 3, and 4).
Consequently, for a single user generating tokens sequentially, a 4-GPU pipeline runs at the same speed as a single GPU: generating 2 tokens requires 8 cycles.
Prompt tokens are all known upfront, free of inter-token dependencies, allowing one token to enter each cycle as shown on earlier slides; this explains why prompt prefill is fast while token generation (decode) is slow. Measurements (examples/llm_stages.py): prompt prefill at 1455.8 tokens/s versus token generation at 190.2 tokens/s.
Common misconception: assuming bubbles signify GPU hardware failure or power waste. Bubbles indicate the GPU has no computational work available in that cycle.
Question at the end of the page: Must requests from other users wait for this token?
'''
# src:
# 
# 本页将「自回归生成」一页的依赖画在时空图上：词 2 的输入包含词 1，词 1 要在 GPU 4 完成计算后才产生。图中箭头从 GPU 4 周期 4 的词 1 指向 GPU 1 周期 5 的词 2，其间 3 个周期 GPU 1 只有 bubble。与「stall 一个周期后转发」一页对照：imull 等待 movl 访存结束，词 2 等待 GPU 4 输出词 1；那里 stall 一个周期，这里等待 3 个周期（词 1 在 GPU 2、3、4 上各占一个周期）。
# 因此单个用户逐词生成时，4 块 GPU 组成的流水线与 1 块 GPU 速度相同：8 个周期只生成 2 个词。
# 提示词中的词全部已知，相互之间没有这种依赖，可以像前两页那样每个周期进入一个，这是 prefill 快、逐词生成（decode）慢的原因之一。实测（examples/llm_stages.py）：处理提示词 1455.8 词/秒，逐词生成 190.2 词/秒。
# 学生易错：以为出现 bubble 是 GPU 故障或空转耗电。bubble 表示 GPU 在该周期没有可计算的输入。

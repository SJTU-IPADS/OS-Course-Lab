['question.slide.1']
src_hash = '8ea66ba5'
text = '''
**Basic Model of Sequential Execution**:

1. Fetch an instruction from memory according to the program counter **PC** and execute it;
2. Increment the PC by the instruction length to point to the next instruction;
3. Repeat the process above: **execute instructions one after another**.
'''
# src:
# 
# **顺序执行的基本模型**：
# 
# 1. 按程序计数器 **PC** 从内存取出一条指令并执行；
# 2. PC 增加指令长度，指向下一条指令；
# 3. 重复上述过程，**一条执行完，再执行下一条**。

['question.highlight.1']
src_hash = 'be2632f9'
text = 'Does the CPU have more efficient execution modes?'
# src: CPU 是否有更高效的执行模式？

['question.image.1.footnote.1']
src_hash = 'dc833895'
text = 'Intel Core Ultra 9 285K (Arrow Lake): [FritzchensFritz](https://www.flickr.com/photos/130561288@N04/54493521226/), [CC0](https://creativecommons.org/publicdomain/zero/1.0/), scaled proportionally.'
# src: Intel Core Ultra 9 285K（Arrow Lake）：[FritzchensFritz](https://www.flickr.com/photos/130561288@N04/54493521226/)，[CC0](https://creativecommons.org/publicdomain/zero/1.0/)，原图等比缩放。

['question.notes.1']
src_hash = '32c4debb'
text = '''
Begins with six consecutive x86-64 instructions: write 3 and 5 into %eax and %edx respectively, add them to get 8, multiply by 2 to get 16, copy the result to %ecx, and subtract 1 to get 15. The addresses on the left show relative offsets in this code: the PC sequentially passes 0x00, 0x05, 0x0a, 0x0c, 0x0f, 0x11, and finally points to 0x14. Instruction lengths are 5, 5, 2, 3, 2, and 3 bytes respectively. First reviews the basic model of sequential execution: the PC provides the address of the current instruction, the CPU fetches and executes it according to the PC, increments the PC by the instruction length, and fetches the next instruction. Jump instructions update the PC based on jump outcomes; the example on this page involves no jumps.
Prompt students to consider: if an instruction begins only after the previous one finishes, is any hardware left idle during execution? Can processing of multiple instructions overlap in time while preserving the program-specified results? These two questions motivate the execution modes of this lecture.
Common misconception: equating the program-specified execution order with the requirement that all internal hardware operations must complete sequentially. Internal CPU execution can overlap, while the final visible results must still conform to the program specification.
The figure shows a delidded die photograph of the Intel Core Ultra 9 285K (Arrow Lake), displaying multiple dies within the package, used solely to show an actual physical processor; the five-stage breakdown used later in this lecture is an instructional model. Photograph taken by FritzchensFritz on November 28, 2024, licensed under CC0, sourced from a 1280-pixel thumbnail on Wikimedia Commons, scaled proportionally, with source and license listed in the footer.
Question at the end of the page: Which steps does an instruction pass through inside the processor?
'''
# src:
# 
# 以六条连续的 x86-64 指令开场：先将 3、5 分别写入 %eax、%edx，相加得到 8，再乘 2 得到 16，将结果复制到 %ecx 后减 1，得到 15。左侧地址为这段代码中的相对位置：PC 依次经过 0x00、0x05、0x0a、0x0c、0x0f、0x11，最后指向 0x14。各条指令长度依次为 5、5、2、3、2、3 字节。先回顾顺序执行的基本模型：PC 给出当前指令的地址，CPU 按 PC 取指并执行，再增加指令长度、取下一条。跳转指令按跳转结果更新 PC，本页的例子不涉及跳转。
# 让学生思考：如果一条指令执行完才开始下一条，执行过程中是否有硬件空闲？是否可以在保持程序规定结果的前提下，让多条指令的处理在时间上重叠？这两个问题引出本讲的执行模式。
# 学生易错：把程序规定的执行顺序等同于硬件内部所有操作必须依次完成。CPU 的内部执行过程可以重叠，最终可见的结果仍须符合程序规定。
# 配图为 Intel Core Ultra 9 285K（Arrow Lake）的开盖照片，可见封装内的多块芯片，只用于展示处理器实物；本讲后续使用的五级划分是教学模型。照片由 FritzchensFritz 于 2024 年 11 月 28 日拍摄，采用 CC0 许可，取自 Wikimedia Commons 的 1280 像素缩略图，页面只作等比缩放，来源与许可列在页脚。
# 页末的问题：一条指令在处理器内部要经过哪几个步骤？


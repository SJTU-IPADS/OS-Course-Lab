# src: 空着的执行部件，能否执行另一个线程的指令？

['smt-idle.notes.1']
src_hash = '1018287a'
text = '''
Dual execution units are carried over from Frame 2 of "Superscalar Execution". The diagram is schematic: columns represent cycles, rows represent execution units, and cells mark instructions belonging to Thread A (blue) without detailing specific opcodes; distribution across cycles illustrates two types of underutilization rather than a specific trace. Dashed cells represent idle execution units, matching "Comparing Out-of-Order Execution with In-Order Pipelines". Thread A occupies 9 of 20 available execution slots.
Two types of underutilization: single-ready cycles (Cycles 2, 3, 8–10) leave one execution unit idle due to data dependencies (e.g., imull needing w[i] from movl, or addl %ecx,%r9d needing the imull product); zero-ready cycles (Cycles 4–6) leave both units idle while waiting 3 cycles for memory loads.
Why the diagram is schematic: tracing dot_product across iterations with dual execution units and 3-cycle memory reads shows that out-of-order execution overlaps independent instructions from future iterations, filling most slots after several cycles. Extended underutilization occurs during main memory accesses of tens to hundreds of cycles (Lecture 5 on memory hierarchy), when internal instruction buffers fill, or in long serialized dependency chains.
Empirical gap: in Lecture 3, single-thread mini-ollama achieved 0.77 Token/s versus the 1.1 Token/s ceiling estimated from 5-issue execution; this corresponds to an average issue rate of ~3.5 instructions per cycle, leaving ~30% of issue slots idle.
Common misconception: assuming out-of-order execution fully saturates execution units every cycle. Out-of-order execution selects only from fetched and decoded instructions of that thread; dependencies and memory waits continue to leave units idle.
Question at the end of the page: Because instructions of another thread have no dependencies on Thread A, can idle execution units execute them? What hardware must be added to the core?
'''
# src:
# 
# 两个执行部件取自「超标量」一页第 2 帧。图是示意：一列是一个周期，一行是一个执行部件，格子里写的是这条指令属于线程 A（蓝色），不写具体指令；每个周期的条数是为说明两种空格选的，不对应某段代码的逐周期时序。白底虚线格是这个周期没有指令可执行的执行部件，与「乱序执行与顺序流水线对比」一页的画法相同。20 格中线程 A 用了 9 格。
# 两种空格。一个周期只有 1 条就绪（周期 2、3、8 至 10），另一个执行部件空着，原因是指令之间的依赖：后一条要用前一条的结果，例如 imull 要用 movl 读出的 w[i]，addl %ecx,%r9d 要用 imull 的乘积。一个周期 1 条也没有（周期 4 至 6），线程在等读内存，3 个周期与第三部分「读内存要 3 个周期」的假设相同。
# 图为什么是示意：按第三部分的规则逐周期推演 dot_product 的循环（两个执行部件、读内存 3 个周期），乱序执行会让后几轮循环中无关的指令提前执行，几个周期后两个执行部件大都用上。一个线程长时间留下空格，是在读内存要几十到上百个周期（访问主存，下一讲「存储层次」）、处理器内部能保存的译码后指令又有限时，以及依赖链很长、每条都要用前一条结果的代码中。
# 实测的差距：第 3 讲中 mini-ollama 一个线程 0.77 Token/s，按每个周期开始执行 5 条估算的上限是 1.1 Token/s；按同样的估算，平均每个周期开始执行约 3.5 条，5 条的位置约有三成空着。
# 学生易错：以为有了乱序执行，执行部件每个周期都是满的。乱序执行只在这个线程已经取进来、译码的指令中挑；依赖与读内存的等待仍让执行部件空着。

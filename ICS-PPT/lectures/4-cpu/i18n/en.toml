# src: 乱序执行

['out-of-order.slide.1']
src_hash = '41854f21'
text = 'In Cycle 6 the execution unit is idle, and `addl $1,%eax` is decoded with operands ready, <mark>executing ahead of the preceding two instructions</mark>; `cmpl` uses its result and executes in Cycle 9. Write-back still follows program order, and two instructions can write back in the same cycle:'

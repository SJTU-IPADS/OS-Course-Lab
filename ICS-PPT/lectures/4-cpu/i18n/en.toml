['out-of-order.notes.1']
src_hash = '6d9af338'
text = '''
The five instructions, the assumption that reading w[i] takes 3 cycles, and the processor buffering instructions after decode are identical to the "In-Order Pipeline with a 3-Cycle Memory Read" page; grid cell positions are identical and can be compared cell by cell. The diagram begins from Cycle 3.
Following the two rules of out-of-order execution from the previous page: each cycle, the execution unit selects an instruction with ready operands from among decoded waiting instructions, prioritizing older instructions in program order when multiple are ready; write-back follows program order, never writing back an instruction ahead of predecessors, and may write back in the same cycle as the preceding instruction.
This sequence comprises 4 frames: Frame 1 (Cycles 3–5) shows movl reading w[i], imull waiting for w[i], and addl %ecx,%r9d waiting for the product; red stall cells indicate decoded instructions waiting for execution. Frame 2 (Cycle 6) shows imull still waiting while the execution unit is idle; addl $1,%eax (decoded in Cycle 5 with operand %eax ready) executes early, highlighted by an orange dashed box. Frame 3 (Cycle 7) shows w[i] loaded and routed via a green angled path into the execute stage of imull, matching the "Forwarding After a One-Cycle Stall" page. Frame 4 (Cycles 8–12) forwards the imull product via an orange angled path into the execute stage of addl %ecx,%r9d (as on the "Data Forwarding" page). The result of addl $1,%eax buffers internally from Cycle 8 (dashed "waiting for write-back" cells) and writes back alongside addl %ecx,%r9d in Cycle 10; cmpl requires the updated %eax and is ready from Cycle 7, but in Cycles 7 and 8 the execution unit is assigned to older imull and addl %ecx,%r9d in program order, so cmpl executes in Cycle 9 and writes back in Cycle 11; the updated %eax buffers internally before write-back, and a second orange angled path routes it from the "waiting for write-back" cell into the execute stage of cmpl. Retirement cycles are 7, 9, 10, 10, and 11, with none retiring ahead of predecessors.
Why addl $1,%eax does not execute in Cycle 4 or 5: it fetches in Cycle 4 and decodes in Cycle 5, so Cycle 6 is the earliest possible execution cycle. The execute stage remains idle in Cycles 4 and 5; fetching independent instructions earlier exposes more idle cycles to utilize.
Writing back two instructions in the same cycle (Cycle 10 for addl %ecx,%r9d and addl $1,%eax) requires two register write ports, writing to distinct registers (%r9d and %eax). Under in-order execution, only one instruction reached write-back per cycle, leaving a second write port unused. The slide specifies two write-backs per cycle: if limited to one, addl $1,%eax would wait until Cycle 11 and cmpl until Cycle 12, completing at the same time as in-order execution. Actual processors commit 4 to 8 instructions per cycle (notes on the "Instruction Dependencies in Out-of-Order Execution" page).
Common misconception 1: assuming out-of-order execution alters program results. Write-back preserves program order, ensuring register and memory state transitions match sequential execution; internal computation order is invisible to software. Common misconception 2: assuming %eax assumes its new value upon completing execution in Cycle 6. As with %ecx on the "Data Forwarding" page, results remain internal until formal write-back at the clock edge ending Cycle 10; cmpl consumes the uncommitted %eax directly from internal buffers in Cycle 9.
Question at the end of the page: Compared to sequential execution, how much faster is out-of-order execution, and do program results change?
'''

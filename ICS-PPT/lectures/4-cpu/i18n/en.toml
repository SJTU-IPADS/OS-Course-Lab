# 两条总结分别对应本讲的两部分内容：第一条对应第一部分（流水线原理、吞吐与延迟），第二条对应第二、三部分（最慢一级决定周期、data hazard 与 control hazard 引起的 stall、分支预测与作废）。第四部分说明这些结论在 CPU 之外同样成立。

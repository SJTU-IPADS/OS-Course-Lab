['op-stages.notes.1']
src_hash = 'fcade906'
text = '''
This page corresponds to page 20 of Lecture 14 in the old ICS1 slides, originally showing Y86 opq rA, rB (encoded as 6 fn rA rB, 2 bytes). Corresponding x86-64 instructions: opcode is 1 byte (addl 01, subl 29, andl 21, orl 09, xorl 31), followed by the ModR/M operand byte divided into 2-bit, 3-bit, and 3-bit fields: mm, rrr, and bbb; when mm is 11, B is register bbb, R is register rrr, and the result is written to B.
The forms on this page omit the REX prefix: R and B are among the eight registers %eax through %edi, with 32-bit operands. For 64-bit operations or when using %r8 through %r15, an additional 1-byte REX prefix preceding the opcode has values between 0x40 and 0x4f: addq %rdx, %rax is 48 01 d0 (64-bit operation), addl %r8d, %eax is 44 01 c0 (using %r8d), fetching 3 bytes and adding 3 to the PC. movslq %eax, %r8 on the "Hardware Units in the Five Stages" page is 4c 63 c0, beginning with the REX prefix 4c. Bit-level meanings of the REX prefix are not expanded here.
Arithmetic and logical operations in x86-64 set four flags: CF, ZF, SF, and OF; Y86 has only three flags: ZF, SF, and OF.
Common misconception: assuming the result of addl R, B is written into R. In AT&T syntax, the result is written into the second operand B.
Question at the end of the page: Can the values read and written in each stage be written in the form of "destination ← source"?
'''
# src:
# 
# 本页对应旧讲义 ICS1 第 14 讲第 20 页，原页是 Y86 的 opq rA, rB（编码 6 fn rA rB，2 字节）。x86-64 的对应指令：操作码 1 个字节（addl 01、subl 29、andl 21、orl 09、xorl 31），其后是操作数字节，按 2 位、3 位、3 位分成 mm、rrr、bbb 三段；mm 为 11 时 B 是 bbb 号寄存器，R 是 rrr 号寄存器，运算结果写入 B。
# 本页的形式不带 REX 前缀：R、B 都在 %eax 到 %edi 这 8 个寄存器之中，操作数是 32 位。64 位运算或用到 %r8 到 %r15 时，操作码之前另有 1 个字节的 REX 前缀，取值在 0x40 到 0x4f 之间：addq %rdx, %rax 是 48 01 d0（64 位运算），addl %r8d, %eax 是 44 01 c0（用到 %r8d），取指读 3 个字节，PC 加 3。「五个阶段使用的硬件」一页的 movslq %eax, %r8 是 4c 63 c0，以 REX 前缀 4c 开头。REX 前缀各位的含义本讲不展开。
# x86-64 的算术与逻辑运算设置 CF、ZF、SF、OF 四个标志位；Y86 只有 ZF、SF、OF 三个条件码。
# 学生易错：以为 addl R, B 的结果写入 R。AT&T 写法中结果写入第二个操作数 B。
# 页末的问题：各阶段读写的值，能否写成「目标 ← 来源」的形式？


['llm-spec-gain.slide.2']
src_hash = '361ead71'
text = '''
- Overhead: The time spent by the draft model predicting 4 tokens, plus minor redundant computation at squashed positions. Execution time is dominated by memory weight reads; evaluating extra positions adds negligible delay.
- Typical speedup is 2–3×. Higher draft accuracy and faster draft models increase speedup; highly structured text (code, fixed formats) yields higher prediction accuracy.
'''
# src:
# 
# - 代价：小模型预测 4 个词的时间，以及作废位置上的少量额外计算。决定耗时的是读取权重的次数，多计算几个位置几乎不增加时间。
# - 典型加速比为 2–3 倍。预测准确率越高、小模型越快，加速比越大；文本越有规律（代码、固定格式），预测准确率越高。

['llm-spec-gain.notes.1']
src_hash = '5d092122'
text = '''
Estimation: generating N tokens autoregressively streams weights N times. Speculative decoding streams target weights once per round, advancing by (average correct predictions + 1) tokens; with 2 correct predictions on average, each weight read yields 3 tokens, cutting target weight reads to 1/3 and achieving a net 2–3× speedup after draft overhead. Leviathan et al. (ICML 2023) and Chen et al. report 2–3× speedups experimentally.
Prediction accuracy varies with text domain: code, JSON, and formatted templates exhibit high predictability, yielding high draft accuracy; open-ended writing yields lower accuracy. Thus speedups vary across tasks.
Comparison with branch prediction: branch prediction gains depend on accuracy (the 95% cited in the notes of the "Hardware Branch Predictors" page), as do speculative decoding gains; both save more time with higher accuracy, with bounded misprediction penalties.
Architectural variants include multi-head draft mechanisms (Medusa) or n-gram retrieval from context, following the same speculative paradigm.
Question at the end of the page: Beyond CPUs and LLM inference, what other computer systems employ pipelining?
'''
# src:
# 
# 估算：逐词生成 N 个词需要读取 N 遍权重。投机推理每轮读取一遍大模型权重，平均前进（平均预测正确数 + 1）个词；若平均预测正确 2 个，每读取一遍权重得到 3 个词，读取次数降为 1/3，扣除小模型的时间，总体加速 2–3 倍。Leviathan 等（ICML 2023）的实验报告了 2–3 倍的加速，Chen 等的结果相近。
# 预测准确率取决于文本：代码、JSON、格式固定的公文等可预测性高的内容，小模型预测正确的比例高；开放式写作则较低。因此同一系统在不同任务上的加速比不同。
# 与分支预测对照：分支预测的收益取决于预测准确率（「硬件分支预测器」一页讲稿引用的 95%），投机推理的收益取决于小模型的预测准确率；两者都是预测越准确，节省的时间越多，预测错误的代价有上限。
# 后续的变体只提名称：用大模型附加的几个输出头代替独立的小模型（Medusa），或从前文中查找重复片段（n-gram）作为预测，思路相同。
# 页末的问题：除 CPU 与大模型推理外，还有哪些系统采用流水线？


['op-table.notes.1']
src_hash = '6d211afc'
text = '''
This page corresponds to page 21 of Lecture 14 in the old ICS1 slides, maintaining the table structure while replacing instructions with x86-64 OPl R, B.
The execute stage computes valB OP valA: subl R, B computes B − R, consistent with AT&T operand order. The memory row is empty because arithmetic instructions do not access memory.
valP is the next instruction address computed in the fetch stage; the PC update row represents writing valP into the PC at the clock edge ending the cycle; the five-stage model does not list it as a separate stage.
Common misconception: assuming valA, valB, and valE are registers accessible to programs. They are intermediate signals passed between stages, invisible to programs.
Question at the end of the page: Substituting a concrete instruction and register values, what does each stage compute?
'''

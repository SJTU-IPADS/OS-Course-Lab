`addl` reads `%ecx` in the decode stage, while the product of `imull` is written into `%ecx` only in the write-back stage. Without pipeline intervention, `addl` reads the stale value of `%ecx` in Cycle 3, computing an incorrect sum.

 $$
 \mathit{sum} = \mathit{sum} + w_i \times x_i = 10 + 3 \times 4
 $$
'''

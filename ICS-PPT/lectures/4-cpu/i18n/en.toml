['forward-fig.notes.1']
src_hash = '3852c644'
text = '''
Core concept of data forwarding: route results generated by a preceding instruction but not yet written to the register file directly to subsequent dependent instructions. When addl enters execute, imull has advanced to memory; the product is held in the pipeline register between execute and memory, and dedicated forwarding paths route it directly into the ALU input of addl in execute. The CS:APP PIPE model depicts forwarding into decode; whether routed to decode outputs or execute inputs, the effect is identical: eliminating delays waiting for write-back. Specific wiring of forwarding control logic is omitted here, emphasizing the elimination of stalls.
This sequence comprises 5 frames advancing cycle by cycle: Frame 2 (Cycle 3) computes the product in execute for imull; Frame 3 (Cycle 4) displays the forwarding arrow as addl enters execute; Frame 4 (Cycle 5) writes back %ecx for imull; Frame 5 completes the five stages for addl, presenting the key takeaway.
The orange angled arrow points from imull in execute (Cycle 3) to addl in execute (Cycle 4): imull computes the product in Cycle 3, and addl consumes the forwarded product directly upon entering execute in Cycle 4.
Comparison with previous slide: imull write-back occurs in Cycle 5, one cycle after addl execution and two cycles after the product is computed. Waiting for write-back forced addl to stall for 3 cycles and write back in Cycle 9; forwarding removes all 3 stall cycles, allowing addl to advance through all five stages without bubbles and write back in Cycle 6. Applying numbers from "Arithmetic Data Hazards": addl receives forwarded 12 in Cycle 4, computing 10 + 12 = 22 correctly.
The imull row represents the register multiplication instruction after splitting, performing no memory operation.
Common misconception: misinterpreting the angled arrow as register %ecx being updated early in Cycle 4. In Cycle 4, %ecx still holds its stale value; addl receives a forwarded copy from the pipeline register, and %ecx is updated formally only during write-back in Cycle 5.
Question at the end of the page: Results of arithmetic instructions are ready at the end of execute, allowing forwarding in time; if a preceding instruction loads its result from memory, can forwarding still meet the execute stage of the next instruction?
'''
# src:
# 
# 数据转发的核心思想：将前一条指令已经产生但尚未写回寄存器堆的运算结果，提前传送给后续需要使用该结果的指令。当 addl 进入执行级时，imull 已经离开执行级进入访存级；此时乘积结果正保存在执行级与访存级之间的级间寄存器中，硬件通过专用数据通路将其直接送入 addl 所在执行级的算术逻辑单元（ALU）输入端。教材 CS:APP 的 PIPE 模型将其画作送入译码级，无论画在译码出口还是执行入口，本质完全一致：省去等待写回的过程。本讲不展开转发控制电路的具体连线，只需明确该机制可消除此类等待。
# 这一页有 5 帧，每帧推进一个周期：第 2 帧（周期 3）imull 在执行阶段算出乘积；第 3 帧（周期 4）出现转发箭头，addl 进入执行；第 4 帧（周期 5）imull 写回 %ecx；第 5 帧 addl 走完五级，结论在这一帧出现。
# 图中的橙色折线箭头从 imull 的执行格（第 3 周期）指向 addl 的执行格（第 4 周期）：imull 在第 3 周期算出乘积，addl 在紧接着的第 4 周期进入执行级并直接使用转发过来的乘积。
# 与上一页对比：imull 的「写回」格位于第 5 周期，比 addl 的执行阶段晚一个周期，比乘积实际算出的时刻晚两个周期。等待写回时 addl stall 3 个周期、第 9 周期写回；转发消除了这 3 个周期的等待，addl 所在行的五个阶段紧密相连、没有「停」格，第 6 周期写回，不插入 bubble。代入「算术 data hazard」一页的数：addl 在第 4 周期拿到转发来的 12，算出 10 + 12 = 22，结果正确。
# 图中 imull 一行是拆分后做寄存器乘法的那一条（见「算术 data hazard」一页的讲稿），它的访存格与 addl 一样没有操作。
# 学生易错：将折线箭头误解为「在第 4 周期时寄存器 %ecx 已经被提前写入」。实际上第 4 周期内 %ecx 依然存放旧值，addl 获取的是来自级间寄存器的数据副本，%ecx 的正式更新仍发生于第 5 周期的写回阶段。

['stages.slide.1']
src_hash = 'b001f2c8'
text = '''
Each instruction passes through five stages <mark>sequentially</mark>:

- **Fetch**: Read an instruction from memory according to the program counter PC;
- **Decode**: Identify the operation and read source operands from the register file;
- **Execute**: Perform arithmetic/logical operations in the ALU, or compute effective memory addresses;
- **Memory**: Read data from memory for load instructions, or write data to memory for store instructions;
- **Write-back**: Write the computation result or loaded data into the destination register.

An instruction performs no operation in unused stages, such as arithmetic instructions passing directly through the memory stage.
'''
# src:
# 
# 每条指令<mark>依次</mark>经过五个阶段：
# 
# - **取指**：按程序计数器 PC 从内存读出一条指令；
# - **译码**：识别指令的操作，从寄存器堆读出源操作数；
# - **执行**：ALU 完成运算，或计算内存地址；
# - **访存**：加载指令从内存读出数据，存储指令向内存写入数据；
# - **写回**：把运算结果或读出的数据写入目的寄存器。
# 
# 指令在用不到的阶段不做操作，如算术指令在访存阶段直接通过。

['stages.notes.1']
src_hash = '2a97c96e'
text = '''
The five-stage model originates from MIPS processors: the textbook Computer Organization and Design by Hennessy and Patterson uses it to teach pipelining, and the Y86-64 pipeline implementation in CS:APP Chapter 4 uses the same five stages. MIPS instructions have fixed lengths, and only load and store instructions access memory, so each instruction uses each of the five stages once, and this order applies to all instructions.
Explain the inputs and outputs of each stage in order: Fetch takes the PC and outputs the instruction; Decode outputs the operation and source operands; Execute outputs the computation result or memory address; Memory outputs data read from memory; Write-back writes the result to the destination register. Source operands are read centrally in the decode stage, and results are written centrally in the write-back stage; data forwarding and pipeline stalls in Part 2, "Instruction Hazards in Pipelined Execution", are built on this timing premise.
Not all instructions require operations in all five stages: arithmetic instructions perform no operation in the memory stage, and store instructions perform no operation in the write-back stage. Hardware unifies the division into five stages so that all instructions follow the same pipeline structure. Classroom question: In which stage does a memory-write instruction perform no operation? Answer: Write-back stage.
Common misconception: treating the five-stage model as the actual structure of x86-64 processors. The five-stage model is an instructional model; actual processors have more stages with different divisions of labor; this lecture uses it to explain pipeline principles.
Question at the end of the page: When a concrete instruction passes through the five stages in sequence, what hardware does each stage use and what does it do?
'''
# src:
# 
# 五级划分来自 MIPS 处理器：Hennessy 与 Patterson 的教材《计算机组成与设计》用它讲流水线，CS:APP 第 4 章 Y86-64 的流水线实现也分同样的五级。MIPS 指令定长，只有加载、存储指令访问内存，所以每条指令在五个阶段中各用一次，这个顺序对所有指令都适用。
# 按顺序说明各阶段的输入与输出：取指输入 PC，输出指令；译码输出指令的操作与源操作数；执行输出运算结果或内存地址；访存输出从内存读出的数据；写回把结果写入目的寄存器。源操作数在译码阶段集中读取，结果在写回阶段集中写入；第二部分「流水线执行的指令冲突」中的数据转发与流水线停顿均建立在这一时序前提之上。
# 并非所有指令都需要全部五个阶段的操作：算术指令在访存阶段无操作，存储指令在写回阶段无操作。硬件统一划分五个阶段，是为了让所有指令遵循相同的流水线结构。课堂提问：写内存的指令在哪一阶段无操作？答：写回阶段。
# 学生易错：把五级模型当成 x86-64 处理器的实际结构。五级模型是教学模型，实际处理器的级数更多，各级的分工也不同；本讲用它说明流水线的原理。
# 页末的问题：一条具体的指令依次经过五个阶段时，每个阶段用哪些硬件、做什么？


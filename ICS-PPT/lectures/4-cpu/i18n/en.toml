['pipe-limit.notes.1']
src_hash = '95342c1f'
text = '''
This page corresponds to pages 9–10 of Lecture 17 in the old ICS1 slides, "Limitations: Nonuniform Delays": the two diagrams from page 9 are redrawn, and the three bullet points from page 10 are translated.
The top diagram divides combinational logic into blocks A, B, and C with delays of 50, 150, and 100 ps, totaling 300 ps, identical to the "Computational Example" page; each block is followed by a 20 ps register, with all three registers connected to the same clock. All three registers latch at the same clock edge, so the cycle must allow the slowest stage B to complete and latch into its register, yielding clock cycle = 150 + 20 = 170 ps. Passing through three stages gives latency = 3 × 170 = 510 ps; completing one operation every 170 ps gives throughput = 1 s / 170 ps = 5.88 GOPS. The "3-Way Pipelined Version" page evenly divided the same 300 ps into three 100 ps blocks, achieving a 120 ps clock cycle, 360 ps latency, and 8.33 GOPS throughput; here, nonuniform partitioning increases latency from 360 ps to 510 ps and reduces throughput from 8.33 GOPS to 5.88 GOPS.
The lower-right diagram is a space-time diagram of three operations, matching the format of the "Pipeline Diagrams" page: each clock cycle is 170 ps, gray dashed lines at rising edges mark cycle boundaries, and grid cells represent cycles; blue sections represent active combinational logic time, and blank areas represent idle waiting time before the clock edge. Stage A uses only 50 ps per cycle and idles for 120 ps; C uses 100 ps and idles for 70 ps; B uses 150 ps, leaving 20 ps for register setup. This illustrates the second bullet point: remaining stages are idle for most of the time.
The third bullet point: registers are inserted along circuit interconnections, and the delay of each partition is determined by the underlying circuitry, making equal division difficult. The five instruction stages exhibit similar imbalances: as in the diagram on the "One Instruction per Clock Cycle" page, fetch, execute, and memory take longer than decode and write-back. The 5-stage pipeline cycle is determined by the slowest stage plus register overhead; since the single-cycle clock is the sum of delays across all five stages of the slowest instruction, the 5-stage pipeline cycle exceeds one-fifth of the single-cycle duration.
Common misconception: averaging the three block delays (100 ps) and adding 20 ps to calculate the clock cycle. Because registers latch simultaneously, the cycle must accommodate the slowest stage B: 150 + 20 = 170 ps.
Common misconception: summing individual logic delays and three register overheads to calculate latency as 50 + 150 + 100 + 3 × 20 = 360 ps. Each stage occupies a full clock cycle; A and C must wait for the clock edge after completing, so latency is 3 × 170 = 510 ps.
Question at the end of the page: Given delays for combinational logic blocks and registers, where should registers be placed to maximize throughput?
'''
# src:
# 
# 本页照搬旧讲义 ICS1 第 17 讲第 9–10 页「Limitations: Nonuniform Delays」：第 9 页的两幅图按原页重画，第 10 页的三条文字译成中文。原第 9 页的讲稿只有一句：时钟周期 170 ps。
# 上方的图把组合逻辑分成 A、B、C 三块，用时 50、150、100 ps，合计 300 ps，与「计算的例子」一页相同；每块之后一个 20 ps 的寄存器，三个寄存器接同一个时钟。三个寄存器在同一个时钟沿存入，一个周期要让最慢的 B 算完并存入寄存器，所以时钟周期 = 150 + 20 = 170 ps。一个操作经过三级，延迟 = 3 × 170 = 510 ps；每 170 ps 完成一个操作，吞吐率 = 1 s / 170 ps = 5.88 GOPS。「三级流水线版本」一页把同样的 300 ps 均分成三块 100 ps，时钟周期 120 ps，延迟 360 ps，吞吐率 8.33 GOPS；本页的划分不均，延迟由 360 ps 增加到 510 ps，吞吐率由 8.33 GOPS 降到 5.88 GOPS。
# 右下的图是三个操作的时空图，画法与「三级流水线的时空图」一页相同：下方的时钟一个周期 170 ps，每个上升沿处的灰色虚线是周期的分界，两条虚线之间的一格是一个周期；格中蓝色部分是这一块组合逻辑的用时，空白部分是它算完之后等待时钟沿的时间。A 每个周期只用 50 ps，空闲 120 ps；C 用 100 ps，空闲 70 ps；B 用 150 ps，余下的 20 ps 是寄存器的用时。这就是第二条：其余各级在大部分时间里空闲。
# 第三条：寄存器插在电路的连线上，切开后每一块的用时由它包含的电路决定，划分出的各级往往不能做到用时相等。指令的五个阶段也是这样：「每个时钟周期执行一条指令」一页的图中，取指、执行、访存比译码、写回长。五级流水线的时钟周期由其中最慢的一级加寄存器决定，单周期实现的时钟周期是最慢的指令五个阶段的用时之和，所以五级流水线的时钟周期长于单周期实现的五分之一。
# 学生易错：用三块的平均用时 100 ps 加 20 ps 算时钟周期。三个寄存器在同一个时钟沿存入，周期要容纳最慢的 B，是 150 + 20 = 170 ps。
# 学生易错：把各块的用时与三个寄存器的用时相加，得到延迟 50 + 150 + 100 + 3 × 20 = 360 ps。每一级都占一个完整的周期，A 与 C 算完之后也要等到时钟沿，延迟是 3 × 170 = 510 ps。
# 页末的问题：已知各块组合逻辑的用时与寄存器的用时，寄存器插在哪里吞吐率最大？


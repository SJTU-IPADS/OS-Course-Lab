['pipe-practice.notes.1']
src_hash = 'a10aff1e'
text = '''
This page corresponds to page 11 of Lecture 17 in the old ICS1 slides, "Practice Problem": module widths are proportional to delays with proportions matching the "3-Way Pipelined Version" page, combinational logic is shown in blue, and clocked registers in orange. Six combinational logic blocks A through F have delays of 80, 30, 60, 50, 70, and 10 ps respectively, totaling 300 ps, followed by an end register of 20 ps; unpipelined latency is 320 ps with throughput of 1 / 320 ps = 3.12 GOPS.
Class exercise: apply the rules from the "Clock Cycle Determined by the Slowest Stage" page: clock cycle = slowest stage logic delay + register overhead, throughput = 1 / clock cycle, latency = number of stages × clock cycle. This page displays the question, and flipping to the next page reveals the answers below the same diagram.
Answer 1: Inserting 1 register between C and D creates two stages: A+B+C = 170 ps and D+E+F = 130 ps, clock cycle = 170 + 20 = 190 ps, throughput = 1 / 190 ps = 5.26 GOPS, latency = 2 × 190 = 380 ps. Inserting 2 registers between B and C, and between D and E creates three stages: A+B = 110 ps, C+D = 110 ps, and E+F = 80 ps, clock cycle = 130 ps, throughput = 7.69 GOPS, latency = 390 ps. Inserting 3 registers between A and B, C and D, and D and E creates four stages: A = 80 ps, B+C = 90 ps, D = 50 ps, and E+F = 80 ps, clock cycle = 110 ps, throughput = 9.09 GOPS, latency = 440 ps.
Answer 2: Block A cannot be partitioned further, so the clock cycle cannot be shorter than 80 + 20 = 100 ps, and throughput cannot exceed 10 GOPS. Reaching this throughput requires that each stage's combinational delay not exceed 80 ps: A, B, C, and D each form individual stages, while E+F = 80 ps forms one stage, yielding 5 stages in total with latency of 500 ps.
Common misconception: dividing modules equally by count. Stage delay is the sum of module delays within it; cycle duration is set by the slowest stage, so partitioning must minimize the delay of the slowest stage.
Common misconception: assuming higher throughput implies shorter latency. Each inserted register adds 20 ps overhead plus idle wait time: latencies are 380, 390, 440, and 500 ps.
Question at the end of the page: Where should registers be inserted, and what are the resulting clock cycle and throughput values?
'''
# src:
# 
# 本页照搬旧讲义 ICS1 第 17 讲第 11 页「Practice Problem」，图按原页逐个元素重画，题目译成中文；各模块的宽度与用时成比例，比例与「三级流水线版本」一页相同，组合逻辑用蓝色，时钟寄存器用橙色。图中六个组合逻辑模块 A 到 F 的用时分别为 80、30、60、50、70、10 ps，共 300 ps，末尾的寄存器 20 ps；不插入寄存器时延迟 320 ps，吞吐率 1/320 ps = 3.12 GOPS。
# 课堂练习：按「时钟周期由最长的阶段决定」一页的规则作答，时钟周期 = 最慢一级的组合逻辑用时 + 寄存器用时，吞吐率 = 1 / 时钟周期，延迟 = 级数 × 时钟周期。本页保留题目，翻到下一页时在相同的题图下方显示答案。
# 答案 1：插入一个寄存器，放在 C 与 D 之间，两级分别为 A+B+C = 170 ps、D+E+F = 130 ps，时钟周期 170 + 20 = 190 ps，吞吐率 1/190 ps = 5.26 GOPS，延迟 2 × 190 = 380 ps。插入两个寄存器，放在 B 与 C、D 与 E 之间，三级分别为 A+B = 110 ps、C+D = 110 ps、E+F = 80 ps，时钟周期 130 ps，吞吐率 7.69 GOPS，延迟 390 ps。插入三个寄存器，放在 A 与 B、C 与 D、D 与 E 之间，四级分别为 A = 80 ps、B+C = 90 ps、D = 50 ps、E+F = 80 ps，时钟周期 110 ps，吞吐率 9.09 GOPS，延迟 440 ps。
# 答案 2：A 不能再分，所以时钟周期不短于 80 + 20 = 100 ps，吞吐率不超过 10 GOPS。达到这个吞吐率要求每一级的组合逻辑不超过 80 ps：A、B、C、D 各占一级，E+F = 80 ps 占一级，共 5 级，延迟 500 ps。
# 学生易错：按模块的个数平均切分。每级的用时是其中各模块用时之和，时钟周期由最慢的一级决定，切分要让最慢的一级最短。
# 学生易错：以为吞吐率提高时延迟也缩短。每插入一个寄存器延迟就加 20 ps 再加空等：380 ps、390 ps、440 ps、500 ps。
# 页末的问题：各组寄存器应当插在哪里，所得的时钟周期与吞吐率各是多少？


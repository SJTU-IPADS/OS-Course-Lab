['pipe-diagram.notes.1']
src_hash = 'c4f34bca'
text = '''
This page corresponds to page 6 of Lecture 17 in the old ICS1 slides, "Pipeline Diagrams", with the original time axis replaced by a clock waveform. Such diagrams are called space-time diagrams: the horizontal axis represents time, each row represents an operation (OP), and in a processor an operation corresponds to an instruction.
The clock waveform beneath both diagrams is identical to the signal on the "Clock Cycle" page: a vertical dashed line rises at each rising edge across rows; the interval between two dashed lines is one clock cycle, and results latch into registers at rising edges. In the top diagram, one clock cycle is one continuous bar of 320 ps (300 ps combinational logic plus 20 ps register overhead from the "Computational Example" page); in the bottom diagram, one clock cycle is one grid cell of 120 ps (100 ps plus 20 ps from the "3-Way Pipelined Version" page).
The top diagram depicts the unpipelined case: the next operation cannot start until the previous one completes, with three bars arranged end-to-end. The bottom diagram depicts the 3-way pipeline: each operation is divided into cells A, B, and C occupying one cycle each; each subsequent row starts one cycle later, allowing three operations to overlap. The orange dashed box highlights one cycle column: OP1 in stage C, OP2 in stage B, and OP3 in stage A, with three operations in flight simultaneously.
Common misconception: assuming an individual operation runs faster in the bottom diagram. Across its three cells, an operation in the bottom diagram takes longer in total than a single bar in the top diagram (360 ps vs. 320 ps); what is faster is the total time to finish all three operations, due to overlap.
Question at the end of the page: In a processor, do the five stages of an instruction also each have dedicated hardware like blocks A, B, and C here? In a single-cycle implementation, when does each of these hardware units operate?
'''
# src:
# 
# 本页照搬旧讲义 ICS1 第 17 讲第 6 页「Pipeline Diagrams」，两幅图与文字译成中文；原页图下方的时间轴换成了时钟。这种图称为时空图：横轴是时间，每一行是一个操作，OP 表示一个操作，在处理器中就是一条指令。
# 两幅图下方的时钟与「时钟周期」一页的时钟是同一个信号：每个上升沿处有一条灰色虚线，向上穿过各行，相邻两条虚线之间是一个时钟周期，结果在上升沿存入寄存器。上图一个时钟周期是一个条块，320 ps（「计算的例子」一页的 300 ps 组合逻辑加 20 ps 寄存器）；下图一个时钟周期是一格，120 ps（「三级流水线版本」一页的 100 ps 加 20 ps）。
# 上图是无流水线的情况：一个操作做完，下一个操作才能开始，三个条块首尾相接。下图是三级流水线：每个操作分成 A、B、C 三格，各占一个周期，下一行比上一行晚一格开始，三个操作重叠。橙色虚线框框出的一列是其中一个周期：OP1 在 C 级，OP2 在 B 级，OP3 在 A 级，三个操作同时处于处理中。
# 学生易错：以为下图中一个操作比上图做得快。下图一个操作的三格合起来比上图的一个条块更长（360 ps 对 320 ps）；快的是三个操作全部做完的时间，因为它们重叠了。
# 页末的问题：处理器里一条指令的五个阶段，是否也像这里的 A、B、C 三块那样各有一组硬件？单周期实现中，这些硬件各在什么时候工作？

['stage-hw.title']
src_hash = '7c7d1e08'
text = 'Principles of Pipelining'
# src: 流水线原理

['stage-hw.slide.1']
src_hash = '9b42bb1c'
text = '''
- **Stages partitioned by hardware**: The five stages are each handled by independent hardware units; each row in the diagram represents one set of hardware;
- **In a single-cycle implementation**: When an instruction is in a given stage, only that stage's hardware is active, while the other four sets remain <mark>idle</mark>.
'''
# src:
# 
# - **阶段按硬件划分**：五个阶段各由一组独立的硬件负责，图中每一行是一组硬件；
# - **单周期实现中**：一条指令在某一阶段时，只有该阶段的硬件在工作，其余四组<mark>空闲</mark>。

['stage-hw.slide.2']
src_hash = '43b880ee'
text = '**Solution**: Insert <mark>pipeline registers</mark> between adjacent stages to hold stage results, allowing each hardware unit to process the next instruction in the subsequent cycle. All five hardware units simultaneously process five instructions, and the clock cycle only needs to accommodate a single stage; this execution mode is called <mark>pipelining</mark>.'
# src:
# 
# **解决方案**：相邻两级之间加入<mark>级间寄存器</mark>保存本级结果，每组硬件在下一个周期即可处理下一条指令，五组硬件同时处理五条指令，时钟周期只需容纳一个阶段，这种执行方式称为<mark>流水线</mark>。

['stage-hw.notes.1']
src_hash = '9c868c6d'
text = '''
The five stages are partitioned according to hardware units, analogous to each section of a car wash tunnel performing only one task: Fetch reads instruction bytes using instruction memory, Decode reads the register file, Execute computes with the ALU, Memory accesses data memory, and Write-back writes to the register file. In the diagram, each row represents a hardware unit, colored blocks show when it works for an instruction, and blank spaces indicate idle time; stage widths match the diagram on the "One Instruction per Clock Cycle" page, illustrating one cycle of movl.
Fetch and Memory both access memory, but in hardware they constitute separate access paths, drawn as distinct instruction memory and data memory blocks in CS:APP SEQ; the register file also provides independent read and write ports, allowing simultaneous reads and writes within the same cycle.
Guide students to observe: when movl accesses memory, only data memory is active, and the other four rows are blank. Each row operates for only a brief fraction of the cycle.
Common misconception: assuming the five stages share the same circuit and can proceed only sequentially. The five stages use five distinct hardware units, enabling them to work on different instructions simultaneously.
The solution paragraph: pipelining enables each hardware unit to work on an instruction in every cycle, accomplished using pipeline registers. In a single-cycle implementation, intermediate results are not stored between stages and must propagate all the way to write-back within one cycle; by inserting registers between adjacent stages, the clock edge latches each stage's results, the next stage reads them in the next cycle, and the current stage immediately begins processing the next instruction. The clock cycle only needs to accommodate one stage plus register overhead. In each cycle, instructions advance one stage synchronously: when instruction 1 reaches write-back, instructions 2 through 5 occupy memory, execute, decode, and fetch respectively.
Question at the end of the page: Executing the 5 instructions of the loop body, how many clock cycles do the single-cycle implementation and the 5-stage pipeline each require?
'''
# src:
# 
# 五个阶段的划分依据是硬件，与洗车通道的每一段只做一步相同：取指用指令内存读出指令字节，译码读寄存器堆，执行用 ALU，访存读写数据内存，写回写寄存器堆。图中每一行是一组硬件，色块是它为某条指令工作的时间，空白是它空闲的时间；阶段宽度与「每个时钟周期执行一条指令」一页的图相同，只展示 movl 的一个周期。
# 取指与访存都访问内存，在硬件上是两条独立的访问通路，CS:APP 的 SEQ 把它们画成指令内存与数据内存两块；寄存器堆的读端口与写端口也是分开的，同一个周期里可以一读一写。
# 引导学生观察配图：movl 访存时只有数据内存在工作，其余四行都是空白。每一行在一个周期里只有一小段在工作。
# 学生易错：以为五个阶段共用同一块电路，只能依次进行。五个阶段用的是五组不同的硬件，所以它们可以同时为不同的指令工作。
# 解决方案一段：流水线让每组硬件在每个周期都为一条指令工作，做到这一点要靠级间寄存器。单周期实现的阶段之间不保存结果，一条指令的中间结果只能在一个周期内一路传到写回；在相邻两级之间加上寄存器后，时钟沿把每一级的结果存入，下一级在下一个周期读取，这一级的硬件随即开始处理下一条指令。时钟周期因此只需容纳一个阶段，再加上寄存器的时间。每个时钟周期各指令同步向后推进一级：第 1 条指令处于写回级时，第 2 至第 5 条分别处于访存、执行、译码与取指级。
# 页末的问题：执行循环体的 5 条指令，单周期实现与五级流水线各自需要多少个时钟周期？


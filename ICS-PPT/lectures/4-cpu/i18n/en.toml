['smt-run.slide.1']
src_hash = '8ecda363'
text = '''
- **Alternating fetch**: One cycle fetches 2 instructions for Thread A using PC A, and the next cycle fetches for Thread B using PC B;
- **Thread-agnostic execution**: Instructions wait tagged with thread IDs, and execution units select instructions with ready operands regardless of thread;
- **Write-back to the thread's own register file**: Instructions of each thread write back according to their respective program order.
'''
# src:
# 
# - **取指轮流**：一个周期按 PC A 取线程 A 的 2 条指令，下一个周期按 PC B 取线程 B 的；
# - **执行不分线程**：指令带着线程号等待，执行部件挑操作数就绪的，不论属于哪个线程；
# - **写回本线程的寄存器堆**：每个线程的指令按自己的程序顺序写回。

['smt-run.notes.1']
src_hash = 'bc3d4e44'
text = '''
The diagram uses the same hardware layout as the "Hardware Architecture of Hyper-Threading" page, populated with instructions from both threads in Cycle 8. Cells represent instructions tagged with thread IDs (A: blue, B: orange); movl (%rsi…) loads x[i], and movl (%rdi…) loads w[i].
Assumptions match superscalar and out-of-order slides: two execution units; fetch retrieves 2 instructions per cycle, decoding in the next cycle; memory reads require 3 cycles; execution units select ready instructions prioritizing oldest fetch age regardless of thread; retirement is in-order per thread, up to 2 instructions per cycle. Both threads execute dot_product loops on different matrix rows, starting from movl (%rdi,%r8,4),%r10d: Cycle 1 fetches movl and imull for A, Cycle 2 fetches for B, and fetch alternates between threads thereafter, with decode alternating accordingly.
Examining Cycle 8 stage by stage: Fetch: Cycle 8 belongs to B, fetching movslq and x[i] load using PC B for the next iteration. Decode: decodes movslq and x[i] load for A, fetched in Cycle 7. Execution units: B imull executes using w[i] loaded in Cycles 5–7 (B movl executed in Cycle 4), and A addl %ecx,%r9d executes using the product computed in Cycle 7, running instructions from distinct threads concurrently. Waiting instructions: B addl %ecx,%r9d waits for the product; A jl and B cmpl operands are ready, but execution units were assigned to older B imull (fetched Cycle 2) and A addl %ecx,%r9d (fetched Cycle 3); B jl waits for B cmpl flags. Memory: A imull and cmpl executed in Cycle 7 pass through memory. Retirement buffers: addl $1,%eax for A and B are computed, waiting for older addl %ecx,%r9d in their respective threads to retire. Write-back: B movl writes loaded w[i] to register %r10 of Thread B.
Next cycle (Cycle 9): fetch belongs to A; execution units run B addl %ecx,%r9d (using B product from Cycle 8) and A jl; A imull writes back its product to %ecx of Thread A.
Registers remain independent: A addl %ecx,%r9d accesses %ecx and %r9d of Thread A, while B imull accesses %r10d and %ecx of Thread B; sharing register names across threads involves physically separate register files, preventing inter-thread dependencies and restricting forwarding to within-thread paths.
Comparison with Intel implementation (Marr et al., 2002): fetch alternates cycle by cycle when both threads are active, but a thread can fetch every cycle if the other is stalled; instruction scheduling is thread-agnostic; instruction retirement alternates between threads.
Two simplifications on this slide: 1) In the 2002 implementation, fetch alternated per cycle while decode processed several consecutive instructions for one thread before switching; here both alternate per cycle. 2) Uncommitted instructions are shown in a shared buffer; in actual cores, retirement buffers are partitioned equally between threads (notes on the "Hardware Architecture of Hyper-Threading" page).
Common misconception 1: assuming threads alternate using the entire core, giving all resources to A in one cycle and B in the next. Alternation applies only to fetch and decode; execution units execute instructions from both threads concurrently, as in Cycle 8. Common misconception 2: assuming identical register names overwrite each other across threads. Each thread has a private register file; writes to %ecx by A do not affect %ecx of B.
Question at the end of the page: Under this execution model, how many idle execution slots left by one thread can be utilized by the second thread?
'''
# src:
# 
# 图与「超线程的硬件结构」一页是同一张硬件图，填上两个线程在周期 8 的指令。每个小格是一条指令，左端的字母是它所属的线程（A 蓝、B 橙）；movl (%rsi…) 是读 x[i] 的 movl (%rsi,%r8,4),%ecx，movl (%rdi…) 是读 w[i] 的 movl (%rdi,%r8,4),%r10d。
# 设定与「超标量」及乱序执行几页相同：两个执行部件；每个周期取 2 条指令，下一个周期译码；读内存要 3 个周期；执行部件每个周期挑操作数就绪的指令，有多条就绪时先挑取进来最早的，不论属于哪个线程；每个线程按自己的程序顺序写回，每个周期最多写回 2 条。两个线程都执行 dot_product 的循环（各算矩阵的一行），都从第三部分的 movl (%rdi,%r8,4),%r10d 开始：周期 1 取 A 的 movl 与 imull，周期 2 取 B 的 movl 与 imull，此后两个线程轮流取指，译码随之轮流。
# 逐框看周期 8。取指：这一周期轮到 B，按 PC B 取 B 的 movslq 与读 x[i] 的 movl，是 B 下一轮循环的开头。译码：A 的 movslq 与读 x[i] 的 movl，周期 7 按 PC A 取进来。执行部件：B 的 imull 用 B 在周期 5 至 7 读出的 w[i]（B 的 movl 周期 4 执行），A 的 addl %ecx,%r9d 用 A 在周期 7 算出的乘积，两条属于不同的线程，在同一个周期执行。等待执行的指令：B 的 addl %ecx,%r9d 等 B 的乘积；A 的 jl 与 B 的 cmpl 操作数已经就绪，两个执行部件给了取进来更早的 B 的 imull（周期 2 取指）与 A 的 addl %ecx,%r9d（周期 3 取指），它们等下一个周期；B 的 jl 等 B 的 cmpl 设置标志位。访存：A 的 imull 与 cmpl 周期 7 执行，这一周期经过访存级。等待写回：A、B 的 addl $1,%eax 已经算出，各等本线程中前面的 addl %ecx,%r9d 写回。写回：B 的 movl 把读出的 w[i] 写进线程 B 的 %r10（橙色的箭头与格子）。
# 下一个周期（周期 9）：取指轮到 A；两个执行部件执行 B 的 addl %ecx,%r9d（用 B 在周期 8 算出的乘积）与 A 的 jl；A 的 imull 把乘积写进线程 A 的 %ecx。
# 两个线程各用各的寄存器：A 的 addl %ecx,%r9d 读写线程 A 的 %ecx、%r9d，B 的 imull 读写线程 B 的 %r10d、%ecx；寄存器名相同，在硬件上是两个寄存器堆中的不同寄存器，所以两个线程的指令之间没有依赖，转发也只在同一个线程的指令之间进行。
# 与 Intel 的实现对照（Marr 等 2002）：两个线程都要取指时逐周期轮流，一个线程暂时不能取指时，另一个线程每个周期都可以取；挑选指令执行时不区分线程，同一个周期可以执行两个线程的指令；按程序顺序完成指令时，两个线程轮流。
# 本页的两处简化。一、2002 年的实现中，取指逐周期轮流，译码器为一个线程连续译码几条指令之后才换到另一个线程，以节省芯片面积、降低复杂度；本页的设定是取指、译码都每个周期轮流。二、图中两个线程等待写回的指令放在同一个虚线框里；实际核心中存放等待完成的指令的缓冲区对半分给两个线程（「超线程的硬件结构」一页讲稿），两个线程的指令仍同在其中。
# 学生易错一：以为两个线程轮流使用整个核心，一个周期整个核心给 A、下一个周期给 B。轮流的是取指与译码；执行部件在同一个周期可以执行两个线程的指令，图中周期 8 的两个执行部件就是一例。学生易错二：以为两个线程的同名寄存器会互相改写。每个线程有自己的寄存器堆，A 写 %ecx 不改变 B 的 %ecx。
# 页末的问题：这样执行，一个线程留下的空格有多少能被另一个线程用上？


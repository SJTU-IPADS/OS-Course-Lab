['car-wash.notes.1']
src_hash = '1b121e92'
text = '''
This page corresponds to page 3 of Lecture 17 in the old ICS1 slides, "Real-World Pipelines: Car Washes": three photographs and three principles.
Three photographs: cafeteria serving lines, where each window serves one dish, students pass sequentially across windows, and each window is occupied simultaneously; parallel execution, where several workers wash multiple cars concurrently by replicating personnel; pipelining, where an automated car wash tunnel is divided into distinct sections, each performing one step, cars pass through sequentially, and multiple cars occupy different steps in the tunnel at the same time. The three principles correspond to the pipelined photograph: segmenting the tunnel, cars passing in order, and multiple cars being washed concurrently. The diagram to the right of the text illustrates the same concept across three workstations: soaping, rinsing, and drying each occupy one station; while Car 1 is dried, Car 2 is rinsed, and Car 3 is soaped.
Common misconception: assuming pipelining reduces the time required to wash an individual car. Each car must still traverse all sections; pipelining increases the number of cars washed per unit time.
Common misconception: assuming pipelining replicates entire sets of equipment. Each section of the tunnel performs only one step, and all sections together constitute a single facility; parallel execution is what requires replicating equipment.
Question at the end of the page: If a computation is assigned to a combinational logic block and a clocked register, how long must the clock cycle be, and how many operations can be completed per second?
'''
# src:
# 
# 本页照搬旧讲义 ICS1 第 17 讲第 3 页「Real-World Pipelines: Car Washes」：三张照片与思路三条，标签与文字译成中文。
# 三张照片：食堂打饭，每个窗口盛一种菜，学生依次经过各个窗口，同一时刻每个窗口前都有学生；并行，几个人同时洗车，人手是多份；流水线，自动洗车通道分成几段，每段做一步，车依次经过各段，通道里同时有几辆车处于不同的步骤。思路的三条对应流水线的照片：通道分段、车按顺序经过、几辆车同时在洗。文字右侧的图把同一件事画成三个工位：打泡沫、冲洗、擦干各占一个工位，车 1 在擦干时，车 2 在冲洗，车 3 在打泡沫。
# 学生易错：以为流水线缩短了一辆车的洗车时间。一辆车仍要经过全部各段，流水线提高的是单位时间内洗完的车数。
# 学生易错：以为流水线也是把设备复制了多份。通道的每一段只做一步，各段合起来是一套设备；并行才需要多份。
# 页末的问题：把一个计算交给一块组合逻辑与一个时钟寄存器，时钟周期要多长，每秒能完成多少次计算？


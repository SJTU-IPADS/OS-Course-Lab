['comp-example.notes.1']
src_hash = 'f849b7ae'
text = '''
This page corresponds to page 4 of Lecture 17 in the old ICS1 slides, "Computational Example".
In the diagram, a single combinational logic block performs the entire computation, requiring 300 ps; the result is stored in the clocked register at the clock edge, taking 20 ps. The clock cycle is 320 ps. Latency is the time from entering the combinational logic until storage in the register, which is 320 ps; throughput is the number of computations completed per second, 1 s / 320 ps = 3.12 GOPS (giga-operations per second).
Common misconception: assuming latency is simply the 300 ps combinational logic delay. The result is only finalized when written into the register at the clock edge; register overhead of 20 ps counts toward latency, and the clock cycle must accommodate it.
Question at the end of the page: If this combinational logic is split into three blocks, each followed by a register, what do the clock cycle, latency, and throughput become?
'''
# src:
# 
# 本页照搬旧讲义 ICS1 第 17 讲第 4 页「Computational Example」，图与三条文字译成中文。
# 图中一块组合逻辑做完整个计算，用时 300 ps，结果在时钟沿存入时钟寄存器，存入用时 20 ps。时钟周期是 320 ps。延迟是一次计算从进入组合逻辑到存入寄存器的时间，320 ps；吞吐率是每秒完成的计算次数，1 s / 320 ps = 3.12 GOPS，GOPS 是每秒十亿次操作。
# 学生易错：以为延迟就是组合逻辑的 300 ps。结果要在时钟沿写入寄存器才算完成，寄存器的 20 ps 计入延迟，时钟周期也要容纳它。
# 页末的问题：把这块组合逻辑分成三块，每块之后加一个寄存器，时钟周期、延迟与吞吐率各变成多少？


['load-use-fig.notes.1']
src_hash = '95b97439'
text = '''
This page applies the two operations from the "Stall and Bubble" page to handle load-use hazards: in Cycle 3, while imull decodes, hardware detects that its source register %r10d is being loaded from memory by the preceding movl; at the clock edge ending Cycle 3, the PC and fetch/decode register stall, and a bubble is inserted into the decode/execute register. In Cycle 4, imull remains in decode while execute receives a bubble; movl reads w[i] in memory, latching it into the memory/write-back register at cycle end; in Cycle 5, hardware forwards w[i] directly into execute for imull without waiting for write-back. Stalling once and inserting one bubble suffices because forwarding draws data from the end of memory, only one stage later than execute.
Comparison with "Waiting for Write-Back: Stalling for 3 Cycles": waiting for write-back required 3 stall cycles; with forwarding, a load-use hazard requires only a 1-cycle stall. Comparison with "Data Forwarding": arithmetic results are available at the end of execute, whereas memory loads finish at the end of memory, one stage later, forcing the immediately dependent instruction to stall for one cycle. In computer architecture, conditions impeding continuous pipeline execution are called hazards, and this specific scenario is called a load-use data hazard.
This sequence comprises 6 frames advancing from Cycle 2 to 7. Below the space-time diagram, instructions in the five stages are shown for the bold cycle, with stall/bubble labels indicating clock-edge actions. Frame 2 (Cycle 3) shows imull decoding and needing w[i] while movl computes the address in execute. Frame 3 (Cycle 4) shows movl in memory with a red box highlighting the column; the PC and fetch/decode register stall, imull remains in decode, execute receives a bubble, and movl loads w[i] at cycle end. Frame 4 (Cycle 5) shows the forwarding arrow as registers latch normally, imull enters execute using forwarded w[i], and the bubble moves to memory. The final two frames complete all stages, with the bubble exiting after write-back.
The red cell marked with a stall represents imull in Cycle 4: imull remains in decode while execute receives a bubble. In Cycle 4, movl accesses memory while imull waits for w[i]. The green angled arrow points from movl memory (Cycle 4) to deferred imull execute (Cycle 5): loaded w[i] can be forwarded into imull execute only after memory access finishes. This additional cycle is the cost of a load-use dependency.
Comparing this diagram with the space-time diagram on the "Data Forwarding" page: both forwarding arrows point downward-right, colored by source stage (execute: orange; memory: green). The difference is the starting point: execute in Cycle 3 versus memory in Cycle 4; because the source is one stage later, target execution shifts right by one column with an intervening stall cell, transforming the leftward arrow of the previous slide into a downward-right arrow.
During this stall cycle, subsequent instructions behind imull are also deferred by one cycle. If an independent instruction not using %r10d (such as index increment addl $1,%eax) can be placed between movl and imull, this cycle executes that instruction without stalling; compiler instruction scheduling exploits this principle to reorder instructions.
Common misconception 1: framing the cause as "%r10d does not have a value yet." The precise reason is that w[i] has not been loaded from memory, so no data exists in hardware to forward. Common misconception 2: assuming the entire processor halts during a stall. movl and preceding instructions advance normally; only imull and subsequent instructions are deferred.
The 1-cycle stall follows from the five-stage model assumption that memory access takes one cycle. In actual processors, accessing main memory can take tens or hundreds of clock cycles, causing much longer stalls; memory latency and caches are covered in the next lecture on the memory hierarchy.
Question at the end of the page: Forwarding and stalling resolve data dependencies where operands are not yet ready. When encountering a conditional jump jl, which instruction should fetch read in the next cycle? Can the branch outcome be known at fetch time?
'''
# src:
# 
# 本页用「stall 与 bubble」一页的两种操作处理读内存后马上使用：第 3 周期 imull 在译码级，硬件发现它要读的 %r10d 由前一条 movl 从内存读出，第 3 周期结束的时钟沿，PC 与取指、译码之间的寄存器 stall，译码与执行之间的寄存器装入 bubble。第 4 周期 imull 仍在译码级，执行级是 bubble，movl 在访存级读出 w[i]，周期结束时存入访存级与写回级之间的级间寄存器；第 5 周期硬件把 w[i] 转发进 imull 的执行级，不等 movl 写回。stall 一次、插入一个 bubble 就够了，因为转发从访存级末尾取值，只比执行级末尾晚一级。本讲不讲判断何时 stall 的控制电路。
# 与「等待写回：stall 3 个周期」一页对比：那一页 stall 到写回之后，用 3 个周期；有了转发，读内存后马上使用只 stall 1 个周期。与「data forwarding」一页对比：算术指令的结果在执行阶段末尾产生，读内存的结果在访存阶段末尾产生，晚了一级，紧邻的下一条使用指令要 stall 一个周期。计算机体系结构教材将此类阻碍流水线连续推进的情况统称为 hazard，本页所示情形称为 load-use data hazard（读内存后马上使用）。
# 这一页有 6 帧，每帧推进一个周期（周期 2 至 7）。时空图下方与「等待写回：stall 3 个周期」一页相同，是周期号加粗的那个周期五个阶段中的指令，级间寄存器上方的 stall、bubble 是开始这个周期的时钟沿对它做的操作。第 2 帧（周期 3）imull 在译码级，要用 w[i]，movl 在执行级只算出 w[i] 的地址。第 3 帧（周期 4）movl 在访存，红框标出这一列；硬件图中 PC 与取指、译码之间的寄存器 stall，imull 留在译码级，执行级是 bubble，movl 在周期末读出 w[i]。第 4 帧（周期 5）出现转发箭头，寄存器照常装入，imull 进入执行级，用转发来的 w[i]，bubble 进入访存级。最后两帧两条指令走完五级，bubble 经过写回级后离开流水线。
# 图中标有「停」字的红色格子是 imull 在第 4 周期的状态：imull 留在译码级，执行级是 bubble。在红色虚线框出的第 4 周期这一列中，上方的 movl 正在访存，下方的 imull 在等 w[i]。绿色折线箭头从 movl 的访存格（第 4 周期）指向 imull 推迟后的执行格（第 5 周期）：访存阶段结束之后，读出的 w[i] 才能转发进入 imull 的执行阶段。多出的这一周期就是读内存后马上使用的代价。
# 将本图与「data forwarding」一页的时空图对比：两图中的转发箭头均从左上指向右下，颜色取数据来源阶段的颜色（那一页从执行发出，橙色；本图从访存发出，绿色）。区别在箭头的起点：那一页从第 3 周期的执行格发出，本图从第 4 周期的访存格发出；数据来源晚了一级，目标指令的执行格向右推移一列，中间是一个「停」格。上一页图中朝左的箭头，在本页变成朝右下的箭头。
# stall 的这一周期内，排在 imull 后面的指令也随之推迟一个周期（图中未画出后续指令）。如果在 movl 与 imull 之间能够插入一条不依赖 %r10d 的无关指令（例如循环尾部的下标自增指令 addl $1,%eax），这一周期就用来执行这条指令，不需要 stall；编译器的指令调度优化正是利用这一原理重排指令顺序。
# 学生易错一：表述为「因为 %r10d 里还没有值所以要停」。准确的原因是此时 w[i] 尚未从内存读出，硬件中不存在可供转发的数据。学生易错二：误以为 stall 的周期内整个处理器都停止工作。movl 及其前面的指令照常向后推进，只有 imull 及其后面的指令推迟一个周期。
# stall 一个周期是五级流水线模型假定「访存仅需一个周期」的推论。在真实处理器中，访问主存可能需要数十乃至上百个时钟周期，读内存后马上使用将导致更长时间的等待；访存延迟与缓存机制将在下一讲「存储层次」中详细讨论。

['llm-pp-single.slide.1']
src_hash = 'd1e390e5'
text = '''
The four rows of the space-time diagram correspond to four GPUs; one cycle is the time for one GPU to complete 7 layers of computation.

When processing only 1 request, in Cycle 1 only GPU 1 is computing, while GPUs 2, 3, and 4 wait for its result; in Cycle 2 GPU 2 computes, while the other three wait. Cells with no request to process are the <mark>bubbles</mark> from Part 2: 12 out of 16 cells are bubbles.
'''
# src:
# 
# 时空图的四行对应四块 GPU，一个周期是一块 GPU 完成 7 层计算的时间。
# 
# 只处理 1 个请求时，周期 1 只有 GPU 1 在计算，GPU 2、3、4 等待它的结果；周期 2 由 GPU 2 计算，其余三块等待。没有请求可处理的格子即第二部分的 <mark>bubble</mark>：16 格中有 12 格是 bubble。

['llm-pp-single.notes.1']
src_hash = 'c5b01ad3'
text = '''
This diagram adopts the hardware perspective from "Principles of Pipelining": each row represents a hardware unit (here, a GPU), colored blocks represent time spent computing on a request, and dashed bubble cells denote idle time. Across 4 GPUs × 4 cycles (16 total slots), only 4 slots perform computation, yielding 25% utilization, leaving three out of four GPUs idle most of the time.
Single-cycle instruction execution in "One Instruction per Clock Cycle" suffers from the same underutilization: an instruction completes all five stages before the next begins, leaving four of five hardware units idle at any moment. The solution is identical: feeding subsequent requests into the pipeline without waiting.
Common misconception: assuming partitioning across 4 GPUs makes an individual request run 4× faster. The request must still traverse all 4 GPUs sequentially; total latency is not reduced, and inter-GPU communication adds minor overhead.
Question at the end of the page: How can the 3 idle GPUs be utilized?
'''
# src:
# 
# 这张图采用「流水线原理」一页的硬件视角：一行是一组硬件（此处为一块 GPU），色块是它处理某个请求的时间，bubble 格是它空闲的时间。4 块 GPU × 4 个周期共 16 格，只有 4 格在计算，利用率为 1/4，四块 GPU 中有三块在大部分时间里空闲。
# 「每个时钟周期执行一条指令」一页的单周期实现存在同样的问题：一条指令完成五个阶段后才开始下一条，五组硬件中总有四组空闲。解决方法也相同：后续请求紧接着进入流水线。
# 学生易错：以为分到 4 块 GPU 上，单个请求就能快 4 倍。这个请求仍要依次经过 4 块 GPU，总耗时没有缩短，还增加了 GPU 之间的传输时间。
# 页末的问题：如何利用这 3 块空闲的 GPU？


['llm-pp-batch.slide.1']
src_hash = 'c539e2d6'
text = '''
- Tokens of Request 2 do not depend on Request 1 and can enter GPU 1 in Cycle 2; Requests 3 and 4 enter sequentially.
- Token 1 of Request 1 is output in Cycle 4, and its Token 2 arrives at GPU 1 precisely in Cycle 5: interleaving 4 requests leaves <mark>no bubbles</mark> starting in Cycle 4.
- Each request still receives one token every 4 cycles, while the server outputs one token every cycle. The pipeline remains fully utilized when the number of independent requests is at least the number of GPUs.
'''
# src:
# 
# - 请求 2 的词不依赖请求 1 的词，可以在周期 2 进入 GPU 1；请求 3、4 依次进入。
# - 请求 1 的词 1 在周期 4 输出，它的词 2 恰好在周期 5 进入 GPU 1：4 个请求交替进入，从周期 4 起<mark>没有 bubble</mark>。
# - 每个请求仍是每 4 个周期得到一个词，服务器每个周期输出一个词。独立请求数不少于 GPU 块数时，流水线才能保持满载。

['llm-pp-batch.notes.1']
src_hash = '6447df4c'
text = '''
Contrast with the previous slide: on the previous slide with a single request, GPU 1 contained bubbles in Cycles 2, 3, and 4; here tokens from Requests 2, 3, and 4 occupy those 3 cycles, none depending on Request 1. Token 1 of Request 1 is output by GPU 4 in Cycle 4, returning to GPU 1 as input for Token 2 precisely in Cycle 5, keeping all GPUs busy every cycle from Cycle 4 onward.
The notes on the "Forwarding After a One-Cycle Stall" page describe a corresponding approach: if an independent instruction can be inserted between movl and imull, the stall cycle is utilized. Compilers perform instruction scheduling; inference servers interleave requests from different users across the pipeline, known as continuous batching (Orca, OSDI 2022: as one request completes, a new request immediately fills its slot).
Latency versus throughput: each individual user still receives one token every 4 cycles (latency), while the server aggregate output is one token per cycle (throughput). Pipelining increases throughput.
Common misconception: assuming batching accelerates subsequent tokens for an individual request. Inputs to subsequent tokens still depend on prior outputs, leaving per-request latency unchanged; what changes is that GPUs process other requests during wait intervals.
Question at the end of the page: When a single user operates the model alone, must subsequent tokens wait for GPU 4 to output? Can we predict upcoming tokens, similar to branch prediction?
'''
# src:
# 
# 与上一页对照：上一页只有一个请求，GPU 1 在周期 2、3、4 为 bubble；本页请求 2、3、4 的词占用了这 3 个周期，它们都不需要请求 1 的结果。请求 1 的词 1 在周期 4 由 GPU 4 输出，恰好在周期 5 回到 GPU 1 作为词 2 的输入，从周期 4 起每块 GPU 每个周期都有计算任务。
# 「stall 一个周期后转发」一页讲稿中有对应的做法：若 movl 与 imull 之间能插入一条不依赖该结果的指令，stall 的周期就能得到利用。编译器的做法是指令调度；推理服务器的做法是将不同用户的请求交替排入流水线，称为连续批处理（Orca，OSDI 2022：一个请求结束后，新请求立即补入空出的位置）。
# 两个指标的区别：每个用户得到的仍是每 4 个周期一个词（延迟），服务器总计每个周期输出一个词（吞吐）。流水线提高的是吞吐。
# 学生易错：以为批处理使单个请求的下一个词提前开始。下一个词的输入仍是本请求上一步输出的词，等待时间不变；改变的是等待期间 GPU 在处理其他请求。

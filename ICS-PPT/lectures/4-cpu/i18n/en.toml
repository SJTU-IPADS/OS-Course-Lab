['op-example.notes.1']
src_hash = 'ed7a10d8'
text = '''
This page corresponds to page 22 of Lecture 14 in the old ICS1 slides, where the original example was Y86 subl %rdx, %rbx (0x00c: 6123, 21 − 9 = 12). Here it is replaced by addl %edx, %eax at 0x005, encoded as 01 d0 (the third instruction of function mac in objdump -d when compiling 3-asm/examples/mac.c with gcc -Og).
Operand byte d0 = 11 010 000: mm is 11, R is register 010 (%edx), and B is register 000 (%eax). Assume %edx = 9 and %eax = 21, identical to the values on the original slide; the result 30 is positive, nonzero, without carry or overflow, so all four flags are 0.
Common misconception: swapping the registers for rrr and bbb. 01 is addl R, B, where the result is written to register bbb (%eax).
Question at the end of the page: Why must the five stages of an instruction be completed within the same clock cycle?
'''
# src:
# 
# 本页对应旧讲义 ICS1 第 14 讲第 22 页，原页的例子是 Y86 的 subl %rdx, %rbx（0x00c: 6123，21 − 9 = 12）。这里换成 addl %edx, %eax，位于 0x005，编码 01 d0（gcc -Og 编译 3-asm/examples/mac.c，objdump -d 中函数 mac 的第三条指令）。
# 操作数字节 d0 = 11 010 000：mm 为 11，R 是 010 号寄存器 %edx，B 是 000 号寄存器 %eax。设 %edx = 9、%eax = 21，与原页的两个值相同；结果 30 为正、不为 0，没有进位，也没有溢出，四个标志位都是 0。
# 学生易错：把 rrr 与 bbb 的寄存器对调。01 是 addl R, B，结果写入 bbb 号寄存器 %eax。
# 页末的问题：一条指令的五个阶段为什么必须在同一个时钟周期内完成？

['stages-fig.title']
src_hash = 'ebebb0e9'
text = 'One Instruction per Clock Cycle'
# src: 每个时钟周期执行一条指令

['stages-fig.slide.1']
src_hash = 'd7508695'
text = '''
**Single-Cycle Implementation**: The five stages of an instruction complete within the <mark>same clock cycle</mark>, governed by the hardware architecture:

- **No intermediate results stored between stages**: Functional units across stages are connected directly by wires; intermediate results are transient signals on wires;
- **State is written only at clock edges**: The PC, registers, and memory are updated at the end of the cycle, after which the PC points to the next instruction;
- **Cycle time is determined by the slowest instruction**: An instruction must traverse all five stages in one cycle, leaving other instructions waiting idle after completion.
'''
# src:
# 
# **单周期实现**：一条指令的五个阶段在<mark>同一个时钟周期</mark>内完成，原因在于硬件结构：
# 
# - **阶段之间不保存结果**：各阶段的部件由导线直接相连，中间结果只是导线上的信号；
# - **状态只在时钟沿写入**：PC、寄存器与内存在周期结束时写入，随后 PC 指向下一条指令；
# - **周期按最慢的指令定**：一条指令须在一个周期内走完五个阶段，其他指令做完后空等。

['stages-fig.notes.1']
src_hash = 'e5f65cfb'
text = '''
Why completion in one cycle is necessary: in a single-cycle implementation, no registers store intermediate results between the five stages; instruction bytes read in fetch, addresses computed in execute, and data loaded in memory pass directly to the next component along wires; these components are combinational logic whose outputs vary with their inputs. Processor state (PC, registers, flags, memory) is written only at clock edges. Once the clock edge arrives, the PC changes to the address of the next instruction, the bytes read by the fetch unit change accordingly, and all signals left on wires by the previous instruction are overwritten. Therefore, an instruction must complete from fetch through write-back between two clock edges. The SEQ implementation in CS:APP Section 4.3 follows this design.
While logically straightforward and correct, the single-cycle implementation has its cycle duration constrained by the slowest instruction: accessing memory is substantially slower than register addition, yet arithmetic instructions must wait for the entire long cycle to end before the next instruction enters the processor. In the figure, the five stages of movl span an entire clock cycle, setting the cycle duration; movslq performs no memory access and idles after write-back until the cycle ends; movl fetches only at the start of Cycle 2. The line below explains why the cycle cannot be shorter: the red dashed line extends downward from the end of write-back in movslq; if the cycle ended there, the memory access of movl would not finish, leaving loaded x[i] unable to be written into %ecx. Stage widths in the figure are schematic: decode and write-back only access registers and are shorter than the other three stages.
Guide students to observe: when movl computes addresses in execute, the fetch and decode units remain idle; when movl accesses memory, the fetch, decode, and execute units are all idle.
Common misconception: misinterpreting "single-cycle" as "an instruction takes only one cycle, hence executing quickly." Under a single-cycle design, the cycle is sized for the slowest instruction and is extremely long.
Common misconception: assuming one clock cycle performs only one stage. In a single-cycle implementation, one clock cycle completes all five stages of an instruction; Cycle 1 and Cycle 2 in the figure are each long cycles.
Question at the end of the page: How are consecutive instructions arranged across clock cycles?
'''
# src:
# 
# 为什么必须在一个周期内做完：单周期实现的五个阶段之间没有保存中间结果的寄存器，取指读出的指令字节、执行算出的地址、访存读出的数据都经导线直接送进下一个部件，这些部件是组合逻辑，输出随输入变化。处理器的状态（PC、寄存器、标志位、内存）只在时钟沿写入。时钟沿一到，PC 换成下一条指令的地址，取指部件读出的字节随之改变，上一条指令留在导线上的信号全部被替换。因此一条指令从取指到写回必须在两个时钟沿之间完成。CS:APP 4.3 节的 SEQ 就是这种实现。
# 单周期实现逻辑直观、功能正确，但时钟周期的长度受限于最慢的指令：访问内存远慢于寄存器加法，但算术指令也必须等待整个长周期结束，下一条指令才能进入处理器。图中 movl 的五个阶段正好占满一个时钟周期，周期长度由它决定；movslq 不访存，写回后空等到周期结束；movl 要到周期 2 开始才取指。下面一行说明周期为什么不能更短：红色虚线从 movslq 写回结束的位置向下延伸，周期若在这里结束，movl 的访存还没做完，读出的 x[i] 来不及写入 %ecx。图中各阶段的宽度只作示意：译码与写回只读写寄存器，比其他三个阶段短。
# 引导学生观察配图：当 movl 处于执行阶段计算地址时，取指与译码部件处于空闲状态；当 movl 处于访存阶段时，取指、译码、执行三个部件全部处于空闲状态。
# 学生易错：将「单周期」误解为「一条指令只需一个周期，因此执行速度快」。单周期实现下的时钟周期按最慢指令设定，周期本身极长。
# 学生易错：以为一个时钟周期只做一个阶段。单周期实现里一个时钟周期做完一整条指令的五个阶段；图中的周期 1、周期 2 各是一个长周期。

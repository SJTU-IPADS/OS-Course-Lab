['branch-guess.notes.1']
src_hash = '717f6cb6'
text = '''
The previous page waited for branch resolution, incurring 2 extra cycles after every jl. Branch prediction avoids waiting: fetch continues along a predicted path before jl resolves, allowing predicted instructions to enter the pipeline and overlap with jl; when jl resolves at the end of execute, hardware compares the actual outcome with the prediction.
On a correct prediction, predicted instructions match program execution order, advancing normally and eliminating the 2 wait cycles. On a misprediction, speculative instructions must not execute and are squashed, and fetch redirects to the correct path; because the first instruction of the correct path fetches only after resolution, the extra cycles equal the waiting penalty. Therefore, in a 5-stage pipeline, predicting is never slower than waiting, and higher prediction accuracy saves more cycles.
Prediction strategies: basic 5-stage pipelines can employ fixed strategies, such as always predicting taken (in this loop, jl jumps n - 1 times across n iterations, mispredicting only on the final iteration) or always predicting not-taken. Dynamic hardware predicting based on execution history is covered in Part 3 under "Hardware Branch Predictors".
Common misconception: assuming predictions are specified in code by programmers or compilers. Branch prediction is performed dynamically by fetch hardware at runtime, leaving machine instructions unchanged.
Question at the end of the page: Mispredicted instructions must be squashed. Having entered the pipeline, could they have already modified registers or memory? First examine where they reach on a correct prediction.
'''
# src:
# 
# 上一页等待判定，每条 jl 之后多用 2 个周期。分支预测不等：取指级在 jl 判定之前就按猜测的方向取指，猜来的指令先进入流水线，与 jl 重叠执行；jl 在执行阶段结束时得出真实的方向，硬件拿它与猜测比较。
# 猜对时，猜来的指令就是程序接下来要执行的指令，流水线照常推进，等待的 2 个周期省下。猜错时，猜来的指令不该执行，全部作废，取指级改从正确路径取指；正确路径的第一条要到判定之后才取指，多用的周期与等待判定相同。所以在五级流水线中，按猜测取指不会比等待判定慢，猜对的比例越高，省下的周期越多。
# 猜什么：基础五级流水线可以用固定的策略，例如总是猜跳转（本例的 jl 在 n 轮循环中跳 n - 1 次，只在最后一次猜错），或总是猜不跳、顺序取下一条。按每条跳转指令以往的记录预测方向的硬件，在第三部分「硬件分支预测器」一页讲。
# 学生易错：以为猜测写在程序里，由程序员或编译器指定。猜测由取指级的硬件在运行时做，程序的指令不变。
# 页末的问题：猜错时要作废猜来的指令。这些指令在作废之前已经进入流水线，会不会已经改了寄存器或内存？先看猜对时它们在流水线中走到了哪里。


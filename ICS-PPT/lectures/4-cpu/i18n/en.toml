['superscalar.notes.1']
src_hash = '6fb0d307'
text = '''
Superscalar: replicating hardware units across stages by an issue width n, fetching n instructions at once, with n units each for decode, execute, memory, and write-back, starting n instructions per cycle; processors with issue width n > 1 are termed superscalar processors (CS:APP Section 5.7). The experimental i9-11900H starts execution of up to 5 micro-operations per cycle, used in Lecture 3 to calculate the mini-ollama throughput upper bound of 1.1 Token/s.
This slide has 2 frames on a unified grid: Frame 1 follows the timing of the "Pipeline Space-Time Diagram" page, starting 1 instruction per cycle, with 1 execute cell in Cycle 3, taking 9 cycles for 5 instructions and writing back 1 per cycle from Cycle 5; Frame 2 shows dual-issue starting 2 instructions per cycle, where movslq and movl fetch in Cycle 1 and execute concurrently in Cycle 3 (requiring two execution units), imull and addl %ecx,%r9d fetch in Cycle 2, and addl $1,%eax fetches in Cycle 3, completing 5 instructions in 7 cycles and writing back 2 per cycle from Cycle 5.
IPC (instructions per cycle) denotes the average number of instructions completed per cycle: Frame 1 achieves IPC = 1 once full; Frame 2 achieves IPC = 2; a 5-issue processor has an IPC upper bound of 5.
The diagram depicts an ideal hazard-free scenario matching "Pipeline Space-Time Diagram". Under Part 2 rules, movl address computation requires the result of movslq, so concurrent execution in Cycle 3 cannot be resolved by forwarding; actual hardware executes movslq alongside an independent instruction in Cycle 3, which is precisely the instruction selection rule on the "Out-of-Order Execution" page; because loop instructions form dependency chains, multiple-issue gains primarily derive from concurrent execution across different loop iterations.
Reiterate the distinction between the two meanings of "5": the "5" in a 5-stage pipeline denotes the vertical depth of stages traversed by an instruction (5 cells per row); the "5" in 5-issue denotes the horizontal concurrency limit starting execution in the same cycle (rows beginning execution in the same column).
Common misconception: assuming a 5-issue processor achieves an IPC of 5. 5 is a theoretical hardware ceiling; data dependencies, memory latencies, and branch mispredictions reduce sustained IPC below this ceiling, explaining the gap between measured 0.77 Token/s and the 1.1 Token/s limit in Lecture 3.
Question at the end of the page: With single-thread dependencies and memory latencies, dual execution units often cannot both be utilized; can idle execution units be utilized?
'''
# src:
# 
# 超标量：每一级的硬件复制 n 份，取指一次读出 n 条指令，译码、执行、访存、写回各有 n 份，每个周期从取指开始 n 条指令；n 是发射宽度，体系结构教材称这种处理器为超标量处理器（CS:APP 第 5.7 节）。实验机器的 i9-11900H 每个周期最多开始执行 5 条微操作，第 3 讲按它算出 mini-ollama 的上限 1.1 Token/s。
# 这一页有 2 帧，两帧的格子在同一张网格上：第 1 帧是「流水线时空图」一页的时序，每个周期开始执行 1 条，周期 3 的执行格只有一个，5 条指令用 9 个周期，从周期 5 起每个周期写回 1 条；第 2 帧每个周期开始执行 2 条，movslq 与 movl 在周期 1 取指、周期 3 同时执行，所以执行一级要有两个执行部件，imull 与 addl %ecx,%r9d 在周期 2 取指，addl $1,%eax 在周期 3 取指，5 条指令用 7 个周期，从周期 5 起每个周期写回 2 条。前两行在两帧之间不动，后三行左移。
# IPC（instructions per cycle）是平均每个周期完成的指令数，在本页正文的括号里定义：第 1 帧流水线填满后每个周期写回 1 条，IPC 为 1；第 2 帧每个周期写回 2 条，IPC 为 2；5 发射的硬件 IPC 上限为 5。
# 图按无冲突的理想情况画，与「流水线时空图」一页相同。按第二部分的规则，movl 的地址要用 movslq 的结果，两条在同一个周期执行时转发来不及，实际硬件在周期 3 执行的是 movslq 与一条无关的指令，这正是「乱序执行」一页挑指令的规则；循环体的五条指令是一条依赖链，一轮迭代中能同时执行的指令少，多发射与乱序执行的收益主要来自不同迭代的指令同时执行。
# 再次强调两个「5」的区别：五级流水线的「5」指一条指令纵向经过的 5 个阶段，图中每一行仍是 5 个格子；每个周期 5 条的「5」指多发射硬件横向在同一个周期开始执行的指令条数上限，图中是同一列里开始执行的行数。
# 学生易错：以为 5 发射的处理器 IPC 就是 5。5 是硬件的上限；指令之间的依赖、读内存的等待、分支猜错的作废都让实际的 IPC 低于上限，第 3 讲实测 0.77 Token/s 对上限 1.1 Token/s 即是这个差距。

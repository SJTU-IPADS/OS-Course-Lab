['ooo-compare.notes.1']
src_hash = 'bced3c76'
text = '''
The two rows contrast instructions in execute per cycle: the top row comes from the "In-Order Pipeline with a 3-Cycle Memory Read" page, and the bottom row comes from the "Out-of-Order Execution" page; right side indicates write-back cycles for the final instruction cmpl. Dashed cells represent idle execution units.
Both modes model the same processor: buffering decoded instructions, single execution unit, and in-order retirement; they differ only in execution scheduling. In the in-order pipeline, addl $1,%eax executes in Cycle 9 and cmpl in Cycle 10; in out-of-order execution, addl $1,%eax utilizes idle Cycle 6, enabling cmpl to execute in Cycle 9 (Cycles 7 and 8 allocated to older imull and addl %ecx,%r9d).
Benefits: idle execute cycles decrease from 3 to 2, and write-back of all five instructions moves up from Cycle 12 to Cycle 11. With only one independent instruction and a 3-cycle wait, savings equal 1 cycle; actual processors facing memory latencies of tens to hundreds of cycles can overlap numerous independent instructions, including memory loads across future iterations.
Write-back: addl $1,%eax writes back alongside addl %ecx,%r9d in Cycle 10, and cmpl in Cycle 11, never preceding older instructions, maintaining the same visible state transitions as in-order execution. If write-back were constrained to 1 instruction per cycle, addl $1,%eax would retire in Cycle 11 and cmpl in Cycle 12, yielding no overall speedup.
Common misconception 1: assuming out-of-order execution accelerates individual instructions. Each instruction still traverses all five stages; execute cycles for imull and addl %ecx,%r9d remain Cycles 7 and 8 in both modes; what changes is whether execute idles during memory waits.
Common misconception 2: assuming out-of-order execution alters program outputs. In-order retirement ensures register and memory updates match sequential execution exactly.
Question at the end of the page: Out-of-order execution keeps execution units busy during wait cycles, but only one instruction begins execution per cycle; how does the processor achieve "starting up to 5 instructions per cycle" as introduced in Lecture 3?
'''

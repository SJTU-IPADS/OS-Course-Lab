# 2. 依次经过译码、执行、访存、写回；
# 3. 时钟沿把下一条指令的地址写入 PC。

['insn-flow.slide.2']
src_hash = '1f18d014'
text = 'The processor repeats these three steps continuously, executing instructions one after another. In sequential execution, the address of the next instruction is PC + instruction length.'
# src:

['llm-pp-decode.slide.1']
src_hash = 'ff3e87cf'
text = '''
- Token 1 is output by GPU 4 in Cycle 4 and serves as input to Token 2, so Token 2 can only enter GPU 1 in Cycle 5.
- During Cycles 2, 3, and 4, GPU 1 has no new tokens to process for this request. With only a single request, only one GPU computes in each cycle.
- This dependency represents a data hazard as described in Part 2: subsequent inputs depend on preceding outputs, requiring <mark>bubbles</mark> in between.
'''
# src:
# 
# - 词 1 在周期 4 由 GPU 4 输出，它是词 2 的输入，因此词 2 在周期 5 才能进入 GPU 1。

text = 'Hardware Architecture of Hyper-Threading'
# src: 超线程：硬件结构设计

['smt-hw.slide.1']
src_hash = 'afa797b0'
text = '**Hyper-threading**: One core runs two threads simultaneously. <mark>The PC and register file are replicated</mark>, one set per thread, storing which instruction that thread has reached and the values of its registers; hardware units for fetch, decode, execution, memory, and write-back are <mark>shared between the two threads</mark>.'
# src:
# 
# **超线程**：一个核心同时运行两个线程。<mark>PC 与寄存器堆各有两份</mark>，每个线程一份，保存这个线程执行到哪一条、各寄存器的值；取指、译码、执行部件、访存、写回的硬件<mark>由两个线程共用</mark>。

['smt-hw.notes.1']
src_hash = '4b1a7d20'
text = '''
As introduced in Lecture 3 ("Thread-Level Parallelism: Multi-Core CPUs and GPUs"): each thread maintains its own %rip and executes independently. Thread architectural state consists of its PC and registers: PC tracks execution progress, and registers hold data. Hyper-threading replicates these two structures, maintaining state for two threads in one core while sharing all other hardware units.
The diagram has three horizontal bands. Top blue band represents the PC and register file of Thread A; bottom orange band represents Thread B; both register files provide identical register names (%rax through %r10 and others) storing thread-private values. Center band shows shared core hardware from superscalar and out-of-order execution: fetch, decode, reservation buffers for decoded instructions, dual execution units, memory (with retirement buffers below), and write-back. Fetch retrieves instructions using PC A or PC B; decode and write-back access the register file of the corresponding thread.
When two threads execute identical code—such as calling dot_product on different matrix rows—separate addl $1,%eax instructions update distinct %eax registers: Thread A updates index i for A, and Thread B updates index i for B.
Intel first implementation (Marr et al., Hyper-Threading Technology Architecture and Microarchitecture, Intel Technology Journal Vol. 6 No. 1, 2002, Xeon processor): each thread has private architectural state (general-purpose registers, control registers), while caches, execution units, and control logic are shared; transistors storing architectural state represent a small fraction, increasing die area by less than 5%.
The diagram is simplified. According to the Intel Optimization Reference Manual (Order Number 248966-049, Section 2.7), hardware falls into four categories: Private per thread (registers, instruction pointers, return stack predictors, instruction buffers, register alias tables); Partitioned 50/50 between threads (instruction queues, reorder buffers, memory load/store buffers; when one thread stalls, the other retains its half, and in single-thread mode all buffers are allocated to that thread); Shared (all execution units, caches, reservation stations; execution units are "HT-unaware resources"); Alternating per cycle (fetch, decode, instruction retirement). Thus hyper-threading adds no execution units; fetch and decode remain single units alternating between threads.
Operating systems treat a hyper-threaded core as two logical processors. The i9-11900H provides 8 cores with 2 threads per core: lscpu reports Thread(s) per core: 2 and Core(s) per socket: 8, exposing 16 logical processors to the OS (as used in parallel-dot in Lecture 3); /sys/devices/system/cpu/cpu0/topology/thread_siblings_list contains 0,8, indicating processors 0 and 8 reside on the same physical core.
Hyper-threading is Intel branding; computer architecture textbooks call it simultaneous multithreading (SMT, Tullsen, Eggers, and Levy, ISCA 1995); AMD Zen cores similarly feature 2 threads per core.
Common misconception: assuming hyper-threading turns one core into two complete cores. Only the PC and register file are replicated; execution units remain two, shared between threads.
Question at the end of the page: With shared fetch, decode, and execution units, how do instructions of two threads execute concurrently within the same cycle?
'''
# src:
# 
# 第 3 讲「线程并行：CPU 多核与 GPU」一页讲过：每个线程有自己的 %rip，各自取指、执行。一个线程在核心中的状态是它的 PC 与寄存器：PC 记录执行到哪一条，寄存器保存它的数据。超线程把这两样各复制一份，一个核心同时保存两个线程的状态；其余硬件只有一份，两个线程共用。
# 图分三条。上方蓝色是线程 A 的 PC 与寄存器堆，下方橙色是线程 B 的；两个寄存器堆有同样的寄存器名（%rax 至 %r10 与其余寄存器），各存各的值。中间是两个线程共用的硬件，即「超标量」与乱序执行几页的核心：取指，译码，译码后等待执行的指令，两个执行部件，访存（结果已算出、等待写回的指令在它下方的虚线框中），写回。取指按 PC A 或 PC B 取指令；译码读、写回写的都是这条指令所属线程的寄存器堆。框中的灰字说明这一级怎样对待两个线程，下一页逐条讲。
# 两个线程执行同一段代码时，例如两个线程各对矩阵的一行调用 dot_product，两条 addl $1,%eax 写的是两个不同的 %eax：线程 A 的 %eax 是 A 的 i，线程 B 的 %eax 是 B 的 i。
# Intel 的第一个实现（Marr 等，Hyper-Threading Technology Architecture and Microarchitecture，Intel Technology Journal 第 6 卷第 1 期，2002，Xeon 处理器）：每个线程有一份完整的体系结构状态（通用寄存器、控制寄存器等），缓存、执行部件、控制逻辑等几乎全部资源由两个线程共用；保存状态的晶体管只占很小的比例，超线程增加的芯片面积不到 5%。
# 图是简化。按 Intel 的优化参考手册（Intel 64 and IA-32 Architectures Optimization Reference Manual，第 049 版，第 2.7 节），实际核心中的硬件分四类。每个线程一份的：除了寄存器与指令指针（即 PC），还有前端的几个小结构（预测 ret 返回地址的小结构、存放取进来的指令字节的小缓冲）与乱序执行中记录各寄存器最新的值在处理器内部哪里的表（本讲不讲）。对半分给两个线程的：各级之间的指令队列、存放等待完成的指令的缓冲区（对应图中的「等待写回」）与读写内存的缓冲区；一个线程停住时，另一个线程仍有自己的一半可用，只有一个线程运行时，这些缓冲区全部给这个线程。两个线程共用的：全部执行部件、缓存与挑选指令执行的部分；执行部件不区分指令属于哪个线程，手册 2012 年版第 2.3.9 节写 Nehalem 时把执行部件列为 HT unaware resources。两个线程轮流用的：取指、译码与指令的完成。所以超线程没有增加执行部件；取指与译码仍是一份，要为两个线程各保存一套状态，并在两个线程之间轮流。
# 操作系统把支持超线程的一个核心看成两个处理器（Intel 称为逻辑处理器）。i9-11900H 有 8 个核心、每个核心 2 个线程：lscpu 显示 Thread(s) per core: 2、Core(s) per socket: 8，操作系统看到 16 个处理器，第 3 讲 parallel-dot 用的 16 个线程即由此而来；/sys/devices/system/cpu/cpu0/topology/thread_siblings_list 的内容是 0,8，表示编号 0 与 8 的两个处理器是同一个核心的两个线程。
# 超线程是 Intel 的名称（Hyper-Threading），体系结构教材称同时多线程（simultaneous multithreading，SMT，Tullsen、Eggers 与 Levy，ISCA 1995）；AMD Zen 系列的核心同样每个核心 2 个线程。
# 学生易错：以为超线程把一个核心变成两个核心。只有 PC 与寄存器堆有两份，执行部件仍是两个，由两个线程共用。
# 页末的问题：两个线程共用取指、译码与两个执行部件，同一个周期里，两个线程的指令怎样在核心中执行？


['llm-pp-ratio.notes.1']
src_hash = '97eb2d75'
text = '''
Derivation: the grid has 4 rows and 11 columns. Request 1 occupies the diagonal across columns 1–4, and Request 8 spans columns 8–11; triangular bubble regions at lower-left and upper-right each comprise 1 + 2 + 3 = 6 slots, totaling 12 bubbles (12 ÷ 44 = 27%). In general: for K pipeline stages and M requests, total columns equal M + K − 1, bubble slots equal K(K − 1), and bubble ratio equals K(K − 1) ÷ [K(M + K − 1)] = (K − 1) ÷ (M + K − 1), matching the GPipe formulation (Huang et al., NeurIPS 2019).
Table analysis: for fixed K = 4, doubling consecutive requests approximately halves the bubble ratio. Achieving a bubble ratio below 10% requires roughly 10× more requests than GPUs. Slicing across 16 GPUs (K = 16) produces a much higher bubble ratio for the same request count, favoring partitioning across the minimum number of GPUs required to fit weights.
Comparison with the "Limitations: Pipeline Register Overhead" page: deeper pipelines increase the proportional overhead of pipeline registers; more GPUs increase the proportion of boundary bubbles. Both illustrate the inherent cost of adding pipeline stages.
Question at the end of the page: During token-by-token generation, when can the next token of the same user enter GPU 1?
'''
# src:
# 
# 计算方法：图中 4 行、11 列。请求 1 占第 1–4 列的对角线，请求 8 占第 8–11 列；左下与右上各有一个 1 + 2 + 3 = 6 格的三角形区域是 bubble，共 12 格，12 ÷ 44 = 27%。一般情况：行数为 K，请求数为 M，总列数为 M + K − 1，bubble 格数为 K(K − 1)，占比为 K(K − 1) ÷ [K(M + K − 1)] = (K − 1) ÷ (M + K − 1)。GPipe 论文（Huang 等，NeurIPS 2019）给出的正是这一比例。
# 表格：K = 4 固定时，连续请求数每增加一倍，bubble 占比约减半。要使 bubble 占比低于 10%，连续请求数需达到 GPU 块数的十倍左右。若模型分布在 16 块 GPU 上（K = 16），相同请求数下的 bubble 占比是 K = 4 时的数倍，因此 GPU 块数以能容纳全部权重为宜。
# 与「限制：级间寄存器开销」一页对照：级数越多，级间寄存器的开销占比越高；GPU 块数越多，首尾 bubble 的占比越高。两处都说明增加级数有代价。
# 页末的问题：逐词生成时，同一用户的下一个词何时能进入 GPU 1？


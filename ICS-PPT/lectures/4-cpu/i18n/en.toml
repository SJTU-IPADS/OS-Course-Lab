['llm-what.title']
src_hash = '3596a133'
text = 'Autoregressive Generation'
# src: 自回归生成

['llm-what.slide.1']
src_hash = '728a255b'
text = '''
- A large language model can be viewed as a function: **input** is all tokens up to this point, and **output** is the next token.
- The generated token is appended to the input to serve as input for the next step. Generating responses token by token in this manner is called **autoregressive generation**.
- The input to step 6 contains the token "吞吐" generated in step 5: step 6 <mark>cannot begin</mark> before step 5 finishes.
'''
# src:
# 
# - 大模型可以看作一个函数：**输入**是到目前为止的全部词（token），**输出**是下一个词。
# - 输出的词追加到输入末尾，作为下一步的输入。模型以这种方式逐词生成回答，称为**自回归生成**。
# - 第 6 步的输入包含第 5 步输出的「吞吐」：第 5 步结束之前，第 6 步<mark>无法开始</mark>。

['llm-what.notes.1']
src_hash = 'a3d2af40'
text = '''
A token is the basic unit processed by the model, representing a Chinese character, a word, an English word, or a word fragment; the vocabulary of Qwen3-VL-2B contains 151936 candidate tokens. The model computes a probability for each candidate token, represented by the probability distribution bars in the figure; the token with the highest probability is typically selected, or sampled according to the distribution.
The two rows in the diagram depict two consecutive generation steps: step 5 takes the four tokens "流水线 提高 的 是" as input and outputs "吞吐"; "吞吐" is appended to form the 5th input token of step 6, which outputs "率". The example sentence illustrates the central theme of this lecture: "pipelining increases throughput".
The dependency relationship introduced here recurs throughout Part 4: input to step 6 requires output from step 5, so step 6 must wait for step 5 to finish. Data hazards in Part 2 represent the same dependency: subsequent instructions depend on results of preceding instructions.
Common misconception: assuming the model generates an entire sentence at once. Each forward computation produces only a single token; a response of 50 tokens requires 50 sequential forward passes.
Question at the end of the page: When generating a single token, what computations occur inside the model?
'''
# src:
# 
# 词（token）是模型处理的基本单位，可以是一个汉字、一个词、一个英文单词或单词的一部分；Qwen3-VL-2B 的词表有 151936 个候选词。模型为每个候选词给出一个概率，图中的条形表示这一分布；通常选取概率最大的词，也可以按概率抽样。
# 配图的两行是相邻的两步：第 5 步的输入是「流水线 提高 的 是」四个词，输出「吞吐」；「吞吐」追加到末尾，成为第 6 步的第 5 个输入，第 6 步输出「率」。例句即本讲的结论「流水线提高的是吞吐率」。
# 本页的依赖关系贯穿第四部分：第 6 步的输入包含第 5 步的输出，第 6 步必须等待第 5 步完成。第二部分的 data hazard 是同一种依赖：后一条指令使用前一条指令的结果。
# 学生易错：以为模型一次生成整句话。模型每完成一次计算只输出一个词，50 个词的回答需要计算 50 次。
# 页末的问题：生成一个词时，模型内部要完成哪些计算？

['llm-layers.title']
src_hash = '41f7dec6'
text = 'Forward Pass'
# src: 前向计算

['llm-layers.slide.1']
src_hash = '782cd4eb'
text = '''
- The model maps each input token to a vector.
- The vector passes sequentially through layers 1 to 28, where the primary operation in each layer is **weight matrix × vector**. This process is called the forward pass.
- The output of layer 28 provides scores for candidate tokens, selecting the next token. The 28 layers comprise 1.72 billion weights, occupying 0.968 GB in Q4_0 format; generating each token requires <mark>reading all weights once</mark>.
'''
# src:
# 
# - 模型将每个输入词映射为一个向量。
# - 向量依次经过第 1 层至第 28 层，每层的主要运算是**权重矩阵 × 向量**。这一过程称为前向计算。
# - 第 28 层的输出给出每个候选词的分数，据此选出下一个词。28 层的权重共 17.2 亿个，以 Q4_0 格式存储为 0.968 GB；每生成一个词，<mark>全部权重读取一遍</mark>。

['llm-layers.notes.1']
src_hash = 'fb55509c'
text = '''
Each transformer layer contains attention and feed-forward networks; this lecture abstracts them to one essential fact: each layer maintains distinct weight matrices, and its primary operation multiplies these matrices by the input vector to produce an output vector of identical dimension (2048), which serves as input to the next layer.
28 layers represents the actual layer count of Qwen3-VL-2B; 1.72 billion weights quantized to 4 bits (Q4_0, averaging ~4.5 bits per weight) occupy 0.968 GB. To generate each token, the vector is computed sequentially from layer 1 through layer 28, reading all weights across all 28 layers once.
Common misconception: assuming all 28 layers reuse the same set of weights. Each layer has unique weights, and the total weight volume is the sum across all 28 layers.
Question at the end of the page: 0.968 GB of weights fits easily within the memory of a single GPU. How are much larger models stored?
'''
# src:
# 
# 每一层内部包含注意力、前馈网络等结构，本讲只用到一点：每层有各自的权重矩阵，层的主要运算是用这些矩阵乘以输入向量，输出一个同为 2048 维的向量，作为下一层的输入。
# 28 层是 Qwen3-VL-2B 的实际层数；17.2 亿个权重按 4 位量化（Q4_0，平均每个权重约 4.5 位）存储为 0.968 GB。每生成一个词，向量从第 1 层依次计算到第 28 层，28 层的权重全部读取一遍。
# 学生易错：以为 28 层重复使用同一组权重。每层的权重各不相同，总量是 28 层之和。
# 页末的问题：0.968 GB 的权重可以放进一块 GPU 的显存。规模更大的模型如何存放？

['llm-too-big.title']
src_hash = 'ed85600b'
text = 'GPU Memory Capacity'
# src: 显存容量

['llm-too-big.slide.1']
src_hash = '7150f9c8'
text = '''
- GPUs store weights in their onboard **GPU memory**. An H100 provides 80 GB of memory capacity.
- Llama 3.1 405B has 405 billion weights, each 16 bits (2 bytes), totaling 810 GB: 810 ÷ 80 ≈ 10.1, requiring at least <mark>11 GPUs</mark>.
- Weights must be partitioned across multiple GPUs. How should they be partitioned?
'''
# src:
# 
# - GPU 将权重存放在自身的**显存**中。一块 H100 的显存容量为 80 GB。
# - Llama 3.1 405B 有 4050 亿个权重，每个权重 16 位（2 字节），共 810 GB：810 ÷ 80 ≈ 10.1，至少需要 <mark>11 块 GPU</mark>。
# - 权重必须分布到多块 GPU 上。如何划分？

['llm-too-big.notes.1']
src_hash = 'f460069c'
text = '''
GPU compute units access only onboard memory directly; weights must be loaded into GPU memory before participating in computation. 80 GB is standard for datacenter GPUs; weights of a 405B model alone exceed the capacity of a single GPU by tenfold, and runtime intermediate activations require additional memory. Real-world deployments typically utilize 16 GPUs across two server nodes.
The diagram partitions 810 GB into 80 GB blocks: 10 full blocks leave an excess remainder, necessitating at least 11 GPUs.
Two primary partitioning strategies exist: pipeline parallelism partitions layers across GPUs (e.g., placing the first several layers on one GPU and subsequent layers on the next); tensor parallelism slices weight matrices within each layer across GPUs, requiring inter-GPU communication within every layer.
Question at the end of the page: After partitioning by layers, how does a request complete computation across all 28 layers?
'''
# src:
# 
# GPU 的运算单元只能直接访问本卡的显存，权重须先载入显存才能参与计算。80 GB 是当前数据中心 GPU 的常见容量；405B 规模的模型仅权重就超过单卡显存的十倍，推理过程中的中间结果还需要额外的空间。实际部署通常使用两台机器上的 16 块 GPU。
# 配图将 810 GB 按 80 GB 一格划分：10 格占满后仍有剩余，因此需要 11 块 GPU。
# 划分方式有两种。一种按层划分：前若干层放在一块 GPU 上，后续若干层放在下一块 GPU 上，称为流水线并行。另一种将每层的权重矩阵切分到几块 GPU 上，各自计算一部分后再合并，称为张量并行，每一层都要在 GPU 之间交换数据；本讲只提及这一名称。
# 页末的问题：按层划分后，一个请求如何完成 28 层的计算？

['llm-split.title']
src_hash = '113138a6'
text = 'Pipeline Parallelism'
# src: 流水线并行

['llm-split.slide.1']
src_hash = '55c3f5db'
text = '''
- Partition 28 layers into 4 chunks of 7 layers each across 4 GPUs.
- A request vector completes layers 1–7 on GPU 1, passes the result (a 2048-dimensional vector) to GPU 2 for layers 8–14, and continues until GPU 4 selects the token.
- The four GPUs form a 4-stage pipeline, where vectors transferred between GPUs correspond to intermediate data in <mark>pipeline registers</mark> on the "Principles of Pipelining" page. This partitioning scheme is called <mark>pipeline parallelism</mark>.
'''
# src:
# 
# - 将 28 层分为 4 份，每份 7 层，分别放在 4 块 GPU 上。
# - 一个请求的向量先在 GPU 1 上完成第 1–7 层的计算，结果（一个 2048 维的向量）传给 GPU 2，继续计算第 8–14 层，依此类推，最后由 GPU 4 选出词。
# - 四块 GPU 构成四级流水线，GPU 之间传递的向量对应「流水线原理」一页<mark>级间寄存器</mark>中的内容。这种划分方式称为<mark>流水线并行</mark>。

['llm-split.notes.1']
src_hash = '88891c9d'
text = '''
Analogy with Part 1: an instruction passes sequentially through five hardware units (fetch, decode, execute, memory, write-back), while a request passes sequentially through four GPUs; intermediate results are held in pipeline registers between stages, analogous to transferring vectors across GPU interconnects once GPU 1 finishes. Transferred data is merely a 2048-dimensional vector (a few kilobytes), negligible compared to hundreds of megabytes or tens of gigabytes of weights read per GPU, resulting in minimal communication overhead.
While Qwen3-VL-2B occupies only 0.968 GB and fits on a single GPU, it is partitioned into 4 chunks here to continue the 28-layer running example. Multi-GPU partitioning is necessary for massive models as shown on the previous slide, where identical principles apply.
Pipeline parallelism was established in GPipe (Huang et al., NeurIPS 2019) and PipeDream (Narayanan et al., SOSP 2019). Both addressed model training, and inference serving uses the same architectural partitioning.
Question at the end of the page: With only a single request, are all four GPUs active simultaneously?
'''
# src:
# 
# 与第一部分对照：一条指令依次经过取指、译码、执行、访存、写回五组硬件，一个请求依次经过四块 GPU；相邻两级之间由级间寄存器保存结果，GPU 1 完成计算后经 GPU 之间的互连将向量传给 GPU 2。传输的数据只是一个 2048 维的向量（几 KB），远小于每块 GPU 要读取的几百 MB 至几十 GB 权重，因此划分带来的通信开销很小。
# Qwen3-VL-2B 只有 0.968 GB，一块 GPU 即可容纳；图中划分为 4 份，是为了沿用前面 28 层的示例。需要划分的是上一页那样的大模型，原理相同。
# 流水线并行（pipeline parallelism）一词来自 GPipe（Huang 等，NeurIPS 2019）与 PipeDream（Narayanan 等，SOSP 2019）。两篇论文针对训练，推理服务的划分方式相同。
# 页末的问题：只有一个请求时，四块 GPU 是否同时在工作？


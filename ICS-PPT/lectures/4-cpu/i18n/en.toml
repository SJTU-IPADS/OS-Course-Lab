# valP 是下一条指令的地址，在取指阶段算出；更新 PC 一行是周期结束的时钟沿把 valP 写入 PC，五级模型不把它单列为一个阶段。
# 学生易错：以为 valA、valB、valE 是程序能读写的寄存器。它们是各阶段之间传递的值，程序看不到。

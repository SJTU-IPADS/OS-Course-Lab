['mmap-in-practice.slide.1']
src_hash = '3ae38b04'
text = 'In 2023 llama.cpp moved from `malloc` + `read` of the 1.9 GB file to `mmap`, which loads only the pages accessed. The model and algorithm were unchanged.'
# src:
# 
# 2023 年 llama.cpp 把 1.9 GB 权重的加载从「`malloc` 缓冲区再 `read` 整个文件」改为 `mmap`：文件映射进进程的地址空间，访问到哪一部分才装入哪一部分。模型与算法均未变化。

['mmap-in-practice.image.1.caption']
src_hash = '4b0aa482'
text = 'PR #613 — only the loading path changed; the model and the algorithm did not'
# src: 标题与三条说明都描述同一次改动的效果：加载更快、可加载的模型更大、多个推理进程可并行

['mmap-in-practice.highlight.1']
src_hash = '1e267b81'
text = 'A difference of this magnitude comes from the mechanism chosen.'
# src: 这一量级的差别由所使用的操作系统机制决定。

['mmap-in-practice.notes.1']
src_hash = '6a620813'
text = '''
The `read` approach needs a buffer as large as the file, and every byte is copied twice (disk → kernel buffer → user buffer);
`mmap` copies nothing when the mapping is set up, and page faults load the pages that are accessed.
The commit lists three effects: loading is much faster, larger models become loadable, and several
inference processes can share one copy of the page cache. All three follow from the same cause:
weight pages come straight from the kernel page cache instead of being copied into a user buffer.
ollama uses llama.cpp as its inference backend and inherits this loading path.
Mappings, page tables and page-fault handling are covered in the virtual memory chapter.
'''
# src:
# 
# `read` 的做法需要一块与文件同样大的缓冲区，每个字节经过两次拷贝（磁盘 → 内核缓冲区 → 用户缓冲区）；
# `mmap` 建立映射时不拷贝数据，访问映射区时由缺页处理装入对应的页。
# 该提交同时给出三点效果：加载显著加快、可加载的模型规模提高、多个推理进程可共享同一份页缓存。
# 三点都由同一个原因得到：权重页由内核的页缓存直接提供，不再复制到用户缓冲区。
# 映射、页表与缺页处理在虚拟内存一章展开。
# ollama 使用 llama.cpp 作为推理后端，沿用了这一加载方式。

['devices-and-drivers.title']
src_hash = '284c3393'
text = 'Device access: the GPU is also reached through the operating system'
# src: 设备访问：GPU 同样经由操作系统

['devices-and-drivers.slide.1']
src_hash = '16031b11'
text = '''
The runner cannot submit commands to the GPU directly; its access path is:
- open a **device file** (`/dev/nvidia*` on Linux)
- request device memory, submit kernels and await completion through the **driver**
- rely on the kernel to keep device memory inaccessible across processes
'''
# src:
# 
# **推理进程不能直接向 GPU 提交命令，其访问路径为：**
# - 打开**设备文件**（Linux 上为 `/dev/nvidia*`）
# - 经**驱动程序**申请设备内存、提交核函数并等待完成
# - 由内核保证进程之间的设备内存互不可访问

['devices-and-drivers.slide.2']
src_hash = '65f9db14'
text = 'Transferring a tensor to device memory is therefore a **data movement across three levels of storage**: storage device → memory → device memory.'
# src:
# 
# 将张量传输至设备内存，是一次**跨越三级存储的数据移动**：
# **存储设备 → 内存 → 设备内存。**

['devices-and-drivers.highlight.1']
src_hash = '8a7522fe'
text = 'Cross-level data movement dominates first-token latency.'
# src: 跨层数据移动的开销，是首 token 延迟的主要来源之一。

['scheduling.title']
src_hash = '19b19b33'
text = 'Scheduling under concurrent requests: mechanism and policy'
# src: 并发请求下的调度：机制与策略

['scheduling.slide.1']
src_hash = '91b5e6ca'
text = '''
The server may handle several requests concurrently. Given a limited number of processor cores, the operating system provides two mechanisms:
- **Preemptive scheduling**: bounds the time any execution stream occupies the processor
- **Blocking wait**: a process waiting on disk, GPU or network yields the processor
'''
# src:
# 
# **服务进程可能同时处理多个请求。在处理器核数有限的条件下，操作系统提供两项机制：**
# - **抢占式调度**：限制单个执行流连续占用处理器的时间
# - **阻塞式等待**：等待磁盘、GPU 或网络的进程让出处理器

['scheduling.slide.2']
src_hash = '366c0adb'
text = '''
**On top of these, the inference server implements its own scheduling policy and optimisations:**
- **Batching**: continuous batching merges the computation of several requests
- **Load balancing**: distributes requests across inference processes or GPUs
- Request queueing and admission control
'''
# src:
# 
# **推理服务在此之上实现自身的调度策略与优化：**
# - **批处理**：连续批处理（continuous batching）合并多个请求的计算
# - **负载均衡**：把请求分配到多个推理进程或多块 GPU
# - 请求排队与准入控制

['scheduling.highlight.1']
src_hash = 'e5e13162'
text = 'The OS decides what a program can do; the application decides when and how.'
# src: 操作系统决定程序能做什么，应用决定什么时候做、怎么做。

['os-evolution.title']
src_hash = '27056e79'
text = 'The evolution of operating systems and their invariant responsibilities'
# src: 操作系统的演进与不变的核心职责

['os-evolution.image.1.caption']
src_hash = '5f41bd1e'
text = 'Selected milestones, not a single line of descent'
# src: 选取的若干里程碑，不构成单一的继承关系

['os-evolution.slide.1']
src_hash = '65ec9d5b'
text = '''
- **Multics** (1960s) implemented timesharing and protection systematically
- **Unix** (1969) emphasised compact interfaces and composable tools; the 1973 rewrite in C substantially reduced porting cost
- **Linux** (1991–) is a continuously evolving monolithic kernel; **Redox** (2015–) implements a microkernel in Rust
- Implementations differ; the core problems remain the same four: ==isolation, memory, files and devices==
'''
# src:
# 
# - **Multics**（1960 年代）系统地实现了分时与保护机制
# - **Unix**（1969）强调紧凑接口与可组合的工具，1973 年以 C 重写，显著降低移植成本
# - **Linux**（1991 至今）为持续演进的宏内核；**Redox**（2015 至今）以 Rust 实现微内核结构
# - 实现语言与内核结构各不相同，需要解决的核心问题保持一致：<mark>隔离、内存、文件与设备</mark>


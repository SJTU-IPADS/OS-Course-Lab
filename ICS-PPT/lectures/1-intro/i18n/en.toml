['runtime-libraries.slide.2']
src_hash = '212d201d'
text = '''
- `cpp_demo`'s machine code is ==incomplete==: `printf` arrives from a library at load time
- `printf` comes from **libc** and `std::cout` from **libstdc++**, which calls into libc underneath
- Libraries **buffer** output: many `printf` calls may become a single `write` system call
- On macOS the same program lists `libc++.1.dylib` and `libSystem.B.dylib`
'''
# src:
# 
# - 这两行说明 `cpp_demo` 的机器码<mark>并不完整</mark>：`printf` 等函数的实现在库文件中，装载时才补齐
# - `printf` 由 **libc** 实现，`std::cout` 由 **libstdc++** 实现，后者最终调用前者提供的底层接口
# - 库对输出进行**缓冲**：多次 `printf` 可能只产生一次 `write` 系统调用，两者不是一一对应

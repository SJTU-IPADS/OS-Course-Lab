['agent-loop.slide.1']
src_hash = '36f9b932'
text = '''
1. The client submits the request and its context to a model service over HTTPS/TLS
2. The model returns text, or returns a ==structured tool-call request==
3. The host checks permissions and arguments, executes the permitted tool **locally**, and supplies the result as input to the next iteration
'''
# src:
# 
# 1. 客户端通过 HTTPS/TLS 向模型服务提交请求与上下文
# 2. 模型返回文本，或返回一个<mark>结构化的工具调用请求</mark>
# 3. 宿主检查权限与参数，在**本地**执行允许的工具，并将结果作为下一轮输入

['agent-loop.image.1.caption']
src_hash = '029d22b9'

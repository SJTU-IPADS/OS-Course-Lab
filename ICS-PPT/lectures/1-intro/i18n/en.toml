['why-os.title']
src_hash = 'b2e599e5'
text = 'The OS lets multiple programs share hardware'
# src: 操作系统的目标是多个程序共享硬件

['why-os.slide.1']
src_hash = '7f40bde0'
text = 'A browser, an editor and ollama request the same processors and memory, which requires **scheduling**, **concurrency** and **isolation**.'
# src: 浏览器、编辑器与 ollama 同时请求同一组处理器与内存资源，需要**调度**、**并发**与**隔离**机制。

['why-os.slide.2']
src_hash = '60fcdf4c'
text = '''
If applications could access the hardware directly:
- **No isolation**: an out-of-bounds write in one program can corrupt another program's memory
- **No scheduling**: without preemption, a single program can occupy the processor indefinitely
- **No common interface**: replacing a device would require modifying the application
'''
# src:
# 
# **若应用程序可以直接访问硬件：**
# - **缺乏隔离**：一个程序的越界写入可以破坏另一程序的内存
# - **缺乏调度**：没有抢占机制时，单个程序可长期独占处理器
# - **缺乏统一接口**：更换设备需要修改应用程序

['why-os.highlight.1']
src_hash = '998f7edf'
text = 'The OS multiplexes hardware and enforces protection boundaries.'
# src: 操作系统复用硬件资源，并实施保护边界。


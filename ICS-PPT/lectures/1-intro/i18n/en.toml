['weights-are-data.notes.1']
src_hash = '60c901ff'
text = '''
`sed -n '2p'` skips the `total` line of `ls` (macOS counts it in 512-byte blocks) and `ls -dS`
sorts by size to pick the largest blob, so both commands print the same thing on Linux and macOS.
The same holds in WSL2 on Windows; the Windows build of ollama keeps the weights under
`%USERPROFILE%/.ollama/models/blobs`, listed in PowerShell with
`Get-ChildItem <dir> | Sort-Object Length -Descending | Select-Object -First 1`.
'''
# src:
# 
# `sed -n '2p'` 跳过 `ls` 的 total 行（macOS 按 512 字节块计数），`ls -dS` 按大小排序
# 取出最大的 blob，两条命令在 Linux 与 macOS 上输出一致。Windows 的 WSL2 中同样如此；
# Windows 版 ollama 把权重放在 `%USERPROFILE%/.ollama/models/blobs`，PowerShell 中用
# `Get-ChildItem <dir> | Sort-Object Length -Descending | Select-Object -First 1` 查看。

['system-abstraction.title']
src_hash = '50db4b45'
text = 'System abstractions: the boundary between application and system'
# src: 系统抽象：应用与系统之间的分界线

['system-abstraction.slide.1']
src_hash = 'ef376ae9'
text = '''
**Processes, virtual memory and files are system abstractions. They:**
- **Simplify development**: applications use hardware without its details
- **Evolve independently**: with the abstraction fixed, either side can change
- **Isolate problems**: a failure on one side stays within the boundary
'''
# src:
# 
# **进程、虚拟内存与文件，是系统向应用提供的抽象。抽象的作用：**
# - **简化开发**：应用程序通过抽象使用硬件，无需了解硬件细节
# - **独立演进**：抽象保持不变时，两侧的实现可以分别修改
# - **隔离问题**：一侧的故障被限制在分界线以内

['system-abstraction.slide.2']
src_hash = '9e5f6714'
text = '''
Abstractions also hide the implementation, making problems ==harder== to locate.
The LLM era deepens this: LLM-written code runs on more complex systems.
'''
# src:
# 
# 抽象同时隐藏了实现，程序出现问题时，定位和解决问题因此<mark>更困难</mark>。
# 大模型时代加剧了这种隐藏：代码由大模型编写，所依赖的系统也更复杂。

['system-abstraction.highlight.1']
src_hash = '6406448e'
text = 'Abstraction hides implementation; locating problems needs system knowledge.'
# src: 抽象隐藏了实现，定位问题时因此更需要了解系统。


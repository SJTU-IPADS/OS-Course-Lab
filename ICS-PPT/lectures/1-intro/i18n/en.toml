['process-isolation.slide.1']
src_hash = 'dee98284'
text = '''
**Processes 1832 / 1904 / 2077 from the earlier `ps` output each own an execution environment:**
- an independent **virtual address space**: the same virtual address `0x7fff...` maps to different physical memory in different processes
- an independent **open file table** and register **context**
- an execution stream the kernel may ==preempt==
'''
# src:
# 
# **前面 `ps` 输出中的 1832 / 1904 / 2077，各自独占一份执行环境：**
# - 独立的**虚拟地址空间**：同一虚拟地址 `0x7fff...` 在不同进程中映射到不同的物理内存
# - 独立的**打开文件表**与寄存器**上下文**
# - 可被内核<mark>抢占</mark>的执行流

['process-isolation.sidenote.1.title']
src_hash = '6be535f5'
text = 'Process isolation confines the effect of a fault'
# src: 进程隔离限制故障传播范围

['process-isolation.sidenote.1.text']
src_hash = '2d78fe16'
text = 'When `ollama-runner` terminates on a segmentation fault, `ollama serve` receives notification that the child process has exited and creates a new runner to continue serving. **The primary function of isolation is to confine a fault to a single process; on that basis it also constitutes a security boundary.**'
# src: `ollama-runner` 因段错误退出时，`ollama serve` 收到子进程结束通知，重新创建推理进程即可继续服务。**隔离的首要作用是把故障限制在一个进程之内；在此基础上，它同时构成安全边界。**

['process-isolation.highlight.1']
src_hash = '24f4e2b1'
text = "A process is the OS's resource and protection boundary."
# src: 进程是操作系统为一个运行中的程序划定的资源与保护边界。

['mmap-in-practice.title']

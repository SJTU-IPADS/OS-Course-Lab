['machine-code.title']
src_hash = '6abfb779'
text = 'One x86-64 implementation of the dot-product loop'
# src: 点积循环的一种 x86-64 指令实现

['machine-code.slide.1']
src_hash = '4b89451c'
text = '''
The six instructions below correspond to the complete loop in `infer()` in `mini_ollama.c`:
- `movss` / `mulss` / `addss`: load, multiply and accumulate, forming the **basic multiply–add sequence**
- `cmpq` / `jne`: implement the loop condition and the transfer of control; no `for` construct exists at the machine level
'''
# src:
# 
# **以下六条指令对应 `mini_ollama.c` 中 `infer()` 的完整循环：**
# - `movss` / `mulss` / `addss`：装载、相乘、累加，构成**乘加运算的基本形式**
# - `cmpq` / `jne`：实现循环条件判断与控制转移；机器层面不存在 `for` 这一结构

['machine-code.aside.1']
src_hash = '8bc72c2f'
text = 'The instructions generated depend on the compiler, the optimization options, the ISA extensions and the target processor.'
# src: 具体生成的指令取决于编译器、优化选项、ISA 扩展与目标处理器。

['machine-code.notes.1']
src_hash = '417d8cdf'
text = '''
Compiling the same code on an arm64 Mac gives AArch64 instructions: `ldr` to load,
`fmul` / `fadd` (or a single `fmadd`) to multiply and add, `cmp` and `b.ne` for the loop.
Instruction names follow the instruction set; the six steps here stay the same. This course uses x86-64.
On x86 Windows the instruction set is the same and the instruction sequence matches; the calling
convention is Microsoft x64, whose argument registers differ from System V. Part 2 covers that.
'''
# src:
# 
# 在 arm64 的 Mac 上编译同一段代码，得到的是 AArch64 指令：装载用 `ldr`，
# 乘加用 `fmul` / `fadd`（或合并为 `fmadd`），循环用 `cmp` 与 `b.ne`。

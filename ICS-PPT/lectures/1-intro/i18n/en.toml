# 
# - Python 源码由**解释器**执行；解释器本身是编译好的原生可执行文件（ELF、Mach-O 或 PE）
# - 在 PyTorch 中，Python 负责<mark>组织</mark>计算过程：构建模型并分派算子
# - 算子的实际执行位于编译好的原生库中：`libtorch_cpu.so` / `libtorch_cuda.so`


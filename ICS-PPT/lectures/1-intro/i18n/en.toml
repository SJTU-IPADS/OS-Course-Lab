['stored-program.title']
src_hash = '609cd858'
text = 'Hardware makes computation software: stored programs'
# src: 硬件的目标是计算的软件化：存储程序体系结构

['stored-program.slide.1']
src_hash = '6b97dae2'
text = '''
**Early computers were ==rewired== to change program; von Neumann stored program and data in memory.**
- Program + data → CPU + memory: a uniform fetch → decode → execute cycle
- A new task is new bytes in memory: computation is **repeatable** and **programmable**
'''
# src:
# 
# **早期计算机更换程序需要<mark>重新接线</mark>。冯·诺依曼架构将程序与数据一同存放在内存中。**
# - 程序 + 数据 → CPU + 内存：处理器的执行过程统一为取指 → 译码 → 执行
# - 更换计算任务即更换内存中的一段字节，计算因此**可重复**、**可编程**，无需改变硬件

['stored-program.image.1.caption']
src_hash = 'c5040bf5'
text = 'Programming ENIAC via plugboard (left); von Neumann and the First Draft of a Report on the EDVAC (right)'
# src: ENIAC 的插接板编程（左）；冯·诺依曼与《EDVAC 报告初稿》（右）


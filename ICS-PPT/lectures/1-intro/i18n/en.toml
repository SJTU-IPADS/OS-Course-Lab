# 
# **输出是逐 token 出现的，命令本身不包含<mark>任何</mark>关于计算过程的描述。**
# - 权重的存放位置、使用 CPU 或 GPU、内存不足时的处理，均未指定
# - 这些工作由系统在应用背后完成：计算、存储、通信、异常处理与安全隔离


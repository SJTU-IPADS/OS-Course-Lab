['course-goals.slide.1']
src_hash = '00ef527b'
text = '''
The goal of this course is to become one of the rare power **system** programmers. What you gain:
- An understanding of how applications execute in a system, including programs written by LLMs
- The ability to analyse, locate and solve problems in programs, and more methods for improving them
'''
# src:
# 
# 本课程的目标是成为少数的 power **system** programmer。学习本课程的收获：
# - 理解应用程序在系统中的执行过程，其中包括由大模型编写的程序
# - 能够分析、定位和解决程序中的问题，并掌握更多改进程序的方法

['course-goals.highlight.1']
src_hash = 'c14ff778'
text = 'A system model of program execution is the means to this goal.'
# src: 建立程序执行的系统模型，是达到这一目标的手段。

['course-questions.title']
src_hash = '6d395867'
text = 'Questions of this course: how applications execute in a system'
# src: 本课程讨论的问题：应用程序如何在系统中执行

['course-questions.slide.1']
src_hash = 'bce5db7d'
text = '''
- How is "computation" carried out by a CPU or GPU?
- How is "data" stored in memory and on external storage?
- How will the program perform on a new hardware platform?
- If the performance is unsatisfactory, where can it be optimised?
- Why did the program fail on this run, and what might the error relate to?
- Is the program secure? Could it leak my information?
'''
# src:
# 
# - 「计算」是如何由 CPU 或 GPU 完成的？
# - 「数据」是如何存储到内存和外存上的？
# - 在新的硬件平台上，程序的性能会是什么样？
# - 如果对程序的性能不满意，可以从哪里优化？
# - 为什么这次运行时程序出错了？错误可能和什么相关？
# - 程序是否安全？会不会泄露我的信息？

['course-questions.slide.2']
src_hash = '27f0bbce'
text = '''
**Answering these questions rests on understanding how programs execute in a system:**
- **System modelling**: build a model of the current system; no two systems are exactly alike
- **Inference and diagnosis**: use the model to infer program behaviour and diagnose problems
'''
# src:
# 
# **回答这些问题的基础，是理解程序在系统中执行的能力：**
# - **系统建模**：对当前所处的系统建立模型，每个系统都不完全相同
# - **推断与诊断**：据此推断程序的行为，诊断程序的问题


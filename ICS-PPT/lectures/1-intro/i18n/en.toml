['python-and-pytorch.slide.1']
src_hash = '6b3cf77c'
text = '''
- Python source is executed by an **interpreter**, a native executable (ELF, Mach-O or PE)
- In PyTorch, Python ==organizes== the computation: it builds the model, dispatches operators
- Operators are executed in compiled native libraries: `libtorch_cpu.so` / `libtorch_cuda.so`
'''

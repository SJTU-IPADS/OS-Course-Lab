text = '''
- **CPU**: control unit, ALU and registers; executes instructions in order
- **DRAM**: holds the code and data in use; contents are lost on power-off
- **GPU**: many parallel execution units with high-bandwidth device memory
- **Buses and I/O**: connect the above to storage devices and network interfaces
'''
# src:
# 
# - **CPU**：控制单元、算术逻辑单元与寄存器，顺序执行指令
# - **DRAM**：存放当前使用的代码与数据，掉电后内容丢失
# - **GPU**：大量并行执行单元，配备独立的高带宽设备内存
# - **总线与 I/O**：连接上述部件与存储设备、网络接口


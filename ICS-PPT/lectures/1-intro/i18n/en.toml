['worth-taking.title']
src_hash = '259bd5ca'
text = 'Why take this course now that AI-assisted programming is common'
# src: AI 时代学习本课程的必要性

['worth-taking.slide.1']
src_hash = 'ab3293be'
text = '''
With AI-assisted programming (vibe coding) in wide use, three questions arise:
1. Is it still worth training yourself as a power programmer?
2. Can a programmer outperform an LLM in some respects?
3. Does this course teach anything an LLM does not know?
'''
# src:
# 
# AI 辅助编程（vibe coding）普及之后，需要回答三个问题：
# 1. 是否仍有必要把自己训练成 power programmer？
# 2. 程序员能否在某些方面胜过大模型？
# 3. 本课程讲授的内容中，是否有大模型不知道的部分？

['worth-taking.slide.2']
src_hash = '5025ef98'
text = '''
**Programmers often have not read, do not understand, and cannot take responsibility for LLM-generated code.**
- Its **performance**, **correctness at boundary conditions** and **security** must still be ensured by the programmer
- The programmer's responsibility grows ==in step== with the amount of generated code
'''
# src:
# 
# **由大模型生成的代码，程序员往往没有读懂、没有掌握，也无法为其负责。**
# - 这些代码的**性能**、**边界条件下的正确性**与**安全性**，仍然需要程序员来保证
# - 程序员承担的责任随生成代码的数量<mark>同步增加</mark>

['worth-taking.highlight.1']
src_hash = '7e3e0389'
text = 'The LLM generates the code; the programmer remains responsible for its behaviour.'
# src: 代码由大模型生成，对代码行为负责的仍是程序员。


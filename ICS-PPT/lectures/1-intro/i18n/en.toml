['runtime-libraries.notes.1']
src_hash = '1167cb53'
text = '''
The output of `ldd` is the work list the dynamic linker completes at startup. In class, run `ldd`
on the same program built normally and with `gcc -static` to show static against dynamic linking.
In WSL2 on Windows the command is the one shown here; built natively on Windows the shared
libraries are DLLs. MSYS2 also provides `ldd`; the native toolchain uses `objdump -p` or
`dumpbin /dependents`, and lists `libstdc++-6.dll`, `msvcrt.dll` and `KERNEL32.dll`.
'''

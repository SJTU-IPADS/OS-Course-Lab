['one-command.slide.1']
src_hash = 'ef1e831c'
text = '''
**The output appears token by token, and the command contains ==no== description of the computation.**
- Where the weights are stored, whether CPU or GPU is used, and what happens when memory runs short are all unspecified
- The system does this work behind the application: computation, storage, communication, exception handling and isolation
'''

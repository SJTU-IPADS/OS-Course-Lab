['cache-hit.slide.1']
src_hash = 'ad07ce6b'
text = '`cache_read(0x12345, dst, 4)` touches only one line and calls `cache_access(0x12345)` once.'
# src:
# 
# `cache_read(0x12345, dst, 4)` 只涉及一行，调用一次 `cache_access(0x12345)`。

['cache-hit.notes.1']
src_hash = '2479e8d7'
text = '''
All four ways of set 13 are valid, with tags 0x05, 0x12, 0x07 and 0x2a, and way 3 is dirty. This state is set up to illustrate the process.
Step 1: cache_set_index and cache_tag compute set index 13 and tag 0x12, and the lookup takes place only in set 13.
Step 2: cache_lookup(13, 0x12) compares the four ways in turn. Way 1 is valid and its tag is equal, so it returns way 1.
Step 3: hit. cache_access adds 1 to cache_hits, adds 1 to cache_use_clock, which becomes 60, writes 60 into last_use of way 1, and returns way 1. cache_read copies 4 bytes from data[5] on into dst. This line access does not read or write memory.
last_use records the order of the most recent accesses: way 1 now has the largest value, and it is the most recently used line of this set. The next page shows which functions a miss calls.
'''
# src:
# 
# 组 13 的四路都有效，tag 分别是 0x05、0x12、0x07、0x2a，way 3 是脏行。这是为说明过程设的状态。
# 第 1 步：cache_set_index 与 cache_tag 求出组号 13 与 tag 0x12，只在组 13 中查找。
# 第 2 步：cache_lookup(13, 0x12) 依次比较四路，way 1 有效且 tag 相等，返回 way 1。
# 第 3 步：命中。cache_access 给 cache_hits 加 1，cache_use_clock 加 1 变为 60，把 60 写入 way 1 的 last_use，返回 way 1。cache_read 从 data[5] 起复制 4 个字节到 dst。这次行访问不读写内存。
# last_use 记录的是最近一次访问的先后：way 1 现在最大，它是这一组中最近使用的行。下一页看缺失时调用哪些函数。

['cache-funcs-miss.title']
src_hash = 'd68f290e'
text = 'Functions Called on a Miss'
# src: 缺失时调用的函数

['cache-funcs-miss.slide.1']
src_hash = 'f75939db'
text = 'On a miss `cache_victim` selects the way to replace and `cache_fill` reads in one line with `dram_line_read`.'
# src:
# 
# 缺失时 `cache_victim` 选出被替换的路，`cache_fill` 用 `dram_line_read` 读入一行。

['cache-funcs-miss.notes.1']
src_hash = '57dfa3e4'
text = '''
On a miss cache_lookup returns NULL. cache_access adds 1 to cache_misses and calls cache_victim to select the way to replace in this set: a way whose valid is 0 if there is one, otherwise the way with the smallest last_use, the way accessed longest ago.
cache_fill computes the address of the line in memory from the new tag and the set index with cache_line_address, calls dram_line_read to read in the 64 bytes, then sets valid to 1, dirty to 0 and tag to the new tag. The remaining steps are those of a hit: cache_access updates last_use and returns the line, and cache_read copies from it.
In the figure the way to replace is invalid or was never written, so cache_fill overwrites it directly and dram_line_write is grey. This line access reads or writes memory once.
The next page shows the path when the line to replace is dirty.
'''
# src:
# 
# 缺失时 cache_lookup 返回 NULL。cache_access 把 cache_misses 加 1，调用 cache_victim 在这一组中选出被替换的路：有 valid 为 0 的路时选它，否则选 last_use 最小的一路，即最久没有访问的一路。
# cache_fill 用 cache_line_address 由新的 tag 与组号求出这一行在内存中的地址，调用 dram_line_read 读入 64 字节，再把 valid 设为 1、dirty 设为 0、tag 设为新的 tag。之后的步骤与命中相同：cache_access 更新 last_use 并返回这一行，cache_read 从中复制。
# 图中被替换的路无效或没有被写过，cache_fill 直接覆盖它，dram_line_write 是灰色的。这一次行访问读写一次内存。

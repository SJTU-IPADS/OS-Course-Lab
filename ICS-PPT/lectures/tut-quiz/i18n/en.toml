['q4-rob.slide.1']
src_hash = '2b9286c2'
text = 'An out-of-order processor lets instructions whose operands are ready execute first, but the results of instructions must be written to registers one by one in the original program order. For this purpose, the processor has an internal **reorder buffer** (ROB). The ROB has a fixed number of entries. Each entry holds one decoded instruction and records the instruction, its destination register, its result and its status. There are three execution states in total: not executed, executing, and completed. The figure below shows the contents of a ROB with 4 entries at one moment.'
# src: 乱序执行的处理器让操作数就绪的指令先执行，但指令的结果必须按程序原顺序依次写入寄存器。为此，处理器在内部设置了一个**重排序缓冲区**（reorder buffer，ROB）。ROB 内部有固定数量的条目，每个条目保存一条已译码的指令，并记录这条指令、它的目的寄存器、执行结果和状态。执行状态一共有三种：未执行、正在执行、已完成。下图是一个有 4 个条目的 ROB 在某一时刻的内容。

['q4-rob-rules.title']
src_hash = 'd7937cae'
text = 'Problem 4 (2): Out-of-Order Execution and the Reorder Buffer (9 points)'
# src: 第 4 题（2）：乱序执行与重排序缓冲区（9 分）

['q4-rob-rules.slide.1']
src_hash = '3a447fc1'
text = 'The ROB has a fixed number of entries. Each entry holds one decoded instruction and records the instruction, its destination register, its result and its status. There are three execution states in total: not executed, executing, and completed.'
# src: ROB 内部有固定数量的条目，每个条目保存一条已译码的指令，并记录这条指令、它的目的寄存器、执行结果和状态。执行状态一共有三种：未执行、正在执行、已完成。

['q4-rob-rules.slide.2']
src_hash = '4d928a8e'
text = '''
The ROB works by the following rules:
- **Enter**: after decoding, instructions enter the ROB one by one in the original program order, each placed after all existing entries, with its status marked as not executed. At most 1 instruction enters per cycle. When the ROB has no free entry, an instruction must wait until an entry is free before it can enter.
- **Execute**: an instruction that has entered the ROB can start executing from the next cycle on, as soon as its operands are ready. If an instruction finishes executing in cycle t, an instruction that uses its result can start executing in cycle t + 1 at the earliest, and it obtains this result from the ROB.
- **Complete**: after an instruction finishes executing, it writes its result into its own entry and changes its status to completed, without modifying registers yet.
- **Commit**: commit starts from the frontmost entry in the ROB and proceeds in program order. When the frontmost entry is completed, its result is written to the register and the entry leaves the ROB. An instruction completed in cycle t commits in cycle t + 1 at the earliest. Also, an entry freed by a commit in cycle t can be used by a new instruction only from cycle t + 1 on.
'''
# src:
# ROB 按以下规则工作：
# - **进入**：指令译码后按程序原顺序依次进入 ROB，位置排在所有已有条目之后，状态标记为未执行。每个周期最多进入 1 条指令，当 ROB 没有空闲条目时，指令需要等到有空闲条目后才能够进入。
# - **执行**：进入 ROB 的指令从下一个周期起，只要操作数就绪就能够开始执行。一条指令在周期 t 执行完成，用到它的结果的指令最早在周期 t + 1 开始执行，这个结果从 ROB 中取得。
# - **完成**：指令执行完成后，把结果写入自己的条目，状态改为已完成，暂不修改寄存器。
# - **提交**：从 ROB 中顺序最靠前的条目开始，按程序顺序提交。最靠前的条目为已完成时，把结果写入寄存器，然后离开 ROB。在周期 t 完成的指令最早在周期 t + 1 提交，同时，在周期 t 因提交而空出的条目，从周期 t + 1 起才能被新的指令使用。


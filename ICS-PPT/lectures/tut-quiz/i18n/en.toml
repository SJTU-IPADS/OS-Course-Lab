['kv-reserve.highlight.1']
src_hash = 'db9913d9'
text = 'An invalidated session is recomputed from token 0 when it continues. Which session should be invalidated?'
# src: 被失效的会话继续时从第 0 个 token 起重新计算，选哪个会话失效？

['kv-reserve.notes.1']
src_hash = '9619510b'
text = '''
6 frames, with the same three sessions and this request of B, and the memory pool at the same scale. The top line gives the four steps of kv_reserve, whose order must not be changed: allocate only the missing blocks, reclaim reserved blocks first when too few are free, and invalidate other sessions only when that is not enough. The bar below the pool is the number of blocks needed at the end of this request, at the same scale.
The call is kv_reserve(cache, B, 37, 8). 37 is the number of tokens in the text of B, the 20 it had and the 17 of the new message, and 8 is the largest number of tokens to answer. Before this call the framework has marked B as most recently used with kv_open, so last_use of B is one more than the largest value 4, that is 5, larger than both 2 of A and 4 of C.
Frame 1: count the tokens that serve as input: the 37 of the text and the first 7 of the answer, 44 in total, while the eighth token of the answer is output only. B goes on using its 19 blocks, whose content stays valid, so only 25 more blocks have to be allocated.
Frame 2: 44 does not exceed the 96 blocks of the pool, so B fits by itself. 14 blocks are free, fewer than 25. At the end of this request the three sessions need A 42 + B 44 + C 21 = 107 blocks, 11 more than the 96 in the pool. The limit is really exceeded, and at least one session has to lose its cache.
Frame 3: first reclaim the reserved and unused blocks of all other sessions. These are the elements of a block table from element n_cached on that are within capacity, and reclaiming them loses no computed key or value. An answer that ends early with the end token leaves such blocks, for example blocks are reserved for an answer of at most 8 tokens and the model gives the end token after only 3. Here capacity equals n_cached for both A and C, so 0 blocks can be reclaimed. This step is skipped when enough blocks are free.
Frame 4: that is not enough, and only now is kv_victim(cache, B) called. The candidates are the sessions other than B that have blocks, A and C. Least recently used (lru) picks A, whose last_use is the smallest (2, against 4 for C).
Frame 5: kv_invalidate(A) calls kv_free block by block to free blocks 0–41, sets the elements of the block table to NULL and capacity and n_cached to 0, and keeps id and last_use. The free blocks go from 14 to 56, no fewer than 25, so invalidation stops here.
Frame 6: 25 calls of kv_alloc give blocks 0–24, which fill block[19] to block[43] of B in the order of the tokens. capacity becomes 44 and the function returns 1. The addresses and the content of blocks 42–60, which B already had, do not change. n_cached is still 19, and compute then writes the 25 tokens one by one. 65 blocks are in use.
kv_reserve has two early returns, both of which change nothing. First: capacity already holds all the tokens this request will cache, and it returns 1 at once. Second: the tokens to cache for this request exceed the blocks of the pool or the 512 elements of the block table, so they would not fit even with all other sessions invalidated. It returns 0, which means that the request cannot be served.
When the invalidated A receives a request again, its n_cached is 0 and all 42 tokens it had cached are recomputed. The choice of the session decides how much is recomputed later, and the next page compares the two policies.
'''
# src:
# 
# 共 6 帧，仍是三个会话与 B 的这次请求，内存池的比例不变。最上面是 kv_reserve 的四个步骤，顺序不能交换：只分配缺的块，空闲块不够时先收回预留，仍不够时才使其他会话失效。内存池下面的长条是这次请求结束时需要的块数，用同一比例画出。
# 调用是 kv_reserve(cache, B, 37, 8)。37 是 B 的文本 token 数，即原有的 20 个与新消息的 17 个，8 是最多回答的 token 数。框架在调用它之前已用 kv_open 把 B 记为最近使用，所以 B 的 last_use 是原来最大的 4 加 1，即 5，比 A 的 2 与 C 的 4 都大。
# 第 1 帧：数出会作为输入的 token：文本的 37 个与回答的前 7 个，共 44 个，回答的第 8 个只输出。B 已有的 19 块继续使用，内容也继续有效，所以只需再分配 25 块。
# 第 2 帧：44 不超过内存池的 96 块，B 单独放得下。空闲 14 块，少于 25 块。这次请求结束时三个会话共需要 A 42 + B 44 + C 21 = 107 块，比池中的 96 块多 11 块，是真正超出了上限，至少一个会话要失去它的缓存。
# 第 3 帧：先收回所有其他会话预留而未用的块。这样的块是块表中第 n_cached 项起、capacity 之内的项，收回它们不丢失任何算好的键与值。回答因结束符提前结束时，会留下这样的块，比如按最多回答 8 个 token 预留了块，模型只回答 3 个 token 就给出了结束符。这里 A、C 的 capacity 都等于 n_cached，可收回 0 块。空闲块足够时，这一步不进行。
# 第 4 帧：仍不够，才调用 kv_victim(cache, B)。候选是有块并且不是 B 的会话，即 A 与 C。最近最少使用（lru）选 last_use 最小的 A（2，C 是 4）。
# 第 5 帧：kv_invalidate(A) 逐块调用 kv_free 释放块 0–41，块表项置为 NULL，capacity 与 n_cached 归零，id 与 last_use 保留。空闲从 14 块变为 56 块，不少于 25 块，失效到此停止。
# 第 6 帧：调用 25 次 kv_alloc，得到块 0–24，按 token 的先后填入 B 的 block[19] 到 block[43]，capacity 变为 44，返回 1。B 原有的块 42–60 的地址与内容都不变。n_cached 仍是 19，这 25 个 token 随后由 compute 逐个写入。在用 65 块。
# kv_reserve 还有两种提前返回的情形，都不修改任何数据。第一种：capacity 已经容得下这次请求会缓存的全部 token，直接返回 1。第二种：这次请求要缓存的 token 数超过池的总块数或块表的 512 项，其他会话全部失效也放不下，返回 0，表示这次请求无法处理。
# 被失效的 A 再收到请求时 n_cached 为 0，它已缓存过的 42 个 token 全部要重新计算。选哪个会话失效决定了之后重新计算多少，下一页比较两种策略。


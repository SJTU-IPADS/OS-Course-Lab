['q2-canary.slide.2']
src_hash = 'f377825b'
text = 'Hint: `printf` supports `%n$p` to print argument n as a pointer (e.g., `%6$p` prints the 6th). On x86-64 Linux, arguments 6 and above are passed on the stack above the pushed return address.'
# src: 提示：`printf` 支持 `%n$p` 这种按位置打印参数的写法，表示以指针形式打印第 n 个参数，如 `%6$p` 打印第 6 个参数。而 x86-64 的 Linux 操作系统上，第 6 个及后面的参数通过栈传递，位置在调用对应函数时压入的返回地址上方。


['kv-sessions.notes.1']
src_hash = 'e78fbdc2'
text = '''
The left of the figure lists the 7 requests as they arrive. The number in the circle is the order of arrival, followed by the session and the message. A, B and C are three sessions, and the requests of one session form one conversation of several turns.
Each request has three steps. Step 1 appends the message, in the chat format of the model, to the existing text of the session. Step 2 computes the tokens of the text that are not yet in the KV Cache. Step 3 generates the answer token by token, taking the token with the highest score at each step, until the model gives the end token or the answer reaches 8 tokens.
The right of the figure shows the text of each session after all requests are answered, one token per cell, with the order of the request and its tokens of "message + answer" above the cells. Dark grey is messages, including the markers of the chat format, for example the tokens that mark the start and the end of what the user says. White is answers, and all 7 answers reached 8 tokens. For example, the first request of A has a message of 13 tokens and an answer of 8 tokens, two more requests of A are appended after it, and A ends with 68 tokens.
Every token of an answer passes through all 28 layers of the model. The next page shows which data a token uses in one layer.
'''

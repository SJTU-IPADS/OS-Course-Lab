['kv-policies.notes.1']
src_hash = 'ad414f01'
text = '''
The top gives the conditions common to the two policies. The start is a pool of 96 blocks in which A, B and C have cached 42, 19 and 21 tokens and 14 blocks are free. In the order of recent use A is the oldest, then B, and C is the most recent. Then three requests arrive, from B, A and C, each with at most 8 tokens of answer, which in fact all reach 8. The tokens that serve as input are the text and the first 7 of the answer: 37 + 7 = 44 for B, 60 + 7 = 67 for A and 36 + 7 = 43 for C, which are the most blocks each needs. The session that sends a request first becomes the most recently used, and only other sessions can be invalidated.
Each bar below is the memory pool at the end of one request, with each segment at the position of its blocks, a vertical line at the limit of 96 blocks, and a colored strip below each segment that shows its session. Above each bar, the left side gives the blocks this request lacks and the blocks free at its start, and the red text on the right gives the invalidated sessions. None of the three requests has reserved blocks to reclaim.
lru (least recently used): the request of B invalidates A (last_use 2, against 4 for C). When the request of A arrives, A has no blocks left and needs 67, with 31 free. The candidates are C and B, and C has been unused for longer, so C is invalidated first, which leaves 52 free, still too few, then B, which leaves 96 free. A recomputes 42 tokens and computes 25 new ones. The request of C needs 43 blocks with 29 free, the only candidate is A, and C recomputes 21. In total 4 invalidations and 63 tokens recomputed.
smallest (smallest cache first): for the request of B it picks C, the one with fewer cached tokens of A (42) and C (21), which leaves 35 blocks free, no fewer than the 25 it lacks. When the request of A arrives, A is still cached and lacks only 25 blocks with 10 free, and the only candidate is B. The request of C needs 43 blocks with 29 free, A is invalidated and C recomputes 21. In total 3 invalidations and 21 tokens recomputed. With equal n_cached, smallest picks the session with the smaller last_use.
For these three requests smallest recomputes one third of the tokens that lru does. The result depends on the requests that follow: if the session invalidated last continues once more, it has to recompute all its tokens, for example both policies invalidate A last, and A would recompute 67 tokens if it continued.
You need to implement both policies. lru is the common default of inference systems, and smallest always picks the session with the fewest cached tokens at the moment. The next page shows how recomputation affects the running time.
'''
# src:
# 
# 最上面是两种策略共同的条件。起点是 96 块中 A、B、C 分别缓存 42、19、21 个 token，空闲 14 块，按最近使用的先后，A 最久，其次是 B，最近的是 C。随后依次到来 B、A、C 的三次请求，每次最多回答 8 个 token，实际都是 8 个，会作为输入的是文本与回答的前 7 个：B 是 37 + 7 = 44，A 是 60 + 7 = 67，C 是 36 + 7 = 43，即各自最多需要的块数。发来请求的会话先成为最近使用的会话，被失效的只能是其他会话。
# 下面每一条是一次请求结束时的内存池，各段画在块的位置上，竖线是上限 96 块，段下方的色条表示属于哪个会话。每一条上方左边是这次请求缺几块、开始时空闲几块，右边红字是被失效的会话。这三次请求都没有可收回的预留。
# lru（最近最少使用）：B 的请求使 A 失效（last_use 2，C 是 4）。A 的请求到来时 A 已没有块，要 67 块，空闲 31 块。候选是 C 与 B，C 更久没有使用，先使 C 失效，空闲 52 块，仍不够，再使 B 失效，空闲 96 块。A 重新计算 42 个 token，再计算新的 25 个。C 的请求要 43 块，空闲 29 块，唯一的候选是 A，C 重新计算 21 个。共失效 4 次，重新计算 63 个 token。
# smallest（最小缓存优先）：B 的请求在 A（42）与 C（21）中选缓存最少的 C，空闲 35 块，不少于缺的 25 块。A 的请求到来时 A 仍在缓存中，只缺 25 块，空闲 10 块，唯一的候选是 B。C 的请求要 43 块，空闲 29 块，使 A 失效，C 重新计算 21 个。共失效 3 次，重新计算 21 个 token。n_cached 相同时，smallest 选 last_use 较小的会话。
# 对这三次请求，smallest 重新计算的 token 是 lru 的三分之一。结果取决于之后的请求：最后被失效的会话如果再继续一轮，还要重新计算它的全部 token，比如两种策略最后都使 A 失效，A 再继续时要重新计算 67 个。
# 两种策略你都需要实现。lru 是推理系统常用的默认策略，smallest 每次选择当前缓存最少的会话。下一页看重新计算对运行时间的影响。


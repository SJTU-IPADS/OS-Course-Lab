['cache-funcs.notes.1']
src_hash = '67aec272'
text = '''
The dark capsules are the ten functions you implement. The grey cache_init is already written, as an example of using cache_lines, cache_set_count and cache_way_count. The white boxes are functions of the framework.
The framework calls only four functions: frame/main.c calls cache_init and cache_flush, and frame/mem.c calls cache_read and cache_write.
cache_read and cache_write split one memory access by lines and call cache_access once for each line. cache_access is one line access, shared by reads and writes: it computes the set index and the tag with cache_set_index and cache_tag, and looks them up in this set with cache_lookup. On a miss it selects the way to replace with cache_victim, then writes back the dirty line and reads in the new line with cache_fill.
cache_fill and cache_flush both need to write a line back to its place in memory. A line stores only its tag, and cache_line_address computes the place from the tag and the set index. Only these two functions read or write memory. The red arrows lead to dram_line_read and dram_line_write, and each of their calls reads or writes one line, accessing the memory of the host.
The next page shows where the framework calls cache_read and cache_write.
'''
# src:
# 
# 深色的胶囊是你实现的十个函数，灰色的 cache_init 已经写出，作为使用 cache_lines、cache_set_count、cache_way_count 的例子。白框是框架的函数。
# 框架只调用四个函数：frame/main.c 调用 cache_init 与 cache_flush，frame/mem.c 调用 cache_read 与 cache_write。
# cache_read 与 cache_write 把一次访存按行拆开，每一行调用一次 cache_access。cache_access 是读与写共用的一次行访问：用 cache_set_index 与 cache_tag 求出组号与 tag，用 cache_lookup 在这一组中查找。缺失时用 cache_victim 选出被替换的路，再用 cache_fill 写回脏行、读入新行。
# cache_fill 与 cache_flush 都要把一行写回它在内存中的位置，行中只保存了 tag，位置由 cache_line_address 从 tag 与组号求出。只有这两个函数读写内存。红色的箭头通向 dram_line_read 与 dram_line_write，每一次调用读写一行，访问宿主的内存。
# 下一页看框架中哪里调用 cache_read 与 cache_write。


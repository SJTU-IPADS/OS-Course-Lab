['kv-memory.notes.1']
src_hash = '871442d6'
text = '''
The upper left is the current state. n_cached is the number of cached tokens, one block each. A larger last_use means more recent use: A has 2, B has 3 and C has 4, so A has been unused for the longest time. A is in blocks 0–41, B in blocks 42–60 and C in blocks 61–81.
Below is the memory pool, drawn to scale, one cell per block, and the bitmap has one bit per block. A block holds the key and the value of one token in all layers, for example the real model has 28 layers and rows of 1024 floats, so a block is 2 × 28 × 1024 × 4 bytes, that is 224 KiB. The three sessions occupy 82 blocks in total, and 14 are free.
The upper right is this request of B, one cell per token. B already has a text of 20 tokens. The first 19 are cached, and token number 20 is the last token of the previous answer, which was only output and has no key or value yet. The new message has 17 tokens, so the text grows to 37. The answer has at most 8 tokens: the first 7 also serve as input after they are generated, and the eighth is output only.
So the tokens that serve as input are the 37 of the text and the first 7 of the answer, 44 in total, each needing one block. B has 19 blocks and lacks 25, while only 14 are free. The next page follows step by step how kv_reserve handles this request of B.
'''
# src:
# 
# 左上是现在的状态。n_cached 是已缓存的 token 数，每个 token 占一块。last_use 越大表示越近使用：A 是 2，B 是 3，C 是 4，所以 A 最久没有使用。A 在块 0–41，B 在块 42–60，C 在块 61–81。
# 下面是内存池，按比例画出，一格是一块，位图中每块一位。一块保存一个 token 在全部层中的键与值，比如真实模型有 28 层，一行是 1024 个 float，一块就是 2 × 28 × 1024 × 4 字节，即 224 KiB。三个会话共占用 82 块，空闲 14 块。
# 右上是 B 的这次请求，一格是一个 token。B 已有 20 个 token 的文本，前 19 个已缓存，第 20 个是上一次回答的最后一个 token，它只被输出，还没有键与值。新消息是 17 个 token，文本增长到 37 个。回答最多 8 个 token，前 7 个生成之后还要作为输入，第 8 个只输出。

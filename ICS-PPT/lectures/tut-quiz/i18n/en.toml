['cache-walk.slide.1']
src_hash = 'caad1c13'
text = '''
In the framework only `walk` of [`frame/mem.c`](file:/labs/mini-cpu/frame/mem.c) calls `cache_read` and `cache_write`.

Three kinds of memory access call `walk`:

- instruction fetch: `fetch_bytes`;
- data reads and writes: `mem_read`, `mem_write`;
- system calls reading or writing a buffer of the program: `mem_read`, `mem_write`.
'''
# src:
# 
# 框架中只有 [`frame/mem.c`](file:/labs/mini-cpu/frame/mem.c) 的 `walk` 调用 `cache_read` 与 `cache_write`。
# 
# 调用 `walk` 的三种访存：
# 
# - 取指：`fetch_bytes`；
# - 读写数据：`mem_read`、`mem_write`；
# - 系统调用读写程序的缓冲区：`mem_read`、`mem_write`。

['cache-walk.notes.1']
src_hash = '9f85577c'
text = '''
walk is a static function of frame/mem.c, and the other files of the framework reach it through the three functions of mem.c.
Instruction fetch: before decoding an instruction, frame/x86.c calls fetch_bytes, which reads at most 15 bytes from pc. The acc of walk is MEM_FETCH.
Data reads and writes: load and store of frame/x86.c call mem_read and mem_write. Memory operands, push, pop, call and ret of the interpreter all go through load and store.
System calls: frame/sysbase.c reads the buffer of the program with mem_read when it handles write, and writes the result into the buffer of the program with mem_write when it handles fstat.
va is the address the program uses, the virtual address. walk handles the part within one page at a time: it first turns va into the physical address pa with mmu_translate, which in lab 2 is done by frame/pagemap.c of the framework. Two neighbouring virtual pages may lie far apart in physical memory, so each page is translated alone. cache_read and cache_write therefore receive one contiguous range of physical addresses, 1 to 4096 bytes long, which may cross a line boundary, and cache.c splits it by lines again.
With the cache turned off, the framework serves the reads and writes of walk by accessing memory line by line, calling none of the functions you implement.
When the framework loads a program, it writes into dram.img directly with dram_ptr, through neither walk nor the cache.
What follows starts from the division of an address and explains the functions of cache.c in the order of the file.
'''
# src:
# 
# walk 是 frame/mem.c 中的静态函数，框架的其他文件都经由 mem.c 的三个函数到达它。
# 取指：frame/x86.c 译码一条指令之前调用 fetch_bytes，读出 pc 起最多 15 个字节，walk 的 acc 是 MEM_FETCH。
# 读写数据：frame/x86.c 的 load 与 store 调用 mem_read 与 mem_write。解释器读写内存操作数、push、pop、call、ret 都经过 load 与 store。
# 系统调用：frame/sysbase.c 处理 write 时用 mem_read 读出程序的缓冲区，处理 fstat 时用 mem_write 把结果写入程序的缓冲区。
# va 是程序中使用的地址，即虚拟地址。walk 每次处理一页之内的部分，先用 mmu_translate 把 va 换成物理地址 pa，实验二中这一步由框架的 frame/pagemap.c 完成。两个相邻的虚拟页在物理内存中可以相距很远，所以每页单独换算。cache_read 与 cache_write 因此收到一段连续的物理地址，长度为 1 到 4096 字节，可能跨过行的边界，cache.c 要再按行拆开。
# 关闭缓存时，walk 的读写由框架逐行访问内存完成，不调用你实现的函数。
# 装载程序时框架用 dram_ptr 直接写入 dram.img，不经过 walk，也不经过缓存。
# 接下来从地址的划分开始，按文件中的顺序说明 cache.c 中的函数。


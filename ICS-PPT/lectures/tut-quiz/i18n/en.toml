['q4-pipe-hazard.title']
src_hash = 'fd744fb3'
text = 'Problem 4 (1): The Five-Stage Pipeline Model (11 points)'
# src: 第 4 题（1）：五级流水线模型（11 分）

['q4-pipe-hazard.slide.1']
src_hash = '50727e7f'
text = 'Consider executing the following loop on a five-stage pipelined CPU (fetch, decode, execute, memory, write-back). The loop body has 8 instructions. In one execution, the loop runs 3 times in total: `jl` is taken the first two times and not taken the third time. Assume that every instruction needs exactly 1 cycle in each stage, and that the hardware of each pipeline stage handles at most 1 instruction per cycle.'

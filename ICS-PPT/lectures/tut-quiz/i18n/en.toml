['kv-next.notes.1']
src_hash = '1d9b0b34'
text = '''
13 frames, with the same areas as the figures of the first request.
Frame 1 first gives the turn that session B runs between the two turns. The message of B is only b0. kv_open(cache, 1) creates session[1], and clock becomes 2. kv_reserve(cache, B, 1, 2) counts b0 and b1 as the inputs and gets blocks 4 and 5. Two calls of compute write their keys and values to these two blocks, and b2 is output only. The blocks and the block table of A do not change.
Frame 2: the next request of A arrives. append_message appends the new message t5 after t0 to t4, so n_prompt = 6, which includes the text of the earlier turns. The real chat format also has a marker that closes the previous answer before the message, which the example omits. t4 was output only in the previous turn and has no k4 or v4 yet.
Frame 3: kv_open(cache, 0) finds the original session[0] by id and returns it. clock becomes 3, last_use of A goes from 1 to 3, and the other fields stay. Three steps lead to the keys and values of the previous turn: id gives the entry of the session table, n_cached = 4 tells that the first 4 elements are valid, and block[0] to block[3] give blocks 0, 1, 2, 3.
Frame 4: kv_reserve(cache, A, 6, 2) counts tokens. The inputs are t0 to t5 and t6, the first token of the answer, and at most these 7 are cached at the end of the turn. t7 is output only and takes no block. A goes on using the 4 blocks it has and lacks only 3. kv_num_free() returns 6, which is enough.
Frame 5: kv_alloc is called 3 times. Blocks 4 and 5 belong to B, so the free blocks with the lowest numbers are 6, 7 and 8. Only these 3 bits of the bitmap change, and only block[4], block[5] and block[6] are filled. The 4 existing elements and the content of their blocks do not change. capacity goes from 4 to 7. From here on the blocks of A are not contiguous, and token 4 is in block 6.
Frame 6: pos = n_cached = 4, and computation goes on from t4. t4, output only in the previous turn, now serves as input, and compute first calls embed(t4, state).
Frame 7: layer 0. compute calls kv_key and kv_value once for each tok from 0 to 4, gets blocks 0, 1, 2, 3, 6 from the block table, adds 0 and 10, and collects the addresses in keys and values.
Frame 8: attention writes only k4 and v4, where the last elements point, then reads all 5 elements: softmax gives a0 to a4, and o4 = a0 v0 + … + a4 v4. The first 4 remain from the previous turn. The 5 rows are not adjacent in the pool, and attention reads and writes through the two pointer arrays, so the computation is unaffected.
Frame 9: layer 1 uses the same 5 blocks with 20 and 30 added: keys are blocks 0, 1, 2, 3, 6, each + 20, and values each + 30. Again only the last element is written and all 5 are read.
Frame 10: kv_append raises n_cached from 4 to 5. At this moment blocks 0, 1, 2, 3, 6 are valid, blocks 7 and 8 reserved, blocks 9, 10, 11 free.
Frame 11: t5 repeats the process, writes block 7, and n_cached becomes 6.
Frame 12: next_token outputs t6, the first token of the answer. It goes through compute as input, k6 and v6 are written to block 8, and n_cached becomes 7.
Frame 13: next_token outputs t7 and the turn ends. t7 is the last output and has not been an input yet, so the pool has no k7 or v7, which are computed when it serves as input in the next turn. The next request of A again finds these 7 blocks by id, n_cached and the block table, and goes on from t7.
What follows is the memory pool that all sessions share and its limit.
'''
# src:
# 
# 共 13 帧，各区域与第一次请求的图相同。
# 第 1 帧先交代两轮之间会话 B 的一轮。B 的消息只有 b0。kv_open(cache, 1) 新建 session[1]，clock 变为 2。kv_reserve(cache, B, 1, 2) 数出会作为输入的 b0、b1，分到块 4、5。两次 compute 把它们的键与值写入这两块，b2 只输出。A 的块与块表都不变。
# 第 2 帧：A 的下一次请求到来。append_message 把新消息 t5 接在 t0 到 t4 之后，n_prompt = 6：它包含之前各轮的文本。真实的对话格式在消息之前还有结束上一个回答的标记，例子中省略。t4 在上一轮只输出，还没有 k4、v4。
# 第 3 帧：kv_open(cache, 0) 按 id 找到原来的 session[0] 并返回它，clock 变为 3，A 的 last_use 从 1 变为 3，其他字段不变。上一轮的键与值经三步找到：由 id 找到会话表中的一项，由 n_cached = 4 知道前 4 项有效，由 block[0] 到 block[3] 找到块 0、1、2、3。
# 第 4 帧：kv_reserve(cache, A, 6, 2) 数 token。会作为输入的是 t0 到 t5 与回答的第一个 token t6，这一轮结束时最多缓存这 7 个。t7 只输出，不占块。A 已有的 4 块继续使用，只缺 3 块。kv_num_free() 返回 6，足够。
# 第 5 帧：kv_alloc 调用 3 次。块 4、5 属于 B，编号最小的空闲块是 6、7、8。位图只有这 3 位改变，块表只填 block[4]、block[5]、block[6]。原有 4 项与块中的内容都不变。capacity 从 4 变为 7。从这里起 A 的块不连续，token 4 在块 6。
# 第 6 帧：pos = n_cached = 4，计算从 t4 继续。上一轮只输出的 t4 现在作为输入，compute 先调用 embed(t4, state)。

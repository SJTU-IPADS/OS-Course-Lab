['cache-funcs-hit.slide.1']
src_hash = '6d021ce2'
text = 'On a hit `cache_lookup` finds the line and `cache_read` copies from it, without reading or writing memory.'
# src:
# 
# 命中时 `cache_lookup` 找到这一行，`cache_read` 从行中复制，不读写内存。

['cache-funcs-hit.notes.1']
src_hash = '7587278a'
text = '''
The figure is the call graph of the functions in cache.c, and it marks only the functions and arrows that one line access of cache_read calls on a hit. The rest is grey.
frame/mem.c calls cache_read, and cache_read calls cache_access for this line. cache_access computes the set index and the tag with cache_set_index and cache_tag, then looks them up in this set with cache_lookup, which finds the way whose valid is 1 and whose tag is equal. cache_access adds 1 to cache_hits, sets the last_use of the line to cache_use_clock after adding 1 to it, and returns the line. cache_read copies the requested bytes from the line.
The whole path reads and writes only the array cache_lines. It calls nothing in dram.c and does not read or write memory. cache_write takes the same path on a hit, copies in the other direction, and sets the dirty of the line to 1. Most line accesses take this path, for example when a program fills a 128 × 128 matrix of int (64 KiB) and then sums it by rows 8 times, 99.43% of its line accesses, instruction fetches included, hit in a 16 KiB cache of 64 sets and 4 ways each.
The next page walks through a hit step by step with one address.
'''
# src:
# 
# 图是 cache.c 中函数的调用关系，只突出 cache_read 的一次行访问命中时调用的函数与箭头，其余部分是灰色。
# frame/mem.c 调用 cache_read，cache_read 为这一行调用 cache_access。cache_access 用 cache_set_index 与 cache_tag 求出组号与 tag，再用 cache_lookup 在这一组中查找，找到 valid 为 1 且 tag 相等的一路。cache_access 把 cache_hits 加 1，把这一行的 last_use 设为 cache_use_clock 加 1 之后的值，返回这一行。cache_read 从行中复制要读的字节。
# 整条路径只读写数组 cache_lines，不调用 dram.c，不读写内存。cache_write 命中时的路径相同，复制的方向相反，并把这一行的 dirty 设为 1。绝大多数行访问走这条路径，比如一个程序给 128 × 128 的 int 矩阵（64 KiB）赋值，再按行求和 8 遍，在 64 组、每组 4 路的 16 KiB 缓存中，它的行访问（含取指）有 99.43% 命中。
# 下一页用一个地址逐步走一遍命中。

['cache-hit.title']
src_hash = '8c1650f8'
text = 'cache_access on a Hit'

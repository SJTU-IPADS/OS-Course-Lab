['q4-rob-branch.slide.1']
src_hash = 'fb17601c'
text = '''
The ROB works by the following rules:
- **Complete**: after an instruction finishes executing, it writes its result into its own entry and changes its status to completed, without modifying registers yet.
- **Commit**: commit starts from the frontmost entry in the ROB and proceeds in program order. When the frontmost entry is completed, its result is written to the register and the entry leaves the ROB. An instruction completed in cycle t commits in cycle t + 1 at the earliest. Also, an entry freed by a commit in cycle t can be used by a new instruction only from cycle t + 1 on.

To simplify the analysis, we make the following assumptions:

3. An instruction that writes memory also modifies memory only when it commits.
'''
# src:
# ROB 按以下规则工作：
# - **完成**：指令执行完成后，把结果写入自己的条目，状态改为已完成，暂不修改寄存器。
# - **提交**：从 ROB 中顺序最靠前的条目开始，按程序顺序提交。最靠前的条目为已完成时，把结果写入寄存器，然后离开 ROB。在周期 t 完成的指令最早在周期 t + 1 提交，同时，在周期 t 因提交而空出的条目，从周期 t + 1 起才能被新的指令使用。
# 
# 为了方便分析计算，我们有如下假设：
# 
# 3. 写内存的指令也在提交时才修改内存。


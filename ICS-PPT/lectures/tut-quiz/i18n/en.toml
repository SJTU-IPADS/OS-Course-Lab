# [`cache.c`](file:/labs/mini-cpu/src/lab2/cache.c) 读写内存只能调用 [`dram.c`](file:/labs/mini-cpu/frame/dram.c) 的 `dram_line_read` 与 `dram_line_write`。

['cache-path.notes.1']
src_hash = '34e6e699'
text = '''
In lab 2, cache_read and cache_write are replaced by the functions you implement in src/lab2/cache.c. The two files on the left are unchanged: the interpreter still calls mem.c, and mem.c still calls cache_read and cache_write. These receive a contiguous range of physical addresses, 1 to 4096 bytes long, which may cross a line boundary.
frame/main.c calls the other two functions: cache_init builds the cache and is already written, and cache_flush writes dirty lines back to memory.
The 64 × 4 lines of the cache are in the array cache_lines of cache.c, which is only about 22 KiB, and reading or writing it usually hits in the caches of the host CPU, as the dashed box in the figure shows.
The mapping on the right still exists, and the framework reads and writes it with dram_ptr when it loads a program. cache.c must not use dram_ptr, and the two arrows in the figure are crossed out.
cache.c can read and write memory only by calling dram_line_read and dram_line_write of frame/dram.c, and each call reads or writes one whole line of 64 bytes. Both functions copy the line within the mapping and take it out of the caches of the host CPU with the clflush instruction. dram_line_read takes it out first and then reads, so it reads the bytes in the memory of the host. dram_line_write writes first and then takes it out, so the bytes written reach the memory of the host. The two red paths in the figure are these two kinds of memory read and write, and each of them accesses physical memory.
With the cache turned off, every line an access touches reads or writes memory once. None of the functions you implement is called. What follows shows the functions of cache.c and where the framework calls them.
'''
# src:
# 
# 实验二中，cache_read 与 cache_write 换成 src/lab2/cache.c 中由你实现的函数。左边两个文件不变：解释器照样调用 mem.c，mem.c 照样调用 cache_read 与 cache_write，收到的是一段连续的物理地址，长度为 1 到 4096 字节，可能跨过行的边界。
# frame/main.c 调用另外两个函数：cache_init 建立缓存，已经写出，cache_flush 把脏行写回内存。
# 缓存的 64 × 4 行在 cache.c 的数组 cache_lines 中，这个数组只有约 22 KiB，读写它通常在宿主 CPU 的缓存中命中，图中的虚线框表示这一点。
# 右边的映射仍然存在，框架装载程序时用 dram_ptr 读写它。cache.c 不能使用 dram_ptr，图中这两个箭头打了叉。
# cache.c 读写内存只能调用 frame/dram.c 的 dram_line_read 与 dram_line_write，每次读写整整一行 64 字节。两个函数都在映射中复制这一行，并用 clflush 指令把这一行移出宿主 CPU 的缓存。dram_line_read 先移出再读，读到的是宿主内存中的字节。dram_line_write 先写再移出，写入的字节到达宿主的内存。图中红色的两条路径就是这两种内存读写，每一次都访问物理内存。
# 关闭缓存时，访存涉及的每一行都读写一次内存，不调用你实现的任何函数。接下来看 cache.c 中有哪些函数，框架从哪里调用它们。


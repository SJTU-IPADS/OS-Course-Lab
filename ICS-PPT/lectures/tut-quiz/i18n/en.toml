['kv-first.notes.1']
src_hash = '46fdd0be'
text = '''
16 frames. The top line gives the steps in which serve of the framework handles one turn, with the current step in an orange frame. The box below it gives the call with its arguments and the values computed and returned in this step. Below that are the tokens of session A, each directly above its element of the block table, then the session table and the memory pool. Orange is written or changed, green is read, and a dark outline marks an item located in this step, for example a row whose address is taken. The example draws one head, with d = 10. A line above the session table gives the two numbers of the turn: n_prompt is the number of tokens of the text, and max_answer is the largest number of tokens to generate.
Frame 1: the request arrives. append_message turns the message into t0, t1, t2, so n_prompt = 3. The session table is empty, all 12 blocks are free and the bitmap is all 0.
Frame 2: serve calls kv_open(cache, 0), which is given. No entry has id 0, so it creates session[0]: n_cached and capacity are 0, the block table is all NULL, and n_sessions becomes 1. clock becomes 1 and is recorded in last_use. The function returns the address of this entry, called A below.
Frame 3: the framework calls kv_reserve(cache, A, 3, 2), and the two numbers are n_prompt and max_answer: the text has 3 tokens and at most 2 are generated. kv_reserve first counts the tokens that go into the model as input in this turn, and each of them needs one block. In this example they are t0, t1, t2 of the message and t3, the first token of the answer, 4 in total. t3 has to go in as input to produce t4, the second token of the answer. The turn ends once t4 is generated. t4 is the last output and does not serve as input in this turn, so it needs no block. capacity is 0, so 4 blocks are missing, and kv_num_free() returns 12, which is enough.
Frame 4: kv_reserve calls kv_alloc 4 times. kv_alloc is a function of the framework: each call takes the free block with the lowest number, changes its bit from 0 to 1 and returns the address of the block. kv_reserve puts the addresses into block[0] to block[3] in order, capacity becomes 4, and it returns 1. n_cached is still 0, so all 4 blocks are reserved.
Frame 5: from token n_cached on, the framework calls compute, one token at a time. Like kv_open, compute is given. It is a written-out example that you can read to understand how one token is computed: it calls kv_key, kv_value and kv_append, which you implement, and embed, attention and feed_forward of the framework. compute(cache, A, t0, state) uses n_cached = 0 at the call as pos and first calls embed(t0, state) to get the vector of t0.
Frame 6: layer 0. compute calls kv_key(cache, A, 0, 0) and kv_value(cache, A, 0, 0): block[0] gives block 0, to which 0 and 10 are added. The two addresses become element 0 of the pointer arrays keys and values. This step only computes addresses.
Frame 7: compute calls attention(0, 0, state, keys, values). attention computes k0 and v0, writes them to the two rows that keys[0] and values[0] point to, then reads the two rows to compute attention. There is only one token, so a0 = 1 and o0 = a0 v0. o0 is added to state, which feed_forward then updates.
Frame 8: layer 1 is the same. The lookup again gives block 0, and the offsets become 20 and 30. The keys and values of a token in all layers are in its one block.
Frame 9: after both layers compute calls kv_append(A) once, n_cached goes from 0 to 1, and block 0 changes from reserved to valid. kv_append modifies only this field. When compute returns, state is the vector of t0 after the last layer.
Frame 10: t1, pos = 1. Layer 0 collects two elements: keys are block 0 + 0 and block 1 + 0, values are block 0 + 10 and block 1 + 10. attention first writes k1 and v1 to block 1, where the last element points.
Frame 11: attention reads both elements. attn_scores computes q1·k0 and q1·k1 divided by √d, and softmax gives a0 and a1. attn_values computes o1 = a0 v0 + a1 v1, the case pos = 1 of the attention formula. k0 and v0 come directly from block 0.
Frame 12: layer 1 is the same, with offsets 20 and 30. After both layers kv_append sets n_cached to 2.
Frame 13: t2 repeats the process: each layer collects 3 elements, writes block 2 and reads blocks 0, 1, 2, and finally n_cached becomes 3. The whole message is computed.
Frame 14: next_token selects t3, the first token of the answer, from the state of t2 after the last layer. t3 is an output of the model and has no k3 or v3 yet: block 3, where block[3] points, is still reserved. k3 and v3 exist only after t3 goes through the model once more as input.
Frame 15: the framework calls compute for t3, k3 and v3 are written to block 3, n_cached becomes 4, and all reserved blocks are now valid.
Frame 16: next_token outputs t4, the answer reaches 2 tokens and the turn ends. The text has 5 tokens and n_cached is 4: t4 is the last output and has not been an input yet, so the pool has no k4 or v4 and block[4] is NULL. Its key and value are computed when t4 serves as input in the next turn.
At every call of compute, pos equals n_cached and is less than capacity: kv_reserve has already given a block to every token that serves as input in this turn.
The next page shows how the next request of the same session finds these 4 blocks.
'''
# src:
# 
# 共 16 帧。最上面一行是框架的 serve 处理一轮对话的步骤，有橙色框的是当前一步。下面的框是这一步的调用与实参、算出和返回的值。再下面是会话 A 的 token，每个 token 在它的块表项正上方，然后是会话表与内存池。橙色是写入或改变，绿色是读取，深色框是本步定位的项，比如取得地址的一行。例子中只画一个头，d = 10。会话表上方一行给出这一轮的两个数：n_prompt 是文本的 token 数，max_answer 是最多生成的 token 数。
# 第 1 帧：请求到来。append_message 把消息转换为 t0、t1、t2，n_prompt = 3。会话表为空，12 块都空闲，位图全为 0。
# 第 2 帧：serve 调用 kv_open(cache, 0)，这个函数已经给出。表中没有 id 为 0 的项，所以新建 session[0]：n_cached 与 capacity 为 0，块表全为 NULL，n_sessions 变为 1。clock 变为 1，记入 last_use。函数返回这一项的地址，以下记为 A。
# 第 3 帧：框架调用 kv_reserve(cache, A, 3, 2)，两个数是 n_prompt 与 max_answer：文本有 3 个 token，最多生成 2 个。kv_reserve 要先数出这一轮有多少个 token 会作为输入经过模型，每个这样的 token 要一块。在这个例子中它们是消息的 t0、t1、t2 与回答的第一个 token t3，共 4 个。t3 要作为输入，才能得到回答的第二个 token t4。t4 生成之后本轮就结束，它是最后一个输出，在本轮中没有作为输入，所以不需要块。capacity 是 0，缺 4 块，kv_num_free() 返回 12，足够。
# 第 4 帧：kv_reserve 调用 4 次 kv_alloc。kv_alloc 是框架的函数，每次取编号最小的空闲块，把它的位从 0 改为 1，返回块的地址。kv_reserve 把地址依次填入 block[0] 到 block[3]，capacity 变为 4，返回 1。n_cached 仍是 0，这 4 块都是预留。
# 第 5 帧：框架从第 n_cached 个 token 起，逐个调用 compute。compute 与 kv_open 一样已经给出，它是一个写好的例子，你可以读它来理解一个 token 的计算流程：它调用由你实现的 kv_key、kv_value 与 kv_append，以及框架的 embed、attention 与 feed_forward。compute(cache, A, t0, state) 把调用时的 n_cached = 0 作为 pos，先调用 embed(t0, state)，得到 t0 的向量。
# 第 6 帧：第 0 层。compute 调用 kv_key(cache, A, 0, 0) 与 kv_value(cache, A, 0, 0)：查 block[0] 得到块 0，分别加 0 与 10。两个地址收进 keys、values 两个指针数组的第 0 项。这一步只计算地址。
# 第 7 帧：compute 调用 attention(0, 0, state, keys, values)。attention 算出 k0、v0，写入 keys[0] 与 values[0] 指向的两行，再读这两行计算注意力。只有一个 token，所以 a0 = 1，o0 = a0 v0。o0 加到 state 上，feed_forward 再更新 state。
# 第 8 帧：第 1 层同样，查到的仍是块 0，偏移换成 20 与 30。一个 token 在全部层中的键与值都在它的一块中。
# 第 9 帧：两层都完成之后，compute 调用一次 kv_append(A)，n_cached 从 0 变为 1，块 0 从预留变为有效。kv_append 只修改这一个字段。compute 返回时，state 是 t0 经过最后一层之后的向量。
# 第 10 帧：t1，pos = 1。第 0 层收集两项：keys 是块 0 + 0 与块 1 + 0，values 是块 0 + 10 与块 1 + 10。attention 先把 k1、v1 写入最后一项指向的块 1。
# 第 11 帧：attention 读两项。attn_scores 计算 q1·k0 与 q1·k1，除以 √d，softmax 得到 a0、a1。attn_values 计算 o1 = a0 v0 + a1 v1，与注意力公式中 pos = 1 的情况相同。k0、v0 直接取自块 0。
# 第 12 帧：第 1 层同样，偏移是 20 与 30。两层完成后 kv_append 把 n_cached 变为 2。
# 第 13 帧：t2 重复同样的过程：每层收集 3 项，写块 2，读块 0、1、2，最后 n_cached 变为 3。消息已全部计算。
# 第 14 帧：next_token 由 t2 最后一层之后的 state 选出回答的第一个 token t3。t3 是模型的输出，这时还没有 k3、v3：block[3] 指向的块 3 仍是预留。t3 作为输入再经过一次模型，才有 k3、v3。
# 第 15 帧：框架对 t3 调用 compute，k3、v3 写入块 3，n_cached 变为 4，预留的块都已有效。
# 第 16 帧：next_token 输出 t4，回答达到 2 个 token，本轮结束。文本有 5 个 token，n_cached 是 4：t4 是最后一个输出，还没有作为输入，所以池中没有 k4、v4，block[4] 是 NULL。t4 在下一轮作为输入时，才算出它的键与值。
# 每次调用 compute 时，pos 都等于 n_cached，并且小于 capacity：kv_reserve 已经为这一轮会作为输入的每个 token 分到了一块。
# 下一页看同一个会话的下一次请求怎样找到这 4 块。


text = '''
Without a KV Cache, every step recomputes the keys and values of all earlier tokens.
The KV Cache keeps them in memory, and every step computes only one row.
'''
# src:
# 
# 不使用 KV Cache 时，每一步重新计算之前全部 token 的键与值。
# KV Cache 把它们保存在内存中，每一步只计算一行。

['kv-reuse.notes.1']
src_hash = '8942fccf'
text = '''
2 frames. In the figure the column numbered j is token j, and the two cells for key and value in this column are its row j of keys and row j of values in this layer. The orange column is the new token being computed, token pos.
Frame 1 uses no KV Cache. The program saves the input vector of every token in every layer. At every step, in every layer, it recomputes the keys and values of tokens 0 to pos−1 from these vectors, and only then computes the attention of the new token. Red marks these repeated computations. At step pos each layer recomputes pos rows, so the longer the session, the more each step recomputes.
Frame 2 is the KV Cache. The blue dashed box is what the KV Cache keeps for this session: the keys and values of the earlier tokens in this layer. The box shows only which rows exist. The attention computation writes the key and value of the new token to row pos and then reads rows 0 to pos, where green marks the earlier rows, read directly. After all 28 layers are written, this token enters the cache, and every later step reads its rows directly.
In both approaches each token goes through the same operations in the same order: a row in the cache is exactly the key or the value obtained when this token was first computed. So the answers of the two approaches are identical byte for byte, which is also the criterion of a correct KV Cache.
What follows first shows how these keys and values are kept in memory, then how a request writes and reads them.
'''
# src:
# 
# 共 2 帧，图中编号为 j 的一列是第 j 个 token，这一列中键与值的两格是它在这一层的第 j 行键与第 j 行值。橙色的一列是正在计算的新 token，即第 pos 个。
# 第 1 帧不使用 KV Cache。程序保存每个 token 在每一层的输入向量，每一步在每一层由它们重新计算第 0 到 pos−1 个 token 的键与值，然后才做新 token 的注意力。红色是这些重复的计算。第 pos 步每层重新计算 pos 行，会话越长，每一步重新计算得越多。
# 第 2 帧是 KV Cache。蓝色虚线框是这个会话在 KV Cache 中保存的、之前 token 在这一层的键与值，框中只表示有哪些行。注意力计算把新 token 的键与值写入第 pos 行，再读取第 0 到 pos 行，绿色是直接读取的之前各行。28 层都写完之后，这个 token 进入缓存，之后的每一步都直接读取它的行。
# 两种做法中每个 token 经过相同的运算，次序也相同：缓存中的一行就是这个 token 第一次计算时得到的键或值。所以两种做法的回答逐字节相同，这也是 KV Cache 是否正确的判据。

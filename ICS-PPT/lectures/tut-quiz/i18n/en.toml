['q4-rob-answer.notes.1']
src_hash = '15729ed3'
text = '''
Each row is the ROB at the end of one cycle. From left to right are its entries in program order, the oldest entry on the left, and each cell is the number and the status of the instruction in that entry. An entry is not executed in the cycle it enters, executing from the cycle it starts, completed from the cycle it completes, and it leaves the ROB in the cycle it commits.

I1 commits in cycle 3. I2 and I3 read memory and take 4 cycles each: they complete in cycles 6 and 7 and commit in cycles 7 and 8. I4 needs the results of I2 and I3, so it starts only in cycle 8 and takes 3 cycles, completing in cycle 10. I6 does not depend on the instructions before it and completes in cycle 7, but it comes after I4, which has not completed, so it cannot commit.

At the end of cycles 7 and 8 there are only 4 entries: an entry freed by a commit in cycle t can be used from cycle t + 1 on. I2 commits in cycle 7, so I7 enters in cycle 8; I3 commits in cycle 8, so I8 enters in cycle 9.

The row of cycle 9 is the answer to question 1: I4 is executing, I5 is not executed, I6 and I7 are completed, and I8 is not executed.
'''
# src:
# 每一行是一个周期结束时的 ROB，从左到右是按程序顺序排列的条目，最靠前的条目在最左边，每格是条目中指令的编号与状态。条目在进入的周期为未执行，开始执行的周期起为正在执行，执行完成的周期起为已完成，提交的周期离开 ROB。
# 
# I1 在周期 3 提交，I2、I3 读内存各要 4 个周期，在周期 6、7 完成，周期 7、8 提交。I4 要用 I2、I3 的结果，周期 8 才开始执行，要 3 个周期，周期 10 完成。I6 与前面的指令无关，周期 7 完成，但排在未完成的 I4 之后，不能提交。
# 
# 周期 7、8 结束时只有 4 个条目：在周期 t 提交而空出的条目从周期 t + 1 起才能使用，I2 在周期 7 提交，I7 在周期 8 进入；I3 在周期 8 提交，I8 在周期 9 进入。
# 
# 周期 9 一行是第 1 问的答案：I4 正在执行，I5 未执行，I6、I7 已完成，I8 未执行。


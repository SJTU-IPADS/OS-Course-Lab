['kv-run-time.notes.1']
src_hash = 'e847bdc6'
text = '''
The top of the figure gives what is measured: sessions A, B and C send 7 requests in the order A A B C B A C to the real model of 28 layers, starting from an empty cache, with at most 8 tokens per answer, which in fact all reach 8. Below are four measurements, one run each, with the bars drawn by time and the tokens that pass through the model on the right. The answers of the four are identical byte for byte. The times vary with the hardware and the load.
The black numbers below each request are the tokens its session has cached after this request, the text and the first 7 tokens of the answer, one block each. The three sessions end with 67 + 44 + 43 = 154 cached tokens in total. With a pool of 182 blocks all sessions fit and nothing is invalidated: each of the 154 tokens passes through the model once, in 181.9 seconds, and the two policies are the same here.
With only 96 blocks, kv_reserve has to invalidate sessions. Least recently used passes 63 more tokens through the model, 217 in total, in 272.7 seconds. Smallest cache first passes 21 more, 175 in total, in 220.2 seconds. Each token that passes through the model is multiplied by all weights of the 28 layers, so with a KV Cache the time is decided mainly by the number of tokens that pass through the model.
Without a KV Cache only 154 tokens pass through the model as well, but at every step every layer recomputes the keys and values of all earlier tokens. The red numbers are the recomputations of each request, where one is one row of keys and one row of values of one earlier token in each of the 28 layers, for example the 20 tokens of the first request recompute 0, 1, ..., 19 earlier tokens in turn, 190 times in total. The longer a session, the more each step recomputes: the 7 requests recompute 4060 times in total and take 616.8 seconds.
This approach saves the input of every layer for the recomputation. The input of a token at one layer has 2048 numbers, as many as its row of keys and its row of values at this layer, so saving the inputs of a token takes as much memory as caching its keys and values.
'''
# src:
# 
# 图的最上面是测量的内容：A、B、C 三个会话按 A A B C B A C 的先后发来 7 次请求，模型是 28 层的真实模型，缓存从空开始，每次最多回答 8 个 token，实际都是 8 个。下面是四次测量，各运行一次，条的长度按时间画出，右边是经过模型的 token 数。四次的回答逐字节相同。时间随硬件与负载而异。
# 每次请求下面的黑字是这次请求之后该会话缓存的 token 数，即文本与回答的前 7 个，每个 token 占一块。三个会话最后共缓存 67 + 44 + 43 = 154 个 token。内存池有 182 块时全部会话都放得下，没有失效，154 个 token 各经过模型一次，用时 181.9 秒，两种策略在这时相同。
# 内存池只有 96 块时，kv_reserve 要使会话失效。最近最少使用多经过模型 63 个 token，共 217 个，用时 272.7 秒。最小缓存优先多 21 个，共 175 个，用时 220.2 秒。每个 token 经过模型时要与 28 层的全部权重相乘，所以使用 KV Cache 时，时间主要由经过模型的 token 数决定。
# 不使用 KV Cache 时也只有 154 个 token 经过模型，但每一步在每一层重新计算之前全部 token 的键与值。红字是每次请求重新计算的次数，一次指一个之前的 token 在 28 层中各算一行键与一行值，比如第一次请求的 20 个 token 依次重新计算 0、1、……、19 个之前的 token，共 190 次。会话越长，每一步重新计算得越多，7 次请求共 4060 次，用时 616.8 秒。
# 这种做法为重新计算保存各层的输入。一个 token 在一层的输入有 2048 个数，与它在这一层的一行键加一行值一样多，所以保存一个 token 的输入与缓存它的键和值占用同样多的内存。

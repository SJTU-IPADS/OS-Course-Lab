['cache-funcs-evict.title']
src_hash = 'cf378ca6'
text = 'Functions Called When a Dirty Line Is Replaced'
# src: 替换脏行时调用的函数

['cache-funcs-evict.slide.1']
src_hash = '00640a1c'
text = 'When the line to replace is dirty, `cache_fill` first writes it back with `dram_line_write`, then reads in the new line.'
# src:
# 
# 被替换的行是脏行时，`cache_fill` 先用 `dram_line_write` 写回它，再读入新行。

['cache-funcs-evict.notes.1']
src_hash = 'e59998f7'
text = '''
After cache_write writes a line, its dirty is 1 and the copy of the line in memory is older. When cache_victim selects such a line, its contents cannot be discarded.
cache_fill first computes the address of this line in memory from its own tag and the set index with cache_line_address, calls dram_line_write to write back the 64 bytes, and adds 1 to cache_writebacks. Then it follows the steps of a miss: it computes the address of the new line and reads it in with dram_line_read. The two addresses have the same set index and different tags.
In the figure cache_fill calls all three functions. This line access reads or writes memory twice, and it is the slowest of the three cases.
cache_flush on the left also calls dram_line_write. It writes back all dirty lines still in the cache, and it is not on the path of a line access.
The next page continues the example of the hit with another address and walks through a miss that writes back a dirty line step by step.
'''
# src:
# 
# 一行被 cache_write 写过之后 dirty 为 1，内存中这一行的内容较旧。这样的行被 cache_victim 选中时，它的内容不能直接丢弃。
# cache_fill 先用 cache_line_address 由这一行自己的 tag 与组号求出它在内存中的地址，调用 dram_line_write 写回 64 字节，把 cache_writebacks 加 1，再按缺失的步骤求出新行的地址、调用 dram_line_read 读入。两个地址的组号相同，tag 不同。
# 图中 cache_fill 调用了全部三个函数。这一次行访问读写两次内存，是三种情况中最慢的一种。
# 图左的 cache_flush 也调用 dram_line_write，它把仍在缓存中的脏行全部写回，不在一次行访问的路径上。
# 下一页接着命中的例子读另一个地址，逐步走一遍缺失并写回脏行。

['cache-miss.title']
src_hash = 'b00f54e3'
text = 'cache_access on a Miss'
# src: 缺失时的 cache_access

['cache-miss.slide.1']
src_hash = '860d568b'
text = 'Next, read `0x13345`: its set index is also 13, its tag is 0x13, and set 13 does not hold this line.'
# src:
# 
# 接着读 `0x13345`：组号同为 13，tag 为 0x13，组 13 中没有这一行。

['cache-miss.notes.1']
src_hash = '81583e49'
text = '''
Step 1: cache_lookup(13, 0x13) compares the four ways. No way has tag 0x13, so it returns NULL. cache_access adds 1 to cache_misses.
Step 2: cache_victim(13) selects the way to replace. When the set has invalid ways, it selects the invalid way with the smallest number. When all four ways are valid, it selects the way with the smallest last_use, that is, the least recently used line. Here last_use is 41, 60, 50 and 33, so it selects way 3. cache_victim only selects and changes no counter.
Step 3: cache_fill handles the miss. Way 3 is dirty and its contents are newer than memory, so it is first written back with dram_line_write. The line holds only tag 0x2a, and its address is computed by cache_line_address(0x2a, 13): (0x2a × 64 + 13) × 64 = 0x2a340. cache_writebacks grows by 1. This is one memory read or write. A replaced line that is not dirty is discarded directly, without a write-back.
Step 4: cache_fill reads in the whole line from cache_line_address(0x13, 13) = 0x13340 with dram_line_read, then sets valid = 1, dirty = 0 and tag = 0x13. This is the second memory read or write.
Step 5: back in cache_access, cache_use_clock grows by 1 to 61, which is written into last_use of way 3, and way 3 is returned. cache_read copies from data[5] on. This line access read or wrote memory twice in total.
Both accesses are 4 bytes, each within one line. The next page shows an access that crosses a line boundary.
'''
# src:
# 
# 第 1 步：cache_lookup(13, 0x13) 比较四路，没有一路的 tag 是 0x13，返回 NULL。cache_access 给 cache_misses 加 1。
# 第 2 步：cache_victim(13) 选出被替换的路。组中有无效的路时选编号最小的无效路。四路都有效时选 last_use 最小的一路，即最近最少使用的行。这里 last_use 为 41、60、50、33，选 way 3。cache_victim 只负责选择，不改计数器。
# 第 3 步：cache_fill 处理缺失。way 3 是脏行，它的内容比内存新，先用 dram_line_write 写回。行中只有 tag 0x2a，地址由 cache_line_address(0x2a, 13) 求出：(0x2a × 64 + 13) × 64 = 0x2a340。cache_writebacks 加 1，这是一次内存读写。被替换的行不脏时直接丢弃，不写回。
# 第 4 步：cache_fill 用 dram_line_read 从 cache_line_address(0x13, 13) = 0x13340 读入整行，再置 valid = 1、dirty = 0、tag = 0x13。这是第二次内存读写。
# 第 5 步：回到 cache_access，cache_use_clock 加 1 变为 61，写入 way 3 的 last_use，返回 way 3。cache_read 从 data[5] 起复制。这次行访问共读写两次内存。
# 两次都是 4 个字节，都在一行之内。下一页看一次访存跨过行边界的情况。

['cache-span.title']
src_hash = 'acf01014'
text = 'An Access Across Two Lines'
# src: 跨两行的访问

['cache-span.slide.1']
src_hash = '4fb3db32'
text = '''
- Each round handles one line: `offset = pa % 64`, and the copy is the smaller of 64 − `offset` and the number of bytes remaining;
- when `cache_write` misses, `cache_access` first reads in the whole line (write-allocate), then changes its bytes and sets `dirty`, without writing memory (write-back).
'''
# src:
# 
# - 每一轮处理一行：`offset = pa % 64`，复制 64 − `offset` 与剩余字节数中较小的一个；
# - `cache_write` 缺失时，`cache_access` 先读入整行（写分配），再改其中的字节、置 `dirty`，不写内存（写回）。

['cache-span.notes.1']
src_hash = 'aef777be'
text = '''
What mem.c passes to cache_read and cache_write is a contiguous range of physical addresses, 1 to 4096 bytes long, which may cross a line boundary. An instruction fetch reads 15 bytes at a time, so accesses across two lines are frequent.
The example in the figure reads 8 bytes from 0x1237c. The offset is 60, and only 4 bytes remain in this line. Round 1 calls cache_access(0x1237c), finds line 0x12340 in set 13, and copies its last 4 bytes. In round 2, pa advances to 0x12380 with offset 0, and the call cache_access(0x12380) finds the next line in set 14, from which the first 4 bytes are copied.
Each round is one line access, so this read counts two hits or misses. This is also one of the reasons why there are more line accesses than instructions.
cache_write is the same loop with the copy in the opposite direction, and it sets dirty to 1 in both lines. A write changes only a few bytes of a line, and the other bytes must keep the values in memory, so on a write miss cache_access first reads in the whole line. This is write-allocate. The written contents stay in the cache and are written back to memory only when the line leaves the cache or at cache_flush.
When the program ends, dirty lines remain in the cache, and the framework calls cache_flush after the program ends to write them back.
'''
# src:
# 
# mem.c 交给 cache_read 与 cache_write 的是一段连续的物理地址，长度 1 到 4096 字节，可能跨过行的边界。取指一次读 15 个字节，跨两行的情况经常出现。
# 图中的例子从 0x1237c 读 8 个字节。行内偏移是 60，这一行只剩 4 个字节，第 1 轮调用 cache_access(0x1237c)，在组 13 中找到行 0x12340，复制最后 4 个字节。第 2 轮 pa 前进到 0x12380，行内偏移 0，调用 cache_access(0x12380)，在组 14 中找到下一行，复制前 4 个字节。
# 每一轮是一次行访问，所以这次读取计两次命中或缺失。这也是行访问次数多于指令数的原因之一。
# cache_write 是同一个循环，复制的方向相反，并把两行的 dirty 都置为 1。写只改行中的几个字节，其余字节必须保持内存中的值，所以写缺失时 cache_access 先读入整行，这就是写分配。写入的内容留在缓存中，行离开缓存或 cache_flush 时才写回内存。
# 程序结束时缓存中还有脏行，框架在程序结束后调用 cache_flush 把它们写回。


src_hash = 'e911fbc4'
text = '''
The KV Cache keeps one row of keys and one row of values for each session, each token and each layer. The example has 2 layers and 1 key-value head of length d = 10, so kv_dim = 10 and a row is 10 floats. The real model has 28 layers and 8 key-value heads of 128 numbers each, so a row is 1024 floats and a block is 224 KiB, with the same structure.
At the top is the session table, the array session[] in kv_cache, with one entry per session. id is the number of the session. n_cached is the number of tokens computed so far. capacity is the number of blocks the session has. last_use records how recently the session was used, and a larger value is more recent.
Each entry contains a block table, block, an array of 512 pointers: block[tok] is the address of the block of token tok. In the figure each element shows the number of the block it points to, and an arrow leads to that block. An element without a block is NULL.
Below is the memory pool. The program allocates the pool at one time and divides it into 12 blocks of equal size, and each block holds the key and the value of one token in all layers. The bitmap has one bit per block: 1 means the block is in use, 0 means it is free.
The figure shows this moment: A first received blocks 0, 1, 2, 3, then B received blocks 4 and 5, then A received blocks 6, 7, 8. Now A has computed t0 to t4, and t5 is not computed yet. So the blocks of A are not contiguous: block[4] points to block 6. The blocks of a session can lie anywhere in the pool, and only the block table gives their order.
All three states appear. The first 5 elements of A are valid, that is blocks 0, 1, 2, 3 and 6, which hold computed keys and values. The next 2 are reserved, blocks 7 and 8: their bits are already 1 and their content has no meaning yet. Blocks 9, 10 and 11 are free.
The lower right enlarges block 6: its 4 rows are the key of layer 0, the value of layer 0, the key of layer 1 and the value of layer 1, in this order, 10 floats each, 40 floats or 160 bytes in total. A block holds only floats. The session and the token that a block belongs to are recorded only in the block table, and the line below the pool is labeled from the block tables. The block tables and the bitmap do not count toward the memory limit.
The structures do not record the position of each row. The next page shows how to compute the address of a row.
'''
# src:
# 
# KV Cache 要为每个会话、每个 token、每一层保存一行键与一行值。例子中有 2 层、1 个键值头，这个头的长度 d = 10，所以 kv_dim = 10，一行是 10 个 float。真实模型有 28 层、8 个键值头，每头 128 个数，一行是 1024 个 float，一块是 224 KiB，结构相同。
# 最上面是会话表，即 kv_cache 中的数组 session[]，每一项对应一个会话。id 是会话的编号。n_cached 是已经算完的 token 数。capacity 是已经分到的块数。last_use 记录会话最近一次被使用的先后，越大越近。
# 每一项中有一张块表 block，它是有 512 项的指针数组：block[tok] 是第 tok 个 token 那一块的地址。图中各项写出它指向的块的编号，箭头指到这一块。没有分到块的项是 NULL。
# 下面是内存池。程序一次分配好内存池，把它分成等大的 12 块，每块放一个 token 在全部层中的键与值。位图每块一位，1 表示这一块在用，0 表示空闲。
# 图中是这样一个时刻：A 先分到块 0、1、2、3，随后 B 分到块 4、5，之后 A 又分到块 6、7、8，现在 A 算完了 t0 到 t4，t5 还没有算。所以 A 的块不连续：block[4] 指向块 6。一个会话的块可以在池中的任何位置，顺序只由块表决定。
# 三种状态都在图中。A 的前 5 项有效，即块 0、1、2、3、6，其中是算好的键与值。接下来的 2 项是预留，即块 7、8，位已经是 1，内容还没有意义。块 9、10、11 空闲。
# 右下放大块 6：4 行依次是第 0 层的键、第 0 层的值、第 1 层的键、第 1 层的值，每行 10 个 float，共 40 个 float、160 字节。块内只有 float。一块属于哪个会话的哪个 token 只记在块表中，池下方「属于」一行是按块表标出的。块表与位图不计入内存上限。
# 结构中没有记录每一行的位置，下一页看怎样算出一行的地址。


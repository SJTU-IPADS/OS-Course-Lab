src_hash = '5eef0e53'
text = '''
Finding a row takes four items: the session, the layer, K or V, and the token. The figure looks for the value of token 4 in layer 1 of session A, and the call is kv_value(cache, A, 1, 4).
Step 1 looks up the block table. block[4] of A gives the block of token 4, which is block 6 of the pool. The token number is 4 and the block number is 6. The position of a block comes only from the block table, for example token 2 also needs the lookup of block[2], which in this example is block 2.
Step 2 adds the offset within the block, counted in floats, as pointer arithmetic on float pointers in C is. Before layer 1 are the key row and the value row of layer 0, 1 × 2 × 10 = 20 floats. The value of this layer follows the key of this layer, which adds 10 more. So v4 starts at block[4] + 30 and is the 10 floats numbered 30 to 39 in the figure.
kv_key(cache, A, 1, 4) returns block[4] + 20 in the same block. The two functions only compute addresses and leave the blocks and the session table as they are. The offset depends only on the layer and on K or V, and is the same in all blocks.
kv_block_bytes(cache) is the length of one block: 2 layers × 2 rows × 10 floats × 4 bytes = 160 bytes. The memory pool is divided into blocks of this length.
The next page starts from an empty session table and shows how a request calls these functions and writes into the pool.
'''
# src:
# 
# 找一行需要四项：哪个会话、哪一层、K 或 V、第几个 token。图中要找会话 A 第 1 层 token 4 的值，调用是 kv_value(cache, A, 1, 4)。
# 第 1 步查块表。第 4 个 token 的块由 A 的 block[4] 给出，它是池中的块 6。token 编号是 4，块编号是 6，块的位置只能通过块表得到，比如 token 2 也要查 block[2]，它在这个例子中是块 2。
# 第 2 步加块内偏移，单位是 float，与 C 中 float 指针的加法一致。第 1 层之前有第 0 层的一行键与一行值，共 1 × 2 × 10 = 20 个 float。这一层的值又在这一层的键之后，再加 10 个。所以 v4 从 block[4] + 30 开始，是图中编号 30 到 39 的 10 个 float。
# kv_key(cache, A, 1, 4) 返回同一块中的 block[4] + 20。两个函数只计算地址，块中的内容与会话表都保持原样。偏移只取决于层与 K、V，在所有块中相同。
# kv_block_bytes(cache) 是一块的长度：2 层 × 2 行 × 10 个 float × 4 字节 = 160 字节。内存池按这个长度分成块。

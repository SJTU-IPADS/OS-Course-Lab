src_hash = '2523b7c3'
text = '''
1. (4 points) Among the following, ______ are software conventions and ______ are hardware conventions. (Fill in the option letters.)

   A.  The return value of a function is placed in `%rax`
   B.  The `pushq` instruction decreases `%rsp` by 8
   C.  The `add` instruction sets the flags in `rflags` according to the result
   D.  The first argument of a function is passed in `%rdi`
   E.  The `call` instruction pushes the return address onto the stack
   F.  `%r10` and `%r11` are caller-saved registers
'''
# src:
# 1. （4 分）以下 ______ 是软件约定，______ 是硬件约定。（填选项字母）
# 
#    A.  函数的返回值放在 `%rax` 中
#    B.  `pushq` 指令把 `%rsp` 减 8
#    C.  `add` 指令根据运算结果设置 `rflags` 中的标志位
#    D.  函数的第一个参数通过 `%rdi` 传递
#    E.  `call` 指令把返回地址压入栈
#    F.  `%r10`、`%r11` 是 caller-saved 寄存器


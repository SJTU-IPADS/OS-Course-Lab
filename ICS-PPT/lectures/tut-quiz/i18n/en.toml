['cache-split.slide.1']
src_hash = 'e27cfc17'
text = 'With 64 sets, the set index is bits 6 to 11 and the tag is bits 12 and above. Computing them with `%` and `/` holds for any number of sets, for example for a cache of 3 sets.'
# src:
# 
# 64 组时，组号是第 6 到 11 位，tag 是第 12 位及以上。用 `%` 与 `/` 计算，对任意组数都成立，比如 3 组的缓存。

['cache-split.notes.1']
src_hash = '63308b8c'
text = '''
A line has 64 bytes. The remainder of the address divided by 64 is the offset within the line, and the quotient is the line number, that is, which line of memory it is. The remainder of the line number divided by the number of sets is the set index, and the line can be placed only in this set. The quotient is the tag, which tells apart the different lines placed in the same set.
The example in the figure is pa = 0x12345, offset 5, line number 0x48d, set index 13, tag 0x12. When the number of sets is a power of 2, the remainders and quotients are bit fields of the address: with 64 sets the set index is bits 6 to 11 and the tag is bits 12 and above. Writing them with % and / holds for any number of sets, for example for a cache of 3 sets.
cache_set_index and cache_tag compute these two fields. The offset needs no function of its own: cache_read and cache_write compute it as pa % 64, which decides from which byte of the line the copy starts.
In the other direction, the address of the first byte of a line can be computed from its tag and set index: (0x12 × 64 + 13) × 64 = 0x12340, which is pa without its offset. A line stores only its tag, and writing back a dirty line requires its place in memory. cache_line_address computes this address, and both cache_fill and cache_flush use it.
The next page shows where in the cache the set selected by the set index lies.
'''
# src:
# 
# 一行 64 字节，地址除以 64 的余数是行内偏移，商是行号，即内存中的第几行。行号除以组数的余数是组号，这一行只能放在这一组中。商是 tag，区分放在同一组中的不同行。
# 图中的例子是 pa = 0x12345，行内偏移 5，行号 0x48d，组号 13，tag 0x12。组数是 2 的幂时，余数与商就是地址中的位段：64 组时组号是第 6 到 11 位，tag 是第 12 位及以上。% 与 / 的写法对任意组数成立，比如 3 组的缓存。
# cache_set_index 与 cache_tag 求出这两个字段。行内偏移不需要单独的函数，cache_read 与 cache_write 用 pa % 64 求出它，决定从行中的第几个字节开始复制。
# 反过来，由 tag 与组号可以求出行的第一个字节的地址：(0x12 × 64 + 13) × 64 = 0x12340，即 pa 去掉行内偏移。一行中只保存 tag，写回脏行时要知道它在内存中的位置，cache_line_address 求出这个地址，cache_fill 与 cache_flush 都用它。
# 下一页看组号选中的那一组在缓存中的位置。

['cache-grid.title']
src_hash = 'a37075cb'

src_hash = 'd1aa7edb'
text = 'In lab 1, [`nocache.c`](file:/labs/mini-cpu/frame/nocache.c) reads and writes the mapping directly with `dram_ptr`, and the hardware of the CPU caches the lines read and written by itself.'
# src:
# 
# 实验一的 [`nocache.c`](file:/labs/mini-cpu/frame/nocache.c) 用 `dram_ptr` 直接读写映射，读写过的行由 CPU 硬件自动缓存。

['cache-lab1.notes.1']
src_hash = 'c67dd175'
text = '''
The figure shows the files one memory access passes through, starting from the interpreter in the top left corner. The interpreter interp.c of lab 1 fetches instructions, reads data and writes data by calling fetch_bytes, mem_read and mem_write of frame/mem.c respectively. mem.c computes the physical address pa. It calls cache_read for instruction fetches and data reads, and cache_write for data writes.
In the machine of lab 1, cache_read and cache_write come from frame/nocache.c: they get a pointer to this address in the mapping with dram_ptr(pa), then copy the bytes to be read or written with memcpy. Like any memory access of the process, these reads and writes go through the caches of the host CPU: the hardware of the CPU keeps the lines read and written in the caches by itself, and the next access to them hits, with neither the program nor the operating system taking part. The dashed box in the figure is the caches of the host CPU, and the green cells in it are cached lines of the mapping.
The grey band is the mini-cpu process. The right of the figure is the physical memory of the guest, the 64 MiB file dram.img. When mini-cpu starts, it maps the file with mmap into the memory of the process, and the bytes of the mapping are the bytes of the file.
Lab 2 replaces the middle block with a cache, the dashed box then holds the lines of the cache, and the cache reads and writes memory past the caches of the host CPU. The next page shows the path of a memory access then.
'''
# src:
# 
# 图中是一次访存经过的文件，从左上角的解释器开始。实验一的解释器 interp.c 取指、读数据、写数据，分别调用 frame/mem.c 的 fetch_bytes、mem_read 与 mem_write。mem.c 求出物理地址 pa，取指与读数据调用 cache_read，写数据调用 cache_write。
# 实验一的机器中，cache_read 与 cache_write 来自 frame/nocache.c：它们用 dram_ptr(pa) 得到这个地址在映射中的指针，再用 memcpy 复制要读写的字节。这些读写与进程中的任何访存一样经过宿主 CPU 的缓存：读写过的行由 CPU 硬件自动保存在缓存中，再次访问时命中，程序与操作系统都不参与。图中的虚线框是宿主 CPU 的缓存，框中绿色的格子是映射中被缓存的行。
# 灰色的底是 mini-cpu 进程。图的右边是客户机的物理内存，即 64 MiB 的文件 dram.img，mini-cpu 启动时用 mmap 把它映射到进程的内存中，映射中的字节就是文件中的字节。
# 实验二把中间一块换成缓存，虚线框中换成缓存的行，缓存读写内存时绕过宿主 CPU 的缓存。下一页是这时访存的路径。


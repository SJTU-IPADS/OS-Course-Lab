name: GitHub Pages
on:
  push:
    branches:
      - 'main'
    paths:
      - "OS-Labs/Pages/**"
      - "OS-Labs/book.toml"
      - "OS-Labs/.markdownlint.json"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: OS-Labs/.markdownlint.json
          globs: OS-Labs/Pages/**/*.md

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mdbook and its preprocessors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir mdbook
          latest_tag() {
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/$1/releases/latest" | jq -er '.tag_name'
          }
          tag=$(latest_tag toolmanp/rs-mdbook-callouts)
          url="https://github.com/toolmanp/rs-mdbook-callouts/releases/download/${tag}/mdbook-callouts-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL $url | tar -xz --directory=./mdbook
          tag=v0.4.40
          url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL $url | tar -xz --directory=./mdbook
          tag=0.14.2
          url="https://github.com/badboy/mdbook-toc/releases/download/${tag}/mdbook-toc-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL $url | tar -xz --directory=./mdbook
          tag=v0.1.4
          url="https://github.com/badboy/mdbook-last-changed/releases/download/${tag}/mdbook-last-changed-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL $url | tar -xz --directory=./mdbook
          tag=$(latest_tag toolmanp/mdbook-mermaid)
          url="https://github.com/toolmanp/mdbook-mermaid/releases/download/${tag}/mdbook-mermaid-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL $url | tar -xz --directory=./mdbook
          echo `pwd`/mdbook >> $GITHUB_PATH
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Book
        working-directory: OS-Labs
        run: |
          mdbook-mermaid install ./
          mdbook build
          touch ./book/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "OS-Labs/book"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

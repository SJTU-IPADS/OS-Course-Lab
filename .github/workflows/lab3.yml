name: Lab3

on:
  push:
    branches:
      - 'main'
    paths:
      - OS-Labs/Lab3/**
      - .github/workflows/lab3.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ipads/oslab:24.09
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Build Lab3
        run: cd OS-Labs/Lab3 && make
